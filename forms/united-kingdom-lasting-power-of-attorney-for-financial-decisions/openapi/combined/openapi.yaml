components:
  schemas:
    Address:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        address_line_1:
          type: string
          description: First line of the postal address, typically house number or name and street.
        address_line_2:
          type: string
          description: Second line of the postal address, typically locality or village.
        address_line_3:
          type: string
          description: Third line of the postal address, typically town or city.
        postcode:
          type: string
          description: Postal code (UK postcode for GB addresses).
        country_as_iso_3166_1_alpha_2:
          type: string
          description: Country as ISO 3166-1 alpha-2 code; defaults to GB because LP1F is a UK instrument.
      required:
      - created_at
      - updated_at
      - address_line_1
      - address_line_2
      - address_line_3
      - postcode
      - country_as_iso_3166_1_alpha_2
      description: Address — postal address used by an LPA, normalised across persons and roles.
    LastingPowerOfAttorney:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        donor_person_id:
          type: string
          format: uuid
          description: Foreign key to the person table — the donor making the LPA (LP1F section 1).
        decision_mode:
          type: string
          enum:
          - single_attorney
          - jointly_and_severally
          - jointly
          - mixed
          - ''
          description: 'How the attorneys make decisions (LP1F section 3). One of: single_attorney, jointly_and_severally,
            jointly, mixed.'
        decision_mode_mixed_text:
          type: string
          description: 'When decision_mode is "mixed": free-text listing which decisions are joint and
            which are joint-and-several (continued on LPC sheet 2 if long).'
        when_attorneys_can_act:
          type: string
          enum:
          - as_soon_as_registered
          - only_when_no_capacity
          - ''
          description: 'When the attorneys may begin acting (LP1F section 5). One of: as_soon_as_registered,
            only_when_no_capacity.'
        preferences_text:
          type: string
          description: Donor preferences for the attorneys to consider (LP1F section 7); non-binding guidance.
        instructions_text:
          type: string
          description: Donor instructions the attorneys must follow (LP1F section 7); legally binding
            on the attorneys.
        legal_rights_acknowledged:
          type: boolean
          description: TRUE when the donor has read and acknowledged the legal-rights statement in LP1F
            section 8.
        opg_reference_number:
          type: string
          description: Office of the Public Guardian reference number issued on registration.
        opg_registration_date:
          type: string
          format: date
          description: Date the OPG registered the LPA (the date the LPA becomes legally usable).
        status:
          type: string
          enum:
          - draft
          - ready_for_signing
          - partially_signed
          - fully_signed
          - ready_for_registration
          - submitted
          - registered
          - rejected
          - ''
          description: 'Lifecycle status. One of: draft, ready_for_signing, partially_signed, fully_signed,
            ready_for_registration, submitted, registered, rejected.'
      required:
      - created_at
      - updated_at
      - donor_person_id
      - decision_mode
      - decision_mode_mixed_text
      - when_attorneys_can_act
      - preferences_text
      - instructions_text
      - legal_rights_acknowledged
      - opg_reference_number
      - status
      description: Lasting power of attorney — the top-level LP1F deed (one row per LPA), under the Mental
        Capacity Act 2005.
    LpaAttorney:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        lpa_id:
          type: string
          format: uuid
          description: Foreign key to the lasting_power_of_attorney table; cascades on delete.
        person_id:
          type: string
          format: uuid
          description: Foreign key to the person table — the appointed attorney.
        ordinal:
          type: integer
          format: int32
          description: Listing order on the LP1F deed (1, 2, 3, ...) so attorneys round-trip in the same
            order as they appear on the printed form.
      required:
      - created_at
      - updated_at
      - lpa_id
      - person_id
      - ordinal
      description: LPA attorney — join table linking persons appointed as original attorneys to an LPA
        (LP1F section 2).
    LpaCertificateProvider:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        lpa_id:
          type: string
          format: uuid
          description: Foreign key to the lasting_power_of_attorney table; UNIQUE so only one certificate
            provider per LPA; cascades on delete.
        person_id:
          type: string
          format: uuid
          description: Foreign key to the person table — the certificate provider.
        knows_donor_as:
          type: string
          enum:
          - friend
          - professional
          - ''
          description: 'How the certificate provider knows the donor. One of: friend (known personally
            for 2+ years), professional (relevant professional skill such as GP, solicitor).'
        is_over_eighteen:
          type: boolean
          description: TRUE when the certificate provider confirms they are aged 18 or over.
        read_lpa:
          type: boolean
          description: TRUE when the certificate provider confirms they have read the LPA.
        no_restrictions_on_acting:
          type: boolean
          description: TRUE when the certificate provider confirms no statutory disqualification applies
            (not an attorney, not related, not a care-home owner — LPA Regulations 2007 reg. 8).
        eligibility_confirmation_at:
          type: string
          format: date-time
          description: Timestamp when the certificate provider completed the eligibility confirmation
            checklist.
      required:
      - created_at
      - updated_at
      - lpa_id
      - person_id
      - knows_donor_as
      - is_over_eighteen
      - read_lpa
      - no_restrictions_on_acting
      description: LPA certificate provider — the single person who certifies the donor's capacity and
        lack of undue pressure (LP1F section 10).
    LpaContinuationSheet:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        lpa_id:
          type: string
          format: uuid
          description: Foreign key to the lasting_power_of_attorney table; cascades on delete.
        kind:
          type: string
          enum:
          - 1_additional_people
          - 2_additional_information
          - 3_donor_cannot_sign
          - 4_trust_corporation
          description: 'Which LPC sheet this is. One of: 1_additional_people (5+ attorneys / replacements
            / people-to-notify), 2_additional_information (overflow text for sections 3, 4, 7), 3_donor_cannot_sign,
            4_trust_corporation.'
        body_text:
          type: string
          description: Free-text body of the continuation sheet (the OPG validates that text on a continuation
            sheet round-trips to the deed).
        signed_on:
          type: string
          format: date
          description: Date the continuation sheet was signed (LPC sheets 3 and 4 require their own signature
            dates).
        ordinal:
          type: integer
          format: int32
          description: Position when an LPA carries more than one continuation sheet of the same kind
            (e.g. multiple sheet-2 overflow pages).
      required:
      - created_at
      - updated_at
      - lpa_id
      - kind
      - body_text
      - ordinal
      description: LPA continuation sheet — one row per LPC continuation sheet (LPC sheets 1, 2, 3, 4)
        attached to the LP1F deed.
    LpaPersonToNotify:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        lpa_id:
          type: string
          format: uuid
          description: Foreign key to the lasting_power_of_attorney table; cascades on delete.
        person_id:
          type: string
          format: uuid
          description: Foreign key to the person table — the person who will be notified.
        ordinal:
          type: integer
          format: int32
          description: Position on the LP1F deed, from 1 to 5; the statutory maximum is five (LP1F section
            6).
      required:
      - created_at
      - updated_at
      - lpa_id
      - person_id
      - ordinal
      description: LPA person to notify — up to five persons who receive an LP3 notice on registration
        (LP1F section 6).
    LpaPreferencesAndInstructions:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        lpa_id:
          type: string
          format: uuid
          description: Foreign key to the lasting_power_of_attorney table; UNIQUE so only one overflow
            row per LPA; cascades on delete.
        preferences_overflow_text:
          type: string
          description: Continuation of LP1F section 7 "preferences" text when the section-7 box overflows.
        instructions_overflow_text:
          type: string
          description: Continuation of LP1F section 7 "instructions" text when the section-7 box overflows.
        decisions_jointly_overflow_text:
          type: string
          description: Continuation of the LP1F section 3 "mixed" decision-mode description when the on-form
            box overflows.
        replacement_step_in_overflow_text:
          type: string
          description: Continuation of the LP1F section 4 "when and how" replacement-step-in description
            when the on-form box overflows.
      required:
      - created_at
      - updated_at
      - lpa_id
      - preferences_overflow_text
      - instructions_overflow_text
      - decisions_jointly_overflow_text
      - replacement_step_in_overflow_text
      description: LPA preferences and instructions — overflow text for LP1F sections 3, 4, 7 when the
        donor's text exceeds the on-form box (continued on LPC sheet 2).
    LpaRegistrationApplication:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        lpa_id:
          type: string
          format: uuid
          description: Foreign key to the lasting_power_of_attorney table; UNIQUE so only one registration
            block per LPA; cascades on delete.
        applicant_kind:
          type: string
          enum:
          - donor
          - attorneys
          - ''
          description: 'Who is applying to register the LPA. One of: donor, attorneys.'
        payment_method:
          type: string
          enum:
          - card
          - cheque
          - ''
          description: 'How the OPG fee is paid. One of: card, cheque.'
        card_payment_phone:
          type: string
          description: Phone number on which the OPG should contact the applicant to take a card payment
            (LP1F section 14).
        reduced_fee_requested:
          type: boolean
          description: TRUE if the applicant is asking for a reduced or remitted fee (requires LPA120A
            and supporting evidence).
        has_lpa120a_evidence:
          type: boolean
          description: TRUE if the LPA120A evidence is attached when a reduced fee is requested.
        is_repeat_application:
          type: boolean
          description: TRUE if this is a repeat application after a previous OPG rejection (entitles the
            applicant to a discounted second-attempt fee).
        repeat_case_number:
          type: string
          description: OPG case number of the previous (rejected) application when is_repeat_application
            is TRUE.
        payment_reference:
          type: string
          description: Reference number of the fee payment (card receipt or cheque number).
        payment_date:
          type: string
          format: date
          description: Date the fee was paid.
        payment_amount:
          type: number
          format: double
          description: Amount of the fee paid, in GBP (numeric to two decimal places).
      required:
      - created_at
      - updated_at
      - lpa_id
      - applicant_kind
      - payment_method
      - card_payment_phone
      - reduced_fee_requested
      - has_lpa120a_evidence
      - is_repeat_application
      - repeat_case_number
      - payment_reference
      description: LPA registration application — the registration block of LP1F (sections 12 and 14)
        submitted to the OPG.
    LpaRegistrationRecipient:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        lpa_id:
          type: string
          format: uuid
          description: Foreign key to the lasting_power_of_attorney table; UNIQUE so only one recipient
            block per LPA; cascades on delete.
        recipient_kind:
          type: string
          enum:
          - donor
          - attorney
          - other
          - ''
          description: 'Who receives the registered LPA. One of: donor, attorney, other.'
        recipient_person_id:
          type: string
          format: uuid
          description: Foreign key to the person table — the recipient when recipient_kind is donor, attorney,
            or a named other individual; nullable when the recipient is a company.
        company_name:
          type: string
          description: Company or organisation name when the recipient is not a natural person (e.g. solicitors'
            firm acting for the donor).
        prefers_post:
          type: boolean
          description: TRUE if the recipient prefers correspondence by post.
        prefers_phone:
          type: boolean
          description: TRUE if the recipient prefers correspondence by phone.
        prefers_email:
          type: boolean
          description: TRUE if the recipient prefers correspondence by email.
        prefers_welsh:
          type: boolean
          description: TRUE if the recipient prefers correspondence in Welsh (Welsh Language Act 1993).
        contact_phone:
          type: string
          description: Contact phone number used by the OPG to reach the recipient.
        contact_email:
          type: string
          description: Contact email address used by the OPG to reach the recipient.
        other_first_names:
          type: string
          description: First names of the "other" recipient when recipient_kind is "other" and the recipient
            is not represented by a person row (e.g. a one-off named contact at a solicitors' firm).
        other_last_name:
          type: string
          description: Last name of the "other" recipient when recipient_kind is "other".
        other_address_line_1:
          type: string
          description: Address line 1 of the "other" recipient when recipient_kind is "other".
        other_address_line_2:
          type: string
          description: Address line 2 of the "other" recipient when recipient_kind is "other".
        other_address_line_3:
          type: string
          description: Address line 3 of the "other" recipient when recipient_kind is "other".
        other_postcode:
          type: string
          description: Postcode of the "other" recipient when recipient_kind is "other".
      required:
      - created_at
      - updated_at
      - lpa_id
      - recipient_kind
      - company_name
      - prefers_post
      - prefers_phone
      - prefers_email
      - prefers_welsh
      - contact_phone
      - contact_email
      - other_first_names
      - other_last_name
      - other_address_line_1
      - other_address_line_2
      - other_address_line_3
      - other_postcode
      description: LPA registration recipient — who receives the registered LPA and how (LP1F section
        13).
    LpaReplacementAttorney:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        lpa_id:
          type: string
          format: uuid
          description: Foreign key to the lasting_power_of_attorney table; cascades on delete.
        person_id:
          type: string
          format: uuid
          description: Foreign key to the person table — the appointed replacement attorney.
        ordinal:
          type: integer
          format: int32
          description: Listing order on the LP1F deed.
        replacement_step_in_condition:
          type: string
          description: Optional override of when and how this replacement attorney steps in (LP1F section
            4 "when and how"); continued on LPC sheet 2 if long.
      required:
      - created_at
      - updated_at
      - lpa_id
      - person_id
      - ordinal
      - replacement_step_in_condition
      description: LPA replacement attorney — join table linking persons appointed as replacement attorneys
        to an LPA (LP1F section 4).
    LpaSignature:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        lpa_id:
          type: string
          format: uuid
          description: Foreign key to the lasting_power_of_attorney table; cascades on delete.
        signatory_person_id:
          type: string
          format: uuid
          description: Foreign key to the person table — the person who signed.
        role:
          type: string
          enum:
          - donor
          - certificate_provider
          - attorney
          - replacement_attorney
          - applicant
          - signing_on_behalf_of_donor
          - trust_corporation_authorised_person
          description: 'Role under which this signature was given. One of: donor, certificate_provider,
            attorney, replacement_attorney, applicant, signing_on_behalf_of_donor, trust_corporation_authorised_person.'
        lp1f_section:
          type: integer
          format: int32
          description: 'LP1F section in which this signature appears. One of: 9 (donor), 10 (certificate
            provider), 11 (attorneys and replacements), 15 (registration applicant).'
        signature_blob_path:
          type: string
          description: Server-side file reference to the stored signature image / blob.
        signed_on:
          type: string
          format: date
          description: Date on which the signature was given; used to enforce the LPA Regulations 2007
            reg. 9(6) signing order.
        signed_on_behalf_full_name:
          type: string
          description: Full name of the person who physically signed when role = signing_on_behalf_of_donor
            (donor cannot sign — requires LPC sheet 3).
        is_witnessed:
          type: boolean
          description: TRUE if this signature requires and has a corresponding lpa_witness row; FALSE
            for the certificate-provider signature which is not witnessed.
      required:
      - created_at
      - updated_at
      - lpa_id
      - signatory_person_id
      - role
      - lp1f_section
      - signature_blob_path
      - signed_on_behalf_full_name
      - is_witnessed
      description: LPA signature — one row per signing event on the LP1F deed or registration application;
        the audit trail for sections 9, 10, 11 and 15.
    LpaValidationFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        lpa_id:
          type: string
          format: uuid
          description: Foreign key to the lasting_power_of_attorney table; cascades on delete.
        flag_name:
          type: string
          description: Programmatic name of the fired flag (e.g. SingleAttorneyNoReplacement, ReducedFeeWithoutLPA120A).
        priority:
          type: string
          enum:
          - low
          - moderate
          - high
          description: 'Severity priority of the flag. One of: low, moderate, high (flags never reach
            critical).'
        category:
          type: string
          description: Free-text category grouping the flag belongs to (e.g. fee, witnesses, attorneys,
            instructions).
        remediation_hint:
          type: string
          description: User-facing hint explaining how to clear the flag.
        fired_at:
          type: string
          format: date-time
          description: Timestamp when this flag fired during validation.
      required:
      - created_at
      - updated_at
      - lpa_id
      - flag_name
      - priority
      - category
      - remediation_hint
      - fired_at
      description: LPA validation flag — non-blocking warning flags that fired during validation (e.g.
        SingleAttorneyNoReplacement, OnlyWhenNoCapacitySelected).
    LpaValidationResult:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        lpa_id:
          type: string
          format: uuid
          description: Foreign key to the lasting_power_of_attorney table; UNIQUE so only one validation
            result per LPA; cascades on delete.
        validity_band:
          type: string
          enum:
          - draft
          - ready_for_signing
          - partially_signed
          - fully_signed
          - ready_for_registration
          - submitted
          - registered
          - rejected
          description: 'Lifecycle band for registration readiness. One of: draft, ready_for_signing, partially_signed,
            fully_signed, ready_for_registration, submitted, registered, rejected.'
        composite_risk:
          type: string
          enum:
          - low
          - moderate
          - high
          - critical
          description: 'Overall risk grade computed by max-grade aggregation across fired rules and flags.
            One of: low, moderate, high, critical.'
        computed_at:
          type: string
          format: date-time
          description: Timestamp when this validation result was computed.
      required:
      - created_at
      - updated_at
      - lpa_id
      - validity_band
      - composite_risk
      - computed_at
      description: 'LPA validation result — the LPA validator output: registration-readiness band and
        composite-risk grade.'
    LpaValidationRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        lpa_id:
          type: string
          format: uuid
          description: Foreign key to the lasting_power_of_attorney table; cascades on delete.
        rule_name:
          type: string
          description: Programmatic name of the fired rule (e.g. DonorUnderEighteen, AttorneyBankruptOrDRO).
        priority:
          type: string
          enum:
          - low
          - moderate
          - high
          - critical
          description: 'Severity priority of the rule. One of: low, moderate, high, critical (statutory
            blockers are always critical).'
        statutory_citation:
          type: string
          description: Statutory citation for the rule (e.g. "MCA 2005 s. 9(2)(a)" for DonorUnderEighteen).
        remediation_hint:
          type: string
          description: User-facing hint explaining how to fix the LPA so this rule no longer fires.
        fired_at:
          type: string
          format: date-time
          description: Timestamp when this rule fired during validation.
      required:
      - created_at
      - updated_at
      - lpa_id
      - rule_name
      - priority
      - statutory_citation
      - remediation_hint
      - fired_at
      description: LPA validation rule — statutory blocker rules that fired during validation (e.g. DonorUnderEighteen,
        NoAttorneyAppointed).
    LpaWitness:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        signature_id:
          type: string
          format: uuid
          description: Foreign key to the lpa_signature table; UNIQUE so each signature has at most one
            witness row; cascades on delete.
        witness_person_id:
          type: string
          format: uuid
          description: Foreign key to the person table — the witness. Must not be the donor or an attorney
            (LPA Regs 2007 reg. 9(2)).
        witness_signature_blob_path:
          type: string
          description: Server-side file reference to the stored witness signature image / blob.
        witnessed_on:
          type: string
          format: date
          description: Date on which the witness signed.
      required:
      - created_at
      - updated_at
      - signature_id
      - witness_person_id
      - witness_signature_blob_path
      description: LPA witness — captures the witness for a donor or attorney signature (LPA Regulations
        2007 reg. 9(2)).
    Person:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        title:
          type: string
          description: Honorific title such as Mr, Mrs, Ms, Mx, Dr.
        first_names:
          type: string
          description: First name(s) including any middle names, as written on the LP1F deed.
        last_name:
          type: string
          description: Last name (surname / family name) as written on the LP1F deed.
        other_names:
          type: string
          description: Other names the person is or has been known by, such as a maiden name.
        date_of_birth:
          type: string
          format: date
          description: Date of birth — used to compute age for the donor (must be 18+) and attorneys (must
            be 18+).
        email:
          type: string
          description: Email address.
        phone:
          type: string
          description: Phone number.
        address_id:
          type: string
          format: uuid
          description: Foreign key to the address table; nullable because some persons (witnesses captured
            only by name and signature) may not have a recorded address.
        is_trust_corporation:
          type: boolean
          description: TRUE if this "person" is a trust corporation appointed as a corporate attorney
            (LP1F section 2); requires LPC continuation sheet 4.
        trust_corporation_number:
          type: string
          description: Companies House registration number or other corporate identifier of the trust
            corporation; empty if not a trust corporation.
        is_bankrupt:
          type: boolean
          description: TRUE if the person is currently bankrupt — a bankrupt person cannot be appointed
            as a financial attorney (MCA 2005 s. 10(2)).
        has_debt_relief_order:
          type: boolean
          description: TRUE if the person is currently subject to a debt relief order — same statutory
            disqualification as bankruptcy for financial attorneys (MCA 2005 s. 13(8)).
      required:
      - created_at
      - updated_at
      - title
      - first_names
      - last_name
      - other_names
      - email
      - phone
      - is_trust_corporation
      - trust_corporation_number
      - is_bankrupt
      - has_debt_relief_order
      description: Person — every named individual involved in an LPA (donor, attorney, replacement attorney,
        certificate provider, person to notify, witness, applicant, recipient).
