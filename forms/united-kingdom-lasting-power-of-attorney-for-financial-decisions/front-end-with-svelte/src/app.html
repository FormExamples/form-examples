<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>UK Lasting Power of Attorney for Financial Decisions</title>
    <script>
      // formexamples.github.io: its 404.html sends a page that is not prerendered
      // (a record, /<slug>/.../[id]/) here as ?__spa=<path>; put the path back
      // before the router starts, so the app renders that page.
      (function () {
        var p = new URLSearchParams(location.search).get('__spa');
        if (p && p.charAt(0) === '/' && p.charAt(1) !== '/') history.replaceState(null, '', p);
      })();
    </script>
    %sveltekit.head%
  </head>
  <body class="min-h-screen bg-base-200 text-base-content antialiased">
    <div class="min-h-screen">%sveltekit.body%</div>
  </body>
</html>
