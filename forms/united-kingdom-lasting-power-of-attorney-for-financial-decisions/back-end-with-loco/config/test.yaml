# Loco configuration file documentation

# Application logging configuration
logger:
  enable: false
  pretty_backtrace: false
  level: warn
  format: compact

# Web server configuration
server:
  port: 5151
  binding: localhost
  host: http://localhost
  middlewares:
    static:
      enable: false
      must_exist: false
      precompressed: false
      folder:
        uri: "/static"
        path: "assets/static"
      fallback: "assets/static/404.html"

# Worker Configuration
# Mailer Configuration.

workers:
  mode: BackgroundQueue

queue:
  kind: Postgres
  uri: {{ get_env(name="DATABASE_URL", default="postgres://loco:loco@localhost:5432/united_kingdom_lasting_power_of_attorney_for_financial_decisions_test") }}
  dangerously_flush: true
  num_workers: 1

mailer:
  smtp:
    enable: false
    host: localhost
    port: 1025
    secure: false

# Database Configuration
database:
  uri: {{ get_env(name="DATABASE_URL", default="postgres://loco:loco@localhost:5432/united_kingdom_lasting_power_of_attorney_for_financial_decisions_test") }}
  enable_logging: false
  connect_timeout: 500
  idle_timeout: 500
  min_connections: 1
  max_connections: 1
  auto_migrate: true
  dangerously_truncate: true
  dangerously_recreate: true

# Tera view engine
view_engine:
  tera:
    templates_dir: "templates"

# Authentication Configuration
auth:
  jwt:
    secret: nTpwAMksGHjOxMR7Iyze
    expiration: 604800 # 7 days
