# Loco configuration file documentation

# Application logging configuration
logger:
  enable: true
  pretty_backtrace: true
  level: debug
  format: compact

# Web server configuration
server:
  port: 5150
  binding: localhost
  host: http://localhost
  middlewares:
    static:
      enable: false
      must_exist: false
      precompressed: false
      folder:
        uri: "/static"
        path: "assets/static"
      fallback: "assets/static/404.html"

# Worker Configuration
# Mailer Configuration.

workers:
  mode: BackgroundQueue

queue:
  kind: Postgres
  uri: {{ get_env(name="DATABASE_URL", default="postgres://loco:loco@localhost:5432/united_kingdom_lasting_power_of_attorney_for_financial_decisions_development") }}
  dangerously_flush: false
  num_workers: 2

mailer:
  smtp:
    enable: true
    host: localhost
    port: 1025
    secure: false

# Database Configuration
database:
  uri: {{ get_env(name="DATABASE_URL", default="postgres://loco:loco@localhost:5432/united_kingdom_lasting_power_of_attorney_for_financial_decisions_development") }}
  enable_logging: false
  connect_timeout: {{ get_env(name="DB_CONNECT_TIMEOUT", default="500") }}
  idle_timeout: {{ get_env(name="DB_IDLE_TIMEOUT", default="500") }}
  min_connections: {{ get_env(name="DB_MIN_CONNECTIONS", default="1") }}
  max_connections: {{ get_env(name="DB_MAX_CONNECTIONS", default="1") }}
  auto_migrate: true
  dangerously_truncate: false
  dangerously_recreate: false

# Tera view engine
view_engine:
  tera:
    templates_dir: "templates"

# Authentication Configuration
auth:
  jwt:
    secret: nTpwAMksGHjOxMR7Iyze
    expiration: 604800 # 7 days
