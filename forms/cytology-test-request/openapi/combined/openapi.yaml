        postcode:
          type: string
          description: Postal code, such as for validating the postal address.
        role:
          type: string
          enum:
          - pathologist
          - gp
          - gynaecologist
          - respiratory-physician
          - nurse
          - other
          - ''
          description: 'Clinician role: pathologist, gp, gynaecologist, respiratory-physician, nurse,
            other.'
        registration_body:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - other
          - ''
          description: 'Clinician registration body: GMC, NMC, HCPC, other.'
        registration_number:
          type: string
          description: Clinician registration number.
        united_kingdom_nhs_number:
          type: string
          maxLength: 12
          description: United Kingdom NHS number, unique per person.
      required:
      - created_at
      - updated_at
      - name
      - role
      - registration_body
      - registration_number
      description: Requesting clinician (referrer) who completes the cytology test request.
    CytologyTestRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        patient_id:
          type: string
          format: uuid
          description: Foreign key to the patient.
        clinician_id:
          type: string
          format: uuid
          description: Foreign key to the requesting clinician (referrer).
        status:
          type: string
          enum:
          - draft
          - submitted
          - vetted
          - scheduled
          - rejected
          - ''
          description: 'Request lifecycle status: draft, submitted, vetted, scheduled, rejected.'
        site_name:
          type: string
          maxLength: 255
          description: Name of the requesting site or clinic.
        setting:
          type: string
          enum:
          - outpatient
          - inpatient
          - community
          - emergency
          - ''
          description: 'Care setting: outpatient, inpatient, community, emergency.'
        referral_date:
          type: string
          format: date
          description: Date the referral was made.
        requested_by_date:
          type: string
          format: date
          description: Date by which the cytology examination is requested to be performed.
        specimen_type:
          type: string
          enum:
          - cervical-smear
          - urine-cytology
          - sputum-cytology
          - fluid-pleural-ascitic
          - fine-needle-aspiration-thyroid
          - fine-needle-aspiration-breast
          - csf-cytology
          - other
          - ''
          description: 'Requested cytology specimen type: cervical-smear, urine-cytology, sputum-cytology,
            fluid-pleural-ascitic, fine-needle-aspiration-thyroid, fine-needle-aspiration-breast, csf-cytology,
            other.'
        specimen_site:
          type: string
          maxLength: 255
          description: Anatomical site or source of the specimen (free text).
        primary_indication:
          type: string
          enum:
          - cervical-screening
          - suspected-malignancy
          - haematuria
          - effusion-investigation
          - thyroid-nodule
          - breast-lump
          - follow-up
          - other
          - ''
          description: 'Primary clinical indication, used for appropriateness scoring: cervical-screening,
            suspected-malignancy, haematuria, effusion-investigation, thyroid-nodule, breast-lump, follow-up,
            other.'
        clinical_question:
          type: string
          maxLength: 1000
          description: Specific clinical question the cytology examination should answer (highest-value
            field).
        clinical_details:
          type: string
          maxLength: 1000
          description: Relevant clinical details, history, and findings for the reporting cytologist.
        hpv_test_requested:
          type: boolean
          description: Whether high-risk HPV testing is requested (cervical screening primary screen).
        previous_abnormal_cytology:
          type: string
          enum:
          - none
          - borderline
          - low-grade
          - high-grade
          - unknown
          - ''
          description: 'Previous abnormal cytology grade: none, borderline, low-grade, high-grade, unknown.'
        last_menstrual_period_date:
          type: string
          format: date
          description: First day of the last menstrual period (LMP), relevant to cervical-smear timing.
        specimen_collected:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Whether the specimen has already been collected: yes, no.'
        collection_datetime:
          type: string
          format: date-time
          description: Date and time the specimen was collected (pre-analytical timing).
        urgency:
          type: string
          enum:
          - routine
          - urgent
          - two-week-wait
          - ''
          description: 'Requested triage urgency: routine, urgent, two-week-wait.'
        supervising_consultant:
          type: string
          maxLength: 255
          description: Name of the supervising / responsible consultant.
        requester_contact:
          type: string
          maxLength: 255
          description: Contact details (bleep / phone) for the requester.
        notes:
          type: string
          maxLength: 1000
          description: Free-text additional notes.
      required:
      - created_at
      - updated_at
      - patient_id
      - clinician_id
      - status
      - site_name
      - setting
      - specimen_type
      - specimen_site
      - primary_indication
      - clinical_question
      - clinical_details
      - hpv_test_requested
      - previous_abnormal_cytology
      - specimen_collected
      - urgency
      - supervising_consultant
      - requester_contact
      - notes
      description: Cytology specimen test request (referral). Captures the requested specimen type and
        site, the clinical indication and question, cervical-screening / cytology context, specimen collection
        (pre-analytical) details, and triage urgency.
    CytologyTestRequestGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        cytology_test_request_id:
          type: string
          format: uuid
          description: Foreign key to the parent request (unique, 1:1).
        appropriateness_score:
          type: integer
          format: int32
          description: Appropriateness score (1-9) from NHS Cervical Screening / indication match.
        appropriateness_band:
          type: string
          enum:
          - usually-appropriate
          - may-be-appropriate
          - usually-not-appropriate
          - ''
          description: 'Appropriateness band: usually-appropriate (7-9), may-be-appropriate (4-6), usually-not-appropriate
            (1-3).'
        preanalytical_band:
          type: string
          enum:
          - ok
          - caution
          - reject-risk
          - ''
          description: 'Pre-analytical specimen adequacy band based on collection / timing / fixation:
            ok, caution, reject-risk.'
        completeness_percent:
          type: integer
          format: int32
          description: Request completeness as a percentage of mandatory fields (0-100).
        triage_tier:
          type: string
          enum:
          - routine
          - urgent
          - two-week-wait
          - ''
          description: 'Assigned triage tier: routine, urgent, two-week-wait.'
        target_timeframe:
          type: string
          maxLength: 50
          description: Target timeframe for the examination implied by the triage tier.
        recommendation:
          type: string
          enum:
          - accept
          - query-referrer
          - redirect
          - reject
          - ''
          description: 'Vetting recommendation: accept, query-referrer, redirect, reject.'
        clinician_notes:
          type: string
          description: Free-text vetting notes.
        signed_at:
          type: string
          format: date-time
          description: Timestamp of vetting clinician electronic signature.
        graded_at:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the result.
      required:
      - created_at
      - updated_at
      - cytology_test_request_id
      - appropriateness_band
      - preanalytical_band
      - triage_tier
      - target_timeframe
      - recommendation
      - clinician_notes
      - graded_at
      description: 'Computed four-axis grading result: appropriateness (NHS Cervical Screening / indication
        match, 1-9), pre-analytical specimen adequacy, request completeness, and triage priority.'
    CytologyTestRequestGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        cytology_test_request_grade_id:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        flag_id:
          type: string
          maxLength: 50
          description: Stable flag identifier (e.g. F-SUSPECTED-CANCER-2WW-001).
        category:
          type: string
          enum:
          - suspected-cancer-2ww
          - previous-high-grade-cytology
          - specimen-not-collected
          - missing-clinical-details
          - missing-indication
          - other
          - ''
          description: 'Flag category: suspected-cancer-2ww, previous-high-grade-cytology, specimen-not-collected,
            missing-clinical-details, missing-indication, other.'
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          - ''
          description: 'Priority: low, medium, high.'
        description:
          type: string
          maxLength: 500
          description: Human-readable description of what fired the flag.
        suggested_action:
          type: string
          maxLength: 500
          description: Suggested clinical action (e.g. "redirect to 2-week-wait suspected-cancer pathway").
      required:
      - created_at
      - updated_at
      - cytology_test_request_grade_id
      - flag_id
      - category
      - priority
      - description
      - suggested_action
      description: Safety-critical flags that fire independently of the four axes, with priority and a
