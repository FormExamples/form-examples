          type: integer
          format: int32
          description: Number of specimen containers / pots submitted (0-100).
        fixative:
          type: string
          enum:
          - formalin
          - fresh
          - other
          - ''
          description: 'Fixative used: formalin, fresh, other.'
        primary_indication:
          type: string
          enum:
          - suspected-malignancy
          - cancer-staging
          - inflammatory-disease
          - infection
          - characterise-lesion
          - margin-assessment
          - transplant-monitoring
          - other
          - ''
          description: Primary clinical indication, used for appropriateness scoring.
