          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        histopathology_test_request_id:
          type: string
          format: uuid
          description: Foreign key to the parent request (unique, 1:1).
        appropriateness_score:
          type: integer
          format: int32
          description: Appropriateness score (1-9) for the indication / RCPath cancer dataset match.
        appropriateness_band:
          type: string
          enum:
          - usually-appropriate
          - may-be-appropriate
          - usually-not-appropriate
