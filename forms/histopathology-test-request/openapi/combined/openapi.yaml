          type: string
          maxLength: 1000
          description: Relevant clinical details, history, and context for the pathologist.
        provisional_diagnosis:
          type: string
          maxLength: 1000
          description: Provisional or working diagnosis.
        previous_histology:
          type: string
          maxLength: 1000
          description: Reference to relevant previous histology / cytology.
        urgent_frozen_section:
          type: boolean
          description: Whether an intra-operative urgent frozen section is requested (red flag, immediate).
