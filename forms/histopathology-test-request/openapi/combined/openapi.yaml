        clinician_id:
          type: string
          format: uuid
          description: Foreign key to the requesting clinician (referrer).
        status:
          type: string
          enum:
          - draft
          - submitted
          - vetted
          - scheduled
          - rejected
          - ''
          description: 'Request lifecycle status: draft, submitted, vetted, scheduled, rejected.'
        site_name:
          type: string
          maxLength: 255
          description: Name of the requesting site or clinic.
        setting:
          type: string
          enum:
          - outpatient
          - inpatient
          - community
          - emergency
          - ''
          description: 'Care setting: outpatient, inpatient, community, emergency.'
        referral_date:
          type: string
          format: date
          description: Date the referral was made.
        requested_by_date:
          type: string
          format: date
          description: Date by which the report is requested to be available.
        specimen_type:
          type: string
          enum:
          - biopsy
          - excision
          - resection
          - endoscopic-biopsy
          - skin-lesion
          - frozen-section
          - other
          - ''
          description: 'Specimen type: biopsy, excision, resection, endoscopic-biopsy, skin-lesion, frozen-section,
            other.'
        specimen_site:
          type: string
          maxLength: 255
          description: Anatomical site the specimen was taken from.
