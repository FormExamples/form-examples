components:
  schemas:
    CardiacStressTestResult:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the patient.
        clinicianId:
          type: string
          format: uuid
          description: Foreign key to the reporting clinician (cardiologist / cardiac physiologist).
        originatingRequestReference:
          type: string
          maxLength: 255
          description: Free-text reference linking this report back to the originating cardiac stress
            test request (referral).
        reportStatus:
          type: string
          enum:
          - preliminary
          - final
          - amended
          - cancelled
          - ''
          description: 'Report lifecycle status: preliminary, final, amended, cancelled.'
        performedDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the stress test was performed.
        reportedDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the report was authored / signed.
        testType:
          type: string
          enum:
          - exercise-treadmill-ecg
          - stress-echo
          - dobutamine-stress-echo
          - myocardial-perfusion-spect
          - stress-cardiac-mri
          - other
          - ''
          description: 'Performed stress-test modality: exercise-treadmill-ecg, stress-echo, dobutamine-stress-echo,
            myocardial-perfusion-spect, stress-cardiac-mri, other.'
        protocol:
          type: string
          maxLength: 255
          description: Exercise / stress protocol used (e.g. Bruce, modified Bruce, dobutamine infusion,
            vasodilator).
        clinicalHistory:
          type: string
          maxLength: 1000
          description: Clinical history and the question the test was performed to answer.
        comparisonWithPrevious:
          type: string
          maxLength: 1000
          description: Comparison with relevant previous stress tests or imaging.
        maximumHeartRateBpm:
          type:
          - integer
          - 'null'
          format: int32
          description: Maximum heart rate achieved during the test, in beats per minute.
        percentPredictedHeartRate:
          type:
          - number
          - 'null'
          format: double
          description: Percentage of the age-predicted maximum heart rate achieved (target ≥85% for an
            adequate exercise test).
        exerciseDurationMinutes:
          type:
          - number
          - 'null'
          format: double
          description: Total exercise duration in minutes (a term in the Duke treadmill score).
        metsAchieved:
          type:
          - number
          - 'null'
          format: double
          description: Peak metabolic equivalents (METs) achieved, a measure of functional capacity.
        peakBloodPressure:
          type: string
          maxLength: 20
          description: Peak blood pressure recorded during the test (free text, e.g. "180/90").
        bloodPressureResponse:
          type: string
          enum:
          - normal
          - hypertensive
          - hypotensive
          - flat
          - ''
          description: 'Blood-pressure response to exercise: normal, hypertensive, hypotensive (exertional
            hypotension), flat.'
        ischaemicStChanges:
          type: boolean
          description: Whether ischaemic ST-segment changes (depression or elevation) were induced.
        chestPainInduced:
          type: boolean
          description: Whether typical / limiting chest pain (angina) was induced during the test.
        arrhythmiaInduced:
          type: boolean
          description: Whether a significant arrhythmia was induced during the test.
        terminatedEarly:
          type: boolean
          description: Whether the test was terminated early before the target endpoint was reached.
        testPositive:
          type: boolean
          description: Whether the overall conclusion is positive (evidence of inducible ischaemia).
        testNegative:
          type: boolean
          description: Whether the overall conclusion is negative (no evidence of inducible ischaemia).
        testInconclusive:
          type: boolean
          description: Whether the overall conclusion is inconclusive / non-diagnostic (e.g. submaximal,
            uninterpretable ECG).
        reasonForTermination:
          type: string
          maxLength: 1000
          description: Reason the test was stopped (target heart rate reached, fatigue, chest pain, ST
            changes, arrhythmia, exertional hypotension, etc.).
        dukeTreadmillScore:
          type:
          - number
          - 'null'
          format: double
          description: Duke treadmill score = exercise minutes − (5 × ST deviation mm) − (4 × angina index);
            range about −25 (highest risk) to +15 (lowest risk). ≥+5 low risk, −10 to +4 intermediate
            risk, ≤−11 high risk.
        impression:
          type: string
          maxLength: 2000
          description: Summary impression / conclusion answering the clinical question.
        reportingCategory:
          type: string
          maxLength: 50
          description: Free-text structured risk category label derived from the result (e.g. "low risk",
            "high-risk Duke score", "non-diagnostic").
        recommendedFollowUp:
          type: string
          maxLength: 1000
          description: 'Recommended follow-up: further imaging, coronary angiography, optimise medical
            therapy, referral, or routine.'
        criticalResultCommunicated:
          type: boolean
          description: Whether a critical or unexpected significant result was communicated directly to
            the referrer / responsible team.
        reportedTo:
          type: string
          maxLength: 500
          description: Who the critical / urgent result was communicated to, with date and time if applicable.
      required:
      - createdAt
      - updatedAt
      - patientId
      - clinicianId
      - originatingRequestReference
      - reportStatus
      - testType
      - protocol
      - clinicalHistory
      - comparisonWithPrevious
      - peakBloodPressure
      - bloodPressureResponse
      - ischaemicStChanges
      - chestPainInduced
      - arrhythmiaInduced
      - terminatedEarly
      - testPositive
      - testNegative
      - testInconclusive
      - reasonForTermination
      - impression
      - reportingCategory
      - recommendedFollowUp
      - criticalResultCommunicated
      - reportedTo
      description: Cardiac stress / exercise test result (report). Captures the performed test type and
        protocol, the clinical history, the haemodynamic and exercise response (peak heart rate, percent-predicted
        heart rate, exercise duration, METs, blood-pressure response), the structured ECG / symptom /
        arrhythmia findings, the overall positive / negative / inconclusive conclusion, the Duke treadmill
        prognostic score, the impression and recommended follow-up, and critical-result communication.
        This is the source-of-truth record that the four-axis interpretation grade is computed from.
    CardiacStressTestResultGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        cardiacStressTestResultId:
          type: string
          format: uuid
          description: Foreign key to the parent result (unique, 1:1).
        resultClassification:
          type: string
          enum:
          - normal
          - abnormal
          - critical
          - inconclusive
          - ''
          description: 'Axis A overall classification: normal, abnormal, critical, inconclusive.'
        abnormalitySeverity:
          type: string
          enum:
          - none
          - minor
          - moderate
          - major
          - ''
          description: 'Axis B abnormality severity: none, minor, moderate, major.'
        reportingCategory:
          type: string
          maxLength: 50
          description: 'Axis B structured-reporting risk-category label (e.g. a Duke-treadmill-score risk
            band: low / intermediate / high risk).'
        reportCompletenessPercent:
          type:
          - integer
          - 'null'
          format: int32
          description: Axis C report completeness as a percentage of mandatory report sections (0-100).
        followUpUrgency:
          type: string
          enum:
          - routine
          - recommended
          - urgent
          - critical-alert
          - ''
          description: 'Axis D follow-up urgency: routine, recommended, urgent, critical-alert.'
        targetTimeframe:
          type: string
          maxLength: 50
          description: Target timeframe for the recommended follow-up implied by the urgency.
        recommendedAction:
          type: string
          maxLength: 500
          description: Axis D concise recommended action derived from the urgency.
        recommendation:
          type: string
          enum:
          - no-action
          - routine-follow-up
          - further-imaging
          - specialist-referral
          - urgent-review
          - ''
          description: 'Overall recommendation: no-action, routine-follow-up, further-imaging, specialist-referral,
            urgent-review.'
        clinicianNotes:
          type: string
          description: Free-text interpretation / sign-off notes.
        signedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Timestamp of the reporting clinician electronic signature.
        gradedAt:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the result.
      required:
      - createdAt
      - updatedAt
      - cardiacStressTestResultId
      - resultClassification
      - abnormalitySeverity
      - reportingCategory
      - followUpUrgency
      - targetTimeframe
      - recommendedAction
      - recommendation
      - clinicianNotes
      - gradedAt
      description: 'Computed four-axis interpretation grade: result classification, abnormality severity
        / structured-reporting category, report completeness, and follow-up urgency. A critical result
        (strongly positive test, exertional hypotension, ischaemia at low workload, or a high-risk Duke
        treadmill score) auto-escalates the follow-up urgency to critical-alert regardless of the other
        axes.'
    CardiacStressTestResultGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        cardiacStressTestResultGradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        flagId:
          type: string
          maxLength: 50
          description: Stable flag identifier (e.g. F-CRITICAL-RESULT-001).
        category:
          type: string
          enum:
          - critical-result-alert
          - incidental-finding
          - discrepancy-with-request
          - abnormal-requiring-action
          - urgent-referral
          - inadequate-technique
          - unexpected-finding
          - missing-impression
          - missing-measurement
          - other
          - ''
          description: Flag category.
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          - ''
          description: 'Priority: low, medium, high.'
        description:
          type: string
          maxLength: 500
          description: Human-readable description of what fired the flag.
        suggestedAction:
          type: string
          maxLength: 500
          description: Suggested clinical action (e.g. "communicate critical result to referrer and document").
      required:
      - createdAt
      - updatedAt
      - cardiacStressTestResultGradeId
      - flagId
      - category
      - priority
      - description
      - suggestedAction
      description: Safety-critical flags that fire independently of the four axes, with priority and a
        suggested action for the reporting / referring team.
    CardiacStressTestResultGradeRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
