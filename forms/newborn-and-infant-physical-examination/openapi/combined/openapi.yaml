components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Practitioner full name as recorded in the rota.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as a single text block.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code.
        role:
          type: string
          enum:
          - midwife
          - neonatal-nurse
          - paediatrician
          - gp
          - nurse-practitioner
          - other
          - ''
          description: 'Examining practitioner role: midwife, neonatal-nurse, paediatrician, gp, nurse-practitioner,
            or other.'
        registrationBody:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - GPhC
          - other
          - ''
          description: 'Professional registration body: GMC, NMC, HCPC, GPhC, or other.'
        registrationNumber:
          type: string
          description: Professional registration number issued by the registration body.
      required:
      - createdAt
      - updatedAt
      - name
      - role
      - registrationBody
      - registrationNumber
      description: Clinician identifying information for the practitioner who performed the NIPE screening
        examination.
    NewbornAndInfantPhysicalExamination:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the infant this examination documents (restrict delete).
        clinicianId:
          type:
          - string
          - 'null'
          format: uuid
          description: Foreign key to the examining practitioner (restrict delete); optional.
        practitionerName:
          type: string
          description: Name of the examining practitioner.
        practitionerRole:
          type: string
          enum:
          - midwife
          - neonatal-nurse
          - paediatrician
          - gp
          - nurse-practitioner
          - other
          - ''
          description: 'Examining practitioner role: midwife, neonatal-nurse, paediatrician, gp, nurse-practitioner,
            or other.'
        examinedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Date and time of the examination.
        examinationContext:
          type: string
          enum:
          - newborn-72h
          - infant-6-8-week
          - ''
          description: 'Screening context: newborn-72h (within 72 hours of birth) or infant-6-8-week (6-8
            week infant review).'
        careSetting:
          type: string
          enum:
          - maternity-ward
          - neonatal-unit
          - community
          - gp-surgery
          - home
          - other
          - ''
          description: 'Care setting: maternity-ward, neonatal-unit, community, gp-surgery, home, or other.'
        babyIdentifier:
          type: string
          maxLength: 100
          description: NHS number or local identifier for the baby.
        babyName:
          type: string
          maxLength: 255
          description: Name of the baby as recorded on the note.
        dateOfBirth:
          type:
          - string
          - 'null'
          format: date
          description: Date of birth of the baby.
        sex:
          type: string
          enum:
          - male
          - female
          - indeterminate
          - ''
          description: 'Sex of the baby: male, female, or indeterminate; drives whether the testes component
            is applicable.'
        gestationalAgeWeeks:
          type:
          - number
          - 'null'
          format: double
          description: Completed gestational age in weeks at birth.
        birthWeightGrams:
          type:
          - number
          - 'null'
          format: double
          description: Birth weight in grams.
        breechPresentation:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the baby was breech at or after 36 weeks or at birth (yes/no); a hip risk
            factor.
        familyHistoryHipProblems:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether there is a first-degree family history of hip problems (yes/no); a hip
            risk factor.
        antenatalConcerns:
          type: string
          description: Free-text relevant antenatal findings or concerns.
        eyesRedReflexRight:
          type: string
          enum:
          - present
          - absent
          - not-examined
          - ''
          description: 'Eyes: right red reflex (present, absent, or not-examined).'
