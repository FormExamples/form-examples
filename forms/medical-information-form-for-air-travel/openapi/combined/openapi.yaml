          description: 'Source instrument: cardiovascular, respiratory, recent-event, pregnancy, communicable,
            equipment, haematology, gas-expansion, or composite.'
        fitnessBand:
          type: string
          enum:
          - fit
          - fit-with-conditions
          - requires-review
          - unfit-to-fly
          - ''
