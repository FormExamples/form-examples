    MedicalInformationFormForAirTravelGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when this row was updated most-recently.
        medicalInformationFormForAirTravelId:
          type: string
          format: uuid
          description: Foreign key to the parent MEDIF assessment (unique, 1:1).
        computedFitnessBand:
          type: string
          enum:
          - fit
          - fit-with-conditions
          - requires-review
          - unfit-to-fly
          - ''
          description: Fitness-to-fly band computed by the engine.
        finalFitnessBand:
          type: string
          enum:
          - fit
          - fit-with-conditions
          - requires-review
          - unfit-to-fly
          - ''
          description: Fitness-to-fly band signed off by the attending physician.
        overrideReason:
          type: string
          maxLength: 500
          description: Reason the physician set final differently from computed (mandatory when they differ).
        deskRecommendation:
          type: string
          maxLength: 500
          description: Recommendation for the airline medical desk (free text).
        physicianNotes:
          type: string
          description: Free-text physician summary notes.
        validUntil:
          type:
          - string
          - 'null'
          format: date
          description: Date the MEDIF expires.
        signedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Timestamp of physician electronic signature.
        gradedAt:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the result.
      required:
      - createdAt
      - updatedAt
      - medicalInformationFormForAirTravelId
      - computedFitnessBand
      - finalFitnessBand
      - overrideReason
      - deskRecommendation
      - physicianNotes
      - gradedAt
      description: Computed and signed-off MEDIF result. Stores both the engine-computed fitness-to-fly
        band and the physician-final band with an override reason.
    MedicalInformationFormForAirTravelGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when this row was updated most-recently.
        medicalInformationFormForAirTravelGradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade row.
        flagId:
          type: string
          maxLength: 50
          description: Stable flag identifier (e.g. F-CARDIAC-ACUTE-MI-7D).
        category:
          type: string
          enum:
          - cardiac-acute
          - pulmonary-acute
          - gas-expansion
          - severe-anaemia
          - severe-hypoxia
          - late-pregnancy
          - communicable
          - high-flow-oxygen
          - stretcher-required
          - incubator-required
          - battery-device
          - psychiatric
          - cognitive
          - pediatric
          - mobility
          - other
          - ''
          description: Flag category.
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          - ''
          description: 'Priority: low, medium, or high.'
        description:
          type: string
          maxLength: 500
          description: Human-readable description of what fired the flag.
        suggestedAction:
          type: string
          maxLength: 500
          description: Suggested airline-desk action (e.g. "request medical-desk reissue", "arrange dangerous-goods
            clearance").
      required:
      - createdAt
      - updatedAt
      - medicalInformationFormForAirTravelGradeId
      - flagId
      - category
      - priority
      - description
      - suggestedAction
