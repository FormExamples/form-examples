    MedicalInformationFormForAirTravelGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when this row was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when this row was deleted a.k.a. soft-removed.
        medical_information_form_for_air_travel_id:
          type: string
          format: uuid
          description: Foreign key to the parent MEDIF assessment (unique, 1:1).
        computed_fitness_band:
          type: string
          enum:
          - fit
          - fit-with-conditions
          - requires-review
          - unfit-to-fly
          - ''
          description: Fitness-to-fly band computed by the engine.
        final_fitness_band:
          type: string
          enum:
          - fit
          - fit-with-conditions
          - requires-review
          - unfit-to-fly
          - ''
          description: Fitness-to-fly band signed off by the attending physician.
        override_reason:
          type: string
          maxLength: 500
          description: Reason the physician set final differently from computed (mandatory when they differ).
        desk_recommendation:
          type: string
          maxLength: 500
          description: Recommendation for the airline medical desk (free text).
        physician_notes:
          type: string
          description: Free-text physician summary notes.
        valid_until:
          type: string
          format: date
          description: Date the MEDIF expires.
        signed_at:
          type: string
          format: date-time
          description: Timestamp of physician electronic signature.
        graded_at:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the result.
      required:
      - created_at
      - updated_at
      - medical_information_form_for_air_travel_id
      - computed_fitness_band
      - final_fitness_band
      - override_reason
      - desk_recommendation
      - physician_notes
      - graded_at
      description: Computed and signed-off MEDIF result. Stores both the engine-computed fitness-to-fly
        band and the physician-final band with an override reason.
    MedicalInformationFormForAirTravelGradeFlag:
      type: object
