components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Attending physician name.
        specialty:
          type: string
          description: Physician specialty (free text).
        role:
          type: string
          enum:
          - general-practitioner
          - cardiologist
          - respirologist
          - obstetrician
          - oncologist
          - travel-medicine-physician
          - aeromedical-physician
          - discharge-coordinator
          - other
          - ''
          description: 'Role classification: general-practitioner, cardiologist, etc.'
        registrationBody:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - GPhC
          - other
          - ''
          description: 'Professional registration body: GMC, NMC, HCPC, GPhC, other.'
        registrationNumber:
          type: string
          description: Professional registration number.
        clinicName:
          type: string
          description: Clinic or hospital name.
        email:
          type: string
          description: Email address.
        phone:
          type: string
          description: Phone number including international dialling code.
        postalAddressAsFullText:
          type: string
          description: Postal address as full text.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country of practice as ISO 3166-1 alpha-2.
        postcode:
          type: string
          description: Postal code of the clinic.
      required:
      - createdAt
      - updatedAt
      - name
      - specialty
      - role
      - registrationBody
      - registrationNumber
      - clinicName
      - email
      - phone
      - postalAddressAsFullText
      - postcode
      description: Attending physician (MEDIF Part 2 author).
    MedicalInformationFormForAirTravel:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when this row was updated most-recently.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the passenger (MEDIF subject).
        clinicianId:
          type:
          - string
          - 'null'
          format: uuid
          description: Foreign key to the attending physician (Part 2 author).
        status:
          type: string
          enum:
          - draft
          - submitted
          - reviewed
          - cleared
          - declined
          - urgent
          description: 'Lifecycle status: draft, submitted, reviewed, cleared, declined, or urgent.'
        submitterName:
          type: string
          description: Name of the person submitting Part 1.
        submitterRole:
          type: string
          enum:
          - passenger
          - agent
          - clinician
          - family-member
          - ''
          description: 'Role of the submitter: passenger, agent, clinician, or family-member.'
        submitterEmail:
          type: string
          description: Email address of the submitter.
        submitterPhone:
          type: string
          description: Phone of the submitter.
        submitterOrganisation:
          type: string
          description: Organisation submitting on behalf of the passenger (e.g. accessible-travel agent).
        airlineBookingReference:
          type: string
          maxLength: 20
          description: Airline booking reference (PNR).
        airlineIataCode:
          type: string
          maxLength: 2
          description: Airline two-letter IATA code (e.g. EK, BA, QR).
        airlineName:
          type: string
          description: Airline full name.
        outboundFlightNumber:
          type: string
          maxLength: 10
          description: Outbound flight number including airline prefix.
        outboundDate:
          type:
          - string
          - 'null'
          format: date
          description: Outbound flight date.
        outboundOriginIata:
          type: string
          maxLength: 3
          description: Outbound origin airport IATA code.
        outboundDestinationIata:
          type: string
          maxLength: 3
          description: Outbound destination airport IATA code.
        returnFlightNumber:
          type: string
          maxLength: 10
          description: Return flight number if applicable.
        returnDate:
          type:
          - string
          - 'null'
          format: date
          description: Return flight date if applicable.
        cabinClass:
          type: string
          enum:
          - economy
          - premium-economy
          - business
          - first
          - ''
          description: 'Cabin class: economy, premium-economy, business, or first.'
        sectorDurationMinutes:
          type:
          - integer
          - 'null'
          format: int32
          description: Longest sector duration in minutes (drives oxygen battery planning).
        transitAirportsIata:
          type: string
          description: Comma-separated transit airport IATA codes.
        specialAssistanceCodes:
          type: string
          description: Comma-separated IATA SSR codes requested (e.g. WCHR,OXYG,MEDA).
        reasonEquipment:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Reason: passenger requires in-flight medical equipment.'
        reasonRecentAcuteEvent:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Reason: passenger had a recent acute medical event (surgery, MI, stroke, fracture).'
        reasonUnstableCondition:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Reason: passenger has an unstable chronic condition.'
        reasonCommunicableDisease:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Reason: passenger has a communicable disease.'
        reasonPregnancy:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Reason: passenger is pregnant beyond carrier threshold.'
        reasonMobilityEscort:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Reason: passenger requires mobility assistance or an escort.'
        reasonPsychiatric:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Reason: passenger has a recent psychiatric event requiring clearance.'
        primaryDiagnosis:
          type: string
          description: Primary diagnosis text.
        icd10Codes:
          type: string
          description: Comma-separated ICD-10 codes.
        diagnosisDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the primary diagnosis was established.
        currentTreatment:
          type: string
          description: Current treatment summary.
        lastAdmissionDate:
          type:
          - string
          - 'null'
          format: date
          description: Date of most recent hospital admission, if any.
        lastDischargeDate:
          type:
          - string
          - 'null'
          format: date
          description: Date of most recent hospital discharge, if any.
        lastSpecialistReviewDate:
          type:
          - string
          - 'null'
          format: date
          description: Date of most recent specialist review.
        restingSystolicBp:
          type:
          - integer
          - 'null'
          format: int32
          description: Resting systolic blood pressure in mmHg.
        restingDiastolicBp:
          type:
          - integer
          - 'null'
          format: int32
          description: Resting diastolic blood pressure in mmHg.
        restingHeartRate:
          type:
          - integer
          - 'null'
          format: int32
          description: Resting heart rate in beats per minute.
        nyhaClass:
          type: string
          enum:
          - I
          - II
          - III
          - IV
          - ''
          description: New York Heart Association functional class I-IV.
        recentMiDate:
          type:
          - string
          - 'null'
          format: date
          description: Date of most recent myocardial infarction, if any.
        recentStentDate:
          type:
          - string
          - 'null'
          format: date
          description: Date of most recent coronary stent, if any.
        onAnticoagulant:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the passenger is on anticoagulant therapy.
        pacemakerOrIcd:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Implanted pacemaker or ICD present.
        exerciseToleranceMetres:
          type:
          - integer
          - 'null'
          format: int32
          description: Exercise tolerance on flat ground in metres before symptoms.
        unstableAngina:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Current unstable angina present.
        restingSpo2Percent:
          type:
          - number
          - 'null'
          format: double
          description: Resting oxygen saturation on room air as a percentage.
        predictedInflightSpo2Percent:
          type:
          - number
          - 'null'
          format: double
          description: Predicted in-flight oxygen saturation as a percentage.
        hypoxicChallengeResult:
          type: string
          enum:
          - pass
          - borderline
          - fail
          - not-performed
          - ''
          description: 'Hypoxic challenge test result: pass, borderline, fail, or not-performed.'
        recentPneumothoraxDate:
          type:
          - string
          - 'null'
          format: date
          description: Date of most recent pneumothorax, if any (gas-expansion risk).
        asthmaSeverity:
          type: string
          enum:
          - none
          - mild-controlled
          - moderate
          - severe-uncontrolled
          - ''
          description: 'Asthma severity: none, mild-controlled, moderate, or severe-uncontrolled.'
        copdSeverity:
          type: string
          enum:
          - none
          - mild
          - moderate
          - severe
          - ''
          description: 'COPD severity: none, mild, moderate, or severe.'
        cpapOrBipapUse:
          type: string
          enum:
          - none
          - cpap
          - bipap
          - both
          - ''
          description: 'CPAP or BiPAP use at home: none, cpap, bipap, or both.'
        recentPulmonaryEmbolismDate:
          type:
          - string
          - 'null'
          format: date
          description: Date of most recent pulmonary embolism, if any.
        lastSurgeryDate:
          type:
          - string
          - 'null'
          format: date
          description: Date of most recent surgery, if any.
        lastSurgerySite:
          type: string
          description: Anatomical site of the most recent surgery.
        cabinGasRisk:
          type: string
          enum:
          - none
          - intra-ocular-gas
          - intra-cranial-gas
          - intra-abdominal-gas
          - plaster-cast
          - pneumothorax
          - other
          - ''
          description: 'Trapped gas risk category for cabin pressure: intra-ocular-gas, intra-cranial-gas,
            intra-abdominal-gas, plaster-cast, pneumothorax, other, or none.'
        recentFractureCast:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Recent fracture with plaster cast in situ.
        recentDvtDate:
          type:
