logger:
  enable: true
  pretty_backtrace: true
  level: debug
  format: compact

server:
  port: 5150
  binding: 127.0.0.1
  host: http://localhost
  middlewares:
    static_assets:
      enable: true
      must_exist: true
      precompressed: false
      folder:
        uri: "/static"
        path: "assets/static"
      fallback: "assets/static/404.html"

workers:
  mode: BackgroundQueue

queue:
  kind: Postgres
  uri: postgres://loco:loco@localhost:5432/medical_information_form_for_air_travel_development
  dangerously_flush: false
  num_workers: 2

mailer:
  smtp:
    enable: false
    host: localhost
    port: 1025
    secure: false

database:
  uri: postgres://loco:loco@localhost:5432/medical_information_form_for_air_travel_development
  enable_logging: false
  connect_timeout: 500
  idle_timeout: 500
  min_connections: 1
  max_connections: 10
  auto_migrate: true
  dangerously_truncate: false
  dangerously_recreate: false

auth:
  jwt:
    secret: replace-me-with-a-real-secret
    expiration: 604800
