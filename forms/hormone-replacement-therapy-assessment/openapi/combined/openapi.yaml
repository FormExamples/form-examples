              description: Seconds to wait before sending again
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  schemas:
    Assessment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the patient who owns this assessment.
        status:
          type: string
          enum:
          - draft
          - submitted
          - reviewed
          - urgent
          description: 'Lifecycle status: draft, submitted, reviewed, or urgent.'
      required:
      - createdAt
      - updatedAt
      - patientId
      - status
      description: HRT eligibility and symptom assessment using the Menopause Rating Scale. Parent entity
        for all assessment sections.
    AssessmentCurrentMedicationItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        medicationName:
          type: string
          maxLength: 255
          description: Name of the medication.
        dose:
          type: string
          maxLength: 100
          description: Dose and strength.
        frequency:
          type: string
          maxLength: 100
          description: Dosing frequency.
        indication:
          type: string
          maxLength: 255
          description: Clinical indication for the medication.
        sortOrder:
          type: integer
          format: int32
          description: Display order within the medication list.
      required:
      - createdAt
      - updatedAt
      - medicationName
      - dose
      - frequency
      - indication
      - sortOrder
      description: Individual medication entry within the current medications section.
    AssessmentCurrentMedications:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        assessmentId:
          type: string
          format: uuid
          description: Foreign key to the parent assessment (unique, enforcing 1:1).
        takesRegularMedications:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Whether the patient takes regular prescription medications: yes, no, or empty
            string.'
        currentHrt:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Whether the patient is currently taking HRT: yes, no, or empty string.'
        currentHrtType:
          type: string
          enum:
          - oestrogen-only
          - combined
          - tibolone
          - local-oestrogen
          - ''
          description: 'Current HRT type: oestrogen-only, combined, tibolone, local-oestrogen, or empty
            string.'
        currentHrtRoute:
          type: string
          enum:
          - oral
          - transdermal-patch
          - transdermal-gel
          - vaginal
          - implant
          - ''
          description: 'Current HRT route: oral, transdermal-patch, transdermal-gel, vaginal, implant,
            or empty string.'
        currentHrtDuration:
          type: string
          maxLength: 50
          description: Duration of current HRT use (e.g. 6 months, 2 years).
        previousHrt:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Whether the patient has previously taken HRT: yes, no, or empty string.'
        previousHrtDetails:
          type: string
          description: Details of previous HRT use.
        reasonForStoppingHrt:
          type: string
          description: Reason for stopping previous HRT.
        takesHerbalSupplements:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Whether the patient takes herbal or alternative remedies: yes, no, or empty string.'
        herbalSupplementDetails:
          type: string
          description: Details of herbal supplements (e.g. black cohosh, red clover).
        takesAnticoagulants:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Whether the patient takes anticoagulants: yes, no, or empty string.'
        anticoagulantDetails:
          type: string
          description: Details of anticoagulant therapy.
        medicationNotes:
          type: string
          description: Free-text notes on medications.
      required:
      - createdAt
      - updatedAt
      - assessmentId
      - takesRegularMedications
      - currentHrt
      - currentHrtType
      - currentHrtRoute
      - currentHrtDuration
      - previousHrt
      - previousHrtDetails
      - reasonForStoppingHrt
      - takesHerbalSupplements
      - herbalSupplementDetails
      - takesAnticoagulants
      - anticoagulantDetails
      - medicationNotes
      description: 'Current medications section: HRT status, regular medications, herbal supplements,
        and anticoagulants. One-to-one child of assessment.'
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Name.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as full text.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code, such as for validating the postal address.
        role:
          type: string
          enum:
          - anaesthetist
          - surgeon
          - preop-nurse
          - perioperative-physician
          - geriatrician
          - pharmacist
          - other
          - ''
          description: Clinician role.
        registrationBody:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - GPhC
          - other
          - ''
          description: Clinician registration body.
        registrationNumber:
          type: string
          description: Clinician registration number.
        unitedKingdomNhsNumber:
          type:
          - string
          - 'null'
          maxLength: 12
          description: United Kingdom NHS number, unique per person.
      required:
      - createdAt
      - updatedAt
      - name
      - role
      - registrationBody
      - registrationNumber
      description: Clinician
    Grade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        assessmentId:
          type: string
          format: uuid
          description: Foreign key to the assessment table.
        mrsTotalScore:
          type: integer
          format: int32
          description: MRS total score across all 11 items (0-44).
        somaticSubscaleScore:
          type: integer
          format: int32
          description: Somatic subscale score (hot flushes, heart, sleep, joint/muscle), range 0-16.
        psychologicalSubscaleScore:
          type: integer
          format: int32
          description: Psychological subscale score (depressive mood, irritability, anxiety, exhaustion),
            range 0-16.
        urogenitalSubscaleScore:
          type: integer
          format: int32
          description: Urogenital subscale score (sexual, bladder, vaginal dryness), range 0-12.
        overallSeverity:
          type: string
          enum:
          - none
          - mild
          - moderate
          - severe
          description: 'Overall symptom severity: none, mild, moderate, or severe.'
        hrtEligibility:
          type: string
          enum:
          - eligible
          - eligible-with-caution
          - contraindicated
          - ''
          description: 'HRT eligibility: eligible, eligible-with-caution, contraindicated, or empty string.'
        gradedAt:
          type: string
          format: date-time
          description: Timestamp when the grading was computed.
      required:
      - createdAt
      - updatedAt
      - assessmentId
      - mrsTotalScore
      - somaticSubscaleScore
      - psychologicalSubscaleScore
      - urogenitalSubscaleScore
      - overallSeverity
      - hrtEligibility
      - gradedAt
      description: Computed Menopause Rating Scale result with HRT eligibility determination. One-to-one
        child of assessment.
    GradingAdditionalFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        gradeId:
          type: string
          format: uuid
          description: Foreign key to the grade table.
        flagId:
          type: string
          maxLength: 30
          description: Identifier of the flag (e.g. FLAG-BRCA-001, FLAG-VTE-001, FLAG-CI-001).
        category:
          type: string
          maxLength: 100
          description: Category of the flag (e.g. Contraindication, Breast Health, Cardiovascular Risk,
            Bone Health).
        message:
          type: string
          description: Human-readable message describing the flagged concern.
        priority:
          type: string
          enum:
          - high
          - medium
          - low
          description: 'Priority level: high, medium, or low.'
      required:
      - createdAt
      - updatedAt
      - gradeId
      - flagId
      - category
      - message
      - priority
      description: Additional safety-critical flags detected during HRT assessment grading (e.g. absolute
        contraindication, breast cancer risk, VTE risk).
    GradingFiredRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        gradeId:
          type: string
          format: uuid
          description: Foreign key to the grade table.
        ruleId:
          type: string
          maxLength: 20
          description: Identifier of the rule that fired (e.g. VM-001, BH-002, CV-003, CI-004).
        category:
          type: string
          maxLength: 100
          description: Category of the rule (e.g. Vasomotor, Bone Health, Cardiovascular, Breast Health,
            Contraindication).
        description:
          type: string
          description: Human-readable description of the rule.
        severityLevel:
          type: string
          enum:
          - none
          - mild
          - moderate
          - severe
          - ''
          description: 'Severity level contributed by this rule: none, mild, moderate, severe, or empty
            string.'
      required:
      - createdAt
      - updatedAt
      - gradeId
      - ruleId
      - category
      - description
      - severityLevel
      description: Individual HRT eligibility and severity rules that evaluated to true during MRS grading.
    Patient:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-deleted.
        name:
          type: string
          maxLength: 255
          description: Name.
        birthDate:
          type: string
          format: date
          description: Birth date.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as full text.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code, such as for validating the postal address.
        unitedKingdomNhsNumber:
          type:
          - string
          - 'null'
          maxLength: 20
          description: United Kingdom NHS number, unique per person.
        waistAsCm:
          type:
          - number
          - 'null'
          format: double
          description: Waist circumference measurement in cm, such as for calculating waist-height ratio
            (WHR).
        heightAsCm:
          type:
          - number
          - 'null'
          format: double
          description: Height measurement in cm, such as for calculating waist-height ratio (WHR).
        weightAsKg:
          type:
          - number
          - 'null'
          format: double
          description: Weight as kg.
        bodyMassIndex:
          type:
          - number
          - 'null'
          format: double
          description: Body mass index (BMI) measurement.
        waistHeightRatio:
          type:
          - number
          - 'null'
          format: double
          description: Waist-height ratio (WHR) measurement.
        vo2Max:
          type:
          - number
          - 'null'
          format: double
          description: VO2 max measurement.
      required:
      - createdAt
      - updatedAt
      - name
      - birthDate
      description: Patient
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          description: A URI identifying the problem type
        title:
          type: string
          description: A short summary of the problem type
        status:
          type: integer
          description: The HTTP status code
        detail:
          type: string
          description: An explanation of this occurrence
        instance:
          type: string
          description: A URI identifying this occurrence
        code:
          type: string
          description: A short machine-readable reason
        errors:
          type: object
          description: Per-field detail, when validation failed
      required:
      - type
      - title
      - status
