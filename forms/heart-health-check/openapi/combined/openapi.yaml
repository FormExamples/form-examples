components:
  schemas:
    Assessment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when this row was deleted.
        patient_id:
          type: string
          format: uuid
          description: Foreign key to the patient who owns this assessment.
        status:
          type: string
          enum:
          - draft
          - submitted
          - reviewed
          description: 'Lifecycle status: draft, submitted, or reviewed.'
      required:
      - created_at
      - updated_at
      - patient_id
      - status
      description: Heart Health Check assessment form. Parent entity for all assessment sections.
    BloodPressure:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when this row was deleted.
        assessment_id:
          type: string
          format: uuid
          description: Foreign key to the assessment table.
        systolic_bp:
          type: integer
          format: int32
          description: Systolic blood pressure in mmHg.
        systolic_bp_sd:
          type: number
          format: double
          description: Standard deviation of systolic BP readings.
        diastolic_bp:
          type: integer
          format: int32
          description: Diastolic blood pressure in mmHg.
        on_bp_treatment:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the patient is on blood pressure treatment.
        number_of_bp_medications:
          type: integer
          format: int32
          description: Number of concurrent BP medications.
      required:
      - created_at
      - updated_at
      - assessment_id
      - on_bp_treatment
      description: Blood pressure readings and antihypertensive treatment status.
    BodyMeasurements:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when this row was deleted.
        assessment_id:
          type: string
          format: uuid
          description: Foreign key to the assessment table.
        height_cm:
          type: number
          format: double
          description: Patient height in centimetres.
        weight_kg:
          type: number
          format: double
          description: Patient weight in kilograms.
        bmi:
          type: number
          format: double
          description: Body mass index (can be overridden or calculated from height/weight).
        waist_circumference_cm:
          type: number
          format: double
