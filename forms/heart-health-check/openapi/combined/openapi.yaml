        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when this row was deleted.
        patient_id:
          type: string
          format: uuid
          description: Foreign key to the patient who owns this assessment.
        status:
          type: string
          enum:
          - draft
          - submitted
          - reviewed
          description: 'Lifecycle status: draft, submitted, or reviewed.'
