components:
  schemas:
    Assessment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the patient who owns this assessment.
        status:
          type: string
          enum:
          - draft
          - submitted
          - reviewed
          description: 'Lifecycle status: draft, submitted, or reviewed.'
      required:
      - createdAt
      - updatedAt
      - patientId
      - status
      description: Heart Health Check assessment form. Parent entity for all assessment sections.
    BloodPressure:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        assessmentId:
          type: string
          format: uuid
          description: Foreign key to the assessment table.
        systolicBp:
          type:
          - integer
          - 'null'
          format: int32
          description: Systolic blood pressure in mmHg.
        systolicBpSd:
          type:
          - number
          - 'null'
          format: double
          description: Standard deviation of systolic BP readings.
        diastolicBp:
          type:
          - integer
          - 'null'
          format: int32
          description: Diastolic blood pressure in mmHg.
        onBpTreatment:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the patient is on blood pressure treatment.
        numberOfBpMedications:
          type:
          - integer
          - 'null'
          format: int32
          description: Number of concurrent BP medications.
      required:
      - createdAt
      - updatedAt
      - assessmentId
      - onBpTreatment
      description: Blood pressure readings and antihypertensive treatment status.
    BodyMeasurements:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        assessmentId:
          type: string
          format: uuid
          description: Foreign key to the assessment table.
        heightCm:
          type:
          - number
          - 'null'
          format: double
          description: Patient height in centimetres.
        weightKg:
          type:
          - number
          - 'null'
          format: double
          description: Patient weight in kilograms.
        bmi:
          type:
          - number
          - 'null'
          format: double
          description: Body mass index (can be overridden or calculated from height/weight).
        waistCircumferenceCm:
          type:
          - number
          - 'null'
          format: double
          description: Waist circumference in centimetres.
      required:
      - createdAt
      - updatedAt
      - assessmentId
      description: Body measurements for cardiovascular risk assessment.
    Cholesterol:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        assessmentId:
          type: string
          format: uuid
          description: Foreign key to the assessment table.
        totalCholesterol:
          type:
          - number
          - 'null'
          format: double
          description: Total cholesterol in mmol/L.
        hdlCholesterol:
          type:
          - number
          - 'null'
          format: double
          description: HDL cholesterol in mmol/L.
        totalHdlRatio:
          type:
          - number
          - 'null'
          format: double
          description: TC/HDL ratio (can be overridden or calculated).
        onStatin:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the patient is currently on statin therapy.
      required:
      - createdAt
      - updatedAt
      - assessmentId
      - onStatin
      description: Cholesterol lipid profile and statin therapy status.
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Name.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as full text.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code, such as for validating the postal address.
        role:
          type: string
          enum:
          - anaesthetist
          - surgeon
          - preop-nurse
          - perioperative-physician
          - geriatrician
          - pharmacist
          - other
          - ''
          description: Clinician role.
        registrationBody:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - GPhC
          - other
          - ''
          description: Clinician registration body.
        registrationNumber:
          type: string
          description: Clinician registration number.
        unitedKingdomNhsNumber:
          type:
          - string
          - 'null'
          maxLength: 12
          description: United Kingdom NHS number, unique per person.
      required:
      - createdAt
      - updatedAt
      - name
      - role
      - registrationBody
      - registrationNumber
      description: Clinician
    DemographicsEthnicity:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        assessmentId:
          type: string
          format: uuid
          description: Foreign key to the assessment table.
        age:
          type:
          - integer
          - 'null'
          format: int32
          description: Patient age in years.
        sex:
          type: string
          enum:
          - male
