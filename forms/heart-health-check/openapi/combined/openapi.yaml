      - created_at
      - updated_at
      - patient_id
      - status
      description: Heart Health Check assessment form. Parent entity for all assessment sections.
    BloodPressure:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when this row was deleted.
        assessment_id:
          type: string
          format: uuid
          description: Foreign key to the assessment table.
