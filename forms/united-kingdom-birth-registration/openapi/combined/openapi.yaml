components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Full name of the registrar or staff member.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as a single text block.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code.
        role:
          type: string
          enum:
          - registrar
          - deputy-registrar
          - superintendent-registrar
          - gro-caseworker
          - other
          - ''
          description: 'Role of the staff member: registrar, deputy-registrar, superintendent-registrar,
            gro-caseworker, or other.'
        registrationBody:
          type: string
          enum:
          - GRO
          - local-authority
          - other
          - ''
          description: 'Registration body: GRO, local-authority, or other.'
        registrationNumber:
          type: string
          description: Staff or registrar reference number.
      required:
      - createdAt
      - updatedAt
      - name
      - role
      - registrationBody
      - registrationNumber
      description: Clinician information for the registrar or staff member handling the United Kingdom
        Birth Registration.
    Patient:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          maxLength: 255
          description: Full name of the child.
        birthDate:
          type: string
          format: date
          description: Date of birth of the child.
        sex:
          type: string
          enum:
          - female
          - male
          - indeterminate
          - ''
          description: 'Sex recorded for the child: female, male, or indeterminate.'
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as a single text block.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code.
        unitedKingdomNhsNumber:
          type:
          - string
          - 'null'
          maxLength: 20
          description: United Kingdom NHS number, unique per person.
        hospitalMrn:
          type:
          - string
          - 'null'
          maxLength: 50
          description: Local hospital medical record number (MRN).
        heightAsCm:
          type:
          - number
          - 'null'
          format: double
          description: Height in centimetres.
        weightAsKg:
          type:
          - number
          - 'null'
          format: double
          description: Weight in kilograms.
        bodyMassIndex:
          type:
          - number
          - 'null'
          format: double
          description: Body mass index (BMI), kg/m^2.
        allergiesSummary:
          type: string
          description: Free-text summary of known allergies.
      required:
      - createdAt
      - updatedAt
      - name
      - birthDate
      - sex
      - allergiesSummary
      description: Patient demographic information for the child whose birth is being registered.
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          description: A URI identifying the problem type
        title:
          type: string
          description: A short summary of the problem type
        status:
          type: integer
          description: The HTTP status code
        detail:
          type: string
          description: An explanation of this occurrence
        instance:
          type: string
          description: A URI identifying this occurrence
        code:
          type: string
          description: A short machine-readable reason
        errors:
          type: object
          description: Per-field detail, when validation failed
      required:
      - type
      - title
      - status
    UnitedKingdomBirthRegistration:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the child whose birth is being registered (restrict delete).
        clinicianId:
          type:
          - string
          - 'null'
          format: uuid
          description: Foreign key to the registrar or staff member handling the application (restrict
            delete); optional.
        childForenames:
          type: string
          description: Forename(s) the parents wish to register for the child.
        childSurname:
          type: string
          description: Surname to be registered for the child.
        sex:
          type: string
          enum:
          - female
          - male
          - indeterminate
          - ''
          description: 'Sex of the child as it will be registered: female, male or indeterminate (rare;
            registrar guidance applies).'
        dateOfBirth:
          type:
          - string
          - 'null'
          format: date
          description: Date of birth of the child.
        timeOfBirth:
          type:
          - string
          - 'null'
          format: time
          description: Time of birth; recorded for multiple births.
        placeOfBirthType:
          type: string
          enum:
          - hospital
          - home
          - birth-centre
          - other
          - ''
          description: 'Type of place of birth: hospital, home, birth-centre or other.'
        placeOfBirth:
          type: string
          description: Name and address of the place of birth (determines the registration district).
        birthCountry:
          type: string
          enum:
          - england
          - wales
          - scotland
          - northern-ireland
          - abroad
          - ''
          description: Country where the child was born; only england and wales are registered under this
            service.
        multipleBirth:
          type: string
          enum:
          - single
          - twins
          - triplets-or-more
          - ''
          description: Whether the child was a single or multiple birth; each child of a multiple birth
            is registered separately.
        stillbirth:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the child was born dead after the 24th week of pregnancy (a stillbirth,
            registered separately).
        motherName:
          type: string
          description: Full name of the mother (the person who gave birth) at the time of registration.
        motherMaidenSurname:
          type: string
          description: Mothers surname at birth (maiden surname), if different from her current surname.
        motherDateOfBirth:
          type:
          - string
          - 'null'
          format: date
          description: Date of birth of the mother.
        motherPlaceOfBirth:
          type: string
          description: Town and country of birth of the mother.
        motherOccupation:
          type: string
          description: Occupation of the mother.
        motherAddress:
          type: string
          description: Usual address of the mother.
        parentsRelationship:
          type: string
          enum:
          - married-or-civil-partners
          - unmarried
          - female-couple-married
          - female-couple-unmarried
          - male-couple
          - mother-only
          - ''
          description: 'Legal relationship of the parents: married or civil partners, unmarried, female
            couple (married or unmarried), male couple, or mother only.'
        marriageDate:
          type:
          - string
          - 'null'
          format: date
          description: Date of the parents marriage or civil partnership, if any.
        secondParentIncluded:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether a second parent (father or female parent) is to be recorded on the entry.
        secondParentName:
          type: string
          description: Full name of the second parent.
        secondParentDateOfBirth:
          type:
          - string
          - 'null'
          format: date
          description: Date of birth of the second parent.
        secondParentPlaceOfBirth:
          type: string
          description: Town and country of birth of the second parent.
        secondParentOccupation:
          type: string
          description: Occupation of the second parent.
        paternityBasis:
          type: string
          enum:
          - married-or-civil-partners
          - joint-registration
          - statutory-declaration
          - court-order-parental-responsibility
          - parental-order
          - none
          - ''
          description: 'Basis on which the second parent may be recorded: marriage/civil partnership,
            joint registration, statutory declaration, court order, parental order, or none.'
        paternityEvidenceHeld:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the signed declaration or court document required by the basis is in hand.
        licensedClinicTreatment:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'For a female couple not married or civil partners: whether both were treated together
            by a UK licensed clinic under a parenthood agreement.'
        informantRelationship:
          type: string
          enum:
          - mother
          - father
          - second-parent
          - both-parents
          - person-present-at-birth
          - person-responsible-for-child
          - hospital-administrator
          - other
          - ''
          description: Relationship of the informant to the child; only the qualified informants may register.
        informantName:
          type: string
          description: Full name of the informant who will attend or sign.
        parentsUnableToRegister:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the parents are unable to register (for example for medical reasons); required
            for a non-parent informant.
        registrationRoute:
          type: string
          enum:
          - local-register-office
          - hospital
          - other-register-office
          - ''
          description: 'Where the birth is to be registered: the local register office for the birth area,
            the hospital, or any other register office.'
        registrationDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the birth is, or is intended to be, registered; the 42-day period runs from
            the date of birth.
        identityPrimaryDocument:
          type: string
          enum:
