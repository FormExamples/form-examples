          - uk-photocard-driving-licence
          - eu-photocard-driving-licence
          - uk-birth-or-adoption-certificate
          - biometric-immigration-document
          - uk-travel-document
          - refugee-or-stateless-travel-document
          - eu-identity-card
          - proof-of-age-card
          - none
          - ''
