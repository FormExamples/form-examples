components:
  schemas:
    AnionGapCalculator:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        patient_id:
          type: string
          format: uuid
          description: Foreign key to the patient this calculation is for (restricted delete).
        clinician_id:
          type: string
          format: uuid
          description: Foreign key to the clinician who recorded the calculation (optional, restricted
            delete).
        clinician_name:
          type: string
          maxLength: 255
          description: Assessing clinician name as recorded on the form.
        clinician_role:
          type: string
          enum:
          - doctor
          - nurse
          - scientist
          - pharmacist
          - other
          - ''
          description: 'Assessing clinician role: doctor, nurse, scientist, pharmacist, or other.'
        calculated_at:
          type: string
          format: date-time
          description: Date and time the calculation was performed.
        care_setting:
          type: string
          enum:
          - emergency-department
          - ward
          - intensive-care
          - laboratory
          - other
          - ''
          description: 'Care setting: emergency-department, ward, intensive-care, laboratory, or other.'
        clinical_context:
          type: string
          description: Free-text indication or clinical context for the calculation.
        patient_identifier:
          type: string
          maxLength: 100
          description: Local patient identifier as recorded on the form.
        age_band:
          type: string
          enum:
          - 18-39
          - 40-64
          - 65-74
          - 75-84
          - 85-plus
          - ''
          description: 'Adult age band: 18-39, 40-64, 65-74, 75-84, or 85-plus.'
        sex:
          type: string
          enum:
          - female
          - male
          - intersex
          - unknown
          - ''
          description: 'Patient sex recorded for clinical purposes: female, male, intersex, or unknown.'
        sodium_mmol_l:
          type: number
          format: double
          description: Serum sodium in mmol/L; required input (null when unanswered).
        potassium_mmol_l:
          type: number
          format: double
          description: Serum potassium in mmol/L; optional input that selects the potassium-inclusive
            formula and reference range (null when unanswered).
        chloride_mmol_l:
          type: number
          format: double
          description: Serum chloride in mmol/L; required input (null when unanswered).
        bicarbonate_mmol_l:
          type: number
          format: double
          description: Serum bicarbonate (HCO3-) in mmol/L; required input (null when unanswered).
        albumin_g_l:
          type: number
          format: double
          description: Serum albumin in g/L; optional input that enables the albumin correction (null
            when unanswered).
        include_potassium:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Whether potassium is included in the anion-gap formula: yes or no.'
      required:
      - created_at
      - updated_at
      - patient_id
      - clinician_name
      - clinician_role
      - care_setting
      - clinical_context
      - patient_identifier
      - age_band
      - sex
      - include_potassium
      description: 'Main anion-gap calculation record: context and identification, plus the electrolyte-panel
        inputs (sodium, chloride, bicarbonate, optional potassium) and the optional albumin used for the
        correction.'
    AnionGapCalculatorGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        anion_gap_calculator_id:
          type: string
          format: uuid
          description: Foreign key to the parent calculation record (unique, 1:1).
        anion_gap:
          type: number
          format: double
          description: Raw anion gap in mmol/L (null when any required electrolyte is missing).
        corrected_anion_gap:
          type: number
          format: double
          description: Albumin-corrected anion gap in mmol/L (null when albumin is missing).
        classification:
          type: string
          enum:
          - normal
          - high
          - very-high
          - low
          - ''
          description: 'Classification band using the corrected gap when available, else the raw gap:
            low, normal, high, or very-high.'
        graded_at:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the result.
      required:
      - created_at
      - updated_at
      - anion_gap_calculator_id
      - classification
      - graded_at
      description: 'Computed anion-gap result: the raw anion gap, the albumin-corrected anion gap, and
        the classification band (low / normal / high / very-high), 1:1 with the parent calculation record.'
    AnionGapCalculatorGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        anion_gap_calculator_grade_id:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        flag_id:
          type: string
          maxLength: 50
          description: Stable flag identifier (e.g. F-VERY-HIGH-001).
        category:
          type: string
          enum:
          - very-high
          - high-hagma
          - hypoalbuminaemia-masking
          - low
          - incomplete
          - other
          - ''
          description: 'Flag category: very-high, high-hagma, hypoalbuminaemia-masking, low, incomplete,
            or other.'
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          - urgent
          - ''
          description: 'Priority: low, medium, high, or urgent.'
        description:
          type: string
          maxLength: 500
          description: Human-readable description of what fired the flag.
        suggested_action:
          type: string
          maxLength: 500
          description: Suggested clinical action (e.g. "urgent search for the cause of the metabolic acidosis").
      required:
      - created_at
      - updated_at
      - anion_gap_calculator_grade_id
      - flag_id
      - category
      - priority
      - description
      - suggested_action
      description: Safety-critical flags that fire independently of the classification, with priority
        and a suggested action for the assessing clinician.
    AnionGapCalculatorGradeRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        anion_gap_calculator_grade_id:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        rule_id:
          type: string
          maxLength: 40
          description: Stable rule identifier (e.g. R-CLASSIFY-HIGH-01).
        instrument:
          type: string
          enum:
          - formula
          - correction
          - classification
          - composite
          description: 'Instrument the rule belongs to: formula, correction, classification, or composite.'
        band:
          type: string
          enum:
          - normal
          - high
          - very-high
          - low
          - ''
          description: 'Classification band contributed by this rule: normal, high, very-high, or low.'
        category:
          type: string
          maxLength: 50
          description: Subject category (e.g. reference-range, albumin-correction, missing-input).
        description:
          type: string
          maxLength: 500
          description: Human-readable description of why the rule fired.
      required:
      - created_at
      - updated_at
      - anion_gap_calculator_grade_id
      - rule_id
      - instrument
      - band
      - category
      - description
      description: 'Audit trail of every rule that fired during anion-gap computation: instrument, band,
        category, and description.'
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Clinician full name as recorded in the rota.
        email:
          type: string
          description: Email address.
        phone:
          type: string
          description: Phone number.
        postal_address_as_full_text:
          type: string
          description: Postal address as a single text block.
        country_as_iso_3166_1_alpha_2:
          type: string
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2.
        postcode:
          type: string
          description: Postal code.
        role:
          type: string
          enum:
          - doctor
          - nurse
          - scientist
          - pharmacist
          - other
          - ''
          description: 'Primary clinical role: doctor, nurse, scientist, pharmacist, or other.'
        registration_body:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - GPhC
          - other
          - ''
          description: 'Professional registration body: GMC, NMC, HCPC, GPhC, or other.'
        registration_number:
          type: string
          description: Professional registration number issued by the registration body.
      required:
      - created_at
      - updated_at
      - name
      - role
      - registration_body
      - registration_number
      description: Clinician identifying information for the staff recording an anion-gap calculation.
    Patient:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          maxLength: 255
          description: Full patient name as recorded on the wristband.
        birth_date:
          type: string
          format: date
          description: Date of birth.
        sex:
          type: string
          enum:
          - female
          - male
          - intersex
          - unknown
          - ''
          description: 'Sex recorded for clinical purposes: female, male, intersex, or unknown.'
        email:
          type: string
          description: Email address.
        phone:
          type: string
          description: Phone number.
        postal_address_as_full_text:
          type: string
          description: Postal address as a single text block.
        country_as_iso_3166_1_alpha_2:
          type: string
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2.
        postcode:
          type: string
          description: Postal code.
        united_kingdom_nhs_number:
          type: string
          maxLength: 20
          description: United Kingdom NHS number, unique per person.
        hospital_mrn:
          type: string
          maxLength: 50
          description: Local hospital medical record number (MRN).
        height_as_cm:
          type: number
          format: double
          description: Height in centimetres.
        weight_as_kg:
          type: number
          format: double
          description: Weight in kilograms.
        body_mass_index:
          type: number
          format: double
          description: Body mass index (BMI), kg/m^2.
        allergies_summary:
          type: string
          description: Free-text summary of known allergies.
      required:
      - created_at
      - updated_at
      - name
      - birth_date
      - sex
      - allergies_summary
      description: Patient demographic information used by the anion-gap-calculator record.
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          description: A URI identifying the problem type
        title:
          type: string
          description: A short summary of the problem type
        status:
          type: integer
          description: The HTTP status code
        detail:
          type: string
          description: An explanation of this occurrence
        instance:
          type: string
          description: A URI identifying this occurrence
        code:
          type: string
          description: A short machine-readable reason
        errors:
          type: object
          description: Per-field detail, when validation failed
      required:
      - type
      - title
      - status
