                $ref: '#/components/schemas/Problem'
components:
  schemas:
    Assessment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the patient who owns this assessment.
        status:
          type: string
          enum:
          - draft
          - submitted
          - reviewed
          - urgent
          description: 'Lifecycle status: draft, submitted, reviewed, or urgent.'
      required:
      - createdAt
      - updatedAt
      - patientId
      - status
      description: Respirology assessment form. Parent entity for all sections covering the MRC (Medical
        Research Council) Dyspnoea Scale evaluation.
    AssessmentCurrentMedications:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        assessmentId:
          type: string
          format: uuid
          description: Foreign key to the parent assessment (unique, enforcing 1:1).
        takesRespiratoryMedications:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the patient takes respiratory medications.
        inhalerUse:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the patient uses inhaler devices.
        inhalerTechniqueAssessed:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether inhaler technique was assessed.
        inhalerTechniqueAdequate:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether inhaler technique is adequate.
        longTermOxygenTherapy:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the patient is on long-term oxygen therapy.
        nebuliserUse:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the patient uses a nebuliser.
        takesOtherMedications:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Takes other medications. One of: yes, no.'
        medicationAdherence:
          type: string
          enum:
          - good
          - fair
          - poor
          - ''
          description: 'Medication adherence: good, fair, poor, or empty.'
        adverseDrugReactions:
          type: string
          description: Adverse drug reactions.
        additionalNotes:
          type: string
          description: Additional notes.
      required:
      - createdAt
      - updatedAt
      - assessmentId
      - takesRespiratoryMedications
      - inhalerUse
      - inhalerTechniqueAssessed
      - inhalerTechniqueAdequate
      - longTermOxygenTherapy
      - nebuliserUse
      - takesOtherMedications
      - medicationAdherence
      - adverseDrugReactions
      - additionalNotes
      description: Current medications section header. One-to-one child of assessment.
    AssessmentMedicationItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        medicationName:
          type: string
          maxLength: 255
          description: Name of the medication.
        dose:
          type: string
          maxLength: 100
          description: Dosage amount and unit.
        frequency:
          type: string
          maxLength: 100
          description: Dosing frequency.
        route:
          type: string
          enum:
          - inhaled
          - oral
          - nebulised
          - subcutaneous
          - intravenous
          - other
          - ''
          description: 'Route of administration: inhaled, oral, nebulised, subcutaneous, intravenous,
            other, or empty.'
        indication:
          type: string
          description: Indication.
        sortOrder:
          type: integer
          format: int32
          description: Display order of the medication in the list.
      required:
      - createdAt
      - updatedAt
      - medicationName
      - dose
      - frequency
      - route
      - indication
      - sortOrder
      description: Individual medication entry with name, dose, frequency, and route.
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Name.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as full text.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code, such as for validating the postal address.
        role:
          type: string
          enum:
          - anaesthetist
          - surgeon
          - preop-nurse
          - perioperative-physician
          - geriatrician
          - pharmacist
          - other
          - ''
          description: Clinician role.
        registrationBody:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - GPhC
          - other
          - ''
          description: Clinician registration body.
        registrationNumber:
          type: string
          description: Clinician registration number.
        unitedKingdomNhsNumber:
          type:
          - string
          - 'null'
          maxLength: 12
          description: United Kingdom NHS number, unique per person.
      required:
      - createdAt
      - updatedAt
      - name
      - role
      - registrationBody
      - registrationNumber
      description: Clinician
    Grade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        assessmentId:
          type: string
          format: uuid
          description: Foreign key to the parent assessment (unique, enforcing 1:1).
        mrcGrade:
          type: integer
          format: int32
          description: 'MRC dyspnoea grade: 1=strenuous exercise only, 2=hurrying on flat, 3=slower than
            peers, 4=stops after 100m, 5=too breathless to leave house.'
        mrcDescription:
          type: string
          maxLength: 100
          description: Human-readable description of the MRC dyspnoea grade.
        overallSeverity:
          type: string
          enum:
          - mild
          - moderate
          - severe
          - very-severe
          - ''
          description: 'Overall respiratory disease severity: mild, moderate, severe, very-severe, or
            empty.'
        functionalImpairment:
          type: string
          enum:
          - minimal
          - mild
          - moderate
          - severe
          - ''
          description: 'Overall functional impairment: minimal, mild, moderate, severe, or empty.'
        compositeScore:
          type: integer
          format: int32
          description: Aggregate composite score across all respiratory domains.
        gradedAt:
          type: string
          format: date-time
          description: Timestamp when the grading was computed.
      required:
      - createdAt
      - updatedAt
      - assessmentId
      - mrcGrade
      - mrcDescription
      - overallSeverity
      - functionalImpairment
      - compositeScore
      - gradedAt
      description: Computed MRC (Medical Research Council) Dyspnoea Scale result. Grade 1-5, with higher
        grades indicating worse breathlessness. One-to-one child of assessment.
    GradingAdditionalFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        gradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grading result.
        flagId:
          type: string
          maxLength: 30
          description: Identifier of the flag (e.g. FLAG-HAEMOPTYSIS-001, FLAG-DESAT-001, FLAG-OSA-001).
        category:
          type: string
          maxLength: 100
          description: Category of the flag (e.g. Dyspnoea, Cough, Pulmonary Function, Sleep, Exposure).
        message:
          type: string
          description: Human-readable description of the flagged concern.
        priority:
          type: string
          enum:
          - high
          - medium
          - low
          description: 'Priority level: high, medium, or low.'
      required:
      - createdAt
      - updatedAt
      - gradeId
      - flagId
      - category
      - message
      - priority
      description: Additional safety-critical flags detected during respirology assessment grading (e.g.
        haemoptysis, respiratory failure, suspected malignancy).
    GradingFiredRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        gradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grading result.
        ruleId:
          type: string
          maxLength: 20
          description: Identifier of the rule that fired (e.g. MRC-001, COUGH-002, PFT-003).
        category:
          type: string
          maxLength: 100
          description: Category of the rule (e.g. Dyspnoea, Cough, Pulmonary Function, Sleep).
        description:
          type: string
          description: Human-readable description of the rule condition.
        severityLevel:
          type: string
          enum:
          - mild
          - moderate
          - severe
          - very-severe
          - ''
          description: 'Severity level contributed by this rule: mild, moderate, severe, very-severe,
            or empty.'
      required:
      - createdAt
      - updatedAt
      - gradeId
      - ruleId
      - category
      - description
      - severityLevel
      description: Individual MRC dyspnoea grading rules that evaluated to true during grading.
    Patient:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-deleted.
        name:
          type: string
          maxLength: 255
          description: Name.
        birthDate:
          type: string
          format: date
          description: Birth date.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as full text.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code, such as for validating the postal address.
        unitedKingdomNhsNumber:
          type:
          - string
          - 'null'
          maxLength: 20
          description: United Kingdom NHS number, unique per person.
        waistAsCm:
          type:
          - number
          - 'null'
          format: double
          description: Waist circumference measurement in cm, such as for calculating waist-height ratio
            (WHR).
        heightAsCm:
          type:
          - number
          - 'null'
          format: double
          description: Height measurement in cm, such as for calculating waist-height ratio (WHR).
        weightAsKg:
          type:
          - number
          - 'null'
          format: double
          description: Weight as kg.
        bodyMassIndex:
          type:
          - number
          - 'null'
          format: double
          description: Body mass index (BMI) measurement.
        waistHeightRatio:
          type:
          - number
          - 'null'
          format: double
          description: Waist-height ratio (WHR) measurement.
        vo2Max:
          type:
          - number
          - 'null'
          format: double
          description: VO2 max measurement.
      required:
      - createdAt
      - updatedAt
      - name
      - birthDate
      description: Patient
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          description: A URI identifying the problem type
        title:
          type: string
          description: A short summary of the problem type
        status:
          type: integer
          description: The HTTP status code
        detail:
          type: string
          description: An explanation of this occurrence
        instance:
          type: string
          description: A URI identifying this occurrence
        code:
          type: string
          description: A short machine-readable reason
        errors:
          type: object
          description: Per-field detail, when validation failed
      required:
      - type
      - title
      - status
