components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Name.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as full text.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code, such as for validating the postal address.
        role:
          type: string
          enum:
          - radiologist
          - nuclear-medicine-physician
          - oncologist
          - cardiologist
          - gp
          - technologist
          - other
          - ''
          description: 'Clinician role: radiologist, nuclear-medicine-physician, oncologist, cardiologist,
            gp, technologist, other.'
        registrationBody:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - other
          - ''
          description: 'Clinician registration body: GMC, NMC, HCPC, other.'
        registrationNumber:
          type: string
          description: Clinician registration number.
        unitedKingdomNhsNumber:
          type:
          - string
          - 'null'
          maxLength: 12
          description: United Kingdom NHS number, unique per person.
      required:
      - createdAt
      - updatedAt
      - name
      - role
      - registrationBody
      - registrationNumber
      description: Requesting clinician (referrer) who completes the nuclear medicine request.
    NuclearMedicineTestRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the patient.
        clinicianId:
          type: string
          format: uuid
          description: Foreign key to the requesting clinician (referrer).
        status:
          type: string
          enum:
          - draft
          - submitted
          - vetted
          - scheduled
          - rejected
          - ''
          description: 'Request lifecycle status: draft, submitted, vetted, scheduled, rejected.'
        siteName:
          type: string
          maxLength: 255
          description: Name of the requesting site or clinic.
        setting:
          type: string
          enum:
          - outpatient
          - inpatient
          - community
          - emergency
          - ''
          description: 'Care setting: outpatient, inpatient, community, emergency.'
        referralDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the referral was made.
        requestedByDate:
          type:
          - string
          - 'null'
          format: date
          description: Date by which the scan is requested to be performed.
        scanType:
          type: string
          enum:
          - bone-scan
          - myocardial-perfusion
          - vq-lung-scan
          - thyroid-uptake
          - renal-dmsa
          - renal-mag3
          - gallium-octreotide
          - white-cell-scan
          - sentinel-node
          - other
          - ''
          description: 'Requested radionuclide scan type: bone-scan, myocardial-perfusion, vq-lung-scan,
            thyroid-uptake, renal-dmsa, renal-mag3, gallium-octreotide, white-cell-scan, sentinel-node,
            other.'
        primaryIndication:
          type: string
          enum:
          - suspected-bone-metastases
          - cardiac-ischaemia
          - pulmonary-embolism
          - thyroid-function
          - renal-function
          - infection-localisation
          - tumour-localisation
          - sentinel-node-mapping
          - other
          - ''
          description: Primary clinical indication, used for appropriateness scoring.
        clinicalQuestion:
          type: string
          maxLength: 1000
          description: Specific clinical question the scan should answer (highest-value field).
        relevantHistory:
          type: string
          maxLength: 1000
          description: Relevant medical, surgical, and oncological history.
        pregnancyStatus:
          type: string
          enum:
          - not-pregnant
          - pregnant
          - possible
          - unknown
          - not-applicable
          - ''
          description: 'Pregnancy status for radiation justification: not-pregnant, pregnant, possible,
            unknown, not-applicable.'
        breastfeeding:
          type: boolean
          description: Whether the patient is currently breastfeeding (affects radiopharmaceutical choice
            and interruption advice).
        egfr:
          type:
          - number
          - 'null'
          format: double
          description: Estimated glomerular filtration rate (mL/min/1.73m2), relevant to renal radiopharmaceutical
            handling.
        recentOtherNuclearScan:
          type: boolean
          description: Whether the patient had another recent radionuclide study (residual activity may
            interfere with imaging).
        weightKg:
          type:
          - number
          - 'null'
          format: double
          description: Patient weight in kg, used for administered-activity calculation.
        urgency:
          type: string
          enum:
          - routine
          - urgent
          - emergency
          - ''
          description: 'Requested triage urgency: routine, urgent, emergency.'
        irMeRJustification:
          type: string
          maxLength: 1000
          description: IR(ME)R justification statement for the exposure (referrer-supplied clinical rationale).
        supervisingConsultant:
          type: string
          maxLength: 255
          description: Name of the supervising / responsible consultant.
        requesterContact:
          type: string
          maxLength: 255
          description: Contact details (bleep / phone) for the requester.
        notes:
          type: string
          maxLength: 1000
          description: Free-text additional notes.
      required:
      - createdAt
      - updatedAt
      - patientId
      - clinicianId
      - status
      - siteName
      - setting
      - scanType
      - primaryIndication
      - clinicalQuestion
      - relevantHistory
      - pregnancyStatus
      - breastfeeding
      - recentOtherNuclearScan
      - urgency
      - irMeRJustification
      - supervisingConsultant
      - requesterContact
      - notes
      description: Nuclear medicine (radionuclide imaging) request (referral). Captures the requested
        scan type, the clinical indication and question, relevant history, radiation-safety governance
        (pregnancy, breastfeeding, renal function, recent radionuclide exposure), IR(ME)R justification,
        and triage urgency.
    NuclearMedicineTestRequestGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        nuclearMedicineTestRequestId:
          type: string
          format: uuid
          description: Foreign key to the parent request (unique, 1:1).
        appropriatenessScore:
          type:
          - integer
          - 'null'
          format: int32
          description: ACR Appropriateness Criteria / RCR iRefer score (1-9).
        appropriatenessBand:
          type: string
          enum:
          - usually-appropriate
          - may-be-appropriate
          - usually-not-appropriate
          - ''
          description: 'Appropriateness band: usually-appropriate (7-9), may-be-appropriate (4-6), usually-not-appropriate
            (1-3).'
        prepSafetyBand:
          type: string
          enum:
          - ok
          - caution
          - contraindicated
          - ''
          description: 'Preparation and radiation-safety band: ok, caution, contraindicated (pregnancy,
            breastfeeding, recent radionuclide interference).'
        radiationDoseBand:
          type: string
          enum:
          - low
          - moderate
          - high
          - ''
          description: 'Effective-dose band for the requested radiopharmaceutical: low, moderate, high.'
        completenessPercent:
          type:
          - integer
          - 'null'
          format: int32
          description: Request completeness as a percentage of mandatory fields (0-100).
        triageTier:
          type: string
          enum:
          - routine
          - urgent
          - emergency
          - ''
          description: 'Assigned triage tier: routine, urgent, emergency.'
        targetTimeframe:
          type: string
          maxLength: 50
          description: Target timeframe for the scan implied by the triage tier.
        recommendation:
          type: string
          enum:
          - accept
          - query-referrer
          - redirect
          - reject
          - ''
          description: 'Vetting recommendation: accept, query-referrer, redirect, reject.'
        clinicianNotes:
          type: string
          description: Free-text vetting notes.
        signedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Timestamp of vetting clinician electronic signature.
        gradedAt:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the result.
      required:
      - createdAt
      - updatedAt
      - nuclearMedicineTestRequestId
      - appropriatenessBand
      - prepSafetyBand
      - radiationDoseBand
      - triageTier
      - targetTimeframe
      - recommendation
      - clinicianNotes
      - gradedAt
      description: 'Computed four-axis grading result: appropriateness (ACR / RCR iRefer 1-9), preparation
        & radiation safety, request completeness, and triage priority.'
    NuclearMedicineTestRequestGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        nuclearMedicineTestRequestGradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        flagId:
          type: string
          maxLength: 50
          description: Stable flag identifier (e.g. F-PREGNANCY-001).
        category:
          type: string
          enum:
          - pregnancy
          - breastfeeding
          - high-radiation-dose
          - recent-radionuclide-interference
          - missing-indication
          - missing-clinical-question
          - other
          - ''
          description: Flag category.
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          - ''
          description: 'Priority: low, medium, high.'
        description:
          type: string
          maxLength: 500
          description: Human-readable description of what fired the flag.
        suggestedAction:
          type: string
          maxLength: 500
          description: Suggested clinical action (e.g. "confirm pregnancy status before administration").
      required:
      - createdAt
      - updatedAt
      - nuclearMedicineTestRequestGradeId
      - flagId
      - category
      - priority
      - description
      - suggestedAction
      description: Safety-critical flags that fire independently of the four axes, with priority and a
        suggested action for the imaging team.
    NuclearMedicineTestRequestGradeRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
