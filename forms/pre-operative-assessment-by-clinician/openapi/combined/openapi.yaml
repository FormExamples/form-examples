      description: 'Clinician-led pre-operative assessment: objective findings, scoring inputs (ASA, Mallampati,
        RCRI, STOP-BANG, Clinical Frailty Scale), planned anaesthesia strategy, and safety flags for adult
        elective and urgent surgery.'
    PreOperativeAssessmentByClinicianGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        preOperativeAssessmentByClinicianId:
          type: string
          format: uuid
          description: Foreign key to the pre_operative_assessment_by_clinician table.
        computedAsaGrade:
          type: string
          enum:
          - I
          - II
          - III
          - IV
          - V
          - VI
          - ''
          description: ASA grade computed by the engine from clinician-observed data.
        finalAsaGrade:
          type: string
          enum:
          - I
          - II
          - III
          - IV
          - V
          - VI
          - ''
          description: ASA grade signed off by the clinician (may equal or differ from computed).
        asaEmergencySuffix:
          type: string
          enum:
          - E
          - ''
          description: 'Emergency suffix: E if the procedure is emergency, empty otherwise.'
        overrideReason:
          type: string
          maxLength: 500
          description: Reason the clinician set final differently from computed (mandatory when they differ).
        mallampatiClass:
          type: string
          enum:
          - I
          - II
          - III
          - IV
          - ''
          description: Mallampati airway class as per step 4.
        rcriScore:
          type:
          - integer
          - 'null'
          format: int32
          description: Revised Cardiac Risk Index score (0-6).
        stopbangScore:
          type:
          - integer
          - 'null'
          format: int32
          description: STOP-BANG score (0-8).
        frailtyScale:
          type:
          - integer
          - 'null'
          format: int32
          description: Clinical Frailty Scale score (1-9).
        friedPhenotypeScore:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Fried Frailty Phenotype score (0-5): count of weakness, slowness, low activity,
            exhaustion, and unintentional weight loss criteria met.'
        friedFrailtyCategory:
          type: string
          enum:
          - robust
          - pre-frail
          - frail
          - ''
          description: 'Fried Frailty Phenotype category derived from the score: robust (0), pre-frail
            (1-2), or frail (3-5).'
        compositeRisk:
          type: string
          enum:
          - low
          - moderate
          - high
          - critical
          - ''
          description: 'Composite perioperative risk: low, moderate, high, critical.'
        recommendation:
          type: string
          enum:
          - proceed
          - optimise-first
          - mdt-review
          - cancel
          - ''
          description: 'Overall recommendation: proceed, optimise-first, mdt-review, cancel.'
        clinicianNotes:
          type: string
          description: Free-text clinician summary notes.
        signedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Timestamp of clinician electronic signature.
        gradedAt:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the result.
      required:
      - createdAt
      - updatedAt
      - preOperativeAssessmentByClinicianId
      - computedAsaGrade
      - finalAsaGrade
      - asaEmergencySuffix
      - overrideReason
      - mallampatiClass
      - friedFrailtyCategory
      - compositeRisk
      - recommendation
      - clinicianNotes
      - gradedAt
      description: Computed and signed-off grading result. Stores both the engine-computed ASA grade and
        the clinician-final grade with an override reason.
    PreOperativeAssessmentByClinicianGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when this row was updated most-recently.
        preOperativeAssessmentByClinicianGradeId:
          type: string
          format: uuid
          description: Foreign key to the pre_operative_assessment_by_clinician_grade table.
        flagId:
          type: string
          maxLength: 50
          description: Stable flag identifier (e.g. F-DIFFICULT-AIRWAY-001).
        category:
          type: string
          enum:
          - difficult-airway
          - severe-cardiac
          - severe-respiratory
          - severe-renal
          - severe-hepatic
          - severe-anaemia
          - coagulopathy
          - uncontrolled-diabetes
          - severe-frailty
          - recent-covid-19
          - fasting-violation
          - missing-crossmatch
          - high-risk-medication
          - capacity-concern
          - paediatric
          - pregnancy
          - safeguarding
          - malignant-hyperthermia
          - latex-allergy
          - sux-apnoea
          - pseudocholinesterase-deficiency
          - malnutrition-risk
          - glp1-aspiration-risk
          - cognitive-assessment-indicated
          - sarcopenia-risk
          - dehydration-aki-risk
          - rebound-glycaemic-risk
          - other
          - ''
          description: Flag category.
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          - ''
          description: 'Priority: low, medium, high.'
        description:
          type: string
          maxLength: 500
          description: Human-readable description of what fired the flag.
        suggestedAction:
          type: string
          maxLength: 500
          description: Suggested clinical action (e.g. "prepare difficult-airway trolley").
      required:
      - createdAt
      - updatedAt
      - preOperativeAssessmentByClinicianGradeId
      - flagId
      - category
      - priority
      - description
      - suggestedAction
      description: Safety-critical flags that fire independently of the ASA grade, with priority and a
        suggested action for the perioperative team.
    PreOperativeAssessmentByClinicianGradeRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        gradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        ruleId:
          type: string
          maxLength: 30
          description: Stable rule identifier (e.g. R-ASA-III-02).
        instrument:
          type: string
          enum:
          - asa
          - mallampati
          - rcri
          - stopbang
          - frailty
          description: 'Scoring instrument the rule belongs to: asa, mallampati, rcri, stopbang, frailty.'
        grade:
          type: string
          maxLength: 5
          description: Grade contributed by this rule (e.g. III for ASA).
        category:
          type: string
          maxLength: 50
          description: Body-system or risk category (e.g. cardiovascular, respiratory).
        description:
          type: string
          maxLength: 500
          description: Human-readable description of why the rule fired.
      required:
      - createdAt
      - updatedAt
      - gradeId
      - ruleId
      - instrument
      - grade
      - category
      - description
      description: Audit trail of every ASA / Mallampati / RCRI / STOP-BANG / frailty rule that fired
        for this assessment.
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          description: A URI identifying the problem type
        title:
          type: string
          description: A short summary of the problem type
        status:
          type: integer
          description: The HTTP status code
        detail:
          type: string
          description: An explanation of this occurrence
        instance:
          type: string
          description: A URI identifying this occurrence
        code:
          type: string
          description: A short machine-readable reason
        errors:
          type: object
          description: Per-field detail, when validation failed
      required:
      - type
      - title
      - status
