          - 'no'
          - ''
          description: Whether the patient is currently prescribed a GLP-1 receptor agonist (semaglutide,
            tirzepatide and related drugs), which delays gastric emptying and raises aspiration risk under
            anaesthesia.
        glp1AgonistName:
          type: string
          enum:
          - semaglutide
          - tirzepatide
          - dulaglutide
          - liraglutide
          - exenatide
          - other
          - ''
          description: Which GLP-1 receptor agonist the patient is prescribed.
        glp1Formulation:
          type: string
          enum:
          - daily
          - weekly
          - ''
          description: 'Dosing formulation: daily or weekly. Drives the hold window — hold daily formulations
            day-of, hold weekly formulations one week before surgery.'
        glp1LastDoseAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Timestamp of the most recent recorded GLP-1 receptor agonist dose.
        glp1HeldPerGuideline:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the GLP-1 receptor agonist was held per the agreed perioperative schedule
            (daily formulation held day-of; weekly formulation held one week prior).
        glp1ExtendedClearFluidsConfirmed:
          type: string
          enum:
