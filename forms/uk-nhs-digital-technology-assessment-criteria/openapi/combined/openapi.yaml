components:
  schemas:
    Assessor:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        name:
          type: string
          description: Name of the assessor.
        email:
          type: string
          description: Email address.
        phone:
          type: string
          description: Telephone number.
        organisation:
          type: string
          description: Commissioning or assuring organisation the assessor works for.
        role:
          type: string
          enum:
          - commissioner
          - procurement-lead
          - clinical-safety-officer
          - information-governance-lead
          - information-security-lead
          - digital-lead
          - other
          - ''
          description: Assessor role.
      required:
      - created_at
      - updated_at
      - name
      - organisation
      - role
      description: Person carrying out the DTAC assessment on behalf of an NHS or care organisation.
    Product:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        supplier_id:
          type: string
          format: uuid
          description: Foreign key to the supplier table.
        name:
          type: string
          description: Product name.
        version:
          type: string
          description: Product version or release assessed.
        description:
          type: string
          description: Short description of the product.
        intended_purpose:
          type: string
          description: Intended purpose as stated by the supplier.
        product_type:
          type: string
          enum:
          - app
          - web-service
          - software-as-a-service
          - wearable-integrated
          - clinical-decision-support
          - remote-monitoring
          - other
          - ''
          description: Kind of digital health technology.
        medical_device_class:
          type: string
          enum:
          - not-a-medical-device
          - class-i
          - class-iia
          - class-iib
          - class-iii
          - unknown
          - ''
          description: UK MDR 2002 medical device classification.
        handles_patient_data:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the product processes patient-identifiable data.
        is_patient_facing:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether patients or the public use the product directly.
      required:
      - created_at
      - updated_at
      - supplier_id
      - name
      - version
      - description
      - intended_purpose
      - product_type
      - medical_device_class
      - handles_patient_data
      - is_patient_facing
      description: Digital health technology product under assessment.
    Supplier:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        name:
          type: string
          description: Registered name of the supplier company.
        trading_name:
          type: string
          description: Trading name, if different from the registered name.
        company_registration_number:
          type: string
          description: Companies House (or equivalent) registration number.
        country_of_registration_as_iso_3166_1_alpha_2:
          type: string
          maxLength: 2
          description: Country of registration as an ISO 3166-1 alpha-2 code.
        ico_registration_number:
          type: string
          description: Information Commissioner's Office data protection fee registration number.
        website:
          type: string
          description: Supplier website URL.
        postal_address_as_full_text:
          type: string
          description: Registered postal address as free text.
        postcode:
          type: string
          description: Postcode of the registered address.
        contact_name:
          type: string
          description: Named contact for the assessment.
        contact_email:
          type: string
          description: Contact email address.
        contact_phone:
          type: string
          description: Contact telephone number.
      required:
      - created_at
      - updated_at
      - name
      - trading_name
      - company_registration_number
      - ico_registration_number
      - website
      - contact_name
      description: Supplier of the digital health technology being assessed.
    UkNhsDigitalTechnologyAssessmentCriteria:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        supplier_id:
          type: string
          format: uuid
          description: Foreign key to the supplier table.
        product_id:
          type: string
          format: uuid
          description: Foreign key to the product table.
        assessor_id:
          type: string
          format: uuid
          description: Foreign key to the assessor table.
        status:
          type: string
          enum:
          - draft
          - submitted
          - reviewed
          - approved
          - rejected
          description: Workflow status of the assessment.
        assessment_date:
          type: string
          format: date
          description: Date the assessment was carried out.
        review_due_date:
          type: string
          format: date
          description: Date the assessment must next be reviewed.
        dtac_version:
          type: string
          maxLength: 50
          description: Version of the NHS England DTAC the assessment was made against.
        commissioning_organisation:
          type: string
          maxLength: 255
          description: Organisation commissioning or procuring the product.
        a1_company_registered_in_uk:
          type: string
          enum:
          - met
          - partially-met
          - not-met
          - not-applicable
          - ''
          description: 'Criterion A1 (mandatory): The supplier is a registered company or legal entity
            with a verifiable registration number.'
        a2_ico_registration_current:
          type: string
          enum:
          - met
          - partially-met
          - not-met
          - not-applicable
          - ''
          description: 'Criterion A2 (mandatory): The supplier has a current ICO data protection fee registration
            (or a documented exemption).'
        a3_senior_responsible_owner_named:
          type: string
          enum:
          - met
          - partially-met
          - not-met
          - not-applicable
          - ''
          description: 'Criterion A3 (mandatory): A named senior individual is accountable for the product''s
            compliance.'
        a4_incident_contact_published:
          type: string
          enum:
          - met
          - partially-met
          - not-met
          - not-applicable
          - ''
          description: 'Criterion A4 (advisory): A contact point for incident and safety reports is published
            to commissioners and users.'
        section_a_notes:
