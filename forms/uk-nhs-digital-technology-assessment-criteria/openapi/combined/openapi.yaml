components:
  schemas:
    Assessor:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Name of the assessor.
        email:
          type: string
          description: Email address.
        phone:
          type: string
          description: Telephone number.
        organisation:
          type: string
          description: Commissioning or assuring organisation the assessor works for.
        role:
          type: string
          enum:
          - commissioner
          - procurement-lead
          - clinical-safety-officer
          - information-governance-lead
          - information-security-lead
          - digital-lead
          - other
          - ''
          description: Assessor role.
      required:
      - created_at
      - updated_at
      - name
      - organisation
      - role
      description: Person carrying out the DTAC assessment on behalf of an NHS or care organisation.
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
