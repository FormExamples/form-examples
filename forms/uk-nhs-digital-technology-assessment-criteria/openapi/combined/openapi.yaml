components:
  schemas:
    Assessor:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Name of the assessor.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Telephone number.
        organisation:
          type: string
          description: Commissioning or assuring organisation the assessor works for.
        role:
          type: string
          enum:
          - commissioner
          - procurement-lead
          - clinical-safety-officer
          - information-governance-lead
          - information-security-lead
          - digital-lead
          - other
          - ''
          description: Assessor role.
      required:
      - createdAt
      - updatedAt
      - name
      - organisation
      - role
      description: Person carrying out the DTAC assessment on behalf of an NHS or care organisation.
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          description: A URI identifying the problem type
        title:
          type: string
          description: A short summary of the problem type
        status:
          type: integer
          description: The HTTP status code
        detail:
          type: string
          description: An explanation of this occurrence
        instance:
          type: string
          description: A URI identifying this occurrence
        code:
          type: string
          description: A short machine-readable reason
        errors:
          type: object
          description: Per-field detail, when validation failed
      required:
      - type
      - title
      - status
    Product:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        supplierId:
          type: string
          format: uuid
          description: Foreign key to the supplier table.
        name:
          type: string
          description: Product name.
        version:
          type: string
          description: Product version or release assessed.
        description:
          type: string
          description: Short description of the product.
        intendedPurpose:
          type: string
          description: Intended purpose as stated by the supplier.
        productType:
          type: string
          enum:
          - app
          - web-service
          - software-as-a-service
          - wearable-integrated
          - clinical-decision-support
          - remote-monitoring
          - other
          - ''
          description: Kind of digital health technology.
        medicalDeviceClass:
          type: string
          enum:
          - not-a-medical-device
          - class-i
          - class-iia
          - class-iib
          - class-iii
          - unknown
          - ''
          description: UK MDR 2002 medical device classification.
        handlesPatientData:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the product processes patient-identifiable data.
        isPatientFacing:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether patients or the public use the product directly.
      required:
      - createdAt
      - updatedAt
      - supplierId
      - name
