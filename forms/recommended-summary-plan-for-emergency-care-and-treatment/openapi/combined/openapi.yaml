components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Clinician full name as recorded on the plan.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as a single text block.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code.
        role:
          type: string
          enum:
          - doctor
          - nurse
          - paramedic
          - other
          - ''
          description: 'Primary clinical role: doctor, nurse, paramedic, or other.'
        registrationBody:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - other
          - ''
          description: 'Professional registration body: GMC, NMC, HCPC, or other.'
        registrationNumber:
          type: string
          description: Professional registration number issued by the registration body.
      required:
      - createdAt
      - updatedAt
      - name
      - role
      - registrationBody
      - registrationNumber
      description: Clinician identifying information for the clinician who completed and signed the ReSPECT
        plan and any senior clinician who endorsed it.
    Patient:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          maxLength: 255
          description: Full patient name.
        birthDate:
          type: string
          format: date
          description: Date of birth.
        sex:
          type: string
          enum:
          - female
          - male
          - intersex
          - unknown
          - ''
          description: 'Sex recorded for clinical purposes: female, male, intersex, or unknown.'
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as a single text block.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code.
        unitedKingdomNhsNumber:
          type:
          - string
          - 'null'
          maxLength: 20
          description: United Kingdom NHS number, unique per person.
        hospitalMrn:
          type:
          - string
          - 'null'
          maxLength: 50
          description: Local hospital medical record number (MRN).
        heightAsCm:
          type:
          - number
          - 'null'
          format: double
          description: Height in centimetres.
        weightAsKg:
          type:
          - number
          - 'null'
          format: double
          description: Weight in kilograms.
        bodyMassIndex:
          type:
          - number
          - 'null'
          format: double
          description: Body mass index (BMI), kg/m^2.
        allergiesSummary:
          type: string
          description: Free-text summary of known allergies.
      required:
      - createdAt
      - updatedAt
      - name
      - birthDate
      - sex
      - allergiesSummary
      description: Patient demographic information for the person the ReSPECT emergency care and treatment
        plan is about.
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          description: A URI identifying the problem type
        title:
          type: string
          description: A short summary of the problem type
        status:
          type: integer
          description: The HTTP status code
        detail:
          type: string
          description: An explanation of this occurrence
        instance:
          type: string
          description: A URI identifying this occurrence
        code:
          type: string
          description: A short machine-readable reason
        errors:
          type: object
          description: Per-field detail, when validation failed
      required:
      - type
      - title
      - status
    Respect:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the patient this plan is about (restrict delete).
        clinicianId:
          type:
          - string
          - 'null'
          format: uuid
          description: Foreign key to the clinician who completed and signed the plan (restrict delete);
            optional.
        personName:
          type: string
          description: 'Personal details: name of the person the plan is about.'
        dateOfBirth:
          type:
          - string
          - 'null'
          format: date
          description: 'Personal details: the person''s date of birth.'
        identifier:
          type: string
          description: 'Personal details: NHS / CHI number or local identifier.'
        address:
          type: string
          description: 'Personal details: usual residence.'
        keyContact:
          type: string
          description: 'Personal details: key contact / next-of-kin details.'
        healthSummary:
          type: string
          description: 'Summary of relevant health: brief clinical summary (mandatory content).'
        diagnoses:
          type: string
          description: 'Summary of relevant health: relevant diagnoses.'
        existingDocuments:
          type: string
          description: 'Summary of relevant health: existing documents such as ADRT, LPA, or organ-donation
            wishes.'
        whatMatters:
          type: string
          description: 'Preferences: the person''s values, priorities, and fears.'
        carePreferences:
          type: string
          description: 'Preferences: the person''s preferences for care.'
        priorityBalance:
          type: string
          enum:
          - sustain-life
          - balanced
          - comfort
          - ''
          description: 'Clinical recommendations: balance of priorities from life-sustaining to comfort
            (sustain-life, balanced, or comfort).'
        recommendedInterventions:
          type: string
          description: 'Clinical recommendations: interventions recommended.'
        notRecommendedInterventions:
          type: string
          description: 'Clinical recommendations: interventions not recommended.'
        cprRecommendation:
          type: string
          enum:
          - attempt
          - do-not-attempt
          - ''
          description: 'CPR recommendation: attempt CPR, do-not-attempt CPR, or empty when undocumented
            (the most safety-critical field).'
        cprRationale:
          type: string
          description: 'CPR recommendation: clinical rationale for the recommendation.'
        cprDiscussed:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'CPR recommendation: whether the recommendation was discussed with the person or
            their proxy (yes/no).'
        hospitalTransfer:
          type: string
          enum:
          - appropriate
          - not-appropriate
          - ''
          description: 'Ceilings of treatment: whether hospital transfer is appropriate or not-appropriate.'
        criticalCareAdmission:
          type: string
          enum:
          - appropriate
          - not-appropriate
          - ''
          description: 'Ceilings of treatment: whether critical-care admission is appropriate or not-appropriate.'
        treatmentCeilings:
          type: string
          description: 'Ceilings of treatment: other agreed limits on treatment.'
        hasCapacity:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Capacity and involvement: whether the person has capacity for this decision (yes/no);
            drives the conditional capacity rule.'
        capacityAssessment:
          type: string
          description: 'Capacity and involvement: assessment recorded where the person lacks capacity
            (Mental Capacity Act 2005).'
        involvement:
          type: string
          enum:
          - person
          - legal-proxy
          - consultees
          - ''
          description: 'Capacity and involvement: who was involved in the decision (person, legal-proxy,
            or consultees).'
        proxyDetails:
          type: string
          description: 'Capacity and involvement: welfare attorney, deputy, or consultee details.'
        clinicianName:
          type: string
          description: 'Clinician sign-off: name of the completing clinician.'
        clinicianRole:
          type: string
          enum:
          - doctor
          - nurse
          - paramedic
          - other
          - ''
          description: 'Clinician sign-off: role of the completing clinician (doctor, nurse, paramedic,
            or other).'
        clinicianRegistration:
          type: string
          description: 'Clinician sign-off: GMC / NMC / HCPC registration number.'
        signature:
          type: string
          description: 'Clinician sign-off: electronic signature; required for the plan to be valid.'
        signedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: 'Clinician sign-off: date and time the plan was signed.'
        seniorEndorsement:
          type: string
          description: 'Clinician sign-off: senior clinician endorsement.'
        emergencyContacts:
          type: string
          description: 'Clinician sign-off: emergency contacts.'
        reviewDate:
          type:
          - string
          - 'null'
          format: date
          description: 'Clinician sign-off: planned review date; drives the review-date-passed flag.'
      required:
      - createdAt
      - updatedAt
      - patientId
      - personName
      - identifier
      - address
      - keyContact
      - healthSummary
      - diagnoses
      - existingDocuments
      - whatMatters
      - carePreferences
      - priorityBalance
      - recommendedInterventions
      - notRecommendedInterventions
      - cprRecommendation
      - cprRationale
      - cprDiscussed
      - hospitalTransfer
      - criticalCareAdmission
      - treatmentCeilings
      - hasCapacity
      - capacityAssessment
      - involvement
      - proxyDetails
      - clinicianName
      - clinicianRole
      - clinicianRegistration
      - signature
      - seniorEndorsement
      - emergencyContacts
      description: 'Main ReSPECT record: one personalised emergency care and treatment plan created through
        shared decision-making, covering the person''s summary of health, preferences, agreed clinical
        recommendations, CPR recommendation, ceilings of treatment, capacity and involvement, and clinician
        sign-off. Completeness grade, fired rules, and flags live in child tables. The short base name
        `respect` is used because the full slug would exceed PostgreSQL''s 63-byte identifier limit.'
    RespectGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        respectId:
          type: string
          format: uuid
          description: Foreign key to the parent ReSPECT plan (unique, 1:1).
        status:
          type: string
          enum:
          - complete
          - incomplete
          - ''
          description: 'Completeness status: complete (all mandatory rules satisfied) or incomplete.'
        completenessPercent:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Completeness percentage (0..100): populated mandatory fields / total mandatory
            fields x 100, reported for both statuses.'
        gradedAt:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the grade.
      required:
      - createdAt
      - updatedAt
      - respectId
      - status
      - gradedAt
      description: 'Computed documentation-completeness result for a ReSPECT plan: status (complete when
        all eight mandatory rules are satisfied, otherwise incomplete) and completeness percentage.'
    RespectGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        respectGradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        flagId:
          type: string
          maxLength: 50
          description: Stable flag identifier (e.g. F-CPR-NOT-DOCUMENTED-001).
        category:
          type: string
          enum:
          - cpr-not-documented
          - capacity-missing
          - no-clinician-signature
          - dnacpr-without-discussion
          - review-date-passed
          - health-summary-missing
          - other
          - ''
