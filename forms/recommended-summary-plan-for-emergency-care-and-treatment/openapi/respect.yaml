      required:
        - type
        - title
        - status
    Respect:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patient_id:
          type: string
          format: uuid
          description: Foreign key to the patient this plan is about (restrict delete).
        clinician_id:
          type: string
          format: uuid
          description: Foreign key to the clinician who completed and signed the plan (restrict delete); optional.
        person_name:
          type: string
          description: "Personal details: name of the person the plan is about."
        date_of_birth:
          type: string
          format: date
          description: "Personal details: the person's date of birth."
        identifier:
          type: string
          description: "Personal details: NHS / CHI number or local identifier."
        address:
          type: string
          description: "Personal details: usual residence."
        key_contact:
          type: string
          description: "Personal details: key contact / next-of-kin details."
        health_summary:
          type: string
          description: "Summary of relevant health: brief clinical summary (mandatory content)."
        diagnoses:
          type: string
          description: "Summary of relevant health: relevant diagnoses."
        existing_documents:
          type: string
          description: "Summary of relevant health: existing documents such as ADRT, LPA, or organ-donation wishes."
        what_matters:
          type: string
          description: "Preferences: the person's values, priorities, and fears."
        care_preferences:
          type: string
          description: "Preferences: the person's preferences for care."
        priority_balance:
          type: string
          enum:
            - sustain-life
            - balanced
            - comfort
            - ""
          description: "Clinical recommendations: balance of priorities from life-sustaining to comfort (sustain-life, balanced, or comfort)."
        recommended_interventions:
          type: string
          description: "Clinical recommendations: interventions recommended."
        not_recommended_interventions:
          type: string
          description: "Clinical recommendations: interventions not recommended."
        cpr_recommendation:
          type: string
          enum:
            - attempt
            - do-not-attempt
            - ""
          description: "CPR recommendation: attempt CPR, do-not-attempt CPR, or empty when undocumented (the most safety-critical field)."
        cpr_rationale:
          type: string
          description: "CPR recommendation: clinical rationale for the recommendation."
        cpr_discussed:
          type: string
          enum:
            - "yes"
            - "no"
            - ""
          description: "CPR recommendation: whether the recommendation was discussed with the person or their proxy (yes/no)."
        hospital_transfer:
          type: string
          enum:
            - appropriate
            - not-appropriate
            - ""
          description: "Ceilings of treatment: whether hospital transfer is appropriate or not-appropriate."
        critical_care_admission:
          type: string
          enum:
            - appropriate
            - not-appropriate
            - ""
          description: "Ceilings of treatment: whether critical-care admission is appropriate or not-appropriate."
        treatment_ceilings:
          type: string
          description: "Ceilings of treatment: other agreed limits on treatment."
        has_capacity:
          type: string
          enum:
            - "yes"
            - "no"
            - ""
          description: "Capacity and involvement: whether the person has capacity for this decision (yes/no); drives the conditional capacity rule."
        capacity_assessment:
          type: string
          description: "Capacity and involvement: assessment recorded where the person lacks capacity (Mental Capacity Act 2005)."
        involvement:
          type: string
          enum:
            - person
            - legal-proxy
            - consultees
            - ""
          description: "Capacity and involvement: who was involved in the decision (person, legal-proxy, or consultees)."
        proxy_details:
          type: string
          description: "Capacity and involvement: welfare attorney, deputy, or consultee details."
        clinician_name:
          type: string
          description: "Clinician sign-off: name of the completing clinician."
        clinician_role:
          type: string
          enum:
            - doctor
            - nurse
            - paramedic
            - other
            - ""
          description: "Clinician sign-off: role of the completing clinician (doctor, nurse, paramedic, or other)."
        clinician_registration:
          type: string
          description: "Clinician sign-off: GMC / NMC / HCPC registration number."
        signature:
          type: string
          description: "Clinician sign-off: electronic signature; required for the plan to be valid."
        signed_at:
          type: string
          format: date-time
          description: "Clinician sign-off: date and time the plan was signed."
        senior_endorsement:
          type: string
          description: "Clinician sign-off: senior clinician endorsement."
        emergency_contacts:
          type: string
          description: "Clinician sign-off: emergency contacts."
        review_date:
          type: string
          format: date
          description: "Clinician sign-off: planned review date; drives the review-date-passed flag."
