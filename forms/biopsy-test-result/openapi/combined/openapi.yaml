components:
  schemas:
    BiopsyTestResult:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        patient_id:
          type: string
          format: uuid
          description: Foreign key to the patient.
        clinician_id:
          type: string
          format: uuid
          description: Foreign key to the reporting clinician (consultant histopathologist / cytopathologist).
        originating_request_reference:
          type: string
          maxLength: 255
          description: Free-text reference linking this report back to the originating biopsy test request
            (referral).
        report_status:
          type: string
          enum:
          - preliminary
          - final
          - amended
          - supplementary
          - cancelled
          - ''
          description: 'Report lifecycle status: preliminary, final, amended, supplementary, cancelled.'
        performed_date:
          type: string
          format: date
          description: Date the biopsy specimen was taken / received.
        reported_date:
          type: string
          format: date
          description: Date the report was authored / signed.
        biopsy_site:
          type: string
          enum:
          - skin
          - breast
          - lymph-node
          - liver
          - kidney
          - prostate
          - lung
          - bone-marrow
          - gi-tract
          - thyroid
          - soft-tissue
          - other
          - ''
          description: 'Anatomical biopsy site: skin, breast, lymph-node, liver, kidney, prostate, lung,
            bone-marrow, gi-tract, thyroid, soft-tissue, other.'
        biopsy_method:
          type: string
          enum:
          - punch
          - excision
          - incision
          - core-needle
          - fine-needle-aspiration
          - image-guided
          - endoscopic
          - other
          - ''
          description: 'Biopsy method: punch, excision, incision, core-needle, fine-needle-aspiration,
            image-guided, endoscopic, other.'
        specimen_adequacy:
          type: string
          enum:
          - adequate
          - suboptimal
          - inadequate
          - ''
          description: 'Diagnostic adequacy of the specimen: adequate, suboptimal, inadequate.'
        clinical_history:
          type: string
          maxLength: 1000
          description: Clinical history and the question the biopsy was performed to answer.
        comparison_with_previous:
          type: string
          maxLength: 1000
          description: Comparison with relevant previous histopathology or cytology.
        macroscopic_description:
          type: string
          maxLength: 2000
          description: Macroscopic (gross) description of the specimen as received.
        microscopic_description:
          type: string
          maxLength: 2000
          description: Microscopic (histological) description of the specimen.
        diagnosis:
          type: string
          maxLength: 2000
          description: Definitive histopathological diagnosis (the body of the report).
        malignancy_present:
          type: boolean
          description: Whether malignancy is present in the specimen.
        tumour_type:
          type: string
          maxLength: 255
          description: Tumour type / morphology (e.g. invasive ductal carcinoma, squamous cell carcinoma).
        histological_grade:
          type: string
          enum:
          - well-differentiated
          - moderately-differentiated
          - poorly-differentiated
          - undifferentiated
          - not-applicable
          - ''
          description: 'Histological differentiation grade: well-differentiated, moderately-differentiated,
            poorly-differentiated, undifferentiated, not-applicable.'
        resection_margins:
          type: string
          enum:
          - clear
          - involved
          - close
          - not-applicable
          - ''
          description: 'Resection margin status: clear, involved, close, not-applicable.'
        lymphovascular_invasion:
          type: boolean
          description: Whether lymphovascular invasion is present.
        immunohistochemistry:
          type: string
          maxLength: 1000
          description: Immunohistochemistry panel results and interpretation.
        molecular_results:
          type: string
          maxLength: 1000
          description: Molecular / genetic test results relevant to diagnosis or therapy.
        snomed_code:
          type: string
          maxLength: 50
          description: SNOMED CT morphology / topography code for the diagnosis.
        impression:
          type: string
          maxLength: 2000
          description: Summary impression / conclusion answering the clinical question.
        reporting_category:
          type: string
          maxLength: 100
          description: Free-text grade / diagnosis summary label (e.g. an RCPath dataset or TNM8 category).
        recommended_follow_up:
          type: string
          maxLength: 1000
          description: Recommended follow-up, multidisciplinary-team (MDT) discussion, referral, or management.
        critical_result_communicated:
          type: boolean
          description: Whether a critical or unexpected significant result was communicated directly to
            the referrer.
        reported_to:
          type: string
          maxLength: 500
          description: Who the critical / urgent result was communicated to, with date and time if applicable.
      required:
      - created_at
      - updated_at
      - patient_id
      - clinician_id
      - originating_request_reference
      - report_status
      - biopsy_site
      - biopsy_method
      - specimen_adequacy
      - clinical_history
      - comparison_with_previous
      - macroscopic_description
      - microscopic_description
      - diagnosis
      - malignancy_present
      - tumour_type
      - histological_grade
      - resection_margins
      - lymphovascular_invasion
      - immunohistochemistry
      - molecular_results
      - snomed_code
      - impression
      - reporting_category
      - recommended_follow_up
      - critical_result_communicated
      - reported_to
      description: Biopsy histopathology result (report). Captures the specimen and procedure, clinical
        history, the macroscopic and microscopic descriptions, the diagnosis with malignancy status, tumour
        type, histological grade, resection margins, lymphovascular invasion, immunohistochemistry and
        molecular results, the impression, recommended follow-up, and critical-result communication. This
        is the source-of-truth record that the four-axis interpretation grade is computed from.
    BiopsyTestResultGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        biopsy_test_result_id:
          type: string
          format: uuid
          description: Foreign key to the parent result (unique, 1:1).
        result_classification:
          type: string
          enum:
          - normal
          - abnormal
          - critical
          - inconclusive
          - ''
          description: 'Axis A overall classification: normal, abnormal, critical, inconclusive.'
        abnormality_severity:
          type: string
          enum:
          - none
          - minor
          - moderate
          - major
          - ''
          description: 'Axis B abnormality severity: none, minor, moderate, major.'
        reporting_category:
          type: string
          maxLength: 100
          description: Axis B structured-reporting score / category label (e.g. an RCPath cancer-dataset
            or TNM8 category).
        report_completeness_percent:
          type: integer
          format: int32
          description: Axis C report completeness as a percentage of mandatory report sections (0-100).
        follow_up_urgency:
          type: string
          enum:
          - routine
          - recommended
          - urgent
          - critical-alert
          - ''
          description: 'Axis D follow-up urgency: routine, recommended, urgent, critical-alert.'
        target_timeframe:
          type: string
          maxLength: 50
          description: Target timeframe for the recommended follow-up implied by the urgency.
        recommended_action:
          type: string
          maxLength: 500
          description: Axis D concise recommended action derived from the urgency.
        recommendation:
          type: string
          enum:
          - no-action
          - routine-follow-up
          - further-testing
          - specialist-referral
          - urgent-mdt
          - ''
          description: 'Overall recommendation: no-action, routine-follow-up, further-testing, specialist-referral,
            urgent-mdt.'
        clinician_notes:
          type: string
          description: Free-text interpretation / sign-off notes.
        signed_at:
          type: string
          format: date-time
          description: Timestamp of the reporting clinician electronic signature.
        graded_at:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the result.
      required:
      - created_at
      - updated_at
      - biopsy_test_result_id
      - result_classification
      - abnormality_severity
      - reporting_category
      - follow_up_urgency
      - target_timeframe
      - recommended_action
      - recommendation
      - clinician_notes
      - graded_at
      description: 'Computed four-axis interpretation grade: result classification, abnormality severity
        / structured-reporting category, report completeness, and follow-up urgency. A critical result
        (e.g. unexpected malignancy or an involved resection margin) auto-escalates the follow-up urgency
        to critical-alert regardless of the other axes.'
