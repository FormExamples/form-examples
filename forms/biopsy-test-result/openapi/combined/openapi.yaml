components:
  schemas:
    BiopsyTestResult:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the patient.
        clinicianId:
          type: string
          format: uuid
          description: Foreign key to the reporting clinician (consultant histopathologist / cytopathologist).
        originatingRequestReference:
          type: string
          maxLength: 255
          description: Free-text reference linking this report back to the originating biopsy test request
            (referral).
        reportStatus:
          type: string
          enum:
          - preliminary
          - final
          - amended
          - supplementary
          - cancelled
          - ''
          description: 'Report lifecycle status: preliminary, final, amended, supplementary, cancelled.'
        performedDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the biopsy specimen was taken / received.
        reportedDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the report was authored / signed.
        biopsySite:
          type: string
          enum:
          - skin
          - breast
          - lymph-node
          - liver
          - kidney
          - prostate
          - lung
          - bone-marrow
          - gi-tract
          - thyroid
          - soft-tissue
          - other
          - ''
          description: 'Anatomical biopsy site: skin, breast, lymph-node, liver, kidney, prostate, lung,
            bone-marrow, gi-tract, thyroid, soft-tissue, other.'
        biopsyMethod:
          type: string
          enum:
          - punch
          - excision
          - incision
          - core-needle
          - fine-needle-aspiration
          - image-guided
          - endoscopic
          - other
          - ''
          description: 'Biopsy method: punch, excision, incision, core-needle, fine-needle-aspiration,
            image-guided, endoscopic, other.'
        specimenAdequacy:
          type: string
          enum:
          - adequate
          - suboptimal
          - inadequate
          - ''
          description: 'Diagnostic adequacy of the specimen: adequate, suboptimal, inadequate.'
        clinicalHistory:
          type: string
          maxLength: 1000
          description: Clinical history and the question the biopsy was performed to answer.
        comparisonWithPrevious:
          type: string
          maxLength: 1000
          description: Comparison with relevant previous histopathology or cytology.
        macroscopicDescription:
          type: string
          maxLength: 2000
          description: Macroscopic (gross) description of the specimen as received.
        microscopicDescription:
          type: string
          maxLength: 2000
          description: Microscopic (histological) description of the specimen.
        diagnosis:
          type: string
          maxLength: 2000
          description: Definitive histopathological diagnosis (the body of the report).
        malignancyPresent:
          type: boolean
          description: Whether malignancy is present in the specimen.
        tumourType:
          type: string
          maxLength: 255
          description: Tumour type / morphology (e.g. invasive ductal carcinoma, squamous cell carcinoma).
        histologicalGrade:
          type: string
          enum:
          - well-differentiated
          - moderately-differentiated
          - poorly-differentiated
          - undifferentiated
          - not-applicable
          - ''
          description: 'Histological differentiation grade: well-differentiated, moderately-differentiated,
            poorly-differentiated, undifferentiated, not-applicable.'
        resectionMargins:
          type: string
          enum:
          - clear
          - involved
          - close
          - not-applicable
          - ''
          description: 'Resection margin status: clear, involved, close, not-applicable.'
        lymphovascularInvasion:
          type: boolean
          description: Whether lymphovascular invasion is present.
        immunohistochemistry:
          type: string
          maxLength: 1000
          description: Immunohistochemistry panel results and interpretation.
        molecularResults:
          type: string
          maxLength: 1000
          description: Molecular / genetic test results relevant to diagnosis or therapy.
        snomedCode:
          type: string
          maxLength: 50
          description: SNOMED CT morphology / topography code for the diagnosis.
        impression:
          type: string
          maxLength: 2000
          description: Summary impression / conclusion answering the clinical question.
        reportingCategory:
          type: string
          maxLength: 100
          description: Free-text grade / diagnosis summary label (e.g. an RCPath dataset or TNM8 category).
        recommendedFollowUp:
          type: string
          maxLength: 1000
          description: Recommended follow-up, multidisciplinary-team (MDT) discussion, referral, or management.
        criticalResultCommunicated:
          type: boolean
          description: Whether a critical or unexpected significant result was communicated directly to
            the referrer.
        reportedTo:
          type: string
          maxLength: 500
          description: Who the critical / urgent result was communicated to, with date and time if applicable.
      required:
      - createdAt
      - updatedAt
      - patientId
      - clinicianId
      - originatingRequestReference
      - reportStatus
      - biopsySite
      - biopsyMethod
      - specimenAdequacy
      - clinicalHistory
      - comparisonWithPrevious
      - macroscopicDescription
      - microscopicDescription
      - diagnosis
      - malignancyPresent
      - tumourType
      - histologicalGrade
      - resectionMargins
      - lymphovascularInvasion
      - immunohistochemistry
      - molecularResults
      - snomedCode
      - impression
      - reportingCategory
      - recommendedFollowUp
      - criticalResultCommunicated
      - reportedTo
      description: Biopsy histopathology result (report). Captures the specimen and procedure, clinical
        history, the macroscopic and microscopic descriptions, the diagnosis with malignancy status, tumour
        type, histological grade, resection margins, lymphovascular invasion, immunohistochemistry and
        molecular results, the impression, recommended follow-up, and critical-result communication. This
        is the source-of-truth record that the four-axis interpretation grade is computed from.
    BiopsyTestResultGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        biopsyTestResultId:
          type: string
          format: uuid
          description: Foreign key to the parent result (unique, 1:1).
        resultClassification:
          type: string
          enum:
          - normal
          - abnormal
          - critical
          - inconclusive
          - ''
          description: 'Axis A overall classification: normal, abnormal, critical, inconclusive.'
        abnormalitySeverity:
          type: string
          enum:
          - none
          - minor
          - moderate
          - major
          - ''
          description: 'Axis B abnormality severity: none, minor, moderate, major.'
        reportingCategory:
          type: string
          maxLength: 100
          description: Axis B structured-reporting score / category label (e.g. an RCPath cancer-dataset
            or TNM8 category).
        reportCompletenessPercent:
          type:
          - integer
          - 'null'
          format: int32
          description: Axis C report completeness as a percentage of mandatory report sections (0-100).
        followUpUrgency:
          type: string
          enum:
          - routine
          - recommended
          - urgent
          - critical-alert
          - ''
          description: 'Axis D follow-up urgency: routine, recommended, urgent, critical-alert.'
        targetTimeframe:
          type: string
          maxLength: 50
          description: Target timeframe for the recommended follow-up implied by the urgency.
        recommendedAction:
          type: string
          maxLength: 500
          description: Axis D concise recommended action derived from the urgency.
        recommendation:
          type: string
          enum:
          - no-action
          - routine-follow-up
          - further-testing
          - specialist-referral
          - urgent-mdt
          - ''
          description: 'Overall recommendation: no-action, routine-follow-up, further-testing, specialist-referral,
            urgent-mdt.'
        clinicianNotes:
          type: string
          description: Free-text interpretation / sign-off notes.
        signedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Timestamp of the reporting clinician electronic signature.
        gradedAt:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the result.
      required:
      - createdAt
      - updatedAt
      - biopsyTestResultId
      - resultClassification
      - abnormalitySeverity
      - reportingCategory
      - followUpUrgency
      - targetTimeframe
      - recommendedAction
      - recommendation
      - clinicianNotes
      - gradedAt
      description: 'Computed four-axis interpretation grade: result classification, abnormality severity
        / structured-reporting category, report completeness, and follow-up urgency. A critical result
        (e.g. unexpected malignancy or an involved resection margin) auto-escalates the follow-up urgency
        to critical-alert regardless of the other axes.'
    BiopsyTestResultGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        biopsyTestResultGradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        flagId:
          type: string
          maxLength: 50
          description: Stable flag identifier (e.g. F-CRITICAL-RESULT-001).
        category:
          type: string
          enum:
          - critical-result-alert
          - incidental-finding
          - discrepancy-with-request
          - abnormal-requiring-action
          - urgent-referral
          - inadequate-technique
          - unexpected-finding
          - missing-impression
          - missing-measurement
          - other
          - ''
          description: Flag category.
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          - ''
          description: 'Priority: low, medium, high.'
        description:
          type: string
          maxLength: 500
          description: Human-readable description of what fired the flag.
        suggestedAction:
          type: string
          maxLength: 500
          description: Suggested clinical action (e.g. "communicate critical result to referrer and document").
      required:
      - createdAt
      - updatedAt
      - biopsyTestResultGradeId
      - flagId
      - category
      - priority
      - description
      - suggestedAction
      description: Safety-critical flags that fire independently of the four axes, with priority and a
        suggested action for the reporting / referring team.
    BiopsyTestResultGradeRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        biopsyTestResultGradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        ruleId:
          type: string
          maxLength: 40
          description: Stable rule identifier (e.g. R-CLASS-CRITICAL-01).
        axis:
          type: string
          enum:
          - classification
          - severity
          - completeness
          - follow-up
          - ''
          description: 'Scoring axis the rule belongs to: classification, severity, completeness, follow-up.'
        category:
          type: string
          maxLength: 50
          description: Category or finding the rule relates to.
        description:
          type: string
          maxLength: 500
          description: Human-readable description of why the rule fired.
      required:
      - createdAt
      - updatedAt
      - biopsyTestResultGradeId
      - ruleId
      - axis
      - category
      - description
      description: Audit trail of every classification / severity / completeness / follow-up rule that
        fired for this result.
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Name.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
