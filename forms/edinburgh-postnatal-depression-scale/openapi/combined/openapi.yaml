          description: 'Primary clinical role: midwife, health-visitor, gp, perinatal-mh, or other.'
        registration_body:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - GPhC
          - other
          - ''
          description: 'Professional registration body: GMC, NMC, HCPC, GPhC, or other.'
        registration_number:
          type: string
          description: Professional registration number issued by the registration body.
      required:
      - created_at
      - updated_at
      - name
      - role
      - registration_body
      - registration_number
      description: Clinician identifying information for the clinician who administered the EPDS.
    EdinburghPostnatalDepressionScale:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        patient_id:
          type: string
          format: uuid
          description: Foreign key to the patient being assessed (delete restricted).
        clinician_id:
          type: string
          format: uuid
          description: Foreign key to the administering clinician (optional; delete restricted).
        clinician_name:
          type: string
          maxLength: 255
          description: Name of the administering clinician as recorded on the assessment.
        clinician_role:
          type: string
          enum:
          - midwife
          - health-visitor
          - gp
          - perinatal-mh
          - other
          - ''
          description: 'Role of the administering clinician: midwife, health-visitor, gp, perinatal-mh,
            or other.'
        care_setting:
          type: string
          enum:
          - maternity
          - community
          - general-practice
          - perinatal-mh
          - other
          - ''
          description: 'Care setting: maternity, community, general-practice, perinatal-mh, or other.'
        assessed_at:
          type: string
          format: date-time
          description: Date and time the assessment was performed.
        perinatal_stage:
          type: string
          enum:
          - antenatal
          - postnatal
          - ''
          description: 'Perinatal stage at assessment: antenatal or postnatal.'
        perinatal_week:
          type: number
          format: double
          description: Gestational week (antenatal) or postnatal week at assessment.
        respondent_identifier:
          type: string
          maxLength: 100
          description: Local respondent identifier as recorded on the assessment.
        age_band:
          type: string
          enum:
          - under-20
          - 20-29
          - 30-39
          - 40-plus
          - ''
          description: 'Respondent age band: under-20, 20-29, 30-39, or 40-plus.'
        preferred_language:
          type: string
          maxLength: 100
          description: Language the EPDS was completed in.
        assistance_needed:
          type: string
          enum:
          - none
          - interpreter
          - clinician-read
          - other
          - ''
          description: 'Assistance used to complete the EPDS: none, interpreter, clinician-read, or other.'
        item_1:
          type: integer
          format: int32
          description: Item 1 (able to laugh, normal-scored) response 0-3; NULL when unanswered.
        item_2:
          type: integer
          format: int32
          description: Item 2 (looked forward with enjoyment, normal-scored) response 0-3; NULL when unanswered.
        item_3:
          type: integer
          format: int32
          description: Item 3 (blamed myself unnecessarily, reverse-scored) response 0-3; NULL when unanswered.
        item_4:
          type: integer
          format: int32
          description: Item 4 (anxious or worried, normal-scored) response 0-3; NULL when unanswered.
        item_5:
          type: integer
          format: int32
          description: Item 5 (scared or panicky, reverse-scored) response 0-3; NULL when unanswered.
        item_6:
          type: integer
          format: int32
          description: Item 6 (things getting on top of me, reverse-scored) response 0-3; NULL when unanswered.
        item_7:
          type: integer
          format: int32
          description: Item 7 (unhappy, difficulty sleeping, reverse-scored) response 0-3; NULL when unanswered.
        item_8:
          type: integer
          format: int32
          description: Item 8 (sad or miserable, reverse-scored) response 0-3; NULL when unanswered.
        item_9:
          type: integer
          format: int32
          description: Item 9 (so unhappy, crying, reverse-scored) response 0-3; NULL when unanswered.
        item_10:
          type: integer
          format: int32
          description: Item 10 (thoughts of self-harm, reverse-scored) response 0-3; any value > 0 raises
            the mandatory self-harm safety flag. NULL when unanswered.
        clinical_note:
          type: string
          description: Free-text clinical note recorded with the assessment.
      required:
      - created_at
      - updated_at
      - patient_id
      - clinician_name
      - clinician_role
      - care_setting
      - perinatal_stage
      - respondent_identifier
      - age_band
      - preferred_language
      - assistance_needed
      - clinical_note
      description: 'Main EPDS assessment record: assessment context, respondent identification, and the
        ten already-reverse-corrected item responses (0-3 each, higher = more symptomatic).'
    EdinburghPostnatalDepressionScaleGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the row was soft-deleted.
        edinburgh_postnatal_depression_scale_id:
          type: string
          format: uuid
          description: Foreign key to the parent assessment (unique, 1:1).
        total_score:
          type: integer
          format: int32
          description: Summed EPDS score across the ten items (0-30 when complete; missing items contribute
            0).
        interpretation:
          type: string
          enum:
          - lower
          - possible
          - likely
          - ''
          description: 'Derived interpretation band: lower (< 10), possible (>= 10), or likely (>= 13)
            depression.'
        item_10_score:
          type: integer
          format: int32
          description: Item 10 (thoughts of self-harm) score 0-3, retained for the safety flag audit.
        self_harm_flag:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Mandatory self-harm flag: yes when item 10 > 0 (regardless of total), otherwise
            no.'
        graded_at:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the grade.
      required:
      - created_at
      - updated_at
      - edinburgh_postnatal_depression_scale_id
      - interpretation
      - self_harm_flag
      - graded_at
      description: 'Computed EPDS grading result: summed total (0-30), interpretation band (lower/possible/likely),
