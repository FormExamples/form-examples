components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Clinician full name.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as a single text block.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code.
        role:
          type: string
          enum:
          - midwife
          - health-visitor
          - gp
          - perinatal-mh
          - other
          - ''
          description: 'Primary clinical role: midwife, health-visitor, gp, perinatal-mh, or other.'
        registrationBody:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - GPhC
          - other
          - ''
          description: 'Professional registration body: GMC, NMC, HCPC, GPhC, or other.'
        registrationNumber:
          type: string
          description: Professional registration number issued by the registration body.
      required:
      - createdAt
      - updatedAt
      - name
      - role
      - registrationBody
      - registrationNumber
      description: Clinician identifying information for the clinician who administered the EPDS.
    EdinburghPostnatalDepressionScale:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the patient being assessed (delete restricted).
        clinicianId:
          type:
          - string
          - 'null'
          format: uuid
          description: Foreign key to the administering clinician (optional; delete restricted).
        clinicianName:
          type: string
          maxLength: 255
          description: Name of the administering clinician as recorded on the assessment.
        clinicianRole:
          type: string
          enum:
          - midwife
          - health-visitor
          - gp
          - perinatal-mh
          - other
          - ''
          description: 'Role of the administering clinician: midwife, health-visitor, gp, perinatal-mh,
            or other.'
        careSetting:
          type: string
          enum:
          - maternity
          - community
          - general-practice
          - perinatal-mh
          - other
          - ''
          description: 'Care setting: maternity, community, general-practice, perinatal-mh, or other.'
        assessedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Date and time the assessment was performed.
        perinatalStage:
          type: string
          enum:
          - antenatal
          - postnatal
          - ''
          description: 'Perinatal stage at assessment: antenatal or postnatal.'
        perinatalWeek:
          type:
          - number
          - 'null'
          format: double
          description: Gestational week (antenatal) or postnatal week at assessment.
        respondentIdentifier:
          type: string
          maxLength: 100
          description: Local respondent identifier as recorded on the assessment.
        ageBand:
          type: string
          enum:
          - under-20
          - 20-29
          - 30-39
          - 40-plus
          - ''
          description: 'Respondent age band: under-20, 20-29, 30-39, or 40-plus.'
        preferredLanguage:
          type: string
          maxLength: 100
          description: Language the EPDS was completed in.
        assistanceNeeded:
          type: string
          enum:
          - none
          - interpreter
          - clinician-read
          - other
          - ''
          description: 'Assistance used to complete the EPDS: none, interpreter, clinician-read, or other.'
        item1:
          type:
          - integer
          - 'null'
          format: int32
          description: Item 1 (able to laugh, normal-scored) response 0-3; NULL when unanswered.
        item2:
          type:
          - integer
          - 'null'
          format: int32
          description: Item 2 (looked forward with enjoyment, normal-scored) response 0-3; NULL when unanswered.
        item3:
          type:
          - integer
          - 'null'
          format: int32
          description: Item 3 (blamed myself unnecessarily, reverse-scored) response 0-3; NULL when unanswered.
        item4:
          type:
          - integer
          - 'null'
          format: int32
          description: Item 4 (anxious or worried, normal-scored) response 0-3; NULL when unanswered.
        item5:
          type:
          - integer
          - 'null'
          format: int32
          description: Item 5 (scared or panicky, reverse-scored) response 0-3; NULL when unanswered.
        item6:
          type:
          - integer
          - 'null'
          format: int32
          description: Item 6 (things getting on top of me, reverse-scored) response 0-3; NULL when unanswered.
        item7:
          type:
          - integer
          - 'null'
          format: int32
          description: Item 7 (unhappy, difficulty sleeping, reverse-scored) response 0-3; NULL when unanswered.
        item8:
          type:
          - integer
          - 'null'
          format: int32
          description: Item 8 (sad or miserable, reverse-scored) response 0-3; NULL when unanswered.
        item9:
          type:
          - integer
          - 'null'
          format: int32
          description: Item 9 (so unhappy, crying, reverse-scored) response 0-3; NULL when unanswered.
        item10:
          type:
          - integer
          - 'null'
          format: int32
          description: Item 10 (thoughts of self-harm, reverse-scored) response 0-3; any value > 0 raises
            the mandatory self-harm safety flag. NULL when unanswered.
        clinicalNote:
          type: string
          description: Free-text clinical note recorded with the assessment.
      required:
      - createdAt
      - updatedAt
      - patientId
      - clinicianName
      - clinicianRole
      - careSetting
      - perinatalStage
      - respondentIdentifier
      - ageBand
      - preferredLanguage
      - assistanceNeeded
      - clinicalNote
      description: 'Main EPDS assessment record: assessment context, respondent identification, and the
        ten already-reverse-corrected item responses (0-3 each, higher = more symptomatic).'
    EdinburghPostnatalDepressionScaleGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        edinburghPostnatalDepressionScaleId:
          type: string
          format: uuid
          description: Foreign key to the parent assessment (unique, 1:1).
        totalScore:
          type:
          - integer
          - 'null'
          format: int32
          description: Summed EPDS score across the ten items (0-30 when complete; missing items contribute
            0).
        interpretation:
          type: string
          enum:
          - lower
          - possible
          - likely
          - ''
          description: 'Derived interpretation band: lower (< 10), possible (>= 10), or likely (>= 13)
            depression.'
        item10Score:
          type:
          - integer
          - 'null'
          format: int32
          description: Item 10 (thoughts of self-harm) score 0-3, retained for the safety flag audit.
        selfHarmFlag:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Mandatory self-harm flag: yes when item 10 > 0 (regardless of total), otherwise
            no.'
        gradedAt:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the grade.
      required:
      - createdAt
      - updatedAt
      - edinburghPostnatalDepressionScaleId
      - interpretation
      - selfHarmFlag
      - gradedAt
      description: 'Computed EPDS grading result: summed total (0-30), interpretation band (lower/possible/likely),
        item 10 self-harm score, and mandatory self-harm flag.'
    EdinburghPostnatalDepressionScaleGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        edinburghPostnatalDepressionScaleGradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        flagId:
          type: string
          maxLength: 50
          description: Stable flag identifier (e.g. F-SELF-HARM-URGENT-001).
        category:
          type: string
          enum:
          - self-harm-urgent
          - likely-depression
          - possible-depression
          - elevated-anxiety
          - incomplete
          - other
          - ''
          description: Flag category (see CHECK constraint for enumeration).
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          - urgent
          - ''
          description: 'Priority: low, medium, high, or urgent (self-harm overrides all bands).'
        description:
          type: string
          maxLength: 500
          description: Human-readable description of what fired the flag.
        suggestedAction:
          type: string
          maxLength: 500
          description: Suggested clinical action (e.g. "perform an immediate self-harm risk assessment").
      required:
      - createdAt
      - updatedAt
      - edinburghPostnatalDepressionScaleGradeId
      - flagId
      - category
      - priority
      - description
      - suggestedAction
      description: Red-flag issues that fire independently of the band, with priority and a suggested
        action for the clinical team.
    EdinburghPostnatalDepressionScaleGradeRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        edinburghPostnatalDepressionScaleGradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        ruleId:
          type: string
          maxLength: 40
          description: Stable rule identifier (e.g. R-ITEM-10-SCORE-01).
        parameter:
          type: string
          enum:
          - item
          - total
          - band
          - self-harm
          - anxiety-subscale
          - other
          - ''
          description: 'Aspect the rule belongs to: item, total, band, self-harm, anxiety-subscale, or
            other.'
        points:
          type:
          - integer
          - 'null'
          format: int32
          description: Points (0-3) contributed by this rule, where applicable.
        category:
          type: string
          maxLength: 50
          description: Subject category (e.g. item-score, band-threshold, safety).
        description:
          type: string
          maxLength: 500
          description: Human-readable description of why the rule fired.
      required:
      - createdAt
      - updatedAt
      - edinburghPostnatalDepressionScaleGradeId
      - ruleId
      - parameter
      - category
      - description
      description: 'Audit trail of every grading rule that fired during EPDS computation: parameter, points
        contributed, category, and description.'
