    ElectrocardiogramTestRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        patient_id:
          type: string
          format: uuid
          description: Foreign key to the patient.
        clinician_id:
          type: string
          format: uuid
          description: Foreign key to the requesting clinician (referrer).
        status:
          type: string
          enum:
          - draft
          - submitted
          - vetted
          - scheduled
          - rejected
          - ''
          description: 'Request lifecycle status: draft, submitted, vetted, scheduled, rejected.'
        site_name:
          type: string
          maxLength: 255
          description: Name of the requesting site or clinic.
        setting:
          type: string
          enum:
          - outpatient
          - inpatient
          - community
          - emergency
          - ''
          description: 'Care setting: outpatient, inpatient, community, emergency.'
        referral_date:
          type: string
          format: date
          description: Date the referral was made.
        requested_by_date:
          type: string
          format: date
          description: Date by which the ECG is requested to be performed.
        ecg_type:
          type: string
          enum:
          - resting-12-lead
          - exercise-stress
          - ambulatory-holter-24h
          - ambulatory-48h
          - event-recorder
          - other
          - ''
          description: 'Requested ECG type: resting-12-lead, exercise-stress, ambulatory-holter-24h, ambulatory-48h,
            event-recorder, other.'
        primary_indication:
          type: string
          enum:
          - chest-pain
          - palpitations
          - syncope
          - suspected-arrhythmia
          - suspected-mi-acs
          - pre-operative
          - medication-monitoring-qt
          - hypertension
          - heart-failure
          - screening
          - follow-up
          - other
          - ''
          description: Primary clinical indication, used for appropriateness scoring.
        clinical_question:
          type: string
          maxLength: 1000
          description: Specific clinical question the ECG should answer (highest-value field).
        relevant_history:
          type: string
          maxLength: 1000
          description: Relevant cardiac and medical history.
        symptom_chest_pain:
          type: boolean
          description: Whether the patient reports chest pain.
        symptom_palpitations:
          type: boolean
          description: Whether the patient reports palpitations.
        symptom_syncope:
          type: boolean
          description: Whether the patient reports syncope or collapse.
        symptom_breathlessness:
          type: boolean
          description: Whether the patient reports breathlessness.
        symptom_dizziness:
          type: boolean
          description: Whether the patient reports dizziness or light-headedness.
        currently_symptomatic:
          type: boolean
          description: Whether the patient is symptomatic at the time of request (favours capturing the
            event).
        suspected_acs:
          type: boolean
          description: Whether acute coronary syndrome is suspected (red flag).
        known_arrhythmia:
          type: string
          enum:
          - none
          - atrial-fibrillation
          - svt
          - vt
          - heart-block
          - other
          - ''
          description: 'Known arrhythmia: none, atrial-fibrillation, svt, vt, heart-block, other.'
        relevant_medications:
          type: string
          maxLength: 1000
          description: Relevant current medications, especially QT-prolonging or rate-controlling agents.
        urgency:
          type: string
          enum:
          - routine
          - urgent
          - emergency
          - ''
          description: 'Requested triage urgency: routine, urgent, emergency.'
        supervising_consultant:
          type: string
          maxLength: 255
          description: Name of the supervising / responsible consultant.
        requester_contact:
          type: string
          maxLength: 255
          description: Contact details (bleep / phone) for the requester.
        notes:
          type: string
          maxLength: 1000
          description: Free-text additional notes.
