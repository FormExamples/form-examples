components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Name.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as full text.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code, such as for validating the postal address.
        role:
          type: string
          enum:
          - cardiologist
          - gp
          - hospital-doctor
          - nurse
          - physiologist
          - emergency-physician
          - other
          - ''
          description: 'Clinician role: cardiologist, gp, hospital-doctor, nurse, physiologist, emergency-physician,
            other.'
        registrationBody:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - other
          - ''
          description: 'Clinician registration body: GMC, NMC, HCPC, other.'
        registrationNumber:
          type: string
          description: Clinician registration number.
        unitedKingdomNhsNumber:
          type:
          - string
          - 'null'
          maxLength: 12
          description: United Kingdom NHS number, unique per person.
      required:
      - createdAt
      - updatedAt
      - name
      - role
      - registrationBody
      - registrationNumber
      description: Requesting clinician (referrer) who completes the electrocardiogram request.
    ElectrocardiogramTestRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the patient.
        clinicianId:
          type: string
          format: uuid
          description: Foreign key to the requesting clinician (referrer).
        status:
          type: string
          enum:
          - draft
          - submitted
          - vetted
          - scheduled
          - rejected
          - ''
          description: 'Request lifecycle status: draft, submitted, vetted, scheduled, rejected.'
        siteName:
          type: string
          maxLength: 255
          description: Name of the requesting site or clinic.
        setting:
          type: string
          enum:
          - outpatient
          - inpatient
          - community
          - emergency
          - ''
          description: 'Care setting: outpatient, inpatient, community, emergency.'
        referralDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the referral was made.
        requestedByDate:
          type:
          - string
          - 'null'
          format: date
          description: Date by which the ECG is requested to be performed.
        ecgType:
          type: string
          enum:
          - resting-12-lead
          - exercise-stress
          - ambulatory-holter-24h
          - ambulatory-48h
          - event-recorder
          - other
          - ''
          description: 'Requested ECG type: resting-12-lead, exercise-stress, ambulatory-holter-24h, ambulatory-48h,
            event-recorder, other.'
        primaryIndication:
          type: string
          enum:
          - chest-pain
          - palpitations
          - syncope
          - suspected-arrhythmia
          - suspected-mi-acs
          - pre-operative
          - medication-monitoring-qt
          - hypertension
          - heart-failure
          - screening
          - follow-up
          - other
          - ''
          description: Primary clinical indication, used for appropriateness scoring.
        clinicalQuestion:
          type: string
          maxLength: 1000
          description: Specific clinical question the ECG should answer (highest-value field).
        relevantHistory:
          type: string
          maxLength: 1000
          description: Relevant cardiac and medical history.
        symptomChestPain:
          type: boolean
          description: Whether the patient reports chest pain.
        symptomPalpitations:
          type: boolean
          description: Whether the patient reports palpitations.
        symptomSyncope:
          type: boolean
          description: Whether the patient reports syncope or collapse.
        symptomBreathlessness:
          type: boolean
          description: Whether the patient reports breathlessness.
        symptomDizziness:
          type: boolean
          description: Whether the patient reports dizziness or light-headedness.
        currentlySymptomatic:
          type: boolean
          description: Whether the patient is symptomatic at the time of request (favours capturing the
            event).
        suspectedAcs:
          type: boolean
          description: Whether acute coronary syndrome is suspected (red flag).
        knownArrhythmia:
          type: string
          enum:
          - none
          - atrial-fibrillation
          - svt
          - vt
          - heart-block
          - other
          - ''
          description: 'Known arrhythmia: none, atrial-fibrillation, svt, vt, heart-block, other.'
        relevantMedications:
          type: string
          maxLength: 1000
          description: Relevant current medications, especially QT-prolonging or rate-controlling agents.
        urgency:
          type: string
          enum:
          - routine
          - urgent
          - emergency
          - ''
          description: 'Requested triage urgency: routine, urgent, emergency.'
        supervisingConsultant:
          type: string
          maxLength: 255
          description: Name of the supervising / responsible consultant.
        requesterContact:
          type: string
          maxLength: 255
          description: Contact details (bleep / phone) for the requester.
        notes:
          type: string
          maxLength: 1000
          description: Free-text additional notes.
      required:
      - createdAt
      - updatedAt
      - patientId
      - clinicianId
      - status
      - siteName
      - setting
      - ecgType
      - primaryIndication
      - clinicalQuestion
      - relevantHistory
      - symptomChestPain
      - symptomPalpitations
      - symptomSyncope
      - symptomBreathlessness
      - symptomDizziness
      - currentlySymptomatic
      - suspectedAcs
      - knownArrhythmia
      - relevantMedications
      - urgency
      - supervisingConsultant
      - requesterContact
      - notes
      description: Electrocardiogram (ECG) test request (referral). Captures the requested ECG type, the
        clinical indication and question, relevant history and medications, symptoms / red flags, and
        triage urgency.
    ElectrocardiogramTestRequestGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        electrocardiogramTestRequestId:
          type: string
          format: uuid
          description: Foreign key to the parent request (unique, 1:1).
        appropriatenessScore:
          type:
          - integer
          - 'null'
          format: int32
          description: AHA/ACC ECG-use appropriateness score (1-9).
        appropriatenessBand:
          type: string
          enum:
          - usually-appropriate
          - may-be-appropriate
          - usually-not-appropriate
          - ''
          description: 'Appropriateness band: usually-appropriate (7-9), may-be-appropriate (4-6), usually-not-appropriate
            (1-3).'
        triageTier:
          type: string
          enum:
          - routine
          - urgent
          - emergency
          - ''
          description: 'Assigned urgency triage tier: routine, urgent, emergency.'
        targetTimeframe:
          type: string
          maxLength: 50
          description: Target timeframe for the ECG implied by the triage tier (e.g. same hour for suspected
            ACS).
        completenessPercent:
          type:
          - integer
          - 'null'
          format: int32
          description: Request completeness as a percentage of mandatory fields (0-100).
        priorityBand:
          type: string
          enum:
          - low
          - moderate
          - high
          - ''
          description: 'Overall clinical priority band: low, moderate, high.'
        recommendation:
          type: string
          enum:
          - accept
          - query-referrer
          - redirect
          - reject
          - ''
          description: 'Vetting recommendation: accept, query-referrer, redirect, reject.'
        clinicianNotes:
          type: string
          description: Free-text vetting notes.
        signedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Timestamp of vetting clinician electronic signature.
        gradedAt:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the result.
      required:
      - createdAt
      - updatedAt
      - electrocardiogramTestRequestId
      - appropriatenessBand
      - triageTier
      - targetTimeframe
      - priorityBand
      - recommendation
      - clinicianNotes
      - gradedAt
      description: 'Computed four-axis grading result: appropriateness (AHA/ACC 1-9), urgency triage tier,
        request completeness, and clinical priority.'
    ElectrocardiogramTestRequestGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        electrocardiogramTestRequestGradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        flagId:
          type: string
          maxLength: 50
          description: Stable flag identifier (e.g. F-SUSPECTED-ACS-001).
        category:
          type: string
          enum:
          - suspected-acs
          - active-chest-pain
          - syncope-red-flag
          - suspected-vt
          - missing-indication
          - missing-clinical-question
          - other
          - ''
          description: Flag category.
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          - ''
          description: 'Priority: low, medium, high.'
        description:
          type: string
          maxLength: 500
          description: Human-readable description of what fired the flag.
        suggestedAction:
          type: string
          maxLength: 500
          description: Suggested clinical action (e.g. "arrange same-hour emergency 12-lead ECG and senior
            review").
      required:
      - createdAt
      - updatedAt
      - electrocardiogramTestRequestGradeId
      - flagId
      - category
      - priority
      - description
      - suggestedAction
      description: Safety-critical flags that fire independently of the four axes, with priority and a
        suggested action for the cardiac physiology / triage team.
    ElectrocardiogramTestRequestGradeRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        electrocardiogramTestRequestGradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        ruleId:
          type: string
          maxLength: 40
          description: Stable rule identifier (e.g. R-APPROP-CHEST-PAIN-01).
        axis:
          type: string
          enum:
          - appropriateness
          - urgency
          - completeness
          - priority
          - ''
          description: 'Scoring axis the rule belongs to: appropriateness, urgency, completeness, priority.'
        category:
          type: string
          maxLength: 50
          description: Category or indication the rule relates to.
        description:
          type: string
          maxLength: 500
          description: Human-readable description of why the rule fired.
      required:
      - createdAt
      - updatedAt
      - electrocardiogramTestRequestGradeId
      - ruleId
      - axis
      - category
      - description
      description: Audit trail of every appropriateness / urgency / completeness / priority rule that
        fired for this request.
