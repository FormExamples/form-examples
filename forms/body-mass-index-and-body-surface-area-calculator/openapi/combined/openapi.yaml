components:
  schemas:
    BodyMassIndexAndBodySurfaceAreaCalculator:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the patient this calculation is for (restricted delete).
        clinicianId:
          type:
          - string
          - 'null'
          format: uuid
          description: Foreign key to the clinician who recorded the calculation (optional, restricted
            delete).
        clinicianName:
          type: string
          maxLength: 255
          description: Recording clinician name as entered on the form.
        clinicianRole:
          type: string
          enum:
          - doctor
          - nurse
          - pharmacist
          - dietitian
          - other
          - ''
          description: 'Recording clinician role: doctor, nurse, pharmacist, dietitian, or other.'
        assessedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Date and time the measurement was taken.
        careSetting:
          type: string
          enum:
          - primary-care
          - outpatient
          - inpatient
          - oncology
          - pre-operative
          - other
          - ''
          description: 'Care setting: primary-care, outpatient, inpatient, oncology, pre-operative, or
            other.'
        purpose:
          type: string
          enum:
          - screening
          - drug-dosing
          - monitoring
          - other
          - ''
          description: 'Purpose of the calculation: screening, drug-dosing, monitoring, or other.'
        patientIdentifier:
          type: string
          maxLength: 100
          description: Local patient identifier as recorded on the form.
        ageBand:
          type: string
          enum:
          - 18-39
          - 40-64
          - 65-74
          - 75-84
          - 85-plus
          - ''
          description: 'Adult age band: 18-39, 40-64, 65-74, 75-84, or 85-plus.'
        sex:
          type: string
          enum:
          - female
          - male
          - intersex
          - unknown
          - ''
          description: 'Patient sex recorded for clinical purposes: female, male, intersex, or unknown.'
        ancestry:
          type: string
          enum:
          - asian
          - other
          - unspecified
          - ''
          description: 'Patient ancestry for the Asian lower-threshold action points: asian, other, or
            unspecified.'
        heightCm:
          type:
          - number
          - 'null'
          format: double
          description: Measured height in centimetres (null when unanswered).
        weightKg:
          type:
          - number
          - 'null'
          format: double
          description: Measured weight in kilograms (null when unanswered).
        bsaFormula:
          type: string
          enum:
          - mosteller
          - du-bois
          - ''
          description: 'Preferred body-surface-area formula shown as primary: mosteller (default) or du-bois;
            both values are always computed.'
      required:
      - createdAt
      - updatedAt
      - patientId
      - clinicianName
      - clinicianRole
      - careSetting
      - purpose
      - patientIdentifier
      - ageBand
      - sex
      - ancestry
      - bsaFormula
      description: 'Main body-mass-index and body-surface-area calculation record: context and identification,
        plus the measured height and weight inputs and the preferred BSA formula.'
    BodyMassIndexAndBodySurfaceAreaCalculatorGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        bodyMassIndexAndBodySurfaceAreaCalculatorId:
          type: string
          format: uuid
          description: Foreign key to the parent calculation record (unique, 1:1).
        bmi:
          type:
          - number
          - 'null'
          format: double
          description: Body mass index in kg/m^2 at full precision (null when either input is missing);
            rounded to 1 decimal place for display.
        bmiCategory:
          type: string
          enum:
          - underweight
          - normal
          - overweight
          - obese-class-1
          - obese-class-2
          - obese-class-3
          - ''
          description: 'WHO adult weight-status category: underweight, normal, overweight, obese-class-1,
            obese-class-2, or obese-class-3.'
        bsaMosteller:
          type:
          - number
          - 'null'
          format: double
          description: Body surface area in m^2 by the Mosteller formula (null when either input is missing).
        bsaDuBois:
          type:
          - number
          - 'null'
          format: double
          description: Body surface area in m^2 by the Du Bois formula (null when either input is missing).
        gradedAt:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the result.
      required:
      - createdAt
      - updatedAt
      - bodyMassIndexAndBodySurfaceAreaCalculatorId
      - bmiCategory
      - gradedAt
      description: 'Computed anthropometry result: body mass index and its WHO adult weight-status category,
        plus both body-surface-area values (1:1 with the parent calculation record).'
    BodyMassIndexAndBodySurfaceAreaCalculatorGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        bodyMassIndexAndBodySurfaceAreaCalculatorGradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        flagId:
          type: string
          maxLength: 50
          description: Stable flag identifier (e.g. F-SEVERE-OBESITY-001).
        category:
          type: string
          enum:
          - severe-obesity
          - underweight
          - extreme-value
          - asian-high-risk
          - asian-increased-risk
          - incomplete
          - other
          - ''
          description: 'Flag category: severe-obesity, underweight, extreme-value, asian-high-risk, asian-increased-risk,
            incomplete, or other.'
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          - ''
          description: 'Priority: low, medium, high.'
        description:
          type: string
          maxLength: 500
          description: Human-readable description of what fired the flag.
        suggestedAction:
          type: string
          maxLength: 500
          description: Suggested clinical action (e.g. "consider specialist weight-management referral").
      required:
      - createdAt
      - updatedAt
      - bodyMassIndexAndBodySurfaceAreaCalculatorGradeId
      - flagId
      - category
      - priority
      - description
      - suggestedAction
      description: Safety-critical flags that fire independently of the BMI category, with priority and
        a suggested action for the recording clinician.
    BodyMassIndexAndBodySurfaceAreaCalculatorGradeRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        bodyMassIndexAndBodySurfaceAreaCalculatorGradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        ruleId:
          type: string
          maxLength: 40
          description: Stable rule identifier (e.g. R-BMI-BAND-OVERWEIGHT-01).
        instrument:
          type: string
          enum:
          - bmi
          - bsa
          - classification
          - threshold
          - composite
          description: 'Instrument the rule belongs to: bmi, bsa, classification, threshold, or composite.'
        band:
          type: string
          enum:
          - underweight
          - normal
          - overweight
          - obese-class-1
          - obese-class-2
          - obese-class-3
          - ''
          description: 'BMI category band contributed by this rule: underweight, normal, overweight, obese-class-1,
            obese-class-2, or obese-class-3.'
        category:
          type: string
          maxLength: 50
          description: Subject category (e.g. who-band, asian-threshold, plausibility, missing-input).
        description:
          type: string
          maxLength: 500
          description: Human-readable description of why the rule fired.
      required:
      - createdAt
      - updatedAt
      - bodyMassIndexAndBodySurfaceAreaCalculatorGradeId
      - ruleId
      - instrument
      - band
      - category
      - description
      description: 'Audit trail of every rule that fired during anthropometry computation: instrument,
        band, category, and description.'
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Clinician full name as recorded in the rota.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as a single text block.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code.
        role:
          type: string
          enum:
          - doctor
