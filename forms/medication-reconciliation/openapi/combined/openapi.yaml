components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Clinician full name as recorded in the rota.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as a single text block.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code.
        role:
          type: string
          enum:
          - pharmacist
          - pharmacy-technician
          - prescriber
          - nurse
          - other
          - ''
          description: 'Primary clinical role for the reconciliation: pharmacist, pharmacy-technician,
            prescriber, nurse, or other.'
        registrationBody:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - GPhC
          - other
          - ''
          description: 'Professional registration body: GMC, NMC, HCPC, GPhC, or other.'
        registrationNumber:
          type: string
          description: Professional registration number issued by the registration body.
      required:
      - createdAt
      - updatedAt
      - name
      - role
      - registrationBody
      - registrationNumber
      description: Clinician identifying information for the professional who reconciled the patient's
        medicines.
    MedicationReconciliation:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the patient this reconciliation is for (restricted delete).
        clinicianId:
          type:
          - string
          - 'null'
          format: uuid
          description: Foreign key to the reconciling clinician (restricted delete); optional.
        reconciliationType:
          type: string
          enum:
          - admission
          - transfer
          - discharge
          - ''
          description: 'Transition of care at which the reconciliation is performed: admission, transfer,
            or discharge.'
        careSetting:
          type: string
          enum:
          - emergency-department
          - acute-medical-unit
          - surgical-admissions
          - ward
          - critical-care
          - other
          - ''
          description: 'Care setting: emergency-department, acute-medical-unit, surgical-admissions, ward,
            critical-care, or other.'
        reconciledAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Date and time the reconciliation was carried out.
        clinicianName:
          type: string
          description: Name of the reconciling clinician as entered on the form.
        clinicianRole:
          type: string
          enum:
          - pharmacist
          - pharmacy-technician
          - prescriber
          - nurse
          - other
          - ''
          description: 'Role of the reconciling clinician: pharmacist, pharmacy-technician, prescriber,
            nurse, or other.'
        patientIdentifier:
          type: string
          description: Local patient identifier as entered on the form.
        ageBand:
          type: string
          enum:
          - adult
          - paediatric
          - ''
          description: 'Patient age band for dosing context: adult or paediatric.'
        sex:
          type: string
          enum:
          - female
          - male
          - intersex
          - unknown
          - ''
          description: 'Patient sex: female, male, intersex, or unknown.'
        weightKg:
          type:
          - number
          - 'null'
          format: double
          description: Patient weight in kilograms for weight-based dosing (nullable).
        allergyStatus:
          type: string
          enum:
          - documented
          - no-known-drug-allergies
          - not-documented
          - ''
          description: 'Patient allergy status: documented, no-known-drug-allergies, or not-documented.'
      required:
      - createdAt
      - updatedAt
      - patientId
      - reconciliationType
      - careSetting
      - clinicianName
      - clinicianRole
      - patientIdentifier
      - ageBand
      - sex
      - allergyStatus
      description: 'Parent medication-reconciliation header: transition-of-care context, care setting,
        reconciling clinician, patient identification, and patient-level allergy status.'
    MedicationReconciliationAllergy:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        medicationReconciliationId:
          type: string
          format: uuid
          description: Foreign key to the parent medication reconciliation.
        substance:
          type: string
          description: Drug or drug class the patient reacts to.
        reactionType:
          type: string
          enum:
          - allergy
          - intolerance
          - adverse-effect
          - unknown
          - ''
          description: 'Reaction type: allergy, intolerance, adverse-effect, or unknown.'
        severity:
          type: string
          enum:
          - mild
          - moderate
          - severe
          - anaphylaxis
          - ''
          description: 'Reaction severity: mild, moderate, severe, or anaphylaxis.'
      required:
      - createdAt
      - updatedAt
      - medicationReconciliationId
      - substance
      - reactionType
      - severity
      description: Drug allergies and adverse reactions recorded for the patient, cascading from the parent
        reconciliation.
    MedicationReconciliationDiscrepancy:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        medicationReconciliationId:
          type: string
          format: uuid
          description: Foreign key to the parent medication reconciliation.
        discrepancyType:
          type: string
          enum:
          - omission
          - commission
          - duplication
          - dose
          - frequency
          - route
          - formulation
          - ''
          description: 'Type of difference: omission, commission, duplication, dose, frequency, route,
            or formulation.'
        bpmhItemRef:
          type: string
          description: Reference to the matched BPMH line item (free text; empty when not applicable).
        inpatientItemRef:
          type: string
          description: Reference to the matched inpatient line item (free text; empty when not applicable).
        intendedAction:
          type: string
          enum:
          - continue
          - hold
          - stop
          - change
          - start
          - ''
          description: 'Documented action for an intentional discrepancy: continue, hold, stop, change,
            or start.'
        rationale:
          type: string
          description: Clinical reason for the intended action.
        intentional:
          type: boolean
          description: True when the discrepancy is a documented decision; false when unexplained (an
            error).
      required:
      - createdAt
      - updatedAt
      - medicationReconciliationId
      - discrepancyType
      - bpmhItemRef
      - inpatientItemRef
      - intendedAction
      - rationale
      - intentional
      description: Reconciliation discrepancies between the BPMH and the inpatient list, classified by
        type and by intentional / unintentional, cascading from the parent reconciliation.
    MedicationReconciliationGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        medicationReconciliationId:
          type: string
          format: uuid
          description: Foreign key to the parent medication reconciliation (unique, 1:1).
        status:
          type: string
          enum:
          - complete
          - discrepancies-outstanding
          - incomplete
          - ''
          description: 'Overall reconciliation status: complete, discrepancies-outstanding, or incomplete.'
        sourceCount:
          type: integer
          format: int32
          description: Number of independent information sources used to build the BPMH.
        unintentionalCount:
          type: integer
          format: int32
          description: Number of unintentional (unexplained) discrepancies outstanding.
        highRiskUnintentionalCount:
          type: integer
          format: int32
          description: Number of unintentional discrepancies on a high-risk medicine (anticoagulant, insulin,
            or opioid).
        gradedAt:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the grade.
      required:
      - createdAt
      - updatedAt
      - medicationReconciliationId
      - status
      - sourceCount
      - unintentionalCount
      - highRiskUnintentionalCount
      - gradedAt
      description: 'Computed reconciliation grading result: overall status and the derived source / unintentional
        / high-risk-unintentional counts.'
    MedicationReconciliationGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        medicationReconciliationGradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        flagId:
          type: string
          maxLength: 50
          description: Stable flag identifier (e.g. F-HIGH-RISK-UNINTENTIONAL-DISCREPANCY-001).
        category:
          type: string
          enum:
          - high-risk-unintentional-discrepancy
          - insufficient-sources
          - allergy-conflict
          - interaction
