          description: This client sent too many requests
          headers:
            retry-after:
              description: Seconds to wait before sending again
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/patients/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      summary: Fetch one Patient by id
      operationId: getPatient
      responses:
        '200':
          description: The requested Patient
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'
        '404':
          description: Patient not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: This client sent too many requests
          headers:
            retry-after:
              description: Seconds to wait before sending again
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    patch:
      summary: Update an existing Patient
      operationId: updatePatient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Patient'
      responses:
        '200':
          description: The updated Patient
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'
        '404':
          description: Patient not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: It duplicates a row, or refers to a missing one
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: The body does not match the schema, or a value is outside what its field allows
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: This client sent too many requests
          headers:
            retry-after:
              description: Seconds to wait before sending again
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    delete:
      summary: Delete a Patient
      operationId: deletePatient
      responses:
        '200':
          description: Patient deleted
        '404':
          description: Patient not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: This client sent too many requests
          headers:
            retry-after:
              description: Seconds to wait before sending again
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Clinician full name as recorded in the rota.
        email:
          type: string
          description: Email address.
        phone:
          type: string
          description: Phone number.
        postal_address_as_full_text:
          type: string
          description: Postal address as a single text block.
        country_as_iso_3166_1_alpha_2:
          type: string
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2.
        postcode:
          type: string
          description: Postal code.
        role:
          type: string
          enum:
          - pharmacist
          - pharmacy-technician
          - prescriber
          - nurse
          - other
          - ''
          description: 'Primary clinical role for the reconciliation: pharmacist, pharmacy-technician,
            prescriber, nurse, or other.'
        registration_body:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - GPhC
          - other
          - ''
          description: 'Professional registration body: GMC, NMC, HCPC, GPhC, or other.'
        registration_number:
          type: string
          description: Professional registration number issued by the registration body.
      required:
      - created_at
      - updated_at
      - name
      - role
      - registration_body
      - registration_number
      description: Clinician identifying information for the professional who reconciled the patient's
        medicines.
    MedicationReconciliation:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patient_id:
          type: string
          format: uuid
          description: Foreign key to the patient this reconciliation is for (restricted delete).
        clinician_id:
          type: string
          format: uuid
          description: Foreign key to the reconciling clinician (restricted delete); optional.
        reconciliation_type:
          type: string
          enum:
          - admission
          - transfer
          - discharge
          - ''
          description: 'Transition of care at which the reconciliation is performed: admission, transfer,
            or discharge.'
        care_setting:
          type: string
          enum:
          - emergency-department
          - acute-medical-unit
          - surgical-admissions
          - ward
          - critical-care
          - other
          - ''
          description: 'Care setting: emergency-department, acute-medical-unit, surgical-admissions, ward,
            critical-care, or other.'
        reconciled_at:
          type: string
          format: date-time
          description: Date and time the reconciliation was carried out.
        clinician_name:
          type: string
          description: Name of the reconciling clinician as entered on the form.
        clinician_role:
          type: string
          enum:
          - pharmacist
          - pharmacy-technician
          - prescriber
          - nurse
          - other
          - ''
          description: 'Role of the reconciling clinician: pharmacist, pharmacy-technician, prescriber,
            nurse, or other.'
        patient_identifier:
          type: string
          description: Local patient identifier as entered on the form.
        age_band:
          type: string
          enum:
          - adult
          - paediatric
          - ''
          description: 'Patient age band for dosing context: adult or paediatric.'
        sex:
          type: string
          enum:
          - female
          - male
          - intersex
          - unknown
          - ''
          description: 'Patient sex: female, male, intersex, or unknown.'
        weight_kg:
          type: number
          format: double
          description: Patient weight in kilograms for weight-based dosing (nullable).
        allergy_status:
          type: string
          enum:
          - documented
          - no-known-drug-allergies
          - not-documented
          - ''
          description: 'Patient allergy status: documented, no-known-drug-allergies, or not-documented.'
      required:
      - created_at
      - updated_at
      - patient_id
      - reconciliation_type
      - care_setting
      - clinician_name
      - clinician_role
      - patient_identifier
      - age_band
      - sex
      - allergy_status
      description: 'Parent medication-reconciliation header: transition-of-care context, care setting,
        reconciling clinician, patient identification, and patient-level allergy status.'
    MedicationReconciliationAllergy:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        medication_reconciliation_id:
          type: string
          format: uuid
          description: Foreign key to the parent medication reconciliation.
        substance:
          type: string
          description: Drug or drug class the patient reacts to.
        reaction_type:
          type: string
          enum:
          - allergy
          - intolerance
          - adverse-effect
          - unknown
          - ''
          description: 'Reaction type: allergy, intolerance, adverse-effect, or unknown.'
        severity:
          type: string
          enum:
          - mild
          - moderate
          - severe
          - anaphylaxis
          - ''
          description: 'Reaction severity: mild, moderate, severe, or anaphylaxis.'
      required:
      - created_at
      - updated_at
      - medication_reconciliation_id
      - substance
      - reaction_type
      - severity
      description: Drug allergies and adverse reactions recorded for the patient, cascading from the parent
        reconciliation.
    MedicationReconciliationDiscrepancy:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        medication_reconciliation_id:
          type: string
          format: uuid
          description: Foreign key to the parent medication reconciliation.
        discrepancy_type:
          type: string
          enum:
          - omission
          - commission
          - duplication
          - dose
          - frequency
          - route
          - formulation
          - ''
          description: 'Type of difference: omission, commission, duplication, dose, frequency, route,
            or formulation.'
        bpmh_item_ref:
          type: string
          description: Reference to the matched BPMH line item (free text; empty when not applicable).
        inpatient_item_ref:
          type: string
          description: Reference to the matched inpatient line item (free text; empty when not applicable).
        intended_action:
          type: string
          enum:
          - continue
          - hold
          - stop
          - change
          - start
          - ''
          description: 'Documented action for an intentional discrepancy: continue, hold, stop, change,
            or start.'
        rationale:
          type: string
          description: Clinical reason for the intended action.
        intentional:
          type: boolean
          description: True when the discrepancy is a documented decision; false when unexplained (an
            error).
      required:
      - created_at
      - updated_at
      - medication_reconciliation_id
      - discrepancy_type
      - bpmh_item_ref
      - inpatient_item_ref
      - intended_action
      - rationale
      - intentional
      description: Reconciliation discrepancies between the BPMH and the inpatient list, classified by
        type and by intentional / unintentional, cascading from the parent reconciliation.
    MedicationReconciliationGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        medication_reconciliation_id:
          type: string
          format: uuid
          description: Foreign key to the parent medication reconciliation (unique, 1:1).
        status:
          type: string
          enum:
          - complete
          - discrepancies-outstanding
          - incomplete
          - ''
          description: 'Overall reconciliation status: complete, discrepancies-outstanding, or incomplete.'
        source_count:
          type: integer
          format: int32
          description: Number of independent information sources used to build the BPMH.
        unintentional_count:
          type: integer
          format: int32
          description: Number of unintentional (unexplained) discrepancies outstanding.
        high_risk_unintentional_count:
          type: integer
          format: int32
          description: Number of unintentional discrepancies on a high-risk medicine (anticoagulant, insulin,
            or opioid).
        graded_at:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the grade.
      required:
      - created_at
      - updated_at
      - medication_reconciliation_id
      - status
      - source_count
      - unintentional_count
      - high_risk_unintentional_count
      - graded_at
      description: 'Computed reconciliation grading result: overall status and the derived source / unintentional
        / high-risk-unintentional counts.'
    MedicationReconciliationGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        medication_reconciliation_grade_id:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        flag_id:
          type: string
          maxLength: 50
          description: Stable flag identifier (e.g. F-HIGH-RISK-UNINTENTIONAL-DISCREPANCY-001).
        category:
          type: string
          enum:
          - high-risk-unintentional-discrepancy
          - insufficient-sources
          - allergy-conflict
          - interaction
          - therapeutic-duplication
          - unintentional-discrepancy-outstanding
          - allergy-status-not-documented
          - other
          - ''
          description: 'Flag category: high-risk-unintentional-discrepancy, insufficient-sources, allergy-conflict,
            interaction, therapeutic-duplication, unintentional-discrepancy-outstanding, allergy-status-not-documented,
            or other.'
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          - ''
          description: 'Priority: low, medium, high.'
        description:
          type: string
          maxLength: 500
          description: Human-readable description of what fired the flag.
        suggested_action:
          type: string
          maxLength: 500
          description: Suggested action (e.g. "resolve the unintentional anticoagulant discrepancy with
            the prescriber").
      required:
      - created_at
      - updated_at
      - medication_reconciliation_grade_id
      - flag_id
      - category
      - priority
      - description
      - suggested_action
      description: Safety flags raised independently of the reconciliation status, with priority, description,
        and a suggested action for the pharmacy or prescribing team.
    MedicationReconciliationGradeRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        medication_reconciliation_grade_id:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        rule_id:
          type: string
          maxLength: 40
          description: Stable rule identifier (e.g. R-STATUS-INCOMPLETE-01).
        category:
          type: string
          maxLength: 50
          description: Subject category (e.g. status, discrepancy-classification).
        description:
          type: string
          maxLength: 500
          description: Human-readable description of why the rule fired.
      required:
      - created_at
      - updated_at
      - medication_reconciliation_grade_id
      - rule_id
      - category
      - description
      description: 'Audit trail of every reconciliation rule that fired during grading: category and description.'
    MedicationReconciliationInformationSource:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        medication_reconciliation_id:
          type: string
          format: uuid
          description: Foreign key to the parent medication reconciliation.
        source_type:
          type: string
          enum:
          - patient-interview
          - carer-interview
          - gp-record
          - repeat-prescription
          - community-pharmacy
          - dispensing-history
          - previous-discharge-summary
          - own-drugs-bag
          - care-home-mar
          - ''
          description: 'Type of source: patient-interview, carer-interview, gp-record, repeat-prescription,
            community-pharmacy, dispensing-history, previous-discharge-summary, own-drugs-bag, or care-home-mar.'
        verified:
          type: boolean
          description: Whether the source was directly checked by the reconciling clinician.
      required:
      - created_at
      - updated_at
      - medication_reconciliation_id
      - source_type
      - verified
      description: Information sources used to build the best-possible medication history (BPMH), cascading
        from the parent reconciliation.
    MedicationReconciliationLineItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        medication_reconciliation_id:
          type: string
          format: uuid
          description: Foreign key to the parent medication reconciliation.
        list_source:
          type: string
          enum:
          - bpmh
          - inpatient
          - ''
          description: 'Which list this line belongs to: bpmh (best-possible medication history) or inpatient.'
        drug_name:
          type: string
          description: Generic (preferred) or brand name of the medicine.
        form:
          type: string
          description: Pharmaceutical form, e.g. tablet, capsule, injection, patch.
        dose:
          type: string
          description: Dose as free text to preserve units, e.g. "5 mg".
        route:
          type: string
          enum:
          - oral
          - iv
          - im
          - subcutaneous
          - topical
          - inhaled
          - other
          - ''
          description: 'Route of administration: oral, iv, im, subcutaneous, topical, inhaled, or other.'
        frequency:
          type: string
          description: Dosing frequency as free text, e.g. "once daily", "BD", "PRN".
        indication:
          type: string
          description: Reason the medicine is prescribed.
        high_risk_class:
          type: string
          enum:
          - none
          - anticoagulant
          - insulin
          - opioid
          - other
          - ''
          description: 'High-risk medicine class: none, anticoagulant, insulin, opioid, or other.'
        adherence:
          type: string
          enum:
          - taking
          - not-taking
          - intermittent
          - unknown
          - ''
          description: 'Patient adherence: taking, not-taking, intermittent, or unknown.'
        source_type:
          type: string
          enum:
          - patient-interview
          - carer-interview
          - gp-record
          - repeat-prescription
          - community-pharmacy
          - dispensing-history
          - previous-discharge-summary
          - own-drugs-bag
          - care-home-mar
          - ''
          description: 'Information source this line came from: patient-interview, carer-interview, gp-record,
            repeat-prescription, community-pharmacy, dispensing-history, previous-discharge-summary, own-drugs-bag,
            or care-home-mar.'
        status:
          type: string
          enum:
          - active
          - held
          - stopped
          - suspended
          - ''
          description: 'Prescribing status for inpatient rows: active, held, stopped, or suspended.'
      required:
      - created_at
      - updated_at
      - medication_reconciliation_id
      - list_source
      - drug_name
      - form
      - dose
      - route
      - frequency
      - indication
      - high_risk_class
      - adherence
      - source_type
      - status
      description: Medication line items on either list (BPMH or inpatient), discriminated by list_source,
        cascading from the parent reconciliation.
    Patient:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          maxLength: 255
          description: Full patient name as recorded on the wristband.
        birth_date:
          type: string
          format: date
          description: Date of birth.
        sex:
          type: string
          enum:
          - female
          - male
          - intersex
          - unknown
          - ''
          description: 'Sex recorded for clinical purposes: female, male, intersex, or unknown.'
        email:
          type: string
          description: Email address.
        phone:
          type: string
          description: Phone number.
        postal_address_as_full_text:
          type: string
          description: Postal address as a single text block.
        country_as_iso_3166_1_alpha_2:
          type: string
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2.
        postcode:
          type: string
          description: Postal code.
        united_kingdom_nhs_number:
          type: string
          maxLength: 20
          description: United Kingdom NHS number, unique per person.
        hospital_mrn:
          type: string
          maxLength: 50
          description: Local hospital medical record number (MRN).
        height_as_cm:
          type: number
          format: double
          description: Height in centimetres.
        weight_as_kg:
          type: number
          format: double
          description: Weight in kilograms.
        body_mass_index:
          type: number
          format: double
          description: Body mass index (BMI), kg/m^2.
        allergies_summary:
          type: string
          description: Free-text summary of the patient's known drug allergies.
      required:
      - created_at
      - updated_at
      - name
      - birth_date
      - sex
      - allergies_summary
      description: Patient demographic information used by the medication-reconciliation record.
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          description: A URI identifying the problem type
        title:
          type: string
          description: A short summary of the problem type
        status:
          type: integer
          description: The HTTP status code
        detail:
          type: string
          description: An explanation of this occurrence
        instance:
          type: string
          description: A URI identifying this occurrence
        code:
          type: string
          description: A short machine-readable reason
        errors:
          type: object
          description: Per-field detail, when validation failed
      required:
      - type
      - title
      - status
