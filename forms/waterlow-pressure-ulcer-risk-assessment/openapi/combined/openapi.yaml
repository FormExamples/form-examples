        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as a single text block.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code.
        role:
          type: string
          enum:
          - registered-nurse
          - healthcare-assistant
          - tissue-viability
          - other
          - ''
          description: 'Primary clinical role: registered-nurse, healthcare-assistant, tissue-viability,
            or other.'
        registrationBody:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - GPhC
          - other
          - ''
          description: 'Professional registration body: GMC, NMC, HCPC, GPhC, or other.'
        registrationNumber:
          type: string
          description: Professional registration number issued by the registration body.
