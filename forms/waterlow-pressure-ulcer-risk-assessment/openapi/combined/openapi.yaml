          type: string
          description: A short machine-readable reason
        errors:
          type: object
          description: Per-field detail, when validation failed
      required:
      - type
      - title
      - status
    WaterlowPressureUlcerRiskAssessment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the patient being assessed (delete restricted).
        clinicianId:
          type:
          - string
          - 'null'
          format: uuid
          description: Foreign key to the assessing clinician (optional; delete restricted).
        nurseName:
          type: string
          maxLength: 255
          description: Name of the assessing nurse as recorded on the assessment.
        nurseRole:
          type: string
          enum:
          - registered-nurse
          - healthcare-assistant
          - tissue-viability
          - other
          - ''
          description: 'Role of the assessing nurse: registered-nurse, healthcare-assistant, tissue-viability,
            or other.'
        assessedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Date and time the assessment was performed.
        careSetting:
          type: string
          enum:
          - acute-ward
          - community
          - care-home
          - hospice
          - other
          - ''
          description: 'Care setting: acute-ward, community, care-home, hospice, or other.'
        assessmentReason:
          type: string
          enum:
          - admission
          - routine
          - change-in-condition
          - ''
          description: 'Reason the assessment was performed: admission, routine, or change-in-condition.'
        patientIdentifier:
          type: string
          maxLength: 100
          description: Local patient identifier as recorded on the assessment.
        ageBand:
          type: string
          enum:
          - 14-49
          - 50-64
          - 65-74
          - 75-80
          - 81-plus
          - ''
          description: 'Adult age band scoring the age category: 14-49, 50-64, 65-74, 75-80, or 81-plus.'
        sex:
          type: string
          enum:
          - female
          - male
          - ''
          description: 'Patient sex scoring the sex category: female or male.'
        buildWeightForHeight:
          type: string
          enum:
          - average
          - above-average
          - obese
          - below-average
          - ''
          description: 'Core category — build / weight for height (BMI proxy): average, above-average,
            obese, or below-average.'
        skinType:
          type: string
          enum:
          - healthy
          - tissue-paper
          - dry
          - oedematous
          - clammy-pyrexial
          - discoloured
          - broken
          - ''
          description: 'Core category — skin type / visual risk area: healthy, tissue-paper, dry, oedematous,
            clammy-pyrexial, discoloured, or broken.'
        continence:
          type: string
          enum:
          - complete-catheterised
          - incontinent-urine
          - incontinent-faeces
          - doubly-incontinent
          - ''
          description: 'Core category — continence: complete-catheterised, incontinent-urine, incontinent-faeces,
            or doubly-incontinent.'
        mobility:
          type: string
          enum:
          - fully-mobile
          - restless
          - apathetic
          - restricted
          - bedbound
          - chairbound
          - ''
          description: 'Core category — mobility: fully-mobile, restless, apathetic, restricted, bedbound,
            or chairbound.'
        tissueMalnutrition:
          type: string
          enum:
          - none
          - smoking
          - anaemia
          - peripheral-vascular-disease
          - single-organ-failure
          - multiple-organ-failure
          - terminal-cachexia
          - ''
          description: 'Special-risk group — tissue malnutrition: none, smoking, anaemia, peripheral-vascular-disease,
            single-organ-failure, multiple-organ-failure, or terminal-cachexia.'
        neurologicalDeficit:
          type: string
          enum:
          - none
          - mild
          - moderate
          - severe
          - ''
          description: 'Special-risk group — neurological deficit: none, mild, moderate, or severe.'
        majorSurgeryTrauma:
          type: string
          enum:
          - none
          - orthopaedic-spinal
          - on-table-over-2h
          - on-table-over-6h
          - ''
          description: 'Special-risk group — major surgery or trauma: none, orthopaedic-spinal, on-table-over-2h,
            or on-table-over-6h.'
        medication:
          type: string
          enum:
          - none
          - high-dose-steroids-cytotoxics-anti-inflammatory
          - ''
          description: 'Special-risk group — medication: none, or high-dose-steroids-cytotoxics-anti-inflammatory.'
        existingPressureDamage:
          type: string
          enum:
          - 'no'
          - 'yes'
          - ''
          description: 'Whether existing pressure damage is present: no or yes. Drives an existing-pressure-damage
            flag.'
        clinicalNote:
          type: string
          description: Free-text clinical note recorded with the assessment.
      required:
      - createdAt
      - updatedAt
      - patientId
      - nurseName
      - nurseRole
      - careSetting
      - assessmentReason
      - patientIdentifier
      - ageBand
      - sex
      - buildWeightForHeight
      - skinType
