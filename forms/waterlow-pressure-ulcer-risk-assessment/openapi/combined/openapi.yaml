          type: string
          enum:
          - acute-ward
          - community
          - care-home
          - hospice
          - other
          - ''
          description: 'Care setting: acute-ward, community, care-home, hospice, or other.'
        assessment_reason:
          type: string
          enum:
          - admission
          - routine
          - change-in-condition
          - ''
          description: 'Reason the assessment was performed: admission, routine, or change-in-condition.'
        patient_identifier:
          type: string
          maxLength: 100
          description: Local patient identifier as recorded on the assessment.
        age_band:
          type: string
          enum:
          - 14-49
          - 50-64
          - 65-74
          - 75-80
          - 81-plus
          - ''
          description: 'Adult age band scoring the age category: 14-49, 50-64, 65-74, 75-80, or 81-plus.'
        sex:
          type: string
          enum:
          - female
          - male
          - ''
          description: 'Patient sex scoring the sex category: female or male.'
        build_weight_for_height:
          type: string
          enum:
          - average
          - above-average
          - obese
          - below-average
          - ''
          description: 'Core category — build / weight for height (BMI proxy): average, above-average,
            obese, or below-average.'
        skin_type:
          type: string
          enum:
          - healthy
          - tissue-paper
          - dry
          - oedematous
          - clammy-pyrexial
          - discoloured
          - broken
          - ''
          description: 'Core category — skin type / visual risk area: healthy, tissue-paper, dry, oedematous,
            clammy-pyrexial, discoloured, or broken.'
        continence:
          type: string
          enum:
          - complete-catheterised
          - incontinent-urine
          - incontinent-faeces
          - doubly-incontinent
          - ''
          description: 'Core category — continence: complete-catheterised, incontinent-urine, incontinent-faeces,
            or doubly-incontinent.'
        mobility:
          type: string
          enum:
          - fully-mobile
          - restless
          - apathetic
          - restricted
          - bedbound
          - chairbound
          - ''
          description: 'Core category — mobility: fully-mobile, restless, apathetic, restricted, bedbound,
            or chairbound.'
        tissue_malnutrition:
          type: string
          enum:
          - none
          - smoking
          - anaemia
          - peripheral-vascular-disease
          - single-organ-failure
          - multiple-organ-failure
          - terminal-cachexia
          - ''
          description: 'Special-risk group — tissue malnutrition: none, smoking, anaemia, peripheral-vascular-disease,
            single-organ-failure, multiple-organ-failure, or terminal-cachexia.'
        neurological_deficit:
          type: string
          enum:
          - none
          - mild
          - moderate
          - severe
          - ''
          description: 'Special-risk group — neurological deficit: none, mild, moderate, or severe.'
        major_surgery_trauma:
          type: string
          enum:
          - none
          - orthopaedic-spinal
          - on-table-over-2h
          - on-table-over-6h
          - ''
          description: 'Special-risk group — major surgery or trauma: none, orthopaedic-spinal, on-table-over-2h,
            or on-table-over-6h.'
        medication:
          type: string
          enum:
          - none
          - high-dose-steroids-cytotoxics-anti-inflammatory
          - ''
          description: 'Special-risk group — medication: none, or high-dose-steroids-cytotoxics-anti-inflammatory.'
        existing_pressure_damage:
          type: string
          enum:
          - 'no'
          - 'yes'
          - ''
          description: 'Whether existing pressure damage is present: no or yes. Drives an existing-pressure-damage
            flag.'
        clinical_note:
          type: string
          description: Free-text clinical note recorded with the assessment.
      required:
