components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Clinician full name.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as a single text block.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code.
        role:
          type: string
          enum:
          - hepatologist
          - gastroenterologist
          - transplant-coordinator
          - intensivist
          - other
          - ''
          description: 'Primary clinical role: hepatologist, gastroenterologist, transplant-coordinator,
            intensivist, or other.'
        registrationBody:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - GPhC
          - other
          - ''
          description: 'Professional registration body: GMC, NMC, HCPC, GPhC, or other.'
        registrationNumber:
          type: string
          description: Professional registration number issued by the registration body.
      required:
      - createdAt
      - updatedAt
      - name
      - role
      - registrationBody
      - registrationNumber
      description: Clinician identifying information for the assessing clinician.
    ModelForEndStageLiverDiseaseScore:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the patient being assessed (delete restricted).
        clinicianId:
          type:
          - string
          - 'null'
          format: uuid
          description: Foreign key to the assessing clinician (optional; delete restricted).
        clinicianName:
          type: string
          maxLength: 255
          description: Name of the assessing clinician as recorded on the assessment.
        clinicianRole:
          type: string
          enum:
          - hepatologist
          - gastroenterologist
          - transplant-coordinator
          - intensivist
          - other
          - ''
          description: 'Role of the assessing clinician: hepatologist, gastroenterologist, transplant-coordinator,
            intensivist, or other.'
        assessedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Date and time the assessment was performed.
        careSetting:
          type: string
          enum:
          - hepatology-clinic
          - transplant-unit
          - intensive-care
          - ward
          - other
          - ''
          description: 'Care setting: hepatology-clinic, transplant-unit, intensive-care, ward, or other.'
        meldVariant:
          type: string
          enum:
          - meld
          - meld-na
          - meld-3
          - ''
          description: 'Chosen MELD variant: meld (original), meld-na (sodium-corrected), or meld-3 (MELD
            3.0).'
        patientIdentifier:
          type: string
          maxLength: 100
          description: Local patient identifier as recorded on the assessment.
        ageBand:
          type: string
          enum:
          - 16-39
          - 40-59
          - 60-74
          - 75-plus
          - ''
          description: 'Adult age band: 16-39, 40-59, 60-74, or 75-plus.'
        sex:
          type: string
          enum:
          - female
          - male
          - intersex
          - unknown
          - ''
          description: 'Patient sex recorded for the assessment: female, male, intersex, or unknown (the
            female indicator is used by MELD 3.0).'
        bilirubin:
          type:
          - number
          - 'null'
          format: double
          description: Measured total bilirubin, in the unit given by bilirubin_unit.
        bilirubinUnit:
          type: string
          enum:
          - mg/dL
          - umol/L
          - ''
          description: 'Unit for the bilirubin value: mg/dL or umol/L (converted to mg/dL by the engine).'
        inr:
          type:
          - number
          - 'null'
          format: double
          description: International Normalised Ratio (INR) of prothrombin time.
        creatinine:
          type:
          - number
          - 'null'
          format: double
          description: Measured serum creatinine, in the unit given by creatinine_unit.
        creatinineUnit:
          type: string
          enum:
          - mg/dL
          - umol/L
          - ''
          description: 'Unit for the creatinine value: mg/dL or umol/L (converted to mg/dL by the engine).'
        dialysisSessionsPastWeek:
          type:
          - integer
          - 'null'
          format: int32
          description: Count of haemodialysis sessions in the past 7 days; >= 2 triggers the dialysis
            creatinine rule (creatinine set to 4.0 mg/dL).
        cvvhd24h:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the patient received >= 24 h of continuous veno-venous haemodialysis (CVVHD)
            in the past 7 days; yes triggers the dialysis creatinine rule.
        sodium:
          type:
          - number
          - 'null'
          format: double
          description: Serum sodium in mEq/L; used by the MELD-Na and MELD 3.0 variants (clamped to 125-137).
        albumin:
          type:
          - number
          - 'null'
          format: double
          description: Serum albumin in g/dL; used by the MELD 3.0 variant (clamped to 1.5-3.5).
        clinicalNote:
          type: string
          description: Free-text clinical note recorded with the assessment.
      required:
      - createdAt
      - updatedAt
      - patientId
      - clinicianName
      - clinicianRole
      - careSetting
      - meldVariant
      - patientIdentifier
      - ageBand
      - sex
      - bilirubinUnit
      - creatinineUnit
      - cvvhd24h
      - clinicalNote
      description: 'Main MELD assessment record: assessment context, patient identification, chosen MELD
        variant, and the laboratory inputs (total bilirubin, INR, serum creatinine, dialysis history,
        serum sodium, and serum albumin).'
    ModelForEndStageLiverDiseaseScoreGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        modelForEndStageLiverDiseaseScoreId:
          type: string
          format: uuid
          description: Foreign key to the parent assessment (unique, 1:1).
        bilirubinMgDl:
          type:
          - number
          - 'null'
          format: double
          description: Total bilirubin converted to mg/dL (from umol/L when required).
        creatinineMgDl:
          type:
          - number
          - 'null'
          format: double
          description: Serum creatinine converted to mg/dL (from umol/L when required), before the dialysis
            rule and bounds.
        creatinineAdjusted:
          type:
          - number
          - 'null'
          format: double
          description: Creatinine after the dialysis rule (set to 4.0 mg/dL when the rule applied), before
            the 1.0-4.0 bounds.
        dialysisRuleApplied:
          type: boolean
          description: True when the dialysis creatinine rule applied (>= 2 haemodialysis sessions in
            the past 7 days or >= 24 h CVVHD).
        meldScore:
          type:
          - integer
          - 'null'
          format: int32
          description: Integer MELD score clamped to 6-40; NULL when a required lab input for the chosen
            variant is missing.
        mortalityBand:
          type: string
          enum:
          - low
          - moderate
          - high
          - very-high
          - extreme
          - ''
          description: 'Mapped estimated 3-month mortality band: low, moderate, high, very-high, or extreme.'
        estimatedMortalityPercent:
          type:
          - number
          - 'null'
          format: double
          description: Estimated 3-month mortality as a percentage for the mapped band.
        gradedAt:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the grade.
      required:
      - createdAt
      - updatedAt
      - modelForEndStageLiverDiseaseScoreId
      - dialysisRuleApplied
      - mortalityBand
      - gradedAt
      description: 'Computed MELD grading result: derived intermediate values, the integer MELD score
        (6-40 when computable), the mapped 3-month mortality band, and the estimated mortality percentage.'
    ModelForEndStageLiverDiseaseScoreGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        modelForEndStageLiverDiseaseScoreGradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        flagId:
          type: string
          maxLength: 50
          description: Stable flag identifier (e.g. F-TRANSPLANT-REFERRAL-001).
        category:
          type: string
          enum:
          - transplant-referral
          - urgent-review
          - on-dialysis
          - hyponatraemia
          - coagulopathy
          - incomplete
          - other
          - ''
          description: 'Flag category: transplant-referral, urgent-review, on-dialysis, hyponatraemia,
            coagulopathy, incomplete, or other.'
        priority:
          type: string
          enum:
