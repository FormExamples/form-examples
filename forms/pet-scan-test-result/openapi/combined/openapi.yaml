components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        name:
          type: string
          description: Name.
        email:
          type: string
          description: Email address.
        phone:
          type: string
          description: Phone number.
        postal_address_as_full_text:
          type: string
          description: Postal address as full text.
        country_as_iso_3166_1_alpha_2:
          type: string
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type: string
          description: Postal code, such as for validating the postal address.
        role:
          type: string
          enum:
          - nuclear-medicine-physician
          - radiologist
          - consultant
          - other
          - ''
          description: 'Reporting clinician role: nuclear-medicine-physician, radiologist, consultant,
            other.'
        registration_body:
          type: string
          enum:
          - GMC
          - HCPC
          - other
          - ''
          description: 'Clinician registration body: GMC, HCPC, other.'
        registration_number:
          type: string
          description: Clinician registration number.
        united_kingdom_nhs_number:
          type: string
          maxLength: 12
          description: United Kingdom NHS number, unique per person.
      required:
      - created_at
      - updated_at
      - name
      - role
      - registration_body
      - registration_number
      description: Reporting clinician (nuclear-medicine physician or radiologist) who authors and signs
        the PET-CT scan result report.
    Patient:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        name:
          type: string
          maxLength: 255
          description: Name.
        birth_date:
          type: string
          format: date
          description: Birth date.
        email:
          type: string
          description: Email address.
        phone:
          type: string
          description: Phone number.
        postal_address_as_full_text:
          type: string
          description: Postal address as full text.
        country_as_iso_3166_1_alpha_2:
          type: string
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type: string
          description: Postal code, such as for validating the postal address.
        united_kingdom_nhs_number:
          type: string
          maxLength: 20
          description: United Kingdom NHS number, unique per person.
        waist_as_cm:
          type: number
          format: double
          description: Waist circumference measurement in cm, such as for calculating waist-height ratio
            (WHR).
        height_as_cm:
          type: number
          format: double
          description: Height measurement in cm, such as for calculating waist-height ratio (WHR).
        weight_as_kg:
          type: number
          format: double
          description: Weight as kg.
        body_mass_index:
          type: number
          format: double
          description: Body mass index (BMI) measurement.
        waist_height_ratio:
          type: number
          format: double
          description: Waist-height ratio (WHR) measurement.
        vo2_max:
          type: number
          format: double
          description: VO2 max measurement.
      required:
      - created_at
      - updated_at
      - name
      - birth_date
      description: Patient
    PetScanTestResult:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        patient_id:
          type: string
          format: uuid
          description: Foreign key to the patient.
        clinician_id:
          type: string
          format: uuid
          description: Foreign key to the reporting clinician (nuclear-medicine physician / radiologist).
        originating_request_reference:
          type: string
          maxLength: 255
          description: Free-text reference linking this report back to the originating PET-CT scan request
            (referral).
        scan_type:
          type: string
          enum:
          - fdg-pet-ct
          - psma-pet
          - dotatate-pet
          - amyloid-pet
          - cardiac-pet
          - other
          - ''
          description: 'PET tracer / scan type reported: fdg-pet-ct, psma-pet, dotatate-pet, amyloid-pet,
            cardiac-pet, other.'
        report_status:
          type: string
          enum:
          - preliminary
          - final
          - amended
          - cancelled
          - ''
          description: 'Report lifecycle status: preliminary, final, amended, cancelled.'
        performed_date:
          type: string
          format: date
          description: Date the PET-CT examination was performed.
        reported_date:
          type: string
          format: date
          description: Date the report was authored / signed.
        clinical_history:
          type: string
          maxLength: 1000
          description: Clinical history and the question the examination was performed to answer.
        blood_glucose_mmol_l:
          type: number
          format: double
          description: Pre-injection blood glucose in mmol/L; FDG uptake quality depends on glucose control,
            typically below 11 mmol/L.
        injected_activity_mbq:
          type: number
          format: double
          description: Administered radiopharmaceutical activity in megabecquerels (MBq), for dose audit.
        examination_adequacy:
          type: string
          enum:
          - adequate
          - limited
          - non-diagnostic
          - ''
          description: 'Diagnostic adequacy of the examination: adequate, limited, non-diagnostic.'
        findings_narrative:
          type: string
          maxLength: 2000
          description: Narrative description of the metabolic and CT findings (the body of the report).
        hypermetabolic_lesion:
          type: boolean
          description: Whether one or more abnormally hypermetabolic (FDG / tracer-avid) lesions are present.
        nodal_uptake:
          type: boolean
          description: Whether abnormal nodal (lymph-node) tracer uptake is present.
        distant_metastasis:
          type: boolean
          description: Whether distant metastatic tracer-avid disease is present.
        no_abnormal_uptake:
          type: boolean
          description: Whether the study shows no abnormal tracer uptake (negative / complete metabolic
            response).
        physiological_uptake_only:
          type: boolean
          description: Whether only normal physiological tracer uptake is present (e.g. brain, myocardium,
            bowel, urinary tract).
        incidental_finding:
          type: boolean
          description: Whether one or more incidental findings warranting documentation are present.
        suv_max:
          type: number
          format: double
          description: Maximum standardised uptake value (SUVmax) of the most-avid reference lesion.
        largest_lesion_size_mm:
          type: number
          format: double
          description: Largest lesion long-axis size in millimetres, for surveillance and categorisation.
        comparison_with_previous:
          type: string
          maxLength: 1000
          description: Comparison with relevant previous PET-CT or other imaging studies.
        treatment_response:
          type: string
          enum:
          - complete
          - partial
          - stable
          - progressive
          - not-applicable
          - ''
          description: 'Metabolic treatment-response category: complete, partial, stable, progressive,
            not-applicable.'
        impression:
          type: string
          maxLength: 2000
          description: Summary impression / conclusion answering the clinical question.
        reporting_category:
          type: string
          maxLength: 50
          description: Free-text structured-reporting label, e.g. a Deauville score (1-5) for lymphoma
            or a PERCIST response category.
        recommended_follow_up:
          type: string
          maxLength: 1000
          description: Recommended follow-up imaging, referral, or management.
        critical_result_communicated:
          type: boolean
          description: Whether a critical or unexpected significant result was communicated directly to
            the referrer.
        reported_to:
          type: string
          maxLength: 500
          description: Who the critical / urgent result was communicated to, with date and time if applicable.
      required:
      - created_at
      - updated_at
      - patient_id
      - clinician_id
      - originating_request_reference
      - scan_type
      - report_status
      - clinical_history
      - examination_adequacy
      - findings_narrative
      - hypermetabolic_lesion
      - nodal_uptake
      - distant_metastasis
      - no_abnormal_uptake
      - physiological_uptake_only
      - incidental_finding
      - comparison_with_previous
      - treatment_response
      - impression
      - reporting_category
      - recommended_follow_up
      - critical_result_communicated
      - reported_to
      description: PET-CT (positron emission tomography) scan result (report). Captures the tracer / scan
        type, the clinical history and acquisition data (blood glucose, injected activity), the narrative
        and structured metabolic findings, key measurements (SUVmax, largest lesion size), comparison
        and treatment response, the impression, the structured reporting category (e.g. Deauville score
        or PERCIST category), recommended follow-up, and critical-result communication. This is the source-of-truth
        record that the four-axis interpretation grade is computed from.
    PetScanTestResultGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        pet_scan_test_result_id:
          type: string
          format: uuid
          description: Foreign key to the parent result (unique, 1:1).
        result_classification:
          type: string
          enum:
          - normal
          - abnormal
          - critical
          - inconclusive
          - ''
          description: 'Axis A overall classification: normal, abnormal, critical, inconclusive.'
        abnormality_severity:
          type: string
          enum:
          - none
          - minor
          - moderate
          - major
          - ''
          description: 'Axis B abnormality severity: none, minor, moderate, major.'
        reporting_category:
          type: string
          maxLength: 50
          description: Axis B structured-reporting score / category label (e.g. a Deauville score 1-5
            for lymphoma or a PERCIST response category).
        report_completeness_percent:
          type: integer
          format: int32
          description: Axis C report completeness as a percentage of mandatory report sections (0-100).
        follow_up_urgency:
          type: string
          enum:
          - routine
          - recommended
          - urgent
          - critical-alert
          - ''
          description: 'Axis D follow-up urgency: routine, recommended, urgent, critical-alert.'
        target_timeframe:
          type: string
          maxLength: 50
          description: Target timeframe for the recommended follow-up implied by the urgency.
        recommended_action:
          type: string
          maxLength: 500
          description: Axis D concise recommended action derived from the urgency.
        recommendation:
          type: string
          enum:
          - no-action
          - routine-follow-up
          - further-imaging
