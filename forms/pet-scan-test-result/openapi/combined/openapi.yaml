components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Name.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as full text.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code, such as for validating the postal address.
        role:
          type: string
          enum:
          - nuclear-medicine-physician
          - radiologist
          - consultant
          - other
          - ''
          description: 'Reporting clinician role: nuclear-medicine-physician, radiologist, consultant,
            other.'
        registrationBody:
          type: string
          enum:
          - GMC
          - HCPC
          - other
          - ''
          description: 'Clinician registration body: GMC, HCPC, other.'
        registrationNumber:
          type: string
          description: Clinician registration number.
        unitedKingdomNhsNumber:
          type:
          - string
          - 'null'
          maxLength: 12
          description: United Kingdom NHS number, unique per person.
      required:
      - createdAt
      - updatedAt
      - name
      - role
      - registrationBody
      - registrationNumber
      description: Reporting clinician (nuclear-medicine physician or radiologist) who authors and signs
        the PET-CT scan result report.
    Patient:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          maxLength: 255
          description: Name.
        birthDate:
          type: string
          format: date
          description: Birth date.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as full text.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code, such as for validating the postal address.
        unitedKingdomNhsNumber:
          type:
          - string
          - 'null'
          maxLength: 20
          description: United Kingdom NHS number, unique per person.
        waistAsCm:
          type:
          - number
          - 'null'
          format: double
          description: Waist circumference measurement in cm, such as for calculating waist-height ratio
            (WHR).
        heightAsCm:
          type:
          - number
          - 'null'
          format: double
          description: Height measurement in cm, such as for calculating waist-height ratio (WHR).
        weightAsKg:
          type:
          - number
          - 'null'
          format: double
          description: Weight as kg.
        bodyMassIndex:
          type:
          - number
          - 'null'
          format: double
          description: Body mass index (BMI) measurement.
        waistHeightRatio:
          type:
          - number
          - 'null'
          format: double
          description: Waist-height ratio (WHR) measurement.
        vo2Max:
          type:
          - number
          - 'null'
          format: double
          description: VO2 max measurement.
      required:
      - createdAt
      - updatedAt
      - name
      - birthDate
      description: Patient
    PetScanTestResult:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the patient.
        clinicianId:
          type: string
          format: uuid
          description: Foreign key to the reporting clinician (nuclear-medicine physician / radiologist).
        originatingRequestReference:
          type: string
          maxLength: 255
          description: Free-text reference linking this report back to the originating PET-CT scan request
            (referral).
        scanType:
          type: string
          enum:
          - fdg-pet-ct
          - psma-pet
          - dotatate-pet
          - amyloid-pet
          - cardiac-pet
          - other
          - ''
          description: 'PET tracer / scan type reported: fdg-pet-ct, psma-pet, dotatate-pet, amyloid-pet,
            cardiac-pet, other.'
        reportStatus:
          type: string
          enum:
          - preliminary
          - final
          - amended
          - cancelled
          - ''
          description: 'Report lifecycle status: preliminary, final, amended, cancelled.'
        performedDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the PET-CT examination was performed.
        reportedDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the report was authored / signed.
        clinicalHistory:
          type: string
          maxLength: 1000
          description: Clinical history and the question the examination was performed to answer.
        bloodGlucoseMmolL:
          type:
          - number
          - 'null'
          format: double
          description: Pre-injection blood glucose in mmol/L; FDG uptake quality depends on glucose control,
            typically below 11 mmol/L.
        injectedActivityMbq:
          type:
          - number
          - 'null'
          format: double
          description: Administered radiopharmaceutical activity in megabecquerels (MBq), for dose audit.
        examinationAdequacy:
          type: string
          enum:
          - adequate
          - limited
          - non-diagnostic
          - ''
          description: 'Diagnostic adequacy of the examination: adequate, limited, non-diagnostic.'
        findingsNarrative:
          type: string
          maxLength: 2000
          description: Narrative description of the metabolic and CT findings (the body of the report).
        hypermetabolicLesion:
          type: boolean
          description: Whether one or more abnormally hypermetabolic (FDG / tracer-avid) lesions are present.
        nodalUptake:
          type: boolean
          description: Whether abnormal nodal (lymph-node) tracer uptake is present.
        distantMetastasis:
          type: boolean
          description: Whether distant metastatic tracer-avid disease is present.
        noAbnormalUptake:
          type: boolean
          description: Whether the study shows no abnormal tracer uptake (negative / complete metabolic
            response).
        physiologicalUptakeOnly:
          type: boolean
          description: Whether only normal physiological tracer uptake is present (e.g. brain, myocardium,
            bowel, urinary tract).
        incidentalFinding:
          type: boolean
          description: Whether one or more incidental findings warranting documentation are present.
        suvMax:
          type:
          - number
          - 'null'
          format: double
          description: Maximum standardised uptake value (SUVmax) of the most-avid reference lesion.
        largestLesionSizeMm:
          type:
          - number
          - 'null'
          format: double
          description: Largest lesion long-axis size in millimetres, for surveillance and categorisation.
        comparisonWithPrevious:
          type: string
          maxLength: 1000
          description: Comparison with relevant previous PET-CT or other imaging studies.
        treatmentResponse:
          type: string
          enum:
          - complete
          - partial
          - stable
          - progressive
          - not-applicable
          - ''
          description: 'Metabolic treatment-response category: complete, partial, stable, progressive,
            not-applicable.'
        impression:
          type: string
          maxLength: 2000
          description: Summary impression / conclusion answering the clinical question.
        reportingCategory:
          type: string
          maxLength: 50
          description: Free-text structured-reporting label, e.g. a Deauville score (1-5) for lymphoma
            or a PERCIST response category.
        recommendedFollowUp:
          type: string
          maxLength: 1000
          description: Recommended follow-up imaging, referral, or management.
        criticalResultCommunicated:
          type: boolean
          description: Whether a critical or unexpected significant result was communicated directly to
            the referrer.
        reportedTo:
          type: string
          maxLength: 500
          description: Who the critical / urgent result was communicated to, with date and time if applicable.
      required:
      - createdAt
      - updatedAt
      - patientId
      - clinicianId
      - originatingRequestReference
      - scanType
      - reportStatus
      - clinicalHistory
      - examinationAdequacy
      - findingsNarrative
      - hypermetabolicLesion
      - nodalUptake
      - distantMetastasis
      - noAbnormalUptake
      - physiologicalUptakeOnly
      - incidentalFinding
      - comparisonWithPrevious
      - treatmentResponse
      - impression
      - reportingCategory
      - recommendedFollowUp
      - criticalResultCommunicated
      - reportedTo
      description: PET-CT (positron emission tomography) scan result (report). Captures the tracer / scan
        type, the clinical history and acquisition data (blood glucose, injected activity), the narrative
        and structured metabolic findings, key measurements (SUVmax, largest lesion size), comparison
        and treatment response, the impression, the structured reporting category (e.g. Deauville score
        or PERCIST category), recommended follow-up, and critical-result communication. This is the source-of-truth
        record that the four-axis interpretation grade is computed from.
    PetScanTestResultGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        petScanTestResultId:
          type: string
          format: uuid
          description: Foreign key to the parent result (unique, 1:1).
        resultClassification:
          type: string
          enum:
          - normal
          - abnormal
          - critical
          - inconclusive
          - ''
          description: 'Axis A overall classification: normal, abnormal, critical, inconclusive.'
        abnormalitySeverity:
          type: string
          enum:
          - none
          - minor
          - moderate
          - major
          - ''
          description: 'Axis B abnormality severity: none, minor, moderate, major.'
        reportingCategory:
          type: string
          maxLength: 50
          description: Axis B structured-reporting score / category label (e.g. a Deauville score 1-5
            for lymphoma or a PERCIST response category).
        reportCompletenessPercent:
          type:
          - integer
          - 'null'
          format: int32
          description: Axis C report completeness as a percentage of mandatory report sections (0-100).
        followUpUrgency:
          type: string
          enum:
          - routine
          - recommended
          - urgent
          - critical-alert
          - ''
          description: 'Axis D follow-up urgency: routine, recommended, urgent, critical-alert.'
        targetTimeframe:
          type: string
          maxLength: 50
          description: Target timeframe for the recommended follow-up implied by the urgency.
        recommendedAction:
          type: string
          maxLength: 500
          description: Axis D concise recommended action derived from the urgency.
        recommendation:
          type: string
          enum:
          - no-action
          - routine-follow-up
          - further-imaging
          - specialist-referral
          - urgent-review
          - ''
          description: 'Overall recommendation: no-action, routine-follow-up, further-imaging, specialist-referral,
            urgent-review.'
        clinicianNotes:
          type: string
          description: Free-text interpretation / sign-off notes.
        signedAt:
          type:
          - string
          - 'null'
          format: date-time
