          type: string
          enum:
          - emergency-department
          - ward
          - endoscopy-unit
          - other
          - ''
          description: 'Care setting: emergency-department, ward, endoscopy-unit, or other.'
        presenting_complaint:
          type: string
          description: Presenting complaint free text (e.g. haematemesis, melaena, coffee-ground vomiting).
        patient_identifier:
          type: string
          maxLength: 100
          description: Local patient identifier as recorded on the assessment.
        age_years:
          type: integer
          format: int32
          description: Clinical parameter — patient age in whole years; scores 0 (<60), 1 (60-79), or
            2 (>=80).
        sex:
          type: string
          enum:
          - female
          - male
          - intersex
          - unknown
          - ''
          description: 'Patient sex recorded for the assessment: female, male, intersex, or unknown.'
        systolic_blood_pressure_mmhg:
          type: integer
          format: int32
          description: Clinical parameter (shock) — systolic blood pressure in mmHg; SBP < 100 scores
            2 (hypotension).
        heart_rate_bpm:
          type: integer
          format: int32
          description: Clinical parameter (shock) — pulse in beats per minute; HR >= 100 scores 1 (tachycardia)
