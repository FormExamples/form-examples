          type:
          - string
          - 'null'
          format: date-time
          description: Date and time the assessment was performed.
        careSetting:
          type: string
          enum:
          - emergency-department
          - ward
          - endoscopy-unit
          - other
          - ''
          description: 'Care setting: emergency-department, ward, endoscopy-unit, or other.'
        presentingComplaint:
          type: string
          description: Presenting complaint free text (e.g. haematemesis, melaena, coffee-ground vomiting).
