          type:
          - integer
          - 'null'
          format: int32
          description: Clinical parameter (shock) — systolic blood pressure in mmHg; SBP < 100 scores
            2 (hypotension).
        heartRateBpm:
          type:
          - integer
          - 'null'
          format: int32
          description: Clinical parameter (shock) — pulse in beats per minute; HR >= 100 scores 1 (tachycardia)
