        stigmataRecentHaemorrhage:
          type: string
          enum:
          - none-or-dark-spot
          - high-risk
          - ''
          description: 'Endoscopic parameter (full score only) — stigmata of recent haemorrhage: none-or-dark-spot
            (0) or high-risk (blood in upper GI tract, adherent clot, or visible / spurting vessel, 2).'
        clinicalNote:
          type: string
          description: Free-text clinical note recorded with the assessment.
