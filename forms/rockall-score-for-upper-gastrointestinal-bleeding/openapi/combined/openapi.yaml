        comorbidity:
          type: string
          enum:
          - none
          - major
          - severe
          - ''
          description: 'Clinical parameter — comorbidity: none (0), major (cardiac failure / ischaemic
            heart disease / any major comorbidity, 2), or severe (renal failure / liver failure / disseminated
            malignancy, 3).'
        endoscopy_performed:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether endoscopy has been performed (yes / no); gates computation of the full
            post-endoscopy score.
        diagnosis:
          type: string
          enum:
          - mallory-weiss-or-none
          - all-other
          - upper-gi-malignancy
          - ''
          description: 'Endoscopic parameter (full score only) — diagnosis: mallory-weiss-or-none (0),
            all-other (1), or upper-gi-malignancy (2).'
        stigmata_recent_haemorrhage:
          type: string
          enum:
          - none-or-dark-spot
          - high-risk
          - ''
          description: 'Endoscopic parameter (full score only) — stigmata of recent haemorrhage: none-or-dark-spot
            (0) or high-risk (blood in upper GI tract, adherent clot, or visible / spurting vessel, 2).'
        clinical_note:
          type: string
          description: Free-text clinical note recorded with the assessment.
