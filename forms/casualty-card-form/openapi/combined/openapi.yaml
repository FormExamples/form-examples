components:
  schemas:
    CasualtyCard:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        patientId:
          type: string
          format: uuid
          description: FK to patient. One patient may have many casualty cards.
        status:
          type: string
          enum:
          - in_progress
          - completed
          - reviewed
          - ''
          description: 'Workflow status: in_progress, completed, reviewed, or empty string if unanswered.'
        attendanceDate:
          type:
          - string
          - 'null'
          format: date
          description: Date of ED attendance. NULL if not recorded.
        arrivalTime:
          type:
          - string
          - 'null'
          format: date-time
          description: Timestamp of patient arrival at the department. NULL if not recorded.
      required:
      - createdAt
      - updatedAt
      - patientId
      - status
      description: A single ED or MIU attendance record. Child tables hold section-specific clinical data.
    CasualtyCardAllergy:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        casualtyCardId:
          type: string
          format: uuid
          description: FK to casualty_card. One casualty card may have many allergies.
        allergen:
          type: string
          description: Name of the allergen (e.g. Penicillin, Latex).
        reaction:
          type: string
          description: Description of the allergic reaction.
        severity:
          type: string
          enum:
          - mild
          - moderate
          - anaphylaxis
          - ''
          description: 'Allergy severity: mild, moderate, anaphylaxis, or empty string if unanswered.'
        sortOrder:
          type: integer
          format: int32
          description: Display ordering for consistent list rendering.
      required:
      - createdAt
      - updatedAt
      - casualtyCardId
      - allergen
      - reaction
      - severity
      - sortOrder
      description: Many-to-one with casualty_card. Each row is one documented allergy.
    CasualtyCardArrivalTriage:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        casualtyCardId:
          type: string
          format: uuid
          description: FK to casualty_card (UNIQUE = 1:1 relationship).
        attendanceCategory:
          type: string
          enum:
          - first
          - follow-up
          - planned
          - unplanned
          - ''
          description: 'Attendance classification: first, follow-up, planned, unplanned, or empty string
            if unanswered.'
        arrivalMode:
          type: string
          enum:
          - ambulance
          - walk-in
          - helicopter
          - police
          - other
          - ''
          description: 'How the patient arrived: ambulance, walk-in, helicopter, police, other, or empty
            string if unanswered.'
        referralSource:
          type: string
          enum:
          - self
          - gp
          - '999'
          - nhs111
          - other-hospital
          - police
          - other
          - ''
          description: 'Who referred the patient: self, gp, 999, nhs111, other-hospital, police, other,
            or empty string if unanswered.'
        ambulanceIncidentNumber:
          type: string
          description: Ambulance service incident reference number.
        triageTime:
          type:
          - string
          - 'null'
          format: date-time
          description: Timestamp when triage was performed. NULL if not recorded.
        triageNurse:
          type: string
          description: Name of the triage nurse who assessed the patient.
        mtsFlowchart:
          type: string
          description: Manchester Triage System flowchart used for triage assessment.
        mtsCategory:
          type: string
          enum:
          - 1-immediate
          - 2-very-urgent
          - 3-urgent
          - 4-standard
          - 5-non-urgent
          - ''
          description: 'MTS urgency category: 1-immediate, 2-very-urgent, 3-urgent, 4-standard, 5-non-urgent,
            or empty string if unanswered.'
        mtsDiscriminator:
          type: string
          description: MTS discriminator that determined the triage category.
      required:
      - createdAt
      - updatedAt
      - casualtyCardId
      - attendanceCategory
      - arrivalMode
      - referralSource
      - ambulanceIncidentNumber
      - triageNurse
      - mtsFlowchart
      - mtsCategory
      - mtsDiscriminator
      description: 1:1 with casualty_card. Arrival mode, referral source, and Manchester Triage System
        assessment.
    CasualtyCardAssessmentPlan:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        casualtyCardId:
          type: string
          format: uuid
          description: FK to casualty_card (UNIQUE = 1:1 relationship).
        workingDiagnosis:
          type: string
          description: Primary working diagnosis based on clinical assessment.
        differentialDiagnoses:
          type: string
          description: List of differential diagnoses being considered.
        clinicalImpression:
          type: string
          description: Overall clinical impression and summary of findings.
        riskStratification:
          type: string
          description: Risk stratification assessment (e.g. HEART score, Wells score results).
      required:
      - createdAt
      - updatedAt
      - casualtyCardId
      - workingDiagnosis
      - differentialDiagnoses
      - clinicalImpression
      - riskStratification
      description: 1:1 with casualty_card. Working diagnosis, differentials, clinical impression, and
        risk stratification.
    CasualtyCardClinicalExamination:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        casualtyCardId:
          type: string
          format: uuid
          description: FK to casualty_card (UNIQUE = 1:1 relationship).
        generalAppearance:
          type: string
          description: General appearance (e.g. alert, distressed, comfortable, unwell).
        headAndFace:
          type: string
          description: Head and face examination findings.
        neck:
          type: string
          description: Neck examination findings (e.g. JVP, lymphadenopathy, c-spine tenderness).
        chestCardiovascular:
          type: string
          description: Cardiovascular examination findings (e.g. heart sounds, murmurs, oedema).
        chestRespiratory:
          type: string
          description: Respiratory examination findings (e.g. air entry, added sounds).
        abdomen:
          type: string
          description: Abdominal examination findings (e.g. soft, tender, guarding, bowel sounds).
        pelvis:
          type: string
          description: Pelvic examination findings (e.g. stable, spring test).
        musculoskeletalLimbs:
          type: string
          description: Musculoskeletal and limb examination findings.
        neurological:
          type: string
          description: Neurological examination findings (e.g. power, sensation, reflexes, cranial nerves).
        skin:
          type: string
          description: Skin examination findings (e.g. rash, wounds, bruising, cellulitis).
        mentalState:
          type: string
          description: Mental state assessment findings.
        bodyDiagramNotes:
          type: string
          description: Free-text notes to accompany body diagram markings.
      required:
      - createdAt
      - updatedAt
      - casualtyCardId
      - generalAppearance
      - headAndFace
      - neck
      - chestCardiovascular
      - chestRespiratory
      - abdomen
      - pelvis
      - musculoskeletalLimbs
      - neurological
      - skin
