components:
  schemas:
    CasualtyCard:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        patient_id:
          type: string
          format: uuid
          description: FK to patient. One patient may have many casualty cards.
        status:
          type: string
          enum:
          - in_progress
          - completed
          - reviewed
          - ''
          description: 'Workflow status: in_progress, completed, reviewed, or empty string if unanswered.'
        attendance_date:
          type: string
          format: date
          description: Date of ED attendance. NULL if not recorded.
        arrival_time:
          type: string
          format: date-time
          description: Timestamp of patient arrival at the department. NULL if not recorded.
      required:
      - created_at
      - updated_at
      - patient_id
      - status
      description: A single ED or MIU attendance record. Child tables hold section-specific clinical data.
    CasualtyCardAllergy:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        casualty_card_id:
          type: string
          format: uuid
          description: FK to casualty_card. One casualty card may have many allergies.
        allergen:
          type: string
          description: Name of the allergen (e.g. Penicillin, Latex).
        reaction:
          type: string
          description: Description of the allergic reaction.
        severity:
          type: string
          enum:
          - mild
          - moderate
          - anaphylaxis
          - ''
          description: 'Allergy severity: mild, moderate, anaphylaxis, or empty string if unanswered.'
        sort_order:
          type: integer
          format: int32
          description: Display ordering for consistent list rendering.
      required:
      - created_at
      - updated_at
      - casualty_card_id
      - allergen
      - reaction
      - severity
      - sort_order
      description: Many-to-one with casualty_card. Each row is one documented allergy.
    CasualtyCardArrivalTriage:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        casualty_card_id:
          type: string
          format: uuid
          description: FK to casualty_card (UNIQUE = 1:1 relationship).
        attendance_category:
          type: string
          enum:
          - first
          - follow-up
          - planned
          - unplanned
          - ''
          description: 'Attendance classification: first, follow-up, planned, unplanned, or empty string
            if unanswered.'
        arrival_mode:
          type: string
          enum:
          - ambulance
          - walk-in
          - helicopter
          - police
          - other
          - ''
          description: 'How the patient arrived: ambulance, walk-in, helicopter, police, other, or empty
            string if unanswered.'
        referral_source:
          type: string
          enum:
          - self
          - gp
          - '999'
          - nhs111
          - other-hospital
          - police
          - other
          - ''
          description: 'Who referred the patient: self, gp, 999, nhs111, other-hospital, police, other,
            or empty string if unanswered.'
        ambulance_incident_number:
          type: string
          description: Ambulance service incident reference number.
        triage_time:
          type: string
          format: date-time
          description: Timestamp when triage was performed. NULL if not recorded.
        triage_nurse:
          type: string
          description: Name of the triage nurse who assessed the patient.
        mts_flowchart:
          type: string
          description: Manchester Triage System flowchart used for triage assessment.
        mts_category:
          type: string
          enum:
          - 1-immediate
          - 2-very-urgent
          - 3-urgent
          - 4-standard
          - 5-non-urgent
          - ''
          description: 'MTS urgency category: 1-immediate, 2-very-urgent, 3-urgent, 4-standard, 5-non-urgent,
            or empty string if unanswered.'
        mts_discriminator:
          type: string
          description: MTS discriminator that determined the triage category.
      required:
      - created_at
      - updated_at
      - casualty_card_id
      - attendance_category
      - arrival_mode
      - referral_source
      - ambulance_incident_number
      - triage_nurse
      - mts_flowchart
      - mts_category
      - mts_discriminator
      description: 1:1 with casualty_card. Arrival mode, referral source, and Manchester Triage System
        assessment.
    CasualtyCardAssessmentPlan:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        casualty_card_id:
          type: string
          format: uuid
          description: FK to casualty_card (UNIQUE = 1:1 relationship).
        working_diagnosis:
          type: string
          description: Primary working diagnosis based on clinical assessment.
        differential_diagnoses:
          type: string
          description: List of differential diagnoses being considered.
        clinical_impression:
          type: string
          description: Overall clinical impression and summary of findings.
        risk_stratification:
          type: string
          description: Risk stratification assessment (e.g. HEART score, Wells score results).
      required:
      - created_at
      - updated_at
      - casualty_card_id
      - working_diagnosis
      - differential_diagnoses
      - clinical_impression
      - risk_stratification
      description: 1:1 with casualty_card. Working diagnosis, differentials, clinical impression, and
        risk stratification.
    CasualtyCardClinicalExamination:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        casualty_card_id:
          type: string
          format: uuid
          description: FK to casualty_card (UNIQUE = 1:1 relationship).
        general_appearance:
          type: string
          description: General appearance (e.g. alert, distressed, comfortable, unwell).
        head_and_face:
          type: string
          description: Head and face examination findings.
        neck:
          type: string
          description: Neck examination findings (e.g. JVP, lymphadenopathy, c-spine tenderness).
        chest_cardiovascular:
          type: string
          description: Cardiovascular examination findings (e.g. heart sounds, murmurs, oedema).
        chest_respiratory:
          type: string
          description: Respiratory examination findings (e.g. air entry, added sounds).
        abdomen:
          type: string
          description: Abdominal examination findings (e.g. soft, tender, guarding, bowel sounds).
        pelvis:
          type: string
          description: Pelvic examination findings (e.g. stable, spring test).
        musculoskeletal_limbs:
          type: string
          description: Musculoskeletal and limb examination findings.
        neurological:
          type: string
          description: Neurological examination findings (e.g. power, sensation, reflexes, cranial nerves).
        skin:
          type: string
          description: Skin examination findings (e.g. rash, wounds, bruising, cellulitis).
        mental_state:
          type: string
          description: Mental state assessment findings.
        body_diagram_notes:
          type: string
          description: Free-text notes to accompany body diagram markings.
      required:
      - created_at
      - updated_at
      - casualty_card_id
      - general_appearance
      - head_and_face
      - neck
      - chest_cardiovascular
      - chest_respiratory
      - abdomen
      - pelvis
      - musculoskeletal_limbs
      - neurological
      - skin
      - mental_state
      - body_diagram_notes
      description: 1:1 with casualty_card. Systems-based clinical examination findings.
    CasualtyCardDemographics:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        casualty_card_id:
          type: string
          format: uuid
          description: FK to casualty_card (UNIQUE = 1:1 relationship).
        address:
          type: string
          description: Patient address at time of attendance.
        postcode:
          type: string
          description: Patient postcode at time of attendance.
        phone:
          type: string
          description: Patient phone number at time of attendance.
        email:
          type: string
          description: Patient email address at time of attendance.
        ethnicity:
          type: string
          description: Patient ethnicity at time of attendance.
        preferred_language:
          type: string
          description: Patient preferred language at time of attendance.
        interpreter_required:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Whether an interpreter is required: yes, no, or empty string if unanswered.'
      required:
      - created_at
      - updated_at
      - casualty_card_id
      - address
      - postcode
      - phone
      - email
      - ethnicity
      - preferred_language
      - interpreter_required
      description: 1:1 with casualty_card. Assessment-time demographic data that may differ from the patient
        record.
    CasualtyCardDisposition:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        casualty_card_id:
          type: string
          format: uuid
          description: FK to casualty_card (UNIQUE = 1:1 relationship).
        disposition:
          type: string
          enum:
          - admitted
          - discharged
          - transferred
          - left-before-seen
          - self-discharged
          - ''
          description: 'Disposition type: admitted, discharged, transferred, left-before-seen, self-discharged,
            or empty string if unanswered.'
        admitting_specialty:
          type: string
          description: Specialty the patient is admitted under (e.g. General Medicine, Orthopaedics).
            Used when disposition is admitted.
        admitting_consultant:
          type: string
          description: Name of the admitting consultant. Used when disposition is admitted.
        ward:
          type: string
          description: Ward the patient is admitted to. Used when disposition is admitted.
        level_of_care:
          type: string
          description: Level of care required (e.g. Level 0, Level 1, Level 2, Level 3). Used when disposition
            is admitted.
        discharge_diagnosis:
          type: string
          description: Final diagnosis at discharge. Used when disposition is discharged.
        discharge_medications:
          type: string
          description: Medications prescribed at discharge (TTO). Used when disposition is discharged.
        discharge_instructions:
          type: string
          description: Patient discharge instructions and advice. Used when disposition is discharged.
        follow_up:
          type: string
          description: Follow-up arrangements (e.g. GP in 48 hours, fracture clinic 1 week). Used when
            disposition is discharged.
        return_precautions:
          type: string
          description: 'Safety-net advice: symptoms or signs warranting return to ED. Used when disposition
            is discharged.'
        receiving_hospital:
          type: string
          description: Name of the receiving hospital. Used when disposition is transferred.
        reason_for_transfer:
          type: string
          description: Clinical reason for transfer. Used when disposition is transferred.
        mode_of_transfer:
          type: string
          description: Mode of transfer (e.g. ambulance, helicopter). Used when disposition is transferred.
        discharge_time:
          type: string
          format: date-time
          description: Timestamp when the patient left the department. NULL if not recorded.
        total_time_in_department:
          type: string
          description: Total time the patient spent in the department.
      required:
      - created_at
      - updated_at
      - casualty_card_id
      - disposition
      - admitting_specialty
      - admitting_consultant
      - ward
      - level_of_care
      - discharge_diagnosis
      - discharge_medications
      - discharge_instructions
      - follow_up
      - return_precautions
      - receiving_hospital
      - reason_for_transfer
      - mode_of_transfer
      - total_time_in_department
      description: 1:1 with casualty_card. Disposition, discharge, admission, or transfer details.
    CasualtyCardGp:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        casualty_card_id:
          type: string
          format: uuid
          description: FK to casualty_card (UNIQUE = 1:1 relationship).
        name:
          type: string
          description: Full name of the patient registered GP.
        practice_name:
          type: string
          description: Name of the GP practice.
        practice_address:
          type: string
          description: Address of the GP practice.
        practice_phone:
          type: string
          description: Phone number of the GP practice.
      required:
      - created_at
      - updated_at
      - casualty_card_id
      - name
      - practice_name
      - practice_address
      - practice_phone
      description: 1:1 with casualty_card. Registered GP and practice details for communication and follow-up.
    CasualtyCardInvestigations:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        casualty_card_id:
          type: string
          format: uuid
          description: FK to casualty_card (UNIQUE = 1:1 relationship).
        blood_tests:
          type: string
          description: Array of blood test types ordered (e.g. FBC, U&E, LFTs, CRP, coagulation, troponin).
        urinalysis:
          type: string
          description: Urinalysis dipstick results.
        pregnancy_test:
          type: string
          description: Pregnancy test result.
        ecg_performed:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Whether an ECG was performed: yes, no, or empty string if unanswered.'
        ecg_findings:
          type: string
          description: ECG interpretation findings.
        other_investigations:
          type: string
          description: Free-text description of other investigations performed.
      required:
      - created_at
      - updated_at
      - casualty_card_id
      - blood_tests
      - urinalysis
      - pregnancy_test
      - ecg_performed
      - ecg_findings
      - other_investigations
      description: 1:1 with casualty_card. Investigations ordered and their results.
    CasualtyCardMedicalHistory:
      type: object
      properties:
        id:
