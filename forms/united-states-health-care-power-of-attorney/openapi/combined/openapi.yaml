components:
  schemas:
    Principal:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          maxLength: 255
          description: Full legal name of the principal.
        birthDate:
          type: string
          format: date
          description: Date of birth of the principal; used to check the principal was an adult when signing.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as a single text block.
        stateAsIso31662Us:
          type:
          - string
          - 'null'
          maxLength: 2
          description: State of residence as a two-letter USPS code; selects the state rule table.
        postcode:
          type:
          - string
          - 'null'
          description: ZIP code.
      required:
      - createdAt
      - updatedAt
      - name
      - birthDate
      description: 'Principal: the person making the health care power of attorney.'
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          description: A URI identifying the problem type
        title:
          type: string
          description: A short summary of the problem type
        status:
          type: integer
          description: The HTTP status code
        detail:
          type: string
          description: An explanation of this occurrence
        instance:
          type: string
          description: A URI identifying this occurrence
        code:
          type: string
          description: A short machine-readable reason
        errors:
          type: object
          description: Per-field detail, when validation failed
      required:
      - type
      - title
      - status
    Reviewer:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Full name of the reviewer.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        role:
          type: string
          enum:
          - attorney
          - paralegal
          - social-worker
          - nurse
          - chaplain
          - other
          - ''
          description: 'Reviewer role: attorney, paralegal, social-worker, nurse, chaplain, or other.'
        barOrLicenseNumber:
          type: string
          description: State bar or professional license number, where applicable.
      required:
      - createdAt
      - updatedAt
      - name
      - role
      - barOrLicenseNumber
      description: 'Reviewer: the attorney, social worker, or facility staff member who reviews the directive
        for execution readiness.'
    UnitedStatesHealthCarePowerOfAttorney:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        principalId:
          type: string
          format: uuid
          description: Foreign key to the principal who makes this directive (restrict delete).
        reviewerId:
          type:
          - string
          - 'null'
          format: uuid
          description: Foreign key to the reviewer (restrict delete); optional.
        principalName:
          type: string
          description: Full legal name of the principal as written in the directive.
        birthDate:
          type:
          - string
          - 'null'
          format: date
          description: Date of birth of the principal.
        stateCode:
          type: string
          enum:
          - ''
          - AL
          - AK
          - AZ
          - AR
          - CA
          - CO
          - CT
          - DE
          - DC
          - FL
          - GA
          - HI
          - ID
          - IL
          - IN
          - IA
          - KS
          - KY
          - LA
          - ME
          - MD
          - MA
          - MI
          - MN
          - MS
          - MO
          - MT
          - NE
          - NV
          - NH
          - NJ
          - NM
          - NY
          - NC
          - ND
          - OH
          - OK
          - OR
          - PA
          - RI
          - SC
          - SD
          - TN
          - TX
          - UT
          - VT
          - VA
          - WA
          - WV
          - WI
          - WY
          description: Two-letter USPS state code whose rule table applies; blank when unanswered.
        phone:
          type: string
          description: Principal phone number.
        capacityConfirmed:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the principal understands the document and what it does (yes/no).
        signedVoluntarily:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the principal is signing freely, without pressure (yes/no).
        agentName:
          type: string
          description: Full name of the health care agent (proxy, surrogate, attorney-in-fact).
        agentRelationship:
          type: string
          enum:
          - spouse
          - adult-child
          - parent
          - sibling
          - other-relative
          - friend
          - other
          - ''
          description: 'Agent relationship to the principal: spouse, adult-child, parent, sibling, other-relative,
            friend, or other.'
        agentAge:
          type:
          - integer
          - 'null'
          format: int32
          description: Agent age in whole years; an agent must be 18 or older.
        agentPhone:
          type: string
          description: Agent phone number.
        agentIsHealthCareProvider:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the agent is the principal's treating provider or that provider's employee
            (yes/no).
        agentIsFacilityEmployee:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the agent operates or works at the facility where the principal is a patient
            (yes/no).
        agentRelatedToPrincipal:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the agent is related to the principal by blood, marriage, or adoption (yes/no).
        agentAccepted:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the agent has agreed to serve (yes/no).
        successor1Name:
          type: string
          description: First successor agent name.
        successor1Phone:
          type: string
          description: First successor agent phone.
        successor2Name:
          type: string
          description: Second successor agent name.
        effectiveWhen:
          type: string
          enum:
          - immediately
          - upon-incapacity
          - ''
          description: 'When the agent authority begins: immediately or upon-incapacity.'
        incapacityDeterminedBy:
          type: string
          enum:
          - one-physician
          - two-physicians
          - other
          - ''
          description: 'Who decides the principal cannot decide: one-physician, two-physicians, or other.'
        hipaaRelease:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the document includes a HIPAA authorization for the agent (yes/no).
        mentalHealthAuthority:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the agent may decide on mental health treatment (yes/no).
        organDonation:
          type: string
          enum:
          - any-needs
          - transplant-only
          - research-only
          - none
          - not-addressed
          - ''
          description: 'Organ and tissue donation direction: any-needs, transplant-only, research-only,
            none, or not-addressed.'
        priorDirectiveStatus:
          type: string
          enum:
          - none-existing
          - revokes-prior
          - prior-remains
          - ''
          description: 'Status of earlier health care powers of attorney: none-existing, revokes-prior,
            or prior-remains.'
        lifeSustainingTreatment:
          type: string
          enum:
          - refuse
          - time-limited-trial
          - want-all
          - agent-decides
          - ''
          description: 'General wish on life-sustaining treatment: refuse, time-limited-trial, want-all,
            or agent-decides.'
        cpr:
          type: string
          enum:
          - accept
          - refuse
          - agent-decides
          - ''
          description: 'CPR wish: accept, refuse, or agent-decides.'
        ventilator:
          type: string
          enum:
          - accept
          - refuse
          - agent-decides
          - ''
          description: 'Ventilator wish: accept, refuse, or agent-decides.'
        artificialNutrition:
          type: string
          enum:
          - accept
          - refuse
          - agent-decides
          - ''
          description: 'Artificial nutrition and hydration wish: accept, refuse, or agent-decides.'
        comfortCareFirst:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether comfort and pain relief are the priority (yes/no).
        seriousIllness:
          type: string
          enum:
          - 'yes'
          - 'no'
