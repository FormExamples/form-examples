components:
  schemas:
    ChildPughScore:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the patient being assessed (delete restricted).
        clinicianId:
          type:
          - string
          - 'null'
          format: uuid
          description: Foreign key to the assessing clinician (optional; delete restricted).
        clinicianName:
          type: string
          maxLength: 255
          description: Name of the assessing clinician as recorded on the assessment.
        clinicianRole:
          type: string
          enum:
          - hepatologist
          - surgeon
          - anaesthetist
          - physician
          - nurse
          - other
          - ''
          description: 'Role of the assessing clinician: hepatologist, surgeon, anaesthetist, physician,
            nurse, or other.'
        assessedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Date and time the assessment was performed.
        careSetting:
          type: string
          enum:
          - hepatology-clinic
          - ward
          - pre-operative
          - intensive-care
          - other
          - ''
          description: 'Care setting: hepatology-clinic, ward, pre-operative, intensive-care, or other.'
        aetiology:
          type: string
          enum:
          - alcohol
          - viral-hepatitis
          - nafld
          - autoimmune
          - cholestatic
          - other
          - ''
          description: 'Aetiology of liver disease: alcohol, viral-hepatitis, nafld, autoimmune, cholestatic,
            or other.'
        patientIdentifier:
          type: string
          maxLength: 100
          description: Local patient identifier as recorded on the assessment.
        ageBand:
          type: string
          enum:
          - 16-39
          - 40-59
          - 60-74
          - 75-plus
          - ''
          description: 'Adult age band: 16-39, 40-59, 60-74, or 75-plus.'
        sex:
          type: string
          enum:
          - female
          - male
          - intersex
          - unknown
          - ''
          description: 'Patient sex recorded for the assessment: female, male, intersex, or unknown.'
        totalBilirubinUmolL:
          type:
          - number
          - 'null'
          format: double
          description: Parameter 1 — measured total bilirubin in micromoles per litre (umol/L).
        serumAlbuminGL:
          type:
          - number
          - 'null'
          format: double
          description: Parameter 2 — measured serum albumin in grams per litre (g/L).
        inr:
          type:
          - number
          - 'null'
          format: double
          description: Parameter 3 — International Normalised Ratio (INR); preferred coagulation measure.
        prothrombinTimeSeconds:
          type:
          - number
          - 'null'
          format: double
          description: Parameter 3 — prothrombin-time prolongation in seconds; fallback used when INR
            is unavailable.
        ascites:
          type: string
          enum:
          - none
          - mild
          - moderate-severe
          - ''
          description: 'Parameter 4 — clinical ascites grade: none, mild (diuretic-responsive), or moderate-severe
            (refractory).'
        hepaticEncephalopathy:
          type: string
          enum:
          - none
          - grade-1-2
          - grade-3-4
          - ''
          description: 'Parameter 5 — hepatic encephalopathy grade: none, grade-1-2, or grade-3-4.'
        clinicalNote:
          type: string
          description: Free-text clinical note recorded with the assessment.
      required:
      - createdAt
      - updatedAt
      - patientId
      - clinicianName
      - clinicianRole
      - careSetting
      - aetiology
      - patientIdentifier
      - ageBand
      - sex
      - ascites
      - hepaticEncephalopathy
      - clinicalNote
      description: 'Main Child-Pugh assessment record: assessment context, patient identification, and
        the five scored parameter inputs (total bilirubin, serum albumin, coagulation, ascites, hepatic
        encephalopathy).'
    ChildPughScoreGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        childPughScoreId:
          type: string
          format: uuid
          description: Foreign key to the parent assessment (unique, 1:1).
        bilirubinPoints:
          type:
          - integer
          - 'null'
          format: int32
          description: Points (1-3) awarded for parameter 1, total bilirubin.
        albuminPoints:
          type:
          - integer
          - 'null'
          format: int32
          description: Points (1-3) awarded for parameter 2, serum albumin.
        coagulationPoints:
          type:
          - integer
          - 'null'
          format: int32
          description: Points (1-3) awarded for parameter 3, coagulation (INR or prothrombin time).
        ascitesPoints:
          type:
          - integer
          - 'null'
          format: int32
          description: Points (1-3) awarded for parameter 4, ascites.
        encephalopathyPoints:
          type:
          - integer
          - 'null'
          format: int32
          description: Points (1-3) awarded for parameter 5, hepatic encephalopathy.
        totalScore:
          type:
          - integer
          - 'null'
          format: int32
          description: Summed Child-Pugh score across the five parameters (5-15 when complete).
        childPughClass:
          type: string
          enum:
          - A
          - B
          - C
          - ''
          description: 'Derived class: A (5-6), B (7-9), or C (10-15).'
        oneYearSurvival:
          type: string
          maxLength: 20
          description: Banded one-year survival estimate for the class (e.g. ~100%).
        twoYearSurvival:
          type: string
          maxLength: 20
          description: Banded two-year survival estimate for the class (e.g. ~85%).
        surgicalRisk:
          type: string
          enum:
          - low
          - moderate
          - high
          - ''
          description: 'Banded peri-operative risk for the class: low, moderate, or high.'
        gradedAt:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the grade.
      required:
      - createdAt
      - updatedAt
      - childPughScoreId
      - childPughClass
      - oneYearSurvival
      - twoYearSurvival
      - surgicalRisk
      - gradedAt
      description: 'Computed Child-Pugh grading result: per-parameter points, summed total (5-15), derived
        class (A/B/C), and banded survival and surgical-risk estimates.'
    ChildPughScoreGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        childPughScoreGradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        flagId:
          type: string
          maxLength: 50
          description: Stable flag identifier (e.g. F-CLASS-C-DECOMPENSATED-001).
        category:
          type: string
          enum:
          - class-c-decompensated
          - high-surgical-risk
          - encephalopathy
          - refractory-ascites
          - incomplete-assessment
          - other
          - ''
          description: Flag category (see CHECK constraint for enumeration).
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          - ''
          description: 'Priority: low, medium, high.'
        description:
          type: string
          maxLength: 500
          description: Human-readable description of what fired the flag.
        suggestedAction:
          type: string
          maxLength: 500
          description: Suggested clinical action (e.g. "refer for transplant assessment").
      required:
      - createdAt
      - updatedAt
      - childPughScoreGradeId
      - flagId
      - category
      - priority
      - description
      - suggestedAction
      description: Red-flag issues that fire independently of the total score, with priority and a suggested
        action for the clinical team.
    ChildPughScoreGradeRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        childPughScoreGradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        ruleId:
          type: string
          maxLength: 40
          description: Stable rule identifier (e.g. R-BILIRUBIN-3POINT-01).
        parameter:
          type: string
          enum:
          - bilirubin
          - albumin
          - coagulation
          - ascites
          - encephalopathy
          - class
          description: 'Scored parameter the rule belongs to: bilirubin, albumin, coagulation, ascites,
            encephalopathy, or class.'
        points:
          type:
          - integer
          - 'null'
          format: int32
          description: Points (1-3) contributed by this rule for its parameter.
        category:
          type: string
          maxLength: 50
          description: Subject category (e.g. threshold-band, class-band).
        description:
          type: string
          maxLength: 500
          description: Human-readable description of why the rule fired.
      required:
      - createdAt
      - updatedAt
      - childPughScoreGradeId
      - ruleId
      - parameter
      - category
      - description
      description: 'Audit trail of every grading rule that fired during Child-Pugh computation: parameter,
        points contributed, category, and description.'
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Clinician full name.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as a single text block.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code.
        role:
          type: string
          enum:
          - hepatologist
          - surgeon
          - anaesthetist
          - physician
          - nurse
          - other
          - ''
          description: 'Primary clinical role: hepatologist, surgeon, anaesthetist, physician, nurse,
            or other.'
        registrationBody:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - GPhC
          - other
          - ''
          description: 'Professional registration body: GMC, NMC, HCPC, GPhC, or other.'
        registrationNumber:
          type: string
          description: Professional registration number issued by the registration body.
      required:
      - createdAt
      - updatedAt
      - name
      - role
      - registrationBody
      - registrationNumber
      description: Clinician identifying information for the assessing clinician.
    Patient:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
