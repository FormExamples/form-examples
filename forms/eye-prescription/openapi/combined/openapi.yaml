      - eye_prescription_id
      - slit_lamp_right
      - slit_lamp_left
      - fundus_right
      - fundus_left
      - oct_performed
      - oct_findings
      - fields_performed
      - fields_findings
      - pathology_flag
      - refer_ophthalmology
      - referral_reason
      description: 'Optional ocular health findings recorded during the sight test: slit-lamp, fundus,
