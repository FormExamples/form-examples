          description: The updated Prescriber
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Prescriber'
        '404':
          description: Prescriber not found
    delete:
      summary: Soft-delete a Prescriber
      operationId: deletePrescriber
      responses:
        '204':
          description: Prescriber deleted
        '404':
          description: Prescriber not found
components:
  schemas:
    EyePrescription:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        patient_id:
          type: string
          format: uuid
          description: Foreign key to the patient table.
        prescriber_id:
          type: string
          format: uuid
          description: Foreign key to the prescriber table.
        status:
          type: string
          enum:
          - draft
          - active
          - cancelled
          - superseded
          - expired
          - entered-in-error
          description: 'Prescription lifecycle status: draft, active, cancelled, superseded, expired,
            entered-in-error.'
        examination_date:
          type: string
          format: date
          description: Date the sight test was performed.
        examination_time:
          type: string
          format: time
          description: Time of day the sight test was performed.
        issue_date:
          type: string
          format: date
          description: Date the prescription was issued (usually same day as examination).
        expiry_date:
          type: string
          format: date
          description: Date the prescription expires (default issue + 2 years; 1 year if age < 16 or >=
            70).
        reason_for_sight_test:
          type: string
          enum:
          - routine
          - symptoms
          - follow-up
          - pre-employment
          - driving-licence
          - after-pathology
          - second-opinion
          - other
          - ''
          description: 'Reason for the sight test: routine, symptoms, follow-up, pre-employment, driving-licence,
            after-pathology, second-opinion, other.'
        prior_prescription_on_file:
          type: boolean
          description: Whether a prior prescription is on file for this patient (used to detect significant
            change).
        prior_prescription_date:
          type: string
          format: date
          description: Date of the prior prescription, if any.
        notes:
          type: string
          description: Free-text prescriber notes.
      required:
      - created_at
      - updated_at
      - patient_id
      - prescriber_id
      - status
      - examination_date
      - issue_date
      - expiry_date
      - reason_for_sight_test
      - prior_prescription_on_file
      - notes
      description: Spectacle prescription header; one row per issued prescription.
    EyePrescriptionEye:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        eye_prescription_id:
          type: string
          format: uuid
          description: Foreign key to the eye_prescription table.
        eye:
          type: string
          enum:
          - right
          - left
          description: 'Which eye: right (OD) or left (OS).'
        sphere_diopters:
          type: number
          format: double
          description: Sphere power in dioptres. Negative for myopia, positive for hyperopia, range -30.00
            to +30.00 in 0.25 steps.
        cylinder_diopters:
          type: number
          format: double
          description: Cylinder power in dioptres (minus-cylinder convention). Range -10.00 to 0.00 in
            0.25 steps.
        axis_degrees:
          type: integer
          format: int32
          description: Cylinder axis in integer degrees, 1 to 180 (only meaningful when cylinder is non-zero).
        addition_diopters:
          type: number
          format: double
          description: Reading addition in dioptres (always positive). Range 0.00 to +4.00 in 0.25 steps.
        intermediate_addition_diopters:
          type: number
          format: double
          description: Intermediate addition for trifocal / occupational varifocal use, in dioptres.
        prism_horizontal_diopters:
          type: number
          format: double
          description: Horizontal prism magnitude in prism dioptres (PD). 0.00 if no horizontal prism.
        base_horizontal:
          type: string
          enum:
          - in
          - out
          - ''
          description: 'Horizontal prism base direction: in (toward nose) or out (toward temple). Empty
            if no horizontal prism.'
        prism_vertical_diopters:
          type: number
          format: double
          description: Vertical prism magnitude in prism dioptres (PD). 0.00 if no vertical prism.
        base_vertical:
          type: string
          enum:
          - up
          - down
          - ''
          description: 'Vertical prism base direction: up or down. Empty if no vertical prism.'
      required:
      - created_at
      - updated_at
      - eye_prescription_id
      - eye
      - prism_horizontal_diopters
      - base_horizontal
      - prism_vertical_diopters
      - base_vertical
      description: Per-eye refractive prescription (sphere, cylinder, axis, addition, prism). One row
        per eye per prescription.
    EyePrescriptionGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        eye_prescription_id:
          type: string
          format: uuid
          description: Foreign key to the parent eye_prescription (unique, 1:1).
        right_eye_sphere_class:
          type: string
          enum:
          - emmetropia
          - low-myopia
          - moderate-myopia
          - high-myopia
          - low-hyperopia
          - moderate-hyperopia
          - high-hyperopia
          - ''
          description: Refractive class for the right eye sphere component.
        right_eye_cylinder_class:
          type: string
          enum:
          - none
          - mild-astigmatism
          - moderate-astigmatism
          - high-astigmatism
          - ''
          description: Refractive class for the right eye cylinder component.
        left_eye_sphere_class:
          type: string
          enum:
          - emmetropia
          - low-myopia
          - moderate-myopia
          - high-myopia
          - low-hyperopia
          - moderate-hyperopia
          - high-hyperopia
          - ''
          description: Refractive class for the left eye sphere component.
        left_eye_cylinder_class:
          type: string
          enum:
          - none
          - mild-astigmatism
          - moderate-astigmatism
          - high-astigmatism
          - ''
          description: Refractive class for the left eye cylinder component.
        presbyopia_class:
          type: string
          enum:
          - none
          - early-presbyopia
          - established-presbyopia
          - advanced-presbyopia
          - ''
          description: Presbyopia class based on addition power.
        anisometropia_diopters:
          type: number
          format: double
          description: Absolute difference in sphere between right and left eye in dioptres.
        anisometropia_significant:
          type: boolean
          description: Whether anisometropia exceeds the 2.00 D safety-flag threshold.
        prism_present:
          type: boolean
          description: Whether any prism is prescribed (in either eye, either direction).
        computed_complexity:
          type: string
          enum:
          - simple
          - moderate
          - complex
          - ''
          description: 'Complexity grade computed by the engine: simple, moderate, complex.'
        final_complexity:
          type: string
          enum:
          - simple
          - moderate
          - complex
          - ''
          description: Complexity grade signed off by the prescriber (may equal or differ from computed).
        override_reason:
          type: string
          maxLength: 500
          description: Reason the prescriber set final differently from computed (mandatory when they
            differ).
        follow_up_interval_months:
          type: integer
          format: int32
          description: Recommended follow-up interval in months (typically 12 or 24).
        prescriber_notes:
          type: string
          description: Free-text prescriber summary notes.
        signed_at:
          type: string
          format: date-time
          description: Timestamp of prescriber electronic signature.
        graded_at:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the result.
      required:
      - created_at
      - updated_at
      - eye_prescription_id
      - right_eye_sphere_class
      - right_eye_cylinder_class
      - left_eye_sphere_class
      - left_eye_cylinder_class
      - presbyopia_class
      - anisometropia_significant
      - prism_present
      - computed_complexity
      - final_complexity
      - override_reason
      - prescriber_notes
      - graded_at
      description: Computed and signed-off grading result for the prescription. Captures per-eye refractive
        class, presbyopia, anisometropia, and overall complexity. Stores both computed and final complexity
        with an override reason.
    EyePrescriptionGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        eye_prescription_grade_id:
          type: string
          format: uuid
          description: Foreign key to the parent eye_prescription_grade.
        flag_id:
          type: string
          maxLength: 50
          description: Stable flag identifier (e.g. F-HIGH-MYOPIA-RIGHT-001).
        category:
          type: string
          enum:
          - high-myopia
          - high-hyperopia
          - high-astigmatism
          - anisometropia
          - prism-present
          - presbyopia
          - paediatric
          - prescription-expired
          - significant-change-from-prior
          - ocular-pathology
          - refer-ophthalmology
          - other
          - ''
          description: Flag category.
        eye:
          type: string
          enum:
          - right
          - left
          - both
          - ''
          description: 'Which eye the flag applies to: right, left, both.'
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          - ''
          description: 'Priority: low, medium, high.'
        description:
          type: string
          maxLength: 500
          description: Human-readable description of what fired the flag.
        suggested_action:
          type: string
          maxLength: 500
          description: Suggested clinical action (e.g. "consider refer for retinal screening").
      required:
      - created_at
      - updated_at
      - eye_prescription_grade_id
      - flag_id
      - category
      - eye
      - priority
      - description
      - suggested_action
      description: Safety-critical flags that fire independently of the complexity grade, with priority
        and a suggested action.
    EyePrescriptionGradeRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        eye_prescription_grade_id:
          type: string
          format: uuid
          description: Foreign key to the parent eye_prescription_grade.
        rule_id:
          type: string
          maxLength: 40
          description: Stable rule identifier (e.g. R-SPH-MYO-HIGH-01).
        instrument:
          type: string
          enum:
          - sphere
          - cylinder
          - addition
          - anisometropia
          - prism
          - change
          - ''
          description: 'Classification instrument: sphere, cylinder, addition, anisometropia, prism, change.'
        eye:
          type: string
          enum:
          - right
          - left
          - both
          - ''
          description: 'Which eye the rule applied to: right, left, both.'
        class:
          type: string
          maxLength: 40
          description: Class contributed by this rule (e.g. high-myopia, mild-astigmatism).
        category:
          type: string
          maxLength: 50
          description: Risk / classification category (e.g. refraction, alignment).
        description:
          type: string
          maxLength: 500
          description: Human-readable description of why the rule fired.
      required:
      - created_at
      - updated_at
      - eye_prescription_grade_id
      - rule_id
      - instrument
      - eye
      - class
      - category
      - description
      description: Audit trail of every sphere / cylinder / addition / anisometropia / prism / change
        rule that fired during classification.
    EyePrescriptionLensRecommendation:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        eye_prescription_id:
          type: string
          format: uuid
          description: Foreign key to the parent eye_prescription (unique, 1:1).
        lens_type:
          type: string
          enum:
          - single-vision-distance
          - single-vision-near
          - single-vision-intermediate
          - bifocal
          - trifocal
          - varifocal
          - occupational-varifocal
          - ''
          description: 'Lens design: single-vision-distance, single-vision-near, single-vision-intermediate,
            bifocal, trifocal, varifocal, occupational-varifocal.'
        material:
          type: string
          enum:
          - cr-39
          - trivex
          - polycarbonate
          - mid-index-1.60
          - high-index-1.67
          - high-index-1.74
          - glass
          - ''
          description: 'Lens material: cr-39, trivex, polycarbonate, mid-index-1.60, high-index-1.67,
            high-index-1.74, glass.'
        refractive_index:
          type: number
          format: double
          description: Refractive index of the lens material (1.498 for CR-39, 1.586 for polycarbonate,
            etc.).
        aspheric:
          type: boolean
          description: Whether an aspheric lens design is recommended.
        coating_anti_reflective:
          type: boolean
          description: Whether anti-reflective coating is recommended.
        coating_scratch_resistant:
          type: boolean
          description: Whether scratch-resistant coating is recommended.
        coating_hydrophobic:
          type: boolean
          description: Whether hydrophobic coating is recommended.
        coating_blue_light:
          type: boolean
          description: Whether blue-light filter coating is recommended.
        coating_photochromic:
          type: boolean
          description: Whether photochromic (light-reactive) coating is recommended.
        coating_polarised:
          type: boolean
          description: Whether polarised coating is recommended.
        coating_uv_400:
          type: boolean
          description: Whether UV-400 protection is recommended.
        tint_description:
          type: string
          maxLength: 50
          description: Tint description (e.g. "brown", "grey", "G15").
        tint_percent:
          type: integer
          format: int32
          description: Tint density as a percentage (0 = clear, 85 = sunglass).
        dispenser_notes:
          type: string
          description: Free-text notes for the dispensing optician.
      required:
      - created_at
      - updated_at
      - eye_prescription_id
      - lens_type
      - material
      - aspheric
      - coating_anti_reflective
      - coating_scratch_resistant
      - coating_hydrophobic
      - coating_blue_light
      - coating_photochromic
      - coating_polarised
      - coating_uv_400
      - tint_description
      - dispenser_notes
      description: 'Lens recommendation: design, material, coatings, tint. One row per prescription.'
    EyePrescriptionOcularHealthFinding:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        eye_prescription_id:
          type: string
          format: uuid
          description: Foreign key to the parent eye_prescription (unique, 1:1).
        slit_lamp_right:
          type: string
          description: Slit-lamp biomicroscopy findings, right eye.
        slit_lamp_left:
          type: string
          description: Slit-lamp biomicroscopy findings, left eye.
        fundus_right:
          type: string
          description: Fundus examination findings, right eye.
        fundus_left:
          type: string
          description: Fundus examination findings, left eye.
        intraocular_pressure_right_mmhg:
          type: number
          format: double
          description: Intraocular pressure, right eye, in mmHg.
        intraocular_pressure_left_mmhg:
          type: number
          format: double
          description: Intraocular pressure, left eye, in mmHg.
        cup_to_disc_ratio_right:
          type: number
          format: double
          description: Optic nerve head cup-to-disc ratio, right eye (0.00 to 1.00).
        cup_to_disc_ratio_left:
          type: number
          format: double
          description: Optic nerve head cup-to-disc ratio, left eye (0.00 to 1.00).
        oct_performed:
          type: boolean
          description: Whether an OCT scan was performed at this sight test.
        oct_findings:
          type: string
          description: OCT (optical coherence tomography) findings.
        fields_performed:
          type: boolean
          description: Whether a visual fields test was performed at this sight test.
        fields_findings:
          type: string
          description: Visual fields findings.
        pathology_flag:
