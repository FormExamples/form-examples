        allergy alerts, or safeguarding concerns.
    GradingFiredRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        grade_id:
          type: string
          format: uuid
          description: Foreign key to the grade table.
        rule_id:
          type: string
          maxLength: 20
          description: Identifier of the rule that fired (e.g. INTAKE-MED-001, INTAKE-FAM-001).
