components:
  schemas:
    Assessment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the patient who owns this assessment.
        status:
          type: string
          enum:
          - draft
          - submitted
          - reviewed
          - urgent
          description: 'Lifecycle status: draft, submitted, reviewed, or urgent.'
      required:
      - createdAt
      - updatedAt
      - patientId
      - status
      description: Patient intake assessment form with risk level stratification. Parent entity for all
        assessment sections.
    AssessmentAllergies:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        assessmentId:
          type: string
          format: uuid
          description: Foreign key to the parent assessment (unique, enforcing 1:1).
        hasDrugAllergies:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Whether the patient has drug allergies: yes, no, or empty.'
        hasFoodAllergies:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Whether the patient has food allergies: yes, no, or empty.'
        hasEnvironmentalAllergies:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Whether the patient has environmental allergies: yes, no, or empty.'
        hasLatexAllergy:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Whether the patient has a latex allergy: yes, no, or empty.'
        hasContrastAllergy:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Whether the patient has a contrast dye allergy: yes, no, or empty.'
        hasAnaestheticAllergy:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Whether the patient has an anaesthetic allergy: yes, no, or empty.'
        historyOfAnaphylaxis:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Whether the patient has a history of anaphylaxis: yes, no, or empty.'
        carriesEpipen:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Whether the patient carries an adrenaline auto-injector: yes, no, or empty.'
        allergiesNotes:
          type: string
          description: Additional notes on allergies.
      required:
      - createdAt
      - updatedAt
      - assessmentId
      - hasDrugAllergies
      - hasFoodAllergies
      - hasEnvironmentalAllergies
      - hasLatexAllergy
      - hasContrastAllergy
      - hasAnaestheticAllergy
      - historyOfAnaphylaxis
      - carriesEpipen
      - allergiesNotes
      description: 'Allergies section header: drug, food, environmental, and other allergies. One-to-one
        child of assessment.'
    AssessmentAllergyItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        allergiesId:
          type: string
          format: uuid
          description: Foreign key to the assessment_allergies table.
        allergen:
          type: string
          maxLength: 255
          description: Name of the allergen.
        allergyType:
          type: string
          enum:
          - drug
          - food
          - environmental
          - latex
          - contrast
          - anaesthetic
          - other
          - ''
          description: 'Type of allergy: drug, food, environmental, latex, contrast, anaesthetic, other,
            or empty.'
        reaction:
          type: string
          description: Description of the allergic reaction.
        severity:
          type: string
          enum:
          - mild
          - moderate
          - severe
          - anaphylaxis
          - ''
          description: 'Reaction severity: mild, moderate, severe, anaphylaxis, or empty.'
        sortOrder:
          type: integer
          format: int32
          description: Display order of the item within the list.
      required:
      - createdAt
      - updatedAt
      - allergiesId
      - allergen
      - allergyType
      - reaction
      - severity
      - sortOrder
      description: Individual allergy entry with allergen, type, reaction, and severity.
    AssessmentMedicationItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        medicationsId:
          type: string
          format: uuid
          description: Foreign key to the assessment_medications table.
        medicationName:
          type: string
          maxLength: 255
          description: Name of the medication.
        dose:
          type: string
          maxLength: 100
          description: Dose of the medication.
        frequency:
          type: string
          maxLength: 100
          description: Frequency of administration.
        route:
          type: string
          enum:
          - oral
          - topical
          - inhaled
          - injectable
          - other
          - ''
          description: 'Route of administration: oral, topical, inhaled, injectable, other, or empty.'
        prescriber:
          type: string
          maxLength: 255
          description: Name of the prescribing clinician.
        reason:
          type: string
          maxLength: 255
          description: Reason or indication for the medication.
        startDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the medication was started.
        sortOrder:
          type: integer
          format: int32
          description: Display order of the item within the list.
      required:
      - createdAt
      - updatedAt
      - medicationsId
      - medicationName
      - dose
      - frequency
      - route
      - prescriber
      - reason
      - sortOrder
      description: Individual medication entry with name, dose, frequency, and prescriber.
    AssessmentMedications:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        assessmentId:
          type: string
          format: uuid
          description: Foreign key to the parent assessment (unique, enforcing 1:1).
        takesMedications:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Whether the patient takes prescription medications: yes, no, or empty.'
        takesOverTheCounter:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Whether the patient takes over-the-counter medications: yes, no, or empty.'
        takesSupplements:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Whether the patient takes vitamins or supplements: yes, no, or empty.'
        supplementDetails:
          type: string
          description: Details of supplements and vitamins.
        medicationAdherence:
          type: string
          enum:
          - good
          - partial
          - poor
          - ''
          description: 'Overall medication adherence: good, partial, poor, or empty.'
        pharmacyName:
          type: string
          maxLength: 255
          description: Name of the patient regular pharmacy.
        pharmacyPhone:
          type: string
          maxLength: 50
          description: Telephone number of the pharmacy.
        medicationsNotes:
          type: string
          description: Additional notes on medications.
      required:
      - createdAt
      - updatedAt
      - assessmentId
      - takesMedications
      - takesOverTheCounter
      - takesSupplements
      - supplementDetails
      - medicationAdherence
      - pharmacyName
      - pharmacyPhone
      - medicationsNotes
      description: 'Current medications section header: prescription, OTC, supplements, and adherence.
        One-to-one child of assessment.'
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Name.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as full text.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code, such as for validating the postal address.
        role:
          type: string
          enum:
          - anaesthetist
          - surgeon
          - preop-nurse
          - perioperative-physician
          - geriatrician
          - pharmacist
          - other
          - ''
          description: Clinician role.
        registrationBody:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - GPhC
          - other
          - ''
          description: Clinician registration body.
        registrationNumber:
          type: string
          description: Clinician registration number.
        unitedKingdomNhsNumber:
          type:
          - string
          - 'null'
          maxLength: 12
          description: United Kingdom NHS number, unique per person.
      required:
      - createdAt
      - updatedAt
      - name
      - role
      - registrationBody
      - registrationNumber
      description: Clinician
    Grade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        assessmentId:
          type: string
          format: uuid
          description: Foreign key to the assessment table.
        riskLevel:
          type: string
          enum:
          - low
          - medium
          - high
          description: 'Overall risk level: low (minimal risk factors), medium (some risk factors), high
            (significant risk factors requiring attention).'
        riskFactorCount:
          type: integer
          format: int32
