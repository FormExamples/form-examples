        of assessment.
    GradingAdditionalFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        gradeId:
          type: string
          format: uuid
          description: Foreign key to the grade table.
        flagId:
          type: string
          maxLength: 30
          description: Identifier of the flag (e.g. FLAG-ALLERGY-001, FLAG-SAFEGUARD-001).
