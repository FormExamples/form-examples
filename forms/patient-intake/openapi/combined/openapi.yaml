      summary: Delete a Patient
      operationId: deletePatient
      responses:
        '200':
          description: Patient deleted
        '404':
          description: Patient not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: This client sent too many requests
          headers:
            retry-after:
              description: Seconds to wait before sending again
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  schemas:
    Assessment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        patient_id:
          type: string
          format: uuid
          description: Foreign key to the patient who owns this assessment.
        status:
          type: string
          enum:
          - draft
          - submitted
          - reviewed
          - urgent
          description: 'Lifecycle status: draft, submitted, reviewed, or urgent.'
      required:
      - created_at
      - updated_at
      - patient_id
      - status
      description: Patient intake assessment form with risk level stratification. Parent entity for all
        assessment sections.
    AssessmentAllergies:
      type: object
