      - dose
      - frequency
      - route
      - prescriber
      - reason
      - sort_order
      description: Individual medication entry with name, dose, frequency, and prescriber.
    AssessmentMedications:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        assessment_id:
          type: string
          format: uuid
          description: Foreign key to the parent assessment (unique, enforcing 1:1).
        takes_medications:
          type: string
          enum:
