        supplement_details:
          type: string
          description: Details of supplements and vitamins.
        medication_adherence:
          type: string
          enum:
          - good
          - partial
          - poor
          - ''
          description: 'Overall medication adherence: good, partial, poor, or empty.'
        pharmacy_name:
          type: string
          maxLength: 255
          description: Name of the patient regular pharmacy.
        pharmacy_phone:
          type: string
          maxLength: 50
          description: Telephone number of the pharmacy.
        medications_notes:
          type: string
          description: Additional notes on medications.
      required:
      - created_at
      - updated_at
      - assessment_id
