components:
  schemas:
    Applicant:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          maxLength: 255
          description: Full name of the applicant (the liable person).
        birthDate:
          type: string
          format: date
          description: Date of birth of the applicant.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as a single text block.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2.
      required:
      - createdAt
      - updatedAt
      - name
      - birthDate
      description: 'The liable person applying for the Council Tax discount: name, birth date and contact
        details.'
    BillingAuthority:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Name of the billing authority.
        gssCode:
          type:
          - string
          - 'null'
          maxLength: 20
          description: Office for National Statistics GSS code of the authority.
        email:
          type:
          - string
          - 'null'
          description: Council Tax team email address.
        phone:
          type:
          - string
          - 'null'
          description: Council Tax team phone number.
        websiteUrl:
          type:
          - string
          - 'null'
          description: Council Tax web page of the authority.
      required:
      - createdAt
      - updatedAt
      - name
      description: The billing authority (local council in England) that receives the application and
        decides eligibility.
    Occupant:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        unitedKingdomCouncilTaxDiscountApplicationId:
          type: string
          format: uuid
          description: Foreign key to the parent application.
        name:
          type: string
          maxLength: 255
          description: Full name of the occupant.
        birthDate:
          type:
          - string
          - 'null'
          format: date
          description: Date of birth of the occupant.
        status:
          type: string
          enum:
          - counted-adult
          - full-time-student
          - severely-mentally-impaired
          - under-18
          - apprentice
          - education-18-19
          - live-in-carer
          - care-leaver
          - other-disregarded
          - ''
          description: 'Status of the occupant: counted-adult or a disregarded status.'
        evidenceHeld:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether evidence of the occupant's status is held (yes/no).
      required:
      - createdAt
      - updatedAt
      - unitedKingdomCouncilTaxDiscountApplicationId
      - name
      - status
      - evidenceHeld
      description: One person on the occupant roster of a Council Tax discount application, other than
        the applicant, with their status and whether evidence is held.
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
