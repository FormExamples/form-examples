      - status
    UnitedKingdomCouncilTaxDiscountApplication:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        applicantId:
          type: string
          format: uuid
          description: Foreign key to the applicant (liable person).
        billingAuthorityId:
          type:
          - string
          - 'null'
          format: uuid
          description: Foreign key to the billing authority the application is made to.
        claimType:
          type: string
          enum:
          - single-person-discount
          - all-disregarded-discount
          - student-exemption
          - severe-mental-impairment
          - disabled-band-reduction
          - care-leaver-relief
          - council-tax-reduction
          - ''
          description: 'Claim type: single-person-discount, all-disregarded-discount, student-exemption,
            severe-mental-impairment, disabled-band-reduction, care-leaver-relief or council-tax-reduction.'
        accountReference:
          type: string
          maxLength: 50
          description: Council Tax account reference, if known.
        applicationDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the application is made.
        effectiveDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the discount should take effect from; earlier than the application date means
            backdating.
        applicantStatus:
          type: string
          enum:
          - counted-adult
          - full-time-student
          - severely-mentally-impaired
          - under-18
          - apprentice
          - education-18-19
          - live-in-carer
          - care-leaver
          - other-disregarded
          - ''
          description: 'The applicant''s own status on the occupant roster: counted-adult or a disregarded
            status.'
        propertyAddressAsFullText:
          type: string
          description: Address of the property the Council Tax bill is for.
        propertyPostcode:
          type: string
          maxLength: 10
          description: Postcode of the property.
        councilTaxBand:
          type: string
          enum:
          - A
          - B
          - C
          - D
          - E
          - F
          - G
          - H
          - ''
          description: Council Tax valuation band of the property, A to H.
        mainResidence:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the property is the applicant's main home (yes/no).
        liableRole:
          type: string
          enum:
          - owner-occupier
          - tenant
          - landlord
          - other
          - ''
          description: 'Role of the applicant in paying the Council Tax: owner-occupier, tenant, landlord
            or other.'
        otherOccupants:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether anyone other than the applicant lives in the property (yes/no); the occupant
            table holds them.
        smiCertificate:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether a registered medical practitioner's certificate of severe mental impairment
            is held (yes/no).
        qualifyingBenefit:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the severely mentally impaired person receives a qualifying benefit (yes/no).
        studentCertificate:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether a course-provider student certificate is held (yes/no).
        studentCourseMonths:
          type:
          - integer
          - 'null'
          format: int32
          description: Length of the student course in months.
        studentHoursPerWeek:
          type:
          - integer
          - 'null'
          format: int32
          description: Weekly hours of study on the student course.
        disabilityAdaptation:
          type: string
          enum:
          - extra-bathroom
          - extra-kitchen
          - extra-room
          - wheelchair-space
          - none
          - ''
          description: 'Adaptation qualifying for the disabled band reduction: extra-bathroom, extra-kitchen,
            extra-room, wheelchair-space or none.'
        disabledPersonMainHome:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the property is the main home of a disabled person (yes/no).
        apprenticeDeclaration:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the employer's apprentice declaration is held (yes/no).
        careLeaverProof:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether proof from the looking-after local authority is held (yes/no).
        careLeaverAgeYears:
          type:
          - integer
          - 'null'
          format: int32
          description: Age of the care leaver in years.
        evidenceNotes:
          type: string
          description: Free-text list of supporting documents.
        declaredTrue:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Declaration that the information is true and complete (yes/no).
        agreesToReportChanges:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Agreement to report a change in circumstances within 21 days (yes/no).
        fraudWarningAcknowledged:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Acknowledgement of the penalty and prosecution warning for false information (yes/no).
        declarantName:
          type: string
          description: Name of the person making the declaration.
        declarationDate:
          type:
          - string
          - 'null'
          format: date
          description: Date of the declaration.
      required:
      - createdAt
      - updatedAt
      - applicantId
      - claimType
      - accountReference
      - applicantStatus
      - propertyAddressAsFullText
      - propertyPostcode
      - councilTaxBand
      - mainResidence
      - liableRole
      - otherOccupants
      - smiCertificate
      - qualifyingBenefit
      - studentCertificate
      - disabilityAdaptation
      - disabledPersonMainHome
      - apprenticeDeclaration
      - careLeaverProof
      - evidenceNotes
      - declaredTrue
      - agreesToReportChanges
      - fraudWarningAcknowledged
      - declarantName
      description: 'Main United Kingdom Council Tax discount application: one application to an English
        billing authority for a Council Tax discount, exemption, disregard or reduction. It captures the
        claim type, the property, the evidence and the declaration; the occupant roster lives in the occupant
        table. The completeness and eligibility classification, the audit trail of fired rules and the
        flagged issues live in dedicated child tables. Eligibility is decided by the billing authority,
        not by this record.'
    UnitedKingdomCouncilTaxDiscountApplicationGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        unitedKingdomCouncilTaxDiscountApplicationId:
          type: string
          format: uuid
          description: Foreign key to the parent application (unique, 1:1).
        eligibilityClass:
          type: string
          enum:
          - likely-eligible
          - incomplete
          - likely-ineligible
          - ''
          description: 'Eligibility classification: likely-eligible, incomplete or likely-ineligible (likely-ineligible
            takes precedence).'
        countedAdults:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Number of counted adults: the applicant and occupants who are not disregarded.'
        indicativeOutcome:
          type: string
          enum:
          - 25-percent-discount
          - 50-percent-discount
          - full-exemption
          - smi-disregard
          - band-reduction
          - care-leaver-relief
          - means-tested-reduction
          - none
          - ''
          description: 'Indicative outcome if the authority agrees: 25-percent-discount, 50-percent-discount,
            full-exemption, smi-disregard, band-reduction, care-leaver-relief, means-tested-reduction
            or none.'
        gradedAt:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the classification.
      required:
      - createdAt
      - updatedAt
      - unitedKingdomCouncilTaxDiscountApplicationId
      - eligibilityClass
      - indicativeOutcome
      - gradedAt
      description: 'Computed completeness and eligibility result for a Council Tax discount application.
        The engine classifies the application as likely-eligible, incomplete or likely-ineligible, counts
        the adults and states the indicative outcome. It is not a decision: eligibility is decided by
        the billing authority.'
