        clinician_id:
          type: string
          format: uuid
          description: Foreign key to the assessing clinician (optional; delete restricted).
        clinician_name:
          type: string
          maxLength: 255
          description: Name of the assessing clinician as recorded on the assessment.
        clinician_role:
          type: string
          enum:
          - midwife
          - neonatal-nurse
          - paediatrician
          - other
          - ''
          description: 'Role of the assessing clinician: midwife, neonatal-nurse, paediatrician, or other.'
        assessed_at:
          type: string
          format: date-time
          description: Date and time the assessment was performed.
        care_setting:
          type: string
          enum:
          - postnatal-ward
          - neonatal-unit
          - midwife-led-unit
          - community
          - other
          - ''
          description: 'Care setting: postnatal-ward, neonatal-unit, midwife-led-unit, community, or other.'
        infant_identifier:
          type: string
          maxLength: 100
          description: Local infant identifier as recorded on the assessment.
        sex:
          type: string
          enum:
          - female
          - male
          - intersex
          - unknown
          - ''
          description: 'Infant sex recorded for the assessment: female, male, intersex, or unknown.'
        born_at:
          type: string
          format: date-time
          description: Date and time of birth; used with assessed_at to derive age in hours.
        gestational_age_weeks:
          type: number
          format: double
          description: Gestational age at birth in completed weeks; selects the gestation-specific threshold
            curve.
        age_hours:
          type: number
          format: double
          description: Age at measurement in hours; the nomogram x-axis (may be derived from born_at and
            assessed_at or entered directly).
        total_serum_bilirubin_umol_l:
          type: number
          format: double
          description: Measured total serum bilirubin (TSB) in micromoles per litre (umol/L); the nomogram
            y-axis.
        measurement_method:
          type: string
          enum:
          - serum
          - transcutaneous
          - ''
          description: 'Bilirubin measurement method: serum or transcutaneous.'
        preterm_under_38:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Risk factor (yes/no): gestational age below 38 weeks.'
        previous_sibling_jaundice:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Risk factor (yes/no): previous sibling required phototherapy or had neonatal jaundice.'
        exclusive_breastfeeding:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Risk factor (yes/no): infant is exclusively breastfed.'
        bruising:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Risk factor (yes/no): significant bruising or cephalohaematoma.'
        blood_group_incompatibility:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Risk factor (yes/no): ABO or Rhesus incompatibility, or positive direct antiglobulin
            test (DAT).'
        early_onset_under_24h:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Risk factor (yes/no): jaundice onset before 24 hours of age.'
        clinical_note:
          type: string
          description: Free-text clinical note recorded with the assessment.
      required:
      - created_at
      - updated_at
      - patient_id
      - clinician_name
      - clinician_role
      - care_setting
      - infant_identifier
      - sex
      - measurement_method
      - preterm_under_38
      - previous_sibling_jaundice
      - exclusive_breastfeeding
      - bruising
      - blood_group_incompatibility
      - early_onset_under_24h
      - clinical_note
      description: 'Main Bhutani bilirubin nomogram assessment record: assessment context, infant identification,
        measurement inputs (age in hours, total serum bilirubin, measurement method, gestational age),
        and neonatal hyperbilirubinaemia risk factors.'
    BhutaniBilirubinNomogramGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the row was soft-deleted.
        bhutani_bilirubin_nomogram_id:
          type: string
          format: uuid
          description: Foreign key to the parent assessment (unique, 1:1).
        risk_zone:
          type: string
          enum:
          - low
          - low-intermediate
          - high-intermediate
          - high
          - ''
          description: 'Percentile risk zone assigned by the nomogram: low, low-intermediate, high-intermediate,
            or high (empty when age or TSB is missing).'
        percentile_band:
          type: string
          enum:
          - <40
          - 40-75
          - 75-95
          - '>=95'
          - ''
          description: 'Percentile band mirroring the risk zone: <40, 40-75, 75-95, or >=95.'
        phototherapy_threshold_umol_l:
          type: number
          format: double
          description: Interpolated gestation-specific phototherapy threshold at the infant age in micromoles
            per litre (umol/L).
        exchange_threshold_umol_l:
          type: number
          format: double
          description: Interpolated gestation-specific exchange-transfusion threshold at the infant age
            in micromoles per litre (umol/L).
        above_phototherapy_threshold:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Whether the measured TSB is at or above the phototherapy threshold: yes or no.'
        above_exchange_threshold:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Whether the measured TSB is at or above the exchange-transfusion threshold: yes
            or no.'
        graded_at:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the classification.
      required:
      - created_at
      - updated_at
      - bhutani_bilirubin_nomogram_id
      - risk_zone
      - percentile_band
      - above_phototherapy_threshold
      - above_exchange_threshold
      - graded_at
      description: 'Computed Bhutani bilirubin nomogram classification result (1:1): percentile risk zone,
