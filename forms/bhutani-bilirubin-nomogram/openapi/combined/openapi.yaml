components:
  schemas:
    BhutaniBilirubinNomogram:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the infant being assessed (delete restricted).
        clinicianId:
          type:
          - string
          - 'null'
          format: uuid
          description: Foreign key to the assessing clinician (optional; delete restricted).
        clinicianName:
          type: string
          maxLength: 255
          description: Name of the assessing clinician as recorded on the assessment.
        clinicianRole:
          type: string
          enum:
          - midwife
          - neonatal-nurse
          - paediatrician
          - other
          - ''
          description: 'Role of the assessing clinician: midwife, neonatal-nurse, paediatrician, or other.'
        assessedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Date and time the assessment was performed.
        careSetting:
          type: string
          enum:
          - postnatal-ward
          - neonatal-unit
          - midwife-led-unit
          - community
          - other
          - ''
          description: 'Care setting: postnatal-ward, neonatal-unit, midwife-led-unit, community, or other.'
        infantIdentifier:
          type: string
          maxLength: 100
          description: Local infant identifier as recorded on the assessment.
        sex:
          type: string
          enum:
          - female
          - male
          - intersex
          - unknown
          - ''
          description: 'Infant sex recorded for the assessment: female, male, intersex, or unknown.'
        bornAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Date and time of birth; used with assessed_at to derive age in hours.
        gestationalAgeWeeks:
          type:
          - number
          - 'null'
          format: double
          description: Gestational age at birth in completed weeks; selects the gestation-specific threshold
            curve.
        ageHours:
          type:
          - number
          - 'null'
          format: double
          description: Age at measurement in hours; the nomogram x-axis (may be derived from born_at and
            assessed_at or entered directly).
        totalSerumBilirubinUmolL:
          type:
          - number
          - 'null'
          format: double
          description: Measured total serum bilirubin (TSB) in micromoles per litre (umol/L); the nomogram
            y-axis.
        measurementMethod:
          type: string
          enum:
          - serum
          - transcutaneous
          - ''
          description: 'Bilirubin measurement method: serum or transcutaneous.'
        pretermUnder38:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Risk factor (yes/no): gestational age below 38 weeks.'
        previousSiblingJaundice:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Risk factor (yes/no): previous sibling required phototherapy or had neonatal jaundice.'
        exclusiveBreastfeeding:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Risk factor (yes/no): infant is exclusively breastfed.'
        bruising:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Risk factor (yes/no): significant bruising or cephalohaematoma.'
        bloodGroupIncompatibility:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Risk factor (yes/no): ABO or Rhesus incompatibility, or positive direct antiglobulin
            test (DAT).'
        earlyOnsetUnder24h:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Risk factor (yes/no): jaundice onset before 24 hours of age.'
        clinicalNote:
          type: string
          description: Free-text clinical note recorded with the assessment.
      required:
      - createdAt
      - updatedAt
      - patientId
      - clinicianName
      - clinicianRole
      - careSetting
      - infantIdentifier
      - sex
      - measurementMethod
      - pretermUnder38
      - previousSiblingJaundice
      - exclusiveBreastfeeding
      - bruising
      - bloodGroupIncompatibility
      - earlyOnsetUnder24h
      - clinicalNote
      description: 'Main Bhutani bilirubin nomogram assessment record: assessment context, infant identification,
        measurement inputs (age in hours, total serum bilirubin, measurement method, gestational age),
        and neonatal hyperbilirubinaemia risk factors.'
    BhutaniBilirubinNomogramGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        bhutaniBilirubinNomogramId:
          type: string
          format: uuid
          description: Foreign key to the parent assessment (unique, 1:1).
        riskZone:
          type: string
          enum:
          - low
          - low-intermediate
          - high-intermediate
          - high
          - ''
          description: 'Percentile risk zone assigned by the nomogram: low, low-intermediate, high-intermediate,
            or high (empty when age or TSB is missing).'
        percentileBand:
          type: string
          enum:
          - <40
          - 40-75
          - 75-95
          - '>=95'
          - ''
          description: 'Percentile band mirroring the risk zone: <40, 40-75, 75-95, or >=95.'
        phototherapyThresholdUmolL:
          type:
          - number
          - 'null'
          format: double
          description: Interpolated gestation-specific phototherapy threshold at the infant age in micromoles
            per litre (umol/L).
        exchangeThresholdUmolL:
          type:
          - number
          - 'null'
          format: double
          description: Interpolated gestation-specific exchange-transfusion threshold at the infant age
            in micromoles per litre (umol/L).
        abovePhototherapyThreshold:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Whether the measured TSB is at or above the phototherapy threshold: yes or no.'
        aboveExchangeThreshold:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Whether the measured TSB is at or above the exchange-transfusion threshold: yes
            or no.'
        gradedAt:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the classification.
      required:
      - createdAt
      - updatedAt
      - bhutaniBilirubinNomogramId
      - riskZone
      - percentileBand
      - abovePhototherapyThreshold
      - aboveExchangeThreshold
      - gradedAt
      description: 'Computed Bhutani bilirubin nomogram classification result (1:1): percentile risk zone,
        mirrored percentile band, interpolated gestation-specific phototherapy and exchange thresholds,
        and the yes/no above-threshold signals.'
    BhutaniBilirubinNomogramGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        bhutaniBilirubinNomogramGradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        flagId:
          type: string
          maxLength: 50
          description: Stable flag identifier (e.g. F-ABOVE-EXCHANGE-001).
        category:
          type: string
          enum:
          - above-exchange
          - above-phototherapy
          - high-risk-zone
          - rapid-rise
          - early-jaundice
          - risk-factors
          - incomplete
          - other
          - ''
          description: 'Flag category: above-exchange, above-phototherapy, high-risk-zone, rapid-rise,
            early-jaundice, risk-factors, incomplete, or other.'
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          - ''
          description: 'Priority: low, medium, high.'
        description:
          type: string
          maxLength: 500
          description: Human-readable description of what fired the flag.
        suggestedAction:
          type: string
          maxLength: 500
          description: Suggested clinical action (e.g. "urgent neonatal review and prepare for exchange
            transfusion").
      required:
      - createdAt
      - updatedAt
      - bhutaniBilirubinNomogramGradeId
      - flagId
      - category
      - priority
      - description
      - suggestedAction
      description: Red-flag issues that fire independently of the risk zone, with priority and a suggested
        action for the clinical team.
    BhutaniBilirubinNomogramGradeRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        bhutaniBilirubinNomogramGradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        ruleId:
          type: string
          maxLength: 40
          description: Stable rule identifier (e.g. R-ZONE-HIGH-INTERMEDIATE-01).
        category:
          type: string
          maxLength: 50
          description: Rule category (e.g. zone-lookup, phototherapy-threshold, exchange-threshold).
        description:
          type: string
          maxLength: 500
          description: Human-readable description of why the rule fired.
      required:
      - createdAt
      - updatedAt
      - bhutaniBilirubinNomogramGradeId
      - ruleId
      - category
      - description
      description: 'Audit trail of every classification rule that fired during Bhutani bilirubin nomogram
        computation: rule identifier, category, and description.'
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
