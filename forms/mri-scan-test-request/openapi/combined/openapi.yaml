components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        name:
          type: string
          description: Name.
        email:
          type: string
          description: Email address.
        phone:
          type: string
          description: Phone number.
        postal_address_as_full_text:
          type: string
          description: Postal address as full text.
        country_as_iso_3166_1_alpha_2:
          type: string
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type: string
          description: Postal code, such as for validating the postal address.
        role:
          type: string
          enum:
          - radiologist
          - gp
          - hospital-doctor
          - neurologist
          - orthopaedic-surgeon
          - oncologist
          - radiographer
          - other
          - ''
          description: 'Clinician role: radiologist, gp, hospital-doctor, neurologist, orthopaedic-surgeon,
            oncologist, radiographer, other.'
        registration_body:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - other
          - ''
          description: 'Clinician registration body: GMC, NMC, HCPC, other.'
        registration_number:
          type: string
          description: Clinician registration number.
        united_kingdom_nhs_number:
          type: string
          maxLength: 12
          description: United Kingdom NHS number, unique per person.
      required:
      - created_at
      - updated_at
      - name
      - role
      - registration_body
      - registration_number
      description: Requesting clinician (referrer) who completes the MRI scan request.
    MriScanTestRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        patient_id:
          type: string
          format: uuid
          description: Foreign key to the patient.
        clinician_id:
          type: string
          format: uuid
          description: Foreign key to the requesting clinician (referrer).
        status:
          type: string
          enum:
          - draft
          - submitted
          - vetted
          - scheduled
          - rejected
          - ''
          description: 'Request lifecycle status: draft, submitted, vetted, scheduled, rejected.'
        site_name:
          type: string
          maxLength: 255
          description: Name of the requesting site or clinic.
        setting:
          type: string
          enum:
          - outpatient
          - inpatient
          - community
          - emergency
          - ''
          description: 'Care setting: outpatient, inpatient, community, emergency.'
        referral_date:
          type: string
          format: date
          description: Date the referral was made.
        requested_by_date:
          type: string
          format: date
          description: Date by which the scan is requested to be performed.
        body_region:
          type: string
          enum:
          - brain
          - spine-cervical
          - spine-thoracic
          - spine-lumbar
          - head-neck
          - chest
          - abdomen
          - pelvis
          - cardiac
          - mr-angiogram
          - breast
          - musculoskeletal-joint
          - whole-body
          - other
          - ''
          description: Body region to be imaged, used for appropriateness scoring and protocolling.
        primary_indication:
          type: string
          enum:
          - suspected-malignancy
          - cancer-staging
          - neurological-deficit
          - suspected-ms
          - back-pain-radiculopathy
          - joint-derangement
          - suspected-stroke
          - epilepsy
          - dementia
          - pituitary
          - cardiac-function
          - follow-up-surveillance
          - other
          - ''
          description: Primary clinical indication, used for ACR appropriateness scoring.
        clinical_question:
          type: string
          maxLength: 1000
          description: Specific clinical question the scan should answer (highest-value field).
        relevant_history:
          type: string
          maxLength: 1000
          description: Relevant medical, surgical, and clinical history.
        contrast_required:
          type: string
          enum:
          - none
          - iv-gadolinium
          - unknown
          - ''
          description: 'Whether IV contrast is required: none, iv-gadolinium, unknown.'
        egfr:
          type: number
          format: double
          description: Estimated glomerular filtration rate (mL/min/1.73m2), for gadolinium / NSF risk
            assessment.
        previous_gadolinium_reaction:
          type: string
          enum:
          - none
          - mild
          - moderate
          - severe
          - unknown
          - ''
          description: 'Severity of any previous gadolinium contrast reaction: none, mild, moderate, severe,
            unknown.'
        pregnancy_status:
          type: string
          enum:
          - not-pregnant
          - pregnant
          - possible
          - unknown
          - not-applicable
          - ''
          description: 'Pregnancy status: not-pregnant, pregnant, possible, unknown, not-applicable.'
        pacemaker_or_icd:
          type: boolean
          description: 'MRI safety: cardiac pacemaker or implantable cardioverter defibrillator (ICD)
            present.'
        cochlear_implant:
          type: boolean
          description: 'MRI safety: cochlear implant present.'
        aneurysm_clip:
          type: boolean
          description: 'MRI safety: intracranial aneurysm clip present.'
        metallic_foreign_body_eye:
          type: boolean
          description: 'MRI safety: metallic foreign body in the eye / orbit.'
        shrapnel_or_metal_fragments:
          type: boolean
          description: 'MRI safety: shrapnel or other embedded metal fragments.'
        programmable_shunt:
          type: boolean
          description: 'MRI safety: programmable cerebrospinal-fluid shunt present.'
        neurostimulator:
          type: boolean
          description: 'MRI safety: neurostimulator (e.g. deep brain, spinal cord, vagus nerve) present.'
        metal_implant_or_prosthesis:
          type: boolean
          description: 'MRI safety: metal implant, prosthesis, or other surgical hardware present.'
        insulin_pump:
          type: boolean
          description: 'MRI safety: insulin pump or other external infusion device present.'
        claustrophobia:
          type: boolean
          description: 'MRI safety: claustrophobia that may require sedation or open-bore scanner.'
        mri_safety_status:
          type: string
          enum:
          - cleared
          - conditional
          - needs-review
          - unsafe
          - ''
          description: 'Referrer''s preliminary MRI safety view: cleared, conditional, needs-review, unsafe.'
        weight_kg:
          type: number
          format: double
          description: Patient weight in kg, for scanner bore / table weight limit.
        relevant_previous_imaging:
          type: string
          maxLength: 1000
          description: Relevant previous imaging (modality, date, finding) for comparison.
        urgency:
          type: string
          enum:
          - routine
          - urgent
          - emergency
          - ''
          description: 'Requested triage urgency: routine, urgent, emergency.'
        supervising_consultant:
          type: string
          maxLength: 255
          description: Name of the supervising / responsible consultant.
        notes:
          type: string
          maxLength: 1000
          description: Free-text additional notes.
      required:
      - created_at
      - updated_at
      - patient_id
      - clinician_id
      - status
      - site_name
      - setting
      - body_region
      - primary_indication
      - clinical_question
      - relevant_history
      - contrast_required
      - previous_gadolinium_reaction
      - pregnancy_status
      - pacemaker_or_icd
      - cochlear_implant
      - aneurysm_clip
      - metallic_foreign_body_eye
      - shrapnel_or_metal_fragments
      - programmable_shunt
      - neurostimulator
      - metal_implant_or_prosthesis
      - insulin_pump
      - claustrophobia
      - mri_safety_status
      - relevant_previous_imaging
      - urgency
      - supervising_consultant
      - notes
      description: MRI scan request (referral). Captures the requested examination (body region, indication,
        clinical question), contrast and gadolinium / renal (NSF) risk, MRI safety screening for ferromagnetic
        and electronic implants, and triage urgency.
    MriScanTestRequestGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        mri_scan_test_request_id:
          type: string
          format: uuid
          description: Foreign key to the parent request (unique, 1:1).
        appropriateness_score:
          type: integer
          format: int32
          description: ACR Appropriateness Criteria score (1-9).
        appropriateness_band:
          type: string
          enum:
          - usually-appropriate
          - may-be-appropriate
          - usually-not-appropriate
          - ''
          description: 'Appropriateness band: usually-appropriate (7-9), may-be-appropriate (4-6), usually-not-appropriate
            (1-3).'
        mri_safety_band:
          type: string
          enum:
          - cleared
          - conditional
          - needs-mri-physics-review
          - contraindicated
          - ''
          description: 'MRI safety band: cleared, conditional, needs-mri-physics-review, contraindicated.'
        contrast_renal_flag:
          type: string
          enum:
          - none
          - caution
          - contraindicated
          - unknown
          - ''
          description: 'Gadolinium-versus-eGFR / NSF risk: none, caution (eGFR 30-60), contraindicated
            (eGFR < 30), unknown.'
        completeness_percent:
          type: integer
          format: int32
          description: Request completeness as a percentage of mandatory fields (0-100).
        triage_tier:
          type: string
          enum:
          - routine
          - urgent
          - emergency
          - ''
          description: 'Assigned triage tier: routine, urgent, emergency.'
        target_timeframe:
          type: string
          maxLength: 50
          description: Target timeframe for the scan implied by the triage tier.
        recommendation:
          type: string
          enum:
          - accept
          - query-referrer
          - redirect
          - reject
          - ''
          description: 'Vetting recommendation: accept, query-referrer, redirect, reject.'
        clinician_notes:
          type: string
          description: Free-text vetting notes.
        signed_at:
          type: string
          format: date-time
          description: Timestamp of vetting clinician electronic signature.
        graded_at:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the result.
      required:
      - created_at
      - updated_at
      - mri_scan_test_request_id
      - appropriateness_band
      - mri_safety_band
      - contrast_renal_flag
      - triage_tier
