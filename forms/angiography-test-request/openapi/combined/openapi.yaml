components:
  schemas:
    AngiographyTestRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the patient.
        clinicianId:
          type: string
          format: uuid
          description: Foreign key to the requesting clinician (referrer).
        status:
          type: string
          enum:
          - draft
          - submitted
          - vetted
          - scheduled
          - rejected
          - ''
          description: 'Request lifecycle status: draft, submitted, vetted, scheduled, rejected.'
        siteName:
          type: string
          maxLength: 255
          description: Name of the requesting site or clinic.
        setting:
          type: string
          enum:
          - outpatient
          - inpatient
          - community
          - emergency
          - ''
          description: 'Care setting: outpatient, inpatient, community, emergency.'
        referralDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the referral was made.
        requestedByDate:
          type:
          - string
          - 'null'
          format: date
          description: Date by which the examination is requested to be performed.
        angiographyType:
          type: string
          enum:
          - ct-angiography
          - mr-angiography
          - catheter-dsa
          - coronary-angiography
          - peripheral-angiography
          - cerebral-angiography
          - other
          - ''
          description: 'Requested angiography modality: ct-angiography, mr-angiography, catheter-dsa,
            coronary-angiography, peripheral-angiography, cerebral-angiography, other.'
        bodyRegion:
          type: string
          enum:
          - coronary
          - cerebral
          - carotid
          - aorta
          - renal
          - peripheral-lower-limb
          - pulmonary
          - mesenteric
          - other
          - ''
          description: 'Vascular territory examined: coronary, cerebral, carotid, aorta, renal, peripheral-lower-limb,
            pulmonary, mesenteric, other.'
        primaryIndication:
          type: string
          enum:
          - suspected-coronary-disease
          - peripheral-arterial-disease
          - aneurysm
          - stenosis
          - suspected-pulmonary-embolism
          - gi-bleeding
          - pre-intervention-planning
          - suspected-stroke
          - other
          - ''
          description: Primary clinical indication, used for appropriateness scoring.
        clinicalQuestion:
          type: string
          maxLength: 1000
          description: Specific clinical question the examination should answer (highest-value field).
        relevantHistory:
          type: string
          maxLength: 1000
          description: Relevant medical, surgical, and vascular history.
        contrastRequired:
          type: string
          enum:
          - iodinated
          - gadolinium
          - none
          - unknown
          - ''
          description: 'Contrast agent required: iodinated, gadolinium, none, unknown.'
        egfr:
          type:
          - number
          - 'null'
          format: double
          description: Estimated glomerular filtration rate (mL/min/1.73 m2), used for contrast renal-safety
            assessment.
        contrastAllergy:
          type: boolean
          description: Whether the patient has a previous contrast-media allergy / reaction.
        diabetes:
          type: boolean
          description: Whether the patient has diabetes mellitus.
        metformin:
          type: boolean
          description: Whether the patient takes metformin (relevant to iodinated contrast / lactic-acidosis
            risk).
        takingAnticoagulant:
          type: boolean
          description: Whether the patient is taking an anticoagulant.
        anticoagulantAgent:
          type: string
          maxLength: 255
          description: Name of the anticoagulant agent (e.g. warfarin, apixaban, rivaroxaban).
        takingAntiplatelet:
          type: boolean
          description: Whether the patient is taking an antiplatelet agent.
        bleedingDisorder:
          type: boolean
          description: Whether the patient has a known bleeding disorder.
        pregnancyStatus:
          type: string
          enum:
          - not-pregnant
          - pregnant
          - possible
          - unknown
          - not-applicable
          - ''
          description: 'Pregnancy status for radiation safety: not-pregnant, pregnant, possible, unknown,
            not-applicable.'
        urgency:
          type: string
          enum:
          - routine
          - urgent
          - emergency
          - ''
          description: 'Requested triage urgency: routine, urgent, emergency.'
        irMeRJustification:
          type: string
          maxLength: 1000
          description: IR(ME)R justification for the radiation exposure (Ionising Radiation Medical Exposure
            Regulations).
        supervisingConsultant:
          type: string
          maxLength: 255
          description: Name of the supervising / responsible consultant.
        requesterContact:
          type: string
          maxLength: 255
          description: Contact details (bleep / phone) for the requester.
        notes:
          type: string
          maxLength: 1000
          description: Free-text additional notes.
      required:
      - createdAt
      - updatedAt
      - patientId
      - clinicianId
      - status
      - siteName
      - setting
      - angiographyType
      - bodyRegion
      - primaryIndication
      - clinicalQuestion
      - relevantHistory
      - contrastRequired
      - contrastAllergy
      - diabetes
      - metformin
      - takingAnticoagulant
      - anticoagulantAgent
      - takingAntiplatelet
      - bleedingDisorder
      - pregnancyStatus
      - urgency
      - irMeRJustification
      - supervisingConsultant
      - requesterContact
      - notes
      description: Vascular angiography request (referral). Captures the requested examination (modality
        + body region), the clinical indication and question, contrast and renal safety, bleeding / anticoagulation,
        pregnancy / radiation, IR(ME)R justification, and triage urgency.
    AngiographyTestRequestGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        angiographyTestRequestId:
          type: string
          format: uuid
          description: Foreign key to the parent request (unique, 1:1).
        appropriatenessScore:
          type:
          - integer
          - 'null'
          format: int32
          description: ACR Appropriateness Criteria score (1-9).
        appropriatenessBand:
          type: string
          enum:
          - usually-appropriate
          - may-be-appropriate
          - usually-not-appropriate
          - ''
          description: 'Appropriateness band: usually-appropriate (7-9), may-be-appropriate (4-6), usually-not-appropriate
            (1-3).'
        safetyBand:
          type: string
          enum:
          - ok
          - caution
          - contraindicated
          - ''
          description: 'Contrast / radiation safety band: ok, caution, contraindicated (driven by eGFR,
            contrast allergy, anticoagulation, pregnancy).'
        completenessPercent:
          type:
          - integer
          - 'null'
          format: int32
          description: Request completeness as a percentage of mandatory fields (0-100).
        triageTier:
          type: string
          enum:
          - routine
          - urgent
          - emergency
          - ''
          description: 'Assigned triage tier: routine, urgent, emergency.'
        targetTimeframe:
          type: string
          maxLength: 50
          description: Target timeframe for the examination implied by the triage tier.
        recommendation:
          type: string
          enum:
          - accept
          - query-referrer
          - redirect
          - reject
          - ''
          description: 'Vetting recommendation: accept, query-referrer, redirect, reject.'
        clinicianNotes:
          type: string
          description: Free-text vetting notes.
        signedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Timestamp of vetting clinician electronic signature.
        gradedAt:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the result.
      required:
      - createdAt
      - updatedAt
      - angiographyTestRequestId
      - appropriatenessBand
      - safetyBand
      - triageTier
      - targetTimeframe
      - recommendation
      - clinicianNotes
      - gradedAt
      description: 'Computed four-axis grading result: appropriateness (ACR 1-9), contrast / radiation
        safety, request completeness, and triage priority.'
    AngiographyTestRequestGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        angiographyTestRequestGradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        flagId:
          type: string
          maxLength: 50
          description: Stable flag identifier (e.g. F-RENAL-IMPAIRMENT-001).
        category:
          type: string
          enum:
          - contrast-allergy
          - renal-impairment
          - high-bleeding-risk-anticoag
          - pregnancy
          - metformin-contrast
          - missing-indication
          - missing-clinical-question
          - other
          - ''
          description: 'Flag category: contrast-allergy, renal-impairment, high-bleeding-risk-anticoag,
            pregnancy, metformin-contrast, missing-indication, missing-clinical-question, other.'
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          - ''
          description: 'Priority: low, medium, high.'
        description:
          type: string
          maxLength: 500
          description: Human-readable description of what fired the flag.
        suggestedAction:
          type: string
          maxLength: 500
          description: Suggested clinical action (e.g. "check eGFR and arrange renal-protective hydration").
      required:
      - createdAt
      - updatedAt
      - angiographyTestRequestGradeId
      - flagId
      - category
      - priority
      - description
      - suggestedAction
      description: Safety-critical flags that fire independently of the four axes, with priority and a
        suggested action for the imaging team.
    AngiographyTestRequestGradeRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        angiographyTestRequestGradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        ruleId:
          type: string
          maxLength: 40
          description: Stable rule identifier (e.g. R-APPROP-CORONARY-01).
        axis:
          type: string
          enum:
          - appropriateness
          - safety
          - completeness
          - triage
          - ''
          description: 'Scoring axis the rule belongs to: appropriateness, safety, completeness, triage.'
        category:
          type: string
          maxLength: 50
          description: Category or indication the rule relates to.
        description:
          type: string
          maxLength: 500
          description: Human-readable description of why the rule fired.
      required:
      - createdAt
      - updatedAt
      - angiographyTestRequestGradeId
      - ruleId
      - axis
      - category
      - description
      description: Audit trail of every appropriateness / safety / completeness / triage rule that fired
        for this request.
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Name.
        email:
