components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Name.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as full text.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code, such as for validating the postal address.
        role:
          type: string
          enum:
          - haematologist
          - transplant-physician
          - transplant-coordinator
          - nurse
          - phlebotomist
          - other
          - ''
          description: 'Clinician role: haematologist, transplant-physician, transplant-coordinator, nurse,
            phlebotomist, other.'
        registrationBody:
          type: string
          description: Professional registration body, as free text (varies by jurisdiction).
        registrationNumber:
          type: string
          description: Professional registration number.
      required:
      - createdAt
      - updatedAt
      - name
      - role
      - registrationBody
      - registrationNumber
      description: Clinician who requests the tests (and, where different, collects the samples).
    HsctHlaTypingRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        subjectId:
          type: string
          format: uuid
          description: Foreign key to the person sampled.
        clinicianId:
          type: string
          format: uuid
          description: Foreign key to the requesting clinician.
        status:
          type: string
          enum:
          - draft
          - submitted
          - received
          - vetted
          - rejected
          - ''
          description: 'Request lifecycle status: draft, submitted, received, vetted, rejected.'
        requestDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the request was made.
        subjectRole:
          type: string
          enum:
          - hsct-recipient
          - potential-donor
          - ''
          description: 'Role of the person sampled: hsct-recipient, potential-donor. Separates the two
            sample sets the laboratory needs.'
        donorType:
          type: string
          enum:
          - matched-sibling
          - haploidentical-relative
          - other-relative
          - unrelated-volunteer
          - unknown
          - ''
          description: 'Donor type when subject_role is potential-donor: matched-sibling, haploidentical-relative,
            other-relative, unrelated-volunteer, unknown. Not on the source form; recommended.'
        hlaTypingResolution:
          type: string
          enum:
          - not-specified
          - low
          - high
          - ''
          description: 'HLA typing resolution requested: not-specified, low, high. Not on the source form;
            recommended.'
        ethnicity:
          type: string
          maxLength: 100
          description: Self-described ethnicity (mandatory on the source form); informs HLA haplotype
            interpretation.
        clinicalDetails:
          type: string
          maxLength: 1000
          description: 'Clinical details: disease, indication for HSCT, or donor information.'
        referrerDepartment:
          type: string
          maxLength: 255
          description: Department or practice of the requesting clinician.
        referrerOrganization:
          type: string
          maxLength: 255
          description: Hospital or organization of the requesting clinician.
        copyOfReportTo:
          type: string
          maxLength: 255
          description: Name or address for a copy of the report, if any.
        reportEmail:
          type:
          - string
          - 'null'
          description: 'Preferred email address for the report. Health data: use an authorized secure
            address only.'
        recipientFamilyName:
          type: string
          maxLength: 255
          description: 'When the sample is from a relative: the recipient''s family name.'
        recipientGivenNames:
          type: string
          maxLength: 255
          description: 'When the sample is from a relative: the recipient''s given names.'
        recipientMedicalRecordNumber:
          type: string
          maxLength: 40
          description: 'When the sample is from a relative: the recipient''s medical record number.'
        recipientBirthDate:
          type:
          - string
          - 'null'
          format: date
          description: 'When the sample is from a relative: the recipient''s birth date.'
        relationshipToRecipient:
          type: string
          maxLength: 100
          description: 'When the sample is from a relative: relationship to the recipient (for example
            sibling, parent, child).'
        urgentTesting:
          type: boolean
          description: Whether the sample requires urgent testing (the source form says to telephone the
            laboratory).
        urgentTestingReason:
          type: string
          maxLength: 500
          description: Reason urgent testing is needed.
        requestedBySignedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: When the requester signed the request.
        consentAndIdentityConfirmed:
          type: boolean
          description: Requester confirms informed consent was obtained (donor consent separate from recipient
            consent) and identity verified.
        sampleCollectorName:
          type: string
          maxLength: 255
          description: Name of the person who collected the sample.
        sampleCollectedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Date and time the sample was collected.
        identifiersOnSampleCount:
          type:
          - integer
          - 'null'
          format: int32
          description: Number of identifiers on the sample labels (minimum 3 required).
        identifiersOnFormCount:
          type:
          - integer
          - 'null'
          format: int32
          description: Number of identifiers on the request form (minimum 3 required).
        sampleAndFormDetailsMatch:
          type: boolean
          description: Whether the details on the samples and the form match.
        edtaPurpleVolumeMl:
          type:
          - integer
          - 'null'
          format: int32
          description: Total volume of purple-top EDTA blood sent, in mL (recipient 18, potential donor
            10 expected).
        edtaPinkVolumeMl:
          type:
          - integer
          - 'null'
          format: int32
          description: Total volume of pink-top (hand-labelled) EDTA blood sent, in mL (6 expected).
        clottedRedVolumeMl:
          type:
          - integer
          - 'null'
          format: int32
          description: Volume of clotted red-top blood sent, in mL (recipient only, 6 expected).
        samplesOtherDescription:
          type: string
          maxLength: 255
          description: Other sample types sent, if any.
        laboratoryRecipientIdentifier:
          type: string
          maxLength: 100
          description: 'Laboratory use: recipient identifier assigned by the laboratory.'
        laboratoryDonorIdentifier:
          type: string
          maxLength: 100
          description: 'Laboratory use: donor identifier assigned by the laboratory.'
        laboratorySampleNumber:
          type: string
          maxLength: 100
          description: 'Laboratory use: sample number.'
        laboratorySampleReceivedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: 'Laboratory use: date and time the sample was received.'
        laboratoryIdentifiersCheckedBy:
          type: string
          maxLength: 255
          description: 'Laboratory use: name of the person who checked the sample identifiers.'
      required:
