      - updatedAt
      - subjectId
      - clinicianId
      - status
      - subjectRole
      - donorType
      - hlaTypingResolution
      - ethnicity
      - clinicalDetails
      - referrerDepartment
      - referrerOrganization
      - copyOfReportTo
      - recipientFamilyName
      - recipientGivenNames
      - recipientMedicalRecordNumber
      - relationshipToRecipient
      - urgentTesting
      - urgentTestingReason
      - consentAndIdentityConfirmed
      - sampleCollectorName
      - sampleAndFormDetailsMatch
      - samplesOtherDescription
      - laboratoryRecipientIdentifier
      - laboratoryDonorIdentifier
      - laboratorySampleNumber
      - laboratoryIdentifiersCheckedBy
      description: 'HSCT HLA-typing request for one person (recipient or potential donor): role, donor
        type, clinical details, linked recipient details when the sample is from a relative, referrer,
        urgency, sample collection and laboratory-use fields.'
    HsctHlaTypingRequestGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        requestId:
          type: string
          format: uuid
          description: Foreign key to the graded request (one grade per request).
        appropriatenessScore:
          type:
          - integer
          - 'null'
          format: int32
          description: Axis A appropriateness, 1-9 ordinal. No published score exists; anchored on laboratory
            standards and labelled as such.
        appropriatenessBand:
          type: string
          enum:
          - usually-appropriate
          - may-be-appropriate
          - usually-not-appropriate
          - ''
          description: 'Axis A band: usually-appropriate (7-9), may-be-appropriate (4-6), usually-not-appropriate
            (1-3).'
        identitySafetyBand:
          type: string
          enum:
          - ok
          - caution
          - reject-risk
          - ''
          description: 'Axis B identity / sample safety band: ok, caution, reject-risk.'
        completenessPercent:
          type:
          - integer
          - 'null'
          format: int32
          description: Axis C completeness, 0-100 percent.
        triageTier:
          type: string
          enum:
          - routine
          - urgent
          - emergency
          - stat
          - ''
          description: 'Axis D triage tier: routine, urgent, emergency, stat.'
        targetTimeframe:
          type: string
          maxLength: 50
          description: Target turnaround implied by the triage tier (local policy).
        requiredSamplesSummary:
          type: string
          maxLength: 500
          description: Sample tubes and volumes the requested tests need, derived from the tests chosen.
        recommendation:
          type: string
          enum:
          - accept
          - query-referrer
          - reject
          - ''
          description: 'Vetting recommendation: accept, query-referrer, reject.'
        clinicianNotes:
          type: string
          maxLength: 1000
          description: Free-text vetting notes.
        signedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Timestamp of the vetting person's electronic signature.
        gradedAt:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the result.
      required:
      - createdAt
      - updatedAt
      - requestId
      - appropriatenessBand
      - identitySafetyBand
      - triageTier
      - targetTimeframe
      - requiredSamplesSummary
      - recommendation
      - clinicianNotes
      - gradedAt
      description: 'Computed result of the four-axis engine for one request: appropriateness, identity
        / sample safety, completeness and triage priority, plus the vetting recommendation.'
    HsctHlaTypingRequestGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        gradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        flagId:
          type: string
          maxLength: 50
          description: Stable flag identifier (for example F-DAY-OF-TRANSPLANT-001).
        category:
          type: string
          enum:
          - donor-without-recipient-details
          - sample-volume-insufficient
          - identity-mismatch-risk
          - urgent-without-reason
          - missing-ethnicity
          - no-clinical-details
          - other
          - ''
          description: Flag category.
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          - ''
          description: 'Priority: low, medium, high.'
        description:
          type: string
          maxLength: 500
          description: Human-readable description of what fired the flag.
        suggestedAction:
          type: string
          maxLength: 500
          description: Suggested action for the requester or laboratory.
      required:
      - createdAt
      - updatedAt
      - gradeId
      - flagId
      - category
      - priority
      - description
      - suggestedAction
      description: Safety-critical flags that fire independently of the four axes, with priority and a
        suggested action.
    HsctHlaTypingRequestGradeRule:
