components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        name:
          type: string
          description: Certifying doctor full name as registered with the GMC.
        email:
          type: string
          description: Email address.
        phone:
          type: string
          description: Phone number.
        postal_address_as_full_text:
          type: string
          description: Postal address as a single text block.
        country_as_iso_3166_1_alpha_2:
          type: string
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2.
        postcode:
          type: string
          description: Postal code.
        role:
          type: string
          enum:
          - consultant
          - sas
          - registrar
          - foundation
          - gp
          - other
          - ''
          description: 'Grade of the certifying doctor: consultant, sas, registrar, foundation, gp, or
            other.'
        registration_body:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - GPhC
          - other
          - ''
          description: 'Professional registration body: GMC, NMC, HCPC, GPhC, or other.'
        registration_number:
          type: string
          description: Professional registration number (typically the GMC reference).
      required:
      - created_at
      - updated_at
      - name
      - role
      - registration_body
      - registration_number
      description: Clinician information for the certifying doctor who completes the Medical Certificate
        of Cause of Death.
    MedicalCertificateOfCauseOfDeath:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        patient_id:
          type: string
          format: uuid
          description: Foreign key to the deceased this certificate documents (restrict delete).
        clinician_id:
          type: string
          format: uuid
          description: Foreign key to the certifying doctor (restrict delete); optional.
        certifying_doctor_name:
          type: string
          description: Name of the attending practitioner certifying the cause of death.
        certifying_doctor_grade:
          type: string
          enum:
          - consultant
          - sas
          - registrar
          - foundation
          - gp
          - other
          - ''
          description: 'Grade of the certifying doctor: consultant, sas, registrar, foundation, gp, or
            other.'
        gmc_reference:
          type: string
          maxLength: 50
          description: GMC registration number of the certifying doctor.
        place_of_certification:
          type: string
          description: 'Place where the certificate is completed: hospital, practice, or other.'
        certification_date:
          type: string
          format: date
          description: Date the certificate was completed.
        attended_deceased:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the certifier attended the deceased during the last illness (yes/no).
        last_seen_alive_date:
          type: string
          format: date
          description: Date the certifier last saw the deceased alive.
        deceased_name:
          type: string
          description: Full name of the deceased as recorded on the certificate.
        sex:
          type: string
          enum:
          - female
          - male
          - other
          - unknown
          - ''
          description: 'Sex of the deceased: female, male, other, or unknown.'
        date_of_birth:
          type: string
          format: date
          description: Date of birth of the deceased.
        age_years:
          type: integer
          format: int32
          description: Age of the deceased at death, in whole years.
        patient_identifier:
          type: string
          maxLength: 100
          description: NHS number or local identifier of the deceased as recorded on the certificate.
        date_of_death:
          type: string
          format: date
          description: Date of death.
        time_of_death:
          type: string
          format: time
          description: Time of death.
        place_of_death:
          type: string
          description: 'Place of death: ward, home, hospice, or other.'
        seen_after_death_by:
          type: string
          enum:
          - certifier
          - another-practitioner
          - not-seen
          - ''
          description: 'Who saw the body after death: certifier, another-practitioner, or not-seen.'
        cause_ia_condition:
          type: string
          description: 'Part I(a): the disease or condition directly leading to death (required).'
        cause_ia_interval:
          type: string
          description: 'Part I(a): approximate interval between onset and death.'
        cause_ib_condition:
          type: string
          description: 'Part I(b): the antecedent condition giving rise to I(a).'
        cause_ib_interval:
          type: string
          description: 'Part I(b): approximate interval between onset and death.'
        cause_ic_condition:
          type: string
          description: 'Part I(c): the underlying condition giving rise to I(b).'
        cause_ic_interval:
          type: string
          description: 'Part I(c): approximate interval between onset and death.'
        part_ii_conditions:
          type: string
          description: 'Part II: other significant conditions contributing to death but not part of the
            Part I sequence.'
        part_ii_interval:
          type: string
          description: 'Part II: approximate interval between onset and death (optional).'
        referred_to_coroner:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the death has been referred to the coroner (yes/no).
        coroner_reason:
          type: string
          enum:
          - unnatural
          - violent
          - suspicious
          - unknown-cause
          - industrial-disease
          - medical-procedure
          - custody
          - no-attending-practitioner
          - other
          - none
          - ''
          description: 'Coroner-referral criterion, if any: unnatural, violent, suspicious, unknown-cause,
            industrial-disease, medical-procedure, custody, no-attending-practitioner, other, or none.'
        medical_examiner_status:
          type: string
          enum:
          - scrutinised
          - discussed
          - pending
          - not-required
          - ''
          description: 'Medical-examiner scrutiny status: scrutinised, discussed, pending, or not-required.'
        certifier_note:
          type: string
          description: Free-text note from the certifying doctor.
      required:
      - created_at
      - updated_at
      - patient_id
      - certifying_doctor_name
      - certifying_doctor_grade
      - gmc_reference
      - place_of_certification
      - attended_deceased
      - deceased_name
      - sex
      - patient_identifier
      - place_of_death
      - seen_after_death_by
      - cause_ia_condition
      - cause_ia_interval
      - cause_ib_condition
      - cause_ib_interval
      - cause_ic_condition
      - cause_ic_interval
      - part_ii_conditions
      - part_ii_interval
      - referred_to_coroner
      - coroner_reason
      - medical_examiner_status
      - certifier_note
      description: 'Main Medical Certificate of Cause of Death (MCCD) record: certification context, deceased
        death details, the Part I direct causal sequence (I(a) -> I(b) -> I(c)) with onset-to-death intervals,
        the Part II contributory conditions, and the coroner / medical-examiner referral status. Validity
        classification, fired rules, and flags live in child tables.'
    MedicalCertificateOfCauseOfDeathGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the row was soft-deleted.
        medical_certificate_of_cause_of_death_id:
          type: string
          format: uuid
          description: Foreign key to the parent certificate (unique, 1:1).
        validity_class:
          type: string
          enum:
          - valid
          - incomplete
          - refer-to-coroner
          - ''
          description: 'Validity classification: valid, incomplete, or refer-to-coroner (refer-to-coroner
            takes precedence).'
        underlying_cause:
          type: string
          description: 'Derived underlying cause of death: the lowest completed Part I line (I(c) else
            I(b) else I(a)); empty when Part I is empty.'
        coroner_referral_indicated:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether a coroner-referral criterion is indicated (yes/no).
        graded_at:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the classification.
      required:
      - created_at
      - updated_at
      - medical_certificate_of_cause_of_death_id
      - validity_class
      - underlying_cause
      - coroner_referral_indicated
      - graded_at
      description: 'Computed completeness and validity-classification result for a Medical Certificate
        of Cause of Death: validity class (valid/incomplete/refer-to-coroner), derived underlying cause
        of death, and whether a coroner-referral criterion is indicated.'
    MedicalCertificateOfCauseOfDeathGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the row was soft-deleted.
        medical_certificate_of_cause_of_death_grade_id:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        flag_id:
          type: string
          maxLength: 50
          description: Stable flag identifier (e.g. F-CORONER-REFERRAL-REQUIRED-001).
        category:
          type: string
          enum:
          - coroner-referral-required
          - unacceptable-sole-cause
          - missing-part-i
          - illogical-sequence
          - medical-examiner-scrutiny
          - missing-interval
          - incomplete-certifier
          - other
          - ''
          description: 'Flag category: coroner-referral-required, unacceptable-sole-cause, missing-part-i,
            illogical-sequence, medical-examiner-scrutiny, missing-interval, incomplete-certifier, or
            other.'
        priority:
          type: string
