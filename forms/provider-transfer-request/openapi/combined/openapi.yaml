components:
  schemas:
    Assessment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        patient_id:
          type: string
          format: uuid
          description: Foreign key to the patient who owns this assessment.
        status:
          type: string
          enum:
          - draft
          - submitted
          - reviewed
          - urgent
          description: 'Lifecycle status: draft, submitted, reviewed, or urgent.'
      required:
      - created_at
      - updated_at
      - patient_id
      - status
      description: Top-level assessment instance for provider-transfer-request. Parent entity for domain-specific
        sections and the grading result.
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Name.
        email:
          type: string
          description: Email address.
        phone:
          type: string
          description: Phone number.
        postal_address_as_full_text:
          type: string
          description: Postal address as full text.
        country_as_iso_3166_1_alpha_2:
          type: string
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type: string
          description: Postal code, such as for validating the postal address.
        role:
          type: string
          enum:
          - anaesthetist
          - surgeon
          - preop-nurse
          - perioperative-physician
          - geriatrician
          - pharmacist
          - other
          - ''
          description: Clinician role.
        registration_body:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - GPhC
          - other
          - ''
          description: Clinician registration body.
        registration_number:
          type: string
          description: Clinician registration number.
        united_kingdom_nhs_number:
          type: string
          maxLength: 12
          description: United Kingdom NHS number, unique per person.
      required:
      - created_at
      - updated_at
      - name
      - role
      - registration_body
      - registration_number
      description: Clinician
    Grade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        assessment_id:
          type: string
          format: uuid
          description: Foreign key to the parent assessment (unique, enforcing 1:1).
        result_category:
          type: string
          maxLength: 100
          description: Form-specific outcome label.
        result_score:
          type: number
          format: double
          description: Optional numeric score for quantitative instruments.
        result_notes:
          type: string
          description: Free-text clinician notes accompanying the result.
        graded_at:
          type: string
          format: date-time
          description: Timestamp when the grading was computed.
      required:
      - created_at
      - updated_at
      - assessment_id
      - result_category
      - result_notes
      - graded_at
      description: Computed grading / scoring result. One-to-one child of assessment. The result_category
        column holds a form-specific label (e.g. Low, Moderate, High, or Complete/Incomplete); result_score
        is optional for numeric instruments.
    GradingAdditionalFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        grade_id:
          type: string
          format: uuid
          description: Foreign key to the parent grading result.
        flag_id:
          type: string
          maxLength: 50
          description: Stable identifier of the flag.
        category:
          type: string
          maxLength: 100
          description: Category / domain of the flag.
        description:
          type: string
          description: Human-readable description of the flag.
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          - critical
          description: 'Priority: low, medium, high, critical.'
      required:
      - created_at
      - updated_at
      - grade_id
      - flag_id
      - category
      - description
      - priority
      description: Safety-critical clinical flags raised alongside the grading result.
    GradingFiredRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        grade_id:
          type: string
          format: uuid
          description: Foreign key to the parent grading result.
        rule_id:
          type: string
          maxLength: 50
          description: Stable identifier of the rule that fired.
        category:
          type: string
          maxLength: 100
          description: Category / domain of the rule.
        description:
          type: string
          description: Human-readable description of the rule condition.
        severity_level:
          type: string
          enum:
          - low
          - medium
          - high
          - critical
          - ''
          description: 'Severity of the finding: low, medium, high, critical, or empty for non-severity
            rules.'
      required:
      - created_at
      - updated_at
      - grade_id
      - rule_id
      - category
      - description
      - severity_level
      description: Individual rules that evaluated to true during grading.
    Patient:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-deleted.
        name:
          type: string
          maxLength: 255
          description: Name.
        birth_date:
          type: string
          format: date
          description: Birth date.
        email:
          type: string
          description: Email address.
        phone:
          type: string
          description: Phone number.
        postal_address_as_full_text:
          type: string
          description: Postal address as full text.
        country_as_iso_3166_1_alpha_2:
          type: string
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type: string
          description: Postal code, such as for validating the postal address.
        united_kingdom_nhs_number:
          type: string
          maxLength: 20
          description: United Kingdom NHS number, unique per person.
        waist_as_cm:
          type: number
          format: double
          description: Waist circumference measurement in cm, such as for calculating waist-height ratio
            (WHR).
        height_as_cm:
          type: number
          format: double
          description: Height measurement in cm, such as for calculating waist-height ratio (WHR).
        weight_as_kg:
          type: number
          format: double
          description: Weight as kg.
        body_mass_index:
          type: number
          format: double
          description: Body mass index (BMI) measurement.
        waist_height_ratio:
          type: number
          format: double
          description: Waist-height ratio (WHR) measurement.
        vo2_max:
          type: number
          format: double
          description: VO2 max measurement.
      required:
      - created_at
      - updated_at
      - name
      - birth_date
      description: Patient
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          description: A URI identifying the problem type
        title:
          type: string
          description: A short summary of the problem type
        status:
          type: integer
          description: The HTTP status code
        detail:
          type: string
          description: An explanation of this occurrence
        instance:
          type: string
          description: A URI identifying this occurrence
        code:
          type: string
          description: A short machine-readable reason
        errors:
          type: object
          description: Per-field detail, when validation failed
      required:
      - type
      - title
      - status
