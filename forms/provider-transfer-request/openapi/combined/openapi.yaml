        '429':
          description: This client sent too many requests
          headers:
            retry-after:
              description: Seconds to wait before sending again
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/patients:
    get:
      summary: List Patient records
      operationId: listPatient
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 100
        required: false
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          maximum: 100000
          default: 0
        required: false
      responses:
        '200':
          description: A page of Patient records
          headers:
            x-total-count:
              description: Rows there are in all
              schema:
                type: integer
            x-limit:
              description: The limit applied
              schema:
                type: integer
            x-offset:
              description: The offset applied
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Patient'
        '400':
          description: The offset is past the maximum
