components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        name:
          type: string
          description: Clinician full name as recorded on the ward round.
        email:
          type: string
          description: Email address.
        phone:
          type: string
          description: Phone number.
        postal_address_as_full_text:
          type: string
          description: Postal address as a single text block.
        country_as_iso_3166_1_alpha_2:
          type: string
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2.
        postcode:
          type: string
          description: Postal code.
        role:
          type: string
          enum:
          - ward-doctor
          - acp
          - physician-associate
          - consultant
          - nurse
          - pharmacist
          - other
          - ''
          description: 'Ward-round role: ward-doctor, acp (advanced clinical practitioner), physician-associate,
            consultant, nurse, pharmacist, or other.'
        registration_body:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - GPhC
          - other
          - ''
          description: 'Professional registration body: GMC, NMC, HCPC, GPhC, or other.'
        registration_number:
          type: string
          description: Professional registration number issued by the registration body.
      required:
      - created_at
      - updated_at
      - name
      - role
      - registration_body
      - registration_number
      description: Clinician identifying information for the reviewing clinician who documented a ward-round
        note.
    Patient:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        name:
          type: string
          maxLength: 255
          description: Full patient name.
        birth_date:
          type: string
          format: date
          description: Date of birth.
        sex:
          type: string
          enum:
          - female
          - male
          - intersex
          - unknown
          - ''
          description: 'Sex recorded for clinical purposes: female, male, intersex, or unknown.'
        email:
          type: string
          description: Email address.
        phone:
          type: string
          description: Phone number.
        postal_address_as_full_text:
          type: string
          description: Postal address as a single text block.
        country_as_iso_3166_1_alpha_2:
          type: string
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2.
        postcode:
          type: string
          description: Postal code.
        united_kingdom_nhs_number:
          type: string
          maxLength: 20
          description: United Kingdom NHS number, unique per person.
        hospital_mrn:
          type: string
          maxLength: 50
          description: Local hospital medical record number (MRN).
        height_as_cm:
          type: number
          format: double
          description: Height in centimetres.
        weight_as_kg:
          type: number
          format: double
          description: Weight in kilograms.
        body_mass_index:
          type: number
          format: double
          description: Body mass index (BMI), kg/m^2.
        allergies_summary:
          type: string
          description: Free-text summary of known allergies.
      required:
      - created_at
      - updated_at
      - name
      - birth_date
      - sex
      - allergies_summary
      description: Patient demographic information used by the ward-round-note record.
    WardRoundNote:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        patient_id:
          type: string
          format: uuid
          description: Foreign key to the patient this review documents (restrict delete).
        clinician_id:
          type: string
          format: uuid
          description: Foreign key to the reviewing clinician (restrict delete); optional.
        clinician_name:
          type: string
          description: 'Name of the reviewing clinician (required component: header).'
        clinician_grade:
          type: string
          enum:
          - fy1
          - fy2
          - core-trainee
          - specialty-registrar
          - acp
          - physician-associate
          - consultant
          - ''
          description: 'Grade of the reviewing clinician: fy1, fy2, core-trainee, specialty-registrar,
            acp, physician-associate, or consultant (required component: header).'
        reviewed_at:
          type: string
          format: date-time
          description: 'Date and time of the review (required component: header).'
        ward:
          type: string
          description: Ward or location where the review took place.
        patient_identifier:
          type: string
          maxLength: 100
          description: Local patient identifier as recorded on the entry.
        admission_date:
          type: string
          format: date
          description: Date of admission.
        primary_diagnosis:
          type: string
          description: Reason for admission or working diagnosis.
        overnight_events:
          type: string
          description: 'Component 2: overnight events since the previous review (recommended component).'
        no_overnight_events:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Explicit "no overnight events" flag (yes/no); yes documents component 2 as a deliberate
            negative.
        problem_list:
          type: string
          description: 'Component 3: current issues, problem list, and progress (required component: problems).'
        examination_summary:
          type: string
          description: 'Component 4: examination summary (required component: examination, with news2_total).'
        news2_total:
          type: integer
          format: int32
          description: 'Component 4: latest NEWS2 total (0..20+); NULL when unrecorded.'
        news2_single_param_three:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether any single NEWS2 parameter scores 3 (yes/no); drives the deteriorating-NEWS2
            flag.
        observation_trend:
          type: string
          enum:
          - improving
          - stable
          - deteriorating
          - ''
          description: 'Component 4: observation trend: improving, stable, or deteriorating.'
        investigations_reviewed:
          type: string
          description: 'Component 5: investigations and results reviewed (required component: investigations).'
        no_investigations_outstanding:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Explicit "none outstanding" flag (yes/no); yes documents component 5 as a deliberate
            negative.
        abnormal_result_flagged:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether an abnormal or critical result is present (yes/no); drives the abnormal-results-not-actioned
            flag.
        abnormal_result_actioned:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether an action was recorded for the abnormal result (yes/no).
        vte_status:
          type: string
          enum:
          - assessed
          - not-required
          - not-done
          - ''
          description: 'Component 6: VTE assessment status: assessed, not-required, or not-done (required
            component: vte).'
        vte_prophylaxis_in_place:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether VTE prophylaxis is in place (yes/no).
        medication_changes:
          type: string
          description: 'Component 7: medication changes made on the review (required component: medication).'
        no_medication_changes:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Explicit "no medication changes" flag (yes/no); yes documents component 7 as a
            deliberate negative.
        plan_and_jobs:
          type: string
          description: 'Component 8: plan and jobs for the day (required component: plan).'
        escalation_status:
          type: string
          enum:
          - for-full-escalation
          - ward-level-ceiling
          - dnacpr
          - not-recorded
          - ''
          description: 'Component 9: escalation / ceiling-of-care status: for-full-escalation, ward-level-ceiling,
            dnacpr, or not-recorded (required component: escalation).'
        senior_review_present:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether a consultant or senior grade is named on the entry (yes/no); drives the
            no-senior-review flag.
        estimated_discharge_date:
          type: string
          format: date
          description: 'Component 10: estimated date of discharge; NULL when not set (recommended component).'
        discharge_not_estimable:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Explicit "not yet estimable" flag (yes/no); yes documents component 10 as a deliberate
            negative.
        clinical_note:
          type: string
          description: Optional free-text summary note shown in the summary.
      required:
      - created_at
      - updated_at
      - patient_id
      - clinician_name
      - clinician_grade
      - ward
      - patient_identifier
      - primary_diagnosis
      - overnight_events
      - no_overnight_events
      - problem_list
      - examination_summary
      - news2_single_param_three
      - observation_trend
      - investigations_reviewed
      - no_investigations_outstanding
      - abnormal_result_flagged
      - abnormal_result_actioned
      - vte_status
      - vte_prophylaxis_in_place
      - medication_changes
      - no_medication_changes
      - plan_and_jobs
      - escalation_status
      - senior_review_present
      - discharge_not_estimable
      - clinical_note
      description: 'Main ward-round-note record for one daily inpatient review: review header, patient
        and clinician identification, and the ten review components (overnight events, problem list, examination
        and NEWS2, investigations, VTE, medication, plan, escalation, estimated discharge) as free text
        and enum flags. Completeness grade, fired rules, and flags live in child tables.'
    WardRoundNoteGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the row was soft-deleted.
        ward_round_note_id:
          type: string
          format: uuid
          description: Foreign key to the parent ward-round note (unique, 1:1).
        status:
          type: string
          enum:
          - complete
          - partial
          - incomplete
          - ''
          description: 'Completeness status: complete, partial, or incomplete.'
        completeness_percent:
          type: integer
          format: int32
          description: 'Completeness percentage (0..100): documented required components / 8 x 100.'
        header_documented:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the header component is documented (yes/no).
