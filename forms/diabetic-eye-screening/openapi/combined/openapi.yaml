components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        name:
          type: string
          description: Screener / grader full name.
        email:
          type: string
          description: Email address.
        phone:
          type: string
          description: Phone number.
        postal_address_as_full_text:
          type: string
          description: Postal address as a single text block.
        country_as_iso_3166_1_alpha_2:
          type: string
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2.
        postcode:
          type: string
          description: Postal code.
        role:
          type: string
          enum:
          - screener
          - primary-grader
          - secondary-grader
          - ophthalmologist
          - other
          - ''
          description: 'Grader role: screener, primary-grader, secondary-grader, ophthalmologist, or other.'
        registration_body:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - GPhC
          - other
          - ''
          description: 'Professional registration body: GMC, NMC, HCPC, GPhC, or other.'
        registration_number:
          type: string
          description: Professional registration number issued by the registration body.
      required:
      - created_at
      - updated_at
      - name
      - role
      - registration_body
      - registration_number
      description: Clinician identifying information for the screener / grader who assigned the retinal
        grade for the diabetic eye screening episode.
    DiabeticEyeScreening:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        patient_id:
          type: string
          format: uuid
          description: Foreign key to the patient this screening documents (restrict delete).
        clinician_id:
          type: string
          format: uuid
          description: Foreign key to the screener / grader clinician (restrict delete); optional.
        grader_name:
          type: string
          description: Name of the screener / grader who assigned the grade.
        grader_role:
          type: string
          enum:
          - screener
          - primary-grader
          - secondary-grader
          - ophthalmologist
          - other
          - ''
          description: 'Grader role: screener, primary-grader, secondary-grader, ophthalmologist, or other.'
        graded_at:
          type: string
          format: date
          description: Date the grade was assigned; drives the patient-overdue comparison.
        image_captured_at:
          type: string
          format: date
          description: Date the retinal images were captured.
        imaging_media:
          type: string
          enum:
          - digital-fundus
          - mydriatic
          - non-mydriatic
          - oct
          - other
          - ''
          description: 'Imaging modality: digital-fundus, mydriatic, non-mydriatic, oct, or other.'
        patient_identifier:
          type: string
          maxLength: 100
          description: Local or NHS patient identifier as recorded on the record.
        age_band:
          type: string
          enum:
          - under-12
          - 12-17
          - 18-64
          - 65-plus
          - ''
          description: Screening-eligible age band (>= 12); under-12 is outside programme eligibility.
        diabetes_type:
          type: string
          enum:
          - type-1
          - type-2
          - other
          - unknown
          - ''
          description: 'Diabetes type: type-1, type-2, other, or unknown.'
        years_since_diagnosis:
          type: number
          format: double
          description: Years since diabetes diagnosis.
        previous_screen_date:
          type: string
          format: date
          description: Date of the most recent previous screen; drives overdue and low-risk eligibility.
        previous_screen_result:
          type: string
          enum:
          - r0m0
          - background
          - referable
          - none
          - unknown
          - ''
          description: 'Result of the previous screen: r0m0, background, referable, none, or unknown;
            r0m0 is required for low-risk 24-month recall.'
        right_retinopathy_grade:
          type: string
          enum:
          - R0
          - R1
          - R2
          - R3A
          - R3S
          - ''
          description: 'Right-eye retinopathy (R) grade: R0, R1, R2, R3A, or R3S.'
        right_maculopathy_grade:
          type: string
          enum:
          - M0
          - M1
          - ''
          description: 'Right-eye maculopathy (M) grade: M0 or M1.'
        right_photocoagulation:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Right-eye photocoagulation (P) marker: yes or no; contextual, does not change
            the pathway.'
        right_ungradable:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Right-eye ungradable (U) marker: yes or no; yes routes to slit-lamp unless referable
            disease routes to HES.'
        right_visual_acuity:
          type: string
          description: Right-eye visual acuity as recorded (e.g. logMAR or Snellen); optional.
        left_retinopathy_grade:
          type: string
          enum:
          - R0
          - R1
          - R2
          - R3A
          - R3S
          - ''
          description: 'Left-eye retinopathy (R) grade: R0, R1, R2, R3A, or R3S.'
        left_maculopathy_grade:
          type: string
          enum:
          - M0
          - M1
          - ''
          description: 'Left-eye maculopathy (M) grade: M0 or M1.'
        left_photocoagulation:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Left-eye photocoagulation (P) marker: yes or no; contextual, does not change the
            pathway.'
        left_ungradable:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Left-eye ungradable (U) marker: yes or no; yes routes to slit-lamp unless referable
            disease routes to HES.'
        left_visual_acuity:
          type: string
          description: Left-eye visual acuity as recorded (e.g. logMAR or Snellen); optional.
        clinical_context:
          type: string
          description: Optional free-text clinical context shown in the summary.
      required:
      - created_at
      - updated_at
      - patient_id
      - grader_name
      - grader_role
      - imaging_media
      - patient_identifier
      - age_band
      - diabetes_type
      - previous_screen_result
      - right_retinopathy_grade
      - right_maculopathy_grade
      - right_photocoagulation
      - right_ungradable
      - right_visual_acuity
      - left_retinopathy_grade
      - left_maculopathy_grade
      - left_photocoagulation
      - left_ungradable
      - left_visual_acuity
      - clinical_context
      description: 'Main diabetic-eye-screening record for one DESP retinal screening episode: grading
        context, patient identification, and the right-eye and left-eye grading blocks (R grade, M grade,
        P marker, U marker, visual acuity). The worst-eye classification and recall / referral outcome,
        fired rules, and flags live in child tables.'
    DiabeticEyeScreeningGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the row was soft-deleted.
        diabetic_eye_screening_id:
          type: string
          format: uuid
          description: Foreign key to the parent diabetic-eye-screening record (unique, 1:1).
        worst_retinopathy:
          type: string
          enum:
          - R0
          - R1
          - R2
          - R3A
          - R3S
          - ''
          description: 'Worst retinopathy (R) grade across both eyes by severity R0 < R1 < R2 < R3S <
            R3A: R0, R1, R2, R3A, or R3S.'
        worst_maculopathy:
          type: string
          enum:
          - M0
          - M1
          - ''
          description: 'Worst maculopathy (M) grade across both eyes: M1 if either eye is M1, otherwise
            M0.'
        any_ungradable:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether either eye is ungradable (yes/no); yes routes to slit-lamp unless referable
            disease routes to HES.
        outcome:
          type: string
          enum:
          - refer-hes-urgent
          - refer-hes
          - refer-slit-lamp
          - surveillance-6-month
          - routine-12-month
          - routine-24-month
          - ''
          description: 'Recall / referral pathway (most urgent wins): refer-hes-urgent, refer-hes, refer-slit-lamp,
            surveillance-6-month, routine-12-month, or routine-24-month.'
        referral:
          type: string
          enum:
          - none
          - hes-routine
          - hes-urgent
          - slit-lamp
          - ''
          description: 'Referral destination derived from the outcome: none, hes-routine, hes-urgent,
            or slit-lamp.'
        recall_interval_months:
          type: integer
          format: int32
          description: Recall interval in months (6, 12, or 24); null for referral pathways with no routine
            recall interval.
        status:
          type: string
          enum:
          - complete
          - incomplete
          - ''
          description: 'Completeness status: complete when both eyes have an R and M grade (or are marked
            ungradable); otherwise incomplete.'
        graded_at:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the classification.
      required:
      - created_at
      - updated_at
      - diabetic_eye_screening_id
      - worst_retinopathy
      - worst_maculopathy
      - any_ungradable
      - outcome
      - referral
      - status
      - graded_at
      description: 'Computed worst-eye classification and outcome for a diabetic-eye-screening record:
        worst retinopathy and maculopathy grade, any-ungradable marker, recall / referral pathway, recall
        interval, and completeness status.'
    DiabeticEyeScreeningGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updated_at:
          type: string
          format: date-time
