components:
  schemas:
    Applicant:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          maxLength: 255
          description: Full name of the applicant (the person making the application).
        birthDate:
          type: string
          format: date
          description: Date of birth of the applicant.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as a single text block.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code.
      required:
      - createdAt
      - updatedAt
      - name
      - birthDate
      description: 'The applicant: the spouse or civil partner who makes the application (or one of two
        joint applicants).'
    Caseworker:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Full name of the caseworker who prepares or checks the application.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as a single text block.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code.
        role:
          type: string
          enum:
          - solicitor
          - legal-adviser
          - court-officer
          - mckenzie-friend
          - other
          - ''
          description: 'Role of the caseworker: solicitor, legal-adviser, court-officer, mckenzie-friend,
            or other.'
        registrationBody:
          type: string
          enum:
          - SRA
          - CILEx
          - BSB
          - other
          - ''
          description: 'Professional regulator: SRA, CILEx, BSB, or other.'
        registrationNumber:
          type: string
          description: Professional registration number, where the caseworker is regulated.
      required:
      - createdAt
      - updatedAt
      - name
      - role
      - registrationBody
      - registrationNumber
      description: Caseworker information for the legal adviser or court officer who prepares or checks
        the application.
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          description: A URI identifying the problem type
        title:
          type: string
          description: A short summary of the problem type
        status:
          type: integer
          description: The HTTP status code
        detail:
          type: string
          description: An explanation of this occurrence
        instance:
          type: string
          description: A URI identifying this occurrence
        code:
          type: string
          description: A short machine-readable reason
        errors:
          type: object
          description: Per-field detail, when validation failed
      required:
      - type
      - title
      - status
    UnitedKingdomDivorceApplication:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        applicantId:
          type: string
          format: uuid
          description: Foreign key to the applicant (restrict delete).
        caseworkerId:
          type:
          - string
          - 'null'
          format: uuid
          description: Foreign key to the caseworker (restrict delete); optional.
        applicationType:
          type: string
          enum:
          - divorce
          - dissolution
          - ''
          description: Whether the application is for a divorce (marriage) or the dissolution of a civil
            partnership.
        applicationMode:
          type: string
          enum:
          - sole
          - joint
          - ''
          description: Sole application by one spouse, or joint application by both.
        stage:
          type: string
          enum:
          - application
          - conditional-order
          - final-order
          - ''
          description: 'Which stage the user is checking: application (D8 or online), conditional order
            (D84), or final order (D36).'
        asOfDate:
          type:
          - string
          - 'null'
          format: date
          description: The date the check is made, against which the time gates are tested.
        domesticAbuseRisk:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether there is a risk of domestic abuse. A joint application is not suitable
            where there is (yes/no).
        marriageDate:
          type:
          - string
          - 'null'
          format: date
          description: Date of the marriage or civil partnership formation.
        marriagePlace:
          type: string
          description: Place where the marriage or civil partnership was formed.
        marriageCountry:
          type: string
          description: Country where the marriage or civil partnership was formed.
        legallyRecognised:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the marriage or civil partnership is legally recognised in the United Kingdom
            (yes/no).
        breakdownConfirmed:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the applicant states that the relationship has broken down irretrievably
            (yes/no).
        marriageCertificateType:
          type: string
          enum:
          - original
          - certified-copy
          - not-held
          - ''
          description: 'The marriage certificate held: original, certified-copy, or not-held.'
        certificateInEnglish:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the marriage certificate is in English (yes/no).
        certifiedTranslation:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether a certified translation of the marriage certificate is held (yes/no).
        nameChanged:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether a name has been changed since the marriage (yes/no).
        nameChangeProof:
          type: string
          enum:
          - marriage-certificate
          - deed-poll
          - none
          - ''
          description: 'Proof of the name change: marriage-certificate, deed-poll, or none.'
        applicantHabitualResident:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the applicant is habitually resident in England and Wales (yes/no).
        applicantResidenceMonths:
          type:
          - integer
          - 'null'
          format: int32
          description: Months the applicant has been habitually resident in England and Wales.
        applicantDomiciled:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the applicant is domiciled in England and Wales (yes/no).
        respondentHabitualResident:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the other spouse is habitually resident in England and Wales (yes/no).
        respondentDomiciled:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the other spouse is domiciled in England and Wales (yes/no).
        lastHabituallyResidentTogether:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether both were last habitually resident in England and Wales and one still resides
            there (yes/no).
        applicantName:
          type: string
          description: Full name of the applicant as it appears on the application.
        applicantAddress:
          type: string
          description: Postal address of the applicant.
        applicantEmail:
          type: string
          description: Email address of the applicant.
        respondentName:
          type: string
          description: Full name of the other spouse (the respondent, or the second joint applicant).
        respondentAddress:
          type: string
          description: Postal address of the other spouse; the service address for a sole application.
        respondentEmail:
          type: string
          description: Email address of the other spouse, used to serve papers online.
        respondentAddressKnown:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the current address of the other spouse is known (yes/no).
        serviceMethod:
          type: string
          enum:
          - email
          - post
          - alternative-service
          - ''
          description: 'How the application is served on the other spouse: email, post, or alternative-service.'
        childrenUnder18:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether there are children of the family under 18 (yes/no).
        childrenCount:
          type:
          - integer
          - 'null'
          format: int32
          description: Number of children of the family under 18.
        childrenArrangements:
          type: string
          enum:
          - agreed
          - not-agreed
          - undecided
          - ''
          description: 'State of the arrangements for the children: agreed, not-agreed, or undecided.'
        childrenNote:
          type: string
          description: Free-text note on the children arrangements.
        financialOrderIntended:
          type: string
          enum:
          - 'yes'
          - 'no'
          - undecided
          - ''
          description: 'Whether a financial order on money and property is intended: yes, no, or undecided.'
        financialOrderApplied:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether a financial order has been applied for (yes/no).
        feeStatus:
          type: string
          enum:
          - paid
          - help-with-fees-approved
          - help-with-fees-pending
          - unpaid
          - ''
          description: 'Status of the court fee: paid, help-with-fees-approved, help-with-fees-pending,
            or unpaid.'
        applicationIssuedDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the court issued the application; the 20-week reflection period runs from
            it.
        respondentAcknowledged:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the other spouse has returned the acknowledgement of service (yes/no).
        conditionalOrderGrantedDate:
          type:
          - string
