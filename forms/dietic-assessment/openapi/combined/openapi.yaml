      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        internationalNonproprietaryName:
          type: string
          description: International Nonproprietary Name (INN) of the medication, as designated by the
            WHO.
        brandName:
          type: string
          description: Brand name as the patient knows the product, such as for reconciling a patient-reported
            supplement to its ingredient.
        kind:
          type: string
          enum:
          - prescription
          - over-the-counter
          - vitamin
          - mineral
          - herbal
          - complementary
          - oral-nutritional-supplement
          - enteral-feed
          - parenteral-nutrition
          - other
          - ''
          description: Kind of product, such as prescription, over-the-counter, vitamin, mineral, herbal,
            or oral nutritional supplement.
        nutrientInteraction:
          type: string
          description: Known drug-nutrient interaction, such as for firing the drug-nutrient-interaction
            safety flag.
        description:
          type: string
          description: Description of the medication, including its uses and properties.
      required:
      - createdAt
      - updatedAt
      - internationalNonproprietaryName
      - brandName
      - kind
      - nutrientInteraction
      - description
      description: Medication, supplement, or nutrition product that a patient may be taking.
    Patient:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          maxLength: 255
          description: Name.
        birthDate:
          type:
          - string
          - 'null'
          format: date
          description: Birth date, such as for calculating age and for the paediatric safety flag.
        sex:
          type: string
          enum:
          - female
          - male
          - intersex
          - prefer-not-to-say
          - ''
          description: Sex, such as for sex-adjusted hand-grip strength cut-offs.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as full text.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code, such as for validating the postal address.
        unitedKingdomNhsNumber:
          type:
          - string
          - 'null'
          maxLength: 20
          description: United Kingdom NHS number, unique per person.
        heightAsCm:
          type:
          - number
          - 'null'
          format: double
          description: Height measurement in cm, such as for calculating body mass index (BMI).
        weightAsKg:
          type:
          - number
          - 'null'
          format: double
          description: Weight measurement in kg, such as for calculating body mass index (BMI).
        bodyMassIndex:
          type:
          - number
          - 'null'
          format: double
          description: Body mass index (BMI) measurement, i.e. weight in kg divided by the square of height
            in metres.
        waistAsCm:
          type:
          - number
          - 'null'
          format: double
          description: Waist circumference measurement in cm, such as for calculating waist-height ratio
            (WHR).
        midUpperArmCircumferenceAsCm:
          type:
          - number
          - 'null'
          format: double
          description: Mid-upper-arm circumference (MUAC) measurement in cm, such as for estimating the
            MUST body mass index component when weighing is declined or impractical.
        calfCircumferenceAsCm:
          type:
          - number
          - 'null'
          format: double
          description: Calf circumference measurement in cm, such as for supporting the GLIM reduced-muscle-mass
            phenotypic criterion.
        preferredLanguage:
          type:
          - string
          - 'null'
          description: Preferred language, such as for deciding whether an interpreter is required.
        ethnicity:
          type:
          - string
          - 'null'
          description: Ethnicity, such as for interpreting body mass index thresholds and for cultural
            dietary requirements.
      required:
      - createdAt
      - updatedAt
      - name
      - sex
      description: Patient.
    PatientAllergy:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the patient table.
        allergyId:
          type: string
          format: uuid
          description: Foreign key to the allergy table.
        reaction:
          type: string
          description: Reaction the patient experiences, such as urticaria, angioedema, vomiting, or abdominal
            pain.
        severity:
          type: string
          enum:
          - mild
          - moderate
          - severe
          - anaphylaxis
          - ''
          description: Severity of the reaction, where anaphylaxis fires the allergy-anaphylaxis-risk
            safety flag.
        kind:
          type: string
          enum:
          - allergy
          - intolerance
          - avoidance-by-choice
          - unknown
          - ''
          description: Whether this is a true allergy, an intolerance, or an avoidance by choice, because
            the three lead to different dietetic advice.
        diagnosisMethod:
          type: string
          enum:
          - clinically-diagnosed
          - skin-prick-test
          - specific-ige
          - oral-food-challenge
          - elimination-and-reintroduction
          - self-reported
          - ''
          description: How the allergy or intolerance was established, such as for judging the confidence
            of a self-reported avoidance.
        onsetOn:
          type:
          - string
          - 'null'
          format: date
          description: Date of first known reaction, where known.
        adrenalineAutoInjector:
          type: boolean
          description: Whether the patient carries an adrenaline auto-injector.
        notes:
          type: string
          description: Free-text notes about this allergen for this patient.
      required:
      - createdAt
      - updatedAt
      - patientId
      - allergyId
      - reaction
      - severity
      - kind
      - diagnosisMethod
      - adrenalineAutoInjector
      - notes
      description: Patient allergy, i.e. one allergen that one patient reacts to, with the reaction and
        its severity.
