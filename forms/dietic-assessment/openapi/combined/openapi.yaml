components:
  schemas:
    Allergy:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        scientific_name:
          type: string
          description: Scientific name of the allergen, such as the binomial name of the source species.
        european_union_name:
          type: string
          description: European Union name of the allergen, as used in European Union food-labelling law.
        united_states_name:
          type: string
          description: United States name of the allergen, as used in United States food-labelling law.
        cosmetic_name:
          type: string
          description: Cosmetic-ingredient name of the allergen, where the allergen also appears in cosmetics.
        kind:
          type: string
          enum:
          - food
          - medication
          - environmental
          - contact
          - other
          - ''
          description: Kind of allergen, such as food, medication, environmental, or contact.
        is_regulated_food_allergen:
          type: boolean
          description: Whether the allergen is one that food law requires to be declared, such as the
            fourteen regulated allergens in the United Kingdom and the European Union.
      required:
      - created_at
      - updated_at
      - scientific_name
      - european_union_name
      - united_states_name
      - cosmetic_name
      - kind
      - is_regulated_food_allergen
      description: Allergen that a patient may react to.
    DieticAssessment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        deleted_at:
          type: string
          format: date-time
          description: Soft-delete timestamp; NULL when the row is live.
        patient_id:
          type: string
          format: uuid
          description: Foreign key to the patient table.
        dietitian_id:
          type: string
          format: uuid
          description: Foreign key to the dietitian table, i.e. the registered practitioner conducting
            the assessment.
        status:
          type: string
          enum:
          - draft
          - submitted
          - reviewed
          - urgent
          description: 'Workflow status of the assessment: draft, submitted, reviewed, or urgent.'
        assessment_date:
          type: string
          format: date
          description: Date the assessment was conducted.
        assessment_time:
          type: string
          format: time
          description: Time the assessment was conducted.
        site_name:
          type: string
          maxLength: 255
          description: Site where the assessment was conducted, such as the hospital, clinic, or care
            home.
        service_name:
          type: string
          maxLength: 255
          description: Dietetic service conducting the assessment, such as the acute dietetics team or
            the community nutrition service.
        setting:
          type: string
          enum:
          - outpatient-clinic
          - inpatient-ward
          - community
          - home-visit
          - general-practice
          - care-home
          - telephone
          - video
          - ''
          description: Setting of the appointment, such as outpatient clinic, inpatient ward, home visit,
            or video consultation.
        appointment_type:
          type: string
          enum:
          - initial
          - review
          - specialist-programme
          - discharge
          - ''
          description: Type of appointment, where an initial appointment typically runs 45 to 60 minutes
            and a specialist programme up to 90 minutes.
        planned_duration_minutes:
          type: integer
          format: int32
          description: Planned appointment duration in minutes, such as 45 to 60 for an initial general
            clinical or outpatient visit.
        interpreter_required:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether an interpreter is required for the consultation.
        interpreter_language:
          type: string
          maxLength: 100
          description: Language the interpreter is required for.
        referral_source:
          type: string
          enum:
          - general-practitioner
          - hospital-consultant
          - ward-team
          - nurse
          - self-referral
          - care-home
          - social-care
          - speech-and-language-therapy
          - other
          - ''
          description: Who referred the patient to the dietetic service.
        referral_date:
          type: string
          format: date
          description: Date the referral was made.
        referral_reason:
          type: string
          maxLength: 500
          description: Reason for referral, as stated by the referrer.
        primary_condition:
          type: string
          maxLength: 255
          description: Primary presenting condition that the dietetic assessment addresses.
        consent_to_record:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the patient consented to the assessment being recorded.
        accompanied_by:
          type: string
          maxLength: 255
          description: Who accompanied the patient to the appointment, such as a relative, carer, or advocate.
        condition_diabetes:
          type: string
          enum:
          - none
          - type-1
          - type-2
          - gestational
          - other
          - ''
          description: Diabetes diagnosis and type, because carbohydrate and energy advice differs by
            type.
        condition_coeliac:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the patient has coeliac disease, which requires a strict gluten-free diet
            and satisfies the GLIM reduced-assimilation etiologic criterion.
        condition_inflammatory_bowel_disease:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the patient has inflammatory bowel disease, i.e. Crohn disease or ulcerative
            colitis.
        condition_chronic_kidney_disease:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the patient has chronic kidney disease, which constrains protein, potassium,
            and phosphate advice.
        condition_liver_disease:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the patient has liver disease, which changes protein and sodium targets
            and can mask weight loss behind ascites.
        condition_cancer:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the patient has a cancer diagnosis, which satisfies the GLIM inflammation
            and disease burden etiologic criterion.
        condition_cardiovascular_disease:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the patient has cardiovascular disease.
        condition_respiratory_disease:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the patient has respiratory disease such as chronic obstructive pulmonary
            disease, which raises energy expenditure.
        condition_stroke:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the patient has had a stroke, which commonly brings dysphagia and feeding
            dependence.
        condition_dementia:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the patient has dementia, which affects appetite, capacity, and the ability
            to self-feed.
        condition_eating_disorder:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the patient has a diagnosed eating disorder, which fires the disordered-eating-concern
            safety flag.
        condition_other:
          type: string
          maxLength: 500
          description: Any other diagnosed condition relevant to the nutritional assessment.
        recent_surgery:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the patient has had recent surgery.
        recent_surgery_type:
          type: string
          maxLength: 255
          description: Type of recent surgery.
        recent_surgery_date:
          type: string
          format: date
          description: Date of the recent surgery.
        gastrointestinal_surgery:
          type: string
          enum:
          - none
          - bariatric
          - bowel-resection
          - gastrectomy
          - oesophagectomy
          - whipple
          - stoma-formation
          - other
          - ''
          description: Any gastrointestinal surgery the patient has had, because resection, bypass, and
            stoma formation each change absorption.
        current_symptoms:
          type: string
          description: Current symptoms the patient reports that bear on nutrition.
        family_history:
          type: string
          description: Relevant family history, such as coeliac disease, diabetes, or inherited metabolic
            disease.
        pregnancy_status:
          type: string
          enum:
          - not-applicable
          - not-pregnant
          - pregnant
          - breastfeeding
          - prefer-not-to-say
          - ''
          description: Pregnancy and lactation status, because energy, protein, and micronutrient requirements
            differ.
        takes_prescription_medicines:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the patient takes prescription medicines.
        takes_over_the_counter_medicines:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the patient takes over-the-counter medicines.
        takes_vitamin_supplements:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the patient takes vitamin supplements.
        takes_mineral_supplements:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the patient takes mineral supplements.
        takes_herbal_products:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the patient takes herbal or complementary products, which can interact
            with prescribed medicines.
        takes_oral_nutritional_supplements:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the patient is already taking oral nutritional supplements.
        oral_nutritional_supplement_detail:
          type: string
          maxLength: 500
          description: Which oral nutritional supplements the patient takes, at what dose, and how well
            they are tolerated.
        enteral_nutrition:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the patient is receiving enteral tube feeding.
        enteral_route:
          type: string
          enum:
          - nasogastric
          - nasojejunal
          - gastrostomy
          - jejunostomy
          - other
          - ''
          description: Route of enteral feeding, such as nasogastric, gastrostomy, or jejunostomy.
        enteral_tube_problem:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether there is a tube or tolerance problem, which fires the enteral-tube-complication
            safety flag.
        parenteral_nutrition:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the patient is receiving parenteral nutrition.
        drug_nutrient_interaction:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether a drug-nutrient interaction was identified during the medication review.
        drug_nutrient_interaction_detail:
          type: string
          maxLength: 500
          description: Description of the drug-nutrient interaction identified.
        medication_adherence:
          type: string
          enum:
          - full
          - partial
          - none
          - unknown
          - ''
          description: Reported adherence to prescribed medicines and supplements.
        medication_notes:
          type: string
          description: Free-text notes from the medication and supplement review.
        measurement_method:
          type: string
          enum:
          - measured
          - self-reported
          - estimated
          - declined
          - ''
          description: 'How height and weight were obtained: measured, self-reported, estimated, or declined.
            Declined is a first-class answer; the MUST body mass index component is then estimated from
            mid-upper-arm circumference.'
        height_as_cm:
          type: number
          format: double
          description: Height in cm, such as for calculating body mass index.
        weight_as_kg:
          type: number
          format: double
          description: Weight in kg, such as for calculating body mass index and percentage weight loss.
        body_mass_index:
          type: number
          format: double
          description: Body mass index in kg per square metre, auto-computed from height and weight, and
            scored as MUST step 1.
        mid_upper_arm_circumference_as_cm:
          type: number
          format: double
          description: Mid-upper-arm circumference in cm. Below 23.5 suggests body mass index below 20;
            above 32.0 suggests body mass index above 30. Used to estimate the MUST body mass index component
            when weighing is declined or impractical.
        calf_circumference_as_cm:
          type: number
          format: double
          description: Calf circumference in cm, supporting the GLIM reduced-muscle-mass phenotypic criterion.
        waist_as_cm:
          type: number
          format: double
          description: Waist circumference in cm, such as for assessing central adiposity.
        usual_weight_as_kg:
          type: number
          format: double
          description: The patient's usual or pre-illness weight in kg, i.e. the baseline for percentage
            weight loss.
        weight_3_months_ago_as_kg:
          type: number
          format: double
          description: Weight in kg three months ago, where known.
        weight_6_months_ago_as_kg:
          type: number
          format: double
          description: Weight in kg six months ago, i.e. the outer bound of the MUST weight-loss window.
        weight_loss_percent:
          type: number
          format: double
          description: Percentage unplanned weight loss over the last three to six months, auto-computed,
            and scored as MUST step 2.
        weight_loss_is_intentional:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the weight loss was intentional. Only unplanned loss scores in MUST, so
            intentional loss is recorded but scored zero.
        weight_trend:
          type: string
          enum:
          - losing
          - stable
          - gaining
          - fluctuating
          - unknown
          - ''
          description: 'Direction of the weight trend: losing, stable, gaining, fluctuating, or unknown.'
        clothes_or_jewellery_looser:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether clothes or jewellery have become looser, i.e. the MUST subjective criterion
            used when no usual weight is available.
        oedema_present:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether oedema is present, because fluid weight masks true weight loss.
        oedema_adjustment_kg:
          type: number
          format: double
          description: Weight adjustment in kg subtracted for oedema before body mass index is computed.
        ascites_present:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether ascites is present, because fluid weight masks true weight loss.
        amputation_present:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the patient has an amputation, which changes the interpretation of weight
            and body mass index.
        amputation_adjustment_percent:
          type: number
          format: double
          description: Percentage of body weight attributed to the absent limb, used to interpret weight
            and body mass index.
        anthropometry_notes:
          type: string
          description: Free-text notes about the measurements, such as why weighing was declined.
        bloods_sample_date:
          type: string
          format: date
          description: Date the blood sample was taken, so the report can say how current the biochemistry
            is.
        albumin_g_per_l:
          type: number
          format: double
          description: Serum albumin in g per litre. A marker of inflammation rather than of protein intake,
            so it supports the GLIM inflammation criterion rather than diagnosing malnutrition.
        c_reactive_protein_mg_per_l:
          type: number
          format: double
          description: C-reactive protein in mg per litre, supporting the GLIM inflammation and disease
            burden etiologic criterion.
        haemoglobin_g_per_l:
          type: number
          format: double
          description: Haemoglobin in g per litre.
        ferritin_ug_per_l:
          type: number
          format: double
          description: Ferritin in micrograms per litre, i.e. the iron store marker.
        vitamin_b12_ng_per_l:
          type: number
          format: double
          description: Vitamin B12 in nanograms per litre.
        folate_ug_per_l:
          type: number
          format: double
          description: Serum folate in micrograms per litre.
        vitamin_d_nmol_per_l:
          type: number
          format: double
          description: 25-hydroxyvitamin D in nmol per litre.
        hba1c_mmol_per_mol:
          type: number
          format: double
          description: Glycated haemoglobin in mmol per mol. Above 75 fires the uncontrolled-diabetes
            safety flag.
        sodium_mmol_per_l:
          type: number
          format: double
          description: Serum sodium in mmol per litre.
        potassium_mmol_per_l:
          type: number
          format: double
          description: Serum potassium in mmol per litre. A low pre-feeding value is a NICE CG32 refeeding-syndrome
            high-risk criterion.
        magnesium_mmol_per_l:
          type: number
          format: double
          description: Serum magnesium in mmol per litre. A low pre-feeding value is a NICE CG32 refeeding-syndrome
            high-risk criterion.
        phosphate_mmol_per_l:
          type: number
          format: double
          description: Serum phosphate in mmol per litre. A low pre-feeding value is a NICE CG32 refeeding-syndrome
            high-risk criterion.
        corrected_calcium_mmol_per_l:
          type: number
          format: double
          description: Albumin-corrected calcium in mmol per litre.
        urea_mmol_per_l:
          type: number
          format: double
          description: Serum urea in mmol per litre.
        creatinine_umol_per_l:
          type: number
          format: double
          description: Serum creatinine in micromol per litre.
        egfr_ml_per_min:
          type: number
          format: double
          description: Estimated glomerular filtration rate in ml per minute per 1.73 square metres. Below
            30 with a high-protein or high-potassium plan fires the renal-dietary-conflict safety flag.
        alanine_aminotransferase_u_per_l:
          type: number
          format: double
          description: Alanine aminotransferase in units per litre.
        bilirubin_umol_per_l:
          type: number
          format: double
          description: Total bilirubin in micromol per litre.
        total_cholesterol_mmol_per_l:
          type: number
          format: double
          description: Total cholesterol in mmol per litre.
        triglycerides_mmol_per_l:
          type: number
          format: double
          description: Triglycerides in mmol per litre.
        biochemistry_notes:
          type: string
          description: Free-text notes about the biochemistry results.
        subcutaneous_fat_loss:
          type: string
          enum:
          - none
          - mild
          - moderate
          - severe
          - ''
          description: Severity of subcutaneous fat loss on physical examination, such as at the orbital,
            triceps, and rib regions.
        muscle_wasting_temples:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether temporal muscle wasting is present on physical examination.
        muscle_wasting_clavicles:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether clavicular muscle wasting is present on physical examination.
        muscle_wasting_quadriceps:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether quadriceps muscle wasting is present on physical examination.
        muscle_wasting_severity:
          type: string
          enum:
          - none
          - mild
          - moderate
          - severe
          - ''
          description: Overall severity of muscle wasting, which satisfies the GLIM reduced-muscle-mass
            phenotypic criterion when body-composition measurement is unavailable.
        peripheral_oedema_severity:
          type: string
          enum:
          - none
          - mild
          - moderate
          - severe
          - ''
          description: Severity of peripheral oedema on physical examination.
        oral_health:
          type: string
          enum:
          - good
          - fair
          - poor
          - ''
          description: Overall oral health, because poor oral health limits what can be eaten.
        dentition:
          type: string
          enum:
          - good
          - some-missing
          - edentulous
          - dentures-fitting
          - dentures-loose
          - ''
          description: State of the dentition, including whether dentures fit, because chewing capacity
            constrains texture.
        chewing_ability:
          type: string
          enum:
          - normal
          - reduced
          - unable
          - ''
          description: 'Ability to chew: normal, reduced, or unable.'
        tongue_and_mucosa:
          type: string
          enum:
          - normal
          - glossitis
          - stomatitis
          - angular-cheilitis
          - oral-thrush
          - dry
          - other
          - ''
          description: Tongue and oral mucosa findings, such as glossitis or angular cheilitis, which
            suggest micronutrient deficiency.
        skin_condition:
          type: string
          enum:
          - normal
          - dry
          - flaky
          - poor-wound-healing
          - bruising
          - other
          - ''
          description: Skin findings relevant to nutrition, such as poor wound healing or easy bruising.
        hair_condition:
          type: string
          enum:
          - normal
          - thin
          - brittle
          - easily-plucked
          - other
          - ''
          description: Hair findings relevant to nutrition, such as thin or easily plucked hair.
        nail_condition:
          type: string
          enum:
          - normal
          - brittle
          - spoon-shaped
          - ridged
          - other
          - ''
          description: Nail findings relevant to nutrition, such as spoon-shaped nails suggesting iron
            deficiency.
        pressure_ulcer_present:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether a pressure ulcer is present.
        pressure_ulcer_category:
          type: string
          enum:
          - '1'
          - '2'
          - '3'
          - '4'
          - unstageable
          - ''
          description: Pressure ulcer category, where category 2 or above fires the pressure-ulcer safety
            flag and raises protein and energy requirements.
        hand_grip_strength_kg:
          type: number
          format: double
          description: Hand-grip strength in kg by dynamometer, compared against sex-adjusted cut-offs
            to support the sarcopenia-risk safety flag.
        physical_exam_notes:
          type: string
          description: Free-text notes from the nutrition-focused physical examination.
        meals_per_day:
          type: integer
          format: int32
          description: Number of meals the patient eats in a typical day.
        snacks_per_day:
          type: integer
          format: int32
          description: Number of snacks the patient eats in a typical day.
        recall_breakfast:
          type: string
          description: '24-hour recall: what the patient ate and drank at breakfast.'
        recall_mid_morning:
          type: string
          description: '24-hour recall: what the patient ate and drank mid-morning.'
        recall_lunch:
          type: string
          description: '24-hour recall: what the patient ate and drank at lunch.'
        recall_afternoon:
          type: string
          description: '24-hour recall: what the patient ate and drank in the afternoon.'
        recall_dinner:
          type: string
          description: '24-hour recall: what the patient ate and drank at dinner.'
        recall_evening:
          type: string
          description: '24-hour recall: what the patient ate and drank in the evening.'
        portion_size:
          type: string
          enum:
          - small
          - medium
          - large
          - varies
          - ''
          description: Typical portion size the patient describes.
        appetite:
          type: string
          enum:
          - good
          - fair
          - poor
          - absent
          - ''
          description: 'Overall appetite: good, fair, poor, or absent.'
        appetite_score_0_10:
          type: integer
          format: int32
          description: Appetite rated by the patient from 0 for none to 10 for normal.
        proportion_of_usual_intake_percent:
          type: integer
          format: int32
          description: Current intake as a percentage of the patient's usual intake. Below 50 fires the
            inadequate-oral-intake safety flag and supports the GLIM reduced-intake etiologic criterion.
        meals_out_per_week:
          type: integer
          format: int32
          description: Number of meals eaten out per week.
        takeaways_per_week:
          type: integer
          format: int32
          description: Number of takeaway meals per week.
        food_diary_completed:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the patient completed a food diary before the appointment.
        estimated_energy_intake_kcal:
          type: integer
          format: int32
          description: Estimated current daily energy intake in kilocalories, from the recall or food
            diary.
        estimated_protein_intake_g:
          type: integer
          format: int32
          description: Estimated current daily protein intake in grams, from the recall or food diary.
        eats_alone:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the patient usually eats alone, which is associated with reduced intake
            in older adults.
        dietary_recall_notes:
          type: string
          description: Free-text notes about the dietary recall.
        fluid_intake_ml_per_day:
          type: integer
          format: int32
          description: Usual daily fluid intake in ml.
        fluid_types:
          type: string
          maxLength: 500
          description: Types of drink the patient consumes, such as water, tea, juice, or milk-based drinks.
        caffeinated_drinks_per_day:
          type: integer
          format: int32
          description: Number of caffeinated drinks per day.
        alcohol_units_per_week:
          type: number
          format: double
          description: Alcohol consumption in United Kingdom units per week. Above 14 fires the alcohol-excess
            safety flag and is a NICE CG32 refeeding-risk criterion.
        thickened_fluids:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the patient takes thickened fluids for dysphagia.
        thickened_fluids_iddsi_level:
          type: string
          enum:
          - '0'
          - '1'
          - '2'
          - '3'
          - '4'
          - ''
          description: IDDSI drink level 0 to 4, where 0 is thin and 4 is extremely thick.
        hydration_signs:
          type: string
          enum:
          - well-hydrated
          - mild-dehydration
          - moderate-dehydration
          - severe-dehydration
          - fluid-overload
          - ''
          description: Clinical hydration status observed, from well-hydrated through severe dehydration
            to fluid overload.
        fluid_restriction:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether a fluid restriction is in place, such as for heart failure or dialysis.
        fluid_restriction_ml_per_day:
          type: integer
          format: int32
          description: Prescribed daily fluid restriction in ml.
        hydration_notes:
          type: string
          description: Free-text notes about fluid intake and hydration.
        has_food_allergy:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the patient has any food allergy.
        has_food_intolerance:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the patient has any food intolerance.
        foods_avoided:
          type: string
          description: Foods the patient avoids, whatever the reason.
        avoidance_reason:
          type: string
          enum:
          - allergy
          - intolerance
          - medical-advice
          - religious
          - cultural
          - ethical
          - dislike
          - cost
          - other
          - ''
          description: Why the patient avoids those foods, because allergy, medical advice, cost, and
            preference lead to different dietetic responses.
        dislikes:
          type: string
          description: Foods the patient dislikes, which constrain what a care plan can realistically
            suggest.
        therapeutic_diet:
          type: string
          enum:
          - none
          - gluten-free
          - low-fodmap
          - renal
          - diabetic
          - low-sodium
          - low-potassium
          - high-energy-high-protein
          - ketogenic
          - low-residue
          - other
          - ''
          description: Any therapeutic diet already in place, such as gluten-free, renal, or low-FODMAP.
        dietary_pattern:
          type: string
          enum:
          - omnivore
          - vegetarian
          - vegan
          - pescatarian
          - halal
          - kosher
          - other
          - ''
          description: Overall dietary pattern, such as omnivore, vegetarian, vegan, halal, or kosher.
        religious_or_cultural_requirement:
          type: string
          maxLength: 500
          description: Religious or cultural dietary requirements the care plan must respect.
        fasting_practice:
          type: string
          maxLength: 500
          description: Fasting practices the patient observes, such as Ramadan, which change the timing
            of intake.
        texture_modified_diet:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the patient is on a texture-modified diet.
        texture_modified_iddsi_level:
          type: string
          enum:
          - '3'
          - '4'
          - '5'
          - '6'
          - '7'
          - ''
          description: IDDSI food level 3 to 7, where 3 is liquidised and 7 is regular.
        preferences_notes:
          type: string
          description: Free-text notes about preferences, allergies, and cultural requirements.
        appetite_change:
          type: string
          enum:
          - none
          - increased
          - decreased
          - ''
          description: Whether appetite has changed recently, and in which direction.
        early_satiety:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the patient feels full soon after starting to eat.
        nausea:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the patient has nausea.
        vomiting:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the patient is vomiting.
        dysphagia:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the patient has difficulty swallowing. Recorded dysphagia without a speech-and-language-therapy
            assessment fires the dysphagia-aspiration-risk safety flag.
        dysphagia_screen_outcome:
          type: string
          enum:
          - pass
          - fail
          - not-done
          - ''
          description: 'Outcome of the swallow screen: pass, fail, or not done.'
        speech_and_language_therapy:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether speech and language therapy is involved in the patient's care.
        reflux:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the patient has gastro-oesophageal reflux.
        abdominal_pain:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the patient has abdominal pain.
        bloating:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the patient has bloating.
        bowel_frequency_per_week:
          type: integer
          format: int32
          description: Number of bowel movements per week.
        bristol_stool_type:
          type: string
          enum:
          - '1'
          - '2'
          - '3'
          - '4'
          - '5'
          - '6'
          - '7'
          - ''
          description: Bristol Stool Form Scale type 1 to 7, where 1 to 2 suggests constipation and 6
            to 7 suggests diarrhoea.
        constipation:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the patient has constipation.
        diarrhoea:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the patient has diarrhoea.
        stoma_present:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the patient has a stoma or enterocutaneous fistula.
        stoma_output_ml_per_day:
          type: integer
          format: int32
          description: Stoma or fistula output in ml per day, where a high output impairs absorption and
            fluid balance.
        malabsorption_signs:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether signs of malabsorption are present, such as steatorrhoea, which satisfies
            the GLIM reduced-assimilation etiologic criterion.
        gastrointestinal_notes:
          type: string
          description: Free-text notes about gastrointestinal and swallowing findings.
        living_situation:
          type: string
          enum:
          - alone
          - with-partner
          - with-family
          - shared-house
          - care-home
          - supported-living
          - homeless
          - other
          - ''
          description: The patient's living situation, because it determines who provides food.
        who_shops:
          type: string
          enum:
          - patient
          - family
          - carer
          - delivery
          - other
          - ''
          description: Who does the food shopping.
        who_cooks:
          type: string
          enum:
          - patient
          - family
          - carer
          - meal-service
          - other
          - ''
          description: Who prepares the meals.
        cooking_skills:
          type: string
          enum:
          - confident
          - basic
          - limited
          - none
          - ''
          description: The patient's cooking skills, because a care plan must be achievable with them.
        cooking_confidence_0_10:
          type: integer
          format: int32
          description: The patient's confidence in cooking, from 0 for none to 10 for fully confident.
        has_cooker:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the patient has a working cooker.
        has_fridge:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the patient has a working fridge.
        has_freezer:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the patient has a working freezer.
        has_microwave:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the patient has a working microwave.
        food_budget_per_week:
          type: number
          format: double
          description: Weekly food budget in the local currency, because a care plan must be affordable.
        worried_food_would_run_out:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the patient worried that food would run out before there was money to buy
            more, i.e. the first food-insecurity screening question.
        skipped_meals_for_money:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the patient skipped meals because there was not enough money for food,
            i.e. the second food-insecurity screening question.
        uses_food_bank:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the patient uses a food bank.
        access_to_shops:
          type: string
          enum:
          - easy
          - moderate
          - difficult
          - none
          - ''
          description: How easily the patient can reach food shops.
        has_transport:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the patient has transport for food shopping.
        work_pattern:
          type: string
          enum:
          - full-time
          - part-time
          - shift-work
          - night-shift
          - unemployed
          - retired
          - student
          - carer
          - unable-to-work
          - ''
          description: The patient's work pattern, because shift and night work disrupt meal timing.
        meal_support:
          type: string
          enum:
          - none
          - family
          - care-worker
          - meals-on-wheels
          - day-centre
          - care-home-catering
          - other
          - ''
          description: What meal support the patient receives, such as family, a care worker, or meals
            on wheels.
        social_support:
          type: string
          enum:
          - good
          - some
          - limited
          - none
          - ''
          description: Level of social support available to the patient.
        environment_notes:
          type: string
          description: Free-text notes about lifestyle and food environment.
        activity_level:
          type: string
          enum:
          - sedentary
          - lightly-active
          - moderately-active
          - very-active
          - ''
          description: Overall physical activity level, which feeds the energy requirement estimate.
        exercise_type:
          type: string
          maxLength: 255
          description: Type of exercise the patient does.
        exercise_minutes_per_week:
          type: integer
          format: int32
          description: Minutes of exercise per week.
        sedentary_hours_per_day:
          type: number
          format: double
          description: Hours per day spent sedentary.
        mobility:
          type: string
          enum:
          - independent
          - walking-aid
          - wheelchair
          - bed-bound
          - ''
          description: Mobility status, from independent through walking aid and wheelchair to bed-bound.
        falls_in_last_12_months:
          type: integer
          format: int32
          description: Number of falls in the last 12 months, which is the SARC-F falls component and
            a sarcopenia indicator.
        sarcf_strength:
          type: integer
          format: int32
          description: 'SARC-F component: difficulty lifting and carrying 4.5 kg, scored 0 for none, 1
            for some, 2 for a lot or unable.'
        sarcf_walking:
          type: integer
          format: int32
          description: 'SARC-F component: difficulty walking across a room, scored 0 for none, 1 for some,
            2 for a lot, uses aids, or unable.'
        sarcf_rising_from_chair:
          type: integer
          format: int32
          description: 'SARC-F component: difficulty transferring from a chair or bed, scored 0 for none,
            1 for some, 2 for a lot or unable without help.'
        sarcf_climbing_stairs:
          type: integer
          format: int32
          description: 'SARC-F component: difficulty climbing a flight of ten stairs, scored 0 for none,
            1 for some, 2 for a lot or unable.'
        sarcf_falls:
          type: integer
          format: int32
          description: 'SARC-F component: number of falls in the past year, scored 0 for none, 1 for one
            to three, 2 for four or more.'
        eats_independently:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the patient can eat and drink without assistance.
        feeding_assistance_required:
          type: string
          enum:
          - none
          - prompting
          - partial
          - full
          - ''
          description: 'Level of feeding assistance required: none, prompting, partial, or full.'
        function_notes:
          type: string
          description: Free-text notes about physical activity and function.
        motivation_0_10:
          type: integer
          format: int32
          description: The patient's motivation to change, from 0 for none to 10 for fully motivated.
        stage_of_change:
          type: string
          enum:
          - precontemplation
          - contemplation
          - preparation
          - action
          - maintenance
          - relapse
          - ''
          description: Stage of change in the transtheoretical model, which sets how directive the intervention
            should be.
        self_efficacy_0_10:
          type: integer
          format: int32
          description: The patient's confidence in their ability to change, from 0 for none to 10 for
            fully confident.
        previous_attempts:
          type: string
          description: Previous dietary changes the patient has attempted, and what happened.
        barriers:
          type: string
          description: Barriers the patient identifies to making dietary changes.
        scoff_make_yourself_sick:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'SCOFF question: do you make yourself sick because you feel uncomfortably full?'
        scoff_lost_control:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'SCOFF question: do you worry that you have lost control over how much you eat?'
        scoff_lost_one_stone:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'SCOFF question: have you recently lost more than one stone, about 6 kg, in a three-month
            period?'
        scoff_believe_yourself_fat:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'SCOFF question: do you believe yourself to be fat when others say you are too
            thin?'
        scoff_food_dominates:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'SCOFF question: would you say that food dominates your life?'
        mood:
          type: string
          enum:
          - good
          - low
          - depressed
          - variable
          - ''
          description: The patient's mood, because low mood reduces appetite and adherence.
        anxiety:
          type: string
          enum:
          - none
          - mild
          - moderate
          - severe
          - ''
          description: The patient's anxiety level.
        cognitive_impairment:
          type: string
          enum:
          - none
          - mild
          - moderate
          - severe
          - ''
          description: Degree of cognitive impairment, which affects recall accuracy and the ability to
            follow a plan.
        capacity_concern:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether there is a concern about the patient's capacity to consent to or follow
            the plan, which fires the capacity-concern safety flag.
        safeguarding_concern:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether there is a safeguarding concern, such as self-neglect or malnutrition in
            a care setting, which fires the safeguarding safety flag.
        health_literacy:
          type: string
          enum:
          - high
          - moderate
          - low
          - ''
          description: The patient's health literacy, which sets the reading level of the resources given.
        preferred_learning_style:
          type: string
          enum:
          - verbal
          - written
          - visual
          - demonstration
          - digital
          - ''
          description: How the patient prefers to receive information, such as verbal, written, visual,
            or by demonstration.
        patient_goal_in_own_words:
          type: string
          description: The patient's own goal, recorded verbatim, so the care plan can be written against
            what the patient actually wants.
        acutely_ill:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the patient is acutely ill, i.e. the first half of the MUST step 3 acute
            disease effect criterion.
        no_nutritional_intake_over_5_days:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether there has been, or is likely to be, no nutritional intake for more than
            five days, i.e. the second half of the MUST step 3 acute disease effect criterion.
        days_of_negligible_intake:
          type: integer
          format: int32
          description: Number of days of little or no nutritional intake, used for the NICE CG32 refeeding-syndrome
            risk criteria.
        nrs_2002_score:
          type: integer
          format: int32
          description: Nutritional Risk Screening 2002 total score, 0 to 7, where 3 or more indicates
            nutritional risk in the acute inpatient setting.
        energy_requirement_kcal:
          type: integer
          format: int32
          description: Estimated daily energy requirement in kilocalories, entered by the dietitian using
            the equation named below.
        protein_requirement_g:
          type: integer
          format: int32
          description: Estimated daily protein requirement in grams, entered by the dietitian.
        fluid_requirement_ml:
          type: integer
          format: int32
          description: Estimated daily fluid requirement in ml, entered by the dietitian.
        requirement_equation:
          type: string
          enum:
          - henry
          - schofield
          - harris-benedict
          - mifflin-st-jeor
          - kcal-per-kg
          - indirect-calorimetry
          - other
          - ''
          description: Which equation or method was used to estimate requirements, because local policy
            governs the choice and the form does not compute it.
        pes_problem:
          type: string
          maxLength: 500
          description: PES statement problem, i.e. the nutrition and dietetic diagnosis.
        pes_etiology:
          type: string
          maxLength: 500
          description: PES statement etiology, i.e. what is causing the problem.
        pes_signs_symptoms:
          type: string
          maxLength: 500
          description: PES statement signs and symptoms, i.e. the evidence for the problem.
        intervention_type:
          type: string
          enum:
          - dietary-counselling
          - food-first-fortification
          - oral-nutritional-supplements
          - texture-modification
          - enteral-nutrition
          - parenteral-nutrition
          - weight-management
          - no-intervention
          - other
          - ''
          description: Type of nutrition intervention chosen, from dietary counselling through food fortification
            and oral nutritional supplements to enteral or parenteral nutrition.
        prescribed_supplement:
          type: string
          maxLength: 255
          description: Oral nutritional supplement prescribed, where one is prescribed.
        prescribed_supplement_dose:
          type: string
          maxLength: 255
          description: Dose and frequency of the prescribed supplement.
        texture_modification_plan:
          type: string
          maxLength: 255
          description: Texture modification plan, stated in IDDSI levels where applicable.
        goal_1:
          type: string
          maxLength: 500
          description: First SMART goal, with its target, measure, and review date.
        goal_2:
          type: string
          maxLength: 500
          description: Second SMART goal, with its target, measure, and review date.
        goal_3:
          type: string
          maxLength: 500
          description: Third SMART goal, with its target, measure, and review date.
        education_provided:
          type: string
          description: Education provided to the patient during the consultation.
        resources_given:
          type: string
          description: Written or digital resources given to the patient.
        monitoring_indicators:
          type: string
          description: What will be monitored to evaluate the intervention, such as weight, intake, or
            a biochemical marker.
        review_interval_weeks:
          type: integer
          format: int32
          description: Interval in weeks until the next review.
        review_date:
          type: string
          format: date
          description: Date of the next planned review.
        onward_referral:
          type: string
          maxLength: 500
          description: Onward referrals made, such as to speech and language therapy, the nutrition support
            team, or social prescribing.
        additional_notes:
          type: string
          description: Any additional notes the dietitian records.
