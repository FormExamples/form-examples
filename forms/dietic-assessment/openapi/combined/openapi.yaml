    DieticAssessmentGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        dieticAssessmentId:
          type: string
          format: uuid
          description: Foreign key to the dietic_assessment table, unique because grading is one-to-one
            with the assessment.
        mustBmiScore:
          type:
          - integer
          - 'null'
          format: int32
          description: MUST step 1 body mass index component, 0 to 2, where body mass index above 20.0
            scores 0, 18.5 to 20.0 scores 1, and below 18.5 scores 2.
        mustWeightLossScore:
          type:
          - integer
          - 'null'
          format: int32
          description: MUST step 2 unplanned weight loss component, 0 to 2, where loss below 5 percent
            scores 0, 5 to 10 percent scores 1, and above 10 percent scores 2.
        mustAcuteDiseaseScore:
          type:
          - integer
          - 'null'
          format: int32
          description: MUST step 3 acute disease effect component, 0 or 2, scoring 2 when the patient
            is acutely ill and there has been or is likely to be no nutritional intake for more than 5
            days.
        mustScore:
          type:
          - integer
          - 'null'
          format: int32
          description: MUST total score, 0 to 6, being the sum of the three component scores.
        computedMustRisk:
          type: string
          enum:
          - low
          - medium
          - high
          - ''
          description: MUST risk category computed by the engine, where 0 is low, 1 is medium, and 2 or
            more is high.
        finalMustRisk:
          type: string
          enum:
          - low
          - medium
          - high
          - ''
          description: MUST risk category signed off by the dietitian, which may equal or differ from
            the computed value.
        mustIsEstimated:
          type: boolean
          description: Whether the MUST score relies on an estimate, such as a mid-upper-arm circumference
            fallback when weighing was declined, in which case the report states that the score is estimated.
        glimPhenotypicCriteria:
          type: string
          maxLength: 500
          description: GLIM phenotypic criteria met, as a comma-separated list of criterion identifiers
            such as weight-loss, low-bmi, reduced-muscle-mass.
        glimEtiologicCriteria:
          type: string
          maxLength: 500
          description: GLIM etiologic criteria met, as a comma-separated list of criterion identifiers
            such as reduced-intake, inflammation.
        glimDiagnosis:
          type: string
          enum:
          - none
          - moderate
          - severe
          - ''
          description: 'GLIM malnutrition diagnosis: none, moderate, or severe, requiring at least one
            phenotypic criterion and at least one etiologic criterion.'
        nrs2002Score:
          type:
          - integer
          - 'null'
          format: int32
          description: Nutritional Risk Screening 2002 total score, 0 to 7, where 3 or more indicates
            nutritional risk.
        sarcfScore:
          type:
          - integer
          - 'null'
          format: int32
          description: SARC-F sarcopenia case-finding score, 0 to 10, where 4 or more indicates a risk
            of sarcopenia.
        scoffScore:
          type:
          - integer
          - 'null'
          format: int32
          description: SCOFF disordered-eating screening score, 0 to 5, where 2 or more warrants further
            assessment.
        refeedingRisk:
          type: string
          enum:
          - none
          - high
          - highest
          - ''
          description: 'Refeeding-syndrome risk per NICE CG32: none, high, or highest.'
        energyRequirementKcal:
          type:
          - integer
          - 'null'
          format: int32
          description: Estimated daily energy requirement in kilocalories, as entered by the dietitian
            using the equation named on the assessment.
        proteinRequirementG:
          type:
          - integer
          - 'null'
          format: int32
          description: Estimated daily protein requirement in grams, as entered by the dietitian.
        computedCompositeRisk:
          type: string
          enum:
          - low
          - moderate
          - high
          - critical
          - ''
          description: 'Composite nutrition risk computed by the engine using the max-grade algorithm
            across every instrument: low, moderate, high, or critical.'
        finalCompositeRisk:
          type: string
          enum:
          - low
          - moderate
          - high
          - critical
          - ''
          description: Composite nutrition risk signed off by the dietitian, which may equal or differ
            from the computed value.
        overrideReason:
          type: string
          maxLength: 500
          description: Reason the dietitian set a final value differently from the computed value, mandatory
            when they differ.
        recommendation:
          type: string
          enum:
          - routine-care
          - observe-and-rescreen
          - dietetic-treatment-plan
          - urgent-referral
          - discharge
          - ''
          description: 'Overall recommendation: routine-care, observe-and-rescreen, dietetic-treatment-plan,
            urgent-referral, or discharge.'
        dietitianNotes:
          type: string
          description: Free-text dietitian summary notes.
        signedByName:
          type: string
          maxLength: 255
          description: Name of the registered dietitian who signed the assessment.
        signedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Timestamp of the dietitian electronic signature.
        gradedAt:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the result.
      required:
      - createdAt
      - updatedAt
      - dieticAssessmentId
      - computedMustRisk
      - finalMustRisk
      - mustIsEstimated
      - glimPhenotypicCriteria
      - glimEtiologicCriteria
      - glimDiagnosis
      - refeedingRisk
      - computedCompositeRisk
      - finalCompositeRisk
      - overrideReason
      - recommendation
      - dietitianNotes
      - signedByName
      - gradedAt
      description: Computed and signed-off grading result for one dietetic assessment. Stores both the
        engine-computed values and the dietitian-final values with an override reason.
