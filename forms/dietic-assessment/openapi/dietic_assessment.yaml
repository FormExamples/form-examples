          format: double
          description: Alcohol consumption in United Kingdom units per week. Above 14 fires the alcohol-excess safety flag and is a NICE CG32 refeeding-risk criterion.
        thickened_fluids:
          type: string
          enum:
            - "yes"
            - "no"
            - ""
          description: Whether the patient takes thickened fluids for dysphagia.
        thickened_fluids_iddsi_level:
          type: string
          enum:
            - "0"
            - "1"
            - "2"
            - "3"
            - "4"
            - ""
          description: IDDSI drink level 0 to 4, where 0 is thin and 4 is extremely thick.
        hydration_signs:
          type: string
          enum:
            - well-hydrated
            - mild-dehydration
            - moderate-dehydration
            - severe-dehydration
            - fluid-overload
            - ""
          description: Clinical hydration status observed, from well-hydrated through severe dehydration to fluid overload.
        fluid_restriction:
          type: string
          enum:
            - "yes"
            - "no"
            - ""
          description: Whether a fluid restriction is in place, such as for heart failure or dialysis.
        fluid_restriction_ml_per_day:
          type: integer
          format: int32
          description: Prescribed daily fluid restriction in ml.
        hydration_notes:
          type: string
          description: Free-text notes about fluid intake and hydration.
        has_food_allergy:
          type: string
          enum:
            - "yes"
            - "no"
            - ""
          description: Whether the patient has any food allergy.
        has_food_intolerance:
          type: string
          enum:
            - "yes"
            - "no"
            - ""
          description: Whether the patient has any food intolerance.
        foods_avoided:
          type: string
          description: Foods the patient avoids, whatever the reason.
        avoidance_reason:
          type: string
          enum:
            - allergy
            - intolerance
            - medical-advice
            - religious
            - cultural
            - ethical
            - dislike
            - cost
            - other
            - ""
          description: Why the patient avoids those foods, because allergy, medical advice, cost, and preference lead to different dietetic responses.
        dislikes:
          type: string
          description: Foods the patient dislikes, which constrain what a care plan can realistically suggest.
        therapeutic_diet:
          type: string
          enum:
            - none
            - gluten-free
            - low-fodmap
            - renal
            - diabetic
            - low-sodium
            - low-potassium
            - high-energy-high-protein
            - ketogenic
            - low-residue
            - other
            - ""
          description: Any therapeutic diet already in place, such as gluten-free, renal, or low-FODMAP.
        dietary_pattern:
          type: string
          enum:
            - omnivore
            - vegetarian
            - vegan
            - pescatarian
            - halal
            - kosher
            - other
            - ""
          description: Overall dietary pattern, such as omnivore, vegetarian, vegan, halal, or kosher.
        religious_or_cultural_requirement:
          type: string
          maxLength: 500
          description: Religious or cultural dietary requirements the care plan must respect.
        fasting_practice:
          type: string
          maxLength: 500
          description: Fasting practices the patient observes, such as Ramadan, which change the timing of intake.
        texture_modified_diet:
          type: string
          enum:
            - "yes"
            - "no"
            - ""
          description: Whether the patient is on a texture-modified diet.
        texture_modified_iddsi_level:
          type: string
          enum:
            - "3"
            - "4"
            - "5"
            - "6"
            - "7"
            - ""
          description: IDDSI food level 3 to 7, where 3 is liquidised and 7 is regular.
        preferences_notes:
          type: string
          description: Free-text notes about preferences, allergies, and cultural requirements.
        appetite_change:
          type: string
          enum:
            - none
            - increased
            - decreased
            - ""
          description: Whether appetite has changed recently, and in which direction.
        early_satiety:
          type: string
          enum:
            - "yes"
            - "no"
            - ""
          description: Whether the patient feels full soon after starting to eat.
        nausea:
          type: string
          enum:
            - "yes"
            - "no"
            - ""
          description: Whether the patient has nausea.
        vomiting:
          type: string
          enum:
            - "yes"
            - "no"
            - ""
          description: Whether the patient is vomiting.
        dysphagia:
          type: string
          enum:
            - "yes"
            - "no"
            - ""
          description: Whether the patient has difficulty swallowing. Recorded dysphagia without a speech-and-language-therapy assessment fires the dysphagia-aspiration-risk safety flag.
        dysphagia_screen_outcome:
          type: string
          enum:
            - pass
            - fail
            - not-done
            - ""
          description: "Outcome of the swallow screen: pass, fail, or not done."
        speech_and_language_therapy:
          type: string
          enum:
            - "yes"
            - "no"
            - ""
          description: Whether speech and language therapy is involved in the patient's care.
        reflux:
          type: string
          enum:
            - "yes"
            - "no"
            - ""
          description: Whether the patient has gastro-oesophageal reflux.
        abdominal_pain:
          type: string
          enum:
            - "yes"
            - "no"
            - ""
          description: Whether the patient has abdominal pain.
        bloating:
          type: string
          enum:
            - "yes"
            - "no"
            - ""
          description: Whether the patient has bloating.
        bowel_frequency_per_week:
          type: integer
          format: int32
          description: Number of bowel movements per week.
        bristol_stool_type:
          type: string
          enum:
            - "1"
            - "2"
            - "3"
            - "4"
            - "5"
            - "6"
            - "7"
            - ""
          description: Bristol Stool Form Scale type 1 to 7, where 1 to 2 suggests constipation and 6 to 7 suggests diarrhoea.
        constipation:
          type: string
          enum:
            - "yes"
            - "no"
            - ""
          description: Whether the patient has constipation.
        diarrhoea:
          type: string
          enum:
            - "yes"
            - "no"
            - ""
          description: Whether the patient has diarrhoea.
        stoma_present:
          type: string
          enum:
            - "yes"
            - "no"
            - ""
          description: Whether the patient has a stoma or enterocutaneous fistula.
        stoma_output_ml_per_day:
          type: integer
          format: int32
          description: Stoma or fistula output in ml per day, where a high output impairs absorption and fluid balance.
        malabsorption_signs:
          type: string
          enum:
            - "yes"
            - "no"
            - ""
          description: Whether signs of malabsorption are present, such as steatorrhoea, which satisfies the GLIM reduced-assimilation etiologic criterion.
        gastrointestinal_notes:
          type: string
          description: Free-text notes about gastrointestinal and swallowing findings.
        living_situation:
          type: string
          enum:
            - alone
            - with-partner
            - with-family
            - shared-house
            - care-home
            - supported-living
            - homeless
            - other
            - ""
          description: The patient's living situation, because it determines who provides food.
        who_shops:
          type: string
          enum:
            - patient
            - family
            - carer
            - delivery
            - other
            - ""
          description: Who does the food shopping.
        who_cooks:
          type: string
          enum:
            - patient
            - family
            - carer
            - meal-service
            - other
            - ""
          description: Who prepares the meals.
        cooking_skills:
          type: string
          enum:
            - confident
            - basic
            - limited
            - none
            - ""
          description: The patient's cooking skills, because a care plan must be achievable with them.
        cooking_confidence_0_10:
          type: integer
          format: int32
          description: The patient's confidence in cooking, from 0 for none to 10 for fully confident.
        has_cooker:
          type: string
          enum:
            - "yes"
            - "no"
            - ""
          description: Whether the patient has a working cooker.
        has_fridge:
          type: string
          enum:
            - "yes"
            - "no"
            - ""
          description: Whether the patient has a working fridge.
        has_freezer:
          type: string
          enum:
            - "yes"
            - "no"
            - ""
          description: Whether the patient has a working freezer.
        has_microwave:
          type: string
          enum:
            - "yes"
            - "no"
            - ""
          description: Whether the patient has a working microwave.
        food_budget_per_week:
          type: number
          format: double
          description: Weekly food budget in the local currency, because a care plan must be affordable.
        worried_food_would_run_out:
          type: string
          enum:
            - "yes"
            - "no"
            - ""
          description: Whether the patient worried that food would run out before there was money to buy more, i.e. the first food-insecurity screening question.
        skipped_meals_for_money:
          type: string
          enum:
            - "yes"
            - "no"
            - ""
          description: Whether the patient skipped meals because there was not enough money for food, i.e. the second food-insecurity screening question.
        uses_food_bank:
          type: string
          enum:
            - "yes"
            - "no"
            - ""
          description: Whether the patient uses a food bank.
        access_to_shops:
          type: string
          enum:
            - easy
            - moderate
            - difficult
            - none
            - ""
          description: How easily the patient can reach food shops.
        has_transport:
          type: string
          enum:
            - "yes"
            - "no"
            - ""
          description: Whether the patient has transport for food shopping.
        work_pattern:
          type: string
          enum:
            - full-time
            - part-time
            - shift-work
            - night-shift
            - unemployed
            - retired
            - student
            - carer
            - unable-to-work
            - ""
          description: The patient's work pattern, because shift and night work disrupt meal timing.
        meal_support:
          type: string
          enum:
            - none
            - family
            - care-worker
            - meals-on-wheels
            - day-centre
            - care-home-catering
            - other
            - ""
          description: What meal support the patient receives, such as family, a care worker, or meals on wheels.
        social_support:
          type: string
          enum:
            - good
            - some
            - limited
            - none
            - ""
          description: Level of social support available to the patient.
        environment_notes:
          type: string
          description: Free-text notes about lifestyle and food environment.
        activity_level:
          type: string
          enum:
            - sedentary
            - lightly-active
            - moderately-active
            - very-active
            - ""
          description: Overall physical activity level, which feeds the energy requirement estimate.
        exercise_type:
          type: string
          maxLength: 255
          description: Type of exercise the patient does.
        exercise_minutes_per_week:
          type: integer
          format: int32
          description: Minutes of exercise per week.
        sedentary_hours_per_day:
          type: number
          format: double
          description: Hours per day spent sedentary.
        mobility:
          type: string
          enum:
            - independent
            - walking-aid
            - wheelchair
            - bed-bound
            - ""
          description: Mobility status, from independent through walking aid and wheelchair to bed-bound.
        falls_in_last_12_months:
          type: integer
          format: int32
          description: Number of falls in the last 12 months, which is the SARC-F falls component and a sarcopenia indicator.
        sarcf_strength:
          type: integer
          format: int32
          description: "SARC-F component: difficulty lifting and carrying 4.5 kg, scored 0 for none, 1 for some, 2 for a lot or unable."
        sarcf_walking:
          type: integer
          format: int32
          description: "SARC-F component: difficulty walking across a room, scored 0 for none, 1 for some, 2 for a lot, uses aids, or unable."
        sarcf_rising_from_chair:
          type: integer
          format: int32
          description: "SARC-F component: difficulty transferring from a chair or bed, scored 0 for none, 1 for some, 2 for a lot or unable without help."
        sarcf_climbing_stairs:
          type: integer
          format: int32
          description: "SARC-F component: difficulty climbing a flight of ten stairs, scored 0 for none, 1 for some, 2 for a lot or unable."
        sarcf_falls:
          type: integer
          format: int32
          description: "SARC-F component: number of falls in the past year, scored 0 for none, 1 for one to three, 2 for four or more."
        eats_independently:
          type: string
          enum:
            - "yes"
            - "no"
            - ""
          description: Whether the patient can eat and drink without assistance.
        feeding_assistance_required:
          type: string
          enum:
            - none
            - prompting
            - partial
            - full
            - ""
          description: "Level of feeding assistance required: none, prompting, partial, or full."
        function_notes:
          type: string
          description: Free-text notes about physical activity and function.
        motivation_0_10:
          type: integer
          format: int32
          description: The patient's motivation to change, from 0 for none to 10 for fully motivated.
        stage_of_change:
          type: string
          enum:
            - precontemplation
            - contemplation
            - preparation
            - action
            - maintenance
            - relapse
            - ""
          description: Stage of change in the transtheoretical model, which sets how directive the intervention should be.
        self_efficacy_0_10:
          type: integer
          format: int32
          description: The patient's confidence in their ability to change, from 0 for none to 10 for fully confident.
        previous_attempts:
          type: string
          description: Previous dietary changes the patient has attempted, and what happened.
        barriers:
          type: string
          description: Barriers the patient identifies to making dietary changes.
        scoff_make_yourself_sick:
          type: string
          enum:
            - "yes"
            - "no"
            - ""
          description: "SCOFF question: do you make yourself sick because you feel uncomfortably full?"
        scoff_lost_control:
          type: string
          enum:
            - "yes"
            - "no"
            - ""
          description: "SCOFF question: do you worry that you have lost control over how much you eat?"
        scoff_lost_one_stone:
          type: string
          enum:
            - "yes"
            - "no"
            - ""
          description: "SCOFF question: have you recently lost more than one stone, about 6 kg, in a three-month period?"
        scoff_believe_yourself_fat:
          type: string
          enum:
            - "yes"
            - "no"
            - ""
          description: "SCOFF question: do you believe yourself to be fat when others say you are too thin?"
        scoff_food_dominates:
          type: string
          enum:
            - "yes"
            - "no"
            - ""
          description: "SCOFF question: would you say that food dominates your life?"
        mood:
          type: string
          enum:
            - good
            - low
            - depressed
            - variable
            - ""
          description: The patient's mood, because low mood reduces appetite and adherence.
        anxiety:
          type: string
          enum:
            - none
            - mild
            - moderate
            - severe
            - ""
          description: The patient's anxiety level.
        cognitive_impairment:
          type: string
          enum:
            - none
            - mild
            - moderate
            - severe
            - ""
          description: Degree of cognitive impairment, which affects recall accuracy and the ability to follow a plan.
        capacity_concern:
          type: string
          enum:
            - "yes"
            - "no"
            - ""
          description: Whether there is a concern about the patient's capacity to consent to or follow the plan, which fires the capacity-concern safety flag.
        safeguarding_concern:
          type: string
          enum:
            - "yes"
            - "no"
            - ""
          description: Whether there is a safeguarding concern, such as self-neglect or malnutrition in a care setting, which fires the safeguarding safety flag.
        health_literacy:
          type: string
          enum:
            - high
            - moderate
            - low
            - ""
          description: The patient's health literacy, which sets the reading level of the resources given.
        preferred_learning_style:
          type: string
          enum:
            - verbal
            - written
            - visual
            - demonstration
            - digital
            - ""
          description: How the patient prefers to receive information, such as verbal, written, visual, or by demonstration.
        patient_goal_in_own_words:
          type: string
          description: The patient's own goal, recorded verbatim, so the care plan can be written against what the patient actually wants.
        acutely_ill:
          type: string
          enum:
            - "yes"
            - "no"
            - ""
          description: Whether the patient is acutely ill, i.e. the first half of the MUST step 3 acute disease effect criterion.
        no_nutritional_intake_over_5_days:
          type: string
          enum:
            - "yes"
            - "no"
            - ""
          description: Whether there has been, or is likely to be, no nutritional intake for more than five days, i.e. the second half of the MUST step 3 acute disease effect criterion.
        days_of_negligible_intake:
          type: integer
          format: int32
          description: Number of days of little or no nutritional intake, used for the NICE CG32 refeeding-syndrome risk criteria.
        nrs_2002_score:
          type: integer
          format: int32
          description: Nutritional Risk Screening 2002 total score, 0 to 7, where 3 or more indicates nutritional risk in the acute inpatient setting.
        energy_requirement_kcal:
          type: integer
          format: int32
          description: Estimated daily energy requirement in kilocalories, entered by the dietitian using the equation named below.
        protein_requirement_g:
          type: integer
          format: int32
          description: Estimated daily protein requirement in grams, entered by the dietitian.
        fluid_requirement_ml:
          type: integer
          format: int32
          description: Estimated daily fluid requirement in ml, entered by the dietitian.
        requirement_equation:
          type: string
          enum:
            - henry
            - schofield
            - harris-benedict
            - mifflin-st-jeor
            - kcal-per-kg
            - indirect-calorimetry
            - other
            - ""
          description: Which equation or method was used to estimate requirements, because local policy governs the choice and the form does not compute it.
        pes_problem:
          type: string
          maxLength: 500
          description: PES statement problem, i.e. the nutrition and dietetic diagnosis.
        pes_etiology:
          type: string
          maxLength: 500
          description: PES statement etiology, i.e. what is causing the problem.
        pes_signs_symptoms:
          type: string
          maxLength: 500
          description: PES statement signs and symptoms, i.e. the evidence for the problem.
        intervention_type:
          type: string
          enum:
            - dietary-counselling
            - food-first-fortification
            - oral-nutritional-supplements
            - texture-modification
            - enteral-nutrition
            - parenteral-nutrition
            - weight-management
            - no-intervention
            - other
            - ""
          description: Type of nutrition intervention chosen, from dietary counselling through food fortification and oral nutritional supplements to enteral or parenteral nutrition.
        prescribed_supplement:
          type: string
          maxLength: 255
          description: Oral nutritional supplement prescribed, where one is prescribed.
        prescribed_supplement_dose:
          type: string
          maxLength: 255
          description: Dose and frequency of the prescribed supplement.
        texture_modification_plan:
          type: string
          maxLength: 255
          description: Texture modification plan, stated in IDDSI levels where applicable.
        goal_1:
          type: string
          maxLength: 500
          description: First SMART goal, with its target, measure, and review date.
        goal_2:
          type: string
          maxLength: 500
          description: Second SMART goal, with its target, measure, and review date.
        goal_3:
          type: string
          maxLength: 500
          description: Third SMART goal, with its target, measure, and review date.
        education_provided:
          type: string
          description: Education provided to the patient during the consultation.
        resources_given:
          type: string
          description: Written or digital resources given to the patient.
        monitoring_indicators:
          type: string
          description: What will be monitored to evaluate the intervention, such as weight, intake, or a biochemical marker.
        review_interval_weeks:
          type: integer
          format: int32
          description: Interval in weeks until the next review.
        review_date:
          type: string
          format: date
          description: Date of the next planned review.
        onward_referral:
          type: string
          maxLength: 500
          description: Onward referrals made, such as to speech and language therapy, the nutrition support team, or social prescribing.
        additional_notes:
          type: string
          description: Any additional notes the dietitian records.
