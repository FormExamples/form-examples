components:
  schemas:
    AuditC:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the patient being screened (delete restricted).
        clinicianId:
          type:
          - string
          - 'null'
          format: uuid
          description: Foreign key to the administering clinician (optional; delete restricted).
        clinicianName:
          type: string
          maxLength: 255
          description: Name of the administering clinician as recorded on the assessment.
        clinicianRole:
          type: string
          enum:
          - gp
          - nurse
          - healthcare-assistant
          - other
          - ''
          description: 'Role of the administering clinician: gp, nurse, healthcare-assistant, or other.'
        assessedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Date and time the AUDIT-C screen was administered.
        careSetting:
          type: string
          enum:
          - primary-care
          - emergency-department
          - health-check
          - inpatient
          - other
          - ''
          description: 'Care setting: primary-care, emergency-department, health-check, inpatient, or
            other.'
        administrationMode:
          type: string
          enum:
          - self-completed
          - interview
          - ''
          description: 'How the screen was administered: self-completed by the patient or by interview.'
        patientIdentifier:
          type: string
          maxLength: 100
          description: Local patient identifier as recorded on the assessment.
        ageBand:
          type: string
          enum:
          - 16-24
          - 25-39
          - 40-59
          - 60-74
          - 75-plus
          - ''
          description: 'Adult age band: 16-24, 25-39, 40-59, 60-74, or 75-plus.'
        sex:
          type: string
          enum:
          - female
          - male
          - intersex
          - unknown
          - ''
          description: 'Patient sex recorded for the assessment: female, male, intersex, or unknown. Selects
            the Q3 heavy-episode threshold (>= 6 units female, >= 8 units male) and the sex-specific low-cut
            flag.'
      required:
      - createdAt
      - updatedAt
      - patientId
      - clinicianName
      - clinicianRole
      - careSetting
      - administrationMode
      - patientIdentifier
      - ageBand
      - sex
      description: 'Main AUDIT-C assessment record: assessment context, patient identification, and the
        three scored consumption item inputs (Q1 frequency of drinking, Q2 typical quantity, Q3 frequency
        of heavy episodic drinking). Uses the short table base audit_c to stay within PostgreSQL identifier
        limits.'
    AuditCGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        auditCId:
          type: string
          format: uuid
          description: Foreign key to the parent assessment (unique, 1:1).
        totalScore:
          type:
          - integer
          - 'null'
          format: int32
          description: Summed AUDIT-C score across the three consumption items (0-12); a missing item
            contributes 0.
        riskBand:
          type: string
          enum:
          - lower
          - increasing
          - higher
          - possible-dependence
          - ''
          description: 'Derived risk band: lower (0-4), increasing (5-7), higher (8-10), or possible-dependence
            (11-12).'
        positiveScreen:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Positive-screen indicator: yes when total_score >= 5 (UK default cut), otherwise
            no.'
        gradedAt:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the grade.
      required:
      - createdAt
      - updatedAt
      - auditCId
      - riskBand
      - positiveScreen
      - gradedAt
      description: 'Computed AUDIT-C grading result (1:1 with audit_c): summed total (0-12), derived risk
        band, and positive-screen indicator (total >= 5).'
    AuditCGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        auditCGradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        flagId:
          type: string
          maxLength: 50
          description: Stable flag identifier (e.g. F-ESCALATE-FULL-AUDIT-001).
        category:
          type: string
          enum:
          - brief-intervention
          - high-consumption
          - dependence-indicators
          - escalate-full-audit
          - incomplete
          - other
          - ''
          description: Flag category (see CHECK constraint for enumeration).
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          - ''
          description: 'Priority: low, medium, high.'
        description:
          type: string
          maxLength: 500
          description: Human-readable description of what fired the flag.
        suggestedAction:
          type: string
          maxLength: 500
          description: Suggested clinical action (e.g. "complete the full 10-item AUDIT and deliver a
            brief intervention").
      required:
      - createdAt
      - updatedAt
      - auditCGradeId
      - flagId
      - category
      - priority
      - description
      - suggestedAction
      description: Red-flag issues that fire independently of the total score, with priority and a suggested
        action for the clinical team.
    AuditCGradeRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        auditCGradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        ruleId:
          type: string
          maxLength: 40
          description: Stable rule identifier (e.g. R-FREQUENCY-3POINT-01).
        item:
          type: string
          enum:
          - frequency
          - quantity
          - binge-frequency
          - band
          description: 'Scored item the rule belongs to: frequency (Q1), quantity (Q2), binge-frequency
            (Q3), or band (total risk band).'
        points:
          type:
          - integer
          - 'null'
          format: int32
          description: Points (0-4) contributed by this rule for its item.
        category:
          type: string
          maxLength: 50
          description: Subject category (e.g. item-score, band).
        description:
          type: string
          maxLength: 500
          description: Human-readable description of why the rule fired.
      required:
      - createdAt
      - updatedAt
      - auditCGradeId
      - ruleId
      - item
      - category
      - description
      description: 'Audit trail of every grading rule that fired during AUDIT-C computation: item, points
        contributed, category, and description.'
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Clinician full name.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as a single text block.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code.
        role:
          type: string
          enum:
          - gp
          - nurse
          - healthcare-assistant
          - other
          - ''
          description: 'Primary clinical role: gp, nurse, healthcare-assistant, or other.'
        registrationBody:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - GPhC
          - other
          - ''
          description: 'Professional registration body: GMC, NMC, HCPC, GPhC, or other.'
        registrationNumber:
          type: string
          description: Professional registration number issued by the registration body.
      required:
      - createdAt
      - updatedAt
      - name
      - role
      - registrationBody
      - registrationNumber
      description: Clinician identifying information for the clinician who administered the AUDIT-C screen.
    Patient:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          maxLength: 255
          description: Full patient name.
        birthDate:
          type: string
          format: date
          description: Date of birth.
        sex:
          type: string
          enum:
          - female
          - male
          - intersex
          - unknown
          - ''
          description: 'Sex recorded for clinical purposes: female, male, intersex, or unknown.'
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as a single text block.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code.
        unitedKingdomNhsNumber:
          type:
          - string
          - 'null'
          maxLength: 20
          description: United Kingdom NHS number, unique per person.
        hospitalMrn:
          type:
          - string
          - 'null'
          maxLength: 50
          description: Local hospital medical record number (MRN).
        heightAsCm:
          type:
          - number
          - 'null'
          format: double
          description: Height in centimetres.
        weightAsKg:
          type:
          - number
          - 'null'
          format: double
          description: Weight in kilograms.
        bodyMassIndex:
          type:
          - number
          - 'null'
          format: double
          description: Body mass index (BMI), kg/m^2.
        allergiesSummary:
          type: string
          description: Free-text summary of known allergies.
      required:
      - createdAt
      - updatedAt
      - name
      - birthDate
      - sex
      - allergiesSummary
      description: Patient demographic information used by the AUDIT-C assessment record.
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          description: A URI identifying the problem type
        title:
          type: string
          description: A short summary of the problem type
        status:
          type: integer
          description: The HTTP status code
        detail:
          type: string
          description: An explanation of this occurrence
        instance:
          type: string
          description: A URI identifying this occurrence
        code:
          type: string
          description: A short machine-readable reason
        errors:
          type: object
          description: Per-field detail, when validation failed
      required:
      - type
      - title
      - status
