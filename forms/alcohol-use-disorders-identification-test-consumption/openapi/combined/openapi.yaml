          type: string
          format: uuid
          description: Foreign key to the parent grade.
        rule_id:
          type: string
          maxLength: 40
          description: Stable rule identifier (e.g. R-FREQUENCY-3POINT-01).
        item:
          type: string
          enum:
          - frequency
          - quantity
          - binge-frequency
          - band
          description: 'Scored item the rule belongs to: frequency (Q1), quantity (Q2), binge-frequency
