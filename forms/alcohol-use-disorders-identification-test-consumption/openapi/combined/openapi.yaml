components:
  schemas:
    AuditC:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        patient_id:
          type: string
          format: uuid
          description: Foreign key to the patient being screened (delete restricted).
        clinician_id:
          type: string
          format: uuid
          description: Foreign key to the administering clinician (optional; delete restricted).
        clinician_name:
          type: string
          maxLength: 255
          description: Name of the administering clinician as recorded on the assessment.
        clinician_role:
          type: string
          enum:
          - gp
          - nurse
          - healthcare-assistant
          - other
          - ''
          description: 'Role of the administering clinician: gp, nurse, healthcare-assistant, or other.'
        assessed_at:
          type: string
          format: date-time
          description: Date and time the AUDIT-C screen was administered.
        care_setting:
          type: string
          enum:
          - primary-care
          - emergency-department
          - health-check
          - inpatient
          - other
          - ''
          description: 'Care setting: primary-care, emergency-department, health-check, inpatient, or
            other.'
        administration_mode:
          type: string
          enum:
          - self-completed
          - interview
          - ''
          description: 'How the screen was administered: self-completed by the patient or by interview.'
        patient_identifier:
          type: string
          maxLength: 100
          description: Local patient identifier as recorded on the assessment.
        age_band:
          type: string
          enum:
          - 16-24
          - 25-39
          - 40-59
          - 60-74
          - 75-plus
          - ''
          description: 'Adult age band: 16-24, 25-39, 40-59, 60-74, or 75-plus.'
        sex:
          type: string
          enum:
          - female
          - male
          - intersex
          - unknown
          - ''
          description: 'Patient sex recorded for the assessment: female, male, intersex, or unknown. Selects
            the Q3 heavy-episode threshold (>= 6 units female, >= 8 units male) and the sex-specific low-cut
            flag.'
      required:
      - created_at
      - updated_at
      - patient_id
      - clinician_name
      - clinician_role
      - care_setting
      - administration_mode
      - patient_identifier
      - age_band
      - sex
      description: 'Main AUDIT-C assessment record: assessment context, patient identification, and the
        three scored consumption item inputs (Q1 frequency of drinking, Q2 typical quantity, Q3 frequency
        of heavy episodic drinking). Uses the short table base audit_c to stay within PostgreSQL identifier
        limits.'
    AuditCGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the row was soft-deleted.
        audit_c_id:
          type: string
          format: uuid
          description: Foreign key to the parent assessment (unique, 1:1).
        total_score:
          type: integer
          format: int32
          description: Summed AUDIT-C score across the three consumption items (0-12); a missing item
            contributes 0.
        risk_band:
          type: string
          enum:
          - lower
          - increasing
          - higher
          - possible-dependence
          - ''
          description: 'Derived risk band: lower (0-4), increasing (5-7), higher (8-10), or possible-dependence
            (11-12).'
        positive_screen:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Positive-screen indicator: yes when total_score >= 5 (UK default cut), otherwise
            no.'
        graded_at:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the grade.
      required:
      - created_at
      - updated_at
      - audit_c_id
      - risk_band
      - positive_screen
      - graded_at
      description: 'Computed AUDIT-C grading result (1:1 with audit_c): summed total (0-12), derived risk
        band, and positive-screen indicator (total >= 5).'
