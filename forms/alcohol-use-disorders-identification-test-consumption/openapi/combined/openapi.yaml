          format: date-time
          description: Timestamp when the row was most recently updated.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the row was soft-deleted.
        audit_c_grade_id:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        flag_id:
          type: string
          maxLength: 50
          description: Stable flag identifier (e.g. F-ESCALATE-FULL-AUDIT-001).
        category:
          type: string
          enum:
          - brief-intervention
          - high-consumption
          - dependence-indicators
          - escalate-full-audit
          - incomplete
          - other
          - ''
          description: Flag category (see CHECK constraint for enumeration).
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          - ''
          description: 'Priority: low, medium, high.'
        description:
          type: string
          maxLength: 500
          description: Human-readable description of what fired the flag.
        suggested_action:
          type: string
          maxLength: 500
          description: Suggested clinical action (e.g. "complete the full 10-item AUDIT and deliver a
            brief intervention").
      required:
