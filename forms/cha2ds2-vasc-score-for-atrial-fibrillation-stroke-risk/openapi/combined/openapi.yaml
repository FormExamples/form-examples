components:
  schemas:
    Cha2ds2Vasc:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the patient being assessed (delete restricted).
        clinicianId:
          type:
          - string
          - 'null'
          format: uuid
          description: Foreign key to the assessing clinician (optional; delete restricted).
        clinicianName:
          type: string
          maxLength: 255
          description: Name of the assessing clinician as recorded on the assessment.
        clinicianRole:
          type: string
          enum:
          - doctor
          - nurse
          - pharmacist
          - other
          - ''
          description: 'Role of the assessing clinician: doctor, nurse, pharmacist, or other.'
        assessedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Date and time the assessment was performed.
        careSetting:
          type: string
          enum:
          - primary-care
          - cardiology
          - anticoagulation-clinic
          - emergency-department
          - other
          - ''
          description: 'Care setting: primary-care, cardiology, anticoagulation-clinic, emergency-department,
            or other.'
        atrialFibrillationType:
          type: string
          enum:
          - paroxysmal
          - persistent
          - permanent
          - flutter
          - ''
          description: 'Type of atrial fibrillation: paroxysmal, persistent, permanent, or flutter.'
        patientIdentifier:
          type: string
          maxLength: 100
          description: Local patient identifier as recorded on the assessment.
        ageYears:
          type:
          - integer
          - 'null'
          format: int32
          description: Patient age in years; drives the age criterion (>= 75 scores 2, 65-74 scores 1).
            NULL when unanswered.
        sex:
          type: string
          enum:
          - female
          - male
          - other
          - ''
          description: 'Patient sex driving the sex-category point (female scores 1): female, male, or
            other.'
        congestiveHeartFailure:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Criterion C — congestive heart failure or left-ventricular dysfunction (scores
            1 when yes): yes or no.'
        hypertension:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Criterion H — hypertension, treated or with blood pressure > 140/90 (scores 1
            when yes): yes or no.'
        diabetes:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Criterion D — diabetes mellitus (scores 1 when yes): yes or no.'
        strokeTiaThromboembolism:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Criterion S2 — prior stroke, transient ischaemic attack, or thromboembolism (scores
            2 when yes): yes or no.'
        vascularDisease:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Criterion V — vascular disease (prior MI, peripheral arterial disease, or aortic
            plaque; scores 1 when yes): yes or no.'
        clinicalNote:
          type: string
          description: Free-text clinical note recorded with the assessment.
      required:
      - createdAt
      - updatedAt
      - patientId
      - clinicianName
      - clinicianRole
      - careSetting
      - atrialFibrillationType
      - patientIdentifier
      - sex
      - congestiveHeartFailure
      - hypertension
      - diabetes
      - strokeTiaThromboembolism
      - vascularDisease
      - clinicalNote
      description: 'Main CHA2DS2-VASc assessment record: assessment context, patient identification, and
        the weighted criterion inputs (congestive heart failure, hypertension, age, diabetes, prior stroke/TIA/thromboembolism,
        vascular disease, and sex category).'
    Cha2ds2VascGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        cha2ds2VascId:
          type: string
          format: uuid
          description: Foreign key to the parent assessment (unique, 1:1).
        congestiveHeartFailurePoints:
          type:
          - integer
          - 'null'
          format: int32
          description: Points (0 or 1) awarded for criterion C, congestive heart failure / LV dysfunction.
        hypertensionPoints:
          type:
          - integer
          - 'null'
          format: int32
          description: Points (0 or 1) awarded for criterion H, hypertension.
        agePoints:
          type:
          - integer
          - 'null'
          format: int32
          description: Points (0, 1, or 2) awarded for the age criterion (2 for >= 75, 1 for 65-74, 0
            otherwise); mutually exclusive bands.
        diabetesPoints:
          type:
          - integer
          - 'null'
          format: int32
          description: Points (0 or 1) awarded for criterion D, diabetes mellitus.
        strokePoints:
          type:
          - integer
          - 'null'
          format: int32
          description: Points (0 or 2) awarded for criterion S2, prior stroke / TIA / thromboembolism.
        vascularDiseasePoints:
          type:
          - integer
          - 'null'
          format: int32
          description: Points (0 or 1) awarded for criterion V, vascular disease.
        sexPoints:
          type:
          - integer
          - 'null'
          format: int32
          description: Points (0 or 1) awarded for the sex category (1 for female).
        totalScore:
          type:
          - integer
          - 'null'
          format: int32
          description: Summed CHA2DS2-VASc score across the criteria (0-9 when complete).
        riskBand:
          type: string
          enum:
          - low
          - intermediate
          - high
          - ''
          description: 'Derived risk band: low, intermediate, or high.'
        annualStrokeRiskPercent:
          type:
          - number
          - 'null'
          format: double
          description: Estimated annual ischaemic-stroke rate as a percentage, looked up by total score
            (Lip et al., Chest 2010 adjusted rates).
        anticoagulationRecommendation:
          type: string
          description: 'Anticoagulation recommendation mirroring the risk band: none (low), consider (intermediate),
            or recommended (high).'
        gradedAt:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the grade.
      required:
      - createdAt
      - updatedAt
      - cha2ds2VascId
      - riskBand
      - anticoagulationRecommendation
      - gradedAt
      description: 'Computed CHA2DS2-VASc grading result: per-criterion sub-scores, summed total (0-9),
        derived risk band, looked-up annual stroke rate, and anticoagulation recommendation.'
    Cha2ds2VascGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        cha2ds2VascGradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        flagId:
          type: string
          maxLength: 50
          description: Stable flag identifier (e.g. F-HIGH-RISK-UNTREATED-001).
        category:
          type: string
          enum:
          - anticoagulation-recommended
          - high-risk-untreated
          - bleeding-risk-cross-ref
          - prior-stroke-tia
          - advanced-age
          - female-sex-modifier
          - incomplete-assessment
          - other
          - ''
          description: Flag category (see CHECK constraint for enumeration).
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          - ''
          description: 'Priority: low, medium, high.'
        description:
          type: string
          maxLength: 500
          description: Human-readable description of what fired the flag.
        suggestedAction:
          type: string
          maxLength: 500
          description: Suggested clinical action (e.g. "complete a HAS-BLED assessment before starting
            anticoagulation").
      required:
      - createdAt
      - updatedAt
      - cha2ds2VascGradeId
      - flagId
      - category
      - priority
      - description
      - suggestedAction
      description: Red-flag issues that fire independently of the total score, with priority and a suggested
        action for the clinical team.
    Cha2ds2VascGradeRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        cha2ds2VascGradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        ruleId:
          type: string
          maxLength: 40
          description: Stable rule identifier (e.g. R-STROKE-2POINT-01).
        criterion:
          type: string
          enum:
          - congestive-heart-failure
          - hypertension
          - age
          - diabetes
          - stroke
          - vascular-disease
          - sex
          - risk-band
          description: 'Scored criterion the rule belongs to: congestive-heart-failure, hypertension,
            age, diabetes, stroke, vascular-disease, sex, or risk-band.'
        points:
          type:
          - integer
          - 'null'
          format: int32
          description: Points contributed by this rule for its criterion.
        category:
          type: string
          maxLength: 50
          description: Subject category (e.g. criterion-fired, risk-band).
        description:
          type: string
          maxLength: 500
          description: Human-readable description of why the rule fired.
      required:
      - createdAt
      - updatedAt
      - cha2ds2VascGradeId
      - ruleId
      - criterion
      - category
      - description
      description: 'Audit trail of every grading rule that fired during CHA2DS2-VASc computation: criterion,
        points contributed, category, and description.'
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Clinician full name.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as a single text block.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2.
        postcode:
          type:
