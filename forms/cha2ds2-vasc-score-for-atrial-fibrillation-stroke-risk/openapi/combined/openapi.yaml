        vascular disease, and sex category).'
    Cha2ds2VascGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the row was soft-deleted.
        cha2ds2_vasc_id:
          type: string
          format: uuid
          description: Foreign key to the parent assessment (unique, 1:1).
        congestive_heart_failure_points:
          type: integer
          format: int32
          description: Points (0 or 1) awarded for criterion C, congestive heart failure / LV dysfunction.
        hypertension_points:
          type: integer
          format: int32
          description: Points (0 or 1) awarded for criterion H, hypertension.
        age_points:
          type: integer
          format: int32
          description: Points (0, 1, or 2) awarded for the age criterion (2 for >= 75, 1 for 65-74, 0
            otherwise); mutually exclusive bands.
        diabetes_points:
          type: integer
          format: int32
          description: Points (0 or 1) awarded for criterion D, diabetes mellitus.
        stroke_points:
          type: integer
          format: int32
          description: Points (0 or 2) awarded for criterion S2, prior stroke / TIA / thromboembolism.
        vascular_disease_points:
          type: integer
          format: int32
          description: Points (0 or 1) awarded for criterion V, vascular disease.
        sex_points:
          type: integer
          format: int32
          description: Points (0 or 1) awarded for the sex category (1 for female).
        total_score:
          type: integer
          format: int32
          description: Summed CHA2DS2-VASc score across the criteria (0-9 when complete).
        risk_band:
          type: string
          enum:
          - low
          - intermediate
          - high
          - ''
          description: 'Derived risk band: low, intermediate, or high.'
        annual_stroke_risk_percent:
          type: number
          format: double
          description: Estimated annual ischaemic-stroke rate as a percentage, looked up by total score
            (Lip et al., Chest 2010 adjusted rates).
        anticoagulation_recommendation:
          type: string
          description: 'Anticoagulation recommendation mirroring the risk band: none (low), consider (intermediate),
            or recommended (high).'
        graded_at:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the grade.
      required:
      - created_at
      - updated_at
      - cha2ds2_vasc_id
      - risk_band
      - anticoagulation_recommendation
      - graded_at
      description: 'Computed CHA2DS2-VASc grading result: per-criterion sub-scores, summed total (0-9),
