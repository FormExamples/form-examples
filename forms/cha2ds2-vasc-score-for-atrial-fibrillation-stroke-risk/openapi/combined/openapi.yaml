            or other.'
        atrial_fibrillation_type:
          type: string
          enum:
          - paroxysmal
          - persistent
          - permanent
          - flutter
          - ''
          description: 'Type of atrial fibrillation: paroxysmal, persistent, permanent, or flutter.'
        patient_identifier:
          type: string
          maxLength: 100
          description: Local patient identifier as recorded on the assessment.
        age_years:
          type: integer
          format: int32
          description: Patient age in years; drives the age criterion (>= 75 scores 2, 65-74 scores 1).
            NULL when unanswered.
        sex:
          type: string
          enum:
          - female
          - male
          - other
          - ''
          description: 'Patient sex driving the sex-category point (female scores 1): female, male, or
            other.'
        congestive_heart_failure:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Criterion C — congestive heart failure or left-ventricular dysfunction (scores
            1 when yes): yes or no.'
        hypertension:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Criterion H — hypertension, treated or with blood pressure > 140/90 (scores 1
            when yes): yes or no.'
        diabetes:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Criterion D — diabetes mellitus (scores 1 when yes): yes or no.'
        stroke_tia_thromboembolism:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Criterion S2 — prior stroke, transient ischaemic attack, or thromboembolism (scores
            2 when yes): yes or no.'
        vascular_disease:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Criterion V — vascular disease (prior MI, peripheral arterial disease, or aortic
            plaque; scores 1 when yes): yes or no.'
        clinical_note:
          type: string
          description: Free-text clinical note recorded with the assessment.
      required:
      - created_at
      - updated_at
      - patient_id
      - clinician_name
      - clinician_role
      - care_setting
      - atrial_fibrillation_type
      - patient_identifier
      - sex
      - congestive_heart_failure
      - hypertension
      - diabetes
      - stroke_tia_thromboembolism
      - vascular_disease
      - clinical_note
      description: 'Main CHA2DS2-VASc assessment record: assessment context, patient identification, and
