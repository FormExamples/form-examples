components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Name.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as full text.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code, such as for validating the postal address.
        role:
          type: string
          enum:
          - radiologist
          - gp
          - hospital-doctor
          - surgeon
          - oncologist
          - emergency-physician
          - radiographer
          - other
          - ''
          description: 'Clinician role: radiologist, gp, hospital-doctor, surgeon, oncologist, emergency-physician,
            radiographer, other.'
        registrationBody:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - other
          - ''
          description: 'Clinician registration body: GMC, NMC, HCPC, other.'
        registrationNumber:
          type: string
          description: Clinician registration number.
        unitedKingdomNhsNumber:
          type:
          - string
          - 'null'
          maxLength: 12
          description: United Kingdom NHS number, unique per person.
      required:
      - createdAt
      - updatedAt
      - name
      - role
      - registrationBody
      - registrationNumber
      description: Requesting clinician (referrer) who completes the CT scan request.
    CtScanTestRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the patient.
        clinicianId:
          type: string
          format: uuid
          description: Foreign key to the requesting clinician (referrer).
        status:
          type: string
          enum:
          - draft
          - submitted
          - vetted
          - scheduled
          - rejected
          - ''
          description: 'Request lifecycle status: draft, submitted, vetted, scheduled, rejected.'
        siteName:
          type: string
          maxLength: 255
          description: Name of the requesting site or clinic.
        setting:
          type: string
          enum:
          - outpatient
          - inpatient
          - community
          - emergency
          - ''
          description: 'Care setting: outpatient, inpatient, community, emergency.'
        referralDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the referral was made.
        requestedByDate:
          type:
          - string
          - 'null'
          format: date
          description: Date by which the scan is requested to be performed.
        bodyRegion:
          type: string
          enum:
          - head
          - neck
          - chest
          - abdomen
          - pelvis
          - abdomen-pelvis
          - spine
          - ct-angiogram
          - ct-colonography
          - whole-body
          - extremity
          - other
          - ''
          description: 'Requested CT body region: head, neck, chest, abdomen, pelvis, abdomen-pelvis,
            spine, ct-angiogram, ct-colonography, whole-body, extremity, other.'
        primaryIndication:
          type: string
          enum:
          - trauma
          - suspected-stroke
          - suspected-malignancy
          - cancer-staging
          - pulmonary-embolism
          - abdominal-pain
          - renal-colic
          - infection-abscess
          - pre-surgical-planning
          - follow-up-surveillance
          - headache
          - other
          - ''
          description: Primary clinical indication, used for ACR appropriateness scoring.
        clinicalQuestion:
          type: string
          maxLength: 1000
          description: Specific clinical question the scan should answer (highest-value field).
        relevantHistory:
          type: string
          maxLength: 1000
          description: Relevant medical, surgical, and oncological history.
        contrastRequired:
          type: string
          enum:
          - none
          - iv-iodinated
          - oral
          - both
          - unknown
          - ''
          description: 'Contrast requirement: none, iv-iodinated, oral, both, unknown.'
        pregnancyStatus:
          type: string
          enum:
          - not-pregnant
          - pregnant
          - possible
          - unknown
          - not-applicable
          - ''
          description: 'Pregnancy status for radiation justification: not-pregnant, pregnant, possible,
            unknown, not-applicable.'
        egfr:
          type:
          - number
          - 'null'
          format: double
          description: Estimated glomerular filtration rate (mL/min/1.73m2), for contrast nephropathy
            risk.
        previousContrastReaction:
          type: string
          enum:
          - none
          - mild
          - moderate
          - severe
          - unknown
          - ''
          description: 'Severity of any previous iodinated contrast reaction: none, mild, moderate, severe,
            unknown.'
        iodineContrastAllergy:
          type: boolean
          description: Whether the patient has a known iodinated contrast allergy.
        metformin:
          type: boolean
          description: Whether the patient is taking metformin (contrast / renal interaction).
        diabetes:
          type: boolean
          description: Whether the patient has diabetes.
        renalImpairment:
          type: boolean
          description: Whether the patient has known renal impairment.
        weightKg:
          type:
          - number
          - 'null'
          format: double
          description: Patient weight in kilograms, affecting dose and scanner table limits.
        relevantPreviousImaging:
          type: string
          maxLength: 1000
          description: Details of relevant previous imaging being followed up or compared.
        urgency:
          type: string
          enum:
          - routine
          - urgent
          - emergency
          - ''
          description: 'Requested triage urgency: routine, urgent, emergency.'
        supervisingConsultant:
          type: string
          maxLength: 255
          description: Name of the supervising / responsible consultant.
        irMeRJustification:
          type: string
          maxLength: 1000
          description: 'IR(ME)R radiation justification: why the benefit of the exposure outweighs the
            radiation detriment.'
        notes:
          type: string
          maxLength: 1000
          description: Free-text additional notes.
      required:
      - createdAt
      - updatedAt
      - patientId
      - clinicianId
      - status
      - siteName
      - setting
      - bodyRegion
      - primaryIndication
      - clinicalQuestion
      - relevantHistory
      - contrastRequired
      - pregnancyStatus
      - previousContrastReaction
      - iodineContrastAllergy
      - metformin
      - diabetes
      - renalImpairment
      - relevantPreviousImaging
      - urgency
      - supervisingConsultant
      - irMeRJustification
      - notes
      description: CT (computed tomography) scan request (referral). Captures the requested body region,
        the clinical indication and question, relevant history, contrast and radiation-safety factors
        (eGFR, allergy, metformin, pregnancy), the IR(ME)R radiation justification, and triage urgency.
    CtScanTestRequestGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        ctScanTestRequestId:
          type: string
          format: uuid
          description: Foreign key to the parent request (unique, 1:1).
        appropriatenessScore:
          type:
          - integer
          - 'null'
          format: int32
          description: ACR Appropriateness Criteria score (1-9).
        appropriatenessBand:
          type: string
          enum:
          - usually-appropriate
          - may-be-appropriate
          - usually-not-appropriate
          - ''
          description: 'Appropriateness band: usually-appropriate (7-9), may-be-appropriate (4-6), usually-not-appropriate
            (1-3).'
        contrastSafetyBand:
          type: string
          enum:
          - safe
          - caution
          - contraindicated
          - ''
          description: 'Contrast safety band derived from eGFR, allergy, and previous reaction: safe,
            caution, contraindicated.'
        estimatedDoseBand:
          type: string
          enum:
          - low
          - moderate
          - high
          - ''
          description: 'Estimated radiation dose band for the requested study: low, moderate, high.'
        renalRisk:
          type: boolean
          description: Whether the request carries a contrast-induced nephropathy / renal risk (eGFR-driven).
        completenessPercent:
          type:
          - integer
          - 'null'
          format: int32
          description: Request completeness as a percentage of mandatory fields (0-100).
        triageTier:
          type: string
          enum:
          - routine
          - urgent
          - emergency
          - ''
          description: 'Assigned triage tier: routine, urgent, emergency.'
        targetTimeframe:
          type: string
          maxLength: 50
          description: Target timeframe for the scan implied by the triage tier.
        recommendation:
          type: string
          enum:
          - accept
          - query-referrer
          - redirect
          - reject
          - ''
          description: 'Vetting recommendation: accept, query-referrer, redirect, reject.'
        clinicianNotes:
          type: string
          description: Free-text vetting notes.
        signedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Timestamp of vetting clinician electronic signature.
        gradedAt:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the result.
      required:
      - createdAt
      - updatedAt
      - ctScanTestRequestId
      - appropriatenessBand
      - contrastSafetyBand
      - estimatedDoseBand
      - renalRisk
      - triageTier
      - targetTimeframe
      - recommendation
      - clinicianNotes
      - gradedAt
      description: 'Computed four-axis grading result: appropriateness (ACR 1-9), radiation / contrast
        safety (RCR / ESUR + IR(ME)R), request completeness, and triage priority.'
    CtScanTestRequestGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        ctScanTestRequestGradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        flagId:
          type: string
          maxLength: 50
          description: Stable flag identifier (e.g. F-CONTRAST-ALLERGY-001).
        category:
          type: string
          enum:
          - pregnancy
          - contrast-allergy
          - renal-impairment
          - metformin-contrast
          - high-radiation-dose
          - unjustified-exposure
          - missing-indication
          - missing-clinical-question
          - missing-egfr
          - other
          - ''
          description: Flag category.
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          - ''
          description: 'Priority: low, medium, high.'
        description:
          type: string
          maxLength: 500
          description: Human-readable description of what fired the flag.
        suggestedAction:
          type: string
          maxLength: 500
          description: Suggested clinical action (e.g. "obtain eGFR before contrast administration").
      required:
      - createdAt
      - updatedAt
      - ctScanTestRequestGradeId
      - flagId
      - category
      - priority
      - description
      - suggestedAction
      description: Safety-critical flags that fire independently of the four axes, with priority and a
        suggested action for the imaging team.
    CtScanTestRequestGradeRule:
      type: object
      properties:
