          - urgent
          - emergency
          - ''
          description: 'Requested triage urgency: routine, urgent, emergency.'
        supervising_consultant:
          type: string
          maxLength: 255
          description: Name of the supervising / responsible consultant.
        ir_me_r_justification:
          type: string
          maxLength: 1000
          description: 'IR(ME)R radiation justification: why the benefit of the exposure outweighs the
            radiation detriment.'
        notes:
          type: string
          maxLength: 1000
          description: Free-text additional notes.
