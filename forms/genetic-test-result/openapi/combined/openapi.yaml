components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        name:
          type: string
          description: Name.
        email:
          type: string
          description: Email address.
        phone:
          type: string
          description: Phone number.
        postal_address_as_full_text:
          type: string
          description: Postal address as full text.
        country_as_iso_3166_1_alpha_2:
          type: string
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type: string
          description: Postal code, such as for validating the postal address.
        role:
          type: string
          enum:
          - clinical-geneticist
          - genetic-counsellor
          - clinical-scientist
          - other
          - ''
          description: 'Reporting clinician role: clinical-geneticist, genetic-counsellor, clinical-scientist,
            other.'
        registration_body:
          type: string
          enum:
          - GMC
          - HCPC
          - other
          - ''
          description: 'Clinician registration body: GMC, HCPC, other.'
        registration_number:
          type: string
          description: Clinician registration number.
        united_kingdom_nhs_number:
          type: string
          maxLength: 12
          description: United Kingdom NHS number, unique per person.
      required:
      - created_at
      - updated_at
      - name
      - role
      - registration_body
      - registration_number
      description: Reporting clinician (clinical geneticist, genetic counsellor, or clinical scientist)
        who authors and signs the genetic test result report.
    GeneticTestResult:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        patient_id:
          type: string
          format: uuid
          description: Foreign key to the patient.
        clinician_id:
          type: string
          format: uuid
          description: Foreign key to the reporting clinician (clinical geneticist / genetic counsellor
            / clinical scientist).
        originating_request_reference:
          type: string
          maxLength: 255
          description: Free-text reference linking this report back to the originating genetic test request
            (referral).
        report_status:
          type: string
          enum:
          - preliminary
          - final
          - amended
          - cancelled
          - ''
          description: 'Report lifecycle status: preliminary, final, amended, cancelled.'
        performed_date:
          type: string
          format: date
          description: Date the genetic test / analysis was performed.
        reported_date:
          type: string
          format: date
          description: Date the report was authored / signed.
        test_type:
          type: string
          enum:
          - diagnostic-single-gene
          - gene-panel
          - whole-exome
          - whole-genome
          - chromosomal-microarray
          - karyotype
          - predictive-presymptomatic
          - carrier-testing
          - pharmacogenomic
          - prenatal
          - other
          - ''
          description: 'Type of genomic test performed: diagnostic-single-gene, gene-panel, whole-exome,
            whole-genome, chromosomal-microarray, karyotype, predictive-presymptomatic, carrier-testing,
            pharmacogenomic, prenatal, other.'
        genes_tested:
          type: string
          description: Genes, panel, or genomic region analysed (free text; gene symbols, panel name,
            or region).
        sample_type:
          type: string
          enum:
          - blood
          - saliva
          - tissue
          - prenatal
          - ''
          description: 'Sample type analysed: blood, saliva, tissue, prenatal.'
        clinical_history:
          type: string
          maxLength: 1000
          description: Clinical history, phenotype, and the question the test was performed to answer.
        inheritance_pattern:
          type: string
          maxLength: 500
          description: Inheritance pattern relevant to the result (e.g. autosomal dominant, autosomal
            recessive, X-linked, mitochondrial).
        variants_detected:
          type: string
          maxLength: 2000
          description: Narrative description of the variant(s) detected, with HGVS nomenclature, gene,
            and transcript where applicable (the body of the report).
        variant_classification:
          type: string
          enum:
          - pathogenic
          - likely-pathogenic
          - variant-uncertain-significance
          - likely-benign
          - benign
          - no-variant-detected
          - ''
          description: 'Overall ACMG/AMP (ACGS) five-tier variant classification: pathogenic, likely-pathogenic,
            variant-uncertain-significance, likely-benign, benign, or no-variant-detected.'
        zygosity:
          type: string
          enum:
          - heterozygous
          - homozygous
          - hemizygous
          - not-applicable
          - ''
          description: 'Zygosity of the reported variant: heterozygous, homozygous, hemizygous, not-applicable.'
        pathogenic_variant_found:
          type: boolean
          description: Whether a pathogenic or likely-pathogenic variant was found.
        vus_found:
          type: boolean
          description: Whether a variant of uncertain significance (VUS) was found.
        carrier_status_positive:
          type: boolean
          description: Whether the patient is a carrier of a recessive / X-linked condition.
        secondary_finding:
          type: boolean
          description: Whether a secondary / incidental finding (e.g. an actionable finding unrelated
            to the indication) was identified.
        no_clinically_significant_variant:
          type: boolean
          description: Whether no clinically significant variant was detected for the indication.
        interpretation:
          type: string
          maxLength: 2000
          description: Interpretation of the variant(s) in the context of the patient phenotype and family
            history.
        impression:
          type: string
          maxLength: 2000
          description: Summary impression / conclusion answering the clinical question.
        reporting_category:
          type: string
          maxLength: 50
          description: Structured-reporting category label, free text (e.g. an ACMG/AMP class such as
            "Class 5 — pathogenic").
        recommended_cascade_testing:
          type: boolean
          description: Whether cascade (predictive) testing of at-risk relatives is recommended.
        recommended_follow_up:
          type: string
          maxLength: 1000
          description: 'Recommended follow-up: referral, surveillance, genetic counselling, or further
            testing.'
        critical_result_communicated:
          type: boolean
          description: Whether a critical or actionable result was communicated directly to the referrer
            / clinical team.
        reported_to:
          type: string
          maxLength: 500
          description: Who the critical / actionable result was communicated to, with date and time if
            applicable.
      required:
      - created_at
      - updated_at
      - patient_id
      - clinician_id
      - originating_request_reference
      - report_status
      - test_type
      - genes_tested
      - sample_type
      - clinical_history
      - inheritance_pattern
      - variants_detected
      - variant_classification
      - zygosity
      - pathogenic_variant_found
      - vus_found
      - carrier_status_positive
      - secondary_finding
      - no_clinically_significant_variant
      - interpretation
      - impression
      - reporting_category
      - recommended_cascade_testing
      - recommended_follow_up
      - critical_result_communicated
      - reported_to
      description: Genetic / genomic test result (report). Captures the performed test, the genes tested
        and sample type, clinical history and inheritance pattern, the detected variants and their ACMG/AMP-ACGS
        classification and zygosity, structured finding booleans, the interpretation and impression, the
        ACMG reporting category, recommended cascade testing and follow-up, and critical-result communication.
        This is the source-of-truth record that the four-axis interpretation grade is computed from.
    GeneticTestResultGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        genetic_test_result_id:
          type: string
          format: uuid
          description: Foreign key to the parent result (unique, 1:1).
        result_classification:
          type: string
          enum:
          - normal
          - abnormal
          - critical
          - inconclusive
          - ''
          description: 'Axis A overall classification: normal, abnormal, critical, inconclusive.'
        abnormality_severity:
          type: string
          enum:
          - none
          - minor
          - moderate
          - major
          - ''
          description: 'Axis B abnormality severity: none, minor, moderate, major.'
        reporting_category:
          type: string
          maxLength: 50
          description: Axis B structured-reporting score / category label (e.g. an ACMG/AMP variant class).
        report_completeness_percent:
          type: integer
          format: int32
          description: Axis C report completeness as a percentage of mandatory report sections (0-100).
        follow_up_urgency:
          type: string
          enum:
          - routine
          - recommended
          - urgent
          - critical-alert
          - ''
          description: 'Axis D follow-up urgency: routine, recommended, urgent, critical-alert.'
        target_timeframe:
          type: string
          maxLength: 50
          description: Target timeframe for the recommended follow-up implied by the urgency.
        recommended_action:
          type: string
          maxLength: 500
          description: Axis D concise recommended action derived from the urgency.
        recommendation:
          type: string
          enum:
          - no-action
          - routine-follow-up
          - further-imaging
          - specialist-referral
          - urgent-review
          - ''
          description: 'Overall recommendation: no-action, routine-follow-up, further-imaging, specialist-referral,
            urgent-review.'
        clinician_notes:
          type: string
          description: Free-text interpretation / sign-off notes.
        signed_at:
          type: string
          format: date-time
          description: Timestamp of the reporting clinician electronic signature.
        graded_at:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the result.
      required:
      - created_at
      - updated_at
      - genetic_test_result_id
      - result_classification
      - abnormality_severity
      - reporting_category
      - follow_up_urgency
      - target_timeframe
      - recommended_action
      - recommendation
      - clinician_notes
      - graded_at
      description: 'Computed four-axis interpretation grade: result classification, abnormality severity
        / structured-reporting category, report completeness, and follow-up urgency. A pathogenic / likely-pathogenic
        actionable variant auto-escalates the result classification toward abnormal or critical and the
        follow-up urgency toward urgent / critical-alert regardless of the other axes.'
    GeneticTestResultGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        genetic_test_result_grade_id:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        flag_id:
          type: string
          maxLength: 50
          description: Stable flag identifier (e.g. F-PATHOGENIC-VARIANT-001).
        category:
          type: string
          enum:
          - critical-result-alert
          - pathogenic-variant-found
          - secondary-finding
          - variant-uncertain-significance
