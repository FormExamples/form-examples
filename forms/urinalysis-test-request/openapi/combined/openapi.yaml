components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Name.
        email:
          type: string
          description: Email address.
        phone:
          type: string
          description: Phone number.
        postal_address_as_full_text:
          type: string
          description: Postal address as full text.
        country_as_iso_3166_1_alpha_2:
          type: string
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type: string
          description: Postal code, such as for validating the postal address.
        role:
          type: string
          enum:
          - gp
          - hospital-doctor
          - nurse
          - urologist
          - other
          - ''
          description: 'Clinician role: gp, hospital-doctor, nurse, urologist, other.'
        registration_body:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - other
          - ''
          description: 'Clinician registration body: GMC, NMC, HCPC, other.'
        registration_number:
          type: string
          description: Clinician registration number.
        united_kingdom_nhs_number:
          type: string
          maxLength: 12
          description: United Kingdom NHS number, unique per person.
      required:
      - created_at
      - updated_at
      - name
      - role
      - registration_body
      - registration_number
      description: Requesting clinician (referrer) who completes the urinalysis test request.
    Patient:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          maxLength: 255
          description: Name.
        birth_date:
          type: string
          format: date
          description: Birth date.
        email:
          type: string
          description: Email address.
        phone:
          type: string
          description: Phone number.
        postal_address_as_full_text:
          type: string
          description: Postal address as full text.
        country_as_iso_3166_1_alpha_2:
          type: string
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type: string
          description: Postal code, such as for validating the postal address.
        united_kingdom_nhs_number:
          type: string
          maxLength: 20
          description: United Kingdom NHS number, unique per person.
        waist_as_cm:
          type: number
          format: double
          description: Waist circumference measurement in cm, such as for calculating waist-height ratio
            (WHR).
        height_as_cm:
          type: number
          format: double
          description: Height measurement in cm, such as for calculating waist-height ratio (WHR).
        weight_as_kg:
          type: number
          format: double
          description: Weight as kg.
        body_mass_index:
          type: number
          format: double
          description: Body mass index (BMI) measurement.
        waist_height_ratio:
          type: number
          format: double
          description: Waist-height ratio (WHR) measurement.
        vo2_max:
          type: number
          format: double
          description: VO2 max measurement.
      required:
      - created_at
      - updated_at
      - name
      - birth_date
      description: Patient
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          description: A URI identifying the problem type
        title:
          type: string
          description: A short summary of the problem type
        status:
          type: integer
          description: The HTTP status code
        detail:
          type: string
          description: An explanation of this occurrence
        instance:
          type: string
          description: A URI identifying this occurrence
        code:
          type: string
          description: A short machine-readable reason
        errors:
          type: object
          description: Per-field detail, when validation failed
      required:
      - type
      - title
      - status
    UrinalysisTestRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patient_id:
          type: string
          format: uuid
          description: Foreign key to the patient.
        clinician_id:
          type: string
          format: uuid
          description: Foreign key to the requesting clinician (referrer).
        status:
          type: string
          enum:
          - draft
          - submitted
          - vetted
          - scheduled
          - rejected
          - ''
          description: 'Request lifecycle status: draft, submitted, vetted, scheduled, rejected.'
        site_name:
          type: string
          maxLength: 255
          description: Name of the requesting site or clinic.
        setting:
          type: string
          enum:
          - outpatient
          - inpatient
          - community
          - emergency
          - ''
          description: 'Care setting: outpatient, inpatient, community, emergency.'
        referral_date:
          type: string
          format: date
          description: Date the request was made.
        dipstick:
          type: boolean
          description: 'Requested test: urine dipstick (reagent strip) for leucocytes, nitrites, blood,
            protein, glucose.'
        microscopy_culture_sensitivity:
          type: boolean
          description: 'Requested test: microscopy, culture and sensitivity (MC&S) for confirmed / complicated
            UTI.'
        albumin_creatinine_ratio:
          type: boolean
          description: 'Requested test: urine albumin-to-creatinine ratio (ACR) for albuminuria / CKD
            / diabetes monitoring.'
        protein_creatinine_ratio:
          type: boolean
          description: 'Requested test: urine protein-to-creatinine ratio (PCR) for proteinuria quantification.'
        pregnancy_test:
          type: boolean
          description: 'Requested test: urine pregnancy test (hCG).'
        drug_screen:
          type: boolean
          description: 'Requested test: urine drug screen / toxicology.'
        cytology:
          type: boolean
          description: 'Requested test: urine cytology for suspected urothelial malignancy.'
        twenty_four_hour_collection:
          type: boolean
          description: 'Requested test: 24-hour urine collection (e.g. protein, creatinine clearance,
            metanephrines).'
        primary_indication:
          type: string
          enum:
          - suspected-uti
          - haematuria
          - proteinuria
          - diabetes-monitoring
          - renal-monitoring
          - pregnancy-screen
          - pre-operative
          - catheter-related
          - suspected-malignancy
          - drug-monitoring
          - other
          - ''
          description: 'Primary clinical indication, used for appropriateness scoring: suspected-uti,
            haematuria, proteinuria, diabetes-monitoring, renal-monitoring, pregnancy-screen, pre-operative,
            catheter-related, suspected-malignancy, drug-monitoring, other.'
        clinical_details:
          type: string
          maxLength: 1000
          description: Relevant clinical details and history supporting the request (highest-value field).
        symptom_dysuria:
          type: boolean
          description: Whether the patient reports dysuria (painful urination).
        symptom_frequency:
          type: boolean
          description: Whether the patient reports urinary frequency / urgency.
        symptom_visible_haematuria:
          type: boolean
          description: Whether the patient reports visible (macroscopic) haematuria (red flag).
        symptom_loin_pain:
          type: boolean
          description: Whether the patient reports loin / flank pain (possible upper-tract involvement).
        symptom_fever:
          type: boolean
          description: Whether the patient reports fever / systemic symptoms (possible pyelonephritis
            / urosepsis).
        specimen_type:
          type: string
          enum:
          - midstream
          - catheter
          - clean-catch
          - 24h
          - random
          - ''
          description: 'Specimen type: midstream (MSU), catheter (CSU), clean-catch, 24h, random.'
        specimen_collected:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Whether the specimen has already been collected: yes, no.'
        collection_datetime:
          type: string
          format: date-time
          description: Date and time the specimen was collected (preanalytical timing).
        pregnant:
          type: boolean
          description: Whether the patient is pregnant (alters UTI MSU / culture pathway).
        catheterised:
          type: boolean
          description: Whether the patient is catheterised (CSU; asymptomatic bacteriuria caveats).
        current_antibiotics:
          type: boolean
          description: Whether the patient is currently taking antibiotics (may suppress culture growth).
        urgency:
          type: string
          enum:
          - routine
          - urgent
          - stat
          - ''
          description: 'Requested triage urgency: routine, urgent, stat.'
        supervising_consultant:
          type: string
          maxLength: 255
          description: Name of the supervising / responsible consultant.
        requester_contact:
          type: string
          maxLength: 255
          description: Contact details (bleep / phone) for the requester.
        notes:
          type: string
          maxLength: 1000
          description: Free-text additional notes.
      required:
      - created_at
      - updated_at
      - patient_id
      - clinician_id
      - status
      - site_name
      - setting
      - dipstick
      - microscopy_culture_sensitivity
      - albumin_creatinine_ratio
      - protein_creatinine_ratio
      - pregnancy_test
      - drug_screen
      - cytology
      - twenty_four_hour_collection
      - primary_indication
      - clinical_details
      - symptom_dysuria
      - symptom_frequency
      - symptom_visible_haematuria
      - symptom_loin_pain
      - symptom_fever
      - specimen_type
      - specimen_collected
      - pregnant
      - catheterised
      - current_antibiotics
      - urgency
      - supervising_consultant
      - requester_contact
      - notes
      description: Urinalysis (urine pathology) test request (order). Captures the requested urine test
        panel, the clinical indication and details, symptoms / red flags, specimen preanalytical data,
        modifiers, and triage urgency.
    UrinalysisTestRequestGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        urinalysis_test_request_id:
          type: string
          format: uuid
          description: Foreign key to the parent request (unique, 1:1).
        appropriateness_score:
          type: integer
          format: int32
          description: Appropriateness score (1-9) anchored on indication-to-test match and guideline
            appropriateness (no single published urinalysis score exists).
        appropriateness_band:
          type: string
          enum:
          - usually-appropriate
          - may-be-appropriate
          - usually-not-appropriate
          - ''
          description: 'Appropriateness band: usually-appropriate (7-9), may-be-appropriate (4-6), usually-not-appropriate
            (1-3).'
        preanalytical_band:
          type: string
          enum:
          - ok
          - caution
          - reject-risk
          - ''
          description: 'Preanalytical specimen-suitability band: ok, caution, reject-risk (driven by specimen
            type / collected / timing / contamination risk per UK SMI B41).'
        fasting_or_specimen:
          type: string
          maxLength: 500
          description: Specimen / preanalytical advisory note (e.g. "MSU not yet collected; refrigerate
            or use boric acid if >4 h to lab").
        completeness_percent:
          type: integer
          format: int32
          description: Request completeness as a percentage of mandatory fields, clinical details and
            indication weighted highest (0-100).
        triage_tier:
          type: string
          enum:
          - routine
          - urgent
          - stat
          - ''
          description: 'Assigned triage tier: routine, urgent, stat.'
        target_timeframe:
          type: string
          maxLength: 50
          description: Target timeframe for the test implied by the triage tier.
        recommendation:
          type: string
          enum:
          - accept
          - query-referrer
          - redirect
          - reject
          - ''
          description: 'Vetting recommendation: accept, query-referrer, redirect, reject.'
        clinician_notes:
          type: string
          description: Free-text vetting notes.
        signed_at:
          type: string
          format: date-time
          description: Timestamp of vetting clinician electronic signature.
        graded_at:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the result.
      required:
      - created_at
      - updated_at
      - urinalysis_test_request_id
      - appropriateness_band
      - preanalytical_band
      - fasting_or_specimen
      - triage_tier
      - target_timeframe
      - recommendation
      - clinician_notes
      - graded_at
      description: 'Computed four-axis grading result: appropriateness (indication match / NICE UTI, 1-9),
        preanalytical specimen suitability, request completeness, and triage priority.'
    UrinalysisTestRequestGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        urinalysis_test_request_grade_id:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        flag_id:
          type: string
          maxLength: 50
          description: Stable flag identifier (e.g. F-VISIBLE-HAEMATURIA-2WW-001).
        category:
          type: string
          enum:
          - visible-haematuria-2ww
          - suspected-pyelonephritis
          - specimen-not-collected
          - missing-clinical-details
          - missing-indication
          - no-test-selected
          - other
          - ''
          description: 'Flag category: visible-haematuria-2ww, suspected-pyelonephritis, specimen-not-collected,
            missing-clinical-details, missing-indication, no-test-selected, other.'
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          - ''
          description: 'Priority: low, medium, high.'
        description:
          type: string
          maxLength: 500
          description: Human-readable description of what fired the flag.
        suggested_action:
          type: string
          maxLength: 500
          description: Suggested clinical action (e.g. "consider NICE NG12 suspected-cancer (2WW) referral").
      required:
      - created_at
      - updated_at
      - urinalysis_test_request_grade_id
      - flag_id
      - category
      - priority
      - description
      - suggested_action
      description: Safety-critical flags that fire independently of the four axes, with priority and a
        suggested action for the pathology / vetting team.
    UrinalysisTestRequestGradeRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        urinalysis_test_request_grade_id:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        rule_id:
          type: string
          maxLength: 40
          description: Stable rule identifier (e.g. R-APPROP-UTI-01).
        axis:
          type: string
          enum:
          - appropriateness
          - preanalytical
          - completeness
          - triage
          - ''
          description: 'Scoring axis the rule belongs to: appropriateness, preanalytical, completeness,
            triage.'
        category:
          type: string
          maxLength: 50
          description: Category or indication the rule relates to.
        description:
          type: string
          maxLength: 500
          description: Human-readable description of why the rule fired.
      required:
      - created_at
      - updated_at
      - urinalysis_test_request_grade_id
      - rule_id
      - axis
      - category
      - description
      description: Audit trail of every appropriateness / preanalytical / completeness / triage rule that
        fired for this request.
