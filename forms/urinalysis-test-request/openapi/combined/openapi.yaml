components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Name.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as full text.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code, such as for validating the postal address.
        role:
          type: string
          enum:
          - gp
          - hospital-doctor
          - nurse
          - urologist
          - other
          - ''
          description: 'Clinician role: gp, hospital-doctor, nurse, urologist, other.'
        registrationBody:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - other
          - ''
          description: 'Clinician registration body: GMC, NMC, HCPC, other.'
        registrationNumber:
          type: string
          description: Clinician registration number.
        unitedKingdomNhsNumber:
          type:
          - string
          - 'null'
          maxLength: 12
          description: United Kingdom NHS number, unique per person.
      required:
      - createdAt
      - updatedAt
      - name
      - role
      - registrationBody
      - registrationNumber
      description: Requesting clinician (referrer) who completes the urinalysis test request.
    Patient:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          maxLength: 255
          description: Name.
        birthDate:
          type: string
          format: date
          description: Birth date.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as full text.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code, such as for validating the postal address.
        unitedKingdomNhsNumber:
          type:
          - string
          - 'null'
          maxLength: 20
          description: United Kingdom NHS number, unique per person.
        waistAsCm:
          type:
          - number
          - 'null'
          format: double
          description: Waist circumference measurement in cm, such as for calculating waist-height ratio
            (WHR).
        heightAsCm:
          type:
          - number
          - 'null'
          format: double
          description: Height measurement in cm, such as for calculating waist-height ratio (WHR).
        weightAsKg:
          type:
          - number
          - 'null'
          format: double
          description: Weight as kg.
        bodyMassIndex:
          type:
          - number
          - 'null'
          format: double
          description: Body mass index (BMI) measurement.
        waistHeightRatio:
          type:
          - number
          - 'null'
          format: double
          description: Waist-height ratio (WHR) measurement.
        vo2Max:
          type:
          - number
          - 'null'
          format: double
          description: VO2 max measurement.
      required:
      - createdAt
      - updatedAt
      - name
      - birthDate
      description: Patient
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          description: A URI identifying the problem type
        title:
          type: string
          description: A short summary of the problem type
        status:
          type: integer
          description: The HTTP status code
        detail:
          type: string
          description: An explanation of this occurrence
        instance:
          type: string
          description: A URI identifying this occurrence
        code:
          type: string
          description: A short machine-readable reason
        errors:
          type: object
          description: Per-field detail, when validation failed
      required:
      - type
      - title
      - status
    UrinalysisTestRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the patient.
        clinicianId:
          type: string
          format: uuid
          description: Foreign key to the requesting clinician (referrer).
        status:
          type: string
          enum:
          - draft
          - submitted
          - vetted
          - scheduled
          - rejected
          - ''
          description: 'Request lifecycle status: draft, submitted, vetted, scheduled, rejected.'
        siteName:
          type: string
          maxLength: 255
          description: Name of the requesting site or clinic.
        setting:
          type: string
          enum:
          - outpatient
          - inpatient
          - community
          - emergency
          - ''
          description: 'Care setting: outpatient, inpatient, community, emergency.'
        referralDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the request was made.
        dipstick:
          type: boolean
          description: 'Requested test: urine dipstick (reagent strip) for leucocytes, nitrites, blood,
            protein, glucose.'
        microscopyCultureSensitivity:
          type: boolean
          description: 'Requested test: microscopy, culture and sensitivity (MC&S) for confirmed / complicated
            UTI.'
        albuminCreatinineRatio:
          type: boolean
          description: 'Requested test: urine albumin-to-creatinine ratio (ACR) for albuminuria / CKD
            / diabetes monitoring.'
        proteinCreatinineRatio:
          type: boolean
          description: 'Requested test: urine protein-to-creatinine ratio (PCR) for proteinuria quantification.'
        pregnancyTest:
          type: boolean
          description: 'Requested test: urine pregnancy test (hCG).'
        drugScreen:
          type: boolean
          description: 'Requested test: urine drug screen / toxicology.'
        cytology:
          type: boolean
          description: 'Requested test: urine cytology for suspected urothelial malignancy.'
        twentyFourHourCollection:
          type: boolean
          description: 'Requested test: 24-hour urine collection (e.g. protein, creatinine clearance,
            metanephrines).'
        primaryIndication:
          type: string
          enum:
          - suspected-uti
          - haematuria
          - proteinuria
          - diabetes-monitoring
          - renal-monitoring
          - pregnancy-screen
          - pre-operative
          - catheter-related
          - suspected-malignancy
          - drug-monitoring
          - other
          - ''
          description: 'Primary clinical indication, used for appropriateness scoring: suspected-uti,
            haematuria, proteinuria, diabetes-monitoring, renal-monitoring, pregnancy-screen, pre-operative,
            catheter-related, suspected-malignancy, drug-monitoring, other.'
        clinicalDetails:
          type: string
          maxLength: 1000
          description: Relevant clinical details and history supporting the request (highest-value field).
        symptomDysuria:
          type: boolean
          description: Whether the patient reports dysuria (painful urination).
        symptomFrequency:
          type: boolean
          description: Whether the patient reports urinary frequency / urgency.
        symptomVisibleHaematuria:
          type: boolean
          description: Whether the patient reports visible (macroscopic) haematuria (red flag).
        symptomLoinPain:
          type: boolean
          description: Whether the patient reports loin / flank pain (possible upper-tract involvement).
        symptomFever:
          type: boolean
          description: Whether the patient reports fever / systemic symptoms (possible pyelonephritis
            / urosepsis).
        specimenType:
          type: string
          enum:
          - midstream
          - catheter
          - clean-catch
          - 24h
          - random
          - ''
          description: 'Specimen type: midstream (MSU), catheter (CSU), clean-catch, 24h, random.'
        specimenCollected:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Whether the specimen has already been collected: yes, no.'
        collectionDatetime:
          type:
          - string
          - 'null'
          format: date-time
          description: Date and time the specimen was collected (preanalytical timing).
        pregnant:
          type: boolean
          description: Whether the patient is pregnant (alters UTI MSU / culture pathway).
        catheterised:
          type: boolean
          description: Whether the patient is catheterised (CSU; asymptomatic bacteriuria caveats).
        currentAntibiotics:
          type: boolean
          description: Whether the patient is currently taking antibiotics (may suppress culture growth).
        urgency:
          type: string
          enum:
          - routine
          - urgent
          - stat
          - ''
          description: 'Requested triage urgency: routine, urgent, stat.'
        supervisingConsultant:
          type: string
          maxLength: 255
          description: Name of the supervising / responsible consultant.
        requesterContact:
          type: string
          maxLength: 255
          description: Contact details (bleep / phone) for the requester.
        notes:
          type: string
          maxLength: 1000
          description: Free-text additional notes.
      required:
      - createdAt
      - updatedAt
      - patientId
      - clinicianId
      - status
      - siteName
      - setting
      - dipstick
      - microscopyCultureSensitivity
      - albuminCreatinineRatio
      - proteinCreatinineRatio
      - pregnancyTest
      - drugScreen
      - cytology
      - twentyFourHourCollection
      - primaryIndication
      - clinicalDetails
      - symptomDysuria
      - symptomFrequency
      - symptomVisibleHaematuria
      - symptomLoinPain
      - symptomFever
      - specimenType
      - specimenCollected
      - pregnant
      - catheterised
      - currentAntibiotics
      - urgency
      - supervisingConsultant
      - requesterContact
      - notes
      description: Urinalysis (urine pathology) test request (order). Captures the requested urine test
        panel, the clinical indication and details, symptoms / red flags, specimen preanalytical data,
        modifiers, and triage urgency.
    UrinalysisTestRequestGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        urinalysisTestRequestId:
          type: string
          format: uuid
          description: Foreign key to the parent request (unique, 1:1).
        appropriatenessScore:
          type:
          - integer
          - 'null'
          format: int32
          description: Appropriateness score (1-9) anchored on indication-to-test match and guideline
            appropriateness (no single published urinalysis score exists).
        appropriatenessBand:
          type: string
          enum:
          - usually-appropriate
          - may-be-appropriate
          - usually-not-appropriate
          - ''
