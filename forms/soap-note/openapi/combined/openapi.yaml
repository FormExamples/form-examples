components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        name:
          type: string
          description: Clinician full name as recorded in the rota.
        email:
          type: string
          description: Email address.
        phone:
          type: string
          description: Phone number.
        postal_address_as_full_text:
          type: string
          description: Postal address as a single text block.
        country_as_iso_3166_1_alpha_2:
          type: string
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2.
        postcode:
          type: string
          description: Postal code.
        role:
          type: string
          enum:
          - doctor
          - nurse
          - paramedic
          - pharmacist
          - allied-health
          - other
          - ''
          description: 'Primary clinical role: doctor, nurse, paramedic, pharmacist, allied-health, or
            other.'
        registration_body:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - GPhC
          - other
          - ''
          description: 'Professional registration body: GMC, NMC, HCPC, GPhC, or other.'
        registration_number:
          type: string
          description: Professional registration number issued by the registration body.
      required:
      - created_at
      - updated_at
      - name
      - role
      - registration_body
      - registration_number
      description: Clinician identifying information for the authoring and co-signing clinicians on a
        SOAP note.
    Patient:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        name:
          type: string
          maxLength: 255
          description: Full patient name.
        birth_date:
          type: string
          format: date
          description: Date of birth.
        sex:
          type: string
          enum:
          - female
          - male
          - intersex
          - unknown
          - ''
          description: 'Sex recorded for clinical purposes: female, male, intersex, or unknown.'
        email:
          type: string
          description: Email address.
        phone:
          type: string
          description: Phone number.
        postal_address_as_full_text:
          type: string
          description: Postal address as a single text block.
        country_as_iso_3166_1_alpha_2:
          type: string
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2.
        postcode:
          type: string
          description: Postal code.
        united_kingdom_nhs_number:
          type: string
          maxLength: 20
          description: United Kingdom NHS number, unique per person.
        hospital_mrn:
          type: string
          maxLength: 50
          description: Local hospital medical record number (MRN).
        height_as_cm:
          type: number
          format: double
          description: Height in centimetres.
        weight_as_kg:
          type: number
          format: double
          description: Weight in kilograms.
        body_mass_index:
          type: number
          format: double
          description: Body mass index (BMI), kg/m^2.
        allergies_summary:
          type: string
          description: Free-text summary of known allergies.
      required:
      - created_at
      - updated_at
      - name
      - birth_date
      - sex
      - allergies_summary
      description: Patient demographic information used by the SOAP-note record.
    SoapNote:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        patient_id:
          type: string
          format: uuid
          description: Foreign key to the patient this note documents (restrict delete).
        clinician_id:
          type: string
          format: uuid
          description: Foreign key to the authoring clinician (restrict delete); optional.
        encountered_at:
          type: string
          format: date-time
          description: Date and time of the patient encounter.
        care_setting:
          type: string
          enum:
          - general-practice
          - outpatient
          - ward
          - emergency-department
          - community
          - telehealth
          - other
          - ''
          description: 'Care setting: general-practice, outpatient, ward, emergency-department, community,
            telehealth, or other.'
        encounter_type:
          type: string
          enum:
          - new-problem
          - follow-up
          - review
          - other
          - ''
          description: 'Encounter type: new-problem, follow-up, review, or other.'
        clinician_role:
          type: string
          enum:
          - doctor
          - nurse
          - paramedic
          - pharmacist
          - allied-health
          - other
          - ''
          description: 'Authoring clinician role: doctor, nurse, paramedic, pharmacist, allied-health,
            or other.'
        patient_identifier:
          type: string
          maxLength: 100
          description: Local patient or encounter identifier as recorded on the note.
        presenting_complaint:
          type: string
          description: 'Subjective: the presenting complaint (required component).'
        history_of_presenting_complaint:
          type: string
          description: 'Subjective: the history of the presenting complaint (required component).'
        patient_reported_symptoms:
          type: string
          description: 'Subjective: patient-reported symptoms (optional).'
        relevant_history:
          type: string
          description: 'Subjective: relevant past history, medication, and allergies (optional).'
        red_flag_symptoms:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether red-flag symptoms are present (yes/no); yes makes safety-netting a required
            component.
        examination_findings:
          type: string
          description: 'Objective: examination findings; satisfies the Objective section when non-empty.'
        vital_signs:
          type: string
          description: 'Objective: recorded vital signs; satisfies the Objective section when non-empty.'
        abnormal_vitals_present:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether abnormal vital signs are present (yes/no); drives the abnormal-vitals-not-addressed
            flag.
        investigation_results:
          type: string
          description: 'Objective: investigation or test results; satisfies the Objective section when
            non-empty.'
        primary_diagnosis:
          type: string
          description: 'Assessment: the primary diagnosis or problem (required component).'
        problem_list:
          type: string
          description: 'Assessment: the problem list (optional).'
        differential:
          type: string
          description: 'Assessment: differential diagnoses (optional).'
        clinical_impression:
          type: string
          description: 'Assessment: overall clinical impression (optional).'
        investigations_plan:
          type: string
          description: 'Plan: investigations planned.'
        treatment_plan:
          type: string
          description: 'Plan: treatment plan.'
        referrals:
          type: string
          description: 'Plan: referrals made or requested.'
        follow_up:
          type: string
          description: 'Plan: follow-up arrangement; satisfies the conditional follow-up requirement.'
        safety_netting:
          type: string
          description: 'Plan: safety-netting advice; a required component when red-flag symptoms are present
            or the patient is managed at home.'
        managed_at_home:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the patient is managed at home (yes/no); yes makes safety-netting a required
            component.
        clinical_note:
          type: string
          description: Optional free-text narrative shown in the summary.
      required:
      - created_at
      - updated_at
      - patient_id
      - care_setting
      - encounter_type
      - clinician_role
      - patient_identifier
      - presenting_complaint
      - history_of_presenting_complaint
      - patient_reported_symptoms
      - relevant_history
      - red_flag_symptoms
      - examination_findings
      - vital_signs
      - abnormal_vitals_present
      - investigation_results
      - primary_diagnosis
      - problem_list
      - differential
      - clinical_impression
      - investigations_plan
      - treatment_plan
      - referrals
      - follow_up
      - safety_netting
      - managed_at_home
      - clinical_note
      description: 'Main SOAP-note record for one patient encounter: encounter context, patient and clinician
        identification, and the four SOAP sections (Subjective, Objective, Assessment, Plan) as free text.
        Completeness grade, fired rules, and flags live in child tables.'
    SoapNoteGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the row was soft-deleted.
        soap_note_id:
          type: string
          format: uuid
          description: Foreign key to the parent SOAP note (unique, 1:1).
        status:
          type: string
          enum:
          - complete
          - partial
          - incomplete
          - ''
          description: 'Completeness status: complete, partial, or incomplete.'
        completeness_percent:
          type: integer
          format: int32
          description: 'Completeness percentage (0..100): present required components / total required
            components x 100.'
        subjective_present:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the Subjective section is present (yes/no).
        objective_present:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the Objective section is present (yes/no).
        assessment_present:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the Assessment section is present (yes/no).
        plan_present:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the Plan section is present (yes/no).
        graded_at:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the grade.
      required:
      - created_at
      - updated_at
      - soap_note_id
      - status
      - subjective_present
      - objective_present
      - assessment_present
      - plan_present
      - graded_at
      description: 'Computed documentation-completeness grading result for a SOAP note: status (complete/partial/incomplete),
        completeness percentage, and per-section presence flags.'
    SoapNoteGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the row was soft-deleted.
        soap_note_grade_id:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        flag_id:
          type: string
          maxLength: 50
          description: Stable flag identifier (e.g. F-MISSING-ASSESSMENT-001).
        category:
          type: string
          enum:
