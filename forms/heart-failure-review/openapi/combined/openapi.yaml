      description: 'Main heart-failure annual-review record (NICE NG106): patient and clinician identification,
        review context, diagnosis and subtype, functional status (NYHA), fluid balance and observations,
        monitoring bloods, the four pillars of guideline-directed medical therapy plus loop diuretic and
        other medications, devices, vaccinations, and self-management. The computed functional status,
        medication-optimisation status, completeness grade, fired rules, and flags live in child tables.'
    HeartFailureReviewGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the row was soft-deleted.
        heart_failure_review_id:
          type: string
          format: uuid
          description: Foreign key to the parent heart-failure review (unique, 1:1).
        nyha_status:
          type: string
          enum:
          - stable
          - symptomatic
          - advanced
          - unknown
          - ''
          description: 'NYHA functional status: stable (NYHA I-II), symptomatic (NYHA III), advanced (NYHA
            IV), or unknown (class not recorded).'
        medication_optimisation_status:
          type: string
          enum:
          - optimised
          - partial
          - suboptimal
          - not-applicable
          - ''
          description: 'Medication-optimisation status against the indicated pillar set: optimised, partial,
            suboptimal, or not-applicable.'
        review_status:
          type: string
          enum:
          - complete
          - partial
          - incomplete
          - ''
          description: 'Review completeness: complete, partial, or incomplete.'
        indicated_pillars:
          type: integer
          format: int32
          description: Count of medication pillars indicated for this heart-failure subtype (4 for HFrEF,
            1 for HFmrEF/HFpEF, 0 for unknown).
        prescribed_pillars:
          type: integer
          format: int32
          description: Count of indicated pillars whose status is prescribed.
        missing_pillars:
          type: string
          maxLength: 200
          description: Comma-separated list of indicated pillars documented as not-prescribed without
            a contraindication.
        completeness_score:
          type: integer
          format: int32
          description: Review-completeness score 0-100 (round of 100 * documented domains / 6).
        graded_at:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the grade.
      required:
      - created_at
      - updated_at
      - heart_failure_review_id
      - nyha_status
      - medication_optimisation_status
      - review_status
      - missing_pillars
      - graded_at
      description: 'Computed classification and completeness grading result for a heart-failure annual
        review: NYHA functional status, medication-optimisation status against the indicated pillar set,
        review-completeness status and score, and the indicated / prescribed / missing pillar breakdown.
        1:1 with the parent review.'
