components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Clinician full name as recorded in the rota.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as a single text block.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code.
        role:
          type: string
          enum:
          - gp
          - practice-nurse
          - hf-nurse
          - pharmacist
          - cardiologist
          - other
          - ''
          description: 'Primary clinical role of the reviewer: gp, practice-nurse, hf-nurse (heart-failure
            specialist nurse), pharmacist, cardiologist, or other.'
        registrationBody:
          type: string
          enum:
          - GMC
          - NMC
          - GPhC
          - other
          - ''
          description: 'Professional registration body: GMC, NMC, GPhC, or other.'
        registrationNumber:
          type: string
          description: Professional registration number issued by the registration body.
      required:
      - createdAt
      - updatedAt
      - name
      - role
      - registrationBody
      - registrationNumber
      description: Clinician identifying information for the clinician who conducted the heart-failure
        annual review.
    HeartFailureReview:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the patient this review documents (restrict delete).
        clinicianId:
          type:
          - string
          - 'null'
          format: uuid
          description: Foreign key to the reviewing clinician (restrict delete); optional.
        clinicianName:
          type: string
          maxLength: 255
          description: Name of the reviewing clinician as recorded on the review.
        clinicianRole:
          type: string
          enum:
          - gp
          - practice-nurse
          - hf-nurse
          - pharmacist
          - cardiologist
          - other
          - ''
          description: 'Reviewing clinician role: gp, practice-nurse, hf-nurse, pharmacist, cardiologist,
            or other.'
        reviewDate:
          type:
          - string
          - 'null'
          format: date
          description: Date this annual review was conducted.
        careSetting:
          type: string
          enum:
          - general-practice
          - community-hf-service
          - hospital-clinic
          - other
          - ''
          description: 'Care setting of the review: general-practice, community-hf-service, hospital-clinic,
            or other.'
        reviewType:
          type: string
          enum:
          - routine-annual
          - post-discharge
          - medication-titration
          - ''
          description: 'Type of review: routine-annual, post-discharge, or medication-titration.'
        lastReviewDate:
          type:
          - string
          - 'null'
          format: date
          description: Date of the previous review, used to assess change over time.
        patientIdentifier:
          type: string
          maxLength: 100
          description: NHS number or local patient identifier as recorded on the review.
        ageBand:
          type: string
          enum:
          - 18-39
          - 40-59
          - 60-79
          - '>=80'
          - ''
          description: 'Adult age band: 18-39, 40-59, 60-79, or >=80.'
        sex:
          type: string
          enum:
          - female
          - male
          - intersex
          - unknown
          - ''
          description: 'Patient sex: female, male, intersex, or unknown.'
        yearOfDiagnosis:
          type:
          - integer
          - 'null'
          format: int32
          description: Calendar year the heart failure was diagnosed.
        heartFailureType:
          type: string
          enum:
          - reduced
          - mildly-reduced
          - preserved
          - unknown
          - ''
          description: 'Heart-failure subtype by ejection fraction: reduced (HFrEF), mildly-reduced (HFmrEF),
            preserved (HFpEF), or unknown. Drives the indicated medication-pillar set.'
        latestLvef:
          type:
          - number
          - 'null'
          format: double
          description: Most recent left-ventricular ejection fraction as a percentage.
        lastEchoDate:
          type:
          - string
          - 'null'
          format: date
          description: Date of the last echocardiogram.
        aetiology:
          type: string
          enum:
          - ischaemic
          - hypertensive
          - valvular
          - other
          - unknown
          - ''
          description: 'Underlying aetiology: ischaemic, hypertensive, valvular, other, or unknown.'
        nyhaClass:
          type:
          - integer
          - 'null'
          format: int32
          description: New York Heart Association functional class 1-4 (null if not assessed); drives
            the functional-status classification.
        breathlessness:
          type: string
          enum:
          - none
          - on-exertion
          - at-rest
          - ''
          description: 'Breathlessness severity: none, on-exertion, or at-rest.'
        orthopnoea:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether orthopnoea is present (yes/no).
        paroxysmalNocturnalDyspnoea:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether paroxysmal nocturnal dyspnoea is present (yes/no).
        fatigue:
          type: string
          enum:
          - none
          - mild
          - moderate
          - severe
          - ''
          description: 'Fatigue severity: none, mild, moderate, or severe.'
        changeSinceLastReview:
          type: string
          enum:
          - improved
          - unchanged
          - worse
          - ''
          description: 'Overall change in symptoms since the last review: improved, unchanged, or worse.'
        decompensation:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether a documented decompensation has occurred since the last review (yes/no).
        weightKg:
          type:
          - number
          - 'null'
          format: double
          description: Current body weight in kilograms.
        weightChangeKg:
          type:
          - number
          - 'null'
          format: double
          description: Change in weight in kilograms since the last review (positive = gain).
        peripheralOedema:
          type: string
          enum:
          - none
          - mild
          - moderate
          - severe
          - ''
          description: 'Peripheral oedema severity: none, mild, moderate, or severe.'
        raisedJvp:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the jugular venous pressure is raised (yes/no).
        lungCrackles:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether pulmonary crackles are present on auscultation (yes/no).
        systolicBloodPressure:
          type:
          - integer
          - 'null'
          format: int32
          description: Systolic blood pressure in mmHg.
        diastolicBloodPressure:
          type:
          - integer
          - 'null'
          format: int32
          description: Diastolic blood pressure in mmHg.
        heartRate:
          type:
          - integer
          - 'null'
          format: int32
          description: Heart rate in beats per minute.
        heartRhythm:
          type: string
          enum:
          - sinus
          - atrial-fibrillation
          - paced
          - other
          - ''
          description: 'Heart rhythm: sinus, atrial-fibrillation, paced, or other.'
        ntProBnp:
          type:
          - number
          - 'null'
          format: double
          description: NT-proBNP natriuretic peptide in ng/L.
        sodium:
          type:
          - number
          - 'null'
          format: double
          description: Serum sodium in mmol/L (U&E).
        potassium:
          type:
          - number
          - 'null'
          format: double
          description: Serum potassium in mmol/L (U&E); RAAS-inhibitor / MRA monitoring value.
        urea:
          type:
          - number
          - 'null'
          format: double
          description: Serum urea in mmol/L (U&E).
        creatinine:
          type:
          - number
          - 'null'
          format: double
          description: Serum creatinine in micromol/L (U&E).
        egfr:
          type:
          - number
          - 'null'
          format: double
          description: Estimated glomerular filtration rate in mL/min/1.73m^2; RAAS-inhibitor / MRA safety
            value.
        haemoglobin:
          type:
          - number
          - 'null'
          format: double
          description: Haemoglobin in g/L.
        ferritin:
          type:
          - number
          - 'null'
          format: double
          description: Serum ferritin in micrograms/L (iron status).
        transferrinSaturation:
          type:
          - number
          - 'null'
          format: double
          description: Transferrin saturation as a percentage (iron status).
        hba1c:
          type:
          - number
          - 'null'
          format: double
          description: HbA1c in mmol/mol (glycaemic control).
        bloodsDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the monitoring bloods were taken.
        raasInhibitorStatus:
          type: string
          enum:
          - prescribed
          - not-prescribed
          - contraindicated
          - not-tolerated
          - ''
          description: 'RAAS-inhibitor (ACEi/ARB/ARNI) pillar prescribing status: prescribed, not-prescribed,
            contraindicated, or not-tolerated.'
        raasInhibitorAgent:
          type: string
          maxLength: 100
          description: RAAS-inhibitor agent name.
        raasInhibitorDose:
          type: string
          maxLength: 100
          description: RAAS-inhibitor current dose.
        raasInhibitorAtTargetDose:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the RAAS inhibitor is at guideline target dose (yes/no).
        raasInhibitorAdherence:
          type: string
          enum:
          - good
          - partial
          - poor
          - ''
          description: 'RAAS-inhibitor self-reported adherence: good, partial, or poor.'
        betaBlockerStatus:
          type: string
          enum:
          - prescribed
          - not-prescribed
          - contraindicated
          - not-tolerated
          - ''
          description: 'Beta-blocker pillar prescribing status: prescribed, not-prescribed, contraindicated,
            or not-tolerated.'
        betaBlockerAgent:
          type: string
          maxLength: 100
          description: Beta-blocker agent name.
        betaBlockerDose:
          type: string
          maxLength: 100
          description: Beta-blocker current dose.
        betaBlockerAtTargetDose:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the beta-blocker is at guideline target dose (yes/no).
        betaBlockerAdherence:
          type: string
          enum:
          - good
          - partial
          - poor
          - ''
          description: 'Beta-blocker self-reported adherence: good, partial, or poor.'
        mraStatus:
          type: string
          enum:
          - prescribed
          - not-prescribed
          - contraindicated
          - not-tolerated
          - ''
          description: 'MRA (mineralocorticoid-receptor antagonist) pillar prescribing status: prescribed,
