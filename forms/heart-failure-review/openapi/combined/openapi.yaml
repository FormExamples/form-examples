components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        name:
          type: string
          description: Clinician full name as recorded in the rota.
        email:
          type: string
          description: Email address.
        phone:
          type: string
          description: Phone number.
        postal_address_as_full_text:
          type: string
          description: Postal address as a single text block.
        country_as_iso_3166_1_alpha_2:
          type: string
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2.
        postcode:
          type: string
          description: Postal code.
        role:
          type: string
          enum:
          - gp
          - practice-nurse
          - hf-nurse
          - pharmacist
          - cardiologist
          - other
          - ''
          description: 'Primary clinical role of the reviewer: gp, practice-nurse, hf-nurse (heart-failure
            specialist nurse), pharmacist, cardiologist, or other.'
        registration_body:
          type: string
          enum:
          - GMC
          - NMC
          - GPhC
          - other
          - ''
          description: 'Professional registration body: GMC, NMC, GPhC, or other.'
        registration_number:
          type: string
          description: Professional registration number issued by the registration body.
      required:
      - created_at
      - updated_at
      - name
      - role
      - registration_body
      - registration_number
      description: Clinician identifying information for the clinician who conducted the heart-failure
        annual review.
    HeartFailureReview:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        patient_id:
          type: string
          format: uuid
          description: Foreign key to the patient this review documents (restrict delete).
        clinician_id:
          type: string
          format: uuid
          description: Foreign key to the reviewing clinician (restrict delete); optional.
        clinician_name:
          type: string
          maxLength: 255
          description: Name of the reviewing clinician as recorded on the review.
        clinician_role:
          type: string
          enum:
          - gp
          - practice-nurse
          - hf-nurse
          - pharmacist
          - cardiologist
          - other
          - ''
          description: 'Reviewing clinician role: gp, practice-nurse, hf-nurse, pharmacist, cardiologist,
            or other.'
        review_date:
          type: string
          format: date
          description: Date this annual review was conducted.
        care_setting:
          type: string
          enum:
          - general-practice
          - community-hf-service
          - hospital-clinic
          - other
          - ''
          description: 'Care setting of the review: general-practice, community-hf-service, hospital-clinic,
            or other.'
        review_type:
          type: string
          enum:
          - routine-annual
          - post-discharge
          - medication-titration
          - ''
          description: 'Type of review: routine-annual, post-discharge, or medication-titration.'
        last_review_date:
          type: string
          format: date
          description: Date of the previous review, used to assess change over time.
        patient_identifier:
          type: string
          maxLength: 100
          description: NHS number or local patient identifier as recorded on the review.
        age_band:
          type: string
          enum:
          - 18-39
          - 40-59
          - 60-79
          - '>=80'
          - ''
          description: 'Adult age band: 18-39, 40-59, 60-79, or >=80.'
        sex:
          type: string
          enum:
          - female
          - male
          - intersex
          - unknown
          - ''
          description: 'Patient sex: female, male, intersex, or unknown.'
        year_of_diagnosis:
          type: integer
          format: int32
          description: Calendar year the heart failure was diagnosed.
        heart_failure_type:
          type: string
          enum:
          - reduced
          - mildly-reduced
          - preserved
          - unknown
          - ''
          description: 'Heart-failure subtype by ejection fraction: reduced (HFrEF), mildly-reduced (HFmrEF),
            preserved (HFpEF), or unknown. Drives the indicated medication-pillar set.'
        latest_lvef:
          type: number
          format: double
          description: Most recent left-ventricular ejection fraction as a percentage.
        last_echo_date:
          type: string
          format: date
          description: Date of the last echocardiogram.
        aetiology:
          type: string
          enum:
          - ischaemic
          - hypertensive
          - valvular
          - other
          - unknown
          - ''
          description: 'Underlying aetiology: ischaemic, hypertensive, valvular, other, or unknown.'
        nyha_class:
          type: integer
          format: int32
          description: New York Heart Association functional class 1-4 (null if not assessed); drives
            the functional-status classification.
        breathlessness:
          type: string
          enum:
          - none
          - on-exertion
          - at-rest
          - ''
          description: 'Breathlessness severity: none, on-exertion, or at-rest.'
        orthopnoea:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether orthopnoea is present (yes/no).
        paroxysmal_nocturnal_dyspnoea:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether paroxysmal nocturnal dyspnoea is present (yes/no).
        fatigue:
          type: string
          enum:
          - none
          - mild
          - moderate
          - severe
          - ''
          description: 'Fatigue severity: none, mild, moderate, or severe.'
        change_since_last_review:
          type: string
          enum:
          - improved
          - unchanged
          - worse
          - ''
          description: 'Overall change in symptoms since the last review: improved, unchanged, or worse.'
        decompensation:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether a documented decompensation has occurred since the last review (yes/no).
        weight_kg:
          type: number
          format: double
          description: Current body weight in kilograms.
        weight_change_kg:
          type: number
          format: double
          description: Change in weight in kilograms since the last review (positive = gain).
        peripheral_oedema:
          type: string
          enum:
          - none
          - mild
          - moderate
          - severe
          - ''
          description: 'Peripheral oedema severity: none, mild, moderate, or severe.'
        raised_jvp:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the jugular venous pressure is raised (yes/no).
        lung_crackles:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether pulmonary crackles are present on auscultation (yes/no).
        systolic_blood_pressure:
          type: integer
          format: int32
          description: Systolic blood pressure in mmHg.
        diastolic_blood_pressure:
          type: integer
          format: int32
          description: Diastolic blood pressure in mmHg.
        heart_rate:
          type: integer
          format: int32
          description: Heart rate in beats per minute.
        heart_rhythm:
          type: string
          enum:
          - sinus
          - atrial-fibrillation
          - paced
          - other
          - ''
          description: 'Heart rhythm: sinus, atrial-fibrillation, paced, or other.'
        nt_pro_bnp:
          type: number
          format: double
          description: NT-proBNP natriuretic peptide in ng/L.
        sodium:
          type: number
          format: double
          description: Serum sodium in mmol/L (U&E).
        potassium:
          type: number
          format: double
          description: Serum potassium in mmol/L (U&E); RAAS-inhibitor / MRA monitoring value.
        urea:
          type: number
          format: double
          description: Serum urea in mmol/L (U&E).
        creatinine:
          type: number
          format: double
          description: Serum creatinine in micromol/L (U&E).
        egfr:
          type: number
          format: double
          description: Estimated glomerular filtration rate in mL/min/1.73m^2; RAAS-inhibitor / MRA safety
