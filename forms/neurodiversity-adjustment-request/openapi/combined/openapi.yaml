      - notes
      description: Neurodiversity workplace reasonable-adjustments request. Captures the worker's neurodivergent
        profile (conditions, diagnosis status, disability self-assessment, disclosure consent), the functional
        difficulties experienced across the ACAS functional areas, the specific adjustments requested
        across the ACAS adjustment categories, supporting evidence, and impact / urgency. This is the
        source-of-truth record that the four-axis grade is computed from. Aligned with ACAS reasonable-adjustments
        guidance and the Equality Act 2010 duty to make reasonable adjustments.
