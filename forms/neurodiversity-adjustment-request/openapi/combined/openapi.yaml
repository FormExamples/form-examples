    NeurodiversityAdjustmentRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        worker_id:
          type: string
          format: uuid
          description: Foreign key to the worker the request is for.
        manager_id:
          type: string
          format: uuid
          description: Foreign key to the manager / HR contact handling the request.
        status:
          type: string
          enum:
          - draft
          - submitted
          - under-review
          - agreed
          - partially-agreed
          - declined
          - withdrawn
          - ''
          description: 'Request lifecycle status: draft, submitted, under-review, agreed, partially-agreed,
            declined, withdrawn.'
        requested_by:
          type: string
          enum:
          - worker
          - manager
          - occupational-health
          - other
          - ''
          description: 'Who initiated the request: worker, manager, occupational-health, other.'
        request_date:
          type: string
          format: date
          description: Date the request was made.
        requested_start_date:
          type: string
          format: date
          description: Proposed date for the requested adjustments to start.
        condition_adhd:
          type: boolean
          description: 'Neurodivergent profile: attention deficit hyperactivity disorder (ADHD).'
        condition_autism:
          type: boolean
          description: 'Neurodivergent profile: autism.'
        condition_dyslexia:
          type: boolean
          description: 'Neurodivergent profile: dyslexia.'
        condition_dyspraxia:
          type: boolean
          description: 'Neurodivergent profile: dyspraxia (developmental coordination disorder).'
        condition_dyscalculia:
          type: boolean
          description: 'Neurodivergent profile: dyscalculia.'
        condition_tourettes:
          type: boolean
          description: 'Neurodivergent profile: Tourette''s syndrome / tic disorder.'
        condition_other:
          type: boolean
          description: 'Neurodivergent profile: another form of neurodivergence not separately listed.'
        condition_other_detail:
          type: string
          maxLength: 500
          description: Free-text detail of the other neurodivergent condition(s).
        diagnosis_status:
          type: string
          enum:
          - diagnosed
          - self-identified
          - awaiting-assessment
          - prefer-not-to-say
          - ''
          description: 'Diagnosis status: diagnosed, self-identified, awaiting-assessment, prefer-not-to-say.
            A formal diagnosis is not required for the Equality Act duty to apply.'
        considers_disability:
          type: string
          enum:
          - 'yes'
          - 'no'
          - unsure
          - prefer-not-to-say
          - ''
          description: 'Whether the worker considers their neurodivergence a disability under the Equality
            Act 2010: yes, no, unsure, prefer-not-to-say.'
        substantial_long_term_impact:
          type: boolean
          description: Whether the neurodivergence has a substantial and long-term adverse effect on day-to-day
            activities (the Equality Act 2010 disability test).
        disclosure_consent:
          type: boolean
          description: Whether the worker consents to their neurodivergence details being shared with
            HR / occupational health as needed to arrange adjustments.
        difficulty_concentration:
          type: boolean
          description: 'Functional difficulty: concentration / focus.'
        difficulty_written_communication:
          type: boolean
          description: 'Functional difficulty: reading / writing / written communication.'
        difficulty_organisation_time:
          type: boolean
          description: 'Functional difficulty: organisation and time management.'
        difficulty_sensory_overload:
          type: boolean
          description: 'Functional difficulty: sensory overload (noise, light, busy environments).'
        difficulty_balance_coordination:
          type: boolean
          description: 'Functional difficulty: balance and coordination.'
        difficulty_social_communication:
          type: boolean
          description: 'Functional difficulty: social interaction / verbal communication.'
        difficulty_memory:
          type: boolean
          description: 'Functional difficulty: working memory / recall.'
        difficulty_burnout_wellbeing:
          type: boolean
          description: 'Functional difficulty: fatigue, burnout, and wellbeing.'
        tasks_situations_affected:
          type: string
          maxLength: 1000
          description: Specific tasks and situations at work where the difficulties cause a substantial
            disadvantage.
        worker_strengths:
          type: string
          maxLength: 1000
          description: 'Strengths the worker brings that adjustments can help them make the most of (ACAS:
            strength utilisation).'
        adjustment_working_environment:
          type: boolean
          description: 'Requested adjustment category: changes to the physical working environment (quiet
            space, lighting, desk location, screens).'
        adjustment_equipment_technology:
          type: boolean
          description: 'Requested adjustment category: equipment or assistive technology (noise-cancelling
            headphones, screen reader, speech-to-text, ergonomic equipment).'
        adjustment_working_arrangements:
          type: boolean
          description: 'Requested adjustment category: changes to working arrangements (flexible hours,
            remote / hybrid working, phased return, planned breaks).'
        adjustment_communication:
          type: boolean
          description: 'Requested adjustment category: changes to communication (written instructions,
            tasks broken into clear steps, regular check-ins).'
        adjustment_support_mentoring:
          type: boolean
          description: 'Requested adjustment category: additional support (mentor / buddy, coaching, extra
            training, job aids).'
        adjustment_recruitment_process:
          type: boolean
          description: 'Requested adjustment category: adjustments to a recruitment, selection, or assessment
            process.'
        adjustment_policy_dress:
          type: boolean
          description: 'Requested adjustment category: changes to policies (dress code / uniform for softer
            materials, absence-policy flexibility).'
        adjustment_other:
          type: boolean
          description: 'Requested adjustment category: another adjustment not separately listed.'
        adjustments_requested_detail:
          type: string
          maxLength: 2000
          description: Free-text detail of the specific adjustments requested.
        supporting_evidence_type:
          type: string
          enum:
          - occupational-health
          - gp-letter
          - diagnostic-report
          - access-to-work
          - none
          - ''
          description: 'Type of supporting evidence supplied: occupational-health, gp-letter, diagnostic-report,
            access-to-work, none.'
        occupational_health_involved:
          type: boolean
          description: Whether occupational health has been or should be involved.
        access_to_work_involved:
          type: boolean
          description: Whether the government Access to Work scheme is involved or has been applied for.
        current_impact:
          type: string
          enum:
          - low
          - moderate
          - high
          - severe
          - ''
          description: 'Current impact of the unadjusted difficulties on the worker''s work and wellbeing:
            low, moderate, high, severe.'
        at_risk_of_absence:
          type: boolean
          description: Whether the worker is at risk of sickness absence or burnout without adjustments.
        urgency:
          type: string
          enum:
          - routine
          - soon
          - urgent
          - ''
          description: 'Requested handling urgency: routine, soon, urgent.'
        notes:
