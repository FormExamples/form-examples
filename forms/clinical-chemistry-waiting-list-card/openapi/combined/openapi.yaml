components:
  schemas:
    ClinChemWaitingListCard:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the patient placed on the list.
        practitionerId:
          type: string
          format: uuid
          description: Foreign key to the practitioner who placed the patient on the list.
        status:
          type: string
          enum:
          - draft
          - submitted
          - reviewed
          - closed
          description: 'Lifecycle status: draft, submitted, reviewed, or closed.'
        entryDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the practitioner entered the card.
        entryTime:
          type:
          - string
          - 'null'
          format: time
          description: Time the practitioner entered the card.
        referralSource:
          type: string
          enum:
          - gp
          - consultant
          - a-and-e
          - self
          - community
          - screening
          - other
          - ''
          description: 'Where the referral originated: gp, consultant, a-and-e, self, community, screening,
            other.'
        referralDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the referral was made.
        referralLetterReference:
          type: string
          maxLength: 100
          description: Reference number / identifier for the originating referral letter.
        reasonForReferral:
          type: string
          description: Free-text reason for referral.
        presentingCondition:
          type: string
          description: Free-text presenting condition / clinical summary.
        icd10Code:
          type: string
          maxLength: 20
          description: ICD-10 diagnostic code for the presenting condition.
        snomedCtCode:
          type: string
          maxLength: 30
          description: SNOMED CT clinical concept code for the presenting condition.
        suspectedCancer:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether this is a suspected-cancer (two-week wait) referral.
        listName:
          type: string
          maxLength: 255
          description: Display name for the waiting list (e.g. "Orthopaedic — knee replacement").
        specialty:
          type: string
          maxLength: 100
          description: NHS specialty (e.g. "Trauma & Orthopaedics").
        subSpecialty:
          type: string
          maxLength: 100
          description: NHS sub-specialty (e.g. "Knee surgery").
        procedureDescription:
          type: string
          description: Plain-language description of what the patient is waiting to do.
        opcs4Code:
          type: string
          maxLength: 20
          description: OPCS-4 procedure code if a specific procedure is planned.
        clinicalPriority:
          type: string
          enum:
          - P1a
          - P1b
          - P2
          - P3
          - P4
          - P5
          - P6
          - ''
          description: 'NHS England clinical priority: P1a, P1b, P2, P3, P4, P5, P6.'
        rttClockStartDate:
          type:
          - string
          - 'null'
          format: date
          description: Referral to Treatment (RTT) clock-start date. The date the patient joined the list.
        expectedProcedureType:
          type: string
          enum:
          - first-outpatient-appointment
          - follow-up-appointment
          - day-case-procedure
          - inpatient-procedure
          - diagnostic
          - therapy
          - multi-disciplinary-team-review
          - other
          - ''
          description: Expected next event for the patient.
        expectedWaitWeeks:
          type:
          - integer
          - 'null'
          format: int32
          description: Expected wait, in weeks, communicated to the patient at entry.
