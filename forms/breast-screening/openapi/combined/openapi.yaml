components:
  schemas:
    BreastScreening:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        patient_id:
          type: string
          format: uuid
          description: Foreign key to the patient this screening documents (restrict delete).
        clinician_id:
          type: string
          format: uuid
          description: Foreign key to the reporting clinician (restrict delete); optional.
        reporting_clinician_role:
          type: string
          enum:
          - mammographer
          - advanced-practitioner
          - breast-radiologist
          - screening-office
          - other
          - ''
          description: 'Role of the reporting clinician: mammographer, advanced-practitioner, breast-radiologist,
            screening-office, or other.'
        reported_at:
          type: string
          format: date-time
          description: Date and time the screening outcome was reported.
        screening_unit:
          type: string
          description: 'Screening unit where the mammogram was taken: static or mobile unit.'
        episode_type:
          type: string
          enum:
          - routine-recall
          - very-first-call
          - self-referral
          - higher-risk-surveillance
          - ''
          description: 'Screening episode type: routine-recall, very-first-call, self-referral, or higher-risk-surveillance.'
        patient_identifier:
          type: string
          maxLength: 100
          description: NHS number or local patient identifier as recorded on the record.
        age_years:
          type: integer
          format: int32
          description: Patient age in years; drives eligibility and the age-range flag (routine eligible
            range 50-70).
        last_screened_date:
          type: string
          format: date
          description: Date of the most recent previous screen, when known; drives the overdue flag (~36
            months).
        higher_risk_surveillance:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the woman is on the separate higher-risk surveillance pathway (yes/no);
            yes classifies eligibility as higher-risk-surveillance.
        symptomatic:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the woman reports a breast symptom (yes/no); yes routes to the symptomatic
            breast pathway rather than screening.
        consent_given:
          type: string
          enum:
          - 'yes'
          - 'no'
          - declined
          - ''
          description: 'Whether informed consent to image was given: yes, no, or declined; anything other
            than yes raises the consent flag.'
        views_taken:
          type: string
          enum:
          - standard-four-view
          - additional-views
          - unable-to-image
          - ''
          description: 'Mammogram views taken: standard-four-view, additional-views, or unable-to-image.'
        image_adequacy:
          type: string
          enum:
          - adequate
          - inadequate
          - ''
          description: 'Image adequacy: adequate or inadequate; an inadequate image drives the technical-repeat
            flag.'
        first_read_opinion:
          type: string
          enum:
          - normal
          - recall
          - technical
          - ''
          description: 'First reader opinion: normal, recall, or technical.'
        second_read_opinion:
          type: string
          enum:
          - normal
          - recall
          - technical
          - ''
          description: 'Second reader opinion: normal, recall, or technical.'
        arbitration_outcome:
          type: string
          enum:
          - normal
          - recall
          - technical
          - not-required
          - ''
          description: 'Arbitration outcome when the two reads disagree: normal, recall, technical, or
            not-required.'
        reading_outcome:
          type: string
          enum:
          - normal-routine-recall
          - technical-repeat
          - recall-for-assessment
          - ''
          description: 'Overall film-reading outcome: normal-routine-recall, technical-repeat, or recall-for-assessment.'
        assessment_performed:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the recall assessment clinic was attended (yes/no); required before an
            imaging classification can be recorded.
        assessment_modalities:
          type: string
          description: Assessment modalities used, serialised multi-select from mammography, ultrasound,
            and biopsy.
        imaging_classification:
          type: integer
          format: int32
          description: Five-point breast imaging classification recorded at assessment (1 normal, 2 benign,
            3 indeterminate, 4 suspicious, 5 malignant); null until assessed.
        clinical_context:
          type: string
          description: Optional free-text clinical context shown in the summary.
      required:
      - created_at
      - updated_at
      - patient_id
      - reporting_clinician_role
      - screening_unit
      - episode_type
      - patient_identifier
      - higher_risk_surveillance
      - symptomatic
      - consent_given
      - views_taken
      - image_adequacy
      - first_read_opinion
      - second_read_opinion
      - arbitration_outcome
      - reading_outcome
      - assessment_performed
      - assessment_modalities
      - clinical_context
      description: 'Main breast-screening record for one NHS Breast Screening Programme mammography encounter:
        context and identification, eligibility, consent, mammogram views, double-read opinions and arbitration,
        the reading outcome, and the five-point breast imaging classification when assessed. Screening
        outcome, fired rules, and flags live in child tables.'
    BreastScreeningGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the row was soft-deleted.
        breast_screening_id:
          type: string
          format: uuid
          description: Foreign key to the parent breast-screening record (unique, 1:1).
        eligibility_status:
          type: string
          enum:
          - eligible
          - outside-age-range
          - higher-risk-surveillance
          - symptomatic-referral
          - ''
          description: 'Derived eligibility status: eligible, outside-age-range, higher-risk-surveillance,
            or symptomatic-referral.'
        result_class:
          type: string
          enum:
          - routine
          - repeat
          - assessment
          - urgent
          - referral
          - incomplete
          - ''
          description: 'Outcome band classifying the screening outcome: routine, repeat, assessment, urgent,
            referral, or incomplete.'
        management_action:
          type: string
          enum:
          - routine-recall
          - technical-repeat
          - recall-to-assessment-clinic
          - short-interval-follow-up
          - urgent-breast-clinic
          - symptomatic-pathway-referral
          - ''
          description: 'Recommended screening outcome / next action: routine-recall, technical-repeat,
            recall-to-assessment-clinic, short-interval-follow-up, urgent-breast-clinic, or symptomatic-pathway-referral.'
        status:
          type: string
          enum:
          - complete
          - incomplete
          - ''
          description: 'Completeness status: complete when eligibility, consent, views, image adequacy,
            the reading outcome, and (after a recall) the imaging classification are all present; otherwise
            incomplete.'
        graded_at:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the classification.
      required:
      - created_at
      - updated_at
      - breast_screening_id
      - eligibility_status
      - result_class
      - management_action
      - status
      - graded_at
      description: 'Computed result classification for a breast-screening record: eligibility status,
        outcome band (result class), the recommended screening outcome / next action, and completeness
        status.'
    BreastScreeningGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the row was soft-deleted.
        breast_screening_grade_id:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        flag_id:
          type: string
          maxLength: 50
          description: Stable flag identifier (e.g. F-SUSPICIOUS-MALIGNANT-001).
        category:
          type: string
          enum:
          - symptomatic-wrong-pathway
          - suspicious-malignant
          - recall-for-assessment
          - indeterminate-result
          - technical-repeat
          - consent-not-given
          - outside-age-range
          - overdue
          - incomplete-record
          - other
          - ''
          description: 'Flag category: symptomatic-wrong-pathway, suspicious-malignant, recall-for-assessment,
            indeterminate-result, technical-repeat, consent-not-given, outside-age-range, overdue, incomplete-record,
            or other.'
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          - ''
          description: 'Priority: low, medium, high.'
        description:
          type: string
          maxLength: 500
          description: Human-readable description of what fired the flag.
        suggested_action:
          type: string
          maxLength: 500
          description: Suggested clinical or service action (e.g. "refer urgently to the breast clinic",
