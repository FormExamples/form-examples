                $ref: '#/components/schemas/Problem'
    delete:
      summary: Delete a HearingTestRequest
      operationId: deleteHearingTestRequest
      responses:
        '200':
          description: HearingTestRequest deleted
        '404':
          description: HearingTestRequest not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: This client sent too many requests
          headers:
            retry-after:
              description: Seconds to wait before sending again
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/patients:
    get:
      summary: List Patient records
      operationId: listPatient
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 100
        required: false
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          maximum: 100000
          default: 0
        required: false
      responses:
        '200':
          description: A page of Patient records
          headers:
            x-total-count:
              description: Rows there are in all
              schema:
                type: integer
            x-limit:
              description: The limit applied
              schema:
                type: integer
            x-offset:
              description: The offset applied
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Patient'
        '400':
          description: The offset is past the maximum
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: This client sent too many requests
          headers:
            retry-after:
              description: Seconds to wait before sending again
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    post:
      summary: Create a new Patient
      operationId: createPatient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Patient'
      responses:
        '200':
          description: The newly created Patient
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'
        '400':
          description: The request was refused
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: It duplicates a row, or refers to a missing one
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: The body does not match the schema
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: This client sent too many requests
          headers:
            retry-after:
              description: Seconds to wait before sending again
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/patients/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      summary: Fetch one Patient by id
      operationId: getPatient
      responses:
        '200':
          description: The requested Patient
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'
        '404':
          description: Patient not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: This client sent too many requests
          headers:
            retry-after:
              description: Seconds to wait before sending again
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    patch:
      summary: Update an existing Patient
      operationId: updatePatient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Patient'
      responses:
        '200':
          description: The updated Patient
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'
        '404':
          description: Patient not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: It duplicates a row, or refers to a missing one
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: The body does not match the schema
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: This client sent too many requests
          headers:
            retry-after:
              description: Seconds to wait before sending again
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    delete:
      summary: Delete a Patient
      operationId: deletePatient
      responses:
        '200':
          description: Patient deleted
        '404':
          description: Patient not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: This client sent too many requests
          headers:
            retry-after:
              description: Seconds to wait before sending again
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Name.
        email:
          type: string
          description: Email address.
        phone:
          type: string
          description: Phone number.
        postal_address_as_full_text:
          type: string
          description: Postal address as full text.
        country_as_iso_3166_1_alpha_2:
          type: string
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type: string
          description: Postal code, such as for validating the postal address.
        role:
          type: string
          enum:
          - audiologist
          - ent-surgeon
          - gp
          - hearing-therapist
          - nurse
          - other
          - ''
          description: 'Clinician role: audiologist, ent-surgeon, gp, hearing-therapist, nurse, other.'
        registration_body:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - RCCP
          - AHCS
          - other
          - ''
          description: 'Clinician registration body: GMC, NMC, HCPC, RCCP, AHCS, other.'
        registration_number:
          type: string
          description: Clinician registration number.
        united_kingdom_nhs_number:
          type: string
          maxLength: 12
          description: United Kingdom NHS number, unique per person.
      required:
      - created_at
      - updated_at
      - name
      - role
      - registration_body
      - registration_number
      description: Requesting clinician (referrer) who completes the hearing test request.
    HearingTestRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patient_id:
          type: string
          format: uuid
          description: Foreign key to the patient.
        clinician_id:
          type: string
          format: uuid
          description: Foreign key to the requesting clinician (referrer).
        status:
          type: string
          enum:
          - draft
          - submitted
          - vetted
          - scheduled
          - rejected
          - ''
          description: 'Request lifecycle status: draft, submitted, vetted, scheduled, rejected.'
        site_name:
          type: string
          maxLength: 255
          description: Name of the requesting site or clinic.
        setting:
          type: string
          enum:
          - outpatient
          - inpatient
          - community
          - emergency
          - ''
          description: 'Care setting: outpatient, inpatient, community, emergency.'
        referral_date:
          type: string
          format: date
          description: Date the referral was made.
        requested_by_date:
          type: string
          format: date
          description: Date by which the test is requested to be performed.
        test_type:
          type: string
          enum:
          - pure-tone-audiometry
          - tympanometry
          - speech-audiometry
          - otoacoustic-emissions
          - auditory-brainstem-response
          - newborn-hearing-screen
          - hearing-aid-assessment
          - other
          - ''
          description: 'Requested audiology test type: pure-tone-audiometry, tympanometry, speech-audiometry,
            otoacoustic-emissions, auditory-brainstem-response, newborn-hearing-screen, hearing-aid-assessment,
            other.'
        laterality:
          type: string
          enum:
          - left
          - right
          - bilateral
          - not-applicable
          - ''
          description: 'Affected side: left, right, bilateral, not-applicable.'
        primary_indication:
          type: string
          enum:
          - hearing-loss
          - tinnitus
          - vertigo
          - ear-discharge
          - suspected-otosclerosis
          - occupational-noise
          - ototoxic-monitoring
          - developmental-delay-child
          - hearing-aid-review
          - sudden-hearing-loss
          - other
          - ''
          description: Primary clinical indication, used for appropriateness scoring.
        clinical_question:
          type: string
          maxLength: 1000
          description: Specific clinical question the test should answer (highest-value field).
        relevant_history:
          type: string
          maxLength: 1000
          description: Relevant medical, otological, and noise-exposure history.
        symptom_hearing_loss:
          type: boolean
          description: Whether the patient reports hearing loss.
        symptom_tinnitus:
          type: boolean
          description: Whether the patient reports tinnitus.
        symptom_vertigo:
          type: boolean
          description: Whether the patient reports vertigo or imbalance.
        symptom_otalgia:
          type: boolean
          description: Whether the patient reports otalgia (ear pain).
        sudden_onset:
          type: boolean
          description: Whether onset was sudden (red flag for sudden sensorineural hearing loss).
        ear_discharge:
          type: boolean
          description: Whether the patient has ear discharge / otorrhoea (red flag).
        ototoxic_medication:
          type: boolean
          description: Whether the patient is on ototoxic medication requiring monitoring.
        urgency:
          type: string
          enum:
          - routine
          - urgent
          - emergency
          - ''
          description: 'Requested triage urgency: routine, urgent, emergency.'
        supervising_consultant:
          type: string
          maxLength: 255
          description: Name of the supervising / responsible consultant.
        requester_contact:
          type: string
          maxLength: 255
          description: Contact details (bleep / phone) for the requester.
        notes:
          type: string
          maxLength: 1000
          description: Free-text additional notes.
      required:
      - created_at
      - updated_at
      - patient_id
      - clinician_id
      - status
      - site_name
      - setting
      - test_type
      - laterality
      - primary_indication
      - clinical_question
      - relevant_history
      - symptom_hearing_loss
      - symptom_tinnitus
      - symptom_vertigo
      - symptom_otalgia
      - sudden_onset
      - ear_discharge
      - ototoxic_medication
      - urgency
      - supervising_consultant
      - requester_contact
      - notes
      description: Audiology / hearing-assessment request (referral). Captures the requested test, laterality,
        the clinical indication and question, relevant history, symptoms / red flags, and triage urgency.
    HearingTestRequestGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        hearing_test_request_id:
          type: string
          format: uuid
          description: Foreign key to the parent request (unique, 1:1).
        appropriateness_score:
          type: integer
          format: int32
          description: Appropriateness score (1-9) anchored on British Society of Audiology / NICE NG98
            indication match. There is no single published 1-9 audiology score; this axis adapts the ordinal-rating
            convention to indication appropriateness.
        appropriateness_band:
          type: string
          enum:
          - usually-appropriate
          - may-be-appropriate
          - usually-not-appropriate
          - ''
          description: 'Appropriateness band: usually-appropriate (7-9), may-be-appropriate (4-6), usually-not-appropriate
            (1-3).'
        triage_tier:
          type: string
          enum:
          - routine
          - urgent
          - emergency
          - ''
          description: 'Assigned urgency triage tier: routine, urgent, emergency.'
        target_timeframe:
          type: string
          maxLength: 50
          description: Target timeframe implied by the triage tier (e.g. sudden sensorineural hearing
            loss -> urgent, within days).
        completeness_percent:
          type: integer
          format: int32
          description: Request completeness as a percentage of mandatory fields (0-100).
        priority_band:
          type: string
          enum:
          - low
          - moderate
          - high
          - ''
          description: 'Clinical priority band: low, moderate, high.'
        recommendation:
          type: string
          enum:
          - accept
          - query-referrer
          - redirect
          - reject
          - ''
          description: 'Vetting recommendation: accept, query-referrer, redirect, reject.'
        clinician_notes:
          type: string
          description: Free-text vetting notes.
        signed_at:
          type: string
          format: date-time
          description: Timestamp of vetting clinician electronic signature.
        graded_at:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the result.
      required:
      - created_at
      - updated_at
      - hearing_test_request_id
      - appropriateness_band
      - triage_tier
      - target_timeframe
      - priority_band
      - recommendation
      - clinician_notes
      - graded_at
      description: 'Computed four-axis grading result: appropriateness (1-9 indication match), urgency
        triage tier, request completeness, and clinical priority.'
    HearingTestRequestGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        hearing_test_request_grade_id:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        flag_id:
          type: string
          maxLength: 50
          description: Stable flag identifier (e.g. F-SUDDEN-SNHL-001).
        category:
          type: string
          enum:
          - sudden-sensorineural-hearing-loss-urgent
          - unilateral-symptoms-red-flag
          - ear-discharge
          - missing-indication
          - missing-clinical-question
          - other
          - ''
          description: Flag category.
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          - ''
          description: 'Priority: low, medium, high.'
        description:
          type: string
          maxLength: 500
          description: Human-readable description of what fired the flag.
        suggested_action:
          type: string
          maxLength: 500
          description: Suggested clinical action (e.g. "refer to ENT to be seen within 24 hours").
      required:
      - created_at
      - updated_at
      - hearing_test_request_grade_id
      - flag_id
      - category
      - priority
      - description
      - suggested_action
      description: Safety-critical flags that fire independently of the four axes, with priority and a
        suggested action for the audiology / ENT team.
    HearingTestRequestGradeRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        hearing_test_request_grade_id:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        rule_id:
          type: string
          maxLength: 40
          description: Stable rule identifier (e.g. R-APPROP-SUDDEN-01).
        axis:
          type: string
          enum:
          - appropriateness
          - urgency
          - completeness
          - priority
          - ''
          description: 'Scoring axis the rule belongs to: appropriateness, urgency, completeness, priority.'
        category:
          type: string
          maxLength: 50
          description: Category or indication the rule relates to.
        description:
          type: string
          maxLength: 500
          description: Human-readable description of why the rule fired.
      required:
      - created_at
      - updated_at
      - hearing_test_request_grade_id
      - rule_id
      - axis
      - category
      - description
      description: Audit trail of every appropriateness / urgency / completeness / priority rule that
        fired for this request.
    Patient:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          maxLength: 255
          description: Name.
        birth_date:
          type: string
          format: date
          description: Birth date.
        email:
          type: string
          description: Email address.
        phone:
          type: string
          description: Phone number.
        postal_address_as_full_text:
          type: string
          description: Postal address as full text.
        country_as_iso_3166_1_alpha_2:
          type: string
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type: string
          description: Postal code, such as for validating the postal address.
        united_kingdom_nhs_number:
          type: string
          maxLength: 20
          description: United Kingdom NHS number, unique per person.
        waist_as_cm:
          type: number
          format: double
          description: Waist circumference measurement in cm, such as for calculating waist-height ratio
            (WHR).
        height_as_cm:
          type: number
          format: double
          description: Height measurement in cm, such as for calculating waist-height ratio (WHR).
        weight_as_kg:
          type: number
          format: double
          description: Weight as kg.
        body_mass_index:
          type: number
          format: double
          description: Body mass index (BMI) measurement.
        waist_height_ratio:
          type: number
          format: double
          description: Waist-height ratio (WHR) measurement.
        vo2_max:
          type: number
          format: double
          description: VO2 max measurement.
      required:
      - created_at
      - updated_at
      - name
      - birth_date
      description: Patient
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          description: A URI identifying the problem type
        title:
          type: string
          description: A short summary of the problem type
        status:
          type: integer
          description: The HTTP status code
        detail:
          type: string
          description: An explanation of this occurrence
        instance:
          type: string
          description: A URI identifying this occurrence
        code:
          type: string
          description: A short machine-readable reason
        errors:
          type: object
          description: Per-field detail, when validation failed
      required:
      - type
      - title
      - status
