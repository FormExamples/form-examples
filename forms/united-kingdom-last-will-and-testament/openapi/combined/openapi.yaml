        Validity classification, fired rules, and flags live in child tables. Documentation support, not
        legal advice.'
    UnitedKingdomLastWillAndTestamentGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        unitedKingdomLastWillAndTestamentId:
          type: string
          format: uuid
          description: Foreign key to the parent will (unique, 1:1).
        validityClass:
          type: string
          enum:
          - valid
          - incomplete
          - formality-risk
          - ''
          description: 'Validity classification: valid, incomplete, or formality-risk (formality-risk
            takes precedence over incomplete).'
        sharesTotalPercent:
          type:
          - number
          - 'null'
          format: double
          description: Sum of the beneficiary percentage shares; 100 when the residuary estate is fully
            allocated.
        witnessCount:
