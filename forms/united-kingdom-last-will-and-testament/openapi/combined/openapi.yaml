components:
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          description: A URI identifying the problem type
        title:
          type: string
          description: A short summary of the problem type
        status:
          type: integer
          description: The HTTP status code
        detail:
          type: string
          description: An explanation of this occurrence
        instance:
          type: string
          description: A URI identifying this occurrence
        code:
          type: string
          description: A short machine-readable reason
        errors:
          type: object
          description: Per-field detail, when validation failed
      required:
      - type
      - title
      - status
    Testator:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          maxLength: 255
          description: Full legal name of the testator.
        birthDate:
          type: string
          format: date
          description: Date of birth of the testator; a testator must be 18 or over.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as a single text block.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code.
      required:
      - createdAt
      - updatedAt
      - name
      - birthDate
      description: 'Testator: the person making the will, with contact details.'
    UnitedKingdomLastWillAndTestament:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        testatorId:
          type: string
          format: uuid
          description: Foreign key to the testator this will documents (restrict delete).
        testatorName:
          type: string
          description: Full legal name of the testator as it will appear in the will.
        dateOfBirth:
          type:
          - string
          - 'null'
          format: date
          description: Testator date of birth; a testator must be 18 or over (Wills Act 1837 s.7).
        testatorAddress:
          type: string
          description: Testator postal address as a single text block.
        domicile:
          type: string
          enum:
          - england-wales
          - scotland
          - northern-ireland
          - other
          - ''
          description: 'Testator domicile for choice of law: england-wales, scotland, northern-ireland,
            or other.'
        maritalStatus:
          type: string
          enum:
          - single
          - married
          - civil-partnership
          - cohabiting
          - divorced-or-dissolved
          - widowed
          - ''
          description: 'Marital status: single, married, civil-partnership, cohabiting, divorced-or-dissolved,
            or widowed.'
        marriageExpected:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the testator expects to marry or form a civil partnership soon (marriage
            revokes a will, Wills Act 1837 s.18).
        contemplationOfMarriageClause:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the will states it is made in contemplation of that marriage or civil partnership,
            which stops the marriage revoking it (s.18).
        hasMentalCapacity:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the testator has testamentary capacity (understands making a will, the
            extent of the estate, and who might claim on it).
        madeVoluntarily:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the testator makes the will freely, without undue influence or pressure.
        previousWill:
          type: string
          enum:
          - none
          - exists
          - unsure
          - ''
          description: 'Earlier will status: none, exists (an earlier will exists), or unsure.'
        revocationClause:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the will expressly revokes all earlier wills and codicils.
        estateValueBand:
          type: string
          enum:
          - under-325k
          - 325k-500k
          - 500k-2m
          - over-2m
          - ''
          description: 'Approximate estate value band: under-325k, 325k-500k, 500k-2m, or over-2m (inheritance
            tax thresholds).'
        ownsHome:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the testator owns a home that forms part of the estate.
        homeToDirectDescendants:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the home is left to children or grandchildren (residence nil-rate band).
        charityGiftPercent:
          type:
          - number
          - 'null'
          format: double
          description: Percentage of the net estate left to charity (10% or more earns the reduced 36%
            inheritance tax rate).
        estateOtherJurisdictions:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the testator owns property outside England and Wales.
        otherJurisdictionsDetail:
          type: string
          description: Where and what property is held outside England and Wales.
        specificGiftsNotes:
          type: string
          description: Free-text list of specific gifts (items, sums of money) left to named people.
        executorFirstName:
          type: string
          description: Name of the first executor.
        executorFirstRelationship:
          type: string
          description: Relationship of the first executor to the testator.
        executorSecondName:
          type: string
          description: Name of the second executor.
        executorSecondRelationship:
          type: string
          description: Relationship of the second executor to the testator.
        executorsAdultConfirmed:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether every named executor is confirmed as 18 or over and willing to act.
        beneficiaryFirstName:
          type: string
          description: Name of the first beneficiary.
        beneficiaryFirstRelationship:
          type: string
          enum:
          - spouse-or-civil-partner
          - unmarried-partner
          - child
          - grandchild
          - other-relative
          - friend
          - charity
          - other
          - ''
          description: 'Relationship of the first beneficiary: spouse-or-civil-partner, unmarried-partner,
            child, grandchild, other-relative, friend, charity, or other.'
        beneficiaryFirstSharePercent:
          type:
          - number
          - 'null'
          format: double
          description: Percentage share of the residuary estate left to the first beneficiary.
        beneficiaryFirstIsMinor:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the first beneficiary is under 18.
        beneficiaryFirstHasTrustee:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether a trustee is appointed to hold the first beneficiary share until they are
            18.
        beneficiarySecondName:
          type: string
          description: Name of the second beneficiary.
        beneficiarySecondRelationship:
          type: string
          enum:
          - spouse-or-civil-partner
          - unmarried-partner
          - child
          - grandchild
          - other-relative
          - friend
          - charity
          - other
          - ''
          description: 'Relationship of the second beneficiary: spouse-or-civil-partner, unmarried-partner,
            child, grandchild, other-relative, friend, charity, or other.'
        beneficiarySecondSharePercent:
          type:
          - number
          - 'null'
          format: double
          description: Percentage share of the residuary estate left to the second beneficiary.
        beneficiarySecondIsMinor:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the second beneficiary is under 18.
        beneficiarySecondHasTrustee:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether a trustee is appointed to hold the second beneficiary share until they
            are 18.
        beneficiaryThirdName:
          type: string
          description: Name of the third beneficiary.
        beneficiaryThirdRelationship:
          type: string
          enum:
          - spouse-or-civil-partner
          - unmarried-partner
          - child
          - grandchild
          - other-relative
          - friend
          - charity
          - other
          - ''
          description: 'Relationship of the third beneficiary: spouse-or-civil-partner, unmarried-partner,
            child, grandchild, other-relative, friend, charity, or other.'
        beneficiaryThirdSharePercent:
          type:
          - number
          - 'null'
          format: double
          description: Percentage share of the residuary estate left to the third beneficiary.
        beneficiaryThirdIsMinor:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the third beneficiary is under 18.
        beneficiaryThirdHasTrustee:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether a trustee is appointed to hold the third beneficiary share until they are
            18.
        beneficiaryFourthName:
          type: string
          description: Name of the fourth beneficiary.
        beneficiaryFourthRelationship:
          type: string
          enum:
          - spouse-or-civil-partner
          - unmarried-partner
          - child
          - grandchild
          - other-relative
          - friend
          - charity
          - other
          - ''
          description: 'Relationship of the fourth beneficiary: spouse-or-civil-partner, unmarried-partner,
            child, grandchild, other-relative, friend, charity, or other.'
        beneficiaryFourthSharePercent:
          type:
          - number
          - 'null'
          format: double
          description: Percentage share of the residuary estate left to the fourth beneficiary.
        beneficiaryFourthIsMinor:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the fourth beneficiary is under 18.
        beneficiaryFourthHasTrustee:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether a trustee is appointed to hold the fourth beneficiary share until they
            are 18.
        residuaryClause:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the will disposes of the residuary estate (everything not otherwise given
            away).
        dependantsConsidered:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the testator has considered who could claim reasonable provision under
            the Inheritance (Provision for Family and Dependants) Act 1975.
        hasChildrenUnder18:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the testator has children under 18.
        guardianName:
          type: string
          description: Guardian appointed for children under 18.
        funeralWishes:
          type: string
          enum:
          - burial
          - cremation
          - no-preference
          - other
          - ''
          description: 'Funeral wishes: burial, cremation, no-preference, or other.'
        funeralWishesNote:
          type: string
          description: Free-text funeral wishes (not legally binding on the executors).
        executionStatus:
          type: string
          enum:
          - draft
          - signed
          - ''
          description: Whether the will is still a draft or has been signed and witnessed.
        dateOfWill:
          type:
          - string
          - 'null'
          format: date
          description: Date the will was signed and witnessed.
        willInWriting:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the will is in writing (Wills Act 1837 s.9).
        testatorSigned:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the testator signed (or acknowledged their signature) with the intention
            of giving effect to the will.
        witnessesPresentTogether:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether two witnesses were present together when the testator signed or acknowledged.
        witnessesSigned:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether each witness then signed or acknowledged their signature in the testator
            presence.
        witnessFirstName:
          type: string
          description: Name of the first witness.
        witnessFirstOver18:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the first witness is 18 or over.
        witnessFirstIsBeneficiaryOrSpouse:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the first witness, or their spouse or civil partner, is a beneficiary (the
            gift fails, Wills Act 1837 s.15).
        witnessSecondName:
          type: string
          description: Name of the second witness.
        witnessSecondOver18:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the second witness is 18 or over.
        witnessSecondIsBeneficiaryOrSpouse:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the second witness, or their spouse or civil partner, is a beneficiary
            (the gift fails, Wills Act 1837 s.15).
        drafterNote:
          type: string
          description: Free-text note from the person preparing the will.
