components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Name.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as full text.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code, such as for validating the postal address.
        role:
          type: string
          enum:
          - urologist
          - gp
          - hospital-doctor
          - nurse-cystoscopist
          - other
          - ''
          description: 'Clinician role: urologist, gp, hospital-doctor, nurse-cystoscopist, other.'
        registrationBody:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - other
          - ''
          description: 'Clinician registration body: GMC, NMC, HCPC, other.'
        registrationNumber:
          type: string
          description: Clinician registration number.
        unitedKingdomNhsNumber:
          type:
          - string
          - 'null'
          maxLength: 12
          description: United Kingdom NHS number, unique per person.
      required:
      - createdAt
      - updatedAt
      - name
      - role
      - registrationBody
      - registrationNumber
      description: Requesting clinician (referrer) who completes the cystoscopy request.
    CystoscopyTestRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the patient.
        clinicianId:
          type: string
          format: uuid
          description: Foreign key to the requesting clinician (referrer).
        status:
          type: string
          enum:
          - draft
          - submitted
          - vetted
          - scheduled
          - rejected
          - ''
          description: 'Request lifecycle status: draft, submitted, vetted, scheduled, rejected.'
        siteName:
          type: string
          maxLength: 255
          description: Name of the requesting site or clinic.
        setting:
          type: string
          enum:
          - outpatient
          - inpatient
          - community
          - emergency
          - ''
          description: 'Care setting: outpatient, inpatient, community, emergency.'
        referralDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the referral was made.
        requestedByDate:
          type:
          - string
          - 'null'
          format: date
          description: Date by which the cystoscopy is requested to be performed.
        procedure:
          type: string
          enum:
          - flexible-cystoscopy
          - rigid-cystoscopy
          - other
          - ''
          description: 'Requested procedure: flexible-cystoscopy, rigid-cystoscopy, other.'
        primaryIndication:
          type: string
          enum:
          - visible-haematuria
          - non-visible-haematuria
          - recurrent-uti
          - lower-urinary-tract-symptoms
          - bladder-cancer-surveillance
          - suspected-bladder-tumour
          - urethral-stricture
          - catheter-problems
          - other
          - ''
          description: Primary clinical indication, used for appropriateness scoring.
        clinicalQuestion:
          type: string
          maxLength: 1000
          description: Specific clinical question the cystoscopy should answer (highest-value field).
        relevantHistory:
          type: string
          maxLength: 1000
          description: Relevant medical, surgical, and urological history.
        symptomHaematuria:
          type: boolean
          description: Whether the patient reports blood in the urine (haematuria).
        symptomDysuria:
          type: boolean
          description: Whether the patient reports painful or difficult urination (dysuria).
        symptomFrequency:
          type: boolean
          description: Whether the patient reports urinary frequency.
        symptomRetention:
          type: boolean
          description: Whether the patient reports urinary retention.
        visibleHaematuria:
          type: boolean
          description: Whether the haematuria is visible (macroscopic / frank) rather than non-visible
            (red flag for 2WW).
        currentUti:
          type: boolean
          description: Whether the patient currently has an active urinary tract infection (defer for
            active UTI).
        takingAnticoagulant:
          type: boolean
          description: Whether the patient is taking an anticoagulant (bleeding-risk factor).
        anticoagulantAgent:
          type: string
          maxLength: 255
          description: Name of the anticoagulant agent the patient is taking, if any.
        takingAntiplatelet:
          type: boolean
          description: Whether the patient is taking an antiplatelet agent (bleeding-risk factor).
        previousBladderCancer:
          type: boolean
          description: Whether the patient has a history of bladder cancer (surveillance context).
        urgency:
          type: string
          enum:
          - routine
          - urgent
          - two-week-wait
          - emergency
          - ''
          description: 'Requested triage urgency: routine, urgent, two-week-wait, emergency.'
        supervisingConsultant:
          type: string
          maxLength: 255
          description: Name of the supervising / responsible consultant.
        requesterContact:
          type: string
          maxLength: 255
          description: Contact details (bleep / phone) for the requester.
        notes:
          type: string
          maxLength: 1000
          description: Free-text additional notes.
      required:
      - createdAt
      - updatedAt
      - patientId
      - clinicianId
      - status
      - siteName
      - setting
      - procedure
      - primaryIndication
      - clinicalQuestion
      - relevantHistory
      - symptomHaematuria
      - symptomDysuria
      - symptomFrequency
      - symptomRetention
      - visibleHaematuria
      - currentUti
      - takingAnticoagulant
      - anticoagulantAgent
      - takingAntiplatelet
      - previousBladderCancer
      - urgency
      - supervisingConsultant
      - requesterContact
      - notes
      description: Cystoscopy (bladder endoscopy) request (referral). Captures the requested procedure,
        the clinical indication and question, relevant history, symptoms, bleeding-risk factors, and triage
        urgency.
    CystoscopyTestRequestGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        cystoscopyTestRequestId:
          type: string
          format: uuid
          description: Foreign key to the parent request (unique, 1:1).
        appropriatenessScore:
          type:
          - integer
          - 'null'
          format: int32
          description: Appropriateness score (1-9), grounded in NICE NG12 and BAUS haematuria guidance.
        appropriatenessBand:
          type: string
          enum:
          - usually-appropriate
          - may-be-appropriate
          - usually-not-appropriate
          - ''
          description: 'Appropriateness band: usually-appropriate (7-9), may-be-appropriate (4-6), usually-not-appropriate
            (1-3).'
        triageTier:
          type: string
          enum:
          - routine
          - urgent
          - two-week-wait
          - emergency
          - ''
          description: 'Assigned cancer-pathway triage tier: routine, urgent, two-week-wait, emergency.'
        targetTimeframe:
          type: string
          maxLength: 50
          description: Target timeframe for the cystoscopy implied by the triage tier.
        twoWeekWaitEligible:
          type: boolean
          description: Whether the request meets NICE NG12 suspected-cancer two-week-wait criteria.
        completenessPercent:
          type:
          - integer
          - 'null'
          format: int32
          description: Request completeness as a percentage of mandatory fields (0-100).
        riskBand:
          type: string
          enum:
          - low
          - moderate
          - high
          - ''
          description: 'Pre-procedure bleeding / safety risk band: low, moderate, high.'
        anticoagulantAction:
          type: string
          maxLength: 500
          description: Recommended pre-procedure action for anticoagulation or active UTI (e.g. defer
            for active UTI, hold anticoagulant).
        recommendation:
          type: string
          enum:
          - accept
          - query-referrer
          - redirect
          - reject
          - ''
          description: 'Vetting recommendation: accept, query-referrer, redirect, reject.'
        clinicianNotes:
          type: string
          description: Free-text vetting notes.
        signedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Timestamp of vetting clinician electronic signature.
        gradedAt:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the result.
      required:
      - createdAt
      - updatedAt
      - cystoscopyTestRequestId
      - appropriatenessBand
      - triageTier
      - targetTimeframe
      - twoWeekWaitEligible
      - riskBand
      - anticoagulantAction
      - recommendation
      - clinicianNotes
      - gradedAt
      description: 'Computed four-axis grading result: appropriateness (NICE NG12 / BAUS, 1-9), cancer-pathway
        urgency, request completeness, and pre-procedure risk.'
    CystoscopyTestRequestGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        cystoscopyTestRequestGradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        flagId:
          type: string
          maxLength: 50
          description: Stable flag identifier (e.g. F-SUSPECTED-CANCER-2WW-001).
        category:
          type: string
          enum:
          - suspected-cancer-2ww
          - visible-haematuria
          - active-uti-defer
          - high-bleeding-risk-anticoag
          - missing-indication
          - missing-clinical-question
          - other
          - ''
          description: Flag category.
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          - ''
          description: 'Priority: low, medium, high.'
        description:
          type: string
          maxLength: 500
          description: Human-readable description of what fired the flag.
        suggestedAction:
          type: string
          maxLength: 500
          description: Suggested clinical action (e.g. "refer on the suspected-cancer two-week-wait pathway").
      required:
      - createdAt
      - updatedAt
      - cystoscopyTestRequestGradeId
      - flagId
      - category
      - priority
      - description
      - suggestedAction
      description: Safety-critical flags that fire independently of the four axes, with priority and a
        suggested action for the imaging / urology team.
    CystoscopyTestRequestGradeRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
