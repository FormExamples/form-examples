components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Name.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as full text.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code, such as for validating the postal address.
        role:
          type: string
          enum:
          - clinical-biochemist
          - toxicologist
          - emergency-physician
          - reporting-clinician
          - other
          - ''
          description: 'Reporting clinician role: clinical-biochemist, toxicologist, emergency-physician,
            reporting-clinician, other.'
        registrationBody:
          type: string
          enum:
          - GMC
          - HCPC
          - other
          - ''
          description: 'Clinician registration body: GMC, HCPC, other.'
        registrationNumber:
          type: string
          description: Clinician registration number.
        unitedKingdomNhsNumber:
          type:
          - string
          - 'null'
          maxLength: 12
          description: United Kingdom NHS number, unique per person.
      required:
      - createdAt
      - updatedAt
      - name
      - role
      - registrationBody
      - registrationNumber
      description: Reporting clinician (clinical biochemist, toxicologist, or emergency physician) who
        authors and signs the toxicology result report.
    Patient:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          maxLength: 255
          description: Name.
        birthDate:
          type: string
          format: date
          description: Birth date.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as full text.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code, such as for validating the postal address.
        unitedKingdomNhsNumber:
          type:
          - string
          - 'null'
          maxLength: 20
          description: United Kingdom NHS number, unique per person.
        waistAsCm:
          type:
          - number
          - 'null'
          format: double
          description: Waist circumference measurement in cm, such as for calculating waist-height ratio
            (WHR).
        heightAsCm:
          type:
          - number
          - 'null'
          format: double
          description: Height measurement in cm, such as for calculating waist-height ratio (WHR).
        weightAsKg:
          type:
          - number
          - 'null'
          format: double
          description: Weight as kg.
        bodyMassIndex:
          type:
          - number
          - 'null'
          format: double
          description: Body mass index (BMI) measurement.
        waistHeightRatio:
          type:
          - number
          - 'null'
          format: double
          description: Waist-height ratio (WHR) measurement.
        vo2Max:
          type:
          - number
          - 'null'
          format: double
          description: VO2 max measurement.
      required:
      - createdAt
      - updatedAt
      - name
      - birthDate
      description: Patient
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          description: A URI identifying the problem type
        title:
          type: string
          description: A short summary of the problem type
        status:
          type: integer
          description: The HTTP status code
        detail:
          type: string
          description: An explanation of this occurrence
        instance:
          type: string
          description: A URI identifying this occurrence
        code:
          type: string
          description: A short machine-readable reason
        errors:
          type: object
          description: Per-field detail, when validation failed
      required:
      - type
      - title
      - status
    ToxicologyTestResult:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the patient.
        clinicianId:
          type: string
          format: uuid
          description: Foreign key to the reporting clinician (clinical biochemist / toxicologist / emergency
            physician).
        originatingRequestReference:
          type: string
          maxLength: 255
          description: Free-text reference linking this report back to the originating toxicology test
            request (referral).
        reportStatus:
          type: string
          enum:
          - preliminary
          - final
          - amended
          - cancelled
          - ''
          description: 'Report lifecycle status: preliminary, final, amended, cancelled.'
        performedDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the toxicology assay was performed.
        reportedDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the report was authored / signed.
        specimenCondition:
          type: string
          enum:
          - satisfactory
          - insufficient
          - delayed
          - ''
          description: 'Condition of the specimen on receipt: satisfactory, insufficient, delayed.'
        clinicalHistory:
          type: string
          maxLength: 1000
          description: Clinical history and the question the assay was performed to answer.
        suspectedAgent:
          type: string
          maxLength: 500
          description: Suspected agent(s) ingested or implicated.
        timeSinceIngestionHours:
          type:
          - number
          - 'null'
          format: double
          description: Hours elapsed between ingestion and specimen collection, for nomogram and timing
            interpretation.
        paracetamolLevelMgL:
          type:
          - number
          - 'null'
          format: double
          description: Paracetamol (acetaminophen) level in mg/L; interpretable on the UK treatment nomogram
            only at >= 4 h post-ingestion.
        salicylateLevelMgL:
          type:
          - number
          - 'null'
          format: double
          description: Salicylate (aspirin) level in mg/L.
        ethanolLevel:
          type:
          - number
          - 'null'
          format: double
          description: Blood ethanol (alcohol) level in the reporting laboratory units (e.g. mg/dL or
            mmol/L).
        lithiumLevelMmolL:
          type:
          - number
          - 'null'
          format: double
          description: Lithium level in mmol/L; therapeutic range is narrow, toxicity at modest elevation.
        digoxinLevel:
          type:
          - number
          - 'null'
          format: double
          description: Digoxin level in the reporting laboratory units (e.g. ng/mL or nmol/L).
        carboxyhaemoglobinPercent:
          type:
          - number
          - 'null'
          format: double
          description: Carboxyhaemoglobin saturation as a percentage, for carbon-monoxide exposure.
        drugsOfAbuseScreen:
          type: string
          maxLength: 1000
          description: Drugs-of-abuse screen result narrative (opiates, benzodiazepines, cocaine, amphetamines,
            etc.).
        specificDrugLevel:
          type: string
          maxLength: 1000
          description: Named specific drug level result narrative for an agent not captured by a dedicated
            column.
        paracetamolNomogram:
          type: string
          enum:
          - above-treatment-line
          - below-treatment-line
          - not-applicable
          - ''
          description: 'Paracetamol treatment-nomogram interpretation: above-treatment-line, below-treatment-line,
            not-applicable.'
        overallResultStatus:
          type: string
          enum:
          - normal
          - abnormal
          - critical
          - ''
          description: 'Overall result status: normal, abnormal, critical.'
        toxicLevelPresent:
          type: boolean
          description: Whether any reported level is in a toxic range requiring action.
        findingsNarrative:
          type: string
          maxLength: 2000
          description: Narrative description of the result values and their significance (the body of
            the report).
        impression:
          type: string
          maxLength: 2000
          description: Summary impression / conclusion answering the clinical question.
        reportingCategory:
          type: string
          maxLength: 50
          description: Structured-reporting category label (e.g. a nomogram band or therapeutic / toxic
            descriptor).
        recommendedFollowUp:
          type: string
          maxLength: 1000
          description: Recommended follow-up assay, antidote, or management.
        criticalResultCommunicated:
          type: boolean
          description: Whether a critical or unexpected significant result was communicated directly to
            the requester.
        reportedTo:
          type: string
          maxLength: 500
          description: Who the critical / urgent result was communicated to, with date and time if applicable.
      required:
      - createdAt
      - updatedAt
      - patientId
      - clinicianId
      - originatingRequestReference
      - reportStatus
      - specimenCondition
      - clinicalHistory
      - suspectedAgent
      - drugsOfAbuseScreen
      - specificDrugLevel
      - paracetamolNomogram
      - overallResultStatus
      - toxicLevelPresent
      - findingsNarrative
      - impression
      - reportingCategory
      - recommendedFollowUp
      - criticalResultCommunicated
      - reportedTo
      description: Toxicology / poisons / therapeutic-drug-level test result (report). Captures the specimen
        condition, clinical history and suspected agent, the assay result values (paracetamol, salicylate,
        ethanol, lithium, digoxin, carboxyhaemoglobin, drugs-of-abuse screen, named specific drug), the
        paracetamol-nomogram interpretation, the overall result status, the narrative findings and impression,
        recommended follow-up, and critical-result communication. This is the source-of-truth record that
        the four-axis interpretation grade is computed from.
    ToxicologyTestResultGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        toxicologyTestResultId:
          type: string
          format: uuid
          description: Foreign key to the parent result (unique, 1:1).
        resultClassification:
          type: string
          enum:
          - normal
          - abnormal
          - critical
          - inconclusive
          - ''
          description: 'Axis A overall classification: normal, abnormal, critical, inconclusive.'
        abnormalitySeverity:
          type: string
          enum:
          - none
          - minor
          - moderate
          - major
          - ''
          description: 'Axis B abnormality severity: none, minor, moderate, major.'
        reportingCategory:
          type: string
          maxLength: 50
          description: Axis B structured-reporting score / category label (e.g. a paracetamol-nomogram
            band or therapeutic / toxic descriptor).
        reportCompletenessPercent:
          type:
