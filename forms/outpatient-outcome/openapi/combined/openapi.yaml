          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when this row was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when this row was deleted i.e. soft-removed.
        outpatient_outcome_id:
          type: string
          format: uuid
          description: Foreign key to the parent assessment (unique, enforcing 1:1).
        clinic_date:
          type: string
