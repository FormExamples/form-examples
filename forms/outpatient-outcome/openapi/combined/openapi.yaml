components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        name:
          type: string
          description: Name.
        email:
          type: string
          description: Email address.
        phone:
          type: string
          description: Phone number.
        postal_address_as_full_text:
          type: string
          description: Postal address as full text.
        country_as_iso_3166_1_alpha_2:
          type: string
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type: string
          description: Postal code, such as for validating the postal address.
        role:
          type: string
          enum:
          - anaesthetist
          - surgeon
          - preop-nurse
          - perioperative-physician
          - geriatrician
          - pharmacist
          - other
          - ''
          description: Clinician role.
        registration_body:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - GPhC
          - other
          - ''
          description: Clinician registration body.
        registration_number:
          type: string
          description: Clinician registration number.
        united_kingdom_nhs_number:
          type: string
          maxLength: 12
          description: United Kingdom NHS number, unique per person.
      required:
      - created_at
      - updated_at
      - name
      - role
      - registration_body
      - registration_number
      description: Clinician
    OutpatientOutcome:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when this row was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when this row was deleted i.e. soft-removed.
        patient_id:
          type: string
          format: uuid
          description: Foreign key to the patient who owns this assessment.
        status:
          type: string
          enum:
          - draft
          - submitted
          - reviewed
          - urgent
          description: 'Lifecycle status: draft, submitted, reviewed, or urgent.'
      required:
      - created_at
      - updated_at
      - patient_id
      - status
      description: Top-level assessment instance for outpatient-outcome-report. Parent entity for domain-specific
        sections and the grading result.
    OutpatientOutcomeClinical:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when this row was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when this row was deleted i.e. soft-removed.
        outpatient_outcome_id:
          type: string
          format: uuid
          description: Foreign key to the parent assessment (unique, enforcing 1:1).
        presenting_complaint:
          type: string
          description: Presenting complaint at the outpatient encounter.
        diagnosis:
          type: string
          description: Diagnosis confirmed or updated at this encounter.
        treatment_delivered:
          type: string
          description: Treatment, procedure, or intervention delivered at this encounter.
        outcome_classification:
          type: string
          enum:
          - resolved
          - improved
          - unchanged
          - worsened
          - died
          - ''
          description: 'Clinician-rated outcome: resolved, improved, unchanged, worsened, died, or empty.'
      required:
      - created_at
      - updated_at
      - outpatient_outcome_id
      - presenting_complaint
      - diagnosis
      - treatment_delivered
      - outcome_classification
      description: 'Clinician-rated clinical outcome for this encounter: presenting complaint, diagnosis,
        treatment, and five-level outcome classification.'
    OutpatientOutcomeEncounter:
      type: object
      properties:
        id:
          type: string
          format: uuid
