    OutpatientOutcomeGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when this row was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when this row was deleted i.e. soft-removed.
        outpatient_outcome_id:
          type: string
          format: uuid
          description: Foreign key to the parent assessment (unique, enforcing 1:1).
        overall_grade:
          type: string
          enum:
          - A
          - B
          - C
          - D
          - E
          - ''
          description: Overall OOCG grade A (best) - E (worst); equals the worst per-domain grade.
        clinical_grade:
          type: string
          enum:
          - A
          - B
          - C
          - D
          - E
          - ''
          description: Clinical-domain grade A-E (A=Resolved, B=Improved, C=Unchanged, D=Worsened, E=Died).
        prom_grade:
          type: string
          enum:
          - A
          - B
          - C
          - D
          - E
          - ''
          description: PROM-domain composite grade A-E over EQ-5D-5L, GRC, and PROMIS.
        prem_grade:
          type: string
          enum:
          - A
          - B
          - C
          - D
          - E
          - ''
