          type: string
          description: Free-text clinician notes accompanying the grading result.
        graded_at:
          type: string
          format: date-time
          description: Graded at.
      required:
      - created_at
      - updated_at
      - outpatient_outcome_id
      - overall_grade
      - clinical_grade
      - prom_grade
      - prem_grade
      - operational_grade
      - result_notes
      - graded_at
