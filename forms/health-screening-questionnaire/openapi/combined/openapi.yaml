components:
  schemas:
    Assessor:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Name.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        role:
          type: string
          enum:
          - occupational-health-nurse
          - general-practitioner
          - practice-nurse
          - physiotherapist
          - personal-trainer
          - gym-instructor
          - sports-therapist
          - hr-officer
          - other
          - ''
          description: Assessor role, spanning both clinical roles (occupational-health-nurse, general-practitioner,
            practice-nurse, physiotherapist) and non-clinical roles (personal-trainer, gym-instructor,
            sports-therapist, hr-officer).
        registrationBody:
          type: string
          description: Professional registration body, such as HCPC or NMC, where applicable. Blank for
            non-clinical assessors.
        registrationNumber:
          type: string
          description: Professional registration number issued by the registration body, where applicable.
        employer:
          type: string
          description: Employer, such as the employer commissioning an occupational-health screen, the
            gym or fitness studio, or the GP practice.
      required:
      - createdAt
      - updatedAt
      - name
      - role
      - registrationBody
      - registrationNumber
      - employer
      description: Assessor, i.e. the person who conducts the health screening questionnaire. Often not
        a clinician.
    HealthScreeningQuestionnaire:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the patient table, i.e. the person being screened.
        assessorId:
          type: string
          format: uuid
          description: Foreign key to the assessor table, i.e. the person conducting the screen.
        status:
          type: string
          enum:
          - draft
          - submitted
          - reviewed
          - urgent
          description: 'Questionnaire lifecycle status: draft, submitted, reviewed, or urgent.'
        screeningPurpose:
          type: string
          enum:
          - occupational-pre-placement
          - routine-public-health
          - perioperative-referral
          - physical-activity-readiness
          - other
          - ''
          description: 'Step 1: purpose of the screen, which determines whether step 10 (occupational
            factors) is shown.'
        siteName:
          type: string
          maxLength: 255
          description: 'Step 1: site where the screening took place.'
        assessmentDate:
          type:
          - string
          - 'null'
          format: date
          description: 'Step 1: date the screening was conducted.'
        assessmentMode:
          type: string
          enum:
          - in-person
          - telephone
          - online
          - ''
          description: 'Step 1: mode of assessment, in-person, telephone, or online.'
        usualActivityLevel:
          type: string
          enum:
          - sedentary
          - light
          - moderate
          - active
          - very-active
          - ''
          description: 'Step 3: usual physical activity level.'
        moderateExerciseDaysPerWeek:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Step 3: number of days per week with at least moderate exercise, 0 to 7.'
        fruitAndVegetablePortionsPerDay:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Step 3: typical fruit and vegetable portions eaten per day.'
        dietNotes:
          type: string
          description: 'Step 3: free-text diet notes.'
        smokingStatus:
          type: string
          enum:
          - never
          - ex-smoker
          - current-smoker
          - vapes-only
          - ''
          description: 'Step 4: smoking status.'
        cigarettesPerDay:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Step 4: cigarettes smoked per day, where applicable.'
        auditCFrequency:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Step 4: AUDIT-C item 1, frequency of drinking, 0 to 4.'
        auditCTypicalQuantity:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Step 4: AUDIT-C item 2, typical quantity per drinking day, 0 to 4.'
        auditCBingeFrequency:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Step 4: AUDIT-C item 3, frequency of six-or-more (binge) drinking, 0 to 4.'
        conditionDiabetes:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Step 5: diagnosed diabetes.'
        conditionHypertension:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Step 5: diagnosed hypertension.'
        conditionAsthma:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Step 5: diagnosed asthma.'
        conditionCopd:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Step 5: diagnosed chronic obstructive pulmonary disease.'
        conditionHeartDisease:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Step 5: diagnosed heart disease.'
        conditionKidneyDisease:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Step 5: diagnosed kidney disease.'
        conditionThyroid:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Step 5: diagnosed thyroid condition.'
        conditionOther:
          type: string
          maxLength: 500
          description: 'Step 5: other diagnosed chronic condition, free text.'
        pastSurgeries:
          type: string
          description: 'Step 5: past surgeries, free text.'
        currentMedications:
          type: string
          description: 'Step 5: current prescription medications, free text.'
        knownDrugAllergies:
          type: string
          description: 'Step 5: known drug allergies, free text.'
        familyHistoryPrematureCardiacEvent:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Step 6: premature (before age 60) heart attack or stroke in a first-degree relative.'
        familyHistoryOther:
          type: string
          description: 'Step 6: other hereditary conditions in the family, free text.'
        symptomUnexplainedChestPain:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Step 7: unexplained chest pain, a red-flag symptom driving the refer-urgently
            risk band.'
        symptomDizzySpellsOrFainting:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Step 7: dizzy spells or fainting, a red-flag symptom driving the refer-urgently
            risk band.'
        symptomPersistentCoughOver3Weeks:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Step 7: persistent cough lasting more than 3 weeks.'
        symptomUnexplainedWeightLoss:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Step 7: unexplained weight loss, which alone warrants GP review regardless of
            other findings.'
        symptomJointPainRestrictingMovement:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Step 7: joint pain restricting movement.'
        symptomShortnessOfBreathOnExertion:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Step 7: shortness of breath on exertion.'
        symptomPalpitations:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Step 7: palpitations.'
        parqDiagnosedHeartCondition:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Step 8, PAR-Q+ item 1: has a doctor ever diagnosed you with a heart condition.'
        parqChestPainAtRest:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Step 8, PAR-Q+ item 2: do you feel pain in your chest at rest.'
        parqChestPainDuringActivity:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Step 8, PAR-Q+ item 3: do you feel pain in your chest during, or caused by, physical
            activity in the last month.'
        parqDizzinessOrLossOfConsciousness:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Step 8, PAR-Q+ item 4: do you lose balance because of dizziness, or have you lost
            consciousness, in the last 12 months.'
        parqOtherChronicMedicalCondition:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Step 8, PAR-Q+ item 5: have you been diagnosed with another chronic medical condition.'
        parqPrescribedMedicationForChronicCondition:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Step 8, PAR-Q+ item 6: are you currently taking prescribed medication for a chronic
            medical condition.'
        parqBoneOrJointProblem:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Step 8, PAR-Q+ item 7: do you have a bone, joint, or soft-tissue problem that
            could be made worse by becoming more physically active.'
        heightAsCm:
          type:
          - number
          - 'null'
          format: double
          description: 'Step 9: height measurement in cm, optional.'
        weightAsKg:
          type:
          - number
          - 'null'
          format: double
          description: 'Step 9: weight measurement in kg, optional.'
        bodyMassIndex:
          type:
          - number
          - 'null'
          format: double
          description: 'Step 9: body mass index, auto-computed from height and weight when both are present.'
        restingBloodPressureSystolic:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Step 9: resting systolic blood pressure in mmHg, optional.'
        restingBloodPressureDiastolic:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Step 9: resting diastolic blood pressure in mmHg, optional.'
        restingHeartRate:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Step 9: resting heart rate in beats per minute, optional.'
        jobRole:
          type: string
          maxLength: 255
          description: 'Step 10: job role, free text. Shown only for occupational-pre-placement screens.'
        physicalDemandsOfRole:
          type: string
          enum:
          - sedentary
          - light
          - moderate
          - heavy
          - ''
          description: 'Step 10: physical demands of the role.'
        exposureNoise:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Step 10: occupational noise exposure risk.'
        exposureChemicals:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Step 10: occupational chemical exposure risk.'
        exposureManualHandling:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Step 10: occupational manual-handling exposure risk.'
        exposureOther:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Step 10: another occupational exposure risk.'
        exposureOtherDetail:
          type: string
          maxLength: 500
          description: 'Step 10: detail of the other occupational exposure risk, free text.'
        stressLevel:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Step 11: self-reported stress level, 0 (none) to 4 (severe).'
        sleepQuality:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Step 11: self-reported sleep quality, 0 (very poor) to 4 (very good).'
        mentalHealthConcern:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Step 11: any current mental-health concern. Light-touch only; this monorepo has
            dedicated mental-health assessment forms.'
        mentalHealthConcernNote:
          type: string
          description: 'Step 11: optional note on the mental-health concern.'
        vaccinationUpToDate:
          type: string
          enum:
          - 'yes'
          - 'no'
          - unsure
          - ''
          description: 'Step 12: whether vaccinations are up to date.'
        vaccinationGapsNote:
          type: string
          description: 'Step 12: notable vaccination gaps, free text.'
        consentToScreening:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Step 13: consent to the screening.'
        informationAccurateConfirmed:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Step 13: confirmation that the information given is accurate to the best of the
            respondent''s knowledge.'
        interpreterRequired:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Step 13: whether an interpreter was required for this screening.'
      required:
      - createdAt
      - updatedAt
      - patientId
      - assessorId
      - status
      - screeningPurpose
      - siteName
      - assessmentMode
      - usualActivityLevel
      - dietNotes
      - smokingStatus
      - conditionDiabetes
      - conditionHypertension
      - conditionAsthma
      - conditionCopd
      - conditionHeartDisease
      - conditionKidneyDisease
      - conditionThyroid
      - conditionOther
      - pastSurgeries
      - currentMedications
      - knownDrugAllergies
      - familyHistoryPrematureCardiacEvent
      - familyHistoryOther
      - symptomUnexplainedChestPain
      - symptomDizzySpellsOrFainting
      - symptomPersistentCoughOver3Weeks
      - symptomUnexplainedWeightLoss
      - symptomJointPainRestrictingMovement
      - symptomShortnessOfBreathOnExertion
      - symptomPalpitations
      - parqDiagnosedHeartCondition
      - parqChestPainAtRest
      - parqChestPainDuringActivity
      - parqDizzinessOrLossOfConsciousness
      - parqOtherChronicMedicalCondition
      - parqPrescribedMedicationForChronicCondition
      - parqBoneOrJointProblem
      - jobRole
      - physicalDemandsOfRole
      - exposureNoise
      - exposureChemicals
      - exposureManualHandling
      - exposureOther
      - exposureOtherDetail
      - mentalHealthConcern
      - mentalHealthConcernNote
      - vaccinationUpToDate
      - vaccinationGapsNote
      - consentToScreening
      - informationAccurateConfirmed
      - interpreterRequired
      description: 'Health screening questionnaire, i.e. the payload of the 14-step single-page wizard:
        assessment context, personal details, lifestyle, medical and family history, symptom review, PAR-Q+
        screen, optional vital signs, occupational factors, wellbeing check, vaccination status, and consent.'
    HealthScreeningQuestionnaireGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        healthScreeningQuestionnaireId:
          type: string
          format: uuid
          description: Foreign key to the health_screening_questionnaire table, unique because grading
            is one-to-one with the questionnaire.
        parqPlusClearance:
          type: string
          enum:
          - cleared
          - further-assessment-required
          - ''
          description: 'PAR-Q+ clearance status: cleared when all 7 general health items are no, further-assessment-required
            when any item is yes.'
        auditCScore:
          type:
          - integer
          - 'null'
          format: int32
          description: AUDIT-C total score, 0 to 12, being the sum of the three items.
        auditCBand:
          type: string
          enum:
          - low
          - increasing-risk
          - higher-risk
          - ''
          description: 'AUDIT-C band: low, increasing-risk (score 5+ men / 4+ women), or higher-risk (score
            8+).'
        computedRiskBand:
          type: string
          enum:
          - low
          - moderate
          - high
          - refer-urgently
          - ''
          description: 'Composite risk band computed by the engine using the max-grade algorithm: low,
            moderate, high, or refer-urgently.'
        finalRiskBand:
          type: string
          enum:
          - low
          - moderate
          - high
          - refer-urgently
          - ''
          description: Composite risk band signed off by the assessor, which may equal or differ from
            the computed value.
        computedRecommendation:
          type: string
          enum:
          - clear-to-proceed
          - routine-review
          - gp-review-required
          - refer-urgently
          - paediatric-pathway
          - ''
          description: Referral recommendation computed by the engine from the risk band.
        finalRecommendation:
          type: string
          enum:
          - clear-to-proceed
          - routine-review
          - gp-review-required
          - refer-urgently
          - paediatric-pathway
          - ''
          description: Referral recommendation signed off by the assessor, which may equal or differ from
            the computed value.
        overrideReason:
          type: string
          maxLength: 500
          description: Reason the assessor set a final value differently from the computed value, mandatory
            when they differ.
        notes:
          type: string
          description: Free-text assessor summary notes.
        signedByName:
          type: string
          maxLength: 255
          description: Name of the assessor who signed the questionnaire.
        signedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Timestamp of the assessor electronic signature.
        gradedAt:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the result.
      required:
      - createdAt
      - updatedAt
      - healthScreeningQuestionnaireId
      - parqPlusClearance
      - auditCBand
      - computedRiskBand
      - finalRiskBand
      - computedRecommendation
      - finalRecommendation
      - overrideReason
      - notes
      - signedByName
      - gradedAt
      description: Computed and signed-off grading result for one health screening questionnaire. Stores
        both the engine-computed values and the assessor-final values with an override reason.
    HealthScreeningQuestionnaireGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        healthScreeningQuestionnaireGradeId:
          type: string
          format: uuid
          description: Foreign key to the parent health_screening_questionnaire_grade table.
        flagId:
          type: string
          maxLength: 50
          description: Stable flag identifier, such as F-URGENT-CARDIAC-SYMPTOM-001.
        category:
          type: string
          enum:
          - urgent-cardiac-symptom
          - parq-positive-medical-clearance-needed
          - alcohol-higher-risk
          - family-history-premature-cardiac-event
          - unexplained-weight-loss
          - occupational-restriction-indicated
          - vaccination-gap
          - paediatric
          - other
          - ''
          description: Flag category, such as urgent-cardiac-symptom or parq-positive-medical-clearance-needed.
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          - ''
          description: 'Priority: low, medium, or high.'
        description:
          type: string
          maxLength: 500
          description: Human-readable description of what fired the flag.
        suggestedAction:
          type: string
          maxLength: 500
          description: Suggested action, such as "same-day GP or emergency review".
      required:
      - createdAt
      - updatedAt
      - healthScreeningQuestionnaireGradeId
      - flagId
      - category
      - priority
      - description
      - suggestedAction
      description: Safety-critical flags that fire independently of the risk band, with a priority and
        a suggested action. Flags are never suppressed by an assessor override.
    Patient:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          maxLength: 255
          description: Name.
        birthDate:
          type:
          - string
          - 'null'
          format: date
          description: Birth date, such as for calculating age and for the paediatric safety flag.
        sex:
          type: string
          enum:
          - female
          - male
          - intersex
          - prefer-not-to-say
          - ''
          description: Sex, such as for the sex-adjusted AUDIT-C at-risk threshold.
        identifierType:
          type: string
          enum:
          - nhs-number
          - employee-number
          - other
          - ''
          description: 'Which identifier scheme identifier_value belongs to: an NHS number, an employer-issued
            employee number, or another scheme.'
        identifierValue:
          type: string
          maxLength: 50
          description: The identifier value itself, in the scheme named by identifier_type.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        emergencyContactName:
          type: string
          maxLength: 255
          description: Name of the emergency contact.
        emergencyContactRelationship:
          type: string
          maxLength: 100
          description: Relationship of the emergency contact to the patient.
        emergencyContactPhone:
          type: string
          maxLength: 50
          description: Phone number of the emergency contact.
      required:
      - createdAt
      - updatedAt
      - name
      - sex
      - identifierType
      - identifierValue
      - emergencyContactName
      - emergencyContactRelationship
      - emergencyContactPhone
      description: Patient, i.e. the person being screened.
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          description: A URI identifying the problem type
        title:
          type: string
          description: A short summary of the problem type
        status:
          type: integer
          description: The HTTP status code
        detail:
          type: string
          description: An explanation of this occurrence
        instance:
          type: string
          description: A URI identifying this occurrence
        code:
          type: string
          description: A short machine-readable reason
        errors:
          type: object
          description: Per-field detail, when validation failed
      required:
      - type
      - title
      - status
