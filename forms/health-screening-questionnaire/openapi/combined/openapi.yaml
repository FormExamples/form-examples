      description: 'Health screening questionnaire, i.e. the payload of the 14-step single-page wizard:
        assessment context, personal details, lifestyle, medical and family history, symptom review, PAR-Q+
        screen, optional vital signs, occupational factors, wellbeing check, vaccination status, and consent.'
    HealthScreeningQuestionnaireGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        health_screening_questionnaire_id:
          type: string
          format: uuid
          description: Foreign key to the health_screening_questionnaire table, unique because grading
            is one-to-one with the questionnaire.
        parq_plus_clearance:
          type: string
          enum:
          - cleared
          - further-assessment-required
          - ''
          description: 'PAR-Q+ clearance status: cleared when all 7 general health items are no, further-assessment-required
            when any item is yes.'
        audit_c_score:
          type: integer
          format: int32
          description: AUDIT-C total score, 0 to 12, being the sum of the three items.
        audit_c_band:
          type: string
          enum:
          - low
          - increasing-risk
          - higher-risk
          - ''
          description: 'AUDIT-C band: low, increasing-risk (score 5+ men / 4+ women), or higher-risk (score
            8+).'
        computed_risk_band:
          type: string
          enum:
          - low
          - moderate
          - high
          - refer-urgently
          - ''
          description: 'Composite risk band computed by the engine using the max-grade algorithm: low,
            moderate, high, or refer-urgently.'
        final_risk_band:
          type: string
          enum:
          - low
          - moderate
          - high
          - refer-urgently
          - ''
          description: Composite risk band signed off by the assessor, which may equal or differ from
            the computed value.
        computed_recommendation:
          type: string
          enum:
          - clear-to-proceed
          - routine-review
          - gp-review-required
          - refer-urgently
          - paediatric-pathway
          - ''
          description: Referral recommendation computed by the engine from the risk band.
        final_recommendation:
          type: string
          enum:
          - clear-to-proceed
          - routine-review
          - gp-review-required
          - refer-urgently
          - paediatric-pathway
          - ''
          description: Referral recommendation signed off by the assessor, which may equal or differ from
            the computed value.
        override_reason:
          type: string
          maxLength: 500
          description: Reason the assessor set a final value differently from the computed value, mandatory
            when they differ.
        notes:
          type: string
          description: Free-text assessor summary notes.
        signed_by_name:
          type: string
          maxLength: 255
          description: Name of the assessor who signed the questionnaire.
        signed_at:
          type: string
          format: date-time
          description: Timestamp of the assessor electronic signature.
        graded_at:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the result.
      required:
      - created_at
      - updated_at
      - health_screening_questionnaire_id
      - parq_plus_clearance
      - audit_c_band
      - computed_risk_band
      - final_risk_band
      - computed_recommendation
      - final_recommendation
      - override_reason
      - notes
      - signed_by_name
      - graded_at
      description: Computed and signed-off grading result for one health screening questionnaire. Stores
        both the engine-computed values and the assessor-final values with an override reason.
    HealthScreeningQuestionnaireGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        health_screening_questionnaire_grade_id:
          type: string
          format: uuid
          description: Foreign key to the parent health_screening_questionnaire_grade table.
        flag_id:
          type: string
          maxLength: 50
          description: Stable flag identifier, such as F-URGENT-CARDIAC-SYMPTOM-001.
        category:
          type: string
          enum:
          - urgent-cardiac-symptom
          - parq-positive-medical-clearance-needed
          - alcohol-higher-risk
          - family-history-premature-cardiac-event
          - unexplained-weight-loss
          - occupational-restriction-indicated
          - vaccination-gap
          - paediatric
          - other
          - ''
          description: Flag category, such as urgent-cardiac-symptom or parq-positive-medical-clearance-needed.
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          - ''
          description: 'Priority: low, medium, or high.'
        description:
          type: string
          maxLength: 500
          description: Human-readable description of what fired the flag.
        suggested_action:
          type: string
          maxLength: 500
          description: Suggested action, such as "same-day GP or emergency review".
      required:
      - created_at
      - updated_at
      - health_screening_questionnaire_grade_id
      - flag_id
      - category
      - priority
      - description
      - suggested_action
      description: Safety-critical flags that fire independently of the risk band, with a priority and
        a suggested action. Flags are never suppressed by an assessor override.
    Patient:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        name:
          type: string
          maxLength: 255
          description: Name.
        birth_date:
          type: string
          format: date
          description: Birth date, such as for calculating age and for the paediatric safety flag.
        sex:
          type: string
          enum:
          - female
          - male
          - intersex
          - prefer-not-to-say
          - ''
          description: Sex, such as for the sex-adjusted AUDIT-C at-risk threshold.
        identifier_type:
          type: string
          enum:
          - nhs-number
          - employee-number
          - other
          - ''
          description: 'Which identifier scheme identifier_value belongs to: an NHS number, an employer-issued
            employee number, or another scheme.'
        identifier_value:
          type: string
          maxLength: 50
          description: The identifier value itself, in the scheme named by identifier_type.
        email:
          type: string
          description: Email address.
        phone:
          type: string
          description: Phone number.
        emergency_contact_name:
          type: string
          maxLength: 255
          description: Name of the emergency contact.
        emergency_contact_relationship:
          type: string
          maxLength: 100
          description: Relationship of the emergency contact to the patient.
        emergency_contact_phone:
          type: string
          maxLength: 50
          description: Phone number of the emergency contact.
      required:
      - created_at
      - updated_at
      - name
      - sex
      - identifier_type
      - identifier_value
      - emergency_contact_name
      - emergency_contact_relationship
      - emergency_contact_phone
      description: Patient, i.e. the person being screened.
