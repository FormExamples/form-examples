components:
  schemas:
    ApgarScore:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        patient_id:
          type: string
          format: uuid
          description: Foreign key to the newborn patient being assessed (delete restricted).
        clinician_id:
          type: string
          format: uuid
          description: Foreign key to the attending clinician (optional; delete restricted).
        clinician_name:
          type: string
          maxLength: 255
          description: Name of the attending clinician as recorded on the assessment.
        clinician_role:
          type: string
          enum:
          - midwife
          - obstetrician
          - neonatologist
          - neonatal-nurse
          - paediatrician
          - other
          - ''
          description: 'Role of the attending clinician: midwife, obstetrician, neonatologist, neonatal-nurse,
            paediatrician, or other.'
        born_at:
          type: string
          format: date-time
          description: Date and time of birth.
        care_setting:
          type: string
          enum:
          - delivery-room
          - theatre
          - birth-centre
          - home
          - neonatal-unit
          - other
          - ''
          description: 'Care setting where the birth took place: delivery-room, theatre, birth-centre,
            home, neonatal-unit, or other.'
        gestational_age_weeks:
          type: number
          format: double
          description: Gestational age at birth, in completed weeks.
        mode_of_delivery:
          type: string
          enum:
          - vaginal
          - assisted
          - caesarean
          - other
          - ''
          description: 'Mode of delivery: vaginal, assisted, caesarean, or other.'
        newborn_identifier:
          type: string
          maxLength: 100
          description: Local identifier for the newborn as recorded on the assessment.
        sex:
          type: string
          enum:
          - female
          - male
          - intersex
          - unknown
          - ''
          description: 'Newborn sex: female, male, intersex, or unknown.'
        birth_order:
          type: integer
          format: int32
          description: Birth order for multiple births (1 for a singleton).
        resuscitation_measures:
          type: string
          description: Free-text description of resuscitation measures given (drying, stimulation, oxygen,
            IPPV, chest compressions, etc.).
        clinician_note:
          type: string
          description: Free-text clinical note recorded with the assessment.
      required:
      - created_at
      - updated_at
      - patient_id
      - clinician_name
      - clinician_role
      - care_setting
      - mode_of_delivery
      - newborn_identifier
      - sex
      - resuscitation_measures
      - clinician_note
      description: 'Parent Apgar-score assessment record: birth context, newborn identification, and resuscitation
        notes; the repeated five-sign scores are held in the apgar_score_timepoint child table.'
    ApgarScoreGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the row was soft-deleted.
        apgar_score_id:
          type: string
          format: uuid
          description: Foreign key to the parent assessment (unique, 1:1).
        total_one_minute:
          type: integer
          format: int32
          description: Derived total (0-10) at the 1-minute timepoint, when scored.
        total_five_minute:
          type: integer
          format: int32
          description: Derived total (0-10) at the 5-minute timepoint, when scored.
        total_ten_minute:
          type: integer
          format: int32
          description: Derived total (0-10) at the 10-minute timepoint, when scored (expected whenever
            the 5-minute total is below 7).
        band_one_minute:
          type: string
          enum:
          - reassuring
          - moderately-low
          - low
          - ''
          description: 'Derived band at the 1-minute timepoint: reassuring (7-10), moderately-low (4-6),
            or low (0-3).'
        band_five_minute:
          type: string
          enum:
          - reassuring
          - moderately-low
          - low
          - ''
          description: 'Derived band at the 5-minute timepoint: reassuring (7-10), moderately-low (4-6),
            or low (0-3).'
        band_ten_minute:
          type: string
          enum:
          - reassuring
          - moderately-low
          - low
          - ''
          description: 'Derived band at the 10-minute timepoint: reassuring (7-10), moderately-low (4-6),
            or low (0-3).'
        summary_band:
          type: string
          enum:
          - reassuring
          - moderately-low
          - low
          - ''
          description: 'Overall summary band: the worst (lowest) band observed across scored timepoints.'
        trend:
          type: string
          enum:
          - improving
          - static
          - falling
          - insufficient
          - ''
          description: 'Trend across consecutive scored timepoints: improving, static, falling, or insufficient
            (fewer than two scored timepoints).'
        graded_at:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the grade.
      required:
      - created_at
      - updated_at
      - apgar_score_id
      - band_one_minute
      - band_five_minute
      - band_ten_minute
      - summary_band
      - trend
      - graded_at
      description: 'Computed Apgar grading result (1:1): per-timepoint totals and bands for the canonical
        1/5/10-minute timepoints, an overall summary band, and the trend across scored timepoints.'
    ApgarScoreGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the row was soft-deleted.
        apgar_score_grade_id:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        flag_id:
          type: string
          maxLength: 50
          description: Stable flag identifier (e.g. F-RESUSCITATION-NEEDED-001).
        category:
          type: string
          enum:
          - resuscitation-needed
          - continue-scoring
          - falling-trend
          - support-and-stimulation
          - missing-ten-minute-score
          - incomplete-assessment
          - other
          - ''
          description: 'Flag category (see CHECK constraint for enumeration): resuscitation-needed, continue-scoring,
            falling-trend, support-and-stimulation, missing-ten-minute-score, incomplete-assessment, or
            other.'
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          - ''
          description: 'Priority: low, medium, high.'
        description:
          type: string
          maxLength: 500
          description: Human-readable description of what fired the flag.
        suggested_action:
          type: string
          maxLength: 500
          description: Suggested clinical action (e.g. "commence active resuscitation and obtain neonatal
            support").
      required:
      - created_at
      - updated_at
      - apgar_score_grade_id
      - flag_id
      - category
      - priority
      - description
      - suggested_action
      description: Red-flag issues that fire independently of the totals, with priority and a suggested
        action for the clinical team.
    ApgarScoreGradeRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the row was soft-deleted.
        apgar_score_grade_id:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        rule_id:
          type: string
          maxLength: 40
          description: Stable rule identifier (e.g. R-TOTAL-BAND-01, R-TREND-FALLING-01).
        timepoint_minutes:
          type: integer
          format: int32
          description: Timepoint in minutes the rule applies to (1, 5, 10, ...); null for cross-timepoint
            rules such as trend.
        sign:
          type: string
          enum:
          - appearance
          - pulse
          - grimace
          - activity
          - respiration
          - total
          - trend
          - ''
          description: 'Scored sign the rule belongs to: appearance, pulse, grimace, activity, respiration,
            total (per-timepoint sum), or trend (across timepoints).'
        points:
          type: integer
          format: int32
          description: Points (0-2 for a sign, 0-10 for a total) contributed by this rule.
        category:
          type: string
          maxLength: 50
          description: Subject category (e.g. sign-score, total-band, trend-band).
        description:
          type: string
          maxLength: 500
          description: Human-readable description of why the rule fired.
      required:
      - created_at
      - updated_at
      - apgar_score_grade_id
      - rule_id
      - sign
      - category
      - description
