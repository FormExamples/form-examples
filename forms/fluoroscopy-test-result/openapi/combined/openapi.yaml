components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Name.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as full text.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code, such as for validating the postal address.
        role:
          type: string
          enum:
          - radiologist
          - consultant
          - reporting-radiographer
          - other
          - ''
          description: 'Reporting clinician role: radiologist, consultant, reporting-radiographer, other.'
        registrationBody:
          type: string
          enum:
          - GMC
          - HCPC
          - other
          - ''
          description: 'Clinician registration body: GMC, HCPC, other.'
        registrationNumber:
          type: string
          description: Clinician registration number.
        unitedKingdomNhsNumber:
          type:
          - string
          - 'null'
          maxLength: 12
          description: United Kingdom NHS number, unique per person.
      required:
      - createdAt
      - updatedAt
      - name
      - role
      - registrationBody
      - registrationNumber
      description: Reporting clinician (radiologist, consultant, or reporting radiographer) who authors
        and signs the fluoroscopy result report.
    FluoroscopyTestResult:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the patient.
        clinicianId:
          type: string
          format: uuid
          description: Foreign key to the reporting clinician (radiologist / consultant / reporting radiographer).
        originatingRequestReference:
          type: string
          maxLength: 255
          description: Free-text reference linking this report back to the originating fluoroscopy request
            (referral).
        reportStatus:
          type: string
          enum:
          - preliminary
          - final
          - amended
          - cancelled
          - ''
          description: 'Report lifecycle status: preliminary, final, amended, cancelled.'
        performedDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the fluoroscopy examination was performed.
        reportedDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the report was authored / signed.
        studyType:
          type: string
          enum:
          - barium-swallow
          - barium-meal
          - barium-follow-through
          - barium-enema
          - water-soluble-contrast-swallow
          - defecating-proctogram
          - hysterosalpingogram
          - micturating-cystourethrogram
          - arthrogram
          - fluoroscopy-guided-procedure
          - other
          - ''
          description: 'Performed fluoroscopy study type: barium-swallow, barium-meal, barium-follow-through,
            barium-enema, water-soluble-contrast-swallow, defecating-proctogram, hysterosalpingogram,
            micturating-cystourethrogram, arthrogram, fluoroscopy-guided-procedure, other.'
        contrastUsed:
          type: string
          enum:
          - barium
          - water-soluble-iodinated
          - none
          - ''
          description: 'Contrast actually administered: barium, water-soluble-iodinated, none.'
        examinationAdequacy:
          type: string
          enum:
          - adequate
          - limited
          - non-diagnostic
          - ''
          description: 'Diagnostic adequacy of the examination: adequate, limited, non-diagnostic.'
        screeningTimeMinutes:
          type:
          - number
          - 'null'
          format: double
          description: Total fluoroscopy screening time in minutes, for dose audit.
        clinicalHistory:
          type: string
          maxLength: 1000
          description: Clinical history and the question the examination was performed to answer.
        comparisonWithPrevious:
          type: string
          maxLength: 1000
          description: Comparison with relevant previous imaging studies.
        findingsNarrative:
          type: string
          maxLength: 2000
          description: Narrative description of the imaging findings (the body of the report).
        stricture:
          type: boolean
          description: Whether a stricture (luminal narrowing) is present.
        reflux:
          type: boolean
          description: Whether reflux (e.g. gastro-oesophageal, vesico-ureteric) is demonstrated.
        obstruction:
          type: boolean
          description: Whether an obstruction is present.
        perforationOrLeak:
          type: boolean
          description: Whether a perforation or contrast leak / extravasation is present (a critical finding).
        fistula:
          type: boolean
          description: Whether a fistulous tract is demonstrated.
        fillingDefect:
          type: boolean
          description: Whether a filling defect (e.g. mass, polyp, food bolus) is present.
        dysmotility:
          type: boolean
          description: Whether abnormal motility (e.g. achalasia, dysmotility) is demonstrated.
        normalStudy:
          type: boolean
          description: Whether the study is reported as normal (no significant abnormality).
        incidentalFinding:
          type: boolean
          description: Whether one or more incidental findings warranting documentation are present.
        impression:
          type: string
          maxLength: 2000
          description: Summary impression / conclusion answering the clinical question.
        reportingCategory:
          type: string
          maxLength: 50
          description: Structured-reporting category / label recorded on the report (free text).
        recommendedFollowUp:
          type: string
          maxLength: 1000
          description: Recommended follow-up imaging, referral, or management.
        criticalResultCommunicated:
          type: boolean
          description: Whether a critical or unexpected significant result was communicated directly to
            the referrer.
        reportedTo:
          type: string
          maxLength: 500
          description: Who the critical / urgent result was communicated to, with date and time if applicable.
      required:
      - createdAt
      - updatedAt
      - patientId
      - clinicianId
      - originatingRequestReference
      - reportStatus
      - studyType
      - contrastUsed
      - examinationAdequacy
      - clinicalHistory
      - comparisonWithPrevious
      - findingsNarrative
      - stricture
      - reflux
      - obstruction
      - perforationOrLeak
      - fistula
      - fillingDefect
      - dysmotility
      - normalStudy
      - incidentalFinding
      - impression
      - reportingCategory
      - recommendedFollowUp
      - criticalResultCommunicated
      - reportedTo
      description: Fluoroscopy / contrast-study result (report). Captures the performed examination (barium
        / water-soluble / proctogram / hysterosalpingogram / cystourethrogram / arthrogram / fluoroscopy-guided
        procedure), the contrast used, screening time, clinical history, the narrative and structured
        findings, the impression and structured-reporting category, recommended follow-up, and critical-result
        communication. This is the source-of-truth record that the four-axis interpretation grade is computed
        from.
    FluoroscopyTestResultGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        fluoroscopyTestResultId:
          type: string
          format: uuid
          description: Foreign key to the parent result (unique, 1:1).
        resultClassification:
          type: string
          enum:
          - normal
          - abnormal
          - critical
          - inconclusive
          - ''
          description: 'Axis A overall classification: normal, abnormal, critical, inconclusive.'
        abnormalitySeverity:
          type: string
          enum:
          - none
          - minor
          - moderate
          - major
          - ''
          description: 'Axis B abnormality severity: none, minor, moderate, major.'
        reportingCategory:
          type: string
          maxLength: 50
          description: Axis B structured-reporting score / category label.
        reportCompletenessPercent:
          type:
          - integer
          - 'null'
          format: int32
          description: Axis C report completeness as a percentage of mandatory report sections (0-100).
        followUpUrgency:
          type: string
          enum:
          - routine
          - recommended
          - urgent
          - critical-alert
          - ''
          description: 'Axis D follow-up urgency: routine, recommended, urgent, critical-alert.'
        targetTimeframe:
          type: string
          maxLength: 50
          description: Target timeframe for the recommended follow-up implied by the urgency.
        recommendedAction:
          type: string
          maxLength: 500
          description: Axis D concise recommended action derived from the urgency.
        recommendation:
          type: string
          enum:
          - no-action
          - routine-follow-up
          - further-imaging
          - specialist-referral
          - urgent-review
          - ''
          description: 'Overall recommendation: no-action, routine-follow-up, further-imaging, specialist-referral,
            urgent-review.'
        clinicianNotes:
          type: string
          description: Free-text interpretation / sign-off notes.
        signedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Timestamp of the reporting clinician electronic signature.
        gradedAt:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the result.
      required:
      - createdAt
      - updatedAt
      - fluoroscopyTestResultId
      - resultClassification
      - abnormalitySeverity
      - reportingCategory
      - followUpUrgency
      - targetTimeframe
      - recommendedAction
      - recommendation
      - clinicianNotes
      - gradedAt
      description: 'Computed four-axis interpretation grade: result classification, abnormality severity
        / structured-reporting category, report completeness, and follow-up urgency. A critical finding
        (perforation / leak, high-grade obstruction) auto-escalates the follow-up urgency to critical-alert
        regardless of the other axes.'
    FluoroscopyTestResultGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        fluoroscopyTestResultGradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        flagId:
          type: string
          maxLength: 50
          description: Stable flag identifier (e.g. F-CRITICAL-RESULT-001).
        category:
          type: string
          enum:
          - critical-result-alert
          - incidental-finding
          - discrepancy-with-request
          - abnormal-requiring-action
          - urgent-referral
          - inadequate-technique
          - unexpected-finding
          - missing-impression
          - missing-measurement
          - other
          - ''
          description: Flag category.
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          - ''
          description: 'Priority: low, medium, high.'
        description:
          type: string
          maxLength: 500
          description: Human-readable description of what fired the flag.
        suggestedAction:
          type: string
          maxLength: 500
          description: Suggested clinical action (e.g. "communicate critical result to referrer and document").
      required:
      - createdAt
      - updatedAt
      - fluoroscopyTestResultGradeId
      - flagId
      - category
      - priority
      - description
      - suggestedAction
      description: Safety-critical flags that fire independently of the four axes, with priority and a
        suggested action for the reporting / referring team.
    FluoroscopyTestResultGradeRule:
      type: object
      properties:
        id:
