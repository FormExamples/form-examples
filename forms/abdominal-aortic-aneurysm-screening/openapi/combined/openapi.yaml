components:
  schemas:
    AbdominalAorticAneurysmScreening:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the patient this screening documents (restrict delete).
        clinicianId:
          type:
          - string
          - 'null'
          format: uuid
          description: Foreign key to the screening technician clinician (restrict delete); optional.
        technicianName:
          type: string
          description: Name of the screening technician performing the scan.
        technicianRole:
          type: string
          enum:
          - screening-technician
          - clinical-skills-trainer
          - other
          - ''
          description: 'Role of the person performing the scan: screening-technician, clinical-skills-trainer,
            or other.'
        clinicSite:
          type: string
          description: Clinic or site name where the scan was performed.
        scannedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Date and time the ultrasound scan was performed.
        deviceIdentifier:
          type: string
          description: Ultrasound device identifier.
        patientIdentifier:
          type: string
          maxLength: 100
          description: NHS number or local patient identifier as recorded on the record.
        age:
          type:
          - integer
          - 'null'
          format: int32
          description: Patient age in years.
        sex:
          type: string
          enum:
          - female
          - male
          - intersex
          - unknown
          - ''
          description: 'Patient sex: female, male, intersex, or unknown.'
        eligibilityRoute:
          type: string
          enum:
          - routine-year-of-65
          - self-referral-over-65
          - other
          - ''
          description: 'Route into screening: routine-year-of-65, self-referral-over-65, or other.'
        scanType:
          type: string
          enum:
          - first-scan
          - surveillance-rescan
          - ''
          description: 'Scan type: first-scan or surveillance-rescan.'
        consentGiven:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether informed consent to the scan was given (yes/no); anything other than yes
            raises the incomplete flag.
        leafletProvided:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the information leaflet was given to the patient (yes/no).
        consentNote:
          type: string
          description: Free-text detail of any refusal or consent query.
        aortaVisualised:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the aorta was adequately visualised (yes/no); no forces the non-visualised
            classification and re-scan.
        maxAorticDiameterCm:
          type:
          - number
          - 'null'
          format: double
          description: Maximum antero-posterior aortic diameter in centimetres; the value that drives
            classification.
        priorMaxDiameterCm:
          type:
          - number
          - 'null'
          format: double
          description: Prior maximum aortic diameter in centimetres (surveillance patients); with the
            current diameter yields growth.
        priorScanDate:
          type:
          - string
          - 'null'
          format: date
          description: Date of the prior scan (surveillance patients).
        symptomatic:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the patient reports abdominal or back pain or tenderness (yes/no); yes
            with an aneurysm present raises the symptomatic-aneurysm flag.
        incidentalFindings:
          type: string
          description: Free-text incidental findings noted during the scan.
        resultNote:
          type: string
          description: Optional free-text result note shown in the summary.
      required:
      - createdAt
      - updatedAt
      - patientId
      - technicianName
      - technicianRole
      - clinicSite
      - deviceIdentifier
      - patientIdentifier
      - sex
      - eligibilityRoute
      - scanType
      - consentGiven
      - leafletProvided
      - consentNote
      - aortaVisualised
      - symptomatic
      - incidentalFindings
      - resultNote
      description: 'Main abdominal-aortic-aneurysm-screening record for one aortic ultrasound scan: scan
        context, patient identification and eligibility, consent, the ultrasound measurement (maximum
        antero-posterior aortic diameter), and clinical observations. Classification, fired rules, and
        flags live in child tables.'
    AbdominalAorticAneurysmScreeningGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        abdominalAorticAneurysmScreeningId:
          type: string
          format: uuid
          description: Foreign key to the parent abdominal-aortic-aneurysm-screening record (unique, 1:1).
        category:
          type: string
          enum:
          - normal
          - small
          - medium
          - large
          - non-visualised
          - ''
          description: 'Diameter category: normal (< 3.0 cm), small (3.0-4.4 cm), medium (4.5-5.4 cm),
            large (>= 5.5 cm), or non-visualised.'
        surveillanceBand:
          type: string
          enum:
          - discharge
          - annual
          - three-monthly
          - refer-vascular
          - rescan
          - ''
          description: 'Surveillance/referral band: discharge, annual, three-monthly, refer-vascular,
            or rescan.'
        recommendedAction:
          type: string
          description: Human-readable recommended action derived from the category.
        growthCm:
          type:
          - number
          - 'null'
          format: double
          description: Interval growth in centimetres (current minus prior diameter) when both are present;
            null otherwise.
        gradedAt:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the classification.
      required:
      - createdAt
      - updatedAt
      - abdominalAorticAneurysmScreeningId
      - category
      - surveillanceBand
      - recommendedAction
      - gradedAt
      description: 'Computed diameter classification for an abdominal-aortic-aneurysm-screening record:
        category, surveillance/referral band, recommended action, and interval growth.'
    AbdominalAorticAneurysmScreeningGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        abdominalAorticAneurysmScreeningGradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        flagId:
          type: string
          maxLength: 50
          description: Stable flag identifier (e.g. F-VASCULAR-REFERRAL-001).
        category:
          type: string
          enum:
          - vascular-referral
          - symptomatic-aneurysm
          - rapid-growth
          - non-visualised
          - incomplete
          - other
          - ''
          description: 'Flag category: vascular-referral, symptomatic-aneurysm, rapid-growth, non-visualised,
            incomplete, or other.'
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          - ''
          description: 'Priority: low, medium, high.'
        description:
          type: string
          maxLength: 500
          description: Human-readable description of what fired the flag.
        suggestedAction:
          type: string
          maxLength: 500
          description: Suggested clinical or service action (e.g. "refer to vascular surgery", "arrange
            a re-scan").
      required:
      - createdAt
      - updatedAt
      - abdominalAorticAneurysmScreeningGradeId
      - flagId
      - category
      - priority
      - description
      - suggestedAction
      description: Safety flags that fire independently of the category, with priority and a suggested
        action for the screening technician or screening service.
    AbdominalAorticAneurysmScreeningGradeRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        abdominalAorticAneurysmScreeningGradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        ruleId:
          type: string
          maxLength: 40
          description: Stable rule identifier (e.g. R-CLASSIFICATION-LARGE-01).
        stage:
          type: string
          enum:
          - visualisation
          - classification
          - growth
          - completeness
          - ''
          description: 'Pathway stage the rule concerns: visualisation, classification, growth, or completeness.'
        category:
          type: string
          maxLength: 50
          description: Subject category (e.g. guard, classification, growth, conditional-requirement).
        description:
          type: string
          maxLength: 500
          description: Human-readable description of why the rule fired.
      required:
      - createdAt
      - updatedAt
      - abdominalAorticAneurysmScreeningGradeId
      - ruleId
      - stage
      - category
      - description
      description: 'Audit trail of every classification rule that fired during grading: pathway stage,
        category, and description.'
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Screening technician full name.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as a single text block.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code.
        role:
          type: string
          enum:
          - screening-technician
          - clinical-skills-trainer
          - vascular
          - other
          - ''
          description: 'Scanner role: screening-technician, clinical-skills-trainer, vascular, or other.'
        registrationBody:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - GPhC
          - other
          - ''
          description: 'Professional registration body: GMC, NMC, HCPC, GPhC, or other.'
        registrationNumber:
          type: string
          description: Professional registration number issued by the registration body.
      required:
      - createdAt
      - updatedAt
      - name
      - role
      - registrationBody
      - registrationNumber
      description: Clinician identifying information for the screening technician who performed the abdominal
        aortic ultrasound scan.
    Patient:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          maxLength: 255
          description: Full patient name.
        birthDate:
          type: string
          format: date
          description: Date of birth.
        sex:
          type: string
          enum:
          - female
          - male
          - intersex
          - unknown
          - ''
          description: 'Sex recorded for clinical purposes: female, male, intersex, or unknown.'
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as a single text block.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code.
        unitedKingdomNhsNumber:
          type:
          - string
          - 'null'
          maxLength: 20
          description: United Kingdom NHS number, unique per person.
        hospitalMrn:
          type:
          - string
          - 'null'
          maxLength: 50
          description: Local hospital medical record number (MRN).
        heightAsCm:
          type:
          - number
          - 'null'
          format: double
          description: Height in centimetres.
        weightAsKg:
          type:
          - number
          - 'null'
          format: double
          description: Weight in kilograms.
        bodyMassIndex:
          type:
          - number
          - 'null'
          format: double
          description: Body mass index (BMI), kg/m^2.
        allergiesSummary:
          type: string
          description: Free-text summary of known allergies.
      required:
      - createdAt
      - updatedAt
      - name
      - birthDate
      - sex
      - allergiesSummary
      description: Patient demographic information used by the abdominal-aortic-aneurysm-screening record.
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          description: A URI identifying the problem type
        title:
          type: string
          description: A short summary of the problem type
        status:
          type: integer
          description: The HTTP status code
        detail:
          type: string
          description: An explanation of this occurrence
        instance:
          type: string
          description: A URI identifying this occurrence
        code:
          type: string
          description: A short machine-readable reason
        errors:
          type: object
          description: Per-field detail, when validation failed
      required:
      - type
      - title
      - status
