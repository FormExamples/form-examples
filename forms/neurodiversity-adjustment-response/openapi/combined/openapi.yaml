        rationale, which adjustments were agreed (and any alternatives offered), the trial period and
        review date, support / resources / responsibilities, and any escalation. This is the source-of-truth
        record that the four-axis grade is computed from. Aligned with the ACAS reasonable-adjustment
        confirmation and review templates and the Equality Act 2010 duty to make reasonable adjustments.'
