          - worse
          - ''
          description: 'Change in the worker''s wellbeing / ability to work since the adjustments: improved,
            unchanged, worse.'
        barriers_detail:
          type: string
          maxLength: 1000
          description: Any remaining barriers or difficulties the worker still experiences.
        changes_needed:
          type: boolean
          description: Whether changes to the adjustments are needed as a result of the review.
        changes_detail:
          type: string
          maxLength: 2000
          description: Detail of the changes needed.
        updated_adjustments_detail:
          type: string
          maxLength: 2000
          description: Detail of the updated / newly agreed adjustments arising from the review.
        occupational_health_rereferral:
          type: boolean
          description: Whether an occupational-health re-referral has been made as a result of the review.
        escalated:
          type: boolean
          description: Whether the matter has been escalated (e.g. unresolved difficulty, dispute, or
            grievance).
        escalation_detail:
          type: string
          maxLength: 500
          description: Free-text detail of any escalation.
        notes:
          type: string
          maxLength: 1000
          description: Free-text notes accompanying the review.
      required:
      - created_at
      - updated_at
      - worker_id
      - manager_id
      - review_status
      - response_reference
      - review_method
      - effectiveness_working_environment
      - effectiveness_equipment_technology
      - effectiveness_working_arrangements
      - effectiveness_communication
      - effectiveness_support_mentoring
      - effectiveness_recruitment_process
      - effectiveness_policy_dress
      - effectiveness_other
      - worker_feedback
      - worker_satisfied
      - wellbeing_change
      - barriers_detail
      - changes_needed
      - changes_detail
      - updated_adjustments_detail
      - occupational_health_rereferral
      - escalated
      - escalation_detail
      - notes
      description: 'Neurodiversity reasonable-adjustments review: a periodic check of whether the agreed
        adjustments are still working, completed by the manager / HR with the worker. Captures the per-category
        effectiveness of the adjustments in place, the worker''s feedback and outcomes, any changes arising,
        and the next review date. This is the source-of-truth record that the four-axis grade is computed
        from. It is the review half of the ACAS request / confirmation / review cycle and follows the
        ACAS reasonable-adjustments review template.'
    NeurodiversityAdjustmentReviewGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        neurodiversity_adjustment_review_id:
          type: string
          format: uuid
          description: Foreign key to the parent review (unique, 1:1).
        effectiveness_band:
          type: string
          enum:
          - effective
          - partially-effective
          - ineffective
          - not-yet-assessed
          - ''
          description: 'Axis A overall effectiveness: effective, partially-effective, ineffective, not-yet-assessed.'
        wellbeing_risk_band:
          type: string
          enum:
          - ok
          - caution
          - high-risk
          - ''
          description: 'Axis B wellbeing risk band: ok, caution, high-risk.'
        completeness_percent:
          type: integer
          format: int32
          description: Axis C review completeness as a percentage of mandatory fields (0-100).
        next_step_urgency:
          type: string
          enum:
          - none
          - review-scheduled
          - adjust-now
          - escalate
          - ''
          description: 'Axis D next-step urgency: none, review-scheduled, adjust-now, escalate.'
        target_timeframe:
          type: string
          maxLength: 50
          description: Target timeframe for the next step, implied by the next-step urgency.
        recommendation:
          type: string
          enum:
          - maintain
          - adjust-adjustments
          - seek-occupational-health
          - schedule-next-review
          - escalate-to-hr
          - ''
          description: 'Overall recommendation: maintain, adjust-adjustments, seek-occupational-health,
            schedule-next-review, escalate-to-hr.'
        manager_notes:
          type: string
          description: Free-text sign-off notes from the manager or HR contact.
        signed_at:
          type: string
          format: date-time
          description: Timestamp of the manager / HR electronic signature.
        graded_at:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the grade.
      required:
      - created_at
      - updated_at
      - neurodiversity_adjustment_review_id
      - effectiveness_band
      - wellbeing_risk_band
      - next_step_urgency
      - target_timeframe
      - recommendation
      - manager_notes
      - graded_at
      description: 'Computed four-axis grade for a neurodiversity reasonable-adjustments review: overall
        effectiveness, wellbeing risk, review completeness, and next-step urgency. Any adjustment reported
        as not-working, a dissatisfied worker, declining wellbeing, or an escalation drives the wellbeing-risk
        axis and the next-step urgency regardless of the other axes.'
