components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Clinician full name.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as a single text block.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code.
        role:
          type: string
          enum:
          - emergency-physician
          - acute-physician
          - cardiologist
          - nurse
          - other
          - ''
          description: 'Primary clinical role: emergency-physician, acute-physician, cardiologist, nurse,
            or other.'
        registrationBody:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - GPhC
          - other
          - ''
          description: 'Professional registration body: GMC, NMC, HCPC, GPhC, or other.'
        registrationNumber:
          type: string
          description: Professional registration number issued by the registration body.
      required:
      - createdAt
      - updatedAt
      - name
      - role
      - registrationBody
      - registrationNumber
      description: Clinician identifying information for the assessing clinician.
    GraceScoreForAcuteCoronarySyndrome:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the patient being assessed (delete restricted).
        clinicianId:
          type:
          - string
          - 'null'
          format: uuid
          description: Foreign key to the assessing clinician (optional; delete restricted).
        clinicianName:
          type: string
          maxLength: 255
          description: Name of the assessing clinician as recorded on the assessment.
        clinicianRole:
          type: string
          enum:
          - emergency-physician
          - acute-physician
          - cardiologist
          - nurse
          - other
          - ''
          description: 'Role of the assessing clinician: emergency-physician, acute-physician, cardiologist,
            nurse, or other.'
        assessedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Date and time the assessment was performed.
        careSetting:
          type: string
          enum:
          - emergency-department
          - acute-medical-unit
          - coronary-care-unit
          - cardiology-ward
          - other
          - ''
          description: 'Care setting: emergency-department, acute-medical-unit, coronary-care-unit, cardiology-ward,
            or other.'
        presentationType:
          type: string
          enum:
          - nstemi
          - unstable-angina
          - stemi
          - ''
          description: 'Acute coronary syndrome presentation: nstemi, unstable-angina, or stemi.'
        patientIdentifier:
          type: string
          maxLength: 100
          description: Local patient identifier as recorded on the assessment.
        ageYears:
          type:
          - integer
          - 'null'
          format: int32
          description: Variable 1 — patient age in whole years.
        sex:
          type: string
          enum:
          - female
          - male
          - intersex
          - unknown
          - ''
          description: 'Patient sex recorded for the assessment: female, male, intersex, or unknown.'
        heartRate:
          type:
          - integer
          - 'null'
          format: int32
          description: Variable 2 — admission heart rate in beats per minute.
        systolicBloodPressure:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Variable 3 — admission systolic blood pressure in mmHg (inverse weight: lower
            pressure scores higher).'
        serumCreatinine:
          type:
          - number
          - 'null'
          format: double
          description: Variable 4 — measured serum creatinine (raw value; unit held separately). Normalised
            to mg/dL before banding.
        serumCreatinineUnit:
          type: string
          enum:
          - mg/dL
          - umol/L
          - ''
          description: 'Unit for the serum creatinine value: mg/dL or umol/L (umol/L divided by 88.4 to
            obtain mg/dL).'
        killipClass:
          type: string
          enum:
          - I
          - II
          - III
          - IV
          - ''
          description: 'Variable 5 — Killip class of heart-failure severity: I, II, III, or IV.'
        cardiacArrestAtAdmission:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Variable 6 — cardiac arrest at admission: yes or no.'
        stSegmentDeviation:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Variable 7 — ST-segment deviation on the admission ECG: yes or no.'
        elevatedCardiacEnzymes:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Variable 8 — elevated cardiac enzymes / troponin: yes or no.'
        clinicalNote:
          type: string
          description: Free-text clinical note recorded with the assessment.
      required:
      - createdAt
      - updatedAt
      - patientId
      - clinicianName
      - clinicianRole
      - careSetting
      - presentationType
      - patientIdentifier
      - sex
      - serumCreatinineUnit
      - killipClass
      - cardiacArrestAtAdmission
      - stSegmentDeviation
      - elevatedCardiacEnzymes
      - clinicalNote
      description: 'Main GRACE assessment record: assessment context, patient identification, and the
        eight GRACE variable inputs (age, heart rate, systolic blood pressure, serum creatinine, Killip
        class, cardiac arrest at admission, ST-segment deviation, elevated cardiac enzymes).'
    GraceScoreForAcuteCoronarySyndromeGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        graceScoreForAcuteCoronarySyndromeId:
          type: string
          format: uuid
          description: Foreign key to the parent assessment (unique, 1:1).
        graceScore:
          type:
          - integer
          - 'null'
          format: int32
          description: Weighted GRACE point total summed across the eight variable contributions.
        inHospitalRiskBand:
          type: string
          enum:
          - low
          - intermediate
          - high
          - ''
          description: 'In-hospital mortality band: low (<=108), intermediate (109-140), or high (>140).'
        sixMonthRiskBand:
          type: string
          enum:
          - low
          - intermediate
          - high
          - ''
          description: 'Six-month mortality band: low (<=88), intermediate (89-118), or high (>118).'
        overallBand:
          type: string
          enum:
          - low
          - intermediate
          - high
          - ''
          description: 'Overall risk category: the worse of the in-hospital and six-month bands (max-band
            rule).'
        invasiveStrategy:
          type: string
          description: Derived invasive-strategy recommendation keyed on the overall risk category (e.g.
            early angiography within 24 h for high risk).
        gradedAt:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the grade.
      required:
      - createdAt
      - updatedAt
      - graceScoreForAcuteCoronarySyndromeId
      - inHospitalRiskBand
      - sixMonthRiskBand
      - overallBand
      - invasiveStrategy
      - gradedAt
      description: 'Computed GRACE grading result: weighted point total, in-hospital and 6-month mortality
        risk bands, overall risk category (max-band rule), and the derived invasive-strategy recommendation.'
    GraceScoreForAcuteCoronarySyndromeGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        graceScoreForAcuteCoronarySyndromeGradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        flagId:
          type: string
          maxLength: 50
          description: Stable flag identifier (e.g. F-HIGH-RISK-EARLY-ANGIOGRAPHY-001).
