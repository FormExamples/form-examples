components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Clinician full name.
        email:
          type: string
          description: Email address.
        phone:
          type: string
          description: Phone number.
        postal_address_as_full_text:
          type: string
          description: Postal address as a single text block.
        country_as_iso_3166_1_alpha_2:
          type: string
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2.
        postcode:
          type: string
          description: Postal code.
        role:
          type: string
          enum:
          - emergency-physician
          - acute-physician
          - cardiologist
          - nurse
          - other
          - ''
          description: 'Primary clinical role: emergency-physician, acute-physician, cardiologist, nurse,
            or other.'
        registration_body:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - GPhC
          - other
          - ''
          description: 'Professional registration body: GMC, NMC, HCPC, GPhC, or other.'
        registration_number:
          type: string
          description: Professional registration number issued by the registration body.
      required:
      - created_at
      - updated_at
      - name
      - role
      - registration_body
      - registration_number
      description: Clinician identifying information for the assessing clinician.
    GraceScoreForAcuteCoronarySyndrome:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patient_id:
          type: string
          format: uuid
          description: Foreign key to the patient being assessed (delete restricted).
        clinician_id:
          type: string
          format: uuid
          description: Foreign key to the assessing clinician (optional; delete restricted).
        clinician_name:
          type: string
          maxLength: 255
          description: Name of the assessing clinician as recorded on the assessment.
        clinician_role:
          type: string
          enum:
          - emergency-physician
          - acute-physician
          - cardiologist
          - nurse
          - other
          - ''
          description: 'Role of the assessing clinician: emergency-physician, acute-physician, cardiologist,
            nurse, or other.'
        assessed_at:
          type: string
          format: date-time
          description: Date and time the assessment was performed.
        care_setting:
          type: string
          enum:
          - emergency-department
          - acute-medical-unit
          - coronary-care-unit
          - cardiology-ward
          - other
          - ''
          description: 'Care setting: emergency-department, acute-medical-unit, coronary-care-unit, cardiology-ward,
            or other.'
        presentation_type:
          type: string
          enum:
          - nstemi
          - unstable-angina
          - stemi
          - ''
          description: 'Acute coronary syndrome presentation: nstemi, unstable-angina, or stemi.'
        patient_identifier:
          type: string
          maxLength: 100
          description: Local patient identifier as recorded on the assessment.
        age_years:
          type: integer
          format: int32
          description: Variable 1 — patient age in whole years.
        sex:
          type: string
          enum:
          - female
          - male
          - intersex
          - unknown
          - ''
          description: 'Patient sex recorded for the assessment: female, male, intersex, or unknown.'
        heart_rate:
          type: integer
          format: int32
          description: Variable 2 — admission heart rate in beats per minute.
        systolic_blood_pressure:
          type: integer
          format: int32
          description: 'Variable 3 — admission systolic blood pressure in mmHg (inverse weight: lower
            pressure scores higher).'
        serum_creatinine:
          type: number
          format: double
          description: Variable 4 — measured serum creatinine (raw value; unit held separately). Normalised
            to mg/dL before banding.
        serum_creatinine_unit:
          type: string
          enum:
          - mg/dL
          - umol/L
          - ''
          description: 'Unit for the serum creatinine value: mg/dL or umol/L (umol/L divided by 88.4 to
            obtain mg/dL).'
        killip_class:
          type: string
          enum:
          - I
          - II
          - III
          - IV
          - ''
          description: 'Variable 5 — Killip class of heart-failure severity: I, II, III, or IV.'
        cardiac_arrest_at_admission:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Variable 6 — cardiac arrest at admission: yes or no.'
        st_segment_deviation:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Variable 7 — ST-segment deviation on the admission ECG: yes or no.'
        elevated_cardiac_enzymes:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Variable 8 — elevated cardiac enzymes / troponin: yes or no.'
        clinical_note:
          type: string
          description: Free-text clinical note recorded with the assessment.
      required:
      - created_at
      - updated_at
      - patient_id
      - clinician_name
      - clinician_role
      - care_setting
      - presentation_type
      - patient_identifier
      - sex
      - serum_creatinine_unit
      - killip_class
      - cardiac_arrest_at_admission
      - st_segment_deviation
      - elevated_cardiac_enzymes
      - clinical_note
      description: 'Main GRACE assessment record: assessment context, patient identification, and the
        eight GRACE variable inputs (age, heart rate, systolic blood pressure, serum creatinine, Killip
        class, cardiac arrest at admission, ST-segment deviation, elevated cardiac enzymes).'
    GraceScoreForAcuteCoronarySyndromeGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        grace_score_for_acute_coronary_syndrome_id:
          type: string
          format: uuid
          description: Foreign key to the parent assessment (unique, 1:1).
        grace_score:
          type: integer
          format: int32
          description: Weighted GRACE point total summed across the eight variable contributions.
        in_hospital_risk_band:
          type: string
          enum:
          - low
          - intermediate
          - high
          - ''
          description: 'In-hospital mortality band: low (<=108), intermediate (109-140), or high (>140).'
        six_month_risk_band:
          type: string
          enum:
          - low
          - intermediate
          - high
          - ''
          description: 'Six-month mortality band: low (<=88), intermediate (89-118), or high (>118).'
        overall_band:
          type: string
          enum:
          - low
          - intermediate
          - high
          - ''
          description: 'Overall risk category: the worse of the in-hospital and six-month bands (max-band
            rule).'
        invasive_strategy:
          type: string
          description: Derived invasive-strategy recommendation keyed on the overall risk category (e.g.
            early angiography within 24 h for high risk).
        graded_at:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the grade.
      required:
      - created_at
      - updated_at
      - grace_score_for_acute_coronary_syndrome_id
      - in_hospital_risk_band
      - six_month_risk_band
      - overall_band
      - invasive_strategy
      - graded_at
      description: 'Computed GRACE grading result: weighted point total, in-hospital and 6-month mortality
        risk bands, overall risk category (max-band rule), and the derived invasive-strategy recommendation.'
    GraceScoreForAcuteCoronarySyndromeGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        grace_score_for_acute_coronary_syndrome_grade_id:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        flag_id:
          type: string
          maxLength: 50
          description: Stable flag identifier (e.g. F-HIGH-RISK-EARLY-ANGIOGRAPHY-001).
        category:
          type: string
          enum:
          - high-risk-early-angiography
          - cardiac-arrest
          - killip-2-plus
          - hypotension
          - renal-impairment
          - st-segment-deviation
          - incomplete
          - other
          - ''
          description: 'Flag category (see CHECK constraint for enumeration): high-risk-early-angiography,
            cardiac-arrest, killip-2-plus, hypotension, renal-impairment, st-segment-deviation, incomplete,
            or other.'
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          - ''
          description: 'Priority: low, medium, high.'
        description:
          type: string
          maxLength: 500
          description: Human-readable description of what fired the flag.
        suggested_action:
          type: string
          maxLength: 500
          description: Suggested clinical action (e.g. "arrange coronary angiography within 24 h").
      required:
      - created_at
      - updated_at
      - grace_score_for_acute_coronary_syndrome_grade_id
      - flag_id
      - category
      - priority
      - description
      - suggested_action
      description: Red-flag issues that fire independently of the total score, with priority and a suggested
        action for the clinical team.
    GraceScoreForAcuteCoronarySyndromeGradeRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        grace_score_for_acute_coronary_syndrome_grade_id:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        rule_id:
          type: string
          maxLength: 40
          description: Stable rule identifier (e.g. R-AGE-BAND-04).
        variable:
          type: string
          enum:
          - age
          - heart-rate
          - systolic-bp
          - creatinine
          - killip
          - cardiac-arrest
          - st-deviation
          - cardiac-enzymes
          - band
          description: 'GRACE variable the contributor belongs to: age, heart-rate, systolic-bp, creatinine,
            killip, cardiac-arrest, st-deviation, cardiac-enzymes, or band.'
        points:
          type: integer
          format: int32
          description: Weighted points contributed by this variable to the GRACE total.
        category:
          type: string
          maxLength: 50
          description: Subject category (e.g. weighted-band, mortality-band).
        description:
          type: string
          maxLength: 500
          description: Human-readable description of why the rule fired.
      required:
      - created_at
      - updated_at
      - grace_score_for_acute_coronary_syndrome_grade_id
      - rule_id
      - variable
      - category
      - description
      description: 'Audit trail of every grading rule (per-variable point contributor) that fired during
        GRACE computation: GRACE variable, points contributed, category, and description.'
    Patient:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          maxLength: 255
          description: Full patient name.
        birth_date:
          type: string
          format: date
          description: Date of birth.
        sex:
          type: string
          enum:
          - female
          - male
          - intersex
          - unknown
          - ''
          description: 'Sex recorded for clinical purposes: female, male, intersex, or unknown.'
        email:
          type: string
          description: Email address.
        phone:
          type: string
          description: Phone number.
        postal_address_as_full_text:
          type: string
          description: Postal address as a single text block.
        country_as_iso_3166_1_alpha_2:
          type: string
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2.
        postcode:
          type: string
          description: Postal code.
        united_kingdom_nhs_number:
          type: string
          maxLength: 20
          description: United Kingdom NHS number, unique per person.
        hospital_mrn:
          type: string
          maxLength: 50
          description: Local hospital medical record number (MRN).
        height_as_cm:
          type: number
          format: double
          description: Height in centimetres.
        weight_as_kg:
          type: number
          format: double
          description: Weight in kilograms.
        body_mass_index:
          type: number
          format: double
          description: Body mass index (BMI), kg/m^2.
        allergies_summary:
          type: string
          description: Free-text summary of known allergies.
      required:
      - created_at
      - updated_at
      - name
      - birth_date
      - sex
      - allergies_summary
      description: Patient demographic information used by the GRACE assessment record.
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          description: A URI identifying the problem type
        title:
          type: string
          description: A short summary of the problem type
        status:
          type: integer
          description: The HTTP status code
        detail:
          type: string
          description: An explanation of this occurrence
        instance:
          type: string
          description: A URI identifying this occurrence
        code:
          type: string
          description: A short machine-readable reason
        errors:
          type: object
          description: Per-field detail, when validation failed
      required:
      - type
      - title
      - status
