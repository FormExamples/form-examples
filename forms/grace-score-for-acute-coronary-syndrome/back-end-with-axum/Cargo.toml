[workspace]

[workspace.package]
rust-version = "1.97"

[package]
name = "grace_score_for_acute_coronary_syndrome"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
publish = false
description = "GRACE Score for Acute Coronary Syndrome back-end JSON API"
default-run = "grace_score_for_acute_coronary_syndrome-cli"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace.dependencies]
axa = { version = "0.9", features = ["cursor-pagination", "queue", "ratelimit", "sqlx"] }

[dependencies]
axa = { workspace = true }
serde-saphyr = "2"
sqlx = { version = "0.9", default-features = false, features = ["chrono", "derive", "json", "macros", "migrate", "postgres", "runtime-tokio", "tls-rustls-ring-webpki", "uuid"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
tokio = { version = "1.54", default-features = false, features = [
  "rt-multi-thread",
  "signal",
  "sync",
] }
async-trait = { version = "0.1" }
axum = { version = "0.8" }
tracing = { version = "0.1" }
chrono = { version = "0.4", features = ["serde"] }
validator = { version = "0.21", features = ["derive"] }
uuid = { version = "1.29", features = ["serde", "v4"] }

[[bin]]
name = "grace_score_for_acute_coronary_syndrome-cli"
path = "src/grace_score_for_acute_coronary_syndrome/bin/main.rs"
required-features = []

[dev-dependencies]
axa = { workspace = true, features = ["testing"] }
serial_test = { version = "4.0.1" }
insta = { version = "1.49", features = ["redactions", "yaml", "filters"] }

[lib]
path = "src/grace_score_for_acute_coronary_syndrome/lib.rs"
