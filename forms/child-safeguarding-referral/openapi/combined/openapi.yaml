components:
  schemas:
    ChildSafeguardingReferral:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the child this referral concerns (restrict delete).
        clinicianId:
          type:
          - string
          - 'null'
          format: uuid
          description: Foreign key to the referrer making the referral (restrict delete); optional.
        referrerOrganisation:
          type: string
          description: Employing organisation of the referrer.
        referredAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Date and time the referral was made.
        relationshipToChild:
          type: string
          description: How the referrer knows the child.
        childAge:
          type:
          - number
          - 'null'
          format: double
          description: Age of the child in years, used as a fallback when the date of birth is unknown.
        childSetting:
          type: string
          description: Education or care setting the child attends (school, nursery, college).
        childReference:
          type: string
          description: NHS number or local unique reference for the child.
        childEthnicity:
          type: string
          description: Self-described ethnicity of the child where known.
        childFirstLanguage:
          type: string
          description: First language of the child, recorded for any interpreter need.
        childDisability:
          type: string
          description: Disability or communication need of the child.
        carers:
          type: string
          description: Parents or carers with parental responsibility.
        householdMembers:
          type: string
          description: Other members of the household.
        otherChildren:
          type: string
          description: Siblings or other children in the household.
        professionalsInvolved:
          type: string
          description: Professionals already involved (GP, school, existing social worker).
        concernDescription:
          type: string
          description: What the concern or allegation is (mandatory for a valid referral).
        concernOnset:
          type: string
          description: When and how the concern came to light.
        childDisclosed:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the child disclosed abuse (yes/no); yes raises the disclosure-of-abuse
            flag and drives urgent classification.
        referrerObservations:
          type: string
          description: Direct observations recorded by the referrer.
        primaryCategory:
          type: string
          enum:
          - physical
          - emotional
          - sexual
          - neglect
          - ''
          description: 'Primary category of abuse (mandatory): physical, emotional, sexual, or neglect.'
        additionalCategories:
          type: string
          description: Any further categories of abuse beyond the primary category.
        presentingEvidence:
          type: string
          description: Indicators and evidence presenting the concern.
        immediateDanger:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the child is in immediate danger (mandatory, yes/no); yes classifies the
            referral as an emergency.
        childWhereabouts:
          type: string
          description: Where the child is now.
        whoWithChild:
          type: string
          description: Who is currently with the child.
        allegedPersonInContact:
          type: string
          enum:
          - 'yes'
          - 'no'
          - unknown
          - ''
          description: Whether the alleged person is in contact with the child (yes/no/unknown); yes drives
            urgent classification.
        otherChildrenAtRisk:
          type: string
          enum:
          - 'yes'
          - 'no'
          - unknown
          - ''
          description: Whether siblings or other children are at risk (yes/no/unknown); yes raises the
            other-children-at-risk flag and drives urgent classification.
        consentSought:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether consent to refer was sought (yes/no).
        consentStatus:
          type: string
          enum:
          - given
          - refused
          - not-sought
          - ''
          description: 'Consent status: given, refused, or not-sought.'
        sharingBasisWithoutConsent:
          type: string
          enum:
          - risk-of-serious-harm
          - seeking-consent-increases-risk
          - not-applicable
          - ''
          description: 'Lawful basis for sharing without consent (mandatory when consent is not given):
            risk-of-serious-harm, seeking-consent-increases-risk, or not-applicable.'
        familyAware:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the child or family is aware of the referral (yes/no).
        unsafeToInformReason:
          type: string
          description: Why informing the child or family would increase risk.
        agenciesContacted:
          type: string
          description: Agencies already contacted (police, health, education).
        strategyDiscussionHeld:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether a strategy discussion has already been held (yes/no).
        previousSafeguardingHistory:
          type: string
          description: Prior safeguarding involvement if known; non-empty raises the previous-history
            flag.
        requestedAction:
          type: string
          description: Action requested of children's social care.
        referrerDeclaration:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the referrer confirms the accuracy of the referral (yes/no).
        notes:
          type: string
          description: Free-text notes shown in the summary.
      required:
      - createdAt
      - updatedAt
      - patientId
      - referrerOrganisation
      - relationshipToChild
      - childSetting
      - childReference
      - childEthnicity
      - childFirstLanguage
      - childDisability
      - carers
      - householdMembers
      - otherChildren
      - professionalsInvolved
      - concernDescription
      - concernOnset
      - childDisclosed
      - referrerObservations
      - primaryCategory
      - additionalCategories
      - presentingEvidence
      - immediateDanger
      - childWhereabouts
      - whoWithChild
      - allegedPersonInContact
      - otherChildrenAtRisk
      - consentSought
      - consentStatus
      - sharingBasisWithoutConsent
      - familyAware
      - unsafeToInformReason
      - agenciesContacted
      - strategyDiscussionHeld
      - previousSafeguardingHistory
      - requestedAction
      - referrerDeclaration
      - notes
      description: 'Main child-safeguarding-referral record: referrer context, child details, family and
        household, the concern or allegation, category of abuse, presenting evidence, immediate risk and
        safety, consent and information-sharing basis, who else is informed, and the action requested.
        Grade, fired rules, and flags live in child tables.'
    ChildSafeguardingReferralGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        childSafeguardingReferralId:
          type: string
          format: uuid
          description: Foreign key to the parent referral (unique, 1:1).
        status:
          type: string
          enum:
          - complete
          - partial
          - incomplete
          - ''
          description: 'Completeness/validity status: complete, partial, or incomplete.'
        urgency:
          type: string
          enum:
          - emergency
          - urgent
          - standard
          - ''
          description: 'Urgency classification: emergency (s47 + emergency services), urgent (s47 enquiry),
            or standard (s17 assessment). Always computed, even when the referral is incomplete.'
        completenessPercent:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Completeness percentage (0..100): answered mandatory and recommended fields /
            total mandatory and recommended fields x 100.'
        gradedAt:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the grade.
      required:
      - createdAt
      - updatedAt
      - childSafeguardingReferralId
      - status
      - urgency
      - gradedAt
      description: 'Computed grading result for a child safeguarding referral: completeness/validity status
        (complete/partial/incomplete), urgency classification (emergency/urgent/standard), and completeness
        percentage.'
    ChildSafeguardingReferralGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        childSafeguardingReferralGradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        flagId:
          type: string
          maxLength: 50
          description: Stable flag identifier (e.g. F-IMMEDIATE-DANGER-001).
        category:
          type: string
          enum:
          - immediate-danger
          - disclosure-of-abuse
          - sexual-abuse-category
          - other-children-at-risk
          - no-consent-basis
          - mandatory-field-missing
          - child-unaware-unsafe
          - previous-history
          - other
          - ''
          description: 'Flag category: immediate-danger, disclosure-of-abuse, sexual-abuse-category, other-children-at-risk,
            no-consent-basis, mandatory-field-missing, child-unaware-unsafe, previous-history, or other.'
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          - ''
          description: 'Priority: low, medium, high.'
        description:
          type: string
          maxLength: 500
          description: Human-readable description of what fired the flag.
        suggestedAction:
          type: string
          maxLength: 500
          description: Suggested safeguarding action (e.g. "escalate to emergency services now", "record
            a lawful basis for sharing without consent").
      required:
      - createdAt
      - updatedAt
      - childSafeguardingReferralGradeId
      - flagId
      - category
      - priority
      - description
      - suggestedAction
      description: Safeguarding flags that fire independently of the completeness status and urgency,
        each with a priority and a suggested action for the referrer or receiving social-care team.
    ChildSafeguardingReferralGradeRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        childSafeguardingReferralGradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        ruleId:
          type: string
          maxLength: 40
          description: Stable rule identifier (e.g. R-CONSENT-BASIS-01).
        section:
          type: string
          enum:
          - referrer
          - child
          - concern
          - category
          - risk
          - consent
          - informed
          - completeness
          - urgency
          - ''
          description: 'Referral section the rule concerns: referrer, child, concern, category, risk,
            consent, informed, completeness, or urgency.'
        category:
          type: string
          maxLength: 50
          description: Subject category (e.g. mandatory-field, consent-basis, urgency-trigger).
        description:
