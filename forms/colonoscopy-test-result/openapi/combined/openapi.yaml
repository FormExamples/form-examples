components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Name.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as full text.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code, such as for validating the postal address.
        role:
          type: string
          enum:
          - gastroenterologist
          - colorectal-surgeon
          - nurse-endoscopist
          - other
          - ''
          description: 'Reporting clinician (endoscopist) role: gastroenterologist, colorectal-surgeon,
            nurse-endoscopist, other.'
        registrationBody:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - other
          - ''
          description: 'Clinician registration body: GMC, NMC, HCPC, other.'
        registrationNumber:
          type: string
          description: Clinician registration number.
        unitedKingdomNhsNumber:
          type:
          - string
          - 'null'
          maxLength: 12
          description: United Kingdom NHS number, unique per person.
      required:
      - createdAt
      - updatedAt
      - name
      - role
      - registrationBody
      - registrationNumber
      description: Reporting clinician (endoscopist) who performs, authors, and signs the colonoscopy
        result report.
    ColonoscopyTestResult:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the patient.
        clinicianId:
          type: string
          format: uuid
          description: Foreign key to the reporting clinician (endoscopist).
        originatingRequestReference:
          type: string
          maxLength: 255
          description: Free-text reference linking this report back to the originating colonoscopy request
            (referral).
        reportStatus:
          type: string
          enum:
          - preliminary
          - final
          - amended
          - cancelled
          - ''
          description: 'Report lifecycle status: preliminary, final, amended, cancelled.'
        performedDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the colonoscopy procedure was performed.
        reportedDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the report was authored / signed.
        procedure:
          type: string
          enum:
          - colonoscopy
          - flexible-sigmoidoscopy
          - ct-colonography
          - other
          - ''
          description: 'Performed procedure: colonoscopy, flexible-sigmoidoscopy, ct-colonography, other.'
        extentReached:
          type: string
          enum:
          - caecum
          - terminal-ileum
          - hepatic-flexure
          - splenic-flexure
          - descending-colon
          - rectum-sigmoid
          - incomplete
          - ''
          description: 'Most proximal extent reached: caecum, terminal-ileum, hepatic-flexure, splenic-flexure,
            descending-colon, rectum-sigmoid, incomplete. Caecal / terminal-ileal intubation is the completeness
            key performance indicator (BSG / JAG target rate 90%).'
        bowelPreparationQuality:
          type: string
          enum:
          - excellent
          - good
          - adequate
          - poor
          - ''
          description: 'Bowel-preparation quality (e.g. mapped from a Boston Bowel Preparation Scale assessment):
            excellent, good, adequate, poor.'
        sedationUsed:
          type: boolean
          description: Whether sedation / analgesia was administered for the procedure.
        clinicalHistory:
          type: string
          maxLength: 1000
          description: Clinical history and the question the procedure was performed to answer.
        polypsFound:
          type: boolean
          description: Whether one or more polyps were found.
        massLesion:
          type: boolean
          description: Whether a mass lesion (suspicious for malignancy) was found.
        diverticulosis:
          type: boolean
          description: Whether diverticulosis is present.
        inflammationIbd:
          type: boolean
          description: Whether mucosal inflammation suggestive of inflammatory bowel disease (IBD) is
            present.
        angiodysplasia:
          type: boolean
          description: Whether angiodysplasia (vascular ectasia) is present.
        bleedingSourceIdentified:
          type: boolean
          description: Whether a source of lower-GI bleeding was identified.
        normalExamination:
          type: boolean
          description: Whether the examination was normal (no significant abnormality detected).
        polypCount:
          type:
          - integer
          - 'null'
          format: int32
          description: Number of polyps detected, for surveillance interval determination.
        largestPolypMm:
          type:
          - number
          - 'null'
          format: double
          description: Largest polyp size in millimetres, for surveillance and categorisation (BSG / ACPGBI
            / PHE polyp surveillance).
        biopsyTaken:
          type: boolean
          description: Whether one or more biopsies were taken for histopathology.
        polypectomyPerformed:
          type: boolean
          description: Whether a polypectomy was performed.
        complication:
          type: string
          enum:
          - none
          - bleeding
          - perforation
          - other
          - ''
          description: 'Procedural complication: none, bleeding, perforation, other.'
        findingsNarrative:
          type: string
          maxLength: 2000
          description: Narrative description of the procedure findings (the body of the report).
        impression:
          type: string
          maxLength: 2000
          description: Summary impression / conclusion answering the clinical question.
        reportingCategory:
          type: string
          maxLength: 50
          description: Free-text structured-reporting category label (e.g. a BSG / ACPGBI / PHE polyp-surveillance
            risk band, a Paris morphology class, or a histology pending note).
        recommendedFollowUp:
          type: string
          maxLength: 1000
          description: Recommended follow-up surveillance interval, repeat procedure, referral, or management.
        criticalResultCommunicated:
          type: boolean
          description: Whether a critical or unexpected significant result was communicated directly to
            the referrer / responsible team.
        reportedTo:
          type: string
          maxLength: 500
          description: Who the critical / urgent result was communicated to, with date and time if applicable.
      required:
      - createdAt
      - updatedAt
      - patientId
      - clinicianId
      - originatingRequestReference
      - reportStatus
      - procedure
      - extentReached
      - bowelPreparationQuality
      - sedationUsed
      - clinicalHistory
      - polypsFound
      - massLesion
      - diverticulosis
      - inflammationIbd
      - angiodysplasia
      - bleedingSourceIdentified
      - normalExamination
      - biopsyTaken
      - polypectomyPerformed
      - complication
      - findingsNarrative
      - impression
      - reportingCategory
      - recommendedFollowUp
      - criticalResultCommunicated
      - reportedTo
      description: Colonoscopy procedure result (report). Captures the performed procedure, extent reached,
        bowel-preparation quality and sedation, clinical history, the narrative and structured findings,
        polyp count and size, biopsy / polypectomy and any complication, the impression and structured-reporting
        label, recommended follow-up, and critical-result communication. This is the source-of-truth record
        that the four-axis interpretation grade is computed from.
    ColonoscopyTestResultGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        colonoscopyTestResultId:
          type: string
          format: uuid
          description: Foreign key to the parent result (unique, 1:1).
        resultClassification:
          type: string
          enum:
          - normal
          - abnormal
          - critical
          - inconclusive
          - ''
          description: 'Axis A overall classification: normal, abnormal, critical, inconclusive.'
        abnormalitySeverity:
          type: string
          enum:
          - none
          - minor
          - moderate
          - major
          - ''
          description: 'Axis B abnormality severity: none, minor, moderate, major.'
        reportingCategory:
          type: string
          maxLength: 50
          description: Axis B structured-reporting score / category label (e.g. a BSG / ACPGBI / PHE polyp-surveillance
            risk band or an incidental-findings category).
        reportCompletenessPercent:
          type:
          - integer
          - 'null'
          format: int32
          description: Axis C report completeness as a percentage of mandatory report sections (0-100).
        followUpUrgency:
          type: string
          enum:
          - routine
          - recommended
          - urgent
          - critical-alert
          - ''
          description: 'Axis D follow-up urgency: routine, recommended, urgent, critical-alert.'
        targetTimeframe:
          type: string
          maxLength: 50
          description: Target timeframe for the recommended follow-up implied by the urgency.
        recommendedAction:
          type: string
          maxLength: 500
          description: Axis D concise recommended action derived from the urgency.
        recommendation:
          type: string
          enum:
          - no-action
          - routine-follow-up
          - further-imaging
          - specialist-referral
          - urgent-review
          - ''
          description: 'Overall recommendation: no-action, routine-follow-up, further-imaging, specialist-referral,
            urgent-review.'
        clinicianNotes:
          type: string
          description: Free-text interpretation / sign-off notes.
        signedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Timestamp of the reporting clinician electronic signature.
        gradedAt:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the result.
      required:
      - createdAt
      - updatedAt
      - colonoscopyTestResultId
      - resultClassification
      - abnormalitySeverity
      - reportingCategory
      - followUpUrgency
      - targetTimeframe
      - recommendedAction
      - recommendation
      - clinicianNotes
      - gradedAt
      description: 'Computed four-axis interpretation grade: result classification, abnormality severity
        / structured-reporting category, report completeness, and follow-up urgency. A critical result
        (e.g. obstructing or suspicious mass, perforation) auto-escalates the follow-up urgency to critical-alert
        regardless of the other axes.'
    ColonoscopyTestResultGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        colonoscopyTestResultGradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        flagId:
          type: string
          maxLength: 50
          description: Stable flag identifier (e.g. F-CRITICAL-RESULT-001).
        category:
          type: string
          enum:
          - critical-result-alert
          - incidental-finding
          - discrepancy-with-request
          - abnormal-requiring-action
          - urgent-referral
          - inadequate-technique
          - unexpected-finding
          - missing-impression
          - missing-measurement
          - other
          - ''
          description: Flag category.
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          - ''
          description: 'Priority: low, medium, high.'
        description:
          type: string
          maxLength: 500
