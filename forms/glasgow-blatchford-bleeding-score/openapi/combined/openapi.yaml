          type: string
          description: Recommended management for the band (e.g. consider outpatient management; admit
            and arrange urgent endoscopy).
        graded_at:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the grade.
      required:
      - created_at
      - updated_at
      - glasgow_blatchford_bleeding_score_id
      - risk_band
      - recommended_management
      - graded_at
      description: 'Computed Glasgow-Blatchford grading result: per-parameter points, summed total (0-23),
