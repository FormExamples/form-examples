        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the row was soft-deleted.
        glasgow_blatchford_bleeding_score_id:
          type: string
          format: uuid
          description: Foreign key to the parent assessment (unique, 1:1).
        blood_urea_points:
          type: integer
          format: int32
          description: Points awarded for parameter 1, blood urea (0, 2, 3, 4, or 6).
        haemoglobin_points:
          type: integer
          format: int32
          description: Points awarded for parameters 2/3, haemoglobin (0, 1, 3, or 6; sex-specific bands).
        systolic_blood_pressure_points:
          type: integer
          format: int32
          description: Points awarded for parameter 4, systolic blood pressure (0, 1, 2, or 3).
        pulse_point:
          type: integer
          format: int32
          description: Point awarded for parameter 5, pulse >= 100 (0 or 1).
        melaena_point:
          type: integer
          format: int32
          description: Point awarded for parameter 6, melaena present (0 or 1).
        syncope_point:
          type: integer
          format: int32
          description: Points awarded for parameter 7, syncope present (0 or 2).
        hepatic_disease_point:
          type: integer
          format: int32
          description: Points awarded for parameter 8, hepatic disease (0 or 2).
        cardiac_failure_point:
          type: integer
          format: int32
          description: Points awarded for parameter 9, cardiac failure (0 or 2).
        total_score:
          type: integer
          format: int32
          description: Summed Glasgow-Blatchford score across all parameters (0-23 when complete).
        risk_band:
          type: string
          enum:
          - very-low
          - low-moderate
          - high
          - ''
          description: 'Derived risk band: very-low (0), low-moderate (1-5), or high (>= 6).'
