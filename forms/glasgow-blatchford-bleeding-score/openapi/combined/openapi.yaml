components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Clinician full name.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as a single text block.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code.
        role:
          type: string
          enum:
          - ed
          - gastroenterology
          - acute-medicine
          - surgery
          - nurse
          - other
          - ''
          description: 'Primary clinical role or specialty: ed (emergency department), gastroenterology,
            acute-medicine, surgery, nurse, or other.'
        registrationBody:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - GPhC
          - other
          - ''
          description: 'Professional registration body: GMC, NMC, HCPC, GPhC, or other.'
        registrationNumber:
          type: string
          description: Professional registration number issued by the registration body.
      required:
      - createdAt
      - updatedAt
      - name
      - role
      - registrationBody
      - registrationNumber
      description: Clinician identifying information for the assessing clinician.
    GlasgowBlatchfordBleedingScore:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the patient being assessed (delete restricted).
        clinicianId:
          type:
          - string
          - 'null'
          format: uuid
          description: Foreign key to the assessing clinician (optional; delete restricted).
        clinicianName:
          type: string
          maxLength: 255
          description: Name of the assessing clinician as recorded on the assessment.
        clinicianRole:
          type: string
          enum:
          - doctor
          - nurse
          - advanced-practitioner
          - other
          - ''
          description: 'Role of the assessing clinician: doctor, nurse, advanced-practitioner, or other.'
        assessedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Date and time the assessment was performed.
        careSetting:
          type: string
          enum:
          - emergency-department
          - acute-medical-unit
          - ward
          - other
          - ''
          description: 'Care setting: emergency-department, acute-medical-unit, ward, or other.'
        presentingComplaint:
          type: string
          enum:
          - haematemesis
          - coffee-ground
          - melaena
          - other
          - ''
          description: 'Presenting complaint: haematemesis, coffee-ground (vomit), melaena, or other.'
        patientIdentifier:
          type: string
          maxLength: 100
          description: Local patient identifier as recorded on the assessment.
        ageBand:
          type: string
          enum:
          - 16-39
          - 40-59
          - 60-74
          - 75-plus
          - ''
          description: 'Adult age band: 16-39, 40-59, 60-74, or 75-plus.'
        sex:
          type: string
          enum:
          - female
          - male
          - intersex
          - unknown
          - ''
          description: 'Patient sex recorded for the assessment: female, male, intersex, or unknown. Selects
            the haemoglobin band table; unknown falls back to the female table.'
        bloodUreaMmolL:
          type:
          - number
          - 'null'
          format: double
          description: Parameter 1 — measured blood urea in millimoles per litre (mmol/L).
        haemoglobinGL:
          type:
          - number
          - 'null'
          format: double
          description: Parameters 2/3 — measured haemoglobin in grams per litre (g/L); scored against
            sex-specific bands.
        systolicBloodPressureMmhg:
          type:
          - integer
          - 'null'
          format: int32
          description: Parameter 4 — measured systolic blood pressure in millimetres of mercury (mmHg).
        pulseBeatsPerMin:
          type:
          - integer
          - 'null'
          format: int32
          description: Parameter 5 — measured pulse rate in beats per minute.
        melaenaPresent:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Parameter 6 — melaena (black tarry stool) present: yes or no.'
        syncope:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Parameter 7 — syncope (fainting) present: yes or no.'
        hepaticDisease:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Parameter 8 — history of hepatic (liver) disease: yes or no.'
        cardiacFailure:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Parameter 9 — history of cardiac failure: yes or no.'
        clinicalNote:
          type: string
          description: Free-text clinical context note recorded with the assessment.
      required:
      - createdAt
      - updatedAt
      - patientId
      - clinicianName
      - clinicianRole
      - careSetting
      - presentingComplaint
      - patientIdentifier
      - ageBand
      - sex
      - melaenaPresent
      - syncope
      - hepaticDisease
      - cardiacFailure
      - clinicalNote
      description: 'Main Glasgow-Blatchford Bleeding Score assessment record: assessment context, patient
        identification, and the eight weighted admission parameter inputs (blood urea, haemoglobin, systolic
        blood pressure, pulse, melaena, syncope, hepatic disease, cardiac failure).'
    GlasgowBlatchfordBleedingScoreGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        glasgowBlatchfordBleedingScoreId:
          type: string
          format: uuid
          description: Foreign key to the parent assessment (unique, 1:1).
        bloodUreaPoints:
          type:
          - integer
          - 'null'
          format: int32
          description: Points awarded for parameter 1, blood urea (0, 2, 3, 4, or 6).
        haemoglobinPoints:
          type:
          - integer
          - 'null'
          format: int32
          description: Points awarded for parameters 2/3, haemoglobin (0, 1, 3, or 6; sex-specific bands).
        systolicBloodPressurePoints:
          type:
          - integer
          - 'null'
          format: int32
          description: Points awarded for parameter 4, systolic blood pressure (0, 1, 2, or 3).
        pulsePoint:
          type:
          - integer
          - 'null'
          format: int32
          description: Point awarded for parameter 5, pulse >= 100 (0 or 1).
        melaenaPoint:
          type:
          - integer
          - 'null'
          format: int32
          description: Point awarded for parameter 6, melaena present (0 or 1).
        syncopePoint:
          type:
          - integer
          - 'null'
          format: int32
          description: Points awarded for parameter 7, syncope present (0 or 2).
        hepaticDiseasePoint:
          type:
          - integer
          - 'null'
          format: int32
          description: Points awarded for parameter 8, hepatic disease (0 or 2).
        cardiacFailurePoint:
          type:
          - integer
          - 'null'
          format: int32
          description: Points awarded for parameter 9, cardiac failure (0 or 2).
        totalScore:
          type:
          - integer
          - 'null'
          format: int32
          description: Summed Glasgow-Blatchford score across all parameters (0-23 when complete).
        riskBand:
          type: string
          enum:
          - very-low
          - low-moderate
          - high
          - ''
          description: 'Derived risk band: very-low (0), low-moderate (1-5), or high (>= 6).'
        recommendedManagement:
          type: string
          description: Recommended management for the band (e.g. consider outpatient management; admit
            and arrange urgent endoscopy).
        gradedAt:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the grade.
      required:
      - createdAt
      - updatedAt
      - glasgowBlatchfordBleedingScoreId
      - riskBand
      - recommendedManagement
      - gradedAt
      description: 'Computed Glasgow-Blatchford grading result: per-parameter points, summed total (0-23),
        derived risk band, and recommended management.'
    GlasgowBlatchfordBleedingScoreGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        glasgowBlatchfordBleedingScoreGradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        flagId:
          type: string
          maxLength: 50
          description: Stable flag identifier (e.g. F-HIGH-SCORE-ADMIT-001).
        category:
          type: string
          enum:
          - high-score-admit
          - low-risk-discharge
          - shock
          - low-hb-transfusion
          - incomplete
          - other
          - ''
          description: 'Flag category: high-score-admit, low-risk-discharge, shock, low-hb-transfusion,
            incomplete, or other.'
        priority:
          type: string
          enum:
          - info
          - low
          - medium
          - high
          - ''
          description: 'Priority: info, low, medium, or high.'
        description:
          type: string
          maxLength: 500
          description: Human-readable description of what fired the flag.
        suggestedAction:
          type: string
          maxLength: 500
          description: Suggested clinical action (e.g. "admit and arrange urgent endoscopy").
      required:
      - createdAt
      - updatedAt
      - glasgowBlatchfordBleedingScoreGradeId
      - flagId
      - category
      - priority
      - description
      - suggestedAction
      description: Red-flag issues that fire independently of the total score, with priority and a suggested
        action for the clinical team.
