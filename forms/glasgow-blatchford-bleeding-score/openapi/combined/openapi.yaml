          type: string
          maxLength: 100
          description: Local patient identifier as recorded on the assessment.
        age_band:
          type: string
          enum:
          - 16-39
          - 40-59
          - 60-74
          - 75-plus
          - ''
          description: 'Adult age band: 16-39, 40-59, 60-74, or 75-plus.'
        sex:
          type: string
          enum:
          - female
          - male
          - intersex
          - unknown
          - ''
          description: 'Patient sex recorded for the assessment: female, male, intersex, or unknown. Selects
