components:
  schemas:
    AllergySkinTestRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the patient.
        clinicianId:
          type: string
          format: uuid
          description: Foreign key to the requesting clinician (referrer).
        status:
          type: string
          enum:
          - draft
          - submitted
          - vetted
          - scheduled
          - rejected
          - ''
          description: 'Request lifecycle status: draft, submitted, vetted, scheduled, rejected.'
        siteName:
          type: string
          maxLength: 255
          description: Name of the requesting site or clinic.
        setting:
          type: string
          enum:
          - outpatient
          - inpatient
          - community
          - emergency
          - ''
          description: 'Care setting: outpatient, inpatient, community, emergency.'
        referralDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the referral was made.
        requestedByDate:
          type:
          - string
          - 'null'
          format: date
          description: Date by which the test is requested to be performed.
        testType:
          type: string
          enum:
          - skin-prick-test
          - intradermal-test
          - patch-test
          - specific-ige-blood
          - drug-provocation-challenge
          - other
          - ''
          description: 'Requested test type: skin-prick-test, intradermal-test, patch-test, specific-ige-blood,
            drug-provocation-challenge, other.'
        allergenAeroallergens:
          type: boolean
          description: Whether aeroallergen testing is requested (pollens, house dust mite, animal dander,
            moulds).
        allergenFood:
          type: boolean
          description: Whether food allergen testing is requested.
        allergenDrug:
          type: boolean
          description: Whether drug allergen testing is requested.
        allergenVenom:
          type: boolean
          description: Whether insect venom allergen testing is requested.
        allergenLatex:
          type: boolean
          description: Whether latex allergen testing is requested.
        allergenContact:
          type: boolean
          description: Whether contact-allergen patch testing is requested.
        primaryIndication:
          type: string
          enum:
          - suspected-food-allergy
          - suspected-drug-allergy
          - rhinitis-asthma
          - anaphylaxis-investigation
          - venom-allergy
          - contact-dermatitis
          - urticaria
          - other
          - ''
          description: Primary clinical indication, used for appropriateness scoring.
        clinicalQuestion:
          type: string
          maxLength: 1000
          description: Specific clinical question the test should answer (highest-value field).
        clinicalDetails:
          type: string
          maxLength: 1000
          description: 'Relevant clinical details: history, reaction description, timing, suspected triggers.'
        previousAnaphylaxis:
          type: boolean
          description: Whether the patient has a history of anaphylaxis (resuscitation-readiness flag).
        onAntihistamines:
          type: boolean
          description: Whether the patient is currently taking antihistamines (invalidates skin-prick
            / intradermal tests).
        onBetaBlocker:
          type: boolean
          description: Whether the patient is taking a beta-blocker (impairs adrenaline response in anaphylaxis).
        currentSkinDisease:
          type: boolean
          description: Whether the patient has active skin disease at the test site (e.g. eczema, dermographism).
        urgency:
          type: string
          enum:
          - routine
          - urgent
          - ''
          description: 'Requested triage urgency: routine, urgent.'
        supervisingConsultant:
          type: string
          maxLength: 255
          description: Name of the supervising / responsible consultant.
        requesterContact:
          type: string
          maxLength: 255
          description: Contact details (bleep / phone) for the requester.
        notes:
          type: string
          maxLength: 1000
          description: Free-text additional notes.
      required:
      - createdAt
      - updatedAt
      - patientId
      - clinicianId
      - status
      - siteName
      - setting
      - testType
      - allergenAeroallergens
      - allergenFood
      - allergenDrug
      - allergenVenom
      - allergenLatex
      - allergenContact
      - primaryIndication
      - clinicalQuestion
      - clinicalDetails
      - previousAnaphylaxis
      - onAntihistamines
      - onBetaBlocker
      - currentSkinDisease
      - urgency
      - supervisingConsultant
      - requesterContact
      - notes
      description: Allergy skin test request (referral) for skin-prick, intradermal, patch, specific-IgE
        blood, or drug-provocation testing. Captures the requested test type, allergen panels, the clinical
        indication and question, antihistamine / beta-blocker / skin-disease validity-and-safety history,
        and triage urgency.
    AllergySkinTestRequestGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        allergySkinTestRequestId:
          type: string
          format: uuid
          description: Foreign key to the parent request (unique, 1:1).
        appropriatenessScore:
          type:
          - integer
          - 'null'
          format: int32
          description: Appropriateness score (1-9) from BSACI / EAACI indication match.
        appropriatenessBand:
          type: string
          enum:
          - usually-appropriate
          - may-be-appropriate
          - usually-not-appropriate
          - ''
          description: 'Appropriateness band: usually-appropriate (7-9), may-be-appropriate (4-6), usually-not-appropriate
            (1-3).'
        validitySafetyBand:
          type: string
          enum:
          - ok
          - caution
          - contraindicated
          - ''
          description: 'Validity-and-safety band: ok, caution, contraindicated. Antihistamines invalidate
            skin-prick tests; beta-blocker plus anaphylaxis history and active skin disease raise caution
            / contraindication.'
        completenessPercent:
          type:
          - integer
          - 'null'
          format: int32
          description: Request completeness as a percentage of mandatory fields (0-100).
        triageTier:
          type: string
          enum:
          - routine
          - urgent
          - ''
          description: 'Assigned triage tier: routine, urgent.'
        targetTimeframe:
          type: string
          maxLength: 50
          description: Target timeframe for the test implied by the triage tier.
        recommendation:
          type: string
          enum:
          - accept
          - query-referrer
          - redirect
          - reject
          - ''
          description: 'Vetting recommendation: accept, query-referrer, redirect, reject.'
        clinicianNotes:
          type: string
          description: Free-text vetting notes.
        signedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Timestamp of vetting clinician electronic signature.
        gradedAt:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the result.
      required:
      - createdAt
      - updatedAt
      - allergySkinTestRequestId
      - appropriatenessBand
      - validitySafetyBand
      - triageTier
      - targetTimeframe
      - recommendation
      - clinicianNotes
      - gradedAt
      description: 'Computed four-axis grading result: appropriateness (BSACI / EAACI indication match,
        1-9), validity-and-safety, request completeness, and triage priority.'
    AllergySkinTestRequestGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        allergySkinTestRequestGradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        flagId:
          type: string
          maxLength: 50
          description: Stable flag identifier (e.g. F-PREVIOUS-ANAPHYLAXIS-001).
        category:
          type: string
          enum:
          - previous-anaphylaxis-resus-ready
          - antihistamines-invalidate-test
          - beta-blocker-caution
          - active-skin-disease
          - missing-indication
          - missing-clinical-details
          - no-allergen-selected
          - other
          - ''
          description: Flag category.
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          - ''
          description: 'Priority: low, medium, high.'
        description:
          type: string
          maxLength: 500
          description: Human-readable description of what fired the flag.
        suggestedAction:
          type: string
          maxLength: 500
          description: Suggested clinical action (e.g. "ensure resuscitation facilities and stop antihistamines
            for an appropriate washout before testing").
      required:
      - createdAt
      - updatedAt
      - allergySkinTestRequestGradeId
      - flagId
      - category
      - priority
      - description
      - suggestedAction
      description: Safety-critical flags that fire independently of the four axes, with priority and a
        suggested action for the allergy team.
    AllergySkinTestRequestGradeRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        allergySkinTestRequestGradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        ruleId:
          type: string
          maxLength: 40
          description: Stable rule identifier (e.g. R-APPROP-FOOD-01).
        axis:
          type: string
          enum:
          - appropriateness
          - validity
          - completeness
          - triage
          - ''
          description: 'Scoring axis the rule belongs to: appropriateness, validity, completeness, triage.'
        category:
          type: string
          maxLength: 50
          description: Category or indication the rule relates to.
        description:
          type: string
          maxLength: 500
          description: Human-readable description of why the rule fired.
      required:
      - createdAt
      - updatedAt
      - allergySkinTestRequestGradeId
      - ruleId
      - axis
      - category
      - description
      description: Audit trail of every appropriateness / validity / completeness / triage rule that fired
        for this request.
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Name.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
