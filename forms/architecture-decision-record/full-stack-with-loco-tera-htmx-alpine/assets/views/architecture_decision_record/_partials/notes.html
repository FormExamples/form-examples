<div id="notes-region">
  <div class="grid gap-2">
    {% for n in notes %}
      <div class="border-l-4 border-blue-500 bg-slate-50 p-2 rounded">
        <div class="text-xs text-slate-600">
          {{ n.noted_at | default(value=n.created_at) }} — {{ n.noted_by | default(value="unknown") | escape }}
        </div>
        <div class="text-sm whitespace-pre-wrap">{{ n.body | escape }}</div>
        <button
          type="button"
          class="mt-1 text-xs text-red-700 underline"
          hx-delete="/architecture_decision_records/{{ adr_id }}/notes/{{ n.id }}"
          hx-target="#notes-region"
          hx-swap="outerHTML"
        >Remove</button>
      </div>
    {% else %}
      <p class="text-sm text-slate-500 italic">No notes yet. Add one as you socialise the decision.</p>
    {% endfor %}
  </div>

  <form
    class="mt-3 grid grid-cols-1 md:grid-cols-2 gap-2"
    hx-post="/architecture_decision_records/{{ adr_id }}/notes"
    hx-target="#notes-region"
    hx-swap="outerHTML"
    hx-on::after-request="this.reset()"
  >
    <div>
      <label class="field-label" for="note-by">Noted by</label>
      <input class="field-input" id="note-by" name="noted_by" type="text" />
    </div>
    <div>
      <label class="field-label" for="note-body">Body</label>
      <textarea class="field-input font-mono text-sm" id="note-body" name="body" rows="2" required></textarea>
    </div>
    <div class="md:col-span-2 flex justify-end">
      <button class="btn-primary" type="submit">+ Append note</button>
    </div>
  </form>
</div>
