        cnsScore:
          type:
          - integer
          - 'null'
          format: int32
          description: Central nervous system organ-system sub-score (0-4); null when the input is incomplete.
        renalScore:
          type:
          - integer
          - 'null'
          format: int32
          description: Renal organ-system sub-score (0-4), max of creatinine and urine-output bands; null
            when the input is incomplete.
        totalScore:
          type:
          - integer
          - 'null'
          format: int32
