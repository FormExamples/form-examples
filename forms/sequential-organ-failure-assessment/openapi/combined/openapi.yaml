    SequentialOrganFailureAssessment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        patient_id:
          type: string
          format: uuid
          description: Foreign key to the patient being assessed (delete restricted).
        clinician_id:
          type: string
          format: uuid
          description: Foreign key to the assessing clinician (optional; delete restricted).
        assessor_name:
          type: string
          maxLength: 255
          description: Name of the assessing clinician as recorded on the assessment.
        assessor_role:
          type: string
          enum:
          - intensivist
          - critical-care-physician
          - acute-physician
          - resident
          - nurse
          - outreach-practitioner
          - other
          - ''
          description: 'Role of the assessing clinician: intensivist, critical-care-physician, acute-physician,
            resident, nurse, outreach-practitioner, or other.'
        assessor_registration_number:
          type: string
          maxLength: 50
          description: Professional registration number of the assessing clinician.
        assessed_at:
          type: string
          format: date-time
          description: Date and time the assessment was performed.
        care_location:
          type: string
          enum:
          - icu
          - hdu
          - critical-care-outreach
          - acute-medical-unit
          - emergency-department
          - other
          - ''
          description: 'Care location: icu, hdu, critical-care-outreach, acute-medical-unit, emergency-department,
            or other.'
        hours_since_admission:
          type: integer
          format: int32
          description: Hours elapsed since ICU/critical-care admission (for serial scoring).
        patient_identifier:
          type: string
          maxLength: 100
          description: Local patient identifier as recorded on the assessment.
        age_years:
          type: integer
          format: int32
          description: Patient age in years at the time of assessment.
        sex:
          type: string
          enum:
          - female
          - male
          - intersex
          - unknown
          - ''
          description: 'Patient sex recorded for the assessment: female, male, intersex, or unknown.'
        admission_diagnosis:
          type: string
          description: Free-text admission or working diagnosis.
        suspected_infection:
          type: string
          enum:
          - 'yes'
          - 'no'
          - unknown
          - ''
          description: 'Whether infection is suspected (drives the Sepsis-3 flag): yes, no, or unknown.'
        baseline_sofa_total:
          type: integer
          format: int32
          description: Prior (baseline) total SOFA score used to compute delta-SOFA; assumed 0 when no
            pre-existing organ dysfunction is known.
        pao2:
          type: number
          format: double
          description: Respiration input — arterial partial pressure of oxygen (PaO2); SI units (kPa)
            preferred, mmHg accepted.
        fio2:
          type: number
          format: double
          description: Respiration input — fraction of inspired oxygen (FiO2) as a decimal fraction (0.21-1.0).
        pao2_fio2_ratio:
          type: number
          format: double
          description: Respiration input — directly entered PaO2/FiO2 ratio, used when PaO2 and FiO2 are
            not entered separately.
        respiratory_support:
          type: string
          enum:
          - ventilated
          - cpap
          - none
          - ''
          description: 'Respiration input — respiratory support: ventilated, cpap, or none; sub-scores
            of 3-4 require support.'
        platelets:
          type: number
          format: double
          description: Coagulation input — platelet count in x10^9/L (equivalently x10^3/uL).
        bilirubin:
          type: number
          format: double
          description: Liver input — total bilirubin; SI units (umol/L) preferred, mg/dL accepted.
        map:
          type: number
          format: double
          description: Cardiovascular input — mean arterial pressure (MAP) in mmHg.
        vasopressor:
          type: string
          enum:
          - none
          - dopamine
          - dobutamine
          - adrenaline
          - noradrenaline
          - other
          - ''
          description: 'Cardiovascular input — vasopressor/inotrope agent: none, dopamine, dobutamine,
            adrenaline, noradrenaline, or other.'
        vasopressor_dose:
          type: number
          format: double
          description: Cardiovascular input — vasopressor dose in ug/kg/min (administered for at least
            one hour).
        glasgow_coma_scale:
          type: integer
          format: int32
          description: Central nervous system input — Glasgow Coma Scale (GCS) total, 3-15.
        sedated:
          type: boolean
          description: Central nervous system input — whether the patient is sedated; use pre-sedation
            GCS or best estimate.
        creatinine:
          type: number
          format: double
          description: Renal input — serum creatinine; SI units (umol/L) preferred, mg/dL accepted.
        urine_output:
          type: integer
          format: int32
          description: Renal input — 24-hour urine output in mL/day.
        clinical_note:
          type: string
          description: Free-text clinical note recorded with the assessment.
      required:
      - created_at
      - updated_at
      - patient_id
      - assessor_name
      - assessor_role
      - assessor_registration_number
      - care_location
      - patient_identifier
      - sex
      - admission_diagnosis
      - suspected_infection
      - respiratory_support
      - vasopressor
      - sedated
      - clinical_note
      description: 'Main Sequential Organ Failure Assessment (SOFA) record: assessment context, patient
        identification and baseline, and the raw inputs for the six scored organ systems (respiration,
        coagulation, liver, cardiovascular, central nervous system, renal).'
    SequentialOrganFailureAssessmentGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the row was soft-deleted.
        sequential_organ_failure_assessment_id:
          type: string
          format: uuid
          description: Foreign key to the parent assessment (unique, 1:1).
        respiration_score:
          type: integer
          format: int32
          description: Respiration organ-system sub-score (0-4); null when the input is incomplete.
        coagulation_score:
          type: integer
          format: int32
          description: Coagulation organ-system sub-score (0-4); null when the input is incomplete.
        liver_score:
          type: integer
          format: int32
          description: Liver organ-system sub-score (0-4); null when the input is incomplete.
        cardiovascular_score:
          type: integer
          format: int32
          description: Cardiovascular organ-system sub-score (0-4), max of MAP and vasopressor bands;
            null when the input is incomplete.
        cns_score:
          type: integer
          format: int32
          description: Central nervous system organ-system sub-score (0-4); null when the input is incomplete.
        renal_score:
          type: integer
          format: int32
          description: Renal organ-system sub-score (0-4), max of creatinine and urine-output bands; null
            when the input is incomplete.
        total_score:
          type: integer
          format: int32
          description: Summed total SOFA score across the six systems (0-24 when complete).
        delta_sofa:
          type: integer
          format: int32
          description: Change in total SOFA from baseline (total_score minus baseline_sofa_total); null
            when no baseline is present.
        mortality_band:
          type: string
          enum:
          - low
          - moderate
          - high
          - veryHigh
          - extreme
          - ''
          description: 'Derived mortality-risk band: low (0-6), moderate (7-9), high (10-12), veryHigh
            (13-14), or extreme (15-24).'
        sepsis3:
          type: boolean
          description: 'Sepsis-3 flag: true when infection is suspected and delta-SOFA is >= 2.'
        graded_at:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the grade.
      required:
      - created_at
      - updated_at
      - sequential_organ_failure_assessment_id
      - mortality_band
      - sepsis3
      - graded_at
      description: 'Computed SOFA grading result: per-system 0-4 sub-scores, summed total (0-24), delta-SOFA
        versus baseline, derived mortality band, and the Sepsis-3 flag.'
