components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Clinician full name.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as a single text block.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code.
        role:
          type: string
          enum:
          - intensivist
          - critical-care-physician
          - acute-physician
          - resident
          - nurse
          - outreach-practitioner
          - other
          - ''
          description: 'Primary clinical role: intensivist, critical-care-physician, acute-physician,
            resident, nurse, outreach-practitioner, or other.'
        registrationBody:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - GPhC
          - other
          - ''
          description: 'Professional registration body: GMC, NMC, HCPC, GPhC, or other.'
        registrationNumber:
          type: string
          description: Professional registration number issued by the registration body.
      required:
      - createdAt
      - updatedAt
      - name
      - role
      - registrationBody
      - registrationNumber
      description: Clinician identifying information for the assessing clinician.
    Patient:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          maxLength: 255
          description: Full patient name.
        birthDate:
          type: string
          format: date
          description: Date of birth.
        sex:
          type: string
          enum:
          - female
          - male
          - intersex
          - unknown
          - ''
          description: 'Sex recorded for clinical purposes: female, male, intersex, or unknown.'
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as a single text block.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code.
        unitedKingdomNhsNumber:
          type:
          - string
          - 'null'
          maxLength: 20
          description: United Kingdom NHS number, unique per person.
        hospitalMrn:
          type:
          - string
          - 'null'
          maxLength: 50
          description: Local hospital medical record number (MRN).
        heightAsCm:
          type:
          - number
          - 'null'
          format: double
          description: Height in centimetres.
        weightAsKg:
          type:
          - number
          - 'null'
          format: double
          description: Weight in kilograms.
        bodyMassIndex:
          type:
          - number
          - 'null'
          format: double
          description: Body mass index (BMI), kg/m^2.
        allergiesSummary:
          type: string
          description: Free-text summary of known allergies.
      required:
      - createdAt
      - updatedAt
      - name
      - birthDate
      - sex
      - allergiesSummary
      description: Patient demographic information used by the Sequential Organ Failure Assessment (SOFA)
        record.
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          description: A URI identifying the problem type
        title:
          type: string
          description: A short summary of the problem type
        status:
          type: integer
          description: The HTTP status code
        detail:
          type: string
          description: An explanation of this occurrence
        instance:
          type: string
          description: A URI identifying this occurrence
        code:
          type: string
          description: A short machine-readable reason
        errors:
          type: object
          description: Per-field detail, when validation failed
      required:
      - type
      - title
      - status
    SequentialOrganFailureAssessment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the patient being assessed (delete restricted).
        clinicianId:
          type:
          - string
          - 'null'
          format: uuid
          description: Foreign key to the assessing clinician (optional; delete restricted).
        assessorName:
          type: string
          maxLength: 255
          description: Name of the assessing clinician as recorded on the assessment.
        assessorRole:
          type: string
          enum:
          - intensivist
          - critical-care-physician
          - acute-physician
          - resident
          - nurse
          - outreach-practitioner
          - other
          - ''
          description: 'Role of the assessing clinician: intensivist, critical-care-physician, acute-physician,
            resident, nurse, outreach-practitioner, or other.'
        assessorRegistrationNumber:
          type: string
          maxLength: 50
          description: Professional registration number of the assessing clinician.
        assessedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Date and time the assessment was performed.
        careLocation:
          type: string
          enum:
          - icu
          - hdu
          - critical-care-outreach
          - acute-medical-unit
          - emergency-department
          - other
          - ''
          description: 'Care location: icu, hdu, critical-care-outreach, acute-medical-unit, emergency-department,
            or other.'
        hoursSinceAdmission:
          type:
          - integer
          - 'null'
          format: int32
          description: Hours elapsed since ICU/critical-care admission (for serial scoring).
        patientIdentifier:
          type: string
          maxLength: 100
          description: Local patient identifier as recorded on the assessment.
        ageYears:
          type:
          - integer
          - 'null'
          format: int32
          description: Patient age in years at the time of assessment.
        sex:
          type: string
          enum:
          - female
          - male
          - intersex
          - unknown
          - ''
          description: 'Patient sex recorded for the assessment: female, male, intersex, or unknown.'
        admissionDiagnosis:
          type: string
          description: Free-text admission or working diagnosis.
        suspectedInfection:
          type: string
          enum:
          - 'yes'
          - 'no'
          - unknown
          - ''
          description: 'Whether infection is suspected (drives the Sepsis-3 flag): yes, no, or unknown.'
        baselineSofaTotal:
          type:
          - integer
          - 'null'
          format: int32
          description: Prior (baseline) total SOFA score used to compute delta-SOFA; assumed 0 when no
            pre-existing organ dysfunction is known.
        pao2:
          type:
          - number
          - 'null'
          format: double
          description: Respiration input — arterial partial pressure of oxygen (PaO2); SI units (kPa)
            preferred, mmHg accepted.
        fio2:
          type:
          - number
          - 'null'
          format: double
          description: Respiration input — fraction of inspired oxygen (FiO2) as a decimal fraction (0.21-1.0).
        pao2Fio2Ratio:
          type:
          - number
          - 'null'
          format: double
          description: Respiration input — directly entered PaO2/FiO2 ratio, used when PaO2 and FiO2 are
            not entered separately.
        respiratorySupport:
          type: string
          enum:
          - ventilated
          - cpap
          - none
          - ''
          description: 'Respiration input — respiratory support: ventilated, cpap, or none; sub-scores
            of 3-4 require support.'
        platelets:
          type:
          - number
          - 'null'
          format: double
          description: Coagulation input — platelet count in x10^9/L (equivalently x10^3/uL).
        bilirubin:
          type:
          - number
          - 'null'
          format: double
          description: Liver input — total bilirubin; SI units (umol/L) preferred, mg/dL accepted.
        map:
          type:
          - number
          - 'null'
          format: double
          description: Cardiovascular input — mean arterial pressure (MAP) in mmHg.
        vasopressor:
          type: string
          enum:
          - none
          - dopamine
          - dobutamine
          - adrenaline
          - noradrenaline
          - other
          - ''
          description: 'Cardiovascular input — vasopressor/inotrope agent: none, dopamine, dobutamine,
            adrenaline, noradrenaline, or other.'
        vasopressorDose:
          type:
          - number
          - 'null'
          format: double
          description: Cardiovascular input — vasopressor dose in ug/kg/min (administered for at least
            one hour).
        glasgowComaScale:
          type:
          - integer
          - 'null'
          format: int32
          description: Central nervous system input — Glasgow Coma Scale (GCS) total, 3-15.
        sedated:
          type: boolean
          description: Central nervous system input — whether the patient is sedated; use pre-sedation
            GCS or best estimate.
        creatinine:
          type:
          - number
          - 'null'
          format: double
          description: Renal input — serum creatinine; SI units (umol/L) preferred, mg/dL accepted.
        urineOutput:
          type:
          - integer
          - 'null'
          format: int32
          description: Renal input — 24-hour urine output in mL/day.
        clinicalNote:
          type: string
          description: Free-text clinical note recorded with the assessment.
      required:
      - createdAt
      - updatedAt
      - patientId
      - assessorName
      - assessorRole
      - assessorRegistrationNumber
      - careLocation
      - patientIdentifier
      - sex
      - admissionDiagnosis
      - suspectedInfection
      - respiratorySupport
      - vasopressor
      - sedated
      - clinicalNote
      description: 'Main Sequential Organ Failure Assessment (SOFA) record: assessment context, patient
        identification and baseline, and the raw inputs for the six scored organ systems (respiration,
        coagulation, liver, cardiovascular, central nervous system, renal).'
    SequentialOrganFailureAssessmentGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        sequentialOrganFailureAssessmentId:
          type: string
          format: uuid
          description: Foreign key to the parent assessment (unique, 1:1).
        respirationScore:
          type:
          - integer
