          format: int32
          description: Respiration organ-system sub-score (0-4); null when the input is incomplete.
        coagulationScore:
          type:
          - integer
          - 'null'
          format: int32
          description: Coagulation organ-system sub-score (0-4); null when the input is incomplete.
        liverScore:
          type:
          - integer
          - 'null'
          format: int32
          description: Liver organ-system sub-score (0-4); null when the input is incomplete.
        cardiovascularScore:
          type:
          - integer
          - 'null'
          format: int32
          description: Cardiovascular organ-system sub-score (0-4), max of MAP and vasopressor bands;
