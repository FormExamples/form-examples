components:
  schemas:
    Assessment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        patient_id:
          type: string
          format: uuid
          description: Foreign key to the patient who owns this assessment.
        status:
          type: string
          enum:
          - draft
          - submitted
          - reviewed
          - urgent
          description: 'Lifecycle status: draft, submitted, reviewed, or urgent.'
      required:
      - created_at
      - updated_at
      - patient_id
      - status
      description: Psychiatry assessment form. Parent entity for all sections covering the GAF (Global
        Assessment of Functioning) evaluation.
    AssessmentCurrentMedications:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        assessment_id:
          type: string
          format: uuid
          description: Foreign key to the parent assessment (unique, enforcing 1:1).
        takes_psychiatric_medications:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the patient takes psychiatric medications.
        takes_other_medications:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the patient takes non-psychiatric medications.
        medication_adherence:
          type: string
          enum:
          - good
          - fair
          - poor
          - ''
          description: 'Medication adherence: good, fair, poor, or empty.'
        adherence_barriers:
          type: string
          description: Free-text description of barriers to medication adherence.
        side_effects:
          type: string
          description: Free-text description of medication side effects experienced.
        clozapine_registered:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the patient is registered on a clozapine monitoring programme.
        depot_injection:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the patient receives depot (long-acting injectable) medication.
        depot_details:
          type: string
          description: Depot details.
        adverse_drug_reactions:
          type: string
          description: Adverse drug reactions.
        additional_notes:
          type: string
          description: Additional notes.
      required:
      - created_at
      - updated_at
      - assessment_id
      - takes_psychiatric_medications
      - takes_other_medications
      - medication_adherence
      - adherence_barriers
      - side_effects
      - clozapine_registered
      - depot_injection
      - depot_details
      - adverse_drug_reactions
      - additional_notes
      description: Current medications section header. One-to-one child of assessment.
    AssessmentMedicationItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        current_medications_id:
          type: string
          format: uuid
          description: Foreign key to the assessment_current_medications table.
        medication_name:
          type: string
          maxLength: 255
          description: Name of the medication.
        dose:
          type: string
          maxLength: 100
          description: Dosage amount and unit (e.g. 20mg, 100mg).
        frequency:
          type: string
          maxLength: 100
          description: Dosing frequency (e.g. once daily, twice daily, as needed).
        medication_type:
          type: string
          enum:
          - antidepressant
          - antipsychotic
          - anxiolytic
          - mood-stabiliser
          - hypnotic
          - stimulant
          - other
          - ''
          description: 'Medication classification: antidepressant, antipsychotic, anxiolytic, mood-stabiliser,
            hypnotic, stimulant, other, or empty.'
        indication:
          type: string
          description: Clinical indication for the medication.
        prescribing_clinician:
          type: string
          maxLength: 255
          description: Prescribing clinician.
        sort_order:
          type: integer
          format: int32
          description: Display order of the medication in the list.
      required:
      - created_at
      - updated_at
      - current_medications_id
      - medication_name
      - dose
      - frequency
      - medication_type
      - indication
      - prescribing_clinician
      - sort_order
      description: Individual medication entry with name, dose, frequency, and classification.
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Name.
        email:
          type: string
          description: Email address.
        phone:
          type: string
          description: Phone number.
        postal_address_as_full_text:
          type: string
          description: Postal address as full text.
        country_as_iso_3166_1_alpha_2:
          type: string
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type: string
          description: Postal code, such as for validating the postal address.
        role:
          type: string
          enum:
          - anaesthetist
          - surgeon
          - preop-nurse
          - perioperative-physician
          - geriatrician
          - pharmacist
          - other
          - ''
          description: Clinician role.
        registration_body:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - GPhC
          - other
          - ''
          description: Clinician registration body.
        registration_number:
          type: string
          description: Clinician registration number.
        united_kingdom_nhs_number:
          type: string
          maxLength: 12
          description: United Kingdom NHS number, unique per person.
      required:
      - created_at
      - updated_at
      - name
      - role
      - registration_body
      - registration_number
      description: Clinician
    Grade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        assessment_id:
          type: string
          format: uuid
          description: Foreign key to the parent assessment (unique, enforcing 1:1).
        gaf_score:
          type: integer
          format: int32
          description: 'GAF score (1-100): 91-100 superior functioning, 51-60 moderate symptoms, 1-10
            persistent danger.'
        gaf_category:
          type: string
          enum:
          - superior-functioning
          - absent-minimal-symptoms
          - transient-symptoms
          - mild-symptoms
          - moderate-symptoms
          - serious-symptoms
          - impaired-reality-testing
          - behaviour-influenced-by-delusions
          - danger-of-hurting-self-others
          - persistent-danger
          - ''
          description: GAF descriptive category corresponding to the score decile.
        symptom_severity:
          type: string
          enum:
          - minimal
          - mild
          - moderate
          - severe
          - extreme
          - ''
          description: 'Overall symptom severity: minimal, mild, moderate, severe, extreme, or empty.'
        functional_impairment:
          type: string
          enum:
          - minimal
          - mild
          - moderate
          - severe
          - extreme
          - ''
          description: 'Overall functional impairment level: minimal, mild, moderate, severe, extreme,
            or empty.'
        risk_classification:
          type: string
          enum:
          - low
          - moderate
          - high
          - imminent
          - ''
          description: 'Overall risk classification: low, moderate, high, imminent, or empty.'
        graded_at:
          type: string
          format: date-time
          description: Timestamp when the grading was computed.
      required:
      - created_at
      - updated_at
      - assessment_id
      - gaf_score
      - gaf_category
      - symptom_severity
      - functional_impairment
      - risk_classification
      - graded_at
      description: Computed GAF (Global Assessment of Functioning) score. Range 1-100, with higher scores
        indicating better functioning. One-to-one child of assessment.
    GradingAdditionalFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        grade_id:
          type: string
          format: uuid
          description: Foreign key to the parent grading result.
        flag_id:
          type: string
          maxLength: 30
          description: Identifier of the flag (e.g. FLAG-SUICIDE-001, FLAG-SECTION-001, FLAG-CAPACITY-001).
        category:
          type: string
          maxLength: 100
          description: Category of the flag (e.g. Risk Assessment, Capacity, Safeguarding, Substance Use).
        message:
          type: string
          description: Human-readable description of the flagged concern.
        priority:
          type: string
          enum:
          - high
          - medium
          - low
          description: 'Priority level: high, medium, or low.'
