components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Clinician full name.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as a single text block.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code.
        role:
          type: string
          enum:
          - doctor
          - nurse
          - paramedic
          - other
          - ''
          description: 'Primary clinical role: doctor, nurse, paramedic, or other.'
        registrationBody:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - GPhC
          - other
          - ''
          description: 'Professional registration body: GMC, NMC, HCPC, GPhC, or other.'
        registrationNumber:
          type: string
          description: Professional registration number issued by the registration body.
      required:
      - createdAt
      - updatedAt
      - name
      - role
      - registrationBody
      - registrationNumber
      description: Clinician identifying information for the assessing clinician.
    Patient:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          maxLength: 255
          description: Full patient name.
        birthDate:
          type: string
          format: date
          description: Date of birth.
        sex:
          type: string
          enum:
          - female
          - male
          - intersex
          - unknown
          - ''
          description: 'Sex recorded for clinical purposes: female, male, intersex, or unknown.'
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as a single text block.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code.
        unitedKingdomNhsNumber:
          type:
          - string
          - 'null'
          maxLength: 20
          description: United Kingdom NHS number, unique per person.
        hospitalMrn:
          type:
          - string
          - 'null'
          maxLength: 50
          description: Local hospital medical record number (MRN).
        heightAsCm:
          type:
          - number
          - 'null'
          format: double
          description: Height in centimetres.
        weightAsKg:
          type:
          - number
          - 'null'
          format: double
          description: Weight in kilograms.
        bodyMassIndex:
          type:
          - number
          - 'null'
          format: double
          description: Body mass index (BMI), kg/m^2.
        allergiesSummary:
          type: string
          description: Free-text summary of known allergies.
      required:
      - createdAt
      - updatedAt
      - name
      - birthDate
      - sex
      - allergiesSummary
      description: Patient demographic information used by the qSOFA assessment record.
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          description: A URI identifying the problem type
        title:
          type: string
          description: A short summary of the problem type
        status:
          type: integer
          description: The HTTP status code
        detail:
          type: string
          description: An explanation of this occurrence
        instance:
          type: string
          description: A URI identifying this occurrence
        code:
          type: string
          description: A short machine-readable reason
        errors:
          type: object
          description: Per-field detail, when validation failed
      required:
      - type
      - title
      - status
    QuickSequentialOrganFailureAssessment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the patient being assessed (delete restricted).
        clinicianId:
          type:
          - string
          - 'null'
          format: uuid
          description: Foreign key to the assessing clinician (optional; delete restricted).
        clinicianName:
          type: string
          maxLength: 255
          description: Name of the assessing clinician as recorded on the assessment.
        clinicianRole:
          type: string
          enum:
          - doctor
          - nurse
          - paramedic
          - other
          - ''
          description: 'Role of the assessing clinician: doctor, nurse, paramedic, or other.'
        assessedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Date and time the assessment was performed.
        careSetting:
          type: string
          enum:
          - emergency-department
          - ward
          - pre-hospital
          - other
          - ''
          description: 'Care setting: emergency-department, ward, pre-hospital, or other.'
        suspectedSource:
          type: string
          description: Suspected or confirmed infection source recorded with the assessment.
        patientIdentifier:
          type: string
          maxLength: 100
          description: Local patient identifier as recorded on the assessment.
        ageBand:
          type: string
          enum:
          - 16-39
          - 40-59
          - 60-74
          - 75-plus
          - ''
          description: 'Adult age band: 16-39, 40-59, 60-74, or 75-plus.'
        sex:
          type: string
          enum:
          - female
          - male
          - intersex
          - unknown
          - ''
          description: 'Patient sex recorded for the assessment: female, male, intersex, or unknown.'
        respiratoryRate:
          type:
          - number
          - 'null'
          format: double
          description: Criterion 1 — measured respiratory rate in breaths per minute; scores 1 point when
            >= 22.
        glasgowComaScale:
          type:
          - integer
          - 'null'
          format: int32
          description: Criterion 2 — Glasgow Coma Scale total (3-15); scores 1 point when < 15.
        mentationAltered:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Criterion 2 — altered-mentation flag (yes/no); scores the mentation point at the
            bedside when a formal GCS is unavailable.
        systolicBloodPressure:
          type:
          - number
          - 'null'
          format: double
          description: Criterion 3 — measured systolic blood pressure in mmHg; scores 1 point when <=
            100.
        clinicalNote:
          type: string
          description: Free-text clinical note recorded with the assessment.
      required:
      - createdAt
      - updatedAt
      - patientId
      - clinicianName
      - clinicianRole
      - careSetting
      - suspectedSource
      - patientIdentifier
      - ageBand
      - sex
      - mentationAltered
      - clinicalNote
      description: 'Main qSOFA assessment record: assessment context, patient identification, and the
        three scored criterion inputs (respiratory rate, mentation, systolic blood pressure).'
    QuickSequentialOrganFailureAssessmentGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        quickSequentialOrganFailureAssessmentId:
          type: string
          format: uuid
          description: Foreign key to the parent assessment (unique, 1:1).
        respiratoryRatePoint:
          type:
          - integer
          - 'null'
          format: int32
          description: Point (0 or 1) awarded for criterion 1, respiratory rate (>= 22 breaths/min).
        mentationPoint:
          type:
          - integer
          - 'null'
          format: int32
          description: Point (0 or 1) awarded for criterion 2, mentation (GCS < 15 or altered mentation).
        systolicBloodPressurePoint:
          type:
          - integer
          - 'null'
          format: int32
          description: Point (0 or 1) awarded for criterion 3, systolic blood pressure (<= 100 mmHg).
        totalScore:
          type:
          - integer
          - 'null'
          format: int32
          description: Summed qSOFA score across the three criteria (0-3).
        riskBand:
          type: string
          enum:
          - lower
          - higher
          - ''
          description: 'Derived risk band: lower (< 2) or higher (>= 2).'
        thresholdMet:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Whether the qSOFA >= 2 positive-screen escalation threshold was met: yes or no.'
        gradedAt:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the grade.
      required:
      - createdAt
      - updatedAt
      - quickSequentialOrganFailureAssessmentId
      - riskBand
      - thresholdMet
      - gradedAt
      description: 'Computed qSOFA grading result: per-criterion 0-1 points, summed total (0-3), derived
        risk band (lower/higher), and whether the >= 2 escalation threshold was met.'
    QuickSequentialOrganFailureAssessmentGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        quickSequentialOrganFailureAssessmentGradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        flagId:
          type: string
          maxLength: 50
          description: Stable flag identifier (e.g. F-SEPSIS-ESCALATION-001).
        category:
          type: string
          enum:
          - sepsis-escalation
          - hypotension
