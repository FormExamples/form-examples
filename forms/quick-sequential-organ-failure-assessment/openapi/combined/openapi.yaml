        respiratory_rate_point:
          type: integer
          format: int32
          description: Point (0 or 1) awarded for criterion 1, respiratory rate (>= 22 breaths/min).
        mentation_point:
          type: integer
          format: int32
          description: Point (0 or 1) awarded for criterion 2, mentation (GCS < 15 or altered mentation).
        systolic_blood_pressure_point:
          type: integer
          format: int32
          description: Point (0 or 1) awarded for criterion 3, systolic blood pressure (<= 100 mmHg).
