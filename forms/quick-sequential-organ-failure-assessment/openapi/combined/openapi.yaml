          type: string
          enum:
          - 16-39
          - 40-59
          - 60-74
          - 75-plus
          - ''
          description: 'Adult age band: 16-39, 40-59, 60-74, or 75-plus.'
        sex:
          type: string
          enum:
          - female
          - male
          - intersex
          - unknown
          - ''
          description: 'Patient sex recorded for the assessment: female, male, intersex, or unknown.'
        respiratory_rate:
          type: number
          format: double
          description: Criterion 1 — measured respiratory rate in breaths per minute; scores 1 point when
            >= 22.
        glasgow_coma_scale:
          type: integer
          format: int32
          description: Criterion 2 — Glasgow Coma Scale total (3-15); scores 1 point when < 15.
        mentation_altered:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Criterion 2 — altered-mentation flag (yes/no); scores the mentation point at the
            bedside when a formal GCS is unavailable.
        systolic_blood_pressure:
          type: number
          format: double
          description: Criterion 3 — measured systolic blood pressure in mmHg; scores 1 point when <=
            100.
        clinical_note:
          type: string
          description: Free-text clinical note recorded with the assessment.
      required:
      - created_at
      - updated_at
      - patient_id
      - clinician_name
      - clinician_role
      - care_setting
      - suspected_source
      - patient_identifier
      - age_band
      - sex
      - mentation_altered
      - clinical_note
      description: 'Main qSOFA assessment record: assessment context, patient identification, and the
