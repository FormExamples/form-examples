components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Name.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as full text.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code, such as for validating the postal address.
        role:
          type: string
          enum:
          - consultant
          - general-practitioner
          - rheumatologist
          - gastroenterologist
          - neurologist
          - ophthalmologist
          - infectious-disease-physician
          - pharmacist
          - nurse
          - phlebotomist
          - other
          - ''
          description: 'Clinician role: consultant, general-practitioner, rheumatologist, gastroenterologist,
            neurologist, ophthalmologist, infectious-disease-physician, pharmacist, nurse, phlebotomist,
            other.'
        registrationBody:
          type: string
          description: Professional registration body, as free text (varies by jurisdiction).
        registrationNumber:
          type: string
          description: Professional registration number.
      required:
      - createdAt
      - updatedAt
      - name
      - role
      - registrationBody
      - registrationNumber
      description: Clinician who requests the tests (and, where different, collects the samples).
    MedicalHumanLeukocyteAndDiseaseAssociationRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the patient.
        clinicianId:
          type: string
          format: uuid
          description: Foreign key to the requesting consultant or general practitioner.
        status:
          type: string
          enum:
          - draft
          - submitted
          - received
          - vetted
          - rejected
          - ''
          description: 'Request lifecycle status: draft, submitted, received, vetted, rejected.'
        requestDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the request was made.
        referrerDepartment:
          type: string
          maxLength: 255
          description: Department or practice of the requesting clinician.
        referrerOrganization:
          type: string
          maxLength: 255
          description: Hospital or organization of the requesting clinician.
        copyOfReportTo:
          type: string
          maxLength: 255
          description: Name or address for a copy of the report, if any.
        reportEmail:
          type:
          - string
          - 'null'
          description: 'Preferred email address for the report. Health data: use an authorized secure
            address only.'
        clinicalDetails:
          type: string
          maxLength: 1000
          description: Clinical details and suspected condition (the indication); the main input to the
            appropriateness axis.
        indicationCategory:
          type: string
          enum:
          - suspected-disease
          - pre-treatment-drug-hypersensitivity
          - treatment-response
          - family-screening
          - exclusion-of-disease
          - other
          - ''
          description: 'Structured indication category (added; the source form has only a free-text box):
            suspected-disease, pre-treatment-drug-hypersensitivity, treatment-response, family-screening,
            exclusion-of-disease, other.'
        ethnicity:
          type: string
          maxLength: 100
          description: Self-described ethnicity; allele frequencies differ by population.
        previousHlaTypingKnown:
          type: boolean
          description: Whether the patient has been HLA typed before (a result is lifelong, so repeat
            testing is usually unnecessary).
        plannedDrug:
          type: string
          maxLength: 100
          description: Drug whose prescribing depends on the result (for example abacavir or an anti-TNF
            agent), if any.
        urgentTesting:
          type: boolean
          description: Whether the sample requires urgent testing.
        urgentTestingReason:
          type: string
          maxLength: 500
          description: Reason urgent testing is needed.
        highRiskSample:
          type: boolean
          description: Whether the sample is high risk (for example infectious) and has been labelled
            and packaged accordingly.
        highRiskDescription:
          type: string
          maxLength: 255
          description: Nature of the risk, if any.
        requestedBySignedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: When the requester signed the request.
        consentAndIdentityConfirmed:
          type: boolean
          description: Requester confirms informed consent was obtained (including for genetic testing)
            and identity verified.
        sampleCollectorName:
          type: string
          maxLength: 255
          description: Name of the person who collected the sample.
        sampleCollectedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Date and time the sample was collected.
        identifiersOnSampleCount:
          type:
          - integer
          - 'null'
          format: int32
          description: Number of patient identifiers on the sample label (minimum 3 required).
        identifiersOnFormCount:
          type:
          - integer
          - 'null'
          format: int32
          description: Number of patient identifiers on the request form (minimum 3 required).
        sampleAndFormDetailsMatch:
          type: boolean
          description: Whether the details on the sample and the form match.
        sampleVolumeMl:
          type:
          - integer
          - 'null'
          format: int32
          description: Volume of EDTA blood sent in mL (5-10 mL expected).
        samplesOtherDescription:
          type: string
          maxLength: 255
          description: Other sample types sent, if any.
        laboratorySampleNumber:
          type: string
          maxLength: 100
          description: 'Laboratory use: sample number.'
        laboratorySampleReceivedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: 'Laboratory use: date and time the sample was received.'
        laboratoryIdentifiersCheckedBy:
          type: string
          maxLength: 255
          description: 'Laboratory use: name of the person who checked the sample identifiers.'
      required:
      - createdAt
      - updatedAt
      - patientId
      - clinicianId
      - status
      - referrerDepartment
      - referrerOrganization
      - copyOfReportTo
      - clinicalDetails
      - indicationCategory
      - ethnicity
      - previousHlaTypingKnown
      - plannedDrug
      - urgentTesting
      - urgentTestingReason
      - highRiskSample
      - highRiskDescription
      - consentAndIdentityConfirmed
      - sampleCollectorName
      - sampleAndFormDetailsMatch
      - samplesOtherDescription
      - laboratorySampleNumber
      - laboratoryIdentifiersCheckedBy
      description: 'HLA and disease association request: the HLA types requested, the clinical details
        (indication), report destination, high-risk sample status, requester and sample-collection details,
        and laboratory-use fields. Requested tests are in the child table.'
    MedicalHumanLeukocyteAndDiseaseAssociationRequestGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        requestId:
          type: string
          format: uuid
          description: Foreign key to the graded request (one grade per request).
        appropriatenessScore:
          type:
          - integer
          - 'null'
          format: int32
          description: Axis A appropriateness, 1-9 ordinal. No published score exists; anchored on laboratory
            standards and labelled as such.
        appropriatenessBand:
          type: string
          enum:
          - usually-appropriate
          - may-be-appropriate
          - usually-not-appropriate
          - ''
          description: 'Axis A band: usually-appropriate (7-9), may-be-appropriate (4-6), usually-not-appropriate
            (1-3).'
        identitySafetyBand:
          type: string
          enum:
          - ok
          - caution
          - reject-risk
          - ''
          description: 'Axis B identity / sample safety band: ok, caution, reject-risk.'
        completenessPercent:
          type:
          - integer
          - 'null'
          format: int32
          description: Axis C completeness, 0-100 percent.
        triageTier:
          type: string
          enum:
          - routine
          - urgent
          - emergency
          - stat
          - ''
          description: 'Axis D triage tier: routine, urgent, emergency, stat.'
        targetTimeframe:
          type: string
          maxLength: 50
          description: Target turnaround implied by the triage tier (local policy).
        requiredSamplesSummary:
          type: string
          maxLength: 500
          description: Sample tubes and volumes the requested tests need, derived from the tests chosen.
        recommendation:
          type: string
          enum:
          - accept
          - query-referrer
          - reject
          - ''
          description: 'Vetting recommendation: accept, query-referrer, reject.'
        clinicianNotes:
          type: string
          maxLength: 1000
          description: Free-text vetting notes.
        signedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Timestamp of the vetting person's electronic signature.
        gradedAt:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the result.
      required:
      - createdAt
      - updatedAt
      - requestId
      - appropriatenessBand
      - identitySafetyBand
      - triageTier
      - targetTimeframe
      - requiredSamplesSummary
      - recommendation
      - clinicianNotes
      - gradedAt
      description: 'Computed result of the four-axis engine for one request: appropriateness, identity
        / sample safety, completeness and triage priority, plus the vetting recommendation.'
    MedicalHumanLeukocyteAndDiseaseAssociationRequestGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        gradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        flagId:
          type: string
          maxLength: 50
          description: Stable flag identifier (for example F-DAY-OF-TRANSPLANT-001).
        category:
          type: string
          enum:
          - no-clinical-details
          - abacavir-start-pending
          - previous-hla-result-possible-duplicate
          - high-risk-sample
          - identity-mismatch-risk
          - report-destination-missing
          - other
          - ''
          description: Flag category.
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          - ''
          description: 'Priority: low, medium, high.'
        description:
          type: string
          maxLength: 500
          description: Human-readable description of what fired the flag.
        suggestedAction:
          type: string
          maxLength: 500
          description: Suggested action for the requester or laboratory.
      required:
      - createdAt
      - updatedAt
      - gradeId
      - flagId
      - category
      - priority
      - description
      - suggestedAction
      description: Safety-critical flags that fire independently of the four axes, with priority and a
        suggested action.
    MedicalHumanLeukocyteAndDiseaseAssociationRequestGradeRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        gradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        ruleId:
          type: string
          maxLength: 40
          description: Stable rule identifier (for example R-ID-3PT-01).
        axis:
          type: string
          enum:
          - appropriateness
          - identity
          - completeness
          - triage
          - ''
          description: 'Scoring axis: appropriateness, identity, completeness, triage.'
        category:
          type: string
          maxLength: 50
          description: Category the rule relates to.
        description:
          type: string
          maxLength: 500
          description: Human-readable description of why the rule fired.
      required:
      - createdAt
      - updatedAt
      - gradeId
      - ruleId
      - axis
      - category
      - description
      description: Audit trail of every appropriateness / identity / completeness / triage rule that fired
        for this request.
    MedicalHumanLeukocyteAndDiseaseAssociationRequestTest:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        requestId:
          type: string
          format: uuid
          description: Foreign key to the parent request.
        testCode:
          type: string
          enum:
          - hla-a29
          - hla-b27
          - hla-b51
          - hla-b-57-01
          - hla-dr15-dq6
          - hla-dq2-dq8
          - hla-dqa1-05
          - other-hla-disease-association
          description: Requested test code.
        testDetail:
          type: string
          maxLength: 255
          description: Free-text detail, for example the antigen when "other" is chosen.
      required:
      - createdAt
      - updatedAt
      - requestId
      - testCode
      - testDetail
      description: 'One requested HLA test (a ticked box): HLA-A29, B27, B51, B*57:01, DR15/DQ6, DQ2/DQ8,
        DQA1*05 or another HLA-disease association.'
    Patient:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        familyName:
          type: string
          maxLength: 255
          description: Family name (surname).
        givenNames:
          type: string
          maxLength: 255
          description: Given names (forenames).
        previousName:
          type: string
          maxLength: 255
          description: Previous name, if any; aids identity matching.
        birthDate:
          type: string
          format: date
          description: Birth date.
        sex:
          type: string
          enum:
          - female
          - male
          - other
          - unknown
          - ''
          description: 'Sex recorded: female, male, other, unknown.'
        nationalHealthIdentifier:
          type: string
          maxLength: 40
          description: National health identifier issued by the person's health system, as free text.
        medicalRecordNumber:
          type: string
          maxLength: 40
          description: Hospital or institution medical record number.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as full text.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code, such as for validating the postal address.
      required:
      - createdAt
      - updatedAt
      - familyName
      - givenNames
      - previousName
      - birthDate
      - sex
      - nationalHealthIdentifier
      - medicalRecordNumber
      description: Patient.
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          description: A URI identifying the problem type
        title:
          type: string
          description: A short summary of the problem type
        status:
          type: integer
          description: The HTTP status code
        detail:
          type: string
          description: An explanation of this occurrence
        instance:
          type: string
          description: A URI identifying this occurrence
        code:
          type: string
          description: A short machine-readable reason
        errors:
          type: object
          description: Per-field detail, when validation failed
      required:
      - type
      - title
      - status
