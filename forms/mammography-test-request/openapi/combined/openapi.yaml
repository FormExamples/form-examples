components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Name.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as full text.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code, such as for validating the postal address.
        role:
          type: string
          enum:
          - radiologist
          - gp
          - breast-surgeon
          - oncologist
          - hospital-doctor
          - radiographer
          - other
          - ''
          description: 'Clinician role: radiologist, gp, breast-surgeon, oncologist, hospital-doctor,
            radiographer, other.'
        registrationBody:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - other
          - ''
          description: 'Clinician registration body: GMC, NMC, HCPC, other.'
        registrationNumber:
          type: string
          description: Clinician registration number.
        unitedKingdomNhsNumber:
          type:
          - string
          - 'null'
          maxLength: 12
          description: United Kingdom NHS number, unique per person.
      required:
      - createdAt
      - updatedAt
      - name
      - role
      - registrationBody
      - registrationNumber
      description: Requesting clinician (referrer) who completes the mammography request.
    MammographyTestRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the patient.
        clinicianId:
          type: string
          format: uuid
          description: Foreign key to the requesting clinician (referrer).
        status:
          type: string
          enum:
          - draft
          - submitted
          - vetted
          - scheduled
          - rejected
          - ''
          description: 'Request lifecycle status: draft, submitted, vetted, scheduled, rejected.'
        siteName:
          type: string
          maxLength: 255
          description: Name of the requesting site or clinic.
        setting:
          type: string
          enum:
          - outpatient
          - inpatient
          - community
          - screening-unit
          - emergency
          - ''
          description: 'Care setting: outpatient, inpatient, community, screening-unit, emergency.'
        referralDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the referral was made.
        requestedByDate:
          type:
          - string
          - 'null'
          format: date
          description: Date by which the examination is requested to be performed.
        examType:
          type: string
          enum:
          - screening
          - diagnostic
          - symptomatic
          - surveillance
          - other
          - ''
          description: 'Type of mammography requested: screening, diagnostic, symptomatic, surveillance,
            other.'
        primaryIndication:
          type: string
          enum:
          - routine-screening
          - breast-lump
          - breast-pain
          - nipple-discharge
          - skin-change
          - family-history
          - follow-up-known-cancer
          - post-treatment-surveillance
          - recall-from-screening
          - other
          - ''
          description: Primary clinical indication, used for appropriateness scoring.
        clinicalQuestion:
          type: string
          maxLength: 1000
          description: Specific clinical question the examination should answer (highest-value field).
        relevantHistory:
          type: string
          maxLength: 1000
          description: Relevant medical, surgical, and breast history.
        laterality:
          type: string
          enum:
          - left
          - right
          - bilateral
          - not-applicable
          - ''
          description: 'Affected side: left, right, bilateral, not-applicable.'
        symptomLump:
          type: boolean
          description: Whether the patient reports a breast lump.
        symptomPain:
          type: boolean
          description: Whether the patient reports breast pain.
        symptomNippleDischarge:
          type: boolean
          description: Whether the patient reports nipple discharge.
        symptomSkinChange:
          type: boolean
          description: Whether the patient reports a skin change (dimpling, peau d'orange, erythema).
        symptomNippleInversion:
          type: boolean
          description: Whether the patient reports new nipple inversion or retraction.
        previousMammogram:
          type: string
          enum:
          - none
          - normal
          - abnormal
          - unknown
          - ''
          description: 'Previous mammogram outcome: none, normal, abnormal, unknown.'
        previousMammogramDate:
          type:
          - string
          - 'null'
          format: date
          description: Date of the most recent previous mammogram.
        familyHistoryBreastCancer:
          type: boolean
          description: Whether there is a family history of breast cancer.
        breastImplants:
          type: boolean
          description: Whether the patient has breast implants (affects technique and views).
        pregnancyOrLactating:
          type: string
          enum:
          - 'no'
          - pregnant
          - lactating
          - unknown
          - ''
          description: 'Pregnancy / lactation status: no, pregnant, lactating, unknown (affects radiation
            justification).'
        hormoneReplacementTherapy:
          type: boolean
          description: Whether the patient is on hormone replacement therapy (affects breast density).
        urgency:
          type: string
          enum:
          - routine
          - urgent
          - two-week-wait
          - emergency
          - ''
          description: 'Requested triage urgency: routine, urgent, two-week-wait, emergency.'
        supervisingConsultant:
          type: string
          maxLength: 255
          description: Name of the supervising / responsible consultant.
        requesterContact:
          type: string
          maxLength: 255
          description: Contact details (bleep / phone) for the requester.
        notes:
          type: string
          maxLength: 1000
          description: Free-text additional notes.
      required:
      - createdAt
      - updatedAt
      - patientId
      - clinicianId
      - status
      - siteName
      - setting
      - examType
      - primaryIndication
      - clinicalQuestion
      - relevantHistory
      - laterality
      - symptomLump
      - symptomPain
      - symptomNippleDischarge
      - symptomSkinChange
      - symptomNippleInversion
      - previousMammogram
      - familyHistoryBreastCancer
      - breastImplants
      - pregnancyOrLactating
      - hormoneReplacementTherapy
      - urgency
      - supervisingConsultant
      - requesterContact
      - notes
      description: Breast mammography imaging request (referral). Captures the requested examination,
        the clinical indication and question, symptoms, breast history / risk factors, and triage urgency.
    MammographyTestRequestGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        mammographyTestRequestId:
          type: string
          format: uuid
          description: Foreign key to the parent request (unique, 1:1).
        appropriatenessScore:
          type:
          - integer
          - 'null'
          format: int32
          description: ACR Appropriateness Criteria score (1-9).
        appropriatenessBand:
          type: string
          enum:
          - usually-appropriate
          - may-be-appropriate
          - usually-not-appropriate
          - ''
          description: 'Appropriateness band: usually-appropriate (7-9), may-be-appropriate (4-6), usually-not-appropriate
            (1-3).'
        triageTier:
          type: string
          enum:
          - routine
          - urgent
          - two-week-wait
          - emergency
          - ''
          description: 'Assigned cancer-pathway triage tier: routine, urgent, two-week-wait, emergency.'
        targetTimeframe:
          type: string
          maxLength: 50
          description: Target timeframe for the examination implied by the triage tier.
        twoWeekWaitEligible:
          type: boolean
          description: Whether the request meets NICE NG12 two-week-wait suspected-cancer criteria.
        twoWeekWaitRationale:
          type: string
          maxLength: 500
          description: Rationale for the two-week-wait eligibility decision.
        completenessPercent:
          type:
          - integer
          - 'null'
          format: int32
          description: Request completeness as a percentage of mandatory fields (0-100).
        priorityBand:
          type: string
          enum:
          - low
          - moderate
          - high
          - ''
          description: 'Clinical priority band: low, moderate, high.'
        recommendation:
          type: string
          enum:
          - accept
          - query-referrer
          - redirect
          - reject
          - ''
          description: 'Vetting recommendation: accept, query-referrer, redirect, reject.'
        clinicianNotes:
          type: string
          description: Free-text vetting notes.
        signedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Timestamp of vetting clinician electronic signature.
        gradedAt:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the result.
      required:
      - createdAt
      - updatedAt
      - mammographyTestRequestId
      - appropriatenessBand
      - triageTier
      - targetTimeframe
      - twoWeekWaitEligible
      - twoWeekWaitRationale
      - priorityBand
      - recommendation
      - clinicianNotes
      - gradedAt
      description: 'Computed four-axis grading result: appropriateness (ACR 1-9), cancer-pathway urgency,
        request completeness, and clinical priority.'
    MammographyTestRequestGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        mammographyTestRequestGradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        flagId:
          type: string
          maxLength: 50
          description: Stable flag identifier (e.g. F-SUSPECTED-CANCER-2WW-001).
        category:
          type: string
          enum:
          - suspected-cancer-2ww
          - breast-lump
          - bloody-nipple-discharge
          - age-below-screening
          - pregnancy-lactating
          - missing-indication
          - missing-clinical-question
          - other
          - ''
          description: Flag category.
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          - ''
          description: 'Priority: low, medium, high.'
        description:
          type: string
          maxLength: 500
          description: Human-readable description of what fired the flag.
        suggestedAction:
          type: string
          maxLength: 500
          description: Suggested clinical action (e.g. "refer on two-week-wait suspected-cancer pathway").
      required:
      - createdAt
      - updatedAt
      - mammographyTestRequestGradeId
      - flagId
      - category
      - priority
      - description
