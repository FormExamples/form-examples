components:
  schemas:
    BiopsyTestRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patient_id:
          type: string
          format: uuid
          description: Foreign key to the patient.
        clinician_id:
          type: string
          format: uuid
          description: Foreign key to the requesting clinician (referrer).
        status:
          type: string
          enum:
          - draft
          - submitted
          - vetted
          - scheduled
          - rejected
          - ''
          description: 'Request lifecycle status: draft, submitted, vetted, scheduled, rejected.'
        site_name:
          type: string
          maxLength: 255
          description: Name of the requesting site or clinic.
        setting:
          type: string
          enum:
          - outpatient
          - inpatient
          - community
          - emergency
          - ''
          description: 'Care setting: outpatient, inpatient, community, emergency.'
        referral_date:
          type: string
          format: date
          description: Date the referral was made.
        requested_by_date:
          type: string
          format: date
          description: Date by which the biopsy is requested to be performed.
        biopsy_site:
          type: string
          enum:
          - skin
          - breast
          - lymph-node
          - liver
          - kidney
          - prostate
          - lung
          - bone-marrow
          - gi-tract
          - thyroid
          - soft-tissue
          - other
          - ''
          description: 'Anatomical biopsy site: skin, breast, lymph-node, liver, kidney, prostate, lung,
            bone-marrow, gi-tract, thyroid, soft-tissue, other.'
        biopsy_method:
          type: string
          enum:
          - punch
          - excision
          - incision
          - core-needle
          - fine-needle-aspiration
          - image-guided
          - endoscopic
          - other
          - ''
          description: 'Biopsy method / technique: punch, excision, incision, core-needle, fine-needle-aspiration,
            image-guided, endoscopic, other.'
        laterality:
          type: string
          enum:
          - left
          - right
          - bilateral
          - not-applicable
          - ''
          description: 'Laterality of the target: left, right, bilateral, not-applicable.'
        primary_indication:
          type: string
          enum:
          - suspected-malignancy
          - cancer-staging
          - suspected-infection
          - inflammatory-disease
          - transplant-monitoring
          - lymphadenopathy
          - characterise-lesion
          - other
          - ''
          description: Primary clinical indication, used for appropriateness scoring.
        clinical_question:
          type: string
          maxLength: 1000
          description: Specific clinical question the biopsy should answer (highest-value field).
        relevant_history:
          type: string
          maxLength: 1000
          description: Relevant medical, surgical, and oncological history.
        lesion_description:
          type: string
          maxLength: 1000
          description: Description of the target lesion (size, location, imaging correlate).
        imaging_guidance_required:
          type: boolean
          description: Whether image guidance (ultrasound / CT / MRI) is required to target the lesion.
        taking_anticoagulant:
          type: boolean
          description: Whether the patient is taking an anticoagulant (e.g. warfarin, DOAC).
        anticoagulant_agent:
          type: string
          maxLength: 255
          description: Name of the anticoagulant agent, if any.
        taking_antiplatelet:
          type: boolean
          description: Whether the patient is taking an antiplatelet agent (e.g. clopidogrel).
        antiplatelet_agent:
          type: string
          maxLength: 255
          description: Name of the antiplatelet agent, if any.
        inr:
          type: number
          format: double
          description: International normalised ratio (INR), affecting bleeding-risk stratification.
        platelet_count:
          type: number
          format: double
          description: Platelet count (x10^9/L), affecting bleeding-risk stratification.
        bleeding_disorder:
          type: boolean
          description: Whether the patient has a known bleeding disorder / coagulopathy.
        immunosuppressed:
          type: boolean
          description: Whether the patient is immunosuppressed.
        urgency:
          type: string
          enum:
          - routine
          - urgent
          - two-week-wait
          - emergency
          - ''
          description: 'Requested triage urgency: routine, urgent, two-week-wait, emergency.'
        supervising_consultant:
          type: string
          maxLength: 255
          description: Name of the supervising / responsible consultant.
        requester_contact:
          type: string
          maxLength: 255
          description: Contact details (bleep / phone) for the requester.
        notes:
          type: string
          maxLength: 1000
          description: Free-text additional notes.
      required:
      - created_at
      - updated_at
      - patient_id
      - clinician_id
      - status
      - site_name
      - setting
      - biopsy_site
      - biopsy_method
      - laterality
      - primary_indication
      - clinical_question
      - relevant_history
      - lesion_description
      - imaging_guidance_required
      - taking_anticoagulant
      - anticoagulant_agent
      - taking_antiplatelet
      - antiplatelet_agent
      - bleeding_disorder
      - immunosuppressed
      - urgency
      - supervising_consultant
      - requester_contact
      - notes
      description: Tissue biopsy procedure / pathology request (referral). Captures the requested procedure
        (site, method, laterality), the clinical indication and question, lesion description, bleeding
        / coagulation status, and triage urgency.
    BiopsyTestRequestGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        biopsy_test_request_id:
          type: string
          format: uuid
          description: Foreign key to the parent request (unique, 1:1).
        appropriateness_score:
          type: integer
          format: int32
          description: ACR Appropriateness Criteria score (1-9).
        appropriateness_band:
          type: string
          enum:
          - usually-appropriate
          - may-be-appropriate
          - usually-not-appropriate
          - ''
          description: 'Appropriateness band: usually-appropriate (7-9), may-be-appropriate (4-6), usually-not-appropriate
            (1-3).'
        bleeding_risk_band:
          type: string
          enum:
          - low
          - moderate
          - high
          - ''
          description: 'Periprocedural bleeding-risk band: low, moderate, high, driven by anticoagulant
            / antiplatelet use, INR, platelet count, and bleeding disorder.'
        anticoagulant_action:
          type: string
          maxLength: 500
          description: Recommended periprocedural anticoagulant / antiplatelet action (e.g. withhold,
            bridge, proceed).
        completeness_percent:
          type: integer
          format: int32
          description: Request completeness as a percentage of mandatory fields (0-100).
        triage_tier:
          type: string
          enum:
          - routine
          - urgent
          - two-week-wait
          - emergency
          - ''
          description: 'Assigned triage tier: routine, urgent, two-week-wait, emergency.'
        target_timeframe:
          type: string
          maxLength: 50
          description: Target timeframe for the biopsy implied by the triage tier.
        two_week_wait_eligible:
          type: boolean
          description: Whether the request meets NICE NG12 suspected-cancer two-week-wait eligibility.
        recommendation:
          type: string
          enum:
          - accept
          - query-referrer
          - redirect
          - reject
          - ''
          description: 'Vetting recommendation: accept, query-referrer, redirect, reject.'
        clinician_notes:
          type: string
          description: Free-text vetting notes.
        signed_at:
          type: string
          format: date-time
          description: Timestamp of vetting clinician electronic signature.
        graded_at:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the result.
      required:
      - created_at
      - updated_at
      - biopsy_test_request_id
      - appropriateness_band
      - bleeding_risk_band
      - anticoagulant_action
      - triage_tier
      - target_timeframe
      - two_week_wait_eligible
      - recommendation
      - clinician_notes
      - graded_at
      description: 'Computed four-axis grading result: appropriateness (ACR 1-9), periprocedural bleeding
        risk, request completeness, and urgency / cancer-pathway triage.'
    BiopsyTestRequestGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        biopsy_test_request_grade_id:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        flag_id:
          type: string
          maxLength: 50
          description: Stable flag identifier (e.g. F-SUSPECTED-CANCER-2WW-001).
        category:
          type: string
          enum:
          - suspected-cancer-2ww
          - high-bleeding-risk-anticoag
          - coagulopathy
          - thrombocytopenia
          - immunosuppression
          - missing-indication
          - missing-clinical-question
          - other
          - ''
          description: Flag category.
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          - ''
          description: 'Priority: low, medium, high.'
        description:
          type: string
          maxLength: 500
          description: Human-readable description of what fired the flag.
        suggested_action:
          type: string
          maxLength: 500
          description: Suggested clinical action (e.g. "refer on a suspected-cancer two-week-wait pathway").
      required:
      - created_at
      - updated_at
      - biopsy_test_request_grade_id
      - flag_id
      - category
      - priority
      - description
      - suggested_action
      description: Safety-critical flags that fire independently of the four axes, with priority and a
        suggested action for the pathology / imaging team.
    BiopsyTestRequestGradeRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        biopsy_test_request_grade_id:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        rule_id:
          type: string
          maxLength: 40
          description: Stable rule identifier (e.g. R-APPROP-MALIGNANCY-01).
        axis:
          type: string
          enum:
          - appropriateness
          - bleeding-risk
          - completeness
          - urgency
          - ''
          description: 'Scoring axis the rule belongs to: appropriateness, bleeding-risk, completeness,
            urgency.'
        category:
          type: string
          maxLength: 50
          description: Category or indication the rule relates to.
        description:
          type: string
          maxLength: 500
          description: Human-readable description of why the rule fired.
      required:
      - created_at
      - updated_at
      - biopsy_test_request_grade_id
      - rule_id
      - axis
      - category
      - description
      description: Audit trail of every appropriateness / bleeding-risk / completeness / urgency rule
        that fired for this request.
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Name.
        email:
          type: string
          description: Email address.
        phone:
          type: string
          description: Phone number.
        postal_address_as_full_text:
          type: string
          description: Postal address as full text.
        country_as_iso_3166_1_alpha_2:
          type: string
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type: string
          description: Postal code, such as for validating the postal address.
        role:
          type: string
          enum:
          - pathologist
          - surgeon
          - radiologist
          - gastroenterologist
          - dermatologist
          - oncologist
          - gp
          - other
          - ''
          description: 'Clinician role: pathologist, surgeon, radiologist, gastroenterologist, dermatologist,
            oncologist, gp, other.'
        registration_body:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - other
          - ''
          description: 'Clinician registration body: GMC, NMC, HCPC, other.'
        registration_number:
          type: string
          description: Clinician registration number.
        united_kingdom_nhs_number:
          type: string
          maxLength: 12
          description: United Kingdom NHS number, unique per person.
      required:
      - created_at
      - updated_at
      - name
      - role
      - registration_body
      - registration_number
      description: Requesting clinician (referrer) who completes the biopsy request.
    Patient:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          maxLength: 255
          description: Name.
        birth_date:
          type: string
          format: date
          description: Birth date.
        email:
          type: string
          description: Email address.
        phone:
          type: string
          description: Phone number.
        postal_address_as_full_text:
          type: string
          description: Postal address as full text.
        country_as_iso_3166_1_alpha_2:
          type: string
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type: string
          description: Postal code, such as for validating the postal address.
        united_kingdom_nhs_number:
          type: string
          maxLength: 20
          description: United Kingdom NHS number, unique per person.
        waist_as_cm:
          type: number
          format: double
          description: Waist circumference measurement in cm, such as for calculating waist-height ratio
            (WHR).
        height_as_cm:
          type: number
          format: double
          description: Height measurement in cm, such as for calculating waist-height ratio (WHR).
        weight_as_kg:
          type: number
          format: double
          description: Weight as kg.
        body_mass_index:
          type: number
          format: double
          description: Body mass index (BMI) measurement.
        waist_height_ratio:
          type: number
          format: double
          description: Waist-height ratio (WHR) measurement.
        vo2_max:
          type: number
          format: double
          description: VO2 max measurement.
      required:
      - created_at
      - updated_at
      - name
      - birth_date
      description: Patient
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          description: A URI identifying the problem type
        title:
          type: string
          description: A short summary of the problem type
        status:
          type: integer
          description: The HTTP status code
        detail:
          type: string
          description: An explanation of this occurrence
        instance:
          type: string
          description: A URI identifying this occurrence
        code:
          type: string
          description: A short machine-readable reason
        errors:
          type: object
          description: Per-field detail, when validation failed
      required:
      - type
      - title
      - status
