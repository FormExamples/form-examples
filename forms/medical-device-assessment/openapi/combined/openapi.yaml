components:
  schemas:
    Assessor:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        name:
          type: string
          description: Name.
        email:
          type:
          - string
          - 'null'
          description: Email.
        phone:
          type:
          - string
          - 'null'
          description: Phone.
        role:
          type: string
          enum:
          - regulatory-affairs
          - clinical-engineer
          - quality-manager
          - clinical-safety-officer
          - notified-body-reviewer
          - other
          - ''
          description: 'Role. One of: regulatory-affairs, clinical-engineer, quality-manager, clinical-safety-officer,
            notified-body-reviewer, other.'
        organization:
          type: string
          description: Organization.
      required:
      - createdAt
      - updatedAt
      - name
      - role
      - organization
      description: Assessor.
    Manufacturer:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        name:
          type: string
          description: Name.
        email:
          type:
          - string
          - 'null'
          description: Email.
        phone:
          type:
          - string
          - 'null'
          description: Phone.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as full text.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as iso 3166 1 alpha 2.
        postcode:
          type:
          - string
          - 'null'
          description: Postcode.
        singleRegistrationNumber:
          type: string
          description: Single registration number.
        authorizedRepresentativeName:
          type: string
          description: Authorized representative name.
        unitedKingdomResponsiblePersonName:
          type: string
          description: United kingdom responsible person name.
      required:
      - createdAt
      - updatedAt
      - name
      - singleRegistrationNumber
      - authorizedRepresentativeName
      - unitedKingdomResponsiblePersonName
      description: Manufacturer.
