components:
  schemas:
    IssueTracker:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        reporterId:
          type: string
          format: uuid
          description: Foreign key to the reporter who originally raised the issue.
        status:
          type: string
          enum:
          - draft
          - open
          - in-progress
          - blocked
          - resolved
          - closed
          - duplicate
          - cancelled
          description: 'Lifecycle status: draft, open, in-progress, blocked, resolved, closed, duplicate,
            cancelled.'
        reportedAt:
          type: string
          format: date-time
          description: Timestamp the issue was first recorded in this tracker.
        discoveredAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Timestamp the issue was first discovered in the wild.
        startedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Timestamp work to remediate the issue began.
        resolvedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Timestamp the issue was resolved.
        issueCategory:
          type: string
          enum:
          - software-defect
          - service-outage
          - performance
          - security
          - data-protection
          - clinical-safety
          - workplace-safety
          - medical-device
          - regulatory
          - project-blocker
          - customer-complaint
          - hardware-fault
          - process
          - other
          - ''
          description: 'Issue category: software-defect, service-outage, security, clinical-safety, etc.'
        environment:
          type: string
          enum:
          - dev
          - test
          - staging
          - production
          - on-prem
          - field
          - ''
          description: 'Environment where the issue occurred: dev, test, staging, production, on-prem,
            field.'
        systemName:
          type: string
          maxLength: 255
          description: Name of the affected system or service.
        component:
          type: string
          maxLength: 255
          description: Specific component within the system that is affected.
        customerOrProjectTag:
          type: string
          maxLength: 255
          description: Customer name, project tag, or tenant identifier the issue is associated with.
        externalReference:
          type: string
          maxLength: 255
          description: 'External reference: ticket id, incident id, change request, RIDDOR or LFPSE id,
            etc.'
        ccSummary:
          type: string
          maxLength: 500
          description: 'Section CC: one-sentence summary of the problem as reported.'
        ccLongDescription:
          type: string
          description: 'Section CC: free-text long description of the chief complaint.'
        ccReportedByName:
          type: string
          maxLength: 255
          description: 'Section CC: name of the person who reported the chief complaint (may differ from
            the reporter row).'
        ccReportedVia:
          type: string
          enum:
          - self
          - colleague
          - customer
          - monitoring-alert
          - ticket
          - phone
          - email
          - chat
          - in-person
          - other
          - ''
          description: 'Section CC: channel through which the chief complaint was reported.'
        ptDiscovererName:
          type: string
          maxLength: 255
          description: 'Section Pt: name of the person who discovered the issue.'
        ptAffectedUsersCount:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Section Pt: estimated count of users affected.'
        ptAffectedUserGroups:
          type: string
          maxLength: 500
          description: 'Section Pt: free-text list of affected user groups, customer segments, or cohorts.'
        ptAssignees:
          type: string
          maxLength: 500
          description: 'Section Pt: free-text list of assignees responsible for working the issue.'
        ptStakeholdersToInform:
          type: string
          maxLength: 500
          description: 'Section Pt: free-text list of stakeholders to inform about progress.'
        ptObservers:
          type: string
          maxLength: 500
          description: 'Section Pt: free-text list of observers and CC recipients.'
        sxExternalSignals:
          type: string
          description: 'Section Sx: external signals observed by users — what is going wrong on the surface.'
        sxAlertIds:
          type: string
          maxLength: 500
          description: 'Section Sx: identifiers of monitoring alerts that fired (Sentry, PagerDuty, Datadog,
            CloudWatch).'
        sxErrorMessages:
          type: string
          description: 'Section Sx: verbatim error messages, status codes, or stack traces.'
        sxScreenshotsUrl:
          type: string
          maxLength: 500
          description: 'Section Sx: URL of an attached screenshot or screen capture.'
        sxLogsUrl:
          type: string
          maxLength: 500
          description: 'Section Sx: URL of attached log file or log query.'
        sxFirstObservedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: 'Section Sx: timestamp of the first observed symptom.'
        fxBrokenComponents:
          type: string
          description: 'Section Fx: free-text list of broken components, services, or pipelines.'
        fxFailedServices:
          type: string
          maxLength: 500
          description: 'Section Fx: list of failed services with their statuses.'
        fxStuckProcesses:
          type: string
          maxLength: 500
          description: 'Section Fx: list of stuck processes, queues, or batch jobs.'
        fxHardwareFaults:
          type: string
          maxLength: 500
          description: 'Section Fx: hardware-level faults — disk, network, sensor, instrument.'
        fxDataCorruption:
          type: string
          enum:
          - none
          - suspected
          - confirmed
          - unknown
          - ''
          description: 'Section Fx: data-corruption status — none, suspected, confirmed, or unknown.'
        hxRelatedIssues:
          type: string
          maxLength: 500
          description: 'Section Hx: identifiers of related or prior issues.'
        hxPriorOccurrences:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Section Hx: count of prior occurrences of the same issue.'
        hxRecentChangeUrl:
          type: string
          maxLength: 500
          description: 'Section Hx: URL of a recent change suspected to have caused the issue.'
        hxReferences:
          type: string
          description: 'Section Hx: free-text references — runbooks, RFCs, post-mortems.'
        hxTimeline:
          type: string
          description: 'Section Hx: free-text timeline of relevant events.'
        ixHypotheses:
          type: string
          description: 'Section Ix: hypotheses being investigated.'
        ixReproSteps:
          type: string
          description: 'Section Ix: reproduction steps tried so far.'
        ixDiagnosticQueries:
          type: string
          description: 'Section Ix: diagnostic queries, profiles, traces, or scripts used.'
        ixTestsRun:
          type: string
          maxLength: 500
          description: 'Section Ix: list of tests executed during investigation.'
        ixBlockingUnknowns:
          type: string
          description: 'Section Ix: known unknowns that are blocking diagnosis.'
        dxRootCause:
          type: string
          description: 'Section Dx: root-cause statement.'
        dxContributingCauses:
          type: string
          description: 'Section Dx: contributing or cascading causes.'
        dxScope:
          type: string
          enum:
          - single-instance
          - single-service
          - multiple-services
          - whole-system
          - organisation-wide
          - ''
          description: 'Section Dx: blast radius — single-instance, single-service, multiple-services,
            whole-system, or organisation-wide.'
        dxConfirmed:
          type: string
          enum:
          - 'yes'
          - 'no'
          - partial
          - ''
          description: 'Section Dx: whether the diagnosis is confirmed: yes, no, or partial.'
        txMitigationSteps:
          type: string
          description: 'Section Tx: mitigation steps taken to limit impact.'
        txFixPlan:
          type: string
          description: 'Section Tx: planned permanent fix.'
        txWorkaround:
          type: string
          description: 'Section Tx: workaround applied while the permanent fix is in flight.'
        txRollbackPlan:
          type: string
          description: 'Section Tx: rollback plan if the permanent fix fails.'
        txCommunicationPlan:
          type: string
          maxLength: 500
          description: 'Section Tx: communication plan — who tells whom, when, and through what channel.'
        pxExpectedResolutionAt:
          type:
          - string
          - 'null'
          format: date-time
          description: 'Section Px: expected resolution timestamp.'
        pxResidualRisk:
          type: string
          description: 'Section Px: residual risk that remains after the fix.'
        pxMonitoringPlan:
          type: string
          description: 'Section Px: monitoring plan to detect recurrence.'
        pxRecurrenceLikelihood:
          type: string
          enum:
          - very-low
          - low
          - moderate
          - high
          - very-high
          - ''
          description: 'Section Px: likelihood the issue will recur — very-low, low, moderate, high, very-high.'
        pxLessonsLearned:
          type: string
          description: 'Section Px: lessons learned to feed into a post-mortem.'
        scoreByPriorityRank:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Score 1 of 7: priority rank — 1 = do first, 2 = do second, ... (capped at 999).'
        scoreBySeverityOfImpact:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Score 2 of 7: severity of impact 1 (minimal) to 5 (catastrophic), per Saffir-Simpson
            scale.'
        scoreByMagnitudeOfDamage:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Score 3 of 7: magnitude of damage 1 (minor) to 10 (total destruction), per Richter
            earthquake scale.'
        scoreByHarmGrade:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Score 4 of 7: NHS LFPSE harm grade 0 (no harm) to 4 (fatal).'
        scoreByFailureCondition:
          type: string
          enum:
          - A
          - B
          - C
          - D
          - E
          - ''
          description: 'Score 5 of 7: aviation FAA / EASA failure condition A (catastrophic) to E (no
            effect).'
        scoreByMoscowRequirement:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Score 6 of 7: MoSCoW prioritisation 1 (must) to 4 (won''t).'
        scoreByFrequencyPercent:
          type:
          - number
          - 'null'
          format: double
          description: 'Score 7 of 7: frequency of occurrence as a percentage of usage affected, 0 to
            100.'
      required:
      - createdAt
      - updatedAt
      - reporterId
      - status
      - reportedAt
      - issueCategory
      - environment
      - systemName
      - component
      - customerOrProjectTag
      - externalReference
      - ccSummary
      - ccLongDescription
      - ccReportedByName
      - ccReportedVia
      - ptDiscovererName
      - ptAffectedUserGroups
      - ptAssignees
      - ptStakeholdersToInform
      - ptObservers
      - sxExternalSignals
      - sxAlertIds
      - sxErrorMessages
      - sxScreenshotsUrl
      - sxLogsUrl
      - fxBrokenComponents
      - fxFailedServices
      - fxStuckProcesses
      - fxHardwareFaults
      - fxDataCorruption
      - hxRelatedIssues
      - hxRecentChangeUrl
      - hxReferences
      - hxTimeline
      - ixHypotheses
      - ixReproSteps
      - ixDiagnosticQueries
      - ixTestsRun
      - ixBlockingUnknowns
      - dxRootCause
      - dxContributingCauses
      - dxScope
      - dxConfirmed
      - txMitigationSteps
      - txFixPlan
      - txWorkaround
      - txRollbackPlan
      - txCommunicationPlan
      - pxResidualRisk
      - pxMonitoringPlan
      - pxRecurrenceLikelihood
      - pxLessonsLearned
      - scoreByFailureCondition
      description: A reportable issue captured via a 10-step single-page wizard. Holds reporter metadata,
        the nine SOAP-style sections, and the seven raw input scores. Computed scores live in the issue_tracker_grade
        child table.
