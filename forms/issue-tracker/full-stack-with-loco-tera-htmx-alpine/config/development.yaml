logger:
  enable: true
  pretty_backtrace: true
  level: debug
  format: compact

server:
  port: 5150
  binding: localhost
  host: http://localhost
  middlewares:
    static:
      enable: true
      must_exist: true
      precompressed: false
      folder:
        uri: "/static"
        path: "assets/static"

workers:
  mode: BackgroundAsync

mailer:
  smtp:
    enable: false

database:
  uri: postgres://loco:loco@localhost:5432/issue_tracker_development
  enable_logging: false
  connect_timeout: 500
  idle_timeout: 500
  min_connections: 1
  max_connections: 1
  auto_migrate: true
  dangerously_truncate: false
  dangerously_recreate: false

queue:
  kind: Postgres
  uri: postgres://loco:loco@localhost:5432/issue_tracker_development
  dangerously_flush: false

auth:
  jwt:
    secret: change_me_in_production
    expiration: 604800
