logger:
  enable: true
  pretty_backtrace: true
  level: debug
  format: compact

server:
  port: 5151
  binding: localhost
  host: http://localhost

workers:
  mode: BackgroundAsync

mailer:
  smtp:
    enable: false

database:
  uri: postgres://loco:loco@localhost:5432/issue_tracker_test
  enable_logging: false
  connect_timeout: 500
  idle_timeout: 500
  min_connections: 1
  max_connections: 1
  auto_migrate: true
  dangerously_truncate: true
  dangerously_recreate: true

auth:
  jwt:
    secret: test_jwt_secret
    expiration: 604800
