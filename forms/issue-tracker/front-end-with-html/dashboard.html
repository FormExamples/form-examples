<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Issue Tracker — Dashboard</title>
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" id="theme-stylesheet" href="css/themes/light.css">
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('issue-tracker.theme.v1');
        var link = document.getElementById('theme-stylesheet');
        if (saved && link) link.setAttribute('href', 'css/themes/' + saved + '.css');
      } catch (e) {}
    })();
  </script>
</head>
<body>

<header>
    <div class="page-header-bar">
      <div class="page-header-title">
        <h1>Issue Tracker — Dashboard</h1>
        <p class="subtitle">Triage view across composite priority, severity, harm, failure-condition, environment, and free-text search.</p>
      </div>
      <div class="page-header-controls no-print">
      <label class="visually-hidden" for="locale-select">Language</label>
      <select class="theme-select" id="locale-select" aria-label="Language">
      <option class="theme-select-option" value="en-GB" selected lang="en-GB">English (UK)</option>
      <option class="theme-select-option" value="en-US" lang="en-US">English (US)</option>
      <option class="theme-select-option" value="cy-GB" lang="cy-GB">Cymraeg</option>
      <option class="theme-select-option" value="de-DE" lang="de-DE">Deutsch</option>
      </select>
      <label class="visually-hidden" for="theme-select">Theme</label>
      <select class="theme-select" id="theme-select" aria-label="Theme">
      <option class="theme-select-option" value="abyss">Abyss</option>
      <option class="theme-select-option" value="acid">Acid</option>
      <option class="theme-select-option" value="adobe-spectrum">Adobe Spectrum</option>
      <option class="theme-select-option" value="aqua">Aqua</option>
      <option class="theme-select-option" value="autumn">Autumn</option>
      <option class="theme-select-option" value="black">Black</option>
      <option class="theme-select-option" value="bumblebee">Bumblebee</option>
      <option class="theme-select-option" value="business">Business</option>
      <option class="theme-select-option" value="caramellatte">Caramellatte</option>
      <option class="theme-select-option" value="cmyk">Cmyk</option>
      <option class="theme-select-option" value="coffee">Coffee</option>
      <option class="theme-select-option" value="corporate">Corporate</option>
      <option class="theme-select-option" value="cupcake">Cupcake</option>
      <option class="theme-select-option" value="cyberpunk">Cyberpunk</option>
      <option class="theme-select-option" value="dark">Dark</option>
      <option class="theme-select-option" value="dim">Dim</option>
      <option class="theme-select-option" value="dracula">Dracula</option>
      <option class="theme-select-option" value="emerald">Emerald</option>
      <option class="theme-select-option" value="fantasy">Fantasy</option>
      <option class="theme-select-option" value="forest">Forest</option>
      <option class="theme-select-option" value="garden">Garden</option>
      <option class="theme-select-option" value="halloween">Halloween</option>
      <option class="theme-select-option" value="lemonade">Lemonade</option>
      <option class="theme-select-option" value="light" selected>Light</option>
      <option class="theme-select-option" value="lofi">Lofi</option>
      <option class="theme-select-option" value="luxury">Luxury</option>
      <option class="theme-select-option" value="mozilla-protocol">Mozilla Protocol</option>
      <option class="theme-select-option" value="night">Night</option>
      <option class="theme-select-option" value="nord">Nord</option>
      <option class="theme-select-option" value="pastel">Pastel</option>
      <option class="theme-select-option" value="retro">Retro</option>
      <option class="theme-select-option" value="silk">Silk</option>
      <option class="theme-select-option" value="sunset">Sunset</option>
      <option class="theme-select-option" value="synthwave">Synthwave</option>
      <option class="theme-select-option" value="united-kingdom-government-digital-service">UK · Government Digital Service</option>
      <option class="theme-select-option" value="united-kingdom-national-health-service-england-for-patients">UK · NHS England — Patients</option>
      <option class="theme-select-option" value="united-kingdom-national-health-service-england-for-practitioners">UK · NHS England — Practitioners</option>
      <option class="theme-select-option" value="united-kingdom-national-health-service-scotland-for-patients">UK · NHS Scotland — Patients</option>
      <option class="theme-select-option" value="united-kingdom-national-health-service-scotland-for-practitioners">UK · NHS Scotland — Practitioners</option>
      <option class="theme-select-option" value="united-kingdom-national-health-service-wales-for-patients">UK · NHS Wales — Patients</option>
      <option class="theme-select-option" value="united-kingdom-national-health-service-wales-for-practitioners">UK · NHS Wales — Practitioners</option>
      <option class="theme-select-option" value="united-states-web-design-system">US · Web Design System</option>
      <option class="theme-select-option" value="valentine">Valentine</option>
      <option class="theme-select-option" value="winter">Winter</option>
      <option class="theme-select-option" value="wireframe">Wireframe</option>
      </select>
      <label class="visually-hidden" for="text-size-chooser">Text size</label>
      <select class="theme-select" id="text-size-chooser" aria-label="Text size">
      <option class="theme-select-option" value="small">Small</option>
      <option class="theme-select-option" value="medium" selected>Medium</option>
      <option class="theme-select-option" value="large">Large</option>
      <option class="theme-select-option" value="x-large">X Large</option>
      </select>
      <div class="share-chooser">
      <button type="button" class="share-chooser-button" id="share-chooser" aria-label="Share this page" aria-expanded="false" aria-controls="share-chooser-list">
      <span class="share-chooser-icon" aria-hidden="true">↪</span>
      </button>
      <ul class="share-chooser-list" id="share-chooser-list" hidden>
      <li class="share-chooser-list-item">
      <button type="button" class="share-chooser-copy" id="share-chooser-copy">Copy link</button>
      </li>
      </ul>
      <p class="share-chooser-status" id="share-chooser-status" aria-live="polite"></p>
      </div>
      </div>
    </div>
</header>

<main>

<section id="filters" aria-label="Filters">
  <label>Search
    <input id="search" type="search" placeholder="Search CC, system, assignee">
  </label>
  <label>Composite priority
    <select id="filter-composite" data-field="compositePriority">
      <option value="">All</option>
      <option>critical</option><option>high</option>
      <option>moderate</option><option>low</option>
    </select>
  </label>
  <label>Severity
    <select id="filter-severity" data-field="scoreBySeverityOfImpact">
      <option value="">All</option>
      <option value="5">5 — catastrophic</option>
      <option value="4">4 — major</option>
      <option value="3">3 — moderate</option>
      <option value="2">2 — minor</option>
      <option value="1">1 — minimal</option>
    </select>
  </label>
  <label>Harm grade
    <select id="filter-harm" data-field="scoreByHarmGrade">
      <option value="">All</option>
      <option value="4">4 — fatal</option>
      <option value="3">3 — severe</option>
      <option value="2">2 — moderate</option>
      <option value="1">1 — low</option>
      <option value="0">0 — no harm</option>
    </select>
  </label>
  <label>Failure
    <select id="filter-failure" data-field="scoreByFailureCondition">
      <option value="">All</option>
      <option value="A">A — catastrophic</option>
      <option value="B">B — hazardous</option>
      <option value="C">C — major</option>
      <option value="D">D — minor</option>
      <option value="E">E — no effect</option>
    </select>
  </label>
  <label>Environment
    <select id="filter-environment" data-field="environment">
      <option value="">All</option>
      <option>production</option><option>staging</option><option>test</option>
      <option>dev</option><option>on-prem</option><option>field</option>
    </select>
  </label>
  <label>Status
    <select id="filter-status" data-field="status">
      <option value="">All</option>
      <option>draft</option><option>open</option><option>in-progress</option>
      <option>blocked</option><option>resolved</option><option>closed</option>
      <option>duplicate</option><option>cancelled</option>
    </select>
  </label>
</section>

<p class="row-count" id="row-count"></p>

<table id="issues" aria-label="Issues">
  <thead>
    <tr>
      <th data-sort="id">ID</th>
      <th data-sort="status">Status</th>
      <th data-sort="compositePriority">Composite</th>
      <th data-sort="scoreBySeverityOfImpact">Sev</th>
      <th data-sort="scoreByHarmGrade">Harm</th>
      <th data-sort="scoreByFailureCondition">Fail</th>
      <th data-sort="scoreByPriorityRank">Pri</th>
      <th data-sort="scoreByFrequencyPercent">Freq %</th>
      <th data-sort="ccSummary">Chief complaint</th>
      <th data-sort="systemName">System</th>
      <th data-sort="environment">Env</th>
      <th data-sort="ptAssignees">Assignee</th>
      <th data-sort="reportedAt">Reported</th>
    </tr>
  </thead>
  <tbody id="issues-body"></tbody>
</table>

</main>

<footer>
  <p>&copy; 2026 Issue Tracker — static HTML dashboard.</p>
</footer>

  <script type="module" src="js/dashboard.js"></script>
  <script type="module" src="js/theme-select.js"></script>
  <script type="module" src="js/text-size-chooser.js"></script>
  <script type="module" src="js/share-chooser.js"></script>
  <script type="module" src="js/locale-select.js"></script>
  <script type="module" src="js/table-export.js"></script>
</body>
</html>
