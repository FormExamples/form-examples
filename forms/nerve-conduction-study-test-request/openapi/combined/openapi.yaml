components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Name.
        email:
          type: string
          description: Email address.
        phone:
          type: string
          description: Phone number.
        postal_address_as_full_text:
          type: string
          description: Postal address as full text.
        country_as_iso_3166_1_alpha_2:
          type: string
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type: string
          description: Postal code, such as for validating the postal address.
        role:
          type: string
          enum:
          - neurologist
          - neurophysiologist
          - gp
          - hospital-doctor
          - rheumatologist
          - other
          - ''
          description: 'Clinician role: neurologist, neurophysiologist, gp, hospital-doctor, rheumatologist,
            other.'
        registration_body:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - other
          - ''
          description: 'Clinician registration body: GMC, NMC, HCPC, other.'
        registration_number:
          type: string
          description: Clinician registration number.
        united_kingdom_nhs_number:
          type: string
          maxLength: 12
          description: United Kingdom NHS number, unique per person.
      required:
      - created_at
      - updated_at
      - name
      - role
      - registration_body
      - registration_number
      description: Requesting clinician (referrer) who completes the nerve conduction study request.
    NerveConductionStudyTestRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patient_id:
          type: string
          format: uuid
          description: Foreign key to the patient.
        clinician_id:
          type: string
          format: uuid
          description: Foreign key to the requesting clinician (referrer).
        status:
          type: string
          enum:
          - draft
          - submitted
          - vetted
          - scheduled
          - rejected
          - ''
          description: 'Request lifecycle status: draft, submitted, vetted, scheduled, rejected.'
        site_name:
          type: string
          maxLength: 255
          description: Name of the requesting site or clinic.
        setting:
          type: string
          enum:
          - outpatient
          - inpatient
          - community
          - emergency
          - ''
          description: 'Care setting: outpatient, inpatient, community, emergency.'
        referral_date:
          type: string
          format: date
          description: Date the referral was made.
        requested_by_date:
          type: string
          format: date
          description: Date by which the study is requested to be performed.
        study_type:
          type: string
          enum:
          - nerve-conduction
          - emg
          - nerve-conduction-and-emg
          - repetitive-stimulation
          - other
          - ''
          description: 'Requested study type: nerve-conduction, emg, nerve-conduction-and-emg, repetitive-stimulation,
            other.'
        region:
          type: string
          enum:
          - upper-limb
          - lower-limb
          - all-limbs
          - cranial
          - generalised
          - other
          - ''
          description: 'Anatomical region to study: upper-limb, lower-limb, all-limbs, cranial, generalised,
            other.'
        laterality:
          type: string
          enum:
          - left
          - right
          - bilateral
          - not-applicable
          - ''
          description: 'Laterality of the study: left, right, bilateral, not-applicable.'
        primary_indication:
          type: string
          enum:
          - carpal-tunnel
          - peripheral-neuropathy
          - radiculopathy
          - suspected-motor-neurone-disease
          - myopathy
          - plexopathy
          - suspected-myasthenia
          - nerve-injury
          - other
          - ''
          description: 'Primary clinical indication, used for appropriateness scoring: carpal-tunnel,
            peripheral-neuropathy, radiculopathy, suspected-motor-neurone-disease, myopathy, plexopathy,
            suspected-myasthenia, nerve-injury, other.'
        clinical_question:
          type: string
          maxLength: 1000
          description: Specific clinical question the study should answer (highest-value field).
        relevant_history:
          type: string
          maxLength: 1000
          description: Relevant medical, surgical, and neurological history.
        symptom_numbness:
          type: boolean
          description: Whether the patient reports numbness.
        symptom_weakness:
          type: boolean
          description: Whether the patient reports weakness.
        symptom_pain:
          type: boolean
          description: Whether the patient reports pain.
        symptom_tingling:
          type: boolean
          description: Whether the patient reports tingling / paraesthesia.
        symptom_duration:
          type: string
          enum:
          - less-than-6-weeks
          - 6-weeks-to-3-months
          - 3-to-12-months
          - over-12-months
          - ''
          description: 'Duration of symptoms: less-than-6-weeks, 6-weeks-to-3-months, 3-to-12-months,
            over-12-months.'
        diabetes:
          type: boolean
          description: Whether the patient has diabetes (relevant to polyneuropathy and baseline conduction).
        taking_anticoagulant:
          type: boolean
          description: Whether the patient is taking an anticoagulant (needle-EMG bleeding-risk factor).
        pacemaker_or_icd:
          type: boolean
          description: Whether the patient has a pacemaker or implantable cardioverter-defibrillator (stimulation-caution
            factor).
        urgency:
          type: string
          enum:
          - routine
          - urgent
          - ''
          description: 'Requested triage urgency: routine, urgent.'
        supervising_consultant:
          type: string
          maxLength: 255
          description: Name of the supervising / responsible consultant.
        requester_contact:
          type: string
          maxLength: 255
          description: Contact details (bleep / phone) for the requester.
        notes:
          type: string
          maxLength: 1000
          description: Free-text additional notes.
      required:
      - created_at
      - updated_at
      - patient_id
      - clinician_id
      - status
      - site_name
      - setting
      - study_type
      - region
      - laterality
      - primary_indication
      - clinical_question
      - relevant_history
      - symptom_numbness
      - symptom_weakness
      - symptom_pain
      - symptom_tingling
      - symptom_duration
      - diabetes
      - taking_anticoagulant
      - pacemaker_or_icd
      - urgency
      - supervising_consultant
      - requester_contact
      - notes
      description: Nerve conduction study / EMG (electrodiagnostic / neurophysiology) request (referral).
        Captures the requested study, region and laterality, the clinical indication and question, symptoms,
        safety factors (anticoagulation, cardiac device), and triage urgency.
    NerveConductionStudyTestRequestGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        nerve_conduction_study_test_request_id:
          type: string
          format: uuid
          description: Foreign key to the parent request (unique, 1:1).
        appropriateness_score:
          type: integer
          format: int32
          description: AANEM / AAN electrodiagnostic appropriateness score (1-9), based on indication
            match.
        appropriateness_band:
          type: string
          enum:
          - usually-appropriate
          - may-be-appropriate
          - usually-not-appropriate
          - ''
          description: 'Appropriateness band: usually-appropriate (7-9), may-be-appropriate (4-6), usually-not-appropriate
            (1-3).'
        procedural_risk_band:
          type: string
          enum:
          - low
          - moderate
          - high
          - ''
          description: 'Procedural risk band: low, moderate, high. Driven by needle EMG against anticoagulation
            or a cardiac device.'
        completeness_percent:
          type: integer
          format: int32
          description: Request completeness as a percentage of mandatory fields (0-100).
        triage_tier:
          type: string
          enum:
          - routine
          - urgent
          - ''
          description: 'Assigned triage tier: routine, urgent.'
        target_timeframe:
          type: string
          maxLength: 50
          description: Target timeframe for the study implied by the triage tier.
        recommendation:
          type: string
          enum:
          - accept
          - query-referrer
          - redirect
          - reject
          - ''
          description: 'Vetting recommendation: accept, query-referrer, redirect, reject.'
        clinician_notes:
          type: string
          description: Free-text vetting notes.
        signed_at:
          type: string
          format: date-time
          description: Timestamp of vetting clinician electronic signature.
        graded_at:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the result.
      required:
      - created_at
      - updated_at
      - nerve_conduction_study_test_request_id
      - appropriateness_band
      - procedural_risk_band
      - triage_tier
      - target_timeframe
      - recommendation
      - clinician_notes
      - graded_at
      description: 'Computed four-axis grading result: appropriateness (AANEM / AAN 1-9), procedural risk,
        request completeness, and triage priority.'
    NerveConductionStudyTestRequestGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        nerve_conduction_study_test_request_grade_id:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        flag_id:
          type: string
          maxLength: 50
          description: Stable flag identifier (e.g. F-SUSPECTED-MND-URGENT-001).
        category:
          type: string
          enum:
          - suspected-mnd-urgent
          - anticoag-emg-bleeding-risk
          - pacemaker-stimulation-caution
          - missing-indication
          - missing-clinical-question
          - other
          - ''
          description: 'Flag category: suspected-mnd-urgent, anticoag-emg-bleeding-risk, pacemaker-stimulation-caution,
            missing-indication, missing-clinical-question, other.'
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          - ''
          description: 'Priority: low, medium, high.'
        description:
          type: string
          maxLength: 500
          description: Human-readable description of what fired the flag.
        suggested_action:
          type: string
          maxLength: 500
          description: Suggested clinical action (e.g. "expedite as urgent neurophysiology slot").
      required:
      - created_at
      - updated_at
      - nerve_conduction_study_test_request_grade_id
      - flag_id
      - category
      - priority
      - description
      - suggested_action
      description: Safety-critical flags that fire independently of the four axes, with priority and a
        suggested action for the neurophysiology team.
    NerveConductionStudyTestRequestGradeRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        nerve_conduction_study_test_request_grade_id:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        rule_id:
          type: string
          maxLength: 40
          description: Stable rule identifier (e.g. R-APPROP-CARPAL-TUNNEL-01).
        axis:
          type: string
          enum:
          - appropriateness
          - risk
          - completeness
          - triage
          - ''
          description: 'Scoring axis the rule belongs to: appropriateness, risk, completeness, triage.'
        category:
          type: string
          maxLength: 50
          description: Category or indication the rule relates to.
        description:
          type: string
          maxLength: 500
          description: Human-readable description of why the rule fired.
      required:
      - created_at
      - updated_at
      - nerve_conduction_study_test_request_grade_id
      - rule_id
      - axis
      - category
      - description
