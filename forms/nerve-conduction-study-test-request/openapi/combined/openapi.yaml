components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Name.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as full text.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code, such as for validating the postal address.
        role:
          type: string
          enum:
          - neurologist
          - neurophysiologist
          - gp
          - hospital-doctor
          - rheumatologist
          - other
          - ''
          description: 'Clinician role: neurologist, neurophysiologist, gp, hospital-doctor, rheumatologist,
            other.'
        registrationBody:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - other
          - ''
          description: 'Clinician registration body: GMC, NMC, HCPC, other.'
        registrationNumber:
          type: string
          description: Clinician registration number.
        unitedKingdomNhsNumber:
          type:
          - string
          - 'null'
          maxLength: 12
          description: United Kingdom NHS number, unique per person.
      required:
      - createdAt
      - updatedAt
      - name
      - role
      - registrationBody
      - registrationNumber
      description: Requesting clinician (referrer) who completes the nerve conduction study request.
    NerveConductionStudyTestRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the patient.
        clinicianId:
          type: string
          format: uuid
          description: Foreign key to the requesting clinician (referrer).
        status:
          type: string
          enum:
          - draft
          - submitted
          - vetted
          - scheduled
          - rejected
          - ''
          description: 'Request lifecycle status: draft, submitted, vetted, scheduled, rejected.'
        siteName:
          type: string
          maxLength: 255
          description: Name of the requesting site or clinic.
        setting:
          type: string
          enum:
          - outpatient
          - inpatient
          - community
          - emergency
          - ''
          description: 'Care setting: outpatient, inpatient, community, emergency.'
        referralDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the referral was made.
        requestedByDate:
          type:
          - string
          - 'null'
          format: date
          description: Date by which the study is requested to be performed.
        studyType:
          type: string
          enum:
          - nerve-conduction
          - emg
          - nerve-conduction-and-emg
          - repetitive-stimulation
          - other
          - ''
          description: 'Requested study type: nerve-conduction, emg, nerve-conduction-and-emg, repetitive-stimulation,
            other.'
        region:
          type: string
          enum:
          - upper-limb
          - lower-limb
          - all-limbs
          - cranial
          - generalised
          - other
          - ''
          description: 'Anatomical region to study: upper-limb, lower-limb, all-limbs, cranial, generalised,
            other.'
        laterality:
          type: string
          enum:
          - left
          - right
          - bilateral
          - not-applicable
          - ''
          description: 'Laterality of the study: left, right, bilateral, not-applicable.'
        primaryIndication:
          type: string
          enum:
          - carpal-tunnel
          - peripheral-neuropathy
          - radiculopathy
          - suspected-motor-neurone-disease
          - myopathy
          - plexopathy
          - suspected-myasthenia
          - nerve-injury
          - other
          - ''
          description: 'Primary clinical indication, used for appropriateness scoring: carpal-tunnel,
            peripheral-neuropathy, radiculopathy, suspected-motor-neurone-disease, myopathy, plexopathy,
            suspected-myasthenia, nerve-injury, other.'
        clinicalQuestion:
          type: string
          maxLength: 1000
          description: Specific clinical question the study should answer (highest-value field).
        relevantHistory:
          type: string
          maxLength: 1000
          description: Relevant medical, surgical, and neurological history.
        symptomNumbness:
          type: boolean
          description: Whether the patient reports numbness.
        symptomWeakness:
          type: boolean
          description: Whether the patient reports weakness.
        symptomPain:
          type: boolean
          description: Whether the patient reports pain.
        symptomTingling:
          type: boolean
          description: Whether the patient reports tingling / paraesthesia.
        symptomDuration:
          type: string
          enum:
          - less-than-6-weeks
          - 6-weeks-to-3-months
          - 3-to-12-months
          - over-12-months
          - ''
          description: 'Duration of symptoms: less-than-6-weeks, 6-weeks-to-3-months, 3-to-12-months,
            over-12-months.'
        diabetes:
          type: boolean
          description: Whether the patient has diabetes (relevant to polyneuropathy and baseline conduction).
        takingAnticoagulant:
          type: boolean
          description: Whether the patient is taking an anticoagulant (needle-EMG bleeding-risk factor).
        pacemakerOrIcd:
          type: boolean
          description: Whether the patient has a pacemaker or implantable cardioverter-defibrillator (stimulation-caution
            factor).
        urgency:
          type: string
          enum:
          - routine
          - urgent
          - ''
          description: 'Requested triage urgency: routine, urgent.'
        supervisingConsultant:
          type: string
          maxLength: 255
          description: Name of the supervising / responsible consultant.
        requesterContact:
          type: string
          maxLength: 255
          description: Contact details (bleep / phone) for the requester.
        notes:
          type: string
          maxLength: 1000
          description: Free-text additional notes.
      required:
      - createdAt
      - updatedAt
      - patientId
      - clinicianId
      - status
      - siteName
      - setting
      - studyType
      - region
      - laterality
      - primaryIndication
      - clinicalQuestion
      - relevantHistory
      - symptomNumbness
      - symptomWeakness
      - symptomPain
      - symptomTingling
      - symptomDuration
      - diabetes
      - takingAnticoagulant
      - pacemakerOrIcd
      - urgency
      - supervisingConsultant
      - requesterContact
      - notes
      description: Nerve conduction study / EMG (electrodiagnostic / neurophysiology) request (referral).
        Captures the requested study, region and laterality, the clinical indication and question, symptoms,
        safety factors (anticoagulation, cardiac device), and triage urgency.
    NerveConductionStudyTestRequestGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        nerveConductionStudyTestRequestId:
          type: string
          format: uuid
          description: Foreign key to the parent request (unique, 1:1).
        appropriatenessScore:
          type:
          - integer
          - 'null'
          format: int32
          description: AANEM / AAN electrodiagnostic appropriateness score (1-9), based on indication
            match.
        appropriatenessBand:
          type: string
          enum:
          - usually-appropriate
          - may-be-appropriate
          - usually-not-appropriate
          - ''
          description: 'Appropriateness band: usually-appropriate (7-9), may-be-appropriate (4-6), usually-not-appropriate
            (1-3).'
        proceduralRiskBand:
          type: string
          enum:
          - low
          - moderate
          - high
          - ''
          description: 'Procedural risk band: low, moderate, high. Driven by needle EMG against anticoagulation
            or a cardiac device.'
        completenessPercent:
          type:
          - integer
          - 'null'
          format: int32
          description: Request completeness as a percentage of mandatory fields (0-100).
        triageTier:
          type: string
          enum:
          - routine
          - urgent
          - ''
          description: 'Assigned triage tier: routine, urgent.'
        targetTimeframe:
          type: string
          maxLength: 50
          description: Target timeframe for the study implied by the triage tier.
        recommendation:
          type: string
          enum:
          - accept
          - query-referrer
          - redirect
          - reject
          - ''
          description: 'Vetting recommendation: accept, query-referrer, redirect, reject.'
        clinicianNotes:
          type: string
          description: Free-text vetting notes.
        signedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Timestamp of vetting clinician electronic signature.
        gradedAt:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the result.
      required:
      - createdAt
      - updatedAt
      - nerveConductionStudyTestRequestId
      - appropriatenessBand
      - proceduralRiskBand
      - triageTier
      - targetTimeframe
      - recommendation
      - clinicianNotes
      - gradedAt
      description: 'Computed four-axis grading result: appropriateness (AANEM / AAN 1-9), procedural risk,
        request completeness, and triage priority.'
    NerveConductionStudyTestRequestGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        nerveConductionStudyTestRequestGradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        flagId:
          type: string
          maxLength: 50
          description: Stable flag identifier (e.g. F-SUSPECTED-MND-URGENT-001).
        category:
          type: string
          enum:
          - suspected-mnd-urgent
