components:
  schemas:
    BloodCrossMatchTestResult:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the patient.
        clinicianId:
          type: string
          format: uuid
          description: Foreign key to the reporting clinician (biomedical scientist / transfusion practitioner
            / consultant haematologist).
        originatingRequestReference:
          type: string
          maxLength: 255
          description: Free-text reference linking this report back to the originating blood cross-match
            request (referral).
        reportStatus:
          type: string
          enum:
          - preliminary
          - final
          - amended
          - cancelled
          - ''
          description: 'Report lifecycle status: preliminary, final, amended, cancelled.'
        performedDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the test was performed in the transfusion laboratory.
        reportedDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the report was authored / signed.
        requestType:
          type: string
          enum:
          - group-and-save
          - crossmatch
          - antibody-screen
          - emergency-issue
          - ''
          description: 'Test the result reports against: group-and-save, crossmatch, antibody-screen,
            emergency-issue.'
        clinicalHistory:
          type: string
          maxLength: 1000
          description: Clinical history / transfusion indication relevant to interpreting the result.
        aboGroup:
          type: string
          enum:
          - a
          - b
          - o
          - ab
          - ''
          description: 'Determined ABO group: a, b, o, ab.'
        rhdGroup:
          type: string
          enum:
          - positive
          - negative
          - ''
          description: 'Determined RhD group: positive, negative.'
        antibodyScreenResult:
          type: string
          enum:
          - negative
          - positive
          - ''
          description: 'Antibody screen result: negative, positive.'
        antibodiesIdentified:
          type: string
          maxLength: 1000
          description: Specificity of any red-cell alloantibodies identified (free text), and antigen-negative
            requirements arising.
        crossmatchResult:
          type: string
          enum:
          - compatible
          - incompatible
          - electronic-issue
          - not-performed
          - ''
          description: 'Crossmatch / compatibility outcome: compatible, incompatible, electronic-issue,
            not-performed.'
        component:
          type: string
          enum:
          - red-cells
          - platelets
          - fresh-frozen-plasma
          - cryoprecipitate
          - none
          - ''
          description: 'Blood component the result relates to: red-cells, platelets, fresh-frozen-plasma,
            cryoprecipitate, none.'
        unitsCrossmatched:
          type:
          - integer
          - 'null'
          format: int32
          description: Number of units crossmatched / tested (0-50).
        unitsAvailable:
          type:
          - integer
          - 'null'
          format: int32
          description: Number of compatible units available for issue (0-50).
        twoSampleRuleMet:
          type: boolean
          description: Whether the BSH/SHOT two-sample (group-check) rule was satisfied for this patient
            before issue.
        specialRequirements:
          type: string
          maxLength: 1000
          description: Special component requirements met or required (e.g. irradiated, CMV-negative,
            antigen-negative, washed).
        historicalGroupConcordant:
          type: boolean
          description: Whether the current ABO/Rh group is concordant with the patient historical group
            on record.
        overallResultStatus:
          type: string
          enum:
          - normal
          - abnormal
          - critical
          - ''
          description: 'Overall result status: normal, abnormal, critical.'
        findingsNarrative:
          type: string
          maxLength: 2000
          description: Narrative description of the laboratory findings (the body of the report).
        impression:
          type: string
          maxLength: 2000
          description: Summary impression / conclusion answering the compatibility question.
        reportingCategory:
          type: string
          maxLength: 50
          description: Structured reporting category / label (e.g. an antibody-significance or compatibility-status
            category).
        recommendedFollowUp:
          type: string
          maxLength: 1000
          description: 'Recommended follow-up: repeat sample, further investigation, referral, or issue
            instructions.'
        criticalResultCommunicated:
          type: boolean
          description: Whether a critical or unexpected significant result (e.g. ABO discrepancy, incompatibility)
            was communicated directly to the requester.
        reportedTo:
          type: string
          maxLength: 500
          description: Who the critical / urgent result was communicated to, with date and time if applicable.
      required:
      - createdAt
      - updatedAt
      - patientId
      - clinicianId
      - originatingRequestReference
      - reportStatus
      - requestType
      - clinicalHistory
      - aboGroup
      - rhdGroup
      - antibodyScreenResult
      - antibodiesIdentified
      - crossmatchResult
      - component
      - twoSampleRuleMet
      - specialRequirements
      - historicalGroupConcordant
      - overallResultStatus
      - findingsNarrative
      - impression
      - reportingCategory
      - recommendedFollowUp
      - criticalResultCommunicated
      - reportedTo
      description: Blood cross-match / transfusion compatibility test result (report). Captures the ABO/Rh
        group, antibody screen and identification, the crossmatch / compatibility outcome and component
        availability, two-sample-rule and historical-group concordance for identity safety, special component
        requirements, the overall result status, narrative findings, impression, and critical-result communication.
        This is the source-of-truth record that the four-axis interpretation grade is computed from.
    BloodCrossMatchTestResultGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        bloodCrossMatchTestResultId:
          type: string
          format: uuid
          description: Foreign key to the parent result (unique, 1:1).
        resultClassification:
          type: string
          enum:
          - normal
          - abnormal
          - critical
          - inconclusive
          - ''
          description: 'Axis A overall classification: normal, abnormal, critical, inconclusive.'
        abnormalitySeverity:
          type: string
          enum:
          - none
          - minor
          - moderate
          - major
          - ''
          description: 'Axis B abnormality severity: none, minor, moderate, major.'
        reportingCategory:
          type: string
          maxLength: 50
          description: Axis B structured-reporting score / category label (e.g. an antibody-significance
            or compatibility-status category).
        reportCompletenessPercent:
          type:
          - integer
          - 'null'
          format: int32
          description: Axis C report completeness as a percentage of mandatory report sections (0-100).
        followUpUrgency:
          type: string
          enum:
          - routine
          - recommended
          - urgent
          - critical-alert
          - ''
          description: 'Axis D follow-up urgency: routine, recommended, urgent, critical-alert.'
        targetTimeframe:
          type: string
          maxLength: 50
          description: Target timeframe for the recommended follow-up implied by the urgency.
        recommendedAction:
          type: string
          maxLength: 500
          description: Axis D concise recommended action derived from the urgency.
        recommendation:
          type: string
          enum:
          - no-action
          - routine-follow-up
          - further-testing
          - specialist-referral
          - urgent-review
          - ''
          description: 'Overall recommendation: no-action, routine-follow-up, further-testing, specialist-referral,
            urgent-review.'
        clinicianNotes:
          type: string
          description: Free-text interpretation / sign-off notes.
        signedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Timestamp of the reporting clinician electronic signature.
        gradedAt:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the result.
      required:
      - createdAt
      - updatedAt
      - bloodCrossMatchTestResultId
      - resultClassification
      - abnormalitySeverity
      - reportingCategory
      - followUpUrgency
      - targetTimeframe
      - recommendedAction
      - recommendation
      - clinicianNotes
      - gradedAt
      description: 'Computed four-axis interpretation grade: result classification, abnormality severity
        / structured-reporting category, report completeness, and follow-up urgency. An incompatible crossmatch,
        clinically-significant antibodies, an ABO discrepancy, or an unmet two-sample rule auto-escalates
        the follow-up urgency to critical-alert regardless of the other axes.'
    BloodCrossMatchTestResultGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        bloodCrossMatchTestResultGradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        flagId:
          type: string
          maxLength: 50
          description: Stable flag identifier (e.g. F-CRITICAL-RESULT-001).
        category:
          type: string
          enum:
          - critical-result-alert
          - incidental-finding
          - discrepancy-with-request
          - abnormal-requiring-action
          - urgent-referral
          - inadequate-technique
          - unexpected-finding
          - missing-impression
          - missing-measurement
          - other
          - ''
          description: Flag category.
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          - ''
          description: 'Priority: low, medium, high.'
        description:
          type: string
          maxLength: 500
          description: Human-readable description of what fired the flag.
        suggestedAction:
          type: string
          maxLength: 500
          description: Suggested clinical action (e.g. "communicate critical result to requester and document").
      required:
      - createdAt
      - updatedAt
      - bloodCrossMatchTestResultGradeId
      - flagId
      - category
      - priority
      - description
      - suggestedAction
      description: Safety-critical flags that fire independently of the four axes, with priority and a
        suggested action for the reporting / requesting team.
    BloodCrossMatchTestResultGradeRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        bloodCrossMatchTestResultGradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        ruleId:
          type: string
          maxLength: 40
          description: Stable rule identifier (e.g. R-CLASS-CRITICAL-01).
        axis:
          type: string
          enum:
          - classification
          - severity
          - completeness
          - follow-up
          - ''
          description: 'Scoring axis the rule belongs to: classification, severity, completeness, follow-up.'
        category:
          type: string
          maxLength: 50
          description: Category or finding the rule relates to.
        description:
          type: string
          maxLength: 500
          description: Human-readable description of why the rule fired.
      required:
      - createdAt
      - updatedAt
      - bloodCrossMatchTestResultGradeId
      - ruleId
      - axis
      - category
      - description
      description: Audit trail of every classification / severity / completeness / follow-up rule that
        fired for this result.
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
