components:
  schemas:
    CentorScoreForStreptococcalPharyngitis:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the patient being assessed (delete restricted).
        clinicianId:
          type:
          - string
          - 'null'
          format: uuid
          description: Foreign key to the assessing clinician (optional; delete restricted).
        clinicianName:
          type: string
          maxLength: 255
          description: Name of the assessing clinician as recorded on the assessment.
        clinicianRole:
          type: string
          enum:
          - gp
          - nurse-practitioner
          - pharmacist
          - other
          - ''
          description: 'Role of the assessing clinician: gp, nurse-practitioner, pharmacist, or other.'
        assessedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Date and time the assessment was performed.
        careSetting:
          type: string
          enum:
          - general-practice
          - urgent-care
          - pharmacy
          - emergency-department
          - other
          - ''
          description: 'Care setting: general-practice, urgent-care, pharmacy, emergency-department, or
            other.'
        patientIdentifier:
          type: string
          maxLength: 100
          description: Local patient identifier as recorded on the assessment.
        ageYears:
          type:
          - integer
          - 'null'
          format: int32
          description: Patient age in whole years; drives the McIsaac age modifier (+1 ages 3-14, 0 ages
            15-44, -1 ages 45+). Null raises a data-completeness flag and applies a modifier of 0.
        sex:
          type: string
          enum:
          - female
          - male
          - intersex
          - unknown
          - ''
          description: 'Patient sex recorded for the assessment: female, male, intersex, or unknown.'
        tonsillarExudate:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Centor criterion 1 — tonsillar exudate or swelling present: yes scores 1 point.'
        tenderAnteriorCervicalNodes:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Centor criterion 2 — tender anterior cervical lymphadenopathy present: yes scores
            1 point.'
        feverOver38:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Centor criterion 3 — temperature > 38 C or a history of fever: yes scores 1 point
            (also set when measured_temperature_celsius exceeds 38).'
        measuredTemperatureCelsius:
          type:
          - number
          - 'null'
          format: double
          description: Optional measured temperature in degrees Celsius; a value above 38.0 sets the fever
            criterion.
        absenceOfCough:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Centor criterion 4 — cough absent: yes (cough absent) scores 1 point.'
        stridorOrBreathingDifficulty:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Red-flag input — stridor or difficulty breathing (airway compromise): yes.'
        droolingOrCannotSwallow:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Red-flag input — drooling or inability to swallow (airway / peritonsillar abscess):
            yes.'
        trismus:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Red-flag input — trismus (peritonsillar abscess / quinsy): yes.'
        muffledVoice:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Red-flag input — muffled ("hot potato") voice (peritonsillar abscess / quinsy):
            yes.'
        unilateralNeckSwelling:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Red-flag input — unilateral neck swelling (peritonsillar abscess / quinsy): yes.'
        clinicalNote:
          type: string
          description: Free-text clinical note recorded with the assessment.
      required:
      - createdAt
      - updatedAt
      - patientId
      - clinicianName
      - clinicianRole
      - careSetting
      - patientIdentifier
      - sex
      - tonsillarExudate
      - tenderAnteriorCervicalNodes
      - feverOver38
      - absenceOfCough
      - stridorOrBreathingDifficulty
      - droolingOrCannotSwallow
      - trismus
      - muffledVoice
      - unilateralNeckSwelling
      - clinicalNote
      description: 'Main Centor score assessment record: assessment context, patient identification, the
        four Centor criterion inputs, the optional measured temperature, the patient age driving the McIsaac
        modifier, and the airway / quinsy red-flag inputs.'
    CentorScoreForStreptococcalPharyngitisGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        centorScoreForStreptococcalPharyngitisId:
          type: string
          format: uuid
          description: Foreign key to the parent assessment (unique, 1:1).
        centorScore:
          type:
          - integer
          - 'null'
          format: int32
          description: Raw Centor total across the four criteria (0-4 when complete).
        ageModifier:
          type:
          - integer
          - 'null'
          format: int32
          description: 'McIsaac age modifier: +1 for ages 3-14, 0 for ages 15-44, -1 for ages 45+.'
        mcisaacScore:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Modified McIsaac score: Centor total plus age modifier (-1..5).'
        riskBand:
          type: string
          enum:
          - low
          - moderate
          - high
          - ''
          description: 'Derived risk band from the McIsaac score: low (<=1), moderate (2-3), or high (4-5).'
        management:
          type: string
          description: Free-text testing / antibiotic management guidance for the derived band.
        gradedAt:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the grade.
      required:
      - createdAt
      - updatedAt
      - centorScoreForStreptococcalPharyngitisId
      - riskBand
      - management
      - gradedAt
      description: 'Computed Centor / McIsaac grading result: raw Centor total (0-4), age modifier (-1..+1),
        modified McIsaac score (-1..5), derived risk band, and management guidance.'
    CentorScoreForStreptococcalPharyngitisGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        centorScoreForStreptococcalPharyngitisGradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        flagId:
          type: string
          maxLength: 50
          description: Stable flag identifier (e.g. F-AIRWAY-RED-FLAG-001).
        category:
          type: string
          enum:
          - airway-red-flag
          - quinsy
          - test-or-antibiotic
          - stewardship
          - incomplete
          - other
          - ''
          description: 'Flag category: airway-red-flag, quinsy, test-or-antibiotic, stewardship, incomplete,
            or other (see CHECK constraint).'
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          - ''
          description: 'Priority: low, medium, high.'
        description:
          type: string
          maxLength: 500
          description: Human-readable description of what fired the flag.
        suggestedAction:
          type: string
          maxLength: 500
          description: Suggested clinical action (e.g. "arrange urgent same-day assessment").
      required:
      - createdAt
      - updatedAt
      - centorScoreForStreptococcalPharyngitisGradeId
      - flagId
      - category
      - priority
      - description
      - suggestedAction
      description: Red-flag issues that fire independently of the total score, with priority and a suggested
        action for the clinical team.
    CentorScoreForStreptococcalPharyngitisGradeRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        centorScoreForStreptococcalPharyngitisGradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        ruleId:
          type: string
          maxLength: 40
          description: Stable rule identifier (e.g. R-FEVER-01).
        criterion:
          type: string
          enum:
          - tonsillar-exudate
          - tender-nodes
          - fever
          - cough-absent
          - age-modifier
          - band
          description: 'Scored criterion the rule belongs to: tonsillar-exudate, tender-nodes, fever,
            cough-absent, age-modifier, or band.'
        points:
          type:
          - integer
          - 'null'
          format: int32
