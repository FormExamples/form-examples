    XRayTestResult:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        patient_id:
          type: string
          format: uuid
          description: Foreign key to the patient.
        clinician_id:
          type: string
          format: uuid
          description: Foreign key to the reporting clinician (radiologist / reporting radiographer).
        originating_request_reference:
          type: string
          maxLength: 255
          description: Free-text reference linking this report back to the originating X-ray request (referral).
        report_status:
          type: string
          enum:
          - preliminary
          - final
          - amended
          - cancelled
          - ''
          description: 'Report lifecycle status: preliminary, final, amended, cancelled.'
        performed_date:
          type: string
          format: date
          description: Date the X-ray examination was performed.
        reported_date:
          type: string
          format: date
          description: Date the report was authored / signed.
        body_region:
          type: string
          enum:
          - chest
          - abdomen
          - spine-cervical
          - spine-thoracic
          - spine-lumbar
          - pelvis
          - hip
          - knee
          - ankle-foot
          - shoulder
          - wrist-hand
          - skull
          - dental
          - other
          - ''
          description: 'Examined plain-radiograph body region: chest, abdomen, spine-cervical, spine-thoracic,
            spine-lumbar, pelvis, hip, knee, ankle-foot, shoulder, wrist-hand, skull, dental, other.'
        laterality:
          type: string
          enum:
          - left
          - right
          - bilateral
          - not-applicable
          - ''
          description: 'Laterality of the examined region: left, right, bilateral, not-applicable.'
        projections:
          type: string
          maxLength: 1000
          description: Radiographic projections / views acquired (e.g. PA and lateral, AP, oblique) and
            any technique notes.
        examination_adequacy:
          type: string
          enum:
          - adequate
          - limited
          - non-diagnostic
          - ''
          description: 'Diagnostic adequacy of the examination: adequate, limited, non-diagnostic.'
        clinical_history:
          type: string
          maxLength: 1000
          description: Clinical history and the question the examination was performed to answer.
        comparison_with_previous:
          type: string
          maxLength: 1000
          description: Comparison with relevant previous imaging studies.
        findings_narrative:
          type: string
          maxLength: 2000
          description: Narrative description of the imaging findings (the body of the report).
        fracture:
          type: boolean
          description: Whether a fracture is present.
        dislocation:
          type: boolean
          description: Whether a joint dislocation or subluxation is present.
        consolidation:
          type: boolean
          description: Whether pulmonary consolidation (e.g. pneumonia) is present.
        pneumothorax:
          type: boolean
          description: Whether a pneumothorax is present (critical finding).
        pleural_effusion:
          type: boolean
          description: Whether a pleural effusion is present.
        foreign_body:
          type: boolean
          description: Whether a foreign body is present.
        free_air:
          type: boolean
          description: Whether free intraperitoneal air (pneumoperitoneum) is present (critical finding).
        bony_lesion:
          type: boolean
          description: Whether a focal bony lesion (e.g. lytic / sclerotic lesion) is present.
        incidental_finding:
          type: boolean
          description: Whether one or more incidental findings warranting documentation are present.
        impression:
          type: string
          maxLength: 2000
          description: Summary impression / conclusion answering the clinical question.
        reporting_category:
          type: string
          maxLength: 50
          description: Free-text structured-reporting label (e.g. normal / abnormal-acute / abnormal-chronic).
        recommended_follow_up:
          type: string
          maxLength: 1000
          description: Recommended follow-up imaging, referral, or management.
        critical_result_communicated:
          type: boolean
          description: Whether a critical or unexpected significant result was communicated directly to
            the referrer.
        reported_to:
          type: string
          maxLength: 500
          description: Who the critical / urgent result was communicated to, with date and time if applicable.
      required:
      - created_at
      - updated_at
      - patient_id
      - clinician_id
      - originating_request_reference
      - report_status
      - body_region
      - laterality
      - projections
      - examination_adequacy
      - clinical_history
      - comparison_with_previous
      - findings_narrative
      - fracture
      - dislocation
      - consolidation
      - pneumothorax
      - pleural_effusion
      - foreign_body
      - free_air
      - bony_lesion
      - incidental_finding
      - impression
      - reporting_category
      - recommended_follow_up
      - critical_result_communicated
      - reported_to
      description: Plain-radiograph (X-ray) result (report). Captures the performed examination (body
        region, laterality, projections, adequacy), clinical history, the narrative and structured findings,
        the impression and structured reporting category, recommended follow-up, and critical-result communication.
        This is the source-of-truth record that the four-axis interpretation grade is computed from.
    XRayTestResultGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
