components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Name.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as full text.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code, such as for validating the postal address.
        role:
          type: string
          enum:
          - radiologist
          - reporting-radiographer
          - consultant
          - registrar
          - reporting-clinician
          - other
          - ''
          description: 'Reporting clinician role: radiologist, reporting-radiographer, consultant, registrar,
            reporting-clinician, other.'
        registrationBody:
          type: string
          enum:
          - GMC
          - HCPC
          - other
          - ''
          description: 'Clinician registration body: GMC, HCPC, other.'
        registrationNumber:
          type: string
          description: Clinician registration number.
        unitedKingdomNhsNumber:
          type:
          - string
          - 'null'
          maxLength: 12
          description: United Kingdom NHS number, unique per person.
      required:
      - createdAt
      - updatedAt
      - name
      - role
      - registrationBody
      - registrationNumber
      description: Reporting clinician (radiologist or reporting radiographer) who authors and signs the
        X-ray scan result report.
    Patient:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          maxLength: 255
          description: Name.
        birthDate:
          type: string
          format: date
          description: Birth date.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as full text.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code, such as for validating the postal address.
        unitedKingdomNhsNumber:
          type:
          - string
          - 'null'
          maxLength: 20
          description: United Kingdom NHS number, unique per person.
        waistAsCm:
          type:
          - number
          - 'null'
          format: double
          description: Waist circumference measurement in cm, such as for calculating waist-height ratio
            (WHR).
        heightAsCm:
          type:
          - number
          - 'null'
          format: double
          description: Height measurement in cm, such as for calculating waist-height ratio (WHR).
        weightAsKg:
          type:
          - number
          - 'null'
          format: double
          description: Weight as kg.
        bodyMassIndex:
          type:
          - number
          - 'null'
          format: double
          description: Body mass index (BMI) measurement.
        waistHeightRatio:
          type:
          - number
          - 'null'
          format: double
          description: Waist-height ratio (WHR) measurement.
        vo2Max:
          type:
          - number
          - 'null'
          format: double
          description: VO2 max measurement.
      required:
      - createdAt
      - updatedAt
      - name
      - birthDate
      description: Patient
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          description: A URI identifying the problem type
        title:
          type: string
          description: A short summary of the problem type
        status:
          type: integer
          description: The HTTP status code
        detail:
          type: string
          description: An explanation of this occurrence
        instance:
          type: string
          description: A URI identifying this occurrence
        code:
          type: string
          description: A short machine-readable reason
        errors:
          type: object
          description: Per-field detail, when validation failed
      required:
      - type
      - title
      - status
    XRayTestResult:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the patient.
        clinicianId:
          type: string
          format: uuid
          description: Foreign key to the reporting clinician (radiologist / reporting radiographer).
        originatingRequestReference:
          type: string
          maxLength: 255
          description: Free-text reference linking this report back to the originating X-ray request (referral).
        reportStatus:
          type: string
          enum:
          - preliminary
          - final
          - amended
          - cancelled
          - ''
          description: 'Report lifecycle status: preliminary, final, amended, cancelled.'
        performedDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the X-ray examination was performed.
        reportedDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the report was authored / signed.
        bodyRegion:
          type: string
          enum:
          - chest
          - abdomen
          - spine-cervical
          - spine-thoracic
          - spine-lumbar
          - pelvis
          - hip
          - knee
          - ankle-foot
          - shoulder
          - wrist-hand
          - skull
          - dental
          - other
          - ''
          description: 'Examined plain-radiograph body region: chest, abdomen, spine-cervical, spine-thoracic,
            spine-lumbar, pelvis, hip, knee, ankle-foot, shoulder, wrist-hand, skull, dental, other.'
        laterality:
          type: string
          enum:
          - left
          - right
          - bilateral
          - not-applicable
          - ''
          description: 'Laterality of the examined region: left, right, bilateral, not-applicable.'
        projections:
          type: string
          maxLength: 1000
          description: Radiographic projections / views acquired (e.g. PA and lateral, AP, oblique) and
            any technique notes.
        examinationAdequacy:
          type: string
          enum:
          - adequate
          - limited
          - non-diagnostic
          - ''
          description: 'Diagnostic adequacy of the examination: adequate, limited, non-diagnostic.'
        clinicalHistory:
          type: string
          maxLength: 1000
          description: Clinical history and the question the examination was performed to answer.
        comparisonWithPrevious:
          type: string
          maxLength: 1000
          description: Comparison with relevant previous imaging studies.
        findingsNarrative:
          type: string
          maxLength: 2000
          description: Narrative description of the imaging findings (the body of the report).
        fracture:
          type: boolean
          description: Whether a fracture is present.
        dislocation:
          type: boolean
          description: Whether a joint dislocation or subluxation is present.
        consolidation:
          type: boolean
          description: Whether pulmonary consolidation (e.g. pneumonia) is present.
        pneumothorax:
          type: boolean
          description: Whether a pneumothorax is present (critical finding).
        pleuralEffusion:
          type: boolean
          description: Whether a pleural effusion is present.
        foreignBody:
          type: boolean
          description: Whether a foreign body is present.
        freeAir:
          type: boolean
          description: Whether free intraperitoneal air (pneumoperitoneum) is present (critical finding).
        bonyLesion:
          type: boolean
          description: Whether a focal bony lesion (e.g. lytic / sclerotic lesion) is present.
        incidentalFinding:
          type: boolean
          description: Whether one or more incidental findings warranting documentation are present.
        impression:
          type: string
          maxLength: 2000
          description: Summary impression / conclusion answering the clinical question.
        reportingCategory:
          type: string
          maxLength: 50
          description: Free-text structured-reporting label (e.g. normal / abnormal-acute / abnormal-chronic).
        recommendedFollowUp:
          type: string
          maxLength: 1000
          description: Recommended follow-up imaging, referral, or management.
        criticalResultCommunicated:
          type: boolean
          description: Whether a critical or unexpected significant result was communicated directly to
            the referrer.
        reportedTo:
          type: string
          maxLength: 500
          description: Who the critical / urgent result was communicated to, with date and time if applicable.
      required:
      - createdAt
      - updatedAt
      - patientId
      - clinicianId
      - originatingRequestReference
      - reportStatus
      - bodyRegion
      - laterality
      - projections
      - examinationAdequacy
      - clinicalHistory
      - comparisonWithPrevious
      - findingsNarrative
      - fracture
      - dislocation
      - consolidation
      - pneumothorax
      - pleuralEffusion
      - foreignBody
      - freeAir
      - bonyLesion
      - incidentalFinding
      - impression
      - reportingCategory
      - recommendedFollowUp
      - criticalResultCommunicated
      - reportedTo
      description: Plain-radiograph (X-ray) result (report). Captures the performed examination (body
        region, laterality, projections, adequacy), clinical history, the narrative and structured findings,
        the impression and structured reporting category, recommended follow-up, and critical-result communication.
        This is the source-of-truth record that the four-axis interpretation grade is computed from.
    XRayTestResultGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        xRayTestResultId:
          type: string
          format: uuid
          description: Foreign key to the parent result (unique, 1:1).
        resultClassification:
          type: string
          enum:
          - normal
          - abnormal
          - critical
          - inconclusive
          - ''
          description: 'Axis A overall classification: normal, abnormal, critical, inconclusive.'
        abnormalitySeverity:
          type: string
          enum:
          - none
          - minor
          - moderate
          - major
          - ''
          description: 'Axis B abnormality severity: none, minor, moderate, major.'
        reportingCategory:
          type: string
          maxLength: 50
          description: Axis B structured-reporting score / category label (e.g. normal / abnormal-acute
            / abnormal-chronic).
        reportCompletenessPercent:
          type:
          - integer
          - 'null'
          format: int32
          description: Axis C report completeness as a percentage of mandatory report sections (0-100).
        followUpUrgency:
          type: string
          enum:
          - routine
          - recommended
          - urgent
          - critical-alert
          - ''
          description: 'Axis D follow-up urgency: routine, recommended, urgent, critical-alert.'
        targetTimeframe:
          type: string
          maxLength: 50
          description: Target timeframe for the recommended follow-up implied by the urgency.
        recommendedAction:
          type: string
          maxLength: 500
          description: Axis D concise recommended action derived from the urgency.
        recommendation:
          type: string
          enum:
          - no-action
          - routine-follow-up
          - further-imaging
          - specialist-referral
          - urgent-review
          - ''
          description: 'Overall recommendation: no-action, routine-follow-up, further-imaging, specialist-referral,
