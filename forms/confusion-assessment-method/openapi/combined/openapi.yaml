components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        name:
          type: string
          description: Clinician full name as recorded in the rota.
        email:
          type: string
          description: Email address.
        phone:
          type: string
          description: Phone number.
        postal_address_as_full_text:
          type: string
          description: Postal address as a single text block.
        country_as_iso_3166_1_alpha_2:
          type: string
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2.
        postcode:
          type: string
          description: Postal code.
        role:
          type: string
          enum:
          - nurse
          - doctor
          - geriatrician
          - liaison-psychiatrist
          - physiotherapist
          - occupational-therapist
          - researcher
          - other
          - ''
          description: 'Primary clinical role: nurse, doctor, geriatrician, liaison-psychiatrist, physiotherapist,
            occupational-therapist, researcher, or other.'
        registration_body:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - GPhC
          - other
          - ''
          description: 'Professional registration body: GMC, NMC, HCPC, GPhC, or other.'
        registration_number:
          type: string
          description: Professional registration number issued by the registration body.
      required:
      - created_at
      - updated_at
      - name
      - role
      - registration_body
      - registration_number
      description: Clinician identifying information for the assessor performing the CAM delirium screen.
    ConfusionAssessmentMethod:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        patient_id:
          type: string
          format: uuid
          description: Foreign key to the patient being assessed (delete restricted).
        clinician_id:
          type: string
          format: uuid
          description: Foreign key to the assessing clinician (optional; delete restricted).
        assessor_name:
          type: string
          maxLength: 255
          description: Name of the assessor as recorded on the assessment.
        assessor_role:
          type: string
          enum:
          - nurse
          - doctor
          - geriatrician
          - liaison-psychiatrist
          - physiotherapist
          - occupational-therapist
          - researcher
          - other
          - ''
          description: 'Role of the assessor: nurse, doctor, geriatrician, liaison-psychiatrist, physiotherapist,
            occupational-therapist, researcher, or other.'
        assessed_at:
          type: string
          format: date-time
          description: Date and time the assessment was performed.
        ward_unit:
          type: string
          maxLength: 100
          description: Ward or unit where the assessment took place.
        cam_variant:
          type: string
          enum:
          - cam
          - cam-icu
          - ''
          description: 'Assessment variant: cam (standard bedside) or cam-icu (ventilated / non-verbal
            patients).'
        patient_identifier:
          type: string
          maxLength: 100
          description: Local patient identifier as recorded on the assessment.
        age_band:
          type: string
          enum:
          - 16-39
          - 40-59
          - 60-74
          - 75-plus
          - ''
          description: 'Adult age band: 16-39, 40-59, 60-74, or 75-plus.'
        sex:
          type: string
          enum:
          - female
          - male
          - intersex
          - unknown
          - ''
          description: 'Patient sex recorded for the assessment: female, male, intersex, or unknown.'
        cognitive_baseline:
          type: string
          enum:
          - independent
          - known-dementia
          - mild-cognitive-impairment
          - unknown
          - ''
          description: 'Cognitive baseline before the acute change: independent, known-dementia, mild-cognitive-impairment,
            or unknown.'
        collateral_source:
          type: string
          enum:
          - family
          - carer
          - nurse
          - notes
          - none
          - ''
          description: 'Source of collateral history establishing the baseline: family, carer, nurse,
            notes, or none.'
        feature_acute_onset_fluctuating:
          type: string
          enum:
          - present
          - absent
          - ''
          description: 'Feature 1 — acute onset and fluctuating course: present or absent (empty when
            unset).'
        onset_timing:
          type: string
          enum:
          - hours
          - days
          - weeks
          - unknown
          - ''
          description: 'Timing of the acute change from baseline: hours, days, weeks, or unknown.'
        feature_inattention:
          type: string
          enum:
          - present
          - absent
          - ''
          description: 'Feature 2 — inattention: present or absent (empty when unset).'
        attention_test:
          type: string
          enum:
          - digit-span
          - months-backwards
          - serial-sevens
          - attention-screening-examination
          - not-completable
          - ''
          description: 'Attention test used: digit-span, months-backwards, serial-sevens, attention-screening-examination
            (CAM-ICU), or not-completable.'
        feature_disorganised_thinking:
          type: string
          enum:
          - present
          - absent
          - ''
          description: 'Feature 3 — disorganised thinking: present or absent (empty when unset).'
        feature_altered_consciousness:
          type: string
          enum:
          - present
          - absent
          - ''
          description: 'Feature 4 — altered level of consciousness: present or absent (empty when unset).'
        consciousness_level:
          type: string
          enum:
          - alert
          - vigilant
          - lethargic
          - stupor
          - coma
          - ''
          description: 'Observed level of consciousness: alert, vigilant, lethargic, stupor, or coma.'
        rass_score:
          type: integer
          format: int32
          description: Richmond Agitation-Sedation Scale score (-5 to +4); recorded for the CAM-ICU variant.
            RASS -4/-5 (unrousable) yields an unable-to-assess classification.
        motoric_subtype:
          type: string
          enum:
          - hypoactive
          - hyperactive
          - mixed
          - normal
          - ''
          description: 'Psychomotor subtype of delirium: hypoactive, hyperactive, mixed, or normal.'
        hallucinations:
          type: boolean
          description: Whether hallucinations were observed during the assessment.
        delusions:
          type: boolean
          description: Whether delusions were observed during the assessment.
        sleep_wake_disturbance:
          type: boolean
          description: Whether a sleep-wake cycle disturbance was observed.
        deliriogenic_medication:
          type: boolean
          description: Whether a recent high-risk deliriogenic medication (anticholinergic, benzodiazepine,
            opioid) was noted.
        deliriogenic_medication_detail:
          type: string
          description: Free-text detail of the deliriogenic medication noted.
        suspected_precipitants:
          type: string
          description: Free-text note of suspected reversible precipitants (PINCH ME screen).
        recommended_actions:
          type: string
          description: Free-text note of recommended actions and disposition.
        clinical_note:
          type: string
          description: Free-text clinical note recorded with the assessment.
      required:
      - created_at
      - updated_at
      - patient_id
      - assessor_name
      - assessor_role
      - ward_unit
      - cam_variant
      - patient_identifier
      - age_band
      - sex
      - cognitive_baseline
      - collateral_source
      - feature_acute_onset_fluctuating
      - onset_timing
      - feature_inattention
      - attention_test
      - feature_disorganised_thinking
      - feature_altered_consciousness
      - consciousness_level
      - motoric_subtype
      - hallucinations
      - delusions
      - sleep_wake_disturbance
      - deliriogenic_medication
      - deliriogenic_medication_detail
      - suspected_precipitants
      - recommended_actions
      - clinical_note
      description: 'Main Confusion Assessment Method (CAM) record: assessment context, patient identification,
        and the four observational feature inputs plus CAM-ICU support fields. Status / classification
        form with no numeric total.'
    ConfusionAssessmentMethodGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the row was soft-deleted.
        confusion_assessment_method_id:
          type: string
          format: uuid
          description: Foreign key to the parent assessment (unique, 1:1).
        classification:
          type: string
          enum:
          - present
          - absent
          - unable-to-assess
          - ''
          description: 'Derived classification: present, absent, or unable-to-assess (empty when not yet
            graded).'
        delirium_present:
          type: boolean
          description: 'Boolean result of the diagnostic algorithm: 1 AND 2 AND (3 OR 4). Null when unable-to-assess
            or not graded.'
        feature_1_positive:
          type: boolean
          description: Whether feature 1 (acute onset and fluctuating course) was positive.
        feature_2_positive:
          type: boolean
          description: Whether feature 2 (inattention) was positive.
        feature_3_positive:
          type: boolean
          description: Whether feature 3 (disorganised thinking) was positive.
        feature_4_positive:
          type: boolean
          description: Whether feature 4 (altered level of consciousness) was positive.
        positive_features:
          type: string
          description: Comma-separated subset of {1,2,3,4} that were positive (e.g. "1,2,4"), for auditable
            reasoning.
        motoric_subtype:
          type: string
          enum:
          - hypoactive
          - hyperactive
          - mixed
          - normal
          - ''
          description: 'Psychomotor subtype carried through to the result: hypoactive, hyperactive, mixed,
            or normal.'
        graded_at:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the classification.
      required:
      - created_at
      - updated_at
      - confusion_assessment_method_id
      - classification
      - positive_features
      - motoric_subtype
      - graded_at
      description: 'Computed CAM classification result (1:1): boolean delirium status, derived classification
        (present / absent / unable-to-assess), the positive-feature set, and the motoric subtype. Status
        result with no numeric total.'
    ConfusionAssessmentMethodGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the row was soft-deleted.
        confusion_assessment_method_grade_id:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        flag_id:
          type: string
          maxLength: 50
          description: Stable flag identifier (e.g. F-DELIRIUM-PRESENT-001).
        category:
          type: string
          enum:
          - delirium-present
          - hypoactive-delirium
          - altered-consciousness
          - deliriogenic-medication
          - unable-to-assess
          - repeat-screening
          - other
          - ''
