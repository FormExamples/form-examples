components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Clinician full name as recorded in the rota.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as a single text block.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code.
        role:
          type: string
          enum:
          - nurse
          - doctor
          - geriatrician
          - liaison-psychiatrist
          - physiotherapist
          - occupational-therapist
          - researcher
          - other
          - ''
          description: 'Primary clinical role: nurse, doctor, geriatrician, liaison-psychiatrist, physiotherapist,
            occupational-therapist, researcher, or other.'
        registrationBody:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - GPhC
          - other
          - ''
          description: 'Professional registration body: GMC, NMC, HCPC, GPhC, or other.'
        registrationNumber:
          type: string
          description: Professional registration number issued by the registration body.
      required:
      - createdAt
      - updatedAt
      - name
      - role
      - registrationBody
      - registrationNumber
      description: Clinician identifying information for the assessor performing the CAM delirium screen.
    ConfusionAssessmentMethod:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the patient being assessed (delete restricted).
        clinicianId:
          type:
          - string
          - 'null'
          format: uuid
          description: Foreign key to the assessing clinician (optional; delete restricted).
        assessorName:
          type: string
          maxLength: 255
          description: Name of the assessor as recorded on the assessment.
        assessorRole:
          type: string
          enum:
          - nurse
          - doctor
          - geriatrician
          - liaison-psychiatrist
          - physiotherapist
          - occupational-therapist
          - researcher
          - other
          - ''
          description: 'Role of the assessor: nurse, doctor, geriatrician, liaison-psychiatrist, physiotherapist,
            occupational-therapist, researcher, or other.'
        assessedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Date and time the assessment was performed.
        wardUnit:
          type: string
          maxLength: 100
          description: Ward or unit where the assessment took place.
        camVariant:
          type: string
          enum:
          - cam
          - cam-icu
          - ''
          description: 'Assessment variant: cam (standard bedside) or cam-icu (ventilated / non-verbal
            patients).'
        patientIdentifier:
          type: string
          maxLength: 100
          description: Local patient identifier as recorded on the assessment.
        ageBand:
          type: string
          enum:
          - 16-39
          - 40-59
          - 60-74
          - 75-plus
          - ''
          description: 'Adult age band: 16-39, 40-59, 60-74, or 75-plus.'
        sex:
          type: string
          enum:
          - female
          - male
          - intersex
          - unknown
          - ''
          description: 'Patient sex recorded for the assessment: female, male, intersex, or unknown.'
        cognitiveBaseline:
          type: string
          enum:
          - independent
          - known-dementia
          - mild-cognitive-impairment
          - unknown
          - ''
          description: 'Cognitive baseline before the acute change: independent, known-dementia, mild-cognitive-impairment,
            or unknown.'
        collateralSource:
          type: string
          enum:
          - family
          - carer
          - nurse
          - notes
          - none
          - ''
          description: 'Source of collateral history establishing the baseline: family, carer, nurse,
            notes, or none.'
        featureAcuteOnsetFluctuating:
          type: string
          enum:
          - present
          - absent
          - ''
          description: 'Feature 1 — acute onset and fluctuating course: present or absent (empty when
            unset).'
        onsetTiming:
          type: string
          enum:
          - hours
          - days
          - weeks
          - unknown
          - ''
          description: 'Timing of the acute change from baseline: hours, days, weeks, or unknown.'
        featureInattention:
          type: string
          enum:
          - present
          - absent
          - ''
          description: 'Feature 2 — inattention: present or absent (empty when unset).'
        attentionTest:
          type: string
          enum:
          - digit-span
          - months-backwards
          - serial-sevens
          - attention-screening-examination
          - not-completable
          - ''
          description: 'Attention test used: digit-span, months-backwards, serial-sevens, attention-screening-examination
            (CAM-ICU), or not-completable.'
        featureDisorganisedThinking:
          type: string
          enum:
          - present
          - absent
          - ''
          description: 'Feature 3 — disorganised thinking: present or absent (empty when unset).'
        featureAlteredConsciousness:
          type: string
          enum:
          - present
          - absent
          - ''
          description: 'Feature 4 — altered level of consciousness: present or absent (empty when unset).'
        consciousnessLevel:
          type: string
          enum:
          - alert
          - vigilant
          - lethargic
          - stupor
          - coma
          - ''
          description: 'Observed level of consciousness: alert, vigilant, lethargic, stupor, or coma.'
        rassScore:
          type:
          - integer
          - 'null'
          format: int32
          description: Richmond Agitation-Sedation Scale score (-5 to +4); recorded for the CAM-ICU variant.
            RASS -4/-5 (unrousable) yields an unable-to-assess classification.
        motoricSubtype:
          type: string
          enum:
          - hypoactive
          - hyperactive
          - mixed
          - normal
          - ''
          description: 'Psychomotor subtype of delirium: hypoactive, hyperactive, mixed, or normal.'
        hallucinations:
          type: boolean
          description: Whether hallucinations were observed during the assessment.
        delusions:
          type: boolean
          description: Whether delusions were observed during the assessment.
        sleepWakeDisturbance:
          type: boolean
          description: Whether a sleep-wake cycle disturbance was observed.
        deliriogenicMedication:
          type: boolean
          description: Whether a recent high-risk deliriogenic medication (anticholinergic, benzodiazepine,
            opioid) was noted.
        deliriogenicMedicationDetail:
          type: string
          description: Free-text detail of the deliriogenic medication noted.
        suspectedPrecipitants:
          type: string
          description: Free-text note of suspected reversible precipitants (PINCH ME screen).
        recommendedActions:
          type: string
          description: Free-text note of recommended actions and disposition.
        clinicalNote:
          type: string
          description: Free-text clinical note recorded with the assessment.
      required:
      - createdAt
      - updatedAt
      - patientId
      - assessorName
      - assessorRole
      - wardUnit
      - camVariant
      - patientIdentifier
      - ageBand
      - sex
      - cognitiveBaseline
      - collateralSource
      - featureAcuteOnsetFluctuating
      - onsetTiming
      - featureInattention
      - attentionTest
      - featureDisorganisedThinking
      - featureAlteredConsciousness
      - consciousnessLevel
      - motoricSubtype
      - hallucinations
      - delusions
      - sleepWakeDisturbance
      - deliriogenicMedication
      - deliriogenicMedicationDetail
      - suspectedPrecipitants
      - recommendedActions
      - clinicalNote
      description: 'Main Confusion Assessment Method (CAM) record: assessment context, patient identification,
        and the four observational feature inputs plus CAM-ICU support fields. Status / classification
        form with no numeric total.'
    ConfusionAssessmentMethodGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        confusionAssessmentMethodId:
          type: string
          format: uuid
          description: Foreign key to the parent assessment (unique, 1:1).
        classification:
          type: string
          enum:
          - present
          - absent
          - unable-to-assess
          - ''
          description: 'Derived classification: present, absent, or unable-to-assess (empty when not yet
            graded).'
        deliriumPresent:
          type:
          - boolean
          - 'null'
          description: 'Boolean result of the diagnostic algorithm: 1 AND 2 AND (3 OR 4). Null when unable-to-assess
            or not graded.'
        feature1Positive:
          type:
          - boolean
          - 'null'
          description: Whether feature 1 (acute onset and fluctuating course) was positive.
        feature2Positive:
          type:
          - boolean
          - 'null'
          description: Whether feature 2 (inattention) was positive.
        feature3Positive:
          type:
          - boolean
          - 'null'
          description: Whether feature 3 (disorganised thinking) was positive.
        feature4Positive:
          type:
          - boolean
          - 'null'
          description: Whether feature 4 (altered level of consciousness) was positive.
        positiveFeatures:
          type: string
          description: Comma-separated subset of {1,2,3,4} that were positive (e.g. "1,2,4"), for auditable
            reasoning.
        motoricSubtype:
          type: string
          enum:
          - hypoactive
          - hyperactive
          - mixed
          - normal
          - ''
          description: 'Psychomotor subtype carried through to the result: hypoactive, hyperactive, mixed,
            or normal.'
        gradedAt:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the classification.
      required:
      - createdAt
      - updatedAt
      - confusionAssessmentMethodId
      - classification
      - positiveFeatures
      - motoricSubtype
      - gradedAt
      description: 'Computed CAM classification result (1:1): boolean delirium status, derived classification
        (present / absent / unable-to-assess), the positive-feature set, and the motoric subtype. Status
        result with no numeric total.'
    ConfusionAssessmentMethodGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        confusionAssessmentMethodGradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        flagId:
          type: string
          maxLength: 50
          description: Stable flag identifier (e.g. F-DELIRIUM-PRESENT-001).
        category:
          type: string
          enum:
          - delirium-present
          - hypoactive-delirium
          - altered-consciousness
          - deliriogenic-medication
          - unable-to-assess
          - repeat-screening
          - other
          - ''
          description: 'Flag category: delirium-present, hypoactive-delirium, altered-consciousness, deliriogenic-medication,
            unable-to-assess, repeat-screening, or other.'
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          - ''
          description: 'Priority: low, medium, high.'
        description:
          type: string
          maxLength: 500
          description: Human-readable description of what fired the flag.
        suggestedAction:
          type: string
          maxLength: 500
          description: Suggested clinical action (e.g. "commence PINCH ME reversible-precipitant screen").
      required:
      - createdAt
      - updatedAt
      - confusionAssessmentMethodGradeId
      - flagId
      - category
      - priority
      - description
      - suggestedAction
      description: Red-flag issues that fire independently of the present / absent classification, with
        priority and a suggested action for the clinical team.
    ConfusionAssessmentMethodGradeRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        confusionAssessmentMethodGradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        ruleId:
          type: string
          maxLength: 40
          description: Stable rule identifier (e.g. R-FEATURE-1-POSITIVE-01).
        feature:
          type: string
          enum:
          - acute-onset-fluctuating
          - inattention
          - disorganised-thinking
          - altered-consciousness
          - algorithm
          - arousal
          description: 'Feature the rule belongs to: acute-onset-fluctuating, inattention, disorganised-thinking,
            altered-consciousness, algorithm (the 1 AND 2 AND (3 OR 4) combiner), or arousal (RASS gating).'
        positive:
          type:
          - boolean
          - 'null'
          description: Whether the feature evaluated positive for this firing (null for combiner / arousal
            rules).
        category:
          type: string
          maxLength: 50
          description: Subject category (e.g. feature-evaluation, algorithm-combiner, arousal-gate).
        description:
          type: string
          maxLength: 500
          description: Human-readable description of why the rule fired.
      required:
      - createdAt
      - updatedAt
      - confusionAssessmentMethodGradeId
      - ruleId
      - feature
      - category
      - description
      description: 'Audit trail of every classification rule that fired during CAM computation: feature,
        whether it was positive, category, and description.'
    Patient:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          maxLength: 255
          description: Full patient name as recorded on the wristband.
        birthDate:
          type: string
          format: date
          description: Date of birth.
        sex:
          type: string
          enum:
          - female
          - male
          - intersex
          - unknown
          - ''
          description: 'Sex recorded for clinical purposes: female, male, intersex, or unknown.'
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as a single text block.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code.
        unitedKingdomNhsNumber:
          type:
          - string
          - 'null'
          maxLength: 20
          description: United Kingdom NHS number, unique per person.
        hospitalMrn:
          type:
          - string
          - 'null'
          maxLength: 50
          description: Local hospital medical record number (MRN).
        heightAsCm:
          type:
          - number
          - 'null'
          format: double
          description: Height in centimetres.
        weightAsKg:
          type:
          - number
          - 'null'
          format: double
          description: Weight in kilograms.
        bodyMassIndex:
          type:
          - number
          - 'null'
          format: double
          description: Body mass index (BMI), kg/m^2.
        allergiesSummary:
          type: string
          description: Free-text summary of known allergies as recorded at the bedside.
      required:
      - createdAt
      - updatedAt
      - name
      - birthDate
      - sex
      - allergiesSummary
      description: Patient demographic information used by the CAM delirium-screening record.
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          description: A URI identifying the problem type
        title:
          type: string
          description: A short summary of the problem type
        status:
          type: integer
          description: The HTTP status code
        detail:
          type: string
          description: An explanation of this occurrence
        instance:
          type: string
          description: A URI identifying this occurrence
        code:
          type: string
          description: A short machine-readable reason
        errors:
          type: object
          description: Per-field detail, when validation failed
      required:
      - type
      - title
      - status
