      responses:
        '200':
          description: The newly created Recipient
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recipient'
        '400':
          description: The request was refused
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: It duplicates a row, or refers to a missing one
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: The body does not match the schema, or a value is outside what its field allows
