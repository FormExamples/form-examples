        previousName:
          type: string
          maxLength: 255
          description: Previous name, if any; aids identity matching.
        birthDate:
          type: string
          format: date
          description: Birth date.
        sex:
          type: string
          enum:
          - female
          - male
          - other
          - unknown
          - ''
          description: 'Sex recorded: female, male, other, unknown.'
        nationalHealthIdentifier:
          type: string
          maxLength: 40
          description: National health identifier issued by the person's health system, as free text.
        medicalRecordNumber:
          type: string
          maxLength: 40
          description: Hospital or institution medical record number.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as full text.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code, such as for validating the postal address.
      required:
      - createdAt
      - updatedAt
      - familyName
      - givenNames
      - previousName
      - birthDate
      - sex
      - nationalHealthIdentifier
      - medicalRecordNumber
      description: Intended transplant recipient (absent for an altruistic donor).
