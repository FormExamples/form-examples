components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Name.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as full text.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code, such as for validating the postal address.
        role:
          type: string
          enum:
          - nephrologist
          - transplant-surgeon
          - transplant-coordinator
          - independent-assessor
          - phlebotomist
          - other
          - ''
          description: 'Clinician role: nephrologist, transplant-surgeon, transplant-coordinator, independent-assessor,
            phlebotomist, other.'
        registrationBody:
          type: string
          description: Professional registration body, as free text (varies by jurisdiction).
        registrationNumber:
          type: string
          description: Professional registration number.
      required:
      - createdAt
      - updatedAt
      - name
      - role
      - registrationBody
      - registrationNumber
      description: Clinician who requests the tests (and, where different, collects the samples).
    Donor:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        familyName:
          type: string
          maxLength: 255
          description: Family name (surname).
        givenNames:
          type: string
          maxLength: 255
          description: Given names (forenames).
        previousName:
          type: string
          maxLength: 255
          description: Previous name, if any; aids identity matching.
        birthDate:
          type: string
          format: date
          description: Birth date.
        sex:
          type: string
          enum:
          - female
          - male
          - other
          - unknown
          - ''
          description: 'Sex recorded: female, male, other, unknown.'
        nationalHealthIdentifier:
          type: string
          maxLength: 40
          description: National health identifier issued by the person's health system, as free text.
        medicalRecordNumber:
          type: string
          maxLength: 40
          description: Hospital or institution medical record number.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as full text.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code, such as for validating the postal address.
      required:
      - createdAt
      - updatedAt
      - familyName
      - givenNames
      - previousName
      - birthDate
      - sex
      - nationalHealthIdentifier
      - medicalRecordNumber
      description: Living kidney donor.
    MedicalRenalLivingDonorRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        donorId:
          type: string
          format: uuid
          description: Foreign key to the living donor.
        recipientId:
          type:
          - string
          - 'null'
          format: uuid
          description: Foreign key to the intended recipient; NULL for an altruistic (non-directed) donor.
        clinicianId:
          type: string
          format: uuid
          description: Foreign key to the requesting clinician.
        status:
          type: string
          enum:
          - draft
          - submitted
          - received
          - vetted
          - rejected
          - ''
          description: 'Request lifecycle status: draft, submitted, received, vetted, rejected.'
        requestDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the request was made.
        donationPathway:
          type: string
          enum:
          - directed
          - altruistic
          - paired-exchange
          - ''
          description: 'Donation pathway: directed (to a named recipient), altruistic (non-directed),
            paired-exchange. Replaces the source form listing "altruistic donor" as a test.'
        relationshipOfDonorToRecipient:
          type: string
          maxLength: 255
          description: Relationship of the donor to the recipient, free text (for example parent, sibling,
            spouse, friend, none).
        recipientTransplantCentreName:
          type: string
          maxLength: 255
          description: Transplant centre of the recipient, when the recipient is treated elsewhere.
        donorAboGroup:
          type: string
          enum:
          - a
          - b
          - ab
          - o
          - unknown
          - ''
          description: 'Donor ABO blood group, if known: a, b, ab, o, unknown.'
        recipientAboGroup:
          type: string
          enum:
          - a
          - b
          - ab
          - o
          - unknown
          - ''
          description: 'Recipient ABO blood group, if known: a, b, ab, o, unknown.'
        urgentTesting:
          type: boolean
          description: Whether the samples require urgent testing.
        urgentTestingReason:
          type: string
          maxLength: 500
          description: Reason urgent testing is needed.
        transplantCentreName:
          type: string
          maxLength: 255
          description: Name of the requesting transplant centre.
        requestedBySignedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: When the requester signed the request.
        consentAndIdentityConfirmed:
          type: boolean
          description: Requester confirms informed consent was obtained from the donor and identity verified
            for the requested tests.
        sampleCollectorName:
          type: string
          maxLength: 255
          description: Name of the person who collected the donor samples.
        sampleCollectedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Date and time the donor samples were collected.
        identifiersOnSampleCount:
          type:
          - integer
          - 'null'
          format: int32
          description: Number of donor identifiers on the sample labels (minimum 3 required).
        identifiersOnFormCount:
          type:
          - integer
          - 'null'
          format: int32
          description: Number of donor identifiers on the request form (minimum 3 required).
        sampleAndFormDetailsMatch:
          type: boolean
          description: Whether the details on the samples and the form match.
        samplesEdtaPurpleCount:
          type:
          - integer
          - 'null'
          format: int32
          description: Number of purple-top EDTA tubes (addressograph-labelled) sent.
        samplesEdtaPinkHandLabelledCount:
          type:
          - integer
          - 'null'
          format: int32
          description: Number of pink-top EDTA tubes (hand-labelled) sent.
        samplesOtherDescription:
          type: string
          maxLength: 255
          description: Other sample types sent, if any.
        laboratoryDonorIdentifier:
          type: string
          maxLength: 100
          description: 'Laboratory use: donor identifier assigned by the laboratory.'
        laboratoryRecipientIdentifier:
          type: string
          maxLength: 100
          description: 'Laboratory use: recipient identifier assigned by the laboratory.'
        laboratorySampleNumber:
          type: string
          maxLength: 100
          description: 'Laboratory use: sample number.'
        laboratorySampleReceivedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: 'Laboratory use: date and time the sample was received.'
        laboratoryIdentifiersCheckedBy:
          type: string
          maxLength: 255
          description: 'Laboratory use: name of the person who checked the sample identifiers.'
      required:
      - createdAt
      - updatedAt
      - donorId
      - clinicianId
      - status
      - donationPathway
      - relationshipOfDonorToRecipient
      - recipientTransplantCentreName
      - donorAboGroup
      - recipientAboGroup
      - urgentTesting
      - urgentTestingReason
      - transplantCentreName
      - consentAndIdentityConfirmed
      - sampleCollectorName
      - sampleAndFormDetailsMatch
      - samplesOtherDescription
      - laboratoryDonorIdentifier
      - laboratoryRecipientIdentifier
      - laboratorySampleNumber
      - laboratoryIdentifiersCheckedBy
      description: 'Renal living-donor request: donor and recipient references, relationship, ABO groups,
        requester and sample-collection details, and laboratory-use fields. Requested tests are in the
        child table.'
    MedicalRenalLivingDonorRequestGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        requestId:
          type: string
          format: uuid
          description: Foreign key to the graded request (one grade per request).
        appropriatenessScore:
          type:
          - integer
          - 'null'
          format: int32
          description: Axis A appropriateness, 1-9 ordinal. No published score exists; anchored on laboratory
            standards and labelled as such.
        appropriatenessBand:
          type: string
          enum:
          - usually-appropriate
          - may-be-appropriate
          - usually-not-appropriate
          - ''
          description: 'Axis A band: usually-appropriate (7-9), may-be-appropriate (4-6), usually-not-appropriate
            (1-3).'
        identitySafetyBand:
          type: string
          enum:
          - ok
          - caution
          - reject-risk
          - ''
          description: 'Axis B identity / sample safety band: ok, caution, reject-risk.'
        completenessPercent:
          type:
          - integer
          - 'null'
          format: int32
          description: Axis C completeness, 0-100 percent.
        triageTier:
          type: string
          enum:
          - routine
          - urgent
          - emergency
          - stat
          - ''
          description: 'Axis D triage tier: routine, urgent, emergency, stat.'
        targetTimeframe:
          type: string
          maxLength: 50
          description: Target turnaround implied by the triage tier (local policy).
        requiredSamplesSummary:
          type: string
          maxLength: 500
          description: Sample tubes and volumes the requested tests need, derived from the tests chosen.
        recommendation:
          type: string
          enum:
          - accept
          - query-referrer
          - reject
          - ''
          description: 'Vetting recommendation: accept, query-referrer, reject.'
        clinicianNotes:
          type: string
          maxLength: 1000
          description: Free-text vetting notes.
        signedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Timestamp of the vetting person's electronic signature.
        gradedAt:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the result.
      required:
      - createdAt
      - updatedAt
      - requestId
      - appropriatenessBand
      - identitySafetyBand
      - triageTier
      - targetTimeframe
      - requiredSamplesSummary
      - recommendation
      - clinicianNotes
      - gradedAt
      description: 'Computed result of the four-axis engine for one request: appropriateness, identity
        / sample safety, completeness and triage priority, plus the vetting recommendation.'
    MedicalRenalLivingDonorRequestGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        gradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        flagId:
          type: string
          maxLength: 50
          description: Stable flag identifier (for example F-DAY-OF-TRANSPLANT-001).
        category:
          type: string
          enum:
          - identity-mismatch-risk
          - hand-labelled-sample-required
          - missing-abo-group
          - virtual-crossmatch-without-antibody-profile
          - donor-recipient-abo-incompatible
          - altruistic-donor-with-recipient
          - donor-and-recipient-on-one-form
          - urgent-without-reason
          - other
          - ''
          description: Flag category.
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          - ''
          description: 'Priority: low, medium, high.'
        description:
          type: string
          maxLength: 500
          description: Human-readable description of what fired the flag.
        suggestedAction:
          type: string
          maxLength: 500
          description: Suggested action for the requester or laboratory.
      required:
      - createdAt
      - updatedAt
      - gradeId
      - flagId
      - category
      - priority
      - description
      - suggestedAction
      description: Safety-critical flags that fire independently of the four axes, with priority and a
        suggested action.
    MedicalRenalLivingDonorRequestGradeRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        gradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        ruleId:
          type: string
          maxLength: 40
          description: Stable rule identifier (for example R-ID-3PT-01).
        axis:
          type: string
          enum:
          - appropriateness
          - identity
          - completeness
          - triage
          - ''
          description: 'Scoring axis: appropriateness, identity, completeness, triage.'
        category:
          type: string
          maxLength: 50
          description: Category the rule relates to.
        description:
          type: string
          maxLength: 500
          description: Human-readable description of why the rule fired.
      required:
      - createdAt
      - updatedAt
      - gradeId
      - ruleId
      - axis
      - category
      - description
      description: Audit trail of every appropriateness / identity / completeness / triage rule that fired
        for this request.
    MedicalRenalLivingDonorRequestTest:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        requestId:
          type: string
          format: uuid
          description: Foreign key to the parent request.
        testCode:
          type: string
          enum:
          - living-donor-full-crossmatch
          - living-donor-virtual-crossmatch
          - living-donor-match-grade
          - altruistic-donor
          - day-of-transplant-samples
          - abo-titres-only
          - red-cell-antibody-follow-up
          description: Requested test code.
        testDetail:
          type: string
          maxLength: 255
          description: Free-text detail, for example the antigen when "other" is chosen.
      required:
      - createdAt
      - updatedAt
      - requestId
      - testCode
      - testDetail
      description: 'One requested test of a living-donor request: full, virtual or match-grade testing,
        altruistic donor, day-of-transplant samples, ABO titres or red-cell antibody follow-up.'
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
