components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Clinician full name as recorded in the rota.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as a single text block.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code.
        role:
          type: string
          enum:
          - nurse
          - doctor
          - healthcare-assistant
          - other
          - ''
          description: 'Primary clinical role: nurse, doctor, healthcare-assistant, or other.'
        registrationBody:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - GPhC
          - other
          - ''
          description: 'Professional registration body: GMC, NMC, HCPC, GPhC, or other.'
        registrationNumber:
          type: string
          description: Professional registration number issued by the registration body.
      required:
      - createdAt
      - updatedAt
      - name
      - role
      - registrationBody
      - registrationNumber
      description: Clinician identifying information for the charting professional who records the fluid
        balance chart.
    FluidBalanceChart:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the patient this chart is for (restricted delete).
        clinicianId:
          type:
          - string
          - 'null'
          format: uuid
          description: Foreign key to the charting clinician (restricted delete); optional.
        clinicianName:
          type: string
          description: Name of the charting clinician as entered on the chart.
        clinicianRole:
          type: string
          enum:
          - nurse
          - doctor
          - healthcare-assistant
          - other
          - ''
          description: 'Role of the charting clinician: nurse, doctor, healthcare-assistant, or other.'
        patientIdentifier:
          type: string
          description: Local patient identifier as entered on the chart.
        wardOrUnit:
          type: string
          description: Ward or unit name where the chart is being kept.
        chartStartAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Date and time the charting period starts.
        chartPeriodHours:
          type:
          - number
          - 'null'
          format: double
          description: Charting period in hours (default 24); used to scale balance thresholds and compute
            the mL/kg/h rate.
        weightKg:
          type:
          - number
          - 'null'
          format: double
          description: Patient weight in kilograms; enables the urine output rate in mL/kg/h.
        clinicalNote:
          type: string
          description: Free-text summary note for the chart.
      required:
      - createdAt
      - updatedAt
      - patientId
      - clinicianName
      - clinicianRole
      - patientIdentifier
      - wardOrUnit
      - clinicalNote
      description: 'Parent fluid balance chart header: charting context, patient identification, charting
        period, and patient weight enabling the mL/kg/h urine output rate.'
    FluidBalanceChartEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        fluidBalanceChartId:
          type: string
          format: uuid
          description: Foreign key to the parent fluid balance chart.
        entryAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Date and time the volume was recorded.
        direction:
          type: string
          enum:
          - intake
          - output
          - ''
          description: 'Direction of the volume: intake or output.'
        category:
          type: string
          enum:
          - oral
          - iv
          - enteral
          - blood-products
          - other-intake
          - urine
          - drains
          - vomit-ng
          - stool
          - insensible-other
          - ''
          description: 'Fluid category: intake (oral, iv, enteral, blood-products, other-intake) or output
