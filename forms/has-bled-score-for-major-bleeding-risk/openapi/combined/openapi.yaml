          type: string
          enum:
          - cardiology
          - general-practice
          - anticoagulation-clinic
          - acute-medical
          - other
          - ''
          description: 'Care setting: cardiology, general-practice, anticoagulation-clinic, acute-medical,
            or other.'
        anticoagulation_status:
          type: string
          enum:
          - 'on'
          - considering
          - ''
          description: 'Whether the patient is already on, or is being considered for, oral anticoagulation:
            on or considering.'
        cha_ds_vasc_score:
          type: integer
          format: int32
          description: Optional paired CHA2DS2-VASc stroke-risk score (0-9), recorded as context only;
            not computed by this form.
        patient_identifier:
          type: string
          maxLength: 100
          description: Local patient identifier as recorded on the assessment.
        age_years:
          type: integer
          format: int32
          description: Patient age in whole years; drives criterion E (elderly, > 65). NULL when unanswered,
            contributing 0 points and raising a completeness flag.
        sex:
          type: string
          enum:
          - female
          - male
          - intersex
          - unknown
          - ''
          description: 'Patient sex recorded for the assessment: female, male, intersex, or unknown.'
        hypertension_uncontrolled:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Criterion H — uncontrolled hypertension (systolic blood pressure > 160 mmHg):
            yes or no.'
        abnormal_renal_function:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Criterion A (renal) — abnormal renal function (dialysis, transplant, or creatinine
            >= 200 umol/L): yes or no.'
        abnormal_liver_function:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Criterion A (liver) — abnormal liver function (cirrhosis, or bilirubin > 2x ULN
            with transaminases > 3x ULN): yes or no.'
        stroke_history:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Criterion S — prior stroke: yes or no.'
        bleeding_history:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Criterion B — prior major bleed, bleeding diathesis, or anaemia: yes or no.'
        labile_inr:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Criterion L — labile INR (unstable or high INR, or time in therapeutic range <
            60%): yes or no.'
