      - patient_id
      - clinician_name
      - clinician_role
      - care_setting
      - anticoagulation_status
      - patient_identifier
      - sex
      - hypertension_uncontrolled
      - abnormal_renal_function
      - abnormal_liver_function
      - stroke_history
      - bleeding_history
      - labile_inr
