        hypertension_points:
          type: integer
          format: int32
          description: Points (0 or 1) awarded for criterion H, uncontrolled hypertension.
        renal_points:
          type: integer
          format: int32
          description: Points (0 or 1) awarded for criterion A, abnormal renal function.
        liver_points:
          type: integer
          format: int32
          description: Points (0 or 1) awarded for criterion A, abnormal liver function.
        stroke_points:
          type: integer
          format: int32
          description: Points (0 or 1) awarded for criterion S, stroke history.
        bleeding_points:
          type: integer
          format: int32
          description: Points (0 or 1) awarded for criterion B, bleeding history or predisposition.
        labile_inr_points:
          type: integer
          format: int32
          description: Points (0 or 1) awarded for criterion L, labile INR.
        elderly_points:
          type: integer
          format: int32
          description: Points (0 or 1) awarded for criterion E, elderly (age > 65).
        drugs_points:
          type: integer
          format: int32
          description: Points (0 or 1) awarded for criterion D, concomitant antiplatelets or NSAIDs.
        alcohol_points:
          type: integer
          format: int32
          description: Points (0 or 1) awarded for criterion D, alcohol >= 8 units per week.
        total_score:
          type: integer
          format: int32
          description: Summed HAS-BLED score across the nine criteria (0-9).
        risk_band:
          type: string
          enum:
          - low
          - moderate
          - high
