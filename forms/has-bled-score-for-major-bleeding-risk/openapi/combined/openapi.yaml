      - created_at
      - updated_at
      - has_bled_score_for_major_bleeding_risk_id
      - risk_band
      - modifiable_factors
      - graded_at
      description: 'Computed HAS-BLED grading result: per-criterion 0-1 sub-scores, summed total (0-9),
