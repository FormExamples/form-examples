    WellsScoreForDeepVeinThrombosis:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the patient being assessed (restricts delete).
        clinicianId:
          type:
          - string
          - 'null'
          format: uuid
          description: Foreign key to the assessing clinician (restricts delete).
        status:
          type: string
          enum:
          - draft
          - submitted
          - amended
          - signed
          - ''
          description: 'Workflow status: draft, submitted, amended, or signed.'
        patientIdentifier:
          type: string
          maxLength: 64
          description: Local patient identifier as recorded at the point of assessment.
        assessedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Date and time the assessment was carried out.
        careSetting:
          type: string
          enum:
          - emergency-department
          - ambulatory
          - acute-medical-unit
          - dvt-clinic
          - other
          - ''
          description: 'Care setting: emergency-department, ambulatory, acute-medical-unit, dvt-clinic,
            or other.'
        ageBand:
          type: string
          enum:
          - 18-39
          - 40-64
          - 65-74
          - 75-84
          - 85-plus
          - ''
          description: 'Adult age band: 18-39, 40-64, 65-74, 75-84, or 85-plus.'
        symptomaticLeg:
          type: string
          enum:
          - left
          - right
          - ''
          description: 'Symptomatic leg: left or right.'
        activeCancer:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Criterion 1 (+1): active cancer, ongoing, within 6 months, or palliative.'
        paralysisOrImmobilisation:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Criterion 2 (+1): paralysis, paresis, or recent plaster immobilisation of the
            lower limb.'
        recentlyBedriddenOrSurgery:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Criterion 3 (+1): recently bedridden >= 3 days or major surgery within 12 weeks.'
        localisedTenderness:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Criterion 4 (+1): localised tenderness along the distribution of the deep venous
            system.'
        entireLegSwollen:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Criterion 5 (+1): entire leg swollen.'
        calfSwellingOver3cm:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Criterion 6 (+1): calf swelling >= 3 cm compared with the asymptomatic side.'
        pittingOedema:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Criterion 7 (+1): pitting oedema confined to the symptomatic leg.'
        collateralSuperficialVeins:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Criterion 8 (+1): collateral (non-varicose) superficial veins.'
        previouslyDocumentedDvt:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Criterion 9 (+1): previously documented DVT.'
        alternativeDiagnosisAsLikely:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Adjustment (-2): an alternative diagnosis is at least as likely as DVT.'
        clinicalNotes:
          type: string
          description: Free-text clinical notes captured alongside the assessment.
      required:
      - createdAt
      - updatedAt
      - patientId
      - status
      - patientIdentifier
      - careSetting
      - ageBand
      - symptomaticLeg
      - activeCancer
      - paralysisOrImmobilisation
      - recentlyBedriddenOrSurgery
      - localisedTenderness
      - entireLegSwollen
      - calfSwellingOver3cm
      - pittingOedema
      - collateralSuperficialVeins
      - previouslyDocumentedDvt
      - alternativeDiagnosisAsLikely
      - clinicalNotes
      description: 'Main Wells DVT assessment record: identification, context, and the nine clinical criterion
        inputs plus the alternative-diagnosis adjustment.'
