components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Clinician full name as recorded in the rota.
        email:
          type: string
          description: Email address.
        phone:
          type: string
          description: Phone number.
        postal_address_as_full_text:
          type: string
          description: Postal address as a single text block.
        country_as_iso_3166_1_alpha_2:
          type: string
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2.
        postcode:
          type: string
          description: Postal code.
        role:
          type: string
          enum:
          - doctor
          - nurse-practitioner
          - physician-associate
          - other
          - ''
          description: 'Primary clinical role: doctor, nurse-practitioner, physician-associate, or other.'
        registration_body:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - GPhC
          - other
          - ''
          description: 'Professional registration body: GMC, NMC, HCPC, GPhC, or other.'
        registration_number:
          type: string
          description: Professional registration number issued by the registration body.
      required:
      - created_at
      - updated_at
      - name
      - role
      - registration_body
      - registration_number
      description: Clinician identifying information for the assessing clinician.
    Patient:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          maxLength: 255
          description: Full patient name as recorded on the wristband.
        birth_date:
          type: string
          format: date
          description: Date of birth.
        sex:
          type: string
          enum:
          - female
          - male
          - intersex
          - unknown
          - ''
          description: 'Sex recorded for clinical purposes: female, male, intersex, or unknown.'
        email:
          type: string
          description: Email address.
        phone:
          type: string
          description: Phone number.
        postal_address_as_full_text:
          type: string
          description: Postal address as a single text block.
        country_as_iso_3166_1_alpha_2:
          type: string
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2.
        postcode:
          type: string
          description: Postal code.
        united_kingdom_nhs_number:
          type: string
          maxLength: 20
          description: United Kingdom NHS number, unique per person.
        hospital_mrn:
          type: string
          maxLength: 50
          description: Local hospital medical record number (MRN).
        height_as_cm:
          type: number
          format: double
          description: Height in centimetres.
        weight_as_kg:
          type: number
          format: double
          description: Weight in kilograms.
        body_mass_index:
          type: number
          format: double
          description: Body mass index (BMI), kg/m^2.
        allergies_summary:
          type: string
          description: Free-text summary of known allergies.
      required:
      - created_at
      - updated_at
      - name
      - birth_date
      - sex
      - allergies_summary
      description: Patient demographic information used by the Wells DVT assessment record.
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          description: A URI identifying the problem type
        title:
          type: string
          description: A short summary of the problem type
        status:
          type: integer
          description: The HTTP status code
        detail:
          type: string
          description: An explanation of this occurrence
        instance:
          type: string
          description: A URI identifying this occurrence
        code:
          type: string
          description: A short machine-readable reason
        errors:
          type: object
          description: Per-field detail, when validation failed
      required:
      - type
      - title
      - status
    WellsScoreForDeepVeinThrombosisGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        wells_score_for_deep_vein_thrombosis_id:
          type: string
          format: uuid
          description: Foreign key to the parent assessment (unique, 1:1).
        wells_score:
          type: integer
          format: int32
          description: Total Wells score computed by the engine, range -2..9.
        two_level_band:
          type: string
          enum:
          - likely
          - unlikely
          - ''
          description: 'Two-level band: likely (score >= 2) or unlikely (score <= 1).'
        three_level_band:
          type: string
          enum:
          - low
          - moderate
          - high
          - ''
          description: 'Informational three-level band: low (<= 0), moderate (1-2), or high (>= 3).'
        recommended_pathway:
          type: string
          description: 'Recommended investigation pathway: proximal leg vein ultrasound when likely, otherwise
            D-dimer.'
        graded_at:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the grade.
      required:
      - created_at
      - updated_at
      - wells_score_for_deep_vein_thrombosis_id
      - two_level_band
      - three_level_band
      - recommended_pathway
      - graded_at
      description: 'Computed Wells DVT grading result: total score, two-level band, three-level band,
        and recommended investigation pathway. One-to-one with the parent assessment.'
    WellsScoreForDeepVeinThrombosisGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        wells_score_for_deep_vein_thrombosis_grade_id:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        flag_id:
          type: string
          maxLength: 50
          description: Stable flag identifier (e.g. F-DVT-LIKELY-ULTRASOUND-001).
        category:
          type: string
          enum:
          - dvt-likely-ultrasound
          - dvt-unlikely-d-dimer
          - active-cancer
          - previous-dvt
          - incomplete-assessment
          - other
          - ''
          description: 'Flag category: dvt-likely-ultrasound, dvt-unlikely-d-dimer, active-cancer, previous-dvt,
            incomplete-assessment, or other.'
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          - ''
          description: 'Priority: low, medium, high.'
        description:
          type: string
          maxLength: 500
          description: Human-readable description of what fired the flag.
        suggested_action:
          type: string
          maxLength: 500
          description: Suggested clinical action (e.g. "offer proximal leg vein ultrasound within 4 hours",
            "offer D-dimer test").
      required:
      - created_at
      - updated_at
      - wells_score_for_deep_vein_thrombosis_grade_id
      - flag_id
      - category
      - priority
      - description
      - suggested_action
      description: Clinically significant flags that fire independently of the total score, with priority
        and a suggested action for the assessing team.
    WellsScoreForDeepVeinThrombosisGradeRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        wells_score_for_deep_vein_thrombosis_grade_id:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        rule_id:
          type: string
          maxLength: 40
          description: Stable rule identifier (e.g. R-ACTIVE-CANCER-01).
        instrument:
          type: string
          enum:
          - criterion
          - adjustment
          - two-level
          - three-level
          - composite
          description: 'Scoring instrument the rule belongs to: criterion, adjustment, two-level, three-level,
            or composite.'
        points:
          type: integer
          format: int32
          description: Points contributed by this rule (+1 for a criterion, -2 for the alternative-diagnosis
            adjustment).
        band:
          type: string
          enum:
          - likely
          - unlikely
          - low
          - moderate
          - high
          - ''
          description: 'Stratification band informed by this rule: likely, unlikely, low, moderate, or
            high.'
        category:
          type: string
          maxLength: 50
          description: Subject category (e.g. malignancy, immobilisation, clinical-sign, alternative-diagnosis).
        description:
          type: string
          maxLength: 500
          description: Human-readable description of why the rule fired.
      required:
      - created_at
      - updated_at
      - wells_score_for_deep_vein_thrombosis_grade_id
      - rule_id
      - instrument
      - points
      - band
      - category
      - description
      description: 'Audit trail of every grading rule that fired during Wells-score computation: instrument,
        points, band, category, and description.'
