components:
  schemas:
    AngiographyTestResult:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the patient.
        clinicianId:
          type: string
          format: uuid
          description: Foreign key to the reporting clinician (interventional radiologist / radiologist
            / cardiologist / vascular surgeon).
        originatingRequestReference:
          type: string
          maxLength: 255
          description: Free-text reference linking this report back to the originating angiography request
            (referral).
        reportStatus:
          type: string
          enum:
          - preliminary
          - final
          - amended
          - cancelled
          - ''
          description: 'Report lifecycle status: preliminary, final, amended, cancelled.'
        performedDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the angiographic examination was performed.
        reportedDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the report was authored / signed.
        angiographyType:
          type: string
          enum:
          - ct-angiography
          - mr-angiography
          - catheter-dsa
          - coronary-angiography
          - peripheral-angiography
          - cerebral-angiography
          - other
          - ''
          description: 'Angiography modality performed: ct-angiography, mr-angiography, catheter-dsa,
            coronary-angiography, peripheral-angiography, cerebral-angiography, other.'
        bodyRegion:
          type: string
          enum:
          - coronary
          - cerebral
          - carotid
          - aorta
          - renal
          - peripheral-lower-limb
          - pulmonary
          - mesenteric
          - other
          - ''
          description: 'Examined arterial territory: coronary, cerebral, carotid, aorta, renal, peripheral-lower-limb,
            pulmonary, mesenteric, other.'
        contrastUsed:
          type: string
          enum:
          - iodinated
          - gadolinium
          - none
          - ''
          description: 'Contrast actually administered: iodinated, gadolinium, none.'
        examinationAdequacy:
          type: string
          enum:
          - adequate
          - limited
          - non-diagnostic
          - ''
          description: 'Diagnostic adequacy of the examination: adequate, limited, non-diagnostic.'
        clinicalHistory:
          type: string
          maxLength: 1000
          description: Clinical history and the question the examination was performed to answer.
        comparisonWithPrevious:
          type: string
          maxLength: 1000
          description: Comparison with relevant previous imaging studies.
        findingsNarrative:
          type: string
          maxLength: 2000
          description: Narrative description of the angiographic findings (the body of the report).
        significantStenosis:
          type: boolean
          description: Whether a haemodynamically significant arterial stenosis is present.
        occlusion:
          type: boolean
          description: Whether a vessel occlusion (complete luminal loss) is present.
        aneurysm:
          type: boolean
          description: Whether an aneurysm or focal aneurysmal dilatation is present.
        dissection:
          type: boolean
          description: Whether an arterial dissection (intimal flap / false lumen) is present.
        activeExtravasation:
          type: boolean
          description: Whether active contrast extravasation (active bleeding) is present.
        thrombus:
          type: boolean
          description: Whether intraluminal thrombus or embolus is present.
        normalVessels:
          type: boolean
          description: Whether the examined vessels are normal with no significant abnormality.
        incidentalFinding:
          type: boolean
          description: Whether one or more incidental findings warranting documentation are present.
        maxStenosisPercent:
          type:
          - number
          - 'null'
          format: double
          description: Maximum arterial luminal stenosis as a percentage (0-100), e.g. NASCET-style diameter
            reduction.
        interventionPerformed:
          type: boolean
          description: Whether an angiographic intervention (e.g. angioplasty, stent, embolisation) was
            performed during the study.
        impression:
          type: string
          maxLength: 2000
          description: Summary impression / conclusion answering the clinical question.
        reportingCategory:
          type: string
          maxLength: 50
          description: Structured-reporting category label (free text), e.g. a stenosis-severity category
            such as <50% / 50-69% / 70-99% / near-occlusion / occluded.
        recommendedFollowUp:
          type: string
          maxLength: 1000
          description: Recommended follow-up imaging, referral, or management.
        criticalResultCommunicated:
          type: boolean
          description: Whether a critical or unexpected significant result was communicated directly to
            the referrer.
        reportedTo:
          type: string
          maxLength: 500
          description: Who the critical / urgent result was communicated to, with date and time if applicable.
      required:
      - createdAt
      - updatedAt
      - patientId
      - clinicianId
      - originatingRequestReference
      - reportStatus
      - angiographyType
      - bodyRegion
      - contrastUsed
      - examinationAdequacy
      - clinicalHistory
      - comparisonWithPrevious
      - findingsNarrative
      - significantStenosis
      - occlusion
      - aneurysm
      - dissection
      - activeExtravasation
      - thrombus
      - normalVessels
      - incidentalFinding
      - interventionPerformed
      - impression
      - reportingCategory
      - recommendedFollowUp
      - criticalResultCommunicated
      - reportedTo
      description: Angiography result (report). Captures the performed examination, modality and contrast,
        clinical history, the narrative and structured vascular findings, the maximum stenosis percentage
        and whether an intervention was performed, the impression and reporting category, recommended
        follow-up, and critical-result communication. This is the source-of-truth record that the four-axis
        interpretation grade is computed from.
    AngiographyTestResultGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        angiographyTestResultId:
          type: string
          format: uuid
          description: Foreign key to the parent result (unique, 1:1).
        resultClassification:
          type: string
          enum:
          - normal
          - abnormal
          - critical
          - inconclusive
          - ''
          description: 'Axis A overall classification: normal, abnormal, critical, inconclusive.'
        abnormalitySeverity:
          type: string
          enum:
          - none
          - minor
          - moderate
          - major
          - ''
          description: 'Axis B abnormality severity: none, minor, moderate, major.'
        reportingCategory:
          type: string
          maxLength: 50
          description: Axis B structured-reporting score / category label (e.g. a stenosis-severity category
            such as <50% / 50-69% / 70-99% / near-occlusion / occluded).
        reportCompletenessPercent:
          type:
          - integer
          - 'null'
          format: int32
          description: Axis C report completeness as a percentage of mandatory report sections (0-100).
        followUpUrgency:
          type: string
          enum:
          - routine
          - recommended
          - urgent
          - critical-alert
          - ''
          description: 'Axis D follow-up urgency: routine, recommended, urgent, critical-alert.'
        targetTimeframe:
          type: string
          maxLength: 50
          description: Target timeframe for the recommended follow-up implied by the urgency.
        recommendedAction:
          type: string
          maxLength: 500
          description: Axis D concise recommended action derived from the urgency.
        recommendation:
          type: string
          enum:
          - no-action
          - routine-follow-up
          - further-imaging
          - specialist-referral
          - urgent-review
          - ''
          description: 'Overall recommendation: no-action, routine-follow-up, further-imaging, specialist-referral,
            urgent-review.'
        clinicianNotes:
          type: string
          description: Free-text interpretation / sign-off notes.
        signedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Timestamp of the reporting clinician electronic signature.
        gradedAt:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the result.
      required:
      - createdAt
      - updatedAt
      - angiographyTestResultId
      - resultClassification
      - abnormalitySeverity
      - reportingCategory
      - followUpUrgency
      - targetTimeframe
      - recommendedAction
      - recommendation
      - clinicianNotes
      - gradedAt
      description: 'Computed four-axis interpretation grade: result classification, abnormality severity
        / structured-reporting category, report completeness, and follow-up urgency. A critical result
        auto-escalates the follow-up urgency to critical-alert regardless of the other axes.'
    AngiographyTestResultGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        angiographyTestResultGradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        flagId:
          type: string
          maxLength: 50
          description: Stable flag identifier (e.g. F-CRITICAL-RESULT-001).
        category:
          type: string
          enum:
          - critical-result-alert
          - incidental-finding
          - discrepancy-with-request
          - abnormal-requiring-action
          - urgent-referral
          - inadequate-technique
          - unexpected-finding
          - missing-impression
          - missing-measurement
          - other
          - ''
          description: Flag category.
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          - ''
          description: 'Priority: low, medium, high.'
        description:
          type: string
          maxLength: 500
          description: Human-readable description of what fired the flag.
        suggestedAction:
          type: string
          maxLength: 500
          description: Suggested clinical action (e.g. "communicate critical result to referrer and document").
      required:
      - createdAt
      - updatedAt
      - angiographyTestResultGradeId
      - flagId
      - category
      - priority
      - description
      - suggestedAction
      description: Safety-critical flags that fire independently of the four axes, with priority and a
        suggested action for the reporting / referring team.
    AngiographyTestResultGradeRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        angiographyTestResultGradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        ruleId:
          type: string
          maxLength: 40
          description: Stable rule identifier (e.g. R-CLASS-CRITICAL-01).
        axis:
          type: string
          enum:
          - classification
          - severity
          - completeness
          - follow-up
          - ''
          description: 'Scoring axis the rule belongs to: classification, severity, completeness, follow-up.'
        category:
          type: string
          maxLength: 50
          description: Category or finding the rule relates to.
        description:
          type: string
          maxLength: 500
          description: Human-readable description of why the rule fired.
      required:
      - createdAt
      - updatedAt
      - angiographyTestResultGradeId
      - ruleId
      - axis
      - category
      - description
      description: Audit trail of every classification / severity / completeness / follow-up rule that
        fired for this result.
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
