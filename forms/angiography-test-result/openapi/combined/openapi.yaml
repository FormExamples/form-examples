      - active_extravasation
      - thrombus
      - normal_vessels
      - incidental_finding
      - intervention_performed
      - impression
      - reporting_category
      - recommended_follow_up
      - critical_result_communicated
      - reported_to
      description: Angiography result (report). Captures the performed examination, modality and contrast,
        clinical history, the narrative and structured vascular findings, the maximum stenosis percentage
        and whether an intervention was performed, the impression and reporting category, recommended
        follow-up, and critical-result communication. This is the source-of-truth record that the four-axis
        interpretation grade is computed from.
    AngiographyTestResultGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        angiography_test_result_id:
          type: string
          format: uuid
          description: Foreign key to the parent result (unique, 1:1).
        result_classification:
          type: string
          enum:
          - normal
          - abnormal
          - critical
          - inconclusive
          - ''
          description: 'Axis A overall classification: normal, abnormal, critical, inconclusive.'
        abnormality_severity:
          type: string
          enum:
          - none
          - minor
          - moderate
          - major
          - ''
          description: 'Axis B abnormality severity: none, minor, moderate, major.'
        reporting_category:
          type: string
          maxLength: 50
          description: Axis B structured-reporting score / category label (e.g. a stenosis-severity category
            such as <50% / 50-69% / 70-99% / near-occlusion / occluded).
        report_completeness_percent:
          type: integer
          format: int32
          description: Axis C report completeness as a percentage of mandatory report sections (0-100).
        follow_up_urgency:
          type: string
          enum:
          - routine
          - recommended
          - urgent
          - critical-alert
          - ''
          description: 'Axis D follow-up urgency: routine, recommended, urgent, critical-alert.'
        target_timeframe:
          type: string
          maxLength: 50
          description: Target timeframe for the recommended follow-up implied by the urgency.
        recommended_action:
          type: string
          maxLength: 500
          description: Axis D concise recommended action derived from the urgency.
        recommendation:
          type: string
          enum:
          - no-action
          - routine-follow-up
          - further-imaging
          - specialist-referral
          - urgent-review
          - ''
          description: 'Overall recommendation: no-action, routine-follow-up, further-imaging, specialist-referral,
            urgent-review.'
        clinician_notes:
          type: string
          description: Free-text interpretation / sign-off notes.
        signed_at:
          type: string
          format: date-time
          description: Timestamp of the reporting clinician electronic signature.
        graded_at:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the result.
      required:
      - created_at
      - updated_at
      - angiography_test_result_id
      - result_classification
      - abnormality_severity
      - reporting_category
      - follow_up_urgency
      - target_timeframe
      - recommended_action
      - recommendation
      - clinician_notes
      - graded_at
      description: 'Computed four-axis interpretation grade: result classification, abnormality severity
