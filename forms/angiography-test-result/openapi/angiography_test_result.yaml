    AngiographyTestResult:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patient_id:
          type: string
          format: uuid
          description: Foreign key to the patient.
        clinician_id:
          type: string
          format: uuid
          description: Foreign key to the reporting clinician (interventional radiologist / radiologist / cardiologist / vascular surgeon).
        originating_request_reference:
          type: string
          maxLength: 255
          description: Free-text reference linking this report back to the originating angiography request (referral).
        report_status:
          type: string
          enum:
            - preliminary
            - final
            - amended
            - cancelled
            - ""
          description: "Report lifecycle status: preliminary, final, amended, cancelled."
        performed_date:
          type: [string, 'null']
          format: date
          description: Date the angiographic examination was performed.
        reported_date:
          type: [string, 'null']
          format: date
          description: Date the report was authored / signed.
        angiography_type:
          type: string
          enum:
            - ct-angiography
            - mr-angiography
            - catheter-dsa
            - coronary-angiography
            - peripheral-angiography
            - cerebral-angiography
            - other
            - ""
          description: "Angiography modality performed: ct-angiography, mr-angiography, catheter-dsa, coronary-angiography, peripheral-angiography, cerebral-angiography, other."
        body_region:
          type: string
          enum:
            - coronary
            - cerebral
            - carotid
            - aorta
            - renal
            - peripheral-lower-limb
            - pulmonary
            - mesenteric
            - other
            - ""
          description: "Examined arterial territory: coronary, cerebral, carotid, aorta, renal, peripheral-lower-limb, pulmonary, mesenteric, other."
        contrast_used:
          type: string
          enum:
            - iodinated
            - gadolinium
            - none
            - ""
          description: "Contrast actually administered: iodinated, gadolinium, none."
        examination_adequacy:
          type: string
          enum:
            - adequate
            - limited
            - non-diagnostic
            - ""
          description: "Diagnostic adequacy of the examination: adequate, limited, non-diagnostic."
        clinical_history:
          type: string
          maxLength: 1000
          description: Clinical history and the question the examination was performed to answer.
        comparison_with_previous:
          type: string
          maxLength: 1000
          description: Comparison with relevant previous imaging studies.
        findings_narrative:
          type: string
          maxLength: 2000
          description: Narrative description of the angiographic findings (the body of the report).
        significant_stenosis:
          type: boolean
          description: Whether a haemodynamically significant arterial stenosis is present.
        occlusion:
          type: boolean
          description: Whether a vessel occlusion (complete luminal loss) is present.
        aneurysm:
          type: boolean
          description: Whether an aneurysm or focal aneurysmal dilatation is present.
        dissection:
          type: boolean
          description: Whether an arterial dissection (intimal flap / false lumen) is present.
        active_extravasation:
          type: boolean
          description: Whether active contrast extravasation (active bleeding) is present.
        thrombus:
          type: boolean
          description: Whether intraluminal thrombus or embolus is present.
        normal_vessels:
          type: boolean
          description: Whether the examined vessels are normal with no significant abnormality.
        incidental_finding:
          type: boolean
          description: Whether one or more incidental findings warranting documentation are present.
        max_stenosis_percent:
          type: [number, 'null']
          format: double
          description: Maximum arterial luminal stenosis as a percentage (0-100), e.g. NASCET-style diameter reduction.
        intervention_performed:
          type: boolean
          description: Whether an angiographic intervention (e.g. angioplasty, stent, embolisation) was performed during the study.
        impression:
          type: string
          maxLength: 2000
          description: Summary impression / conclusion answering the clinical question.
        reporting_category:
          type: string
          maxLength: 50
          description: Structured-reporting category label (free text), e.g. a stenosis-severity category such as <50% / 50-69% / 70-99% / near-occlusion / occluded.
        recommended_follow_up:
          type: string
          maxLength: 1000
          description: Recommended follow-up imaging, referral, or management.
        critical_result_communicated:
          type: boolean
          description: Whether a critical or unexpected significant result was communicated directly to the referrer.
        reported_to:
          type: string
          maxLength: 500
          description: Who the critical / urgent result was communicated to, with date and time if applicable.
