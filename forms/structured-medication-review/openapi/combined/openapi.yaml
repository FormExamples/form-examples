    StructuredMedicationReviewGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        structuredMedicationReviewId:
          type: string
          format: uuid
          description: Foreign key to the parent structured medication review (unique, 1:1).
