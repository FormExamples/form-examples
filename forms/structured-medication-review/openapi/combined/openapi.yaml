components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Clinician full name.
        email:
          type: string
          description: Email address.
        phone:
          type: string
          description: Phone number.
        postal_address_as_full_text:
          type: string
          description: Postal address as a single text block.
        country_as_iso_3166_1_alpha_2:
          type: string
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2.
        postcode:
          type: string
          description: Postal code.
        role:
          type: string
          enum:
          - clinical-pharmacist
          - gp
          - pharmacy-technician
          - other
          - ''
          description: 'Primary role of the reviewing clinician: clinical-pharmacist, gp, pharmacy-technician,
            or other.'
        registration_body:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - GPhC
          - other
          - ''
          description: 'Professional registration body: GMC, NMC, HCPC, GPhC, or other.'
        registration_number:
          type: string
          description: Professional registration number issued by the registration body.
      required:
      - created_at
      - updated_at
      - name
      - role
      - registration_body
      - registration_number
      description: Clinician identifying information for the professional who carried out the structured
        medication review.
    Patient:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          maxLength: 255
          description: Full patient name.
        birth_date:
          type: string
          format: date
          description: Date of birth.
        sex:
          type: string
          enum:
          - female
          - male
          - intersex
          - unknown
          - ''
          description: 'Sex recorded for clinical purposes: female, male, intersex, or unknown.'
        email:
          type: string
          description: Email address.
        phone:
          type: string
          description: Phone number.
        postal_address_as_full_text:
          type: string
          description: Postal address as a single text block.
        country_as_iso_3166_1_alpha_2:
          type: string
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2.
        postcode:
          type: string
          description: Postal code.
        united_kingdom_nhs_number:
          type: string
          maxLength: 20
          description: United Kingdom NHS number, unique per person.
        hospital_mrn:
          type: string
          maxLength: 50
          description: Local hospital medical record number (MRN).
        height_as_cm:
          type: number
          format: double
          description: Height in centimetres.
        weight_as_kg:
          type: number
          format: double
          description: Weight in kilograms.
        body_mass_index:
          type: number
          format: double
          description: Body mass index (BMI), kg/m^2.
        allergies_summary:
          type: string
          description: Free-text summary of known allergies and intolerances.
      required:
      - created_at
      - updated_at
      - name
      - birth_date
      - sex
      - allergies_summary
      description: Patient demographic information used by the structured medication review record.
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          description: A URI identifying the problem type
        title:
          type: string
          description: A short summary of the problem type
        status:
          type: integer
          description: The HTTP status code
        detail:
          type: string
          description: An explanation of this occurrence
        instance:
          type: string
          description: A URI identifying this occurrence
        code:
          type: string
          description: A short machine-readable reason
        errors:
          type: object
          description: Per-field detail, when validation failed
      required:
      - type
      - title
      - status
    StructuredMedicationReview:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patient_id:
          type: string
          format: uuid
          description: Foreign key to the patient this review is for (restricted delete).
        clinician_id:
          type: string
          format: uuid
          description: Foreign key to the reviewing clinician (restricted delete); optional.
        clinician_name:
          type: string
          description: Name of the reviewing clinician as entered on the review.
        clinician_role:
          type: string
          enum:
          - clinical-pharmacist
          - gp
          - pharmacy-technician
          - other
          - ''
          description: 'Role of the reviewing clinician: clinical-pharmacist, gp, pharmacy-technician,
            or other.'
        reviewed_at:
          type: string
          format: date-time
          description: Date and time the review was carried out.
        care_setting:
          type: string
          enum:
          - gp-practice
          - pcn
          - care-home
          - community-pharmacy
          - patient-home
          - ''
          description: 'Care setting: gp-practice, pcn, care-home, community-pharmacy, or patient-home.'
        consultation_mode:
          type: string
          enum:
          - face-to-face
          - telephone
          - video
          - home-visit
          - ''
          description: 'Consultation mode: face-to-face, telephone, video, or home-visit.'
        patient_identifier:
          type: string
          description: Local patient identifier as entered on the review.
        age_band:
          type: string
          enum:
          - 18-39
          - 40-64
          - 65-74
          - 75-84
          - 85-plus
          - ''
          description: 'Patient adult age band: 18-39, 40-64, 65-74, 75-84, or 85-plus.'
        sex:
          type: string
          enum:
          - female
          - male
          - intersex
          - unknown
          - ''
          description: 'Patient sex: female, male, intersex, or unknown.'
        frailty_status:
          type: string
          enum:
          - fit
          - mild
          - moderate
          - severe
          - ''
          description: 'Patient frailty status: fit, mild, moderate, or severe.'
        lives_in_care_home:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Whether the patient lives in a care home: yes or no.'
        long_term_conditions:
          type: string
          description: Comma-separated list of the patient long-term conditions.
        presenting_problems:
          type: string
          description: Reasons for the review / presenting medication problems.
        patient_reported_issues:
          type: string
          description: Side effects and difficulties reported by the patient.
        what_matters_to_patient:
          type: string
          description: The patient priorities and what matters most to them.
        shared_decisions:
          type: string
          description: Decisions agreed together with the patient.
        monitoring_due:
          type: string
          description: Tests / bloods due or outstanding for the patient medicines.
        overdue_monitoring_count:
          type: integer
          format: int32
          description: Count of monitoring items that are overdue; null when unanswered.
        follow_up_plan:
          type: string
          description: Agreed follow-up plan and actions.
        follow_up_date:
          type: string
          format: date
          description: Date the next review is due.
        review_completed:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Whether the clinician marked the review as completed: yes or no.'
      required:
      - created_at
      - updated_at
      - patient_id
      - clinician_name
      - clinician_role
      - care_setting
      - consultation_mode
      - patient_identifier
      - age_band
      - sex
      - frailty_status
      - lives_in_care_home
      - long_term_conditions
      - presenting_problems
      - patient_reported_issues
      - what_matters_to_patient
      - shared_decisions
      - monitoring_due
      - follow_up_plan
      - review_completed
      description: 'Parent structured medication review header: reviewing context, patient identification
        and frailty context, presenting problems and priorities, monitoring due, and shared decisions
        and follow-up plan.'
    StructuredMedicationReviewGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        structured_medication_review_id:
          type: string
          format: uuid
          description: Foreign key to the parent structured medication review (unique, 1:1).
        review_status:
          type: string
          enum:
          - complete
          - incomplete
          - ''
          description: 'Overall review status: complete or incomplete.'
        anticholinergic_burden_score:
          type: integer
          format: int32
          description: Sum of the per-medicine anticholinergic burden points (ACB scale).
        anticholinergic_band:
          type: string
          enum:
          - low
          - significant
          - ''
          description: 'Anticholinergic burden band: low, or significant when the score is 3 or more.'
        polypharmacy_band:
          type: string
          enum:
          - none
          - polypharmacy
          - hyperpolypharmacy
          - ''
          description: 'Polypharmacy band from the regular-medicine count: none (< 5), polypharmacy (5-9),
            or hyperpolypharmacy (>= 10).'
        burden_band:
          type: string
          enum:
          - low
          - moderate
          - high
          - ''
          description: 'Composite burden band (worse of polypharmacy and anticholinergic bands): low,
            moderate, or high.'
        medicine_count:
          type: integer
          format: int32
          description: Total count of medicines reviewed.
        regular_medicine_count:
          type: integer
          format: int32
          description: Count of regular medicines that count toward polypharmacy.
        graded_at:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the grade.
      required:
      - created_at
      - updated_at
      - structured_medication_review_id
      - review_status
      - anticholinergic_burden_score
      - anticholinergic_band
      - polypharmacy_band
      - burden_band
      - medicine_count
      - regular_medicine_count
      - graded_at
      description: 'Computed scoring result for a structured medication review: review status, anticholinergic
        burden score and band, polypharmacy band, composite burden band, and medicine counts.'
    StructuredMedicationReviewGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        structured_medication_review_grade_id:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        flag_id:
          type: string
          maxLength: 50
          description: Stable flag identifier (e.g. F-HIGH-ACB-001).
        category:
          type: string
          enum:
          - high-acb
          - stopp-trigger
          - start-omission
          - missing-monitoring
          - adherence-concern
          - high-risk-no-indication
          - incomplete
          - other
          - ''
          description: 'Flag category: high-acb, stopp-trigger, start-omission, missing-monitoring, adherence-concern,
            high-risk-no-indication, incomplete, or other.'
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          - ''
          description: 'Priority: low, medium, high.'
        description:
          type: string
          maxLength: 500
          description: Human-readable description of what fired the flag.
        suggested_action:
          type: string
          maxLength: 500
          description: Suggested clinical action (e.g. "review sedating and anticholinergic medicines").
      required:
      - created_at
      - updated_at
      - structured_medication_review_grade_id
      - flag_id
      - category
      - priority
      - description
      - suggested_action
      description: Flagged issues raised independently of the burden bands, with priority and a suggested
        action for the reviewing clinician.
    StructuredMedicationReviewGradeRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        structured_medication_review_grade_id:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        rule_id:
          type: string
          maxLength: 40
          description: Stable rule identifier (e.g. R-POLYPHARMACY-01).
        category:
          type: string
          maxLength: 50
          description: Subject category (e.g. polypharmacy, anticholinergic-burden, review-status).
        description:
          type: string
          maxLength: 500
          description: Human-readable description of why the rule fired.
      required:
      - created_at
      - updated_at
      - structured_medication_review_grade_id
      - rule_id
      - category
      - description
      description: 'Audit trail of every scoring rule that fired during grading: category and description.'
    StructuredMedicationReviewMedicine:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        structured_medication_review_id:
          type: string
          format: uuid
          description: Foreign key to the parent structured medication review.
        drug_name:
          type: string
          description: Medicine name.
        form_strength:
          type: string
          description: Form and strength of the medicine (e.g. tablet 5 mg).
        dose_regimen:
          type: string
          description: Dose and frequency (e.g. one tablet twice daily).
        indication:
          type: string
          description: Reason the medicine is prescribed.
        indication_recorded:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Whether an indication is recorded for the medicine: yes or no.'
        is_regular:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Whether the medicine is a regular (repeat) medicine that counts toward polypharmacy:
            yes or no.'
        is_high_risk:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Whether the medicine is a high-risk medicine: yes or no.'
        high_risk_class:
          type: string
          enum:
          - anticoagulant
          - insulin
          - opioid
          - dmard
          - lithium
          - methotrexate
          - other
          - ''
          description: 'High-risk medicine class: anticoagulant, insulin, opioid, dmard, lithium, methotrexate,
            or other.'
        adherence:
          type: string
          enum:
          - good
          - partial
          - poor
          - unknown
          - ''
          description: 'Patient adherence to the medicine: good, partial, poor, or unknown.'
        anticholinergic_burden_points:
          type: integer
          format: int32
          description: Anticholinergic Cognitive Burden (ACB) points for the medicine, 0-3; null when
            unanswered (contributes 0 to the sum).
        monitoring_required:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Whether the medicine requires monitoring: yes or no.'
        monitoring_up_to_date:
          type: string
          enum:
          - 'yes'
          - 'no'
          - na
          - ''
          description: 'Whether required monitoring is up to date: yes, no, or na (not applicable).'
        deprescribing_candidate:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Whether the medicine is a candidate for deprescribing: yes or no.'
        stopp_criterion:
          type: string
          description: STOPP code / description for a potentially inappropriate medicine, or empty.
        start_criterion:
          type: string
          description: START code / description for a potential prescribing omission, or empty.
      required:
      - created_at
      - updated_at
      - structured_medication_review_id
      - drug_name
      - form_strength
      - dose_regimen
      - indication
      - indication_recorded
      - is_regular
      - is_high_risk
      - high_risk_class
      - adherence
      - monitoring_required
      - monitoring_up_to_date
      - deprescribing_candidate
      - stopp_criterion
      - start_criterion
      description: 'Medicines reviewed within a structured medication review: name, form and strength,
        dose, indication, regular/high-risk flags, adherence, anticholinergic burden, monitoring, deprescribing
        candidacy, and STOPP/START criteria.'
