components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        name:
          type: string
          description: Clinician full name.
        email:
          type: string
          description: Email address.
        phone:
          type: string
          description: Phone number.
        postal_address_as_full_text:
          type: string
          description: Postal address as a single text block.
        country_as_iso_3166_1_alpha_2:
          type: string
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2.
        postcode:
          type: string
          description: Postal code.
        role:
          type: string
          enum:
          - doctor
          - nurse
          - paramedic
          - emergency-medical-technician
          - advanced-clinical-practitioner
          - neuro-observation-staff
          - other
          - ''
          description: 'Primary clinical role: doctor, nurse, paramedic, emergency-medical-technician,
            advanced-clinical-practitioner, neuro-observation-staff, or other.'
        registration_body:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - GPhC
          - other
          - ''
          description: 'Professional registration body: GMC, NMC, HCPC, GPhC, or other.'
        registration_number:
          type: string
          description: Professional registration number issued by the registration body.
      required:
      - created_at
      - updated_at
      - name
      - role
      - registration_body
      - registration_number
      description: Clinician identifying information for the assessing observer.
    GlasgowComaScale:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        patient_id:
          type: string
          format: uuid
          description: Foreign key to the patient being assessed (delete restricted).
        clinician_id:
          type: string
          format: uuid
          description: Foreign key to the assessing clinician (optional; delete restricted).
        assessor_name:
          type: string
          maxLength: 255
          description: Name of the assessing observer as recorded on the assessment.
        assessor_role:
          type: string
          enum:
          - doctor
          - nurse
          - paramedic
          - emergency-medical-technician
          - advanced-clinical-practitioner
          - neuro-observation-staff
          - other
          - ''
          description: 'Role of the assessing observer: doctor, nurse, paramedic, emergency-medical-technician,
            advanced-clinical-practitioner, neuro-observation-staff, or other.'
        assessed_at:
          type: string
          format: date-time
          description: Date and time the assessment was performed.
        setting:
          type: string
          enum:
          - ed
          - neuro
          - critical-care
          - pre-hospital
          - other
          - ''
          description: 'Care setting: ed (emergency department), neuro, critical-care, pre-hospital, or
            other.'
        reason:
          type: string
          description: Free-text reason for the assessment (e.g. head injury, stroke, reduced consciousness).
        intubated:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the patient is intubated or has a tracheostomy (confounder; may force the
            verbal component to NT).
        sedated:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the patient is sedated (confounder; may force a component to NT).
        paralysed:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the patient has neuromuscular blockade (confounder; may force the motor
            component to NT).
        eye_response:
          type: string
          enum:
          - spontaneous
          - to-sound
          - to-pressure
          - none
          - NT
          - ''
          description: 'Best eye-opening response (E, 1-4): spontaneous (4), to-sound (3), to-pressure
            (2), none (1), or NT when a local factor prevents testing.'
        eye_not_testable_reason:
          type: string
          description: Free-text reason the eye component is not testable (e.g. periorbital swelling,
            dressings).
        verbal_response:
          type: string
          enum:
          - orientated
          - confused
          - words
          - sounds
          - none
          - NT
          - ''
          description: 'Best verbal response (V, 1-5): orientated (5), confused (4), words (3), sounds
            (2), none (1), or NT when a local factor prevents testing.'
        verbal_not_testable_reason:
          type: string
          description: Free-text reason the verbal component is not testable (e.g. intubation, tracheostomy,
            language barrier).
        motor_response:
          type: string
          enum:
          - obeys-commands
          - localising
          - normal-flexion
          - abnormal-flexion
          - extension
          - none
          - NT
          - ''
          description: 'Best motor response (M, 1-6): obeys-commands (6), localising (5), normal-flexion
            (4), abnormal-flexion (3), extension (2), none (1), or NT when a local factor prevents testing.'
        motor_not_testable_reason:
          type: string
          description: Free-text reason the motor component is not testable (e.g. neuromuscular blockade,
            spinal injury, limb immobilisation).
        left_pupil_reactivity:
          type: string
          enum:
          - reactive
          - sluggish
          - unreactive
          - ''
          description: 'Left pupil reactivity to light: reactive, sluggish, or unreactive (used for the
            Pupil Reactivity Score).'
        right_pupil_reactivity:
          type: string
          enum:
          - reactive
          - sluggish
          - unreactive
          - ''
          description: 'Right pupil reactivity to light: reactive, sluggish, or unreactive (used for the
            Pupil Reactivity Score).'
        left_pupil_size_mm:
          type: number
          format: double
          description: Left pupil size in millimetres (for the record).
        right_pupil_size_mm:
          type: number
          format: double
          description: Right pupil size in millimetres (for the record).
        previous_total:
          type: integer
          format: int32
          description: Previous total GCS (3-15) for the trend comparison, when available.
        previous_motor_score:
          type: integer
          format: int32
          description: Previous motor component score (1-6) for the trend comparison, when available.
        previous_assessed_at:
          type: string
          format: date-time
          description: Date and time of the previous assessment used for the trend comparison.
        clinical_note:
          type: string
          description: Free-text clinical note recorded with the assessment.
      required:
      - created_at
      - updated_at
      - patient_id
      - assessor_name
      - assessor_role
      - setting
      - reason
      - intubated
      - sedated
      - paralysed
      - eye_response
      - eye_not_testable_reason
      - verbal_response
      - verbal_not_testable_reason
      - motor_response
      - motor_not_testable_reason
      - left_pupil_reactivity
      - right_pupil_reactivity
      - clinical_note
      description: 'Main Glasgow Coma Scale assessment record: assessment context, patient identification,
        confounders, the three component responses (eye, verbal, motor) with not-testable handling, pupillary
        findings for GCS-Pupils, and trend fields.'
    GlasgowComaScaleGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the row was soft-deleted.
        glasgow_coma_scale_id:
          type: string
          format: uuid
          description: Foreign key to the parent assessment (unique, 1:1).
        eye_score:
          type: integer
          format: int32
          description: Resolved eye-opening score (1-4), or null when the eye component is not testable.
        verbal_score:
          type: integer
          format: int32
          description: Resolved verbal-response score (1-5), or null when the verbal component is not
            testable.
        motor_score:
          type: integer
          format: int32
          description: Resolved motor-response score (1-6), or null when the motor component is not testable.
        total_score:
          type: integer
          format: int32
          description: Summed total GCS (E + V + M, 3-15); null when any component is not testable.
        breakdown:
          type: string
          maxLength: 30
          description: E/V/M breakdown string with any NT component marked (e.g. "E3 V4 M5" or "E3 V-NT
            M5").
        total_display:
          type: string
          maxLength: 10
          description: Reported total display, using the trailing "T" convention for an intubated verbal
            NT (e.g. "12" or "9T").
        severity_band:
          type: string
          enum:
          - mild
          - moderate
          - severe
          - ''
          description: 'Derived severity band: mild (13-15), moderate (9-12), or severe (3-8); empty when
            the total is undefined.'
        pupil_reactivity_score:
          type: integer
          format: int32
          description: 'Pupil Reactivity Score (PRS): count of pupils unreactive to light (0-2); null
            when both pupils were not examined.'
        gcs_p:
          type: integer
          format: int32
          description: Secondary GCS-Pupils score = total - PRS (1-15); null when total or PRS is undefined.
        graded_at:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the grade.
      required:
      - created_at
      - updated_at
      - glasgow_coma_scale_id
      - breakdown
      - total_display
      - severity_band
      - graded_at
      description: 'Computed Glasgow Coma Scale grading result: resolved component scores (null when NT),
        summed total (3-15, null when any component is NT), breakdown and total-display strings, severity
        band, Pupil Reactivity Score, and the secondary GCS-Pupils score.'
    GlasgowComaScaleGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the row was soft-deleted.
        glasgow_coma_scale_grade_id:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        flag_id:
          type: string
          maxLength: 50
          description: Stable flag identifier (e.g. F-AIRWAY-RISK-001, F-UNEQUAL-PUPILS-001).
        category:
          type: string
          enum:
          - airway-risk
          - deteriorating
          - unequal-pupils
          - untestable-component
          - falling-motor
          - other
          - ''
          description: 'Flag category: airway-risk (GCS <= 8 / coma), deteriorating, unequal-pupils, untestable-component,
            falling-motor, or other.'
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          - ''
          description: 'Priority: low, medium, high.'
        description:
          type: string
          maxLength: 500
          description: Human-readable description of what fired the flag.
        suggested_action:
          type: string
          maxLength: 500
          description: Suggested clinical action (e.g. "consider definitive airway management and senior
            escalation", "urgent CT head and neurosurgical referral").
      required:
