          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when this row was deleted.
        grade_id:
          type: string
          format: uuid
          description: Foreign key to the grade table.
        rule_id:
          type: string
          maxLength: 20
          description: Identifier of the rule that fired (e.g. RX-EM-001).
        category:
          type: string
          maxLength: 100
          description: Category of the rule (e.g. Emergency, Substitution, Completeness).
        description:
          type: string
          description: Human-readable description of the rule.
        severity_level:
          type: string
          enum:
          - routine
          - urgent
          - emergency
          - ''
          description: 'Priority level contributed by this rule: routine, urgent, emergency, or empty.'
      required:
      - created_at
      - updated_at
