components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Name.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as full text.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code, such as for validating the postal address.
        role:
          type: string
          enum:
          - anaesthetist
          - surgeon
          - preop-nurse
          - perioperative-physician
          - geriatrician
          - pharmacist
          - other
          - ''
          description: Clinician role.
        registrationBody:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - GPhC
          - other
          - ''
          description: Clinician registration body.
        registrationNumber:
          type: string
          description: Clinician registration number.
        unitedKingdomNhsNumber:
          type:
          - string
          - 'null'
          maxLength: 12
          description: United Kingdom NHS number, unique per person.
      required:
      - createdAt
      - updatedAt
      - name
      - role
      - registrationBody
      - registrationNumber
      description: Clinician
    Grade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        prescriptionRequestId:
          type: string
          format: uuid
          description: Foreign key to the prescription_request table.
        priorityLevel:
          type: string
          enum:
          - routine
          - urgent
          - emergency
          description: 'Overall priority: routine, urgent, or emergency.'
        ruleCount:
          type: integer
          format: int32
          description: Total number of classification rules that fired.
        gradedAt:
          type: string
          format: date-time
          description: Timestamp when the priority classification was computed.
      required:
      - createdAt
      - updatedAt
      - prescriptionRequestId
      - priorityLevel
      - ruleCount
      - gradedAt
      description: Computed priority classification result for the prescription request. One-to-one child
        of prescription_request.
    GradingAdditionalFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        gradeId:
          type: string
          format: uuid
          description: Foreign key to the grade table.
        flagId:
          type: string
          maxLength: 30
          description: Identifier of the flag (e.g. FLAG-NOSUB-001).
        category:
          type: string
          maxLength: 100
          description: Category of the flag (e.g. Substitution, Completeness, Emergency).
        message:
          type: string
          description: Human-readable description of the flagged issue.
        priority:
          type: string
          enum:
          - high
          - medium
          - low
          description: 'Priority level: high, medium, or low.'
      required:
      - createdAt
      - updatedAt
      - gradeId
      - flagId
      - category
      - message
      - priority
      description: Additional flags detected during prescription request grading.
    GradingFiredRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        gradeId:
          type: string
          format: uuid
          description: Foreign key to the grade table.
        ruleId:
          type: string
          maxLength: 20
          description: Identifier of the rule that fired (e.g. RX-EM-001).
        category:
          type: string
          maxLength: 100
          description: Category of the rule (e.g. Emergency, Substitution, Completeness).
        description:
          type: string
          description: Human-readable description of the rule.
        severityLevel:
          type: string
          enum:
          - routine
          - urgent
          - emergency
          - ''
          description: 'Priority level contributed by this rule: routine, urgent, emergency, or empty.'
      required:
      - createdAt
      - updatedAt
      - gradeId
      - ruleId
      - category
      - description
      - severityLevel
      description: Individual priority classification rules that fired during grading of the prescription
        request.
    Patient:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-deleted.
        name:
          type: string
          maxLength: 255
          description: Name.
        birthDate:
          type: string
          format: date
          description: Birth date.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as full text.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code, such as for validating the postal address.
        unitedKingdomNhsNumber:
          type:
          - string
          - 'null'
          maxLength: 20
          description: United Kingdom NHS number, unique per person.
        waistAsCm:
          type:
          - number
          - 'null'
          format: double
          description: Waist circumference measurement in cm, such as for calculating waist-height ratio
            (WHR).
        heightAsCm:
          type:
          - number
          - 'null'
          format: double
          description: Height measurement in cm, such as for calculating waist-height ratio (WHR).
        weightAsKg:
          type:
          - number
          - 'null'
          format: double
          description: Weight as kg.
        bodyMassIndex:
          type:
          - number
          - 'null'
          format: double
          description: Body mass index (BMI) measurement.
        waistHeightRatio:
          type:
          - number
          - 'null'
          format: double
          description: Waist-height ratio (WHR) measurement.
        vo2Max:
          type:
          - number
          - 'null'
          format: double
          description: VO2 max measurement.
      required:
      - createdAt
      - updatedAt
      - name
      - birthDate
      description: Patient
    PrescriptionDetails:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        prescriptionRequestId:
          type: string
          format: uuid
          description: Foreign key to the prescription_request table.
        requestDate:
          type: string
          format: date
          description: Date the prescription is requested for.
        medicationName:
          type: string
          maxLength: 500
          description: Name of the medication being prescribed.
        dosage:
          type: string
          maxLength: 255
          description: Dosage amount and unit (e.g. 500mg, 10ml).
        frequency:
          type: string
          maxLength: 255
          description: How often the medication should be taken (e.g. BD, TDS, OD).
        routeOfAdministration:
          type: string
          enum:
          - oral
          - topical
          - intravenous
          - intramuscular
          - subcutaneous
          - inhaled
          - rectal
          - sublingual
          - transdermal
          - other
          - ''
          description: 'Route: oral, topical, intravenous, intramuscular, subcutaneous, inhaled, rectal,
            sublingual, transdermal, other, or empty.'
        treatmentInstructions:
          type: string
          description: Free-text treatment instructions for the patient.
      required:
      - createdAt
      - updatedAt
      - prescriptionRequestId
      - requestDate
      - medicationName
      - dosage
      - frequency
      - routeOfAdministration
      - treatmentInstructions
      description: Medication, dosage, and treatment details for a prescription request. One-to-one child
        of prescription_request.
    PrescriptionRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the patient requesting the prescription.
        clinicianId:
          type: string
          format: uuid
          description: Foreign key to the prescribing clinician.
        status:
          type: string
          enum:
          - draft
          - submitted
          - reviewed
          - approved
          - rejected
          description: 'Lifecycle status: draft, submitted, reviewed, approved, or rejected.'
      required:
      - createdAt
      - updatedAt
      - patientId
      - clinicianId
      - status
      description: Top-level prescription request linking patient and clinician. Parent entity for all
        prescription sections.
    PrescriptionRequestType:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        prescriptionRequestId:
          type: string
          format: uuid
          description: Foreign key to the prescription_request table.
        isNewPrescription:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether this is a new prescription (yes) or a refill (no).
        isEmergency:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Whether this is an emergency prescription request: yes, no, or empty.'
        additionalNotes:
          type: string
          description: Additional notes about the request.
      required:
      - createdAt
      - updatedAt
      - prescriptionRequestId
      - isNewPrescription
      - isEmergency
      - additionalNotes
      description: Request type flags for a prescription request. One-to-one child of prescription_request.
    PrescriptionSubstitutionOptions:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        prescriptionRequestId:
          type: string
          format: uuid
          description: Foreign key to the prescription_request table.
        allowBrandSubstitution:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Whether a different brand name is acceptable: yes, no, or empty.'
        allowGenericSubstitution:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Whether a generic equivalent is acceptable: yes, no, or empty.'
        allowDosageAdjustment:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Whether a different dosage is acceptable: yes, no, or empty.'
        substitutionNotes:
          type: string
          description: Additional notes about substitution preferences.
      required:
      - createdAt
      - updatedAt
      - prescriptionRequestId
      - allowBrandSubstitution
      - allowGenericSubstitution
      - allowDosageAdjustment
      - substitutionNotes
      description: Substitution preferences for a prescription request. One-to-one child of prescription_request.
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          description: A URI identifying the problem type
        title:
          type: string
          description: A short summary of the problem type
        status:
          type: integer
          description: The HTTP status code
        detail:
          type: string
          description: An explanation of this occurrence
        instance:
          type: string
          description: A URI identifying this occurrence
        code:
          type: string
          description: A short machine-readable reason
        errors:
          type: object
          description: Per-field detail, when validation failed
      required:
      - type
      - title
      - status
