          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Soft-delete timestamp; NULL when the row is live.
        name:
          type: string
          description: Name.
        email:
          type: string
          description: Email address.
        phone:
          type: string
          description: Phone number.
        postal_address_as_full_text:
          type: string
          description: Postal address as full text.
        country_as_iso_3166_1_alpha_2:
          type: string
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type: string
          description: Postal code, such as for validating the postal address.
        role:
          type: string
          enum:
          - anaesthetist
          - surgeon
          - preop-nurse
          - perioperative-physician
          - geriatrician
          - pharmacist
          - other
          - ''
          description: Clinician role.
        registration_body:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - GPhC
          - other
          - ''
          description: Clinician registration body.
        registration_number:
          type: string
          description: Clinician registration number.
        united_kingdom_nhs_number:
          type: string
          maxLength: 12
          description: United Kingdom NHS number, unique per person.
      required:
      - created_at
      - updated_at
      - name
      - role
      - registration_body
      - registration_number
      description: Clinician
    Grade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when this row was deleted.
        prescription_request_id:
          type: string
          format: uuid
          description: Foreign key to the prescription_request table.
        priority_level:
          type: string
          enum:
          - routine
          - urgent
          - emergency
          description: 'Overall priority: routine, urgent, or emergency.'
        rule_count:
          type: integer
          format: int32
          description: Total number of classification rules that fired.
        graded_at:
          type: string
          format: date-time
          description: Timestamp when the priority classification was computed.
      required:
      - created_at
      - updated_at
      - prescription_request_id
      - priority_level
      - rule_count
      - graded_at
      description: Computed priority classification result for the prescription request. One-to-one child
        of prescription_request.
    GradingAdditionalFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when this row was deleted.
        grade_id:
          type: string
          format: uuid
          description: Foreign key to the grade table.
        flag_id:
          type: string
          maxLength: 30
          description: Identifier of the flag (e.g. FLAG-NOSUB-001).
        category:
          type: string
          maxLength: 100
          description: Category of the flag (e.g. Substitution, Completeness, Emergency).
        message:
          type: string
          description: Human-readable description of the flagged issue.
        priority:
          type: string
          enum:
          - high
          - medium
          - low
          description: 'Priority level: high, medium, or low.'
      required:
      - created_at
      - updated_at
      - grade_id
      - flag_id
      - category
      - message
      - priority
      description: Additional flags detected during prescription request grading.
