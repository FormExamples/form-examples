components:
  schemas:
    Assessment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        patientId:
          type: string
          format: uuid
          description: FK to patient. One patient may have many assessments.
        status:
          type: string
          enum:
          - in_progress
          - completed
          - reviewed
          description: 'Workflow status: in_progress (filling in), completed (submitted), reviewed (clinician
            signed off).'
      required:
      - createdAt
      - updatedAt
      - patientId
      - status
      description: A single diabetes assessment visit. Child tables hold section-specific clinical data.
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Name.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as full text.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code, such as for validating the postal address.
        role:
          type: string
          enum:
          - anaesthetist
          - surgeon
          - preop-nurse
          - perioperative-physician
          - geriatrician
          - pharmacist
          - other
          - ''
          description: Clinician role.
        registrationBody:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - GPhC
          - other
          - ''
          description: Clinician registration body.
        registrationNumber:
          type: string
          description: Clinician registration number.
        unitedKingdomNhsNumber:
          type:
          - string
          - 'null'
          maxLength: 12
          description: United Kingdom NHS number, unique per person.
      required:
      - createdAt
      - updatedAt
      - name
      - role
      - registrationBody
      - registrationNumber
      description: Clinician
    DiabetesRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        code:
          type: string
          description: Human-readable rule code (e.g. DM-001). UNIQUE stable identifier used by application
            code and audit records.
        category:
          type: string
          description: Clinical category the rule evaluates (e.g. Glycaemic Control, Foot, Renal).
        description:
          type: string
          description: Human-readable description of what the rule detects.
        concernLevel:
          type: string
          enum:
          - high
          - medium
          - low
          description: 'Clinical concern level when rule fires: high, medium, or low.'
      required:
      - createdAt
      - updatedAt
      - code
      - category
      - description
      - concernLevel
      description: Reference catalogue of all 22 diabetes assessment rules (DM-001 to DM-022). Seeded
        at deployment.
    Grade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        assessmentId:
          type: string
          format: uuid
          description: FK to assessment (UNIQUE = 1:1 relationship).
        controlLevel:
          type: string
          enum:
          - wellControlled
          - suboptimal
          - poor
          - veryPoor
          - draft
          description: 'Computed control level: wellControlled, suboptimal, poor, veryPoor, or draft.'
        controlScore:
          type: integer
          format: int32
          description: Composite control score (0-100). Based on HbA1c, adherence, diet, time in range,
            complications.
        gradedAt:
          type: string
          format: date-time
          description: Timestamp when the grading engine produced this result.
      required:
      - createdAt
      - updatedAt
      - assessmentId
      - controlLevel
      - controlScore
      - gradedAt
      description: 1:1 with assessment. Stores computed diabetes control level and composite score.
    GradingAdditionalFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        gradeId:
          type: string
          format: uuid
          description: FK to grade. One result may have many flags.
        flagId:
          type: string
          description: Application-side flag identifier (e.g. FLAG-HBA1C-001, FLAG-FOOT-001).
        category:
          type: string
          description: Flag category (e.g. Glycaemic Control, Foot, Renal, Cardiovascular).
        message:
          type: string
          description: Human-readable alert message for the clinician.
        priority:
          type: string
          enum:
          - high
          - medium
          - low
          description: 'Alert priority: high, medium, or low.'
      required:
      - createdAt
      - updatedAt
      - gradeId
      - flagId
      - category
      - message
      - priority
      description: Many-to-one with grade. Safety-critical alerts detected by the flagged issues engine.
    GradingFiredRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        gradeId:
          type: string
          format: uuid
          description: FK to grade. One result may have many fired rules.
        ruleCode:
          type:
          - string
          - 'null'
          description: FK to diabetes_rule catalogue. SET NULL on delete so audit rows survive rule removal.
        ruleCategory:
          type: string
          description: Clinical category at grading time (denormalized from diabetes_rule).
        ruleDescription:
          type: string
          description: Rule description at grading time (denormalized from diabetes_rule).
        ruleConcernLevel:
          type: string
          enum:
          - high
          - medium
          - low
          description: 'Concern level at grading time: high, medium, or low (denormalized from diabetes_rule).'
      required:
      - createdAt
      - updatedAt
      - gradeId
      - ruleCategory
      - ruleDescription
      - ruleConcernLevel
      description: Many-to-one with grade. Each row is one diabetes rule that fired. Denormalized for
        audit.
