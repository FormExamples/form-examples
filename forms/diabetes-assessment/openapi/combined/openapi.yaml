      description: Clinician
    DiabetesRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when this row was deleted.
        code:
          type: string
          description: Human-readable rule code (e.g. DM-001). UNIQUE stable identifier used by application
            code and audit records.
        category:
          type: string
          description: Clinical category the rule evaluates (e.g. Glycaemic Control, Foot, Renal).
        description:
          type: string
          description: Human-readable description of what the rule detects.
        concern_level:
          type: string
          enum:
          - high
          - medium
          - low
          description: 'Clinical concern level when rule fires: high, medium, or low.'
      required:
      - created_at
      - updated_at
      - code
      - category
      - description
      - concern_level
      description: Reference catalogue of all 20 diabetes assessment rules (DM-001 to DM-020). Seeded
        at deployment.
    Grade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when this row was deleted.
        assessment_id:
          type: string
          format: uuid
          description: FK to assessment (UNIQUE = 1:1 relationship).
        control_level:
          type: string
          enum:
          - wellControlled
          - suboptimal
          - poor
          - veryPoor
          - draft
          description: 'Computed control level: wellControlled, suboptimal, poor, veryPoor, or draft.'
        control_score:
          type: integer
          format: int32
          description: Composite control score (0-100). Based on HbA1c, adherence, diet, time in range,
            complications.
        graded_at:
          type: string
          format: date-time
          description: Timestamp when the grading engine produced this result.
      required:
      - created_at
      - updated_at
      - assessment_id
      - control_level
      - control_score
      - graded_at
      description: 1:1 with assessment. Stores computed diabetes control level and composite score.
    GradingAdditionalFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
