      required:
      - created_at
      - updated_at
      - grade_id
      - flag_id
      - category
      - message
      - priority
      description: Many-to-one with grade. Safety-critical alerts detected by the flagged issues engine.
    GradingFiredRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when this row was deleted.
        grade_id:
          type: string
          format: uuid
          description: FK to grade. One result may have many fired rules.
        rule_code:
          type: string
          description: FK to diabetes_rule catalogue. SET NULL on delete so audit rows survive rule removal.
        rule_category:
          type: string
          description: Clinical category at grading time (denormalized from diabetes_rule).
        rule_description:
          type: string
          description: Rule description at grading time (denormalized from diabetes_rule).
        rule_concern_level:
          type: string
          enum:
          - high
          - medium
          - low
          description: 'Concern level at grading time: high, medium, or low (denormalized from diabetes_rule).'
      required:
      - created_at
      - updated_at
      - grade_id
      - rule_category
      - rule_description
      - rule_concern_level
      description: Many-to-one with grade. Each row is one diabetes rule that fired. Denormalized for
