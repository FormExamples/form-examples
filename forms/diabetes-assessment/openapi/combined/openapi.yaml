          type: string
          format: date-time
          description: Timestamp when this row was deleted.
        grade_id:
          type: string
          format: uuid
          description: FK to grade. One result may have many flags.
        flag_id:
          type: string
          description: Application-side flag identifier (e.g. FLAG-HBA1C-001, FLAG-FOOT-001).
        category:
          type: string
          description: Flag category (e.g. Glycaemic Control, Foot, Renal, Cardiovascular).
        message:
          type: string
          description: Human-readable alert message for the clinician.
        priority:
          type: string
          enum:
          - high
          - medium
          - low
