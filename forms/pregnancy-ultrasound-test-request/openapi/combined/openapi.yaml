        clinicalQuestion:
          type: string
          maxLength: 1000
          description: Specific clinical question the scan should answer (highest-value field).
        relevantHistory:
          type: string
          maxLength: 1000
          description: Relevant medical, surgical, and obstetric history.
        previousScanFinding:
          type: string
          maxLength: 1000
          description: Finding from a previous scan being followed up.
        previousScanDate:
          type:
          - string
          - 'null'
