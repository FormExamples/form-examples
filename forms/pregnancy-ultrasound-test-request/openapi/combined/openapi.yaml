          description: Whether the patient has hypertension.
        diabetes:
          type: boolean
          description: Whether the patient has diabetes.
        previousGrowthRestriction:
          type: boolean
          description: Whether the patient had a previous SGA / growth-restricted pregnancy.
        previousPretermBirth:
          type: boolean
