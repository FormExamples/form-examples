    PregnancyUltrasoundTestRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the patient.
        clinicianId:
          type: string
          format: uuid
          description: Foreign key to the requesting clinician (referrer).
        status:
          type: string
          enum:
          - draft
          - submitted
          - vetted
          - scheduled
          - rejected
          - ''
          description: 'Request lifecycle status: draft, submitted, vetted, scheduled, rejected.'
        siteName:
          type: string
          maxLength: 255
          description: Name of the requesting site or clinic.
        setting:
          type: string
          enum:
          - outpatient
          - inpatient
          - community
          - emergency
          - ''
          description: 'Care setting: outpatient, inpatient, community, emergency.'
        referralDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the referral was made.
        requestedByDate:
          type:
          - string
          - 'null'
          format: date
          description: Date by which the scan is requested to be performed.
        lastMenstrualPeriodDate:
          type:
          - string
          - 'null'
          format: date
          description: First day of the last menstrual period (LMP).
        lastMenstrualPeriodReliability:
          type: string
          enum:
          - reliable
          - uncertain
          - unknown
          - ''
          description: 'Reliability of the LMP: reliable, uncertain, unknown.'
        estimatedDueDate:
          type:
          - string
          - 'null'
          format: date
          description: Estimated due date (EDD).
        estimatedDueDateMethod:
          type: string
          enum:
          - lmp
          - ultrasound
          - ivf
          - unknown
          - ''
          description: 'How the EDD was derived: lmp, ultrasound, ivf, unknown.'
        gestationalAgeWeeks:
          type:
          - integer
          - 'null'
          format: int32
          description: Completed gestational weeks at the time of request (0-45).
        gestationalAgeDays:
          type:
          - integer
          - 'null'
          format: int32
          description: Additional gestational days beyond completed weeks (0-6).
        gravida:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Gravida: total number of pregnancies.'
        para:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Para: number of births beyond 24 weeks.'
        plurality:
          type: string
          enum:
          - singleton
          - twin
          - triplet
          - higher-order
          - unknown
          - ''
          description: 'Plurality: singleton, twin, triplet, higher-order, unknown.'
        chorionicity:
          type: string
          enum:
          - dichorionic-diamniotic
          - monochorionic-diamniotic
          - monochorionic-monoamniotic
          - not-applicable
          - unknown
          - ''
          description: Chorionicity for multiple pregnancy, if known.
        conceptionMethod:
          type: string
          enum:
          - spontaneous
          - ivf
          - iui
          - ovulation-induction
          - unknown
          - ''
          description: 'Conception method: spontaneous, ivf, iui, ovulation-induction, unknown.'
        rhesusStatus:
          type: string
          enum:
          - positive
          - negative
          - unknown
          - ''
          description: 'Maternal rhesus status: positive, negative, unknown.'
        bodyMassIndex:
          type:
          - number
          - 'null'
          format: double
          description: Maternal body mass index (BMI), affecting image quality and technique.
        requestedScanType:
          type: string
          enum:
          - viability
          - dating
          - nuchal-translucency
          - anomaly
          - growth
          - doppler
          - presentation
          - cervical-length
          - placental-location
          - liquor-volume
          - reassurance
          - other
          - ''
          description: Requested scan type, used for gestational-age-window appropriateness.
        primaryIndication:
          type: string
          enum:
          - dating
          - viability
          - exclude-ectopic
          - bleeding
          - pain
          - aneuploidy-screening
          - anomaly-screening
          - suspected-anomaly
          - growth-restriction
          - large-for-dates
          - reduced-fetal-movements
          - multiple-pregnancy
          - placental-location
          - liquor-assessment
          - presentation
          - cervical-assessment
          - antepartum-haemorrhage
          - maternal-condition
          - doppler-surveillance
          - follow-up
          - other
          - ''
