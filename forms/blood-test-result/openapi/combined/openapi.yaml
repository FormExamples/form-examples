components:
  schemas:
    BloodTestResult:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        patient_id:
          type: string
          format: uuid
          description: Foreign key to the patient.
        clinician_id:
          type: string
          format: uuid
          description: Foreign key to the reporting clinician (pathologist / reporting biomedical or clinical
            scientist / authorising clinician).
        originating_request_reference:
          type: string
          maxLength: 255
          description: Free-text reference linking this report back to the originating blood-test request
            (referral / test order).
        report_status:
          type: string
          enum:
          - preliminary
          - final
          - amended
          - cancelled
          - ''
          description: 'Report lifecycle status: preliminary, final, amended, cancelled.'
        performed_date:
          type: string
          format: date
          description: Date the specimen was collected / the test was performed.
        reported_date:
          type: string
          format: date
          description: Date the report was authored / authorised.
        specimen_type:
          type: string
          enum:
          - serum
          - plasma
          - whole-blood
          - ''
          description: 'Specimen type analysed: serum, plasma, whole-blood.'
        specimen_condition:
          type: string
          enum:
          - satisfactory
          - haemolysed
          - lipaemic
          - clotted
          - insufficient
          - ''
          description: 'Specimen condition / quality: satisfactory, haemolysed, lipaemic, clotted, insufficient.'
        clinical_history:
          type: string
          maxLength: 1000
          description: Clinical history and the question the test was performed to answer.
        haemoglobin_g_l:
          type: number
          format: double
          description: Haemoglobin concentration in g/L (FBC). Adult reference approx. 130-180 (male)
            / 115-160 (female) g/L.
        white_cell_count:
          type: number
          format: double
          description: Total white cell count in x10^9/L (FBC). Adult reference approx. 4.0-11.0.
        platelets:
          type: number
          format: double
          description: Platelet count in x10^9/L (FBC). Adult reference approx. 150-400.
        neutrophils:
          type: number
          format: double
          description: Absolute neutrophil count in x10^9/L (FBC). Adult reference approx. 2.0-7.5.
        sodium_mmol_l:
          type: number
          format: double
          description: Serum / plasma sodium in mmol/L (U&E). Adult reference approx. 133-146.
        potassium_mmol_l:
          type: number
          format: double
          description: Serum / plasma potassium in mmol/L (U&E). Adult reference approx. 3.5-5.3.
        urea_mmol_l:
          type: number
          format: double
          description: Serum / plasma urea in mmol/L (U&E). Adult reference approx. 2.5-7.8.
        creatinine_umol_l:
          type: number
          format: double
          description: Serum / plasma creatinine in umol/L (renal). Adult reference approx. 60-110.
        egfr:
          type: number
          format: double
          description: Estimated glomerular filtration rate in mL/min/1.73m^2 (renal). >=90 normal; <60
            indicates reduced function.
        alt_u_l:
          type: number
          format: double
          description: Alanine aminotransferase in U/L (LFT). Adult reference approx. <=40-50.
        alkaline_phosphatase:
          type: number
          format: double
          description: Alkaline phosphatase in U/L (LFT). Adult reference approx. 30-130.
        bilirubin_umol_l:
          type: number
          format: double
          description: Total bilirubin in umol/L (LFT). Adult reference approx. <=21.
        albumin_g_l:
          type: number
          format: double
          description: Serum albumin in g/L (LFT). Adult reference approx. 35-50.
        c_reactive_protein:
          type: number
          format: double
          description: C-reactive protein in mg/L (inflammation). Adult reference approx. <5.
        hba1c_mmol_mol:
          type: number
          format: double
          description: Glycated haemoglobin (HbA1c) in mmol/mol (IFCC). <42 normal; 42-47 prediabetes;
            >=48 diabetes range.
        glucose_mmol_l:
          type: number
          format: double
          description: Plasma glucose in mmol/L. Fasting reference approx. 3.9-5.5.
        tsh:
          type: number
          format: double
          description: Thyroid-stimulating hormone in mU/L (endocrine). Adult reference approx. 0.3-4.2.
        ferritin:
          type: number
          format: double
          description: Serum ferritin in ug/L (haematinics). Adult reference approx. 15-300 (varies by
            sex).
        inr:
          type: number
          format: double
          description: International normalised ratio (coagulation). Reference approx. 0.8-1.2 when not
            anticoagulated.
        overall_result_status:
          type: string
          enum:
          - normal
          - abnormal
          - critical
          - ''
          description: 'Overall result status summarised by the reporter: normal, abnormal, critical.'
        abnormal_results_present:
          type: boolean
          description: Whether one or more analyte results fall outside their reference range.
        critical_value_present:
          type: boolean
          description: Whether one or more analyte results breach a critical (panic) value requiring urgent
            communication.
        critical_value_detail:
          type: string
          maxLength: 1000
          description: Free-text detail of which critical (panic) value(s) were breached.
        findings_narrative:
          type: string
          maxLength: 2000
          description: Narrative description of the result findings (the body of the report).
        comparison_with_previous:
          type: string
          maxLength: 1000
          description: Comparison with relevant previous results (trend / delta).
        impression:
          type: string
          maxLength: 2000
          description: Summary impression / conclusion answering the clinical question.
        reporting_category:
          type: string
          maxLength: 50
          description: Structured-reporting category label (e.g. an eGFR CKD stage or a diabetes glycaemic
            band).
        recommended_follow_up:
          type: string
          maxLength: 1000
          description: Recommended follow-up testing, referral, or management.
        critical_result_communicated:
          type: boolean
          description: Whether a critical / urgent / unexpected significant result was communicated directly
            to the requester.
        reported_to:
          type: string
          maxLength: 500
          description: Who the critical / urgent result was communicated to, with date and time if applicable.
      required:
      - created_at
      - updated_at
      - patient_id
      - clinician_id
      - originating_request_reference
      - report_status
      - specimen_type
      - specimen_condition
      - clinical_history
      - overall_result_status
      - abnormal_results_present
      - critical_value_present
      - critical_value_detail
      - findings_narrative
      - comparison_with_previous
      - impression
      - reporting_category
      - recommended_follow_up
      - critical_result_communicated
      - reported_to
      description: Blood / pathology test result (report). Captures the specimen, clinical history, the
        quantitative analyte result values (full blood count, urea & electrolytes / renal, liver function,
        inflammation, glycaemic, endocrine, haematinics, and coagulation), the overall interpretation
        summary with abnormal- and critical-value flags, the narrative and impression, recommended follow-up,
        and critical-result communication. This is the source-of-truth record that the four-axis interpretation
        grade is computed from.
    BloodTestResultGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        blood_test_result_id:
          type: string
          format: uuid
          description: Foreign key to the parent result (unique, 1:1).
        result_classification:
          type: string
          enum:
          - normal
          - abnormal
          - critical
          - inconclusive
          - ''
          description: 'Axis A overall classification: normal, abnormal, critical, inconclusive.'
        abnormality_severity:
          type: string
          enum:
          - none
          - minor
          - moderate
          - major
          - ''
          description: 'Axis B abnormality severity: none, minor, moderate, major.'
        reporting_category:
          type: string
          maxLength: 50
          description: Axis B structured-reporting score / category label (e.g. an eGFR CKD stage or glycaemic
            band).
        report_completeness_percent:
          type: integer
          format: int32
          description: Axis C report completeness as a percentage of mandatory report sections (0-100).
        follow_up_urgency:
          type: string
          enum:
          - routine
          - recommended
          - urgent
          - critical-alert
          - ''
          description: 'Axis D follow-up urgency: routine, recommended, urgent, critical-alert.'
        target_timeframe:
          type: string
          maxLength: 50
          description: Target timeframe for the recommended follow-up implied by the urgency.
        recommended_action:
          type: string
          maxLength: 500
          description: Axis D concise recommended action derived from the urgency.
        recommendation:
          type: string
          enum:
          - no-action
          - routine-follow-up
          - repeat-test
          - specialist-referral
          - urgent-review
          - ''
          description: 'Overall recommendation: no-action, routine-follow-up, repeat-test, specialist-referral,
            urgent-review.'
        clinician_notes:
          type: string
          description: Free-text interpretation / sign-off notes.
        signed_at:
          type: string
          format: date-time
          description: Timestamp of the reporting clinician electronic signature.
        graded_at:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the result.
      required:
      - created_at
      - updated_at
      - blood_test_result_id
      - result_classification
      - abnormality_severity
      - reporting_category
      - follow_up_urgency
      - target_timeframe
      - recommended_action
      - recommendation
      - clinician_notes
      - graded_at
      description: 'Computed four-axis interpretation grade: result classification, abnormality severity
        / structured-reporting category, report completeness, and follow-up urgency. A critical (panic)
        value auto-escalates the follow-up urgency to critical-alert regardless of the other axes.'
    BloodTestResultGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        blood_test_result_grade_id:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        flag_id:
          type: string
          maxLength: 50
          description: Stable flag identifier (e.g. F-CRITICAL-RESULT-001).
        category:
          type: string
          enum:
          - critical-result-alert
          - incidental-finding
          - discrepancy-with-request
          - abnormal-requiring-action
          - urgent-referral
          - inadequate-specimen
          - unexpected-finding
          - missing-impression
          - missing-result-value
          - other
          - ''
          description: Flag category.
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          - ''
          description: 'Priority: low, medium, high.'
        description:
          type: string
          maxLength: 500
          description: Human-readable description of what fired the flag.
        suggested_action:
          type: string
          maxLength: 500
          description: Suggested clinical action (e.g. "communicate critical result to requester and document").
      required:
