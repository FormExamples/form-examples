components:
  schemas:
    Buyer:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          maxLength: 255
          description: Full name of the buyer.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as a single text block.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2.
      required:
      - createdAt
      - updatedAt
      - name
      description: 'The buyer of the vehicle: contact details of the person buying.'
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          description: A URI identifying the problem type
        title:
          type: string
          description: A short summary of the problem type
        status:
          type: integer
          description: The HTTP status code
        detail:
          type: string
          description: An explanation of this occurrence
        instance:
          type: string
          description: A URI identifying this occurrence
        code:
          type: string
          description: A short machine-readable reason
        errors:
          type: object
          description: Per-field detail, when validation failed
      required:
      - type
      - title
      - status
    Seller:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          maxLength: 255
          description: Full name of the seller.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as a single text block.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2.
      required:
      - createdAt
      - updatedAt
      - name
      description: 'The seller of the vehicle: contact details of the person or trader selling.'
    UnitedKingdomVehicleBillOfSale:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        sellerId:
          type: string
          format: uuid
          description: Foreign key to the seller (restrict delete).
        buyerId:
          type:
          - string
          - 'null'
          format: uuid
          description: Foreign key to the buyer (restrict delete); optional.
        saleDate:
          type:
          - string
          - 'null'
          format: date
          description: Date of the sale and handover.
        salePlace:
          type: string
          description: Where the sale took place.
        sellerCapacity:
          type: string
          enum:
          - private
          - trader
          - ''
          description: Whether the seller sells as a private individual or as a trader.
        sellerIsRegisteredKeeper:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the seller is the registered keeper named on the V5C (yes/no).
        vehicleRegistration:
          type: string
          maxLength: 20
          description: Vehicle registration number (number plate).
        vehicleMake:
          type: string
          maxLength: 50
          description: Vehicle make.
        vehicleModel:
          type: string
          maxLength: 50
          description: Vehicle model.
        vehicleColour:
          type: string
          maxLength: 30
          description: Vehicle colour.
        vehicleVin:
          type: string
          maxLength: 30
          description: Vehicle identification number (VIN, chassis number).
        firstRegisteredYear:
          type:
          - integer
          - 'null'
          format: int32
          description: Year the vehicle was first registered.
        fuelType:
          type: string
          enum:
          - petrol
          - diesel
          - hybrid
          - electric
          - other
          - ''
          description: 'Fuel type: petrol, diesel, hybrid, electric, or other.'
        mileage:
          type:
          - integer
          - 'null'
          format: int32
          description: Odometer reading in miles at the time of sale.
        mileageAccuracy:
          type: string
          enum:
          - recorded
          - not-known
          - ''
          description: Whether the mileage is a recorded reading or not known.
        v5cPresent:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the seller has the V5C registration certificate (log book) (yes/no).
        v5cDetailsMatch:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the V5C details match the vehicle and the seller (yes/no).
        motStatus:
          type: string
          enum:
          - valid
          - expired
          - exempt
          - none
          - ''
          description: 'MOT status: valid, expired, exempt, or none.'
        motExpiryDate:
          type:
          - string
          - 'null'
          format: date
          description: MOT expiry date.
        financeStatus:
          type: string
          enum:
          - none
          - outstanding
          - unchecked
          - ''
          description: 'Outstanding finance status: none, outstanding, or unchecked.'
        financeCheckDate:
          type:
          - string
          - 'null'
          format: date
          description: Date a vehicle history or finance check was run.
        priceAsGbp:
          type:
          - number
          - 'null'
          format: double
          description: Agreed price in pounds sterling.
        depositAsGbp:
          type:
          - number
          - 'null'
          format: double
          description: Deposit paid in pounds sterling, if any.
        paymentMethod:
          type: string
          enum:
          - bank-transfer
          - cash
          - cheque
          - card
          - other
          - ''
          description: 'Payment method: bank-transfer, cash, cheque, card, or other.'
        paymentReceived:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the seller has received cleared funds (yes/no).
        saleTerms:
          type: string
          enum:
          - sold-as-seen
          - warranty-given
          - ''
          description: 'Sale terms: sold-as-seen or warranty-given.'
        knownFaults:
          type: string
          description: Faults disclosed by the seller.
        descriptionMatchesAdvert:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the vehicle matches the advert and verbal description (yes/no).
        newKeeperSlipGiven:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the seller gave the buyer the V5C/2 new keeper section (yes/no).
        dvlaNotification:
          type: string
          enum:
          - online
          - post
          - not-yet
          - ''
          description: 'How the seller told DVLA of the sale: online, post, or not-yet.'
        sellerSigned:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the seller has signed (yes/no).
        buyerSigned:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the buyer has signed (yes/no).
        signatureDate:
          type:
          - string
          - 'null'
          format: date
          description: Date of signing.
        note:
          type: string
          description: Free-text note.
      required:
      - createdAt
      - updatedAt
      - sellerId
      - salePlace
      - sellerCapacity
      - sellerIsRegisteredKeeper
      - vehicleRegistration
      - vehicleMake
      - vehicleModel
      - vehicleColour
      - vehicleVin
      - fuelType
      - mileageAccuracy
      - v5cPresent
      - v5cDetailsMatch
      - motStatus
