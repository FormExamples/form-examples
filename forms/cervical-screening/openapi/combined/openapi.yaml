          description: Stable flag identifier (e.g. F-URGENT-COLPOSCOPY-001).
        category:
          type: string
          enum:
          - urgent-colposcopy
          - symptomatic-refer-regardless
          - missing-consent
          - inadequate-sample
          - patient-overdue
          - age-outside-range
          - incomplete
          - other
          - ''
          description: 'Flag category: urgent-colposcopy, symptomatic-refer-regardless, missing-consent,
            inadequate-sample, patient-overdue, age-outside-range, incomplete, or other.'
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          - ''
          description: 'Priority: low, medium, high.'
        description:
          type: string
          maxLength: 500
          description: Human-readable description of what fired the flag.
        suggested_action:
          type: string
