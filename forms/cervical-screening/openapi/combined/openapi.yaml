components:
  schemas:
    CervicalScreening:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the patient this screening documents (restrict delete).
        clinicianId:
          type:
          - string
          - 'null'
          format: uuid
          description: Foreign key to the sample-taker clinician (restrict delete); optional.
        careSetting:
          type: string
          enum:
          - general-practice
          - sexual-health
          - other
          - ''
          description: 'Care setting where the sample was taken: general-practice, sexual-health, or other.'
        sampleTakerRole:
          type: string
          enum:
          - practice-nurse
          - gp
          - smear-taker
          - other
          - ''
          description: 'Role of the person taking the sample: practice-nurse, gp, smear-taker, or other.'
        sampleTakenAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Date and time the screening sample was taken.
        patientIdentifier:
          type: string
          maxLength: 100
          description: Local patient or encounter identifier as recorded on the record.
        age:
          type:
          - integer
          - 'null'
          format: int32
          description: Patient age in years; drives eligibility (25-64) and the recall interval.
        recallInterval:
          type: string
          enum:
          - three-yearly
          - five-yearly
          - not-applicable
          - ''
          description: 'Age-appropriate routine recall interval: three-yearly (25-49), five-yearly (50-64),
            or not-applicable.'
        screenDueDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the screen was due.
        lastScreenDate:
          type:
          - string
          - 'null'
          format: date
          description: Date of the most recent previous screening, when known.
        overdue:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the screening is overdue (yes/no); drives the patient-overdue flag.
        previouslyCeased:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the person has been formally ceased from screening (yes/no); yes classifies
            as cease-not-eligible.
        consentGiven:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether informed consent to sample and process was given (yes/no); anything other
            than yes raises the missing-consent flag.
        symptomatic:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the patient reports symptoms (abnormal bleeding, discharge, pain) (yes/no);
            yes raises the symptomatic-refer-regardless flag.
        symptomDetail:
          type: string
          description: Free-text description of reported symptoms.
        sampleAdequacy:
          type: string
          enum:
          - adequate
          - inadequate
          - ''
          description: 'Cytological sample adequacy: adequate or inadequate; an inadequate sample is never
            HPV-classified and is repeated.'
        inadequateReason:
          type: string
          enum:
          - insufficient-cells
          - obscuring-blood
          - inflammation
          - labelling
          - other
          - ''
          description: 'Reason a sample was inadequate: insufficient-cells, obscuring-blood, inflammation,
            labelling, or other.'
        hpvResult:
          type: string
          enum:
          - negative
          - positive
          - not-tested
          - ''
          description: 'Primary high-risk HPV (hrHPV) result: negative, positive, or not-tested.'
        cytologyGrade:
          type: string
          enum:
          - negative
          - borderline
          - low-grade
          - high-grade
          - not-performed
          - ''
          description: 'Reflex cytology dyskaryosis grade (recorded only when hpv_result is positive):
            negative, borderline, low-grade, high-grade, or not-performed.'
        clinicalContext:
          type: string
          description: Optional free-text clinical context shown in the summary.
      required:
      - createdAt
      - updatedAt
      - patientId
      - careSetting
      - sampleTakerRole
      - patientIdentifier
      - recallInterval
      - overdue
      - previouslyCeased
      - consentGiven
      - symptomatic
      - symptomDetail
      - sampleAdequacy
      - inadequateReason
      - hpvResult
      - cytologyGrade
      - clinicalContext
      description: 'Main cervical-screening record for one HPV-primary screening encounter: encounter
        context, patient identification, eligibility, consent, symptoms, sample adequacy, the primary
        hrHPV result, and reflex cytology. Result classification, fired rules, and flags live in child
        tables.'
    CervicalScreeningGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        cervicalScreeningId:
          type: string
          format: uuid
          description: Foreign key to the parent cervical-screening record (unique, 1:1).
        resultClass:
          type: string
          enum:
          - inadequate
          - hpv-negative
          - hpv-positive-cytology-normal
          - hpv-positive-cytology-abnormal-low
          - hpv-positive-cytology-abnormal-high
          - hpv-positive-cytology-pending
          - cease-not-eligible
          - pending
          - ''
          description: 'Result classification: inadequate, hpv-negative, hpv-positive-cytology-normal,
            hpv-positive-cytology-abnormal-low, hpv-positive-cytology-abnormal-high, hpv-positive-cytology-pending,
            cease-not-eligible, or pending.'
        managementAction:
          type: string
          enum:
          - routine-recall
          - early-repeat-12-months
          - colposcopy-referral
          - urgent-colposcopy-referral
          - repeat-sample-3-months
          - cease-screening
          - awaiting-cytology
          - awaiting-result
          - ''
          description: 'Recommended management action: routine-recall, early-repeat-12-months, colposcopy-referral,
            urgent-colposcopy-referral, repeat-sample-3-months, cease-screening, awaiting-cytology, or
            awaiting-result.'
        status:
          type: string
          enum:
          - complete
          - incomplete
          - ''
          description: 'Completeness status: complete when eligibility, consent, adequacy, and the required
            result fields for the reached branch are all present; otherwise incomplete.'
        gradedAt:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the classification.
      required:
      - createdAt
      - updatedAt
      - cervicalScreeningId
      - resultClass
      - managementAction
      - status
      - gradedAt
      description: 'Computed result classification for a cervical-screening record: result class, recommended
        management action, and completeness status.'
    CervicalScreeningGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        cervicalScreeningGradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        flagId:
          type: string
          maxLength: 50
          description: Stable flag identifier (e.g. F-URGENT-COLPOSCOPY-001).
        category:
          type: string
          enum:
          - urgent-colposcopy
          - symptomatic-refer-regardless
          - missing-consent
          - inadequate-sample
          - patient-overdue
          - age-outside-range
          - incomplete
          - other
          - ''
          description: 'Flag category: urgent-colposcopy, symptomatic-refer-regardless, missing-consent,
            inadequate-sample, patient-overdue, age-outside-range, incomplete, or other.'
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          - ''
          description: 'Priority: low, medium, high.'
        description:
          type: string
          maxLength: 500
          description: Human-readable description of what fired the flag.
        suggestedAction:
          type: string
          maxLength: 500
          description: Suggested clinical or service action (e.g. "refer urgently for colposcopy", "record
            informed consent").
      required:
      - createdAt
      - updatedAt
      - cervicalScreeningGradeId
      - flagId
      - category
      - priority
      - description
      - suggestedAction
      description: Safety flags that fire independently of the result class, with priority and a suggested
        action for the sample-taker or screening service.
    CervicalScreeningGradeRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        cervicalScreeningGradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        ruleId:
          type: string
          maxLength: 40
          description: Stable rule identifier (e.g. R-ELIGIBILITY-CEASE-01).
        stage:
          type: string
          enum:
          - eligibility
          - adequacy
          - hpv
          - cytology
          - completeness
          - ''
          description: 'Pathway stage the rule concerns: eligibility, adequacy, hpv, cytology, or completeness.'
        category:
          type: string
          maxLength: 50
          description: Subject category (e.g. gate, classification, conditional-requirement).
        description:
          type: string
          maxLength: 500
          description: Human-readable description of why the rule fired.
      required:
      - createdAt
      - updatedAt
      - cervicalScreeningGradeId
      - ruleId
      - stage
      - category
      - description
      description: 'Audit trail of every classification rule that fired during grading: pathway stage,
        category, and description.'
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Sample-taker full name.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as a single text block.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code.
        role:
          type: string
          enum:
          - practice-nurse
          - gp
          - smear-taker
          - other
          - ''
          description: 'Sample-taker role: practice-nurse, gp, smear-taker, or other.'
        registrationBody:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - GPhC
          - other
          - ''
          description: 'Professional registration body: GMC, NMC, HCPC, GPhC, or other.'
        registrationNumber:
