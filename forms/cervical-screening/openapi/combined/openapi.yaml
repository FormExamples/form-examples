components:
  schemas:
    CervicalScreening:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        patient_id:
          type: string
          format: uuid
          description: Foreign key to the patient this screening documents (restrict delete).
        clinician_id:
          type: string
          format: uuid
          description: Foreign key to the sample-taker clinician (restrict delete); optional.
        care_setting:
          type: string
          enum:
          - general-practice
          - sexual-health
          - other
          - ''
          description: 'Care setting where the sample was taken: general-practice, sexual-health, or other.'
        sample_taker_role:
          type: string
          enum:
          - practice-nurse
          - gp
          - smear-taker
          - other
          - ''
          description: 'Role of the person taking the sample: practice-nurse, gp, smear-taker, or other.'
        sample_taken_at:
          type: string
          format: date-time
          description: Date and time the screening sample was taken.
        patient_identifier:
          type: string
          maxLength: 100
          description: Local patient or encounter identifier as recorded on the record.
        age:
          type: integer
          format: int32
          description: Patient age in years; drives eligibility (25-64) and the recall interval.
        recall_interval:
          type: string
          enum:
          - three-yearly
          - five-yearly
          - not-applicable
          - ''
          description: 'Age-appropriate routine recall interval: three-yearly (25-49), five-yearly (50-64),
            or not-applicable.'
        screen_due_date:
          type: string
          format: date
          description: Date the screen was due.
        last_screen_date:
          type: string
          format: date
          description: Date of the most recent previous screening, when known.
        overdue:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the screening is overdue (yes/no); drives the patient-overdue flag.
        previously_ceased:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the person has been formally ceased from screening (yes/no); yes classifies
            as cease-not-eligible.
        consent_given:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether informed consent to sample and process was given (yes/no); anything other
            than yes raises the missing-consent flag.
        symptomatic:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the patient reports symptoms (abnormal bleeding, discharge, pain) (yes/no);
            yes raises the symptomatic-refer-regardless flag.
        symptom_detail:
          type: string
          description: Free-text description of reported symptoms.
        sample_adequacy:
          type: string
          enum:
          - adequate
          - inadequate
          - ''
          description: 'Cytological sample adequacy: adequate or inadequate; an inadequate sample is never
            HPV-classified and is repeated.'
        inadequate_reason:
          type: string
          enum:
          - insufficient-cells
          - obscuring-blood
          - inflammation
          - labelling
          - other
          - ''
          description: 'Reason a sample was inadequate: insufficient-cells, obscuring-blood, inflammation,
            labelling, or other.'
        hpv_result:
          type: string
          enum:
          - negative
          - positive
          - not-tested
          - ''
          description: 'Primary high-risk HPV (hrHPV) result: negative, positive, or not-tested.'
        cytology_grade:
          type: string
          enum:
          - negative
          - borderline
          - low-grade
          - high-grade
          - not-performed
          - ''
          description: 'Reflex cytology dyskaryosis grade (recorded only when hpv_result is positive):
            negative, borderline, low-grade, high-grade, or not-performed.'
        clinical_context:
          type: string
          description: Optional free-text clinical context shown in the summary.
      required:
      - created_at
      - updated_at
      - patient_id
      - care_setting
      - sample_taker_role
      - patient_identifier
      - recall_interval
      - overdue
      - previously_ceased
      - consent_given
      - symptomatic
      - symptom_detail
      - sample_adequacy
      - inadequate_reason
      - hpv_result
      - cytology_grade
      - clinical_context
      description: 'Main cervical-screening record for one HPV-primary screening encounter: encounter
        context, patient identification, eligibility, consent, symptoms, sample adequacy, the primary
        hrHPV result, and reflex cytology. Result classification, fired rules, and flags live in child
        tables.'
    CervicalScreeningGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the row was soft-deleted.
        cervical_screening_id:
          type: string
          format: uuid
          description: Foreign key to the parent cervical-screening record (unique, 1:1).
        result_class:
          type: string
          enum:
          - inadequate
          - hpv-negative
          - hpv-positive-cytology-normal
          - hpv-positive-cytology-abnormal-low
          - hpv-positive-cytology-abnormal-high
          - hpv-positive-cytology-pending
          - cease-not-eligible
          - pending
          - ''
          description: 'Result classification: inadequate, hpv-negative, hpv-positive-cytology-normal,
            hpv-positive-cytology-abnormal-low, hpv-positive-cytology-abnormal-high, hpv-positive-cytology-pending,
            cease-not-eligible, or pending.'
        management_action:
          type: string
          enum:
          - routine-recall
          - early-repeat-12-months
          - colposcopy-referral
          - urgent-colposcopy-referral
          - repeat-sample-3-months
          - cease-screening
          - awaiting-cytology
          - awaiting-result
          - ''
          description: 'Recommended management action: routine-recall, early-repeat-12-months, colposcopy-referral,
            urgent-colposcopy-referral, repeat-sample-3-months, cease-screening, awaiting-cytology, or
            awaiting-result.'
        status:
          type: string
          enum:
          - complete
          - incomplete
          - ''
          description: 'Completeness status: complete when eligibility, consent, adequacy, and the required
            result fields for the reached branch are all present; otherwise incomplete.'
        graded_at:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the classification.
      required:
      - created_at
      - updated_at
      - cervical_screening_id
      - result_class
      - management_action
      - status
      - graded_at
      description: 'Computed result classification for a cervical-screening record: result class, recommended
        management action, and completeness status.'
    CervicalScreeningGradeFlag:
      type: object
      properties:
        id:
