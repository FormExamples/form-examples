          - scheduled
          - rejected
          - ''
          description: 'Request lifecycle status: draft, submitted, vetted, scheduled, rejected.'
        site_name:
          type: string
          maxLength: 255
          description: Name of the requesting site or clinic.
        setting:
          type: string
          enum:
          - outpatient
          - inpatient
          - community
          - emergency
          - ''
          description: 'Care setting: outpatient, inpatient, community, emergency.'
        referral_date:
          type: string
          format: date
          description: Date the referral was made.
        requested_by_date:
          type: string
          format: date
          description: Date by which the echocardiogram is requested to be performed.
        echo_type:
          type: string
          enum:
          - transthoracic-tte
          - transoesophageal-toe
          - stress-echo
          - contrast-echo
          - other
          - ''
          description: 'Requested echocardiogram type: transthoracic-tte, transoesophageal-toe, stress-echo,
            contrast-echo, other.'
        primary_indication:
          type: string
          enum:
          - heart-failure
          - murmur
          - suspected-valve-disease
          - breathlessness
          - palpitations
          - chest-pain
          - hypertension
          - cardiomyopathy
          - endocarditis
          - post-mi
          - pulmonary-hypertension
          - pre-chemotherapy
          - stroke-tia-source
          - congenital
          - surveillance-known-disease
          - other
          - ''
          description: Primary clinical indication, used for appropriateness scoring.
        clinical_question:
          type: string
          maxLength: 1000
          description: Specific clinical question the echocardiogram should answer (highest-value field).
        relevant_history:
          type: string
          maxLength: 1000
          description: Relevant cardiac, medical, and surgical history.
        breathlessness:
          type: boolean
          description: Whether the patient reports breathlessness (dyspnoea).
        chest_pain:
          type: boolean
          description: Whether the patient reports chest pain.
        palpitations:
          type: boolean
          description: Whether the patient reports palpitations.
        syncope:
          type: boolean
          description: Whether the patient reports syncope (transient loss of consciousness).
        oedema:
          type: boolean
          description: Whether the patient has peripheral oedema.
        nyha_class:
          type: string
          enum:
          - i
          - ii
          - iii
          - iv
          - ''
          description: 'New York Heart Association functional class: i, ii, iii, iv.'
        ecg_findings:
          type: string
          maxLength: 1000
          description: Relevant electrocardiogram (ECG) findings.
        bnp_or_nt_probnp:
          type: number
          format: double
          description: Natriuretic peptide level (BNP or NT-proBNP), in ng/L, used for heart-failure priority.
        known_murmur:
          type: boolean
          description: Whether a cardiac murmur has been auscultated.
        previous_echo:
          type: string
          enum:
          - none
          - normal
          - abnormal
          - unknown
          - ''
          description: 'Result of any previous echocardiogram: none, normal, abnormal, unknown.'
        previous_echo_date:
          type: string
          format: date
          description: Date of the most recent previous echocardiogram.
        ejection_fraction_known:
          type: number
          format: double
          description: Known left-ventricular ejection fraction (%) from a prior study, if available.
        on_cardiotoxic_chemotherapy:
          type: boolean
          description: Whether the patient is on, or about to start, cardiotoxic chemotherapy (e.g. anthracyclines,
