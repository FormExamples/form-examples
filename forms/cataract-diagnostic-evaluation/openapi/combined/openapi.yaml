        locsIiiNcLeft:
          type:
          - number
          - 'null'
          format: double
          description: LOCS III Nuclear Colour subscore, left eye, 0.1 to 6.9, per Chylack et al. 1993.
        locsIiiCRight:
          type:
          - number
          - 'null'
          format: double
          description: LOCS III Cortical cataract subscore, right eye, 0.1 to 5.9, per Chylack et al.
