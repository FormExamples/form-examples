components:
  schemas:
    CataractDiagnosticEvaluation:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the patient table.
        clinicianId:
          type: string
          format: uuid
          description: Foreign key to the clinician table.
        status:
          type: string
          enum:
          - draft
          - submitted
          - reviewed
          - urgent
          description: 'Evaluation lifecycle status: draft, submitted, reviewed, or urgent.'
        assessmentDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the evaluation was performed.
        assessmentTime:
          type:
          - string
          - 'null'
          format: time
          description: Time the evaluation was performed.
        blurredVision:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Presenting symptom: blurred vision.'
        glareOrHalos:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Presenting symptom: glare or halos around lights.'
        nightDrivingDifficulty:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Presenting symptom: difficulty with night driving.'
        fadedColourPerception:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Presenting symptom: faded or yellowed colour perception.'
        frequentPrescriptionChanges:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Presenting symptom: frequent spectacle prescription changes.'
        symptomDurationMonths:
          type:
          - number
          - 'null'
          format: double
          description: Duration of presenting symptoms in months, such as for the rapid-progression safety
            flag.
        symptomLaterality:
          type: string
          enum:
          - right-eye
          - left-eye
          - both-eyes
          - ''
          description: Whether the presenting symptoms affect the right eye, the left eye, or both.
        presentingComplaintNotes:
          type: string
          description: Free-text notes on the presenting complaint.
        historyDiabetes:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Ocular/medical history: diabetes mellitus.'
        historyPriorEyeSurgery:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Ocular/medical history: prior eye surgery.'
        historyPriorEyeSurgeryDetail:
          type: string
          maxLength: 500
          description: Detail of prior eye surgery, such as procedure and eye.
        historyOcularTrauma:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Ocular/medical history: prior ocular trauma.'
        historyUveitis:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Ocular/medical history: uveitis.'
        historySteroidUse:
          type: string
          enum:
          - none
          - systemic
          - topical
          - both
          - ''
          description: 'Steroid use: none, systemic, topical, or both, a recognised risk factor for cataract.'
        historyFamilyCataract:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Family history of cataract.
        historySmokingStatus:
          type: string
          enum:
          - never
          - former
          - current
          - ''
          description: 'Smoking status: never, former, or current, a recognised risk factor for cataract.'
        historyHighUvExposure:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: History of high ultraviolet light exposure, a recognised risk factor for cataract.
        historyHighMyopia:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: History of high myopia, a recognised risk factor for early cataract and for retinal
            detachment.
        medicalHistoryNotes:
          type: string
          description: Free-text notes on ocular and medical history.
        unaidedVaLogmarRight:
          type:
          - number
          - 'null'
          format: double
          description: Unaided (uncorrected) visual acuity for the right eye, LogMAR.
        unaidedVaLogmarLeft:
          type:
          - number
          - 'null'
          format: double
          description: Unaided (uncorrected) visual acuity for the left eye, LogMAR.
        unaidedVaSnellenRight:
          type: string
          maxLength: 20
          description: Unaided (uncorrected) visual acuity for the right eye, Snellen-equivalent text
            (e.g. 6/12).
        unaidedVaSnellenLeft:
          type: string
          maxLength: 20
          description: Unaided (uncorrected) visual acuity for the left eye, Snellen-equivalent text (e.g.
            6/12).
        bestCorrectedVaLogmarRight:
          type:
          - number
          - 'null'
          format: double
          description: Best-corrected visual acuity for the right eye, LogMAR, used in the surgical-candidacy
            computation.
        bestCorrectedVaLogmarLeft:
          type:
          - number
          - 'null'
          format: double
          description: Best-corrected visual acuity for the left eye, LogMAR, used in the surgical-candidacy
            computation.
        bestCorrectedVaSnellenRight:
          type: string
          maxLength: 20
          description: Best-corrected visual acuity for the right eye, Snellen-equivalent text (e.g. 6/12).
        bestCorrectedVaSnellenLeft:
          type: string
          maxLength: 20
          description: Best-corrected visual acuity for the left eye, Snellen-equivalent text (e.g. 6/12).
        pinholeVaLogmarRight:
          type:
          - number
          - 'null'
          format: double
          description: Pinhole visual acuity for the right eye, LogMAR, such as for distinguishing refractive
            error from lenticular/pathological cause.
        pinholeVaLogmarLeft:
          type:
          - number
          - 'null'
          format: double
          description: Pinhole visual acuity for the left eye, LogMAR, such as for distinguishing refractive
            error from lenticular/pathological cause.
        pinholeVaSnellenRight:
          type: string
          maxLength: 20
          description: Pinhole visual acuity for the right eye, Snellen-equivalent text.
        pinholeVaSnellenLeft:
          type: string
          maxLength: 20
          description: Pinhole visual acuity for the left eye, Snellen-equivalent text.
        refractionSphereRight:
          type:
          - number
          - 'null'
          format: double
          description: Current spectacle prescription sphere power, right eye, dioptres.
        refractionSphereLeft:
          type:
          - number
          - 'null'
          format: double
          description: Current spectacle prescription sphere power, left eye, dioptres.
        refractionCylinderRight:
          type:
          - number
          - 'null'
          format: double
          description: Current spectacle prescription cylinder power, right eye, dioptres.
        refractionCylinderLeft:
          type:
          - number
          - 'null'
          format: double
          description: Current spectacle prescription cylinder power, left eye, dioptres.
        refractionAxisRight:
          type:
          - integer
          - 'null'
          format: int32
          description: Current spectacle prescription cylinder axis, right eye, degrees 0-180.
        refractionAxisLeft:
          type:
          - integer
          - 'null'
          format: int32
          description: Current spectacle prescription cylinder axis, left eye, degrees 0-180.
        refractionStability:
          type: string
          enum:
          - stable
          - changing
          - ''
          description: Whether the refraction is stable or changing, such as for the frequent-prescription-changes
            symptom.
        locsIiiNoRight:
          type:
          - number
          - 'null'
          format: double
          description: LOCS III Nuclear Opalescence subscore, right eye, 0.1 to 6.9, per Chylack et al.
            1993.
        locsIiiNoLeft:
          type:
          - number
          - 'null'
          format: double
          description: LOCS III Nuclear Opalescence subscore, left eye, 0.1 to 6.9, per Chylack et al.
            1993.
        locsIiiNcRight:
          type:
          - number
          - 'null'
          format: double
