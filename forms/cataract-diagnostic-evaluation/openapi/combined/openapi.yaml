    CataractDiagnosticEvaluationGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        cataractDiagnosticEvaluationId:
          type: string
          format: uuid
          description: Foreign key to the cataract_diagnostic_evaluation table, unique because grading
            is one-to-one with the evaluation.
        computedLocsIiiSeverityRight:
          type: string
          enum:
          - mild
          - moderate
          - severe
          - ''
          description: 'LOCS III severity band computed for the right eye from the four LOCS III subscores,
            per this form''s own severity-band simplification: mild, moderate, or severe.'
        computedLocsIiiSeverityLeft:
          type: string
          enum:
          - mild
          - moderate
          - severe
          - ''
          description: 'LOCS III severity band computed for the left eye from the four LOCS III subscores,
            per this form''s own severity-band simplification: mild, moderate, or severe.'
        computedSurgicalCandidacy:
          type: string
          enum:
          - not-indicated
          - consider
          - indicated
          - urgent-referral
          - ''
          description: 'Surgical-candidacy recommendation computed by the engine from LOCS III severity,
            best-corrected visual acuity, and glare testing: not-indicated, consider, indicated, or urgent-referral.'
        finalSurgicalCandidacy:
          type: string
          enum:
          - not-indicated
          - consider
          - indicated
          - urgent-referral
          - ''
          description: Surgical-candidacy recommendation signed off by the clinician, which may equal
            or differ from the computed value.
        overrideReason:
          type: string
          maxLength: 500
          description: Mandatory reason recorded when the clinician overrides the computed surgical-candidacy
            recommendation.
        functionalImpactScore:
          type:
          - integer
          - 'null'
          format: int32
          description: Functional/quality-of-life composite score, 0 to 12, being the sum of the three
            0-4 self-report sub-scores for reading, driving, and daily activities.
        clinicianNotes:
          type: string
          description: Free-text clinician notes on the overall evaluation.
        signedByName:
          type: string
          maxLength: 255
          description: Name of the clinician who signed off the evaluation.
        signedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Timestamp when the evaluation was signed off.
        gradedAt:
          type: string
          format: date-time
          description: Timestamp when the engine computed this grading result.
      required:
      - createdAt
      - updatedAt
      - cataractDiagnosticEvaluationId
      - computedLocsIiiSeverityRight
      - computedLocsIiiSeverityLeft
      - computedSurgicalCandidacy
      - finalSurgicalCandidacy
      - overrideReason
      - clinicianNotes
      - signedByName
      - gradedAt
      description: Computed and signed-off grading result for one cataract diagnostic evaluation. Stores
