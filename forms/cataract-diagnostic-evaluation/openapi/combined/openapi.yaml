    CataractDiagnosticEvaluationGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        cataract_diagnostic_evaluation_id:
          type: string
          format: uuid
          description: Foreign key to the cataract_diagnostic_evaluation table, unique because grading
            is one-to-one with the evaluation.
        computed_locs_iii_severity_right:
          type: string
          enum:
          - mild
          - moderate
          - severe
          - ''
          description: 'LOCS III severity band computed for the right eye from the four LOCS III subscores,
            per this form''s own severity-band simplification: mild, moderate, or severe.'
        computed_locs_iii_severity_left:
          type: string
          enum:
          - mild
          - moderate
          - severe
          - ''
          description: 'LOCS III severity band computed for the left eye from the four LOCS III subscores,
            per this form''s own severity-band simplification: mild, moderate, or severe.'
        computed_surgical_candidacy:
          type: string
          enum:
          - not-indicated
          - consider
          - indicated
          - urgent-referral
          - ''
          description: 'Surgical-candidacy recommendation computed by the engine from LOCS III severity,
            best-corrected visual acuity, and glare testing: not-indicated, consider, indicated, or urgent-referral.'
        final_surgical_candidacy:
          type: string
          enum:
          - not-indicated
          - consider
          - indicated
          - urgent-referral
          - ''
          description: Surgical-candidacy recommendation signed off by the clinician, which may equal
            or differ from the computed value.
        override_reason:
          type: string
          maxLength: 500
          description: Mandatory reason recorded when the clinician overrides the computed surgical-candidacy
            recommendation.
        functional_impact_score:
          type: integer
          format: int32
          description: Functional/quality-of-life composite score, 0 to 12, being the sum of the three
            0-4 self-report sub-scores for reading, driving, and daily activities.
        clinician_notes:
          type: string
          description: Free-text clinician notes on the overall evaluation.
        signed_by_name:
          type: string
          maxLength: 255
          description: Name of the clinician who signed off the evaluation.
        signed_at:
          type: string
          format: date-time
          description: Timestamp when the evaluation was signed off.
        graded_at:
          type: string
          format: date-time
          description: Timestamp when the engine computed this grading result.
      required:
      - created_at
      - updated_at
      - cataract_diagnostic_evaluation_id
      - computed_locs_iii_severity_right
      - computed_locs_iii_severity_left
      - computed_surgical_candidacy
      - final_surgical_candidacy
      - override_reason
      - clinician_notes
      - signed_by_name
      - graded_at
      description: Computed and signed-off grading result for one cataract diagnostic evaluation. Stores
        both the engine-computed values and the clinician-final values with an override reason.
    CataractDiagnosticEvaluationGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        cataract_diagnostic_evaluation_grade_id:
          type: string
          format: uuid
          description: Foreign key to the parent cataract_diagnostic_evaluation_grade table.
        flag_id:
          type: string
          maxLength: 50
          description: Stable flag identifier, such as F-RAISED-IOP-001.
        category:
          type: string
          enum:
          - competing-pathology-suspected
          - raised-iop
          - view-obscured-fundus-not-assessed
          - rapid-progression
          - biometry-incomplete-for-surgical-planning
          - paediatric
          - other
          - ''
          description: Flag category, such as raised-iop or competing-pathology-suspected.
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          - ''
          description: 'Priority: low, medium, or high.'
        description:
          type: string
          maxLength: 500
          description: Human-readable description of what fired the flag.
        suggested_action:
          type: string
          maxLength: 500
          description: Suggested clinical action, such as "refer to glaucoma service before cataract listing".
      required:
      - created_at
      - updated_at
      - cataract_diagnostic_evaluation_grade_id
      - flag_id
      - category
      - priority
      - description
      - suggested_action
      description: Safety-critical flags that fire independently of the surgical-candidacy recommendation,
        with a priority and a suggested action. Flags are never suppressed by a clinician override.
