          type: string
          maxLength: 1000
          description: Clinical history and the question the lumbar puncture was performed to answer.
        opening_pressure_cmh2o:
          type: number
          format: double
          description: Manometry opening pressure in cm of CSF (normal adult range approximately 6-25 cmH2O when relaxed and laterally recumbent).
        csf_appearance:
          type: string
          enum:
            - clear
            - cloudy
            - turbid
            - blood-stained
            - xanthochromic
            - ""
          description: "Macroscopic CSF appearance: clear, cloudy, turbid, blood-stained, xanthochromic."
        csf_white_cell_count:
          type: number
          format: double
          description: CSF white cell count in cells per microlitre (normal adult typically <5/uL; neutrophil predominance suggests bacterial infection).
        csf_red_cell_count:
          type: number
          format: double
          description: CSF red cell count in cells per microlitre (raised in traumatic tap or subarachnoid haemorrhage).
        csf_protein_g_l:
          type: number
          format: double
          description: CSF total protein in g/L (normal adult typically 0.15-0.45 g/L; raised in bacterial meningitis and many other conditions).
        csf_glucose_mmol_l:
          type: number
          format: double
          description: CSF glucose in mmol/L (interpret against paired serum glucose; low in bacterial meningitis).
        csf_serum_glucose_ratio:
          type: number
          format: double
          description: CSF:serum glucose ratio (normal approximately 0.6; <0.4 suggests bacterial meningitis).
        csf_lactate_mmol_l:
          type: number
          format: double
          description: CSF lactate in mmol/L (raised, typically >3.5 mmol/L, supports bacterial meningitis).
        gram_stain_result:
          type: string
          maxLength: 500
          description: Free-text Gram stain result and organisms seen.
        culture_result:
          type: string
          maxLength: 500
          description: Free-text CSF culture result and organisms grown (a positive culture is a critical result).
        pcr_result:
          type: string
          maxLength: 500
          description: Free-text molecular / PCR result (e.g. meningococcal, pneumococcal, herpes simplex, enterovirus).
        oligoclonal_bands:
          type: string
          enum:
            - positive
            - negative
            - not-tested
            - ""
          description: "CSF oligoclonal bands result: positive, negative, not-tested (supports demyelination / multiple sclerosis when CSF-specific)."
        xanthochromia:
          type: string
          enum:
            - positive
            - negative
            - not-tested
            - ""
          description: "CSF xanthochromia (bilirubin) spectrophotometry result: positive, negative, not-tested (a positive result supports subarachnoid haemorrhage when LP performed >=12 h after headache onset)."
        raised_protein:
          type: boolean
          description: Whether the CSF protein is raised.
        pleocytosis:
          type: boolean
          description: Whether a raised CSF white cell count (pleocytosis) is present.
        low_glucose:
          type: boolean
          description: Whether the CSF glucose / CSF:serum glucose ratio is low.
        bacterial_meningitis_pattern:
          type: boolean
          description: Whether the overall CSF profile fits a bacterial meningitis pattern (neutrophil pleocytosis, raised protein, low glucose, raised lactate) — a critical result.
        viral_pattern:
          type: boolean
          description: Whether the overall CSF profile fits a viral / aseptic meningitis pattern (lymphocytic pleocytosis, normal-to-mildly-raised protein, normal glucose).
        subarachnoid_haemorrhage_suggested:
          type: boolean
          description: Whether the result (xanthochromia and/or red-cell pattern) suggests subarachnoid haemorrhage — a critical result.
        normal_csf:
          type: boolean
          description: Whether the CSF analysis is within normal limits across all measured parameters.
        findings_narrative:
          type: string
          maxLength: 2000
          description: Narrative description of the CSF findings (the body of the report).
        impression:
          type: string
          maxLength: 2000
          description: Summary impression / conclusion answering the clinical question.
        reporting_category:
          type: string
          maxLength: 50
          description: Structured-reporting category / pattern label (e.g. bacterial-pattern, viral-pattern, SAH-pattern, normal, inflammatory-demyelinating).
        recommended_follow_up:
          type: string
          maxLength: 1000
          description: Recommended follow-up investigation, referral, or management.
        critical_result_communicated:
          type: boolean
          description: Whether a critical or unexpected significant result was communicated directly to the requesting / responsible clinician.
        reported_to:
          type: string
          maxLength: 500
          description: Who the critical / urgent result was communicated to, with date and time if applicable.
