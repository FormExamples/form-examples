[workspace]

[workspace.package]
rust-version = "1.97"

[package]
name = "united_kingdom_maternity_certificate_mat_b1"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
publish = false
description = "United Kingdom Maternity Certificate MAT B1 back-end JSON API"
default-run = "united_kingdom_maternity_certificate_mat_b1-cli"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace.dependencies]
axa = { version = "0.5", features = ["pagination", "problem", "queue", "sqlx"] }

[dependencies]
axa = { workspace = true }
serde-saphyr = "2"
sqlx = { version = "0.9", default-features = false, features = ["chrono", "derive", "json", "macros", "migrate", "postgres", "runtime-tokio", "tls-rustls-ring-webpki", "uuid"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
tokio = { version = "1.54", default-features = false, features = [
  "rt-multi-thread",
  "signal",
  "sync",
] }
async-trait = { version = "0.1" }
axum = { version = "0.8" }
tracing = { version = "0.1" }
chrono = { version = "0.4", features = ["serde"] }
validator = { version = "0.20", features = ["derive"] }
uuid = { version = "1.29", features = ["serde", "v4"] }

[[bin]]
name = "united_kingdom_maternity_certificate_mat_b1-cli"
path = "src/united_kingdom_maternity_certificate_mat_b1/bin/main.rs"
required-features = []

[dev-dependencies]
axa = { workspace = true, features = ["testing"] }
serial_test = { version = "3.5.0" }
insta = { version = "1.49", features = ["redactions", "yaml", "filters"] }

[lib]
path = "src/united_kingdom_maternity_certificate_mat_b1/lib.rs"
