components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Clinician full name as recorded in the rota.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as a single text block.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code.
        role:
          type: string
          enum:
          - doctor
          - nurse
          - pharmacist
          - laboratory
          - other
          - ''
          description: 'Primary clinical role: doctor, nurse, pharmacist, laboratory, or other.'
        registrationBody:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - GPhC
          - other
          - ''
          description: 'Professional registration body: GMC, NMC, HCPC, GPhC, or other.'
        registrationNumber:
          type: string
          description: Professional registration number issued by the registration body.
      required:
      - createdAt
      - updatedAt
      - name
      - role
      - registrationBody
      - registrationNumber
      description: Clinician identifying information for the staff member who requested or interpreted
        the eGFR calculation.
    EstimatedGlomerularFiltrationRateCalculator:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the patient this calculation is for (restricted delete).
        clinicianId:
          type:
          - string
          - 'null'
          format: uuid
          description: Foreign key to the clinician who recorded the calculation (optional, restricted
            delete).
        clinicianName:
          type: string
          maxLength: 255
          description: Requesting or interpreting clinician name as recorded on the form.
        clinicianRole:
          type: string
          enum:
          - doctor
          - nurse
          - pharmacist
          - laboratory
          - other
          - ''
          description: 'Clinician role: doctor, nurse, pharmacist, laboratory, or other.'
        assessedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Date and time the calculation was assessed.
        careSetting:
          type: string
          enum:
          - primary-care
          - secondary-care
          - laboratory
          - pharmacy
          - other
          - ''
          description: 'Care setting: primary-care, secondary-care, laboratory, pharmacy, or other.'
        equation:
          type: string
          enum:
          - ckd-epi-2021-creatinine
          - ckd-epi-2021-cystatin-c
          - mdrd
          - ''
          description: 'Estimating equation: ckd-epi-2021-creatinine (default), ckd-epi-2021-cystatin-c,
            or mdrd. The engine computes the CKD-EPI 2021 creatinine equation; the others are named for
            context.'
        patientIdentifier:
          type: string
          maxLength: 100
          description: Local patient identifier as recorded on the form.
        serumCreatinineUmolL:
          type:
          - number
          - 'null'
          format: double
          description: Standardised (IDMS-traceable) serum creatinine in micromoles per litre (null when
            unanswered).
        ageYears:
          type:
          - integer
          - 'null'
          format: int32
          description: Patient age in whole years (null when unanswered).
        sex:
          type: string
          enum:
          - female
          - male
          - ''
          description: 'Patient sex driving the equation parameters (kappa, alpha, female multiplier):
            female or male.'
        specimenDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the serum creatinine specimen was taken (null when unanswered).
        steadyState:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Whether renal function is at steady state: yes or no.'
      required:
      - createdAt
      - updatedAt
      - patientId
      - clinicianName
      - clinicianRole
      - careSetting
      - equation
      - patientIdentifier
      - sex
      - steadyState
      description: 'Main eGFR calculation record: context and identification, plus the serum creatinine,
        age, sex, specimen date, and steady-state inputs and the chosen estimating equation.'
    EstimatedGlomerularFiltrationRateCalculatorGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        estimatedGlomerularFiltrationRateCalculatorId:
          type: string
          format: uuid
          description: Foreign key to the parent calculation record (unique, 1:1).
        serumCreatinineMgDl:
          type:
          - number
          - 'null'
          format: double
          description: Serum creatinine converted to mg/dL (serum_creatinine_umol_l / 88.42); null when
            the input is missing.
        egfrMlMin173m2:
          type:
          - number
          - 'null'
          format: double
          description: Estimated glomerular filtration rate in mL/min/1.73 m^2 (null when any required
            input is missing).
        gStage:
          type: string
          enum:
          - G1
          - G2
          - G3a
          - G3b
          - G4
          - G5
          - ''
          description: 'CKD G-stage banded from the unrounded eGFR: G1 (>=90), G2 (60-89), G3a (45-59),
            G3b (30-44), G4 (15-29), or G5 (<15).'
        gStageLabel:
          type: string
          maxLength: 60
          description: Human-readable G-stage label (e.g. "Mildly decreased").
        gradedAt:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the result.
      required:
      - createdAt
      - updatedAt
      - estimatedGlomerularFiltrationRateCalculatorId
      - gStage
      - gStageLabel
      - gradedAt
      description: 'Computed eGFR result: the derived serum creatinine in mg/dL, the eGFR in mL/min/1.73
        m^2, and its CKD G-stage classification (1:1 with the parent calculation record).'
    EstimatedGlomerularFiltrationRateCalculatorGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        estimatedGlomerularFiltrationRateCalculatorGradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        flagId:
          type: string
          maxLength: 50
          description: Stable flag identifier (e.g. F-G5-NEPHROLOGY-REFERRAL-001).
        category:
          type: string
          enum:
          - g5-nephrology-referral
          - g4-nephrology-referral
          - drug-dosing-review
          - acute-drop-aki
          - reduced-function
          - confirm-ckd
          - incomplete
          - other
          - ''
          description: 'Flag category: g5-nephrology-referral, g4-nephrology-referral, drug-dosing-review,
            acute-drop-aki, reduced-function, confirm-ckd, incomplete, or other.'
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          - ''
          description: 'Priority: low, medium, high.'
        description:
          type: string
          maxLength: 500
          description: Human-readable description of what fired the flag.
        suggestedAction:
          type: string
          maxLength: 500
          description: Suggested clinical action (e.g. "refer to nephrology per NICE NG203").
      required:
      - createdAt
      - updatedAt
      - estimatedGlomerularFiltrationRateCalculatorGradeId
      - flagId
      - category
      - priority
      - description
      - suggestedAction
      description: Safety-critical flags that fire independently of the CKD G-stage, with priority and
        a suggested action for the assessing clinician.
    EstimatedGlomerularFiltrationRateCalculatorGradeRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        estimatedGlomerularFiltrationRateCalculatorGradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        ruleId:
          type: string
          maxLength: 40
