components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        name:
          type: string
          description: Name.
        email:
          type: string
          description: Email address.
        phone:
          type: string
          description: Phone number.
        postal_address_as_full_text:
          type: string
          description: Postal address as full text.
        country_as_iso_3166_1_alpha_2:
          type: string
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type: string
          description: Postal code, such as for validating the postal address.
        role:
          type: string
          enum:
          - consultant-histopathologist
          - biomedical-scientist
          - specialist-registrar
          - other
          - ''
          description: 'Reporting clinician role: consultant-histopathologist, biomedical-scientist, specialist-registrar,
            other.'
        registration_body:
          type: string
          enum:
          - GMC
          - HCPC
          - other
          - ''
          description: 'Clinician registration body: GMC, HCPC, other.'
        registration_number:
          type: string
          description: Clinician registration number.
        united_kingdom_nhs_number:
          type: string
          maxLength: 12
          description: United Kingdom NHS number, unique per person.
      required:
      - created_at
      - updated_at
      - name
      - role
      - registration_body
      - registration_number
      description: Reporting clinician (consultant histopathologist or biomedical scientist) who authors
        and signs the histopathology test result report.
    HistopathologyTestResult:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        patient_id:
          type: string
          format: uuid
          description: Foreign key to the patient.
        clinician_id:
          type: string
          format: uuid
          description: Foreign key to the reporting clinician (consultant histopathologist / biomedical
            scientist).
        originating_request_reference:
          type: string
          maxLength: 255
          description: Free-text reference linking this report back to the originating histopathology
            test request (referral).
        report_status:
          type: string
          enum:
          - preliminary
          - final
          - amended
          - supplementary
          - cancelled
          - ''
          description: 'Report lifecycle status: preliminary, final, amended, supplementary, cancelled.'
        performed_date:
          type: string
          format: date
          description: Date the specimen was examined / grossed.
        reported_date:
          type: string
          format: date
          description: Date the report was authored / signed.
        specimen_type:
          type: string
          maxLength: 255
          description: Type of specimen examined (e.g. biopsy, excision, resection, endoscopic biopsy).
        specimen_site:
          type: string
          maxLength: 255
          description: Anatomical site the specimen was taken from.
        specimen_adequacy:
          type: string
          enum:
          - adequate
          - suboptimal
          - inadequate
          - ''
          description: 'Adequacy of the specimen for diagnosis: adequate, suboptimal, inadequate.'
        clinical_history:
          type: string
          maxLength: 1000
          description: Clinical history and the question the examination was performed to answer.
        macroscopic_description:
          type: string
          maxLength: 2000
          description: 'Macroscopic (gross) description of the specimen: dimensions, appearance, blocks
            taken.'
        microscopic_description:
          type: string
          maxLength: 2000
          description: Microscopic (histological) description of the tissue under the microscope.
        diagnosis:
          type: string
          maxLength: 2000
          description: Histopathological diagnosis (the body of the report conclusion).
        malignancy_present:
          type: boolean
          description: Whether malignancy is present in the examined specimen.
        tumour_type:
          type: string
          maxLength: 255
          description: Tumour type / histological subtype where a neoplasm is present.
        histological_grade:
          type: string
          enum:
          - well-differentiated
          - moderately-differentiated
          - poorly-differentiated
          - undifferentiated
          - not-applicable
          - ''
          description: 'Histological differentiation grade: well-differentiated, moderately-differentiated,
            poorly-differentiated, undifferentiated, not-applicable.'
        tnm_pt:
          type: string
          maxLength: 20
          description: Pathological primary tumour (pT) category per UICC/AJCC TNM 8th edition.
        tnm_pn:
          type: string
          maxLength: 20
          description: Pathological regional lymph node (pN) category per UICC/AJCC TNM 8th edition.
        tnm_pm:
          type: string
          maxLength: 20
          description: Pathological distant metastasis (pM) category per UICC/AJCC TNM 8th edition.
        resection_margins:
          type: string
          enum:
          - clear
          - involved
          - close
          - not-applicable
          - ''
          description: 'Resection margin status: clear, involved, close, not-applicable.'
        lymphovascular_invasion:
          type: boolean
          description: Whether lymphovascular invasion is identified.
        immunohistochemistry:
          type: string
          maxLength: 1000
          description: Immunohistochemistry and other ancillary test results.
        snomed_code:
          type: string
          maxLength: 50
          description: SNOMED CT topography / morphology code(s) for the diagnosis.
        comparison_with_previous:
          type: string
          maxLength: 1000
          description: Comparison with relevant previous histology.
        impression:
          type: string
          maxLength: 2000
          description: Summary impression / conclusion answering the clinical question.
        reporting_category:
          type: string
          maxLength: 255
          description: Free-text structured grade / stage summary (e.g. an RCPath cancer-dataset core-item
            or staging summary line).
        recommended_follow_up:
          type: string
          maxLength: 1000
          description: Recommended follow-up, referral, MDT discussion, or management.
        critical_result_communicated:
          type: boolean
          description: Whether a critical or unexpected significant result was communicated directly to
            the requester.
        reported_to:
          type: string
          maxLength: 500
          description: Who the critical / urgent result was communicated to, with date and time if applicable.
      required:
      - created_at
      - updated_at
      - patient_id
      - clinician_id
      - originating_request_reference
      - report_status
      - specimen_type
      - specimen_site
      - specimen_adequacy
      - clinical_history
      - macroscopic_description
      - microscopic_description
      - diagnosis
      - malignancy_present
      - tumour_type
      - histological_grade
      - tnm_pt
      - tnm_pn
      - tnm_pm
      - resection_margins
      - lymphovascular_invasion
      - immunohistochemistry
      - snomed_code
      - comparison_with_previous
      - impression
      - reporting_category
      - recommended_follow_up
      - critical_result_communicated
      - reported_to
      description: Histopathology test result (report). Captures the examined specimen and adequacy, clinical
        history, the macroscopic and microscopic descriptions, the diagnosis, malignancy and tumour characterisation
        (type, histological grade, pathological TNM stage), resection margins and lymphovascular invasion,
        ancillary immunohistochemistry and SNOMED coding, the impression, recommended follow-up, and critical-result
        communication. This is the source-of-truth record that the four-axis interpretation grade is computed
        from.
    HistopathologyTestResultGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        histopathology_test_result_id:
          type: string
          format: uuid
          description: Foreign key to the parent result (unique, 1:1).
        result_classification:
          type: string
          enum:
          - normal
          - abnormal
          - critical
          - inconclusive
          - ''
          description: 'Axis A overall classification: normal, abnormal, critical, inconclusive.'
        abnormality_severity:
          type: string
          enum:
          - none
          - minor
          - moderate
          - major
          - ''
          description: 'Axis B abnormality severity: none, minor, moderate, major.'
        reporting_category:
          type: string
          maxLength: 50
          description: Axis B structured-reporting score / category label (e.g. an RCPath cancer-dataset
            grade/stage summary).
        report_completeness_percent:
          type: integer
          format: int32
          description: Axis C report completeness as a percentage of mandatory report sections (0-100).
        follow_up_urgency:
          type: string
          enum:
          - routine
          - recommended
          - urgent
          - critical-alert
          - ''
          description: 'Axis D follow-up urgency: routine, recommended, urgent, critical-alert.'
        target_timeframe:
          type: string
          maxLength: 50
          description: Target timeframe for the recommended follow-up implied by the urgency.
        recommended_action:
          type: string
          maxLength: 500
          description: Axis D concise recommended action derived from the urgency.
        recommendation:
          type: string
          enum:
          - no-action
          - routine-follow-up
          - further-testing
          - specialist-referral
          - urgent-review
          - ''
          description: 'Overall recommendation: no-action, routine-follow-up, further-testing, specialist-referral,
            urgent-review.'
        clinician_notes:
          type: string
          description: Free-text interpretation / sign-off notes.
        signed_at:
          type: string
          format: date-time
          description: Timestamp of the reporting clinician electronic signature.
        graded_at:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the result.
      required:
      - created_at
      - updated_at
      - histopathology_test_result_id
      - result_classification
      - abnormality_severity
      - reporting_category
      - follow_up_urgency
      - target_timeframe
      - recommended_action
      - recommendation
      - clinician_notes
      - graded_at
      description: 'Computed four-axis interpretation grade: result classification, abnormality severity
        / structured-reporting category, report completeness, and follow-up urgency. A critical result
        (e.g. an unexpected malignancy) auto-escalates the follow-up urgency to critical-alert regardless
        of the other axes.'
    HistopathologyTestResultGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        histopathology_test_result_grade_id:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        flag_id:
          type: string
          maxLength: 50
          description: Stable flag identifier (e.g. F-CRITICAL-RESULT-001).
        category:
          type: string
          enum:
          - critical-result-alert
          - incidental-finding
          - discrepancy-with-request
          - abnormal-requiring-action
          - urgent-referral
