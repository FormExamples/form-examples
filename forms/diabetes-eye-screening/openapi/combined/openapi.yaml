components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Screener / grader full name.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as a single text block.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code.
        role:
          type: string
          enum:
          - screener
          - primary-grader
          - secondary-grader
          - ophthalmologist
          - other
          - ''
          description: 'Grader role: screener, primary-grader, secondary-grader, ophthalmologist, or other.'
        registrationBody:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - GPhC
          - other
          - ''
          description: 'Professional registration body: GMC, NMC, HCPC, GPhC, or other.'
        registrationNumber:
          type: string
          description: Professional registration number issued by the registration body.
      required:
      - createdAt
      - updatedAt
      - name
      - role
      - registrationBody
      - registrationNumber
      description: Clinician identifying information for the screener / grader who assigned the retinal
        grade for the diabetes eye screening episode.
    DiabetesEyeScreening:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the patient this screening documents (restrict delete).
        clinicianId:
          type:
          - string
          - 'null'
          format: uuid
          description: Foreign key to the screener / grader clinician (restrict delete); optional.
        graderName:
          type: string
          description: Name of the screener / grader who assigned the grade.
        graderRole:
          type: string
          enum:
          - screener
          - primary-grader
          - secondary-grader
          - ophthalmologist
          - other
          - ''
          description: 'Grader role: screener, primary-grader, secondary-grader, ophthalmologist, or other.'
        gradedAt:
          type:
          - string
          - 'null'
          format: date
          description: Date the grade was assigned; drives the patient-overdue comparison.
        imageCapturedAt:
          type:
          - string
          - 'null'
          format: date
          description: Date the retinal images were captured.
        imagingMedia:
          type: string
          enum:
          - digital-fundus
          - mydriatic
          - non-mydriatic
          - oct
          - other
          - ''
          description: 'Imaging modality: digital-fundus, mydriatic, non-mydriatic, oct, or other.'
        patientIdentifier:
          type: string
          maxLength: 100
          description: Local or NHS patient identifier as recorded on the record.
        ageBand:
          type: string
          enum:
          - under-12
          - 12-17
          - 18-64
          - 65-plus
          - ''
          description: Screening-eligible age band (>= 12); under-12 is outside programme eligibility.
        diabetesType:
          type: string
          enum:
          - type-1
          - type-2
          - other
          - unknown
          - ''
          description: 'Diabetes type: type-1, type-2, other, or unknown.'
        yearsSinceDiagnosis:
          type:
          - number
          - 'null'
          format: double
          description: Years since diabetes diagnosis.
        previousScreenDate:
          type:
          - string
          - 'null'
          format: date
          description: Date of the most recent previous screen; drives overdue and low-risk eligibility.
        previousScreenResult:
          type: string
          enum:
          - r0m0
          - background
          - referable
          - none
          - unknown
          - ''
          description: 'Result of the previous screen: r0m0, background, referable, none, or unknown;
            r0m0 is required for low-risk 24-month recall.'
        rightRetinopathyGrade:
          type: string
          enum:
          - R0
          - R1
          - R2
          - R3A
          - R3S
          - ''
          description: 'Right-eye retinopathy (R) grade: R0, R1, R2, R3A, or R3S.'
        rightMaculopathyGrade:
          type: string
          enum:
          - M0
          - M1
          - ''
          description: 'Right-eye maculopathy (M) grade: M0 or M1.'
        rightPhotocoagulation:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Right-eye photocoagulation (P) marker: yes or no; contextual, does not change
            the pathway.'
        rightUngradable:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Right-eye ungradable (U) marker: yes or no; yes routes to slit-lamp unless referable
            disease routes to HES.'
        rightVisualAcuity:
          type: string
          description: Right-eye visual acuity as recorded (e.g. logMAR or Snellen); optional.
        leftRetinopathyGrade:
          type: string
          enum:
          - R0
          - R1
          - R2
          - R3A
          - R3S
          - ''
          description: 'Left-eye retinopathy (R) grade: R0, R1, R2, R3A, or R3S.'
        leftMaculopathyGrade:
          type: string
          enum:
          - M0
          - M1
          - ''
          description: 'Left-eye maculopathy (M) grade: M0 or M1.'
        leftPhotocoagulation:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Left-eye photocoagulation (P) marker: yes or no; contextual, does not change the
            pathway.'
        leftUngradable:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Left-eye ungradable (U) marker: yes or no; yes routes to slit-lamp unless referable
            disease routes to HES.'
        leftVisualAcuity:
          type: string
          description: Left-eye visual acuity as recorded (e.g. logMAR or Snellen); optional.
        clinicalContext:
          type: string
          description: Optional free-text clinical context shown in the summary.
      required:
      - createdAt
      - updatedAt
      - patientId
      - graderName
      - graderRole
      - imagingMedia
      - patientIdentifier
      - ageBand
      - diabetesType
      - previousScreenResult
      - rightRetinopathyGrade
      - rightMaculopathyGrade
      - rightPhotocoagulation
      - rightUngradable
      - rightVisualAcuity
      - leftRetinopathyGrade
      - leftMaculopathyGrade
      - leftPhotocoagulation
      - leftUngradable
      - leftVisualAcuity
      - clinicalContext
      description: 'Main diabetes-eye-screening record for one DESP retinal screening episode: grading
        context, patient identification, and the right-eye and left-eye grading blocks (R grade, M grade,
        P marker, U marker, visual acuity). The worst-eye classification and recall / referral outcome,
        fired rules, and flags live in child tables.'
    DiabetesEyeScreeningGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        diabetesEyeScreeningId:
          type: string
          format: uuid
          description: Foreign key to the parent diabetes-eye-screening record (unique, 1:1).
        worstRetinopathy:
          type: string
          enum:
          - R0
          - R1
          - R2
          - R3A
          - R3S
          - ''
          description: 'Worst retinopathy (R) grade across both eyes by severity R0 < R1 < R2 < R3S <
            R3A: R0, R1, R2, R3A, or R3S.'
        worstMaculopathy:
          type: string
          enum:
          - M0
          - M1
          - ''
          description: 'Worst maculopathy (M) grade across both eyes: M1 if either eye is M1, otherwise
            M0.'
        anyUngradable:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether either eye is ungradable (yes/no); yes routes to slit-lamp unless referable
            disease routes to HES.
        outcome:
          type: string
          enum:
          - refer-hes-urgent
          - refer-hes
          - refer-slit-lamp
          - surveillance-6-month
          - routine-12-month
          - routine-24-month
          - ''
          description: 'Recall / referral pathway (most urgent wins): refer-hes-urgent, refer-hes, refer-slit-lamp,
            surveillance-6-month, routine-12-month, or routine-24-month.'
        referral:
          type: string
          enum:
          - none
          - hes-routine
          - hes-urgent
          - slit-lamp
          - ''
          description: 'Referral destination derived from the outcome: none, hes-routine, hes-urgent,
            or slit-lamp.'
        recallIntervalMonths:
          type:
          - integer
          - 'null'
          format: int32
          description: Recall interval in months (6, 12, or 24); null for referral pathways with no routine
            recall interval.
        status:
          type: string
          enum:
          - complete
          - incomplete
          - ''
          description: 'Completeness status: complete when both eyes have an R and M grade (or are marked
            ungradable); otherwise incomplete.'
        gradedAt:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the classification.
      required:
      - createdAt
      - updatedAt
      - diabetesEyeScreeningId
      - worstRetinopathy
      - worstMaculopathy
      - anyUngradable
      - outcome
      - referral
      - status
      - gradedAt
      description: 'Computed worst-eye classification and outcome for a diabetes-eye-screening record:
        worst retinopathy and maculopathy grade, any-ungradable marker, recall / referral pathway, recall
        interval, and completeness status.'
    DiabetesEyeScreeningGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        diabetesEyeScreeningGradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        flagId:
          type: string
          maxLength: 50
          description: Stable flag identifier (e.g. F-ACTIVE-PROLIFERATIVE-001).
        category:
          type: string
          enum:
          - active-proliferative
          - maculopathy
          - stable-proliferative
          - pre-proliferative
          - ungradable
          - patient-overdue
          - incomplete
          - eligibility
          - other
          - ''
          description: 'Flag category: active-proliferative, maculopathy, stable-proliferative, pre-proliferative,
            ungradable, patient-overdue, incomplete, eligibility, or other.'
        priority:
          type: string
          enum:
