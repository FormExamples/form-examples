components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Name.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as full text.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code, such as for validating the postal address.
        role:
          type: string
          enum:
          - neurologist
          - clinical-neurophysiologist
          - other
          - ''
          description: 'Reporting clinician role: neurologist, clinical-neurophysiologist, other.'
        registrationBody:
          type: string
          enum:
          - GMC
          - HCPC
          - other
          - ''
          description: 'Clinician registration body: GMC, HCPC, other.'
        registrationNumber:
          type: string
          description: Clinician registration number.
        unitedKingdomNhsNumber:
          type:
          - string
          - 'null'
          maxLength: 12
          description: United Kingdom NHS number, unique per person.
      required:
      - createdAt
      - updatedAt
      - name
      - role
      - registrationBody
      - registrationNumber
      description: Reporting clinician (neurologist or clinical neurophysiologist) who performs, interprets,
        and signs the nerve conduction study / EMG result report.
    NerveConductionStudyTestResult:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the patient.
        clinicianId:
          type: string
          format: uuid
          description: Foreign key to the reporting clinician (neurologist / clinical neurophysiologist).
        originatingRequestReference:
          type: string
          maxLength: 255
          description: Free-text reference linking this report back to the originating nerve conduction
            study / EMG request (referral).
        reportStatus:
          type: string
          enum:
          - preliminary
          - final
          - amended
          - cancelled
          - ''
          description: 'Report lifecycle status: preliminary, final, amended, cancelled.'
        performedDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the electrodiagnostic study was performed.
        reportedDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the report was authored / signed.
        studyType:
          type: string
          enum:
          - nerve-conduction
          - emg
          - nerve-conduction-and-emg
          - repetitive-stimulation
          - other
          - ''
          description: 'Performed study type: nerve-conduction, emg, nerve-conduction-and-emg, repetitive-stimulation,
            other.'
        region:
          type: string
          enum:
          - upper-limb
          - lower-limb
          - all-limbs
          - cranial
          - generalised
          - other
          - ''
          description: 'Anatomical region studied: upper-limb, lower-limb, all-limbs, cranial, generalised,
            other.'
        laterality:
          type: string
          enum:
          - left
          - right
          - bilateral
          - not-applicable
          - ''
          description: 'Laterality studied: left, right, bilateral, not-applicable.'
        studyAdequacy:
          type: string
          enum:
          - adequate
          - limited
          - non-diagnostic
          - ''
          description: 'Diagnostic adequacy of the study: adequate, limited, non-diagnostic.'
        clinicalHistory:
          type: string
          maxLength: 1000
          description: Clinical history and the question the study was performed to answer.
        comparisonWithPrevious:
          type: string
          maxLength: 1000
          description: Comparison with relevant previous electrodiagnostic studies.
        nerveConductionFindings:
          type: string
          maxLength: 2000
          description: Narrative description of the nerve-conduction findings (latencies, amplitudes,
            conduction velocities, conduction block).
        emgFindings:
          type: string
          maxLength: 2000
          description: Narrative description of the needle-EMG findings (insertional / spontaneous activity,
            motor-unit morphology, recruitment).
        carpalTunnelSyndrome:
          type: boolean
          description: Whether the study supports carpal tunnel syndrome (median neuropathy at the wrist).
        peripheralNeuropathy:
          type: boolean
          description: Whether the study supports a peripheral neuropathy (e.g. distal symmetric polyneuropathy).
        radiculopathy:
          type: boolean
          description: Whether the study supports a radiculopathy (nerve-root lesion).
        motorNeuroneDiseaseFeatures:
          type: boolean
          description: Whether the study shows features of motor neurone disease / anterior horn cell
            disease (e.g. widespread active and chronic denervation).
        myopathy:
          type: boolean
          description: Whether the study supports a myopathy (primary muscle disorder).
        neuromuscularJunctionDisorder:
          type: boolean
          description: Whether the study supports a neuromuscular-junction disorder (e.g. decrement on
            repetitive stimulation).
        normalStudy:
          type: boolean
          description: Whether the study is electrodiagnostically normal.
        severity:
          type: string
          enum:
          - mild
          - moderate
          - severe
          - not-applicable
          - ''
          description: 'Overall severity of the electrodiagnostic abnormality: mild, moderate, severe,
            not-applicable.'
        pattern:
          type: string
          enum:
          - demyelinating
          - axonal
          - mixed
          - not-applicable
          - ''
          description: 'Predominant pathophysiological pattern: demyelinating, axonal, mixed, not-applicable.'
        impression:
          type: string
          maxLength: 2000
          description: Summary impression / conclusion answering the clinical question.
        reportingCategory:
          type: string
          maxLength: 100
          description: Free-text structured-reporting label / diagnostic category for the study (e.g.
            an AANEM CTS severity grade).
        recommendedFollowUp:
          type: string
          maxLength: 1000
          description: Recommended follow-up study, referral, or management.
        criticalResultCommunicated:
          type: boolean
          description: Whether a critical or unexpected significant result was communicated directly to
            the referrer.
        reportedTo:
          type: string
          maxLength: 500
          description: Who the critical / urgent result was communicated to, with date and time if applicable.
      required:
      - createdAt
      - updatedAt
      - patientId
      - clinicianId
      - originatingRequestReference
      - reportStatus
      - studyType
      - region
      - laterality
      - studyAdequacy
      - clinicalHistory
      - comparisonWithPrevious
      - nerveConductionFindings
      - emgFindings
      - carpalTunnelSyndrome
      - peripheralNeuropathy
      - radiculopathy
      - motorNeuroneDiseaseFeatures
      - myopathy
      - neuromuscularJunctionDisorder
      - normalStudy
      - severity
      - pattern
      - impression
      - reportingCategory
      - recommendedFollowUp
      - criticalResultCommunicated
      - reportedTo
      description: Nerve conduction study / EMG (electrodiagnostic) result (report). Captures the performed
        study type and region, clinical history, the nerve-conduction and needle-EMG findings, structured
        electrodiagnostic conclusions, severity and pattern characterisation, the impression, recommended
        follow-up, and critical-result communication. This is the source-of-truth record that the four-axis
        interpretation grade is computed from.
    NerveConductionStudyTestResultGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        nerveConductionStudyTestResultId:
          type: string
          format: uuid
          description: Foreign key to the parent result (unique, 1:1).
        resultClassification:
          type: string
          enum:
          - normal
          - abnormal
          - critical
          - inconclusive
          - ''
          description: 'Axis A overall classification: normal, abnormal, critical, inconclusive.'
        abnormalitySeverity:
          type: string
          enum:
          - none
          - minor
          - moderate
          - major
          - ''
          description: 'Axis B abnormality severity: none, minor, moderate, major.'
        reportingCategory:
          type: string
          maxLength: 50
          description: Axis B structured-reporting score / category label (e.g. an AANEM CTS severity
            grade or polyneuropathy descriptor).
        reportCompletenessPercent:
          type:
          - integer
          - 'null'
          format: int32
          description: Axis C report completeness as a percentage of mandatory report sections (0-100).
        followUpUrgency:
          type: string
          enum:
          - routine
          - recommended
          - urgent
          - critical-alert
          - ''
          description: 'Axis D follow-up urgency: routine, recommended, urgent, critical-alert.'
        targetTimeframe:
          type: string
          maxLength: 50
          description: Target timeframe for the recommended follow-up implied by the urgency.
        recommendedAction:
          type: string
          maxLength: 500
          description: Axis D concise recommended action derived from the urgency.
        recommendation:
          type: string
          enum:
          - no-action
          - routine-follow-up
          - further-imaging
          - specialist-referral
          - urgent-review
          - ''
          description: 'Overall recommendation: no-action, routine-follow-up, further-imaging, specialist-referral,
            urgent-review.'
        clinicianNotes:
          type: string
          description: Free-text interpretation / sign-off notes.
        signedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Timestamp of the reporting clinician electronic signature.
        gradedAt:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the result.
      required:
      - createdAt
      - updatedAt
      - nerveConductionStudyTestResultId
      - resultClassification
      - abnormalitySeverity
      - reportingCategory
      - followUpUrgency
      - targetTimeframe
      - recommendedAction
      - recommendation
      - clinicianNotes
      - gradedAt
      description: 'Computed four-axis interpretation grade: result classification, abnormality severity
        / structured-reporting category, report completeness, and follow-up urgency. A critical result
        (e.g. motor neurone disease features, or a severe acute neuropathy such as a Guillain-Barre syndrome
        pattern) auto-escalates the follow-up urgency to critical-alert regardless of the other axes.'
