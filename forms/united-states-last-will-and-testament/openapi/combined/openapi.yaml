components:
  schemas:
    Attorney:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Full name of the attorney.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as a single text block.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2.
        postcode:
          type:
          - string
          - 'null'
          description: ZIP or postal code.
        role:
          type: string
          enum:
          - drafting-attorney
          - supervising-attorney
          - reviewing-attorney
          - other
          - ''
          description: 'Role on this will: drafting-attorney, supervising-attorney, reviewing-attorney,
            or other.'
        barState:
          type: string
          maxLength: 2
          description: Two-letter state of bar admission.
        barNumber:
          type: string
          description: State bar number.
      required:
      - createdAt
      - updatedAt
      - name
      - role
      - barState
      - barNumber
      description: Attorney who drafts, supervises, or reviews the will, with bar admission details.
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          description: A URI identifying the problem type
        title:
          type: string
          description: A short summary of the problem type
        status:
          type: integer
          description: The HTTP status code
        detail:
          type: string
          description: An explanation of this occurrence
        instance:
          type: string
          description: A URI identifying this occurrence
        code:
          type: string
          description: A short machine-readable reason
        errors:
          type: object
          description: Per-field detail, when validation failed
      required:
      - type
      - title
      - status
    Testator:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          maxLength: 255
          description: Full legal name of the testator.
        birthDate:
          type: string
          format: date
          description: Date of birth of the testator.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as a single text block.
        state:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Two-letter US state or territory code of domicile.
        postcode:
          type:
          - string
          - 'null'
          description: ZIP or postal code.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2.
        citizenshipStatus:
          type: string
          enum:
          - us-citizen
          - us-resident-alien
          - non-resident-alien
          - unknown
          - ''
          description: 'Citizenship status for estate-tax purposes: us-citizen, us-resident-alien, non-resident-alien,
            or unknown.'
      required:
      - createdAt
      - updatedAt
      - name
      - birthDate
      - citizenshipStatus
      description: 'Testator: the person making the will, with contact details, state of domicile, and
        citizenship status.'
    UnitedStatesLastWillAndTestament:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        testatorId:
          type: string
          format: uuid
          description: Foreign key to the testator (restrict delete).
        attorneyId:
          type:
          - string
          - 'null'
          format: uuid
          description: Foreign key to the drafting attorney (restrict delete); optional.
        state:
          type: string
          maxLength: 2
          description: Two-letter state code whose law governs the will; unknown states fall back to the
            Uniform Probate Code default.
        testatorName:
          type: string
          description: Full legal name of the testator as written in the will.
        testatorDateOfBirth:
          type:
          - string
          - 'null'
          format: date
          description: Date of birth of the testator; the testator must be 18 or older on the execution
            date.
        soundMind:
          type: string
          enum:
          - 'yes'
          - 'no'
          - uncertain
          - ''
          description: 'Testamentary capacity: whether the testator is of sound mind: yes, no, or uncertain.'
        undueInfluenceConcern:
          type: string
          enum:
          - none
          - possible
          - ''
          description: 'Whether there is a concern of undue influence: none or possible.'
        maritalStatus:
          type: string
          enum:
          - single
          - married
          - divorced
          - widowed
          - ''
          description: 'Marital status of the testator: single, married, divorced, or widowed.'
        spouseName:
          type: string
          description: Full name of the testator's spouse, when married.
        spouseInheritanceValue:
          type:
          - number
          - 'null'
          format: double
          description: Value in US dollars left to the surviving spouse.
        spouseWaivedElectiveShare:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the spouse has waived the elective share in writing (yes/no).
        hasMinorChildren:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the testator has minor children (yes/no).
        guardianForMinorsName:
          type: string
          description: Nominated guardian for minor children.
        disinheritsChild:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the will leaves a child out (yes/no).
        disinheritedChildNamed:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the omitted child is named in the will (yes/no).
        estimatedEstateValue:
          type:
          - number
          - 'null'
          format: double
          description: Estimated gross estate value in US dollars.
        specificBequestsTotal:
          type:
          - number
          - 'null'
          format: double
          description: Total value in US dollars of all specific bequests.
        specificBequestsSummary:
          type: string
          description: Free-text summary of the specific bequests.
        residuaryClausePresent:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the will has a residuary clause giving away everything not otherwise given
            (yes/no).
        residuary1Name:
          type: string
          description: Residuary beneficiary 1 name.
        residuary1Percent:
          type:
          - number
          - 'null'
          format: double
          description: Residuary beneficiary 1 share, percent.
        residuary2Name:
          type: string
          description: Residuary beneficiary 2 name.
        residuary2Percent:
          type:
          - number
          - 'null'
          format: double
          description: Residuary beneficiary 2 share, percent.
        residuary3Name:
          type: string
          description: Residuary beneficiary 3 name.
        residuary3Percent:
          type:
          - number
          - 'null'
          format: double
          description: Residuary beneficiary 3 share, percent.
        contingentBeneficiaryNamed:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether a contingent (backup) beneficiary is named (yes/no).
        personalRepresentativeName:
          type: string
          description: Personal representative (executor) named in the will.
        successorPersonalRepresentativeName:
          type: string
          description: Successor personal representative named in the will.
        bondWaived:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the will waives the personal representative's bond (yes/no).
        revokesPriorWillsClause:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the will expressly revokes all earlier wills and codicils (yes/no).
        noContestClause:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the will has a no-contest (in terrorem) clause (yes/no).
        digitalAssetsClause:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the will authorizes access to digital assets under RUFADAA (yes/no).
        estateTaxReviewed:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether a tax adviser has reviewed estate tax (yes/no).
        originalWillLocation:
          type: string
          description: Where the signed original will is kept.
        drafterNote:
          type: string
          description: Free-text note from the drafter.
        executionForm:
          type: string
          enum:
          - witnessed
          - holographic
          - electronic
          - ''
          description: 'Form of execution: witnessed, holographic, or electronic.'
        executionDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the will is or was signed.
        signedAtEnd:
          type: string
          enum:
          - 'yes'
