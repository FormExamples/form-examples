    UnitedStatesLastWillAndTestamentGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        unitedStatesLastWillAndTestamentId:
          type: string
          format: uuid
          description: Foreign key to the parent record (unique, 1:1).
        validityClass:
          type: string
          enum:
          - valid-ready-to-execute
          - incomplete
          - formality-risk
          - ''
          description: 'Validity classification: valid-ready-to-execute, incomplete, or formality-risk
            (formality-risk takes precedence).'
        residuaryPercentTotal:
          type:
          - number
          - 'null'
          format: double
          description: Sum of the named residuary percentages; must be 100 when a residuary clause is
            present.
        electiveShareAmount:
          type:
          - number
          - 'null'
          format: double
          description: Estimated spousal elective share in US dollars; null when not applicable.
        witnessCount:
          type:
          - integer
          - 'null'
          format: int32
          description: Number of witnesses named.
        selfProved:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the will is self-proved under the state rule (yes/no).
        federalEstateTaxExposure:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the estimated estate exceeds the 2026 federal basic exclusion of $15,000,000
            (yes/no).
        stateRuleSource:
          type: string
          enum:
          - state-table
          - uniform-default
          - ''
          description: 'Where the state rule came from: state-table or uniform-default.'
        gradedAt:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the classification.
      required:
      - createdAt
      - updatedAt
      - unitedStatesLastWillAndTestamentId
      - validityClass
      - selfProved
      - federalEstateTaxExposure
      - stateRuleSource
      - gradedAt
      description: 'Computed completeness and validity-classification result for a will plan: validity
        class (valid-ready-to-execute/incomplete/formality-risk), residuary total, estimated spousal elective
        share, witness count, whether self-proved, federal estate-tax exposure, and the source of the
        state rule.'
