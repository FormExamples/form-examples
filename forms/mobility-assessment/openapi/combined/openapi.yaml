      summary: List Patient records
      operationId: listPatient
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 100
        required: false
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          maximum: 100000
          default: 0
        required: false
      responses:
        '200':
          description: A page of Patient records
          headers:
            x-total-count:
              description: Rows there are in all
              schema:
                type: integer
            x-limit:
              description: The limit applied
              schema:
                type: integer
            x-offset:
              description: The offset applied
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Patient'
        '400':
          description: The offset is past the maximum
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: This client sent too many requests
          headers:
            retry-after:
              description: Seconds to wait before sending again
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    post:
      summary: Create a new Patient
      operationId: createPatient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Patient'
      responses:
        '200':
          description: The newly created Patient
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'
        '400':
          description: The request was refused
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: It duplicates a row, or refers to a missing one
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: The body does not match the schema
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: This client sent too many requests
          headers:
            retry-after:
              description: Seconds to wait before sending again
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/patients/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      summary: Fetch one Patient by id
      operationId: getPatient
      responses:
        '200':
          description: The requested Patient
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'
        '404':
          description: Patient not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: This client sent too many requests
          headers:
            retry-after:
              description: Seconds to wait before sending again
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    patch:
      summary: Update an existing Patient
      operationId: updatePatient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Patient'
      responses:
        '200':
          description: The updated Patient
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'
        '404':
          description: Patient not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: It duplicates a row, or refers to a missing one
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: The body does not match the schema
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: This client sent too many requests
          headers:
            retry-after:
              description: Seconds to wait before sending again
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    delete:
      summary: Delete a Patient
      operationId: deletePatient
      responses:
        '200':
          description: Patient deleted
        '404':
          description: Patient not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: This client sent too many requests
          headers:
            retry-after:
              description: Seconds to wait before sending again
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  schemas:
    Assessment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        patient_id:
          type: string
          format: uuid
          description: Foreign key to the patient who owns this assessment.
        status:
          type: string
          enum:
          - draft
          - submitted
          - reviewed
          - urgent
          description: 'Lifecycle status: draft, submitted, reviewed, or urgent.'
      required:
      - created_at
      - updated_at
      - patient_id
      - status
      description: Mobility assessment form using the Tinetti Assessment Tool (Performance-Oriented Mobility
        Assessment). Parent entity for all assessment sections.
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Name.
        email:
          type: string
          description: Email address.
        phone:
          type: string
          description: Phone number.
        postal_address_as_full_text:
          type: string
          description: Postal address as full text.
        country_as_iso_3166_1_alpha_2:
          type: string
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type: string
          description: Postal code, such as for validating the postal address.
        role:
          type: string
          enum:
          - anaesthetist
          - surgeon
          - preop-nurse
          - perioperative-physician
          - geriatrician
          - pharmacist
          - other
          - ''
          description: Clinician role.
        registration_body:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - GPhC
          - other
          - ''
          description: Clinician registration body.
        registration_number:
          type: string
          description: Clinician registration number.
        united_kingdom_nhs_number:
          type: string
          maxLength: 12
          description: United Kingdom NHS number, unique per person.
      required:
      - created_at
      - updated_at
      - name
      - role
      - registration_body
      - registration_number
      description: Clinician
    Grade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        assessment_id:
          type: string
          format: uuid
          description: Foreign key to the parent assessment (unique, enforcing 1:1).
        balance_score:
          type: integer
          format: int32
          description: Tinetti Balance sub-score (0-16).
        gait_score:
          type: integer
          format: int32
          description: Tinetti Gait sub-score (0-12).
        total_tinetti_score:
          type: integer
          format: int32
          description: Total Tinetti score (balance + gait, 0-28). <19 = high risk, 19-24 = moderate,
            25-28 = low.
        fall_risk_category:
          type: string
          enum:
          - high_fall_risk
          - moderate_risk
          - low_risk
          - ''
          description: 'Fall risk category: high_fall_risk (<19), moderate_risk (19-24), low_risk (25-28).'
        tug_time_seconds:
          type: number
          format: double
          description: Timed Up and Go test result in seconds.
        tug_risk_category:
          type: string
          enum:
          - normal
          - moderate_risk
          - high_risk
          - ''
          description: 'TUG risk category: normal (<12s), moderate_risk (12-20s), high_risk (>20s).'
        graded_at:
          type: string
          format: date-time
          description: Timestamp when the grading was computed.
      required:
      - created_at
      - updated_at
      - assessment_id
      - balance_score
      - gait_score
      - total_tinetti_score
      - fall_risk_category
      - tug_risk_category
      - graded_at
      description: Computed Tinetti grading result for the mobility assessment. One-to-one child of assessment.
    GradingAdditionalFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        grade_id:
          type: string
          format: uuid
          description: Foreign key to the parent grading result.
        flag_id:
          type: string
          maxLength: 30
          description: Identifier of the flag (e.g. FLAG-FALL-001, FLAG-POLY-001, FLAG-TUG-001).
        category:
          type: string
          maxLength: 100
          description: Category of the flag (e.g. Fall Risk, Polypharmacy, Device, Functional Decline).
        message:
          type: string
          description: Human-readable message describing the flagged issue.
        priority:
          type: string
          enum:
          - high
          - medium
          - low
          description: 'Priority level: high, medium, or low.'
      required:
      - created_at
      - updated_at
      - grade_id
      - flag_id
      - category
      - message
      - priority
      description: Additional safety-critical flags detected during mobility assessment grading (e.g.
        high fall risk, recurrent falls, polypharmacy).
    GradingFiredRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        grade_id:
          type: string
          format: uuid
          description: Foreign key to the parent grading result.
        rule_id:
          type: string
          maxLength: 20
          description: Identifier of the rule that fired (e.g. MOB-BAL-001, MOB-GAIT-002, MOB-TUG-001).
        category:
          type: string
          maxLength: 100
          description: Category of the rule (e.g. Balance, Gait, TUG, Fall History, Medications).
        description:
          type: string
          description: Human-readable description of the finding.
        severity_level:
          type: string
          enum:
          - mild
          - moderate
          - severe
          - ''
          description: 'Severity level contributed by this rule: mild, moderate, or severe.'
      required:
      - created_at
      - updated_at
      - grade_id
      - rule_id
      - category
      - description
      - severity_level
      description: Individual mobility grading rules that evaluated to true during Tinetti scoring.
    Patient:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-deleted.
        name:
          type: string
          maxLength: 255
          description: Name.
        birth_date:
          type: string
          format: date
          description: Birth date.
        email:
          type: string
          description: Email address.
        phone:
          type: string
          description: Phone number.
        postal_address_as_full_text:
          type: string
          description: Postal address as full text.
        country_as_iso_3166_1_alpha_2:
          type: string
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type: string
          description: Postal code, such as for validating the postal address.
        united_kingdom_nhs_number:
          type: string
          maxLength: 20
          description: United Kingdom NHS number, unique per person.
        waist_as_cm:
          type: number
          format: double
          description: Waist circumference measurement in cm, such as for calculating waist-height ratio
            (WHR).
        height_as_cm:
          type: number
          format: double
          description: Height measurement in cm, such as for calculating waist-height ratio (WHR).
        weight_as_kg:
          type: number
          format: double
          description: Weight as kg.
        body_mass_index:
          type: number
          format: double
          description: Body mass index (BMI) measurement.
        waist_height_ratio:
          type: number
          format: double
          description: Waist-height ratio (WHR) measurement.
        vo2_max:
          type: number
          format: double
          description: VO2 max measurement.
      required:
      - created_at
      - updated_at
      - name
      - birth_date
      description: Patient
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          description: A URI identifying the problem type
        title:
          type: string
          description: A short summary of the problem type
        status:
          type: integer
          description: The HTTP status code
        detail:
          type: string
          description: An explanation of this occurrence
        instance:
          type: string
          description: A URI identifying this occurrence
        code:
          type: string
          description: A short machine-readable reason
        errors:
          type: object
          description: Per-field detail, when validation failed
      required:
      - type
      - title
      - status
