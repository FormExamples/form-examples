components:
  schemas:
    CardiacStressTestRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patient_id:
          type: string
          format: uuid
          description: Foreign key to the patient.
        clinician_id:
          type: string
          format: uuid
          description: Foreign key to the requesting clinician (referrer).
        status:
          type: string
          enum:
          - draft
          - submitted
          - vetted
          - scheduled
          - rejected
          - ''
          description: 'Request lifecycle status: draft, submitted, vetted, scheduled, rejected.'
        site_name:
          type: string
          maxLength: 255
          description: Name of the requesting site or clinic.
        setting:
          type: string
          enum:
          - outpatient
          - inpatient
          - community
          - emergency
          - ''
          description: 'Care setting: outpatient, inpatient, community, emergency.'
        referral_date:
          type: string
          format: date
          description: Date the referral was made.
        requested_by_date:
          type: string
          format: date
          description: Date by which the test is requested to be performed.
        test_type:
          type: string
          enum:
          - exercise-treadmill-ecg
          - stress-echo
          - dobutamine-stress-echo
          - myocardial-perfusion-spect
          - stress-cardiac-mri
          - other
          - ''
          description: 'Requested stress-test modality: exercise-treadmill-ecg, stress-echo, dobutamine-stress-echo,
            myocardial-perfusion-spect, stress-cardiac-mri, other.'
        primary_indication:
          type: string
          enum:
          - suspected-angina
          - known-cad-assessment
          - risk-stratification-post-mi
          - pre-operative-cardiac
          - exercise-tolerance
          - arrhythmia-evaluation
          - valve-disease
          - other
          - ''
          description: Primary clinical indication, used for appropriateness scoring.
        clinical_question:
          type: string
          maxLength: 1000
          description: Specific clinical question the test should answer (highest-value field).
        relevant_history:
          type: string
          maxLength: 1000
          description: Relevant cardiac, medical, and surgical history.
        symptom_chest_pain:
          type: boolean
          description: Whether the patient reports chest pain.
        symptom_breathlessness:
          type: boolean
          description: Whether the patient reports breathlessness (dyspnoea).
        symptom_palpitations:
          type: boolean
          description: Whether the patient reports palpitations.
        able_to_exercise:
          type: boolean
          description: Whether the patient is able to exercise (determines exercise vs pharmacological
            stress).
        resting_ecg_findings:
          type: string
          maxLength: 1000
          description: Relevant resting ECG findings (e.g. LBBB, paced, ST changes) affecting test selection.
        known_coronary_artery_disease:
          type: boolean
          description: Whether the patient has known coronary artery disease.
        recent_acute_coronary_syndrome:
          type: boolean
          description: Whether the patient has had a recent acute coronary syndrome (safety contraindication
            if very recent).
        aortic_stenosis:
          type: string
          enum:
          - none
          - mild
          - moderate
          - severe
          - unknown
          - ''
          description: 'Aortic stenosis severity: none, mild, moderate, severe, unknown (severe symptomatic
            AS contraindicates exercise testing).'
        uncontrolled_hypertension:
          type: boolean
          description: Whether the patient has uncontrolled hypertension (relative contraindication).
        beta_blocker:
          type: boolean
          description: Whether the patient is taking a beta-blocker (may blunt heart-rate response on
            exercise testing).
        urgency:
          type: string
          enum:
          - routine
          - urgent
          - emergency
          - ''
          description: 'Requested triage urgency: routine, urgent, emergency.'
        supervising_consultant:
          type: string
          maxLength: 255
          description: Name of the supervising / responsible consultant.
        requester_contact:
          type: string
          maxLength: 255
          description: Contact details (bleep / phone) for the requester.
        notes:
          type: string
          maxLength: 1000
          description: Free-text additional notes.
      required:
      - created_at
      - updated_at
      - patient_id
      - clinician_id
      - status
      - site_name
      - setting
      - test_type
      - primary_indication
      - clinical_question
      - relevant_history
      - symptom_chest_pain
      - symptom_breathlessness
      - symptom_palpitations
      - able_to_exercise
      - resting_ecg_findings
      - known_coronary_artery_disease
      - recent_acute_coronary_syndrome
      - aortic_stenosis
      - uncontrolled_hypertension
      - beta_blocker
      - urgency
      - supervising_consultant
      - requester_contact
      - notes
      description: Cardiac stress / exercise test request (referral). Captures the requested test type,
        the clinical indication and question, relevant history, presenting symptoms, ability to exercise,
        and the cardiac risk / safety factors (known CAD, recent ACS, aortic stenosis, uncontrolled hypertension,
        beta-blocker), plus triage urgency.
    CardiacStressTestRequestGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        cardiac_stress_test_request_id:
          type: string
          format: uuid
          description: Foreign key to the parent request (unique, 1:1).
        appropriateness_score:
          type: integer
          format: int32
          description: ACC/AHA Appropriate Use Criteria score (1-9) for stress testing.
        appropriateness_band:
          type: string
          enum:
          - usually-appropriate
          - may-be-appropriate
          - usually-not-appropriate
          - ''
          description: 'Appropriateness band: usually-appropriate (7-9), may-be-appropriate (4-6), usually-not-appropriate
            (1-3).'
        contraindication_band:
          type: string
          enum:
          - ok
          - caution
          - contraindicated
          - ''
          description: 'Safety band from contraindication screen: ok, caution, contraindicated (recent
            ACS, severe symptomatic AS, uncontrolled HTN, inability to exercise).'
        completeness_percent:
          type: integer
          format: int32
          description: Request completeness as a percentage of mandatory fields (0-100).
        triage_tier:
          type: string
          enum:
          - routine
          - urgent
          - emergency
          - ''
          description: 'Assigned triage tier: routine, urgent, emergency.'
        target_timeframe:
          type: string
          maxLength: 50
          description: Target timeframe for the test implied by the triage tier.
        recommendation:
          type: string
          enum:
          - accept
          - query-referrer
          - redirect
          - reject
          - ''
          description: 'Vetting recommendation: accept, query-referrer, redirect, reject.'
        clinician_notes:
          type: string
          description: Free-text vetting notes.
        signed_at:
          type: string
          format: date-time
          description: Timestamp of vetting clinician electronic signature.
        graded_at:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the result.
      required:
      - created_at
      - updated_at
      - cardiac_stress_test_request_id
      - appropriateness_band
      - contraindication_band
      - triage_tier
      - target_timeframe
      - recommendation
      - clinician_notes
      - graded_at
      description: 'Computed four-axis grading result: appropriateness (ACC/AHA AUC 1-9), safety / contraindication,
        request completeness, and triage priority.'
    CardiacStressTestRequestGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        cardiac_stress_test_request_grade_id:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        flag_id:
          type: string
          maxLength: 50
          description: Stable flag identifier (e.g. F-SEVERE-AORTIC-STENOSIS-001).
        category:
          type: string
          enum:
          - recent-acs-contraindication
          - severe-aortic-stenosis
          - uncontrolled-hypertension
          - unable-to-exercise
          - missing-indication
          - missing-clinical-question
          - other
          - ''
          description: Flag category.
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          - ''
          description: 'Priority: low, medium, high.'
        description:
          type: string
          maxLength: 500
          description: Human-readable description of what fired the flag.
        suggested_action:
          type: string
          maxLength: 500
          description: Suggested clinical action (e.g. "do not exercise test; refer for coronary angiography").
      required:
      - created_at
      - updated_at
      - cardiac_stress_test_request_grade_id
      - flag_id
      - category
      - priority
      - description
      - suggested_action
      description: Safety-critical flags that fire independently of the four axes, with priority and a
        suggested action for the imaging / physiology team.
    CardiacStressTestRequestGradeRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        cardiac_stress_test_request_grade_id:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        rule_id:
          type: string
          maxLength: 40
          description: Stable rule identifier (e.g. R-APPROP-ANGINA-01).
        axis:
          type: string
          enum:
          - appropriateness
          - safety
          - completeness
          - triage
          - ''
          description: 'Scoring axis the rule belongs to: appropriateness, safety, completeness, triage.'
        category:
          type: string
          maxLength: 50
          description: Category or indication the rule relates to.
        description:
          type: string
          maxLength: 500
          description: Human-readable description of why the rule fired.
      required:
      - created_at
      - updated_at
      - cardiac_stress_test_request_grade_id
      - rule_id
      - axis
      - category
      - description
      description: Audit trail of every appropriateness / safety / completeness / triage rule that fired
        for this request.
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Name.
        email:
          type: string
          description: Email address.
        phone:
          type: string
          description: Phone number.
        postal_address_as_full_text:
          type: string
          description: Postal address as full text.
        country_as_iso_3166_1_alpha_2:
          type: string
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type: string
          description: Postal code, such as for validating the postal address.
        role:
          type: string
          enum:
          - cardiologist
          - gp
          - hospital-doctor
          - physiologist
          - nurse
          - other
          - ''
          description: 'Clinician role: cardiologist, gp, hospital-doctor, physiologist, nurse, other.'
        registration_body:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - other
          - ''
          description: 'Clinician registration body: GMC, NMC, HCPC, other.'
        registration_number:
          type: string
          description: Clinician registration number.
        united_kingdom_nhs_number:
          type: string
          maxLength: 12
          description: United Kingdom NHS number, unique per person.
      required:
      - created_at
      - updated_at
      - name
      - role
      - registration_body
      - registration_number
      description: Requesting clinician (referrer) who completes the cardiac stress test request.
    Patient:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          maxLength: 255
          description: Name.
        birth_date:
          type: string
          format: date
          description: Birth date.
        email:
          type: string
          description: Email address.
        phone:
          type: string
          description: Phone number.
        postal_address_as_full_text:
          type: string
          description: Postal address as full text.
        country_as_iso_3166_1_alpha_2:
          type: string
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type: string
          description: Postal code, such as for validating the postal address.
        united_kingdom_nhs_number:
          type: string
          maxLength: 20
          description: United Kingdom NHS number, unique per person.
        waist_as_cm:
          type: number
          format: double
          description: Waist circumference measurement in cm, such as for calculating waist-height ratio
            (WHR).
        height_as_cm:
          type: number
          format: double
          description: Height measurement in cm, such as for calculating waist-height ratio (WHR).
        weight_as_kg:
          type: number
          format: double
          description: Weight as kg.
        body_mass_index:
          type: number
          format: double
          description: Body mass index (BMI) measurement.
        waist_height_ratio:
          type: number
          format: double
          description: Waist-height ratio (WHR) measurement.
        vo2_max:
          type: number
          format: double
          description: VO2 max measurement.
      required:
      - created_at
      - updated_at
      - name
      - birth_date
      description: Patient
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          description: A URI identifying the problem type
        title:
          type: string
          description: A short summary of the problem type
        status:
          type: integer
          description: The HTTP status code
        detail:
          type: string
          description: An explanation of this occurrence
        instance:
          type: string
          description: A URI identifying this occurrence
        code:
          type: string
          description: A short machine-readable reason
        errors:
          type: object
          description: Per-field detail, when validation failed
      required:
      - type
      - title
      - status
