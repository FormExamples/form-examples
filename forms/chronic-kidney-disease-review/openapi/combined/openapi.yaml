components:
  schemas:
    ChronicKidneyDiseaseReview:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the patient this review documents (restrict delete).
        clinicianId:
          type:
          - string
          - 'null'
          format: uuid
          description: Foreign key to the reviewing clinician (restrict delete); optional.
        clinicianName:
          type: string
          maxLength: 200
          description: Name of the reviewing clinician as recorded on the review.
        clinicianRole:
          type: string
          enum:
          - gp
          - nurse
          - pharmacist
          - nephrology
          - other
          - ''
          description: 'Reviewing clinician role: gp, nurse, pharmacist, nephrology, or other.'
        reviewedAt:
          type:
          - string
          - 'null'
          format: date
          description: Date the CKD review was conducted.
        careSetting:
          type: string
          enum:
          - general-practice
          - long-term-conditions-clinic
          - community-nephrology
          - other
          - ''
          description: 'Care setting of the review: general-practice, long-term-conditions-clinic, community-nephrology,
            or other.'
        reviewType:
          type: string
          enum:
          - annual
          - interval
          - post-referral
          - ''
          description: 'Review type: annual, interval, or post-referral.'
        patientIdentifier:
          type: string
          maxLength: 100
          description: NHS number or local patient identifier as recorded on the review.
        ageBand:
          type: string
          enum:
          - 18-39
          - 40-59
          - 60-79
          - '>=80'
          - ''
          description: 'Adult age band: 18-39, 40-59, 60-79, or >=80.'
        sex:
          type: string
          enum:
          - female
          - male
          - intersex
          - unknown
          - ''
          description: 'Patient sex: female, male, intersex, or unknown.'
        diabetesStatus:
          type: string
          enum:
          - none
          - type1
          - type2
          - ''
          description: 'Diabetes status: none, type1, or type2; drives the tighter 130/80 blood-pressure
            target.'
        primaryCause:
          type: string
          enum:
          - diabetic
          - hypertensive
          - glomerular
          - polycystic
          - obstructive
          - unknown
          - other
          - ''
          description: 'Primary cause of CKD: diabetic, hypertensive, glomerular, polycystic, obstructive,
            unknown, or other.'
        monthsSinceDiagnosis:
          type:
          - integer
          - 'null'
          format: int32
          description: Duration of known CKD in months.
        egfr:
          type:
          - number
          - 'null'
          format: double
          description: Current estimated glomerular filtration rate in mL/min/1.73m^2; maps to the G-stage.
        egfrSampleDate:
          type:
          - string
          - 'null'
          format: date
          description: Date of the current eGFR sample.
        previousEgfr:
          type:
          - number
          - 'null'
          format: double
          description: Prior estimated glomerular filtration rate in mL/min/1.73m^2, used for the rapid-decline
            check.
        previousEgfrDate:
          type:
          - string
          - 'null'
          format: date
          description: Date of the prior eGFR sample.
        acr:
          type:
          - number
          - 'null'
          format: double
          description: Urine albumin:creatinine ratio in mg/mmol; maps to the albuminuria stage.
        acrSampleDate:
          type:
          - string
          - 'null'
          format: date
          description: Date of the urine ACR sample.
        acrMeasured:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the urine ACR was measured at this review (yes/no).
        systolicBloodPressure:
          type:
          - integer
          - 'null'
          format: int32
          description: Systolic blood pressure in mmHg.
        diastolicBloodPressure:
          type:
          - integer
          - 'null'
          format: int32
          description: Diastolic blood pressure in mmHg.
        aceiOrArbPrescribed:
          type: string
          enum:
          - 'yes'
          - 'no'
          - contraindicated
          - ''
          description: 'ACE inhibitor or ARB (RAAS blockade) status: yes, no, or contraindicated.'
        sglt2iPrescribed:
          type: string
          enum:
          - 'yes'
          - 'no'
          - not-indicated
          - ''
          description: 'SGLT2 inhibitor status: yes, no, or not-indicated.'
        statinPrescribed:
          type: string
          enum:
          - 'yes'
          - 'no'
          - declined
          - ''
          description: 'Statin (cardiovascular risk) status: yes, no, or declined.'
        nephrotoxicDrugPresent:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether a nephrotoxic drug (e.g. NSAID, certain antibiotics) is present (yes/no).
        nephrotoxicDoseAdjusted:
          type: string
          enum:
          - 'yes'
          - 'no'
          - not-applicable
          - ''
          description: 'Whether any nephrotoxic drug was dose-adjusted or held: yes, no, or not-applicable.'
        medicationReviewCompleted:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether a structured medication review was documented (yes/no).
        hba1c:
          type:
          - number
          - 'null'
          format: double
          description: HbA1c in mmol/mol (glycaemic control).
        potassium:
          type:
          - number
          - 'null'
          format: double
          description: Serum potassium in mmol/L (hyperkalaemia check).
        bicarbonate:
          type:
          - number
          - 'null'
          format: double
          description: Serum bicarbonate in mmol/L (acidosis check).
        calcium:
          type:
          - number
          - 'null'
          format: double
          description: Serum calcium in mmol/L (CKD-MBD).
        phosphate:
          type:
          - number
          - 'null'
          format: double
          description: Serum phosphate in mmol/L (CKD-MBD).
        pth:
          type:
          - number
          - 'null'
          format: double
          description: Parathyroid hormone in pmol/L (CKD-MBD).
        haemoglobin:
          type:
          - number
          - 'null'
          format: double
          description: Haemoglobin in g/L (anaemia of CKD check).
        referralDecision:
          type: string
          enum:
          - none
          - monitor
          - refer-nephrology
          - already-under-nephrology
          - ''
          description: 'Referral decision: none, monitor, refer-nephrology, or already-under-nephrology.'
        clinicalNote:
          type: string
          description: Optional free-text clinical note or narrative shown in the summary.
      required:
      - createdAt
      - updatedAt
      - patientId
      - clinicianName
      - clinicianRole
      - careSetting
      - reviewType
      - patientIdentifier
      - ageBand
      - sex
      - diabetesStatus
      - primaryCause
      - acrMeasured
      - aceiOrArbPrescribed
      - sglt2iPrescribed
      - statinPrescribed
      - nephrotoxicDrugPresent
      - nephrotoxicDoseAdjusted
      - medicationReviewCompleted
      - referralDecision
      - clinicalNote
      description: 'Main chronic kidney disease annual-review record (NICE NG203): patient and clinician
        identification, review context, the two KDIGO staging measurements (current eGFR and urine ACR),
        the prior eGFR for the decline check, blood pressure, a structured medication review, and the
        core CKD bloods. The derived G-stage, albuminuria stage, KDIGO risk zone, completeness grade,
        fired rules, and flags live in child tables.'
    ChronicKidneyDiseaseReviewGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        chronicKidneyDiseaseReviewId:
          type: string
          format: uuid
          description: Foreign key to the parent CKD review (unique, 1:1).
        gfrCategory:
          type: string
          enum:
          - G1
          - G2
          - G3a
          - G3b
          - G4
          - G5
          - ''
          description: 'KDIGO G-stage from the current eGFR: G1, G2, G3a, G3b, G4, or G5 (empty when eGFR
            missing).'
        albuminuriaCategory:
          type: string
          enum:
          - A1
          - A2
          - A3
          - ''
          description: 'KDIGO albuminuria stage from the urine ACR: A1, A2, or A3 (empty when ACR missing).'
        kdigoRiskZone:
          type: string
          enum:
          - low
          - moderate
          - high
          - very-high
          - ''
          description: 'KDIGO risk zone from the G-stage x albuminuria-stage heat-map: low, moderate,
            high, or very-high (empty when either stage missing).'
        reviewStatus:
          type: string
          enum:
          - complete
          - partial
          - incomplete
          - ''
          description: 'Review completeness: complete, partial, or incomplete.'
        bloodPressureTargetSystolic:
          type:
          - integer
          - 'null'
          format: int32
          description: Selected systolic blood-pressure target in mmHg (130 when ACR >= 70 or diabetic,
            else 140).
        bloodPressureTargetDiastolic:
          type:
          - integer
          - 'null'
          format: int32
          description: Selected diastolic blood-pressure target in mmHg (80 when ACR >= 70 or diabetic,
            else 90).
        bloodPressureAtTarget:
          type:
          - boolean
          - 'null'
          description: Whether the recorded blood pressure is below the selected target (null when blood
            pressure missing).
        completenessScore:
          type:
          - integer
          - 'null'
          format: int32
          description: Integer count of recorded review bundle items (eGFR, ACR, BP, medication review,
            core bloods).
        gradedAt:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the grade.
      required:
      - createdAt
      - updatedAt
      - chronicKidneyDiseaseReviewId
      - gfrCategory
      - albuminuriaCategory
      - kdigoRiskZone
      - reviewStatus
      - gradedAt
