        - title
        - status
    LpaInstruction:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        lpa_id:
          type: string
          format: uuid
          description: Foreign key to the parent LPA.
        order_position:
          type: integer
          format: int32
          description: Order in which the instruction appears in the LP1H s.7 block.
        category:
          type: string
          enum:
            - medical-treatment-limit
            - residence-restriction
            - contact-restriction
            - religion-and-belief
            - food-and-drink
            - end-of-life-care
            - other
