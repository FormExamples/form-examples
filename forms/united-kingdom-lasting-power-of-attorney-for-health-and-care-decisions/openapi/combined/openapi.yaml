components:
  schemas:
    Attorney:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        title:
          type: string
          maxLength: 20
          description: Honorific title.
        given_names:
          type: string
          maxLength: 255
          description: Given names of the attorney.
        family_name:
          type: string
          maxLength: 255
          description: Family name of the attorney.
        birth_date:
          type: string
          format: date
          description: Date of birth. Used to verify attorney age ≥ 18 (R-MCA-ATT-AGE).
        email:
          type: string
          description: Email address.
        phone:
          type: string
          description: Phone number.
        postal_address_as_full_text:
          type: string
          description: Postal address as full text.
        country_as_iso_3166_1_alpha_2:
          type: string
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2.
        postcode:
          type: string
          description: Postal code.
        relationship_to_donor:
          type: string
          enum:
          - spouse
          - civil-partner
          - child
          - parent
          - sibling
          - friend
          - professional
          - other
          - ''
          description: Stated relationship to the donor.
        is_bankrupt:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the attorney is currently bankrupt. Informational for H&W LPAs (statutory
            bar applies only to property/financial LPAs).
        capacity_declared:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the attorney has declared capacity to act.
      required:
      - created_at
      - updated_at
      - title
      - given_names
      - family_name
      - email
      - phone
      - postal_address_as_full_text
      - country_as_iso_3166_1_alpha_2
      - postcode
      - relationship_to_donor
      - is_bankrupt
      - capacity_declared
      description: A person nominated as an attorney by the donor. Must be ≥ 18 with capacity per MCA
        2005 s.10.
    CertificateProvider:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        title:
          type: string
          maxLength: 20
          description: Honorific title.
        given_names:
          type: string
          maxLength: 255
          description: Given names.
        family_name:
          type: string
          maxLength: 255
          description: Family name.
        email:
          type: string
          description: Email address.
        phone:
          type: string
          description: Phone number.
        postal_address_as_full_text:
          type: string
          description: Postal address as full text.
        country_as_iso_3166_1_alpha_2:
          type: string
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2.
        postcode:
          type: string
          description: Postal code.
        route:
          type: string
          enum:
          - skill-based
          - knowledge-based
          - ''
          description: 'Eligibility route: skill-based (registered profession) or knowledge-based (known
            donor ≥ 2 years).'
        profession:
          type: string
          enum:
          - solicitor
          - barrister
          - general-practitioner
          - consultant
          - registered-nurse
          - registered-social-worker
          - imca
          - psychiatrist
          - psychologist
          - other-registered-professional
          - ''
          description: Profession when route = skill-based.
        profession_registration_number:
          type: string
          maxLength: 50
          description: Professional registration number (e.g. SRA, GMC, NMC, HCPC number).
        years_known_donor:
          type: number
          format: double
          description: Years known the donor personally. Must be ≥ 2 when route = knowledge-based (R-MCA-CP-ROUTE).
        relationship_to_donor:
          type: string
          enum:
          - professional
          - friend
          - colleague
          - neighbour
          - other
          - ''
          description: Nature of the relationship with the donor.
        declared_not_family:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Self-declaration that the certificate provider is not a family member of donor
            or attorney (R-MCA-CP-FAM).
        declared_not_employee:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Self-declaration that the certificate provider is not a business partner or employee
            of donor or attorney (R-MCA-CP-EMP).
        declared_not_attorney:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Self-declaration that the certificate provider is not an attorney named in this
            LPA.
      required:
      - created_at
      - updated_at
      - title
      - given_names
      - family_name
      - email
      - phone
      - postal_address_as_full_text
      - country_as_iso_3166_1_alpha_2
      - postcode
      - route
      - profession
      - profession_registration_number
      - relationship_to_donor
      - declared_not_family
      - declared_not_employee
      - declared_not_attorney
      description: Independent certificate provider per Lasting Powers of Attorney Regulations 2007 Sch.1
        Pt.2.
    Donor:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        title:
          type: string
          maxLength: 20
          description: Honorific title (Mr, Mrs, Dr, …).
        given_names:
          type: string
          maxLength: 255
          description: Given names of the donor.
        family_name:
          type: string
          maxLength: 255
          description: Family name of the donor.
        other_names_used:
          type: string
          maxLength: 500
          description: Any other names the donor uses (LP1H s.1 requires this be listed).
        birth_date:
          type: string
          format: date
          description: Date of birth. Used to verify donor age ≥ 18 at signing (R-MCA-S9-AGE).
        email:
          type: string
          description: Email address.
        phone:
          type: string
          description: Phone number.
        postal_address_as_full_text:
          type: string
          description: Postal address as full text.
        country_as_iso_3166_1_alpha_2:
          type: string
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 (expected GB for England and Wales).
        postcode:
          type: string
          description: Postal code.
        united_kingdom_nhs_number:
          type: string
          maxLength: 20
          description: United Kingdom NHS number, optional but useful for cross-form ADRT check.
        jurisdiction:
          type: string
          enum:
          - england
          - wales
          - ''
          description: 'Jurisdiction within the UK: england or wales. Scotland and Northern Ireland use
            different schemes.'
        preferred_language:
          type: string
          enum:
          - en
          - cy
          - ''
          description: 'Preferred language: en (English) or cy (Cymraeg / Welsh).'
        capacity_declared:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the donor has declared capacity at the point of signing the LPA.
        capacity_declared_at:
          type: string
          format: date-time
          description: Timestamp at which capacity was declared.
      required:
      - created_at
      - updated_at
      - title
      - given_names
      - family_name
      - other_names_used
      - email
      - phone
      - postal_address_as_full_text
      - country_as_iso_3166_1_alpha_2
      - postcode
      - jurisdiction
      - preferred_language
      - capacity_declared
      description: The person creating the LPA. Must be ≥ 18 with mental capacity at signing per Mental
        Capacity Act 2005 s.9.
    Lpa:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        donor_id:
          type: string
          format: uuid
          description: Foreign key to the donor.
        certificate_provider_id:
          type: string
          format: uuid
          description: Foreign key to the certificate provider. Nullable while the LPA is still in draft
            and the certificate provider has not been chosen.
        form_version:
          type: string
          maxLength: 20
          description: Version of the LP1H form template used (e.g. LP1H-2024).
        jurisdiction:
          type: string
          enum:
          - england
          - wales
          - ''
          description: 'Jurisdiction: england or wales (Mental Capacity Act 2005 applies to both).'
        status:
          type: string
          enum:
          - draft
          - awaiting-signatures
          - ready-to-register
          - submitted-to-opg
          - registered
