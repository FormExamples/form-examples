[package]
name = "uk-lpa-health-care-decisions"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum = { version = "0.8", features = ["form"] }
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "signal", "net"] }
tower = { version = "0.5" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
tera = { version = "1.20" }
uuid = { version = "1.23", features = ["v4", "serde"] }

[dev-dependencies]
serde_urlencoded = "0.7"

[[bin]]
name = "uk-lpa-server"
path = "src/main.rs"
