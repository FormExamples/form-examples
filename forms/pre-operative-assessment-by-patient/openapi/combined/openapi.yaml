components:
  schemas:
    AsaRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when this row was deleted.
        code:
          type: string
          description: Human-readable rule code (e.g. DM-001). UNIQUE stable identifier used by application
            code and audit records.
        system:
          type: string
          description: Body system or category (e.g. Cardiovascular, Respiratory).
        description:
          type: string
          description: Human-readable condition description (e.g. Controlled hypertension).
        grade:
          type: integer
          format: int32
          description: 'ASA grade assigned when this rule fires: 1 (healthy) to 5 (moribund).'
      required:
      - created_at
      - updated_at
      - code
      - system
      - description
      - grade
      description: Reference table of ASA grading rules. Seed data mirrors asa-rules.ts. Used for audit
        trail.
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Soft-delete timestamp; NULL when the row is live.
        name:
          type: string
          description: Name.
        email:
          type: string
          description: Email address.
        phone:
          type: string
          description: Phone number.
        postal_address_as_full_text:
          type: string
          description: Postal address as full text.
        country_as_iso_3166_1_alpha_2:
          type: string
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type: string
          description: Postal code, such as for validating the postal address.
        role:
          type: string
          enum:
          - anaesthetist
          - surgeon
          - preop-nurse
          - perioperative-physician
          - geriatrician
          - pharmacist
          - other
          - ''
          description: Clinician role.
        registration_body:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - GPhC
          - other
          - ''
          description: Clinician registration body.
        registration_number:
          type: string
          description: Clinician registration number.
        united_kingdom_nhs_number:
          type: string
          maxLength: 12
          description: United Kingdom NHS number, unique per person.
      required:
      - created_at
      - updated_at
      - name
      - role
      - registration_body
      - registration_number
      description: Clinician
    Grade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when this row was deleted.
        pre_operative_assessment_by_patient_id:
          type: string
          format: uuid
          description: Foreign key to the pre_operative_assessment_by_patient table.
        computed_asa_grade:
          type: string
          enum:
          - I
          - II
          - III
          - IV
          - V
          - VI
          - ''
          description: ASA grade computed by the engine from clinician-observed data.
        final_asa_grade:
          type: string
          enum:
          - I
          - II
          - III
          - IV
          - V
          - VI
          - ''
          description: ASA grade signed off by the clinician (may equal or differ from computed).
        asa_emergency_suffix:
          type: string
          enum:
          - E
          - ''
          description: 'Emergency suffix: E if the procedure is emergency, empty otherwise.'
        override_reason:
          type: string
          maxLength: 500
          description: Reason the clinician set final differently from computed (mandatory when they differ).
        mallampati_class:
          type: string
          enum:
          - I
          - II
          - III
          - IV
          - ''
          description: Mallampati airway class as per step 4.
        rcri_score:
          type: integer
          format: int32
          description: Revised Cardiac Risk Index score (0-6).
        stopbang_score:
          type: integer
          format: int32
          description: STOP-BANG score (0-8).
        frailty_scale:
          type: integer
          format: int32
          description: Clinical Frailty Scale score (1-9).
        composite_risk:
          type: string
          enum:
          - low
          - moderate
          - high
          - critical
          - ''
          description: 'Composite perioperative risk: low, moderate, high, critical.'
        recommendation:
          type: string
          enum:
          - proceed
          - optimise-first
          - mdt-review
          - cancel
          - ''
          description: 'Overall recommendation: proceed, optimise-first, mdt-review, cancel.'
        clinician_notes:
          type: string
          description: Free-text clinician summary notes.
        signed_at:
          type: string
          format: date-time
          description: Timestamp of clinician electronic signature.
        graded_at:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the result.
      required:
      - created_at
      - updated_at
      - pre_operative_assessment_by_patient_id
      - computed_asa_grade
      - final_asa_grade
      - asa_emergency_suffix
      - override_reason
      - mallampati_class
      - composite_risk
      - recommendation
      - clinician_notes
      - graded_at
      description: 'Step 16: computed and signed-off grading result. Stores both the engine-computed ASA
        grade and the clinician-final grade with an override reason.'
    GradingAdditionalFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when this row was deleted.
        grade_id:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        flag_id:
          type: string
          maxLength: 50
          description: Stable flag identifier (e.g. F-DIFFICULT-AIRWAY-001).
        category:
          type: string
          enum:
          - difficult-airway
          - severe-cardiac
          - severe-respiratory
          - severe-renal
          - severe-hepatic
          - severe-anaemia
          - coagulopathy
          - uncontrolled-diabetes
          - severe-frailty
          - recent-covid-19
          - fasting-violation
          - missing-crossmatch
          - high-risk-medication
          - capacity-concern
          - paediatric
          - pregnancy
          - safeguarding
          - malignant-hyperthermia
          - latex-allergy
          - sux-apnoea
          - pseudocholinesterase-deficiency
          - malnutrition-risk
          - other
          - ''
          description: Flag category.
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          - ''
          description: 'Priority: low, medium, high.'
        description:
          type: string
          maxLength: 500
          description: Human-readable description of what fired the flag.
        suggested_action:
          type: string
          maxLength: 500
          description: Suggested clinical action (e.g. "prepare difficult-airway trolley").
      required:
      - created_at
      - updated_at
      - grade_id
      - flag_id
      - category
      - priority
      - description
      - suggested_action
      description: Safety-critical flags that fire independently of the ASA grade, with priority and a
        suggested action for the perioperative team.
    GradingFiredRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when this row was deleted.
        grade_id:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        rule_id:
          type: string
          maxLength: 30
          description: Stable rule identifier (e.g. R-ASA-III-02).
        instrument:
          type: string
          enum:
          - asa
          - mallampati
          - rcri
          - stopbang
          - frailty
          description: 'Scoring instrument the rule belongs to: asa, mallampati, rcri, stopbang, frailty.'
        grade:
          type: string
          maxLength: 5
          description: Grade contributed by this rule (e.g. III for ASA).
        category:
          type: string
          maxLength: 50
          description: Body-system or risk category (e.g. cardiovascular, respiratory).
        description:
          type: string
          maxLength: 500
          description: Human-readable description of why the rule fired.
      required:
      - created_at
      - updated_at
      - grade_id
      - rule_id
      - instrument
      - grade
      - category
      - description
