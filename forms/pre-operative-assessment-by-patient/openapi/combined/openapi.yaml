components:
  schemas:
    AsaRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        code:
          type: string
          description: Human-readable rule code (e.g. DM-001). UNIQUE stable identifier used by application
            code and audit records.
        system:
          type: string
          description: Body system or category (e.g. Cardiovascular, Respiratory).
        description:
          type: string
          description: Human-readable condition description (e.g. Controlled hypertension).
        grade:
          type: integer
          format: int32
          description: 'ASA grade assigned when this rule fires: 1 (healthy) to 5 (moribund).'
      required:
      - createdAt
      - updatedAt
      - code
      - system
      - description
      - grade
      description: Reference table of ASA grading rules. Seed data mirrors asa-rules.ts. Used for audit
        trail.
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Name.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as full text.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code, such as for validating the postal address.
        role:
          type: string
          enum:
          - anaesthetist
          - surgeon
          - preop-nurse
          - perioperative-physician
          - geriatrician
          - pharmacist
          - other
          - ''
          description: Clinician role.
        registrationBody:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - GPhC
          - other
          - ''
          description: Clinician registration body.
        registrationNumber:
          type: string
          description: Clinician registration number.
        unitedKingdomNhsNumber:
          type:
          - string
          - 'null'
          maxLength: 12
          description: United Kingdom NHS number, unique per person.
      required:
      - createdAt
      - updatedAt
      - name
      - role
      - registrationBody
      - registrationNumber
      description: Clinician
    Grade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        preOperativeAssessmentByPatientId:
          type: string
          format: uuid
          description: Foreign key to the pre_operative_assessment_by_patient table.
        computedAsaGrade:
          type: string
          enum:
          - I
          - II
          - III
          - IV
          - V
          - VI
          - ''
          description: ASA grade computed by the engine from clinician-observed data.
        finalAsaGrade:
          type: string
          enum:
          - I
          - II
          - III
          - IV
          - V
          - VI
          - ''
          description: ASA grade signed off by the clinician (may equal or differ from computed).
        asaEmergencySuffix:
          type: string
          enum:
          - E
          - ''
          description: 'Emergency suffix: E if the procedure is emergency, empty otherwise.'
        overrideReason:
          type: string
          maxLength: 500
          description: Reason the clinician set final differently from computed (mandatory when they differ).
        mallampatiClass:
          type: string
          enum:
          - I
          - II
          - III
          - IV
          - ''
          description: Mallampati airway class as per step 4.
        rcriScore:
          type:
          - integer
          - 'null'
          format: int32
          description: Revised Cardiac Risk Index score (0-6).
        stopbangScore:
          type:
          - integer
          - 'null'
          format: int32
          description: STOP-BANG score (0-8).
        frailtyScale:
          type:
          - integer
          - 'null'
          format: int32
          description: Clinical Frailty Scale score (1-9).
        compositeRisk:
          type: string
          enum:
          - low
          - moderate
          - high
          - critical
          - ''
          description: 'Composite perioperative risk: low, moderate, high, critical.'
        recommendation:
          type: string
          enum:
          - proceed
          - optimise-first
          - mdt-review
          - cancel
          - ''
          description: 'Overall recommendation: proceed, optimise-first, mdt-review, cancel.'
        clinicianNotes:
          type: string
          description: Free-text clinician summary notes.
        signedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Timestamp of clinician electronic signature.
        gradedAt:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the result.
      required:
      - createdAt
      - updatedAt
      - preOperativeAssessmentByPatientId
      - computedAsaGrade
      - finalAsaGrade
      - asaEmergencySuffix
      - overrideReason
      - mallampatiClass
      - compositeRisk
      - recommendation
      - clinicianNotes
      - gradedAt
      description: 'Step 16: computed and signed-off grading result. Stores both the engine-computed ASA
        grade and the clinician-final grade with an override reason.'
    GradingAdditionalFlag:
      type: object
