components:
  schemas:
    Applicant:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        name:
          type: string
          description: Applicant full legal name.
        email:
          type:
          - string
          - 'null'
          description: Applicant email address.
        phone:
          type:
          - string
          - 'null'
          description: Applicant telephone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Applicant mailing address as free text.
        state:
          type: string
          maxLength: 2
          description: Two-letter US state or territory code of the mailing address.
        zipCode:
          type:
          - string
          - 'null'
          description: ZIP or ZIP+4 code of the mailing address.
      required:
      - createdAt
      - updatedAt
      - name
      - state
      description: Applicant (property owner) who files a United States residential property tax exemption
        application.
    Assessor:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        name:
          type: string
          description: Assessing official full name.
        email:
          type:
          - string
          - 'null'
          description: Assessor office email address.
        phone:
          type:
          - string
          - 'null'
          description: Assessor office telephone number.
        officeName:
          type: string
          description: Name of the assessing office, e.g. a county assessor or appraisal district.
        county:
          type: string
          description: County the office serves.
        state:
          type: string
          maxLength: 2
          description: Two-letter US state code the office is in.
        role:
          type: string
          enum:
          - assessor
          - deputy-assessor
          - appraiser
          - clerk
          - other
          - ''
          description: 'Role of the official: assessor, deputy-assessor, appraiser, clerk, or other.'
      required:
      - createdAt
      - updatedAt
      - name
      - officeName
      - county
      - state
      - role
      description: County assessing official who receives and decides the property tax exemption application.
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          description: A URI identifying the problem type
        title:
          type: string
          description: A short summary of the problem type
        status:
          type: integer
          description: The HTTP status code
        detail:
          type: string
          description: An explanation of this occurrence
        instance:
          type: string
          description: A URI identifying this occurrence
        code:
          type: string
          description: A short machine-readable reason
        errors:
          type: object
          description: Per-field detail, when validation failed
      required:
      - type
      - title
      - status
    PropertyTaxExemptionApplication:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        applicantId:
          type: string
          format: uuid
          description: Foreign key to the applicant.
        assessorId:
          type:
          - string
          - 'null'
          format: uuid
          description: Foreign key to the assessing official; null until assigned.
        applicantName:
          type: string
          description: Applicant name as written on the application.
        dateOfBirth:
          type:
          - string
          - 'null'
          format: date
          description: Applicant date of birth; used for the senior age test.
        ageOnAssessmentDate:
          type:
          - integer
          - 'null'
          format: int32
          description: Applicant age in whole years on the assessment date.
        mailingAddress:
          type: string
          description: Mailing address for notices about the application.
        state:
          type: string
          maxLength: 2
          description: Two-letter code of the state where the property is located; selects the state rule
            set.
        county:
          type: string
          description: County where the property is located.
        parcelNumber:
          type: string
          maxLength: 50
          description: Assessor parcel number (APN) or account number identifying the property.
        propertyAddress:
          type: string
          description: Street address of the property claiming the exemption.
        propertyType:
          type: string
          enum:
          - single-family
          - condominium
          - manufactured-home
          - multi-unit
          - other
          - ''
          description: 'Property type: single-family, condominium, manufactured-home, multi-unit, or other.'
        ownershipType:
          type: string
          enum:
          - sole
          - joint
          - trust
          - life-estate
          - contract-buyer
          - other
          - ''
          description: 'How the applicant holds title: sole, joint, trust, life-estate, contract-buyer,
            or other.'
        ownerOnAssessmentDate:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the applicant held title on the assessment (lien) date (yes/no).
        occupiedAsPrimaryResidence:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the applicant occupied the property as the primary residence on the assessment
            date (yes/no).
        occupancyStartDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the applicant began occupying the property as a primary residence.
        otherHomesteadClaimed:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether a homestead exemption is already claimed on another property (yes/no);
            only one is allowed.
        claimHomestead:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the general homestead exemption is claimed (yes/no).
        claimSenior:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether a senior (age-based) exemption or relief is claimed (yes/no).
        claimDisability:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether a disability exemption is claimed (yes/no).
        claimVeteran:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether a disabled-veteran exemption is claimed (yes/no).
        claimCircuitBreaker:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether circuit-breaker (income-based property tax relief) is claimed (yes/no).
        veteranDisabilityPercent:
          type:
          - integer
          - 'null'
          format: int32
          description: VA service-connected disability rating percent (0 to 100); null when not applicable.
        householdIncomeDollars:
          type:
          - integer
          - 'null'
          format: int32
          description: Total household income in whole US dollars for the income year.
        incomeTaxYear:
          type:
          - integer
          - 'null'
          format: int32
          description: Calendar year the reported household income covers.
        assessmentYear:
          type:
          - integer
          - 'null'
          format: int32
          description: Assessment or tax year the exemption is sought for.
        filingDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the application is filed with the assessor.
        applicationType:
          type: string
          enum:
          - initial
          - renewal
          - late
          - ''
          description: 'Application type: initial, renewal, or late (late-filing relief requested).'
        proofOfOwnership:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether proof of ownership (deed) is attached (yes/no).
        proofOfResidency:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether proof of residency (driver licence, voter or vehicle registration) is attached
            (yes/no).
        proofOfAge:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether proof of age is attached (yes/no).
        proofOfIncome:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether proof of income (tax return, benefit letter) is attached (yes/no).
        proofOfDisability:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether proof of disability or VA rating is attached (yes/no).
        appealRequested:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the applicant wants guidance on appealing the assessed value (yes/no).
        noticeOfValueDate:
          type:
          - string
          - 'null'
          format: date
          description: Date of the assessment or value notice, which starts the appeal window.
        appealFiled:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether an assessment appeal has already been filed (yes/no).
        penaltyAcknowledged:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the applicant acknowledged the penalty for a false statement (yes/no).
        signedByApplicant:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the applicant signed the declaration (yes/no).
        signatureDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the applicant signed the declaration.
      required:
      - createdAt
      - updatedAt
      - applicantId
      - applicantName
      - mailingAddress
      - state
      - county
      - parcelNumber
      - propertyAddress
      - propertyType
      - ownershipType
      - ownerOnAssessmentDate
      - occupiedAsPrimaryResidence
      - otherHomesteadClaimed
      - claimHomestead
      - claimSenior
      - claimDisability
      - claimVeteran
      - claimCircuitBreaker
      - applicationType
      - proofOfOwnership
      - proofOfResidency
      - proofOfAge
      - proofOfIncome
      - proofOfDisability
      - appealRequested
      - appealFiled
      - penaltyAcknowledged
      - signedByApplicant
      description: 'Main United States property tax exemption application: parcel, ownership and occupancy
        on the assessment date, exemptions claimed, income, proof documents, filing date, appeal basics
        and the signed declaration.'
    PropertyTaxExemptionApplicationGrade:
      type: object
      properties:
        id:
