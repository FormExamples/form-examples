          maxLength: 2
          description: Country as ISO 3166-1 alpha-2.
        postcode:
          type: string
          description: Postal code.
        role:
          type: string
          enum:
          - consultant-physician
          - specialty-registrar
          - foundation-trainee
          - general-practitioner
          - advanced-nurse-practitioner
          - nurse
          - paramedic
          - pharmacist
          - medical-student
          - other
          - ''
          description: 'Primary clinical role: consultant-physician, specialty-registrar, foundation-trainee,
            general-practitioner, advanced-nurse-practitioner, nurse, paramedic, pharmacist, medical-student,
            or other.'
        registration_body:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - GPhC
          - other
          - ''
          description: 'Professional registration body: GMC, NMC, HCPC, GPhC, or other.'
        registration_number:
          type: string
          description: Professional registration number issued by the registration body.
      required:
      - created_at
      - updated_at
      - name
      - role
      - registration_body
      - registration_number
      description: Clinician identifying information for the clinician who performed the CURB-65 assessment.
    Curb65PneumoniaSeverityScore:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        patient_id:
          type: string
          format: uuid
          description: Foreign key to the patient being assessed (delete restricted).
        clinician_id:
          type: string
          format: uuid
          description: Foreign key to the assessing clinician (optional; delete restricted).
        clinician_name:
          type: string
          maxLength: 255
          description: Name of the assessing clinician as recorded on the assessment.
        clinician_role:
          type: string
          enum:
          - physician
          - general-practitioner
          - advanced-nurse-practitioner
          - nurse
          - paramedic
          - pharmacist
          - other
          - ''
          description: 'Role of the assessing clinician: physician, general-practitioner, advanced-nurse-practitioner,
            nurse, paramedic, pharmacist, or other.'
        assessed_at:
          type: string
          format: date-time
          description: Date and time the assessment was performed.
        care_setting:
          type: string
          enum:
          - primary-care
          - emergency-department
          - acute-medical-unit
          - ward
          - community
          - other
          - ''
          description: 'Care setting: primary-care, emergency-department, acute-medical-unit, ward, community,
            or other.'
        patient_identifier:
          type: string
          maxLength: 100
          description: Local patient identifier as recorded on the assessment.
        sex:
          type: string
          enum:
          - female
          - male
          - intersex
          - unknown
          - ''
          description: 'Patient sex recorded for the assessment: female, male, intersex, or unknown.'
        age_years:
          type: integer
          format: int32
          description: Criterion A65 — patient age in years, derived from date of birth and confirmed
            at assessment; scores 1 when >= 65.
        confusion_present:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Criterion C — whether new-onset confusion is present: yes, no, or unanswered.'
        amt_score:
          type: integer
          format: int32
          description: Supporting evidence for confusion — Abbreviated Mental Test score (0-10); not scored
            directly.
        urea_measured:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether serum urea was measured; when no, the four-criterion CRB-65 fallback is
            computed instead of CURB-65.
        urea_mmol_l:
          type: number
          format: double
          description: Criterion U — serum urea in millimoles per litre (mmol/L); scores 1 when > 7.
        respiratory_rate:
          type: integer
          format: int32
          description: Criterion R — respiratory rate in breaths per minute; scores 1 when >= 30.
        systolic_bp:
          type: integer
          format: int32
          description: Criterion B — systolic blood pressure in mmHg; scores 1 when < 90 (or diastolic
            <= 60).
        diastolic_bp:
          type: integer
          format: int32
          description: Criterion B — diastolic blood pressure in mmHg; scores 1 when <= 60 (or systolic
            < 90).
        oxygen_saturation:
          type: integer
          format: int32
          description: Advisory adjunct — peripheral oxygen saturation (SpO2) as a percentage; not scored,
            raises the hypoxia flag when < 92.
        temperature_c:
          type: number
          format: double
          description: Advisory adjunct — body temperature in degrees Celsius; not scored.
        significant_comorbidity:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Advisory adjunct — whether a significant comorbidity is present: yes, no, or unanswered;
            not scored.'
        multilobar_changes:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Advisory adjunct — whether multilobar changes are present on chest imaging: yes,
            no, or unanswered; not scored.'
        clinician_override_band:
          type: string
          enum:
          - low
          - intermediate
          - high
          - ''
          description: 'Optional clinician-set final risk band overriding the computed band: low, intermediate,
            or high.'
        override_reason:
          type: string
          description: Documented reason for the clinician disposition override (mandatory when an override
            band is set).
        clinical_note:
          type: string
          description: Free-text clinical note recorded with the assessment.
      required:
      - created_at
      - updated_at
      - patient_id
      - clinician_name
      - clinician_role
      - care_setting
      - patient_identifier
      - sex
      - confusion_present
      - urea_measured
      - significant_comorbidity
      - multilobar_changes
      - clinician_override_band
      - override_reason
      - clinical_note
      description: 'Main CURB-65 pneumonia severity assessment record: assessment context, patient identification,
        the five scored criterion inputs (confusion, urea, respiratory rate, blood pressure, age), advisory
        adjuncts, and the clinician disposition override.'
    Curb65PneumoniaSeverityScoreGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the row was soft-deleted.
        curb_65_pneumonia_severity_score_id:
          type: string
          format: uuid
          description: Foreign key to the parent assessment (unique, 1:1).
        confusion_score:
          type: integer
          format: int32
          description: 'Criterion C sub-score (0 or 1): 1 when new-onset confusion is present.'
        urea_score:
          type: integer
          format: int32
          description: 'Criterion U sub-score (0 or 1): 1 when serum urea > 7 mmol/L; omitted in the CRB-65
            variant.'
        respiratory_rate_score:
          type: integer
          format: int32
          description: 'Criterion R sub-score (0 or 1): 1 when respiratory rate >= 30 breaths per minute.'
        blood_pressure_score:
          type: integer
          format: int32
          description: 'Criterion B sub-score (0 or 1): 1 when systolic < 90 or diastolic <= 60 mmHg.'
        age_score:
          type: integer
          format: int32
          description: 'Criterion A65 sub-score (0 or 1): 1 when age >= 65 years.'
        total_score:
          type: integer
          format: int32
          description: 'Summed severity score: 0-5 for the CURB-65 variant, 0-4 for the CRB-65 variant.'
        score_variant:
          type: string
          enum:
          - curb-65
          - crb-65
          - ''
          description: 'Which score variant produced the total: curb-65 (urea measured) or crb-65 (urea
            not measured).'
        risk_band:
          type: string
          enum:
          - low
          - intermediate
          - high
          - ''
          description: 'Derived mortality-risk band: low, intermediate, or high.'
        recommended_setting:
          type: string
          description: Recommended site-of-care disposition for the band (e.g. consider home/outpatient,
            short-stay/supervised, hospitalise).
        graded_at:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the grade.
      required:
      - created_at
      - updated_at
