        laterality:
          type: string
          enum:
          - left
          - right
          - bilateral
          - not-applicable
          - ''
          description: 'Laterality of the examination: left, right, bilateral, not-applicable.'
        examination_adequacy:
          type: string
          enum:
          - adequate
          - limited-body-habitus
          - non-diagnostic
          - ''
          description: 'Diagnostic adequacy of the examination: adequate, limited-body-habitus, non-diagnostic.'
        clinical_history:
          type: string
          maxLength: 1000
          description: Clinical history and the question the examination was performed to answer.
        comparison_with_previous:
          type: string
          maxLength: 1000
          description: Comparison with relevant previous imaging studies.
        findings_narrative:
          type: string
          maxLength: 2000
          description: Narrative description of the imaging findings (the body of the report).
        mass_or_lesion:
          type: boolean
          description: Whether a mass or focal solid lesion is present.
        cyst:
          type: boolean
          description: Whether a cyst (e.g. simple or complex cystic lesion) is present.
        gallstones:
          type: boolean
          description: Whether gallstones / cholelithiasis are present.
        hydronephrosis:
          type: boolean
          description: Whether hydronephrosis / urinary-tract dilatation is present.
        free_fluid:
          type: boolean
          description: Whether free fluid (e.g. ascites, pelvic free fluid) is present.
        dvt_present:
          type: boolean
          description: Whether deep vein thrombosis (DVT) is present on venous Doppler — a critical finding.
        aneurysm:
          type: boolean
          description: Whether an aneurysm (e.g. abdominal aortic aneurysm) is present; a ruptured / large
            AAA is a critical finding.
        organ_enlargement:
          type: boolean
          description: Whether organ enlargement (e.g. hepatomegaly, splenomegaly) is present.
        incidental_finding:
          type: boolean
          description: Whether one or more incidental findings warranting documentation are present.
        largest_lesion_size_mm:
          type: number
          format: double
          description: Largest lesion long-axis size in millimetres, for surveillance and categorisation.
        impression:
          type: string
          maxLength: 2000
          description: Summary impression / conclusion answering the clinical question.
        reporting_category:
          type: string
          maxLength: 50
          description: Free-text structured-reporting score / category label where applicable (e.g. an
            ACR TI-RADS level for thyroid, or a breast U-classification U1-U5).
        recommended_follow_up:
          type: string
          maxLength: 1000
          description: Recommended follow-up imaging, referral, or management.
        critical_result_communicated:
          type: boolean
          description: Whether a critical or unexpected significant result was communicated directly to
            the referrer.
        reported_to:
          type: string
          maxLength: 500
          description: Who the critical / urgent result was communicated to, with date and time if applicable.
      required:
      - created_at
      - updated_at
      - patient_id
      - clinician_id
      - originating_request_reference
      - report_status
      - body_region
      - laterality
      - examination_adequacy
      - clinical_history
      - comparison_with_previous
      - findings_narrative
      - mass_or_lesion
      - cyst
      - gallstones
      - hydronephrosis
      - free_fluid
      - dvt_present
      - aneurysm
      - organ_enlargement
      - incidental_finding
      - impression
      - reporting_category
      - recommended_follow_up
      - critical_result_communicated
      - reported_to
      description: General (non-obstetric) ultrasound result (report). Captures the performed examination
        (body region, laterality), diagnostic adequacy, clinical history, the narrative and structured
        findings, the largest lesion measurement, the impression, a free-text structured-reporting category
        (e.g. TI-RADS for thyroid, U-classification for breast), recommended follow-up, and critical-result
        communication. This is the source-of-truth record that the four-axis interpretation grade is computed
        from.
