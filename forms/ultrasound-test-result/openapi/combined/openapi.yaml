components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Name.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as full text.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code, such as for validating the postal address.
        role:
          type: string
          enum:
          - sonographer
          - radiologist
          - consultant
          - reporting-clinician
          - other
          - ''
          description: 'Reporting clinician role: sonographer, radiologist, consultant, reporting-clinician,
            other.'
        registrationBody:
          type: string
          enum:
          - GMC
          - HCPC
          - other
          - ''
          description: 'Clinician registration body: GMC, HCPC, other.'
        registrationNumber:
          type: string
          description: Clinician registration number.
        unitedKingdomNhsNumber:
          type:
          - string
          - 'null'
          maxLength: 12
          description: United Kingdom NHS number, unique per person.
      required:
      - createdAt
      - updatedAt
      - name
      - role
      - registrationBody
      - registrationNumber
      description: Reporting clinician (sonographer or radiologist) who performs / interprets and signs
        the ultrasound result report.
    Patient:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          maxLength: 255
          description: Name.
        birthDate:
          type: string
          format: date
          description: Birth date.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as full text.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code, such as for validating the postal address.
        unitedKingdomNhsNumber:
          type:
          - string
          - 'null'
          maxLength: 20
          description: United Kingdom NHS number, unique per person.
        waistAsCm:
          type:
          - number
          - 'null'
          format: double
          description: Waist circumference measurement in cm, such as for calculating waist-height ratio
            (WHR).
        heightAsCm:
          type:
          - number
          - 'null'
          format: double
          description: Height measurement in cm, such as for calculating waist-height ratio (WHR).
        weightAsKg:
          type:
          - number
          - 'null'
          format: double
          description: Weight as kg.
        bodyMassIndex:
          type:
          - number
          - 'null'
          format: double
          description: Body mass index (BMI) measurement.
        waistHeightRatio:
          type:
          - number
          - 'null'
          format: double
          description: Waist-height ratio (WHR) measurement.
        vo2Max:
          type:
          - number
          - 'null'
          format: double
          description: VO2 max measurement.
      required:
      - createdAt
      - updatedAt
      - name
      - birthDate
      description: Patient
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          description: A URI identifying the problem type
        title:
          type: string
          description: A short summary of the problem type
        status:
          type: integer
          description: The HTTP status code
        detail:
          type: string
          description: An explanation of this occurrence
        instance:
          type: string
          description: A URI identifying this occurrence
        code:
          type: string
          description: A short machine-readable reason
        errors:
          type: object
          description: Per-field detail, when validation failed
      required:
      - type
      - title
      - status
    UltrasoundTestResult:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the patient.
        clinicianId:
          type: string
          format: uuid
          description: Foreign key to the reporting clinician (sonographer / radiologist).
        originatingRequestReference:
          type: string
          maxLength: 255
          description: Free-text reference linking this report back to the originating ultrasound request
            (referral).
        reportStatus:
          type: string
          enum:
          - preliminary
          - final
          - amended
          - cancelled
          - ''
          description: 'Report lifecycle status: preliminary, final, amended, cancelled.'
        performedDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the ultrasound examination was performed.
        reportedDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the report was authored / signed.
        bodyRegion:
          type: string
          enum:
          - abdomen
          - pelvis
          - renal-tract
          - liver-biliary
          - thyroid-neck
          - scrotum-testes
          - breast
          - soft-tissue
          - vascular-doppler
          - dvt-leg
          - carotid
          - msk-joint
          - other
          - ''
          description: 'Examined ultrasound body region: abdomen, pelvis, renal-tract, liver-biliary,
            thyroid-neck, scrotum-testes, breast, soft-tissue, vascular-doppler, dvt-leg, carotid, msk-joint,
            other.'
        laterality:
          type: string
          enum:
          - left
          - right
          - bilateral
          - not-applicable
          - ''
          description: 'Laterality of the examination: left, right, bilateral, not-applicable.'
        examinationAdequacy:
          type: string
          enum:
          - adequate
          - limited-body-habitus
          - non-diagnostic
          - ''
          description: 'Diagnostic adequacy of the examination: adequate, limited-body-habitus, non-diagnostic.'
        clinicalHistory:
          type: string
          maxLength: 1000
          description: Clinical history and the question the examination was performed to answer.
        comparisonWithPrevious:
          type: string
          maxLength: 1000
          description: Comparison with relevant previous imaging studies.
        findingsNarrative:
          type: string
          maxLength: 2000
          description: Narrative description of the imaging findings (the body of the report).
        massOrLesion:
          type: boolean
          description: Whether a mass or focal solid lesion is present.
        cyst:
          type: boolean
          description: Whether a cyst (e.g. simple or complex cystic lesion) is present.
        gallstones:
          type: boolean
          description: Whether gallstones / cholelithiasis are present.
        hydronephrosis:
          type: boolean
          description: Whether hydronephrosis / urinary-tract dilatation is present.
        freeFluid:
          type: boolean
          description: Whether free fluid (e.g. ascites, pelvic free fluid) is present.
        dvtPresent:
          type: boolean
          description: Whether deep vein thrombosis (DVT) is present on venous Doppler — a critical finding.
        aneurysm:
          type: boolean
          description: Whether an aneurysm (e.g. abdominal aortic aneurysm) is present; a ruptured / large
            AAA is a critical finding.
        organEnlargement:
          type: boolean
          description: Whether organ enlargement (e.g. hepatomegaly, splenomegaly) is present.
        incidentalFinding:
          type: boolean
          description: Whether one or more incidental findings warranting documentation are present.
        largestLesionSizeMm:
          type:
          - number
          - 'null'
          format: double
          description: Largest lesion long-axis size in millimetres, for surveillance and categorisation.
        impression:
          type: string
          maxLength: 2000
          description: Summary impression / conclusion answering the clinical question.
        reportingCategory:
          type: string
          maxLength: 50
          description: Free-text structured-reporting score / category label where applicable (e.g. an
            ACR TI-RADS level for thyroid, or a breast U-classification U1-U5).
        recommendedFollowUp:
          type: string
          maxLength: 1000
          description: Recommended follow-up imaging, referral, or management.
        criticalResultCommunicated:
          type: boolean
          description: Whether a critical or unexpected significant result was communicated directly to
            the referrer.
        reportedTo:
          type: string
          maxLength: 500
          description: Who the critical / urgent result was communicated to, with date and time if applicable.
      required:
      - createdAt
      - updatedAt
      - patientId
      - clinicianId
      - originatingRequestReference
      - reportStatus
      - bodyRegion
      - laterality
      - examinationAdequacy
      - clinicalHistory
      - comparisonWithPrevious
      - findingsNarrative
      - massOrLesion
      - cyst
      - gallstones
      - hydronephrosis
      - freeFluid
      - dvtPresent
      - aneurysm
      - organEnlargement
      - incidentalFinding
      - impression
      - reportingCategory
      - recommendedFollowUp
      - criticalResultCommunicated
      - reportedTo
      description: General (non-obstetric) ultrasound result (report). Captures the performed examination
        (body region, laterality), diagnostic adequacy, clinical history, the narrative and structured
        findings, the largest lesion measurement, the impression, a free-text structured-reporting category
        (e.g. TI-RADS for thyroid, U-classification for breast), recommended follow-up, and critical-result
        communication. This is the source-of-truth record that the four-axis interpretation grade is computed
        from.
    UltrasoundTestResultGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        ultrasoundTestResultId:
          type: string
          format: uuid
          description: Foreign key to the parent result (unique, 1:1).
        resultClassification:
          type: string
          enum:
          - normal
          - abnormal
          - critical
          - inconclusive
          - ''
          description: 'Axis A overall classification: normal, abnormal, critical, inconclusive.'
        abnormalitySeverity:
          type: string
          enum:
          - none
          - minor
          - moderate
          - major
          - ''
          description: 'Axis B abnormality severity: none, minor, moderate, major.'
        reportingCategory:
          type: string
          maxLength: 50
          description: Axis B structured-reporting score / category label (e.g. an ACR TI-RADS level or
            breast U-classification).
        reportCompletenessPercent:
          type:
          - integer
          - 'null'
          format: int32
          description: Axis C report completeness as a percentage of mandatory report sections (0-100).
        followUpUrgency:
