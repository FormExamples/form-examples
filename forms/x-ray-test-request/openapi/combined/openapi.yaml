        referral_date:
          type: string
          format: date
          description: Date the referral was made.
        requested_by_date:
          type: string
          format: date
          description: Date by which the X-ray is requested to be performed.
        body_region:
          type: string
          enum:
          - chest
          - abdomen
          - spine-cervical
          - spine-thoracic
          - spine-lumbar
          - pelvis
          - hip
          - knee
          - ankle-foot
          - shoulder
          - wrist-hand
          - skull
          - dental
          - other
          - ''
          description: Body region to be imaged, used for appropriateness scoring and dose banding.
        laterality:
          type: string
          enum:
          - left
          - right
          - bilateral
          - not-applicable
          - ''
          description: 'Laterality of the requested region: left, right, bilateral, not-applicable.'
        primary_indication:
          type: string
          enum:
          - trauma-fracture
          - chest-infection
          - suspected-pneumothorax
          - foreign-body
          - joint-pain
          - arthritis
          - pre-operative
          - line-position-check
          - abdominal-obstruction
          - swallowed-object
          - follow-up
          - other
          - ''
          description: Primary clinical indication, used for appropriateness scoring.
        clinical_question:
          type: string
          maxLength: 1000
          description: Specific clinical question the X-ray should answer (highest-value field).
        relevant_history:
          type: string
          maxLength: 1000
          description: Relevant medical, surgical, and trauma history.
        pregnancy_status:
          type: string
          enum:
          - not-pregnant
          - pregnant
          - possible
          - unknown
          - not-applicable
          - ''
          description: 'Patient pregnancy status for radiation safety: not-pregnant, pregnant, possible,
            unknown, not-applicable.'
        recent_similar_xray:
          type: boolean
          description: Whether a similar X-ray of the same region was recently performed (repeat-exposure
            check).
        mobility:
          type: string
          enum:
          - ambulant
          - wheelchair
          - trolley
          - ''
          description: 'Patient mobility for the examination: ambulant, wheelchair, trolley.'
        urgency:
          type: string
          enum:
          - routine
          - urgent
          - emergency
          - ''
          description: 'Requested triage urgency: routine, urgent, emergency.'
        ir_me_r_justification:
          type: string
          maxLength: 1000
          description: Referrer justification for the exposure under IR(ME)R 2017 (benefit weighed against
            radiation detriment).
        supervising_consultant:
          type: string
          maxLength: 255
          description: Name of the supervising / responsible consultant.
        requester_contact:
          type: string
          maxLength: 255
          description: Contact details (bleep / phone) for the requester.
        notes:
          type: string
          maxLength: 1000
          description: Free-text additional notes.
      required:
      - created_at
      - updated_at
      - patient_id
      - clinician_id
      - status
      - site_name
      - setting
      - body_region
      - laterality
      - primary_indication
      - clinical_question
      - relevant_history
      - pregnancy_status
      - recent_similar_xray
      - mobility
      - urgency
      - ir_me_r_justification
      - supervising_consultant
      - requester_contact
      - notes
      description: Plain-radiograph (X-ray) imaging request (referral). Captures the requested body region
