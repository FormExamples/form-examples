components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Name.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as full text.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code, such as for validating the postal address.
        role:
          type: string
          enum:
          - gp
          - hospital-doctor
          - emergency-physician
          - toxicologist
          - nurse
          - other
          - ''
          description: 'Clinician role: gp, hospital-doctor, emergency-physician, toxicologist, nurse,
            other.'
        registrationBody:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - other
          - ''
          description: 'Clinician registration body: GMC, NMC, HCPC, other.'
        registrationNumber:
          type: string
          description: Clinician registration number.
        unitedKingdomNhsNumber:
          type:
          - string
          - 'null'
          maxLength: 12
          description: United Kingdom NHS number, unique per person.
      required:
      - createdAt
      - updatedAt
      - name
      - role
      - registrationBody
      - registrationNumber
      description: Requesting clinician (referrer) who completes the toxicology test request.
    Patient:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          maxLength: 255
          description: Name.
        birthDate:
          type: string
          format: date
          description: Birth date.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as full text.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code, such as for validating the postal address.
        unitedKingdomNhsNumber:
          type:
          - string
          - 'null'
          maxLength: 20
          description: United Kingdom NHS number, unique per person.
        waistAsCm:
          type:
          - number
          - 'null'
          format: double
          description: Waist circumference measurement in cm, such as for calculating waist-height ratio
            (WHR).
        heightAsCm:
          type:
          - number
          - 'null'
          format: double
          description: Height measurement in cm, such as for calculating waist-height ratio (WHR).
        weightAsKg:
          type:
          - number
          - 'null'
          format: double
          description: Weight as kg.
        bodyMassIndex:
          type:
          - number
          - 'null'
          format: double
          description: Body mass index (BMI) measurement.
        waistHeightRatio:
          type:
          - number
          - 'null'
          format: double
          description: Waist-height ratio (WHR) measurement.
        vo2Max:
          type:
          - number
          - 'null'
          format: double
          description: VO2 max measurement.
      required:
      - createdAt
      - updatedAt
      - name
      - birthDate
      description: Patient
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          description: A URI identifying the problem type
        title:
          type: string
          description: A short summary of the problem type
        status:
          type: integer
          description: The HTTP status code
        detail:
          type: string
          description: An explanation of this occurrence
        instance:
          type: string
          description: A URI identifying this occurrence
        code:
          type: string
          description: A short machine-readable reason
        errors:
          type: object
          description: Per-field detail, when validation failed
      required:
      - type
      - title
      - status
    ToxicologyTestRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the patient.
        clinicianId:
          type: string
          format: uuid
          description: Foreign key to the requesting clinician (referrer).
        status:
          type: string
          enum:
          - draft
          - submitted
          - vetted
          - collected
          - rejected
          - ''
          description: 'Request lifecycle status: draft, submitted, vetted, collected, rejected.'
        siteName:
          type: string
          maxLength: 255
          description: Name of the requesting site or clinic.
        setting:
          type: string
          enum:
          - outpatient
          - inpatient
          - community
          - emergency
          - ''
          description: 'Care setting: outpatient, inpatient, community, emergency.'
        referralDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the request was made.
        requestedByDate:
          type:
          - string
          - 'null'
          format: date
          description: Date by which the test is requested to be performed.
        paracetamolLevel:
          type: boolean
          description: Whether a paracetamol (acetaminophen) level is requested. Interpretable on the
            treatment nomogram only at >=4 h post-ingestion.
        salicylateLevel:
          type: boolean
          description: Whether a salicylate (aspirin) level is requested.
        alcoholLevel:
          type: boolean
          description: Whether a blood alcohol (ethanol) level is requested.
        drugsOfAbuseScreen:
          type: boolean
          description: Whether a drugs-of-abuse screen (e.g. opiates, benzodiazepines, cocaine, amphetamines)
            is requested.
        lithiumLevel:
          type: boolean
          description: Whether a lithium level is requested.
        digoxinLevel:
          type: boolean
          description: Whether a digoxin level is requested.
        antiepilepticDrugLevel:
          type: boolean
          description: Whether an antiepileptic drug level (e.g. phenytoin, carbamazepine, valproate)
            is requested.
        carboxyhaemoglobin:
          type: boolean
          description: Whether a carboxyhaemoglobin (COHb, carbon-monoxide exposure) level is requested.
        heavyMetals:
          type: boolean
          description: Whether a heavy-metals screen (e.g. lead, mercury, arsenic) is requested.
        specificDrugLevel:
          type: boolean
          description: Whether a specific (named) drug level is requested; the named agent is given in
            suspected_agent.
        primaryIndication:
          type: string
          enum:
          - suspected-overdose
          - deliberate-self-harm
          - therapeutic-drug-monitoring
          - suspected-poisoning
          - substance-misuse-screen
          - occupational-screen
          - forensic
          - other
          - ''
          description: 'Primary clinical indication, used for appropriateness scoring: suspected-overdose,
            deliberate-self-harm, therapeutic-drug-monitoring, suspected-poisoning, substance-misuse-screen,
            occupational-screen, forensic, other.'
        clinicalDetails:
          type: string
          maxLength: 1000
          description: Clinical details / history supporting the request (highest-value completeness field).
        suspectedAgent:
          type: string
          maxLength: 255
          description: Suspected toxic agent or named drug, free text.
        timeSinceIngestionHours:
          type:
          - number
          - 'null'
          format: double
          description: Hours since ingestion, used for timing appropriateness (e.g. paracetamol nomogram
            requires >=4 h).
        deliberateOverdose:
          type: boolean
          description: Whether the exposure is a deliberate overdose (triggers safeguarding / triage escalation).
        symptomatic:
          type: boolean
          description: Whether the patient is currently symptomatic from the exposure.
        specimenCollected:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Whether the specimen has been collected: yes, no.'
        collectionDatetime:
          type:
          - string
          - 'null'
          format: date-time
          description: Timestamp when the specimen was collected.
        urgency:
          type: string
          enum:
          - routine
          - urgent
          - stat
          - ''
          description: 'Requested triage urgency: routine, urgent, stat.'
        supervisingConsultant:
          type: string
          maxLength: 255
          description: Name of the supervising / responsible consultant.
        requesterContact:
          type: string
          maxLength: 255
          description: Contact details (bleep / phone) for the requester.
        notes:
          type: string
          maxLength: 1000
          description: Free-text additional notes.
      required:
      - createdAt
      - updatedAt
      - patientId
      - clinicianId
      - status
      - siteName
      - setting
      - paracetamolLevel
      - salicylateLevel
      - alcoholLevel
      - drugsOfAbuseScreen
      - lithiumLevel
      - digoxinLevel
      - antiepilepticDrugLevel
      - carboxyhaemoglobin
      - heavyMetals
      - specificDrugLevel
      - primaryIndication
      - clinicalDetails
      - suspectedAgent
      - deliberateOverdose
      - symptomatic
      - specimenCollected
      - urgency
      - supervisingConsultant
      - requesterContact
      - notes
      description: Toxicology / poisons / therapeutic-drug-level blood-test request. Captures the requested
        assays (booleans), the clinical indication and details, suspected agent and ingestion timing,
        specimen handling, and triage urgency.
    ToxicologyTestRequestGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        toxicologyTestRequestId:
          type: string
          format: uuid
          description: Foreign key to the parent request (unique, 1:1).
        appropriatenessScore:
          type:
          - integer
          - 'null'
          format: int32
          description: Appropriateness score (1-9). No single published toxicology-ordering score exists;
            anchored on TOXBASE / NPIS guidance and indication-to-assay match. Decision support only.
        appropriatenessBand:
          type: string
          enum:
          - usually-appropriate
          - may-be-appropriate
          - usually-not-appropriate
          - ''
          description: 'Appropriateness band: usually-appropriate (7-9), may-be-appropriate (4-6), usually-not-appropriate
            (1-3).'
        timingBand:
          type: string
          enum:
          - ok
          - caution
          - invalid
          - ''
          description: 'Timing validity band: ok, caution, invalid. E.g. a paracetamol level taken <4
