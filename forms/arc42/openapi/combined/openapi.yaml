        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        architecture_id:
          type: string
          format: uuid
          description: Parent architecture (cascade-deleted).
        author_name:
          type: string
          description: Name of the person who authored this documentation snapshot.
        author_role:
          type: string
          description: Role of the author (e.g. Lead Architect, Tech Lead).
        document_date:
          type: string
          format: date
          description: Date this documentation snapshot was produced.
        introduction:
          type: string
          description: §1 Introduction & Goals — free-text introduction to the architecture.
        business_context_description:
          type: string
          description: §3 Context & Scope — prose description of the business context and external business
            partners.
        technical_context_description:
          type: string
          description: §3 Context & Scope — prose description of the technical context and external interfaces.
        solution_strategy_summary:
          type: string
          description: §4 Solution Strategy — summary of the key solution strategy decisions.
        top_level_decomposition_summary:
          type: string
          description: §4 Solution Strategy — prose summary of the top-level system decomposition approach.
        building_block_overview:
          type: string
          description: §5 Building Block View — prose overview of the top-level building block structure.
        runtime_overview:
          type: string
          description: §6 Runtime View — prose overview of the key runtime scenarios.
        deployment_overview:
          type: string
          description: §7 Deployment View — prose overview of the deployment environment and topology.
        crosscutting_overview:
          type: string
          description: §8 Crosscutting Concepts — prose overview of shared architectural patterns and
            constraints.
        quality_tree_summary:
          type: string
          description: §10 Quality Requirements — prose summary of the quality attribute tree.
        recommendation:
          type: string
          enum:
          - proceed
          - revise-first
          - block
          - ''
          description: '§12 Sign-off — author recommendation: proceed, revise-first, or block.'
        additional_notes:
          type: string
          description: §12 Sign-off — free-text additional notes from the author.
        signed_by:
