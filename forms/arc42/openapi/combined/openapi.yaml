                $ref: '#/components/schemas/Problem'
  /api/technology_decisions/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      summary: Fetch one TechnologyDecision by id
      operationId: getTechnologyDecision
      responses:
        '200':
          description: The requested TechnologyDecision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TechnologyDecision'
        '404':
          description: TechnologyDecision not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    patch:
      summary: Update an existing TechnologyDecision
      operationId: updateTechnologyDecision
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TechnologyDecision'
      responses:
        '200':
          description: The updated TechnologyDecision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TechnologyDecision'
        '404':
          description: TechnologyDecision not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: The body does not match the schema
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    delete:
      summary: Delete a TechnologyDecision
      operationId: deleteTechnologyDecision
      responses:
        '200':
          description: TechnologyDecision deleted
        '404':
          description: TechnologyDecision not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
