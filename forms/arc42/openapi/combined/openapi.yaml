components:
  schemas:
    Arc42Documentation:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        architecture_id:
          type: string
          format: uuid
          description: Parent architecture (cascade-deleted).
        author_name:
          type: string
          description: Name of the person who authored this documentation snapshot.
        author_role:
          type: string
          description: Role of the author (e.g. Lead Architect, Tech Lead).
        document_date:
          type: string
          format: date
          description: Date this documentation snapshot was produced.
        introduction:
          type: string
          description: §1 Introduction & Goals — free-text introduction to the architecture.
        business_context_description:
          type: string
          description: §3 Context & Scope — prose description of the business context and external business
            partners.
        technical_context_description:
          type: string
          description: §3 Context & Scope — prose description of the technical context and external interfaces.
        solution_strategy_summary:
          type: string
          description: §4 Solution Strategy — summary of the key solution strategy decisions.
        top_level_decomposition_summary:
          type: string
          description: §4 Solution Strategy — prose summary of the top-level system decomposition approach.
        building_block_overview:
          type: string
          description: §5 Building Block View — prose overview of the top-level building block structure.
        runtime_overview:
          type: string
          description: §6 Runtime View — prose overview of the key runtime scenarios.
        deployment_overview:
          type: string
          description: §7 Deployment View — prose overview of the deployment environment and topology.
        crosscutting_overview:
          type: string
          description: §8 Crosscutting Concepts — prose overview of shared architectural patterns and
            constraints.
        quality_tree_summary:
          type: string
          description: §10 Quality Requirements — prose summary of the quality attribute tree.
        recommendation:
          type: string
          enum:
          - proceed
          - revise-first
          - block
          - ''
          description: '§12 Sign-off — author recommendation: proceed, revise-first, or block.'
        additional_notes:
          type: string
          description: §12 Sign-off — free-text additional notes from the author.
        signed_by:
          type: string
          description: §12 Sign-off — name of the person who signed off the documentation.
        signed_at:
          type: string
          format: date-time
          description: §12 Sign-off — timestamp when the documentation was signed off.
      required:
      - created_at
      - updated_at
      - architecture_id
      - author_name
      - author_role
      - introduction
      - business_context_description
      - technical_context_description
      - solution_strategy_summary
      - top_level_decomposition_summary
      - building_block_overview
      - runtime_overview
      - deployment_overview
      - crosscutting_overview
      - quality_tree_summary
      - recommendation
      - additional_notes
      - signed_by
      description: Snapshot of arc42 architecture documentation (prose fields and metadata).
    Arc42DocumentationGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        arc42_documentation_id:
          type: string
          format: uuid
          description: Parent documentation (1:1, cascade-deleted).
        computed_maturity:
          type: string
          enum:
          - draft
          - reviewable
          - ready
          - mature
          - ''
          description: 'Maturity band computed by the scoring engine: draft, reviewable, ready, or mature.'
        final_maturity:
          type: string
          enum:
          - draft
          - reviewable
          - ready
          - mature
          - ''
          description: Final maturity band after any author override; equals computed_maturity when no
            override is applied.
        override_reason:
          type: string
          description: Author-provided reason when final_maturity differs from computed_maturity.
        completeness_section_1:
          type: string
          enum:
          - empty
          - partial
          - complete
          - ''
          description: '§1 Introduction & Goals completeness: empty, partial, or complete.'
        completeness_section_2:
          type: string
          enum:
          - empty
          - partial
          - complete
          - ''
          description: '§2 Constraints completeness: empty, partial, or complete.'
        completeness_section_3:
          type: string
          enum:
          - empty
          - partial
          - complete
          - ''
          description: '§3 Context & Scope completeness: empty, partial, or complete.'
        completeness_section_4:
          type: string
          enum:
          - empty
          - partial
          - complete
          - ''
          description: '§4 Solution Strategy completeness: empty, partial, or complete.'
        completeness_section_5:
          type: string
          enum:
          - empty
          - partial
          - complete
          - ''
          description: '§5 Building Block View completeness: empty, partial, or complete.'
        completeness_section_6:
          type: string
          enum:
          - empty
          - partial
          - complete
          - ''
          description: '§6 Runtime View completeness: empty, partial, or complete.'
        completeness_section_7:
          type: string
          enum:
          - empty
          - partial
          - complete
          - ''
          description: '§7 Deployment View completeness: empty, partial, or complete.'
        completeness_section_8:
          type: string
          enum:
          - empty
          - partial
          - complete
          - ''
          description: '§8 Crosscutting Concepts completeness: empty, partial, or complete.'
        completeness_section_9:
          type: string
          enum:
          - empty
          - partial
          - complete
          - ''
          description: '§9 Architectural Decisions completeness: empty, partial, or complete.'
        completeness_section_10:
          type: string
          enum:
          - empty
          - partial
          - complete
          - ''
          description: '§10 Quality Requirements completeness: empty, partial, or complete.'
        completeness_section_11:
          type: string
          enum:
          - empty
          - partial
          - complete
          - ''
          description: '§11 Risks & Technical Debt completeness: empty, partial, or complete.'
        completeness_section_12:
          type: string
          enum:
          - empty
          - partial
          - complete
          - ''
          description: '§12 Glossary completeness: empty, partial, or complete.'
      required:
      - created_at
      - updated_at
      - arc42_documentation_id
      - computed_maturity
      - final_maturity
      - override_reason
      - completeness_section_1
      - completeness_section_2
      - completeness_section_3
      - completeness_section_4
      - completeness_section_5
      - completeness_section_6
      - completeness_section_7
      - completeness_section_8
      - completeness_section_9
      - completeness_section_10
      - completeness_section_11
      - completeness_section_12
      description: 'Grading result for an arc42 documentation snapshot: computed and final maturity band
        plus per-section completeness.'
    Arc42DocumentationGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        arc42_documentation_grade_id:
          type: string
          format: uuid
          description: Parent grade record (cascade-deleted).
        ordinal:
          type: integer
          format: int32
          description: Display/order index within the parent grade record.
        category:
          type: string
          description: Category of the flag (e.g. missing-stakeholders, insufficient-adrs, no-deployment-view).
        priority:
          type: string
          enum:
          - high
          - medium
          - low
          - ''
          description: 'Priority of the flag: high, medium, or low.'
        description:
          type: string
          description: Human-readable description of the architectural omission or concern flagged.
      required:
      - created_at
      - updated_at
      - arc42_documentation_grade_id
      - ordinal
      - category
      - priority
      - description
      description: Additional flag fired during arc42 documentation grading, independent of the maturity
        band.
    Arc42DocumentationGradeRule:
      type: object
      properties:
