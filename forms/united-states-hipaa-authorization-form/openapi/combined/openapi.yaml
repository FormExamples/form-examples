      responses:
        '201':
          description: The newly created ValidationResult
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResult'
        '400':
          description: Validation error
  /validation-results/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      summary: Fetch one ValidationResult by id
      operationId: getValidationResult
      responses:
        '200':
          description: The requested ValidationResult
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResult'
        '404':
          description: ValidationResult not found
    patch:
      summary: Update an existing ValidationResult
      operationId: updateValidationResult
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidationResult'
      responses:
        '200':
          description: The updated ValidationResult
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResult'
        '404':
          description: ValidationResult not found
    delete:
      summary: Soft-delete a ValidationResult
      operationId: deleteValidationResult
      responses:
        '204':
          description: ValidationResult deleted
        '404':
          description: ValidationResult not found
components:
  schemas:
    AuthorizedRecipient:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when this row was deleted.
        hipaa_authorization_id:
          type: string
          format: uuid
          description: Foreign key to the parent HIPAA authorization (unique, enforcing 1:1).
        recipient_name:
          type: string
          maxLength: 255
          description: Full name of the authorized recipient (individual or organisation contact).
        recipient_organization:
          type: string
          maxLength: 255
          description: Organisation the recipient belongs to (e.g. "Tennessee Department of Human Services").
        recipient_role:
          type: string
          maxLength: 255
          description: Professional role or title of the recipient.
        recipient_address:
          type: string
          description: Postal address of the recipient.
        recipient_phone:
          type: string
          maxLength: 30
          description: Phone number of the recipient.
        recipient_email:
          type: string
          maxLength: 255
          description: Email address of the recipient.
        recipient_relationship_to_patient:
          type: string
          enum:
          - ''
          - health-plan
          - state-agency
          - employer
          - attorney
          - researcher
          - family-member
          - self
          - health-care-provider
          - other
          description: 'Recipient relationship: health-plan, state-agency, employer, attorney, researcher,
            family-member, self, health-care-provider, other, or empty.'
      required:
      - created_at
      - updated_at
      - hipaa_authorization_id
      - recipient_name
      - recipient_organization
      - recipient_role
      - recipient_address
      - recipient_phone
      - recipient_email
      - recipient_relationship_to_patient
      description: Person(s) or class of persons to whom the disclosure may be made. One-to-one child
        of hipaa_authorization. Required by 45 CFR § 164.508(c)(1)(iii).
    DisclosingSource:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when this row was deleted.
        hipaa_authorization_id:
          type: string
          format: uuid
          description: Foreign key to the parent HIPAA authorization (unique, enforcing 1:1).
        identification_mode:
          type: string
          enum:
          - ''
          - specific
          - class
          description: 'Whether the disclosing source is identified specifically or as a class: specific,
            class, or empty.'
        specific_persons_or_organizations:
          type: string
          description: Free-text list of the specific persons or organizations holding the records. Used
            when identification_mode is specific.
        class_description:
          type: string
          description: Free-text description of the class of persons (e.g. "doctors, hospitals, clinics,
            nursing homes, …"). Used when identification_mode is class.
        is_va_facility:
          type: string
          enum:
          - ''
          - 'yes'
          - 'no'
          description: 'Whether the disclosing source is a US Department of Veterans Affairs facility:
            yes, no, or empty. Triggers the 38 U.S.C. § 7332 rule when yes.'
        is_part_2_program:
          type: string
          enum:
          - ''
          - 'yes'
          - 'no'
          description: 'Whether the disclosing source is a federally assisted substance-use-disorder program
            subject to 42 CFR Part 2: yes, no, or empty.'
      required:
      - created_at
      - updated_at
      - hipaa_authorization_id
      - identification_mode
      - specific_persons_or_organizations
      - class_description
      - is_va_facility
      - is_part_2_program
      description: Person(s) or class of persons authorized to make the disclosure. One-to-one child of
        hipaa_authorization. Required by 45 CFR § 164.508(c)(1)(ii).
    Expiration:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when this row was deleted.
        hipaa_authorization_id:
          type: string
          format: uuid
          description: Foreign key to the parent HIPAA authorization (unique, enforcing 1:1).
        kind:
          type: string
          enum:
          - ''
          - date
          - event
          - duration
          description: 'Expiration mechanism: date, event, duration, or empty if unanswered.'
        expiration_date:
          type: string
          format: date
          description: Calendar expiration date (used when kind is date).
        expiration_event:
          type: string
          description: Free-text expiration event (e.g. "upon conclusion of my claim"). Used when kind
            is event. Cannot be the string "none".
        duration_months:
          type: integer
          format: int32
          description: Validity duration in months from signature (e.g. 12). Used when kind is duration.
        duration_label:
          type: string
          maxLength: 80
          description: Human-readable duration label (e.g. "12 months from signature").
      required:
      - created_at
      - updated_at
      - hipaa_authorization_id
      - kind
      - expiration_event
      - duration_label
      description: Expiration date or expiration event for the authorization. One-to-one child of hipaa_authorization.
        Required by 45 CFR § 164.508(c)(1)(v); the string "none" is not permitted (except for research).
    HipaaAuthorization:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when this row was deleted.
        patient_id:
          type: string
          format: uuid
          description: Foreign key to the patient who is authorising the disclosure.
        status:
          type: string
          enum:
          - draft
          - submitted
          - valid
          - invalid
          - expired
          - revoked
          description: 'Lifecycle status: draft, submitted, valid, invalid, expired, or revoked.'
        state_template:
          type: string
          enum:
          - ''
          - tn-hs-2557
          - pa-hs-1549
          - hhs-ocr-sample
          - custom
          description: Source state template the authorization was generated from. Empty when not derived
            from a known template.
        revoked_at:
          type: string
          format: date-time
          description: Timestamp when the patient revoked the authorization (NULL if not revoked).
        revocation_method:
          type: string
          enum:
          - ''
          - written
          - electronic
          - in-person
          description: 'Method of revocation: written, electronic, in-person, or empty if not revoked.'
      required:
      - created_at
      - updated_at
      - patient_id
      - status
      - state_template
      - revocation_method
      description: Parent entity for a single HIPAA authorization document. Every other section table
        is a one-to-one or one-to-many child.
    Patient:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when this row was deleted (soft-delete).
        name:
          type: string
          maxLength: 255
          description: Patient print name, as it appears on the signed authorization.
        birth_date:
          type: string
          format: date
          description: Date of birth. Required by 45 CFR § 164.508(c)(1)(vi) for identity-binding the
            signature.
        social_security_number:
          type: string
          maxLength: 11
          description: Social Security Number, optional. State templates such as TN HS-2557 mark this
            as "not required". Format NNN-NN-NNNN.
        street_address:
          type: string
          description: Street address line.
        city:
          type: string
          maxLength: 120
          description: City.
        state:
          type: string
          maxLength: 2
          description: US state two-letter abbreviation (e.g. TN, PA, CA).
        zip_code:
          type: string
          maxLength: 10
          description: US ZIP code (5 or 9 digit).
        phone:
          type: string
          maxLength: 30
          description: Phone number including area code.
        email:
          type: string
          maxLength: 255
          description: Email address, optional.
      required:
      - created_at
      - updated_at
      - name
      - social_security_number
      - street_address
      - city
      - state
      - zip_code
      - phone
      - email
      description: Patient identification fields for the HIPAA authorization form.
    PatientRightsAcknowledgement:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when this row was deleted.
        hipaa_authorization_id:
          type: string
          format: uuid
          description: Foreign key to the parent HIPAA authorization (unique, enforcing 1:1).
        acknowledged_right_to_revoke:
          type: string
          enum:
          - ''
          - 'yes'
          - 'no'
          description: 'Patient acknowledged the right to revoke the authorization in writing per § 164.508(c)(2)(i):
            yes, no, or empty.'
        acknowledged_revocation_procedure:
          type: string
          enum:
          - ''
          - 'yes'
          - 'no'
          description: 'Patient acknowledged the procedure for revocation and any exceptions: yes, no,
            or empty.'
        acknowledged_no_conditioning:
          type: string
          enum:
          - ''
          - 'yes'
          - 'no'
          description: 'Patient acknowledged that treatment, payment, enrolment, or eligibility are not
            conditioned on signing per § 164.508(c)(2)(ii): yes, no, or empty.'
        acknowledged_redisclosure_warning:
          type: string
          enum:
          - ''
          - 'yes'
          - 'no'
          description: 'Patient acknowledged the potential for the disclosed information to be re-disclosed
            and no longer protected per § 164.508(c)(2)(iii): yes, no, or empty.'
        acknowledged_right_to_copy:
          type: string
          enum:
          - ''
          - 'yes'
          - 'no'
          description: 'Patient acknowledged the right to receive a copy of the signed authorization per
            § 164.508(c)(4): yes, no, or empty.'
        acknowledged_right_to_inspect_disclosed:
          type: string
          enum:
          - ''
          - 'yes'
          - 'no'
          description: 'Patient acknowledged the right to inspect and copy the information that is disclosed:
            yes, no, or empty.'
      required:
      - created_at
      - updated_at
      - hipaa_authorization_id
      - acknowledged_right_to_revoke
      - acknowledged_revocation_procedure
      - acknowledged_no_conditioning
      - acknowledged_redisclosure_warning
      - acknowledged_right_to_copy
      - acknowledged_right_to_inspect_disclosed
      description: Patient acknowledgement of HIPAA-required statements. One-to-one child of hipaa_authorization.
        Required by 45 CFR § 164.508(c)(2).
    PurposeOfDisclosure:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when this row was deleted.
        hipaa_authorization_id:
          type: string
          format: uuid
          description: Foreign key to the parent HIPAA authorization (unique, enforcing 1:1).
        purposes:
          type: string
          description: Array of purpose identifiers (multiple purposes are permitted).
        primary_purpose:
          type: string
          enum:
          - ''
          - eligibility-determination
          - continuing-treatment
          - insurance-claim
          - legal-proceeding
          - disability-application
          - personal-use
          - research
          - employment
          - at-the-request-of-the-individual
          - other
          description: 'Primary purpose: eligibility-determination, continuing-treatment, insurance-claim,
            legal-proceeding, disability-application, personal-use, research, employment, at-the-request-of-the-individual,
            other, or empty.'
        other_details:
          type: string
          description: Free-text details when primary_purpose is other. Must not be empty when primary_purpose
            is other.
      required:
      - created_at
      - updated_at
      - hipaa_authorization_id
      - purposes
      - primary_purpose
      - other_details
      description: Description of each purpose of the requested use or disclosure. One-to-one child of
        hipaa_authorization. Required by 45 CFR § 164.508(c)(1)(iv).
    RecordsToDisclose:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when this row was deleted.
        hipaa_authorization_id:
          type: string
          format: uuid
          description: Foreign key to the parent HIPAA authorization (unique, enforcing 1:1).
        include_medical_health:
          type: string
          enum:
          - ''
          - 'yes'
          - 'no'
          description: 'Include general medical / health records: yes, no, or empty.'
        medical_health_initials:
          type: string
          maxLength: 8
          description: Patient initials authorising release of general medical / health records.
        include_mental_health:
          type: string
          enum:
          - ''
          - 'yes'
          - 'no'
          description: 'Include mental-health records: yes, no, or empty.'
        mental_health_initials:
          type: string
          maxLength: 8
          description: Patient initials authorising release of mental-health records.
        include_substance_use:
          type: string
          enum:
          - ''
          - 'yes'
          - 'no'
          description: 'Include drug or alcohol treatment / referral records: yes, no, or empty.'
        substance_use_initials:
          type: string
          maxLength: 8
          description: Patient initials authorising release of substance-use records.
        part2_redisclosure_notice_included:
          type: string
          enum:
          - ''
          - 'yes'
          - 'no'
          description: 'Whether the 42 CFR Part 2 prohibition-on-redisclosure notice is included with
            the disclosure: yes, no, or empty.'
        include_hiv_aids:
          type: string
          enum:
          - ''
          - 'yes'
          - 'no'
          description: 'Include HIV / AIDS test or treatment records: yes, no, or empty.'
        hiv_aids_initials:
          type: string
          maxLength: 8
          description: Patient initials authorising release of HIV / AIDS records.
        hiv_aids_state_consent_included:
          type: string
          enum:
          - ''
          - 'yes'
          - 'no'
          description: 'Whether the state-specific HIV / AIDS consent language is included: yes, no, or
            empty.'
        include_psychotherapy_notes:
          type: string
          enum:
          - ''
          - 'yes'
          - 'no'
          description: 'Include psychotherapy notes: yes, no, or empty. § 164.508(a)(2) requires these
            to be authorised on a separate form.'
        include_genetic_information:
          type: string
          enum:
          - ''
          - 'yes'
          - 'no'
          description: 'Include genetic information: yes, no, or empty. Subject to GINA downstream-use
            restrictions.'
        include_reproductive_health:
          type: string
          enum:
          - ''
          - 'yes'
          - 'no'
          description: 'Include reproductive-health-care records: yes, no, or empty. Subject to the HHS
            2024 reproductive-health-privacy rule.'
        section_7332_notice_included:
          type: string
          enum:
          - ''
          - 'yes'
          - 'no'
          description: 'Whether the 38 U.S.C. § 7332 notice is included (for VA records): yes, no, or
            empty.'
        date_range_specified:
          type: string
          enum:
          - ''
          - 'yes'
          - 'no'
          description: 'Whether the patient has restricted disclosure to a specific date range: yes, no,
            or empty.'
        date_from:
          type: string
          format: date
          description: Start date of the disclosed records (NULL if no date range).
        date_to:
          type: string
          format: date
          description: End date of the disclosed records (NULL if no date range). Must be >= date_from
            when both are set.
        other_description:
          type: string
          description: Free-text description of any other PHI to be disclosed. Required to be specific
            enough to satisfy § 164.508(c)(1)(i).
      required:
      - created_at
      - updated_at
      - hipaa_authorization_id
      - include_medical_health
      - medical_health_initials
      - include_mental_health
      - mental_health_initials
      - include_substance_use
      - substance_use_initials
      - part2_redisclosure_notice_included
      - include_hiv_aids
      - hiv_aids_initials
      - hiv_aids_state_consent_included
      - include_psychotherapy_notes
      - include_genetic_information
      - include_reproductive_health
      - section_7332_notice_included
      - date_range_specified
      - other_description
      description: Specific and meaningful description of the PHI to be disclosed. One-to-one child of
        hipaa_authorization. Required by 45 CFR § 164.508(c)(1)(i).
    SignatureWitness:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when this row was deleted.
        hipaa_authorization_id:
          type: string
          format: uuid
          description: Foreign key to the parent HIPAA authorization (unique, enforcing 1:1).
        individual_signature_confirmed:
          type: string
          enum:
          - ''
          - 'yes'
          - 'no'
          description: 'Whether the individual (or their authorized representative) has confirmed the
            signature: yes, no, or empty.'
        individual_signature_image_uri:
          type: string
          description: URI of the captured electronic signature image (SVG or PNG data URI).
        signature_date:
          type: string
          format: date
          description: Date the individual signed the authorization. Required by § 164.508(c)(1)(vi).
        signed_at_location:
          type: string
          description: Optional location where the signature was captured (state, facility, or virtual).
        parent_guardian_co_signature_required:
          type: string
          enum:
          - ''
          - 'yes'
          - 'no'
          description: 'Whether a parent or guardian co-signature is required by state law: yes, no, or
            empty.'
        parent_guardian_name:
          type: string
          maxLength: 255
          description: Name of parent or guardian co-signing where required.
        parent_guardian_signature_confirmed:
          type: string
          enum:
          - ''
          - 'yes'
          - 'no'
          description: 'Whether the parent / guardian has confirmed their co-signature: yes, no, or empty.'
        parent_guardian_signature_date:
          type: string
          format: date
          description: Date the parent / guardian co-signed.
        witness_name:
          type: string
          maxLength: 255
          description: Name of the witness, when required by state law.
        witness_signature_confirmed:
          type: string
          enum:
          - ''
          - 'yes'
          - 'no'
          description: 'Whether the witness has confirmed their signature: yes, no, or empty.'
        witness_date:
          type: string
          format: date
          description: Date the witness signed.
        witness_role:
          type: string
          maxLength: 120
          description: Role of the witness (e.g. notary, agency representative, healthcare professional).
      required:
      - created_at
      - updated_at
      - hipaa_authorization_id
      - individual_signature_confirmed
      - individual_signature_image_uri
      - signed_at_location
      - parent_guardian_co_signature_required
      - parent_guardian_name
      - parent_guardian_signature_confirmed
      - witness_name
      - witness_signature_confirmed
      - witness_role
      description: Signature, date, and witness fields. One-to-one child of hipaa_authorization. Required
        by 45 CFR § 164.508(c)(1)(vi).
    Signer:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when this row was deleted.
        hipaa_authorization_id:
          type: string
          format: uuid
          description: Foreign key to the parent HIPAA authorization (unique, enforcing 1:1).
        relationship:
          type: string
          enum:
          - ''
          - self
          - parent-of-minor
          - guardian
          - conservator
          - power-of-attorney
          - executor
          - other-authorized-representative
          description: 'Signer relationship to patient: self, parent-of-minor, guardian, conservator,
            power-of-attorney, executor, other-authorized-representative, or empty if unanswered.'
