          description: Validation error
  /validation-fired-rules/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      summary: Fetch one ValidationFiredRule by id
      operationId: getValidationFiredRule
      responses:
        '200':
          description: The requested ValidationFiredRule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationFiredRule'
        '404':
          description: ValidationFiredRule not found
    patch:
      summary: Update an existing ValidationFiredRule
      operationId: updateValidationFiredRule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidationFiredRule'
      responses:
        '200':
          description: The updated ValidationFiredRule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationFiredRule'
        '404':
          description: ValidationFiredRule not found
    delete:
      summary: Soft-delete a ValidationFiredRule
      operationId: deleteValidationFiredRule
      responses:
        '204':
          description: ValidationFiredRule deleted
        '404':
          description: ValidationFiredRule not found
  /validation-results:
    get:
      summary: List ValidationResult records
      operationId: listValidationResult
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 100
        required: false
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
        required: false
      responses:
        '200':
          description: A page of ValidationResult records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ValidationResult'
    post:
      summary: Create a new ValidationResult
      operationId: createValidationResult
