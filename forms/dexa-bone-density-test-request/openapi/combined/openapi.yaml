components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Name.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as full text.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code, such as for validating the postal address.
        role:
          type: string
          enum:
          - radiologist
          - gp
          - rheumatologist
          - endocrinologist
          - hospital-doctor
          - radiographer
          - other
          - ''
          description: 'Clinician role: radiologist, gp, rheumatologist, endocrinologist, hospital-doctor,
            radiographer, other.'
        registrationBody:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - other
          - ''
          description: 'Clinician registration body: GMC, NMC, HCPC, other.'
        registrationNumber:
          type: string
          description: Clinician registration number.
        unitedKingdomNhsNumber:
          type:
          - string
          - 'null'
          maxLength: 12
          description: United Kingdom NHS number, unique per person.
      required:
      - createdAt
      - updatedAt
      - name
      - role
      - registrationBody
      - registrationNumber
      description: Requesting clinician (referrer) who completes the DEXA bone density scan request.
    DexaBoneDensityTestRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the patient.
        clinicianId:
          type: string
          format: uuid
          description: Foreign key to the requesting clinician (referrer).
        status:
          type: string
          enum:
          - draft
          - submitted
          - vetted
          - scheduled
          - rejected
          - ''
          description: 'Request lifecycle status: draft, submitted, vetted, scheduled, rejected.'
        siteName:
          type: string
          maxLength: 255
          description: Name of the requesting site or clinic.
        setting:
          type: string
          enum:
          - outpatient
          - inpatient
          - community
          - emergency
          - ''
          description: 'Care setting: outpatient, inpatient, community, emergency.'
        referralDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the referral was made.
        requestedByDate:
          type:
          - string
          - 'null'
          format: date
          description: Date by which the scan is requested to be performed.
        scanRegion:
          type: string
          enum:
          - hip
          - spine
          - hip-and-spine
          - forearm
          - whole-body
          - other
          - ''
          description: 'Requested DEXA scan region: hip, spine, hip-and-spine, forearm, whole-body, other.'
        primaryIndication:
          type: string
          enum:
          - osteoporosis-screening
          - fragility-fracture
          - long-term-steroids
          - early-menopause
          - high-frax-risk
          - monitoring-treatment
          - secondary-osteoporosis
          - other
          - ''
          description: 'Primary clinical indication, used for appropriateness scoring: osteoporosis-screening,
            fragility-fracture, long-term-steroids, early-menopause, high-frax-risk, monitoring-treatment,
            secondary-osteoporosis, other.'
        clinicalQuestion:
          type: string
          maxLength: 1000
          description: Specific clinical question the scan should answer (highest-value field).
        relevantHistory:
          type: string
          maxLength: 1000
          description: Relevant medical, surgical, and fracture history.
        fraxMajorFracturePercent:
          type:
          - number
          - 'null'
          format: double
          description: FRAX 10-year major osteoporotic fracture probability as a percentage (0-100).
        previousFragilityFracture:
          type: boolean
          description: Whether the patient has had a previous fragility fracture (low-trauma).
        longTermSteroids:
          type: boolean
          description: Whether the patient is on long-term oral glucocorticoid (steroid) therapy.
        menopauseStatus:
          type: string
          enum:
          - pre
          - peri
          - post
          - not-applicable
          - ''
          description: 'Menopause status: pre, peri, post, not-applicable.'
        parentalHipFracture:
          type: boolean
          description: Whether a parent had a hip fracture (FRAX risk factor).
        weightKg:
          type:
          - number
          - 'null'
          format: double
          description: Body weight in kilograms (FRAX input; low weight raises fracture risk).
        previousDexa:
          type: string
          enum:
          - none
          - normal
          - osteopenia
          - osteoporosis
          - unknown
          - ''
          description: 'Result of any previous DEXA: none, normal, osteopenia, osteoporosis, unknown.'
        previousDexaDate:
          type:
          - string
          - 'null'
          format: date
          description: Date of the most recent previous DEXA scan.
        urgency:
          type: string
          enum:
          - routine
          - urgent
          - ''
          description: 'Requested triage urgency: routine, urgent.'
        supervisingConsultant:
          type: string
          maxLength: 255
          description: Name of the supervising / responsible consultant.
        requesterContact:
          type: string
          maxLength: 255
          description: Contact details (bleep / phone) for the requester.
        notes:
          type: string
          maxLength: 1000
          description: Free-text additional notes.
      required:
      - createdAt
      - updatedAt
      - patientId
      - clinicianId
      - status
      - siteName
      - setting
      - scanRegion
      - primaryIndication
      - clinicalQuestion
      - relevantHistory
      - previousFragilityFracture
      - longTermSteroids
      - menopauseStatus
      - parentalHipFracture
      - previousDexa
      - urgency
      - supervisingConsultant
      - requesterContact
      - notes
      description: DEXA / DXA bone-densitometry (osteoporosis) scan request (referral). Captures the requested
        scan region, the clinical indication and question, fracture-risk factors (FRAX inputs), previous
        DEXA history, and triage urgency.
    DexaBoneDensityTestRequestGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        dexaBoneDensityTestRequestId:
          type: string
          format: uuid
          description: Foreign key to the parent request (unique, 1:1).
        appropriatenessScore:
          type:
          - integer
          - 'null'
          format: int32
          description: Appropriateness score (1-9), grounded in NICE CG146 / NOGG / FRAX intervention
            thresholds.
        appropriatenessBand:
          type: string
          enum:
          - usually-appropriate
          - may-be-appropriate
          - usually-not-appropriate
          - ''
          description: 'Appropriateness band: usually-appropriate (7-9), may-be-appropriate (4-6), usually-not-appropriate
            (1-3).'
        radiationDoseBand:
          type: string
          enum:
          - low
          - moderate
          - high
          - ''
          description: 'Radiation dose band for the requested scan: low, moderate, high (DEXA is very
            low dose, ~1-5 microsievert).'
        safetyNote:
          type: string
          maxLength: 500
          description: Radiation-safety note (e.g. DEXA is very low dose; defer in known or suspected
            pregnancy).
        completenessPercent:
          type:
          - integer
          - 'null'
          format: int32
          description: Request completeness as a percentage of mandatory fields (0-100).
        triageTier:
          type: string
          enum:
          - routine
          - urgent
          - ''
          description: 'Assigned triage tier: routine, urgent.'
        targetTimeframe:
          type: string
          maxLength: 50
          description: Target timeframe for the scan implied by the triage tier.
        recommendation:
          type: string
          enum:
          - accept
          - query-referrer
          - redirect
          - reject
          - ''
          description: 'Vetting recommendation: accept, query-referrer, redirect, reject.'
        clinicianNotes:
          type: string
          description: Free-text vetting notes.
        signedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Timestamp of vetting clinician electronic signature.
        gradedAt:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the result.
      required:
      - createdAt
      - updatedAt
      - dexaBoneDensityTestRequestId
      - appropriatenessBand
      - radiationDoseBand
      - safetyNote
      - triageTier
      - targetTimeframe
      - recommendation
      - clinicianNotes
      - gradedAt
      description: 'Computed four-axis grading result: appropriateness (NICE CG146 / NOGG / FRAX, 1-9),
        radiation safety, request completeness, and triage priority.'
    DexaBoneDensityTestRequestGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        dexaBoneDensityTestRequestGradeId:
          type: string
