          description: Flag category, such as conservative-treatment-not-exhausted or high-bmi-surgical-risk.
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          - ''
          description: 'Priority: low, medium, or high.'
        description:
          type: string
          maxLength: 500
          description: Human-readable description of what fired the flag.
        suggestedAction:
          type: string
          maxLength: 500
