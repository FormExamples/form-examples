components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Name.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as full text.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code, such as for validating the postal address.
        role:
          type: string
          enum:
          - orthopaedic-surgeon
          - extended-scope-physiotherapist
          - other
          - ''
          description: Clinician role within the joint-replacement pathway.
        registrationBody:
          type: string
          enum:
          - GMC
          - HCPC
          - other
          - ''
          description: Professional registration body, such as GMC for a doctor or HCPC for a physiotherapist
            in the United Kingdom.
        registrationNumber:
          type: string
          description: Professional registration number issued by the registration body, such as the GMC
            number.
        employer:
          type: string
          description: Employer, such as the NHS trust, health board, or private practice.
        unitedKingdomNhsNumber:
          type:
          - string
          - 'null'
          maxLength: 12
          description: United Kingdom NHS number, unique per person.
      required:
      - createdAt
      - updatedAt
      - name
      - role
      - registrationBody
      - registrationNumber
      - employer
      description: Clinician, i.e. the orthopaedic surgeon or extended-scope physiotherapist who conducts
        the knee-replacement surgery evaluation.
    KneeReplacementSurgeryEvaluation:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the patient table.
        clinicianId:
          type: string
          format: uuid
          description: Foreign key to the clinician table.
        status:
          type: string
          enum:
          - draft
          - submitted
          - reviewed
          - urgent
          description: 'Evaluation lifecycle status: draft, submitted, reviewed, or urgent.'
        siteName:
          type: string
          maxLength: 255
          description: Site or clinic name where the evaluation took place.
        assessmentDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the evaluation was carried out.
        assessmentTime:
          type:
          - string
          - 'null'
          format: time
          description: Time the evaluation was carried out.
        kneeSide:
          type: string
          enum:
          - left
          - right
          - bilateral
          - ''
          description: 'Affected knee: left, right, or bilateral. Bilateral drives the bilateral-symptomatic
            safety flag.'
        symptomDurationMonths:
          type:
          - integer
          - 'null'
          format: int32
          description: Duration of knee symptoms in months.
        painAtRest0To10:
          type:
          - integer
          - 'null'
          format: int32
          description: Pain severity at rest, 0 (none) to 10 (worst possible).
        painOnActivity0To10:
          type:
          - integer
          - 'null'
          format: int32
          description: Pain severity on activity, 0 (none) to 10 (worst possible).
        nightPain:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether pain wakes the patient at night.
        priorKneeSurgery:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the patient has had prior surgery to the affected knee.
        priorKneeSurgeryType:
          type: string
          enum:
          - arthroscopy
          - ligament-repair
          - previous-partial-replacement
          - other
          - ''
          description: 'Type of prior knee surgery: arthroscopy, ligament repair, previous partial replacement,
            or other.'
        priorKneeSurgeryDate:
          type:
          - string
          - 'null'
          format: date
          description: Date of the most recent prior knee surgery.
        priorInjury:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the patient has had a prior injury to the affected knee.
        priorInjuryDetail:
          type: string
          description: Free-text description of the prior knee injury.
        oksPainSeverity:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Oxford Knee Score item 1: usual knee pain severity, 0 (worst) to 4 (best).'
        oksWashingAndDrying:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Oxford Knee Score item 2: difficulty washing and drying, 0 (worst) to 4 (best).'
        oksTransport:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Oxford Knee Score item 3: difficulty getting in or out of a car, or using public
            transport, 0 (worst) to 4 (best).'
        oksWalkingDistance:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Oxford Knee Score item 4: walking distance before knee pain becomes severe, 0
            (worst) to 4 (best).'
        oksPainSittingOrLying:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Oxford Knee Score item 5: pain sitting or lying, 0 (worst) to 4 (best).'
        oksLimping:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Oxford Knee Score item 6: limping when walking, 0 (worst) to 4 (best).'
        oksKneeling:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Oxford Knee Score item 7: difficulty kneeling, 0 (worst) to 4 (best).'
        oksNightPainFrequency:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Oxford Knee Score item 8: night pain frequency, 0 (worst) to 4 (best).'
        oksPainInterferingWithWork:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Oxford Knee Score item 9: pain interfering with usual work (including housework),
            0 (worst) to 4 (best).'
        oksGivingWay:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Oxford Knee Score item 10: feeling the knee might suddenly "give way" or let the
            patient down, 0 (worst) to 4 (best).'
        oksShopping:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Oxford Knee Score item 11: ability to do the household shopping alone, 0 (worst)
            to 4 (best).'
        oksStairs:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Oxford Knee Score item 12: ability to walk down a flight of stairs, 0 (worst)
            to 4 (best).'
        walkingDistanceBeforePain:
          type: string
          enum:
          - unlimited
          - over-1km
          - 100m-to-1km
          - under-100m
          - housebound
          - ''
          description: 'Walking distance before pain: unlimited, over 1km, 100m to 1km, under 100m, or
            housebound.'
        stairClimbingAbility:
          type: string
          enum:
          - normal
          - with-rail
          - one-step-at-a-time
          - unable
          - ''
          description: 'Stair-climbing ability: normal, with a rail, one step at a time, or unable.'
        standFromChairUnaided:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the patient can stand from a chair unaided.
        walkingAid:
          type: string
          enum:
          - none
          - stick
          - frame
          - wheelchair
          - ''
          description: 'Walking aid in use: none, stick, frame, or wheelchair.'
        flexionDegrees:
          type:
          - integer
          - 'null'
          format: int32
          description: Active knee flexion in degrees, measured on examination.
        extensionDeficitDegrees:
          type:
          - integer
          - 'null'
          format: int32
          description: Extension deficit in degrees; 0 indicates full extension.
        fixedFlexionDeformityPresent:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether a fixed flexion deformity is present on examination.
        fixedFlexionDeformityDegrees:
          type:
          - integer
          - 'null'
          format: int32
          description: Fixed flexion deformity in degrees; above 15 degrees fires the fixed-flexion-deformity
            safety flag because it affects surgical planning.
        coronalDeformityType:
          type: string
          enum:
          - none
          - varus
          - valgus
          - ''
          description: 'Coronal-plane deformity type: none, varus (bow-legged), or valgus (knock-kneed).'
        coronalDeformitySeverity:
          type: string
          enum:
          - none
          - mild
          - moderate
          - severe
          - ''
          description: 'Coronal-plane deformity severity: none, mild, moderate, or severe.'
        ligamentAcl:
          type: string
          enum:
          - stable
          - lax
          - ''
          description: 'Anterior cruciate ligament stability on examination: stable or lax.'
        ligamentPcl:
          type: string
          enum:
          - stable
          - lax
          - ''
          description: 'Posterior cruciate ligament stability on examination: stable or lax.'
        ligamentMcl:
          type: string
          enum:
          - stable
          - lax
          - ''
          description: 'Medial collateral ligament stability on examination: stable or lax.'
        ligamentLcl:
          type: string
          enum:
          - stable
          - lax
          - ''
          description: 'Lateral collateral ligament stability on examination: stable or lax.'
        patellarTracking:
          type: string
          enum:
          - normal
          - maltracking
          - ''
          description: 'Patellar tracking on examination: normal or maltracking.'
        quadricepsStrengthMrc:
          type:
          - integer
          - 'null'
          format: int32
          description: Quadriceps strength on the Medical Research Council (MRC) 0 to 5 scale.
        effusionPresent:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether a joint effusion is present on examination.
        crepitusPresent:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether crepitus is present on examination.
        weightBearingXrayPerformed:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether a weight-bearing X-ray of the knee has been performed.
        kellgrenLawrenceGradeMedial:
          type:
          - integer
          - 'null'
          format: int32
          description: Kellgren-Lawrence radiographic osteoarthritis grade of the medial compartment,
            0 to 4.
        kellgrenLawrenceGradeLateral:
          type:
          - integer
          - 'null'
          format: int32
          description: Kellgren-Lawrence radiographic osteoarthritis grade of the lateral compartment,
            0 to 4.
        kellgrenLawrenceGradePatellofemoral:
          type:
          - integer
          - 'null'
          format: int32
          description: Kellgren-Lawrence radiographic osteoarthritis grade of the patellofemoral compartment,
            0 to 4.
        mriPerformed:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether an MRI scan has been performed.
        mriFindings:
          type: string
          description: Free-text summary of MRI findings.
        ctPerformed:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether a CT scan has been performed.
        ctIndication:
          type: string
          enum:
          - robotic-assisted-planning
          - bone-loss-assessment
          - other
          - ''
