      description: 'Knee replacement surgery evaluation: the payload of the 15-step single-page wizard,
        covering presenting history, the Oxford Knee Score, physical examination, diagnostic imaging,
        conservative-treatment audit, general health screen, pre-operative bloods checklist, shared decision-making,
        and the management plan.'
    KneeReplacementSurgeryEvaluationGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        kneeReplacementSurgeryEvaluationId:
          type: string
          format: uuid
          description: Foreign key to the knee_replacement_surgery_evaluation table, unique because grading
            is one-to-one with the evaluation.
        oksTotal:
          type:
          - integer
          - 'null'
          format: int32
          description: Oxford Knee Score total, 0 to 48, being the sum of the twelve item scores. 48 is
            the best possible outcome.
        computedOksCategory:
          type: string
          enum:
          - severe
          - moderate
          - mild-to-moderate
          - satisfactory
          - ''
          description: 'Oxford Knee Score category computed by the engine: severe (0-19), moderate (20-29),
            mild-to-moderate (30-39), or satisfactory (40-48).'
        finalOksCategory:
          type: string
          enum:
          - severe
          - moderate
          - mild-to-moderate
          - satisfactory
          - ''
          description: Oxford Knee Score category signed off by the clinician, which may equal or differ
            from the computed value.
        maxKellgrenLawrenceGrade:
          type:
          - integer
          - 'null'
          format: int32
          description: Highest Kellgren-Lawrence radiographic grade across the medial, lateral, and patellofemoral
            compartments, 0 to 4.
        computedCandidacy:
          type: string
          enum:
          - strong-candidate
          - candidate
          - continue-conservative
          - not-indicated
          - mdt-review
          - ''
          description: 'Surgical candidacy recommendation computed by the engine: strong-candidate, candidate,
            continue-conservative, not-indicated, or mdt-review.'
        finalCandidacy:
          type: string
          enum:
          - strong-candidate
          - candidate
          - continue-conservative
          - not-indicated
          - mdt-review
          - ''
          description: Surgical candidacy recommendation signed off by the clinician, which may equal
            or differ from the computed value.
        overrideReason:
          type: string
          maxLength: 500
          description: Reason the clinician set a final candidacy differently from the computed value,
            mandatory when they differ.
        clinicianNotes:
          type: string
          description: Free-text clinician summary notes.
        signedByName:
          type: string
          maxLength: 255
          description: Name of the clinician who signed the evaluation.
        signedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Timestamp of the clinician electronic signature.
        gradedAt:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the result.
      required:
      - createdAt
      - updatedAt
      - kneeReplacementSurgeryEvaluationId
      - computedOksCategory
      - finalOksCategory
      - computedCandidacy
      - finalCandidacy
      - overrideReason
      - clinicianNotes
      - signedByName
      - gradedAt
      description: Computed and signed-off grading result for one knee replacement surgery evaluation.
        Stores both the engine-computed values and the clinician-final values with an override reason.
    KneeReplacementSurgeryEvaluationGradeFlag:
