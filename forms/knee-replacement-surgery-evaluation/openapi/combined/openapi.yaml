            ASA physical status, which belongs to the ASA-grading pre-operative sibling forms.
        fbcDone:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether a full blood count (FBC) has been done.
        renalFunctionDone:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether renal function tests have been done.
        clottingDone:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether clotting or INR tests have been done.
        ecgDone:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether an electrocardiogram (ECG) has been done.
        mrsaScreenDone:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether an MRSA screen has been done.
        urinalysisDone:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether urinalysis has been done.
        risksBenefitsDiscussed:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the risks and benefits of surgery have been discussed with the patient.
        realisticExpectationsDiscussed:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether realistic expectations of surgical outcome have been discussed with the
            patient.
        patientDecisionAidGiven:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether a patient decision aid has been given.
        interpreterRequired:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether an interpreter was required for the shared decision-making discussion.
        planRecommendation:
          type: string
          enum:
          - total-knee-replacement
          - partial-knee-replacement
          - continue-conservative-management
          - mdt-review
          - not-currently-a-candidate
          - ''
