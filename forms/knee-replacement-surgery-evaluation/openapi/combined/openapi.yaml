            or other.'
        physiotherapyTried:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether physiotherapy has been tried as a conservative measure.
        physiotherapyDurationWeeks:
          type:
          - integer
          - 'null'
          format: int32
          description: Duration of physiotherapy in weeks.
        weightManagementAdviceGiven:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether weight-management advice has been given as a conservative measure.
        injectionGiven:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether an intra-articular injection (corticosteroid or hyaluronic acid) has been
            given.
        injectionType:
          type: string
          enum:
          - corticosteroid
          - hyaluronic-acid
          - both
          - other
          - ''
          description: 'Type of intra-articular injection given: corticosteroid, hyaluronic acid, both,
            or other.'
        injectionCount:
          type:
          - integer
          - 'null'
          format: int32
          description: Number of intra-articular injections given.
        injectionResponse:
          type: string
          enum:
          - good
          - partial
          - none
          - ''
          description: 'Response to the intra-articular injection: good, partial, or none.'
        nsaidAnalgesicTrial:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether an NSAID or analgesic trial has been undertaken as a conservative measure.
        nsaidAnalgesicResponse:
          type: string
          enum:
          - good
          - partial
          - none
          - ''
          description: 'Response to the NSAID or analgesic trial: good, partial, or none.'
        walkingAidTrial:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether a walking-aid trial has been undertaken as a conservative measure.
        conservativeMeasuresExhausted:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether all appropriate conservative measures have been exhausted. Drives the computed-candidacy
            recommendation and the conservative-treatment-not-exhausted safety flag.
        diabetesControlled:
          type: string
          enum:
          - not-diabetic
          - well-controlled
          - poorly-controlled
          - ''
          description: 'Diabetes control status: not diabetic, well controlled, or poorly controlled.'
        cardiacDisease:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether cardiac disease is present.
        bleedingDisorderOrAnticoagulant:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether a bleeding disorder is present or the patient is taking an anticoagulant.
        smokingStatus:
          type: string
          enum:
          - never
          - ex-smoker
          - current
          - ''
          description: 'Smoking status: never, ex-smoker, or current.'
        generalFitnessNote:
          type: string
