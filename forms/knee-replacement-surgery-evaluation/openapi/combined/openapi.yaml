          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        kneeReplacementSurgeryEvaluationGradeId:
          type: string
          format: uuid
          description: Foreign key to the parent knee_replacement_surgery_evaluation_grade table.
        flagId:
          type: string
          maxLength: 50
          description: Stable flag identifier, such as F-FIXED-FLEXION-DEFORMITY-001.
        category:
          type: string
          enum:
          - conservative-treatment-not-exhausted
          - high-bmi-surgical-risk
          - pre-op-bloods-incomplete
          - fixed-flexion-deformity
          - bilateral-symptomatic
          - paediatric
          - other
