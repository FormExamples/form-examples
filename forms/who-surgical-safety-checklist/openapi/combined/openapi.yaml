          description: WhoSurgicalSafetyChecklist not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: This client sent too many requests
          headers:
            retry-after:
              description: Seconds to wait before sending again
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        name:
          type: string
          description: Clinician full name.
        email:
          type:
          - string
          - 'null'
          description: Work email address.
        phone:
          type:
          - string
          - 'null'
          description: Work phone number.
        role:
          type: string
          enum:
          - surgeon
          - assistant-surgeon
          - anaesthetist
          - circulating-nurse
          - scrub-nurse
          - anaesthetic-assistant
          - perfusionist
          - technician
          - other
          - ''
          description: 'Operating-room role. One of: surgeon, assistant-surgeon, anaesthetist, circulating-nurse,
            scrub-nurse, anaesthetic-assistant, perfusionist, technician, other.'
        registrationBody:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - GPhC
          - other
          - ''
          description: 'Professional registration body. One of: GMC, NMC, HCPC, GPhC, other.'
        registrationNumber:
          type: string
          description: Registration number issued by the registration body.
        employeeNumber:
          type: string
          description: Local employee or smart-card number at the operating facility.
        unitedKingdomNhsNumber:
          type:
          - string
          - 'null'
          maxLength: 12
          description: United Kingdom NHS number, unique per person.
      required:
      - createdAt
      - updatedAt
      - name
      - role
      - registrationBody
      - registrationNumber
      - employeeNumber
      description: Operating-room clinician who can fill in or sign off the WHO Surgical Safety Checklist.
    Patient:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        name:
          type: string
          maxLength: 255
          description: Patient full name as recorded on the consent form.
        birthDate:
          type:
          - string
          - 'null'
          format: date
          description: Date of birth.
        sex:
          type: string
          enum:
          - female
          - male
          - intersex
          - unknown
          - ''
          description: 'Recorded sex: female, male, intersex, or unknown.'
        unitedKingdomNhsNumber:
          type:
          - string
          - 'null'
          maxLength: 20
          description: United Kingdom NHS number, unique per person.
        medicalRecordNumber:
          type:
          - string
          - 'null'
          maxLength: 50
          description: Local medical record number (MRN) at the operating facility.
        weightAsKg:
          type:
          - number
          - 'null'
          format: double
          description: Patient weight in kilograms, used for the paediatric blood-loss threshold (7 ml/kg).
      required:
      - createdAt
      - updatedAt
      - name
      - sex
      description: Patient receiving the surgical procedure.
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          description: A URI identifying the problem type
        title:
          type: string
          description: A short summary of the problem type
        status:
          type: integer
          description: The HTTP status code
        detail:
          type: string
          description: An explanation of this occurrence
        instance:
          type: string
          description: A URI identifying this occurrence
        code:
          type: string
          description: A short machine-readable reason
        errors:
          type: object
          description: Per-field detail, when validation failed
      required:
      - type
      - title
      - status
    TeamMember:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        checklistId:
          type: string
          format: uuid
          description: Foreign key to the parent who_surgical_safety_checklist row.
        clinicianId:
          type:
          - string
          - 'null'
          format: uuid
          description: Optional foreign key to the clinician table for known staff.
        name:
          type: string
          maxLength: 255
          description: Team member name as introduced during the Time Out.
        role:
          type: string
          enum:
          - surgeon
          - assistant-surgeon
          - anaesthetist
          - circulating-nurse
          - scrub-nurse
          - anaesthetic-assistant
          - perfusionist
          - technician
          - observer
          - other
          - ''
          description: 'Operating-room role. One of: surgeon, assistant-surgeon, anaesthetist, circulating-nurse,
            scrub-nurse, anaesthetic-assistant, perfusionist, technician, observer, other.'
        introducedDuringTimeOut:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether this team member was introduced during the Time Out (yes/no).
        notes:
          type: string
          maxLength: 255
          description: Free-text notes (e.g., trainee, visiting consultant, observer institution).
      required:
      - createdAt
      - updatedAt
      - checklistId
      - name
      - role
      - introducedDuringTimeOut
      - notes
      description: Operating-team roster row captured during the Time Out introductions step. Each row
        represents one team member present in the operating room for a given case.
    WhoSurgicalSafetyChecklist:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the patient receiving the procedure.
        surgeonId:
          type:
          - string
          - 'null'
          format: uuid
          description: Foreign key to the lead surgeon for this case.
        anaesthetistId:
          type:
          - string
          - 'null'
          format: uuid
          description: Foreign key to the lead anaesthetist for this case.
        leadNurseId:
          type:
          - string
          - 'null'
          format: uuid
          description: Foreign key to the lead (circulating) nurse for this case.
        status:
          type: string
          enum:
          - not-started
          - sign-in-complete
          - time-out-complete
          - sign-out-complete
          - completed
          - abandoned
          description: 'Overall checklist lifecycle status. One of: not-started, sign-in-complete, time-out-complete,
            sign-out-complete, completed, abandoned.'
        siteName:
          type: string
          maxLength: 255
          description: Operating facility or hospital site name.
        operatingRoom:
          type: string
          maxLength: 50
          description: Operating-room identifier (number, letter, or name).
        caseDate:
          type:
          - string
          - 'null'
          format: date
          description: Date of the surgical procedure.
        caseStartAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Timestamp of wheels-in or induction.
        caseEndAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Timestamp of wheels-out from the operating room.
        plannedProcedure:
          type: string
          maxLength: 500
          description: Description of the planned surgical procedure.
        surgicalSpecialty:
          type: string
          maxLength: 100
          description: Surgical specialty responsible for the procedure.
        urgency:
          type: string
          enum:
          - elective
          - urgent
          - emergency
          - immediate
          - ''
          description: 'Procedure urgency (NCEPOD). One of: elective, urgent, emergency, immediate.'
        laterality:
          type: string
          enum:
          - left
          - right
          - bilateral
          - midline
          - na
          - ''
          description: 'Side of the body. One of: left, right, bilateral, midline, na.'
        isPaediatric:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the patient is paediatric (drives the 7 ml/kg blood-loss threshold).
        abandonedReason:
          type: string
          maxLength: 500
          description: Free-text reason when the case is abandoned before sign-out.
        signInIdentitySiteProcedureConsent:
          type: string
          enum:
          - 'yes'
          - ''
          description: 'Sign In #1: patient has confirmed identity, site, procedure, and consent.'
        signInSiteMarked:
          type: string
          enum:
          - 'yes'
          - not-applicable
          - ''
          description: 'Sign In #2: surgical site marked. One of: yes, not-applicable.'
        signInAnaesthesiaCheckComplete:
          type: string
          enum:
          - 'yes'
          - ''
          description: 'Sign In #3: anaesthesia machine and medication check complete.'
        signInPulseOximeterOnPatient:
          type: string
          enum:
          - 'yes'
          - ''
          description: 'Sign In #4: pulse oximeter on the patient and functioning.'
        signInKnownAllergy:
          type: string
          enum:
          - 'no'
          - 'yes'
          - ''
          description: 'Sign In #5: known allergy. One of: no, yes.'
        signInKnownAllergyDetail:
          type: string
          maxLength: 500
          description: 'Sign In #5: free-text description of known allergies.'
        signInDifficultAirwayAspirationRisk:
          type: string
          enum:
          - 'no'
          - yes-equipment-available
          - ''
          description: 'Sign In #6: difficult airway or aspiration risk. One of: no, yes-equipment-available.'
        signInBloodLossRisk:
          type: string
          enum:
          - 'no'
          - yes-two-ivs-and-fluids-planned
          - ''
          description: 'Sign In #7: risk of >500 ml (7 ml/kg in children) blood loss. One of: no, yes-two-ivs-and-fluids-planned.'
        signInCoordinatorId:
          type:
          - string
          - 'null'
          format: uuid
          description: Foreign key to the clinician who signed off the Sign In phase.
        signInCompletedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Timestamp when Sign In phase was signed off.
        timeOutTeamIntroductionsConfirmed:
          type: string
          enum:
          - 'yes'
          - ''
          description: 'Time Out #1: all team members have introduced themselves by name and role.'
        timeOutPatientProcedureIncisionConfirmed:
          type: string
          enum:
          - 'yes'
          - ''
          description: 'Time Out #2: patient name, procedure, and incision site confirmed.'
        timeOutAntibioticProphylaxisWithin60min:
          type: string
          enum:
          - 'yes'
          - not-applicable
          - ''
          description: 'Time Out #3: antibiotic prophylaxis given within the last 60 minutes. One of:
            yes, not-applicable.'
        timeOutSurgeonCriticalSteps:
          type: string
          maxLength: 1000
          description: 'Time Out #4 (surgeon): critical or non-routine steps.'
        timeOutSurgeonCaseDurationMinutes:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Time Out #5 (surgeon): anticipated case duration in minutes.'
        timeOutSurgeonAnticipatedBloodLossMl:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Time Out #6 (surgeon): anticipated blood loss in millilitres.'
        timeOutAnaesthetistPatientConcerns:
          type: string
          maxLength: 1000
          description: 'Time Out #7 (anaesthetist): patient-specific concerns.'
        timeOutNursingSterilityConfirmed:
          type: string
          enum:
          - 'yes'
          - ''
          description: 'Time Out #8 (nursing): sterility (including indicator results) confirmed.'
        timeOutNursingEquipmentConcerns:
          type: string
          maxLength: 1000
          description: 'Time Out #9 (nursing): equipment issues or concerns.'
        timeOutEssentialImagingDisplayed:
          type: string
          enum:
          - 'yes'
          - not-applicable
          - ''
          description: 'Time Out #10: essential imaging displayed. One of: yes, not-applicable.'
        timeOutCoordinatorId:
          type:
          - string
          - 'null'
          format: uuid
          description: Foreign key to the clinician who signed off the Time Out phase.
        timeOutCompletedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Timestamp when Time Out phase was signed off.
        signOutProcedureNameConfirmed:
          type: string
          enum:
          - 'yes'
          - ''
          description: 'Sign Out #1: name of the procedure recorded confirmed by the nurse.'
        signOutCountsConfirmed:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Sign Out #2: instrument, sponge, and needle counts confirmed. One of: yes, no.'
        signOutSpecimensLabelled:
          type: string
          enum:
          - 'yes'
          - 'no'
          - not-applicable
          - ''
          description: 'Sign Out #3: specimen labelling (read aloud, including patient name) confirmed.
            One of: yes, no, not-applicable.'
        signOutEquipmentProblems:
          type: string
          maxLength: 1000
          description: 'Sign Out #4: equipment problems to be addressed.'
        signOutRecoveryConcerns:
          type: string
          maxLength: 1000
          description: 'Sign Out #5: key concerns for recovery and management of this patient.'
        signOutCoordinatorId:
          type:
          - string
          - 'null'
          format: uuid
          description: Foreign key to the clinician who signed off the Sign Out phase.
        signOutCompletedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Timestamp when Sign Out phase was signed off.
      required:
      - createdAt
      - updatedAt
      - patientId
      - status
      - siteName
      - operatingRoom
      - plannedProcedure
      - surgicalSpecialty
      - urgency
      - laterality
      - isPaediatric
      - abandonedReason
      - signInIdentitySiteProcedureConsent
      - signInSiteMarked
      - signInAnaesthesiaCheckComplete
      - signInPulseOximeterOnPatient
      - signInKnownAllergy
      - signInKnownAllergyDetail
      - signInDifficultAirwayAspirationRisk
      - signInBloodLossRisk
      - timeOutTeamIntroductionsConfirmed
      - timeOutPatientProcedureIncisionConfirmed
      - timeOutAntibioticProphylaxisWithin60min
      - timeOutSurgeonCriticalSteps
      - timeOutAnaesthetistPatientConcerns
      - timeOutNursingSterilityConfirmed
      - timeOutNursingEquipmentConcerns
      - timeOutEssentialImagingDisplayed
      - signOutProcedureNameConfirmed
      - signOutCountsConfirmed
      - signOutSpecimensLabelled
      - signOutEquipmentProblems
      - signOutRecoveryConcerns
      description: WHO Surgical Safety Checklist case record. One row per surgical case, holding all items
        of the three phases (Sign In, Time Out, Sign Out) and the case identification.
