components:
  schemas:
    Applicant:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        name:
          type: string
          description: Full legal name of the requester.
        birthDate:
          type:
          - string
          - 'null'
          format: date
          description: Date of birth of the requester, used to test minimum-age rules for self-requests.
        email:
          type:
          - string
          - 'null'
          description: Email address of the requester.
        phone:
          type:
          - string
          - 'null'
          description: Phone number of the requester.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Mailing address for delivery, as a single text block.
      required:
      - createdAt
      - updatedAt
      - name
      description: The person completing and signing a birth certificate copy request (the requester).
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          description: A URI identifying the problem type
        title:
          type: string
          description: A short summary of the problem type
        status:
          type: integer
          description: The HTTP status code
        detail:
          type: string
          description: An explanation of this occurrence
        instance:
          type: string
          description: A URI identifying this occurrence
        code:
          type: string
          description: A short machine-readable reason
        errors:
          type: object
          description: Per-field detail, when validation failed
      required:
      - type
      - title
      - status
    Registrant:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        name:
          type: string
          description: Full name of the registrant as it appears on the birth certificate.
        birthDate:
          type:
          - string
          - 'null'
          format: date
          description: Date of birth of the registrant.
        sex:
          type: string
          enum:
          - female
          - male
          - other
          - unknown
          - ''
          description: 'Sex recorded on the certificate: female, male, other, or unknown.'
        placeOfBirth:
          type: string
          description: City or town of birth.
        countyOfBirth:
          type: string
          description: County of birth.
        birthState:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Two-letter postal code of the state or territory where the birth occurred; the
            issuing vital records office.
        birthFacility:
          type: string
          description: Hospital or facility of birth, or street address for a home birth.
        motherNameBeforeFirstMarriage:
          type: string
          description: Mother full name before first marriage, as on the certificate.
        fatherName:
          type: string
          description: Father or second parent full name as on the certificate, if recorded.
        isDeceased:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the registrant is deceased (yes/no).
        isAdopted:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the registrant was adopted, so an amended record may exist and the original
            may be sealed (yes/no).
      required:
      - createdAt
      - updatedAt
      - name
      - sex
      - placeOfBirth
      - countyOfBirth
      - birthFacility
      - motherNameBeforeFirstMarriage
      - fatherName
      - isDeceased
      - isAdopted
      description: The person named on the birth certificate being requested, with the Standard Certificate
        of Live Birth data needed to locate the record.
    UnitedStatesBirthCertificateApplication:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        applicantId:
          type:
          - string
          - 'null'
          format: uuid
          description: Foreign key to the requester.
        registrantId:
          type: string
          format: uuid
          description: Foreign key to the person named on the certificate.
        requesterRelationship:
          type: string
          enum:
          - self
          - parent
          - legal-guardian
          - legal-representative
          - spouse
          - child
          - sibling
          - grandparent
          - grandchild
          - government-agency
          - other
          - ''
          description: Relationship of the requester to the registrant, which decides eligibility in restricted-access
            states.
        purpose:
          type: string
          enum:
          - passport
          - real-id
          - school
          - employment
          - benefits
          - genealogy
          - foreign-use
          - other
          - ''
          description: Intended use of the certificate (passport, REAL ID, school, employment, benefits,
            genealogy, foreign use, other).
        needsApostille:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the certificate will be used abroad and needs an apostille (yes/no).
        apostilleCountry:
          type: string
          description: Destination country for an apostille or legalization.
        certificateType:
          type: string
          enum:
          - certified-long-form
          - certified-short-form
          - informational
          - ''
          description: 'Kind of copy requested: certified long form (full image), certified short form
            (abstract), or informational (not valid for identity).'
        copies:
          type:
          - integer
          - 'null'
          format: int32
          description: Number of copies requested (1 to 20).
        deliveryMethod:
          type: string
          enum:
          - online
          - mail
          - in-person
          - ''
          description: 'How the application is submitted: online, mail, or in person.'
        feeEnclosedUsd:
          type:
          - number
          - 'null'
          format: double
          description: Total fee in US dollars included with the request.
        idType:
          type: string
          enum:
          - state-driver-license
          - state-id-card
          - us-passport
          - military-id
          - other-photo-id
          - none
          - ''
          description: Type of identification presented by the requester.
        idUnexpired:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the identification is current and unexpired (yes/no).
        proofOfRelationship:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether documents proving the relationship to the registrant are included (yes/no).
        authorityDocument:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether a court order, guardianship letters, or legal-representation authority
            is included (yes/no).
        notarizedSwornStatement:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether a notarized sworn statement of identity is included, required by some states
            for mail requests (yes/no).
        declarationSigned:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the applicant has signed the declaration under penalty of perjury (yes/no).
        applicationNote:
          type: string
          description: Free-text note from the applicant.
      required:
      - createdAt
      - updatedAt
      - registrantId
      - requesterRelationship
      - purpose
      - needsApostille
      - apostilleCountry
      - certificateType
      - deliveryMethod
