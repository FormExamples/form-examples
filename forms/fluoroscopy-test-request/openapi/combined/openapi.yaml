components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Name.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as full text.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code, such as for validating the postal address.
        role:
          type: string
          enum:
          - radiologist
          - gp
          - hospital-doctor
          - surgeon
          - gastroenterologist
          - radiographer
          - other
          - ''
          description: 'Clinician role: radiologist, gp, hospital-doctor, surgeon, gastroenterologist,
            radiographer, other.'
        registrationBody:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - other
          - ''
          description: 'Clinician registration body: GMC, NMC, HCPC, other.'
        registrationNumber:
          type: string
          description: Clinician registration number.
        unitedKingdomNhsNumber:
          type:
          - string
          - 'null'
          maxLength: 12
          description: United Kingdom NHS number, unique per person.
      required:
      - createdAt
      - updatedAt
      - name
      - role
      - registrationBody
      - registrationNumber
      description: Requesting clinician (referrer) who completes the fluoroscopy / contrast-study request.
    FluoroscopyTestRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the patient.
        clinicianId:
          type: string
          format: uuid
          description: Foreign key to the requesting clinician (referrer).
        status:
          type: string
          enum:
          - draft
          - submitted
          - vetted
          - scheduled
          - rejected
          - ''
          description: 'Request lifecycle status: draft, submitted, vetted, scheduled, rejected.'
        siteName:
          type: string
          maxLength: 255
          description: Name of the requesting site or clinic.
        setting:
          type: string
          enum:
          - outpatient
          - inpatient
          - community
          - emergency
          - ''
          description: 'Care setting: outpatient, inpatient, community, emergency.'
        referralDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the referral was made.
        requestedByDate:
          type:
          - string
          - 'null'
          format: date
          description: Date by which the study is requested to be performed.
        studyType:
          type: string
          enum:
          - barium-swallow
          - barium-meal
          - barium-follow-through
          - barium-enema
          - water-soluble-contrast-swallow
          - defecating-proctogram
          - hysterosalpingogram
          - micturating-cystourethrogram
          - arthrogram
          - fluoroscopy-guided-procedure
          - other
          - ''
          description: Requested fluoroscopy / contrast study type, used for appropriateness and radiation-dose
            banding.
        primaryIndication:
          type: string
          enum:
          - dysphagia
          - reflux
          - suspected-obstruction
          - suspected-perforation
          - constipation
          - infertility-tubal-patency
          - vesicoureteric-reflux
          - joint-assessment
          - other
          - ''
          description: Primary clinical indication, used for appropriateness scoring and contrast-choice
            safety.
        clinicalQuestion:
          type: string
          maxLength: 1000
          description: Specific clinical question the study should answer (highest-value field).
        relevantHistory:
          type: string
          maxLength: 1000
          description: Relevant medical, surgical, and clinical history.
        pregnancyStatus:
          type: string
          enum:
          - not-pregnant
          - pregnant
          - possible
          - unknown
          - not-applicable
          - ''
          description: 'Pregnancy status for ionising-radiation safety: not-pregnant, pregnant, possible,
            unknown, not-applicable.'
        contrastAllergy:
          type: boolean
          description: Whether the patient has a known contrast-media allergy (safety factor).
        aspirationRisk:
          type: boolean
          description: Whether the patient is at risk of aspiration (favours water-soluble contrast).
        diabetes:
          type: boolean
          description: Whether the patient has diabetes.
        urgency:
          type: string
          enum:
          - routine
          - urgent
          - emergency
          - ''
          description: 'Requested triage urgency: routine, urgent, emergency.'
        irMeRJustification:
          type: string
          maxLength: 1000
          description: 'IR(ME)R justification: clinical rationale for exposing the patient to ionising
            radiation.'
        supervisingConsultant:
          type: string
          maxLength: 255
          description: Name of the supervising / responsible consultant.
        requesterContact:
          type: string
          maxLength: 255
          description: Contact details (bleep / phone) for the requester.
        notes:
          type: string
          maxLength: 1000
          description: Free-text additional notes.
      required:
      - createdAt
      - updatedAt
      - patientId
      - clinicianId
      - status
      - siteName
      - setting
      - studyType
      - primaryIndication
      - clinicalQuestion
      - relevantHistory
      - pregnancyStatus
      - contrastAllergy
      - aspirationRisk
      - diabetes
      - urgency
      - irMeRJustification
      - supervisingConsultant
      - requesterContact
      - notes
      description: Fluoroscopy / contrast-study request (referral) for barium studies and related procedures.
        Captures the requested study, the clinical indication and question, relevant history, pregnancy
        and radiation-safety context, and triage urgency.
    FluoroscopyTestRequestGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        fluoroscopyTestRequestId:
          type: string
          format: uuid
          description: Foreign key to the parent request (unique, 1:1).
        appropriatenessScore:
          type:
          - integer
          - 'null'
          format: int32
          description: ACR Appropriateness Criteria / RCR iRefer score (1-9).
        appropriatenessBand:
          type: string
          enum:
          - usually-appropriate
          - may-be-appropriate
          - usually-not-appropriate
          - ''
          description: 'Appropriateness band: usually-appropriate (7-9), may-be-appropriate (4-6), usually-not-appropriate
            (1-3).'
        safetyBand:
          type: string
          enum:
          - ok
          - caution
          - contraindicated
          - ''
          description: 'Safety band: ok, caution, contraindicated (driven by pregnancy, contrast allergy,
            aspiration risk, and contrast-choice for suspected perforation).'
        radiationDoseBand:
          type: string
          enum:
          - low
          - moderate
          - high
          - ''
          description: 'Estimated radiation-dose band for the requested study: low, moderate, high.'
        completenessPercent:
          type:
          - integer
          - 'null'
          format: int32
          description: Request completeness as a percentage of mandatory fields (0-100).
        triageTier:
          type: string
          enum:
          - routine
          - urgent
          - emergency
          - ''
          description: 'Assigned triage tier: routine, urgent, emergency.'
        targetTimeframe:
          type: string
          maxLength: 50
          description: Target timeframe for the study implied by the triage tier.
        recommendation:
          type: string
          enum:
          - accept
          - query-referrer
          - redirect
          - reject
          - ''
          description: 'Vetting recommendation: accept, query-referrer, redirect, reject.'
        clinicianNotes:
          type: string
          description: Free-text vetting notes.
        signedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Timestamp of vetting clinician electronic signature.
        gradedAt:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the result.
      required:
      - createdAt
      - updatedAt
      - fluoroscopyTestRequestId
      - appropriatenessBand
      - safetyBand
      - radiationDoseBand
      - triageTier
      - targetTimeframe
      - recommendation
      - clinicianNotes
      - gradedAt
      description: 'Computed four-axis grading result: appropriateness (ACR / RCR iRefer 1-9), safety
        (safety band + radiation-dose band), request completeness, and triage priority.'
    FluoroscopyTestRequestGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        fluoroscopyTestRequestGradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        flagId:
          type: string
          maxLength: 50
          description: Stable flag identifier (e.g. F-PREGNANCY-001).
        category:
          type: string
          enum:
          - pregnancy
          - contrast-allergy
          - aspiration-risk
          - suspected-perforation-contrast-choice
          - high-radiation-dose
          - missing-indication
          - missing-clinical-question
          - other
          - ''
          description: Flag category.
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          - ''
          description: 'Priority: low, medium, high.'
        description:
          type: string
          maxLength: 500
          description: Human-readable description of what fired the flag.
        suggestedAction:
          type: string
          maxLength: 500
          description: Suggested clinical action (e.g. "use water-soluble contrast; defer to confirm pregnancy
            status").
      required:
      - createdAt
      - updatedAt
      - fluoroscopyTestRequestGradeId
      - flagId
      - category
      - priority
      - description
      - suggestedAction
      description: Safety-critical flags that fire independently of the four axes, with priority and a
        suggested action for the imaging team.
    FluoroscopyTestRequestGradeRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        fluoroscopyTestRequestGradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        ruleId:
          type: string
          maxLength: 40
          description: Stable rule identifier (e.g. R-APPROP-DYSPHAGIA-01).
        axis:
          type: string
          enum:
          - appropriateness
          - safety
          - completeness
          - triage
          - ''
          description: 'Scoring axis the rule belongs to: appropriateness, safety, completeness, triage.'
        category:
          type: string
          maxLength: 50
          description: Category or indication the rule relates to.
        description:
          type: string
          maxLength: 500
