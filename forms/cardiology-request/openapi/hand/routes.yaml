# Routes no SQL table describes, documented by hand. Merged into
# combined/openapi.yaml by bin/openapi/generate-openapi-combined.py.
paths:
  /api/cardiology_requests/{id}/submit:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      summary: Grade the request and store the grade
      description: Runs the scoring engine over the stored record and replaces any earlier grade, with
        its fired rules and flags, in one transaction. Marks the record submitted.
      operationId: submitCardiologyRequest
      responses:
        '200':
          description: The grade row
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardiologyRequestGrade'
        '404':
          description: CardiologyRequest not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: This client sent too many requests
          headers:
            retry-after:
              description: Seconds to wait before sending again
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/cardiology_requests/{id}/result:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      summary: The stored grade of the request, with its fired rules and flags
      operationId: getCardiologyRequestResult
      responses:
        '200':
          description: The grade, its fired rules, and its flags
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardiologyRequestResult'
        '404':
          description: CardiologyRequest not found, or not yet graded
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: This client sent too many requests
          headers:
            retry-after:
              description: Seconds to wait before sending again
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/dashboard:
    get:
      summary: Each request with its grade, newest first
      description: Lists records newest first, each paired with its grade, or null when ungraded.
      operationId: getDashboard
      parameters:
      - name: status
        in: query
        required: false
        description: Only requests with this status
        schema:
          type: string
      - name: limit
        in: query
        required: false
        description: Rows on a page (default 100, largest 1000). A larger limit is refused, not clamped
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 100
      - name: cursor
        in: query
        required: false
        description: The next page, as the previous page's Link header gave it. Opaque and signed for this list and these filters
        schema:
          type: string
      responses:
        '200':
          description: One page of rows, with no total
          headers:
            link:
              description: The next page, as <...>; rel="next", while more rows follow. Absent on the last page
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CardiologyRequestDashboardRow'
        '422':
          description: The limit or the cursor is not valid
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: This client sent too many requests
          headers:
            retry-after:
              description: Seconds to wait before sending again
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  schemas:
    CardiologyRequestResult:
      type: object
      required:
      - grade
      - firedRules
      - flags
      properties:
        grade:
          $ref: '#/components/schemas/CardiologyRequestGrade'
        firedRules:
          type: array
          items:
            $ref: '#/components/schemas/CardiologyRequestGradeRule'
        flags:
          type: array
          items:
            $ref: '#/components/schemas/CardiologyRequestGradeFlag'
    CardiologyRequestDashboardRow:
      type: object
      required:
      - request
      - grade
      properties:
        request:
          $ref: '#/components/schemas/CardiologyRequest'
        grade:
          oneOf:
          - $ref: '#/components/schemas/CardiologyRequestGrade'
          - type: 'null'
