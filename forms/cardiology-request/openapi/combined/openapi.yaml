      description: Cardiology referral / consult request (referral into cardiology). Captures the requested
        cardiology service and reason, the specific clinical question, presenting symptoms and functional
        class, acute red flags, investigations already performed (ECG, troponin, BNP), cardiac history
        and risk factors, and triage details. This is the source-of-truth record that the four-axis vetting
        grade is computed from.
    CardiologyRequestGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        cardiology_request_id:
          type: string
          format: uuid
          description: Foreign key to the parent request (unique, 1:1).
        appropriateness_band:
          type: string
          enum:
          - usually-appropriate
          - may-be-appropriate
          - usually-not-appropriate
          - ''
          description: 'Axis A appropriateness of referral to cardiology: usually-appropriate, may-be-appropriate,
            usually-not-appropriate.'
        safety_band:
          type: string
          enum:
          - ok
          - caution
          - red-flag
          - ''
          description: 'Axis B safety / red-flag band: ok, caution, red-flag.'
        completeness_percent:
          type: integer
          format: int32
          description: Axis C request completeness as a percentage of mandatory fields (0-100).
        triage_tier:
          type: string
          enum:
          - routine
          - urgent
          - emergency
          - ''
          description: 'Axis D triage priority: routine, urgent, emergency.'
        target_timeframe:
          type: string
          maxLength: 50
          description: Target timeframe for the patient to be seen, implied by the triage tier.
        recommendation:
          type: string
          enum:
          - accept
          - query-referrer
          - redirect
          - reject
          - ''
          description: 'Overall vetting recommendation: accept, query-referrer, redirect, reject.'
        clinician_notes:
          type: string
          description: Free-text vetting / sign-off notes from the cardiology triage clinician.
        signed_at:
          type: string
          format: date-time
          description: Timestamp of the triage clinician electronic signature.
        graded_at:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the grade.
      required:
      - created_at
      - updated_at
      - cardiology_request_id
      - appropriateness_band
      - safety_band
      - triage_tier
      - target_timeframe
      - recommendation
      - clinician_notes
      - graded_at
      description: 'Computed four-axis vetting grade: referral appropriateness, safety / red-flag, request
        completeness, and triage priority. A red flag (suspected acute coronary syndrome, exertional syncope,
        new-onset heart failure) drives the safety axis and auto-escalates the triage tier regardless
        of the other axes.'
    CardiologyRequestGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        cardiology_request_grade_id:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        flag_id:
          type: string
          maxLength: 50
          description: Stable flag identifier (e.g. F-SUSPECTED-ACS-001).
        category:
          type: string
          enum:
          - suspected-acs
          - exertional-syncope
          - new-onset-heart-failure
          - red-flag-chest-pain
          - missing-reason
          - missing-clinical-question
          - other
          - ''
          description: Flag category.
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          - ''
          description: 'Priority: low, medium, high.'
        description:
          type: string
          maxLength: 500
          description: Human-readable description of what fired the flag.
        suggested_action:
          type: string
          maxLength: 500
          description: Suggested clinical action (e.g. "divert to emergency ACS pathway; do not wait for
            routine clinic").
      required:
      - created_at
      - updated_at
      - cardiology_request_grade_id
      - flag_id
      - category
      - priority
      - description
      - suggested_action
      description: Safety-critical flags that fire independently of the four axes, with priority and a
        suggested action for the cardiology triage team.
    CardiologyRequestGradeRule:
      type: object
      properties:
