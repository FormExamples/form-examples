            arrhythmia-ep, valve-clinic, inherited-cardiac-conditions, pre-operative-cardiac, other.'
        referral_reason:
          type: string
          enum:
          - chest-pain
          - breathlessness
          - palpitations
          - syncope
          - heart-failure-symptoms
          - murmur-or-valve
          - abnormal-ecg
          - hypertension
          - arrhythmia
          - pre-operative-assessment
          - other
          - ''
          description: 'Primary reason for referral: chest-pain, breathlessness, palpitations, syncope,
            heart-failure-symptoms, murmur-or-valve, abnormal-ecg, hypertension, arrhythmia, pre-operative-assessment,
            other.'
        clinical_question:
          type: string
          maxLength: 1000
          description: Specific clinical question the cardiology team is asked to answer.
        relevant_history:
          type: string
          maxLength: 1000
          description: Relevant clinical history and context for the referral.
        symptom_chest_pain:
          type: boolean
          description: Whether the patient has chest pain.
        chest_pain_character:
          type: string
          enum:
          - typical-angina
          - atypical
          - non-anginal
          - none
          - ''
          description: 'Character of chest pain per the angina typicality model: typical-angina, atypical,
            non-anginal, none.'
        symptom_breathlessness:
          type: boolean
          description: Whether the patient has breathlessness / dyspnoea.
        nyha_class:
          type: string
          enum:
          - i
          - ii
          - iii
          - iv
          - ''
          description: 'New York Heart Association functional class for breathlessness: i, ii, iii, iv.'
        symptom_palpitations:
          type: boolean
          description: Whether the patient has palpitations.
        symptom_syncope:
          type: boolean
          description: Whether the patient has had syncope or blackout.
        symptom_oedema:
          type: boolean
          description: Whether the patient has peripheral oedema.
        suspected_acs:
          type: boolean
          description: 'Red flag: suspected acute coronary syndrome (warrants emergency pathway, not routine
            referral).'
        exertional_syncope:
          type: boolean
          description: 'Red flag: syncope on exertion (possible structural / arrhythmic cause requiring
            urgent assessment).'
        new_onset_heart_failure:
          type: boolean
          description: 'Red flag: new-onset heart failure (warrants urgent assessment per NICE).'
