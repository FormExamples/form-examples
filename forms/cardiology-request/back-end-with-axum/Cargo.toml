[workspace]

[workspace.package]
rust-version = "1.97"

[package]
name = "cardiology-request-axum-crate"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
publish = false
description = "Cardiology Request back-end JSON API"
default-run = "cardiology-request-axum-crate-cli"

[lib]
path = "src/cardiology_request/lib.rs"

[workspace.dependencies]
axa = { version = "0.6", features = ["pagination", "queue", "ratelimit", "sqlx"] }

[dependencies]
axa = { workspace = true }
serde-saphyr = "2"
sqlx = { version = "0.9", default-features = false, features = ["chrono", "derive", "json", "macros", "migrate", "postgres", "runtime-tokio", "tls-rustls-ring-webpki", "uuid"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.29", features = ["v4", "serde"] }
tokio = { version = "1.54", default-features = false, features = [
  "rt-multi-thread",
  "signal",
  "sync",
] }
async-trait = { version = "0.1" }
axum = { version = "0.8" }
validator = { version = "0.20", features = ["derive"] }
tracing = { version = "0.1" }

[[bin]]
name = "cardiology-request-axum-crate-cli"
path = "src/cardiology_request/bin/main.rs"
required-features = []

[dev-dependencies]
axa = { workspace = true, features = ["testing"] }
serial_test = { version = "3.5.0" }
insta = { version = "1.49", features = ["redactions", "yaml", "filters"] }
