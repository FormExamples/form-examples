components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Clinician full name as recorded in the rota.
        email:
          type: string
          description: Email address.
        phone:
          type: string
          description: Phone number.
        postal_address_as_full_text:
          type: string
          description: Postal address as a single text block.
        country_as_iso_3166_1_alpha_2:
          type: string
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2.
        postcode:
          type: string
          description: Postal code.
        role:
          type: string
          enum:
          - physician
          - cardiologist
          - nurse-practitioner
          - other
          - ''
          description: 'Primary clinical role: physician, cardiologist, nurse-practitioner, or other.'
        registration_body:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - GPhC
          - other
          - ''
          description: 'Professional registration body: GMC, NMC, HCPC, GPhC, or other.'
        registration_number:
          type: string
          description: Professional registration number issued by the registration body.
      required:
      - created_at
      - updated_at
      - name
      - role
      - registration_body
      - registration_number
      description: Clinician identifying information for the clinician performing the TIMI risk-score
        assessment.
    Patient:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          maxLength: 255
          description: Full patient name as recorded on the wristband.
        birth_date:
          type: string
          format: date
          description: Date of birth.
        sex:
          type: string
          enum:
          - female
          - male
          - intersex
          - unknown
          - ''
          description: 'Sex recorded for clinical purposes: female, male, intersex, or unknown.'
        email:
          type: string
          description: Email address.
        phone:
          type: string
          description: Phone number.
        postal_address_as_full_text:
          type: string
          description: Postal address as a single text block.
        country_as_iso_3166_1_alpha_2:
          type: string
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2.
        postcode:
          type: string
          description: Postal code.
        united_kingdom_nhs_number:
          type: string
          maxLength: 20
          description: United Kingdom NHS number, unique per person.
        hospital_mrn:
          type: string
          maxLength: 50
          description: Local hospital medical record number (MRN).
        height_as_cm:
          type: number
          format: double
          description: Height in centimetres.
        weight_as_kg:
          type: number
          format: double
          description: Weight in kilograms.
        body_mass_index:
          type: number
          format: double
          description: Body mass index (BMI), kg/m^2.
        allergies_summary:
          type: string
          description: Free-text summary of known allergies.
      required:
      - created_at
      - updated_at
      - name
      - birth_date
      - sex
      - allergies_summary
      description: Patient demographic information used by the TIMI risk-score assessment.
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          description: A URI identifying the problem type
        title:
          type: string
          description: A short summary of the problem type
        status:
          type: integer
          description: The HTTP status code
        detail:
          type: string
          description: An explanation of this occurrence
        instance:
          type: string
          description: A URI identifying this occurrence
        code:
          type: string
          description: A short machine-readable reason
        errors:
          type: object
          description: Per-field detail, when validation failed
      required:
      - type
      - title
      - status
    TimiRiskScoreForAcuteCoronarySyndrome:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patient_id:
          type: string
          format: uuid
          description: Foreign key to the patient being assessed (delete restricted).
        clinician_id:
          type: string
          format: uuid
          description: Foreign key to the assessing clinician (optional; delete restricted).
        clinician_name:
          type: string
          maxLength: 255
          description: Name of the assessing clinician as recorded on the assessment.
        clinician_role:
          type: string
          enum:
          - physician
          - cardiologist
          - nurse-practitioner
          - other
          - ''
          description: 'Role of the assessing clinician: physician, cardiologist, nurse-practitioner,
            or other.'
        assessed_at:
          type: string
          format: date-time
          description: Date and time the assessment was performed.
        care_setting:
          type: string
          enum:
          - emergency-department
          - chest-pain-unit
          - ward
          - coronary-care
          - other
          - ''
          description: 'Care setting: emergency-department, chest-pain-unit, ward, coronary-care, or other.'
        working_diagnosis:
          type: string
          enum:
          - unstable-angina
          - nstemi
          - ''
          description: 'Working diagnosis: unstable-angina or nstemi.'
        patient_identifier:
          type: string
          maxLength: 100
          description: Local patient identifier as recorded on the assessment.
        sex:
          type: string
          enum:
          - female
          - male
          - intersex
          - unknown
          - ''
          description: 'Patient sex recorded for the assessment: female, male, intersex, or unknown.'
        age_over_65:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Criterion 1 — age >= 65 years (yes/no).
        three_or_more_cad_risk_factors:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Criterion 2 — >= 3 of five coronary risk factors (hypertension, hypercholesterolaemia,
            diabetes, current smoking, family history of premature CAD) present (yes/no).
        known_cad_stenosis:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Criterion 3 — known coronary artery disease with stenosis >= 50% (yes/no).
        aspirin_use_prior_7_days:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Criterion 4 — aspirin use in the prior 7 days (yes/no).
        two_or_more_angina_episodes_24h:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Criterion 5 — >= 2 anginal episodes in the prior 24 hours (yes/no).
        st_deviation:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Criterion 6 — ST deviation >= 0.5 mm on the presenting ECG (yes/no).
        positive_cardiac_marker:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Criterion 7 — positive cardiac marker, elevated troponin or CK-MB (yes/no).
        clinical_note:
          type: string
          description: Free-text clinical note recorded with the assessment.
      required:
      - created_at
      - updated_at
      - patient_id
      - clinician_name
      - clinician_role
      - care_setting
      - working_diagnosis
      - patient_identifier
      - sex
      - age_over_65
      - three_or_more_cad_risk_factors
      - known_cad_stenosis
      - aspirin_use_prior_7_days
      - two_or_more_angina_episodes_24h
      - st_deviation
      - positive_cardiac_marker
      - clinical_note
      description: 'Main TIMI risk-score (UA/NSTEMI) assessment record: assessment context, patient identification,
        and the seven scored criterion inputs.'
    TimiRiskScoreForAcuteCoronarySyndromeGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        timi_risk_score_for_acute_coronary_syndrome_id:
          type: string
          format: uuid
          description: Foreign key to the parent assessment (unique, 1:1).
        total_score:
          type: integer
          format: int32
          description: Summed TIMI score across the seven criteria (0-7 when complete).
        risk_band:
          type: string
          enum:
          - low
          - intermediate
          - high
          - ''
          description: 'Derived risk band: low (0-1), intermediate (2-4), or high (5-7).'
        fourteen_day_event_risk_percent:
          type: number
          format: double
          description: 'Looked-up 14-day risk (%) of the composite end point: all-cause death, new/recurrent
            MI, or severe recurrent ischaemia requiring urgent revascularisation.'
        management:
          type: string
          description: Free-text management recommendation associated with the risk band (e.g. early invasive
            strategy).
        graded_at:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the grade.
      required:
      - created_at
      - updated_at
      - timi_risk_score_for_acute_coronary_syndrome_id
      - risk_band
      - management
      - graded_at
      description: 'Computed TIMI grading result: summed total score (0-7), derived risk band (low/intermediate/high),
        looked-up 14-day composite-event risk percentage, and a management recommendation.'
    TimiRiskScoreForAcuteCoronarySyndromeGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        timi_risk_score_for_acute_coronary_syndrome_grade_id:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        flag_id:
          type: string
          maxLength: 50
          description: Stable flag identifier (e.g. F-HIGH-SCORE-EARLY-INVASIVE-001).
        category:
          type: string
          enum:
          - high-score-early-invasive
          - positive-troponin-st-deviation
          - positive-cardiac-marker
          - st-deviation
          - intermediate-score
          - incomplete-assessment
          - other
          - ''
          description: 'Flag category (see CHECK constraint for enumeration): high-score-early-invasive,
            positive-troponin-st-deviation, positive-cardiac-marker, st-deviation, intermediate-score,
            incomplete-assessment, or other.'
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          - ''
          description: 'Priority: low, medium, high.'
        description:
          type: string
          maxLength: 500
          description: Human-readable description of what fired the flag.
        suggested_action:
          type: string
          maxLength: 500
          description: Suggested clinical action (e.g. "arrange early invasive assessment").
      required:
      - created_at
      - updated_at
      - timi_risk_score_for_acute_coronary_syndrome_grade_id
      - flag_id
      - category
      - priority
      - description
      - suggested_action
      description: Red-flag issues that fire independently of the total score, with priority and a suggested
        action for the clinical team.
    TimiRiskScoreForAcuteCoronarySyndromeGradeRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        timi_risk_score_for_acute_coronary_syndrome_grade_id:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        rule_id:
          type: string
          maxLength: 40
          description: Stable rule identifier (e.g. R-AGE-01).
        criterion:
          type: string
          enum:
          - age
          - risk-factors
          - known-cad
          - aspirin
          - angina
          - st-deviation
          - cardiac-marker
          - band
          description: 'Scored criterion the rule belongs to: age, risk-factors, known-cad, aspirin, angina,
            st-deviation, cardiac-marker, or band.'
        points:
          type: integer
          format: int32
          description: Points (0 or 1) contributed by this rule for its criterion.
        category:
          type: string
          maxLength: 50
          description: Subject category (e.g. criterion-fired, band-assignment).
        description:
          type: string
          maxLength: 500
          description: Human-readable description of why the rule fired.
      required:
      - created_at
      - updated_at
      - timi_risk_score_for_acute_coronary_syndrome_grade_id
      - rule_id
      - criterion
      - category
      - description
      description: 'Audit trail of every grading rule that fired during TIMI computation: criterion, points
        contributed, category, and description.'
