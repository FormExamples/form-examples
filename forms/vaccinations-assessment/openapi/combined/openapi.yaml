components:
  schemas:
    AdditionalFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        gradeId:
          type: string
          format: uuid
          description: Foreign key to the grade table.
        flagId:
          type: string
          maxLength: 30
          description: Identifier of the additional flag (e.g. FLAG-VAX-001).
        category:
          type: string
          maxLength: 50
          description: Category grouping for the flag.
        message:
          type: string
          description: Human-readable message describing the flag.
        priority:
          type: string
          enum:
          - high
          - medium
          - low
          description: 'Flag priority: high, medium, or low.'
      required:
      - createdAt
      - updatedAt
      - gradeId
      - flagId
      - category
      - message
      - priority
      description: Additional flags raised during vaccination assessment. Many-to-one child of grade.
    AdministrationRecord:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        assessmentId:
          type: string
          format: uuid
          description: Foreign key to the assessment table.
        vaccineName:
          type: string
          maxLength: 255
          description: Vaccine name.
        batchNumber:
          type: string
          maxLength: 50
          description: Batch number.
        expiryDate:
          type:
          - string
          - 'null'
          format: date
          description: Expiry date.
        administrationSite:
          type: string
          enum:
          - leftDeltoid
          - rightDeltoid
          - leftThigh
          - rightThigh
          - oral
          - nasal
          - ''
          description: 'Administration site. One of: leftDeltoid, rightDeltoid, leftThigh, rightThigh,
            oral, nasal.'
        administrationRoute:
          type: string
          enum:
          - intramuscular
          - subcutaneous
          - intradermal
          - oral
          - nasal
          - ''
          description: 'Administration route. One of: intramuscular, subcutaneous, intradermal, oral,
            nasal.'
        doseNumber:
          type: string
          enum:
          - '1'
          - '2'
          - '3'
          - booster
          - ''
          description: 'Dose number. One of: 1, 2, 3, booster.'
        administeredBy:
          type: string
          maxLength: 255
          description: Administered by.
        administrationDate:
          type:
          - string
          - 'null'
          format: date
          description: Administration date.
      required:
      - createdAt
      - updatedAt
      - assessmentId
      - vaccineName
      - batchNumber
      - administrationSite
      - administrationRoute
      - doseNumber
      - administeredBy
      description: Vaccine administration details including batch, site, and route. One-to-one child of
        assessment.
    AdultVaccinations:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        assessmentId:
          type: string
          format: uuid
          description: Foreign key to the assessment table.
        tdIpvBooster:
          type:
          - integer
          - 'null'
          format: int32
          description: Td ipv booster.
        hpv:
          type:
          - integer
          - 'null'
          format: int32
          description: Hpv.
        meningitisAcwy:
          type:
          - integer
          - 'null'
          format: int32
          description: Meningitis acwy.
        influenzaAnnual:
          type:
          - integer
          - 'null'
          format: int32
          description: Influenza annual.
        covid19:
          type:
          - integer
          - 'null'
          format: int32
          description: Covid19.
        shingles:
          type:
          - integer
          - 'null'
          format: int32
          description: Shingles.
        pneumococcalPpv:
          type:
          - integer
          - 'null'
          format: int32
          description: Pneumococcal ppv.
      required:
      - createdAt
      - updatedAt
      - assessmentId
      description: Adult vaccination status (0=Not Given, 1=Partial, 2=Complete). One-to-one child of
        assessment.
    Assessment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the patient who owns this assessment.
        status:
          type: string
          enum:
