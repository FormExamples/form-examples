components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Full name of the preparer or staff member.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as a single text block.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code (ZIP code).
        role:
          type: string
          enum:
          - preparer
          - field-office-staff
          - legal-guardian
          - other
          - ''
          description: 'Role: preparer, field-office-staff, legal-guardian, or other.'
        organization:
          type: string
          description: Organization the preparer works for, such as a school, agency, or field office.
        staffIdentifier:
          type: string
          description: Organization-assigned identifier of the preparer.
      required:
      - createdAt
      - updatedAt
      - name
      - role
      - organization
      - staffIdentifier
      description: Clinician information for the preparer or assisting staff member who helps complete
        the Social Security card application.
    Patient:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          maxLength: 255
          description: Full name of the applicant.
        birthDate:
          type: string
          format: date
          description: Date of birth of the applicant.
        sex:
          type: string
          enum:
          - female
          - male
          - other
          - unknown
          - ''
          description: 'Sex recorded for the applicant: female, male, other, or unknown.'
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as a single text block.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code (ZIP code).
        usStateCode:
          type: string
          maxLength: 2
          description: Two-letter USPS code of the state or territory of residence.
      required:
      - createdAt
      - updatedAt
      - name
      - birthDate
      - sex
      - usStateCode
      description: Applicant demographic information for the person who needs a Social Security card.
        The Social Security number is never stored.
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          description: A URI identifying the problem type
        title:
          type: string
          description: A short summary of the problem type
        status:
          type: integer
          description: The HTTP status code
        detail:
          type: string
          description: An explanation of this occurrence
        instance:
          type: string
          description: A URI identifying this occurrence
        code:
          type: string
          description: A short machine-readable reason
        errors:
          type: object
          description: Per-field detail, when validation failed
      required:
      - type
      - title
      - status
    Ss5Application:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the applicant (the person named in item 1; restrict delete).
        clinicianId:
          type:
          - string
          - 'null'
          format: uuid
          description: Foreign key to the preparer or assisting staff member (restrict delete); optional.
        applicationDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the application is signed and submitted (SS-5 item 15); the reference date
            for age rules.
        requestType:
          type: string
          enum:
          - original
          - replacement
          - correction
          - ''
          description: 'What the applicant asks SSA for: an original card, a replacement card, or a corrected
            card.'
        channel:
          type: string
          enum:
          - in-person
          - mail
          - ''
          description: How the application is submitted; applicants aged 12 or older for an original card
            must apply in person.
        previouslyApplied:
          type: string
          enum:
          - 'yes'
          - 'no'
          - dont-know
          - ''
          description: Whether the person has ever applied for or received an SSN or card (SS-5 item 12).
        nameChange:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the name on the card differs because of a legal name change.
        nameChangeReason:
          type: string
          enum:
          - marriage
          - divorce
          - court-order
          - other
          - ''
          description: Reason for the legal name change.
        dateOfBirthCorrection:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the request corrects the date of birth recorded by SSA.
        replacementsThisYear:
          type:
          - integer
          - 'null'
          format: int32
          description: Replacement cards already issued in the current calendar year (limit 3).
        replacementsLifetime:
          type:
          - integer
          - 'null'
          format: int32
          description: Replacement cards already issued in the lifetime of the number holder (limit 10).
        limitExceptionReason:
          type: string
          enum:
          - name-change
          - legend-change
          - non-receipt
          - ssa-error
          - hardship
          - ''
          description: Exception reason claimed when a replacement limit is reached.
        limitExceptionEvidence:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether documentation supporting the claimed exception reason is available.
        nameOnCard:
          type: string
          description: Full name to be shown on the card (item 1).
        nameAtBirth:
          type: string
          description: Full name at birth (item 2).
        otherNamesUsed:
          type: string
          description: Other names used (item 3).
        nameOnMostRecentCard:
          type: string
          description: Name on the most recent Social Security card (item 13).
        dateOfBirth:
          type:
          - string
          - 'null'
          format: date
          description: Date of birth (item 7).
        placeOfBirthCity:
          type: string
          description: City or town of birth (item 6).
        placeOfBirthRegion:
          type: string
          description: State, province, or country of birth (item 6).
        sex:
          type: string
          enum:
          - female
          - male
          - ''
          description: 'Sex as recorded on the SS-5 (item 11): female or male.'
        citizenship:
          type: string
          enum:
          - us-citizen
          - legal-alien-allowed-to-work
          - legal-alien-not-allowed-to-work
          - other
          - ''
          description: Citizenship or alien status (item 8).
        nonWorkReasonValid:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'For a lawfully admitted noncitizen not allowed to work: whether a valid non-work
            reason (federal or state benefit or law) is documented.'
        motherNameAtBirth:
          type: string
          description: Mother name at her birth (item 4); write unknown if not known.
        fatherName:
          type: string
          description: Father name (item 5); write unknown if not known.
        stateOfResidence:
          type: string
          maxLength: 2
          description: Two-letter USPS code of the state or territory of residence.
        mailingAddress:
          type: string
          description: Mailing address where the card is sent (item 17).
        phone:
          type: string
          description: Daytime telephone number (item 16).
        identityDocument:
          type: string
          enum:
          - us-driver-license
          - state-id-card
          - us-passport
          - military-id
          - employee-id
          - school-id
          - health-insurance-card
          - other
          - none
          - ''
          description: Primary proof of identity presented; must be current, unexpired, and show name,
            identifying information, and preferably a photograph.
        identityDocumentExpired:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the identity document is expired.
        ageDocument:
          type: string
          enum:
          - us-birth-certificate
          - us-passport
          - hospital-record
          - religious-record
          - immigration-record
          - other
          - none
          - ''
          description: Proof of age presented; a birth certificate is preferred.
        citizenshipDocument:
          type: string
          enum:
          - us-birth-certificate
          - us-passport
          - certificate-of-naturalization
          - certificate-of-citizenship
          - consular-report-of-birth-abroad
          - permanent-resident-card
          - i-94-with-work-authorization
          - employment-authorization-document
          - other
          - none
          - ''
          description: Proof of US citizenship or lawful alien status presented.
        citizenshipOnFile:
          type: string
          enum:
          - 'yes'
          - 'no'
          - dont-know
          - ''
          description: Whether SSA already holds citizenship or status evidence for this number (relevant
            to replacement cards).
        nameChangeDocument:
          type: string
          enum:
          - marriage-certificate
          - divorce-decree
          - court-order
          - certificate-of-naturalization
          - other
          - none
          - ''
          description: Document proving the legal name change.
        documentsOriginalOrCertified:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether every document is an original or a copy certified by the issuing agency;
            photocopies and notarized copies are not accepted.
        signerRelationship:
          type: string
          enum:
          - self
          - parent
          - legal-guardian
          - custodian
          - other
          - ''
          description: Relationship of the person signing to the person in item 1 (item 18).
        signerName:
          type: string
          description: Name of the person signing when not the applicant.
        signerIdentityDocument:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the signer, when not the applicant, presented their own proof of identity.
        signaturePresent:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the application is signed (item 19).
        applicantDeceased:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Tell SSA: whether the person in item 1 has died; a card cannot be issued and the
