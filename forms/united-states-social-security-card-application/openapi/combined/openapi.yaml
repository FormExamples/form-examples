      description: 'Main Form SS-5 application record: request type, applicant items, evidence documents
        presented, filer and signature, and death-related Tell-SSA items. Classification, fired rules,
        and flags live in child tables. The Social Security number is never stored.'
    Ss5ApplicationGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        ss5ApplicationId:
          type: string
          format: uuid
          description: Foreign key to the parent application (unique, 1:1).
        applicationClass:
          type: string
          enum:
          - ready-to-submit
          - incomplete
          - evidence-missing
          - not-eligible
          - ''
          description: 'Application class: ready-to-submit, incomplete, evidence-missing, or not-eligible
            (not-eligible takes precedence, then incomplete, then evidence-missing).'
        missingEvidenceCount:
          type: integer
          format: int32
          description: Number of required evidence items that are missing, expired, or not acceptable.
        replacementLimitReached:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether a replacement card limit (3 per year or 10 per lifetime) is already reached
            (yes/no).
        gradedAt:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the classification.
      required:
      - createdAt
      - updatedAt
      - ss5ApplicationId
      - applicationClass
      - missingEvidenceCount
      - replacementLimitReached
      - gradedAt
      description: 'Computed completeness and evidence classification for a Social Security card application:
        class (ready-to-submit/incomplete/evidence-missing/not-eligible), count of missing evidence items,
        and whether a replacement limit is reached.'
    Ss5ApplicationGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        ss5ApplicationGradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        flagId:
          type: string
          maxLength: 50
          description: Stable flag identifier (e.g. F-REPLACEMENT-LIMIT-001).
        category:
          type: string
          enum:
          - applicant-deceased
          - replacement-limit
          - identity-evidence
          - age-evidence
          - citizenship-evidence
          - work-authorization
          - name-change-evidence
          - document-quality
          - in-person-required
          - signer-authority
          - missing-field
          - state-verify
          - other
          - ''
          description: 'Flag category: applicant-deceased, replacement-limit, identity-evidence, age-evidence,
            citizenship-evidence, work-authorization, name-change-evidence, document-quality, in-person-required,
            signer-authority, missing-field, state-verify, or other.'
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          - ''
          description: 'Priority: low, medium, high.'
        description:
          type: string
          maxLength: 500
          description: Human-readable description of what fired the flag.
        suggestedAction:
          type: string
          maxLength: 500
          description: Suggested action (e.g. "bring an unexpired photo identity document", "report the
            death to SSA instead").
      required:
      - createdAt
      - updatedAt
      - ss5ApplicationGradeId
      - flagId
      - category
      - priority
      - description
      - suggestedAction
      description: Flagged issues that fire independently of the application class, with priority and
        a suggested action for the applicant or the person preparing the application.
    Ss5ApplicationGradeRule:
