logger:
  enable: true
  pretty_backtrace: true
  level: debug
  format: compact

server:
  port: 5171
  binding: localhost
  host: http://localhost
  middlewares:
    static:
      enable: false
      must_exist: false
      precompressed: false
      folder:
        uri: /static
        path: assets/static
    cors:
      enable: true
      allow_origins:
        - http://localhost:5171
      allow_methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      allow_headers:
        - Content-Type
        - Authorization

workers:
  mode: BackgroundQueue

queue:
  kind: Postgres
  uri: postgres://postgres:postgres@localhost:5432/obstetrics_assessment_development
  dangerously_flush: false
  num_workers: 2

database:
  uri: postgres://postgres:postgres@localhost:5432/obstetrics_assessment_development
  enable_logging: false
  connect_timeout: 500
  idle_timeout: 500
  min_connections: 1
  max_connections: 5
  auto_migrate: true
  dangerously_truncate: false
  dangerously_recreate: false
