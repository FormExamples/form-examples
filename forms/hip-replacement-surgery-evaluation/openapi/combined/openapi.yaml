components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Name.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as full text.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code, such as for validating the postal address.
        role:
          type: string
          enum:
          - orthopaedic-surgeon
          - extended-scope-physiotherapist
          - orthopaedic-registrar
          - nurse-practitioner
          - other
          - ''
          description: Clinician role, i.e. the job role the practitioner holds in the joint-replacement
            clinic.
        gmcNumber:
          type: string
          description: General Medical Council (GMC) registration number, or the equivalent professional
            registration number for a non-medical practitioner such as an extended-scope physiotherapist.
        siteName:
          type: string
          description: Site where the clinician usually practises, such as the hospital or joint-replacement
            clinic.
        employer:
          type: string
          description: Employer, such as the NHS trust or health board.
      required:
      - createdAt
      - updatedAt
      - name
      - role
      - gmcNumber
      - siteName
      - employer
      description: Clinician, i.e. the orthopaedic surgeon or extended-scope physiotherapist who conducts
        the hip-replacement surgery evaluation.
    HipReplacementSurgeryEvaluation:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the patient table.
        clinicianId:
          type: string
          format: uuid
          description: Foreign key to the clinician table, i.e. the practitioner conducting the evaluation.
        status:
          type: string
          enum:
          - draft
          - submitted
          - reviewed
          - urgent
          description: 'Workflow status of the evaluation: draft, submitted, reviewed, or urgent.'
        assessmentDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the evaluation was conducted.
        assessmentTime:
          type:
          - string
          - 'null'
          format: time
          description: Time the evaluation was conducted.
        siteName:
          type: string
          maxLength: 255
          description: Site where the evaluation was conducted, such as the joint-replacement clinic.
        affectedSide:
          type: string
          enum:
          - left
          - right
          - bilateral
          - ''
          description: 'Hip side affected: left, right, or bilateral.'
        symptomDurationMonths:
          type:
          - integer
          - 'null'
          format: int32
          description: Duration of hip symptoms in months.
        painAtRest010:
          type:
          - integer
          - 'null'
          format: int32
          description: Pain severity at rest, 0 (none) to 10 (worst imaginable).
        painOnActivity010:
          type:
          - integer
          - 'null'
          format: int32
          description: Pain severity on activity, 0 (none) to 10 (worst imaginable).
        nightPain:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the patient reports night pain.
        priorHipSurgery:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the patient has had prior surgery on the affected hip.
        priorHipSurgeryDetail:
          type: string
          description: Description of any prior hip surgery, such as arthroscopy or osteotomy.
        priorInjuryOrDysplasiaHistory:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the patient has a history of prior hip injury or developmental dysplasia
            of the hip.
        priorInjuryOrDysplasiaDetail:
          type: string
          description: Description of the prior hip injury or dysplasia history.
        ohsPainSeverity:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Oxford Hip Score item 1: usual hip pain severity, 0 (worst) to 4 (best).'
        ohsWashingAndDrying:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Oxford Hip Score item 2: difficulty washing and drying yourself because of your
            hip, 0 (worst) to 4 (best).'
        ohsTransport:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Oxford Hip Score item 3: difficulty getting in and out of a car, or using public
            transport, because of your hip, 0 (worst) to 4 (best).'
        ohsDressingSocks:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Oxford Hip Score item 4: difficulty putting on a pair of socks or stockings because
            of your hip, 0 (worst) to 4 (best).'
        ohsShopping:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Oxford Hip Score item 5: ability to do the household shopping on your own, 0 (worst)
            to 4 (best).'
        ohsWalkingPain:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Oxford Hip Score item 6: pain experienced walking, 0 (worst) to 4 (best).'
        ohsLimping:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Oxford Hip Score item 7: limping when walking because of your hip, 0 (worst) to
            4 (best).'
        ohsKneeling:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Oxford Hip Score item 8: difficulty kneeling and getting up again afterwards because
            of your hip, 0 (worst) to 4 (best).'
        ohsNightPain:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Oxford Hip Score item 9: how often has hip pain troubled you in bed at night,
            0 (worst) to 4 (best).'
        ohsWorkInterference:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Oxford Hip Score item 10: how much has hip pain interfered with your usual work,
            0 (worst) to 4 (best).'
        ohsGivingWay:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Oxford Hip Score item 11: how often has the hip felt like it might suddenly give
            way or let you down, 0 (worst) to 4 (best).'
        ohsStairs:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Oxford Hip Score item 12: ability to walk down a flight of stairs, 0 (worst) to
            4 (best).'
        walkingDistanceBeforePain:
          type: string
          enum:
          - unlimited
          - over-1km
          - 100m-to-1km
          - under-100m
          - housebound
          - ''
          description: 'Walking distance before pain forces a stop: unlimited, over 1km, 100m to 1km,
            under 100m, or housebound.'
        shoesAndSocksDifficulty:
          type: string
          enum:
          - none
          - some
          - severe
          - unable
          - ''
          description: 'Difficulty putting on shoes and socks: none, some, severe, or unable.'
        walkingAidUse:
          type: string
          enum:
          - none
          - stick
          - frame
          - wheelchair
          - ''
          description: 'Walking aid in use: none, stick, frame, or wheelchair.'
        limpPresent:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether a limp is present on examination.
        antalgicGait:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether an antalgic (pain-avoiding) gait is present on examination.
        trendelenburgSign:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the Trendelenburg sign is positive, indicating hip abductor weakness relevant
            to surgical planning.
        legLengthDiscrepancyAsCm:
          type:
          - number
          - 'null'
          format: double
          description: Measured leg-length discrepancy in cm; greater than 2cm affects surgical planning.
        flexionDegrees:
          type:
          - integer
          - 'null'
          format: int32
          description: Hip flexion range of motion in degrees.
        internalRotationDegrees:
          type:
          - integer
          - 'null'
          format: int32
          description: Hip internal rotation range of motion in degrees.
        externalRotationDegrees:
          type:
          - integer
          - 'null'
          format: int32
          description: Hip external rotation range of motion in degrees.
        abductionDegrees:
          type:
          - integer
          - 'null'
          format: int32
          description: Hip abduction range of motion in degrees.
        adductionDegrees:
          type:
          - integer
          - 'null'
          format: int32
          description: Hip adduction range of motion in degrees.
        fixedFlexionDeformityPresent:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether a fixed flexion deformity is present on examination.
        hipAbductorStrengthMrc:
          type:
          - integer
          - 'null'
          format: int32
          description: Hip abductor muscle strength on the Medical Research Council (MRC) 0 to 5 scale.
        jointStability:
          type: string
          enum:
          - stable
          - unstable
          - ''
          description: 'Joint stability on examination: stable or unstable.'
        tendernessSite:
          type: string
          enum:
          - none
          - groin
          - trochanteric
          - buttock
          - other
          - ''
          description: 'Site of tenderness on examination: none, groin, trochanteric, buttock, or other.'
        weightBearingXrayPerformed:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether a weight-bearing pelvic or hip X-ray was performed.
        kellgrenLawrenceGrade:
          type:
          - integer
          - 'null'
          format: int32
          description: Kellgren and Lawrence radiographic osteoarthritis grade, 0 (none) to 4 (severe).
        jointSpaceNarrowing:
          type: string
          enum:
          - none
          - mild
          - moderate
          - severe
          - ''
          description: 'Degree of joint-space narrowing on imaging: none, mild, moderate, or severe.'
        subchondralSclerosisOrCystsPresent:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether subchondral sclerosis or cysts are present on imaging.
        mriPerformed:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether an MRI was performed.
        mriFindings:
          type: string
          description: Free-text MRI findings.
        ctPerformed:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether a CT scan was performed.
        ctIndication:
          type: string
          enum:
          - none
          - robotic-assisted-planning
          - complex-deformity
          - other
          - ''
          description: Indication for the CT scan, such as robotic-assisted surgical planning or a complex
            deformity.
        physiotherapyTried:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether physiotherapy has been tried as a conservative measure.
        physiotherapyDurationWeeks:
          type:
          - integer
          - 'null'
          format: int32
          description: Duration of the physiotherapy trial in weeks.
        weightManagementAdviceGiven:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether weight-management advice has been given as a conservative measure.
        steroidInjectionGiven:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether an intra-articular steroid injection has been given as a conservative measure.
        steroidInjectionCount:
          type:
          - integer
          - 'null'
          format: int32
          description: Number of intra-articular steroid injections given.
        steroidInjectionResponse:
          type: string
          enum:
          - no-relief
          - partial-relief
          - good-relief
          - ''
          description: 'Response to the intra-articular steroid injection: no relief, partial relief,
            or good relief.'
        analgesicTrialGiven:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether a trial of NSAID or other analgesic medication has been given as a conservative
            measure.
        analgesicTrialResponse:
          type: string
          enum:
          - no-relief
          - partial-relief
          - good-relief
          - ''
          description: 'Response to the analgesic trial: no relief, partial relief, or good relief.'
        walkingAidTrial:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether a walking-aid trial has been given as a conservative measure.
        conservativeMeasuresExhausted:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether all appropriate conservative measures have been exhausted, i.e. the primary
            gate on surgical candidacy alongside the Oxford Hip Score and the Kellgren and Lawrence grade.
        diabetesControlled:
          type: string
          enum:
          - not-diabetic
          - controlled
          - poorly-controlled
          - ''
          description: 'Diabetes control status: not diabetic, controlled, or poorly controlled.'
        cardiacDiseasePresent:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether cardiac disease is present.
        bleedingDisorderOrAnticoagulantUse:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether a bleeding disorder is present or an anticoagulant medicine is in use.
        smokingStatus:
          type: string
          enum:
          - never
          - ex-smoker
          - current-smoker
          - ''
          description: 'Smoking status: never, ex-smoker, or current smoker.'
        generalFitnessNote:
          type: string
          description: Free-text general surgical-fitness note. Detailed ASA grading belongs to the pre-operative
            assessment forms, not here.
        fullBloodCountDone:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether a full blood count has been done as part of the pre-operative baseline.
        renalFunctionDone:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether renal function tests have been done as part of the pre-operative baseline.
        clottingOrInrDone:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether clotting studies or INR have been done as part of the pre-operative baseline.
        ecgDone:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether an ECG has been done as part of the pre-operative baseline.
        mrsaScreenDone:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether an MRSA screen has been done as part of the pre-operative baseline.
        urinalysisDone:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether urinalysis has been done as part of the pre-operative baseline.
        risksAndBenefitsDiscussed:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the risks and benefits of surgery have been discussed with the patient.
        realisticExpectationsDiscussed:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether realistic expectations of surgical outcome have been discussed with the
            patient.
        patientDecisionAidGiven:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether a patient decision aid has been given.
        interpreterRequired:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether an interpreter is required for shared decision-making.
        interpreterLanguage:
          type: string
          maxLength: 100
          description: Language the interpreter is required for.
        recommendation:
          type: string
          enum:
          - total-hip-replacement
          - hip-resurfacing
          - continue-conservative-management
          - mdt-review
          - not-currently-a-candidate
          - ''
          description: 'Clinician recommendation: total hip replacement, hip resurfacing, continue conservative
            management, MDT review, or not currently a candidate.'
        targetListDate:
          type:
          - string
          - 'null'
          format: date
          description: Target date to add the patient to the surgical waiting list, where applicable.
        responsibleSurgeon:
          type: string
          maxLength: 255
          description: Name of the surgeon responsible for the planned procedure.
        additionalNotes:
          type: string
          description: Free-text summary notes.
      required:
      - createdAt
      - updatedAt
      - patientId
      - clinicianId
      - status
      - siteName
      - affectedSide
      - nightPain
      - priorHipSurgery
      - priorHipSurgeryDetail
      - priorInjuryOrDysplasiaHistory
      - priorInjuryOrDysplasiaDetail
      - walkingDistanceBeforePain
      - shoesAndSocksDifficulty
      - walkingAidUse
      - limpPresent
      - antalgicGait
      - trendelenburgSign
      - fixedFlexionDeformityPresent
      - jointStability
      - tendernessSite
      - weightBearingXrayPerformed
