      description: 'Hip-replacement surgery evaluation: the payload of the 15-step single-page wizard,
        i.e. the orthopaedic assessment of whether a patient''s hip disease and functional decline justify
        total hip arthroplasty and whether conservative options have been exhausted.'
    HipReplacementSurgeryEvaluationGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        hipReplacementSurgeryEvaluationId:
          type: string
          format: uuid
          description: Foreign key to the hip_replacement_surgery_evaluation table, unique because grading
            is one-to-one with the evaluation.
        ohsTotal:
          type:
          - integer
          - 'null'
          format: int32
          description: Oxford Hip Score total, 0 to 48, being the sum of the 12 items, where 48 is the
            best outcome.
        ohsCategory:
          type: string
          enum:
          - severe
          - moderate
          - mild-to-moderate
          - satisfactory
          - ''
          description: 'Oxford Hip Score category computed by the engine: severe (0-19), moderate (20-29),
            mild-to-moderate (30-39), or satisfactory (40-48). This banding is this form''s operational
            convention; see spec/index.md.'
        computedCandidacy:
          type: string
          enum:
          - strong-candidate
          - candidate
          - continue-conservative
          - not-indicated
          - mdt-review
          - ''
          description: 'Surgical-candidacy recommendation computed by the engine from the Oxford Hip Score
            total, the Kellgren and Lawrence grade, and whether conservative measures are exhausted: strong-candidate,
            candidate, continue-conservative, not-indicated, or mdt-review.'
        finalCandidacy:
          type: string
          enum:
          - strong-candidate
          - candidate
          - continue-conservative
          - not-indicated
          - mdt-review
          - ''
          description: Surgical-candidacy recommendation signed off by the clinician, which may equal
            or differ from the computed value.
        overrideReason:
          type: string
          maxLength: 500
          description: Reason the clinician set a final candidacy differently from the computed value,
            mandatory when they differ.
        clinicianNotes:
          type: string
          description: Free-text clinician summary notes.
        signedByName:
          type: string
          maxLength: 255
          description: Name of the clinician who signed the evaluation.
        signedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Timestamp of the clinician electronic signature.
        gradedAt:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the result.
      required:
      - createdAt
      - updatedAt
      - hipReplacementSurgeryEvaluationId
      - ohsCategory
      - computedCandidacy
      - finalCandidacy
      - overrideReason
      - clinicianNotes
      - signedByName
      - gradedAt
      description: Computed and signed-off grading result for one hip-replacement surgery evaluation.
        Stores both the engine-computed values and the clinician-final values with an override reason.
    HipReplacementSurgeryEvaluationGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        hipReplacementSurgeryEvaluationGradeId:
          type: string
          format: uuid
          description: Foreign key to the parent hip_replacement_surgery_evaluation_grade table.
        flagId:
          type: string
          maxLength: 50
          description: Stable flag identifier, such as F-CONSERVATIVE-TREATMENT-NOT-EXHAUSTED-001.
        category:
          type: string
          enum:
          - conservative-treatment-not-exhausted
          - high-bmi-surgical-risk
          - pre-op-bloods-incomplete
          - leg-length-discrepancy-significant
          - trendelenburg-positive
          - bilateral-symptomatic
          - paediatric
          - other
          - ''
          description: Flag category, such as conservative-treatment-not-exhausted or trendelenburg-positive.
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          - ''
          description: 'Priority: low, medium, or high.'
        description:
          type: string
          maxLength: 500
          description: Human-readable description of what fired the flag.
        suggestedAction:
          type: string
          maxLength: 500
          description: Suggested clinical action, such as "complete pre-operative bloods before listing
            for surgery".
      required:
      - createdAt
      - updatedAt
      - hipReplacementSurgeryEvaluationGradeId
      - flagId
      - category
      - priority
      - description
      - suggestedAction
      description: Safety-critical flags that fire independently of the candidacy recommendation, with
        a priority and a suggested action for the joint-replacement clinic team.
    Patient:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          maxLength: 255
          description: Name.
