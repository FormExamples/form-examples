      description: 'Hip-replacement surgery evaluation: the payload of the 15-step single-page wizard,
        i.e. the orthopaedic assessment of whether a patient''s hip disease and functional decline justify
        total hip arthroplasty and whether conservative options have been exhausted.'
    HipReplacementSurgeryEvaluationGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        hip_replacement_surgery_evaluation_id:
          type: string
          format: uuid
          description: Foreign key to the hip_replacement_surgery_evaluation table, unique because grading
            is one-to-one with the evaluation.
        ohs_total:
          type: integer
          format: int32
          description: Oxford Hip Score total, 0 to 48, being the sum of the 12 items, where 48 is the
            best outcome.
        ohs_category:
          type: string
          enum:
          - severe
          - moderate
          - mild-to-moderate
          - satisfactory
          - ''
          description: 'Oxford Hip Score category computed by the engine: severe (0-19), moderate (20-29),
            mild-to-moderate (30-39), or satisfactory (40-48). This banding is this form''s operational
            convention; see spec/index.md.'
        computed_candidacy:
          type: string
          enum:
          - strong-candidate
          - candidate
          - continue-conservative
          - not-indicated
          - mdt-review
          - ''
          description: 'Surgical-candidacy recommendation computed by the engine from the Oxford Hip Score
            total, the Kellgren and Lawrence grade, and whether conservative measures are exhausted: strong-candidate,
            candidate, continue-conservative, not-indicated, or mdt-review.'
        final_candidacy:
          type: string
          enum:
          - strong-candidate
          - candidate
          - continue-conservative
          - not-indicated
          - mdt-review
          - ''
          description: Surgical-candidacy recommendation signed off by the clinician, which may equal
            or differ from the computed value.
        override_reason:
          type: string
          maxLength: 500
          description: Reason the clinician set a final candidacy differently from the computed value,
            mandatory when they differ.
        clinician_notes:
          type: string
          description: Free-text clinician summary notes.
        signed_by_name:
          type: string
          maxLength: 255
          description: Name of the clinician who signed the evaluation.
        signed_at:
          type: string
          format: date-time
          description: Timestamp of the clinician electronic signature.
        graded_at:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the result.
      required:
      - created_at
      - updated_at
      - hip_replacement_surgery_evaluation_id
      - ohs_category
      - computed_candidacy
      - final_candidacy
      - override_reason
      - clinician_notes
      - signed_by_name
      - graded_at
      description: Computed and signed-off grading result for one hip-replacement surgery evaluation.
        Stores both the engine-computed values and the clinician-final values with an override reason.
    HipReplacementSurgeryEvaluationGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        hip_replacement_surgery_evaluation_grade_id:
          type: string
          format: uuid
          description: Foreign key to the parent hip_replacement_surgery_evaluation_grade table.
        flag_id:
          type: string
          maxLength: 50
          description: Stable flag identifier, such as F-CONSERVATIVE-TREATMENT-NOT-EXHAUSTED-001.
        category:
          type: string
          enum:
          - conservative-treatment-not-exhausted
          - high-bmi-surgical-risk
          - pre-op-bloods-incomplete
          - leg-length-discrepancy-significant
          - trendelenburg-positive
          - bilateral-symptomatic
          - paediatric
          - other
          - ''
          description: Flag category, such as conservative-treatment-not-exhausted or trendelenburg-positive.
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          - ''
          description: 'Priority: low, medium, or high.'
        description:
          type: string
          maxLength: 500
          description: Human-readable description of what fired the flag.
        suggested_action:
          type: string
          maxLength: 500
          description: Suggested clinical action, such as "complete pre-operative bloods before listing
            for surgery".
      required:
      - created_at
      - updated_at
      - hip_replacement_surgery_evaluation_grade_id
      - flag_id
      - category
      - priority
      - description
      - suggested_action
      description: Safety-critical flags that fire independently of the candidacy recommendation, with
        a priority and a suggested action for the joint-replacement clinic team.
    Patient:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        name:
          type: string
          maxLength: 255
          description: Name.
        birth_date:
          type: string
          format: date
          description: Birth date, such as for calculating age and for the paediatric safety flag, because
            the Oxford Hip Score is not validated below 16 years.
        sex:
          type: string
          enum:
          - female
          - male
          - intersex
          - prefer-not-to-say
          - ''
          description: Sex.
        email:
          type: string
          description: Email address.
        phone:
          type: string
          description: Phone number.
        postal_address_as_full_text:
          type: string
          description: Postal address as full text.
        country_as_iso_3166_1_alpha_2:
          type: string
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type: string
          description: Postal code, such as for validating the postal address.
        united_kingdom_nhs_number:
          type: string
          maxLength: 20
          description: United Kingdom NHS number, unique per person.
        height_as_cm:
          type: number
          format: double
          description: Height measurement in cm, such as for calculating body mass index (BMI).
        weight_as_kg:
          type: number
          format: double
          description: Weight measurement in kg, such as for calculating body mass index (BMI).
        body_mass_index:
          type: number
          format: double
          description: Body mass index (BMI) measurement, i.e. weight in kg divided by the square of height
            in metres, such as for the high-bmi-surgical-risk safety flag when 40 or above.
      required:
      - created_at
      - updated_at
      - name
      - sex
      description: Patient.
