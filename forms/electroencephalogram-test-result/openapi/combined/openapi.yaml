        country_as_iso_3166_1_alpha_2:
          type: string
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type: string
          description: Postal code, such as for validating the postal address.
        role:
          type: string
          enum:
          - neurologist
          - clinical-neurophysiologist
          - physiologist
          - other
          - ''
          description: 'Reporting clinician role: neurologist, clinical-neurophysiologist, physiologist,
            other.'
        registration_body:
          type: string
          enum:
          - GMC
          - HCPC
          - other
          - ''
          description: 'Clinician registration body: GMC, HCPC, other.'
        registration_number:
          type: string
          description: Clinician registration number.
        united_kingdom_nhs_number:
          type: string
          maxLength: 12
          description: United Kingdom NHS number, unique per person.
      required:
      - created_at
      - updated_at
      - name
      - role
      - registration_body
      - registration_number
      description: Reporting clinician (neurologist, clinical neurophysiologist, or clinical physiologist)
        who interprets, authors, and signs the EEG result report.
    ElectroencephalogramTestResult:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        patient_id:
          type: string
          format: uuid
          description: Foreign key to the patient.
        clinician_id:
          type: string
          format: uuid
          description: Foreign key to the reporting clinician (neurologist / clinical neurophysiologist
            / physiologist).
        originating_request_reference:
          type: string
          maxLength: 255
          description: Free-text reference linking this report back to the originating EEG request (referral).
        report_status:
          type: string
          enum:
          - preliminary
          - final
          - amended
          - cancelled
          - ''
          description: 'Report lifecycle status: preliminary, final, amended, cancelled.'
        performed_date:
          type: string
          format: date
          description: Date the EEG recording was performed.
        reported_date:
          type: string
          format: date
          description: Date the report was authored / signed.
        eeg_type:
          type: string
          enum:
          - routine-awake
          - sleep-deprived
          - ambulatory-24h
          - video-telemetry
          - other
          - ''
          description: 'Performed EEG type: routine-awake, sleep-deprived, ambulatory-24h, video-telemetry,
            other.'
        recording_duration_minutes:
          type: number
          format: double
          description: Total EEG recording duration in minutes.
        recording_quality:
          type: string
          enum:
          - good
          - adequate
          - limited
          - ''
          description: 'Technical quality / interpretability of the recording: good, adequate, limited.'
        clinical_history:
          type: string
          maxLength: 1000
          description: Clinical history and the question the EEG was performed to answer.
        comparison_with_previous:
          type: string
          maxLength: 1000
          description: Comparison with relevant previous EEG studies.
        background_rhythm:
          type: string
          enum:
          - normal
          - excess-slow
          - asymmetric
          - abnormal
          - ''
          description: 'Background EEG rhythm assessment: normal, excess-slow, asymmetric, abnormal.'
        epileptiform_discharges:
          type: boolean
          description: Whether interictal epileptiform discharges (spikes, sharp waves, spike-and-wave)
            are present.
        focal_slowing:
          type: boolean
          description: Whether focal (localised) slowing is present.
        generalised_slowing:
          type: boolean
          description: Whether generalised slowing (diffuse cerebral dysfunction) is present.
        seizure_recorded:
          type: boolean
          description: Whether an electrographic and/or clinical seizure was captured during the recording.
        status_epilepticus:
          type: boolean
          description: Whether status epilepticus (including non-convulsive status) was recorded — a critical
            finding.
        photoparoxysmal_response:
          type: boolean
          description: Whether a photoparoxysmal response to intermittent photic stimulation is present.
        normal_eeg:
          type: boolean
          description: Whether the recording is reported as a normal EEG.
        findings_narrative:
          type: string
          maxLength: 2000
          description: Narrative description of the EEG findings (the body of the report).
        clinical_correlation:
          type: string
          maxLength: 2000
          description: Correlation of the EEG findings with the clinical context and question.
        impression:
          type: string
          maxLength: 2000
          description: Summary impression / conclusion answering the clinical question.
        reporting_category:
          type: string
          maxLength: 100
          description: Free-text structured-reporting category label (e.g. a SCORE category or local epileptiform-classification
            label).
        recommended_follow_up:
          type: string
          maxLength: 1000
          description: Recommended follow-up recording, referral, or management.
        critical_result_communicated:
          type: boolean
          description: Whether a critical or unexpected significant result was communicated directly to
            the referrer / clinical team.
        reported_to:
          type: string
          maxLength: 500
          description: Who the critical / urgent result was communicated to, with date and time if applicable.
      required:
      - created_at
      - updated_at
      - patient_id
      - clinician_id
      - originating_request_reference
      - report_status
      - eeg_type
      - recording_quality
      - clinical_history
      - comparison_with_previous
      - background_rhythm
      - epileptiform_discharges
      - focal_slowing
      - generalised_slowing
      - seizure_recorded
      - status_epilepticus
      - photoparoxysmal_response
      - normal_eeg
      - findings_narrative
      - clinical_correlation
      - impression
      - reporting_category
      - recommended_follow_up
      - critical_result_communicated
      - reported_to
      description: Electroencephalogram (EEG) test result (report). Captures the performed recording (EEG
        type, duration, quality), the clinical history, the background rhythm and structured neurophysiological
        findings, the narrative interpretation and clinical correlation, the impression and structured-reporting
        category, recommended follow-up, and critical-result communication. This is the source-of-truth
        record that the four-axis interpretation grade is computed from.
    ElectroencephalogramTestResultGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        electroencephalogram_test_result_id:
          type: string
          format: uuid
          description: Foreign key to the parent result (unique, 1:1).
        result_classification:
          type: string
          enum:
          - normal
          - abnormal
          - critical
          - inconclusive
          - ''
          description: 'Axis A overall classification: normal, abnormal, critical, inconclusive.'
        abnormality_severity:
          type: string
          enum:
          - none
          - minor
          - moderate
          - major
          - ''
          description: 'Axis B abnormality severity: none, minor, moderate, major.'
        reporting_category:
          type: string
          maxLength: 50
          description: Axis B structured-reporting score / category label (e.g. a SCORE category or epileptiform-classification
            label).
        report_completeness_percent:
          type: integer
          format: int32
          description: Axis C report completeness as a percentage of mandatory report sections (0-100).
        follow_up_urgency:
          type: string
          enum:
          - routine
          - recommended
          - urgent
          - critical-alert
          - ''
          description: 'Axis D follow-up urgency: routine, recommended, urgent, critical-alert.'
        target_timeframe:
          type: string
          maxLength: 50
          description: Target timeframe for the recommended follow-up implied by the urgency.
        recommended_action:
          type: string
          maxLength: 500
          description: Axis D concise recommended action derived from the urgency.
        recommendation:
          type: string
          enum:
          - no-action
          - routine-follow-up
          - further-imaging
          - specialist-referral
          - urgent-review
          - ''
          description: 'Overall recommendation: no-action, routine-follow-up, further-imaging, specialist-referral,
            urgent-review.'
        clinician_notes:
          type: string
          description: Free-text interpretation / sign-off notes.
        signed_at:
          type: string
          format: date-time
          description: Timestamp of the reporting clinician electronic signature.
        graded_at:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the result.
      required:
      - created_at
      - updated_at
      - electroencephalogram_test_result_id
      - result_classification
      - abnormality_severity
      - reporting_category
      - follow_up_urgency
      - target_timeframe
      - recommended_action
      - recommendation
      - clinician_notes
      - graded_at
      description: 'Computed four-axis interpretation grade: result classification, abnormality severity
        / structured-reporting category, report completeness, and follow-up urgency. A critical result
        (status epilepticus, a recorded seizure, or frequent epileptiform discharges) auto-escalates the
        follow-up urgency to critical-alert regardless of the other axes.'
    ElectroencephalogramTestResultGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        electroencephalogram_test_result_grade_id:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        flag_id:
          type: string
          maxLength: 50
          description: Stable flag identifier (e.g. F-CRITICAL-RESULT-001).
        category:
          type: string
          enum:
          - critical-result-alert
          - incidental-finding
          - discrepancy-with-request
          - abnormal-requiring-action
          - urgent-referral
          - inadequate-technique
          - unexpected-finding
