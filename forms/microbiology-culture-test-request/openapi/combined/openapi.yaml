components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Name.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as full text.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code, such as for validating the postal address.
        role:
          type: string
          enum:
          - gp
          - hospital-doctor
          - nurse
          - microbiologist
          - other
          - ''
          description: 'Clinician role: gp, hospital-doctor, nurse, microbiologist, other.'
        registrationBody:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - other
          - ''
          description: 'Clinician registration body: GMC, NMC, HCPC, other.'
        registrationNumber:
          type: string
          description: Clinician registration number.
        unitedKingdomNhsNumber:
          type:
          - string
          - 'null'
          maxLength: 12
          description: United Kingdom NHS number, unique per person.
      required:
      - createdAt
      - updatedAt
      - name
      - role
      - registrationBody
      - registrationNumber
      description: Requesting clinician (referrer) who completes the microbiology culture request.
    MicrobiologyCultureTestRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the patient.
        clinicianId:
          type: string
          format: uuid
          description: Foreign key to the requesting clinician (referrer).
        status:
          type: string
          enum:
          - draft
          - submitted
          - vetted
          - scheduled
          - rejected
          - ''
          description: 'Request lifecycle status: draft, submitted, vetted, scheduled, rejected.'
        siteName:
          type: string
          maxLength: 255
          description: Name of the requesting site or clinic.
        setting:
          type: string
          enum:
          - outpatient
          - inpatient
          - community
          - emergency
          - ''
          description: 'Care setting: outpatient, inpatient, community, emergency.'
        referralDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the referral was made.
        requestedByDate:
          type:
          - string
          - 'null'
          format: date
          description: Date by which the test is requested to be processed.
        specimenType:
          type: string
          enum:
          - blood-culture
          - urine
          - wound-swab
          - sputum
          - throat-swab
          - stool
          - csf
          - tissue
          - catheter-tip
          - genital-swab
          - other
          - ''
          description: 'Specimen type: blood-culture, urine, wound-swab, sputum, throat-swab, stool, csf,
            tissue, catheter-tip, genital-swab, other.'
        specimenSiteDetail:
          type: string
          maxLength: 255
          description: Free-text detail of the anatomical specimen site (e.g. left leg ulcer, midstream
            urine).
        testCultureAndSensitivity:
          type: boolean
          description: Whether culture and antibiotic sensitivity (MC&S) is requested.
        testGramStain:
          type: boolean
          description: Whether a Gram stain / direct microscopy is requested.
        testAcidFastBacilliTb:
          type: boolean
          description: Whether acid-fast bacilli (AFB) / TB culture is requested.
        testFungalCulture:
          type: boolean
          description: Whether fungal (mycology) culture is requested.
        testPcrMolecular:
          type: boolean
          description: Whether PCR / molecular detection is requested.
        testCDifficileToxin:
          type: boolean
          description: Whether Clostridioides difficile toxin testing is requested.
        testMrsaScreen:
          type: boolean
          description: Whether MRSA colonisation screening is requested.
        primaryIndication:
          type: string
          enum:
          - suspected-sepsis
          - urinary-tract-infection
          - wound-infection
          - respiratory-infection
          - gastroenteritis
          - meningitis
          - sti-screen
          - pyrexia-unknown-origin
          - infection-screening
          - other
          - ''
          description: Primary clinical indication, used for appropriateness scoring.
        clinicalDetails:
          type: string
          maxLength: 1000
          description: Clinical details / relevant history supporting the request.
        fever:
          type: boolean
          description: Whether the patient has fever / pyrexia.
        currentAntibiotics:
          type: boolean
          description: Whether the patient is currently on antibiotics (affects yield).
        antibioticName:
          type: string
          maxLength: 255
          description: Name(s) of current antibiotic(s), if any.
        recentTravel:
          type: boolean
          description: Whether the patient has relevant recent travel history.
        immunocompromised:
          type: boolean
          description: Whether the patient is immunocompromised.
        specimenCollected:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Whether the specimen has already been collected: yes, no.'
        collectionDatetime:
          type:
          - string
          - 'null'
          format: date-time
          description: Date and time the specimen was collected (pre-analytical transport clock).
        urgency:
          type: string
          enum:
          - routine
          - urgent
          - stat
          - ''
          description: 'Requested triage urgency: routine, urgent, stat.'
        supervisingConsultant:
          type: string
          maxLength: 255
          description: Name of the supervising / responsible consultant.
        requesterContact:
          type: string
          maxLength: 255
          description: Contact details (bleep / phone) for the requester.
        notes:
          type: string
          maxLength: 1000
          description: Free-text additional notes.
      required:
      - createdAt
      - updatedAt
      - patientId
      - clinicianId
      - status
      - siteName
      - setting
      - specimenType
      - specimenSiteDetail
      - testCultureAndSensitivity
      - testGramStain
      - testAcidFastBacilliTb
      - testFungalCulture
      - testPcrMolecular
      - testCDifficileToxin
      - testMrsaScreen
      - primaryIndication
      - clinicalDetails
      - fever
      - currentAntibiotics
      - antibioticName
      - recentTravel
      - immunocompromised
      - specimenCollected
      - urgency
      - supervisingConsultant
      - requesterContact
      - notes
      description: Microbiology specimen culture / MC&S request (referral). Captures the specimen, the
        requested tests (booleans), the clinical indication and details, pre-analytical / specimen handling,
        patient-safety factors, and triage urgency.
    MicrobiologyCultureTestRequestGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        microbiologyCultureTestRequestId:
          type: string
          format: uuid
          description: Foreign key to the parent request (unique, 1:1).
        appropriatenessScore:
          type:
          - integer
          - 'null'
          format: int32
          description: Appropriateness score (1-9) anchored on UKHSA SMI specimen / indication match.
            No single published microbiology 1-9 score exists; this anchors on specimen-and-indication
            appropriateness analogous to the ACR scale.
        appropriatenessBand:
          type: string
          enum:
          - usually-appropriate
          - may-be-appropriate
          - usually-not-appropriate
          - ''
          description: 'Appropriateness band: usually-appropriate (7-9), may-be-appropriate (4-6), usually-not-appropriate
            (1-3).'
        preanalyticalBand:
          type: string
          enum:
          - ok
          - caution
          - reject-risk
          - ''
          description: 'Pre-analytical / specimen safety band: ok, caution, reject-risk (specimen type/timing/transport
            correct? sampled before antibiotics? collected?).'
        completenessPercent:
          type:
          - integer
          - 'null'
          format: int32
          description: Request completeness as a percentage of mandatory fields (0-100).
        triageTier:
          type: string
          enum:
          - routine
          - urgent
          - stat
          - ''
          description: 'Assigned triage tier: routine, urgent, stat.'
        targetTimeframe:
          type: string
          maxLength: 50
          description: Target timeframe for processing implied by the triage tier (e.g. suspected sepsis
            -> stat / within the hour).
        recommendation:
          type: string
          enum:
          - accept
          - query-referrer
          - redirect
          - reject
          - ''
          description: 'Vetting recommendation: accept, query-referrer, redirect, reject.'
        clinicianNotes:
          type: string
          description: Free-text vetting notes.
        signedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Timestamp of vetting clinician electronic signature.
        gradedAt:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the result.
      required:
      - createdAt
      - updatedAt
      - microbiologyCultureTestRequestId
      - appropriatenessBand
      - preanalyticalBand
      - triageTier
      - targetTimeframe
      - recommendation
      - clinicianNotes
      - gradedAt
      description: 'Computed four-axis grading result: appropriateness (1-9 anchored on UKHSA SMI specimen
        / indication match), pre-analytical / specimen safety, request completeness, and triage priority.'
    MicrobiologyCultureTestRequestGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        microbiologyCultureTestRequestGradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        flagId:
          type: string
          maxLength: 50
          description: Stable flag identifier (e.g. F-SUSPECTED-SEPSIS-STAT-001).
        category:
          type: string
          enum:
          - suspected-sepsis-stat
          - blood-culture-before-antibiotics
          - specimen-not-collected
          - missing-clinical-details
          - missing-indication
          - no-test-selected
          - other
          - ''
          description: Flag category.
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          - ''
          description: 'Priority: low, medium, high.'
        description:
          type: string
          maxLength: 500
          description: Human-readable description of what fired the flag.
        suggestedAction:
          type: string
          maxLength: 500
          description: Suggested clinical action (e.g. "take blood cultures before first antibiotic dose").
      required:
      - createdAt
      - updatedAt
      - microbiologyCultureTestRequestGradeId
      - flagId
      - category
      - priority
