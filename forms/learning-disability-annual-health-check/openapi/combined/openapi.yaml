components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Clinician full name.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as a single text block.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code.
        role:
          type: string
          enum:
          - gp
          - practice-nurse
          - healthcare-assistant
          - ld-nurse
          - ld-team
          - other
          - ''
          description: 'Primary clinical role: gp, practice-nurse, healthcare-assistant, ld-nurse, ld-team,
            or other.'
        registrationBody:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - GPhC
          - other
          - ''
          description: 'Professional registration body: GMC, NMC, HCPC, GPhC, or other.'
        registrationNumber:
          type: string
          description: Professional registration number issued by the registration body.
      required:
      - createdAt
      - updatedAt
      - name
      - role
      - registrationBody
      - registrationNumber
      description: Clinician identifying information for the clinician who completed the learning-disability
        annual health check.
    LearningDisabilityAnnualHealthCheck:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the patient this check documents (restrict delete).
        clinicianId:
          type:
          - string
          - 'null'
          format: uuid
          description: Foreign key to the clinician who completed the check (restrict delete); optional.
        clinicianName:
          type: string
          description: Name of the clinician completing the check.
        clinicianRole:
          type: string
          enum:
          - gp
          - practice-nurse
          - healthcare-assistant
          - ld-team
          - other
          - ''
          description: 'Role of the clinician completing the check: gp, practice-nurse, healthcare-assistant,
            ld-team, or other.'
        checkedOn:
          type:
          - string
          - 'null'
          format: date
          description: Date the annual health check was carried out.
        practiceName:
          type: string
          description: Name of the GP practice conducting the check.
        easyReadInvitationSent:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether an easy-read invitation was sent to the person (yes/no).
        preCheckDone:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether a pre-check health questionnaire was completed beforehand (yes/no).
        personIdentifier:
          type: string
          maxLength: 100
          description: Local identifier for the person.
        ageBand:
          type: string
          enum:
          - 14-17
          - 18-24
          - 25-44
          - 45-64
          - 65+
          - ''
          description: 'Age band of the person: 14-17, 18-24, 25-44, 45-64, or 65+.'
        sex:
          type: string
          enum:
          - female
          - male
          - intersex
          - unknown
          - ''
          description: 'Person''s sex: female, male, intersex, or unknown.'
        ldRegisterStatus:
          type: string
          enum:
          - on-register
          - not-on-register
          - newly-added
          - ''
          description: 'Learning-disability register status: on-register, not-on-register, or newly-added.'
        mainCarer:
          type: string
          description: Main carer or supporter for the person.
        communicationNeeds:
          type: string
          description: Reasonable adjustments and communication needs (free text); required component.
        reasonableAdjustmentsRecorded:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether reasonable adjustments were recorded (yes/no).
        healthPassport:
          type: string
          enum:
          - 'yes'
          - 'no'
          - not-applicable
          - ''
          description: Whether a hospital / health passport is in place (yes/no/not-applicable).
        consentCapacityNote:
          type: string
          description: Consent and mental-capacity note (free text).
        weightBmiStatus:
          type: string
          enum:
          - recorded
          - not-recorded
          - declined
          - ''
          description: 'Weight / BMI component status: recorded, not-recorded, or declined.'
        bmi:
          type:
          - number
          - 'null'
          format: double
          description: Body-mass index (kg/m^2) recorded at the check.
        bloodPressureStatus:
          type: string
          enum:
          - normal
          - raised
          - recorded
          - not-recorded
          - ''
          description: 'Blood-pressure component status: normal, raised, recorded, or not-recorded.'
        epilepsyStatus:
          type: string
          enum:
          - reviewed
          - not-reviewed
          - not-applicable
          - ''
          description: 'Epilepsy review status: reviewed, not-reviewed, or not-applicable.'
        constipationStatus:
          type: string
          enum:
          - none
          - present
          - not-assessed
          - ''
          description: 'Constipation component status: none, present, or not-assessed.'
        dysphagiaStatus:
          type: string
          enum:
          - none
          - present
          - not-assessed
          - ''
          description: 'Dysphagia / swallowing component status: none, present, or not-assessed.'
        continenceStatus:
          type: string
          enum:
          - ok
          - issue
          - not-assessed
          - ''
          description: 'Continence component status: ok, issue, or not-assessed.'
        mobilityFallsStatus:
          type: string
          enum:
          - ok
          - issue
          - not-assessed
          - ''
          description: 'Mobility and falls component status: ok, issue, or not-assessed.'
        dentalStatus:
          type: string
          enum:
          - ok
          - issue
          - not-assessed
          - ''
          description: 'Dental / oral-health component status: ok, issue, or not-assessed.'
        visionStatus:
          type: string
          enum:
          - ok
          - issue
          - not-assessed
          - ''
          description: 'Vision component status: ok, issue, or not-assessed.'
        hearingStatus:
          type: string
          enum:
          - ok
          - issue
          - not-assessed
          - ''
          description: 'Hearing component status: ok, issue, or not-assessed.'
        footHealthStatus:
          type: string
          enum:
          - ok
          - issue
          - not-assessed
          - ''
          description: 'Foot-health component status: ok, issue, or not-assessed.'
        skinStatus:
          type: string
          enum:
          - ok
          - issue
          - not-assessed
          - ''
          description: 'Skin component status: ok, issue, or not-assessed.'
        physicalHealthActions:
          type: string
          description: Actions arising from the physical-health review (free text).
        cancerScreeningStatus:
          type: string
          enum:
          - up-to-date
          - declined
          - not-eligible
          - not-recorded
          - ''
          description: 'National cancer-screening uptake status: up-to-date, declined, not-eligible, or
            not-recorded.'
        otherScreeningStatus:
          type: string
          enum:
          - up-to-date
          - declined
          - not-eligible
          - not-recorded
          - ''
          description: 'Other screening uptake status: up-to-date, declined, not-eligible, or not-recorded.'
        immunisationStatus:
          type: string
          enum:
          - up-to-date
          - declined
          - not-recorded
          - ''
          description: 'Immunisation uptake status: up-to-date, declined, or not-recorded.'
        medicationReconciled:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the medication list was reconciled at the check (yes/no).
        psychotropicPrescribed:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether a psychotropic medicine is prescribed (yes/no); drives the STOMP flag.
        psychotropicIndication:
          type: string
          description: Documented indication for the psychotropic medicine (free text).
        psychotropicLastReviewed:
          type:
          - string
          - 'null'
          format: date
          description: Date the psychotropic medicine was last reviewed.
        stompDiscussed:
          type: string
          enum:
          - 'yes'
          - 'no'
          - not-applicable
          - ''
          description: Whether STOMP was discussed (yes/no/not-applicable).
        medicationSideEffects:
          type: string
          description: Side effects reviewed at the medication review (free text).
        mentalHealthStatus:
          type: string
          enum:
          - ok
          - concern
          - not-assessed
          - ''
          description: 'Mental-health component status: ok, concern, or not-assessed.'
        behaviourStatus:
          type: string
          enum:
          - none
          - challenging
          - not-assessed
          - ''
          description: 'Behaviour component status: none, challenging, or not-assessed.'
        behaviourTriggers:
          type: string
          description: Triggers for behaviour that challenges (free text).
        syndromeSpecificStatus:
          type: string
          enum:
          - done
          - not-applicable
          - not-done
          - ''
          description: 'Syndrome-specific check status: done, not-applicable, or not-done.'
        carerNeedsStatus:
          type: string
          enum:
          - assessed
          - not-assessed
          - no-carer
          - ''
          description: 'Carer-needs component status: assessed, not-assessed, or no-carer.'
        socialCircumstances:
          type: string
          description: Social circumstances, day activity, and employment (free text).
        healthActionPlanProduced:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether a Health Action Plan was produced (yes/no); required output.
        healthActionPlanShared:
          type: string
          enum:
          - 'yes'
