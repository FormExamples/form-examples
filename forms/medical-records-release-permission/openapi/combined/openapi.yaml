components:
  schemas:
    AuthorizationPeriod:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        releaseFormId:
          type: string
          format: uuid
          description: Foreign key to the parent release form (unique, enforcing 1:1).
        startDate:
          type: string
          format: date
          description: Date from which the authorization is valid.
        endDate:
          type: string
          format: date
          description: Date until which the authorization is valid. Must be >= start_date.
        singleUse:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Whether the authorization is for a single use only: yes, no, or empty string.'
      required:
      - createdAt
      - updatedAt
      - releaseFormId
      - startDate
      - endDate
      - singleUse
      description: Authorization validity period for the records release. One-to-one child of release_form.
    AuthorizedRecipient:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        releaseFormId:
          type: string
          format: uuid
          description: Foreign key to the parent release form (unique, enforcing 1:1).
        recipientName:
          type: string
          maxLength: 255
          description: Full name of the authorized recipient.
        recipientOrganization:
          type: string
          maxLength: 255
          description: Organization the recipient belongs to.
        recipientAddress:
          type: string
          description: Recipient address.
        recipientPhone:
          type: string
          maxLength: 30
          description: Recipient phone.
        recipientEmail:
          type: string
          maxLength: 255
          description: Recipient email.
        recipientRole:
          type: string
          maxLength: 255
          description: Professional role or title of the recipient.
      required:
      - createdAt
      - updatedAt
      - releaseFormId
      - recipientName
      - recipientOrganization
      - recipientAddress
      - recipientPhone
      - recipientEmail
      - recipientRole
      description: Authorized recipient of released medical records. One-to-one child of release_form.
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Name.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as full text.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code, such as for validating the postal address.
        role:
          type: string
          enum:
          - anaesthetist
          - surgeon
          - preop-nurse
          - perioperative-physician
          - geriatrician
          - pharmacist
          - other
          - ''
          description: Clinician role.
        registrationBody:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - GPhC
          - other
          - ''
          description: Clinician registration body.
        registrationNumber:
          type: string
          description: Clinician registration number.
        unitedKingdomNhsNumber:
          type:
          - string
          - 'null'
          maxLength: 12
          description: United Kingdom NHS number, unique per person.
      required:
      - createdAt
      - updatedAt
      - name
      - role
      - registrationBody
      - registrationNumber
      description: Clinician
    Patient:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-deleted.
        name:
          type: string
          maxLength: 255
          description: Name.
        birthDate:
          type: string
          format: date
          description: Birth date.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as full text.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code, such as for validating the postal address.
        unitedKingdomNhsNumber:
          type:
          - string
          - 'null'
          maxLength: 20
          description: United Kingdom NHS number, unique per person.
        waistAsCm:
          type:
          - number
          - 'null'
          format: double
          description: Waist circumference measurement in cm, such as for calculating waist-height ratio
            (WHR).
        heightAsCm:
          type:
          - number
          - 'null'
          format: double
          description: Height measurement in cm, such as for calculating waist-height ratio (WHR).
        weightAsKg:
          type:
          - number
          - 'null'
          format: double
          description: Weight as kg.
        bodyMassIndex:
          type:
          - number
          - 'null'
          format: double
          description: Body mass index (BMI) measurement.
        waistHeightRatio:
          type:
          - number
          - 'null'
          format: double
          description: Waist-height ratio (WHR) measurement.
        vo2Max:
          type:
          - number
          - 'null'
          format: double
          description: VO2 max measurement.
      required:
      - createdAt
      - updatedAt
      - name
      - birthDate
      description: Patient
    PatientRights:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        releaseFormId:
          type: string
          format: uuid
          description: Foreign key to the parent release form (unique, enforcing 1:1).
        acknowledgedRightToRevoke:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Patient acknowledged their right to revoke consent: yes, no, or empty string.'
        acknowledgedNoChargeForAccess:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Patient acknowledged no charge for access to records: yes, no, or empty string.'
        acknowledgedDataProtection:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Patient acknowledged data protection rights: yes, no, or empty string.'
      required:
      - createdAt
      - updatedAt
      - releaseFormId
      - acknowledgedRightToRevoke
      - acknowledgedNoChargeForAccess
      - acknowledgedDataProtection
      description: Patient acknowledgements of rights regarding records release. One-to-one child of release_form.
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          description: A URI identifying the problem type
        title:
          type: string
          description: A short summary of the problem type
        status:
          type: integer
          description: The HTTP status code
        detail:
          type: string
          description: An explanation of this occurrence
        instance:
          type: string
          description: A URI identifying this occurrence
        code:
          type: string
          description: A short machine-readable reason
        errors:
          type: object
          description: Per-field detail, when validation failed
      required:
      - type
      - title
      - status
    PurposeOfRelease:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        releaseFormId:
          type: string
          format: uuid
          description: Foreign key to the parent release form (unique, enforcing 1:1).
        purpose:
          type: string
          enum:
          - continuing-care
          - second-opinion
          - insurance
          - legal
          - personal
          - research
          - employment
          - other
          - ''
          description: 'Release purpose: continuing-care, second-opinion, insurance, legal, personal,
            research, employment, other, or empty string.'
        otherDetails:
          type: string
          description: Free-text details required when purpose is other. Must not be NULL when purpose
            is other.
      required:
      - createdAt
      - updatedAt
      - releaseFormId
      - purpose
      - otherDetails
      description: Stated purpose for the medical records release. One-to-one child of release_form.
    RecordsToRelease:
