          type: integer
          minimum: 1
          maximum: 1000
          default: 100
        required: false
        description: Rows on a page. A larger limit is refused, not clamped
      - name: cursor
        in: query
        schema:
          type: string
        required: false
        description: The next page, as the previous page's Link header gave it. Opaque and signed for
          this list and these filters
      responses:
        '200':
          description: A page of ValidationResult records, with no total
          headers:
            link:
              description: The next page, as <...>; rel="next", while more rows follow. Absent on the
                last page
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ValidationResult'
        '422':
          description: The limit or the cursor is not valid
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: This client sent too many requests
          headers:
