        updatedAt:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        releaseFormId:
          type: string
          format: uuid
          description: Foreign key to the parent release form (unique, enforcing 1:1).
        recordTypes:
          type: string
          description: Array of record type identifiers selected for release.
        specificDateRange:
          type: string
          enum:
          - 'yes'
          - 'no'
