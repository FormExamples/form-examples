      operationId: getValidationFiredRule
      responses:
        '200':
          description: The requested ValidationFiredRule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationFiredRule'
        '404':
          description: ValidationFiredRule not found
    patch:
      summary: Update an existing ValidationFiredRule
      operationId: updateValidationFiredRule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidationFiredRule'
      responses:
        '200':
          description: The updated ValidationFiredRule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationFiredRule'
        '404':
          description: ValidationFiredRule not found
    delete:
      summary: Soft-delete a ValidationFiredRule
      operationId: deleteValidationFiredRule
      responses:
        '204':
          description: ValidationFiredRule deleted
        '404':
          description: ValidationFiredRule not found
  /validation-results:
    get:
      summary: List ValidationResult records
      operationId: listValidationResult
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 100
        required: false
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
        required: false
      responses:
        '200':
          description: A page of ValidationResult records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ValidationResult'
    post:
      summary: Create a new ValidationResult
      operationId: createValidationResult
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidationResult'
      responses:
        '201':
          description: The newly created ValidationResult
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResult'
        '400':
          description: Validation error
  /validation-results/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      summary: Fetch one ValidationResult by id
      operationId: getValidationResult
      responses:
        '200':
          description: The requested ValidationResult
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResult'
        '404':
          description: ValidationResult not found
    patch:
      summary: Update an existing ValidationResult
      operationId: updateValidationResult
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidationResult'
      responses:
        '200':
          description: The updated ValidationResult
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResult'
        '404':
          description: ValidationResult not found
    delete:
      summary: Soft-delete a ValidationResult
      operationId: deleteValidationResult
      responses:
        '204':
          description: ValidationResult deleted
        '404':
          description: ValidationResult not found
components:
  schemas:
    AuthorizationPeriod:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when this row was deleted.
        release_form_id:
          type: string
          format: uuid
          description: Foreign key to the parent release form (unique, enforcing 1:1).
        start_date:
          type: string
          format: date
          description: Date from which the authorization is valid.
        end_date:
          type: string
          format: date
          description: Date until which the authorization is valid. Must be >= start_date.
        single_use:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Whether the authorization is for a single use only: yes, no, or empty string.'
      required:
      - created_at
      - updated_at
      - release_form_id
      - start_date
      - end_date
      - single_use
      description: Authorization validity period for the records release. One-to-one child of release_form.
    AuthorizedRecipient:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when this row was deleted.
        release_form_id:
          type: string
          format: uuid
          description: Foreign key to the parent release form (unique, enforcing 1:1).
        recipient_name:
          type: string
          maxLength: 255
          description: Full name of the authorized recipient.
        recipient_organization:
          type: string
          maxLength: 255
          description: Organization the recipient belongs to.
        recipient_address:
          type: string
          description: Recipient address.
        recipient_phone:
          type: string
          maxLength: 30
          description: Recipient phone.
        recipient_email:
          type: string
          maxLength: 255
          description: Recipient email.
        recipient_role:
          type: string
          maxLength: 255
          description: Professional role or title of the recipient.
      required:
      - created_at
      - updated_at
      - release_form_id
      - recipient_name
      - recipient_organization
      - recipient_address
      - recipient_phone
      - recipient_email
      - recipient_role
      description: Authorized recipient of released medical records. One-to-one child of release_form.
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Soft-delete timestamp; NULL when the row is live.
        name:
          type: string
          description: Name.
        email:
          type: string
          description: Email address.
        phone:
          type: string
          description: Phone number.
        postal_address_as_full_text:
          type: string
          description: Postal address as full text.
        country_as_iso_3166_1_alpha_2:
          type: string
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type: string
          description: Postal code, such as for validating the postal address.
        role:
          type: string
          enum:
          - anaesthetist
          - surgeon
          - preop-nurse
          - perioperative-physician
          - geriatrician
          - pharmacist
          - other
          - ''
          description: Clinician role.
        registration_body:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - GPhC
          - other
          - ''
          description: Clinician registration body.
        registration_number:
          type: string
          description: Clinician registration number.
        united_kingdom_nhs_number:
          type: string
          maxLength: 12
          description: United Kingdom NHS number, unique per person.
      required:
      - created_at
      - updated_at
      - name
      - role
      - registration_body
      - registration_number
      description: Clinician
    Patient:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-deleted.
        deleted_at:
          type: string
          format: date-time
          description: Soft-delete timestamp; NULL when the row is live.
        name:
          type: string
          maxLength: 255
          description: Name.
        birth_date:
          type: string
          format: date
          description: Birth date.
        email:
          type: string
          description: Email address.
        phone:
          type: string
          description: Phone number.
        postal_address_as_full_text:
          type: string
          description: Postal address as full text.
        country_as_iso_3166_1_alpha_2:
          type: string
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type: string
          description: Postal code, such as for validating the postal address.
        united_kingdom_nhs_number:
          type: string
          maxLength: 20
          description: United Kingdom NHS number, unique per person.
        waist_as_cm:
          type: number
          format: double
          description: Waist circumference measurement in cm, such as for calculating waist-height ratio
            (WHR).
        height_as_cm:
          type: number
          format: double
          description: Height measurement in cm, such as for calculating waist-height ratio (WHR).
        weight_as_kg:
          type: number
          format: double
          description: Weight as kg.
        body_mass_index:
          type: number
          format: double
          description: Body mass index (BMI) measurement.
        waist_height_ratio:
          type: number
          format: double
          description: Waist-height ratio (WHR) measurement.
        vo2_max:
          type: number
          format: double
          description: VO2 max measurement.
      required:
      - created_at
      - updated_at
      - name
      - birth_date
      description: Patient
    PatientRights:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when this row was deleted.
        release_form_id:
          type: string
          format: uuid
          description: Foreign key to the parent release form (unique, enforcing 1:1).
        acknowledged_right_to_revoke:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Patient acknowledged their right to revoke consent: yes, no, or empty string.'
        acknowledged_no_charge_for_access:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Patient acknowledged no charge for access to records: yes, no, or empty string.'
        acknowledged_data_protection:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Patient acknowledged data protection rights: yes, no, or empty string.'
      required:
      - created_at
      - updated_at
      - release_form_id
      - acknowledged_right_to_revoke
      - acknowledged_no_charge_for_access
      - acknowledged_data_protection
      description: Patient acknowledgements of rights regarding records release. One-to-one child of release_form.
    PurposeOfRelease:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when this row was deleted.
        release_form_id:
          type: string
          format: uuid
          description: Foreign key to the parent release form (unique, enforcing 1:1).
        purpose:
          type: string
          enum:
          - continuing-care
          - second-opinion
          - insurance
          - legal
          - personal
          - research
          - employment
          - other
          - ''
          description: 'Release purpose: continuing-care, second-opinion, insurance, legal, personal,
            research, employment, other, or empty string.'
        other_details:
          type: string
          description: Free-text details required when purpose is other. Must not be NULL when purpose
            is other.
      required:
      - created_at
      - updated_at
      - release_form_id
      - purpose
      - other_details
      description: Stated purpose for the medical records release. One-to-one child of release_form.
    RecordsToRelease:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        deleted_at:
          type: string
          format: date-time
