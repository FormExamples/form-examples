components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Clinician full name as recorded in the rota.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as a single text block.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code.
        role:
          type: string
          enum:
          - registered-nurse
          - nursing-associate
          - student-nurse
          - ward-manager
          - matron
          - healthcare-assistant
          - other
          - ''
          description: 'Primary clinical role: registered-nurse, nursing-associate, student-nurse, ward-manager,
            matron, healthcare-assistant, or other.'
        registrationBody:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - GPhC
          - other
          - ''
          description: 'Professional registration body: GMC, NMC, HCPC, GPhC, or other.'
        registrationNumber:
          type: string
          description: Professional registration number issued by the registration body.
      required:
      - createdAt
      - updatedAt
      - name
      - role
      - registrationBody
      - registrationNumber
      description: Clinician identifying information for the authoring nurse and contributing professionals.
    NursingCarePlan:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the patient this care plan is for (restricted delete).
        clinicianId:
          type:
          - string
          - 'null'
          format: uuid
          description: Foreign key to the authoring clinician (restricted delete); optional.
        nurseName:
          type: string
          description: Name of the authoring nurse.
        nurseRole:
          type: string
          enum:
          - registered-nurse
          - nursing-associate
          - student
          - ''
          description: 'Role of the authoring nurse: registered-nurse, nursing-associate, or student.'
        nmcNumber:
          type: string
          description: Professional registration number (NMC PIN) of the authoring nurse.
        authoredAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Date and time the care plan was authored.
        careSetting:
          type: string
          enum:
          - ward
          - community
          - care-home
          - hospice
          - other
          - ''
          description: 'Care setting: ward, community, care-home, hospice, or other.'
        planType:
          type: string
          enum:
          - admission
          - ongoing
          - discharge
          - ''
          description: 'Plan type: admission, ongoing, or discharge.'
        modelUsed:
          type: string
          enum:
          - roper-logan-tierney
          - orem
          - activities-of-living
          - other
          - ''
          description: 'Nursing model underpinning the plan: roper-logan-tierney, orem, activities-of-living,
            or other.'
        patientIdentifier:
          type: string
          description: Local patient identifier as entered on the plan.
        patientName:
          type: string
          description: Patient name as entered on the plan.
        dateOfBirth:
          type:
          - string
          - 'null'
          format: date
          description: Patient date of birth as entered on the plan.
        sex:
          type: string
          enum:
          - female
          - male
          - intersex
          - unknown
          - ''
          description: 'Patient sex: female, male, intersex, or unknown.'
        wardLocation:
          type: string
          description: Ward or location where care is delivered.
        handoverNote:
          type: string
          description: Free-text handover summary for the care plan.
        reviewDate:
          type:
          - string
          - 'null'
          format: date
          description: Plan-level date the whole care plan is next due for review.
        fallsRiskDone:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Whether a falls risk assessment has been completed: yes or no.'
        fallsRiskLevel:
          type: string
          enum:
          - low
          - medium
          - high
          - ''
          description: 'Falls risk level: low, medium, or high.'
        fallsRiskAssessedOn:
          type:
          - string
          - 'null'
          format: date
          description: Date the falls risk assessment was carried out.
        fallsRiskActioned:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Whether the falls risk has been actioned with an intervention: yes or no.'
        pressureUlcerRiskDone:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Whether a pressure ulcer risk assessment has been completed: yes or no.'
        pressureUlcerRiskLevel:
          type: string
          enum:
          - low
          - medium
          - high
          - ''
          description: 'Pressure ulcer risk level: low, medium, or high.'
        pressureUlcerRiskAssessedOn:
          type:
          - string
          - 'null'
          format: date
          description: Date the pressure ulcer risk assessment was carried out.
        pressureUlcerRiskActioned:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Whether the pressure ulcer risk has been actioned with an intervention: yes or
            no.'
        vteRiskDone:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Whether a venous thromboembolism (VTE) risk assessment has been completed: yes
            or no.'
        vteRiskLevel:
          type: string
          enum:
          - low
          - medium
          - high
          - ''
          description: 'VTE risk level: low, medium, or high.'
        vteRiskAssessedOn:
          type:
          - string
          - 'null'
          format: date
          description: Date the VTE risk assessment was carried out.
        vteRiskActioned:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Whether the VTE risk has been actioned with an intervention: yes or no.'
        nutritionRiskDone:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Whether a nutrition (MUST) risk assessment has been completed: yes or no.'
        nutritionRiskLevel:
          type: string
          enum:
          - low
          - medium
          - high
          - ''
          description: 'Nutrition risk level: low, medium, or high.'
        nutritionRiskAssessedOn:
          type:
          - string
          - 'null'
          format: date
          description: Date the nutrition risk assessment was carried out.
        nutritionRiskActioned:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Whether the nutrition risk has been actioned with an intervention: yes or no.'
      required:
      - createdAt
      - updatedAt
      - patientId
      - nurseName
      - nurseRole
      - nmcNumber
      - careSetting
      - planType
      - modelUsed
      - patientIdentifier
      - patientName
      - sex
      - wardLocation
      - handoverNote
      - fallsRiskDone
      - fallsRiskLevel
      - fallsRiskActioned
      - pressureUlcerRiskDone
      - pressureUlcerRiskLevel
      - pressureUlcerRiskActioned
      - vteRiskDone
      - vteRiskLevel
      - vteRiskActioned
      - nutritionRiskDone
      - nutritionRiskLevel
      - nutritionRiskActioned
      description: 'Parent nursing care plan header: authoring context, patient identification, nursing
        model, plan-level review date, handover summary, and the four referenced risk-assessment groups.'
    NursingCarePlanGoal:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        nursingCarePlanProblemId:
          type: string
          format: uuid
          description: Foreign key to the parent nursing problem.
        goalText:
          type: string
          description: The SMART (specific, measurable, achievable, relevant, time-bound) goal.
        targetDate:
          type:
          - string
          - 'null'
          format: date
          description: Target or review date for the goal.
        met:
          type: string
          enum:
          - met
          - partially-met
          - not-met
          - not-evaluated
          - ''
          description: 'Evaluation of whether the goal was met: met, partially-met, not-met, or not-evaluated.'
      required:
      - createdAt
      - updatedAt
      - nursingCarePlanProblemId
      - goalText
      - met
      description: SMART goals for a nursing problem; cascades from the parent problem.
    NursingCarePlanGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        nursingCarePlanId:
          type: string
          format: uuid
          description: Foreign key to the parent nursing care plan (unique, 1:1).
        status:
          type: string
          enum:
          - complete
          - partial
          - incomplete
          - ''
          description: 'Overall completeness status: complete, partial, or incomplete.'
        completenessPercent:
          type: integer
          format: int32
          description: Proportion (0-100) of the three required elements (goal, intervention, evaluation)
            present across all problems.
        gradedAt:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the grade.
      required:
      - createdAt
      - updatedAt
      - nursingCarePlanId
      - status
      - completenessPercent
      - gradedAt
      description: 'Computed completeness grading result for a nursing care plan: overall status and completeness
        percent.'
    NursingCarePlanGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        nursingCarePlanGradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        flagId:
          type: string
          maxLength: 50
          description: Stable flag identifier (e.g. F-RISK-WITHOUT-INTERVENTION-001).
        category:
          type: string
          enum:
          - risk-without-intervention
          - high-risk-not-actioned
          - missing-evaluation
          - unmet-goal-overdue
          - no-review-date
          - incomplete-problem
          - other
          - ''
          description: 'Flag category: risk-without-intervention, high-risk-not-actioned, missing-evaluation,
            unmet-goal-overdue, no-review-date, incomplete-problem, or other.'
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          - ''
          description: 'Priority: low, medium, high.'
        description:
          type: string
          maxLength: 500
          description: Human-readable description of what fired the flag.
        suggestedAction:
          type: string
          maxLength: 500
          description: Suggested nursing action (e.g. "add an intervention for the high falls risk").
      required:
      - createdAt
      - updatedAt
      - nursingCarePlanGradeId
      - flagId
      - category
      - priority
      - description
      - suggestedAction
      description: Flagged issues raised independently of the completeness status, with priority and a
        suggested action for the nursing team.
    NursingCarePlanGradeRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        nursingCarePlanGradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        ruleId:
          type: string
          maxLength: 40
          description: Stable rule identifier (e.g. R-PROBLEM-COMPLETE-01).
        category:
          type: string
          maxLength: 50
          description: Subject category (e.g. problem-completeness, plan-status).
        description:
          type: string
          maxLength: 500
          description: Human-readable description of why the rule fired.
      required:
      - createdAt
      - updatedAt
      - nursingCarePlanGradeId
      - ruleId
      - category
      - description
      description: 'Audit trail of every completeness rule that fired during grading: category and description.'
    NursingCarePlanIntervention:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        nursingCarePlanProblemId:
          type: string
          format: uuid
          description: Foreign key to the parent nursing problem.
        interventionText:
          type: string
          description: The planned nursing action.
        carriedOut:
          type: string
          enum:
          - 'yes'
          - 'no'
          - partial
          - ''
          description: 'Whether the intervention was carried out: yes, no, or partial.'
      required:
      - createdAt
      - updatedAt
      - nursingCarePlanProblemId
      - interventionText
      - carriedOut
      description: Planned nursing interventions for a problem; cascades from the parent problem.
    NursingCarePlanProblem:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        nursingCarePlanId:
          type: string
          format: uuid
          description: Foreign key to the parent nursing care plan.
        problemStatement:
          type: string
          description: The identified nursing problem or need.
        adlCategory:
          type: string
          enum:
          - safe-environment
          - communication
          - breathing
          - eating-drinking
          - elimination
          - personal-cleansing-dressing
          - body-temperature
          - mobilising
          - working-playing
          - expressing-sexuality
          - sleeping
          - dying
          - other
          - ''
          description: Roper-Logan-Tierney activity of living the problem relates to (e.g. breathing,
            eating-drinking, mobilising, elimination).
        actualOrPotential:
          type: string
          enum:
          - actual
          - potential
          - ''
          description: Whether the problem is actual (present) or potential (at risk).
        assessmentData:
          type: string
          description: Supporting observation or assessment data for the problem.
        linkedRisk:
          type: string
          enum:
          - none
          - falls
          - pressure-ulcer
          - vte
          - nutrition
          - ''
          description: 'Referenced risk assessment linked to this problem: none, falls, pressure-ulcer,
            vte, or nutrition.'
        evaluationNote:
          type: string
          description: Inline evaluation note (the E of ADPIE).
        goalMet:
          type: string
          enum:
          - met
          - partially-met
          - not-met
          - not-evaluated
          - ''
          description: 'Overall evaluation of whether the problem goal was met: met, partially-met, not-met,
            or not-evaluated.'
        nextReviewDate:
          type:
          - string
          - 'null'
          format: date
          description: Date this problem is next due for review.
      required:
      - createdAt
      - updatedAt
      - nursingCarePlanId
      - problemStatement
      - adlCategory
      - actualOrPotential
      - assessmentData
      - linkedRisk
      - evaluationNote
      - goalMet
      description: 'Nursing problems / needs identified for a care plan: RLT activity category, actual/potential,
        assessment data, linked risk, and inline evaluation.'
    Patient:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          maxLength: 255
          description: Full patient name as recorded on the wristband.
        birthDate:
          type: string
          format: date
          description: Date of birth.
        sex:
          type: string
          enum:
          - female
          - male
          - intersex
          - unknown
          - ''
