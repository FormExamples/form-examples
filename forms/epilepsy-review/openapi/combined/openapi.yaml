components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Clinician full name as recorded in the rota.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as a single text block.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code.
        role:
          type: string
          enum:
          - gp
          - practice-nurse
          - epilepsy-nurse
          - neurologist
          - other
          - ''
          description: 'Primary clinical role of the reviewer: gp, practice-nurse, epilepsy-nurse, neurologist,
            or other.'
        registrationBody:
          type: string
          enum:
          - GMC
          - NMC
          - GPhC
          - other
          - ''
          description: 'Professional registration body: GMC, NMC, GPhC, or other.'
        registrationNumber:
          type: string
          description: Professional registration number issued by the registration body.
      required:
      - createdAt
      - updatedAt
      - name
      - role
      - registrationBody
      - registrationNumber
      description: Clinician identifying information for the clinician who conducted the epilepsy annual
        review.
    EpilepsyReview:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the patient this review documents (restrict delete).
        clinicianId:
          type:
          - string
          - 'null'
          format: uuid
          description: Foreign key to the reviewing clinician (restrict delete); optional.
        reviewerName:
          type: string
          description: Name of the reviewing clinician as recorded on the review.
        reviewerRole:
          type: string
          enum:
          - gp
          - practice-nurse
          - epilepsy-nurse
          - neurologist
          - other
          - ''
          description: 'Reviewing clinician role: gp, practice-nurse, epilepsy-nurse, neurologist, or
            other.'
        reviewedAt:
          type:
          - string
          - 'null'
          format: date
          description: Date the annual review was conducted.
        careSetting:
          type: string
          enum:
          - general-practice
          - epilepsy-clinic
          - community
          - other
          - ''
          description: 'Care setting where the review was conducted: general-practice, epilepsy-clinic,
            community, or other.'
        reviewType:
          type: string
          enum:
          - annual
          - interim
          - ''
          description: 'Type of review: annual or interim.'
        monthsSinceLastReview:
          type:
          - number
          - 'null'
          format: double
          description: Interval in months since the last review; drives the review-overdue flag when greater
            than 12.
        patientIdentifier:
          type: string
          maxLength: 100
          description: NHS number or local patient identifier as recorded on the review.
        ageBand:
          type: string
          enum:
          - 18-39
          - 40-59
          - 60-79
          - '>=80'
          - ''
          description: 'Adult age band: 18-39, 40-59, 60-79, or >=80.'
        sex:
          type: string
          enum:
          - female
          - male
          - intersex
          - unknown
          - ''
          description: 'Patient sex: female, male, intersex, or unknown.'
        epilepsyType:
          type: string
          enum:
          - focal
          - generalised
          - combined
          - unknown
          - ''
          description: 'Epilepsy type: focal, generalised, combined, or unknown.'
        ageAtOnset:
          type:
          - number
          - 'null'
          format: double
          description: Age at epilepsy onset in years.
        yearsSinceDiagnosis:
          type:
          - number
          - 'null'
          format: double
          description: Years since epilepsy diagnosis.
        learningDisability:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the patient has a learning disability (yes/no).
        seizureTypes:
          type: string
          description: Free-text record of the seizure type(s) present.
        seizureFrequency:
          type: string
          enum:
          - none
          - less-than-monthly
          - monthly
          - weekly
          - daily
          - ''
          description: 'Seizure frequency: none, less-than-monthly, monthly, weekly, or daily (weekly/daily
            drive an uncontrolled classification).'
        lastSeizureDate:
          type:
          - string
          - 'null'
          format: date
          description: Date of the most recent seizure.
        seizureFreeMonths:
          type:
          - number
          - 'null'
          format: double
          description: Documented seizure-free duration in months.
        seizureTrend:
          type: string
          enum:
          - seizure-free
          - decreasing
          - stable
          - increasing
          - ''
          description: 'Seizure trend since the last review: seizure-free, decreasing, stable, or increasing
            (increasing drives an uncontrolled classification).'
        currentAsms:
          type: string
          description: Free-text record of current anti-seizure medication(s) and doses.
        asmAdherence:
          type: string
          enum:
          - good
          - partial
          - poor
          - ''
          description: 'Self-reported ASM adherence: good, partial, or poor (poor drives an adherence
            flag).'
        asmSideEffects:
          type: string
          enum:
          - none
          - mild
          - significant
          - ''
          description: 'ASM side-effect burden: none, mild, or significant (significant drives a side-effects
            flag).'
        drugLevel:
          type:
          - number
          - 'null'
          format: double
          description: Therapeutic ASM drug level where relevant (units per the specific drug).
        triggers:
          type: string
          description: Free-text record of reported seizure triggers.
        sudepDiscussed:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether Sudden Unexpected Death in Epilepsy (SUDEP) risk was discussed (yes/no);
            a non-yes value drives a SUDEP-not-documented flag.
        statusEpilepticus:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether status epilepticus occurred since the last review (yes/no); yes drives
            an uncontrolled classification and a high-priority flag.
        seizureInjury:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether a seizure-related injury occurred since the last review (yes/no).
        dvlaEligible:
          type: string
          enum:
          - eligible
          - not-eligible
          - not-applicable
          - ''
          description: 'DVLA driving eligibility: eligible, not-eligible, or not-applicable.'
        currentlyDriving:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the patient is currently driving (yes/no); driving while not DVLA-eligible
            drives a driving-safety flag.
        bathingAdviceGiven:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether bathing / showering safety advice was given (yes/no).
        womanOfChildbearingPotential:
          type: string
          enum:
          - 'yes'
          - 'no'
          - not-applicable
          - ''
          description: Whether the patient is a woman of childbearing potential (yes/no/not-applicable);
            when yes, the valproate/PPP, folic-acid, and contraception domains become required for completeness.
        onValproate:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the patient is prescribed sodium valproate (yes/no).
        pregnancyPreventionProgramme:
          type: string
          enum:
          - in-place
          - not-in-place
          - not-applicable
          - ''
          description: 'Valproate Pregnancy Prevention Programme status: in-place, not-in-place, or not-applicable.'
        folicAcid:
          type: string
          enum:
          - 'yes'
          - 'no'
          - not-applicable
          - ''
          description: 'Whether folic acid is prescribed: yes, no, or not-applicable.'
        contraceptionInteractionReviewed:
          type: string
          enum:
          - 'yes'
          - 'no'
          - not-applicable
          - ''
          description: 'Whether contraception and ASM interactions were reviewed: yes, no, or not-applicable.'
        mentalHealthConcern:
          type: string
          enum:
          - none
          - low-mood
          - anxiety
          - depression
          - suicidality
          - ''
          description: 'Mental-health concern: none, low-mood, anxiety, depression, or suicidality (suicidality
            high priority; depression/anxiety/low-mood medium).'
        specialistReviewNeeded:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether specialist (neurology) review is needed (yes/no).
        nextReviewDue:
          type:
          - string
          - 'null'
          format: date
          description: Date the next review is planned.
        carePlan:
          type: string
          description: Free-text record of the agreed epilepsy care plan.
        reviewContext:
          type: string
          description: Optional free-text review context or narrative shown in the summary.
      required:
      - createdAt
      - updatedAt
      - patientId
      - reviewerName
      - reviewerRole
      - careSetting
      - reviewType
      - patientIdentifier
      - ageBand
      - sex
      - epilepsyType
      - learningDisability
      - seizureTypes
      - seizureFrequency
      - seizureTrend
      - currentAsms
      - asmAdherence
      - asmSideEffects
      - triggers
      - sudepDiscussed
      - statusEpilepticus
      - seizureInjury
      - dvlaEligible
      - currentlyDriving
      - bathingAdviceGiven
      - womanOfChildbearingPotential
      - onValproate
      - pregnancyPreventionProgramme
      - folicAcid
      - contraceptionInteractionReviewed
      - mentalHealthConcern
      - specialistReviewNeeded
      - carePlan
      - reviewContext
      description: 'Main epilepsy annual-review record (NICE NG217): patient and clinician identification,
        review context, epilepsy profile, seizures and anti-seizure medication with adherence and side
        effects, triggers, SUDEP discussion, injuries and status epilepticus, safety (DVLA driving, bathing,
        occupation), valproate and pregnancy-prevention arrangements, mental health, and the care plan.
        The computed seizure-control classification, completeness grade, fired rules, and safety flags
        live in child tables.'
    EpilepsyReviewGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        epilepsyReviewId:
          type: string
          format: uuid
          description: Foreign key to the parent epilepsy review (unique, 1:1).
        seizureControl:
          type: string
          enum:
          - seizure-free
          - controlled
          - uncontrolled
          - ''
          description: 'Seizure-control classification: seizure-free, controlled, or uncontrolled.'
        reviewStatus:
          type: string
          enum:
          - complete
          - partial
          - incomplete
          - ''
          description: 'Review completeness: complete, partial, or incomplete.'
        completenessScore:
          type:
          - integer
          - 'null'
          format: int32
          description: Count of documented required review domains.
