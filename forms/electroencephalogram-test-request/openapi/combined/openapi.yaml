components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Name.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as full text.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code, such as for validating the postal address.
        role:
          type: string
          enum:
          - neurologist
          - gp
          - hospital-doctor
          - paediatrician
          - physiologist
          - other
          - ''
          description: 'Clinician role: neurologist, gp, hospital-doctor, paediatrician, physiologist,
            other.'
        registrationBody:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - other
          - ''
          description: 'Clinician registration body: GMC, NMC, HCPC, other.'
        registrationNumber:
          type: string
          description: Clinician registration number.
        unitedKingdomNhsNumber:
          type:
          - string
          - 'null'
          maxLength: 12
          description: United Kingdom NHS number, unique per person.
      required:
      - createdAt
      - updatedAt
      - name
      - role
      - registrationBody
      - registrationNumber
      description: Requesting clinician (referrer) who completes the EEG request.
    ElectroencephalogramTestRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the patient.
        clinicianId:
          type: string
          format: uuid
          description: Foreign key to the requesting clinician (referrer).
        status:
          type: string
          enum:
          - draft
          - submitted
          - vetted
          - scheduled
          - rejected
          - ''
          description: 'Request lifecycle status: draft, submitted, vetted, scheduled, rejected.'
        siteName:
          type: string
          maxLength: 255
          description: Name of the requesting site or clinic.
        setting:
          type: string
          enum:
          - outpatient
          - inpatient
          - community
          - emergency
          - ''
          description: 'Care setting: outpatient, inpatient, community, emergency.'
        referralDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the referral was made.
        requestedByDate:
          type:
          - string
          - 'null'
          format: date
          description: Date by which the EEG is requested to be performed.
        eegType:
          type: string
          enum:
          - routine-awake
          - sleep-deprived
          - ambulatory-24h
          - video-telemetry
          - other
          - ''
          description: 'Requested EEG type: routine-awake, sleep-deprived, ambulatory-24h, video-telemetry,
            other.'
        primaryIndication:
          type: string
          enum:
          - suspected-epilepsy
          - seizure-classification
          - status-epilepticus
          - encephalopathy
          - first-seizure
          - funny-turns
          - dementia
          - pre-surgical-evaluation
          - medication-review
          - other
          - ''
          description: Primary clinical indication, used for appropriateness scoring.
        clinicalQuestion:
          type: string
          maxLength: 1000
          description: Specific clinical question the EEG should answer (highest-value field).
        relevantHistory:
          type: string
          maxLength: 1000
          description: Relevant medical, neurological, and seizure history.
        seizureFrequency:
          type: string
          maxLength: 255
          description: Reported seizure frequency (free text, e.g. "2 per week").
        firstSeizure:
          type: boolean
          description: Whether this is a first unprovoked seizure presentation.
        knownEpilepsy:
          type: boolean
          description: Whether the patient has an established diagnosis of epilepsy.
        currentAntiepileptics:
          type: string
          maxLength: 1000
          description: Current antiepileptic drug therapy (free text).
        recentSeizure:
          type: boolean
          description: Whether the patient had a recent seizure relevant to timing of the EEG.
        suspectedStatusEpilepticus:
          type: boolean
          description: Whether status epilepticus is suspected (red flag).
        urgency:
          type: string
          enum:
          - routine
          - urgent
          - emergency
          - ''
          description: 'Requested triage urgency: routine, urgent, emergency.'
        supervisingConsultant:
          type: string
          maxLength: 255
          description: Name of the supervising / responsible consultant.
        requesterContact:
          type: string
          maxLength: 255
          description: Contact details (bleep / phone) for the requester.
        notes:
          type: string
          maxLength: 1000
          description: Free-text additional notes.
      required:
      - createdAt
      - updatedAt
      - patientId
      - clinicianId
      - status
      - siteName
      - setting
      - eegType
      - primaryIndication
      - clinicalQuestion
      - relevantHistory
      - seizureFrequency
      - firstSeizure
      - knownEpilepsy
      - currentAntiepileptics
      - recentSeizure
      - suspectedStatusEpilepticus
      - urgency
      - supervisingConsultant
      - requesterContact
      - notes
      description: Electroencephalogram (EEG) test request (referral). Captures the requested EEG type,
        the clinical indication and question, seizure / epilepsy context, antiepileptic medication, red
        flags, and triage urgency.
    ElectroencephalogramTestRequestGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        electroencephalogramTestRequestId:
          type: string
          format: uuid
          description: Foreign key to the parent request (unique, 1:1).
        appropriatenessScore:
          type:
          - integer
          - 'null'
          format: int32
          description: Appropriateness score (1-9) grounded on NICE NG217 epilepsy guidance and ILAE practice.
        appropriatenessBand:
          type: string
          enum:
          - usually-appropriate
          - may-be-appropriate
          - usually-not-appropriate
          - ''
          description: 'Appropriateness band: usually-appropriate (7-9), may-be-appropriate (4-6), usually-not-appropriate
            (1-3).'
        triageTier:
          type: string
          enum:
          - routine
          - urgent
          - emergency
          - ''
          description: 'Assigned triage tier: routine, urgent, emergency.'
        targetTimeframe:
          type: string
          maxLength: 50
          description: Target timeframe for the EEG implied by the triage tier.
        completenessPercent:
          type:
          - integer
          - 'null'
          format: int32
          description: Request completeness as a percentage of mandatory fields (0-100).
        priorityBand:
          type: string
          enum:
          - low
          - moderate
          - high
          - ''
          description: 'Clinical priority band: low, moderate, high.'
        recommendation:
          type: string
          enum:
          - accept
          - query-referrer
          - redirect
          - reject
          - ''
          description: 'Vetting recommendation: accept, query-referrer, redirect, reject.'
        clinicianNotes:
          type: string
          description: Free-text vetting notes.
        signedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Timestamp of vetting clinician electronic signature.
        gradedAt:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the result.
      required:
      - createdAt
      - updatedAt
      - electroencephalogramTestRequestId
      - appropriatenessBand
      - triageTier
      - targetTimeframe
      - priorityBand
      - recommendation
      - clinicianNotes
      - gradedAt
      description: 'Computed four-axis grading result: appropriateness (NICE NG217 / ILAE 1-9), urgency
        / triage, request completeness, and clinical priority.'
    ElectroencephalogramTestRequestGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        electroencephalogramTestRequestGradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        flagId:
          type: string
          maxLength: 50
          description: Stable flag identifier (e.g. F-SUSPECTED-STATUS-EPILEPTICUS-001).
        category:
          type: string
          enum:
          - suspected-status-epilepticus
          - recent-first-seizure
          - encephalopathy
          - eeg-not-to-exclude-epilepsy
          - missing-indication
          - missing-clinical-question
          - other
          - ''
          description: Flag category.
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          - ''
          description: 'Priority: low, medium, high.'
        description:
          type: string
          maxLength: 500
          description: Human-readable description of what fired the flag.
        suggestedAction:
          type: string
          maxLength: 500
          description: Suggested clinical action (e.g. "arrange emergency EEG / escalate to on-call neurology").
      required:
      - createdAt
      - updatedAt
      - electroencephalogramTestRequestGradeId
      - flagId
      - category
      - priority
      - description
      - suggestedAction
      description: Safety-critical flags that fire independently of the four axes, with priority and a
        suggested action for the neurophysiology team.
    ElectroencephalogramTestRequestGradeRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        electroencephalogramTestRequestGradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        ruleId:
          type: string
          maxLength: 40
          description: Stable rule identifier (e.g. R-APPROP-SUSPECTED-EPILEPSY-01).
        axis:
          type: string
          enum:
          - appropriateness
          - urgency
          - completeness
          - priority
          - ''
          description: 'Scoring axis the rule belongs to: appropriateness, urgency, completeness, priority.'
        category:
          type: string
          maxLength: 50
          description: Category or indication the rule relates to.
        description:
          type: string
          maxLength: 500
          description: Human-readable description of why the rule fired.
      required:
      - createdAt
