          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the fit note passes the validity checks (name, profession, practice address
            all present).
        grader_notes:
          type: string
          description: Free-text notes from the engine.
        graded_at:
          type: string
          format: date-time
          description: Timestamp the engine last computed the result.
        clinician_override:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the clinician overrode the engine recommendation.
        clinician_override_reason:
          type: string
          maxLength: 500
          description: Required justification when the clinician overrode the engine recommendation.
        clinician_final_recommendation:
          type: string
          enum:
