      - title
      - status
    UnitedKingdomStatementOfFitnessForWork:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the patient who is the subject of the fit note.
        clinicianId:
          type: string
          format: uuid
          description: Foreign key to the issuing clinician.
        medicalPracticeId:
          type: string
          format: uuid
          description: Foreign key to the medical practice owning the fit note.
        status:
          type: string
          enum:
          - draft
          - submitted
          - issued
          - duplicate
          - cancelled
          description: 'Lifecycle status: draft, submitted, issued, duplicate, or cancelled.'
        assessmentDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the assessment was performed (Step 3).
        assessmentMethod:
          type: string
          enum:
          - in_person
          - video_call
          - telephone
          - written_report_from_other_hcp
          - ''
          description: 'Assessment modality (DWP policy 3.1): in_person, video_call, telephone, or written_report_from_other_hcp.'
        generalFitnessConsidered:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the clinician considered fitness for work in general rather than just the
            current job (DWP policy 5.1).
        diagnosisText:
          type: string
          description: Free-text description of the condition causing the absence (Step 4).
        diagnosisSnomedCode:
          type: string
          maxLength: 20
          description: Optional SNOMED CT concept identifier from the NHS Digital fit-note refset.
        diagnosisSnomedDisplay:
          type: string
          maxLength: 255
          description: Optional preferred display name for the SNOMED CT concept.
        diagnosisCategory:
          type: string
          enum:
          - mental_health
          - musculoskeletal
          - respiratory
          - cardiovascular
          - neoplasm
          - infection
          - injury
          - pregnancy
          - neurological
          - gastrointestinal
          - endocrine
          - other
          - ''
          description: Coarse diagnosis category used by the grading engine.
        conditionFirstRecordedDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the condition was first recorded; drives the "first 6 months" rule (DWP policy
            3.3).
        isAutomaticDisability:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the condition is automatically classed as a disability (HIV / cancer /
            MS — Equality Act 2010 s.6).
        isNonMedical:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Clinician flag that the underlying problem is non-medical and not certifiable (DWP
            policy 3.6).
        fitnessForWork:
          type: string
          enum:
          - not_fit
          - may_be_fit
          - ''
          description: 'Fitness category (Step 5): not_fit or may_be_fit. The form cannot say "fit for
            work" (DWP policy 3.2).'
        adaptationPhasedReturn:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Adaptation tick box (Step 6): a phased return to work.'
        adaptationAlteredHours:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Adaptation tick box (Step 6): altered hours.'
        adaptationAmendedDuties:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Adaptation tick box (Step 6): amended duties.'
        adaptationWorkplaceAdaptations:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Adaptation tick box (Step 6): workplace adaptations.'
        comments:
          type: string
          description: Free-text advice (Step 7) describing the functional impact of the condition (DWP
            policy 5.6).
        periodType:
          type: string
          enum:
          - duration
          - from_to
          - ''
          description: 'Period entry mode (Step 8): duration (e.g. 4 weeks) or from_to (e.g. 2026-05-18
            to 2026-06-15).'
        periodDurationValue:
          type:
          - integer
          - 'null'
          format: int32
          description: Numeric period duration value when period_type = duration.
        periodDurationUnit:
          type: string
          enum:
          - days
          - weeks
          - months
          - ''
          description: 'Period duration unit when period_type = duration: days, weeks, or months.'
        periodFrom:
          type:
          - string
          - 'null'
          format: date
          description: Period start date when period_type = from_to.
        periodTo:
          type:
          - string
          - 'null'
          format: date
          description: Period end date when period_type = from_to.
        willAssessAgain:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the clinician intends to reassess at the end of the period (Step 9).
        plannedReviewDate:
          type:
          - string
          - 'null'
          format: date
          description: Planned date for the follow-up assessment.
        issuedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Timestamp when the fit note was issued to the patient.
        issuedVia:
          type: string
          enum:
          - digital
          - printed_computer_generated
          - printed_handwritten
          - ''
          description: 'Delivery channel: digital, printed_computer_generated, or printed_handwritten.'
        issueSetting:
          type: string
          enum:
          - primary_care
          - secondary_care_discharge
          - occupational_health
          - pharmacy
          - community
          - ''
          description: Care setting in which the fit note was issued.
        safeguardingConcern:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the clinician flagged a safeguarding concern during the assessment.
        safeguardingNotes:
          type: string
          description: Free-text notes describing the safeguarding concern (not printed on the fit note).
        clinicianSignatureSvg:
          type: string
          description: Electronic signature captured as SVG path data, when issued_via = digital.
        clinicianSignedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Timestamp the clinician applied the electronic signature.
      required:
      - createdAt
      - updatedAt
      - patientId
      - clinicianId
      - medicalPracticeId
      - status
      - assessmentMethod
      - generalFitnessConsidered
      - diagnosisText
      - diagnosisSnomedCode
      - diagnosisSnomedDisplay
      - diagnosisCategory
      - isAutomaticDisability
      - isNonMedical
      - fitnessForWork
      - adaptationPhasedReturn
      - adaptationAlteredHours
      - adaptationAmendedDuties
      - adaptationWorkplaceAdaptations
      - comments
      - periodType
      - periodDurationUnit
      - willAssessAgain
      - issuedVia
      - issueSetting
      - safeguardingConcern
      - safeguardingNotes
      - clinicianSignatureSvg
      description: UK Statement of Fitness for Work (Med 3 / fit note). A single assessment record covering
        diagnosis, fitness category, adaptations, period, and follow-up.
    UnitedKingdomStatementOfFitnessForWorkGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
