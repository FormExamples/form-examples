        gradedAt:
          type: string
          format: date-time
          description: Timestamp the engine last computed the result.
        clinicianOverride:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the clinician overrode the engine recommendation.
        clinicianOverrideReason:
          type: string
          maxLength: 500
          description: Required justification when the clinician overrode the engine recommendation.
        clinicianFinalRecommendation:
          type: string
          enum:
          - standard
          - refer_occupational_health
          - refer_access_to_work
          - refer_employment_advisor
          - review_for_validity
          - ''
          description: Clinician-signed-off recommendation (may equal or differ from the engine recommendation).
