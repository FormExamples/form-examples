      - adaptationIntensity
      - adaptationCount
      - periodCompliance
      - recommendation
      - isWithinFirstSixMonthsOfCondition
      - isValid
      - graderNotes
      - gradedAt
      - clinicianOverride
      - clinicianOverrideReason
      - clinicianFinalRecommendation
