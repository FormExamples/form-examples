          - not_fit
          - may_be_fit
          - ''
          description: 'Fitness category computed from the form: not_fit or may_be_fit.'
        adaptationIntensity:
          type: string
          enum:
          - none
          - light
          - moderate
          - substantial
          - comprehensive
          - ''
          description: Adaptation intensity classification based on the number of tick boxes selected.
        adaptationCount:
          type: integer
          format: int32
          description: Number of adaptation tick boxes selected (0-4).
        periodDays:
          type:
          - integer
          - 'null'
          format: int32
          description: Computed period length in calendar days.
        periodCompliance:
          type: string
          enum:
          - self_cert_range
          - compliant
          - exceeds_initial_max
          - long_term
          - very_long_term
          - ''
          description: 'Compliance category for the period: self_cert_range, compliant, exceeds_initial_max,
            long_term, or very_long_term.'
        recommendation:
          type: string
          enum:
          - standard
          - refer_occupational_health
          - refer_access_to_work
          - refer_employment_advisor
