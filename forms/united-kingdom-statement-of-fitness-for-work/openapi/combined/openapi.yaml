        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as a single block of text.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 code (typically GB).
        postcode:
          type:
          - string
          - 'null'
          description: Postal code for address validation.
        unitedKingdomNhsNumber:
          type:
          - string
          - 'null'
          maxLength: 20
          description: United Kingdom NHS number, unique per person.
        employerName:
          type:
          - string
          - 'null'
          description: Patient-reported employer name, useful for occupational-health triage.
        occupation:
          type:
          - string
          - 'null'
