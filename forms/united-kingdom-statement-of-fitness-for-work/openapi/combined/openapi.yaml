components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        name:
          type: string
          description: Full name of the issuing clinician (mandatory per DWP policy 3.7).
        email:
          type: string
          description: Email address.
        phone:
          type: string
          description: Phone number.
        postal_address_as_full_text:
          type: string
          description: Postal address (typically the practice).
        country_as_iso_3166_1_alpha_2:
          type: string
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2.
        postcode:
          type: string
          description: Postal code.
        profession:
          type: string
          enum:
          - doctor
          - nurse
          - occupational_therapist
          - pharmacist
          - physiotherapist
          - other
          - ''
          description: 'Profession: doctor, nurse, occupational_therapist, pharmacist, physiotherapist,
            or other.'
        registration_body:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - GPhC
          - other
          - ''
          description: 'Regulator: GMC (doctors), NMC (nurses), HCPC (OTs/physios), GPhC (pharmacists).'
        registration_number:
          type: string
          description: Registration number issued by the regulator.
        is_private_practice:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the clinician is operating in private practice (non-NHS).
      required:
      - created_at
      - updated_at
      - name
      - profession
      - registration_body
      - registration_number
      - is_private_practice
      description: Healthcare professional issuing the fit note (doctor, nurse, OT, pharmacist, or physiotherapist).
    MedicalPractice:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        name:
          type: string
          description: Practice or organisation name as printed on the fit note.
        postal_address_as_full_text:
          type: string
          description: Practice postal address.
        country_as_iso_3166_1_alpha_2:
          type: string
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 (typically GB).
        postcode:
          type: string
          description: Practice postcode.
        phone:
          type: string
          description: Practice phone number.
        email:
          type: string
          description: Practice email address.
        ods_code:
          type: string
          description: NHS Organisation Data Service (ODS) code identifying the practice.
        setting:
          type: string
          enum:
          - primary_care
          - secondary_care_inpatient
          - secondary_care_discharge
          - occupational_health
          - pharmacy
          - community_clinic
          - private_practice
          - other
          - ''
          description: 'Care setting: primary_care, secondary_care_inpatient, secondary_care_discharge,
            occupational_health, pharmacy, community_clinic, or private_practice.'
      required:
      - created_at
      - updated_at
      - name
      - postal_address_as_full_text
      - setting
      description: The medical practice that owns the fit note (mandatory per DWP policy 3.7).
    Patient:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        name:
          type: string
          maxLength: 255
          description: Full name as recorded on the fit note.
        birth_date:
          type: string
          format: date
          description: Date of birth, optional on Med 3 if NHS number is supplied.
        email:
          type: string
          description: Email address for digital fit-note delivery.
        phone:
          type: string
          description: Phone number.
        postal_address_as_full_text:
          type: string
          description: Postal address as a single block of text.
        country_as_iso_3166_1_alpha_2:
          type: string
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 code (typically GB).
        postcode:
          type: string
          description: Postal code for address validation.
        united_kingdom_nhs_number:
          type: string
          maxLength: 20
          description: United Kingdom NHS number, unique per person.
        employer_name:
          type: string
          description: Patient-reported employer name, useful for occupational-health triage.
        occupation:
          type: string
          description: Patient-reported occupation, supports tailoring of workplace adaptations.
      required:
      - created_at
      - updated_at
      - name
      description: Patient who is the subject of the fit note.
    UnitedKingdomStatementOfFitnessForWork:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        patient_id:
          type: string
          format: uuid
          description: Foreign key to the patient who is the subject of the fit note.
        clinician_id:
          type: string
          format: uuid
          description: Foreign key to the issuing clinician.
        medical_practice_id:
          type: string
          format: uuid
          description: Foreign key to the medical practice owning the fit note.
        status:
          type: string
          enum:
          - draft
          - submitted
          - issued
          - duplicate
          - cancelled
          description: 'Lifecycle status: draft, submitted, issued, duplicate, or cancelled.'
        assessment_date:
          type: string
          format: date
          description: Date the assessment was performed (Step 3).
        assessment_method:
          type: string
          enum:
          - in_person
          - video_call
          - telephone
          - written_report_from_other_hcp
          - ''
          description: 'Assessment modality (DWP policy 3.1): in_person, video_call, telephone, or written_report_from_other_hcp.'
        general_fitness_considered:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the clinician considered fitness for work in general rather than just the
            current job (DWP policy 5.1).
        diagnosis_text:
          type: string
          description: Free-text description of the condition causing the absence (Step 4).
        diagnosis_snomed_code:
          type: string
          maxLength: 20
          description: Optional SNOMED CT concept identifier from the NHS Digital fit-note refset.
        diagnosis_snomed_display:
          type: string
          maxLength: 255
          description: Optional preferred display name for the SNOMED CT concept.
        diagnosis_category:
          type: string
          enum:
          - mental_health
          - musculoskeletal
          - respiratory
          - cardiovascular
          - neoplasm
          - infection
          - injury
          - pregnancy
          - neurological
          - gastrointestinal
          - endocrine
          - other
          - ''
          description: Coarse diagnosis category used by the grading engine.
        condition_first_recorded_date:
          type: string
          format: date
          description: Date the condition was first recorded; drives the "first 6 months" rule (DWP policy
            3.3).
        is_automatic_disability:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the condition is automatically classed as a disability (HIV / cancer /
            MS — Equality Act 2010 s.6).
        is_non_medical:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Clinician flag that the underlying problem is non-medical and not certifiable (DWP
            policy 3.6).
        fitness_for_work:
          type: string
          enum:
          - not_fit
          - may_be_fit
          - ''
          description: 'Fitness category (Step 5): not_fit or may_be_fit. The form cannot say "fit for
            work" (DWP policy 3.2).'
        adaptation_phased_return:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Adaptation tick box (Step 6): a phased return to work.'
        adaptation_altered_hours:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Adaptation tick box (Step 6): altered hours.'
        adaptation_amended_duties:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Adaptation tick box (Step 6): amended duties.'
        adaptation_workplace_adaptations:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Adaptation tick box (Step 6): workplace adaptations.'
        comments:
          type: string
          description: Free-text advice (Step 7) describing the functional impact of the condition (DWP
            policy 5.6).
        period_type:
          type: string
          enum:
          - duration
          - from_to
          - ''
          description: 'Period entry mode (Step 8): duration (e.g. 4 weeks) or from_to (e.g. 2026-05-18
            to 2026-06-15).'
        period_duration_value:
          type: integer
          format: int32
          description: Numeric period duration value when period_type = duration.
        period_duration_unit:
          type: string
          enum:
          - days
          - weeks
          - months
          - ''
          description: 'Period duration unit when period_type = duration: days, weeks, or months.'
        period_from:
          type: string
          format: date
          description: Period start date when period_type = from_to.
        period_to:
          type: string
          format: date
          description: Period end date when period_type = from_to.
        will_assess_again:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the clinician intends to reassess at the end of the period (Step 9).
        planned_review_date:
          type: string
          format: date
          description: Planned date for the follow-up assessment.
        issued_at:
          type: string
          format: date-time
          description: Timestamp when the fit note was issued to the patient.
        issued_via:
          type: string
          enum:
          - digital
          - printed_computer_generated
          - printed_handwritten
          - ''
          description: 'Delivery channel: digital, printed_computer_generated, or printed_handwritten.'
        issue_setting:
          type: string
          enum:
          - primary_care
          - secondary_care_discharge
          - occupational_health
          - pharmacy
          - community
          - ''
          description: Care setting in which the fit note was issued.
        is_duplicate_of:
          type: string
          format: uuid
          description: If this is a duplicate (DWP policy 3.7 — only if the original was lost), points
            to the original fit note.
        safeguarding_concern:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the clinician flagged a safeguarding concern during the assessment.
        safeguarding_notes:
          type: string
          description: Free-text notes describing the safeguarding concern (not printed on the fit note).
        clinician_signature_svg:
          type: string
          description: Electronic signature captured as SVG path data, when issued_via = digital.
        clinician_signed_at:
          type: string
          format: date-time
          description: Timestamp the clinician applied the electronic signature.
      required:
      - created_at
      - updated_at
      - patient_id
      - clinician_id
      - medical_practice_id
      - status
      - assessment_method
      - general_fitness_considered
      - diagnosis_text
      - diagnosis_snomed_code
      - diagnosis_snomed_display
      - diagnosis_category
      - is_automatic_disability
      - is_non_medical
      - fitness_for_work
      - adaptation_phased_return
      - adaptation_altered_hours
      - adaptation_amended_duties
      - adaptation_workplace_adaptations
      - comments
      - period_type
      - period_duration_unit
      - will_assess_again
      - issued_via
      - issue_setting
      - safeguarding_concern
      - safeguarding_notes
      - clinician_signature_svg
      description: UK Statement of Fitness for Work (Med 3 / fit note). A single assessment record covering
        diagnosis, fitness category, adaptations, period, and follow-up.
    UnitedKingdomStatementOfFitnessForWorkGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        united_kingdom_statement_of_fitness_for_work_id:
          type: string
          format: uuid
          description: Foreign key to the parent fit note (one-to-one).
        fitness_category:
          type: string
          enum:
          - not_fit
          - may_be_fit
          - ''
          description: 'Fitness category computed from the form: not_fit or may_be_fit.'
        adaptation_intensity:
          type: string
          enum:
          - none
          - light
          - moderate
          - substantial
          - comprehensive
          - ''
          description: Adaptation intensity classification based on the number of tick boxes selected.
        adaptation_count:
          type: integer
          format: int32
          description: Number of adaptation tick boxes selected (0-4).
        period_days:
          type: integer
          format: int32
          description: Computed period length in calendar days.
        period_compliance:
          type: string
          enum:
          - self_cert_range
          - compliant
          - exceeds_initial_max
          - long_term
          - very_long_term
          - ''
          description: 'Compliance category for the period: self_cert_range, compliant, exceeds_initial_max,
            long_term, or very_long_term.'
        recommendation:
          type: string
          enum:
          - standard
          - refer_occupational_health
          - refer_access_to_work
          - refer_employment_advisor
          - review_for_validity
