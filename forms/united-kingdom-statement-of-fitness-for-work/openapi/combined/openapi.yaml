components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Full name of the issuing clinician (mandatory per DWP policy 3.7).
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address (typically the practice).
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code.
        profession:
          type: string
          enum:
          - doctor
          - nurse
          - occupational_therapist
          - pharmacist
          - physiotherapist
          - other
          - ''
          description: 'Profession: doctor, nurse, occupational_therapist, pharmacist, physiotherapist,
            or other.'
        registrationBody:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - GPhC
          - other
          - ''
          description: 'Regulator: GMC (doctors), NMC (nurses), HCPC (OTs/physios), GPhC (pharmacists).'
        registrationNumber:
          type: string
          description: Registration number issued by the regulator.
        isPrivatePractice:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the clinician is operating in private practice (non-NHS).
      required:
      - createdAt
      - updatedAt
      - name
      - profession
      - registrationBody
      - registrationNumber
      - isPrivatePractice
      description: Healthcare professional issuing the fit note (doctor, nurse, OT, pharmacist, or physiotherapist).
    MedicalPractice:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Practice or organisation name as printed on the fit note.
        postalAddressAsFullText:
          type: string
          description: Practice postal address.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 (typically GB).
        postcode:
          type:
          - string
          - 'null'
          description: Practice postcode.
        phone:
          type:
          - string
          - 'null'
          description: Practice phone number.
        email:
          type:
          - string
          - 'null'
          description: Practice email address.
        odsCode:
          type:
          - string
          - 'null'
          description: NHS Organisation Data Service (ODS) code identifying the practice.
        setting:
          type: string
          enum:
          - primary_care
          - secondary_care_inpatient
          - secondary_care_discharge
          - occupational_health
          - pharmacy
          - community_clinic
          - private_practice
