components:
  schemas:
    BowelCancerScreeningFit:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the participant this screening documents (restrict delete).
        clinicianId:
          type:
          - string
          - 'null'
          format: uuid
          description: Foreign key to the reviewing clinician or administrator (restrict delete); optional.
        reviewedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Date and time the FIT result was reviewed.
        screeningHub:
          type: string
          maxLength: 200
          description: Screening hub or centre name that processed the kit.
        participantIdentifier:
          type: string
          maxLength: 100
          description: Local participant or episode identifier as recorded on the record.
        age:
          type:
          - integer
          - 'null'
          format: int32
          description: Participant age in years; drives eligibility for the programme age range.
        withinAgeRange:
          type: string
          enum:
          - eligible
          - over-age-self-request
          - not-eligible
          - ''
          description: 'Eligibility against the programme age range: eligible, over-age-self-request,
            or not-eligible.'
        recallInterval:
          type: string
          enum:
          - two-yearly
          - other
          - ''
          description: 'Routine recall interval: two-yearly (standard programme) or other.'
        invitationDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the FIT kit was issued to the participant.
        previousOutcome:
          type: string
          enum:
          - first-invitation
          - prior-negative
          - prior-positive
          - unknown
          - ''
          description: 'Outcome of the previous screening round: first-invitation, prior-negative, prior-positive,
            or unknown.'
        lastScreenDate:
          type:
          - string
          - 'null'
          format: date
          description: Date of the most recent previous screening, when known.
        kitReturned:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the FIT kit was returned (yes/no); no yields a repeat-kit management action
            and a non-return flag.
        returnDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the completed sample was received.
        sampleAdequacy:
          type: string
          enum:
          - adequate
          - spoilt
          - insufficient
          - expired
          - ''
          description: 'Sample adequacy: adequate, spoilt, insufficient, or expired; anything other than
            adequate classifies as spoilt and is repeated.'
        spoiltReason:
          type: string
          enum:
          - leaked
          - undated
          - unlabelled
          - too-old
          - damaged
          - ''
          description: 'Reason a sample was spoilt or inadequate: leaked, undated, unlabelled, too-old,
            or damaged.'
        faecalHaemoglobinUgG:
          type:
          - number
          - 'null'
          format: double
          description: Measured faecal haemoglobin concentration in micrograms of haemoglobin per gram
            of faeces (ug Hb/g).
        assay:
          type: string
          maxLength: 200
          description: Analyser or assay identifier used to measure the faecal haemoglobin concentration.
        thresholdApplied:
          type:
          - number
          - 'null'
          format: double
          description: Programme threshold in ug Hb/g at or above which the result is positive; defaults
            to 120 (screening); 10 yields NICE DG56 symptomatic behaviour.
        redFlagSymptoms:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the participant reports red-flag symptoms (yes/no); yes sets the symptomatic
            pathway independently of the FIT result.
        clinicalNote:
          type: string
          description: Free-text clinical note.
        context:
          type: string
          description: Optional free-text clinical context shown in the summary.
      required:
      - createdAt
      - updatedAt
      - patientId
      - screeningHub
      - participantIdentifier
      - withinAgeRange
      - recallInterval
      - previousOutcome
      - kitReturned
      - sampleAdequacy
      - spoiltReason
      - assay
      - redFlagSymptoms
      - clinicalNote
      - context
      description: 'Main bowel-cancer-screening FIT record for one home faecal immunochemical test kit
        outcome: review context, participant identification, eligibility and invitation, kit return and
        sample adequacy, the measured faecal haemoglobin concentration and programme threshold, and red-flag
        symptoms. Result classification, fired rules, and flags live in child tables.'
    BowelCancerScreeningFitGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        bowelCancerScreeningFitId:
          type: string
          format: uuid
          description: Foreign key to the parent bowel-cancer-screening FIT record (unique, 1:1).
        resultClass:
          type: string
          enum:
          - negative
          - positive
          - spoilt
          - ''
          description: 'Result classification: negative (below threshold), positive (at or above threshold),
            spoilt (kit not returned or inadequate sample), or empty when returned and adequate but no
            numeric result.'
        managementAction:
          type: string
          enum:
          - routine-recall
          - refer-colonoscopy
          - repeat-kit
          - ''
          description: 'Recommended management action: routine-recall (negative), refer-colonoscopy (positive),
            or repeat-kit (non-return, spoilt, or incomplete).'
        symptomaticPathway:
          type: boolean
          description: Whether the participant is routed to the urgent suspected-cancer pathway (red-flag
            symptoms present); set independently of the result class.
        status:
          type: string
          enum:
          - complete
          - incomplete
          - ''
          description: 'Completeness status: complete when the fields required for the reached branch
            are present; otherwise incomplete.'
        gradedAt:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the classification.
      required:
      - createdAt
      - updatedAt
      - bowelCancerScreeningFitId
      - resultClass
      - managementAction
      - symptomaticPathway
      - status
      - gradedAt
      description: 'Computed result classification for a bowel-cancer-screening FIT record: result class,
        recommended management action, symptomatic-pathway indicator, and completeness status.'
    BowelCancerScreeningFitGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        bowelCancerScreeningFitGradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        flagId:
          type: string
          maxLength: 50
          description: Stable flag identifier (e.g. F-POSITIVE-COLONOSCOPY-001).
        category:
          type: string
          enum:
          - positive-colonoscopy-referral
          - symptomatic-suspected-cancer
          - non-return
          - spoilt-kit
          - incomplete
          - other
          - ''
          description: 'Flag category: positive-colonoscopy-referral, symptomatic-suspected-cancer, non-return,
            spoilt-kit, incomplete, or other.'
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          - ''
          description: 'Priority: low, medium, high.'
        description:
          type: string
          maxLength: 500
          description: Human-readable description of what fired the flag.
        suggestedAction:
          type: string
          maxLength: 500
          description: Suggested clinical or service action (e.g. "refer for colonoscopy", "reissue FIT
            kit").
      required:
      - createdAt
      - updatedAt
      - bowelCancerScreeningFitGradeId
      - flagId
      - category
      - priority
      - description
      - suggestedAction
      description: Safety flags that fire independently of the result class, with priority and a suggested
        action for the reviewing clinician or screening service.
    BowelCancerScreeningFitGradeRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        bowelCancerScreeningFitGradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        ruleId:
          type: string
          maxLength: 40
          description: Stable rule identifier (e.g. R-FIT-RESULT-POSITIVE-01).
        stage:
          type: string
          enum:
          - kit-return
          - adequacy
          - fit-result
          - symptom
          - completeness
          - ''
          description: 'Pathway stage the rule concerns: kit-return, adequacy, fit-result, symptom, or
            completeness.'
        category:
          type: string
          maxLength: 50
          description: Subject category (e.g. gate, classification, conditional-requirement).
        description:
          type: string
          maxLength: 500
          description: Human-readable description of why the rule fired.
      required:
      - createdAt
      - updatedAt
      - bowelCancerScreeningFitGradeId
      - ruleId
      - stage
      - category
      - description
      description: 'Audit trail of every classification rule that fired during grading: pathway stage,
        category, and description.'
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Reviewing clinician or administrator full name.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as a single text block.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code.
        role:
          type: string
          enum:
          - screening-administrator
