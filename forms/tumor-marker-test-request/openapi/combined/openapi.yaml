components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Name.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as full text.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code, such as for validating the postal address.
        role:
          type: string
          enum:
          - oncologist
          - gp
          - hospital-doctor
          - urologist
          - gynaecologist
          - other
          - ''
          description: 'Clinician role: oncologist, gp, hospital-doctor, urologist, gynaecologist, other.'
        registrationBody:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - other
          - ''
          description: 'Clinician registration body: GMC, NMC, HCPC, other.'
        registrationNumber:
          type: string
          description: Clinician registration number.
        unitedKingdomNhsNumber:
          type:
          - string
          - 'null'
          maxLength: 12
          description: United Kingdom NHS number, unique per person.
      required:
      - createdAt
      - updatedAt
      - name
      - role
      - registrationBody
      - registrationNumber
      description: Requesting clinician (referrer) who completes the tumour-marker test request.
    Patient:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          maxLength: 255
          description: Name.
        birthDate:
          type: string
          format: date
          description: Birth date.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as full text.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code, such as for validating the postal address.
        unitedKingdomNhsNumber:
          type:
          - string
          - 'null'
          maxLength: 20
          description: United Kingdom NHS number, unique per person.
        waistAsCm:
          type:
          - number
          - 'null'
          format: double
          description: Waist circumference measurement in cm, such as for calculating waist-height ratio
            (WHR).
        heightAsCm:
          type:
          - number
          - 'null'
          format: double
          description: Height measurement in cm, such as for calculating waist-height ratio (WHR).
        weightAsKg:
          type:
          - number
          - 'null'
          format: double
          description: Weight as kg.
        bodyMassIndex:
          type:
          - number
          - 'null'
          format: double
          description: Body mass index (BMI) measurement.
        waistHeightRatio:
          type:
          - number
          - 'null'
          format: double
          description: Waist-height ratio (WHR) measurement.
        vo2Max:
          type:
          - number
          - 'null'
          format: double
          description: VO2 max measurement.
      required:
      - createdAt
      - updatedAt
      - name
      - birthDate
      description: Patient
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          description: A URI identifying the problem type
        title:
          type: string
          description: A short summary of the problem type
        status:
          type: integer
          description: The HTTP status code
        detail:
          type: string
          description: An explanation of this occurrence
        instance:
          type: string
          description: A URI identifying this occurrence
        code:
          type: string
          description: A short machine-readable reason
        errors:
          type: object
          description: Per-field detail, when validation failed
      required:
      - type
      - title
      - status
    TumorMarkerTestRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the patient.
        clinicianId:
          type: string
          format: uuid
          description: Foreign key to the requesting clinician (referrer).
        status:
          type: string
          enum:
          - draft
          - submitted
          - vetted
          - collected
          - rejected
          - ''
          description: 'Request lifecycle status: draft, submitted, vetted, collected, rejected.'
        siteName:
          type: string
          maxLength: 255
          description: Name of the requesting site or clinic.
        setting:
          type: string
          enum:
          - outpatient
          - inpatient
          - community
          - emergency
          - ''
          description: 'Care setting: outpatient, inpatient, community, emergency.'
        referralDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the request was made.
        requestedByDate:
          type:
          - string
          - 'null'
          format: date
          description: Date by which the test is requested to be performed.
        psa:
          type: boolean
          description: Whether prostate-specific antigen (PSA) is requested.
        ca125:
          type: boolean
          description: Whether CA125 (suspected ovarian cancer; NICE CG122 / NG12) is requested.
        ca199:
          type: boolean
          description: Whether CA19-9 (pancreatic / hepatobiliary cancer) is requested.
        carcinoembryonicAntigenCea:
          type: boolean
          description: Whether carcinoembryonic antigen (CEA; colorectal cancer monitoring) is requested.
        alphaFetoproteinAfp:
          type: boolean
          description: Whether alpha-fetoprotein (AFP; hepatocellular carcinoma, germ-cell tumours) is
            requested.
        betaHcg:
          type: boolean
          description: Whether beta human chorionic gonadotrophin (beta-hCG; germ-cell / trophoblastic
            tumours) is requested.
        ca153:
          type: boolean
          description: Whether CA15-3 (breast cancer monitoring) is requested.
        lactateDehydrogenaseLdh:
          type: boolean
          description: Whether lactate dehydrogenase (LDH; germ-cell tumours, lymphoma prognosis) is requested.
        calcitonin:
          type: boolean
          description: Whether calcitonin (medullary thyroid carcinoma) is requested.
        chromograninA:
          type: boolean
          description: Whether chromogranin A (neuroendocrine tumours) is requested.
        primaryIndication:
          type: string
          enum:
          - suspected-malignancy
          - cancer-monitoring
          - treatment-response
          - recurrence-surveillance
          - screening-high-risk
          - characterise-mass
          - other
          - ''
          description: Primary clinical indication, used for appropriateness scoring.
        clinicalDetails:
          type: string
          maxLength: 1000
          description: Clinical details / history supporting the request (highest-value completeness field).
        knownCancerSite:
          type: string
          maxLength: 255
          description: Known or suspected primary cancer site, if any.
        onTreatment:
          type: boolean
          description: Whether the patient is currently on cancer treatment (affects marker interpretation).
        previousMarkerValue:
          type:
          - number
          - 'null'
          format: double
          description: Most recent previous marker value, for trend / response interpretation.
        previousMarkerDate:
          type:
          - string
          - 'null'
          format: date
          description: Date of the most recent previous marker value.
        urgency:
          type: string
          enum:
          - routine
          - urgent
          - two-week-wait
          - ''
          description: 'Requested triage urgency: routine, urgent, two-week-wait.'
        supervisingConsultant:
          type: string
          maxLength: 255
          description: Name of the supervising / responsible consultant.
        requesterContact:
          type: string
          maxLength: 255
          description: Contact details (bleep / phone) for the requester.
        notes:
          type: string
          maxLength: 1000
          description: Free-text additional notes.
      required:
      - createdAt
      - updatedAt
      - patientId
      - clinicianId
      - status
      - siteName
      - setting
      - psa
      - ca125
      - ca199
      - carcinoembryonicAntigenCea
      - alphaFetoproteinAfp
      - betaHcg
      - ca153
      - lactateDehydrogenaseLdh
      - calcitonin
      - chromograninA
      - primaryIndication
      - clinicalDetails
      - knownCancerSite
      - onTreatment
      - urgency
      - supervisingConsultant
      - requesterContact
      - notes
      description: Serum tumour-marker blood-test request (referral). Captures the requested tumour markers
        (booleans), the clinical indication and details, any known cancer site / prior marker value, and
        triage urgency.
    TumorMarkerTestRequestGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        tumorMarkerTestRequestId:
          type: string
          format: uuid
          description: Foreign key to the parent request (unique, 1:1).
        appropriatenessScore:
          type:
          - integer
          - 'null'
          format: int32
          description: Appropriateness score (1-9), anchored on marker-to-indication fit; not a single
            published instrument.
        appropriatenessBand:
          type: string
          enum:
          - usually-appropriate
          - may-be-appropriate
          - usually-not-appropriate
          - ''
          description: 'Appropriateness band: usually-appropriate (7-9), may-be-appropriate (4-6), usually-not-appropriate
            (1-3).'
        interpretationBand:
          type: string
          enum:
          - ok
          - caution
          - misuse-risk
          - ''
          description: 'Interpretation-safety band reflecting timing, treatment effects, and screening
            misuse: ok, caution, misuse-risk.'
        completenessPercent:
          type:
          - integer
          - 'null'
          format: int32
          description: Request completeness as a percentage of mandatory fields (0-100).
        triageTier:
          type: string
          enum:
          - routine
          - urgent
          - two-week-wait
          - ''
          description: 'Assigned triage tier: routine, urgent, two-week-wait.'
        targetTimeframe:
          type: string
          maxLength: 50
          description: Target timeframe for the test implied by the triage tier.
        recommendation:
          type: string
          enum:
          - accept
          - query-referrer
          - redirect
          - reject
          - ''
          description: 'Vetting recommendation: accept, query-referrer, redirect, reject.'
        clinicianNotes:
          type: string
          description: Free-text vetting notes.
        signedAt:
          type:
