components:
  schemas:
    AccessScheduling:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        encounterSatisfactionId:
          type: string
          format: uuid
          description: FK to encounter_satisfaction (UNIQUE = 1:1 relationship).
        easeOfScheduling:
          type:
          - integer
          - 'null'
          format: int32
          description: Satisfaction with ease of scheduling (1-5 Likert). NULL if unanswered.
        waitForAppointment:
          type:
          - integer
          - 'null'
          format: int32
