components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        name:
          type: string
          description: Sample-taker full name.
        email:
          type: string
          description: Email address.
        phone:
          type: string
          description: Phone number.
        postal_address_as_full_text:
          type: string
          description: Postal address as a single text block.
        country_as_iso_3166_1_alpha_2:
          type: string
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2.
        postcode:
          type: string
          description: Postal code.
        role:
          type: string
          enum:
          - midwife
          - health-visitor
          - neonatal-nurse
          - laboratory
          - other
          - ''
          description: 'Sample-taker role: midwife, health-visitor, neonatal-nurse, laboratory, or other.'
        registration_body:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - GPhC
          - other
          - ''
          description: 'Professional registration body: GMC, NMC, HCPC, GPhC, or other.'
        registration_number:
          type: string
          description: Professional registration number issued by the registration body.
      required:
      - created_at
      - updated_at
      - name
      - role
      - registration_body
      - registration_number
      description: Clinician identifying information for the sample-taker who took and recorded the newborn
        blood spot sample.
    NewbornBloodSpotScreening:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        patient_id:
          type: string
          format: uuid
          description: Foreign key to the newborn (infant) this screening documents (restrict delete).
        clinician_id:
          type: string
          format: uuid
          description: Foreign key to the sample-taker clinician (restrict delete); optional.
        sample_taker_role:
          type: string
          enum:
          - midwife
          - health-visitor
          - neonatal-nurse
          - laboratory
          - other
          - ''
          description: 'Role of the person taking and recording the sample: midwife, health-visitor, neonatal-nurse,
            laboratory, or other.'
        care_setting:
          type: string
          enum:
          - community
          - home
          - neonatal-unit
          - hospital
          - other
          - ''
          description: 'Care setting where the sample was taken: community, home, neonatal-unit, hospital,
            or other.'
        record_date:
          type: string
          format: date
          description: Date of this record.
        time_of_birth:
          type: string
          format: time
          description: Time of birth of the baby.
        gestation_weeks:
          type: number
          format: double
          description: Gestation at birth in weeks; affects cystic-fibrosis and preterm handling.
        previously_screened:
          type: string
          enum:
          - 'yes'
          - 'no'
          - unknown
          - ''
          description: 'Whether the baby has been previously screened: yes, no, or unknown.'
        consent_given:
          type: string
          enum:
          - 'yes'
          - 'no'
          - partial
          - ''
          description: 'Whether informed parental consent to screen was given: yes, no, or partial.'
        decline_reason:
          type: string
          description: Free-text reason where screening for any condition was declined.
        sample_date:
          type: string
          format: date
          description: Date the heel-prick sample was taken.
        sample_time:
          type: string
          format: time
          description: Time the heel-prick sample was taken.
        age_at_sample_days:
          type: integer
          format: int32
          description: Age of the baby in days at the time of sampling (sample_date minus birth_date);
            stored for audit and drives the day 5-8 window flag.
        sampling_site:
          type: string
          enum:
          - heel
          - other
          - ''
          description: 'Site the sample was taken from: heel or other.'
        sample_notes:
          type: string
          description: Free-text sample-taker note about the sample event.
        sample_adequacy:
          type: string
          enum:
          - adequate
          - inadequate
          - ''
          description: 'Sample adequacy: adequate or inadequate; an inadequate sample cannot be reliably
            screened and is repeated.'
        spot_quality_issue:
          type: string
          enum:
          - none
          - insufficient
          - compressed
          - layered
          - contaminated
          - incomplete-circles
          - ''
          description: 'Blood-spot quality issue: none, insufficient, compressed, layered, contaminated,
            or incomplete-circles.'
        is_repeat:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Whether this sample is a repeat: yes or no.'
        repeat_reason:
          type: string
          enum:
          - not-applicable
          - borderline-result
          - inadequate-sample
          - too-early
          - technical
          - other
          - ''
          description: 'Reason a repeat was taken: not-applicable, borderline-result, inadequate-sample,
            too-early, technical, or other; the last three are avoidable repeats.'
        scd_result:
          type: string
          enum:
          - not-suspected
          - suspected
          - carrier
          - repeat-required
          - declined
          - pending
          - ''
          description: 'Sickle cell disease result class: not-suspected, suspected, carrier, repeat-required,
            declined, or pending. carrier is valid for this condition only.'
        cf_result:
          type: string
          enum:
          - not-suspected
          - suspected
          - carrier
          - repeat-required
          - declined
          - pending
          - ''
          description: 'Cystic fibrosis result class: not-suspected, suspected, carrier (invalid), repeat-required,
            declined, or pending.'
        cht_result:
          type: string
          enum:
          - not-suspected
          - suspected
          - carrier
          - repeat-required
          - declined
          - pending
          - ''
          description: 'Congenital hypothyroidism result class: not-suspected, suspected, carrier (invalid),
            repeat-required, declined, or pending.'
        pku_result:
          type: string
          enum:
          - not-suspected
          - suspected
          - carrier
          - repeat-required
          - declined
          - pending
          - ''
          description: 'Phenylketonuria result class: not-suspected, suspected, carrier (invalid), repeat-required,
            declined, or pending.'
        mcadd_result:
          type: string
          enum:
          - not-suspected
          - suspected
          - carrier
          - repeat-required
          - declined
          - pending
          - ''
          description: 'MCADD (medium-chain acyl-CoA dehydrogenase deficiency) result class: not-suspected,
            suspected, carrier (invalid), repeat-required, declined, or pending.'
        msud_result:
          type: string
          enum:
          - not-suspected
          - suspected
          - carrier
          - repeat-required
          - declined
          - pending
          - ''
          description: 'Maple syrup urine disease result class: not-suspected, suspected, carrier (invalid),
            repeat-required, declined, or pending.'
        iva_result:
          type: string
          enum:
          - not-suspected
          - suspected
          - carrier
          - repeat-required
          - declined
          - pending
          - ''
          description: 'Isovaleric acidaemia result class: not-suspected, suspected, carrier (invalid),
            repeat-required, declined, or pending.'
        ga1_result:
          type: string
          enum:
          - not-suspected
          - suspected
          - carrier
          - repeat-required
          - declined
          - pending
          - ''
          description: 'Glutaric aciduria type 1 result class: not-suspected, suspected, carrier (invalid),
            repeat-required, declined, or pending.'
        hcu_result:
          type: string
          enum:
          - not-suspected
          - suspected
          - carrier
          - repeat-required
          - declined
          - pending
          - ''
          description: 'Homocystinuria (pyridoxine unresponsive) result class: not-suspected, suspected,
            carrier (invalid), repeat-required, declined, or pending.'
        clinical_context:
          type: string
          description: Optional free-text clinical context shown in the summary.
      required:
      - created_at
      - updated_at
      - patient_id
      - sample_taker_role
      - care_setting
      - previously_screened
      - consent_given
      - decline_reason
      - sampling_site
      - sample_notes
      - sample_adequacy
      - spot_quality_issue
      - is_repeat
      - repeat_reason
      - scd_result
      - cf_result
      - cht_result
      - pku_result
      - mcadd_result
      - msud_result
      - iva_result
      - ga1_result
      - hcu_result
      - clinical_context
      description: 'Main newborn-blood-spot-screening record for one heel-prick screening event: sample-taker
        and setting, baby identification, eligibility and consent, the sample event and its timing, sample
        quality, and the per-condition result class for the nine screened conditions. Overall outcome,
        fired rules, and flags live in child tables.'
    NewbornBloodSpotScreeningGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the row was soft-deleted.
        newborn_blood_spot_screening_id:
          type: string
          format: uuid
          description: Foreign key to the parent newborn-blood-spot-screening record (unique, 1:1).
        overall_outcome:
          type: string
          enum:
          - referral-required
          - repeat-required
          - incomplete
          - declined-only-outstanding
          - all-not-suspected
          - ''
          description: 'Overall screening outcome by precedence: referral-required (any suspected), repeat-required,
            incomplete, declined-only-outstanding, or all-not-suspected.'
        referral_status:
          type: string
          enum:
          - routine
          - repeat
          - urgent
          - ''
          description: 'Referral status: urgent when referral-required, repeat when repeat-required, otherwise
            routine.'
        sample_adequate:
          type: boolean
          description: 'Derived: true when sample_adequacy is adequate.'
        within_window:
          type: boolean
          description: 'Derived: true when age_at_sample_days is between day 5 and day 8 inclusive.'
