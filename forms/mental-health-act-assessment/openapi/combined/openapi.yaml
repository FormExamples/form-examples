components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        name:
          type: string
          description: Professional full name as recorded on the assessment.
        email:
          type: string
          description: Email address.
        phone:
          type: string
          description: Phone number.
        postal_address_as_full_text:
          type: string
          description: Postal address as a single text block.
        country_as_iso_3166_1_alpha_2:
          type: string
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2.
        postcode:
          type: string
          description: Postal code.
        role:
          type: string
          enum:
          - amhp
          - s12-doctor
          - psychiatrist
          - doctor
          - nurse
          - other
          - ''
          description: 'Professional role on the assessment: amhp (Approved Mental Health Professional),
            s12-doctor (Section 12(2) approved doctor), psychiatrist, doctor, nurse, or other.'
        registration_body:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - GPhC
          - SWE
          - other
          - ''
          description: 'Professional registration body: GMC, NMC, HCPC, GPhC, SWE (Social Work England),
            or other.'
        registration_number:
          type: string
          description: Professional registration number issued by the registration body.
      required:
      - created_at
      - updated_at
      - name
      - role
      - registration_body
      - registration_number
      description: Professional identifying information for the AMHP and the medical practitioners who
        conduct a Mental Health Act assessment.
    MentalHealthActAssessment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        patient_id:
          type: string
          format: uuid
          description: Foreign key to the patient assessed (restrict delete).
        clinician_id:
          type: string
          format: uuid
          description: Foreign key to the coordinating clinician / AMHP (restrict delete); optional.
        assessed_at:
          type: string
          format: date-time
          description: Date and time of the assessment.
        location:
          type: string
          enum:
          - hospital-ward
          - emergency-department
          - place-of-safety
          - care-home
          - community
          - other
          - ''
          description: 'Assessment location: hospital-ward, emergency-department, place-of-safety, care-home,
            community, or other.'
        referral_source:
          type: string
          description: Who requested the assessment.
        reason_for_assessment:
          type: string
          description: Presenting concern that prompted the assessment.
        person_identifier:
          type: string
          maxLength: 100
          description: Local identifier for the person assessed.
        age_band:
          type: string
          enum:
          - child
          - adolescent
          - adult
          - older-adult
          - ''
          description: 'Age band: child, adolescent, adult, or older-adult.'
        sex:
          type: string
          enum:
          - female
          - male
          - intersex
          - unknown
          - ''
          description: 'Sex recorded for the person: female, male, intersex, or unknown.'
        first_language:
          type: string
          description: First language; records interpreter need when not English.
        amhp_name:
          type: string
          description: Name of the Approved Mental Health Professional (AMHP).
        amhp_approved:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether AMHP approval is confirmed (yes/no).
        doctor1_name:
          type: string
          description: Name of the first medical practitioner.
        doctor1_gmc_number:
          type: string
          description: GMC registration number of the first medical practitioner.
        doctor1_section12_approved:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the first doctor is Section 12(2) approved (yes/no).
        doctor1_examined_at:
          type: string
          format: date-time
          description: Date and time the first doctor examined the patient.
        doctor2_name:
          type: string
          description: Name of the second medical practitioner (may be absent for s4/s5/s136).
        doctor2_gmc_number:
          type: string
          description: GMC registration number of the second medical practitioner.
        doctor2_section12_approved:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the second doctor is Section 12(2) approved (yes/no).
        doctor2_examined_at:
          type: string
          format: date-time
          description: Date and time the second doctor examined the patient.
        prior_acquaintance:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether at least one doctor was previously acquainted with the patient (yes/no).
        mental_disorder_present:
          type: string
          enum:
          - met
          - not-met
          - not-applicable
          - ''
          description: 'Criterion 1 — mental disorder of a nature or degree: met, not-met, or not-applicable.'
        mental_disorder_evidence:
          type: string
          description: Supporting evidence for the mental-disorder criterion.
        risk_to_own_health:
          type: string
          enum:
          - met
          - not-met
          - not-applicable
          - ''
          description: 'Criterion 2 — risk to the patient''s own health: met, not-met, or not-applicable.'
        risk_to_own_safety:
          type: string
          enum:
          - met
          - not-met
          - not-applicable
          - ''
          description: 'Criterion 2 — risk to the patient''s own safety: met, not-met, or not-applicable.'
        risk_to_others:
          type: string
          enum:
          - met
          - not-met
          - not-applicable
          - ''
          description: 'Criterion 2 — risk to the protection of others: met, not-met, or not-applicable.'
        risk_evidence:
          type: string
          description: Supporting evidence for the risk criteria.
        risk_imminence:
          type: string
          enum:
          - none
          - low
          - moderate
          - imminent
          - ''
          description: 'Imminence of risk: none, low, moderate, or imminent (drives urgency).'
        least_restrictive_met:
          type: string
          enum:
          - met
          - not-met
          - not-applicable
          - ''
          description: 'Criterion 3 — no less restrictive alternative available: met, not-met, or not-applicable.'
        alternatives_considered:
          type: string
          description: Informal, community, or Mental Capacity Act options considered.
        appropriate_treatment_available:
          type: string
          enum:
          - met
          - not-met
          - not-applicable
          - ''
          description: 'Criterion 4 — appropriate medical treatment available (required for s3): met,
            not-met, or not-applicable.'
        treatment_plan_summary:
          type: string
          description: Proposed treatment and where it would be provided.
        nearest_relative_identified:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the nearest relative has been identified (yes/no).
        nearest_relative_consulted:
          type: string
          enum:
          - 'yes'
          - 'no'
          - not-practicable
          - ''
          description: 'Whether the nearest relative was consulted: yes, no, or not-practicable.'
        nearest_relative_objection:
          type: string
          enum:
          - 'yes'
          - 'no'
          - unknown
          - ''
          description: 'Whether the nearest relative objects to a s3 application: yes, no, or unknown.'
        consultation_record:
          type: string
          description: AMHP consultation notes.
        recommended_section:
          type: string
          enum:
          - '2'
          - '3'
          - '4'
          - 5-2
          - 5-4
          - '136'
          - none
          - ''
          description: 'Recommended section: 2, 3, 4, 5-2, 5-4, 136, or none.'
        outcome:
          type: string
          enum:
          - detain-under-section
          - informal-admission
          - community
          - no-action
          - ''
          description: 'Assessment outcome: detain-under-section, informal-admission, community, or no-action.'
        bed_identified:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether a receiving bed is confirmed (yes/no).
        conveyance:
          type: string
          enum:
          - ambulance
          - police
          - self
          - other
          - ''
          description: 'Means of conveyance: ambulance, police, self, or other.'
        clinical_legal_note:
          type: string
          description: Free-text clinical and legal note.
      required:
      - created_at
      - updated_at
      - patient_id
      - location
      - referral_source
      - reason_for_assessment
      - person_identifier
      - age_band
      - sex
      - first_language
      - amhp_name
      - amhp_approved
      - doctor1_name
      - doctor1_gmc_number
      - doctor1_section12_approved
      - doctor2_name
      - doctor2_gmc_number
      - doctor2_section12_approved
      - prior_acquaintance
      - mental_disorder_present
      - mental_disorder_evidence
      - risk_to_own_health
      - risk_to_own_safety
      - risk_to_others
      - risk_evidence
      - risk_imminence
      - least_restrictive_met
      - alternatives_considered
      - appropriate_treatment_available
      - treatment_plan_summary
      - nearest_relative_identified
      - nearest_relative_consulted
      - nearest_relative_objection
      - consultation_record
      - recommended_section
      - outcome
      - bed_identified
      - conveyance
      - clinical_legal_note
      description: 'Main Mental Health Act assessment record: context and identification, assessing professionals,
        statutory criteria, nearest-relative consultation, and recommendation and outcome. Legal-completeness
        status, classification, fired rules, and flags live in child tables. Not a numeric score and not
        an automated detention decision.'
    MentalHealthActAssessmentGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the row was soft-deleted.
        mental_health_act_assessment_id:
          type: string
          format: uuid
          description: Foreign key to the parent assessment (unique, 1:1).
        completeness_status:
          type: string
          enum:
