components:
  schemas:
    BloodTestRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the patient.
        clinicianId:
          type: string
          format: uuid
          description: Foreign key to the requesting clinician (referrer).
        status:
          type: string
          enum:
          - draft
          - submitted
          - vetted
          - collected
          - rejected
          - ''
          description: 'Request lifecycle status: draft, submitted, vetted, collected, rejected.'
        siteName:
          type: string
          maxLength: 255
          description: Name of the requesting site or clinic.
        setting:
          type: string
          enum:
          - outpatient
          - inpatient
          - community
          - emergency
          - ''
          description: 'Care setting: outpatient, inpatient, community, emergency.'
        referralDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the request was made.
        fullBloodCount:
          type: boolean
          description: Whether a full blood count (FBC) is requested.
        ureaElectrolytes:
          type: boolean
          description: Whether urea and electrolytes (U&E) are requested.
        liverFunction:
          type: boolean
          description: Whether liver function tests (LFT) are requested.
        thyroidFunction:
          type: boolean
          description: Whether thyroid function tests (TFT) are requested.
        hba1c:
          type: boolean
          description: Whether HbA1c (glycated haemoglobin, diagnostic) is requested.
        lipidProfile:
          type: boolean
          description: Whether a lipid profile is requested.
        cReactiveProtein:
          type: boolean
          description: Whether C-reactive protein (CRP) is requested.
        coagulationScreen:
          type: boolean
          description: Whether a coagulation screen (PT / APTT) is requested.
        boneProfile:
          type: boolean
          description: Whether a bone profile (calcium, phosphate, ALP, albumin) is requested.
        ferritinIron:
          type: boolean
          description: Whether ferritin / iron studies are requested.
        vitaminB12Folate:
          type: boolean
          description: Whether vitamin B12 and folate are requested.
        vitaminD:
          type: boolean
          description: Whether vitamin D (25-OH) is requested.
        hba1cMonitoring:
          type: boolean
          description: Whether HbA1c for diabetes monitoring (repeat) is requested.
        glucose:
          type: boolean
          description: Whether a glucose (fasting or random) is requested.
        inr:
          type: boolean
          description: Whether an INR (anticoagulation monitoring) is requested.
        bloodCulture:
          type: boolean
          description: Whether a blood culture is requested.
        groupAndSave:
          type: boolean
          description: Whether a group and save (blood group and antibody screen) is requested.
        crossmatch:
          type: boolean
          description: Whether a crossmatch (for transfusion) is requested.
        troponin:
          type: boolean
          description: Whether a troponin (cardiac marker) is requested.
        dDimer:
          type: boolean
          description: Whether a D-dimer is requested.
        amylaseLipase:
          type: boolean
          description: Whether amylase / lipase is requested.
        primaryIndication:
          type: string
          enum:
          - routine-monitoring
          - anaemia
          - fatigue
          - infection
          - diabetes-monitoring
          - thyroid-symptoms
          - cardiovascular-risk
          - liver-disease
          - renal-monitoring
          - anticoagulation-monitoring
          - pre-operative
          - suspected-malignancy
          - other
          - ''
          description: Primary clinical indication, used for appropriateness scoring.
        clinicalDetails:
          type: string
          maxLength: 1000
          description: Clinical details / history supporting the request (highest-value completeness field).
        relevantMedications:
          type: string
          maxLength: 1000
          description: Relevant medications (e.g. anticoagulants, statins) affecting interpretation or
            safety.
        fastingRequired:
          type: boolean
          description: Whether any requested test requires the patient to be fasting.
        fastingStatus:
          type: string
          enum:
          - fasting
          - non-fasting
          - unknown
          - ''
          description: 'Patient fasting status at collection: fasting, non-fasting, unknown.'
        specimenCollected:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Whether the specimen has been collected: yes, no.'
        collectionDatetime:
          type:
          - string
          - 'null'
          format: date-time
          description: Timestamp when the specimen was collected.
        knownBloodBorneVirus:
          type: boolean
          description: Whether the patient has a known blood-borne virus (handling precaution).
        difficultVenousAccess:
          type: boolean
          description: Whether the patient has difficult venous access.
        urgency:
          type: string
          enum:
          - routine
          - urgent
          - stat
          - ''
          description: 'Requested triage urgency: routine, urgent, stat.'
        supervisingConsultant:
          type: string
          maxLength: 255
          description: Name of the supervising / responsible consultant.
        requesterContact:
          type: string
          maxLength: 255
          description: Contact details (bleep / phone) for the requester.
        notes:
          type: string
          maxLength: 1000
          description: Free-text additional notes.
      required:
      - createdAt
      - updatedAt
      - patientId
      - clinicianId
      - status
      - siteName
      - setting
      - fullBloodCount
      - ureaElectrolytes
      - liverFunction
      - thyroidFunction
      - hba1c
      - lipidProfile
      - cReactiveProtein
      - coagulationScreen
      - boneProfile
      - ferritinIron
      - vitaminB12Folate
      - vitaminD
      - hba1cMonitoring
      - glucose
      - inr
      - bloodCulture
      - groupAndSave
      - crossmatch
      - troponin
      - dDimer
      - amylaseLipase
      - primaryIndication
      - clinicalDetails
      - relevantMedications
      - fastingRequired
      - fastingStatus
      - specimenCollected
      - knownBloodBorneVirus
      - difficultVenousAccess
      - urgency
      - supervisingConsultant
      - requesterContact
      - notes
      description: Pathology / phlebotomy blood-test order (request). Captures the requested test panels
        (booleans), the clinical indication and details, pre-analytical / specimen handling, patient-safety
        factors, and triage urgency.
    BloodTestRequestGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        bloodTestRequestId:
          type: string
          format: uuid
          description: Foreign key to the parent request (unique, 1:1).
        appropriatenessScore:
          type:
          - integer
          - 'null'
          format: int32
          description: Appropriateness score (1-9). Anchored on RCPath National Minimum Retesting Intervals
            appropriateness and indication match; no single published 1-9 score exists for bloods.
        appropriatenessBand:
          type: string
          enum:
          - usually-appropriate
          - may-be-appropriate
          - usually-not-appropriate
          - ''
          description: 'Appropriateness band: usually-appropriate (7-9), may-be-appropriate (4-6), usually-not-appropriate
            (1-3).'
        preanalyticalBand:
          type: string
          enum:
          - ok
          - caution
          - reject-risk
          - ''
          description: 'Pre-analytical / specimen safety band: ok, caution, reject-risk (fasting met?
            specimen labelled / collected? right tubes?).'
        fastingViolation:
          type: boolean
          description: Whether a fasting-required test was collected non-fasting (or fasting status unknown).
        completenessPercent:
          type:
          - integer
          - 'null'
          format: int32
          description: Request completeness as a percentage of mandatory fields (0-100); clinical details
            + indication weighted highest.
        triageTier:
          type: string
          enum:
          - routine
          - urgent
          - stat
          - ''
          description: 'Assigned triage tier: routine, urgent, stat.'
        targetTimeframe:
          type: string
          maxLength: 50
          description: Target timeframe for collection / analysis implied by the triage tier.
        recommendation:
          type: string
          enum:
          - accept
          - query-referrer
          - redirect
          - reject
          - ''
          description: 'Vetting recommendation: accept, query-referrer, redirect, reject.'
        clinicianNotes:
          type: string
          description: Free-text vetting notes.
        signedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Timestamp of vetting clinician electronic signature.
        gradedAt:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the result.
      required:
      - createdAt
      - updatedAt
      - bloodTestRequestId
      - appropriatenessBand
      - preanalyticalBand
      - fastingViolation
      - triageTier
      - targetTimeframe
      - recommendation
      - clinicianNotes
      - gradedAt
      description: 'Computed four-axis grading result: appropriateness (1-9 anchored on RCPath retesting
        intervals + indication match), pre-analytical / specimen safety, request completeness, and triage
        priority.'
    BloodTestRequestGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        bloodTestRequestGradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        flagId:
          type: string
          maxLength: 50
          description: Stable flag identifier (e.g. F-RETEST-INTERVAL-BREACH-001).
        category:
          type: string
          enum:
          - duplicate-recent-test
          - retest-interval-breach
          - fasting-required-not-met
          - missing-clinical-details
          - missing-indication
          - blood-borne-virus-precaution
          - stat-critical
          - no-test-selected
          - other
          - ''
          description: Flag category.
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          - ''
          description: 'Priority: low, medium, high.'
        description:
          type: string
          maxLength: 500
          description: Human-readable description of what fired the flag.
        suggestedAction:
          type: string
          maxLength: 500
          description: Suggested action (e.g. "query referrer before bleeding").
      required:
      - createdAt
      - updatedAt
      - bloodTestRequestGradeId
      - flagId
      - category
      - priority
      - description
      - suggestedAction
      description: Safety-critical flags that fire independently of the four axes, with priority and a
        suggested action for the laboratory / phlebotomy team.
    BloodTestRequestGradeRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        bloodTestRequestGradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        ruleId:
          type: string
          maxLength: 40
          description: Stable rule identifier (e.g. R-APPROP-RETEST-01).
        axis:
          type: string
          enum:
          - appropriateness
          - preanalytical
          - completeness
          - triage
          - ''
          description: 'Scoring axis the rule belongs to: appropriateness, preanalytical, completeness,
            triage.'
        category:
          type: string
          maxLength: 50
          description: Category or indication the rule relates to.
        description:
          type: string
          maxLength: 500
          description: Human-readable description of why the rule fired.
      required:
      - createdAt
      - updatedAt
      - bloodTestRequestGradeId
      - ruleId
      - axis
      - category
      - description
      description: Audit trail of every appropriateness / preanalytical / completeness / triage rule that
        fired for this request.
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
