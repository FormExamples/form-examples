        lipid_profile:
          type: boolean
          description: Whether a lipid profile is requested.
        c_reactive_protein:
          type: boolean
          description: Whether C-reactive protein (CRP) is requested.
        coagulation_screen:
          type: boolean
          description: Whether a coagulation screen (PT / APTT) is requested.
        bone_profile:
          type: boolean
          description: Whether a bone profile (calcium, phosphate, ALP, albumin) is requested.
        ferritin_iron:
          type: boolean
          description: Whether ferritin / iron studies are requested.
        vitamin_b12_folate:
          type: boolean
          description: Whether vitamin B12 and folate are requested.
        vitamin_d:
          type: boolean
          description: Whether vitamin D (25-OH) is requested.
        hba1c_monitoring:
          type: boolean
          description: Whether HbA1c for diabetes monitoring (repeat) is requested.
        glucose:
          type: boolean
          description: Whether a glucose (fasting or random) is requested.
        inr:
          type: boolean
          description: Whether an INR (anticoagulation monitoring) is requested.
        blood_culture:
          type: boolean
          description: Whether a blood culture is requested.
        group_and_save:
          type: boolean
          description: Whether a group and save (blood group and antibody screen) is requested.
        crossmatch:
          type: boolean
          description: Whether a crossmatch (for transfusion) is requested.
        troponin:
          type: boolean
          description: Whether a troponin (cardiac marker) is requested.
        d_dimer:
          type: boolean
          description: Whether a D-dimer is requested.
        amylase_lipase:
          type: boolean
          description: Whether amylase / lipase is requested.
        primary_indication:
          type: string
          enum:
          - routine-monitoring
          - anaemia
          - fatigue
          - infection
          - diabetes-monitoring
          - thyroid-symptoms
          - cardiovascular-risk
          - liver-disease
          - renal-monitoring
          - anticoagulation-monitoring
          - pre-operative
          - suspected-malignancy
          - other
          - ''
          description: Primary clinical indication, used for appropriateness scoring.
        clinical_details:
          type: string
          maxLength: 1000
          description: Clinical details / history supporting the request (highest-value completeness field).
        relevant_medications:
          type: string
          maxLength: 1000
          description: Relevant medications (e.g. anticoagulants, statins) affecting interpretation or
            safety.
        fasting_required:
          type: boolean
          description: Whether any requested test requires the patient to be fasting.
        fasting_status:
          type: string
          enum:
