components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Name.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as full text.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code, such as for validating the postal address.
        role:
          type: string
          enum:
          - gastroenterologist
          - endoscopist
          - gp
          - surgeon
          - nurse-endoscopist
          - other
          - ''
          description: 'Clinician role: gastroenterologist, endoscopist, gp, surgeon, nurse-endoscopist,
            other.'
        registrationBody:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - other
          - ''
          description: 'Clinician registration body: GMC, NMC, HCPC, other.'
        registrationNumber:
          type: string
          description: Clinician registration number.
        unitedKingdomNhsNumber:
          type:
          - string
          - 'null'
          maxLength: 12
          description: United Kingdom NHS number, unique per person.
      required:
      - createdAt
      - updatedAt
      - name
      - role
      - registrationBody
      - registrationNumber
      description: Requesting clinician (referrer) who completes the endoscopy request.
    EndoscopyTestRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the patient.
        clinicianId:
          type: string
          format: uuid
          description: Foreign key to the requesting clinician (referrer).
        status:
          type: string
          enum:
          - draft
          - submitted
          - vetted
          - scheduled
          - rejected
          - ''
          description: 'Request lifecycle status: draft, submitted, vetted, scheduled, rejected.'
        siteName:
          type: string
          maxLength: 255
          description: Name of the requesting site or clinic.
        setting:
          type: string
          enum:
          - outpatient
          - inpatient
          - community
          - emergency
          - ''
          description: 'Care setting: outpatient, inpatient, community, emergency.'
        referralDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the referral was made.
        requestedByDate:
          type:
          - string
          - 'null'
          format: date
          description: Date by which the procedure is requested to be performed.
        requestedProcedure:
          type: string
          enum:
          - ogd
          - gastroscopy
          - colonoscopy
          - flexible-sigmoidoscopy
          - ercp
          - eus
          - capsule
          - other
          - ''
          description: 'Requested endoscopic procedure: ogd, gastroscopy, colonoscopy, flexible-sigmoidoscopy,
            ercp, eus, capsule, other.'
        primaryIndication:
          type: string
          enum:
          - dyspepsia
          - gord
          - dysphagia
          - upper-gi-bleeding
          - iron-deficiency-anaemia
          - weight-loss
          - suspected-malignancy
          - barretts-surveillance
          - h-pylori
          - rectal-bleeding
          - change-in-bowel-habit
          - positive-fit
          - ibd-surveillance
          - polyp-surveillance
          - abnormal-imaging
          - other
          - ''
          description: Primary clinical indication, used for appropriateness scoring.
        clinicalQuestion:
          type: string
          maxLength: 1000
          description: Specific clinical question the procedure should answer (highest-value field).
        relevantHistory:
          type: string
          maxLength: 1000
          description: Relevant medical, surgical, and endoscopic history.
        redFlagDysphagia:
          type: boolean
          description: 'ALARM red flag: dysphagia (NICE NG12 suspected upper-GI cancer feature).'
        redFlagWeightLoss:
          type: boolean
          description: 'ALARM red flag: unexplained weight loss.'
        redFlagAnaemia:
          type: boolean
          description: 'ALARM red flag: iron-deficiency anaemia.'
        redFlagGiBleeding:
          type: boolean
          description: 'ALARM red flag: gastrointestinal bleeding (haematemesis, melaena, or rectal bleeding).'
        redFlagAbdominalMass:
          type: boolean
          description: 'ALARM red flag: palpable abdominal or epigastric mass.'
        redFlagAgeOver55:
          type: boolean
          description: 'ALARM red flag: age 55 or over (NICE NG12 age threshold for upper-GI referral).'
        fitResultUgG:
          type:
          - number
          - 'null'
          format: double
          description: Faecal immunochemical test (FIT) result in micrograms of haemoglobin per gram of
            faeces; NICE DG56 referral threshold is >= 10 ug/g.
        haemoglobinGL:
          type:
          - number
          - 'null'
          format: double
          description: Haemoglobin concentration in g/L.
        ferritinUgL:
          type:
          - number
          - 'null'
          format: double
          description: Serum ferritin in ug/L (micrograms per litre).
        takingAnticoagulant:
          type: boolean
          description: Whether the patient is taking an anticoagulant.
        anticoagulantAgent:
          type: string
          enum:
          - none
          - warfarin
          - apixaban
          - rivaroxaban
          - edoxaban
          - dabigatran
          - lmwh
          - other
          - ''
          description: 'Anticoagulant agent: none, warfarin, apixaban, rivaroxaban, edoxaban, dabigatran,
            lmwh, other.'
        takingAntiplatelet:
          type: boolean
          description: Whether the patient is taking an antiplatelet agent.
        antiplateletAgent:
          type: string
          enum:
          - none
          - aspirin
          - clopidogrel
          - ticagrelor
          - prasugrel
          - dipyridamole
          - dual
          - other
          - ''
          description: 'Antiplatelet agent: none, aspirin, clopidogrel, ticagrelor, prasugrel, dipyridamole,
            dual, other.'
        diabetesMedication:
          type: string
          enum:
          - none
          - oral
          - insulin
          - ''
          description: 'Diabetes medication category affecting fasting / prep plans: none, oral, insulin.'
        allergies:
          type: string
          maxLength: 1000
          description: Free-text allergy list.
        latexAllergy:
          type: boolean
          description: Whether the patient has a latex allergy (theatre / equipment precaution).
        cardiacNyhaClass:
          type: string
          enum:
          - I
          - II
          - III
          - IV
          - ''
          description: 'New York Heart Association (NYHA) functional class: I, II, III, IV.'
        pacemakerIcd:
          type: boolean
          description: Whether the patient has a pacemaker or implantable cardioverter-defibrillator (diathermy
            precaution).
        chronicKidneyDisease:
          type: boolean
          description: Whether the patient has chronic kidney disease (affects bowel-prep choice).
        egfrMlMin:
          type:
          - number
          - 'null'
          format: double
          description: Estimated glomerular filtration rate (eGFR) in mL/min/1.73m2.
        sleepApnoea:
          type: boolean
          description: Whether the patient has obstructive sleep apnoea (sedation risk).
        neutropenia:
          type: boolean
          description: Whether the patient is neutropenic (antibiotic-prophylaxis / infection consideration).
        asaGrade:
          type: string
          enum:
          - I
          - II
          - III
          - IV
          - V
          - ''
          description: 'American Society of Anesthesiologists (ASA) physical-status grade: I, II, III,
            IV, V.'
        vcjdRisk:
          type: boolean
          description: 'Infection flag: variant Creutzfeldt-Jakob disease (vCJD) risk requiring single-use
            or quarantined instruments.'
        cpeCarriage:
          type: boolean
          description: 'Infection flag: carbapenemase-producing Enterobacterales (CPE) carriage.'
        mrsa:
          type: boolean
          description: 'Infection flag: meticillin-resistant Staphylococcus aureus (MRSA) colonisation.'
        bloodBorneVirus:
          type: boolean
          description: 'Infection flag: known blood-borne virus (HIV, hepatitis B, hepatitis C).'
        fitForBowelPrep:
          type: boolean
          description: Whether the patient is assessed as fit to take bowel preparation.
        bowelPrepAgent:
          type: string
          enum:
          - none
          - moviprep
          - plenvu
          - klean-prep
          - picolax
          - citramag
          - other
          - ''
          description: 'Bowel-preparation agent: none, moviprep, plenvu, klean-prep, picolax, citramag,
            other.'
        sedation:
          type: string
          enum:
          - none
          - throat-spray
          - conscious
          - deep
          - ''
          description: 'Planned sedation: none, throat-spray, conscious, deep.'
        escortAvailable:
          type: boolean
          description: Whether a responsible escort is available post-sedation.
        urgency:
          type: string
          enum:
          - routine
          - urgent
          - two-week-wait
          - emergency
          - ''
          description: 'Requested triage urgency: routine, urgent, two-week-wait, emergency.'
        supervisingConsultant:
          type: string
          maxLength: 255
          description: Name of the supervising / responsible consultant.
        requesterContact:
          type: string
          maxLength: 255
          description: Contact details (bleep / phone) for the requester.
        interpreterRequired:
          type: boolean
          description: Whether an interpreter is required.
        notes:
          type: string
          maxLength: 1000
          description: Free-text additional notes.
      required:
      - createdAt
      - updatedAt
      - patientId
      - clinicianId
      - status
      - siteName
      - setting
      - requestedProcedure
      - primaryIndication
      - clinicalQuestion
      - relevantHistory
      - redFlagDysphagia
      - redFlagWeightLoss
      - redFlagAnaemia
      - redFlagGiBleeding
      - redFlagAbdominalMass
      - redFlagAgeOver55
      - takingAnticoagulant
      - anticoagulantAgent
      - takingAntiplatelet
      - antiplateletAgent
      - diabetesMedication
      - allergies
      - latexAllergy
      - cardiacNyhaClass
      - pacemakerIcd
      - chronicKidneyDisease
      - sleepApnoea
      - neutropenia
      - asaGrade
      - vcjdRisk
      - cpeCarriage
      - mrsa
      - bloodBorneVirus
      - fitForBowelPrep
      - bowelPrepAgent
      - sedation
      - escortAvailable
      - urgency
      - supervisingConsultant
      - requesterContact
      - interpreterRequired
      - notes
      description: GI endoscopy procedure request (referral). Captures the requested procedure, clinical
        indication and question, ALARM red flags, FIT and haematinic results, anticoagulant / antiplatelet
        medication, diabetes, allergies, comorbidities, infection-control flags, bowel-prep and sedation
        plans, and triage urgency.
    EndoscopyTestRequestGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        endoscopyTestRequestId:
          type: string
          format: uuid
          description: Foreign key to the parent request (unique, 1:1).
        appropriatenessScore:
          type:
          - integer
          - 'null'
          format: int32
          description: Appropriateness score (1-9), ACR / ASGE-AUC / EPAGE style.
        appropriatenessBand:
          type: string
          enum:
          - usually-appropriate
          - may-be-appropriate
          - usually-not-appropriate
          - ''
          description: 'Appropriateness band: usually-appropriate (7-9), may-be-appropriate (4-6), usually-not-appropriate
            (1-3).'
        triageTier:
          type: string
          enum:
          - routine
          - urgent
          - two-week-wait
          - emergency
          - ''
          description: 'Assigned triage tier: routine, urgent, two-week-wait, emergency.'
        targetTimeframe:
          type: string
          maxLength: 50
          description: Target timeframe for the procedure implied by the triage tier (e.g. "<= 14 days
            (2WW)").
        twoWeekWaitEligible:
          type: boolean
          description: Whether the request meets NICE NG12 / DG56 suspected-cancer two-week-wait criteria.
        twoWeekWaitRationale:
          type: string
          maxLength: 500
          description: Rationale explaining the two-week-wait eligibility decision.
        completenessPercent:
          type:
          - integer
          - 'null'
          format: int32
          description: Request completeness as a percentage of mandatory fields (0-100).
        glasgowBlatchfordScore:
          type:
          - integer
          - 'null'
          format: int32
          description: Glasgow-Blatchford bleeding score (0-23); 0 indicates very low risk suitable for
            outpatient management.
        rockallScore:
          type:
          - integer
          - 'null'
          format: int32
          description: Pre-endoscopy Rockall score (0-11) for upper-GI-bleed mortality / rebleed risk.
        riskBand:
          type: string
          enum:
          - low
          - moderate
          - high
          - ''
          description: 'Pre-procedure risk band: low, moderate, high.'
        anticoagulantAction:
          type: string
          maxLength: 500
          description: Recommended anticoagulant / antiplatelet management action per BSG / ESGE bleeding-risk
            stratification.
        recommendation:
          type: string
          enum:
          - accept
          - query-referrer
          - redirect
          - reject
          - ''
          description: 'Vetting recommendation: accept, query-referrer, redirect, reject.'
        clinicianNotes:
          type: string
          description: Free-text vetting notes.
        signedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Timestamp of vetting clinician electronic signature.
        gradedAt:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the result.
      required:
      - createdAt
      - updatedAt
      - endoscopyTestRequestId
      - appropriatenessBand
      - triageTier
      - targetTimeframe
      - twoWeekWaitEligible
      - twoWeekWaitRationale
      - riskBand
      - anticoagulantAction
      - recommendation
      - clinicianNotes
      - gradedAt
      description: 'Computed four-axis grading result: appropriateness (ACR / ASGE-AUC / EPAGE 1-9), cancer-pathway
        urgency / triage tier, request completeness, and pre-procedure bleeding / mortality risk.'
