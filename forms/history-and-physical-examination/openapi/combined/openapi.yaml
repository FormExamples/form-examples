components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Clinician full name as recorded in the rota.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as a single text block.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code.
        role:
          type: string
          enum:
          - doctor
          - acp
          - physician-associate
          - other
          - ''
          description: 'Primary clinical role: doctor, acp (advanced clinical practitioner), physician-associate,
            or other.'
        registrationBody:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - GPhC
          - other
          - ''
          description: 'Professional registration body: GMC, NMC, HCPC, GPhC, or other.'
        registrationNumber:
          type: string
          description: Professional registration number issued by the registration body.
      required:
      - createdAt
      - updatedAt
      - name
      - role
      - registrationBody
      - registrationNumber
      description: Clinician identifying information for the clerking clinician who authored a history-and-physical-examination
        record.
    HistoryAndPhysicalExamination:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the patient this clerking documents (restrict delete).
        clinicianId:
          type:
          - string
          - 'null'
          format: uuid
          description: Foreign key to the clerking clinician (restrict delete); optional.
        clerkedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Date and time of clerking.
        clinicianRole:
          type: string
          enum:
          - doctor
          - acp
          - physician-associate
          - other
          - ''
          description: 'Clerking clinician role: doctor, acp, physician-associate, or other.'
        registrationNumber:
          type: string
          maxLength: 50
          description: Clerking clinician professional registration number (GMC / NMC / HCPC).
        careSetting:
          type: string
          enum:
          - emergency-department
          - acute-medical-unit
          - ward
          - other
          - ''
          description: 'Care setting: emergency-department, acute-medical-unit, ward, or other.'
        admissionSource:
          type: string
          enum:
          - self
          - gp
          - ambulance
          - transfer
          - other
          - ''
          description: 'Admission source: self, gp, ambulance, transfer, or other.'
        patientIdentifier:
          type: string
          maxLength: 100
          description: Local patient or encounter identifier as recorded on the clerking.
        ageBand:
          type: string
          enum:
          - 18-39
          - 40-64
          - 65-79
          - 80-plus
          - ''
          description: 'Adult age band: 18-39, 40-64, 65-79, or 80-plus.'
        sex:
          type: string
          enum:
          - female
          - male
          - intersex
          - unknown
          - ''
          description: 'Patient sex recorded for clinical purposes: female, male, intersex, or unknown.'
        presentingComplaint:
          type: string
          description: 'History: the presenting complaint (required component).'
        historyOfPresentingComplaint:
          type: string
          description: 'History: the history of the presenting complaint (required component).'
        pastMedicalSurgicalHistory:
          type: string
          description: 'History: past medical and surgical history, or an explicit "nil" (required component).'
        drugHistory:
          type: string
          description: 'History: current medications / drug history (required component).'
        allergyStatus:
          type: string
          enum:
          - none-known
          - has-allergies
          - not-documented
          - ''
          description: 'Allergy status: none-known, has-allergies, or not-documented; not-documented (or
            empty) is a blocking flag.'
        allergyDetail:
          type: string
          description: 'Allergy detail: reactions recorded when allergy_status is has-allergies.'
        familyHistory:
          type: string
          description: 'History: family history, or an explicit "nil" (optional component).'
        socialHistory:
          type: string
          description: 'History: social history — smoking, alcohol, occupation, living situation (required
            component).'
        systemsReview:
          type: string
          description: 'History: systems review narrative or structured findings (required component).'
        temperature:
          type:
          - number
          - 'null'
          format: double
          description: 'Vital sign: temperature in degrees Celsius; normal range 36.1-38.0. Null when
            not measured.'
        heartRate:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Vital sign: heart rate in beats per minute; normal range 51-90. Null when not
            measured.'
        respiratoryRate:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Vital sign: respiratory rate in breaths per minute; normal range 12-20. Null when
            not measured.'
        systolicBloodPressure:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Vital sign: systolic blood pressure in mmHg; normal range 111-219. Null when not
            measured.'
        oxygenSaturation:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Vital sign: oxygen saturation as a percentage; normal >= 96. Null when not measured.'
        consciousnessLevel:
          type: string
          enum:
          - alert
          - voice
          - pain
          - unresponsive
          - ''
          description: 'Vital sign: consciousness level (AVPU) — alert, voice, pain, or unresponsive;
            anything other than alert is flagged.'
        examCardiovascular:
          type: string
          description: 'Examination: cardiovascular system findings, or explicit "deferred" (core system).'
        examRespiratory:
          type: string
          description: 'Examination: respiratory system findings, or explicit "deferred" (core system).'
        examAbdominal:
          type: string
          description: 'Examination: abdominal system findings, or explicit "deferred" (core system).'
        examNeurological:
          type: string
          description: 'Examination: neurological system findings, or explicit "deferred" (core system).'
        examOther:
          type: string
          description: 'Examination: other systems / general inspection findings (optional).'
        investigations:
          type: string
          description: 'Investigations: bedside, laboratory, and imaging results (optional).'
        impression:
          type: string
          description: Working impression / problem list (required component).
        redFlagFindings:
          type: string
          description: Red-flag examination or history findings; drives the red-flag-no-plan flag.
        managementPlan:
          type: string
          description: 'Management plan: treatment, referrals, escalation, disposition (required component).'
        clinicalNote:
          type: string
          description: Optional free-text narrative shown in the summary.
      required:
      - createdAt
      - updatedAt
      - patientId
      - clinicianRole
      - registrationNumber
      - careSetting
      - admissionSource
      - patientIdentifier
      - ageBand
      - sex
      - presentingComplaint
      - historyOfPresentingComplaint
      - pastMedicalSurgicalHistory
      - drugHistory
      - allergyStatus
      - allergyDetail
      - familyHistory
      - socialHistory
      - systemsReview
      - consciousnessLevel
      - examCardiovascular
      - examRespiratory
      - examAbdominal
      - examNeurological
      - examOther
      - investigations
      - impression
      - redFlagFindings
      - managementPlan
      - clinicalNote
      description: 'Main H&P clerking record for one patient encounter: encounter context, patient and
        clinician identification, the full history, vital signs, examination by body system, investigations,
        impression, and management plan as free text. Completeness grade, fired rules, and flags live
        in child tables.'
    HistoryAndPhysicalExaminationGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        historyAndPhysicalExaminationId:
          type: string
          format: uuid
          description: Foreign key to the parent H&P clerking record (unique, 1:1).
        status:
          type: string
          enum:
          - complete
          - partial
          - incomplete
          - ''
          description: 'Completeness status: complete, partial, or incomplete.'
        completenessPercent:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Completeness percentage (0..100): satisfied required components / ten total x
            100.'
        gradedAt:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the grade.
      required:
      - createdAt
      - updatedAt
      - historyAndPhysicalExaminationId
      - status
      - gradedAt
      description: 'Computed documentation-completeness grading result for an H&P clerking record: status
        (complete/partial/incomplete) and completeness percentage over the ten required components.'
    HistoryAndPhysicalExaminationGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        historyAndPhysicalExaminationGradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        flagId:
          type: string
          maxLength: 50
          description: Stable flag identifier (e.g. F-ALLERGIES-NOT-DOCUMENTED-001).
        category:
          type: string
          enum:
          - allergies-not-documented
          - no-impression-or-plan
          - red-flag-no-plan
          - abnormal-vitals
          - incomplete-systems-exam
          - incomplete-history
          - other
          - ''
          description: 'Flag category: allergies-not-documented, no-impression-or-plan, red-flag-no-plan,
            abnormal-vitals, incomplete-systems-exam, incomplete-history, or other.'
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          - ''
          description: 'Priority: low, medium, high.'
        description:
          type: string
          maxLength: 500
          description: Human-readable description of what fired the flag.
        suggestedAction:
          type: string
          maxLength: 500
          description: Suggested clinical or governance action (e.g. "document allergy status", "record
            an impression and management plan").
      required:
      - createdAt
      - updatedAt
      - historyAndPhysicalExaminationGradeId
      - flagId
      - category
      - priority
      - description
      - suggestedAction
      description: Safety flags that fire independently of the completeness status, with priority and
        a suggested action. The allergies-not-documented and no-impression-or-plan categories are blocking
        (they force an incomplete status).
    HistoryAndPhysicalExaminationGradeRule:
      type: object
      properties:
