components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Name.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as full text.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code, such as for validating the postal address.
        role:
          type: string
          enum:
          - ophthalmologist
          - optometrist
          - gp
          - orthoptist
          - nurse
          - other
          - ''
          description: 'Clinician role: ophthalmologist, optometrist, gp, orthoptist, nurse, other.'
        registrationBody:
          type: string
          enum:
          - GMC
          - GOC
          - NMC
          - HCPC
          - other
          - ''
          description: 'Clinician registration body: GMC, GOC, NMC, HCPC, other.'
        registrationNumber:
          type: string
          description: Clinician registration number.
        unitedKingdomNhsNumber:
          type:
          - string
          - 'null'
          maxLength: 12
          description: United Kingdom NHS number, unique per person.
      required:
      - createdAt
      - updatedAt
      - name
      - role
      - registrationBody
      - registrationNumber
      description: Requesting clinician (referrer) who completes the eye vision test request.
    EyeVisionTestRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the patient.
        clinicianId:
          type: string
          format: uuid
          description: Foreign key to the requesting clinician (referrer).
        status:
          type: string
          enum:
          - draft
          - submitted
          - vetted
          - scheduled
          - rejected
          - ''
          description: 'Request lifecycle status: draft, submitted, vetted, scheduled, rejected.'
        siteName:
          type: string
          maxLength: 255
          description: Name of the requesting site or clinic.
        setting:
          type: string
          enum:
          - outpatient
          - inpatient
          - community
          - emergency
          - ''
          description: 'Care setting: outpatient, inpatient, community, emergency.'
        referralDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the referral was made.
        requestedByDate:
          type:
          - string
          - 'null'
          format: date
          description: Date by which the examination is requested to be performed.
        testType:
          type: string
          enum:
          - visual-acuity
          - visual-fields
          - refraction
          - fundus-examination
          - optical-coherence-tomography
          - fluorescein-angiography
          - tonometry
          - slit-lamp
          - orthoptic-assessment
          - other
          - ''
          description: 'Requested ophthalmic test type, used for appropriateness scoring: visual-acuity,
            visual-fields, refraction, fundus-examination, optical-coherence-tomography, fluorescein-angiography,
            tonometry, slit-lamp, orthoptic-assessment, other.'
        laterality:
          type: string
          enum:
          - left
          - right
          - bilateral
          - not-applicable
          - ''
          description: 'Eye(s) to be examined: left, right, bilateral, not-applicable.'
        primaryIndication:
          type: string
          enum:
          - reduced-vision
          - suspected-glaucoma
          - diabetic-retinopathy-screening
          - sudden-visual-loss
          - flashes-floaters
          - red-eye
          - childhood-squint
          - visual-field-defect
          - cataract-assessment
          - headache-visual-symptoms
          - other
          - ''
          description: 'Primary clinical indication, used for appropriateness scoring: reduced-vision,
            suspected-glaucoma, diabetic-retinopathy-screening, sudden-visual-loss, flashes-floaters,
            red-eye, childhood-squint, visual-field-defect, cataract-assessment, headache-visual-symptoms,
            other.'
        clinicalQuestion:
          type: string
          maxLength: 1000
          description: Specific clinical question the examination should answer (highest-value field).
        relevantHistory:
          type: string
          maxLength: 1000
          description: Relevant ocular, medical, and family history.
        symptomReducedVision:
          type: boolean
          description: Whether the patient reports reduced vision.
        symptomSuddenLoss:
          type: boolean
          description: Whether the patient reports sudden visual loss (red flag).
        symptomFlashesFloaters:
          type: boolean
          description: Whether the patient reports flashes and/or floaters (retinal-detachment red flag).
        symptomEyePain:
          type: boolean
          description: Whether the patient reports eye pain (red flag in combination with red eye).
        symptomRedEye:
          type: boolean
          description: Whether the patient reports a red eye.
        diabetes:
          type: boolean
          description: Whether the patient has diabetes (diabetic retinopathy risk).
        knownGlaucoma:
          type: boolean
          description: Whether the patient has known or treated glaucoma.
        urgency:
          type: string
          enum:
          - routine
          - urgent
          - emergency
          - ''
          description: 'Requested triage urgency: routine, urgent, emergency.'
        supervisingConsultant:
          type: string
          maxLength: 255
          description: Name of the supervising / responsible consultant.
        requesterContact:
          type: string
          maxLength: 255
          description: Contact details (bleep / phone) for the requester.
        notes:
          type: string
          maxLength: 1000
          description: Free-text additional notes.
      required:
      - createdAt
      - updatedAt
      - patientId
      - clinicianId
      - status
      - siteName
      - setting
      - testType
      - laterality
      - primaryIndication
      - clinicalQuestion
      - relevantHistory
      - symptomReducedVision
      - symptomSuddenLoss
      - symptomFlashesFloaters
      - symptomEyePain
      - symptomRedEye
      - diabetes
      - knownGlaucoma
      - urgency
      - supervisingConsultant
      - requesterContact
      - notes
      description: Eye vision test request (ophthalmic / optometric examination referral). Captures the
        requested test, laterality, the clinical indication and question, relevant history, symptoms /
        red flags, risk factors, and triage urgency.
    EyeVisionTestRequestGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        eyeVisionTestRequestId:
          type: string
          format: uuid
          description: Foreign key to the parent request (unique, 1:1).
        appropriatenessScore:
          type:
          - integer
          - 'null'
          format: int32
          description: Appropriateness score (1-9) for the RCOphth / NICE indication match.
        appropriatenessBand:
          type: string
          enum:
          - usually-appropriate
          - may-be-appropriate
          - usually-not-appropriate
          - ''
          description: 'Appropriateness band: usually-appropriate (7-9), may-be-appropriate (4-6), usually-not-appropriate
            (1-3).'
        triageTier:
          type: string
          enum:
          - routine
          - urgent
          - emergency
          - ''
          description: 'Assigned triage tier: routine, urgent, emergency.'
        targetTimeframe:
          type: string
          maxLength: 50
          description: Target timeframe for the examination implied by the triage tier (e.g. sudden visual
            loss / retinal-detachment symptoms / GCA -> emergency, same day).
        completenessPercent:
          type:
          - integer
          - 'null'
          format: int32
          description: Request completeness as a percentage of mandatory fields (0-100).
        priorityBand:
          type: string
          enum:
          - low
          - moderate
          - high
          - ''
          description: 'Clinical priority band: low, moderate, high.'
        recommendation:
          type: string
          enum:
          - accept
          - query-referrer
          - redirect
          - reject
          - ''
          description: 'Vetting recommendation: accept, query-referrer, redirect, reject.'
        clinicianNotes:
          type: string
          description: Free-text vetting notes.
        signedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Timestamp of vetting clinician electronic signature.
        gradedAt:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the result.
      required:
      - createdAt
      - updatedAt
      - eyeVisionTestRequestId
      - appropriatenessBand
      - triageTier
      - targetTimeframe
      - priorityBand
      - recommendation
      - clinicianNotes
      - gradedAt
      description: 'Computed four-axis grading result: appropriateness (RCOphth / NICE 1-9), urgency /
        triage priority, request completeness, and clinical priority.'
    EyeVisionTestRequestGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        eyeVisionTestRequestGradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        flagId:
          type: string
          maxLength: 50
          description: Stable flag identifier (e.g. F-SUDDEN-VISUAL-LOSS-001).
        category:
          type: string
          enum:
          - sudden-visual-loss-emergency
          - retinal-detachment-symptoms
          - acute-painful-red-eye
          - suspected-giant-cell-arteritis
          - missing-indication
          - missing-clinical-question
          - other
          - ''
          description: 'Flag category: sudden-visual-loss-emergency, retinal-detachment-symptoms, acute-painful-red-eye,
            suspected-giant-cell-arteritis, missing-indication, missing-clinical-question, other.'
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          - ''
          description: 'Priority: low, medium, high.'
        description:
          type: string
          maxLength: 500
          description: Human-readable description of what fired the flag.
        suggestedAction:
          type: string
          maxLength: 500
          description: Suggested clinical action (e.g. "arrange same-day emergency eye assessment").
      required:
      - createdAt
      - updatedAt
      - eyeVisionTestRequestGradeId
      - flagId
      - category
      - priority
      - description
      - suggestedAction
      description: Safety-critical flags that fire independently of the four axes, with priority and a
        suggested action for the eye-care team.
    EyeVisionTestRequestGradeRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
