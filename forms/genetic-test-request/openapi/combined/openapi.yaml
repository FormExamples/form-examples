components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Name.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as full text.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code, such as for validating the postal address.
        role:
          type: string
          enum:
          - clinical-geneticist
          - genetic-counsellor
          - gp
          - oncologist
          - paediatrician
          - other
          - ''
          description: 'Clinician role: clinical-geneticist, genetic-counsellor, gp, oncologist, paediatrician,
            other.'
        registrationBody:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - GCRB
          - other
          - ''
          description: 'Clinician registration body: GMC, NMC, HCPC, GCRB, other.'
        registrationNumber:
          type: string
          description: Clinician registration number.
        unitedKingdomNhsNumber:
          type:
          - string
          - 'null'
          maxLength: 12
          description: United Kingdom NHS number, unique per person.
      required:
      - createdAt
      - updatedAt
      - name
      - role
      - registrationBody
      - registrationNumber
      description: Requesting clinician (referrer) who completes the genetic test request.
    GeneticTestRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the patient.
        clinicianId:
          type: string
          format: uuid
          description: Foreign key to the requesting clinician (referrer).
        status:
          type: string
          enum:
          - draft
          - submitted
          - vetted
          - accepted
          - rejected
          - ''
          description: 'Request lifecycle status: draft, submitted, vetted, accepted, rejected.'
        siteName:
          type: string
          maxLength: 255
          description: Name of the requesting site or clinic.
        setting:
          type: string
          enum:
          - outpatient
          - inpatient
          - community
          - emergency
          - ''
          description: 'Care setting: outpatient, inpatient, community, emergency.'
        referralDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the referral was made.
        requestedByDate:
          type:
          - string
          - 'null'
          format: date
          description: Date by which the test result is requested.
        testType:
          type: string
          enum:
          - diagnostic-single-gene
          - gene-panel
          - whole-exome
          - whole-genome
          - chromosomal-microarray
          - karyotype
          - predictive-presymptomatic
          - carrier-testing
          - pharmacogenomic
          - prenatal
          - other
          - ''
          description: 'Requested genomic test type: diagnostic-single-gene, gene-panel, whole-exome,
            whole-genome, chromosomal-microarray, karyotype, predictive-presymptomatic, carrier-testing,
            pharmacogenomic, prenatal, other.'
        primaryIndication:
          type: string
          enum:
          - suspected-genetic-disorder
          - familial-cancer
          - developmental-delay
          - congenital-anomaly
          - cardiomyopathy-arrhythmia
          - neuromuscular
          - predictive-family-history
          - carrier-screening
          - prenatal-diagnosis
          - pharmacogenomics
          - other
          - ''
          description: Primary clinical indication, mapped to a National Genomic Test Directory clinical
            indication for appropriateness scoring.
        clinicalQuestion:
          type: string
          maxLength: 1000
          description: Specific clinical question the test should answer (highest-value field).
        clinicalDetails:
          type: string
          maxLength: 2000
          description: Relevant clinical details, phenotype (HPO terms), and examination findings.
        familyHistory:
          type: string
          maxLength: 2000
          description: Relevant family history, pedigree summary, and inheritance pattern.
        suspectedCondition:
          type: string
          maxLength: 255
          description: Suspected condition or gene of interest, if known.
        consentObtained:
          type: boolean
          description: Whether informed consent for genomic testing (Record of Discussion) has been obtained.
        geneticCounsellingOffered:
          type: boolean
          description: Whether pre-test genetic counselling has been offered or provided (mandatory for
            predictive / presymptomatic testing).
        affectedRelativeTested:
          type: boolean
          description: Whether an affected relative has already been tested and a familial variant is
            known.
        specimenType:
          type: string
          enum:
          - blood
          - saliva
          - tissue
          - prenatal
          - ''
          description: 'Specimen type: blood, saliva, tissue, prenatal.'
        urgency:
          type: string
          enum:
          - routine
          - urgent
          - ''
          description: 'Requested triage urgency: routine, urgent.'
        supervisingConsultant:
          type: string
          maxLength: 255
          description: Name of the supervising / responsible consultant.
        requesterContact:
          type: string
          maxLength: 255
          description: Contact details (bleep / phone) for the requester.
        notes:
          type: string
          maxLength: 1000
          description: Free-text additional notes.
      required:
      - createdAt
      - updatedAt
      - patientId
      - clinicianId
      - status
      - siteName
      - setting
      - testType
      - primaryIndication
      - clinicalQuestion
      - clinicalDetails
      - familyHistory
      - suspectedCondition
      - consentObtained
      - geneticCounsellingOffered
      - affectedRelativeTested
      - specimenType
      - urgency
      - supervisingConsultant
      - requesterContact
      - notes
      description: Clinical genetics / genomic test request (referral). Captures the requested test type,
        the clinical indication and question, clinical details, family history, consent and pre-test counselling
        status, specimen type, and triage urgency. Aligned with the NHS National Genomic Test Directory
        eligibility criteria.
    GeneticTestRequestGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        geneticTestRequestId:
          type: string
          format: uuid
          description: Foreign key to the parent request (unique, 1:1).
        appropriatenessScore:
          type:
          - integer
          - 'null'
          format: int32
          description: Appropriateness score (1-9) anchored on NHS National Genomic Test Directory eligibility
            match; there is no single published 1-9 genetic-ordering score, so the scale maps Test Directory
            eligibility to 7-9 (eligible), 4-6 (partial / borderline eligibility), 1-3 (not eligible).
        appropriatenessBand:
          type: string
          enum:
          - usually-appropriate
          - may-be-appropriate
          - usually-not-appropriate
          - ''
          description: 'Appropriateness band: usually-appropriate (7-9), may-be-appropriate (4-6), usually-not-appropriate
            (1-3).'
        consentCounsellingBand:
          type: string
          enum:
          - ok
          - caution
          - not-met
          - ''
          description: 'Consent and pre-test counselling band: ok, caution, not-met. Not-met is mandatory-blocking
            for predictive / presymptomatic testing.'
        completenessPercent:
          type:
          - integer
          - 'null'
          format: int32
          description: Request completeness as a percentage of mandatory fields (0-100).
        triageTier:
          type: string
          enum:
          - routine
          - urgent
          - ''
          description: 'Assigned triage tier: routine, urgent.'
        targetTimeframe:
          type: string
          maxLength: 50
          description: Target timeframe for the test implied by the triage tier (e.g. prenatal -> time-critical).
        recommendation:
          type: string
          enum:
          - accept
          - query-referrer
          - redirect
          - reject
          - ''
          description: 'Vetting recommendation: accept, query-referrer, redirect, reject.'
        clinicianNotes:
          type: string
          description: Free-text vetting notes.
        signedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Timestamp of vetting clinician electronic signature.
        gradedAt:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the result.
      required:
      - createdAt
      - updatedAt
      - geneticTestRequestId
      - appropriatenessBand
      - consentCounsellingBand
      - triageTier
      - targetTimeframe
      - recommendation
      - clinicianNotes
      - gradedAt
      description: 'Computed four-axis grading result: appropriateness (NHS National Genomic Test Directory
        eligibility match, 1-9), consent and pre-test counselling, request completeness, and triage priority.'
    GeneticTestRequestGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        geneticTestRequestGradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        flagId:
          type: string
          maxLength: 50
          description: Stable flag identifier (e.g. F-PREDICTIVE-COUNSELLING-001).
        category:
          type: string
          enum:
          - predictive-test-counselling-required
          - consent-not-obtained
          - prenatal-time-critical
          - missing-family-history
          - missing-indication
          - missing-clinical-details
          - other
          - ''
          description: 'Flag category: predictive-test-counselling-required, consent-not-obtained, prenatal-time-critical,
            missing-family-history, missing-indication, missing-clinical-details, other.'
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          - ''
          description: 'Priority: low, medium, high.'
        description:
          type: string
          maxLength: 500
          description: Human-readable description of what fired the flag.
        suggestedAction:
          type: string
          maxLength: 500
          description: Suggested clinical action (e.g. "arrange pre-test genetic counselling before proceeding").
      required:
      - createdAt
      - updatedAt
      - geneticTestRequestGradeId
      - flagId
      - category
      - priority
      - description
      - suggestedAction
      description: Safety-critical flags that fire independently of the four axes, with priority and a
        suggested action for the genomic laboratory hub / vetting team.
    GeneticTestRequestGradeRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        geneticTestRequestGradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        ruleId:
          type: string
          maxLength: 40
          description: Stable rule identifier (e.g. R-APPROP-FAMILIAL-CANCER-01).
        axis:
          type: string
          enum:
          - appropriateness
          - consent
          - completeness
          - triage
          - ''
          description: 'Scoring axis the rule belongs to: appropriateness, consent, completeness, triage.'
        category:
          type: string
          maxLength: 50
          description: Category or indication the rule relates to.
        description:
          type: string
          maxLength: 500
