components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Name.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as full text.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code, such as for validating the postal address.
        role:
          type: string
          enum:
          - respiratory-physician
          - clinical-physiologist
          - other
          - ''
          description: 'Reporting clinician role: respiratory-physician, clinical-physiologist, other.'
        registrationBody:
          type: string
          enum:
          - GMC
          - HCPC
          - RCCP
          - AHCS
          - other
          - ''
          description: 'Clinician registration body: GMC, HCPC, RCCP (Register of Clinical Physiologists),
            AHCS, other.'
        registrationNumber:
          type: string
          description: Clinician registration number.
        unitedKingdomNhsNumber:
          type:
          - string
          - 'null'
          maxLength: 12
          description: United Kingdom NHS number, unique per person.
      required:
      - createdAt
      - updatedAt
      - name
      - role
      - registrationBody
      - registrationNumber
      description: Reporting clinician (respiratory physician or clinical physiologist) who authors and
        signs the pulmonary function test result report.
    Patient:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          maxLength: 255
          description: Name.
        birthDate:
          type: string
          format: date
          description: Birth date.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as full text.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code, such as for validating the postal address.
        unitedKingdomNhsNumber:
          type:
          - string
          - 'null'
          maxLength: 20
          description: United Kingdom NHS number, unique per person.
        sexAtBirth:
          type: string
          enum:
          - female
          - male
          - other
          - ''
          description: 'Sex at birth: female, male, other. Required for lung-function reference equations
            (GLI) used to derive percent-predicted and z-scores.'
        heightAsCm:
          type:
          - number
          - 'null'
          format: double
          description: Standing height measurement in cm, required for lung-function reference equations.
        weightAsKg:
          type:
          - number
          - 'null'
          format: double
          description: Weight as kg.
        bodyMassIndex:
          type:
          - number
          - 'null'
          format: double
          description: Body mass index (BMI) measurement.
      required:
      - createdAt
      - updatedAt
      - name
      - birthDate
      - sexAtBirth
      description: Patient
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          description: A URI identifying the problem type
        title:
          type: string
          description: A short summary of the problem type
        status:
          type: integer
          description: The HTTP status code
        detail:
          type: string
          description: An explanation of this occurrence
        instance:
          type: string
          description: A URI identifying this occurrence
        code:
          type: string
          description: A short machine-readable reason
        errors:
          type: object
          description: Per-field detail, when validation failed
      required:
      - type
      - title
      - status
    PulmonaryFunctionTestResult:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the patient.
        clinicianId:
          type: string
          format: uuid
          description: Foreign key to the reporting clinician (respiratory physician / clinical physiologist).
        originatingRequestReference:
          type: string
          maxLength: 255
          description: Free-text reference linking this report back to the originating pulmonary function
            test request (referral).
        testType:
          type: string
          enum:
          - spirometry
          - spirometry-with-reversibility
          - full-lung-function
          - gas-transfer-dlco
          - peak-flow
          - feno
          - other
          - ''
          description: 'Performed test type: spirometry, spirometry-with-reversibility, full-lung-function,
            gas-transfer-dlco, peak-flow, feno, other.'
        performedDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the lung-function test was performed.
        reportedDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the report was authored / signed.
        reportStatus:
          type: string
          enum:
          - preliminary
          - final
          - amended
          - cancelled
          - ''
          description: 'Report lifecycle status: preliminary, final, amended, cancelled.'
        testQuality:
          type: string
          enum:
          - acceptable
          - sub-optimal
          - unacceptable
          - ''
          description: 'ATS/ERS acceptability and repeatability grade for the manoeuvres: acceptable,
            sub-optimal, unacceptable.'
        clinicalHistory:
          type: string
          maxLength: 1000
          description: Clinical history and the question the test was performed to answer.
        fev1Litres:
          type:
          - number
          - 'null'
          format: double
          description: Forced expiratory volume in one second (FEV1) in litres (post-bronchodilator where
            reversibility tested).
        fev1PercentPredicted:
          type:
          - number
          - 'null'
          format: double
          description: FEV1 as a percentage of the predicted (reference) value.
        fvcLitres:
          type:
          - number
          - 'null'
          format: double
          description: Forced vital capacity (FVC) in litres.
        fvcPercentPredicted:
          type:
          - number
          - 'null'
          format: double
          description: FVC as a percentage of the predicted (reference) value.
        fev1FvcRatio:
          type:
          - number
          - 'null'
          format: double
          description: FEV1/FVC ratio (0-1). Post-bronchodilator ratio < 0.70 confirms airflow obstruction
            (NICE NG115 / GOLD).
        peakExpiratoryFlow:
          type:
          - number
          - 'null'
          format: double
          description: Peak expiratory flow (PEF) in litres per minute.
        dlcoPercentPredicted:
          type:
          - number
          - 'null'
          format: double
          description: Diffusing capacity of the lung for carbon monoxide (DLCO / transfer factor) as
            a percentage of predicted.
        ventilatoryPattern:
          type: string
          enum:
          - normal
          - obstructive
          - restrictive
          - mixed
          - ''
          description: 'Overall ventilatory pattern: normal, obstructive, restrictive, mixed.'
        severity:
          type: string
          enum:
          - none
          - mild
          - moderate
          - severe
          - very-severe
          - ''
          description: 'Severity of the lung-function impairment: none, mild, moderate, severe, very-severe
            (ATS/ERS z-score or GOLD percent-predicted banding).'
        bronchodilatorReversibility:
          type: string
          enum:
          - positive
          - negative
          - not-tested
          - ''
          description: 'Bronchodilator reversibility result: positive, negative, not-tested.'
        airflowObstruction:
          type: boolean
          description: Whether airflow obstruction (reduced FEV1/FVC) is present.
        restriction:
          type: boolean
          description: Whether a restrictive pattern (reduced FVC / TLC with preserved ratio) is present.
        reducedGasTransfer:
          type: boolean
          description: Whether reduced gas transfer (low DLCO / transfer factor) is present.
        significantReversibility:
          type: boolean
          description: Whether significant bronchodilator reversibility was demonstrated.
        normalSpirometry:
          type: boolean
          description: Whether the spirometry is within normal limits.
        findingsNarrative:
          type: string
          maxLength: 2000
          description: Narrative description of the lung-function findings (the body of the report).
        comparisonWithPrevious:
          type: string
          maxLength: 1000
          description: Comparison with relevant previous lung-function studies (e.g. decline in FEV1).
        impression:
          type: string
          maxLength: 2000
          description: Summary impression / conclusion answering the clinical question.
        reportingCategory:
          type: string
          maxLength: 50
          description: Free-text structured-reporting category label (e.g. a GOLD 1-4 or ATS/ERS severity
            band).
        recommendedFollowUp:
          type: string
          maxLength: 1000
          description: Recommended follow-up testing, referral, or management.
        criticalResultCommunicated:
          type: boolean
          description: Whether a critical or unexpected significant result was communicated directly to
            the referrer.
        reportedTo:
          type: string
          maxLength: 500
          description: Who the critical / urgent result was communicated to, with date and time if applicable.
      required:
      - createdAt
      - updatedAt
      - patientId
      - clinicianId
      - originatingRequestReference
      - testType
      - reportStatus
      - testQuality
      - clinicalHistory
      - ventilatoryPattern
      - severity
      - bronchodilatorReversibility
      - airflowObstruction
      - restriction
      - reducedGasTransfer
      - significantReversibility
      - normalSpirometry
      - findingsNarrative
      - comparisonWithPrevious
      - impression
      - reportingCategory
      - recommendedFollowUp
      - criticalResultCommunicated
      - reportedTo
      description: Pulmonary function test (lung-function / spirometry) result (report). Captures the
        performed test type and quality, clinical history, the measured spirometry / gas-transfer values,
        the structured ventilatory interpretation (pattern, severity, bronchodilator reversibility), the
        narrative and structured findings, the impression, recommended follow-up, and critical-result
        communication. This is the source-of-truth record that the four-axis interpretation grade is computed
        from.
    PulmonaryFunctionTestResultGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        pulmonaryFunctionTestResultId:
          type: string
          format: uuid
