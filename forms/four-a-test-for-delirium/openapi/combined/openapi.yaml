components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Clinician full name.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as a single text block.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code.
        role:
          type: string
          enum:
          - doctor
          - nurse
          - healthcare-assistant
          - allied-health-professional
          - other
          - ''
          description: 'Primary clinical role: doctor, nurse, healthcare-assistant, allied-health-professional,
            or other.'
        registrationBody:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - GPhC
          - other
          - ''
          description: 'Professional registration body: GMC, NMC, HCPC, GPhC, or other.'
        registrationNumber:
          type: string
          description: Professional registration number issued by the registration body.
      required:
      - createdAt
      - updatedAt
      - name
      - role
      - registrationBody
      - registrationNumber
      description: Clinician identifying information for the practitioner who completed the 4AT screen.
    FourATestForDelirium:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the patient being assessed (delete restricted).
        clinicianId:
          type:
          - string
          - 'null'
          format: uuid
          description: Foreign key to the assessing clinician (optional; delete restricted).
        patientIdentifier:
          type: string
          maxLength: 100
          description: Local patient identifier as recorded on the assessment.
        patientName:
          type: string
          maxLength: 255
          description: Patient name as recorded on the assessment.
        dateOfBirth:
          type:
          - string
          - 'null'
          format: date
          description: Patient date of birth as recorded on the assessment.
        assessmentDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the 4AT assessment was performed.
        assessmentTime:
          type:
          - string
          - 'null'
          format: time
          description: Time of day the 4AT assessment was performed.
        setting:
          type: string
          enum:
          - acute
          - ed
          - periop
          - careHome
          - community
          - other
          - ''
          description: 'Care setting: acute, ed (emergency department), periop, careHome, community, or
            other.'
        assessorName:
          type: string
          maxLength: 255
          description: Name of the practitioner who completed the assessment.
        assessorRole:
          type: string
          maxLength: 100
          description: Free-text role of the practitioner who completed the assessment.
        alertness:
          type: string
          enum:
          - normal
          - mildTransient
          - abnormal
          - ''
          description: 'Item 1 — observed alertness: normal, mildTransient (brief sleepiness then normal),
            or abnormal (markedly drowsy or agitated).'
        amt4:
          type: string
          enum:
          - noMistakes
          - oneMistake
          - twoOrMoreOrUntestable
          - ''
          description: 'Item 2 — AMT4 mistake band across age, date of birth, place, and current year:
            noMistakes, oneMistake, or twoOrMoreOrUntestable.'
        attentionMonths:
          type: string
          enum:
          - sevenOrMore
          - startsButUnderSevenOrRefuses
          - untestable
          - ''
          description: 'Item 3 — attention via reciting the months backwards: sevenOrMore correct, startsButUnderSevenOrRefuses,
            or untestable.'
        acuteChange:
          type: string
          enum:
          - 'no'
          - 'yes'
          - ''
          description: 'Item 4 — presence of acute change or fluctuating course over the last 2 weeks
            still evident in the last 24 hours: no or yes.'
        acuteChangeSource:
          type: string
          enum:
          - patient
          - collateral
          - records
          - none
          - ''
          description: 'Source of the item 4 acute-change information: patient, collateral, records, or
            none.'
        clinicalNotes:
          type: string
          description: Free-text clinical note recorded with the assessment.
      required:
      - createdAt
      - updatedAt
      - patientId
      - patientIdentifier
      - patientName
      - setting
      - assessorName
      - assessorRole
      - alertness
      - amt4
      - attentionMonths
      - acuteChange
      - acuteChangeSource
      - clinicalNotes
      description: 'Main 4AT assessment record: patient and assessment identification, context, and the
        four scored item inputs (alertness, AMT4, attention via months-backwards, and acute change or
        fluctuating course).'
    FourATestForDeliriumGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        fourATestForDeliriumId:
          type: string
          format: uuid
          description: Foreign key to the parent assessment (unique, 1:1).
        item1Score:
          type:
          - integer
          - 'null'
          format: int32
          description: Sub-score for item 1, alertness (0 or 4).
        item2Score:
          type:
          - integer
          - 'null'
          format: int32
          description: Sub-score for item 2, AMT4 (0, 1, or 2).
        item3Score:
          type:
          - integer
          - 'null'
          format: int32
          description: Sub-score for item 3, attention via months backwards (0, 1, or 2).
        item4Score:
          type:
          - integer
          - 'null'
          format: int32
          description: Sub-score for item 4, acute change or fluctuating course (0 or 4).
        totalScore:
          type:
          - integer
          - 'null'
          format: int32
          description: Summed 4AT score across the four items (0-12 when complete).
        interpretation:
          type: string
          enum:
          - delirium-unlikely
          - possible-cognitive-impairment
          - possible-delirium
          - ''
          description: 'Derived interpretation band: delirium-unlikely (0), possible-cognitive-impairment
            (1-3), or possible-delirium (>= 4).'
        gradedAt:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the grade.
      required:
      - createdAt
      - updatedAt
      - fourATestForDeliriumId
      - interpretation
      - gradedAt
      description: 'Computed 4AT grading result: per-item sub-scores, summed total (0-12), and derived
        interpretation band.'
    FourATestForDeliriumGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        fourATestForDeliriumGradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        flagId:
          type: string
          maxLength: 50
          description: Stable flag identifier (e.g. F-POSSIBLE-DELIRIUM-001).
        category:
          type: string
          enum:
          - possible-delirium
          - abnormal-alertness
          - acute-change-present
          - possible-cognitive-impairment
          - incomplete-acute-change
          - other
          - ''
          description: Flag category (see CHECK constraint for enumeration).
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          - ''
          description: 'Priority: low, medium, high.'
        description:
          type: string
          maxLength: 500
          description: Human-readable description of what fired the flag.
        suggestedAction:
          type: string
          maxLength: 500
          description: Suggested clinical action (e.g. "arrange full delirium work-up and precipitant
            search").
      required:
      - createdAt
      - updatedAt
      - fourATestForDeliriumGradeId
      - flagId
      - category
      - priority
      - description
      - suggestedAction
      description: Red-flag issues that fire independently of the total score, with priority and a suggested
        action for the clinical team.
    FourATestForDeliriumGradeRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        fourATestForDeliriumGradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        ruleId:
          type: string
          maxLength: 40
          description: Stable rule identifier (e.g. R-ALERTNESS-4POINT-01).
        item:
          type: string
          enum:
          - alertness
          - amt4
          - attention
          - acute-change
          - band
          description: 'Scored item the rule belongs to: alertness, amt4, attention, acute-change, or
            band.'
        points:
          type:
          - integer
          - 'null'
          format: int32
          description: Points contributed by this rule for its item.
        category:
          type: string
          maxLength: 50
          description: Subject category (e.g. item-score, band-assignment).
        description:
          type: string
          maxLength: 500
          description: Human-readable description of why the rule fired.
      required:
      - createdAt
      - updatedAt
      - fourATestForDeliriumGradeId
      - ruleId
      - item
      - category
      - description
      description: 'Audit trail of every grading rule that fired during 4AT computation: item, points
        contributed, category, and description.'
    Patient:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          maxLength: 255
          description: Full patient name.
        birthDate:
          type: string
          format: date
          description: Date of birth.
        sex:
          type: string
          enum:
          - female
          - male
          - intersex
          - unknown
          - ''
          description: 'Sex recorded for clinical purposes: female, male, intersex, or unknown.'
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as a single text block.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code.
        unitedKingdomNhsNumber:
          type:
          - string
          - 'null'
          maxLength: 20
          description: United Kingdom NHS number, unique per person.
        hospitalMrn:
          type:
          - string
          - 'null'
          maxLength: 50
          description: Local hospital medical record number (MRN).
        heightAsCm:
          type:
          - number
          - 'null'
          format: double
          description: Height in centimetres.
        weightAsKg:
          type:
          - number
          - 'null'
          format: double
          description: Weight in kilograms.
        bodyMassIndex:
          type:
          - number
          - 'null'
          format: double
          description: Body mass index (BMI), kg/m^2.
        allergiesSummary:
          type: string
          description: Free-text summary of known allergies.
      required:
      - createdAt
      - updatedAt
      - name
      - birthDate
      - sex
      - allergiesSummary
      description: Patient demographic information used by the 4AT delirium screen record.
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          description: A URI identifying the problem type
        title:
          type: string
          description: A short summary of the problem type
        status:
          type: integer
          description: The HTTP status code
        detail:
          type: string
          description: An explanation of this occurrence
        instance:
          type: string
          description: A URI identifying this occurrence
        code:
          type: string
          description: A short machine-readable reason
        errors:
          type: object
          description: Per-field detail, when validation failed
      required:
      - type
      - title
      - status
