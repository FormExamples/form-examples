          type: string
          description: Postal address as a single text block.
        country_as_iso_3166_1_alpha_2:
          type: string
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2.
        postcode:
          type: string
          description: Postal code.
        role:
          type: string
          enum:
          - doctor
          - nurse
          - healthcare-assistant
          - allied-health-professional
          - other
          - ''
          description: 'Primary clinical role: doctor, nurse, healthcare-assistant, allied-health-professional,
            or other.'
        registration_body:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - GPhC
          - other
          - ''
          description: 'Professional registration body: GMC, NMC, HCPC, GPhC, or other.'
        registration_number:
          type: string
          description: Professional registration number issued by the registration body.
      required:
      - created_at
      - updated_at
      - name
      - role
      - registration_body
      - registration_number
      description: Clinician identifying information for the practitioner who completed the 4AT screen.
    FourATestForDelirium:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        patient_id:
          type: string
          format: uuid
          description: Foreign key to the patient being assessed (delete restricted).
        clinician_id:
          type: string
          format: uuid
          description: Foreign key to the assessing clinician (optional; delete restricted).
        patient_identifier:
          type: string
          maxLength: 100
          description: Local patient identifier as recorded on the assessment.
        patient_name:
          type: string
          maxLength: 255
          description: Patient name as recorded on the assessment.
        date_of_birth:
          type: string
          format: date
          description: Patient date of birth as recorded on the assessment.
        assessment_date:
          type: string
          format: date
          description: Date the 4AT assessment was performed.
        assessment_time:
          type: string
          format: time
          description: Time of day the 4AT assessment was performed.
        setting:
          type: string
          enum:
          - acute
          - ed
          - periop
          - careHome
          - community
          - other
          - ''
          description: 'Care setting: acute, ed (emergency department), periop, careHome, community, or
            other.'
        assessor_name:
          type: string
          maxLength: 255
          description: Name of the practitioner who completed the assessment.
        assessor_role:
          type: string
          maxLength: 100
          description: Free-text role of the practitioner who completed the assessment.
        alertness:
          type: string
          enum:
          - normal
          - mildTransient
          - abnormal
          - ''
          description: 'Item 1 — observed alertness: normal, mildTransient (brief sleepiness then normal),
            or abnormal (markedly drowsy or agitated).'
        amt4:
          type: string
          enum:
          - noMistakes
          - oneMistake
          - twoOrMoreOrUntestable
          - ''
          description: 'Item 2 — AMT4 mistake band across age, date of birth, place, and current year:
            noMistakes, oneMistake, or twoOrMoreOrUntestable.'
        attention_months:
          type: string
          enum:
          - sevenOrMore
          - startsButUnderSevenOrRefuses
          - untestable
          - ''
          description: 'Item 3 — attention via reciting the months backwards: sevenOrMore correct, startsButUnderSevenOrRefuses,
            or untestable.'
        acute_change:
          type: string
          enum:
          - 'no'
          - 'yes'
          - ''
          description: 'Item 4 — presence of acute change or fluctuating course over the last 2 weeks
            still evident in the last 24 hours: no or yes.'
        acute_change_source:
          type: string
          enum:
          - patient
          - collateral
          - records
          - none
          - ''
          description: 'Source of the item 4 acute-change information: patient, collateral, records, or
            none.'
        clinical_notes:
          type: string
          description: Free-text clinical note recorded with the assessment.
      required:
      - created_at
      - updated_at
      - patient_id
      - patient_identifier
      - patient_name
      - setting
      - assessor_name
      - assessor_role
      - alertness
      - amt4
      - attention_months
      - acute_change
      - acute_change_source
      - clinical_notes
      description: 'Main 4AT assessment record: patient and assessment identification, context, and the
        four scored item inputs (alertness, AMT4, attention via months-backwards, and acute change or
        fluctuating course).'
    FourATestForDeliriumGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the row was soft-deleted.
        four_a_test_for_delirium_id:
          type: string
          format: uuid
          description: Foreign key to the parent assessment (unique, 1:1).
        item1_score:
          type: integer
          format: int32
          description: Sub-score for item 1, alertness (0 or 4).
        item2_score:
          type: integer
          format: int32
          description: Sub-score for item 2, AMT4 (0, 1, or 2).
        item3_score:
          type: integer
          format: int32
          description: Sub-score for item 3, attention via months backwards (0, 1, or 2).
        item4_score:
          type: integer
          format: int32
          description: Sub-score for item 4, acute change or fluctuating course (0 or 4).
        total_score:
          type: integer
          format: int32
          description: Summed 4AT score across the four items (0-12 when complete).
        interpretation:
          type: string
          enum:
          - delirium-unlikely
          - possible-cognitive-impairment
          - possible-delirium
          - ''
          description: 'Derived interpretation band: delirium-unlikely (0), possible-cognitive-impairment
            (1-3), or possible-delirium (>= 4).'
        graded_at:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the grade.
      required:
      - created_at
      - updated_at
      - four_a_test_for_delirium_id
      - interpretation
      - graded_at
      description: 'Computed 4AT grading result: per-item sub-scores, summed total (0-12), and derived
        interpretation band.'
    FourATestForDeliriumGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the row was soft-deleted.
        four_a_test_for_delirium_grade_id:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        flag_id:
          type: string
          maxLength: 50
          description: Stable flag identifier (e.g. F-POSSIBLE-DELIRIUM-001).
        category:
          type: string
          enum:
          - possible-delirium
          - abnormal-alertness
          - acute-change-present
          - possible-cognitive-impairment
          - incomplete-acute-change
          - other
          - ''
          description: Flag category (see CHECK constraint for enumeration).
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          - ''
          description: 'Priority: low, medium, high.'
        description:
          type: string
          maxLength: 500
          description: Human-readable description of what fired the flag.
        suggested_action:
          type: string
          maxLength: 500
          description: Suggested clinical action (e.g. "arrange full delirium work-up and precipitant
            search").
      required:
      - created_at
      - updated_at
      - four_a_test_for_delirium_grade_id
      - flag_id
      - category
      - priority
      - description
      - suggested_action
      description: Red-flag issues that fire independently of the total score, with priority and a suggested
        action for the clinical team.
    FourATestForDeliriumGradeRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the row was soft-deleted.
        four_a_test_for_delirium_grade_id:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        rule_id:
          type: string
          maxLength: 40
          description: Stable rule identifier (e.g. R-ALERTNESS-4POINT-01).
        item:
          type: string
          enum:
          - alertness
          - amt4
          - attention
          - acute-change
          - band
          description: 'Scored item the rule belongs to: alertness, amt4, attention, acute-change, or
            band.'
        points:
          type: integer
          format: int32
          description: Points contributed by this rule for its item.
        category:
          type: string
