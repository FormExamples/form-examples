components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        name:
          type: string
          description: Name.
        email:
          type: string
          description: Email address.
        phone:
          type: string
          description: Phone number.
        postal_address_as_full_text:
          type: string
          description: Postal address as full text.
        country_as_iso_3166_1_alpha_2:
          type: string
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type: string
          description: Postal code, such as for validating the postal address.
        role:
          type: string
          enum:
          - audiologist
          - ent-surgeon
          - hearing-therapist
          - other
          - ''
          description: 'Reporting clinician role: audiologist, ent-surgeon, hearing-therapist, other.'
        registration_body:
          type: string
          enum:
          - GMC
          - HCPC
          - RCCP
          - AHCS
          - other
          - ''
          description: 'Clinician registration body: GMC, HCPC, RCCP, AHCS, other.'
        registration_number:
          type: string
          description: Clinician registration number.
        united_kingdom_nhs_number:
          type: string
          maxLength: 12
          description: United Kingdom NHS number, unique per person.
      required:
      - created_at
      - updated_at
      - name
      - role
      - registration_body
      - registration_number
      description: Reporting clinician (audiologist, ENT surgeon, or hearing therapist) who authors and
        signs the hearing test result report.
    HearingTestResult:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        patient_id:
          type: string
          format: uuid
          description: Foreign key to the patient.
        clinician_id:
          type: string
          format: uuid
          description: Foreign key to the reporting clinician (audiologist / ENT surgeon / hearing therapist).
        originating_request_reference:
          type: string
          maxLength: 255
          description: Free-text reference linking this report back to the originating hearing test request
            (referral).
        report_status:
          type: string
          enum:
          - preliminary
          - final
          - amended
          - cancelled
          - ''
          description: 'Report lifecycle status: preliminary, final, amended, cancelled.'
        performed_date:
          type: string
          format: date
          description: Date the hearing test was performed.
        reported_date:
          type: string
          format: date
          description: Date the report was authored / signed.
        test_type:
          type: string
          enum:
          - pure-tone-audiometry
          - tympanometry
          - speech-audiometry
          - otoacoustic-emissions
          - auditory-brainstem-response
          - newborn-hearing-screen
          - other
          - ''
          description: 'Performed audiology test type: pure-tone-audiometry, tympanometry, speech-audiometry,
            otoacoustic-emissions, auditory-brainstem-response, newborn-hearing-screen, other.'
        test_reliability:
          type: string
          enum:
          - good
          - fair
          - poor
          - ''
          description: 'Reliability / validity of the test result: good, fair, poor (e.g. patient cooperation,
            masking, test conditions).'
        clinical_history:
          type: string
          maxLength: 1000
          description: Clinical history and the question the test was performed to answer.
        pure_tone_average_right_db:
          type: number
          format: double
          description: 'Right-ear pure-tone average (PTA) in dB HL (BSA: mean of thresholds across the
            standard frequencies; no-response frequencies counted at 130 dB HL).'
        pure_tone_average_left_db:
          type: number
          format: double
          description: 'Left-ear pure-tone average (PTA) in dB HL (BSA: mean of thresholds across the
            standard frequencies; no-response frequencies counted at 130 dB HL).'
        hearing_loss_type_right:
          type: string
          enum:
          - none
          - conductive
          - sensorineural
          - mixed
          - ''
          description: 'Right-ear hearing-loss type: none, conductive, sensorineural, mixed.'
        hearing_loss_type_left:
          type: string
          enum:
          - none
          - conductive
          - sensorineural
          - mixed
          - ''
          description: 'Left-ear hearing-loss type: none, conductive, sensorineural, mixed.'
        hearing_loss_severity_right:
          type: string
          enum:
          - normal
          - mild
          - moderate
          - moderately-severe
          - severe
          - profound
          - ''
          description: 'Right-ear hearing-loss severity (BSA descriptors): normal, mild, moderate, moderately-severe,
            severe, profound.'
        hearing_loss_severity_left:
          type: string
          enum:
          - normal
          - mild
          - moderate
          - moderately-severe
          - severe
          - profound
          - ''
          description: 'Left-ear hearing-loss severity (BSA descriptors): normal, mild, moderate, moderately-severe,
            severe, profound.'
        tympanometry_type_right:
          type: string
          enum:
          - A
          - As
          - Ad
          - B
          - C
          - ''
          description: 'Right-ear tympanogram type (Jerger): A, As, Ad, B, C.'
        tympanometry_type_left:
          type: string
          enum:
          - A
          - As
          - Ad
          - B
          - C
          - ''
          description: 'Left-ear tympanogram type (Jerger): A, As, Ad, B, C.'
        hearing_loss_present:
          type: boolean
          description: Whether any hearing loss is present on this test.
        asymmetric_loss:
          type: boolean
          description: Whether there is a marked asymmetry between ears (red flag for retrocochlear pathology).
        sudden_sensorineural_loss:
          type: boolean
          description: Whether the result is consistent with sudden sensorineural hearing loss (otological
            emergency).
        conductive_component:
          type: boolean
          description: Whether a conductive component is present (e.g. air-bone gap, abnormal tympanometry).
        normal_hearing:
          type: boolean
          description: Whether the test demonstrates normal hearing bilaterally.
        findings_narrative:
          type: string
          maxLength: 2000
          description: Narrative description of the audiometric findings (the body of the report).
        impression:
          type: string
          maxLength: 2000
          description: Summary impression / conclusion answering the clinical question.
        reporting_category:
          type: string
          maxLength: 50
          description: Free-text structured-reporting category label (e.g. a configuration or audiometric
            descriptor).
        recommended_follow_up:
          type: string
          maxLength: 1000
          description: Recommended follow-up testing, referral, or management (e.g. hearing-aid fitting,
            ENT referral, MRI IAM).
        critical_result_communicated:
          type: boolean
          description: Whether a critical or unexpected significant result was communicated directly to
            the referrer.
        reported_to:
          type: string
          maxLength: 500
          description: Who the critical / urgent result was communicated to, with date and time if applicable.
      required:
      - created_at
      - updated_at
      - patient_id
      - clinician_id
      - originating_request_reference
      - report_status
      - test_type
      - test_reliability
      - clinical_history
      - hearing_loss_type_right
      - hearing_loss_type_left
      - hearing_loss_severity_right
      - hearing_loss_severity_left
      - tympanometry_type_right
      - tympanometry_type_left
      - hearing_loss_present
      - asymmetric_loss
      - sudden_sensorineural_loss
      - conductive_component
      - normal_hearing
      - findings_narrative
      - impression
      - reporting_category
      - recommended_follow_up
      - critical_result_communicated
      - reported_to
      description: Audiology / hearing test result (report). Captures the performed test, test reliability,
        clinical history, the pure-tone averages and per-ear interpretation (loss type and severity),
        tympanometry types, the narrative and structured findings, the impression, recommended follow-up,
        and critical-result communication. This is the source-of-truth record that the four-axis interpretation
        grade is computed from.
    HearingTestResultGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        hearing_test_result_id:
          type: string
          format: uuid
          description: Foreign key to the parent result (unique, 1:1).
        result_classification:
          type: string
          enum:
          - normal
          - abnormal
          - critical
          - inconclusive
          - ''
          description: 'Axis A overall classification: normal, abnormal, critical, inconclusive.'
        abnormality_severity:
          type: string
          enum:
          - none
          - minor
          - moderate
          - major
          - ''
          description: 'Axis B abnormality severity: none, minor, moderate, major.'
        reporting_category:
          type: string
          maxLength: 50
          description: Axis B structured-reporting score / category label (e.g. a BSA audiometric descriptor
            or configuration).
        report_completeness_percent:
          type: integer
          format: int32
          description: Axis C report completeness as a percentage of mandatory report sections (0-100).
        follow_up_urgency:
          type: string
          enum:
          - routine
          - recommended
          - urgent
          - critical-alert
          - ''
          description: 'Axis D follow-up urgency: routine, recommended, urgent, critical-alert.'
        target_timeframe:
          type: string
          maxLength: 50
          description: Target timeframe for the recommended follow-up implied by the urgency.
        recommended_action:
          type: string
          maxLength: 500
          description: Axis D concise recommended action derived from the urgency.
        recommendation:
          type: string
          enum:
          - no-action
          - routine-follow-up
          - further-imaging
          - specialist-referral
          - urgent-review
          - ''
          description: 'Overall recommendation: no-action, routine-follow-up, further-imaging, specialist-referral,
            urgent-review.'
        clinician_notes:
          type: string
          description: Free-text interpretation / sign-off notes.
        signed_at:
          type: string
          format: date-time
          description: Timestamp of the reporting clinician electronic signature.
        graded_at:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the result.
      required:
      - created_at
      - updated_at
      - hearing_test_result_id
      - result_classification
      - abnormality_severity
      - reporting_category
      - follow_up_urgency
      - target_timeframe
      - recommended_action
      - recommendation
      - clinician_notes
      - graded_at
      description: 'Computed four-axis interpretation grade: result classification, abnormality severity
        / structured-reporting category, report completeness, and follow-up urgency. A critical result
        (sudden sensorineural loss or marked asymmetry suggesting retrocochlear pathology) auto-escalates
        the follow-up urgency to critical-alert regardless of the other axes.'
    HearingTestResultGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
