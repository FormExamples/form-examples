      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the applicant patient.
        practitionerId:
          type: string
          format: uuid
          description: Foreign key to the signing practitioner.
        status:
          type: string
          enum:
          - draft
          - ready-to-post
          - posted
          - issued
          - rejected
          - expired
          - cancelled
          description: 'Lifecycle status: draft, ready-to-post, posted, issued, rejected, expired, cancelled.'
        applicationKind:
          type: string
          enum:
          - new
          - renewal
          - replacement
          - ''
          description: New application, renewal of an expiring certificate, or replacement of a lost certificate.
        previousCertificateNumber:
          type: string
          maxLength: 50
          description: Certificate number of the previous certificate (renewal / replacement).
        previousCertificateExpiryDate:
          type:
          - string
          - 'null'
          format: date
          description: Expiry date of the previous certificate, used for renewal-window checks.
        completedDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the practitioner completed and signed the FP92A.
        postedDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the FP92A was posted to NHSBSA Bridge House.
        receivedByNhsbsaDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the FP92A was acknowledged received by NHSBSA.
        certificateNumber:
          type: string
          maxLength: 50
          description: Issued certificate number (populated once NHSBSA returns the issued certificate).
        validFrom:
          type:
          - string
          - 'null'
          format: date
          description: Date the issued certificate becomes valid.
        validUntil:
          type:
          - string
          - 'null'
          format: date
          description: Date the issued certificate expires (typically valid_from + 5 years).
        practitionerSignaturePresent:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the practitioner has signed in ink before posting.
        practitionerDeclarationText:
          type: string
          description: Free-text declaration as captured from the FP92A signature panel.
        notes:
          type: string
          description: Internal notes about the application.
      required:
      - createdAt
      - updatedAt
      - patientId
      - practitionerId
      - status
      - applicationKind
      - previousCertificateNumber
      - certificateNumber
      - practitionerSignaturePresent
      - practitionerDeclarationText
      - notes
      description: FP92A medical exemption application instance.
    ApplicationEligibleCondition:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        applicationId:
          type: string
          format: uuid
          description: Foreign key to the parent application.
        eligibleConditionId:
          type: string
          format: uuid
          description: Foreign key to the eligible condition (one of the ten NHSBSA-recognised conditions).
        diagnosisDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the qualifying condition was diagnosed.
        snomedCtCode:
          type: string
          maxLength: 50
          description: Optional SNOMED CT code for the patient-specific diagnosis.
        icd10Code:
          type: string
          maxLength: 20
          description: Optional ICD-10 code for the patient-specific diagnosis.
        treatmentDetail:
          type: string
          description: Free-text description of the current treatment regimen.
        fistulaSite:
          type: string
          enum:
          - caecostomy
          - colostomy
          - laryngostomy
          - ileostomy
          - urostomy
          - gastrostomy
          - other
          - ''
          description: Anatomical site of the fistula (for the fistula condition).
        applianceType:
          type: string
          enum:
          - one-piece-bag
          - two-piece-bag
          - continuous-dressing
          - irrigation-kit
          - other
          - ''
          description: Appliance worn for the fistula (bag, dressing, irrigation kit).
        substitutionTherapy:
          type: string
          maxLength: 255
          description: Substitution therapy drug and dose (e.g. hydrocortisone 20mg AM / 10mg PM).
        onSubstitutionTherapy:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the patient is on the substitution therapy required for eligibility.
        diabetesTreatmentMode:
          type: string
          enum:
          - insulin
          - oral-hypoglycaemic
          - insulin-and-oral
          - glp1-agonist
          - diet-only
          - ''
          description: How diabetes is being treated; diet-only excludes the patient from FP92A.
        anticonvulsant:
          type: string
          description: Anticonvulsant drug and dose (for epilepsy).
        continuousAnticonvulsantTherapy:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the patient receives continuous anticonvulsant therapy.
        cannotLeaveHomeUnaided:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the patient is unable to leave home without the help of another person.
        disabilityCarerDetail:
          type: string
          description: Description of the help / carer the patient depends on.
        disabilityExpectedToBePermanent:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Practitioner judgement that the disability is permanent, not temporary.
        cancerSite:
          type: string
          maxLength: 255
          description: Anatomical site or type of cancer.
        cancerTreatmentPhase:
          type: string
          enum:
          - active-treatment
          - effects-of-cancer
          - effects-of-treatment
          - remission-with-ongoing-treatment
          - palliative
          - ''
          description: Phase of cancer care - active treatment, effects of cancer, effects of treatment,
            etc.
        histologyConfirmed:
          type: string
          enum:
          - 'yes'
          - 'no'
          - pending
          - ''
          description: Whether a histological diagnosis has been confirmed for the cancer.
        practitionerAttestationNotes:
          type: string
          description: Free-text notes from the practitioner supporting the attestation.
      required:
      - createdAt
      - updatedAt
      - applicationId
      - eligibleConditionId
      - snomedCtCode
      - icd10Code
      - treatmentDetail
      - fistulaSite
      - applianceType
      - substitutionTherapy
      - onSubstitutionTherapy
      - diabetesTreatmentMode
      - anticonvulsant
      - continuousAnticonvulsantTherapy
      - cannotLeaveHomeUnaided
      - disabilityCarerDetail
      - disabilityExpectedToBePermanent
      - cancerSite
      - cancerTreatmentPhase
      - histologyConfirmed
      - practitionerAttestationNotes
      description: Per-application qualifying conditions with condition-specific detail.
    EligibleCondition:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        code:
          type: string
          enum:
          - permanent-fistula
          - hypoadrenalism
          - diabetes-insipidus-or-hypopituitarism
          - diabetes-mellitus-not-diet-only
          - hypoparathyroidism
          - myasthenia-gravis
          - myxoedema
          - epilepsy-on-anticonvulsant
          - continuing-physical-disability
          - cancer-or-effects
          description: Machine-readable condition code from the closed NHSBSA list.
        label:
          type: string
          maxLength: 255
          description: Human-readable label matching the FP92A wording.
        description:
          type: string
          description: Long-form description with NHSBSA inclusion / exclusion criteria.
        requiresApplianceDetail:
          type: string
          enum:
          - 'yes'
          - 'no'
          description: Whether the application must capture appliance / dressing detail (fistula).
        requiresSubstitutionTherapyDetail:
          type: string
          enum:
          - 'yes'
          - 'no'
          description: Whether the application must capture substitution-therapy detail (hypoadrenalism,
            hypopituitarism, hypoparathyroidism, myxoedema).
        requiresDisabilityAttestation:
          type: string
          enum:
          - 'yes'
          - 'no'
          description: Whether the practitioner must attest that the patient cannot leave home unaided.
        requiresCancerDetail:
          type: string
          enum:
          - 'yes'
          - 'no'
          description: Whether the application must capture cancer site and treatment phase.
        excludesDietOnlyDiabetes:
          type: string
          enum:
          - 'yes'
          - 'no'
          description: Whether diet-only diabetes is explicitly excluded (true for diabetes mellitus).
        snomedCtReference:
          type: string
          maxLength: 50
          description: Optional SNOMED CT concept identifier for the condition.
        icd10Reference:
          type: string
          maxLength: 20
          description: Optional ICD-10 code for the condition.
      required:
      - createdAt
      - updatedAt
      - code
      - label
      - description
      - requiresApplianceDetail
      - requiresSubstitutionTherapyDetail
      - requiresDisabilityAttestation
      - requiresCancerDetail
      - excludesDietOnlyDiabetes
      - snomedCtReference
      - icd10Reference
      description: Closed list of the ten NHSBSA-recognised qualifying conditions for FP92A.
    Grade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        applicationId:
          type: string
          format: uuid
          description: Foreign key to the parent application (one grade per application).
        outcome:
          type: string
          enum:
          - eligible
          - ineligible
          - requires-clarification
          - ''
          description: 'Eligibility outcome: eligible, ineligible, or requires-clarification.'
        redirectTo:
          type: string
          enum:
          - ''
          - FW8
          - age-exemption
          - low-income-scheme
          - hc1
          - hc2
          description: If ineligible on FP92A, suggested alternative exemption route.
        resultCategory:
          type: string
          description: Headline category as a human-readable label.
        resultScore:
          type:
          - number
          - 'null'
          format: double
          description: Numeric score (always 1.0 for eligible, 0.0 otherwise).
        resultNotes:
          type: string
          description: Free-text rationale or summary attached to the grade.
        validFrom:
          type:
          - string
          - 'null'
          format: date
          description: Date the certificate would become valid (typically completed_date).
        validUntil:
          type:
          - string
          - 'null'
          format: date
          description: Date the certificate would expire (typically valid_from + validity_years).
        validityYears:
          type: integer
          format: int32
          description: 'Number of years the certificate is valid for (NHSBSA default: 5).'
        gradedAt:
          type: string
          format: date-time
          description: Timestamp the grade was last (re-)computed.
      required:
      - createdAt
      - updatedAt
      - applicationId
      - outcome
      - redirectTo
      - resultCategory
      - resultNotes
      - validityYears
      - gradedAt
      description: Computed eligibility determination for an FP92A application.
    GradeAdditionalFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        gradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        flagId:
          type: string
          maxLength: 64
          description: Stable identifier of the flag.
        category:
          type: string
          enum:
          - completeness
          - data-quality
          - workflow
          - education
          - safeguarding
          - pregnancy
          - age-exemption
          - ''
          description: Flag category for grouping in the UI.
        description:
          type: string
          description: Human-readable description shown to the practitioner.
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          - ''
          description: 'Display priority: low, medium, or high.'
      required:
      - createdAt
      - updatedAt
      - gradeId
      - flagId
      - category
      - description
      - priority
      description: Per-grade advisory flags surfaced to the practitioner.
    GradeFiredRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        gradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        ruleId:
          type: string
          maxLength: 64
          description: Stable identifier of the rule that fired.
        category:
          type: string
          enum:
          - eligible-condition
          - disqualifying
          - redirect
          - completeness
          - renewal
          - ''
          description: 'Rule category: eligible-condition, disqualifying, redirect, completeness, renewal.'
        description:
          type: string
          description: Human-readable description of why the rule fired.
        severityLevel:
          type: string
          enum:
          - info
          - low
          - medium
          - high
          - ''
          description: Severity level for sorting / display.
        contributingConditionCode:
          type: string
          description: Optional eligible-condition code the rule was evaluated against.
      required:
      - createdAt
      - updatedAt
      - gradeId
      - ruleId
      - category
      - description
      - severityLevel
      - contributingConditionCode
      description: Audit trail of rules that fired when computing an eligibility grade.
    Patient:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        title:
          type: string
          enum:
          - Mr
          - Mrs
          - Miss
          - Ms
          - Mx
          - Dr
          - Prof
          - Rev
          - Other
          - ''
          description: Personal title prefix as printed on the FP92A.
        surname:
          type: string
          maxLength: 255
          description: Family name (surname) as printed on the FP92A.
        forenames:
          type: string
          maxLength: 255
          description: Given names (forenames) as printed on the FP92A.
        name:
          type: string
          maxLength: 255
          description: Full display name composed from forenames + surname.
        birthDate:
          type:
          - string
          - 'null'
          format: date
          description: Date of birth - used to derive age and age-based exemption eligibility.
        sex:
          type: string
          enum:
          - female
          - male
          - intersex
          - unknown
          - ''
          description: Sex recorded on the NHS demographic record.
        email:
          type:
          - string
          - 'null'
          description: Optional email address for non-statutory contact.
        phone:
          type:
          - string
          - 'null'
          description: Optional telephone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Full UK postal address as printed on the FP92A.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 (expected GB for FP92A applicants).
        postcode:
          type:
          - string
          - 'null'
          description: UK postcode used by NHSBSA to validate the address.
        unitedKingdomNhsNumber:
          type:
          - string
          - 'null'
          maxLength: 20
          description: NHS number (10 digits, Modulus-11 checksum). Required for NHSBSA matching.
        fullTimeEducation:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether a 16-18 year-old is in full-time education (age-exemption check).
        pregnancyStatus:
          type: string
          enum:
          - not-pregnant
          - pregnant
          - post-partum-within-12-months
          - ''
          description: Pregnancy / post-partum status used to redirect applicants to FW8.
      required:
      - createdAt
      - updatedAt
      - title
      - surname
      - forenames
      - name
      - sex
      - fullTimeEducation
      - pregnancyStatus
      description: Applicant for the FP92A medical exemption certificate.
    Practitioner:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          maxLength: 255
          description: Practitioner full name.
        email:
          type:
          - string
          - 'null'
          description: Optional practitioner email.
        phone:
          type:
          - string
          - 'null'
          description: Practice telephone number printed on the FP92A.
        role:
          type: string
          enum:
          - gp
          - hospital-doctor
          - nurse-practitioner
          - pharmacist-prescriber
          - other
          - ''
          description: Practitioner role / job title.
        registrationBody:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - GPhC
          - other
          - ''
          description: Professional registration body (GMC for doctors, NMC for nurses, HCPC, GPhC).
        registrationNumber:
          type: string
          description: Professional registration number issued by the registration body.
        practiceName:
          type: string
          maxLength: 255
          description: GP surgery / practice / clinic name printed on the FP92A.
        practiceCode:
          type: string
          maxLength: 20
          description: NHS practice code (where applicable).
        practitionerCode:
          type: string
          maxLength: 20
          description: NHS practitioner code (where applicable).
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Practice postal address as printed on the FP92A.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Practice country as ISO 3166-1 alpha-2.
        postcode:
          type:
          - string
          - 'null'
          description: Practice postcode.
        unitedKingdomNhsNumber:
          type:
          - string
          - 'null'
          maxLength: 12
          description: Optional NHS staff number for the practitioner.
      required:
      - createdAt
      - updatedAt
      - name
      - role
      - registrationBody
      - registrationNumber
      - practiceName
      - practiceCode
      - practitionerCode
      description: Practitioner who signs the FP92A and attests to the qualifying condition(s).
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          description: A URI identifying the problem type
        title:
          type: string
          description: A short summary of the problem type
        status:
          type: integer
          description: The HTTP status code
        detail:
          type: string
          description: An explanation of this occurrence
        instance:
          type: string
          description: A URI identifying this occurrence
        code:
          type: string
          description: A short machine-readable reason
        errors:
          type: object
          description: Per-field detail, when validation failed
      required:
      - type
      - title
      - status
