components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Name.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as full text.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code, such as for validating the postal address.
        role:
          type: string
          enum:
          - general-practitioner
          - surgical-registrar
          - general-surgeon
          - nurse-practitioner
          - other
          - ''
          description: Clinician role, i.e. the job role the practitioner holds when performing the evaluation.
        registrationBody:
          type: string
          enum:
          - GMC
          - NMC
          - other
          - ''
          description: Professional registration body, such as GMC for a registered doctor in the United
            Kingdom.
        registrationNumber:
          type: string
          maxLength: 50
          description: Professional registration number issued by the registration body.
        employer:
          type: string
          description: Employer, such as the NHS trust, health board, or general practice.
      required:
      - createdAt
      - updatedAt
      - name
      - role
      - registrationBody
      - registrationNumber
      - employer
      description: Clinician, i.e. the GP, surgical registrar, or general surgeon who conducts the hernia
        diagnostic evaluation.
    HerniaDiagnosticEvaluation:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the patient table.
        clinicianId:
          type: string
          format: uuid
          description: Foreign key to the clinician table, i.e. the practitioner conducting the evaluation.
        status:
          type: string
          enum:
          - draft
          - submitted
          - reviewed
          - urgent
          description: 'Workflow status of the evaluation: draft, submitted, reviewed, or urgent.'
        assessmentDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the evaluation was conducted.
        assessmentTime:
          type:
          - string
          - 'null'
          format: time
          description: Time the evaluation was conducted.
        siteName:
          type: string
          maxLength: 255
          description: Site where the evaluation was conducted, such as the GP practice, surgical assessment
            unit, or emergency department.
        durationOfBulge:
          type: string
          enum:
          - less-than-1-week
          - 1-4-weeks
          - 1-6-months
          - 6-12-months
          - more-than-1-year
          - ''
          description: How long the bulge has been present, such as for distinguishing an acute from a
            longstanding hernia.
        painScore010:
          type:
          - integer
          - 'null'
          format: int32
          description: Pain intensity rated by the patient from 0 for none to 10 for the worst imaginable,
            contributing to the soon urgency band and the functional impact.
        painOnset:
          type: string
          enum:
          - sudden
          - gradual
          - ''
          description: 'Onset of the presenting pain: sudden or gradual, because a sudden onset is more
            suggestive of incarceration or strangulation.'
        aggravatedByStraining:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the bulge or pain is aggravated by straining.
        aggravatedByLifting:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the bulge or pain is aggravated by lifting.
        aggravatedByCoughing:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the bulge or pain is aggravated by coughing.
        priorHerniaHistory:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the patient has a history of a hernia at this or another site.
        priorHerniaRepair:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the patient has had a prior hernia repair, such as for the recurrent-hernia
            safety flag.
        priorHerniaRepairMesh:
          type: string
          enum:
          - mesh
          - no-mesh
          - unknown
          - ''
          description: Whether the prior hernia repair used mesh, no mesh, or is unknown.
        priorHerniaRepairSite:
          type: string
          maxLength: 255
          description: Site and approximate date of the prior hernia repair, used to judge whether the
            current presentation is a recurrence at the same site.
        historyNotes:
          type: string
          description: Free-text notes about the presenting complaint and history.
        riskChronicCough:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the patient has a chronic cough, a recognised hernia risk factor that raises
            intra-abdominal pressure.
        riskConstipationOrStraining:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the patient has chronic constipation or straining at stool.
        riskHeavyLiftingOccupation:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the patient has an occupation involving heavy lifting.
        riskObesity:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the patient is obese.
        riskSmoking:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the patient smokes, which impairs collagen synthesis and wound healing.
        riskFamilyHistory:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the patient has a family history of hernia.
        riskPriorAbdominalSurgery:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the patient has had prior abdominal surgery, relevant to incisional hernia
            risk.
        riskPregnancy:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the patient is pregnant, relevant to umbilical and inguinal hernia risk
            and to management options.
        riskConnectiveTissueDisorder:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the patient has a known connective-tissue disorder such as Ehlers-Danlos
            syndrome.
        riskAscites:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the patient has ascites, which raises intra-abdominal pressure and complicates
            repair.
        riskFactorsNotes:
          type: string
          description: Free-text notes about risk factors.
        inspectionLocation:
          type: string
          enum:
          - groin
          - umbilical
          - epigastric
          - incisional
          - femoral
          - other
          - ''
          description: Anatomical location of the bulge on visual inspection.
        inspectionLocationOther:
          type: string
          maxLength: 255
          description: Location detail when inspection_location is other.
        bulgeVisibleAtRest:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the bulge is visible with the patient at rest.
        bulgeEnlargesOnStandingOrStraining:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the bulge enlarges on standing or straining, the classic dynamic sign of
            a hernia.
        skinChanges:
          type: string
          enum:
          - none
          - erythema
          - discolouration
          - both
          - ''
          description: Skin changes over the bulge, such as erythema or discolouration, which are red-flag
            findings.
        inspectionNotes:
          type: string
          description: Free-text notes from the visual inspection.
        palpableMass:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether a mass is palpable on examination.
        coughImpulsePositive:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether a cough impulse is elicited, i.e. a positive expansile impulse on coughing
            or Valsalva.
        tenderness:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the mass is tender on palpation, which raises concern for incarceration
            or strangulation.
        massSizeAsCm:
          type:
          - number
          - 'null'
          format: double
          description: Size of the palpable mass in cm, contributing to the EHS size grade.
        palpationNotes:
          type: string
          description: Free-text notes from palpation and the cough-impulse test.
        reducibilityStatus:
          type: string
          enum:
          - reducible
          - irreducible
          - incarcerated
          - ''
          description: 'Clinician judgement of reducibility: reducible, irreducible, or incarcerated.
            Drives the computed urgency band.'
        reducesSpontaneously:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the hernia reduces spontaneously, such as on lying flat.
        reducesWithManualPressure:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the hernia reduces with gentle manual pressure.
        doesNotReduce:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the hernia does not reduce despite manual pressure.
        reducibilityNotes:
          type: string
          description: Free-text notes about the reducibility assessment.
        redFlagSeverePain:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Red flag: severe pain out of proportion to examination findings. Any positive
            red flag forces the computed urgency to emergency.'
        redFlagVomiting:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Red flag: vomiting, suggestive of bowel obstruction.'
        redFlagFever:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Red flag: fever, suggestive of strangulation or bowel ischaemia.'
        redFlagAbsoluteConstipation:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Red flag: absolute constipation with no passage of flatus, suggestive of complete
            bowel obstruction.'
        redFlagErythemaOrDiscolouration:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Red flag: erythema or skin discolouration over the hernia, suggestive of strangulation.'
        redFlagPreviouslyReducibleNowIrreducible:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Red flag: a previously reducible hernia that is now irreducible, a classic sign
            of new incarceration.'
        redFlagTachycardia:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Red flag: tachycardia, a systemic sign of strangulation or sepsis.'
        redFlagNotes:
          type: string
          description: Free-text notes about the red-flag screen.
        herniaType:
          type: string
          enum:
          - inguinal
          - femoral
          - umbilical
          - epigastric
          - incisional
          - paraumbilical
          - spigelian
          - other
          - ''
          description: 'Clinical hernia type: inguinal, femoral, umbilical, epigastric, incisional, paraumbilical,
            spigelian, or other.'
        herniaTypeOther:
          type: string
          maxLength: 255
          description: Hernia type detail when hernia_type is other.
        inguinalSubtype:
          type: string
          enum:
          - direct
          - indirect
          - pantaloon
          - uncertain
          - ''
          description: 'European Hernia Society inguinal subtype: direct, indirect, pantaloon, or uncertain.
            Applies only when hernia_type is inguinal.'
        laterality:
          type: string
          enum:
          - left
          - right
          - bilateral
          - ''
          description: 'Laterality: left, right, or bilateral.'
        ehsSizeGrade:
          type: string
          enum:
          - '1'
          - '2'
          - '3'
          - ''
          description: 'European Hernia Society size grade: 1 for less than 2 cm, 2 for 2 to 4 cm, 3 for
            more than 4 cm.'
        classificationNotes:
          type: string
          description: Free-text notes about the clinical classification.
        ultrasoundPerformed:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether an ultrasound scan was performed.
        ultrasoundFindings:
          type: string
          enum:
          - confirms-hernia
          - no-hernia
          - inconclusive
          - ''
          description: 'Ultrasound findings: confirms the hernia, no hernia seen, or inconclusive.'
        ctPerformed:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether a CT scan was performed.
        ctFindings:
          type: string
          enum:
          - confirms-hernia
          - no-hernia
          - inconclusive
          - ''
          description: 'CT findings: confirms the hernia, no hernia seen, or inconclusive.'
        mriPerformed:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether an MRI scan was performed.
        mriFindings:
          type: string
          enum:
          - confirms-hernia
          - no-hernia
          - inconclusive
          - ''
          description: 'MRI findings: confirms the hernia, no hernia seen, or inconclusive.'
        imagingIndication:
          type: string
          enum:
          - atypical-presentation
          - occult-suspicion
          - inconclusive-exam
          - pre-op-planning
          - not-indicated
          - ''
          description: 'Reason imaging was requested: atypical presentation, occult-hernia suspicion,
            inconclusive examination, or pre-operative planning.'
        imagingNotes:
          type: string
          description: Free-text notes about imaging.
        differentialLipoma:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether lipoma was considered in the differential diagnosis.
        differentialLymphadenopathy:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether lymphadenopathy was considered in the differential diagnosis.
        differentialHydrocele:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether hydrocele was considered in the differential diagnosis.
        differentialUndescendedTestis:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether undescended testis was considered in the differential diagnosis.
        differentialFemoralAneurysm:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether femoral aneurysm was considered in the differential diagnosis.
        differentialAbscess:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether abscess was considered in the differential diagnosis.
        differentialOther:
          type: string
          maxLength: 255
          description: Any other differential diagnosis considered.
        differentialNotes:
          type: string
          description: Free-text notes about the differential diagnosis.
        painInterferesWithWorkOrActivity:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether pain interferes with work or activity.
        functionalImpactScale010:
          type:
          - integer
          - 'null'
          format: int32
          description: Overall functional impact rated from 0 for none to 10 for total, contributing to
            the soon urgency band.
        activityLimitation:
          type: string
          maxLength: 500
          description: Free-text description of activities the hernia limits.
        managementPlan:
          type: string
          enum:
          - watchful-waiting
          - elective-repair-referral
          - urgent-referral
          - emergency-referral
          - conservative
          - ''
          description: 'Management plan: watchful waiting, elective repair referral, urgent referral,
            emergency referral, or conservative.'
        conservativeDetail:
          type: string
          maxLength: 255
          description: Detail of conservative management, such as a truss or lifestyle advice.
        referralMade:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether a referral was made.
        referralTargetTimeframe:
          type: string
          enum:
          - same-day
          - immediate
          - within-2-weeks
          - within-6-weeks
          - within-18-weeks
          - ''
          description: Target timeframe for the referral to be seen, such as within 2 weeks or immediate.
        managementNotes:
          type: string
          description: Free-text notes about the management plan.
        additionalNotes:
          type: string
          description: Additional free-text notes for the summary and sign-off.
      required:
      - createdAt
      - updatedAt
      - patientId
      - clinicianId
      - status
      - siteName
      - durationOfBulge
      - painOnset
      - aggravatedByStraining
      - aggravatedByLifting
      - aggravatedByCoughing
      - priorHerniaHistory
      - priorHerniaRepair
      - priorHerniaRepairMesh
      - priorHerniaRepairSite
      - historyNotes
      - riskChronicCough
      - riskConstipationOrStraining
      - riskHeavyLiftingOccupation
      - riskObesity
      - riskSmoking
      - riskFamilyHistory
      - riskPriorAbdominalSurgery
      - riskPregnancy
      - riskConnectiveTissueDisorder
      - riskAscites
      - riskFactorsNotes
      - inspectionLocation
      - inspectionLocationOther
      - bulgeVisibleAtRest
      - bulgeEnlargesOnStandingOrStraining
      - skinChanges
      - inspectionNotes
      - palpableMass
      - coughImpulsePositive
      - tenderness
      - palpationNotes
