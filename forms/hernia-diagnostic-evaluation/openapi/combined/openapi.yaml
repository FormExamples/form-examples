        required: false
        description: Rows on a page. A larger limit is refused, not clamped
      - name: cursor
        in: query
        schema:
          type: string
        required: false
        description: The next page, as the previous page's Link header gave it. Opaque and signed for
          this list and these filters
      responses:
        '200':
          description: A page of Patient records, with no total
          headers:
            link:
              description: The next page, as <...>; rel="next", while more rows follow. Absent on the
