      description: 'Hernia diagnostic evaluation: the payload of the 14-step single-page wizard used to
        detect, classify, and grade the urgency of an abdominal-wall or groin hernia.'
    HerniaDiagnosticEvaluationGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        herniaDiagnosticEvaluationId:
          type: string
          format: uuid
          description: Foreign key to the hernia_diagnostic_evaluation table, unique because grading is
            one-to-one with the evaluation.
        herniaType:
          type: string
          enum:
          - inguinal
          - femoral
          - umbilical
          - epigastric
          - incisional
          - paraumbilical
          - spigelian
          - other
          - ''
          description: Hernia type as classified by the engine from the clinical classification step.
        herniaSubtype:
          type: string
          enum:
          - direct
          - indirect
          - pantaloon
          - uncertain
          - not-applicable
          - ''
          description: European Hernia Society inguinal subtype when the hernia type is inguinal, otherwise
            not-applicable.
        ehsClassification:
          type: string
          maxLength: 100
          description: Human-readable European Hernia Society classification string, such as "Inguinal,
            indirect, right, EHS grade 2 (2-4cm)".
        ehsSizeGrade:
          type: string
          enum:
          - '1'
          - '2'
          - '3'
          - ''
          description: 'European Hernia Society size grade carried through from the classification step:
            1, 2, or 3.'
        reducibilityStatus:
          type: string
          enum:
          - reducible
          - irreducible
          - incarcerated
          - ''
          description: Reducibility status carried through from the reducibility assessment step.
        computedUrgency:
          type: string
          enum:
          - routine
          - soon
          - urgent
          - emergency
          - ''
          description: 'Urgency band computed by the engine: routine, soon, urgent, or emergency. Emergency
            is forced by any positive red flag.'
        finalUrgency:
          type: string
          enum:
          - routine
          - soon
          - urgent
          - emergency
          - ''
          description: Urgency band signed off by the clinician, which may equal or differ from the computed
            value.
        overrideReason:
          type: string
          maxLength: 500
          description: Reason the clinician set a final urgency differently from the computed value, mandatory
            when they differ.
        recommendation:
          type: string
          enum:
          - watchful-waiting
          - elective-repair-referral
          - urgent-referral
          - emergency-referral
          - conservative
          - ''
          description: Overall recommendation derived from the final urgency band, mirroring the management_plan
            options.
        clinicianNotes:
          type: string
          description: Free-text clinician summary notes.
        signedByName:
          type: string
          maxLength: 255
          description: Name of the clinician who signed the evaluation.
        signedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Timestamp of the clinician electronic signature.
        gradedAt:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the result.
      required:
      - createdAt
      - updatedAt
      - herniaDiagnosticEvaluationId
      - herniaType
      - herniaSubtype
      - ehsClassification
      - ehsSizeGrade
      - reducibilityStatus
      - computedUrgency
      - finalUrgency
      - overrideReason
      - recommendation
      - clinicianNotes
      - signedByName
      - gradedAt
      description: Computed and signed-off classification and urgency result for one hernia diagnostic
        evaluation. Stores both the engine-computed values and the clinician-final values with an override
        reason.
    HerniaDiagnosticEvaluationGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        herniaDiagnosticEvaluationGradeId:
          type: string
          format: uuid
          description: Foreign key to the parent hernia_diagnostic_evaluation_grade table.
        flagId:
          type: string
          maxLength: 50
          description: Stable flag identifier, such as F-STRANGULATION-SUSPECTED-001.
        category:
          type: string
          enum:
          - strangulation-suspected
          - incarceration-risk
          - emergency-surgical-referral
          - atypical-presentation
          - occult-hernia-suspected
          - recurrent-hernia
          - paediatric
          - pregnancy
          - capacity-concern
          - other
          - ''
          description: Flag category, such as strangulation-suspected or emergency-surgical-referral.
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          - ''
          description: 'Priority: low, medium, or high.'
        description:
          type: string
          maxLength: 500
          description: Human-readable description of what fired the flag.
        suggestedAction:
          type: string
          maxLength: 500
          description: Suggested clinical action, such as "refer for emergency surgical assessment today".
