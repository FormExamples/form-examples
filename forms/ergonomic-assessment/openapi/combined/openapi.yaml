components:
  schemas:
    Assessment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when this row was deleted.
        patient_id:
          type: string
          format: uuid
          description: FK to patient. One patient may have many assessments.
        status:
          type: string
          enum:
          - in_progress
          - completed
          - reviewed
          description: 'Workflow status: in_progress (patient filling in), completed (submitted), reviewed
            (clinician signed off).'
      required:
      - created_at
      - updated_at
      - patient_id
      - status
      description: A single ergonomic assessment visit. Child tables hold section-specific data.
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Soft-delete timestamp; NULL when the row is live.
        name:
          type: string
          description: Name.
        email:
          type: string
          description: Email address.
        phone:
          type: string
          description: Phone number.
        postal_address_as_full_text:
          type: string
          description: Postal address as full text.
        country_as_iso_3166_1_alpha_2:
          type: string
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type: string
          description: Postal code, such as for validating the postal address.
        role:
          type: string
          enum:
          - anaesthetist
          - surgeon
          - preop-nurse
          - perioperative-physician
          - geriatrician
          - pharmacist
          - other
          - ''
          description: Clinician role.
        registration_body:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - GPhC
          - other
          - ''
          description: Clinician registration body.
        registration_number:
          type: string
          description: Clinician registration number.
        united_kingdom_nhs_number:
          type: string
          maxLength: 12
          description: United Kingdom NHS number, unique per person.
      required:
      - created_at
      - updated_at
      - name
      - role
      - registration_body
      - registration_number
      description: Clinician
    Grade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when this row was deleted.
        assessment_id:
          type: string
          format: uuid
          description: Foreign key to the assessment table.
        reba_score:
          type: integer
          format: int32
          description: Computed REBA score (1-15), sum of fired rule scores clamped to range.
        risk_level:
          type: string
          enum:
          - Negligible risk
          - Low risk
          - Medium risk
          - High risk
          - Very high risk
          description: 'Risk level derived from REBA score: Negligible, Low, Medium, High, or Very high
            risk.'
        reba_score_override:
          type: integer
          format: int32
          description: Clinician override of the computed REBA score. NULL if no override.
        override_reason:
          type: string
          description: Required reason text when reba_score_override is set.
        graded_at:
          type: string
          format: date-time
          description: Timestamp when the REBA grading was computed.
      required:
      - created_at
      - updated_at
      - assessment_id
      - reba_score
      - risk_level
      - override_reason
      - graded_at
      description: Computed REBA grading result for an assessment. Includes optional clinician override.
    GradingAdditionalFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when this row was deleted.
        grade_id:
          type: string
          format: uuid
          description: Foreign key to the grade table.
        flag_id:
          type: string
          description: Flag identifier, e.g. FLAG-POSTURE-001, FLAG-RSI-001, FLAG-MANUAL-001.
        category:
          type: string
          description: Category of the flag, e.g. Posture, Medical History, Manual Handling, Symptoms,
            Psychosocial.
        message:
          type: string
          description: Human-readable alert message describing the flagged condition.
        priority:
          type: string
          enum:
          - high
          - medium
          - low
          description: 'Flag priority: high (urgent action), medium (review needed), low (informational).'
      required:
      - created_at
      - updated_at
      - grade_id
      - flag_id
      - category
      - message
      - priority
      description: Additional safety flags raised during grading, independent of REBA score. Actionable
        alerts for clinician review.
    GradingFiredRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when this row was deleted.
        grade_id:
          type: string
          format: uuid
          description: FK to the grading result this fired rule belongs to.
        rule_id:
          type: string
          description: FK to the REBA rule that fired.
        system:
          type: string
          description: Body system or category (denormalized from reba_rule at grading time).
        description:
          type: string
          description: Rule description (denormalized from reba_rule at grading time).
        score:
          type: integer
          format: int32
          description: Score contribution (denormalized from reba_rule at grading time).
      required:
      - created_at
      - updated_at
      - grade_id
      - rule_id
      - system
      - description
      - score
      description: Denormalized record of each REBA rule that fired during grading. Preserves exact context
        for clinical audit.
    Patient:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-deleted.
        deleted_at:
          type: string
          format: date-time
          description: Soft-delete timestamp; NULL when the row is live.
        name:
          type: string
          maxLength: 255
          description: Name.
        birth_date:
          type: string
          format: date
          description: Birth date.
        email:
          type: string
          description: Email address.
        phone:
          type: string
          description: Phone number.
        postal_address_as_full_text:
          type: string
          description: Postal address as full text.
        country_as_iso_3166_1_alpha_2:
          type: string
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type: string
          description: Postal code, such as for validating the postal address.
        united_kingdom_nhs_number:
          type: string
          maxLength: 20
          description: United Kingdom NHS number, unique per person.
        waist_as_cm:
          type: number
          format: double
          description: Waist circumference measurement in cm, such as for calculating waist-height ratio
            (WHR).
        height_as_cm:
          type: number
          format: double
          description: Height measurement in cm, such as for calculating waist-height ratio (WHR).
        weight_as_kg:
          type: number
          format: double
          description: Weight as kg.
        body_mass_index:
          type: number
          format: double
          description: Body mass index (BMI) measurement.
        waist_height_ratio:
          type: number
          format: double
          description: Waist-height ratio (WHR) measurement.
        vo2_max:
          type: number
          format: double
          description: VO2 max measurement.
      required:
      - created_at
      - updated_at
      - name
      - birth_date
      description: Patient
    RebaRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when this row was deleted.
        code:
          type: string
          description: Human-readable rule code (e.g. DM-001). UNIQUE stable identifier used by application
            code and audit records.
        system:
          type: string
          description: Body system or assessment category, e.g. Neck, Trunk, Workstation, Repetition,
            Manual Handling.
        description:
          type: string
          description: Human-readable description of the condition this rule detects.
        score:
          type: integer
          format: int32
          description: REBA score contribution when the rule fires (0-15).
      required:
      - created_at
      - updated_at
      - code
      - system
      - description
      - score
      description: Reference table of REBA scoring rules. Each rule has an ID, system, description, and
        score contribution.
