                $ref: '#/components/schemas/Problem'
        '429':
          description: This client sent too many requests
          headers:
            retry-after:
              description: Seconds to wait before sending again
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  schemas:
    OkrCheckIn:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        okrObjectiveId:
          type: string
          format: uuid
          description: Foreign key to the parent okr_objective.
        checkedInAt:
          type: string
          format: date-time
          description: When this check-in was made.
        narrative:
          type: string
          description: Free-text update narrative.
        sinceLastChanges:
          type: string
          description: Summary of what changed since the previous check-in.
        blockers:
          type: string
          description: Current blockers as of this check-in.
        asks:
          type: string
          description: Asks for help / decisions / resources at this check-in.
        confidenceDecileAtCheckIn:
          type:
          - integer
          - 'null'
          format: int32
          description: Confidence decile snapshot 1-10 at this check-in; used by the confidence-collapse
            flag.
      required:
      - createdAt
      - updatedAt
      - okrObjectiveId
      - checkedInAt
      - narrative
      - sinceLastChanges
      - blockers
      - asks
      description: Periodic progress check-in narrative for an objective. Many rows per okr_objective.
    OkrGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        okrObjectiveId:
          type: string
          format: uuid
          description: Foreign key to the parent okr_objective row (UNIQUE, 1:1).
        scoreByProgressPercent:
          type:
          - number
          - 'null'
          format: double
          description: 'Score 1 of 7: echoed from okr_objective for dashboard joins.'
        scoreByConfidenceDecile:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Score 2 of 7: echoed from okr_objective.'
        scoreByStretchTier:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Score 3 of 7: echoed from okr_objective.'
        scoreByAlignmentGrade:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Score 4 of 7: echoed from okr_objective.'
        scoreByImpactTier:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Score 5 of 7: echoed from okr_objective.'
        scoreBySmartQuality:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Score 6 of 7: echoed from okr_objective.'
        scoreByPaceDeviationPercent:
          type:
          - number
          - 'null'
          format: double
          description: 'Score 7 of 7: echoed from okr_objective.'
        computedCompositeRag:
          type: string
          enum:
          - green
          - amber
          - red
          - ''
          description: 'Composite RAG computed by the engine using the worst-band-finding algorithm: green,
            amber, or red.'
        finalCompositeRag:
          type: string
          enum:
          - green
          - amber
          - red
          - ''
          description: Composite RAG signed off by the reviewer (may equal or differ from computed).
        overrideReason:
          type: string
          description: Reason the reviewer set final differently from computed (mandatory when they differ).
        recommendation:
          type: string
          enum:
          - continue
          - escalate
          - re-scope
          - retire
          - split
          - merge
          - ''
          description: 'Overall recommendation: continue, escalate, re-scope, retire, split, merge.'
        triageNotes:
          type: string
          description: Free-text reviewer summary notes.
        signedBy:
          type: string
          description: Name or identifier of the reviewer who signed off.
        signedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Timestamp of the reviewer electronic signature.
        gradedAt:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the result.
      required:
      - createdAt
      - updatedAt
      - okrObjectiveId
      - computedCompositeRag
      - finalCompositeRag
      - overrideReason
      - recommendation
      - triageNotes
      - signedBy
      - gradedAt
      description: Computed and signed-off grading result for an objective. 1:1 with okr_objective.
    OkrGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        okrGradeId:
          type: string
          format: uuid
          description: Foreign key to the parent okr_grade.
        flagCode:
          type: string
          enum:
          - mis-aligned
          - orphaned
          - non-smart
          - unmeasurable
          - no-dri
          - committed-at-risk
          - pace-collapse
          - confidence-collapse
          - stale-check-in
          - cascading-broken
          - over-scoped
          - moonshot-progress
          - ''
          description: 'Flag code: mis-aligned, orphaned, non-smart, unmeasurable, no-dri, committed-at-risk,
            pace-collapse, confidence-collapse, stale-check-in, cascading-broken, over-scoped, moonshot-progress.'
        priority:
          type: string
          enum:
          - high
          - medium
          - low
          - ''
          description: 'Flag priority: high, medium, low.'
        description:
          type: string
          description: Human-readable description of why the flag fired.
      required:
      - createdAt
      - updatedAt
      - okrGradeId
      - flagCode
      - priority
      - description
      description: A risk flag attached to an OKR grade. Computed independently of the composite RAG.
    OkrGradeRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        okrGradeId:
          type: string
          format: uuid
          description: Foreign key to the parent okr_grade.
        ruleId:
          type: string
          description: Stable rule identifier (e.g. R-PROGRESS-RED-COMMITTED).
        instrument:
          type: string
          enum:
          - progress
          - confidence
          - stretch
          - alignment
          - impact
          - smart
          - pace
          - composite
          - ''
          description: 'Which scoring instrument fired the rule: progress, confidence, stretch, alignment,
            impact, smart, pace, or composite.'
        grade:
          type: string
          description: 'Grade band the rule attached: green, amber, red.'
        category:
          type: string
          description: Free-text category, e.g. progress, alignment, smart.
        description:
          type: string
          description: Human-readable rule description.
      required:
      - createdAt
      - updatedAt
      - okrGradeId
      - ruleId
      - instrument
      - grade
      - category
      - description
      description: A grading rule that fired during composite RAG computation. Many rows per okr_grade.
    OkrKeyResult:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        okrObjectiveId:
          type: string
          format: uuid
          description: Foreign key to the parent okr_objective.
        position:
          type: integer
          format: int32
          description: Display order 1-5; UNIQUE per objective.
        title:
          type: string
          description: One-sentence Key Result statement.
        krType:
          type: string
          enum:
          - numeric
          - milestone
          - binary
          - ''
          description: 'Key Result type: numeric (start/current/target), milestone (ordered list), or
            binary (done flag).'
        unit:
          type: string
          description: 'Unit of measure for numeric KRs: USD, users, percent, count, etc.'
        startValue:
          type:
          - number
          - 'null'
          format: double
          description: 'Numeric KR: starting value at cycle start.'
        currentValue:
          type:
          - number
          - 'null'
          format: double
          description: 'Numeric KR: latest observed value.'
        targetValue:
          type:
          - number
          - 'null'
          format: double
          description: 'Numeric KR: target value at cycle end.'
        milestonesJson:
          type:
          - object
          - 'null'
          description: 'Milestone KR: ordered JSONB list, each {name, done, completed_at}.'
        binaryDone:
          type:
          - boolean
          - 'null'
          description: 'Binary KR: done flag.'
        ownerName:
          type: string
          description: Optional KR-level owner name (may differ from objective DRI).
        dueDate:
          type:
          - string
          - 'null'
          format: date
          description: Optional due date for this KR (defaults to objective cycle_end_date).
        progressFraction:
          type:
          - number
          - 'null'
          format: double
          description: Computed progress fraction 0.0-1.0; numeric → (cur-start)/(target-start) clamped,
            milestone → done/total, binary → 0 or 1.
      required:
      - createdAt
      - updatedAt
      - okrObjectiveId
      - position
      - title
      - krType
      - unit
      - ownerName
      description: A Key Result for an objective. 1-5 rows per okr_objective; UNIQUE on (okr_objective_id,
        position).
    OkrObjective:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        reporterId:
          type: string
          format: uuid
          description: Foreign key to the reporter who submitted the objective.
        parentObjectiveId:
          type:
          - string
          - 'null'
          format: uuid
          description: 'Self-referential foreign key: the parent objective this one ladders up to. NULL
            for top-level objectives.'
        status:
          type: string
          enum:
          - draft
          - active
          - at-risk
          - achieved
          - missed
          - retired
          - cancelled
          description: 'Lifecycle status: draft, active, at-risk, achieved, missed, retired, cancelled.'
        level:
          type: string
          enum:
          - individual
          - team
          - department
          - company
          - ''
          description: 'Organisational level: individual, team, department, company.'
        cycle:
          type: string
          enum:
          - monthly
          - quarterly
          - half-yearly
          - annual
          - custom
          - ''
          description: 'Time horizon: monthly, quarterly, half-yearly, annual, custom.'
        cycleStartDate:
          type:
          - string
          - 'null'
          format: date
          description: First day of the OKR cycle.
        cycleEndDate:
          type:
          - string
          - 'null'
          format: date
          description: Last day of the OKR cycle.
        teamOrOrgName:
          type: string
          description: Owning team or organisational unit name.
        strategicTheme:
          type: string
          description: Strategic theme or pillar this objective ladders to.
        externalReference:
          type: string
          description: External tracker id, ticket, or strategy doc reference.
        objTitle:
          type: string
          description: 'Step 2: one-sentence qualitative objective statement.'
        objLongDescription:
          type: string
          description: 'Step 2: free-text long description of the objective.'
        saParentSummary:
          type: string
          description: 'Step 4: how this objective ladders to the parent or to the mission.'
        saBusinessValueStatement:
          type: string
          description: 'Step 4: business value statement — why this objective matters.'
        inInitiatives:
          type: string
          description: 'Step 6: planned actions, projects, programmes that drive each KR.'
        inSupportingLinks:
          type: string
          description: 'Step 6: free-text supporting links and references.'
        rkKnownRisks:
          type: string
          description: 'Step 7: known risks to achieving the objective.'
        rkDependencies:
          type: string
          description: 'Step 7: external dependencies.'
        rkBlockers:
          type: string
          description: 'Step 7: current blockers.'
        rkMitigationPlans:
          type: string
          description: 'Step 7: planned mitigations for the risks above.'
        fcExpectedEndState:
          type: string
          description: 'Step 9: forecast — expected end-of-cycle state per KR (free text).'
        fcResidualRisk:
          type: string
          description: 'Step 9: residual risk to the objective at end-of-cycle.'
        scoreByProgressPercent:
          type:
          - number
          - 'null'
          format: double
          description: 'Score 1 of 7: progress percent 0-100. Mean of per-KR progress_fraction (clamped)
            expressed as percent.'
        scoreByConfidenceDecile:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Score 2 of 7: owner confidence decile 1-10.'
        scoreByStretchTier:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Score 3 of 7: stretch tier 1-3 — 1=committed, 2=aspirational, 3=moonshot.'
        scoreByAlignmentGrade:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Score 4 of 7: alignment grade 1-5 to parent or strategic theme.'
        scoreByImpactTier:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Score 5 of 7: impact tier 1-5 — business value if achieved.'
        scoreBySmartQuality:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Score 6 of 7: SMART criteria count 0-5 (Specific, Measurable, Achievable, Relevant,
            Time-bound).'
        scoreByPaceDeviationPercent:
          type:
          - number
          - 'null'
          format: double
          description: 'Score 7 of 7: pace deviation percent -100..+100 from expected linear pace at this
            point in the cycle.'
      required:
      - createdAt
      - updatedAt
      - reporterId
      - status
      - level
      - cycle
      - teamOrOrgName
      - strategicTheme
      - externalReference
      - objTitle
      - objLongDescription
      - saParentSummary
      - saBusinessValueStatement
      - inInitiatives
      - inSupportingLinks
      - rkKnownRisks
      - rkDependencies
      - rkBlockers
      - rkMitigationPlans
      - fcExpectedEndState
      - fcResidualRisk
      description: Main OKR objective row. Holds reporter and metadata, all step fields, and the seven
        raw input scores. Computed scores live in okr_grade.
    Participant:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        okrObjectiveId:
          type: string
          format: uuid
          description: Foreign key to okr_objective. The FK constraint is added in the okr_objective migration
            via ALTER TABLE.
        role:
          type: string
          enum:
          - dri
          - contributor
          - reviewer
          - stakeholder
          - observer
          - ''
          description: 'Participant role: dri (Directly Responsible Individual), contributor, reviewer,
            stakeholder, or observer.'
        name:
          type: string
          description: Display name of the participant.
        email:
          type: string
          description: Email address of the participant.
        notes:
          type: string
          description: Free-text notes about the participant role.
      required:
      - createdAt
      - updatedAt
      - okrObjectiveId
      - role
      - name
      - email
      - notes
      description: 'A participant linked to an OKR objective: DRI, contributor, reviewer, stakeholder,
        or observer.'
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          description: A URI identifying the problem type
        title:
          type: string
          description: A short summary of the problem type
        status:
          type: integer
          description: The HTTP status code
        detail:
          type: string
          description: An explanation of this occurrence
        instance:
          type: string
          description: A URI identifying this occurrence
        code:
          type: string
          description: A short machine-readable reason
        errors:
          type: object
          description: Per-field detail, when validation failed
      required:
      - type
      - title
      - status
    Reporter:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Display name of the reporter.
        email:
          type: string
          description: Email address of the reporter.
        role:
          type: string
          description: Free-text role label (e.g. team lead, OKR coach, executive).
      required:
      - createdAt
      - updatedAt
      - name
      - email
      - role
      description: Person who submitted an OKR objective via the wizard.
