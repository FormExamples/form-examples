components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Name.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as full text.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code, such as for validating the postal address.
        role:
          type: string
          enum:
          - radiologist
          - consultant
          - reporting-radiographer
          - rheumatologist
          - endocrinologist
          - other
          - ''
          description: 'Reporting clinician role: radiologist, consultant, reporting-radiographer, rheumatologist,
            endocrinologist, other.'
        registrationBody:
          type: string
          enum:
          - GMC
          - HCPC
          - other
          - ''
          description: 'Clinician registration body: GMC, HCPC, other.'
        registrationNumber:
          type: string
          description: Clinician registration number.
        unitedKingdomNhsNumber:
          type:
          - string
          - 'null'
          maxLength: 12
          description: United Kingdom NHS number, unique per person.
      required:
      - createdAt
      - updatedAt
      - name
      - role
      - registrationBody
      - registrationNumber
      description: Reporting clinician (radiologist, consultant, reporting radiographer, rheumatologist,
        or endocrinologist) who authors and signs the DEXA bone-density result report.
    DexaBoneDensityTestResult:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the patient.
        clinicianId:
          type: string
          format: uuid
          description: Foreign key to the reporting clinician (radiologist / consultant / reporting radiographer
            / rheumatologist / endocrinologist).
        originatingRequestReference:
          type: string
          maxLength: 255
          description: Free-text reference linking this report back to the originating DEXA scan request
            (referral).
        reportStatus:
          type: string
          enum:
          - preliminary
          - final
          - amended
          - cancelled
          - ''
          description: 'Report lifecycle status: preliminary, final, amended, cancelled.'
        performedDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the DEXA examination was performed.
        reportedDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the report was authored / signed.
        scanRegion:
          type: string
          enum:
          - hip
          - spine
          - hip-and-spine
          - forearm
          - whole-body
          - other
          - ''
          description: 'Examined DEXA scan region: hip, spine, hip-and-spine, forearm, whole-body, other.'
        examinationAdequacy:
          type: string
          enum:
          - adequate
          - limited
          - non-diagnostic
          - ''
          description: 'Diagnostic adequacy of the examination: adequate, limited, non-diagnostic.'
        clinicalHistory:
          type: string
          maxLength: 1000
          description: Clinical history and the question the examination was performed to answer.
        lumbarSpineTScore:
          type:
          - number
          - 'null'
          format: double
          description: 'Lumbar-spine T-score: standard deviations from young-adult reference mean (WHO
            classification input).'
        lumbarSpineZScore:
          type:
          - number
          - 'null'
          format: double
          description: 'Lumbar-spine Z-score: standard deviations from age-matched reference mean (used
            in younger adults / children).'
        femoralNeckTScore:
          type:
          - number
          - 'null'
          format: double
          description: 'Femoral-neck T-score: standard deviations from young-adult reference mean (reference
            site for WHO classification and FRAX).'
        femoralNeckZScore:
          type:
          - number
          - 'null'
          format: double
          description: 'Femoral-neck Z-score: standard deviations from age-matched reference mean.'
        totalHipTScore:
          type:
          - number
          - 'null'
          format: double
          description: 'Total-hip T-score: standard deviations from young-adult reference mean.'
        lowestTScore:
          type:
          - number
          - 'null'
          format: double
          description: Lowest (most negative) T-score across the measured skeletal sites, which drives
            the WHO classification.
        boneMineralDensityGCm2:
          type:
          - number
          - 'null'
          format: double
          description: Areal bone mineral density (BMD) in g/cm2 at the reference site.
        whoClassification:
          type: string
          enum:
          - normal
          - osteopenia
          - osteoporosis
          - severe-osteoporosis
          - ''
          description: 'WHO densitometric classification derived from the lowest T-score: normal, osteopenia,
            osteoporosis, severe-osteoporosis.'
        fraxMajorFracturePercent:
          type:
          - number
          - 'null'
          format: double
          description: FRAX 10-year major osteoporotic fracture probability as a percentage (0-100).
        fraxHipFracturePercent:
          type:
          - number
          - 'null'
          format: double
          description: FRAX 10-year hip fracture probability as a percentage (0-100).
        vertebralFractureIdentified:
          type: boolean
          description: Whether one or more vertebral fractures were identified (e.g. on vertebral fracture
            assessment / lateral spine imaging).
        comparisonWithPrevious:
          type: string
          maxLength: 1000
          description: Comparison with the relevant previous DEXA examination.
        percentChangeSincePrevious:
          type:
          - number
          - 'null'
          format: double
          description: Percentage change in BMD since the previous DEXA (positive = gain, negative = loss),
            for monitoring.
        impression:
          type: string
          maxLength: 2000
          description: Summary impression / conclusion answering the clinical question.
        recommendedFollowUp:
          type: string
          maxLength: 1000
          description: Recommended follow-up scan interval, referral, or management.
        criticalResultCommunicated:
          type: boolean
          description: Whether a critical or unexpected significant result was communicated directly to
            the referrer.
        reportedTo:
          type: string
          maxLength: 500
          description: Who the critical / urgent result was communicated to, with date and time if applicable.
      required:
      - createdAt
      - updatedAt
      - patientId
      - clinicianId
      - originatingRequestReference
      - reportStatus
      - scanRegion
      - examinationAdequacy
      - clinicalHistory
      - whoClassification
      - vertebralFractureIdentified
      - comparisonWithPrevious
      - impression
      - recommendedFollowUp
      - criticalResultCommunicated
      - reportedTo
      description: DEXA / DXA (dual-energy X-ray absorptiometry) bone-density result (report). Captures
        the performed examination, the clinical history, the quantitative findings (BMD in g/cm2, T-scores
        and Z-scores at the lumbar spine, femoral neck, and total hip, plus the lowest T-score), the WHO
        densitometric classification, FRAX 10-year fracture probabilities, vertebral-fracture identification,
        comparison with previous DEXA, the impression, and recommended follow-up. This is the source-of-truth
        record that the four-axis interpretation grade is computed from.
    DexaBoneDensityTestResultGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        dexaBoneDensityTestResultId:
          type: string
          format: uuid
          description: Foreign key to the parent result (unique, 1:1).
        resultClassification:
          type: string
          enum:
          - normal
          - abnormal
          - critical
          - inconclusive
          - ''
          description: 'Axis A overall classification: normal, abnormal, critical, inconclusive.'
        abnormalitySeverity:
          type: string
          enum:
          - none
          - minor
          - moderate
          - major
          - ''
          description: 'Axis B abnormality severity: none, minor, moderate, major.'
        reportingCategory:
          type: string
          maxLength: 50
          description: Axis B structured-reporting category label, carrying the WHO densitometric classification
            (normal / osteopenia / osteoporosis / severe-osteoporosis).
        reportCompletenessPercent:
          type:
          - integer
          - 'null'
          format: int32
          description: Axis C report completeness as a percentage of mandatory report sections (0-100).
        followUpUrgency:
          type: string
          enum:
          - routine
          - recommended
          - urgent
          - critical-alert
          - ''
          description: 'Axis D follow-up urgency: routine, recommended, urgent, critical-alert.'
        targetTimeframe:
          type: string
          maxLength: 50
          description: Target timeframe for the recommended follow-up implied by the urgency.
        recommendedAction:
          type: string
          maxLength: 500
          description: Axis D concise recommended action derived from the urgency.
        recommendation:
          type: string
          enum:
          - no-action
          - routine-follow-up
          - further-imaging
          - specialist-referral
          - urgent-review
          - ''
          description: 'Overall recommendation: no-action, routine-follow-up, further-imaging, specialist-referral,
            urgent-review.'
        clinicianNotes:
          type: string
          description: Free-text interpretation / sign-off notes.
        signedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Timestamp of the reporting clinician electronic signature.
        gradedAt:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the result.
      required:
      - createdAt
