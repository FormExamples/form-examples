        patient_id:
          type: string
          format: uuid
          description: Foreign key to the patient.
        clinician_id:
          type: string
          format: uuid
          description: Foreign key to the reporting clinician (allergist-immunologist / dermatologist
            / nurse).
        originating_request_reference:
          type: string
          maxLength: 255
          description: Free-text reference linking this report back to the originating allergy skin test
            request (referral).
        test_type:
          type: string
          enum:
          - skin-prick-test
          - intradermal-test
          - patch-test
          - specific-ige-blood
          - drug-provocation-challenge
          - other
          - ''
          description: 'Performed test type: skin-prick-test, intradermal-test, patch-test, specific-ige-blood,
            drug-provocation-challenge, other.'
        report_status:
          type: string
          enum:
          - preliminary
          - final
          - amended
          - cancelled
          - ''
          description: 'Report lifecycle status: preliminary, final, amended, cancelled.'
        performed_date:
          type: string
          format: date
          description: Date the allergy test was performed.
        reported_date:
          type: string
          format: date
          description: Date the report was authored / signed.
        clinical_history:
          type: string
          maxLength: 2000
          description: Clinical history and the question the test was performed to answer.
        antihistamines_withheld:
          type: boolean
          description: Whether antihistamines were withheld for an adequate washout before testing (skin-prick
            / intradermal validity precondition).
        positive_control_valid:
          type: boolean
          description: Whether the positive histamine control produced an adequate weal, confirming skin
            reactivity (test-validity control).
        allergens_tested:
          type: string
          maxLength: 2000
          description: Free-text list of allergens tested (e.g. house dust mite, peanut, amoxicillin).
        wheal_sizes:
          type: string
          maxLength: 2000
          description: Free-text record of measured weal sizes per allergen in millimetres (with positive
            / negative controls).
        specific_ige_results:
          type: string
          maxLength: 2000
          description: Free-text record of specific-IgE blood (sIgE) results per allergen in kUA/L, where
            performed.
        sensitised_allergens:
          type: string
          maxLength: 2000
          description: Free-text list of allergens to which sensitisation was demonstrated.
        positive_reactions:
          type: boolean
          description: Whether one or more positive reactions (weal >=3 mm over negative control, or raised
            sIgE) were recorded.
        sensitisation_confirmed:
          type: boolean
          description: Whether clinically relevant sensitisation was confirmed (positive result concordant
            with the clinical history).
        anaphylaxis_during_test:
          type: boolean
          description: Whether a systemic / anaphylactic reaction occurred during testing (critical safety
            event).
        all_negative:
          type: boolean
          description: Whether all tested allergens were negative.
        test_invalid:
          type: boolean
          description: Whether the test was invalid / non-interpretable (e.g. antihistamines not withheld,
            absent positive control, dermographism).
        interpretation:
          type: string
          maxLength: 2000
          description: Clinical interpretation of the reactions in the context of the history (sensitisation
            vs clinically relevant allergy).
        impression:
          type: string
          maxLength: 2000
          description: Summary impression / conclusion answering the clinical question.
        reporting_category:
          type: string
          maxLength: 50
          description: Free-text structured-reporting category label (e.g. a sensitisation pattern or
            component-resolved diagnostics summary).
        recommended_follow_up:
          type: string
          maxLength: 1000
          description: 'Recommended follow-up: allergen avoidance advice, oral food / drug challenge,
            immunotherapy referral, or further testing.'
        critical_result_communicated:
          type: boolean
          description: Whether a critical result (e.g. anaphylaxis during test, clinically significant
            new allergy) was communicated directly to the referrer / patient.
        reported_to:
          type: string
          maxLength: 500
          description: Who the critical / urgent result was communicated to, with date and time if applicable.
      required:
      - created_at
      - updated_at
      - patient_id
      - clinician_id
      - originating_request_reference
      - test_type
      - report_status
      - clinical_history
      - antihistamines_withheld
      - positive_control_valid
      - allergens_tested
      - wheal_sizes
      - specific_ige_results
      - sensitised_allergens
      - positive_reactions
      - sensitisation_confirmed
      - anaphylaxis_during_test
      - all_negative
      - test_invalid
      - interpretation
      - impression
      - reporting_category
      - recommended_follow_up
      - critical_result_communicated
      - reported_to
      description: Allergy skin test result (report). Captures the performed test type, clinical history,
        the pre-analytic validity controls (antihistamine washout, positive histamine control), the allergens
        tested and their measured weal sizes / specific-IgE results, the sensitised allergens and structured
        reaction summary, the clinical interpretation and impression, recommended follow-up, and critical-result
        communication. This is the source-of-truth record that the four-axis interpretation grade is computed
        from.
    AllergySkinTestResultGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        allergy_skin_test_result_id:
          type: string
          format: uuid
          description: Foreign key to the parent result (unique, 1:1).
        result_classification:
          type: string
          enum:
          - normal
          - abnormal
          - critical
          - inconclusive
          - ''
          description: 'Axis A overall classification: normal, abnormal, critical, inconclusive.'
        abnormality_severity:
          type: string
          enum:
          - none
          - minor
          - moderate
          - major
          - ''
          description: 'Axis B abnormality severity: none, minor, moderate, major.'
        reporting_category:
          type: string
          maxLength: 50
          description: Axis B structured-reporting score / category label (e.g. a sensitisation pattern
            or component-resolved diagnostics summary).
        report_completeness_percent:
          type: integer
          format: int32
          description: Axis C report completeness as a percentage of mandatory report sections (0-100).
        follow_up_urgency:
          type: string
          enum:
          - routine
          - recommended
          - urgent
          - critical-alert
          - ''
          description: 'Axis D follow-up urgency: routine, recommended, urgent, critical-alert.'
        target_timeframe:
          type: string
          maxLength: 50
          description: Target timeframe for the recommended follow-up implied by the urgency.
        recommended_action:
          type: string
          maxLength: 500
          description: Axis D concise recommended action derived from the urgency.
        recommendation:
          type: string
          enum:
          - no-action
          - routine-follow-up
          - further-testing
          - specialist-referral
          - urgent-review
          - ''
          description: 'Overall recommendation: no-action, routine-follow-up, further-testing, specialist-referral,
            urgent-review.'
        clinician_notes:
          type: string
          description: Free-text interpretation / sign-off notes.
        signed_at:
          type: string
          format: date-time
          description: Timestamp of the reporting clinician electronic signature.
        graded_at:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the result.
      required:
      - created_at
      - updated_at
      - allergy_skin_test_result_id
      - result_classification
      - abnormality_severity
      - reporting_category
      - follow_up_urgency
      - target_timeframe
      - recommended_action
      - recommendation
      - clinician_notes
      - graded_at
      description: 'Computed four-axis interpretation grade: result classification, abnormality severity
        / structured-reporting category, report completeness, and follow-up urgency. Clinically relevant
        sensitisation classifies as abnormal; anaphylaxis during the test classifies as critical and auto-escalates
        the follow-up urgency to critical-alert regardless of the other axes.'
