components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        name:
          type: string
          description: Name.
        email:
          type: string
          description: Email address.
        phone:
          type: string
          description: Phone number.
        postal_address_as_full_text:
          type: string
          description: Postal address as full text.
        country_as_iso_3166_1_alpha_2:
          type: string
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type: string
          description: Postal code, such as for validating the postal address.
        role:
          type: string
          enum:
          - nuclear-medicine-physician
          - radiologist
          - consultant
          - technologist
          - other
          - ''
          description: 'Reporting clinician role: nuclear-medicine-physician, radiologist, consultant,
            technologist, other.'
        registration_body:
          type: string
          enum:
          - GMC
          - HCPC
          - other
          - ''
          description: 'Clinician registration body: GMC, HCPC, other.'
        registration_number:
          type: string
          description: Clinician registration number.
        united_kingdom_nhs_number:
          type: string
          maxLength: 12
          description: United Kingdom NHS number, unique per person.
      required:
      - created_at
      - updated_at
      - name
      - role
      - registration_body
      - registration_number
      description: Reporting clinician (nuclear-medicine physician or radiologist) who authors and signs
        the nuclear medicine test result report.
    NuclearMedicineTestResult:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        patient_id:
          type: string
          format: uuid
          description: Foreign key to the patient.
        clinician_id:
          type: string
          format: uuid
          description: Foreign key to the reporting clinician (nuclear-medicine physician / radiologist).
        originating_request_reference:
          type: string
          maxLength: 255
          description: Free-text reference linking this report back to the originating nuclear medicine
            scan request (referral).
        report_status:
          type: string
          enum:
          - preliminary
          - final
          - amended
          - cancelled
          - ''
          description: 'Report lifecycle status: preliminary, final, amended, cancelled.'
        performed_date:
          type: string
          format: date
          description: Date the nuclear medicine examination was performed.
        reported_date:
          type: string
          format: date
          description: Date the report was authored / signed.
        scan_type:
          type: string
          enum:
          - bone-scan
          - myocardial-perfusion
          - vq-lung-scan
          - thyroid-uptake
          - renal-dmsa
          - renal-mag3
          - gallium-octreotide
          - white-cell-scan
          - sentinel-node
          - other
          - ''
          description: 'Radionuclide scan type: bone-scan, myocardial-perfusion, vq-lung-scan, thyroid-uptake,
            renal-dmsa, renal-mag3, gallium-octreotide, white-cell-scan, sentinel-node, other.'
        radiopharmaceutical:
          type: string
          maxLength: 255
          description: Radiopharmaceutical (tracer) administered, e.g. Tc-99m MDP, Tc-99m MAA, Tc-99m
            sestamibi, Tc-99m MAG3, Tc-99m DMSA, Ga-68 DOTATATE.
        injected_activity_mbq:
          type: number
          format: double
          description: Administered activity in megabecquerels (MBq), for dose audit (DRL comparison).
        examination_adequacy:
          type: string
          enum:
          - adequate
          - limited
          - non-diagnostic
          - ''
          description: 'Diagnostic adequacy of the examination: adequate, limited, non-diagnostic.'
        clinical_history:
          type: string
          maxLength: 1000
          description: Clinical history and the question the examination was performed to answer.
        comparison_with_previous:
          type: string
          maxLength: 1000
          description: Comparison with relevant previous imaging studies.
        findings_narrative:
          type: string
          maxLength: 2000
          description: Narrative description of the scintigraphic findings (the body of the report).
        abnormal_uptake:
          type: boolean
          description: Whether abnormal tracer uptake (focal or diffuse) is present.
        metastatic_pattern:
          type: boolean
          description: Whether a pattern suggestive of metastatic disease (e.g. multiple foci on bone
            scan) is present.
        perfusion_defect:
          type: boolean
          description: Whether a perfusion defect (e.g. myocardial or pulmonary) is present.
        photopenic_area:
          type: boolean
          description: Whether a photopenic (reduced-uptake / cold) area is present.
        no_significant_abnormality:
          type: boolean
          description: Whether the study shows no significant abnormality.
        incidental_finding:
          type: boolean
          description: Whether one or more incidental findings warranting documentation are present.
        ejection_fraction_percent:
          type: number
          format: double
          description: Left-ventricular ejection fraction percentage, where gated cardiac studies are
            performed (0-100).
        split_function_left_percent:
          type: number
          format: double
          description: Left-kidney split (differential) function percentage, for renal studies (0-100).
        split_function_right_percent:
          type: number
          format: double
          description: Right-kidney split (differential) function percentage, for renal studies (0-100).
        impression:
          type: string
          maxLength: 2000
          description: Summary impression / conclusion answering the clinical question.
        reporting_category:
          type: string
          maxLength: 100
          description: Free-text structured-reporting category label, e.g. PE probability for a V/Q study
            (normal / very-low / intermediate / high) or a bone-scan flare category.
        recommended_follow_up:
          type: string
          maxLength: 1000
          description: Recommended follow-up imaging, referral, or management.
        critical_result_communicated:
          type: boolean
          description: Whether a critical or unexpected significant result was communicated directly to
            the referrer.
        reported_to:
          type: string
          maxLength: 500
          description: Who the critical / urgent result was communicated to, with date and time if applicable.
      required:
      - created_at
      - updated_at
      - patient_id
      - clinician_id
      - originating_request_reference
      - report_status
      - scan_type
      - radiopharmaceutical
      - examination_adequacy
      - clinical_history
      - comparison_with_previous
      - findings_narrative
      - abnormal_uptake
      - metastatic_pattern
      - perfusion_defect
      - photopenic_area
      - no_significant_abnormality
      - incidental_finding
      - impression
      - reporting_category
      - recommended_follow_up
      - critical_result_communicated
      - reported_to
      description: Nuclear medicine (radionuclide scan) result (report). Captures the performed examination,
        the radiopharmaceutical and injected activity, clinical history, the narrative and structured
        findings, key quantitative measurements (e.g. ejection fraction, split renal function), the impression
        and structured reporting category (e.g. V/Q PE probability), recommended follow-up, and critical-result
        communication. This is the source-of-truth record that the four-axis interpretation grade is computed
        from.
    NuclearMedicineTestResultGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        nuclear_medicine_test_result_id:
          type: string
          format: uuid
          description: Foreign key to the parent result (unique, 1:1).
        result_classification:
          type: string
          enum:
          - normal
          - abnormal
          - critical
          - inconclusive
          - ''
          description: 'Axis A overall classification: normal, abnormal, critical, inconclusive.'
        abnormality_severity:
          type: string
          enum:
          - none
          - minor
          - moderate
          - major
          - ''
          description: 'Axis B abnormality severity: none, minor, moderate, major.'
        reporting_category:
          type: string
          maxLength: 50
          description: Axis B structured-reporting score / category label (e.g. a V/Q PE-probability category
            or bone-scan flare category).
        report_completeness_percent:
          type: integer
          format: int32
          description: Axis C report completeness as a percentage of mandatory report sections (0-100).
        follow_up_urgency:
          type: string
          enum:
          - routine
          - recommended
          - urgent
          - critical-alert
          - ''
          description: 'Axis D follow-up urgency: routine, recommended, urgent, critical-alert.'
        target_timeframe:
          type: string
          maxLength: 50
          description: Target timeframe for the recommended follow-up implied by the urgency.
        recommended_action:
          type: string
          maxLength: 500
          description: Axis D concise recommended action derived from the urgency.
        recommendation:
          type: string
          enum:
          - no-action
          - routine-follow-up
          - further-imaging
          - specialist-referral
          - urgent-review
          - ''
          description: 'Overall recommendation: no-action, routine-follow-up, further-imaging, specialist-referral,
            urgent-review.'
        clinician_notes:
          type: string
          description: Free-text interpretation / sign-off notes.
        signed_at:
          type: string
          format: date-time
          description: Timestamp of the reporting clinician electronic signature.
        graded_at:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the result.
      required:
      - created_at
      - updated_at
      - nuclear_medicine_test_result_id
      - result_classification
      - abnormality_severity
      - reporting_category
      - follow_up_urgency
      - target_timeframe
      - recommended_action
      - recommendation
      - clinician_notes
      - graded_at
      description: 'Computed four-axis interpretation grade: result classification, abnormality severity
        / structured-reporting category, report completeness, and follow-up urgency. A critical result
        (e.g. high-probability PE on V/Q, widespread metastatic pattern) auto-escalates the follow-up
        urgency to critical-alert regardless of the other axes.'
    NuclearMedicineTestResultGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
