components:
  schemas:
    BronchoscopyTestResult:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the patient.
        clinicianId:
          type: string
          format: uuid
          description: Foreign key to the operating / reporting clinician (bronchoscopist).
        originatingRequestReference:
          type: string
          maxLength: 255
          description: Free-text reference linking this report back to the originating bronchoscopy request
            (referral).
        reportStatus:
          type: string
          enum:
          - preliminary
          - final
          - amended
          - cancelled
          - ''
          description: 'Report lifecycle status: preliminary, final, amended, cancelled.'
        performedDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the bronchoscopy procedure was performed.
        reportedDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the report was authored / signed.
        procedure:
          type: string
          enum:
          - flexible-bronchoscopy
          - ebus
          - rigid-bronchoscopy
          - bronchoalveolar-lavage
          - other
          - ''
          description: 'Performed procedure: flexible-bronchoscopy, ebus, rigid-bronchoscopy, bronchoalveolar-lavage,
            other.'
        sedationUsed:
          type: string
          enum:
          - none
          - local
          - conscious
          - deep
          - general
          - ''
          description: 'Sedation actually used: none, local, conscious, deep, general.'
        extentExamined:
          type: string
          maxLength: 1000
          description: Extent of the airway examined (e.g. trachea, carina, lobar and segmental bronchi
            reached).
        clinicalHistory:
          type: string
          maxLength: 1000
          description: Clinical history and the question the procedure was performed to answer.
        endobronchialLesion:
          type: boolean
          description: Whether an endobronchial lesion (e.g. tumour, mass) is present.
        mucosalAbnormality:
          type: boolean
          description: Whether a mucosal abnormality (e.g. erythema, infiltration, nodularity) is present.
        extrinsicCompression:
          type: boolean
          description: Whether extrinsic compression of the airway is present.
        bleeding:
          type: boolean
          description: Whether active bleeding or haemorrhage was observed.
        foreignBody:
          type: boolean
          description: Whether a foreign body is present in the airway.
        secretionsPurulent:
          type: boolean
          description: Whether purulent secretions are present (suggesting infection).
        normalExamination:
          type: boolean
          description: Whether the examination was entirely normal with no abnormal findings.
        lesionLocation:
          type: string
          maxLength: 255
          description: Anatomical location of the lesion or abnormality (e.g. right upper lobe bronchus).
        samplesTaken:
          type: string
          maxLength: 1000
          description: Samples taken during the procedure (e.g. biopsy, BAL, brushings, EBUS-TBNA).
        complication:
          type: string
          enum:
          - none
          - bleeding
          - pneumothorax
          - hypoxia
          - other
          - ''
          description: 'Procedural complication: none, bleeding, pneumothorax, hypoxia, other.'
        findingsNarrative:
          type: string
          maxLength: 2000
          description: Narrative description of the procedure findings (the body of the report).
        impression:
          type: string
          maxLength: 2000
          description: Summary impression / conclusion answering the clinical question.
        reportingCategory:
          type: string
          maxLength: 100
          description: Structured-reporting score / category label (e.g. a lung-cancer-pathway or endobronchial-findings
            category).
        recommendedFollowUp:
          type: string
          maxLength: 1000
          description: Recommended follow-up, referral (e.g. lung-cancer MDT), or management.
        criticalResultCommunicated:
          type: boolean
          description: Whether a critical or unexpected significant result was communicated directly to
            the referrer / team.
        reportedTo:
          type: string
          maxLength: 500
          description: Who the critical / urgent result was communicated to, with date and time if applicable.
      required:
      - createdAt
      - updatedAt
      - patientId
      - clinicianId
      - originatingRequestReference
      - reportStatus
      - procedure
      - sedationUsed
      - extentExamined
      - clinicalHistory
      - endobronchialLesion
      - mucosalAbnormality
      - extrinsicCompression
      - bleeding
      - foreignBody
      - secretionsPurulent
      - normalExamination
      - lesionLocation
      - samplesTaken
      - complication
      - findingsNarrative
      - impression
      - reportingCategory
      - recommendedFollowUp
      - criticalResultCommunicated
      - reportedTo
      description: Bronchoscopy (airway endoscopy) result (procedure report). Captures the performed procedure,
        sedation and extent examined, the clinical history, the narrative and structured findings, samples
        taken, any complication, the impression, recommended follow-up, and critical-result communication.
        This is the source-of-truth record that the four-axis interpretation grade is computed from.
    BronchoscopyTestResultGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        bronchoscopyTestResultId:
          type: string
          format: uuid
          description: Foreign key to the parent result (unique, 1:1).
        resultClassification:
          type: string
          enum:
          - normal
          - abnormal
          - critical
          - inconclusive
          - ''
          description: 'Axis A overall classification: normal, abnormal, critical, inconclusive.'
        abnormalitySeverity:
          type: string
          enum:
          - none
          - minor
          - moderate
          - major
          - ''
          description: 'Axis B abnormality severity: none, minor, moderate, major.'
        reportingCategory:
          type: string
          maxLength: 50
          description: Axis B structured-reporting score / category label (e.g. a lung-cancer-pathway
            or endobronchial-findings category).
        reportCompletenessPercent:
          type:
          - integer
          - 'null'
          format: int32
          description: Axis C report completeness as a percentage of mandatory report sections (0-100).
        followUpUrgency:
          type: string
          enum:
          - routine
          - recommended
          - urgent
          - critical-alert
          - ''
          description: 'Axis D follow-up urgency: routine, recommended, urgent, critical-alert.'
        targetTimeframe:
          type: string
          maxLength: 50
          description: Target timeframe for the recommended follow-up implied by the urgency.
        recommendedAction:
          type: string
          maxLength: 500
          description: Axis D concise recommended action derived from the urgency.
        recommendation:
          type: string
          enum:
          - no-action
          - routine-follow-up
          - further-imaging
          - specialist-referral
          - urgent-review
          - ''
          description: 'Overall recommendation: no-action, routine-follow-up, further-imaging, specialist-referral,
            urgent-review.'
        clinicianNotes:
          type: string
          description: Free-text interpretation / sign-off notes.
        signedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Timestamp of the reporting clinician electronic signature.
        gradedAt:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the result.
      required:
      - createdAt
      - updatedAt
      - bronchoscopyTestResultId
      - resultClassification
      - abnormalitySeverity
      - reportingCategory
      - followUpUrgency
      - targetTimeframe
      - recommendedAction
      - recommendation
      - clinicianNotes
      - gradedAt
      description: 'Computed four-axis interpretation grade: result classification, abnormality severity
        / structured-reporting category, report completeness, and follow-up urgency. A critical result
        (e.g. suspected tumour, massive haemoptysis, pneumothorax) auto-escalates the follow-up urgency
        to critical-alert regardless of the other axes.'
    BronchoscopyTestResultGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        bronchoscopyTestResultGradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        flagId:
          type: string
          maxLength: 50
          description: Stable flag identifier (e.g. F-CRITICAL-RESULT-001).
        category:
          type: string
          enum:
          - critical-result-alert
          - incidental-finding
          - discrepancy-with-request
          - abnormal-requiring-action
          - urgent-referral
          - inadequate-technique
          - unexpected-finding
          - missing-impression
          - missing-measurement
          - other
          - ''
          description: Flag category.
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          - ''
          description: 'Priority: low, medium, high.'
        description:
          type: string
          maxLength: 500
          description: Human-readable description of what fired the flag.
        suggestedAction:
          type: string
          maxLength: 500
          description: Suggested clinical action (e.g. "communicate critical result to referrer and refer
            to lung-cancer MDT").
      required:
      - createdAt
      - updatedAt
      - bronchoscopyTestResultGradeId
      - flagId
      - category
      - priority
      - description
      - suggestedAction
      description: Safety-critical flags that fire independently of the four axes, with priority and a
        suggested action for the reporting / referring team.
    BronchoscopyTestResultGradeRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        bronchoscopyTestResultGradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        ruleId:
          type: string
          maxLength: 40
          description: Stable rule identifier (e.g. R-CLASS-CRITICAL-01).
        axis:
          type: string
          enum:
          - classification
          - severity
          - completeness
          - follow-up
          - ''
          description: 'Scoring axis the rule belongs to: classification, severity, completeness, follow-up.'
        category:
          type: string
          maxLength: 50
          description: Category or finding the rule relates to.
        description:
          type: string
          maxLength: 500
          description: Human-readable description of why the rule fired.
      required:
      - createdAt
      - updatedAt
      - bronchoscopyTestResultGradeId
      - ruleId
      - axis
      - category
      - description
      description: Audit trail of every classification / severity / completeness / follow-up rule that
        fired for this result.
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Name.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
