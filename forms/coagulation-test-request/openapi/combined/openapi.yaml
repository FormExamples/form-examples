components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        name:
          type: string
          description: Name.
        email:
          type: string
          description: Email address.
        phone:
          type: string
          description: Phone number.
        postal_address_as_full_text:
          type: string
          description: Postal address as full text.
        country_as_iso_3166_1_alpha_2:
          type: string
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type: string
          description: Postal code, such as for validating the postal address.
        role:
          type: string
          enum:
          - gp
          - hospital-doctor
          - haematologist
          - nurse
          - other
          - ''
          description: 'Clinician role: gp, hospital-doctor, haematologist, nurse, other.'
        registration_body:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - other
          - ''
          description: 'Clinician registration body: GMC, NMC, HCPC, other.'
        registration_number:
          type: string
          description: Clinician registration number.
        united_kingdom_nhs_number:
          type: string
          maxLength: 12
          description: United Kingdom NHS number, unique per person.
      required:
      - created_at
      - updated_at
      - name
      - role
      - registration_body
      - registration_number
      description: Requesting clinician (referrer) who completes the coagulation test request.
    CoagulationTestRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        patient_id:
          type: string
          format: uuid
          description: Foreign key to the patient.
        clinician_id:
          type: string
          format: uuid
          description: Foreign key to the requesting clinician (referrer).
        status:
          type: string
          enum:
          - draft
          - submitted
          - vetted
          - collected
          - rejected
          - ''
          description: 'Request lifecycle status: draft, submitted, vetted, collected, rejected.'
        site_name:
          type: string
          maxLength: 255
          description: Name of the requesting site or clinic.
        setting:
          type: string
          enum:
          - outpatient
          - inpatient
          - community
          - emergency
          - ''
          description: 'Care setting: outpatient, inpatient, community, emergency.'
        referral_date:
          type: string
          format: date
          description: Date the referral was made.
        requested_by_date:
          type: string
          format: date
          description: Date by which the tests are requested to be performed.
        prothrombin_time_inr:
          type: boolean
          description: Whether prothrombin time / INR is requested.
        activated_partial_thromboplastin_time:
          type: boolean
          description: Whether activated partial thromboplastin time (APTT) is requested.
        fibrinogen:
          type: boolean
          description: Whether a fibrinogen (Clauss) assay is requested.
        d_dimer:
          type: boolean
          description: Whether a D-dimer assay is requested.
        thrombophilia_screen:
          type: boolean
          description: Whether a thrombophilia screen is requested.
        factor_assays:
          type: boolean
          description: Whether specific coagulation factor assays are requested.
        anti_xa_assay:
          type: boolean
          description: Whether an anti-Xa assay (e.g. for LMWH / DOAC level) is requested.
        mixing_studies:
          type: boolean
          description: Whether mixing studies (to investigate a prolonged clotting time) are requested.
        von_willebrand_screen:
          type: boolean
          description: Whether a von Willebrand screen is requested.
        primary_indication:
          type: string
          enum:
          - anticoagulation-monitoring
          - bleeding-disorder
          - suspected-dvt-pe
          - pre-operative
          - thrombophilia-investigation
          - liver-disease
          - disseminated-intravascular-coagulation
          - abnormal-bleeding
          - other
          - ''
          description: Primary clinical indication, used for appropriateness scoring.
        clinical_details:
          type: string
          maxLength: 1000
          description: Free-text clinical details supporting the request (highest-value field).
        on_anticoagulant:
          type: boolean
          description: Whether the patient is currently on an anticoagulant.
        anticoagulant_agent:
          type: string
          maxLength: 255
          description: Name of the anticoagulant agent, if any (e.g. warfarin, apixaban, LMWH).
        bleeding_history:
          type: boolean
          description: Whether the patient has a personal or family bleeding history.
        thrombosis_history:
          type: boolean
          description: Whether the patient has a personal or family thrombosis history.
        specimen_collected:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Whether the specimen has been collected: yes, no.'
        collection_datetime:
          type: string
          format: date-time
          description: Timestamp the specimen was collected (citrate-sample analysis timing matters).
        urgency:
          type: string
          enum:
          - routine
          - urgent
          - stat
          - ''
          description: 'Requested triage urgency: routine, urgent, stat.'
        supervising_consultant:
          type: string
          maxLength: 255
          description: Name of the supervising / responsible consultant.
        requester_contact:
          type: string
          maxLength: 255
          description: Contact details (bleep / phone) for the requester.
        notes:
          type: string
          maxLength: 1000
          description: Free-text additional notes.
      required:
      - created_at
      - updated_at
      - patient_id
      - clinician_id
      - status
      - site_name
      - setting
      - prothrombin_time_inr
      - activated_partial_thromboplastin_time
      - fibrinogen
      - d_dimer
      - thrombophilia_screen
      - factor_assays
      - anti_xa_assay
      - mixing_studies
      - von_willebrand_screen
      - primary_indication
      - clinical_details
      - on_anticoagulant
      - anticoagulant_agent
      - bleeding_history
      - thrombosis_history
      - specimen_collected
      - urgency
      - supervising_consultant
      - requester_contact
      - notes
      description: Coagulation / haemostasis blood-test order (request). Captures the requested coagulation
        tests (booleans), the clinical indication and details, anticoagulant and bleeding / thrombosis
        history, pre-analytical / specimen handling (citrate tube fill, ratio, timing), and triage urgency.
    CoagulationTestRequestGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        coagulation_test_request_id:
          type: string
          format: uuid
          description: Foreign key to the parent request (unique, 1:1).
        appropriateness_score:
          type: integer
          format: int32
          description: Appropriateness score (1-9), anchored on BSH indication and retest-interval match;
            there is no single published 1-9 coagulation-ordering score.
        appropriateness_band:
          type: string
          enum:
          - usually-appropriate
          - may-be-appropriate
          - usually-not-appropriate
          - ''
          description: 'Appropriateness band: usually-appropriate (7-9), may-be-appropriate (4-6), usually-not-appropriate
            (1-3).'
        preanalytical_band:
          type: string
          enum:
          - ok
          - caution
          - reject-risk
          - ''
          description: 'Pre-analytical / specimen safety band: ok, caution, reject-risk (citrate tube
            fill / ratio correct? specimen collected? analysed in time?).'
        completeness_percent:
          type: integer
          format: int32
          description: Request completeness as a percentage of mandatory fields (0-100).
        triage_tier:
          type: string
          enum:
          - routine
          - urgent
          - stat
          - ''
          description: 'Assigned triage tier: routine, urgent, stat.'
        target_timeframe:
          type: string
          maxLength: 50
          description: Target timeframe for the tests implied by the triage tier (e.g. active bleeding
            / DIC -> stat).
        recommendation:
          type: string
          enum:
          - accept
          - query-referrer
          - redirect
          - reject
          - ''
          description: 'Vetting recommendation: accept, query-referrer, redirect, reject.'
        clinician_notes:
          type: string
          description: Free-text vetting notes.
        signed_at:
          type: string
          format: date-time
          description: Timestamp of vetting clinician electronic signature.
        graded_at:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the result.
      required:
      - created_at
      - updated_at
      - coagulation_test_request_id
      - appropriateness_band
      - preanalytical_band
      - triage_tier
      - target_timeframe
      - recommendation
      - clinician_notes
      - graded_at
      description: 'Computed four-axis grading result: appropriateness (1-9 anchored on BSH indication
        / retest-interval match), pre-analytical / specimen safety (citrate tube fill / ratio / timing),
        request completeness, and triage priority.'
    CoagulationTestRequestGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        coagulation_test_request_grade_id:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        flag_id:
          type: string
          maxLength: 50
          description: Stable flag identifier (e.g. F-ACTIVE-BLEEDING-001).
        category:
          type: string
          enum:
          - active-bleeding-stat
          - suspected-dic
          - d-dimer-low-pretest-caution
          - specimen-underfilled-risk
          - missing-clinical-details
          - no-test-selected
          - other
          - ''
          description: Flag category.
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          - ''
          description: 'Priority: low, medium, high.'
        description:
          type: string
          maxLength: 500
          description: Human-readable description of what fired the flag.
        suggested_action:
          type: string
          maxLength: 500
          description: Suggested clinical action (e.g. "discuss with on-call haematologist, process as
            STAT").
      required:
      - created_at
      - updated_at
      - coagulation_test_request_grade_id
      - flag_id
      - category
      - priority
      - description
      - suggested_action
