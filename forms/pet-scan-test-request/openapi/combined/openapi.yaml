      description: Patient
    PetScanTestRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        patient_id:
          type: string
          format: uuid
          description: Foreign key to the patient.
        clinician_id:
          type: string
          format: uuid
          description: Foreign key to the requesting clinician (referrer).
        status:
          type: string
          enum:
          - draft
          - submitted
          - vetted
          - scheduled
          - rejected
          - ''
          description: 'Request lifecycle status: draft, submitted, vetted, scheduled, rejected.'
        site_name:
          type: string
          maxLength: 255
          description: Name of the requesting site or clinic.
        setting:
          type: string
          enum:
          - outpatient
          - inpatient
          - community
          - emergency
          - ''
          description: 'Care setting: outpatient, inpatient, community, emergency.'
        referral_date:
          type: string
          format: date
          description: Date the referral was made.
        requested_by_date:
          type: string
          format: date
          description: Date by which the scan is requested to be performed.
        scan_type:
          type: string
          enum:
          - fdg-pet-ct
          - psma-pet
          - dotatate-pet
          - amyloid-pet
          - cardiac-pet
          - other
          - ''
          description: 'Requested PET tracer / scan type: fdg-pet-ct, psma-pet, dotatate-pet, amyloid-pet,
            cardiac-pet, other.'
        primary_indication:
          type: string
          enum:
          - cancer-staging
          - cancer-restaging
          - treatment-response
          - suspected-recurrence
          - solitary-pulmonary-nodule
          - lymphoma
          - cardiac-viability
          - infection-inflammation
          - neurology-dementia
          - other
          - ''
          description: Primary clinical indication, used for appropriateness scoring.
        clinical_question:
          type: string
          maxLength: 1000
          description: Specific clinical question the scan should answer (highest-value field).
        relevant_history:
          type: string
          maxLength: 1000
          description: Relevant medical, oncological, and treatment history.
        primary_tumour_site:
          type: string
          maxLength: 255
          description: Primary tumour site or suspected primary, where applicable.
        diabetes:
          type: boolean
          description: Whether the patient has diabetes (affects FDG glucose control / preparation).
        blood_glucose_mmol_l:
          type: number
          format: double
          description: Most-recent blood glucose in mmol/L; FDG uptake needs glucose control, typically
            below 11 mmol/L.
        pregnancy_status:
          type: string
          enum:
          - not-pregnant
          - pregnant
          - possible
          - unknown
          - not-applicable
          - ''
          description: 'Pregnancy status: not-pregnant, pregnant, possible, unknown, not-applicable.'
        breastfeeding:
          type: boolean
          description: Whether the patient is currently breastfeeding (radiopharmaceutical precaution).
        egfr:
          type: number
          format: double
          description: Estimated glomerular filtration rate (mL/min/1.73m2), for any iodinated CT contrast.
        recent_chemo_radiotherapy:
          type: string
          maxLength: 1000
          description: Recent chemotherapy / radiotherapy details and dates (affect timing and uptake).
        claustrophobia:
          type: boolean
          description: Whether the patient has claustrophobia (may need support or sedation).
        weight_kg:
          type: number
          format: double
          description: Patient weight in kg, used for tracer dosing and table limits.
        urgency:
          type: string
          enum:
          - routine
          - urgent
          - emergency
          - ''
          description: 'Requested triage urgency: routine, urgent, emergency.'
        ir_me_r_justification:
          type: string
          maxLength: 1000
          description: IR(ME)R justification statement supporting the radiation exposure.
        supervising_consultant:
          type: string
          maxLength: 255
          description: Name of the supervising / responsible consultant.
        requester_contact:
          type: string
          maxLength: 255
          description: Contact details (bleep / phone) for the requester.
        notes:
          type: string
          maxLength: 1000
          description: Free-text additional notes.
      required:
      - created_at
      - updated_at
      - patient_id
      - clinician_id
      - status
      - site_name
      - setting
      - scan_type
      - primary_indication
      - clinical_question
      - relevant_history
      - primary_tumour_site
      - diabetes
      - pregnancy_status
      - breastfeeding
      - recent_chemo_radiotherapy
      - claustrophobia
      - urgency
      - ir_me_r_justification
      - supervising_consultant
      - requester_contact
      - notes
      description: PET-CT scan request (referral). Captures the requested tracer / scan type, the clinical
        indication and question, primary tumour site, FDG-PET patient-preparation and safety data (glucose
        control, pregnancy, breastfeeding, renal function), IR(ME)R justification, and triage urgency.
