components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Name.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as full text.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code, such as for validating the postal address.
        role:
          type: string
          enum:
          - radiologist
          - nuclear-medicine-physician
          - oncologist
          - gp
          - hospital-doctor
          - technologist
          - other
          - ''
          description: 'Clinician role: radiologist, nuclear-medicine-physician, oncologist, gp, hospital-doctor,
            technologist, other.'
        registrationBody:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - other
          - ''
          description: 'Clinician registration body: GMC, NMC, HCPC, other.'
        registrationNumber:
          type: string
          description: Clinician registration number.
        unitedKingdomNhsNumber:
          type:
          - string
          - 'null'
          maxLength: 12
          description: United Kingdom NHS number, unique per person.
      required:
      - createdAt
      - updatedAt
      - name
      - role
      - registrationBody
      - registrationNumber
      description: Requesting clinician (referrer) who completes the PET scan request.
    Patient:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          maxLength: 255
          description: Name.
        birthDate:
          type: string
          format: date
          description: Birth date.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as full text.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code, such as for validating the postal address.
        unitedKingdomNhsNumber:
          type:
          - string
          - 'null'
          maxLength: 20
          description: United Kingdom NHS number, unique per person.
        waistAsCm:
          type:
          - number
          - 'null'
          format: double
          description: Waist circumference measurement in cm, such as for calculating waist-height ratio
            (WHR).
        heightAsCm:
          type:
          - number
          - 'null'
          format: double
          description: Height measurement in cm, such as for calculating waist-height ratio (WHR).
        weightAsKg:
          type:
          - number
          - 'null'
          format: double
          description: Weight as kg.
        bodyMassIndex:
          type:
          - number
          - 'null'
          format: double
          description: Body mass index (BMI) measurement.
        waistHeightRatio:
          type:
          - number
          - 'null'
          format: double
          description: Waist-height ratio (WHR) measurement.
        vo2Max:
          type:
          - number
          - 'null'
          format: double
          description: VO2 max measurement.
      required:
      - createdAt
      - updatedAt
      - name
      - birthDate
      description: Patient
    PetScanTestRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the patient.
        clinicianId:
          type: string
          format: uuid
          description: Foreign key to the requesting clinician (referrer).
        status:
          type: string
          enum:
          - draft
          - submitted
          - vetted
          - scheduled
          - rejected
          - ''
          description: 'Request lifecycle status: draft, submitted, vetted, scheduled, rejected.'
        siteName:
          type: string
          maxLength: 255
          description: Name of the requesting site or clinic.
        setting:
          type: string
          enum:
          - outpatient
          - inpatient
          - community
          - emergency
          - ''
          description: 'Care setting: outpatient, inpatient, community, emergency.'
        referralDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the referral was made.
        requestedByDate:
          type:
          - string
          - 'null'
          format: date
          description: Date by which the scan is requested to be performed.
        scanType:
          type: string
          enum:
          - fdg-pet-ct
          - psma-pet
          - dotatate-pet
          - amyloid-pet
          - cardiac-pet
          - other
          - ''
          description: 'Requested PET tracer / scan type: fdg-pet-ct, psma-pet, dotatate-pet, amyloid-pet,
            cardiac-pet, other.'
        primaryIndication:
          type: string
          enum:
          - cancer-staging
          - cancer-restaging
          - treatment-response
          - suspected-recurrence
          - solitary-pulmonary-nodule
          - lymphoma
          - cardiac-viability
          - infection-inflammation
          - neurology-dementia
          - other
          - ''
          description: Primary clinical indication, used for appropriateness scoring.
        clinicalQuestion:
          type: string
          maxLength: 1000
          description: Specific clinical question the scan should answer (highest-value field).
        relevantHistory:
          type: string
          maxLength: 1000
          description: Relevant medical, oncological, and treatment history.
        primaryTumourSite:
          type: string
          maxLength: 255
          description: Primary tumour site or suspected primary, where applicable.
        diabetes:
          type: boolean
          description: Whether the patient has diabetes (affects FDG glucose control / preparation).
        bloodGlucoseMmolL:
          type:
          - number
          - 'null'
          format: double
          description: Most-recent blood glucose in mmol/L; FDG uptake needs glucose control, typically
            below 11 mmol/L.
        pregnancyStatus:
          type: string
          enum:
          - not-pregnant
          - pregnant
          - possible
          - unknown
          - not-applicable
          - ''
          description: 'Pregnancy status: not-pregnant, pregnant, possible, unknown, not-applicable.'
        breastfeeding:
          type: boolean
          description: Whether the patient is currently breastfeeding (radiopharmaceutical precaution).
        egfr:
          type:
          - number
          - 'null'
          format: double
          description: Estimated glomerular filtration rate (mL/min/1.73m2), for any iodinated CT contrast.
        recentChemoRadiotherapy:
          type: string
          maxLength: 1000
          description: Recent chemotherapy / radiotherapy details and dates (affect timing and uptake).
        claustrophobia:
          type: boolean
          description: Whether the patient has claustrophobia (may need support or sedation).
        weightKg:
          type:
          - number
          - 'null'
          format: double
          description: Patient weight in kg, used for tracer dosing and table limits.
        urgency:
          type: string
          enum:
          - routine
          - urgent
          - emergency
          - ''
          description: 'Requested triage urgency: routine, urgent, emergency.'
        irMeRJustification:
          type: string
          maxLength: 1000
          description: IR(ME)R justification statement supporting the radiation exposure.
        supervisingConsultant:
          type: string
          maxLength: 255
          description: Name of the supervising / responsible consultant.
        requesterContact:
          type: string
          maxLength: 255
          description: Contact details (bleep / phone) for the requester.
        notes:
          type: string
          maxLength: 1000
          description: Free-text additional notes.
      required:
      - createdAt
      - updatedAt
      - patientId
      - clinicianId
      - status
      - siteName
      - setting
      - scanType
      - primaryIndication
      - clinicalQuestion
      - relevantHistory
      - primaryTumourSite
      - diabetes
      - pregnancyStatus
      - breastfeeding
      - recentChemoRadiotherapy
      - claustrophobia
      - urgency
      - irMeRJustification
      - supervisingConsultant
      - requesterContact
      - notes
      description: PET-CT scan request (referral). Captures the requested tracer / scan type, the clinical
        indication and question, primary tumour site, FDG-PET patient-preparation and safety data (glucose
        control, pregnancy, breastfeeding, renal function), IR(ME)R justification, and triage urgency.
    PetScanTestRequestGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        petScanTestRequestId:
          type: string
          format: uuid
          description: Foreign key to the parent request (unique, 1:1).
        appropriatenessScore:
          type:
          - integer
          - 'null'
          format: int32
          description: ACR Appropriateness Criteria / RCR iRefer score (1-9).
        appropriatenessBand:
          type: string
          enum:
          - usually-appropriate
          - may-be-appropriate
          - usually-not-appropriate
          - ''
          description: 'Appropriateness band: usually-appropriate (7-9), may-be-appropriate (4-6), usually-not-appropriate
            (1-3).'
        prepSafetyBand:
          type: string
          enum:
          - ok
          - caution
          - contraindicated
          - ''
          description: 'Preparation / safety band driven by glucose control, pregnancy, and breastfeeding:
            ok, caution, contraindicated.'
        radiationDoseBand:
          type: string
          enum:
          - low
          - moderate
          - high
          - ''
          description: 'Relative radiation-dose band for the requested study: low, moderate, high.'
        completenessPercent:
          type:
          - integer
          - 'null'
          format: int32
          description: Request completeness as a percentage of mandatory fields (0-100).
        triageTier:
          type: string
          enum:
          - routine
          - urgent
          - emergency
          - ''
          description: 'Assigned triage tier: routine, urgent, emergency.'
        targetTimeframe:
          type: string
          maxLength: 50
          description: Target timeframe for the scan implied by the triage tier.
        recommendation:
          type: string
          enum:
          - accept
          - query-referrer
          - redirect
          - reject
          - ''
          description: 'Vetting recommendation: accept, query-referrer, redirect, reject.'
        clinicianNotes:
          type: string
          description: Free-text vetting notes.
        signedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Timestamp of vetting clinician electronic signature.
        gradedAt:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the result.
      required:
      - createdAt
      - updatedAt
      - petScanTestRequestId
      - appropriatenessBand
      - prepSafetyBand
      - radiationDoseBand
      - triageTier
      - targetTimeframe
