            lines.
        descent_fifths:
          type: number
          format: double
          description: Descent of the fetal head in fifths palpable above the pelvic brim (5 down to 0).
        contractions_per_10_min:
          type: number
          format: double
          description: 'Uterine contraction frequency: number of contractions in 10 minutes.'
        contraction_duration_band:
          type: string
          enum:
          - <20s
          - 20-40s
          - '>40s'
          - ''
          description: 'Contraction duration band: <20s, 20-40s, or >40s.'
        contraction_strength:
          type: string
          enum:
          - mild
          - moderate
          - strong
          - ''
          description: 'Contraction strength on palpation: mild, moderate, or strong.'
        fetal_heart_rate:
          type: integer
          format: int32
          description: Fetal heart rate in beats per minute.
        liquor_state:
          type: string
          enum:
          - intact
          - clear
          - meconium
          - blood-stained
          - absent
          - ''
          description: 'Amniotic fluid (liquor) state: intact, clear, meconium, blood-stained, or absent.'
        moulding:
          type: string
          enum:
          - '0'
          - +
          - ++
          - +++
          - ''
          description: 'Degree of fetal skull moulding: 0, +, ++, or +++.'
        systolic_blood_pressure:
          type: integer
          format: int32
          description: Maternal systolic blood pressure in mmHg.
        diastolic_blood_pressure:
          type: integer
          format: int32
          description: Maternal diastolic blood pressure in mmHg.
        pulse:
          type: integer
          format: int32
          description: Maternal pulse in beats per minute.
        temperature:
          type: number
          format: double
          description: Maternal temperature in degrees Celsius.
        urine_volume_ml:
          type: number
          format: double
          description: Volume of urine passed in millilitres.
        urine_protein:
          type: string
          enum:
          - negative
          - trace
          - +
          - ++
          - +++
          - ''
          description: 'Urine protein dipstick: negative, trace, +, ++, or +++.'
        urine_ketones:
          type: string
          enum:
          - negative
          - trace
          - +
          - ++
          - +++
          - ''
          description: 'Urine ketones (acetone) dipstick: negative, trace, +, ++, or +++.'
        urine_glucose:
          type: string
          enum:
          - negative
          - trace
          - +
          - ++
          - +++
          - ''
          description: 'Urine glucose dipstick: negative, trace, +, ++, or +++.'
        oxytocin_rate:
          type: number
          format: double
          description: Oxytocin infusion rate (drops per minute or mU/min).
        drugs_and_fluids:
          type: string
          description: Free-text record of other drugs and intravenous fluids given.
      required:
      - created_at
      - updated_at
      - partogram_id
      - contraction_duration_band
      - contraction_strength
      - liquor_state
      - moulding
      - urine_protein
      - urine_ketones
      - urine_glucose
      - drugs_and_fluids
      description: 'Timed intrapartum observation rows for a partogram: labour progress, contractions,
        fetal heart rate, liquor and moulding, maternal vitals, urine, and drugs / oxytocin.'
    Patient:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        name:
          type: string
          maxLength: 255
          description: Full patient name as recorded on the wristband.
        birth_date:
          type: string
          format: date
          description: Date of birth.
        sex:
          type: string
          enum:
          - female
          - male
          - intersex
          - unknown
          - ''
          description: 'Sex recorded for clinical purposes: female, male, intersex, or unknown.'
        email:
          type: string
          description: Email address.
        phone:
          type: string
          description: Phone number.
        postal_address_as_full_text:
          type: string
          description: Postal address as a single text block.
        country_as_iso_3166_1_alpha_2:
          type: string
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2.
        postcode:
          type: string
          description: Postal code.
        united_kingdom_nhs_number:
          type: string
          maxLength: 20
