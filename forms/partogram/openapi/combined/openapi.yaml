          description: 'Flag category: action-line-crossed, alert-line-crossed, fetal-heart-abnormal,
            meconium, maternal-obs-abnormal, poor-progress, incomplete, or other.'
        priority:
          type: string
          enum:
          - low
          - medium
          - high
