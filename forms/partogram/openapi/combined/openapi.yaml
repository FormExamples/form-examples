          description: Timestamp when the record was deleted a.k.a. soft-removed.
        name:
          type: string
          description: Clinician full name as recorded in the rota.
        email:
          type: string
          description: Email address.
        phone:
          type: string
          description: Phone number.
        postal_address_as_full_text:
          type: string
          description: Postal address as a single text block.
        country_as_iso_3166_1_alpha_2:
          type: string
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2.
        postcode:
          type: string
          description: Postal code.
        role:
          type: string
          enum:
          - midwife
          - obstetrician
          - nurse
          - other
          - ''
          description: 'Primary clinical role: midwife, obstetrician, nurse, or other.'
        registration_body:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - GPhC
          - other
          - ''
          description: 'Professional registration body: GMC, NMC, HCPC, GPhC, or other.'
        registration_number:
          type: string
          description: Professional registration number issued by the registration body.
      required:
      - created_at
      - updated_at
      - name
      - role
      - registration_body
      - registration_number
      description: Clinician identifying information for the professional recording the partogram.
    Partogram:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        patient_id:
          type: string
          format: uuid
          description: Foreign key to the patient this labour record is for (restricted delete).
        clinician_id:
          type: string
          format: uuid
          description: Foreign key to the recording clinician (restricted delete); optional.
        clinician_name:
          type: string
          description: Name of the clinician recording the partogram, as entered on the record.
        clinician_role:
          type: string
          enum:
          - midwife
          - obstetrician
          - nurse
          - other
          - ''
          description: 'Role of the recording clinician: midwife, obstetrician, nurse, or other.'
        care_setting:
          type: string
          enum:
          - labour-ward
          - birth-centre
          - triage
          - other
          - ''
          description: 'Care setting: labour-ward, birth-centre, triage, or other.'
        active_phase_start_at:
          type: string
          format: date-time
          description: Date and time the active phase began (cervical dilatation 4 cm); the reference
            time from which elapsed hours and the alert / action lines are computed.
        patient_identifier:
          type: string
          description: Local patient identifier as entered on the record.
        age_band:
          type: string
          enum:
          - under-18
          - 18-24
          - 25-34
          - 35-39
          - 40-plus
          - ''
          description: 'Adult age band: under-18, 18-24, 25-34, 35-39, or 40-plus.'
        parity:
          type: string
          enum:
          - nulliparous
          - multiparous
          - ''
          description: 'Parity: nulliparous (no previous birth) or multiparous.'
        gestation_weeks:
          type: number
          format: double
          description: Completed weeks of gestation.
        membranes_on_admission:
          type: string
          enum:
          - intact
          - ruptured
          - ''
          description: 'Membrane status on admission: intact or ruptured.'
        risk_factors:
          type: string
          description: Free-text noted risk factors for the labour.
        planned_care:
          type: string
          description: Free-text planned care or management for the labour.
      required:
      - created_at
      - updated_at
      - patient_id
      - clinician_name
      - clinician_role
      - care_setting
      - patient_identifier
      - age_band
      - parity
      - membranes_on_admission
      - risk_factors
      - planned_care
      description: 'Parent partogram labour record header: recording context, patient identification,
        admission findings, and the active-phase start time that anchors the alert and action lines.'
    PartogramGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the row was soft-deleted.
        partogram_id:
          type: string
          format: uuid
          description: Foreign key to the parent partogram labour record (unique, 1:1).
        progress_status:
          type: string
          enum:
          - normal
          - alert-line-crossed
          - action-line-crossed
          - ''
          description: 'Overall labour-progress classification: normal, alert-line-crossed, or action-line-crossed.'
        latest_dilatation_cm:
          type: number
          format: double
          description: Latest observed cervical dilatation in centimetres (0-10) that the engine plotted
            against the reference lines.
        graded_at:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the grade.
      required:
      - created_at
      - updated_at
      - partogram_id
      - progress_status
      - graded_at
      description: 'Computed labour-progress grading result for a partogram: overall progress classification
        and the latest cervical dilatation plotted against the alert and action lines.'
    PartogramGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
