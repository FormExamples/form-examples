components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Clinician full name as recorded in the rota.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as a single text block.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code.
        role:
          type: string
          enum:
          - midwife
          - obstetrician
          - nurse
          - other
          - ''
          description: 'Primary clinical role: midwife, obstetrician, nurse, or other.'
        registrationBody:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - GPhC
          - other
          - ''
          description: 'Professional registration body: GMC, NMC, HCPC, GPhC, or other.'
        registrationNumber:
          type: string
          description: Professional registration number issued by the registration body.
      required:
      - createdAt
      - updatedAt
      - name
      - role
      - registrationBody
      - registrationNumber
      description: Clinician identifying information for the professional recording the partogram.
    Partogram:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the patient this labour record is for (restricted delete).
        clinicianId:
          type:
          - string
          - 'null'
          format: uuid
          description: Foreign key to the recording clinician (restricted delete); optional.
        clinicianName:
          type: string
          description: Name of the clinician recording the partogram, as entered on the record.
        clinicianRole:
          type: string
          enum:
          - midwife
          - obstetrician
          - nurse
          - other
          - ''
          description: 'Role of the recording clinician: midwife, obstetrician, nurse, or other.'
        careSetting:
          type: string
          enum:
          - labour-ward
          - birth-centre
          - triage
          - other
          - ''
          description: 'Care setting: labour-ward, birth-centre, triage, or other.'
        activePhaseStartAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Date and time the active phase began (cervical dilatation 4 cm); the reference
            time from which elapsed hours and the alert / action lines are computed.
        patientIdentifier:
          type: string
          description: Local patient identifier as entered on the record.
        ageBand:
          type: string
          enum:
          - under-18
          - 18-24
          - 25-34
          - 35-39
          - 40-plus
          - ''
          description: 'Adult age band: under-18, 18-24, 25-34, 35-39, or 40-plus.'
        parity:
          type: string
          enum:
          - nulliparous
          - multiparous
          - ''
          description: 'Parity: nulliparous (no previous birth) or multiparous.'
        gestationWeeks:
          type:
          - number
          - 'null'
          format: double
          description: Completed weeks of gestation.
        membranesOnAdmission:
          type: string
          enum:
          - intact
          - ruptured
          - ''
          description: 'Membrane status on admission: intact or ruptured.'
        riskFactors:
          type: string
          description: Free-text noted risk factors for the labour.
        plannedCare:
          type: string
          description: Free-text planned care or management for the labour.
      required:
      - createdAt
      - updatedAt
      - patientId
      - clinicianName
      - clinicianRole
      - careSetting
      - patientIdentifier
      - ageBand
      - parity
      - membranesOnAdmission
      - riskFactors
      - plannedCare
      description: 'Parent partogram labour record header: recording context, patient identification,
        admission findings, and the active-phase start time that anchors the alert and action lines.'
    PartogramGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        partogramId:
          type: string
          format: uuid
          description: Foreign key to the parent partogram labour record (unique, 1:1).
        progressStatus:
          type: string
          enum:
          - normal
          - alert-line-crossed
          - action-line-crossed
          - ''
          description: 'Overall labour-progress classification: normal, alert-line-crossed, or action-line-crossed.'
        latestDilatationCm:
          type:
          - number
          - 'null'
          format: double
          description: Latest observed cervical dilatation in centimetres (0-10) that the engine plotted
            against the reference lines.
        gradedAt:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the grade.
      required:
      - createdAt
      - updatedAt
      - partogramId
      - progressStatus
      - gradedAt
      description: 'Computed labour-progress grading result for a partogram: overall progress classification
        and the latest cervical dilatation plotted against the alert and action lines.'
    PartogramGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        partogramGradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        flagId:
          type: string
          maxLength: 50
          description: Stable flag identifier (e.g. F-FETAL-HEART-ABNORMAL-001).
        category:
          type: string
          enum:
          - action-line-crossed
          - alert-line-crossed
          - fetal-heart-abnormal
          - meconium
          - maternal-obs-abnormal
          - poor-progress
          - incomplete
          - other
          - ''
          description: 'Flag category: action-line-crossed, alert-line-crossed, fetal-heart-abnormal,
            meconium, maternal-obs-abnormal, poor-progress, incomplete, or other.'
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          - ''
          description: 'Priority: low, medium, high.'
        description:
          type: string
          maxLength: 500
          description: Human-readable description of what fired the flag.
        suggestedAction:
          type: string
          maxLength: 500
          description: Suggested clinical action (e.g. "escalate to the obstetric registrar for review").
      required:
      - createdAt
      - updatedAt
      - partogramGradeId
      - flagId
      - category
      - priority
      - description
      - suggestedAction
      description: Flagged issues raised independently of the progress classification, scanned across
        the whole observation series, with priority and a suggested action for the labour-ward team.
