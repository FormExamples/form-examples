components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Clinician full name.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as a single text block.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code.
        role:
          type: string
          enum:
          - clinician
          - nurse
          - mental-health-practitioner
          - crisis-worker
          - other
          - ''
          description: 'Assessing role: clinician, nurse, mental-health-practitioner, crisis-worker, or
            other.'
        registrationBody:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - GPhC
          - other
          - ''
          description: 'Professional registration body: GMC, NMC, HCPC, GPhC, or other.'
        registrationNumber:
          type: string
          description: Professional registration number issued by the registration body.
      required:
      - createdAt
      - updatedAt
      - name
      - role
      - registrationBody
      - registrationNumber
      description: Clinician identifying information for the member of staff who performed the C-SSRS
        suicide-risk assessment.
    ColumbiaSuicideSeverityRatingScale:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the patient being assessed (delete restricted).
        clinicianId:
          type:
          - string
          - 'null'
          format: uuid
          description: Foreign key to the assessing clinician (optional; delete restricted).
        clinicianName:
          type: string
          maxLength: 255
          description: Name of the assessing clinician as recorded on the assessment.
        clinicianRole:
          type: string
          enum:
          - clinician
          - nurse
          - mental-health-practitioner
          - crisis-worker
          - other
          - ''
          description: 'Role of the assessing clinician: clinician, nurse, mental-health-practitioner,
            crisis-worker, or other.'
        assessedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Date and time the assessment was performed.
        careSetting:
          type: string
          enum:
          - mental-health
          - emergency-department
          - primary-care
          - crisis-service
          - inpatient
          - other
          - ''
          description: 'Care setting: mental-health, emergency-department, primary-care, crisis-service,
            inpatient, or other.'
        scaleVersion:
          type: string
          enum:
          - screener
          - full
          - ''
          description: 'C-SSRS version used: screener (triage) or full (clinical).'
        reasonForAssessment:
          type: string
          description: Free-text trigger or reason for performing the screen.
        patientIdentifier:
          type: string
          maxLength: 100
          description: Local patient identifier as recorded on the assessment.
        ageBand:
          type: string
          enum:
          - adolescent
          - adult
          - ''
          description: 'Age band: adolescent or adult.'
        sex:
          type: string
          enum:
          - female
          - male
          - intersex
          - unknown
          - ''
          description: 'Patient sex recorded for the assessment: female, male, intersex, or unknown.'
        wishToBeDead:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Ideation Q1 (level 1) — passive wish to be dead (yes/no).
        nonSpecificActiveThoughts:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Ideation Q2 (level 2) — non-specific active suicidal thoughts, no method, intent,
            or plan (yes/no).
        activeIdeationMethods:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Ideation Q3 (level 3) — active ideation with any methods but no specific plan or
            intent (yes/no).
        activeIdeationIntent:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Ideation Q4 (level 4) — active ideation with some intent to act, without a fully
            worked-out plan (yes/no).
        activeIdeationPlan:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Ideation Q5 (level 5) — active ideation with a specific plan and intent to act
            (yes/no).
        ideationTimeframe:
          type: string
          enum:
          - past-month
          - lifetime-worst
          - ''
          description: 'Reference timeframe for the ideation items: past-month or lifetime-worst.'
        ideationFrequency:
          type:
          - integer
          - 'null'
          format: int32
          description: Ideation-intensity sub-item (0-5) — frequency of the most severe ideation; full
            version only.
        ideationDuration:
          type:
          - integer
          - 'null'
          format: int32
          description: Ideation-intensity sub-item (0-5) — duration of the most severe ideation; full
            version only.
        ideationControllability:
          type:
          - integer
          - 'null'
          format: int32
          description: Ideation-intensity sub-item (0-5) — controllability of the most severe ideation;
            full version only.
        ideationDeterrents:
          type:
          - integer
          - 'null'
          format: int32
          description: Ideation-intensity sub-item (0-5) — deterrents against acting on the ideation;
            full version only.
        ideationReasons:
          type:
          - integer
          - 'null'
          format: int32
          description: Ideation-intensity sub-item (0-5) — reasons for the ideation; full version only.
        actualAttempt:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Suicidal behaviour — actual attempt, a potentially self-injurious act with at least
            some intent to die (yes/no).
        interruptedAttempt:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Suicidal behaviour — interrupted attempt, stopped by an outside circumstance before
            self-harm begins (yes/no).
        abortedAttempt:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Suicidal behaviour — aborted or self-interrupted attempt, the person stops before
            beginning the act (yes/no).
        preparatoryActs:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Suicidal behaviour — preparatory acts or behaviour, e.g. acquiring means or writing
            a note (yes/no).
        nonSuicidalSelfInjury:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Non-suicidal self-injury (NSSI) — self-injury without intent to die; tracked separately
            and does not count as suicidal behaviour (yes/no).
        behaviourRecency:
          type: string
          enum:
          - within-3-months
          - over-3-months
          - ''
          description: 'Recency of the most recent suicidal behaviour: within-3-months or over-3-months
            (lifetime).'
        lifetimeAttemptCount:
          type:
          - integer
          - 'null'
          format: int32
          description: Total number of lifetime actual attempts.
        mostRecentAttemptDate:
          type:
          - string
          - 'null'
          format: date
          description: Date of the most recent actual attempt.
        actualLethality:
          type:
          - integer
          - 'null'
          format: int32
          description: Actual lethality / medical damage of the most recent actual attempt, ordinal 0-5
            (0 = no physical damage, 5 = death).
        potentialLethality:
          type:
          - integer
          - 'null'
          format: int32
          description: Potential lethality, ordinal 0-2, coded only when actual lethality is 0.
        accessToLethalMeans:
          type: string
          enum:
          - 'yes'
          - 'no'
          - unknown
          - ''
          description: 'Access to lethal means: yes, no, or unknown.'
        protectiveFactors:
          type: string
          description: Free-text note describing protective factors.
        clinicalNote:
          type: string
          description: Free-text clinical note recorded with the assessment.
      required:
      - createdAt
      - updatedAt
      - patientId
      - clinicianName
      - clinicianRole
      - careSetting
      - scaleVersion
      - reasonForAssessment
      - patientIdentifier
      - ageBand
      - sex
      - wishToBeDead
      - nonSpecificActiveThoughts
      - activeIdeationMethods
      - activeIdeationIntent
      - activeIdeationPlan
      - ideationTimeframe
      - actualAttempt
      - interruptedAttempt
      - abortedAttempt
      - preparatoryActs
      - nonSuicidalSelfInjury
      - behaviourRecency
      - accessToLethalMeans
      - protectiveFactors
      - clinicalNote
      description: 'Main C-SSRS assessment record: context, patient identification, the five ordinal ideation
        items, optional ideation-intensity sub-items, categorical behaviour items with recency, and lethality
        and means inputs.'
    ColumbiaSuicideSeverityRatingScaleGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
