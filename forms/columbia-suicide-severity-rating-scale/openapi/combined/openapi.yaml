        clinician_id:
          type: string
          format: uuid
          description: Foreign key to the assessing clinician (optional; delete restricted).
        clinician_name:
          type: string
          maxLength: 255
          description: Name of the assessing clinician as recorded on the assessment.
        clinician_role:
          type: string
          enum:
          - clinician
          - nurse
          - mental-health-practitioner
          - crisis-worker
          - other
          - ''
          description: 'Role of the assessing clinician: clinician, nurse, mental-health-practitioner,
            crisis-worker, or other.'
        assessed_at:
          type: string
          format: date-time
          description: Date and time the assessment was performed.
        care_setting:
          type: string
          enum:
          - mental-health
          - emergency-department
          - primary-care
          - crisis-service
          - inpatient
          - other
          - ''
          description: 'Care setting: mental-health, emergency-department, primary-care, crisis-service,
            inpatient, or other.'
        scale_version:
          type: string
          enum:
          - screener
          - full
          - ''
          description: 'C-SSRS version used: screener (triage) or full (clinical).'
        reason_for_assessment:
          type: string
          description: Free-text trigger or reason for performing the screen.
        patient_identifier:
          type: string
          maxLength: 100
          description: Local patient identifier as recorded on the assessment.
        age_band:
          type: string
          enum:
          - adolescent
          - adult
          - ''
          description: 'Age band: adolescent or adult.'
        sex:
          type: string
          enum:
          - female
          - male
          - intersex
          - unknown
          - ''
          description: 'Patient sex recorded for the assessment: female, male, intersex, or unknown.'
        wish_to_be_dead:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Ideation Q1 (level 1) — passive wish to be dead (yes/no).
        non_specific_active_thoughts:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Ideation Q2 (level 2) — non-specific active suicidal thoughts, no method, intent,
            or plan (yes/no).
        active_ideation_methods:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Ideation Q3 (level 3) — active ideation with any methods but no specific plan or
            intent (yes/no).
        active_ideation_intent:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Ideation Q4 (level 4) — active ideation with some intent to act, without a fully
            worked-out plan (yes/no).
        active_ideation_plan:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Ideation Q5 (level 5) — active ideation with a specific plan and intent to act
            (yes/no).
        ideation_timeframe:
          type: string
          enum:
          - past-month
          - lifetime-worst
          - ''
          description: 'Reference timeframe for the ideation items: past-month or lifetime-worst.'
        ideation_frequency:
          type: integer
          format: int32
          description: Ideation-intensity sub-item (0-5) — frequency of the most severe ideation; full
            version only.
        ideation_duration:
          type: integer
          format: int32
          description: Ideation-intensity sub-item (0-5) — duration of the most severe ideation; full
            version only.
        ideation_controllability:
          type: integer
          format: int32
          description: Ideation-intensity sub-item (0-5) — controllability of the most severe ideation;
            full version only.
        ideation_deterrents:
          type: integer
          format: int32
          description: Ideation-intensity sub-item (0-5) — deterrents against acting on the ideation;
            full version only.
        ideation_reasons:
          type: integer
          format: int32
          description: Ideation-intensity sub-item (0-5) — reasons for the ideation; full version only.
        actual_attempt:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Suicidal behaviour — actual attempt, a potentially self-injurious act with at least
            some intent to die (yes/no).
        interrupted_attempt:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Suicidal behaviour — interrupted attempt, stopped by an outside circumstance before
            self-harm begins (yes/no).
        aborted_attempt:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Suicidal behaviour — aborted or self-interrupted attempt, the person stops before
            beginning the act (yes/no).
        preparatory_acts:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Suicidal behaviour — preparatory acts or behaviour, e.g. acquiring means or writing
            a note (yes/no).
        non_suicidal_self_injury:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Non-suicidal self-injury (NSSI) — self-injury without intent to die; tracked separately
            and does not count as suicidal behaviour (yes/no).
        behaviour_recency:
          type: string
          enum:
          - within-3-months
          - over-3-months
          - ''
          description: 'Recency of the most recent suicidal behaviour: within-3-months or over-3-months
            (lifetime).'
        lifetime_attempt_count:
          type: integer
          format: int32
          description: Total number of lifetime actual attempts.
        most_recent_attempt_date:
          type: string
          format: date
          description: Date of the most recent actual attempt.
        actual_lethality:
          type: integer
          format: int32
          description: Actual lethality / medical damage of the most recent actual attempt, ordinal 0-5
            (0 = no physical damage, 5 = death).
        potential_lethality:
          type: integer
          format: int32
          description: Potential lethality, ordinal 0-2, coded only when actual lethality is 0.
        access_to_lethal_means:
          type: string
          enum:
          - 'yes'
          - 'no'
          - unknown
          - ''
          description: 'Access to lethal means: yes, no, or unknown.'
        protective_factors:
          type: string
          description: Free-text note describing protective factors.
        clinical_note:
          type: string
          description: Free-text clinical note recorded with the assessment.
      required:
      - created_at
