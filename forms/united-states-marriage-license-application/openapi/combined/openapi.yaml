            period; null when the issue date is unknown.'
        licenseExpiryDate:
          type:
          - string
          - 'null'
          format: date
          description: 'Derived last valid ceremony date: license issue date plus the state validity period;
            null when the issue date is unknown.'
        gradedAt:
          type: string
          format: date-time
