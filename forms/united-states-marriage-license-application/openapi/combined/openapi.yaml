components:
  schemas:
    Applicant:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          maxLength: 255
          description: Full legal name of the applicant.
        birthDate:
          type: string
          format: date
          description: Date of birth of the applicant.
        sex:
          type: string
          enum:
          - female
          - male
          - nonbinary
          - unknown
          - ''
          description: 'Sex or gender recorded for the applicant: female, male, nonbinary, or unknown.'
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as a single text block.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2.
        postcode:
          type:
          - string
          - 'null'
          description: ZIP or postal code.
      required:
      - createdAt
      - updatedAt
      - name
      - birthDate
      - sex
      description: One person applying for a marriage license; the application references two of these
        rows.
    CountyClerk:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          maxLength: 255
          description: Name of the county clerk or recorder office that issues marriage licenses.
        state:
          type: string
          maxLength: 2
          description: Two-letter USPS code of the state the office serves.
        county:
          type: string
          description: County the office serves.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as a single text block.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2.
        postcode:
          type:
          - string
          - 'null'
          description: ZIP or postal code.
        website:
          type:
          - string
          - 'null'
          description: Website with the office fee schedule and appointment rules.
      required:
      - createdAt
      - updatedAt
      - name
      - state
      - county
      description: The county clerk, recorder, or registrar office that issues the marriage license and
        records the certificate.
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          description: A URI identifying the problem type
        title:
          type: string
          description: A short summary of the problem type
        status:
          type: integer
          description: The HTTP status code
        detail:
          type: string
          description: An explanation of this occurrence
        instance:
          type: string
          description: A URI identifying this occurrence
        code:
          type: string
          description: A short machine-readable reason
        errors:
          type: object
          description: Per-field detail, when validation failed
      required:
      - type
      - title
      - status
    UnitedStatesMarriageLicenseApplication:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        firstApplicantId:
          type: string
          format: uuid
          description: Foreign key to the first applicant.
        secondApplicantId:
          type: string
          format: uuid
          description: Foreign key to the second applicant.
        countyClerkId:
          type:
          - string
          - 'null'
          format: uuid
          description: Foreign key to the issuing county clerk office, if known.
        state:
          type: string
          maxLength: 2
          description: Two-letter USPS code of the issuing state; selects the state rule table in the
            engine.
        county:
          type: string
          description: County (or issuing clerk jurisdiction) where the application is made.
        applicationDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the application is made to the clerk.
        licenseType:
          type: string
          enum:
          - standard
          - confidential
          - ''
          description: 'License type: standard (public) or confidential (for example California).'
        firstApplicantName:
          type: string
          description: Full legal name of the first applicant as it will appear on the license.
        firstApplicantSex:
          type: string
          enum:
          - female
          - male
          - nonbinary
          - unknown
          - ''
          description: 'Sex or gender recorded for the first applicant: female, male, nonbinary, or unknown.
            Informational only; it never affects eligibility (Obergefell v. Hodges).'
        firstApplicantDateOfBirth:
          type:
          - string
          - 'null'
          format: date
          description: Date of birth of the first applicant.
        firstApplicantPlaceOfBirth:
          type: string
          description: City, state, and country of birth of the first applicant.
        firstApplicantResidenceState:
          type: string
          maxLength: 2
          description: Two-letter state or territory of residence of the first applicant.
        firstApplicantIdPresented:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the first applicant presented acceptable government photo identification
            (yes/no).
        firstApplicantSsnStatus:
          type: string
          enum:
          - provided
          - none-issued
          - declined
          - ''
          description: 'Social Security number status of the first applicant: provided, none-issued, or
            declined. Never stores the number itself.'
        firstApplicantMaritalStatus:
          type: string
          enum:
          - never-married
          - divorced
          - widowed
          - annulled
          - currently-married
          - ''
          description: 'Marital status of the first applicant before this marriage: never-married, divorced,
            widowed, annulled, or currently-married.'
        firstApplicantPriorMarriageEndedDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the first applicant's most recent prior marriage ended by divorce, death,
            or annulment.
        secondApplicantName:
          type: string
          description: Full legal name of the second applicant as it will appear on the license.
        secondApplicantSex:
          type: string
          enum:
          - female
          - male
          - nonbinary
          - unknown
          - ''
          description: 'Sex or gender recorded for the second applicant: female, male, nonbinary, or unknown.
            Informational only; it never affects eligibility (Obergefell v. Hodges).'
        secondApplicantDateOfBirth:
          type:
          - string
          - 'null'
          format: date
          description: Date of birth of the second applicant.
        secondApplicantPlaceOfBirth:
          type: string
          description: City, state, and country of birth of the second applicant.
        secondApplicantResidenceState:
          type: string
          maxLength: 2
          description: Two-letter state or territory of residence of the second applicant.
        secondApplicantIdPresented:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the second applicant presented acceptable government photo identification
