        secondApplicantSsnStatus:
          type: string
          enum:
          - provided
          - none-issued
          - declined
          - ''
          description: 'Social Security number status of the second applicant: provided, none-issued,
            or declined. Never stores the number itself.'
        secondApplicantMaritalStatus:
          type: string
          enum:
          - never-married
          - divorced
          - widowed
          - annulled
          - currently-married
          - ''
          description: 'Marital status of the second applicant before this marriage: never-married, divorced,
            widowed, annulled, or currently-married.'
        secondApplicantPriorMarriageEndedDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the second applicant's most recent prior marriage ended by divorce, death,
            or annulment.
        relationshipBetweenApplicants:
          type: string
          enum:
          - not-related
          - related-prohibited
          - ''
          description: 'Whether the applicants are related within a degree the state prohibits: not-related
            or related-prohibited.'
        minorConsent:
          type: string
          enum:
          - not-applicable
          - parental-consent
          - court-order
          - none
          - ''
          description: 'Consent for an applicant under 18: not-applicable, parental-consent, court-order,
            or none.'
        activeDutyMilitary:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether either applicant is on active military duty (a waiting-period waiver in
            some states and the basis for proxy marriage).
        appearInPerson:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether both applicants will appear in person before the clerk (yes/no).
        proxyRequested:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether a proxy marriage is requested because one applicant cannot attend (yes/no).
        premaritalCourseCompleted:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the couple completed a state-approved premarital education course (yes/no);
            waives the waiting period and reduces the fee in some states.
        bloodTestEvidence:
          type: string
          enum:
          - provided
          - not-required
          - not-provided
          - ''
          description: 'Premarital blood-test evidence: provided, not-required, or not-provided. No US
            state currently requires a test.'
        feePaidUsd:
          type:
          - number
          - 'null'
          format: double
          description: License fee paid, in US dollars; null when not yet paid.
        licenseIssuedDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the clerk issued the license; the waiting period and validity period run from
            here.
        ceremonyDate:
          type:
          - string
          - 'null'
          format: date
          description: Date of the marriage ceremony.
        officiantType:
          type: string
          enum:
          - clergy
          - judge
          - clerk
          - notary
          - self-uniting
          - other
          - ''
          description: 'Who solemnizes the marriage: clergy, judge, clerk, notary, self-uniting, or other.'
        officiantName:
          type: string
          description: Name of the person who solemnized the marriage.
        officiantAuthorized:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the officiant is authorized to solemnize marriages in the state (yes/no).
        witnessCount:
          type:
          - integer
          - 'null'
          format: int32
          description: Number of witnesses present at the ceremony; null when unanswered.
        licenseReturnedDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the signed license was returned to the clerk for recording; starts the certified
            marriage certificate.
        certifiedCopiesRequested:
          type:
          - integer
          - 'null'
          format: int32
          description: Number of certified copies of the marriage certificate requested; null when unanswered.
        clerkNote:
          type: string
          description: Free-text note from the applicants or the clerk.
