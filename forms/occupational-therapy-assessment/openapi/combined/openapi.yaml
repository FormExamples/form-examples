          type: string
          maxLength: 30
          description: Identifier of the flag (e.g. FLAG-FALL-RISK-001, FLAG-COGNITION-001).
        category:
          type: string
          maxLength: 100
          description: Category of the flag (e.g. Safety, Cognitive, Environmental).
        message:
          type: string
          description: Human-readable description of the flagged issue.
        priority:
          type: string
          enum:
          - high
          - medium
          - low
          description: 'Priority level: high, medium, or low.'
      required:
      - createdAt
      - updatedAt
      - gradeId
      - flagId
      - category
      - message
      - priority
      description: Additional flags detected during occupational therapy assessment grading, such as safety
        risks or urgent intervention needs.
    GradingFiredRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        gradeId:
          type: string
          format: uuid
          description: Foreign key to the grade table.
        ruleId:
          type: string
          maxLength: 20
          description: Identifier of the rule that fired (e.g. COPM-PERF-001, COPM-SAT-001).
        category:
          type: string
          maxLength: 100
          description: Category of the rule (e.g. Self-Care Performance, Productivity Satisfaction).
        description:
          type: string
          description: Human-readable description of the rule and why it fired.
        severityLevel:
          type: string
          enum:
          - significant-issues
          - moderate-concerns
          - good-performance
          - ''
          description: 'COPM category contributed by this rule: significant-issues, moderate-concerns,
            good-performance, or empty.'
      required:
