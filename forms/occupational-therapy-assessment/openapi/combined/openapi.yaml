        selfCareSatisfactionScore:
          type:
          - number
          - 'null'
          format: double
          description: COPM satisfaction score for self-care activities (1 = not satisfied, 10 = extremely
            satisfied).
        productivitySatisfactionScore:
          type:
          - number
          - 'null'
          format: double
          description: COPM satisfaction score for productivity activities (1 = not satisfied, 10 = extremely
            satisfied).
        leisureSatisfactionScore:
          type:
          - number
          - 'null'
          format: double
          description: COPM satisfaction score for leisure activities (1 = not satisfied, 10 = extremely
            satisfied).
        satisfactionNotes:
          type: string
          description: Additional notes on satisfaction ratings and observations.
      required:
      - createdAt
      - updatedAt
