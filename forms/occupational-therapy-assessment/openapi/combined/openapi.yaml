    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Name.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as full text.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code, such as for validating the postal address.
        role:
          type: string
          enum:
          - anaesthetist
          - surgeon
          - preop-nurse
          - perioperative-physician
          - geriatrician
          - pharmacist
          - other
          - ''
          description: Clinician role.
        registrationBody:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - GPhC
          - other
          - ''
          description: Clinician registration body.
        registrationNumber:
          type: string
          description: Clinician registration number.
        unitedKingdomNhsNumber:
          type:
          - string
          - 'null'
          maxLength: 12
          description: United Kingdom NHS number, unique per person.
      required:
      - createdAt
      - updatedAt
      - name
      - role
      - registrationBody
      - registrationNumber
      description: Clinician
    Grade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        assessmentId:
          type: string
          format: uuid
          description: Foreign key to the assessment table.
        performanceMeanScore:
          type:
          - number
          - 'null'
          format: double
          description: Mean COPM performance score across all rated occupational issues (1-10).
        satisfactionMeanScore:
          type:
          - number
          - 'null'
          format: double
          description: Mean COPM satisfaction score across all rated occupational issues (1-10).
        performanceCategory:
          type: string
          enum:
          - significant-issues
          - moderate-concerns
          - good-performance
          - ''
          description: 'Performance category: significant-issues (<5), moderate-concerns (5-7), good-performance
            (>7), or empty.'
        satisfactionCategory:
          type: string
          enum:
          - significant-issues
          - moderate-concerns
          - good-performance
          - ''
          description: 'Satisfaction category: significant-issues (<5), moderate-concerns (5-7), good-performance
            (>7), or empty.'
        gradedAt:
          type: string
          format: date-time
          description: Timestamp when the COPM grading was computed.
      required:
      - createdAt
      - updatedAt
      - assessmentId
      - performanceCategory
      - satisfactionCategory
      - gradedAt
      description: Computed COPM grading result for the occupational therapy assessment. One-to-one child
        of assessment.
    GradingAdditionalFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
