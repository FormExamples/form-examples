components:
  schemas:
    Assessment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the patient who owns this assessment.
        status:
          type: string
          enum:
          - draft
          - submitted
          - reviewed
          - urgent
          description: 'Lifecycle status: draft, submitted, reviewed, or urgent.'
      required:
      - createdAt
      - updatedAt
      - patientId
      - status
      description: Occupational therapy assessment form using COPM. Parent entity for all assessment sections.
    AssessmentPerformanceRatingItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        performanceRatingsId:
          type: string
          format: uuid
          description: Foreign key to the assessment_performance_ratings table.
        occupationalIssue:
          type: string
          maxLength: 255
          description: Description of the specific occupational performance issue.
        domain:
          type: string
          enum:
          - self-care
          - productivity
          - leisure
          - ''
          description: 'COPM domain: self-care, productivity, leisure, or empty.'
        importanceScore:
          type:
          - integer
          - 'null'
          format: int32
          description: Patient-rated importance of this issue (1 = not important, 10 = extremely important).
        performanceScore:
          type:
          - integer
          - 'null'
          format: int32
          description: Patient-rated performance score (1 = not able, 10 = able to do extremely well).
        sortOrder:
          type: integer
          format: int32
          description: Display order of the item within the list.
      required:
      - createdAt
      - updatedAt
      - performanceRatingsId
      - occupationalIssue
      - domain
      - sortOrder
      description: Individual COPM performance rating for a specific occupational issue identified by
        the patient.
    AssessmentPerformanceRatings:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        assessmentId:
          type: string
          format: uuid
          description: Foreign key to the parent assessment (unique, enforcing 1:1).
        overallPerformanceScore:
          type:
          - number
          - 'null'
          format: double
          description: Overall COPM performance score (1-10), averaged across domains.
        selfCarePerformanceScore:
          type:
          - number
          - 'null'
          format: double
          description: COPM performance score for self-care activities (1 = not able, 10 = able to do
            extremely well).
        productivityPerformanceScore:
          type:
          - number
          - 'null'
          format: double
          description: COPM performance score for productivity activities (1 = not able, 10 = able to
            do extremely well).
        leisurePerformanceScore:
          type:
          - number
          - 'null'
          format: double
          description: COPM performance score for leisure activities (1 = not able, 10 = able to do extremely
            well).
        performanceNotes:
          type: string
          description: Additional notes on performance ratings and observations.
      required:
      - createdAt
      - updatedAt
      - assessmentId
      - performanceNotes
      description: 'COPM performance ratings section: patient-rated performance scores (1-10) across occupational
        domains. One-to-one child of assessment.'
    AssessmentSatisfactionRatingItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        satisfactionRatingsId:
          type: string
          format: uuid
          description: Foreign key to the assessment_satisfaction_ratings table.
        occupationalIssue:
          type: string
          maxLength: 255
          description: Description of the specific occupational performance issue.
        domain:
          type: string
          enum:
          - self-care
          - productivity
          - leisure
          - ''
          description: 'COPM domain: self-care, productivity, leisure, or empty.'
        satisfactionScore:
          type:
          - integer
          - 'null'
          format: int32
          description: Patient-rated satisfaction score (1 = not satisfied, 10 = extremely satisfied).
        sortOrder:
          type: integer
          format: int32
          description: Display order of the item within the list.
      required:
      - createdAt
      - updatedAt
      - satisfactionRatingsId
      - occupationalIssue
      - domain
      - sortOrder
      description: Individual COPM satisfaction rating for a specific occupational issue identified by
        the patient.
    AssessmentSatisfactionRatings:
