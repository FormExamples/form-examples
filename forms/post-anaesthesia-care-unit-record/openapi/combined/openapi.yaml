components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Clinician full name.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as a single text block.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code.
        role:
          type: string
          enum:
          - recovery-nurse
          - odp
          - anaesthetist
          - other
          - ''
          description: 'Primary clinical role: recovery-nurse, odp (operating-department practitioner),
            anaesthetist, or other.'
        registrationBody:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - GPhC
          - other
          - ''
          description: 'Professional registration body: GMC, NMC, HCPC, GPhC, or other.'
        registrationNumber:
          type: string
          description: Professional registration number issued by the registration body.
      required:
      - createdAt
      - updatedAt
      - name
      - role
      - registrationBody
      - registrationNumber
      description: Clinician identifying information for the recovery staff recording the PACU observations.
    Patient:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          maxLength: 255
          description: Full patient name as recorded on the wristband.
        birthDate:
          type: string
          format: date
          description: Date of birth.
        sex:
          type: string
          enum:
          - female
          - male
          - intersex
          - unknown
          - ''
          description: 'Sex recorded for clinical purposes: female, male, intersex, or unknown.'
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as a single text block.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code.
        unitedKingdomNhsNumber:
          type:
          - string
          - 'null'
          maxLength: 20
          description: United Kingdom NHS number, unique per person.
        hospitalMrn:
          type:
          - string
          - 'null'
          maxLength: 50
          description: Local hospital medical record number (MRN).
        heightAsCm:
          type:
          - number
          - 'null'
          format: double
          description: Height in centimetres.
        weightAsKg:
          type:
          - number
          - 'null'
          format: double
          description: Weight in kilograms.
        bodyMassIndex:
          type:
          - number
          - 'null'
          format: double
          description: Body mass index (BMI), kg/m^2.
        allergiesSummary:
          type: string
          description: Free-text summary of known allergies recorded on admission to recovery.
      required:
      - createdAt
      - updatedAt
      - name
      - birthDate
      - sex
      - allergiesSummary
      description: Patient demographic information used by the post-anaesthesia care unit record.
    PostAnaesthesiaCareUnitRecord:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the patient in recovery (delete restricted).
        clinicianId:
          type:
          - string
          - 'null'
          format: uuid
          description: Foreign key to the recording recovery clinician (optional; delete restricted).
        nurseName:
          type: string
          maxLength: 255
          description: Name of the recording recovery nurse as documented on the record.
        nurseRole:
          type: string
          enum:
          - recovery-nurse
          - odp
          - anaesthetist
          - other
          - ''
          description: 'Role of the recording staff member: recovery-nurse, odp, anaesthetist, or other.'
        anaesthetistName:
          type: string
          maxLength: 255
          description: Name of the supervising anaesthetist responsible for the case.
        admittedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Date and time of admission to the post-anaesthesia care unit.
        anaestheticTechnique:
          type: string
          enum:
          - general
          - regional
          - sedation
          - combined
          - ''
          description: 'Anaesthetic technique used: general, regional, sedation, or combined.'
        procedure:
          type: string
          description: Operation or procedure performed before recovery.
        patientIdentifier:
          type: string
          maxLength: 100
          description: Local patient identifier as recorded on the record.
        ageBand:
          type: string
          enum:
          - 16-39
          - 40-59
          - 60-74
          - 75-plus
          - ''
          description: 'Adult age band: 16-39, 40-59, 60-74, or 75-plus.'
        sex:
          type: string
          enum:
          - female
          - male
          - intersex
          - unknown
          - ''
          description: 'Patient sex recorded for the record: female, male, intersex, or unknown.'
        asaStatus:
          type: string
          enum:
          - I
          - II
          - III
          - IV
          - V
          - ''
          description: ASA physical status (I-V) carried over from the pre-anaesthetic assessment.
        baselineSystolicBp:
          type:
          - number
          - 'null'
          format: double
          description: Pre-anaesthetic baseline systolic blood pressure in mmHg, used as the circulation
            reference.
        ambulatoryCase:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Whether this is a day-surgery (ambulatory) case: yes enables PADSS street-fitness
            scoring.'
        activity:
          type: string
          enum:
          - all-four
          - two
          - none
          - ''
          description: 'Aldrete activity parameter: all-four (moves all four limbs, 2), two (moves two
            limbs, 1), or none (unable to move, 0).'
        respiration:
          type: string
          enum:
          - deep-cough
          - limited
          - apnoeic
          - ''
          description: 'Aldrete respiration parameter: deep-cough (breathes deeply and coughs freely,
            2), limited (dyspnoea or limited breathing, 1), or apnoeic (0).'
        circulation:
          type: string
          enum:
          - within-20
          - within-50
          - over-50
          - ''
          description: 'Aldrete circulation parameter versus baseline systolic BP: within-20 (within 20
            mmHg, 2), within-50 (within 20-50 mmHg, 1), or over-50 (more than 50 mmHg, 0).'
        consciousness:
          type: string
          enum:
          - awake
          - arousable
          - unresponsive
          - ''
          description: 'Aldrete consciousness parameter: awake (fully awake, 2), arousable (arousable
            on calling, 1), or unresponsive (0).'
        oxygenSaturation:
          type: string
          enum:
          - room-air
          - needs-o2
          - low-on-o2
          - ''
          description: 'Aldrete oxygen-saturation parameter: room-air (SpO2 > 92% on room air, 2), needs-o2
            (needs oxygen to maintain SpO2 > 90%, 1), or low-on-o2 (SpO2 < 90% even with oxygen, 0).'
        airwayStatus:
          type: string
          enum:
          - patent
          - oral-airway
          - other
          - ''
          description: 'Airway status in recovery: patent, oral-airway (oral/nasal airway in situ), or
            other support.'
        painScore:
          type:
          - number
          - 'null'
          format: double
          description: Pain score on the verbal / numeric rating scale (0-10).
        ponvSeverity:
          type: string
          enum:
          - none
          - mild
          - moderate
          - severe
          - ''
          description: 'Post-operative nausea and vomiting severity: none, mild, moderate, or severe.'
        analgesiaGiven:
          type: string
          description: Free-text record of analgesics administered in the PACU.
        antiemeticsGiven:
          type: string
          description: Free-text record of antiemetics administered in the PACU.
        padssVitalSigns:
          type: string
          enum:
          - within-20
          - within-40
          - over-40
          - ''
          description: 'PADSS vital-signs criterion versus baseline: within-20 (within 20%, 2), within-40
            (20-40%, 1), or over-40 (more than 40%, 0).'
        padssAmbulation:
          type: string
          enum:
          - steady
          - with-assistance
          - unable
          - ''
          description: 'PADSS ambulation criterion: steady (steady gait, no dizziness, 2), with-assistance
            (needs assistance, 1), or unable (unable / dizzy, 0).'
        padssNauseaVomiting:
          type: string
          enum:
          - minimal
          - moderate
          - severe
          - ''
          description: 'PADSS nausea-and-vomiting criterion: minimal (2), moderate (1), or severe (0).'
        padssPain:
          type: string
          enum:
          - minimal
          - moderate
          - severe
          - ''
