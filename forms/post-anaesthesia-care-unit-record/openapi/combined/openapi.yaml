          format: int32
          description: Aldrete activity sub-score (0-2).
        respirationScore:
          type:
          - integer
          - 'null'
          format: int32
          description: Aldrete respiration sub-score (0-2).
        circulationScore:
          type:
          - integer
          - 'null'
          format: int32
          description: Aldrete circulation sub-score (0-2).
        consciousnessScore:
          type:
          - integer
          - 'null'
          format: int32
          description: Aldrete consciousness sub-score (0-2).
        oxygenSaturationScore:
          type:
          - integer
          - 'null'
          format: int32
          description: Aldrete oxygen-saturation sub-score (0-2); discharge-readiness is gated on this
