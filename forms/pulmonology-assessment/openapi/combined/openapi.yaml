        status:
          type: string
          enum:
          - draft
          - submitted
          - reviewed
          - urgent
          description: 'Lifecycle status: draft, submitted, reviewed, or urgent.'
        current_medications_deleted_at:
          type: string
          format: date-time
          description: Timestamp when this row was deleted.
        inhaler_use:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the patient uses inhaler devices.
        inhaler_technique_assessed:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether inhaler technique was assessed during the visit.
        inhaler_technique_adequate:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether inhaler technique is adequate.
        short_acting_bronchodilator:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the patient uses a short-acting bronchodilator (SABA, e.g. salbutamol).
        saba_frequency:
          type: string
          description: Saba frequency.
        long_acting_bronchodilator:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the patient uses a long-acting bronchodilator (LABA or LAMA).
        inhaled_corticosteroid:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the patient uses an inhaled corticosteroid (ICS).
        combination_inhaler:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the patient uses a combination inhaler (ICS/LABA or LABA/LAMA).
        long_term_oxygen_therapy:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the patient is on long-term oxygen therapy (LTOT).
        oxygen_flow_rate_lmin:
          type: number
          format: double
          description: Oxygen flow rate in litres per minute.
        oxygen_hours_per_day:
          type: integer
          format: int32
          description: Oxygen hours per day.
        nebuliser_use:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the patient uses a nebuliser at home.
        oral_medications:
          type: string
          description: Oral medications.
        medication_adherence:
          type: string
          enum:
          - good
          - fair
          - poor
          - ''
          description: 'Medication adherence: good, fair, poor, or empty.'
        additional_notes:
          type: string
          description: Additional notes.
        medication_item_deleted_at:
          type: string
          format: date-time
          description: Timestamp when this row was deleted.
        current_medications_id:
          type: string
          format: uuid
          description: Foreign key to the assessment_current_medications table.
        medication_name:
          type: string
          maxLength: 255
          description: Name of the medication.
        dose:
          type: string
          maxLength: 100
          description: Dosage amount and unit (e.g. 200mcg, 500mg).
        frequency:
          type: string
          maxLength: 100
          description: Dosing frequency (e.g. twice daily, as needed).
        route:
          type: string
          enum:
          - inhaled
          - oral
          - nebulised
          - subcutaneous
          - intravenous
          - other
          - ''
          description: 'Route of administration: inhaled, oral, nebulised, subcutaneous, intravenous,
