        updated_at:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        modified_early_warning_score_grade_id:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        flag_id:
          type: string
          maxLength: 50
          description: Stable flag identifier (e.g. F-SINGLE-PARAMETER-3-001).
        category:
          type: string
          enum:
          - aggregate-escalation
          - single-parameter-3
          - deteriorating-trend
          - hypotension
          - reduced-consciousness
          - tachypnoea-bradypnoea
          - tachycardia-bradycardia
          - pyrexia-hypothermia
          - incomplete-observation
          - other
          - ''
          description: 'Flag category: aggregate-escalation, single-parameter-3, deteriorating-trend,
            hypotension, reduced-consciousness, tachypnoea-bradypnoea, tachycardia-bradycardia, pyrexia-hypothermia,
            incomplete-observation, or other.'
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          - ''
          description: 'Priority: low, medium, high.'
        description:
          type: string
          maxLength: 500
          description: Human-readable description of what fired the flag.
        suggested_action:
          type: string
          maxLength: 500
          description: Suggested clinical action (e.g. "urgent medical review", "consider critical-care
