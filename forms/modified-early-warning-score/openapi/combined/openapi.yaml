components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Clinician full name as recorded in the rota.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as a single text block.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code.
        role:
          type: string
          enum:
          - nurse
          - healthcare-assistant
          - doctor
          - other
          - ''
          description: 'Primary clinical role of the assessing clinician: nurse, healthcare-assistant,
            doctor, or other.'
        registrationBody:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - GPhC
          - other
          - ''
          description: 'Professional registration body: GMC, NMC, HCPC, GPhC, or other.'
        registrationNumber:
          type: string
          description: Professional registration number issued by the registration body.
      required:
      - createdAt
      - updatedAt
      - name
      - role
      - registrationBody
      - registrationNumber
      description: Clinician identifying information for the person who recorded the MEWS observation
        set.
    ModifiedEarlyWarningScore:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patientId:
          type: string
          format: uuid
          description: 'Foreign key to the patient observed (RESTRICT: patients are not deleted while
            observations exist).'
        clinicianId:
          type:
          - string
          - 'null'
          format: uuid
          description: Foreign key to the clinician who recorded the observation set (RESTRICT); NULL
            until assigned.
        status:
          type: string
          enum:
          - draft
          - submitted
          - amended
          - signed
          description: 'Workflow status: draft, submitted, amended, or signed.'
        observationAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Date and time the observation set was taken; NULL when not yet recorded.
        careSetting:
          type: string
          enum:
          - acute-ward
          - admissions-unit
          - assessment-unit
          - other
          - ''
          description: 'Care setting where the observations were recorded: acute-ward, admissions-unit,
            assessment-unit, or other.'
        wardOrLocation:
          type: string
          maxLength: 255
          description: Ward or bed location where the observations were recorded.
        systolicBloodPressure:
          type:
          - integer
          - 'null'
          format: int32
          description: Systolic blood pressure in mmHg; NULL when not recorded.
        heartRate:
          type:
          - integer
          - 'null'
          format: int32
          description: Heart rate in beats per minute; NULL when not recorded.
        respiratoryRate:
          type:
          - integer
          - 'null'
          format: int32
          description: Respiratory rate in breaths per minute; NULL when not recorded.
        temperature:
          type:
          - number
          - 'null'
          format: double
          description: Body temperature in degrees Celsius; NULL when not recorded.
        consciousnessAvpu:
          type: string
          enum:
          - A
          - V
          - P
          - U
          - ''
          description: 'Consciousness level on the AVPU scale: A (alert), V (voice), P (pain), U (unresponsive).'
        previousMewsScore:
          type:
          - integer
          - 'null'
          format: int32
          description: Aggregate MEWS from the previous observation set, used only to compute the deteriorating-trend
            flag; NULL when unavailable and never part of this aggregate.
        clinicalNotes:
          type: string
          description: Free-text clinical notes accompanying the observation set.
      required:
      - createdAt
      - updatedAt
      - patientId
      - status
      - careSetting
      - wardOrLocation
      - consciousnessAvpu
      - clinicalNotes
      description: 'Main MEWS observation record: raw physiological observations for a single vital-sign
        set plus recording context (care setting, ward/location, observation timestamp) and the optional
        previous aggregate for the deteriorating-trend flag. Sub-scores, aggregate, risk band, rules,
        and flags live in child tables.'
    ModifiedEarlyWarningScoreGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        modifiedEarlyWarningScoreId:
          type: string
          format: uuid
          description: Foreign key to the parent observation record (unique, 1:1).
        aggregateScore:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Aggregate MEWS total (0-14): sum of the five parameter sub-scores; NULL until
            computed.'
        systolicBloodPressureScore:
          type:
          - integer
          - 'null'
          format: int32
          description: Systolic-blood-pressure sub-score (0-3); NULL when the observation was not recorded.
        heartRateScore:
          type:
          - integer
          - 'null'
          format: int32
          description: Heart-rate sub-score (0-3); NULL when not recorded.
        respiratoryRateScore:
          type:
          - integer
          - 'null'
          format: int32
          description: Respiratory-rate sub-score (0-3); NULL when not recorded.
        temperatureScore:
          type:
          - integer
          - 'null'
          format: int32
          description: Temperature sub-score (0-3); NULL when not recorded.
        avpuScore:
          type:
          - integer
          - 'null'
          format: int32
          description: Consciousness (AVPU) sub-score (0-3); NULL when not recorded.
        singleParameterTrigger:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Single-parameter trigger: whether any single parameter scored 3, which warrants
            urgent review regardless of the aggregate.'
        riskBand:
          type: string
          enum:
          - low
          - medium
          - high
          - ''
          description: 'Derived clinical-risk band: low (0-1), medium (2-4), or high (>= 5).'
        monitoringFrequency:
          type: string
          description: Recommended monitoring frequency for the risk band (e.g. routine, increased, hourly,
            continuous).
        gradedAt:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the grade.
      required:
      - createdAt
      - updatedAt
      - modifiedEarlyWarningScoreId
      - singleParameterTrigger
      - riskBand
      - monitoringFrequency
      - gradedAt
      description: 'Computed MEWS grading result: five per-parameter sub-scores, aggregate total (0-14),
        single-parameter trigger indicator, derived clinical-risk band, and recommended monitoring frequency.
        One row per observation record (1:1).'
    ModifiedEarlyWarningScoreGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        modifiedEarlyWarningScoreGradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        flagId:
          type: string
          maxLength: 50
          description: Stable flag identifier (e.g. F-SINGLE-PARAMETER-3-001).
        category:
          type: string
          enum:
          - aggregate-escalation
          - single-parameter-3
          - deteriorating-trend
          - hypotension
          - reduced-consciousness
          - tachypnoea-bradypnoea
          - tachycardia-bradycardia
          - pyrexia-hypothermia
          - incomplete-observation
          - other
          - ''
          description: 'Flag category: aggregate-escalation, single-parameter-3, deteriorating-trend,
            hypotension, reduced-consciousness, tachypnoea-bradypnoea, tachycardia-bradycardia, pyrexia-hypothermia,
            incomplete-observation, or other.'
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          - ''
          description: 'Priority: low, medium, high.'
        description:
          type: string
          maxLength: 500
          description: Human-readable description of what fired the flag.
        suggestedAction:
          type: string
          maxLength: 500
          description: Suggested clinical action (e.g. "urgent medical review", "consider critical-care
            outreach").
      required:
      - createdAt
      - updatedAt
      - modifiedEarlyWarningScoreGradeId
      - flagId
      - category
      - priority
      - description
      - suggestedAction
      description: Safety-critical flags that fire independently of the aggregate risk band, with priority
        and a suggested action for the ward and escalation team.
    ModifiedEarlyWarningScoreGradeRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        modifiedEarlyWarningScoreGradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        ruleId:
          type: string
          maxLength: 40
          description: Stable rule identifier (e.g. R-SBP-3-LOW-01).
        instrument:
          type: string
          enum:
          - systolic-blood-pressure
          - heart-rate
          - respiratory-rate
          - temperature
          - avpu
          - aggregate
          - single-parameter
          description: 'Scoring instrument the rule belongs to: systolic-blood-pressure, heart-rate, respiratory-rate,
            temperature, avpu, aggregate, or single-parameter.'
        band:
          type: string
          enum:
          - low
          - medium
          - high
          - ''
          description: 'Clinical-risk band contributed by this rule: low, medium, or high.'
        points:
          type:
          - integer
          - 'null'
          format: int32
          description: Sub-score points contributed by this rule (0-3); NULL for non-scoring rules.
        category:
          type: string
          maxLength: 50
          description: Subject category (e.g. hypotension, tachycardia, tachypnoea, hypothermia).
        description:
          type: string
          maxLength: 500
          description: Human-readable description of why the rule fired.
      required:
      - createdAt
      - updatedAt
      - modifiedEarlyWarningScoreGradeId
      - ruleId
      - instrument
      - band
      - category
      - description
      description: 'Audit trail of every grading rule that fired during MEWS computation: instrument,
        band, points contributed, category, and description.'
    Patient:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          maxLength: 255
          description: Full patient name as recorded on the wristband.
        birthDate:
          type: string
          format: date
          description: Date of birth.
        sex:
          type: string
          enum:
          - female
          - male
          - intersex
