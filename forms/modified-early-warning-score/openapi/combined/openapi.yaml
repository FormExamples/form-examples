components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Clinician full name as recorded in the rota.
        email:
          type: string
          description: Email address.
        phone:
          type: string
          description: Phone number.
        postal_address_as_full_text:
          type: string
          description: Postal address as a single text block.
        country_as_iso_3166_1_alpha_2:
          type: string
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2.
        postcode:
          type: string
          description: Postal code.
        role:
          type: string
          enum:
          - nurse
          - healthcare-assistant
          - doctor
          - other
          - ''
          description: 'Primary clinical role of the assessing clinician: nurse, healthcare-assistant,
            doctor, or other.'
        registration_body:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - GPhC
          - other
          - ''
          description: 'Professional registration body: GMC, NMC, HCPC, GPhC, or other.'
        registration_number:
          type: string
          description: Professional registration number issued by the registration body.
      required:
      - created_at
      - updated_at
      - name
      - role
      - registration_body
      - registration_number
      description: Clinician identifying information for the person who recorded the MEWS observation
        set.
    ModifiedEarlyWarningScore:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patient_id:
          type: string
          format: uuid
          description: 'Foreign key to the patient observed (RESTRICT: patients are not deleted while
            observations exist).'
        clinician_id:
          type: string
          format: uuid
          description: Foreign key to the clinician who recorded the observation set (RESTRICT); NULL
            until assigned.
        status:
          type: string
          enum:
          - draft
          - submitted
          - amended
          - signed
          description: 'Workflow status: draft, submitted, amended, or signed.'
        observation_at:
          type: string
          format: date-time
          description: Date and time the observation set was taken; NULL when not yet recorded.
        care_setting:
          type: string
          enum:
          - acute-ward
          - admissions-unit
          - assessment-unit
          - other
          - ''
          description: 'Care setting where the observations were recorded: acute-ward, admissions-unit,
            assessment-unit, or other.'
        ward_or_location:
          type: string
          maxLength: 255
          description: Ward or bed location where the observations were recorded.
        systolic_blood_pressure:
          type: integer
          format: int32
          description: Systolic blood pressure in mmHg; NULL when not recorded.
        heart_rate:
          type: integer
          format: int32
          description: Heart rate in beats per minute; NULL when not recorded.
        respiratory_rate:
          type: integer
          format: int32
          description: Respiratory rate in breaths per minute; NULL when not recorded.
        temperature:
          type: number
          format: double
          description: Body temperature in degrees Celsius; NULL when not recorded.
        consciousness_avpu:
          type: string
          enum:
          - A
          - V
          - P
          - U
          - ''
          description: 'Consciousness level on the AVPU scale: A (alert), V (voice), P (pain), U (unresponsive).'
        previous_mews_score:
          type: integer
          format: int32
          description: Aggregate MEWS from the previous observation set, used only to compute the deteriorating-trend
            flag; NULL when unavailable and never part of this aggregate.
        clinical_notes:
          type: string
          description: Free-text clinical notes accompanying the observation set.
      required:
      - created_at
      - updated_at
      - patient_id
      - status
      - care_setting
      - ward_or_location
      - consciousness_avpu
      - clinical_notes
      description: 'Main MEWS observation record: raw physiological observations for a single vital-sign
        set plus recording context (care setting, ward/location, observation timestamp) and the optional
        previous aggregate for the deteriorating-trend flag. Sub-scores, aggregate, risk band, rules,
        and flags live in child tables.'
    ModifiedEarlyWarningScoreGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        modified_early_warning_score_id:
          type: string
          format: uuid
          description: Foreign key to the parent observation record (unique, 1:1).
        aggregate_score:
          type: integer
          format: int32
          description: 'Aggregate MEWS total (0-14): sum of the five parameter sub-scores; NULL until
            computed.'
        systolic_blood_pressure_score:
          type: integer
          format: int32
          description: Systolic-blood-pressure sub-score (0-3); NULL when the observation was not recorded.
        heart_rate_score:
          type: integer
          format: int32
          description: Heart-rate sub-score (0-3); NULL when not recorded.
        respiratory_rate_score:
          type: integer
          format: int32
          description: Respiratory-rate sub-score (0-3); NULL when not recorded.
        temperature_score:
          type: integer
          format: int32
          description: Temperature sub-score (0-3); NULL when not recorded.
        avpu_score:
          type: integer
          format: int32
          description: Consciousness (AVPU) sub-score (0-3); NULL when not recorded.
        single_parameter_trigger:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Single-parameter trigger: whether any single parameter scored 3, which warrants
            urgent review regardless of the aggregate.'
        risk_band:
          type: string
          enum:
          - low
          - medium
          - high
          - ''
          description: 'Derived clinical-risk band: low (0-1), medium (2-4), or high (>= 5).'
        monitoring_frequency:
          type: string
          description: Recommended monitoring frequency for the risk band (e.g. routine, increased, hourly,
            continuous).
        graded_at:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the grade.
      required:
      - created_at
      - updated_at
      - modified_early_warning_score_id
      - single_parameter_trigger
      - risk_band
      - monitoring_frequency
      - graded_at
      description: 'Computed MEWS grading result: five per-parameter sub-scores, aggregate total (0-14),
        single-parameter trigger indicator, derived clinical-risk band, and recommended monitoring frequency.
        One row per observation record (1:1).'
    ModifiedEarlyWarningScoreGradeFlag:
      type: object
