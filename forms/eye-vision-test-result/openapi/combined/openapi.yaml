components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        name:
          type: string
          description: Name.
        email:
          type: string
          description: Email address.
        phone:
          type: string
          description: Phone number.
        postal_address_as_full_text:
          type: string
          description: Postal address as full text.
        country_as_iso_3166_1_alpha_2:
          type: string
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type: string
          description: Postal code, such as for validating the postal address.
        role:
          type: string
          enum:
          - ophthalmologist
          - optometrist
          - orthoptist
          - other
          - ''
          description: 'Reporting clinician role: ophthalmologist, optometrist, orthoptist, other.'
        registration_body:
          type: string
          enum:
          - GMC
          - GOC
          - HCPC
          - other
          - ''
          description: 'Clinician registration body: GMC, GOC, HCPC, other.'
        registration_number:
          type: string
          description: Clinician registration number.
        united_kingdom_nhs_number:
          type: string
          maxLength: 12
          description: United Kingdom NHS number, unique per person.
      required:
      - created_at
      - updated_at
      - name
      - role
      - registration_body
      - registration_number
      description: Reporting clinician (ophthalmologist, optometrist, or orthoptist) who authors and signs
        the eye vision test result report.
    EyeVisionTestResult:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        patient_id:
          type: string
          format: uuid
          description: Foreign key to the patient.
        clinician_id:
          type: string
          format: uuid
          description: Foreign key to the reporting clinician (ophthalmologist / optometrist / orthoptist).
        originating_request_reference:
          type: string
          maxLength: 255
          description: Free-text reference linking this report back to the originating eye vision test
            request (referral).
        report_status:
          type: string
          enum:
          - preliminary
          - final
          - amended
          - cancelled
          - ''
          description: 'Report lifecycle status: preliminary, final, amended, cancelled.'
        test_type:
          type: string
          enum:
          - visual-acuity
          - visual-fields
          - refraction
          - fundus-examination
          - optical-coherence-tomography
          - fluorescein-angiography
          - tonometry
          - slit-lamp
          - orthoptic-assessment
          - other
          - ''
          description: 'Performed eye examination type: visual-acuity, visual-fields, refraction, fundus-examination,
            optical-coherence-tomography, fluorescein-angiography, tonometry, slit-lamp, orthoptic-assessment,
            other.'
        performed_date:
          type: string
          format: date
          description: Date the eye examination was performed.
        reported_date:
          type: string
          format: date
          description: Date the report was authored / signed.
        clinical_history:
          type: string
          maxLength: 1000
          description: Clinical history and the question the examination was performed to answer.
        visual_acuity_right:
          type: string
          maxLength: 20
          description: Best-corrected visual acuity for the right eye, as text (e.g. 6/6, 6/9, CF, HM).
        visual_acuity_left:
          type: string
          maxLength: 20
          description: Best-corrected visual acuity for the left eye, as text (e.g. 6/6, 6/9, CF, HM).
        intraocular_pressure_right_mmhg:
          type: number
          format: double
          description: Intraocular pressure of the right eye in mmHg.
        intraocular_pressure_left_mmhg:
          type: number
          format: double
          description: Intraocular pressure of the left eye in mmHg.
        visual_field_result:
          type: string
          enum:
          - full
          - defect-right
          - defect-left
          - bilateral-defect
          - ''
          description: 'Visual-field result: full, defect-right, defect-left, bilateral-defect.'
        reduced_visual_acuity:
          type: boolean
          description: Whether reduced visual acuity is present in one or both eyes.
        visual_field_defect:
          type: boolean
          description: Whether a visual-field defect is present.
        raised_intraocular_pressure:
          type: boolean
          description: Whether intraocular pressure is raised (e.g. ocular hypertension / suspected glaucoma).
        diabetic_retinopathy:
          type: boolean
          description: Whether diabetic retinopathy is present.
        optic_disc_abnormality:
          type: boolean
          description: Whether an optic-disc abnormality (e.g. cupping, swelling, pallor) is present.
        macular_abnormality:
          type: boolean
          description: Whether a macular abnormality (e.g. maculopathy, oedema, degeneration) is present.
        normal_examination:
          type: boolean
          description: Whether the examination is entirely normal.
        retinopathy_grade:
          type: string
          enum:
          - none
          - background
          - pre-proliferative
          - proliferative
          - maculopathy
          - not-applicable
          - ''
          description: 'Diabetic-retinopathy grade: none, background, pre-proliferative, proliferative,
            maculopathy, not-applicable.'
        findings_narrative:
          type: string
          maxLength: 2000
          description: Narrative description of the examination findings (the body of the report).
        impression:
          type: string
          maxLength: 2000
          description: Summary impression / conclusion answering the clinical question.
        reporting_category:
          type: string
          maxLength: 100
          description: Free-text structured-reporting category label (e.g. a diabetic eye screening grade
            such as R0/R1/R2/R3/M1).
        recommended_follow_up:
          type: string
          maxLength: 1000
          description: Recommended follow-up examination, referral, or management.
        critical_result_communicated:
          type: boolean
          description: Whether a critical or unexpected significant result was communicated directly to
            the referrer.
        reported_to:
          type: string
          maxLength: 500
          description: Who the critical / urgent result was communicated to, with date and time if applicable.
      required:
      - created_at
      - updated_at
      - patient_id
      - clinician_id
      - originating_request_reference
      - report_status
      - test_type
      - clinical_history
      - visual_acuity_right
      - visual_acuity_left
      - visual_field_result
      - reduced_visual_acuity
      - visual_field_defect
      - raised_intraocular_pressure
      - diabetic_retinopathy
      - optic_disc_abnormality
      - macular_abnormality
      - normal_examination
      - retinopathy_grade
      - findings_narrative
      - impression
      - reporting_category
      - recommended_follow_up
      - critical_result_communicated
      - reported_to
      description: Eye vision test result (report) for an ophthalmic / optometric examination. Captures
        the performed test type, clinical history, the visual-acuity / intraocular-pressure / visual-field
        measurements, the narrative and structured findings (including diabetic retinopathy grading),
        the impression, recommended follow-up, and critical-result communication. This is the source-of-truth
        record that the four-axis interpretation grade is computed from.
    EyeVisionTestResultGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        eye_vision_test_result_id:
          type: string
          format: uuid
          description: Foreign key to the parent result (unique, 1:1).
        result_classification:
          type: string
          enum:
          - normal
          - abnormal
          - critical
          - inconclusive
          - ''
          description: 'Axis A overall classification: normal, abnormal, critical, inconclusive.'
        abnormality_severity:
          type: string
          enum:
          - none
          - minor
          - moderate
          - major
          - ''
          description: 'Axis B abnormality severity: none, minor, moderate, major.'
        reporting_category:
          type: string
          maxLength: 50
          description: Axis B structured-reporting score / category label (e.g. a diabetic eye screening
            grade such as R0/R1/R2/R3/M1).
        report_completeness_percent:
          type: integer
          format: int32
          description: Axis C report completeness as a percentage of mandatory report sections (0-100).
        follow_up_urgency:
          type: string
          enum:
          - routine
          - recommended
          - urgent
          - critical-alert
          - ''
          description: 'Axis D follow-up urgency: routine, recommended, urgent, critical-alert.'
        target_timeframe:
          type: string
          maxLength: 50
          description: Target timeframe for the recommended follow-up implied by the urgency.
        recommended_action:
          type: string
          maxLength: 500
          description: Axis D concise recommended action derived from the urgency.
        recommendation:
          type: string
          enum:
          - no-action
          - routine-follow-up
          - further-imaging
          - specialist-referral
          - urgent-review
          - ''
          description: 'Overall recommendation: no-action, routine-follow-up, further-imaging, specialist-referral,
            urgent-review.'
        clinician_notes:
          type: string
          description: Free-text interpretation / sign-off notes.
        signed_at:
          type: string
          format: date-time
          description: Timestamp of the reporting clinician electronic signature.
        graded_at:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the result.
      required:
      - created_at
      - updated_at
      - eye_vision_test_result_id
      - result_classification
      - abnormality_severity
      - reporting_category
      - follow_up_urgency
      - target_timeframe
      - recommended_action
      - recommendation
      - clinician_notes
      - graded_at
      description: 'Computed four-axis interpretation grade: result classification, abnormality severity
        / structured-reporting category, report completeness, and follow-up urgency. A critical result
        auto-escalates the follow-up urgency to critical-alert regardless of the other axes.'
    EyeVisionTestResultGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        eye_vision_test_result_grade_id:
