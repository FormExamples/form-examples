components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Name.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as full text.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code, such as for validating the postal address.
        role:
          type: string
          enum:
          - ophthalmologist
          - optometrist
          - orthoptist
          - other
          - ''
          description: 'Reporting clinician role: ophthalmologist, optometrist, orthoptist, other.'
        registrationBody:
          type: string
          enum:
          - GMC
          - GOC
          - HCPC
          - other
          - ''
          description: 'Clinician registration body: GMC, GOC, HCPC, other.'
        registrationNumber:
          type: string
          description: Clinician registration number.
        unitedKingdomNhsNumber:
          type:
          - string
          - 'null'
          maxLength: 12
          description: United Kingdom NHS number, unique per person.
      required:
      - createdAt
      - updatedAt
      - name
      - role
      - registrationBody
      - registrationNumber
      description: Reporting clinician (ophthalmologist, optometrist, or orthoptist) who authors and signs
        the eye vision test result report.
    EyeVisionTestResult:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the patient.
        clinicianId:
          type: string
          format: uuid
          description: Foreign key to the reporting clinician (ophthalmologist / optometrist / orthoptist).
        originatingRequestReference:
          type: string
          maxLength: 255
          description: Free-text reference linking this report back to the originating eye vision test
            request (referral).
        reportStatus:
          type: string
          enum:
          - preliminary
          - final
          - amended
          - cancelled
          - ''
          description: 'Report lifecycle status: preliminary, final, amended, cancelled.'
        testType:
          type: string
          enum:
          - visual-acuity
          - visual-fields
          - refraction
          - fundus-examination
          - optical-coherence-tomography
          - fluorescein-angiography
          - tonometry
          - slit-lamp
          - orthoptic-assessment
          - other
          - ''
          description: 'Performed eye examination type: visual-acuity, visual-fields, refraction, fundus-examination,
            optical-coherence-tomography, fluorescein-angiography, tonometry, slit-lamp, orthoptic-assessment,
            other.'
        performedDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the eye examination was performed.
        reportedDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the report was authored / signed.
        clinicalHistory:
          type: string
          maxLength: 1000
          description: Clinical history and the question the examination was performed to answer.
        visualAcuityRight:
          type: string
          maxLength: 20
          description: Best-corrected visual acuity for the right eye, as text (e.g. 6/6, 6/9, CF, HM).
        visualAcuityLeft:
          type: string
          maxLength: 20
          description: Best-corrected visual acuity for the left eye, as text (e.g. 6/6, 6/9, CF, HM).
        intraocularPressureRightMmhg:
          type:
          - number
          - 'null'
          format: double
          description: Intraocular pressure of the right eye in mmHg.
        intraocularPressureLeftMmhg:
          type:
          - number
          - 'null'
          format: double
          description: Intraocular pressure of the left eye in mmHg.
        visualFieldResult:
          type: string
          enum:
          - full
          - defect-right
          - defect-left
          - bilateral-defect
          - ''
          description: 'Visual-field result: full, defect-right, defect-left, bilateral-defect.'
        reducedVisualAcuity:
          type: boolean
          description: Whether reduced visual acuity is present in one or both eyes.
        visualFieldDefect:
          type: boolean
          description: Whether a visual-field defect is present.
        raisedIntraocularPressure:
          type: boolean
          description: Whether intraocular pressure is raised (e.g. ocular hypertension / suspected glaucoma).
        diabeticRetinopathy:
          type: boolean
          description: Whether diabetic retinopathy is present.
        opticDiscAbnormality:
          type: boolean
          description: Whether an optic-disc abnormality (e.g. cupping, swelling, pallor) is present.
        macularAbnormality:
          type: boolean
          description: Whether a macular abnormality (e.g. maculopathy, oedema, degeneration) is present.
        normalExamination:
          type: boolean
          description: Whether the examination is entirely normal.
        retinopathyGrade:
          type: string
          enum:
          - none
          - background
          - pre-proliferative
          - proliferative
          - maculopathy
          - not-applicable
          - ''
          description: 'Diabetic-retinopathy grade: none, background, pre-proliferative, proliferative,
            maculopathy, not-applicable.'
        findingsNarrative:
          type: string
          maxLength: 2000
          description: Narrative description of the examination findings (the body of the report).
        impression:
          type: string
          maxLength: 2000
          description: Summary impression / conclusion answering the clinical question.
        reportingCategory:
          type: string
          maxLength: 100
          description: Free-text structured-reporting category label (e.g. a diabetic eye screening grade
            such as R0/R1/R2/R3/M1).
        recommendedFollowUp:
          type: string
          maxLength: 1000
          description: Recommended follow-up examination, referral, or management.
        criticalResultCommunicated:
          type: boolean
          description: Whether a critical or unexpected significant result was communicated directly to
            the referrer.
        reportedTo:
          type: string
          maxLength: 500
          description: Who the critical / urgent result was communicated to, with date and time if applicable.
      required:
      - createdAt
      - updatedAt
      - patientId
      - clinicianId
      - originatingRequestReference
      - reportStatus
      - testType
      - clinicalHistory
      - visualAcuityRight
      - visualAcuityLeft
      - visualFieldResult
      - reducedVisualAcuity
      - visualFieldDefect
      - raisedIntraocularPressure
      - diabeticRetinopathy
      - opticDiscAbnormality
      - macularAbnormality
      - normalExamination
      - retinopathyGrade
      - findingsNarrative
      - impression
      - reportingCategory
      - recommendedFollowUp
      - criticalResultCommunicated
      - reportedTo
      description: Eye vision test result (report) for an ophthalmic / optometric examination. Captures
        the performed test type, clinical history, the visual-acuity / intraocular-pressure / visual-field
        measurements, the narrative and structured findings (including diabetic retinopathy grading),
        the impression, recommended follow-up, and critical-result communication. This is the source-of-truth
        record that the four-axis interpretation grade is computed from.
    EyeVisionTestResultGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        eyeVisionTestResultId:
          type: string
          format: uuid
          description: Foreign key to the parent result (unique, 1:1).
        resultClassification:
          type: string
          enum:
          - normal
          - abnormal
          - critical
          - inconclusive
          - ''
          description: 'Axis A overall classification: normal, abnormal, critical, inconclusive.'
        abnormalitySeverity:
          type: string
          enum:
          - none
          - minor
          - moderate
          - major
          - ''
          description: 'Axis B abnormality severity: none, minor, moderate, major.'
        reportingCategory:
          type: string
          maxLength: 50
          description: Axis B structured-reporting score / category label (e.g. a diabetic eye screening
            grade such as R0/R1/R2/R3/M1).
        reportCompletenessPercent:
          type:
          - integer
          - 'null'
          format: int32
          description: Axis C report completeness as a percentage of mandatory report sections (0-100).
        followUpUrgency:
          type: string
          enum:
          - routine
          - recommended
          - urgent
          - critical-alert
          - ''
          description: 'Axis D follow-up urgency: routine, recommended, urgent, critical-alert.'
        targetTimeframe:
          type: string
          maxLength: 50
          description: Target timeframe for the recommended follow-up implied by the urgency.
        recommendedAction:
          type: string
          maxLength: 500
          description: Axis D concise recommended action derived from the urgency.
        recommendation:
          type: string
          enum:
          - no-action
          - routine-follow-up
          - further-imaging
          - specialist-referral
          - urgent-review
          - ''
          description: 'Overall recommendation: no-action, routine-follow-up, further-imaging, specialist-referral,
            urgent-review.'
        clinicianNotes:
          type: string
          description: Free-text interpretation / sign-off notes.
        signedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Timestamp of the reporting clinician electronic signature.
        gradedAt:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the result.
      required:
      - createdAt
      - updatedAt
      - eyeVisionTestResultId
      - resultClassification
      - abnormalitySeverity
      - reportingCategory
      - followUpUrgency
      - targetTimeframe
      - recommendedAction
      - recommendation
      - clinicianNotes
      - gradedAt
      description: 'Computed four-axis interpretation grade: result classification, abnormality severity
        / structured-reporting category, report completeness, and follow-up urgency. A critical result
        auto-escalates the follow-up urgency to critical-alert regardless of the other axes.'
    EyeVisionTestResultGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        eyeVisionTestResultGradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        flagId:
          type: string
          maxLength: 50
          description: Stable flag identifier (e.g. F-CRITICAL-RESULT-001).
        category:
          type: string
          enum:
          - critical-result-alert
          - incidental-finding
          - discrepancy-with-request
          - abnormal-requiring-action
          - urgent-referral
          - inadequate-technique
          - unexpected-finding
          - missing-impression
          - missing-measurement
          - other
          - ''
          description: Flag category.
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          - ''
          description: 'Priority: low, medium, high.'
