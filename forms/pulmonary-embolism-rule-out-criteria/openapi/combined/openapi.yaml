          type: string
          format: date-time
          description: Date and time the assessment was carried out.
        care_setting:
          type: string
          enum:
          - emergency-department
          - acute-ambulatory
          - other
          - ''
          description: 'Care setting: emergency-department, acute-ambulatory, or other.'
        presenting_complaint:
          type: string
          description: Symptom prompting consideration of pulmonary embolism.
        age:
          type: number
          format: double
          description: Patient age in years; the objective measurement behind criterion 1 (age < 50).
        heart_rate:
          type: number
          format: double
          description: Heart rate in beats per minute; the objective measurement behind criterion 2 (heart
            rate < 100).
        oxygen_saturation:
          type: number
          format: double
          description: Oxygen saturation (SpO2) as a percentage; the objective measurement behind criterion
            3 (SpO2 >= 95).
        pretest_probability:
          type: string
          enum:
          - low
          - not-low
          - ''
          description: 'Clinician gestalt pre-test probability: low or not-low. PERC applies only when
            low.'
        age_under_50:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Criterion 1 (satisfied when yes): age under 50 years.'
        heart_rate_under_100:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Criterion 2 (satisfied when yes): heart rate under 100 beats per minute.'
        spo2_at_least_95:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Criterion 3 (satisfied when yes): oxygen saturation at least 95 per cent.'
        no_unilateral_leg_swelling:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Criterion 4 (satisfied when yes): no unilateral leg swelling.'
        no_haemoptysis:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Criterion 5 (satisfied when yes): no haemoptysis.'
        no_recent_surgery_trauma:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Criterion 6 (satisfied when yes): no surgery or trauma within 4 weeks requiring
            general anaesthesia.'
        no_prior_dvt_pe:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Criterion 7 (satisfied when yes): no prior deep vein thrombosis or pulmonary embolism.'
        no_oestrogen_use:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Criterion 8 (satisfied when yes): no exogenous oestrogen use.'
        clinical_notes:
          type: string
          description: Free-text clinical notes captured alongside the assessment.
      required:
      - created_at
      - updated_at
      - patient_id
      - status
      - patient_identifier
      - care_setting
      - presenting_complaint
      - pretest_probability
      - age_under_50
      - heart_rate_under_100
      - spo2_at_least_95
      - no_unilateral_leg_swelling
      - no_haemoptysis
      - no_recent_surgery_trauma
      - no_prior_dvt_pe
      - no_oestrogen_use
      - clinical_notes
