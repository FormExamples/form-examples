      - name
      - birthDate
      - sex
      - allergiesSummary
      description: Patient demographic information used by the PERC assessment record.
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          description: A URI identifying the problem type
        title:
          type: string
          description: A short summary of the problem type
        status:
          type: integer
          description: The HTTP status code
        detail:
          type: string
          description: An explanation of this occurrence
        instance:
          type: string
          description: A URI identifying this occurrence
        code:
          type: string
          description: A short machine-readable reason
        errors:
          type: object
          description: Per-field detail, when validation failed
      required:
      - type
      - title
      - status
    PulmonaryEmbolismRuleOutCriteria:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the patient being assessed (restricts delete).
        clinicianId:
          type:
          - string
          - 'null'
          format: uuid
          description: Foreign key to the assessing clinician (restricts delete).
        status:
          type: string
          enum:
          - draft
          - submitted
          - amended
          - signed
          - ''
          description: 'Workflow status: draft, submitted, amended, or signed.'
        patientIdentifier:
          type: string
          maxLength: 64
          description: Local patient identifier as recorded at the point of assessment.
        assessedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Date and time the assessment was carried out.
        careSetting:
          type: string
          enum:
          - emergency-department
          - acute-ambulatory
          - other
          - ''
          description: 'Care setting: emergency-department, acute-ambulatory, or other.'
        presentingComplaint:
          type: string
          description: Symptom prompting consideration of pulmonary embolism.
        age:
          type:
          - number
          - 'null'
          format: double
          description: Patient age in years; the objective measurement behind criterion 1 (age < 50).
        heartRate:
          type:
          - number
          - 'null'
          format: double
          description: Heart rate in beats per minute; the objective measurement behind criterion 2 (heart
            rate < 100).
        oxygenSaturation:
          type:
          - number
          - 'null'
          format: double
          description: Oxygen saturation (SpO2) as a percentage; the objective measurement behind criterion
            3 (SpO2 >= 95).
        pretestProbability:
          type: string
          enum:
          - low
          - not-low
          - ''
          description: 'Clinician gestalt pre-test probability: low or not-low. PERC applies only when
            low.'
        ageUnder50:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Criterion 1 (satisfied when yes): age under 50 years.'
        heartRateUnder100:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Criterion 2 (satisfied when yes): heart rate under 100 beats per minute.'
        spo2AtLeast95:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Criterion 3 (satisfied when yes): oxygen saturation at least 95 per cent.'
        noUnilateralLegSwelling:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Criterion 4 (satisfied when yes): no unilateral leg swelling.'
        noHaemoptysis:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Criterion 5 (satisfied when yes): no haemoptysis.'
        noRecentSurgeryTrauma:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Criterion 6 (satisfied when yes): no surgery or trauma within 4 weeks requiring
            general anaesthesia.'
        noPriorDvtPe:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Criterion 7 (satisfied when yes): no prior deep vein thrombosis or pulmonary embolism.'
        noOestrogenUse:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Criterion 8 (satisfied when yes): no exogenous oestrogen use.'
        clinicalNotes:
          type: string
          description: Free-text clinical notes captured alongside the assessment.
      required:
      - createdAt
      - updatedAt
      - patientId
      - status
      - patientIdentifier
      - careSetting
      - presentingComplaint
      - pretestProbability
      - ageUnder50
      - heartRateUnder100
      - spo2AtLeast95
      - noUnilateralLegSwelling
      - noHaemoptysis
      - noRecentSurgeryTrauma
      - noPriorDvtPe
      - noOestrogenUse
      - clinicalNotes
      description: 'Main PERC assessment record: identification, context, the pre-test probability gate,
        and the eight objective criterion inputs.'
    PulmonaryEmbolismRuleOutCriteriaGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        pulmonaryEmbolismRuleOutCriteriaId:
          type: string
          format: uuid
          description: Foreign key to the parent assessment (unique, 1:1).
        classification:
          type: string
          enum:
          - perc-negative
          - perc-positive
          - ''
          description: 'Binary PERC classification: perc-negative (PE excluded without further testing)
            or perc-positive (proceed to D-dimer / imaging).'
        allCriteriaSatisfied:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether all eight criteria were satisfied (yes) or at least one failed (no).
        applicable:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether PERC was applicable (yes when pre-test probability is low; otherwise no).
