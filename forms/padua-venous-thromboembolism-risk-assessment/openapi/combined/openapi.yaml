components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Clinician full name as recorded in the rota.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as a single text block.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code.
        role:
          type: string
          enum:
          - doctor
          - nurse
          - pharmacist
          - other
          - ''
          description: 'Primary clinical role of the assessing clinician: doctor, nurse, pharmacist, or
            other.'
        registrationBody:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - GPhC
          - other
          - ''
          description: 'Professional registration body: GMC, NMC, HCPC, GPhC, or other.'
        registrationNumber:
          type: string
          description: Professional registration number issued by the registration body.
      required:
      - createdAt
      - updatedAt
      - name
      - role
      - registrationBody
      - registrationNumber
      description: Clinician identifying information for the clinician performing the Padua VTE risk assessment.
    PaduaVenousThromboembolismRiskAssessment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the patient being assessed (delete restricted).
        clinicianId:
          type:
          - string
          - 'null'
          format: uuid
          description: Foreign key to the assessing clinician (optional; delete restricted).
        clinicianName:
          type: string
          maxLength: 255
          description: Name of the assessing clinician as recorded on the assessment.
        clinicianRole:
          type: string
          enum:
          - doctor
          - nurse
          - pharmacist
          - other
          - ''
          description: 'Role of the assessing clinician: doctor, nurse, pharmacist, or other.'
        assessedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Date and time the assessment was performed.
        careSetting:
          type: string
          enum:
          - acute-medical
          - general-medical
          - admissions-unit
          - other
          - ''
          description: 'Care setting: acute-medical, general-medical, admissions-unit, or other.'
        admissionReason:
          type: string
          description: Free-text reason for the patient's admission.
        patientIdentifier:
          type: string
          maxLength: 100
          description: Local patient identifier as recorded on the assessment.
        ageYears:
          type:
          - number
          - 'null'
          format: double
          description: Patient age in years; drives risk factor 6 (age >= 70 scores 1 point). Null when
            unanswered.
        sex:
          type: string
          enum:
          - female
          - male
          - intersex
          - unknown
          - ''
          description: 'Patient sex recorded for the assessment: female, male, intersex, or unknown.'
        activeCancer:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Risk factor 1 — active cancer (3 points): yes or no.'
        previousVte:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Risk factor 2 — previous VTE, excluding superficial vein thrombosis (3 points):
            yes or no.'
        reducedMobility:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Risk factor 3 — reduced mobility (bed rest with bathroom privileges) for at least
            3 days (3 points): yes or no.'
        knownThrombophilia:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Risk factor 4 — known thrombophilic condition (3 points): yes or no.'
        recentTraumaOrSurgery:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Risk factor 5 — recent (<= 1 month) trauma and/or surgery (2 points): yes or no.'
      required:
      - createdAt
      - updatedAt
      - patientId
      - clinicianName
      - clinicianRole
      - careSetting
      - admissionReason
      - patientIdentifier
      - sex
      - activeCancer
      - previousVte
      - reducedMobility
      - knownThrombophilia
      - recentTraumaOrSurgery
      description: 'Main Padua VTE risk-assessment record: assessment context, patient identification,
        the eleven weighted risk-factor inputs, and the informational bleeding-risk check.'
    PaduaVenousThromboembolismRiskAssessmentGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        paduaVenousThromboembolismRiskAssessmentId:
          type: string
          format: uuid
          description: Foreign key to the parent assessment (unique, 1:1).
        activeCancerPoints:
          type:
          - integer
          - 'null'
          format: int32
          description: Points contributed by factor 1, active cancer (3 or 0).
        previousVtePoints:
          type:
          - integer
          - 'null'
          format: int32
          description: Points contributed by factor 2, previous VTE (3 or 0).
        reducedMobilityPoints:
          type:
          - integer
          - 'null'
          format: int32
          description: Points contributed by factor 3, reduced mobility >= 3 days (3 or 0).
        knownThrombophiliaPoints:
          type:
          - integer
          - 'null'
          format: int32
          description: Points contributed by factor 4, known thrombophilia (3 or 0).
        recentTraumaOrSurgeryPoints:
          type:
          - integer
          - 'null'
          format: int32
          description: Points contributed by factor 5, recent trauma or surgery <= 1 month (2 or 0).
        elderlyAgePoints:
          type:
          - integer
          - 'null'
          format: int32
          description: Points contributed by factor 6, age >= 70 (1 or 0).
        heartOrRespiratoryFailurePoints:
          type:
          - integer
          - 'null'
          format: int32
          description: Points contributed by factor 7, heart and/or respiratory failure (1 or 0).
        acuteMiOrIschaemicStrokePoints:
          type:
          - integer
          - 'null'
          format: int32
          description: Points contributed by factor 8, acute MI or ischaemic stroke (1 or 0).
        acuteInfectionOrRheumatologicalPoints:
          type:
          - integer
          - 'null'
          format: int32
          description: Points contributed by factor 9, acute infection and/or rheumatological disorder
            (1 or 0).
        obesityPoints:
          type:
          - integer
          - 'null'
          format: int32
          description: Points contributed by factor 10, obesity BMI >= 30 (1 or 0).
        ongoingHormonalTreatmentPoints:
          type:
          - integer
          - 'null'
          format: int32
          description: Points contributed by factor 11, ongoing hormonal treatment (1 or 0).
        totalScore:
          type:
          - integer
          - 'null'
          format: int32
          description: Summed Padua Prediction Score across the eleven factors (0-20).
        riskBand:
          type: string
          enum:
          - low
          - high
          - ''
          description: 'Derived risk band: low (< 4) or high (>= 4).'
        prophylaxisRecommendation:
          type: string
          description: 'Prophylaxis recommendation gated by the bleeding-risk check: pharmacological,
            mechanical, or none.'
        gradedAt:
