      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        patient_id:
          type: string
          format: uuid
          description: Foreign key to the patient being assessed (delete restricted).
        clinician_id:
          type: string
          format: uuid
          description: Foreign key to the assessing clinician (optional; delete restricted).
        clinician_name:
          type: string
          maxLength: 255
          description: Name of the assessing clinician as recorded on the assessment.
        clinician_role:
          type: string
          enum:
          - doctor
          - nurse
          - pharmacist
          - other
          - ''
          description: 'Role of the assessing clinician: doctor, nurse, pharmacist, or other.'
        assessed_at:
          type: string
          format: date-time
          description: Date and time the assessment was performed.
        care_setting:
          type: string
          enum:
          - acute-medical
          - general-medical
          - admissions-unit
          - other
          - ''
          description: 'Care setting: acute-medical, general-medical, admissions-unit, or other.'
        admission_reason:
          type: string
          description: Free-text reason for the patient's admission.
        patient_identifier:
          type: string
          maxLength: 100
          description: Local patient identifier as recorded on the assessment.
        age_years:
          type: number
          format: double
          description: Patient age in years; drives risk factor 6 (age >= 70 scores 1 point). Null when
            unanswered.
        sex:
          type: string
          enum:
          - female
          - male
          - intersex
          - unknown
          - ''
          description: 'Patient sex recorded for the assessment: female, male, intersex, or unknown.'
        active_cancer:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Risk factor 1 — active cancer (3 points): yes or no.'
        previous_vte:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Risk factor 2 — previous VTE, excluding superficial vein thrombosis (3 points):
            yes or no.'
        reduced_mobility:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Risk factor 3 — reduced mobility (bed rest with bathroom privileges) for at least
            3 days (3 points): yes or no.'
        known_thrombophilia:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Risk factor 4 — known thrombophilic condition (3 points): yes or no.'
        recent_trauma_or_surgery:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Risk factor 5 — recent (<= 1 month) trauma and/or surgery (2 points): yes or no.'
      required:
      - created_at
      - updated_at
      - patient_id
      - clinician_name
      - clinician_role
      - care_setting
      - admission_reason
      - patient_identifier
      - sex
      - active_cancer
      - previous_vte
      - reduced_mobility
      - known_thrombophilia
      - recent_trauma_or_surgery
      description: 'Main Padua VTE risk-assessment record: assessment context, patient identification,
        the eleven weighted risk-factor inputs, and the informational bleeding-risk check.'
    PaduaVenousThromboembolismRiskAssessmentGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the row was soft-deleted.
        padua_venous_thromboembolism_risk_assessment_id:
          type: string
          format: uuid
          description: Foreign key to the parent assessment (unique, 1:1).
        active_cancer_points:
          type: integer
          format: int32
          description: Points contributed by factor 1, active cancer (3 or 0).
        previous_vte_points:
          type: integer
          format: int32
          description: Points contributed by factor 2, previous VTE (3 or 0).
        reduced_mobility_points:
          type: integer
          format: int32
          description: Points contributed by factor 3, reduced mobility >= 3 days (3 or 0).
        known_thrombophilia_points:
          type: integer
          format: int32
          description: Points contributed by factor 4, known thrombophilia (3 or 0).
        recent_trauma_or_surgery_points:
          type: integer
          format: int32
          description: Points contributed by factor 5, recent trauma or surgery <= 1 month (2 or 0).
        elderly_age_points:
          type: integer
          format: int32
          description: Points contributed by factor 6, age >= 70 (1 or 0).
        heart_or_respiratory_failure_points:
          type: integer
          format: int32
          description: Points contributed by factor 7, heart and/or respiratory failure (1 or 0).
        acute_mi_or_ischaemic_stroke_points:
          type: integer
          format: int32
          description: Points contributed by factor 8, acute MI or ischaemic stroke (1 or 0).
        acute_infection_or_rheumatological_points:
          type: integer
          format: int32
          description: Points contributed by factor 9, acute infection and/or rheumatological disorder
            (1 or 0).
        obesity_points:
          type: integer
          format: int32
          description: Points contributed by factor 10, obesity BMI >= 30 (1 or 0).
        ongoing_hormonal_treatment_points:
          type: integer
          format: int32
          description: Points contributed by factor 11, ongoing hormonal treatment (1 or 0).
        total_score:
          type: integer
          format: int32
          description: Summed Padua Prediction Score across the eleven factors (0-20).
        risk_band:
          type: string
          enum:
          - low
          - high
          - ''
          description: 'Derived risk band: low (< 4) or high (>= 4).'
        prophylaxis_recommendation:
          type: string
          description: 'Prophylaxis recommendation gated by the bleeding-risk check: pharmacological,
            mechanical, or none.'
        graded_at:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the grade.
      required:
      - created_at
      - updated_at
      - padua_venous_thromboembolism_risk_assessment_id
      - risk_band
      - prophylaxis_recommendation
      - graded_at
