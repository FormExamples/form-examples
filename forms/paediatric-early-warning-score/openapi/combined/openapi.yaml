components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Clinician full name as recorded in the rota.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as a single text block.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code.
        role:
          type: string
          enum:
          - nurse
          - healthcare-assistant
          - doctor
          - other
          - ''
          description: 'Assessing clinical role: nurse, healthcare-assistant, doctor, or other.'
        registrationBody:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - GPhC
          - other
          - ''
          description: 'Professional registration body: GMC, NMC, HCPC, GPhC, or other.'
        registrationNumber:
          type: string
          description: Professional registration number issued by the registration body.
      required:
      - createdAt
      - updatedAt
      - name
      - role
      - registrationBody
      - registrationNumber
      description: Clinician identifying information for the person who recorded the paediatric early
        warning score observation set.
    PaediatricEarlyWarningScore:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patientId:
          type: string
          format: uuid
          description: 'Foreign key to the child observed (RESTRICT: patients are not deleted while observations
            exist).'
        clinicianId:
          type:
          - string
          - 'null'
          format: uuid
          description: Foreign key to the clinician who recorded the observation set (RESTRICT); NULL
            until assigned.
        status:
          type: string
          enum:
          - draft
          - submitted
          - amended
          - signed
          description: 'Workflow status: draft, submitted, amended, or signed.'
        observationAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Date and time the observation set was taken; NULL when not yet recorded.
        careSetting:
          type: string
          enum:
          - ward
          - childrens-assessment-unit
          - emergency-department
          - other
          - ''
          description: 'Care setting where the observations were recorded: ward, childrens-assessment-unit,
            emergency-department, or other.'
        ageBand:
          type: string
          enum:
          - neonate
          - infant
          - young-child
          - child
          - adolescent
          - ''
          description: 'Age band selected first; sets the normal respiratory-rate and heart-rate ranges:
            neonate (0-<1 month), infant (1-11 months), young-child (1-4 years), child (5-11 years), or
            adolescent (>=12 years).'
        respiratoryRate:
          type:
          - integer
          - 'null'
          format: int32
          description: Respiratory rate in breaths per minute, scored against the age-band normal range;
            NULL when not recorded.
        respiratoryEffort:
          type: string
          enum:
          - none
          - mild
          - moderate
          - severe
          - ''
          description: 'Respiratory effort / recession: none, mild, moderate, or severe (grunting).'
        oxygenSaturation:
          type:
          - integer
          - 'null'
          format: int32
          description: Oxygen saturation (SpO2) as a percentage; NULL when not recorded.
        supplementalOxygen:
          type: string
          enum:
          - room-air
          - low-flow
          - high-flow
          - ''
          description: 'Supplemental-oxygen requirement: room-air, low-flow, or high-flow.'
        heartRate:
          type:
          - integer
          - 'null'
          format: int32
          description: Heart rate in beats per minute, scored against the age-band normal range; NULL
            when not recorded.
        capillaryRefill:
          type: string
          enum:
          - under-2s
          - 2-3s
          - 3-4s
          - over-4s
          - ''
          description: 'Capillary refill time / colour: under-2s, 2-3s, 3-4s, or over-4s.'
        consciousnessAcvpu:
          type: string
          enum:
          - alert
          - voice
          - pain
          - unresponsive
          - ''
          description: 'Consciousness level on the ACVPU scale: alert, voice, pain, or unresponsive.'
        nurseConcern:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Documented nurse / staff concern: an independent escalation trigger.'
        parentConcern:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Documented parent / carer concern: an independent escalation trigger.'
        clinicalNotes:
          type: string
          description: Free-text clinical notes accompanying the observation set.
      required:
      - createdAt
      - updatedAt
      - patientId
      - status
      - careSetting
      - ageBand
      - respiratoryEffort
      - supplementalOxygen
      - capillaryRefill
      - consciousnessAcvpu
      - nurseConcern
      - parentConcern
      - clinicalNotes
      description: 'Main PEWS observation record: raw physiological observations for a single measurement
        set plus recording context (age band, care setting, observation timestamp) and the documented-concern
        override triggers. Sub-scores, aggregate, escalation band, rules, and flags live in child tables.'
    PaediatricEarlyWarningScoreGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        paediatricEarlyWarningScoreId:
          type: string
          format: uuid
          description: Foreign key to the parent observation record (unique, 1:1).
        aggregateScore:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Aggregate PEWS total (0-21): sum of the seven parameter sub-scores; NULL until
            computed.'
        maxParameterScore:
          type:
          - integer
          - 'null'
          format: int32
          description: Maximum of the seven parameter sub-scores (0-3); a value of 3 fires the single-parameter
            override trigger.
        respiratoryRateScore:
          type:
          - integer
          - 'null'
          format: int32
          description: Respiratory-rate sub-score (0-3), scored against the age-band normal range; NULL
            when not recorded or the age band was unset.
        respiratoryEffortScore:
          type:
          - integer
          - 'null'
          format: int32
          description: Respiratory-effort / recession sub-score (0-3); NULL when not recorded.
        oxygenSaturationScore:
          type:
          - integer
          - 'null'
          format: int32
          description: Oxygen-saturation (SpO2) sub-score (0-3); NULL when not recorded.
        supplementalOxygenScore:
          type:
          - integer
          - 'null'
          format: int32
          description: Supplemental-oxygen sub-score (0, 1, or 3); NULL when not recorded.
        heartRateScore:
          type:
          - integer
          - 'null'
          format: int32
          description: Heart-rate sub-score (0-3), scored against the age-band normal range; NULL when
            not recorded or the age band was unset.
        capillaryRefillScore:
          type:
          - integer
          - 'null'
          format: int32
          description: Capillary-refill / colour sub-score (0-3); NULL when not recorded.
        consciousnessScore:
          type:
          - integer
          - 'null'
          format: int32
          description: Consciousness (ACVPU) sub-score (0-3); NULL when not recorded.
        riskBand:
          type: string
          enum:
          - routine
          - low
          - medium
          - high
          - ''
          description: Derived escalation band from the aggregate total (>=6 high, 4-5 medium, 2-3 low,
            else routine), raised as needed by the override triggers.
        singleParameterTrigger:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether any single parameter scored 3 (max_parameter_score = 3), an independent
            escalation trigger to at least medium.
        concernTrigger:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether a documented nurse / staff or parent / carer concern fired an independent
            escalation trigger.
        monitoringFrequency:
          type: string
          description: Recommended monitoring frequency and escalation response for the escalation band
            (e.g. routine observations, hourly, continuous with immediate senior review).
        gradedAt:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the grade.
      required:
      - createdAt
      - updatedAt
      - paediatricEarlyWarningScoreId
      - riskBand
      - singleParameterTrigger
      - concernTrigger
      - monitoringFrequency
      - gradedAt
      description: 'Computed PEWS grading result: per-parameter 0-3 sub-scores, aggregate total (0-21),
        maximum single-parameter sub-score, derived escalation band, single-parameter-3 and documented-concern
        override triggers, and recommended monitoring frequency. One row per observation record (1:1).'
    PaediatricEarlyWarningScoreGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        paediatricEarlyWarningScoreGradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        flagId:
          type: string
          maxLength: 50
          description: Stable flag identifier (e.g. F-SINGLE-PARAMETER-3-001).
        category:
          type: string
          enum:
          - urgent-review
          - single-parameter-3
          - parent-nurse-concern
          - deteriorating-trend
          - incomplete
          - other
          - ''
          description: 'Flag category: urgent-review, single-parameter-3, parent-nurse-concern, deteriorating-trend,
            incomplete, or other.'
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          - ''
          description: 'Priority: low, medium, high.'
        description:
          type: string
          maxLength: 500
          description: Human-readable description of what fired the flag.
        suggestedAction:
          type: string
          maxLength: 500
          description: Suggested clinical action (e.g. "immediate senior review; consider critical-care
            outreach", "escalate and act on documented concern").
      required:
      - createdAt
      - updatedAt
      - paediatricEarlyWarningScoreGradeId
      - flagId
      - category
      - priority
      - description
      - suggestedAction
      description: Safety-critical flags that fire independently of the aggregate escalation band, with
        priority and a suggested action for the ward and escalation team.
    PaediatricEarlyWarningScoreGradeRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
