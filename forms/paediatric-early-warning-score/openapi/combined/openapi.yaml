      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the row was soft-deleted.
        paediatric_early_warning_score_grade_id:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        flag_id:
          type: string
          maxLength: 50
          description: Stable flag identifier (e.g. F-SINGLE-PARAMETER-3-001).
        category:
          type: string
          enum:
          - urgent-review
          - single-parameter-3
          - parent-nurse-concern
          - deteriorating-trend
          - incomplete
          - other
          - ''
          description: 'Flag category: urgent-review, single-parameter-3, parent-nurse-concern, deteriorating-trend,
            incomplete, or other.'
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          - ''
          description: 'Priority: low, medium, high.'
        description:
          type: string
          maxLength: 500
          description: Human-readable description of what fired the flag.
        suggested_action:
          type: string
          maxLength: 500
          description: Suggested clinical action (e.g. "immediate senior review; consider critical-care
            outreach", "escalate and act on documented concern").
      required:
      - created_at
