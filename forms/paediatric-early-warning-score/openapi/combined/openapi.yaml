      - role
      - registration_body
      - registration_number
      description: Clinician identifying information for the person who recorded the paediatric early
        warning score observation set.
    PaediatricEarlyWarningScore:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        patient_id:
          type: string
          format: uuid
          description: 'Foreign key to the child observed (RESTRICT: patients are not deleted while observations
            exist).'
        clinician_id:
          type: string
          format: uuid
          description: Foreign key to the clinician who recorded the observation set (RESTRICT); NULL
            until assigned.
        status:
          type: string
          enum:
          - draft
          - submitted
          - amended
          - signed
          description: 'Workflow status: draft, submitted, amended, or signed.'
        observation_at:
          type: string
          format: date-time
          description: Date and time the observation set was taken; NULL when not yet recorded.
        care_setting:
          type: string
          enum:
          - ward
          - childrens-assessment-unit
          - emergency-department
          - other
          - ''
          description: 'Care setting where the observations were recorded: ward, childrens-assessment-unit,
            emergency-department, or other.'
        age_band:
          type: string
          enum:
          - neonate
          - infant
          - young-child
          - child
          - adolescent
          - ''
          description: 'Age band selected first; sets the normal respiratory-rate and heart-rate ranges:
            neonate (0-<1 month), infant (1-11 months), young-child (1-4 years), child (5-11 years), or
            adolescent (>=12 years).'
        respiratory_rate:
          type: integer
          format: int32
          description: Respiratory rate in breaths per minute, scored against the age-band normal range;
            NULL when not recorded.
        respiratory_effort:
          type: string
          enum:
          - none
          - mild
          - moderate
          - severe
          - ''
          description: 'Respiratory effort / recession: none, mild, moderate, or severe (grunting).'
        oxygen_saturation:
          type: integer
          format: int32
          description: Oxygen saturation (SpO2) as a percentage; NULL when not recorded.
        supplemental_oxygen:
          type: string
          enum:
          - room-air
          - low-flow
          - high-flow
          - ''
          description: 'Supplemental-oxygen requirement: room-air, low-flow, or high-flow.'
        heart_rate:
          type: integer
          format: int32
          description: Heart rate in beats per minute, scored against the age-band normal range; NULL
            when not recorded.
        capillary_refill:
          type: string
          enum:
          - under-2s
          - 2-3s
          - 3-4s
          - over-4s
          - ''
          description: 'Capillary refill time / colour: under-2s, 2-3s, 3-4s, or over-4s.'
        consciousness_acvpu:
          type: string
          enum:
          - alert
          - voice
          - pain
          - unresponsive
          - ''
          description: 'Consciousness level on the ACVPU scale: alert, voice, pain, or unresponsive.'
        nurse_concern:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Documented nurse / staff concern: an independent escalation trigger.'
        parent_concern:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Documented parent / carer concern: an independent escalation trigger.'
        clinical_notes:
          type: string
          description: Free-text clinical notes accompanying the observation set.
      required:
      - created_at
      - updated_at
      - patient_id
      - status
      - care_setting
      - age_band
      - respiratory_effort
      - supplemental_oxygen
      - capillary_refill
      - consciousness_acvpu
      - nurse_concern
      - parent_concern
      - clinical_notes
      description: 'Main PEWS observation record: raw physiological observations for a single measurement
        set plus recording context (age band, care setting, observation timestamp) and the documented-concern
        override triggers. Sub-scores, aggregate, escalation band, rules, and flags live in child tables.'
    PaediatricEarlyWarningScoreGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the row was soft-deleted.
        paediatric_early_warning_score_id:
          type: string
          format: uuid
          description: Foreign key to the parent observation record (unique, 1:1).
        aggregate_score:
          type: integer
          format: int32
          description: 'Aggregate PEWS total (0-21): sum of the seven parameter sub-scores; NULL until
            computed.'
        max_parameter_score:
          type: integer
          format: int32
          description: Maximum of the seven parameter sub-scores (0-3); a value of 3 fires the single-parameter
            override trigger.
        respiratory_rate_score:
          type: integer
          format: int32
          description: Respiratory-rate sub-score (0-3), scored against the age-band normal range; NULL
            when not recorded or the age band was unset.
        respiratory_effort_score:
          type: integer
          format: int32
          description: Respiratory-effort / recession sub-score (0-3); NULL when not recorded.
        oxygen_saturation_score:
          type: integer
          format: int32
          description: Oxygen-saturation (SpO2) sub-score (0-3); NULL when not recorded.
        supplemental_oxygen_score:
          type: integer
          format: int32
          description: Supplemental-oxygen sub-score (0, 1, or 3); NULL when not recorded.
        heart_rate_score:
          type: integer
          format: int32
          description: Heart-rate sub-score (0-3), scored against the age-band normal range; NULL when
            not recorded or the age band was unset.
        capillary_refill_score:
          type: integer
          format: int32
          description: Capillary-refill / colour sub-score (0-3); NULL when not recorded.
        consciousness_score:
          type: integer
          format: int32
          description: Consciousness (ACVPU) sub-score (0-3); NULL when not recorded.
        risk_band:
          type: string
          enum:
          - routine
          - low
          - medium
          - high
          - ''
          description: Derived escalation band from the aggregate total (>=6 high, 4-5 medium, 2-3 low,
            else routine), raised as needed by the override triggers.
        single_parameter_trigger:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether any single parameter scored 3 (max_parameter_score = 3), an independent
            escalation trigger to at least medium.
        concern_trigger:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether a documented nurse / staff or parent / carer concern fired an independent
            escalation trigger.
        monitoring_frequency:
          type: string
          description: Recommended monitoring frequency and escalation response for the escalation band
            (e.g. routine observations, hourly, continuous with immediate senior review).
        graded_at:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the grade.
      required:
      - created_at
      - updated_at
      - paediatric_early_warning_score_id
      - risk_band
      - single_parameter_trigger
      - concern_trigger
      - monitoring_frequency
      - graded_at
      description: 'Computed PEWS grading result: per-parameter 0-3 sub-scores, aggregate total (0-21),
        maximum single-parameter sub-score, derived escalation band, single-parameter-3 and documented-concern
        override triggers, and recommended monitoring frequency. One row per observation record (1:1).'
