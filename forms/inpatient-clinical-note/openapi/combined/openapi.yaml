components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Clinician full name as recorded on the note.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as a single text block.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code.
        role:
          type: string
          enum:
          - foundation-doctor
          - core-trainee
          - specialty-registrar
          - consultant
          - acp
          - physician-associate
          - nurse
          - nurse-practitioner
          - pharmacist
          - allied-health-professional
          - other
          - ''
          description: 'Professional role: foundation-doctor, core-trainee, specialty-registrar, consultant,
            acp (advanced clinical practitioner), physician-associate, nurse, nurse-practitioner, pharmacist,
            allied-health-professional, or other.'
        grade:
          type: string
          enum:
          - FY1
          - FY2
          - CT1
          - CT2
          - CT3
          - ST1
          - ST2
          - ST3
          - ST4
          - ST5
          - ST6
          - ST7
          - ST8
          - SAS
          - consultant
          - other
          - ''
          description: 'Training or employment grade: FY1, FY2, CT1..CT3, ST1..ST8, SAS, consultant, or
            other.'
        specialty:
          type: string
          maxLength: 60
          description: Clinical specialty the clinician works in.
        registrationBody:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - GPhC
          - other
          - ''
          description: 'Professional registration body: GMC, NMC, HCPC, GPhC, or other.'
        registrationNumber:
          type: string
          description: Professional registration number issued by the registration body.
      required:
      - createdAt
      - updatedAt
      - name
      - role
      - grade
      - specialty
      - registrationBody
      - registrationNumber
      description: Clinician identifying information for the author of an inpatient clinical note, the
        responsible consultant, and any named senior reviewer.
    InpatientClinicalNote:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created, i.e. when the entry was written.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the patient the note is about.
        authorId:
          type: string
          format: uuid
          description: Foreign key to the clinician who authored the note.
        responsibleConsultantId:
          type:
          - string
          - 'null'
          format: uuid
          description: Foreign key to the consultant responsible for the patient, when recorded.
        status:
          type: string
          enum:
          - draft
          - submitted
          - amended
          - signed
          description: 'Record status: draft, submitted, amended, or signed. A correction is written as
            a new amended note rather than an edit in place.'
        noteType:
          type: string
          enum:
          - admission-clerking
          - progress
          - consult
          - event
          - procedure
          - handover
          - transfer
          - discharge-planning
          - ''
          description: 'Note type, which determines the required-component set: admission-clerking, progress,
            consult, event, procedure, handover, transfer, or discharge-planning.'
        hospitalName:
          type: string
          maxLength: 255
          description: Hospital where the note was written.
        wardName:
          type: string
          maxLength: 100
          description: Ward where the patient is located.
        bedNumber:
          type: string
          maxLength: 20
          description: Bed or bay identifier.
        noteAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Timestamp the note refers to, i.e. when the clinical events occurred. Distinct
            from created_at, which is when the entry was written.
        authorName:
          type: string
          maxLength: 255
          description: Author full name as written on the note.
        authorGrade:
          type: string
          enum:
          - FY1
          - FY2
          - CT1
          - CT2
          - CT3
          - ST1
          - ST2
          - ST3
          - ST4
          - ST5
          - ST6
          - ST7
          - ST8
          - SAS
          - consultant
          - acp
          - physician-associate
          - nurse
          - other
          - ''
          description: Author training or employment grade.
        authorRegistrationNumber:
          type: string
          maxLength: 40
          description: Author professional registration number (GMC, NMC, HCPC, or GPhC).
        parentSpecialty:
          type: string
          maxLength: 60
          description: Specialty of the team the patient is under.
        responsibleConsultantName:
          type: string
          maxLength: 255
          description: Name of the responsible consultant as written on the note.
        consultQuestion:
          type: string
          description: 'For a consult note: the clinical question the parent team asked.'
        consultRequestingTeam:
          type: string
          maxLength: 100
          description: 'For a consult note: the team that requested the opinion.'
        procedurePerformed:
          type: string
          maxLength: 255
          description: 'For a procedure note: the bedside procedure performed. Theatre procedures belong
            in the medical-operation-note form.'
        procedureDetail:
          type: string
          description: 'For a procedure note: technique, site, equipment, and findings.'
        procedureConsent:
          type: string
          enum:
          - written
          - verbal
          - implied
          - emergency-no-consent
          - best-interests
          - ''
          description: 'For a procedure note: consent basis (written, verbal, implied, emergency-no-consent,
            or best-interests).'
        procedureComplications:
          type: string
          description: 'For a procedure note: complications encountered, or an explicit none.'
        transferFromWard:
          type: string
          maxLength: 100
          description: 'For a transfer note: the ward or hospital the patient is leaving.'
        transferToWard:
          type: string
          maxLength: 100
          description: 'For a transfer note: the ward or hospital the patient is going to.'
        transferReason:
          type: string
          description: 'For a transfer note: the clinical or operational reason for the transfer.'
        admissionAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Timestamp the admission episode began. Length of stay is derived in code, never
            stored.
        admittingSpecialty:
          type: string
          maxLength: 60
          description: Specialty the patient was admitted under.
        admissionMethod:
          type: string
          enum:
          - emergency-department
          - gp-referral
          - elective
          - transfer-in
          - clinic
          - maternity
          - other
          - ''
          description: 'How the patient was admitted: emergency-department, gp-referral, elective, transfer-in,
            clinic, maternity, or other.'
        admissionReason:
          type: string
          description: Presenting problem or reason for admission.
        intervalHistory:
          type: string
          description: Events since the previous entry.
        noIntervalEvents:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Explicit negative: no events since the previous entry. Counts as documenting the
            interval-history component.'
        overnightEvents:
          type: string
          description: Events overnight, as handed over by the night team or nursing staff.
        patientReportedSymptoms:
          type: string
          description: Symptoms as reported by the patient.
        nursingConcerns:
          type: string
          description: Concerns raised by the nursing team.
        painScore:
          type:
          - integer
          - 'null'
          format: int32
          description: Patient-reported pain score, 0..10.
        sleepQuality:
          type: string
          enum:
          - good
          - fair
          - poor
          - none
          - ''
          description: 'Sleep quality: good, fair, poor, or none.'
        oralIntake:
          type: string
          enum:
          - normal
          - reduced
          - minimal
          - nil-by-mouth
          - ''
          description: 'Oral intake: normal, reduced, minimal, or nil-by-mouth.'
        bowelsLastOpened:
          type:
          - string
          - 'null'
          format: date
          description: Date the bowels were last opened.
        mobilityStatus:
          type: string
          enum:
          - independent
          - stick
          - frame
          - assistance-of-one
          - assistance-of-two
          - hoist
          - bed-bound
          - ''
          description: 'Current mobility: independent, stick, frame, assistance-of-one, assistance-of-two,
            hoist, or bed-bound.'
        observedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Timestamp the observation set was taken.
        respiratoryRate:
          type:
          - integer
          - 'null'
          format: int32
          description: Respiratory rate in breaths per minute (NEWS2 parameter).
        oxygenSaturation:
          type:
          - integer
          - 'null'
          format: int32
          description: Peripheral oxygen saturation as a percentage (NEWS2 parameter).
        spo2Scale:
          type: string
          enum:
          - scale-1
          - scale-2
          - ''
          description: 'NEWS2 SpO2 scale: scale-1 by default, or scale-2 for prescribed target saturation
            88-92% in confirmed hypercapnic respiratory failure.'
        oxygenDelivery:
          type: string
          enum:
          - air
          - nasal-cannula
          - simple-mask
          - venturi
          - non-rebreathe
          - high-flow-nasal
          - niv
          - invasive-ventilation
          - ''
          description: Oxygen delivery device, or air when the patient is on room air (NEWS2 air-or-oxygen
            parameter).
        oxygenFlowLitresPerMinute:
          type:
          - number
          - 'null'
          format: double
          description: Oxygen flow rate in litres per minute.
        systolicBloodPressure:
          type:
          - integer
          - 'null'
          format: int32
          description: Systolic blood pressure in mmHg (NEWS2 parameter).
        diastolicBloodPressure:
          type:
          - integer
          - 'null'
          format: int32
          description: Diastolic blood pressure in mmHg. Recorded for completeness; not a NEWS2 parameter.
        pulseRate:
          type:
          - integer
          - 'null'
          format: int32
          description: Pulse rate in beats per minute (NEWS2 parameter).
        acvpu:
          type: string
          enum:
          - alert
          - confusion
          - voice
          - pain
          - unresponsive
          - ''
          description: 'Consciousness on the ACVPU scale: alert, confusion, voice, pain, or unresponsive
            (NEWS2 parameter).'
        temperatureCelsius:
          type:
          - number
          - 'null'
          format: double
          description: Temperature in degrees Celsius (NEWS2 parameter).
        news2Total:
          type:
          - integer
          - 'null'
          format: int32
          description: NEWS2 aggregate score as entered from the ward chart, 0..20. An entered total always
            wins over a derived one.
        news2DerivedTotal:
          type:
          - integer
          - 'null'
          format: int32
          description: NEWS2 aggregate derived by the engine from the seven parameters, 0..20. Reported
            alongside the entered total so a discrepancy is visible rather than silently resolved.
        news2Trend:
          type: string
          enum:
          - improving
          - stable
          - worsening
          - unknown
          - ''
          description: 'Direction of travel against the previous score: improving, stable, worsening,
            or unknown.'
        news2Applicable:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether NEWS2 applies to this patient. NEWS2 is not validated in pregnancy, in
            children under 16, or in spinal-cord injury.
        news2NotApplicableReason:
          type: string
          maxLength: 255
          description: Reason NEWS2 was deliberately not used.
        examinationGeneral:
          type: string
          description: General appearance and overall examination findings.
        examinationCardiovascular:
          type: string
          description: Cardiovascular examination findings.
        examinationRespiratory:
          type: string
          description: Respiratory examination findings.
        examinationAbdominal:
          type: string
          description: Abdominal examination findings.
        examinationNeurological:
          type: string
          description: Neurological examination findings.
        examinationMusculoskeletal:
          type: string
          description: Musculoskeletal examination findings.
        examinationSkinAndWounds:
          type: string
          description: Skin, pressure-area, and wound examination findings.
        examinationLinesAndDrains:
          type: string
          description: Findings for indwelling lines, catheters, and drains.
        examinationOther:
          type: string
          description: Any other examination findings.
        noInvestigationsReviewed:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Explicit negative: no investigations were reviewed. Counts as documenting the
            investigations component.'
        noMedicationChanges:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Explicit negative: no medication changes were made. Counts as documenting the
            medications component.'
        allergyChecked:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the allergy status was checked before prescribing.
        medicinesReconciliationStatus:
          type: string
          enum:
          - done
          - partial
          - not-done
          - not-applicable
          - ''
          description: 'Medicines reconciliation status: done, partial, not-done, or not-applicable.'
        antimicrobialReviewStatus:
          type: string
          enum:
          - not-applicable
          - due
          - done
          - overdue
          - ''
          description: 'Antimicrobial stewardship review status per NICE NG15: not-applicable, due, done,
            or overdue.'
        antimicrobialReviewAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Timestamp of the antimicrobial review, or the date it falls due.
        vteStatus:
          type: string
          enum:
          - done
          - not-done
          - not-applicable
          - ''
          description: 'VTE risk assessment status per NICE NG89: done, not-done, or not-applicable. Sole
            predicate for the risk-assessments completeness component.'
        vteProphylaxis:
          type: string
          enum:
          - pharmacological
          - mechanical
          - both
          - none
          - contraindicated
          - ''
          description: 'VTE prophylaxis in place: pharmacological, mechanical, both, none, or contraindicated.'
        vteAssessedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Timestamp the VTE risk assessment was performed.
        vteNotes:
          type: string
          description: Free-text notes on the VTE assessment, including contraindications.
        fallsRisk:
          type: string
          enum:
          - low
          - moderate
          - high
          - not-assessed
          - ''
          description: 'Falls risk band per NICE CG161: low, moderate, high, or not-assessed.'
        fallsInterventions:
          type: string
          description: Falls-prevention interventions in place.
        pressureUlcerRisk:
          type: string
          enum:
          - low
          - medium
          - high
          - not-assessed
          - ''
          description: 'Pressure-ulcer risk band per NICE CG179: low, medium, high, or not-assessed.'
        skinIntegrity:
          type: string
          enum:
          - intact
          - at-risk
          - damaged
          - ''
          description: 'Skin integrity: intact, at-risk, or damaged.'
        pressureUlcerGrade:
          type: string
          enum:
          - none
          - '1'
          - '2'
          - '3'
          - '4'
          - unstageable
          - deep-tissue-injury
          - ''
          description: 'Pressure-ulcer category if present: none, 1, 2, 3, 4, unstageable, or deep-tissue-injury.'
        pressureUlcerSites:
          type: string
          maxLength: 255
          description: Anatomical sites of any pressure damage.
        deliriumScreen:
          type: string
          enum:
          - negative
          - possible-delirium
          - probable-delirium
          - cognitive-impairment
          - not-assessed
          - ''
          description: 'Delirium screen outcome per NICE CG103: negative, possible-delirium, probable-delirium,
            cognitive-impairment, or not-assessed.'
        delirium4atScore:
          type:
          - integer
          - 'null'
          format: int32
          description: 4AT delirium screening score, 0..12. The full instrument lives in the four-a-test-for-delirium
            form.
        deliriumNotes:
          type: string
          description: Free-text notes on cognition and delirium.
        nutritionScreen:
          type: string
          enum:
          - low-risk
          - medium-risk
          - high-risk
          - not-assessed
          - ''
          description: 'Nutrition screening band: low-risk, medium-risk, high-risk, or not-assessed.'
        mustScore:
          type:
          - integer
          - 'null'
          format: int32
          description: Malnutrition Universal Screening Tool (MUST) score, 0..6.
        nutritionPlan:
          type: string
          description: Nutrition and hydration plan.
        infectionStatus:
          type: string
          enum:
          - none
          - suspected
          - confirmed
          - ''
          description: 'Infection status: none, suspected, or confirmed.'
        isolationStatus:
          type: string
          enum:
          - none
          - source
          - protective
          - cohort
          - ''
          description: 'Isolation status: none, source, protective, or cohort. Must travel with a transfer
            note.'
        organism:
          type: string
          maxLength: 255
          description: Organism identified or suspected.
        infectionPrecautions:
          type: string
          description: Infection-control precautions in place.
        safeguardingConcern:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether a safeguarding concern has been identified.
        safeguardingNotes:
          type: string
          description: Free-text safeguarding notes.
        safeguardingReferralMade:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether a safeguarding referral has been made.
        clinicalImpression:
          type: string
          description: Clinical impression. Required for any grade above incomplete.
        differentialDiagnosis:
          type: string
          description: Differential diagnosis under consideration.
        responseToTreatment:
          type: string
          enum:
          - improving
          - unchanged
          - deteriorating
          - too-early
          - ''
          description: 'Response to treatment so far: improving, unchanged, deteriorating, or too-early.'
        newOxygenRequirement:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the patient has a new oxygen requirement. Raises the acuity band to escalate.
        newConfusion:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the confusion is new. Combined with an ACVPU below alert, raises the acuity
            band to escalate.
        sepsisScreen:
          type: string
          enum:
          - positive
          - negative
          - not-done
          - ''
          description: 'Sepsis screen outcome per NICE NG51: positive, negative, or not-done. A positive
            screen raises the acuity band to escalate.'
        arrestCall:
          type: string
          enum:
          - none
          - cardiac
          - respiratory
          - peri-arrest
          - ''
          description: 'Arrest call made: none, cardiac, respiratory, or peri-arrest. Any call other than
            none raises the acuity band to critical.'
        criticalCareReferral:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether a critical-care outreach or ICU referral has been made. Raises the acuity
            band to critical.
        newOrganSupport:
          type: string
          enum:
          - none
          - respiratory
          - cardiovascular
          - renal
          - neurological
          - multiple
          - ''
          description: 'New organ support started: none, respiratory, cardiovascular, renal, neurological,
            or multiple. Anything other than none raises the acuity band to critical.'
        plan:
          type: string
          description: Overall management plan. Required for any grade above incomplete; individual jobs
            live in the job child table.
        escalationStatus:
          type: string
          enum:
          - for-full-escalation
          - for-ward-based-care
          - for-hdu
          - for-icu
          - palliative
          - under-review
          - ''
          description: 'Escalation status: for-full-escalation, for-ward-based-care, for-hdu, for-icu,
            palliative, or under-review.'
        escalationAction:
          type: string
          description: Escalation action actually taken. Its absence at an escalate or critical acuity
            band raises a high-priority flag.
        ceilingOfCare:
          type: string
          enum:
          - full-active-treatment
          - ward-based-care
          - non-invasive-ventilation
          - organ-support
          - symptom-control
          - ''
          description: 'Agreed ceiling of care: full-active-treatment, ward-based-care, non-invasive-ventilation,
            organ-support, or symptom-control.'
        respectStatus:
          type: string
          enum:
          - in-place
          - not-in-place
          - under-discussion
          - not-applicable
          - ''
          description: 'ReSPECT plan status: in-place, not-in-place, under-discussion, or not-applicable.'
        dnacprStatus:
          type: string
          enum:
          - for-cpr
          - dnacpr
          - under-discussion
          - ''
          description: 'Resuscitation status: for-cpr, dnacpr, or under-discussion.'
        seniorReviewNeeded:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether a senior review is needed.
        seniorReviewBy:
          type: string
          maxLength: 255
          description: Name and grade of the senior who reviewed or is to review.
        seniorReviewAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Timestamp of the senior review.
        estimatedDischargeDate:
          type:
          - string
          - 'null'
          format: date
          description: Estimated date of discharge.
        dischargePlanningNotes:
          type: string
          description: 'Discharge-planning notes: destination, package of care, equipment, and outstanding
            blockers.'
        familyCommunication:
          type: string
          description: What was discussed with the family or next of kin, and with whom.
        patientCommunication:
          type: string
          description: What was discussed with the patient.
        teamHandover:
          type: string
          description: Handover to the incoming team.
        consentStatus:
          type: string
          enum:
          - consented
          - declined
          - lacks-capacity
          - best-interests
          - not-applicable
          - ''
          description: 'Consent basis for the decisions recorded: consented, declined, lacks-capacity,
            best-interests, or not-applicable.'
        capacityAssessed:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether a mental-capacity assessment was performed for a capacity-dependent decision.
        capacityNotes:
          type: string
          description: Free-text notes on the capacity assessment.
        authorOverrideAcuity:
          type: string
          enum:
          - stable
          - watch
          - escalate
          - critical
          - ''
          description: Author override of the computed acuity band. The computed band is retained in the
            grade table so the override is visible in audit. The completeness status is never overridable.
        authorOverrideReason:
          type: string
          description: Reason for the acuity override. Required whenever an override is set.
        attestationText:
          type: string
          description: Attestation statement the author signed.
        electronicSignature:
          type: string
          description: Electronic signature of the author.
        signedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Timestamp the note was signed.
