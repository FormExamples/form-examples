      description: 'Main inpatient clinical note record: note identification, admission context, interval
        history, observations and NEWS2, examination findings, risk assessments, clinical impression,
        plan and escalation, communication, and sign-off. Problems, medication changes, investigations,
        and jobs live in child tables.'
    InpatientClinicalNoteGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        inpatientClinicalNoteId:
          type: string
          format: uuid
          description: Foreign key to the parent inpatient clinical note (unique, 1:1).
        status:
          type: string
          enum:
          - complete
          - partial
          - incomplete
          - ''
          description: 'Completeness status: complete, partial, or incomplete. Never overridable: it is
            a mechanical property of the record, not a clinical judgement.'
        completenessPercent:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Completeness percentage (0..100): documented required components / required components
            x 100, rounded.'
        requiredComponentCount:
          type:
          - integer
          - 'null'
          format: int32
          description: Number of components required for this note type. Varies from 9 to 11 by note type.
        documentedComponentCount:
          type:
          - integer
          - 'null'
          format: int32
          description: Number of required components actually documented.
        acuityBand:
          type: string
          enum:
          - stable
          - watch
          - escalate
          - critical
          - ''
          description: 'Final clinical acuity band: stable, watch, escalate, or critical. Equals computed_acuity_band
            unless the author recorded an override.'
        computedAcuityBand:
          type: string
          enum:
          - stable
          - watch
          - escalate
          - critical
          - ''
          description: Acuity band as computed by the max-band engine, retained so that an author override
            is visible in audit.
        news2Total:
          type:
          - integer
          - 'null'
          format: int32
          description: NEWS2 aggregate the acuity band was computed from, 0..20.
        headerDocumented:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the header component is documented (yes/no).
        intervalHistoryDocumented:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the interval-history component is documented (yes/no).
        observationsDocumented:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the observations component is documented (yes/no).
        examinationDocumented:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the examination component is documented (yes/no).
        investigationsDocumented:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the investigations component is documented (yes/no).
        problemsDocumented:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the problems component is documented (yes/no).
        medicationsDocumented:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the medications component is documented (yes/no).
        riskAssessmentsDocumented:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the risk-assessments component is documented (yes/no).
        impressionDocumented:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the impression component is documented (yes/no).
        planDocumented:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the plan component is documented (yes/no).
        escalationDocumented:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the escalation component is documented (yes/no).
        communicationDocumented:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the communication component is documented (yes/no).
        gradedAt:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the grade.
      required:
      - createdAt
      - updatedAt
      - inpatientClinicalNoteId
      - status
      - acuityBand
      - computedAcuityBand
      - headerDocumented
      - intervalHistoryDocumented
      - observationsDocumented
      - examinationDocumented
      - investigationsDocumented
      - problemsDocumented
      - medicationsDocumented
      - riskAssessmentsDocumented
      - impressionDocumented
      - planDocumented
      - escalationDocumented
      - communicationDocumented
      - gradedAt
      description: 'Computed grading result for an inpatient clinical note: documentation-completeness
        status and percentage over the note-type-specific required-component set, max-band clinical acuity
        band, NEWS2 aggregate, and per-component presence flags.'
    InpatientClinicalNoteGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        inpatientClinicalNoteGradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        flagId:
          type: string
          maxLength: 50
          description: Stable flag identifier (e.g. F-VTE-NOT-ASSESSED-001).
        category:
          type: string
          enum:
          - deteriorating-news2-no-escalation
          - sepsis-screen-positive-no-action
          - vte-not-assessed
          - abnormal-result-not-actioned
          - no-plan-documented
          - allergy-not-checked
          - no-senior-review
          - ceiling-of-care-undocumented
          - antimicrobial-review-overdue
          - no-capacity-assessment
          - long-stay-no-discharge-plan
          - incomplete-entry
          - other
          - ''
          description: Flag category, one of the twelve defined in the spec, or other.
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          - ''
          description: 'Priority: low, medium, or high.'
        description:
          type: string
          maxLength: 500
          description: Human-readable description of what fired the flag.
        suggestedAction:
          type: string
          maxLength: 500
          description: Suggested clinical or governance action (e.g. "escalate to the senior on call",
            "complete the VTE assessment").
      required:
      - createdAt
      - updatedAt
      - inpatientClinicalNoteGradeId
      - flagId
      - category
      - priority
      - description
      - suggestedAction
      description: Safety flags that fire independently of the completeness status and the acuity band,
        with priority and a suggested action for the clinician or governance team.
    InpatientClinicalNoteGradeResponse:
      type: object
      required:
      - grade
      properties:
        grade:
          $ref: '#/components/schemas/InpatientClinicalNoteGrade'
        result:
          type: object
          description: 'The engine''s result, present only on POST: completeness status and percent, acuity
            band (computed and as overridden), each component''s status, and the fired rules and flags.'
          properties:
            status:
              type: string
            completenessPercent:
              type: integer
            acuityBand:
              type: string
            computedAcuityBand:
              type: string
            acuityOverridden:
              type: boolean
            componentStatuses:
              type: array
              items:
                type: object
            documentedRequired:
              type: integer
            totalRequired:
              type: integer
            firedRules:
              type: array
              items:
                type: object
            flags:
              type: array
              items:
                type: object
    InpatientClinicalNoteGradeRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        inpatientClinicalNoteGradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        ruleId:
          type: string
          maxLength: 40
          description: Stable rule identifier (e.g. R-PLAN-DOCUMENTED-01, A-NEWS2-HIGH).
        engine:
          type: string
          enum:
          - completeness
          - acuity
          - ''
          description: 'Which engine fired the rule: completeness or acuity.'
        component:
          type: string
          enum:
          - header
          - interval-history
          - observations
          - examination
          - investigations
          - problems
          - medications
          - risk-assessments
          - impression
          - plan
          - escalation
          - communication
