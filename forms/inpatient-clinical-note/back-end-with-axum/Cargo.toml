[workspace]

[workspace.package]
rust-version = "1.98"

[package]
name = "inpatient_clinical_note"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
publish = false
description = "Inpatient Clinical Note back-end JSON API"
default-run = "inpatient_clinical_note-cli"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace.dependencies]
axa = { version = "0.19", features = ["cursor-pagination", "postgres-sqlx", "queue", "ratelimit"] }

[dependencies]
axa = { workspace = true }
rust_decimal = { version = "1", features = ["serde", "serde-float"] }
serde-saphyr = "2"
sqlx = { version = "0.9", default-features = false, features = ["derive", "json", "macros", "migrate", "postgres", "runtime-tokio", "rust_decimal", "tls-rustls-ring-webpki", "uuid"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
tokio = { version = "1.54", default-features = false, features = [
  "rt-multi-thread",
  "signal",
  "sync",
] }
async-trait = { version = "0.1" }
axum = { version = "0.8" }
tracing = { version = "0.1" }
jiff = { version = "0.2", features = ["serde"] }
jiff-sqlx = { version = "0.2.2", features = ["postgres", "serde"] }
validator = { version = "0.21", features = ["derive"] }
uuid = { version = "1.29", features = ["serde", "v4"] }
# view engine i18n
fluent-templates = { version = "0.13", features = ["tera"] }
unic-langid = { version = "0.9" }
# /view engine
axum-extra = { version = "0.10", features = ["form"] }

[[bin]]
name = "inpatient_clinical_note-cli"
path = "src/inpatient_clinical_note/bin/main.rs"
required-features = []

[dev-dependencies]
axa-test = "0.10"
serial_test = { version = "4.0.1" }
insta = { version = "1.49", features = ["redactions", "yaml", "filters"] }

[lib]
path = "src/inpatient_clinical_note/lib.rs"

# cargo-mutants builds every mutant once in a throwaway copy of the tree: no debug information and no
# incremental state make each build quicker and smaller. `etc/cargo-mutants.toml` selects it.
[profile.mutants]
inherits = "test"
debug = "none"
incremental = false

# Lighter dev builds: line tables for backtraces, and a separate debug-info file on macOS.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

# Dependencies carry no debug information in dev builds.
[profile.dev.package."*"]
debug = false
