          description: Name.
        email:
          type: string
          description: Email address.
        phone:
          type: string
          description: Phone number.
        postal_address_as_full_text:
          type: string
          description: Postal address as full text.
        country_as_iso_3166_1_alpha_2:
          type: string
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type: string
          description: Postal code, such as for validating the postal address.
        role:
          type: string
          enum:
          - cardiologist
          - cardiac-physiologist
          - other
          - ''
          description: 'Reporting clinician role: cardiologist, cardiac-physiologist, other.'
        registration_body:
          type: string
          enum:
          - GMC
          - HCPC
          - RCCP
          - AHCS
          - other
          - ''
          description: 'Clinician registration body: GMC, HCPC, RCCP, AHCS, other.'
        registration_number:
          type: string
          description: Clinician registration number.
        united_kingdom_nhs_number:
          type: string
          maxLength: 12
          description: United Kingdom NHS number, unique per person.
      required:
      - created_at
      - updated_at
      - name
      - role
      - registration_body
      - registration_number
      description: Reporting clinician (cardiologist or cardiac physiologist) who analyses, authors, and
        signs the Holter monitor result report.
    HolterMonitorTestResult:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        patient_id:
          type: string
          format: uuid
          description: Foreign key to the patient.
        clinician_id:
          type: string
          format: uuid
          description: Foreign key to the reporting clinician (cardiologist / cardiac physiologist).
        originating_request_reference:
          type: string
          maxLength: 255
          description: Free-text reference linking this report back to the originating Holter monitor
            request (referral).
        report_status:
          type: string
          enum:
          - preliminary
          - final
          - amended
          - cancelled
          - ''
          description: 'Report lifecycle status: preliminary, final, amended, cancelled.'
        monitor_type:
          type: string
          enum:
          - 24-hour
          - 48-hour
          - 7-day
          - 14-day
          - event-recorder
          - implantable-loop-recorder
          - other
          - ''
          description: 'Monitor type actually used: 24-hour, 48-hour, 7-day, 14-day, event-recorder, implantable-loop-recorder,
            other.'
        performed_date:
          type: string
          format: date
          description: Date the Holter recording was performed (recording start / hook-up).
        reported_date:
          type: string
          format: date
          description: Date the report was authored / signed.
        recording_duration_hours:
          type: number
          format: double
          description: Total analysable recording duration in hours, for recording-quality assessment.
        analysed_percent:
          type: number
          format: double
          description: Percentage of the recording that was analysable / interpretable (0-100), for recording-quality
            assessment.
        clinical_history:
          type: string
          maxLength: 1000
          description: Clinical history and the question the monitoring was performed to answer.
        predominant_rhythm:
          type: string
          enum:
          - sinus
          - atrial-fibrillation
          - paced
          - other
          - ''
          description: 'Predominant underlying rhythm: sinus, atrial-fibrillation, paced, other.'
        mean_heart_rate_bpm:
          type: integer
          format: int32
          description: Mean (24-hour average) heart rate in beats per minute.
        minimum_heart_rate_bpm:
          type: integer
          format: int32
          description: Minimum heart rate in beats per minute (bradycardia screen).
        maximum_heart_rate_bpm:
          type: integer
          format: int32
          description: Maximum heart rate in beats per minute (tachycardia screen).
        longest_pause_seconds:
          type: number
          format: double
          description: Longest R-R pause in seconds; pauses > 3 seconds are clinically significant.
        ventricular_ectopic_percent:
          type: number
          format: double
          description: Ventricular ectopic (VE / PVC) burden as a percentage of total beats.
        supraventricular_ectopic_percent:
          type: number
          format: double
          description: Supraventricular ectopic (SVE / PAC) burden as a percentage of total beats.
        atrial_fibrillation_detected:
          type: boolean
          description: Whether atrial fibrillation (or flutter) was detected during the recording.
        significant_pauses:
          type: boolean
          description: Whether significant pauses (> 3 seconds) were recorded.
        ventricular_tachycardia:
          type: boolean
          description: Whether ventricular tachycardia (sustained or non-sustained) was recorded (critical
            finding).
        supraventricular_tachycardia:
          type: boolean
          description: Whether supraventricular tachycardia (SVT) was recorded.
        high_grade_av_block:
          type: boolean
          description: Whether high-grade AV block (Mobitz II or third-degree) was recorded (critical
            finding).
        symptom_rhythm_correlation:
          type: boolean
          description: Whether reported symptoms correlated with a recorded rhythm abnormality (diary
            correlation).
        normal_study:
          type: boolean
          description: Whether the study is normal (no significant arrhythmia, conduction abnormality,
            or pause).
        findings_narrative:
          type: string
          maxLength: 2000
          description: Narrative description of the rhythm findings (the body of the report).
        comparison_with_previous:
          type: string
          maxLength: 1000
          description: Comparison with relevant previous ambulatory ECG studies.
        impression:
          type: string
          maxLength: 2000
          description: Summary impression / conclusion answering the clinical question.
        reporting_category:
          type: string
          maxLength: 50
          description: Free-text structured-reporting category label (e.g. a rhythm or AF-burden category).
        recommended_follow_up:
          type: string
          maxLength: 1000
          description: Recommended follow-up monitoring, referral, or management.
        critical_result_communicated:
          type: boolean
          description: Whether a critical or unexpected significant result was communicated directly to
            the referrer.
        reported_to:
          type: string
          maxLength: 500
          description: Who the critical / urgent result was communicated to, with date and time if applicable.
      required:
      - created_at
      - updated_at
      - patient_id
      - clinician_id
      - originating_request_reference
      - report_status
      - monitor_type
      - clinical_history
      - predominant_rhythm
      - atrial_fibrillation_detected
      - significant_pauses
      - ventricular_tachycardia
      - supraventricular_tachycardia
      - high_grade_av_block
      - symptom_rhythm_correlation
      - normal_study
      - findings_narrative
      - comparison_with_previous
      - impression
      - reporting_category
      - recommended_follow_up
      - critical_result_communicated
      - reported_to
      description: Ambulatory ECG (Holter) monitor result (report). Captures the monitor type and recording
        quality, clinical history, the rhythm and rate summary (mean / minimum / maximum heart rate, longest
        pause, ectopy burden), structured findings (AF, significant pauses, VT, SVT, high-grade AV block,
        symptom-rhythm correlation, normal study), the narrative and impression, recommended follow-up,
        and critical-result communication. This is the source-of-truth record that the four-axis interpretation
        grade is computed from.
    HolterMonitorTestResultGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        holter_monitor_test_result_id:
          type: string
          format: uuid
          description: Foreign key to the parent result (unique, 1:1).
        result_classification:
          type: string
          enum:
          - normal
          - abnormal
          - critical
          - inconclusive
          - ''
          description: 'Axis A overall classification: normal, abnormal, critical, inconclusive.'
        abnormality_severity:
          type: string
          enum:
          - none
          - minor
          - moderate
          - major
          - ''
          description: 'Axis B abnormality severity: none, minor, moderate, major.'
        reporting_category:
          type: string
          maxLength: 50
          description: Axis B structured-reporting score / category label (e.g. a rhythm or AF-burden
            category).
        report_completeness_percent:
          type: integer
          format: int32
          description: Axis C report completeness as a percentage of mandatory report sections (0-100).
        follow_up_urgency:
          type: string
          enum:
          - routine
          - recommended
          - urgent
          - critical-alert
          - ''
          description: 'Axis D follow-up urgency: routine, recommended, urgent, critical-alert.'
        target_timeframe:
          type: string
          maxLength: 50
          description: Target timeframe for the recommended follow-up implied by the urgency.
        recommended_action:
          type: string
          maxLength: 500
          description: Axis D concise recommended action derived from the urgency.
        recommendation:
          type: string
          enum:
          - no-action
          - routine-follow-up
          - further-monitoring
          - specialist-referral
          - urgent-review
          - ''
          description: 'Overall recommendation: no-action, routine-follow-up, further-monitoring, specialist-referral,
            urgent-review.'
        clinician_notes:
          type: string
          description: Free-text interpretation / sign-off notes.
        signed_at:
          type: string
          format: date-time
          description: Timestamp of the reporting clinician electronic signature.
        graded_at:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the result.
      required:
      - created_at
      - updated_at
      - holter_monitor_test_result_id
      - result_classification
      - abnormality_severity
      - reporting_category
      - follow_up_urgency
      - target_timeframe
      - recommended_action
      - recommendation
      - clinician_notes
      - graded_at
      description: 'Computed four-axis interpretation grade: result classification, abnormality severity
        / structured-reporting category, report completeness, and follow-up urgency. A critical result
        (e.g. ventricular tachycardia, pause > 3 seconds, high-grade AV block, fast atrial fibrillation)
        auto-escalates the follow-up urgency to critical-alert regardless of the other axes.'
    HolterMonitorTestResultGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
