components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Name.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as full text.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code, such as for validating the postal address.
        role:
          type: string
          enum:
          - consultant-cytopathologist
          - biomedical-scientist
          - specialist-registrar
          - other
          - ''
          description: 'Reporting clinician role: consultant-cytopathologist, biomedical-scientist, specialist-registrar,
            other.'
        registrationBody:
          type: string
          enum:
          - GMC
          - HCPC
          - other
          - ''
          description: 'Clinician registration body: GMC, HCPC, other.'
        registrationNumber:
          type: string
          description: Clinician registration number.
        unitedKingdomNhsNumber:
          type:
          - string
          - 'null'
          maxLength: 12
          description: United Kingdom NHS number, unique per person.
      required:
      - createdAt
      - updatedAt
      - name
      - role
      - registrationBody
      - registrationNumber
      description: Reporting clinician (consultant cytopathologist or biomedical scientist) who authors
        and signs the cytology test result report.
    CytologyTestResult:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the patient.
        clinicianId:
          type: string
          format: uuid
          description: Foreign key to the reporting clinician (consultant cytopathologist / biomedical
            scientist).
        originatingRequestReference:
          type: string
          maxLength: 255
          description: Free-text reference linking this report back to the originating cytology test request
            (referral).
        reportStatus:
          type: string
          enum:
          - preliminary
          - final
          - amended
          - cancelled
          - ''
          description: 'Report lifecycle status: preliminary, final, amended, cancelled.'
        performedDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the cytology examination was performed / specimen received.
        reportedDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the report was authored / signed.
        specimenType:
          type: string
          enum:
          - cervical-smear
          - urine-cytology
          - sputum-cytology
          - fluid-pleural-ascitic
          - fine-needle-aspiration-thyroid
          - fine-needle-aspiration-breast
          - csf-cytology
          - other
          - ''
          description: 'Examined cytology specimen type: cervical-smear, urine-cytology, sputum-cytology,
            fluid-pleural-ascitic, fine-needle-aspiration-thyroid, fine-needle-aspiration-breast, csf-cytology,
            other.'
        specimenAdequacy:
          type: string
          enum:
          - satisfactory
          - unsatisfactory
          - ''
          description: 'Specimen adequacy for cytological interpretation: satisfactory, unsatisfactory.'
        clinicalHistory:
          type: string
          maxLength: 1000
          description: Clinical history and the question the examination was performed to answer.
        comparisonWithPrevious:
          type: string
          maxLength: 1000
          description: Comparison with relevant previous cytology / histology results.
        cytologyResultCategory:
          type: string
          maxLength: 500
          description: 'Free-text cytology result category holding the relevant grading: e.g. cervical
            (negative / borderline / low-grade-dyskaryosis / high-grade-dyskaryosis / glandular), thyroid
            (Thy1-Thy5), breast (C1-C5), urine / serous-fluid system categories.'
        hpvResult:
          type: string
          enum:
          - positive
          - negative
          - not-tested
          - not-applicable
          - ''
          description: 'HPV (human papillomavirus) test result where applicable: positive, negative, not-tested,
            not-applicable.'
        malignancyPresent:
          type: boolean
          description: Whether malignant cells are present in the specimen.
        dysplasiaPresent:
          type: boolean
          description: Whether dysplasia / dyskaryosis (pre-malignant atypia) is present in the specimen.
        microscopicDescription:
          type: string
          maxLength: 2000
          description: Microscopic description of the cellular findings (the body of the report).
        diagnosis:
          type: string
          maxLength: 2000
          description: Cytological diagnosis / interpretation.
        impression:
          type: string
          maxLength: 2000
          description: Summary impression / conclusion answering the clinical question.
        reportingCategory:
          type: string
          maxLength: 100
          description: Structured-reporting grading category label (e.g. an NHS cervical-screening dyskaryosis
            grade, RCPath Thy or breast C category).
        recommendedFollowUp:
          type: string
          maxLength: 1000
          description: 'Recommended follow-up: repeat cytology, colposcopy, biopsy, MDT referral, or routine
            recall.'
        criticalResultCommunicated:
          type: boolean
          description: Whether a critical or unexpected significant result was communicated directly to
            the referrer.
        reportedTo:
          type: string
          maxLength: 500
          description: Who the critical / urgent result was communicated to, with date and time if applicable.
      required:
      - createdAt
      - updatedAt
      - patientId
      - clinicianId
      - originatingRequestReference
      - reportStatus
      - specimenType
      - specimenAdequacy
      - clinicalHistory
      - comparisonWithPrevious
      - cytologyResultCategory
      - hpvResult
      - malignancyPresent
      - dysplasiaPresent
      - microscopicDescription
      - diagnosis
      - impression
      - reportingCategory
      - recommendedFollowUp
      - criticalResultCommunicated
      - reportedTo
      description: Cytology test result (report). Captures the examined specimen and its adequacy, the
        clinical history, the cytology result category and HPV status, the microscopic description and
        diagnosis, the impression and structured-reporting category, recommended follow-up, and critical-result
        communication. This is the source-of-truth record that the four-axis interpretation grade is computed
        from.
    CytologyTestResultGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        cytologyTestResultId:
          type: string
          format: uuid
          description: Foreign key to the parent result (unique, 1:1).
        resultClassification:
          type: string
          enum:
          - normal
          - abnormal
          - critical
          - inconclusive
          - ''
          description: 'Axis A overall classification: normal, abnormal, critical, inconclusive.'
        abnormalitySeverity:
          type: string
          enum:
          - none
          - minor
          - moderate
          - major
          - ''
          description: 'Axis B abnormality severity: none, minor, moderate, major.'
        reportingCategory:
          type: string
          maxLength: 100
          description: Axis B structured-reporting score / category label (e.g. an NHS cervical-screening
            dyskaryosis grade, RCPath Thy or breast C category).
        reportCompletenessPercent:
          type:
          - integer
          - 'null'
          format: int32
          description: Axis C report completeness as a percentage of mandatory report sections (0-100).
        followUpUrgency:
          type: string
          enum:
          - routine
          - recommended
          - urgent
          - critical-alert
          - ''
          description: 'Axis D follow-up urgency: routine, recommended, urgent, critical-alert.'
        targetTimeframe:
          type: string
          maxLength: 50
          description: Target timeframe for the recommended follow-up implied by the urgency.
        recommendedAction:
          type: string
          maxLength: 500
          description: Axis D concise recommended action derived from the urgency.
        recommendation:
          type: string
          enum:
          - no-action
          - routine-follow-up
          - further-imaging
          - specialist-referral
          - urgent-review
          - ''
          description: 'Overall recommendation: no-action, routine-follow-up, further-imaging, specialist-referral,
            urgent-review.'
        clinicianNotes:
          type: string
          description: Free-text interpretation / sign-off notes.
        signedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Timestamp of the reporting clinician electronic signature.
        gradedAt:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the result.
      required:
      - createdAt
      - updatedAt
      - cytologyTestResultId
      - resultClassification
      - abnormalitySeverity
      - reportingCategory
      - followUpUrgency
      - targetTimeframe
      - recommendedAction
      - recommendation
      - clinicianNotes
      - gradedAt
      description: 'Computed four-axis interpretation grade: result classification, abnormality severity
        / structured-reporting category, report completeness, and follow-up urgency. A critical result
        (e.g. high-grade dyskaryosis, malignant cells, Thy5, or breast C5) auto-escalates the follow-up
        urgency to critical-alert regardless of the other axes.'
    CytologyTestResultGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        cytologyTestResultGradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        flagId:
          type: string
          maxLength: 50
          description: Stable flag identifier (e.g. F-CRITICAL-RESULT-001).
        category:
          type: string
          enum:
          - critical-result-alert
          - incidental-finding
          - discrepancy-with-request
          - abnormal-requiring-action
          - urgent-referral
          - inadequate-technique
          - unexpected-finding
          - missing-impression
          - missing-measurement
          - other
          - ''
          description: Flag category.
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          - ''
          description: 'Priority: low, medium, high.'
        description:
          type: string
          maxLength: 500
          description: Human-readable description of what fired the flag.
        suggestedAction:
          type: string
          maxLength: 500
          description: Suggested clinical action (e.g. "communicate critical result to referrer and document,
            refer for urgent colposcopy / MDT").
      required:
      - createdAt
      - updatedAt
      - cytologyTestResultGradeId
      - flagId
      - category
      - priority
      - description
      - suggestedAction
      description: Safety-critical flags that fire independently of the four axes, with priority and a
        suggested action for the reporting / referring team.
    CytologyTestResultGradeRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        cytologyTestResultGradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        ruleId:
          type: string
          maxLength: 40
          description: Stable rule identifier (e.g. R-CLASS-CRITICAL-01).
        axis:
          type: string
          enum:
          - classification
          - severity
          - completeness
          - follow-up
          - ''
          description: 'Scoring axis the rule belongs to: classification, severity, completeness, follow-up.'
        category:
          type: string
          maxLength: 50
          description: Category or finding the rule relates to.
        description:
          type: string
          maxLength: 500
          description: Human-readable description of why the rule fired.
      required:
      - createdAt
      - updatedAt
      - cytologyTestResultGradeId
      - ruleId
      - axis
      - category
      - description
      description: Audit trail of every classification / severity / completeness / follow-up rule that
        fired for this result.
