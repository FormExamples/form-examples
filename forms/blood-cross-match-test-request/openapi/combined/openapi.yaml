components:
  schemas:
    BloodCrossMatchTestRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the patient.
        clinicianId:
          type: string
          format: uuid
          description: Foreign key to the requesting clinician (referrer).
        status:
          type: string
          enum:
          - draft
          - submitted
          - vetted
          - scheduled
          - rejected
          - ''
          description: 'Request lifecycle status: draft, submitted, vetted, scheduled, rejected.'
        siteName:
          type: string
          maxLength: 255
          description: Name of the requesting site or clinic.
        setting:
          type: string
          enum:
          - outpatient
          - inpatient
          - community
          - emergency
          - ''
          description: 'Care setting: outpatient, inpatient, community, emergency.'
        referralDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the referral was made.
        requestedByDate:
          type:
          - string
          - 'null'
          format: date
          description: Date by which the test / component is requested to be available.
        requestType:
          type: string
          enum:
          - group-and-save
          - crossmatch
          - emergency-o-negative
          - antibody-screen
          - other
          - ''
          description: 'Requested test type: group-and-save, crossmatch, emergency-o-negative, antibody-screen,
            other.'
        component:
          type: string
          enum:
          - red-cells
          - platelets
          - fresh-frozen-plasma
          - cryoprecipitate
          - none
          - ''
          description: 'Requested blood component: red-cells, platelets, fresh-frozen-plasma, cryoprecipitate,
            none.'
        unitsRequired:
          type:
          - integer
          - 'null'
          format: int32
          description: Number of units of the requested component (0-50).
        primaryIndication:
          type: string
          enum:
          - surgery
          - acute-bleeding
          - anaemia
          - obstetric-haemorrhage
          - chemotherapy-support
          - transfusion-dependent
          - other
          - ''
          description: Primary clinical indication, used for appropriateness scoring against NICE NG24
            thresholds.
        clinicalDetails:
          type: string
          maxLength: 1000
          description: Clinical details supporting the request (highest-value free-text field).
        patientBloodGroup:
          type: string
          enum:
          - a-pos
          - a-neg
          - b-pos
          - b-neg
          - o-pos
          - o-neg
          - ab-pos
          - ab-neg
          - unknown
          - ''
          description: 'Known patient ABO/Rh blood group: a-pos, a-neg, b-pos, b-neg, o-pos, o-neg, ab-pos,
            ab-neg, unknown.'
        knownAntibodies:
          type: boolean
          description: Whether the patient has known red-cell alloantibodies (requires extra crossmatch
            time).
        antibodyDetail:
          type: string
          maxLength: 1000
          description: Detail of any known antibodies (specificity, source, antigen-negative requirements).
        previousTransfusion:
          type: boolean
          description: Whether the patient has been transfused previously.
        previousTransfusionReaction:
          type: boolean
          description: Whether the patient has had a previous transfusion reaction.
        pregnant:
          type: boolean
          description: Whether the patient is currently pregnant (alloimmunisation / anti-D relevance).
        sampleCollected:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Whether a pre-transfusion sample has been collected: yes, no.'
        collectionDatetime:
          type:
          - string
          - 'null'
          format: date-time
          description: Date and time the pre-transfusion sample was collected.
        twoSampleRuleMet:
          type: boolean
          description: Whether the BSH/SHOT two-sample (group-check) rule has been satisfied for this
            patient.
        requiredByDatetime:
          type:
          - string
          - 'null'
          format: date-time
          description: Date and time by which compatible blood is required.
        urgency:
          type: string
          enum:
          - routine
          - urgent
          - emergency
          - stat
          - ''
          description: 'Requested triage urgency: routine, urgent, emergency, stat.'
        supervisingConsultant:
          type: string
          maxLength: 255
          description: Name of the supervising / responsible consultant.
        requesterContact:
          type: string
          maxLength: 255
          description: Contact details (bleep / phone) for the requester.
        notes:
          type: string
          maxLength: 1000
          description: Free-text additional notes.
      required:
      - createdAt
      - updatedAt
      - patientId
      - clinicianId
      - status
      - siteName
      - setting
      - requestType
      - component
      - primaryIndication
      - clinicalDetails
      - patientBloodGroup
      - knownAntibodies
      - antibodyDetail
      - previousTransfusion
      - previousTransfusionReaction
      - pregnant
      - sampleCollected
      - twoSampleRuleMet
      - urgency
      - supervisingConsultant
      - requesterContact
      - notes
      description: Blood cross-match / transfusion compatibility request (referral). Captures the requested
        test type and component, the clinical indication, the patient blood group, antibody and transfusion
        history, sample collection and two-sample-rule status, and triage urgency.
    BloodCrossMatchTestRequestGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        bloodCrossMatchTestRequestId:
          type: string
          format: uuid
          description: Foreign key to the parent request (unique, 1:1).
        appropriatenessScore:
          type:
          - integer
          - 'null'
          format: int32
          description: Appropriateness score (1-9). No single published transfusion-ordering score exists;
            this is anchored on NICE NG24 restrictive thresholds and indication appropriateness.
        appropriatenessBand:
          type: string
          enum:
          - usually-appropriate
          - may-be-appropriate
          - usually-not-appropriate
          - ''
          description: 'Appropriateness band: usually-appropriate (7-9), may-be-appropriate (4-6), usually-not-appropriate
            (1-3).'
        identitySafetyBand:
          type: string
          enum:
          - ok
          - caution
          - reject-risk
          - ''
          description: 'Identity / sample safety band: ok, caution, reject-risk (driven by two-sample
            rule, mislabel risk, and positive patient ID).'
        completenessPercent:
          type:
          - integer
          - 'null'
          format: int32
          description: Request completeness as a percentage of mandatory fields (0-100).
        triageTier:
          type: string
          enum:
          - routine
          - urgent
          - emergency
          - stat
          - ''
          description: 'Assigned triage tier: routine, urgent, emergency, stat.'
        targetTimeframe:
          type: string
          maxLength: 50
          description: Target timeframe for compatible blood / testing implied by the triage tier.
        recommendation:
          type: string
          enum:
          - accept
          - query-referrer
          - redirect
          - reject
          - ''
          description: 'Vetting recommendation: accept, query-referrer, redirect, reject.'
        clinicianNotes:
          type: string
          description: Free-text vetting notes.
        signedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Timestamp of vetting clinician electronic signature.
        gradedAt:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the result.
      required:
      - createdAt
      - updatedAt
      - bloodCrossMatchTestRequestId
      - appropriatenessBand
      - identitySafetyBand
      - triageTier
      - targetTimeframe
      - recommendation
      - clinicianNotes
      - gradedAt
      description: 'Computed four-axis grading result: appropriateness (1-9, anchored on NICE NG24 thresholds
        and indication), identity / sample safety, request completeness, and triage priority.'
    BloodCrossMatchTestRequestGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        bloodCrossMatchTestRequestGradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        flagId:
          type: string
          maxLength: 50
          description: Stable flag identifier (e.g. F-TWO-SAMPLE-RULE-001).
        category:
          type: string
          enum:
          - massive-haemorrhage-stat
          - two-sample-rule-not-met
          - known-antibodies-extra-time
          - previous-transfusion-reaction
          - mislabel-risk
          - missing-clinical-details
          - missing-blood-group
          - other
          - ''
          description: Flag category.
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          - ''
          description: 'Priority: low, medium, high.'
        description:
          type: string
          maxLength: 500
          description: Human-readable description of what fired the flag.
        suggestedAction:
          type: string
          maxLength: 500
          description: Suggested clinical action (e.g. "activate major haemorrhage protocol and issue
            emergency O-negative").
      required:
      - createdAt
      - updatedAt
      - bloodCrossMatchTestRequestGradeId
      - flagId
      - category
      - priority
      - description
      - suggestedAction
      description: Safety-critical flags that fire independently of the four axes, with priority and a
        suggested action for the transfusion laboratory / clinical team.
    BloodCrossMatchTestRequestGradeRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        bloodCrossMatchTestRequestGradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        ruleId:
          type: string
          maxLength: 40
          description: Stable rule identifier (e.g. R-APPROP-NG24-01).
        axis:
          type: string
          enum:
          - appropriateness
          - identity
          - completeness
          - triage
          - ''
          description: 'Scoring axis the rule belongs to: appropriateness, identity, completeness, triage.'
        category:
          type: string
          maxLength: 50
          description: Category or indication the rule relates to.
        description:
          type: string
          maxLength: 500
          description: Human-readable description of why the rule fired.
      required:
      - createdAt
      - updatedAt
      - bloodCrossMatchTestRequestGradeId
      - ruleId
      - axis
      - category
      - description
      description: Audit trail of every appropriateness / identity / completeness / triage rule that fired
        for this request.
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Name.
        email:
