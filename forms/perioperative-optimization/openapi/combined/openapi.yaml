      description: 'Perioperative optimization: the payload of the 16-step single-page wizard, covering
        the eight optimization domains plus the history, medication, allergy, frailty, and social context
        that shapes the prehabilitation plan.'
    PerioperativeOptimizationGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        perioperative_optimization_id:
          type: string
          format: uuid
          description: Foreign key to the perioperative_optimization table, unique because grading is
            one-to-one with the assessment.
        weeks_to_surgery:
          type: integer
          format: int32
          description: Whole weeks between the assessment date and the planned surgery date, the value
            every domain lead time is gated against. Negative where the surgery date precedes the assessment
            date; NULL where either date is missing.
        gating_applied:
          type: boolean
          description: Whether time-to-surgery gating could be applied, i.e. whether both dates were present.
            When false, every triggered domain reports action-required and the report says gating was
            not applied.
        must_score:
          type: integer
          format: int32
          description: Malnutrition Universal Screening Tool total, 0 to 6, driving the nutrition domain.
        must_risk:
          type: string
          enum:
          - low
          - medium
          - high
          - ''
          description: 'MUST risk category: low for 0, medium for 1, high for 2 or more.'
        audit_c_score:
          type: integer
          format: int32
          description: AUDIT-C alcohol consumption score, 0 to 12, driving the alcohol domain.
        stop_bang_score:
          type: integer
          format: int32
          description: STOP-BANG obstructive sleep apnoea screening score, 0 to 8, contributing to the
            cardiorespiratory domain.
        duke_activity_status_index:
          type: number
          format: double
          description: Duke Activity Status Index, contributing to the physical fitness domain.
        clinical_frailty_scale:
          type: integer
          format: int32
          description: Clinical Frailty Scale, 1 to 9. Reported and flagged but not gated, because frailty
            is rarely reversible in the available window.
        fried_phenotype_score:
          type: integer
          format: int32
          description: 'Fried Frailty Phenotype score (0-5): count of weakness, slowness, low activity,
            exhaustion, and unintentional weight loss criteria met.'
        fried_frailty_category:
          type: string
          enum:
          - robust
          - pre-frail
          - frail
          - ''
          description: 'Fried Frailty Phenotype category derived from the score: robust (0), pre-frail
            (1-2), or frail (3-5).'
        domains_optimized:
          type: integer
          format: int32
          description: Count of the eight domains graded optimized or not-applicable.
        domains_in_progress:
          type: integer
          format: int32
          description: Count of the eight domains graded in-progress.
        domains_action_required:
          type: integer
          format: int32
          description: Count of the eight domains graded action-required.
        domains_insufficient_time:
          type: integer
          format: int32
          description: Count of the eight domains graded insufficient-time. Any value above zero forces
            a defer-surgery readiness band.
        computed_readiness:
          type: string
          enum:
          - ready
          - optimization-in-progress
          - optimization-required
          - defer-surgery
          - ''
          description: Surgical readiness band computed by the engine using the max-grade algorithm across
            the eight domains.
        final_readiness:
          type: string
          enum:
          - ready
          - optimization-in-progress
          - optimization-required
          - defer-surgery
          - ''
          description: Surgical readiness band signed off by the clinician, which may equal or differ
            from the computed band.
        override_reason:
          type: string
          maxLength: 500
          description: Reason the clinician set a final band differently from the computed band, mandatory
            when they differ. Safety flags are unaffected by the override.
        gate_decision:
          type: string
          enum:
          - proceed
          - proceed-with-prehabilitation
          - defer-and-optimize
          - accept-unoptimized-risk
          - mdt-review
          - cancel
          - ''
          description: 'The explicit human decision recorded at sign-off: proceed, proceed-with-prehabilitation,
            defer-and-optimize, accept-unoptimized-risk, mdt-review, or cancel.'
        recommended_earliest_surgery_date:
          type: string
          format: date
          description: Earliest date at which every triggered domain would have had its full lead time,
            derived from the largest domain shortfall.
        clinician_notes:
          type: string
          description: Free-text clinician summary notes.
        signed_by_name:
          type: string
          maxLength: 255
          description: Name of the clinician who signed the assessment.
        signed_at:
          type: string
          format: date-time
          description: Timestamp of the clinician electronic signature.
        graded_at:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the result.
      required:
      - created_at
      - updated_at
      - perioperative_optimization_id
      - gating_applied
      - must_risk
      - fried_frailty_category
      - computed_readiness
      - final_readiness
      - override_reason
      - gate_decision
      - clinician_notes
      - signed_by_name
      - graded_at
      description: Computed and signed-off grading result for one perioperative optimization assessment,
        holding the engine-computed and clinician-final surgical readiness bands.
    PerioperativeOptimizationGradeDomain:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        perioperative_optimization_grade_id:
          type: string
          format: uuid
          description: Foreign key to the parent perioperative_optimization_grade table.
        domain:
          type: string
          enum:
          - anaemia
          - glycaemic-control
          - smoking
          - alcohol
          - nutrition
          - physical-fitness
          - medication
          - cardiorespiratory
          description: Which of the eight optimization domains this row grades.
        status:
          type: string
          enum:
          - optimized
          - in-progress
          - action-required
          - insufficient-time
          - not-applicable
          - ''
          description: 'Domain status after time-to-surgery gating: optimized, in-progress, action-required,
            insufficient-time, or not-applicable.'
        triggered:
          type: boolean
          description: Whether the domain screening threshold was crossed, i.e. whether there is anything
            to optimize.
        lead_time_weeks:
          type: integer
          format: int32
          description: Minimum weeks before surgery the intervention needs in order to work, per doc/optimization-domains.md.
        weeks_shortfall:
          type: integer
          format: int32
          description: How many weeks short of the lead time this assessment is, i.e. how much later the
            surgery would have to be for the intervention to work. NULL when there is enough time.
        rule_id:
          type: string
          maxLength: 30
          description: Stable identifier of the rule that triggered the domain, such as R-ANAEMIA-3.
        finding:
          type: string
          maxLength: 500
          description: Human-readable description of what triggered the domain.
        intervention:
          type: string
          maxLength: 500
          description: The intervention this domain calls for.
        intervention_started:
          type: boolean
          description: Whether the intervention has already been started, which moves the domain from
            action-required to in-progress.
        referral_made:
          type: boolean
          description: Whether an onward referral for this domain has been made.
        target_value:
          type: string
          maxLength: 255
          description: Target value for the domain, such as a haemoglobin or HbA1c figure to reach before
            surgery.
        start_date:
          type: string
          format: date
          description: Date the intervention for this domain started, or is planned to start.
      required:
      - created_at
      - updated_at
      - perioperative_optimization_grade_id
      - domain
      - status
      - triggered
      - lead_time_weeks
      - rule_id
      - finding
      - intervention
      - intervention_started
      - referral_made
      - target_value
      description: Per-domain optimization result, one row per optimization domain per assessment. The
        domain statuses are this form primary output rather than an audit trail beneath a single score.
    PerioperativeOptimizationGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        perioperative_optimization_grade_id:
          type: string
          format: uuid
          description: Foreign key to the parent perioperative_optimization_grade table.
        flag_id:
          type: string
          maxLength: 50
          description: Stable flag identifier, such as F-SGLT2-INHIBITOR-NOT-HELD-001.
        category:
          type: string
          enum:
          - severe-anaemia
          - iron-deficiency-untreated
          - hba1c-above-threshold
          - undiagnosed-diabetes
          - sglt2-inhibitor-not-held
          - glp1-agonist-aspiration-risk
          - anticoagulation-plan-missing
          - insufficient-time-to-optimize
          - active-smoker-major-surgery
          - alcohol-dependence-risk
          - high-malnutrition-risk
          - poor-functional-capacity
          - severe-frailty
          - uncontrolled-hypertension
          - cardiac-optimization-required
          - respiratory-optimization-required
          - osa-unassessed
          - renal-optimization-required
          - prior-anaesthetic-complication
          - cognitive-assessment-indicated
          - sarcopenia-risk
          - dehydration-aki-risk
          - rebound-glycaemic-risk
          - psychological-support-required
          - social-support-gap
          - capacity-concern
          - pregnancy
          - paediatric
          - safeguarding
          - other
          - ''
          description: Flag category, such as sglt2-inhibitor-not-held or insufficient-time-to-optimize.
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          - ''
          description: 'Priority: low, medium, or high.'
        domain:
          type: string
          maxLength: 30
          description: Optimization domain the flag relates to, where it belongs to one, so a dashboard
            can group flags by domain.
        description:
          type: string
          maxLength: 500
          description: Human-readable description of what fired the flag.
        suggested_action:
          type: string
          maxLength: 500
          description: Suggested clinical action, such as "agree a hold-and-restart plan with the prescriber
            before admission".
      required:
      - created_at
      - updated_at
      - perioperative_optimization_grade_id
      - flag_id
      - category
      - priority
      - domain
      - description
      - suggested_action
      description: Safety-critical flags that fire independently of the surgical readiness band, with
        a priority and a suggested action for the perioperative team.
