          enum:
            - "yes"
            - "no"
            - ""
          description: Whether the patient has a respiratory diagnosis such as asthma or chronic obstructive pulmonary disease.
        condition_renal:
          type: string
          enum:
            - "yes"
            - "no"
            - ""
          description: Whether the patient has a renal diagnosis.
        condition_hepatic:
          type: string
          enum:
            - "yes"
            - "no"
            - ""
          description: Whether the patient has a liver diagnosis.
        condition_stroke:
          type: string
          enum:
            - "yes"
            - "no"
            - ""
          description: Whether the patient has had a stroke or transient ischaemic attack.
        condition_cancer:
          type: string
          enum:
            - "yes"
            - "no"
            - ""
          description: Whether the patient has a cancer diagnosis, which often constrains how long surgery can be deferred to optimize.
        condition_rheumatological:
          type: string
          enum:
            - "yes"
            - "no"
            - ""
          description: Whether the patient has a rheumatological diagnosis, which often means immunosuppressant therapy.
        condition_thyroid:
          type: string
          enum:
            - "yes"
            - "no"
            - ""
          description: Whether the patient has a thyroid diagnosis.
        condition_other:
