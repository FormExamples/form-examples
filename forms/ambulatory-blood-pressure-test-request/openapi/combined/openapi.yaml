components:
  schemas:
    AmbulatoryBloodPressureTestRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the patient.
        clinicianId:
          type: string
          format: uuid
          description: Foreign key to the requesting clinician (referrer).
        status:
          type: string
          enum:
          - draft
          - submitted
          - vetted
          - scheduled
          - rejected
          - ''
          description: 'Request lifecycle status: draft, submitted, vetted, scheduled, rejected.'
        siteName:
          type: string
          maxLength: 255
          description: Name of the requesting site or clinic.
        setting:
          type: string
          enum:
          - outpatient
          - inpatient
          - community
          - emergency
          - ''
          description: 'Care setting: outpatient, inpatient, community, emergency.'
        referralDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the referral was made.
        requestedByDate:
          type:
          - string
          - 'null'
          format: date
          description: Date by which the test is requested to be performed.
        testType:
          type: string
          enum:
          - 24-hour-abpm
          - home-blood-pressure-monitoring
          - other
          - ''
          description: 'Requested test type: 24-hour-abpm, home-blood-pressure-monitoring, other.'
        primaryIndication:
          type: string
          enum:
          - diagnose-hypertension
          - white-coat-hypertension
          - masked-hypertension
          - resistant-hypertension
          - treatment-monitoring
          - hypotension-symptoms
          - pregnancy-hypertension
          - other
          - ''
          description: Primary clinical indication, used for appropriateness scoring.
        clinicalQuestion:
          type: string
          maxLength: 1000
          description: Specific clinical question the test should answer (highest-value field).
        relevantHistory:
          type: string
          maxLength: 1000
          description: Relevant medical, cardiovascular, and medication history.
        clinicBpSystolic:
          type:
          - integer
          - 'null'
          format: int32
          description: Most recent clinic systolic blood pressure in mmHg, used for appropriateness and
            triage.
        clinicBpDiastolic:
          type:
          - integer
          - 'null'
          format: int32
          description: Most recent clinic diastolic blood pressure in mmHg, used for appropriateness and
            triage.
        onAntihypertensives:
          type: boolean
          description: Whether the patient is currently taking antihypertensive medication.
        currentMedications:
          type: string
          maxLength: 1000
          description: Free-text list of the patient's current medications.
        symptomDizziness:
          type: boolean
          description: Whether the patient reports dizziness (possible hypotension symptom).
        symptomHeadache:
          type: boolean
          description: Whether the patient reports headache.
        atrialFibrillation:
          type: boolean
          description: Whether the patient has atrial fibrillation, which reduces oscillometric measurement
            accuracy.
        pregnant:
          type: boolean
          description: Whether the patient is pregnant, affecting thresholds and device validation.
        urgency:
          type: string
          enum:
          - routine
          - urgent
          - emergency
          - ''
          description: 'Requested triage urgency: routine, urgent, emergency.'
        supervisingConsultant:
          type: string
          maxLength: 255
          description: Name of the supervising / responsible consultant.
        requesterContact:
          type: string
          maxLength: 255
          description: Contact details (bleep / phone) for the requester.
        notes:
          type: string
          maxLength: 1000
          description: Free-text additional notes.
      required:
      - createdAt
      - updatedAt
      - patientId
      - clinicianId
      - status
      - siteName
      - setting
      - testType
      - primaryIndication
      - clinicalQuestion
      - relevantHistory
      - onAntihypertensives
      - currentMedications
      - symptomDizziness
      - symptomHeadache
      - atrialFibrillation
      - pregnant
      - urgency
      - supervisingConsultant
      - requesterContact
      - notes
      description: Ambulatory blood pressure monitoring (ABPM) test request (referral). Captures the requested
        test, the clinical indication and question, clinic blood pressure, medication, symptoms and accuracy
        factors, and triage urgency.
    AmbulatoryBloodPressureTestRequestGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        ambulatoryBloodPressureTestRequestId:
          type: string
          format: uuid
          description: Foreign key to the parent request (unique, 1:1).
        appropriatenessScore:
          type:
          - integer
          - 'null'
          format: int32
          description: Appropriateness score (1-9) grounded in NICE NG136 (ABPM to confirm clinic BP >=140/90).
        appropriatenessBand:
          type: string
          enum:
          - usually-appropriate
          - may-be-appropriate
          - usually-not-appropriate
          - ''
          description: 'Appropriateness band: usually-appropriate (7-9), may-be-appropriate (4-6), usually-not-appropriate
            (1-3).'
        suitabilityBand:
          type: string
          enum:
          - ok
          - caution
          - limited
          - ''
          description: 'Suitability of oscillometric ABPM given accuracy factors (atrial fibrillation,
            arm size): ok, caution, limited.'
        completenessPercent:
          type:
          - integer
          - 'null'
          format: int32
          description: Request completeness as a percentage of mandatory fields (0-100).
        triageTier:
          type: string
          enum:
          - routine
          - urgent
          - emergency
          - ''
          description: 'Assigned triage tier: routine, urgent, emergency.'
        targetTimeframe:
          type: string
          maxLength: 50
          description: Target timeframe for the test implied by the triage tier.
        recommendation:
          type: string
          enum:
          - accept
          - query-referrer
          - redirect
          - reject
          - ''
          description: 'Vetting recommendation: accept, query-referrer, redirect, reject.'
        clinicianNotes:
          type: string
          description: Free-text vetting notes.
        signedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Timestamp of vetting clinician electronic signature.
        gradedAt:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the result.
      required:
      - createdAt
      - updatedAt
      - ambulatoryBloodPressureTestRequestId
      - appropriatenessBand
      - suitabilityBand
      - triageTier
      - targetTimeframe
      - recommendation
      - clinicianNotes
      - gradedAt
      description: 'Computed four-axis grading result: appropriateness (NICE NG136 1-9), suitability for
        oscillometric ABPM, request completeness, and triage priority.'
    AmbulatoryBloodPressureTestRequestGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        ambulatoryBloodPressureTestRequestGradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        flagId:
          type: string
          maxLength: 50
          description: Stable flag identifier (e.g. F-SEVERE-HYPERTENSION-001).
        category:
          type: string
          enum:
          - severe-hypertension-urgent
          - accelerated-hypertension
          - atrial-fibrillation-accuracy
          - missing-clinic-bp
          - missing-indication
          - missing-clinical-question
          - other
          - ''
          description: Flag category.
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          - ''
          description: 'Priority: low, medium, high.'
        description:
          type: string
          maxLength: 500
          description: Human-readable description of what fired the flag.
        suggestedAction:
          type: string
          maxLength: 500
          description: Suggested clinical action (e.g. "arrange same-day specialist review").
      required:
      - createdAt
      - updatedAt
      - ambulatoryBloodPressureTestRequestGradeId
      - flagId
      - category
      - priority
      - description
      - suggestedAction
      description: Safety-critical flags that fire independently of the four axes, with priority and a
        suggested action for the vetting team.
    AmbulatoryBloodPressureTestRequestGradeRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        ambulatoryBloodPressureTestRequestGradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        ruleId:
          type: string
          maxLength: 40
          description: Stable rule identifier (e.g. R-APPROP-CONFIRM-01).
        axis:
          type: string
          enum:
          - appropriateness
          - suitability
          - completeness
          - triage
          - ''
          description: 'Scoring axis the rule belongs to: appropriateness, suitability, completeness,
            triage.'
        category:
          type: string
          maxLength: 50
          description: Category or indication the rule relates to.
        description:
          type: string
          maxLength: 500
          description: Human-readable description of why the rule fired.
      required:
      - createdAt
      - updatedAt
      - ambulatoryBloodPressureTestRequestGradeId
      - ruleId
      - axis
      - category
      - description
      description: Audit trail of every appropriateness / suitability / completeness / triage rule that
        fired for this request.
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Name.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as full text.
        countryAsIso31661Alpha2:
