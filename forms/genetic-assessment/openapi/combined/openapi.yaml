        age_at_death:
          type: integer
          format: int32
          description: Age at death in years, NULL if alive or unknown.
        cause_of_death:
          type: string
          maxLength: 255
          description: Cause of death if deceased.
        medical_conditions:
          type: string
          description: Free-text list of medical conditions relevant to genetics.
        family_pedigree_member_sort_order:
          type: integer
          format: int32
          description: Display order within the pedigree list.
