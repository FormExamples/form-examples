components:
  schemas:
    BoneMarrowDonationAssessment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the patient who owns this assessment.
        status:
          type: string
          enum:
          - draft
          - submitted
          - reviewed
          - urgent
          description: 'Lifecycle status: draft, submitted, reviewed, or urgent.'
      required:
      - createdAt
      - updatedAt
      - patientId
      - status
      description: Bone marrow donation assessment form evaluating haematopoietic stem cell donor eligibility.
        Parent entity for all assessment sections.
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Name.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as full text.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code, such as for validating the postal address.
        role:
          type: string
          enum:
          - anaesthetist
          - surgeon
          - preop-nurse
          - perioperative-physician
          - geriatrician
          - pharmacist
          - other
          - ''
          description: Clinician role.
        registrationBody:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - GPhC
          - other
          - ''
          description: Clinician registration body.
        registrationNumber:
          type: string
          description: Clinician registration number.
        unitedKingdomNhsNumber:
          type:
          - string
          - 'null'
          maxLength: 12
          description: United Kingdom NHS number, unique per person.
      required:
      - createdAt
      - updatedAt
      - name
      - role
      - registrationBody
      - registrationNumber
      description: Clinician
    Grade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        eligibility:
          type: string
          enum:
          - suitable
          - conditionally-suitable
          - unsuitable
          - ''
          description: 'Donor eligibility decision: suitable, conditionally-suitable, unsuitable, or empty.'
        overallRiskLevel:
          type: string
          enum:
          - low
          - moderate
          - high
          - critical
          - ''
          description: 'Overall donor risk level: low, moderate, high, critical, or empty.'
        hlaMatchLevel:
          type: string
          enum:
          - 10-of-10
          - 9-of-10
          - 8-of-10
          - 7-of-10
          - haploidentical
          - ''
          description: 'HLA match level: 10-of-10, 9-of-10, 8-of-10, 7-of-10, haploidentical, or empty.'
        collectionMethod:
          type: string
          enum:
          - pbsc
          - bone-marrow
          - ''
          description: 'Final collection method: pbsc, bone-marrow, or empty.'
        gradedAt:
          type: string
          format: date-time
          description: Timestamp when the grading was computed.
      required:
      - createdAt
      - updatedAt
      - eligibility
      - overallRiskLevel
      - hlaMatchLevel
      - collectionMethod
      - gradedAt
      description: Computed donor eligibility grading result. Eligibility (suitable/conditionally-suitable/unsuitable),
        risk level, HLA match, collection method. One-to-one child of assessment.
    GradingAdditionalFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        gradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grading result.
        flagId:
          type: string
          maxLength: 30
          description: Identifier of the flag (e.g. FLAG-HIV-001, FLAG-ASA-001).
        category:
          type: string
          maxLength: 100
          description: Category of the flag (e.g. Infectious Disease, Anaesthetic, Psychological, HLA).
        message:
          type: string
          description: Human-readable description of the flagged issue.
        priority:
          type: string
          enum:
          - high
          - medium
          - low
          description: 'Priority level: high, medium, or low.'
      required:
      - createdAt
      - updatedAt
      - gradeId
      - flagId
      - category
      - message
      - priority
      description: Additional safety-critical flags detected during bone marrow donation assessment grading
        (e.g. positive infectious disease screen, anaesthetic risk, coercion concern).
    GradingFiredRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        gradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grading result.
        ruleId:
          type: string
          maxLength: 20
          description: Identifier of the rule that fired (e.g. HLA-001, MH-002, ID-003).
        category:
          type: string
          maxLength: 100
          description: Category of the rule (e.g. HLA Matching, Medical History, Infectious Disease, Anaesthetic).
        description:
          type: string
          description: Human-readable description of the rule.
        severityLevel:
          type: string
          enum:
          - low
          - moderate
          - high
          - critical
          - ''
          description: 'Risk level contributed by this rule: low, moderate, high, critical, or empty.'
      required:
      - createdAt
      - updatedAt
      - gradeId
      - ruleId
      - category
      - description
      - severityLevel
      description: Individual donor eligibility rules that evaluated to true during grading.
    Patient:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-deleted.
        name:
          type: string
          maxLength: 255
          description: Name.
        birthDate:
          type: string
          format: date
          description: Birth date.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as full text.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code, such as for validating the postal address.
        unitedKingdomNhsNumber:
          type:
          - string
          - 'null'
          maxLength: 20
          description: United Kingdom NHS number, unique per person.
        waistAsCm:
          type:
          - number
          - 'null'
          format: double
          description: Waist circumference measurement in cm, such as for calculating waist-height ratio
            (WHR).
        heightAsCm:
          type:
          - number
          - 'null'
          format: double
          description: Height measurement in cm, such as for calculating waist-height ratio (WHR).
        weightAsKg:
          type:
          - number
          - 'null'
          format: double
          description: Weight as kg.
        bodyMassIndex:
          type:
          - number
          - 'null'
          format: double
          description: Body mass index (BMI) measurement.
        waistHeightRatio:
          type:
          - number
          - 'null'
          format: double
          description: Waist-height ratio (WHR) measurement.
        vo2Max:
          type:
          - number
          - 'null'
          format: double
          description: VO2 max measurement.
      required:
      - createdAt
      - updatedAt
      - name
      - birthDate
      description: Patient
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          description: A URI identifying the problem type
        title:
          type: string
          description: A short summary of the problem type
        status:
          type: integer
          description: The HTTP status code
        detail:
          type: string
          description: An explanation of this occurrence
        instance:
          type: string
          description: A URI identifying this occurrence
        code:
          type: string
          description: A short machine-readable reason
        errors:
          type: object
          description: Per-field detail, when validation failed
      required:
      - type
      - title
      - status
