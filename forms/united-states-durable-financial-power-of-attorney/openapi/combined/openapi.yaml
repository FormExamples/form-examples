components:
  schemas:
    Agent:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Full name of the agent.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as a single text block.
        relationship:
          type: string
          enum:
          - spouse
          - child
          - other-family
          - friend
          - professional
          - financial-institution
          - ''
          description: 'Relationship to the principal: spouse, child, other-family, friend, professional,
            or financial-institution.'
      required:
      - createdAt
      - updatedAt
      - name
      - relationship
      description: The agent (attorney-in-fact) named in a durable financial power of attorney.
    Principal:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          maxLength: 255
          description: Full legal name of the principal.
        birthDate:
          type: string
          format: date
          description: Date of birth of the principal.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as a single text block.
        stateAsIso31662Us:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Home state as the two-letter United States postal code.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2.
        postcode:
          type:
          - string
          - 'null'
          description: ZIP code.
      required:
      - createdAt
      - updatedAt
      - name
      - birthDate
      description: 'The principal: the person who signs the durable financial power of attorney.'
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          description: A URI identifying the problem type
        title:
          type: string
          description: A short summary of the problem type
        status:
          type: integer
          description: The HTTP status code
        detail:
          type: string
          description: An explanation of this occurrence
        instance:
          type: string
          description: A URI identifying this occurrence
        code:
          type: string
          description: A short machine-readable reason
        errors:
          type: object
          description: Per-field detail, when validation failed
      required:
      - type
      - title
      - status
    UnitedStatesDurableFinancialPowerOfAttorney:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        principalId:
          type: string
          format: uuid
          description: Foreign key to the principal who signs the instrument (restrict delete).
        agentId:
          type:
          - string
          - 'null'
          format: uuid
          description: Foreign key to the primary agent (restrict delete); optional.
        principalName:
          type: string
          description: Full legal name of the principal as written in the instrument.
        dateOfBirth:
          type:
          - string
          - 'null'
          format: date
          description: Date of birth of the principal.
        state:
          type: string
          maxLength: 2
          description: Governing state as the two-letter United States postal code; empty when unanswered.
        principalAddress:
          type: string
          description: Principal address.
        capacityConfirmed:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the principal has capacity to sign and understands the document (yes/no).
        durableStatement:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Whether the instrument is durable: its authority survives the principal incapacity
            (yes/no).'
        effectiveness:
          type: string
          enum:
          - immediate
          - springing
          - ''
          description: 'When the power takes effect: immediate on signing, or springing on a later event.'
        springingTrigger:
          type: string
          enum:
          - physician-certification
          - named-person-declaration
          - court-determination
          - ''
          description: 'Who determines the springing event: physician-certification, named-person-declaration,
            or court-determination.'
        statutoryNoticeIncluded:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the mandatory statutory notice text for the governing state is included
            (yes/no).
        agentName:
          type: string
          description: Full name of the primary agent.
        agentRelationship:
          type: string
          enum:
          - spouse
          - child
          - other-family
          - friend
