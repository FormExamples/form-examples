      - diagnosis_narrative
      - management_plan
      - medication_changes
      - recommended_follow_up
      - critical_result
      - critical_result_communicated
      - reported_to
      description: Cardiology response (consult reply) authored by a cardiology clinician in answer to
        a cardiology referral. Captures the consultation type, clinical summary and examination, investigations
        performed, structured findings, the diagnosis, the key left-ventricular ejection fraction measurement,
        the management plan and follow-up, and critical-result communication. This is the source-of-truth
        record that the four-axis interpretation grade is computed from.
    CardiologyResponseGrade:
