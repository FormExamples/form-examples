        examination_findings:
          type: string
          maxLength: 1000
          description: Cardiovascular examination findings.
        investigations_performed:
          type: string
          maxLength: 1000
          description: Investigations performed or reviewed (e.g. ECG, echocardiogram, stress test) and
            their findings.
        ischaemia_or_cad:
          type: boolean
          description: 'Structured finding: ischaemia or coronary artery disease present.'
        significant_arrhythmia:
          type: boolean
          description: 'Structured finding: significant arrhythmia present.'
        reduced_ejection_fraction:
          type: boolean
          description: 'Structured finding: reduced left-ventricular ejection fraction.'
        significant_valve_disease:
          type: boolean
          description: 'Structured finding: significant (moderate or severe) valve disease.'
        structural_abnormality:
          type: boolean
          description: 'Structured finding: structural cardiac abnormality (e.g. cardiomyopathy, congenital).'
        uncontrolled_hypertension:
          type: boolean
          description: 'Structured finding: uncontrolled hypertension.'
        non_cardiac_cause:
          type: boolean
          description: 'Structured finding: a non-cardiac cause was identified or judged most likely.'
        primary_diagnosis_category:
          type: string
          enum:
          - coronary-artery-disease
          - heart-failure
          - arrhythmia
          - valve-disease
          - hypertension
          - cardiomyopathy
          - non-cardiac
          - no-abnormality
          - other
          - ''
          description: 'Primary diagnosis category: coronary-artery-disease, heart-failure, arrhythmia,
            valve-disease, hypertension, cardiomyopathy, non-cardiac, no-abnormality, other.'
        diagnosis_narrative:
          type: string
          maxLength: 2000
          description: Narrative diagnosis answering the referral clinical question.
        lv_ejection_fraction_percent:
          type: number
          format: double
          description: Left-ventricular ejection fraction as a percentage (0-100), the key prognostic
            measurement.
        management_plan:
          type: string
          maxLength: 2000
          description: Management plan including investigations arranged and treatment.
        medication_changes:
          type: string
          maxLength: 1000
          description: Medication changes recommended or made.
        recommended_follow_up:
          type: string
          maxLength: 1000
          description: Recommended follow-up, including who should action it and when.
        critical_result:
          type: boolean
          description: Whether a critical or unexpected significant cardiac result is present (e.g. critical
            arrhythmia, severe aortic stenosis, acute coronary syndrome).
        critical_result_communicated:
          type: boolean
          description: Whether the critical result was communicated directly to the referrer / responsible
