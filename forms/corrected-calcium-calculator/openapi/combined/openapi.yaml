components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Clinician full name as recorded in the rota.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as a single text block.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code.
        role:
          type: string
          enum:
          - consultant-surgeon
          - surgical-registrar
          - foundation-trainee
          - consultant-anaesthetist
          - anaesthetic-registrar
          - odp
          - scrub-nurse
          - circulating-nurse
          - theatre-coordinator
          - medical-student
          - other
          - ''
          description: 'Primary clinical role: consultant-surgeon, surgical-registrar, foundation-trainee,
            consultant-anaesthetist, anaesthetic-registrar, odp, scrub-nurse, circulating-nurse, theatre-coordinator,
            medical-student, or other.'
        registrationBody:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - GPhC
          - other
          - ''
          description: 'Professional registration body: GMC, NMC, HCPC, GPhC, or other.'
        registrationNumber:
          type: string
          description: Professional registration number issued by the registration body.
      required:
      - createdAt
      - updatedAt
      - name
      - role
      - registrationBody
      - registrationNumber
      description: Clinician identifying information for the staff recording a corrected-calcium calculation.
    CorrectedCalciumCalculator:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the patient this calculation is for (restricted delete).
        clinicianId:
          type:
          - string
          - 'null'
          format: uuid
          description: Foreign key to the clinician who recorded the calculation (optional, restricted
            delete).
        clinicianName:
          type: string
          maxLength: 255
          description: Assessing clinician name as recorded on the form.
        clinicianRole:
          type: string
          enum:
          - doctor
          - nurse
          - pharmacist
          - laboratory-staff
          - other
          - ''
          description: 'Assessing clinician role: doctor, nurse, pharmacist, laboratory-staff, or other.'
        assessedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Date and time the calculation was assessed.
        careSetting:
          type: string
          enum:
          - general-practice
          - ward
          - emergency-department
          - outpatient
          - laboratory
          - other
          - ''
          description: 'Care setting: general-practice, ward, emergency-department, outpatient, laboratory,
            or other.'
        sampleReference:
          type: string
          maxLength: 100
          description: Sample or collection reference for the blood specimen.
        patientIdentifier:
          type: string
          maxLength: 100
          description: Local patient identifier as recorded on the form.
        ageBand:
          type: string
          enum:
          - 18-39
          - 40-64
          - 65-74
          - 75-84
          - 85-plus
          - ''
          description: 'Adult age band: 18-39, 40-64, 65-74, 75-84, or 85-plus.'
        sex:
          type: string
          enum:
          - female
          - male
          - intersex
          - unknown
          - ''
          description: 'Patient sex recorded for clinical purposes: female, male, intersex, or unknown.'
        totalCalciumMmolL:
          type:
          - number
          - 'null'
          format: double
          description: Measured total serum calcium in mmol/L (null when unanswered).
        albuminGL:
          type:
          - number
          - 'null'
          format: double
          description: Measured serum albumin in g/L (null when unanswered).
        symptomatic:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Whether calcium-related symptoms are present: yes or no.'
      required:
      - createdAt
      - updatedAt
      - patientId
      - clinicianName
      - clinicianRole
      - careSetting
      - sampleReference
      - patientIdentifier
      - ageBand
      - sex
      - symptomatic
      description: 'Main corrected-calcium calculation record: context and identification, plus the measured
        total calcium and albumin inputs and the symptomatic flag.'
    CorrectedCalciumCalculatorGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        correctedCalciumCalculatorId:
          type: string
          format: uuid
          description: Foreign key to the parent calculation record (unique, 1:1).
        correctedCalciumMmolL:
          type:
          - number
          - 'null'
          format: double
          description: Albumin-adjusted corrected calcium in mmol/L (null when either input is missing).
        classification:
          type: string
          enum:
          - hypocalcaemia
          - normal
          - hypercalcaemia
          - unknown
          - ''
          description: 'Classification against the adult reference range 2.20-2.60 mmol/L: hypocalcaemia,
            normal, hypercalcaemia, or unknown.'
        gradedAt:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the result.
      required:
      - createdAt
      - updatedAt
      - correctedCalciumCalculatorId
      - classification
      - gradedAt
      description: 'Computed corrected-calcium result: the albumin-adjusted corrected calcium value and
        its classification against the adult reference range (1:1 with the parent calculation record).'
    CorrectedCalciumCalculatorGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        correctedCalciumCalculatorGradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        flagId:
          type: string
          maxLength: 50
          description: Stable flag identifier (e.g. F-SEVERE-HYPERCALCAEMIA-001).
        category:
          type: string
          enum:
          - severe-hypercalcaemia
          - severe-hypocalcaemia
          - symptomatic-hypercalcaemia
          - hypercalcaemia
          - hypocalcaemia
          - incomplete-data
          - other
          - ''
          description: 'Flag category: severe-hypercalcaemia, severe-hypocalcaemia, symptomatic-hypercalcaemia,
            hypercalcaemia, hypocalcaemia, incomplete-data, or other.'
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          - ''
          description: 'Priority: low, medium, high.'
        description:
          type: string
          maxLength: 500
          description: Human-readable description of what fired the flag.
        suggestedAction:
          type: string
          maxLength: 500
          description: Suggested clinical action (e.g. "seek immediate senior or endocrine review").
      required:
      - createdAt
      - updatedAt
      - correctedCalciumCalculatorGradeId
      - flagId
      - category
      - priority
      - description
      - suggestedAction
      description: Safety-critical flags that fire independently of the classification, with priority
        and a suggested action for the assessing clinician.
    CorrectedCalciumCalculatorGradeRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        correctedCalciumCalculatorGradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        ruleId:
          type: string
          maxLength: 40
          description: Stable rule identifier (e.g. R-CLASSIFY-HYPERCALCAEMIA-01).
        instrument:
          type: string
          enum:
          - correction
          - classification
          - severity
          - composite
          description: 'Instrument the rule belongs to: correction, classification, severity, or composite.'
        band:
          type: string
          enum:
          - hypocalcaemia
          - normal
          - hypercalcaemia
          - unknown
          - ''
          description: 'Classification band contributed by this rule: hypocalcaemia, normal, hypercalcaemia,
            or unknown.'
        category:
          type: string
          maxLength: 50
          description: Subject category (e.g. reference-range, severity-threshold, missing-input).
        description:
          type: string
          maxLength: 500
          description: Human-readable description of why the rule fired.
      required:
      - createdAt
      - updatedAt
      - correctedCalciumCalculatorGradeId
      - ruleId
      - instrument
      - band
      - category
      - description
      description: 'Audit trail of every rule that fired during corrected-calcium computation: instrument,
        band, category, and description.'
    Patient:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          maxLength: 255
          description: Full patient name as recorded on the wristband.
        birthDate:
          type: string
          format: date
          description: Date of birth.
        sex:
          type: string
          enum:
          - female
          - male
          - intersex
          - unknown
          - ''
          description: 'Sex recorded for clinical purposes: female, male, intersex, or unknown.'
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as a single text block.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code.
        unitedKingdomNhsNumber:
          type:
          - string
