components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Clinician full name as recorded in the rota.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as a single text block.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code.
        role:
          type: string
          enum:
          - doctor
          - nurse-practitioner
          - paramedic
          - physiotherapist
          - other
          - ''
          description: 'Primary clinical role: doctor, nurse-practitioner, paramedic, physiotherapist,
            or other.'
        registrationBody:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - GPhC
          - other
          - ''
          description: 'Professional registration body: GMC, NMC, HCPC, GPhC, or other.'
        registrationNumber:
          type: string
          description: Professional registration number issued by the registration body.
      required:
      - createdAt
      - updatedAt
      - name
      - role
      - registrationBody
      - registrationNumber
      description: Clinician identifying information for the assessing clinician.
    OttawaAnkleRules:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the patient being assessed (restricts delete).
        clinicianId:
          type:
          - string
          - 'null'
          format: uuid
          description: Foreign key to the assessing clinician (restricts delete).
        status:
          type: string
          enum:
          - draft
          - submitted
          - amended
          - signed
          - ''
          description: 'Workflow status: draft, submitted, amended, or signed.'
        patientIdentifier:
          type: string
          maxLength: 64
          description: Local patient identifier as recorded at the point of assessment.
        assessedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Date and time the assessment was carried out.
        careSetting:
          type: string
          enum:
          - emergency-department
          - minor-injury-unit
          - urgent-care
          - other
          - ''
          description: 'Care setting: emergency-department, minor-injury-unit, urgent-care, or other.'
        injuredSide:
          type: string
          enum:
          - left
          - right
          - ''
          description: 'Injured side: left or right.'
        hoursSinceInjury:
          type:
          - number
          - 'null'
          format: double
          description: Time elapsed since the injury, in hours.
        ageYears:
          type:
          - integer
          - 'null'
          format: int32
          description: Patient age in years; ages below 18 raise an applicability flag.
        sex:
          type: string
          enum:
          - female
          - male
          - intersex
          - unknown
          - ''
          description: 'Sex recorded for clinical purposes: female, male, intersex, or unknown.'
        assessmentReliable:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Applicability: no intoxication, distracting injury, or sensory deficit that could
            invalidate the rule (yes/no).'
        malleolarZonePain:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Ankle precondition: pain in the malleolar zone (yes/no).'
        lateralMalleolusTenderness:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Ankle criterion A1: bone tenderness at the posterior edge or tip of the lateral
            malleolus (yes/no).'
        medialMalleolusTenderness:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Ankle criterion A2: bone tenderness at the posterior edge or tip of the medial
            malleolus (yes/no).'
        midfootZonePain:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Foot precondition: pain in the midfoot zone (yes/no).'
        fifthMetatarsalBaseTenderness:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Foot criterion F1: bone tenderness at the base of the fifth metatarsal (yes/no).'
        navicularTenderness:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Foot criterion F2: bone tenderness at the navicular (yes/no).'
        ableToBearWeightImmediately:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Able to bear weight (take four steps) immediately after the injury (yes/no).
        ableToBearWeightNow:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Able to bear weight (take four steps) at the time of assessment (yes/no).
        clinicalNotes:
          type: string
          description: Free-text clinical notes captured alongside the assessment.
      required:
      - createdAt
      - updatedAt
      - patientId
      - status
      - patientIdentifier
      - careSetting
      - injuredSide
      - sex
      - assessmentReliable
      - malleolarZonePain
      - lateralMalleolusTenderness
      - medialMalleolusTenderness
      - midfootZonePain
      - fifthMetatarsalBaseTenderness
      - navicularTenderness
      - ableToBearWeightImmediately
      - ableToBearWeightNow
      - clinicalNotes
      description: 'Main Ottawa Ankle Rules assessment record: identification, context, the applicability
        flag, and the eight objective bedside criterion inputs.'
    OttawaAnkleRulesGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        ottawaAnkleRulesId:
          type: string
          format: uuid
          description: Foreign key to the parent assessment (unique, 1:1).
        unableToBearWeight:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Derived: patient cannot take four steps both immediately after injury and at assessment
            (yes/no); contributes to both the ankle and foot decisions.'
        ankleXrayIndicated:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Decision: an ankle X-ray series is indicated (yes/no), true when malleolar-zone
            pain plus any of lateral tenderness, medial tenderness, or unable-to-bear-weight.'
        footXrayIndicated:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Decision: a foot X-ray series is indicated (yes/no), true when midfoot-zone pain
            plus any of fifth-metatarsal-base tenderness, navicular tenderness, or unable-to-bear-weight.'
        recommendedAction:
          type: string
          description: Recommended imaging action derived from the two decisions (e.g. request ankle and
            foot radiographs, no imaging indicated).
        gradedAt:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the decision.
      required:
      - createdAt
      - updatedAt
      - ottawaAnkleRulesId
      - unableToBearWeight
      - ankleXrayIndicated
      - footXrayIndicated
      - recommendedAction
      - gradedAt
      description: 'Computed Ottawa Ankle Rules decision result: the derived unable-to-bear-weight finding
        and the two independent imaging decisions. One-to-one with the parent assessment.'
    OttawaAnkleRulesGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        ottawaAnkleRulesGradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        flagId:
          type: string
          maxLength: 50
          description: Stable flag identifier (e.g. F-ANKLE-XRAY-INDICATED-001).
        category:
          type: string
          enum:
          - ankle-xray-indicated
          - foot-xray-indicated
          - unable-to-bear-weight
          - applicability-age
          - unreliable-assessment
          - incomplete-assessment
          - other
          - ''
          description: 'Flag category: ankle-xray-indicated, foot-xray-indicated, unable-to-bear-weight,
            applicability-age, unreliable-assessment, incomplete-assessment, or other.'
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          - ''
          description: 'Priority: low, medium, high.'
        description:
          type: string
          maxLength: 500
          description: Human-readable description of what fired the flag.
        suggestedAction:
          type: string
          maxLength: 500
          description: Suggested clinical action (e.g. "request an ankle radiograph series", "apply paediatric
            caution or local guidance").
      required:
      - createdAt
      - updatedAt
      - ottawaAnkleRulesGradeId
      - flagId
      - category
      - priority
      - description
      - suggestedAction
      description: Clinically significant flags that fire independently of the imaging decisions, with
        priority and a suggested action for the assessing team.
    OttawaAnkleRulesGradeRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        ottawaAnkleRulesGradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        ruleId:
          type: string
          maxLength: 40
          description: Stable rule identifier (e.g. R-ANKLE-A1-LATERAL-MALLEOLUS-01).
        instrument:
          type: string
          enum:
          - precondition
          - ankle-criterion
          - foot-criterion
          - weight-bearing
          - decision
          description: 'Decision instrument the criterion belongs to: precondition, ankle-criterion, foot-criterion,
            weight-bearing, or decision.'
        region:
          type: string
          enum:
          - ankle
          - foot
          - both
          - ''
          description: 'Imaging region the criterion informs: ankle, foot, or both (unable-to-bear-weight
            feeds both).'
        category:
          type: string
          maxLength: 50
          description: Subject category (e.g. zone-pain, bone-tenderness, weight-bearing).
        description:
          type: string
          maxLength: 500
          description: Human-readable description of why the criterion fired.
      required:
      - createdAt
      - updatedAt
      - ottawaAnkleRulesGradeId
      - ruleId
      - instrument
      - region
      - category
      - description
      description: 'Audit trail of every decision-rule criterion that fired during the Ottawa Ankle Rules
        computation: instrument, imaging region, category, and description.'
    Patient:
      type: object
      properties:
        id:
          type: string
          format: uuid
