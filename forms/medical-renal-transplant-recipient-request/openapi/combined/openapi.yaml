                $ref: '#/components/schemas/Problem'
    delete:
      summary: Delete a Patient
      tags:
      - medical-renal-transplant-recipient-request
      operationId: deletePatient
      responses:
        '200':
          description: Patient deleted
        '404':
          description: Patient not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: This client sent too many requests
          headers:
            retry-after:
              description: Seconds to wait before sending again
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Name.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as full text.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code, such as for validating the postal address.
        role:
          type: string
          enum:
          - nephrologist
          - transplant-surgeon
          - transplant-coordinator
          - dialysis-nurse
          - phlebotomist
          - other
          - ''
          description: 'Clinician role: nephrologist, transplant-surgeon, transplant-coordinator, dialysis-nurse,
            phlebotomist, other.'
        registrationBody:
          type: string
          description: Professional registration body, as free text (varies by jurisdiction).
        registrationNumber:
          type: string
          description: Professional registration number.
      required:
      - createdAt
      - updatedAt
      - name
      - role
      - registrationBody
      - registrationNumber
      description: Clinician who requests the tests (and, where different, collects the samples).
    MedicalRenalTransplantRecipientRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the transplant recipient.
        clinicianId:
          type: string
          format: uuid
          description: Foreign key to the requesting clinician.
        status:
          type: string
          enum:
          - draft
          - submitted
          - received
          - vetted
          - rejected
          - ''
          description: 'Request lifecycle status: draft, submitted, received, vetted, rejected.'
        requestDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the request was made.
        organRequired:
          type: string
          enum:
          - kidney
          - kidney-pancreas
          - pancreas
          - ''
          description: 'Organ required: kidney, kidney-pancreas, pancreas.'
        previousTransplantCount:
          type:
          - integer
          - 'null'
          format: int32
          description: Number of previous transplants; NULL when unknown or not answered.
        previousTransplantDates:
          type: string
          maxLength: 500
          description: Dates of previous transplants.
        transfusionCount:
          type:
          - integer
          - 'null'
          format: int32
          description: Number of previous blood transfusions; NULL when unknown or not answered.
        transfusionDates:
          type: string
          maxLength: 500
          description: Dates of previous transfusions.
        pregnancyCount:
          type:
          - integer
          - 'null'
          format: int32
          description: Number of previous pregnancies; NULL when unknown, not applicable or not answered.
        pregnancyDates:
          type: string
          maxLength: 500
          description: Dates of previous pregnancies.
        autoimmuneDisease:
          type: boolean
          description: Whether the recipient has an autoimmune disease.
        virologyRisk:
          type: boolean
          description: Whether the recipient has a virology risk (for example a blood-borne virus) the
            laboratory should know about.
        immunosuppression:
          type: string
          maxLength: 500
          description: Current immunosuppression, if any.
        clinicalInformation:
          type: string
          maxLength: 1000
          description: Additional clinical information supporting the request.
        recipientAboGroup:
          type: string
          enum:
          - a
          - b
          - ab
          - o
          - unknown
          - ''
          description: 'Recipient ABO blood group, if known: a, b, ab, o, unknown. Not on the source paper
            form; recommended for ABO-incompatibility checks.'
        dialysisMode:
          type: string
          enum:
          - unit-haemodialysis
          - capd
          - home-peritoneal-dialysis
          - pre-dialysis
          - failing-transplant
          - ''
          description: 'Mode of dialysis: unit-haemodialysis, capd, home-peritoneal-dialysis, pre-dialysis,
            failing-transplant.'
        dialysisUnitName:
          type: string
          maxLength: 255
          description: Name of the recipient's dialysis unit (free text so any region can use it).
        urgentTesting:
          type: boolean
          description: Whether the samples require urgent testing.
        urgentTestingReason:
          type: string
          maxLength: 500
          description: Reason urgent testing is needed.
        dfppStatus:
          type: string
          enum:
          - pre-dfpp
          - post-dfpp
          - no-dfpp
          - ''
          description: 'Double-filtration plasmapheresis (DFPP) status for ABO-incompatible transplant
            monitoring: pre-dfpp, post-dfpp, no-dfpp.'
        postTransfusionDatesAndNumber:
          type: string
          maxLength: 500
          description: Date(s) and number of transfusions, for post-transfusion HLA antibody monitoring.
        donorReference:
          type: string
          maxLength: 100
          description: Donor identifier or reference supplied by the requester for donor-specific tests,
            if any.
        requestedBySignedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: When the requester signed the request.
        transplantCentreName:
          type: string
          maxLength: 255
          description: Name of the transplant centre.
        consentAndIdentityConfirmed:
          type: boolean
          description: Requester confirms informed consent was obtained and patient identity verified
            for the requested tests.
        sampleCollectorName:
          type: string
          maxLength: 255
          description: Name of the person who collected the samples.
        sampleCollectedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Date and time the samples were collected.
        identifiersOnSampleCount:
          type:
          - integer
          - 'null'
          format: int32
          description: Number of patient identifiers on the sample labels (minimum 3 required).
        identifiersOnFormCount:
          type:
          - integer
          - 'null'
          format: int32
          description: Number of patient identifiers on the request form (minimum 3 required).
        sampleAndFormDetailsMatch:
          type: boolean
          description: Whether the details on the samples and the form match.
        samplesEdtaPurpleCount:
          type:
          - integer
          - 'null'
          format: int32
          description: Number of purple-top EDTA tubes (addressograph-labelled) sent.
        samplesEdtaPinkHandLabelledCount:
          type:
          - integer
          - 'null'
          format: int32
          description: Number of pink-top EDTA tubes (hand-labelled) sent.
        samplesSerumCount:
          type:
          - integer
          - 'null'
          format: int32
          description: Number of serum tubes (red or gold) sent.
        samplesOtherDescription:
          type: string
          maxLength: 255
          description: Other sample types sent, if any.
        laboratoryDonorIdentifier:
          type: string
          maxLength: 100
          description: 'Laboratory use: donor identifier assigned by the laboratory.'
        laboratoryRecipientIdentifier:
          type: string
          maxLength: 100
          description: 'Laboratory use: recipient identifier assigned by the laboratory.'
        laboratorySampleNumber:
          type: string
          maxLength: 100
          description: 'Laboratory use: sample number.'
        laboratorySampleReceivedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: 'Laboratory use: date and time the sample was received.'
        laboratoryIdentifiersCheckedBy:
          type: string
          maxLength: 255
          description: 'Laboratory use: name of the person who checked the sample identifiers.'
      required:
      - createdAt
      - updatedAt
      - patientId
      - clinicianId
      - status
      - organRequired
      - previousTransplantDates
      - transfusionDates
      - pregnancyDates
      - autoimmuneDisease
      - virologyRisk
      - immunosuppression
      - clinicalInformation
      - recipientAboGroup
      - dialysisMode
      - dialysisUnitName
      - urgentTesting
      - urgentTestingReason
      - dfppStatus
      - postTransfusionDatesAndNumber
      - donorReference
      - transplantCentreName
      - consentAndIdentityConfirmed
      - sampleCollectorName
      - sampleAndFormDetailsMatch
      - samplesOtherDescription
      - laboratoryDonorIdentifier
      - laboratoryRecipientIdentifier
      - laboratorySampleNumber
      - laboratoryIdentifiersCheckedBy
      description: 'Renal transplant recipient request: organ required, sensitisation history, clinical
        information, dialysis, requester and sample-collection details, and laboratory-use fields. Requested
        tests are in the child table.'
    MedicalRenalTransplantRecipientRequestGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        requestId:
          type: string
          format: uuid
          description: Foreign key to the graded request (one grade per request).
        appropriatenessScore:
          type:
          - integer
          - 'null'
          format: int32
          description: Axis A test-selection appropriateness, 1-9 ordinal. No published score exists for
            histocompatibility test selection; anchored on BSHI / EFI guidance and labelled as such.
        appropriatenessBand:
          type: string
          enum:
          - usually-appropriate
          - may-be-appropriate
          - usually-not-appropriate
          - ''
          description: 'Axis A band: usually-appropriate (7-9), may-be-appropriate (4-6), usually-not-appropriate
            (1-3).'
        identitySafetyBand:
          type: string
          enum:
          - ok
          - caution
          - reject-risk
          - ''
          description: 'Axis B identity / sample safety band: ok, caution, reject-risk.'
        completenessPercent:
          type:
          - integer
          - 'null'
          format: int32
          description: Axis C request completeness, 0-100 percent.
        triageTier:
          type: string
          enum:
          - routine
          - urgent
          - emergency
          - stat
          - ''
          description: 'Axis D triage tier: routine, urgent, emergency, stat.'
        targetTimeframe:
          type: string
          maxLength: 50
          description: Target turnaround implied by the triage tier (local policy; see spec).
        requiredSamplesSummary:
          type: string
          maxLength: 500
          description: Sample tubes and volumes the requested tests need, derived from the tests chosen.
        recommendation:
          type: string
          enum:
          - accept
          - query-referrer
          - reject
          - ''
          description: 'Vetting recommendation: accept, query-referrer, reject.'
        clinicianNotes:
          type: string
          maxLength: 1000
          description: Free-text vetting notes.
        signedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Timestamp of the vetting person's electronic signature.
        gradedAt:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the result.
      required:
      - createdAt
      - updatedAt
      - requestId
      - appropriatenessBand
      - identitySafetyBand
      - triageTier
      - targetTimeframe
      - requiredSamplesSummary
      - recommendation
      - clinicianNotes
      - gradedAt
      description: 'Computed result of the four-axis engine for one request: test-selection appropriateness,
        identity / sample safety, completeness and triage priority, plus the derived sample requirements
        and vetting recommendation.'
    MedicalRenalTransplantRecipientRequestGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        gradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        flagId:
          type: string
          maxLength: 50
          description: Stable flag identifier (for example F-DAY-OF-TRANSPLANT-001).
        category:
          type: string
          enum:
          - day-of-transplant-stat
          - virtual-crossmatch-without-antibody-profile
          - sensitised-recipient
          - missing-abo-group
          - abo-incompatible-without-dfpp-status
          - hand-labelled-sample-required
          - identity-mismatch-risk
          - urgent-without-reason
          - missing-sensitisation-history
          - post-transfusion-without-dates
          - other
          - ''
          description: Flag category.
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          - ''
          description: 'Priority: low, medium, high.'
        description:
          type: string
          maxLength: 500
          description: Human-readable description of what fired the flag.
        suggestedAction:
          type: string
          maxLength: 500
          description: Suggested action for the requester or laboratory.
      required:
      - createdAt
      - updatedAt
      - gradeId
      - flagId
      - category
      - priority
      - description
      - suggestedAction
      description: Safety-critical flags that fire independently of the four axes, with priority and a
        suggested action for the laboratory and requester.
    MedicalRenalTransplantRecipientRequestGradeRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        gradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        ruleId:
          type: string
          maxLength: 40
          description: Stable rule identifier (for example R-ID-3PT-01).
        axis:
          type: string
          enum:
          - appropriateness
          - identity
          - completeness
          - triage
          - ''
          description: 'Scoring axis the rule belongs to: appropriateness, identity, completeness, triage.'
        category:
          type: string
          maxLength: 50
          description: Category the rule relates to.
        description:
          type: string
          maxLength: 500
          description: Human-readable description of why the rule fired.
      required:
      - createdAt
      - updatedAt
      - gradeId
      - ruleId
      - axis
      - category
      - description
      description: Audit trail of every appropriateness / identity / completeness / triage rule that fired
        for this request.
    MedicalRenalTransplantRecipientRequestTest:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        requestId:
          type: string
          format: uuid
          description: Foreign key to the parent request.
        testCode:
          type: string
          enum:
          - list-registration-first-typing-and-retyping
          - list-registration-returning-to-list
          - list-registration-other
          - deceased-donor-full-crossmatch
          - deceased-donor-day-of-transplant
          - living-donor-full-crossmatch
          - living-donor-day-of-transplant
          - living-donor-virtual-crossmatch
          - living-donor-match-grade
          - living-donor-abo-titres-only
          - autologous-crossmatch
          - hla-antibody-monitoring-routine-transplant-list
          - hla-antibody-monitoring-routine-post-transplant
          - hla-antibody-monitoring-post-transfusion
          - hla-rejection-investigation
          - abo-incompatible-transplant-monitoring
          - red-cell-antibody-follow-up
          description: Requested test code, one of the 17 tests offered in section 7 of the request.
        testDetail:
          type: string
          maxLength: 255
          description: Free-text detail, for example the specific test when "other" is chosen (e.g. ABO
            only).
      required:
      - createdAt
      - updatedAt
      - requestId
      - testCode
      - testDetail
      description: One requested test of a transplant recipient request, such as typing, crossmatch, HLA
        antibody monitoring or rejection investigation.
    Patient:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        familyName:
          type: string
          maxLength: 255
          description: Family name (surname).
        givenNames:
          type: string
          maxLength: 255
          description: Given names (forenames).
        previousName:
          type: string
          maxLength: 255
          description: Previous name, if any; aids identity matching against historical samples and records.
        birthDate:
          type: string
          format: date
          description: Birth date.
        sex:
          type: string
          enum:
          - female
          - male
          - other
          - unknown
          - ''
          description: 'Sex recorded for the patient: female, male, other, unknown.'
        ethnicity:
          type: string
          maxLength: 100
          description: Self-described ethnicity; relevant to HLA allele-frequency interpretation.
        nationalHealthIdentifier:
          type: string
          maxLength: 40
          description: National health identifier issued by the patient's health system (for example a
            national insurance or health-card number), as free text.
        medicalRecordNumber:
          type: string
          maxLength: 40
          description: Hospital or institution medical record number (hospital number).
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as full text.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code, such as for validating the postal address.
      required:
      - createdAt
      - updatedAt
      - familyName
      - givenNames
      - previousName
      - birthDate
      - sex
      - ethnicity
      - nationalHealthIdentifier
      - medicalRecordNumber
      description: Transplant recipient (patient).
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          description: A URI identifying the problem type
        title:
          type: string
          description: A short summary of the problem type
        status:
          type: integer
          description: The HTTP status code
        detail:
          type: string
          description: An explanation of this occurrence
        instance:
          type: string
          description: A URI identifying this occurrence
        code:
          type: string
          description: A short machine-readable reason
        errors:
          type: object
          description: Per-field detail, when validation failed
      required:
      - type
      - title
      - status
