components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Clinician full name.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as a single text block.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code.
        role:
          type: string
          enum:
          - doctor
          - nurse
          - paramedic
          - other
          - ''
          description: 'Primary clinical role: doctor, nurse, paramedic, or other.'
        registrationBody:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - GPhC
          - other
          - ''
          description: 'Professional registration body: GMC, NMC, HCPC, GPhC, or other.'
        registrationNumber:
          type: string
          description: Professional registration number issued by the registration body.
      required:
      - createdAt
      - updatedAt
      - name
      - role
      - registrationBody
      - registrationNumber
      description: Clinician identifying information for the assessing clinician.
    Patient:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          maxLength: 255
          description: Full patient name.
        birthDate:
          type: string
          format: date
          description: Date of birth.
        sex:
          type: string
          enum:
          - female
          - male
          - intersex
          - unknown
          - ''
          description: 'Sex recorded for clinical purposes: female, male, intersex, or unknown.'
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as a single text block.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code.
        unitedKingdomNhsNumber:
          type:
          - string
          - 'null'
          maxLength: 20
          description: United Kingdom NHS number, unique per person.
        hospitalMrn:
          type:
          - string
          - 'null'
          maxLength: 50
          description: Local hospital medical record number (MRN).
        heightAsCm:
          type:
          - number
          - 'null'
          format: double
          description: Height in centimetres.
        weightAsKg:
          type:
          - number
          - 'null'
          format: double
          description: Weight in kilograms.
        bodyMassIndex:
          type:
          - number
          - 'null'
          format: double
          description: Body mass index (BMI), kg/m^2.
        allergiesSummary:
          type: string
          description: Free-text summary of known allergies.
      required:
      - createdAt
      - updatedAt
      - name
      - birthDate
      - sex
      - allergiesSummary
      description: Patient demographic information used by the ROSIER stroke-recognition record.
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          description: A URI identifying the problem type
        title:
          type: string
          description: A short summary of the problem type
        status:
          type: integer
          description: The HTTP status code
        detail:
          type: string
          description: An explanation of this occurrence
        instance:
          type: string
          description: A URI identifying this occurrence
        code:
          type: string
          description: A short machine-readable reason
        errors:
          type: object
          description: Per-field detail, when validation failed
      required:
      - type
      - title
      - status
    RecognitionOfStrokeInTheEmergencyRoom:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the patient being assessed (delete restricted).
        clinicianId:
          type:
          - string
          - 'null'
          format: uuid
          description: Foreign key to the assessing clinician (optional; delete restricted).
        clinicianName:
          type: string
          maxLength: 255
          description: Name of the assessing clinician as recorded on the assessment.
        clinicianRole:
          type: string
          enum:
          - doctor
          - nurse
          - paramedic
          - other
          - ''
          description: 'Role of the assessing clinician: doctor, nurse, paramedic, or other.'
        assessedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Date and time the assessment was performed.
        careSetting:
          type: string
          enum:
          - emergency-department
          - acute-medical
          - other
          - ''
          description: 'Care setting: emergency-department, acute-medical, or other.'
        symptomOnsetAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Reported date and time of symptom onset.
        patientIdentifier:
          type: string
          maxLength: 100
          description: Local patient identifier as recorded on the assessment.
        ageBand:
          type: string
          enum:
          - 16-39
          - 40-59
          - 60-74
          - 75-plus
          - ''
          description: 'Adult age band: 16-39, 40-59, 60-74, or 75-plus.'
        sex:
          type: string
          enum:
          - female
          - male
          - intersex
          - unknown
          - ''
          description: 'Patient sex recorded for the assessment: female, male, intersex, or unknown.'
        bloodGlucose:
          type:
          - number
          - 'null'
          format: double
          description: Precondition — blood glucose in mmol/L measured before scoring; a value < 3.5 flags
            the hypoglycaemia mimic.
        hypoglycaemiaCorrected:
          type: string
          enum:
          - 'yes'
          - 'no'
          - na
          - ''
          description: 'Whether hypoglycaemia was corrected before applying the score: yes, no, or na
            (not applicable).'
        lossOfConsciousness:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Criterion 1 — loss of consciousness or syncope (mimic); yes scores -1.
        seizureActivity:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Criterion 2 — seizure activity (mimic); yes scores -1.
        facialWeakness:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Criterion 3 — asymmetric facial weakness (sign); yes scores +1.
        armWeakness:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Criterion 4 — asymmetric arm weakness (sign); yes scores +1.
        legWeakness:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Criterion 5 — asymmetric leg weakness (sign); yes scores +1.
        speechDisturbance:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Criterion 6 — speech disturbance (sign); yes scores +1.
        visualFieldDefect:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Criterion 7 — visual field defect (sign); yes scores +1.
        clinicalNote:
          type: string
          description: Free-text clinical note recorded with the assessment.
      required:
      - createdAt
      - updatedAt
      - patientId
      - clinicianName
      - clinicianRole
      - careSetting
      - patientIdentifier
      - ageBand
      - sex
      - hypoglycaemiaCorrected
      - lossOfConsciousness
      - seizureActivity
      - facialWeakness
      - armWeakness
      - legWeakness
      - speechDisturbance
      - visualFieldDefect
      - clinicalNote
      description: 'Main ROSIER assessment record: assessment context, patient identification, the blood-glucose
        precondition, the two mimic-exclusion criteria, and the five acute-onset neurological signs.'
    RecognitionOfStrokeInTheEmergencyRoomGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
