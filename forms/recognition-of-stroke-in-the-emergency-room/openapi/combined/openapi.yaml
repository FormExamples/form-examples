        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        patient_id:
          type: string
          format: uuid
          description: Foreign key to the patient being assessed (delete restricted).
        clinician_id:
          type: string
          format: uuid
          description: Foreign key to the assessing clinician (optional; delete restricted).
        clinician_name:
          type: string
          maxLength: 255
          description: Name of the assessing clinician as recorded on the assessment.
        clinician_role:
          type: string
          enum:
          - doctor
          - nurse
          - paramedic
          - other
          - ''
          description: 'Role of the assessing clinician: doctor, nurse, paramedic, or other.'
        assessed_at:
          type: string
          format: date-time
          description: Date and time the assessment was performed.
        care_setting:
          type: string
          enum:
          - emergency-department
          - acute-medical
          - other
          - ''
          description: 'Care setting: emergency-department, acute-medical, or other.'
        symptom_onset_at:
          type: string
          format: date-time
          description: Reported date and time of symptom onset.
        patient_identifier:
          type: string
          maxLength: 100
          description: Local patient identifier as recorded on the assessment.
        age_band:
          type: string
          enum:
          - 16-39
          - 40-59
          - 60-74
          - 75-plus
          - ''
          description: 'Adult age band: 16-39, 40-59, 60-74, or 75-plus.'
        sex:
          type: string
          enum:
          - female
          - male
          - intersex
          - unknown
          - ''
          description: 'Patient sex recorded for the assessment: female, male, intersex, or unknown.'
        blood_glucose:
          type: number
          format: double
          description: Precondition — blood glucose in mmol/L measured before scoring; a value < 3.5 flags
            the hypoglycaemia mimic.
        hypoglycaemia_corrected:
          type: string
          enum:
          - 'yes'
          - 'no'
          - na
          - ''
          description: 'Whether hypoglycaemia was corrected before applying the score: yes, no, or na
            (not applicable).'
        loss_of_consciousness:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Criterion 1 — loss of consciousness or syncope (mimic); yes scores -1.
        seizure_activity:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Criterion 2 — seizure activity (mimic); yes scores -1.
        facial_weakness:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Criterion 3 — asymmetric facial weakness (sign); yes scores +1.
        arm_weakness:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Criterion 4 — asymmetric arm weakness (sign); yes scores +1.
        leg_weakness:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Criterion 5 — asymmetric leg weakness (sign); yes scores +1.
        speech_disturbance:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Criterion 6 — speech disturbance (sign); yes scores +1.
        visual_field_defect:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Criterion 7 — visual field defect (sign); yes scores +1.
        clinical_note:
          type: string
          description: Free-text clinical note recorded with the assessment.
      required:
      - created_at
      - updated_at
      - patient_id
      - clinician_name
      - clinician_role
      - care_setting
      - patient_identifier
      - age_band
      - sex
      - hypoglycaemia_corrected
      - loss_of_consciousness
      - seizure_activity
      - facial_weakness
      - arm_weakness
      - leg_weakness
      - speech_disturbance
      - visual_field_defect
      - clinical_note
      description: 'Main ROSIER assessment record: assessment context, patient identification, the blood-glucose
        precondition, the two mimic-exclusion criteria, and the five acute-onset neurological signs.'
    RecognitionOfStrokeInTheEmergencyRoomGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the row was soft-deleted.
        recognition_of_stroke_in_the_emergency_room_id:
          type: string
          format: uuid
          description: Foreign key to the parent assessment (unique, 1:1).
        rosier_score:
          type: integer
          format: int32
          description: 'Signed ROSIER total: sum of the mimic (-1) and sign (+1) criteria, range -2..+5.'
        stroke_likely:
          type: string
          enum:
          - stroke-unlikely
          - stroke-likely
          - ''
          description: 'Derived band: stroke-likely when rosier_score > 0 (strict), otherwise stroke-unlikely.'
        glucose_excluded:
          type: string
          enum:
          - 'yes'
