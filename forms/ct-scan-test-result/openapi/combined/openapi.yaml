components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        name:
          type: string
          description: Name.
        email:
          type: string
          description: Email address.
        phone:
          type: string
          description: Phone number.
        postal_address_as_full_text:
          type: string
          description: Postal address as full text.
        country_as_iso_3166_1_alpha_2:
          type: string
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type: string
          description: Postal code, such as for validating the postal address.
        role:
          type: string
          enum:
          - radiologist
          - reporting-radiographer
          - consultant
          - registrar
          - reporting-clinician
          - other
          - ''
          description: 'Reporting clinician role: radiologist, reporting-radiographer, consultant, registrar,
            reporting-clinician, other.'
        registration_body:
          type: string
          enum:
          - GMC
          - HCPC
          - other
          - ''
          description: 'Clinician registration body: GMC, HCPC, other.'
        registration_number:
          type: string
          description: Clinician registration number.
        united_kingdom_nhs_number:
          type: string
          maxLength: 12
          description: United Kingdom NHS number, unique per person.
      required:
      - created_at
      - updated_at
      - name
      - role
      - registration_body
      - registration_number
      description: Reporting clinician (radiologist or reporting radiographer) who authors and signs the
        CT scan result report.
    CtScanTestResult:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        patient_id:
          type: string
          format: uuid
          description: Foreign key to the patient.
        clinician_id:
          type: string
          format: uuid
          description: Foreign key to the reporting clinician (radiologist / reporting radiographer).
        originating_request_reference:
          type: string
          maxLength: 255
          description: Free-text reference linking this report back to the originating CT scan request
            (referral).
        report_status:
          type: string
          enum:
          - preliminary
          - final
          - amended
          - cancelled
          - ''
          description: 'Report lifecycle status: preliminary, final, amended, cancelled.'
        performed_date:
          type: string
          format: date
          description: Date the CT examination was performed.
        reported_date:
          type: string
          format: date
          description: Date the report was authored / signed.
        body_region:
          type: string
          enum:
          - head
          - neck
          - chest
          - abdomen
          - pelvis
          - abdomen-pelvis
          - spine
          - ct-angiogram
          - ct-colonography
          - whole-body
          - extremity
          - other
          - ''
          description: 'Examined CT body region: head, neck, chest, abdomen, pelvis, abdomen-pelvis, spine,
            ct-angiogram, ct-colonography, whole-body, extremity, other.'
        contrast_used:
          type: string
          enum:
          - none
          - iv-iodinated
          - oral
          - both
          - ''
          description: 'Contrast actually administered: none, iv-iodinated, oral, both.'
        technique:
          type: string
          maxLength: 1000
          description: 'Technique narrative: phases, scan parameters, reconstructions, and any protocol
            deviations.'
        examination_adequacy:
          type: string
          enum:
          - adequate
          - limited
          - non-diagnostic
          - ''
          description: 'Diagnostic adequacy of the examination: adequate, limited, non-diagnostic.'
        clinical_history:
          type: string
          maxLength: 1000
          description: Clinical history and the question the examination was performed to answer.
        comparison_with_previous:
          type: string
          maxLength: 1000
          description: Comparison with relevant previous imaging studies.
        findings_narrative:
          type: string
          maxLength: 2000
          description: Narrative description of the imaging findings (the body of the report).
        acute_finding:
          type: boolean
          description: Whether an acute finding requiring timely action is present.
        mass_or_lesion:
          type: boolean
          description: Whether a mass or focal lesion is present.
        haemorrhage:
          type: boolean
          description: Whether haemorrhage is present.
        infarct:
          type: boolean
          description: Whether infarction (e.g. ischaemic stroke, bowel ischaemia) is present.
        fracture:
          type: boolean
          description: Whether a fracture is present.
        infection_inflammation:
          type: boolean
          description: Whether infection or inflammation (e.g. abscess, collection) is present.
        obstruction:
          type: boolean
          description: Whether an obstruction (e.g. bowel, urinary tract) is present.
        incidental_finding:
          type: boolean
          description: Whether one or more incidental findings warranting documentation are present.
        largest_lesion_size_mm:
          type: number
          format: double
          description: Largest lesion long-axis size in millimetres, for surveillance and categorisation.
        radiation_dose_dlp:
          type: number
          format: double
          description: Dose-length product (DLP) in mGy.cm for the examination, for dose audit.
        impression:
          type: string
          maxLength: 2000
          description: Summary impression / conclusion answering the clinical question.
        recommended_follow_up:
          type: string
          maxLength: 1000
          description: Recommended follow-up imaging, referral, or management.
        critical_result_communicated:
          type: boolean
          description: Whether a critical or unexpected significant result was communicated directly to
            the referrer.
        reported_to:
          type: string
          maxLength: 500
          description: Who the critical / urgent result was communicated to, with date and time if applicable.
      required:
      - created_at
      - updated_at
      - patient_id
      - clinician_id
      - originating_request_reference
      - report_status
      - body_region
      - contrast_used
      - technique
      - examination_adequacy
      - clinical_history
      - comparison_with_previous
      - findings_narrative
      - acute_finding
      - mass_or_lesion
      - haemorrhage
      - infarct
      - fracture
      - infection_inflammation
      - obstruction
      - incidental_finding
      - impression
      - recommended_follow_up
      - critical_result_communicated
      - reported_to
      description: CT (computed tomography) scan result (report). Captures the performed examination,
        contrast and technique, clinical history, the narrative and structured findings, key measurements
        and radiation dose (DLP), the impression, recommended follow-up, and critical-result communication.
        This is the source-of-truth record that the four-axis interpretation grade is computed from.
    CtScanTestResultGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        ct_scan_test_result_id:
          type: string
          format: uuid
          description: Foreign key to the parent result (unique, 1:1).
        result_classification:
          type: string
          enum:
          - normal
          - abnormal
          - critical
          - inconclusive
          - ''
          description: 'Axis A overall classification: normal, abnormal, critical, inconclusive.'
        abnormality_severity:
          type: string
          enum:
          - none
          - minor
          - moderate
          - major
          - ''
          description: 'Axis B abnormality severity: none, minor, moderate, major.'
        reporting_category:
          type: string
          maxLength: 50
          description: Axis B structured-reporting score / category label (e.g. an ACR Lung-RADS or incidental-findings
            category).
        report_completeness_percent:
          type: integer
          format: int32
          description: Axis C report completeness as a percentage of mandatory report sections (0-100).
        follow_up_urgency:
          type: string
          enum:
          - routine
          - recommended
          - urgent
          - critical-alert
          - ''
          description: 'Axis D follow-up urgency: routine, recommended, urgent, critical-alert.'
        target_timeframe:
          type: string
          maxLength: 50
          description: Target timeframe for the recommended follow-up implied by the urgency.
        recommended_action:
          type: string
          maxLength: 500
          description: Axis D concise recommended action derived from the urgency.
        recommendation:
          type: string
          enum:
          - no-action
          - routine-follow-up
          - further-imaging
          - specialist-referral
          - urgent-review
          - ''
          description: 'Overall recommendation: no-action, routine-follow-up, further-imaging, specialist-referral,
            urgent-review.'
        clinician_notes:
          type: string
          description: Free-text interpretation / sign-off notes.
        signed_at:
          type: string
          format: date-time
          description: Timestamp of the reporting clinician electronic signature.
        graded_at:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the result.
      required:
      - created_at
      - updated_at
      - ct_scan_test_result_id
      - result_classification
      - abnormality_severity
      - reporting_category
      - follow_up_urgency
      - target_timeframe
      - recommended_action
      - recommendation
      - clinician_notes
      - graded_at
      description: 'Computed four-axis interpretation grade: result classification, abnormality severity
        / structured-reporting category, report completeness, and follow-up urgency. A critical result
        auto-escalates the follow-up urgency to critical-alert regardless of the other axes.'
    CtScanTestResultGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        ct_scan_test_result_grade_id:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        flag_id:
          type: string
          maxLength: 50
          description: Stable flag identifier (e.g. F-CRITICAL-RESULT-001).
        category:
          type: string
          enum:
          - critical-result-alert
          - incidental-finding
          - discrepancy-with-request
          - abnormal-requiring-action
          - urgent-referral
          - inadequate-technique
          - unexpected-finding
          - missing-impression
          - missing-measurement
          - other
          - ''
          description: Flag category.
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          - ''
          description: 'Priority: low, medium, high.'
        description:
          type: string
          maxLength: 500
          description: Human-readable description of what fired the flag.
        suggested_action:
          type: string
          maxLength: 500
