components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Name.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as full text.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code, such as for validating the postal address.
        role:
          type: string
          enum:
          - radiologist
          - reporting-radiographer
          - consultant
          - registrar
          - reporting-clinician
          - other
          - ''
          description: 'Reporting clinician role: radiologist, reporting-radiographer, consultant, registrar,
            reporting-clinician, other.'
        registrationBody:
          type: string
          enum:
          - GMC
          - HCPC
          - other
          - ''
          description: 'Clinician registration body: GMC, HCPC, other.'
        registrationNumber:
          type: string
          description: Clinician registration number.
        unitedKingdomNhsNumber:
          type:
          - string
          - 'null'
          maxLength: 12
          description: United Kingdom NHS number, unique per person.
      required:
      - createdAt
      - updatedAt
      - name
      - role
      - registrationBody
      - registrationNumber
      description: Reporting clinician (radiologist or reporting radiographer) who authors and signs the
        CT scan result report.
    CtScanTestResult:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the patient.
        clinicianId:
          type: string
          format: uuid
          description: Foreign key to the reporting clinician (radiologist / reporting radiographer).
        originatingRequestReference:
          type: string
          maxLength: 255
          description: Free-text reference linking this report back to the originating CT scan request
            (referral).
        reportStatus:
          type: string
          enum:
          - preliminary
          - final
          - amended
          - cancelled
          - ''
          description: 'Report lifecycle status: preliminary, final, amended, cancelled.'
        performedDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the CT examination was performed.
        reportedDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the report was authored / signed.
        bodyRegion:
          type: string
          enum:
          - head
          - neck
          - chest
          - abdomen
          - pelvis
          - abdomen-pelvis
          - spine
          - ct-angiogram
          - ct-colonography
          - whole-body
          - extremity
          - other
          - ''
          description: 'Examined CT body region: head, neck, chest, abdomen, pelvis, abdomen-pelvis, spine,
            ct-angiogram, ct-colonography, whole-body, extremity, other.'
        contrastUsed:
          type: string
          enum:
          - none
          - iv-iodinated
          - oral
          - both
          - ''
          description: 'Contrast actually administered: none, iv-iodinated, oral, both.'
        technique:
          type: string
          maxLength: 1000
          description: 'Technique narrative: phases, scan parameters, reconstructions, and any protocol
            deviations.'
        examinationAdequacy:
          type: string
          enum:
          - adequate
          - limited
          - non-diagnostic
          - ''
          description: 'Diagnostic adequacy of the examination: adequate, limited, non-diagnostic.'
        clinicalHistory:
          type: string
          maxLength: 1000
          description: Clinical history and the question the examination was performed to answer.
        comparisonWithPrevious:
          type: string
          maxLength: 1000
          description: Comparison with relevant previous imaging studies.
        findingsNarrative:
          type: string
          maxLength: 2000
          description: Narrative description of the imaging findings (the body of the report).
        acuteFinding:
          type: boolean
          description: Whether an acute finding requiring timely action is present.
        massOrLesion:
          type: boolean
          description: Whether a mass or focal lesion is present.
        haemorrhage:
          type: boolean
          description: Whether haemorrhage is present.
        infarct:
          type: boolean
          description: Whether infarction (e.g. ischaemic stroke, bowel ischaemia) is present.
        fracture:
          type: boolean
          description: Whether a fracture is present.
        infectionInflammation:
          type: boolean
          description: Whether infection or inflammation (e.g. abscess, collection) is present.
        obstruction:
          type: boolean
          description: Whether an obstruction (e.g. bowel, urinary tract) is present.
        incidentalFinding:
          type: boolean
          description: Whether one or more incidental findings warranting documentation are present.
        largestLesionSizeMm:
          type:
          - number
          - 'null'
          format: double
          description: Largest lesion long-axis size in millimetres, for surveillance and categorisation.
        radiationDoseDlp:
          type:
          - number
          - 'null'
          format: double
          description: Dose-length product (DLP) in mGy.cm for the examination, for dose audit.
        impression:
          type: string
          maxLength: 2000
          description: Summary impression / conclusion answering the clinical question.
        recommendedFollowUp:
          type: string
          maxLength: 1000
          description: Recommended follow-up imaging, referral, or management.
        criticalResultCommunicated:
          type: boolean
          description: Whether a critical or unexpected significant result was communicated directly to
            the referrer.
        reportedTo:
          type: string
          maxLength: 500
          description: Who the critical / urgent result was communicated to, with date and time if applicable.
      required:
      - createdAt
      - updatedAt
      - patientId
      - clinicianId
      - originatingRequestReference
      - reportStatus
      - bodyRegion
      - contrastUsed
      - technique
      - examinationAdequacy
      - clinicalHistory
      - comparisonWithPrevious
      - findingsNarrative
      - acuteFinding
      - massOrLesion
      - haemorrhage
      - infarct
      - fracture
      - infectionInflammation
      - obstruction
      - incidentalFinding
      - impression
      - recommendedFollowUp
      - criticalResultCommunicated
      - reportedTo
      description: CT (computed tomography) scan result (report). Captures the performed examination,
        contrast and technique, clinical history, the narrative and structured findings, key measurements
        and radiation dose (DLP), the impression, recommended follow-up, and critical-result communication.
        This is the source-of-truth record that the four-axis interpretation grade is computed from.
    CtScanTestResultGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        ctScanTestResultId:
          type: string
          format: uuid
          description: Foreign key to the parent result (unique, 1:1).
        resultClassification:
          type: string
          enum:
          - normal
          - abnormal
          - critical
          - inconclusive
          - ''
          description: 'Axis A overall classification: normal, abnormal, critical, inconclusive.'
        abnormalitySeverity:
          type: string
          enum:
          - none
          - minor
          - moderate
          - major
          - ''
          description: 'Axis B abnormality severity: none, minor, moderate, major.'
        reportingCategory:
          type: string
          maxLength: 50
          description: Axis B structured-reporting score / category label (e.g. an ACR Lung-RADS or incidental-findings
            category).
        reportCompletenessPercent:
          type:
          - integer
          - 'null'
          format: int32
          description: Axis C report completeness as a percentage of mandatory report sections (0-100).
        followUpUrgency:
          type: string
          enum:
          - routine
          - recommended
          - urgent
          - critical-alert
          - ''
          description: 'Axis D follow-up urgency: routine, recommended, urgent, critical-alert.'
        targetTimeframe:
          type: string
          maxLength: 50
          description: Target timeframe for the recommended follow-up implied by the urgency.
        recommendedAction:
          type: string
          maxLength: 500
          description: Axis D concise recommended action derived from the urgency.
        recommendation:
          type: string
          enum:
          - no-action
          - routine-follow-up
          - further-imaging
          - specialist-referral
          - urgent-review
          - ''
          description: 'Overall recommendation: no-action, routine-follow-up, further-imaging, specialist-referral,
            urgent-review.'
        clinicianNotes:
          type: string
          description: Free-text interpretation / sign-off notes.
        signedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Timestamp of the reporting clinician electronic signature.
        gradedAt:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the result.
      required:
      - createdAt
      - updatedAt
      - ctScanTestResultId
      - resultClassification
      - abnormalitySeverity
      - reportingCategory
      - followUpUrgency
      - targetTimeframe
      - recommendedAction
      - recommendation
      - clinicianNotes
      - gradedAt
      description: 'Computed four-axis interpretation grade: result classification, abnormality severity
        / structured-reporting category, report completeness, and follow-up urgency. A critical result
        auto-escalates the follow-up urgency to critical-alert regardless of the other axes.'
    CtScanTestResultGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        ctScanTestResultGradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        flagId:
          type: string
          maxLength: 50
          description: Stable flag identifier (e.g. F-CRITICAL-RESULT-001).
        category:
          type: string
          enum:
          - critical-result-alert
          - incidental-finding
          - discrepancy-with-request
          - abnormal-requiring-action
          - urgent-referral
          - inadequate-technique
          - unexpected-finding
          - missing-impression
          - missing-measurement
          - other
          - ''
          description: Flag category.
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          - ''
          description: 'Priority: low, medium, high.'
        description:
          type: string
          maxLength: 500
          description: Human-readable description of what fired the flag.
        suggestedAction:
          type: string
          maxLength: 500
          description: Suggested clinical action (e.g. "communicate critical result to referrer and document").
      required:
      - createdAt
      - updatedAt
      - ctScanTestResultGradeId
      - flagId
      - category
      - priority
      - description
      - suggestedAction
      description: Safety-critical flags that fire independently of the four axes, with priority and a
        suggested action for the reporting / referring team.
    CtScanTestResultGradeRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        ctScanTestResultGradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        ruleId:
          type: string
          maxLength: 40
          description: Stable rule identifier (e.g. R-CLASS-CRITICAL-01).
        axis:
          type: string
          enum:
          - classification
          - severity
          - completeness
          - follow-up
          - ''
          description: 'Scoring axis the rule belongs to: classification, severity, completeness, follow-up.'
        category:
          type: string
          maxLength: 50
          description: Category or finding the rule relates to.
        description:
          type: string
          maxLength: 500
          description: Human-readable description of why the rule fired.
      required:
      - createdAt
      - updatedAt
      - ctScanTestResultGradeId
      - ruleId
      - axis
      - category
      - description
      description: Audit trail of every classification / severity / completeness / follow-up rule that
        fired for this result.
