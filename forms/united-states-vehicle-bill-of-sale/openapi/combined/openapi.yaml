components:
  schemas:
    Buyer:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Full printed name of the buyer as it appears on the certificate of title.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Telephone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Full postal address as free text.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as an ISO 3166-1 alpha-2 code.
        postcode:
          type:
          - string
          - 'null'
          description: ZIP or ZIP+4 code.
        partyType:
          type: string
          enum:
          - individual
          - business
          - ''
          description: Whether the party is an individual or a business.
      required:
      - createdAt
      - updatedAt
      - name
      - partyType
      description: 'Buyer (transferee) contact record for a United States vehicle bill of sale: name,
        contact details, ZIP code, and whether an individual or a business.'
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          description: A URI identifying the problem type
        title:
          type: string
          description: A short summary of the problem type
        status:
          type: integer
          description: The HTTP status code
        detail:
          type: string
          description: An explanation of this occurrence
        instance:
          type: string
          description: A URI identifying this occurrence
        code:
          type: string
          description: A short machine-readable reason
        errors:
          type: object
          description: Per-field detail, when validation failed
      required:
      - type
      - title
      - status
    Seller:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Full printed name of the seller as it appears on the certificate of title.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Telephone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Full postal address as free text.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as an ISO 3166-1 alpha-2 code.
        postcode:
          type:
          - string
          - 'null'
          description: ZIP or ZIP+4 code.
        partyType:
          type: string
          enum:
          - individual
          - business
          - ''
          description: Whether the party is an individual or a business.
      required:
      - createdAt
      - updatedAt
      - name
      - partyType
      description: 'Seller (transferor) contact record for a United States vehicle bill of sale: name,
        contact details, ZIP code, and whether an individual or a business.'
    UnitedStatesVehicleBillOfSale:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        sellerId:
          type: string
          format: uuid
          description: Foreign key to the seller (restrict delete).
        buyerId:
          type:
          - string
          - 'null'
          format: uuid
          description: Foreign key to the buyer (restrict delete); optional until the buyer is known.
        state:
          type: string
          maxLength: 2
          description: Two-letter USPS code of the state whose rules govern the sale (the state that will
            title and register the vehicle); empty when unanswered.
        saleDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the vehicle changed hands (date of sale and of odometer transfer).
        salePriceAsUsd:
          type:
          - number
          - 'null'
          format: double
          description: Purchase price in US dollars; 0 for a gift; null when unanswered.
        paymentMethod:
          type: string
          enum:
          - cash
          - check
          - wire
          - financing
          - trade
          - gift
          - ''
          description: 'How the price was paid: cash, check, wire, financing, trade, or gift.'
        taxBasis:
          type: string
          enum:
          - purchase-price
          - standard-presumptive-value
          - fair-market-value
          - exempt-gift
          - exempt-family
          - ''
          description: 'Basis on which the buyer will pay sales or use tax: purchase price, state standard
            presumptive value, fair market value, or a claimed gift or family exemption.'
        sellerName:
          type: string
          description: Seller printed name as it appears on the title.
        sellerType:
          type: string
          enum:
          - individual
          - business
          - ''
          description: Whether the seller is an individual or a business.
        sellerStreetAddress:
          type: string
          description: Seller current street address (required by 49 CFR 580.5 for the odometer disclosure).
        sellerCity:
          type: string
          description: Seller city.
        sellerState:
          type: string
          maxLength: 2
          description: Seller two-letter state code.
        sellerPostalCode:
          type: string
          maxLength: 10
          description: Seller ZIP or ZIP+4 code.
        sellerPhone:
          type: string
          maxLength: 30
          description: Seller telephone number.
        sellerSigned:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the seller signed the bill of sale.
        buyerName:
          type: string
          description: Buyer printed name.
        buyerType:
          type: string
          enum:
          - individual
          - business
          - ''
          description: Whether the buyer is an individual or a business.
        buyerStreetAddress:
          type: string
          description: Buyer current street address (required by 49 CFR 580.5 for the odometer disclosure).
        buyerCity:
          type: string
          description: Buyer city.
        buyerState:
          type: string
          maxLength: 2
          description: Buyer two-letter state code.
        buyerPostalCode:
          type: string
          maxLength: 10
          description: Buyer ZIP or ZIP+4 code.
        buyerPhone:
          type: string
          maxLength: 30
          description: Buyer telephone number.
        buyerSigned:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the buyer signed the bill of sale.
        vehicleYear:
          type:
          - integer
          - 'null'
          format: int32
          description: Model year of the vehicle.
        vehicleMake:
          type: string
          maxLength: 60
          description: Vehicle make.
        vehicleModel:
          type: string
          maxLength: 60
          description: Vehicle model.
        bodyType:
          type: string
          maxLength: 40
          description: Vehicle body type (required by 49 CFR 580.5).
        vin:
          type: string
          maxLength: 25
          description: Vehicle Identification Number; 17 characters for a 1981 or newer vehicle.
        vehicleColor:
          type: string
          maxLength: 40
          description: Vehicle color.
        titleNumber:
          type: string
          maxLength: 40
          description: Certificate of title number.
        titleBrand:
          type: string
          enum:
          - clean
          - salvage
          - rebuilt
          - flood
          - lemon
          - junk
          - unknown
          - ''
          description: 'Brand on the title: clean, salvage, rebuilt, flood, lemon-law buyback, junk, or
            unknown.'
        gvwrOver16000:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the gross vehicle weight rating exceeds 16,000 pounds (exempt from the
            federal odometer rule).
        selfPropelled:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the vehicle is self-propelled (a trailer is not, and is exempt from the
            federal odometer rule).
        odometerReadingMiles:
          type:
          - integer
          - 'null'
          format: int32
          description: Odometer reading in whole miles at transfer, without tenths; null when unanswered.
        odometerStatus:
          type: string
          enum:
          - actual
          - exceeds-mechanical-limits
          - not-actual
          - ''
          description: 'Seller certification under 49 CFR 580.5: actual mileage, mileage exceeds the odometer
            mechanical limits, or the reading is not the actual mileage (warning odometer discrepancy).'
        odometerSellerCertified:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the seller signed the odometer disclosure statement.
        odometerBuyerAcknowledged:
          type: string
          enum:
          - 'yes'
          - 'no'
