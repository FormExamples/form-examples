components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Clinician full name as recorded in the rota.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as a single text block.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code.
        role:
          type: string
          enum:
          - gp
          - practice-nurse
          - pharmacist
          - other
          - ''
          description: 'Primary clinical role of the reviewer: gp, practice-nurse, pharmacist, or other.'
        registrationBody:
          type: string
          enum:
          - GMC
          - NMC
          - GPhC
          - other
          - ''
          description: 'Professional registration body: GMC, NMC, GPhC, or other.'
        registrationNumber:
          type: string
          description: Professional registration number issued by the registration body.
      required:
      - createdAt
      - updatedAt
      - name
      - role
      - registrationBody
      - registrationNumber
      description: Clinician identifying information for the clinician who conducted the hypertension
        annual review.
    HypertensionReview:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the patient this review documents (restrict delete).
        clinicianId:
          type:
          - string
          - 'null'
          format: uuid
          description: Foreign key to the reviewing clinician (restrict delete); optional.
        clinicianRole:
          type: string
          enum:
          - gp
          - practice-nurse
          - pharmacist
          - other
          - ''
          description: 'Reviewing clinician role: gp, practice-nurse, pharmacist, or other.'
        reviewedAt:
          type:
          - string
          - 'null'
          format: date
          description: Date the annual review was conducted.
        practiceSite:
          type: string
          maxLength: 200
          description: Practice or site where the review was conducted.
        patientIdentifier:
          type: string
          maxLength: 100
          description: NHS number or local patient identifier as recorded on the review.
        ageBand:
          type: string
          enum:
          - 18-39
          - 40-59
          - 60-79
          - '>=80'
          - ''
          description: 'Adult age band that drives the blood-pressure target: 18-39, 40-59, 60-79, or
            >=80 (>=80 relaxes the clinic target to 150/90).'
        sex:
          type: string
          enum:
          - female
          - male
          - intersex
          - unknown
          - ''
          description: 'Patient sex: female, male, intersex, or unknown.'
        ethnicity:
          type: string
          enum:
          - white
          - black-african-caribbean
          - south-asian
          - mixed
          - other
          - ''
          description: 'Patient ethnicity: white, black-african-caribbean, south-asian, mixed, or other.'
        diagnosisDate:
          type:
          - string
          - 'null'
          format: date
          description: Date of hypertension diagnosis.
        type2Diabetes:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the patient has type 2 diabetes (yes/no); a blood-pressure target driver.
        chronicKidneyDisease:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the patient has chronic kidney disease (yes/no); with diabetes or ACR >=
            70 it tightens the target to 130/80.
        establishedCvd:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the patient has established cardiovascular disease (yes/no).
        atrialFibrillation:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the patient has atrial fibrillation (yes/no).
        clinicSystolic:
          type:
          - integer
          - 'null'
          format: int32
          description: Clinic systolic blood pressure in mmHg (best of repeated seated readings).
        clinicDiastolic:
          type:
          - integer
          - 'null'
          format: int32
          description: Clinic diastolic blood pressure in mmHg (best of repeated seated readings).
        homeSystolic:
          type:
          - integer
          - 'null'
          format: int32
          description: Home/ambulatory (HBPM/ABPM) daytime-average systolic blood pressure in mmHg.
        homeDiastolic:
          type:
          - integer
          - 'null'
          format: int32
          description: Home/ambulatory (HBPM/ABPM) daytime-average diastolic blood pressure in mmHg.
        monitoringMethod:
          type: string
          enum:
          - clinic-only
          - hbpm
          - abpm
          - ''
          description: 'Blood-pressure monitoring method: clinic-only, hbpm (home), or abpm (ambulatory).'
        posturalDrop:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether a symptomatic postural systolic fall >= 20 mmHg is present (yes/no).
        antihypertensiveAgents:
          type:
          - integer
          - 'null'
          format: int32
          description: Count of current antihypertensive agents.
        adherence:
          type: string
          enum:
          - good
          - partial
          - poor
          - ''
          description: 'Self-reported medication adherence: good, partial, or poor.'
        sideEffects:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether troublesome medication side effects are present (yes/no).
        qriskPercent:
          type:
          - number
          - 'null'
          format: double
          description: QRISK 10-year cardiovascular risk as a percentage.
        smokingStatus:
          type: string
          enum:
          - never
          - ex
          - current
          - ''
          description: 'Smoking status: never, ex, or current.'
        statinTherapy:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the patient is on a statin (yes/no).
        bmi:
          type:
          - number
          - 'null'
          format: double
          description: Body mass index in kg/m^2.
        lifestyleAdvice:
          type: string
          description: Free-text record of lifestyle advice given (diet, exercise, alcohol, salt, smoking
            cessation).
        serumCreatinine:
          type:
          - number
          - 'null'
          format: double
          description: Serum creatinine in micromol/L (U&E).
        egfr:
          type:
          - number
          - 'null'
          format: double
          description: Estimated glomerular filtration rate in mL/min/1.73m^2 (U&E).
        serumPotassium:
          type:
          - number
          - 'null'
          format: double
          description: Serum potassium in mmol/L (U&E).
        hba1c:
          type:
          - number
          - 'null'
          format: double
          description: HbA1c in mmol/mol (glycaemic control).
        totalCholesterol:
          type:
          - number
          - 'null'
          format: double
          description: Total cholesterol in mmol/L (lipids).
        hdlCholesterol:
          type:
          - number
          - 'null'
          format: double
          description: HDL cholesterol in mmol/L (lipids).
        urineAcr:
          type:
          - number
          - 'null'
          format: double
          description: Urine albumin:creatinine ratio in mg/mmol.
        complications:
          type: string
          description: Free-text record of hypertension-related complications or target-organ damage.
        reviewContext:
          type: string
          description: Optional free-text review context or narrative shown in the summary.
      required:
      - createdAt
      - updatedAt
      - patientId
      - clinicianRole
      - practiceSite
      - patientIdentifier
      - ageBand
      - sex
      - ethnicity
      - type2Diabetes
      - chronicKidneyDisease
      - establishedCvd
      - atrialFibrillation
      - monitoringMethod
      - posturalDrop
      - adherence
      - sideEffects
      - smokingStatus
      - statinTherapy
      - lifestyleAdvice
      - complications
      - reviewContext
      description: 'Main hypertension annual-review record (NICE NG136): patient and clinician identification,
        review context, diagnosis and comorbidity target drivers, clinic and home/ambulatory blood pressure,
        medication and adherence, cardiovascular risk, annual bloods, urine ACR, lifestyle, and complications.
        The computed control classification, completeness grade, fired rules, and flags live in child
        tables.'
    HypertensionReviewGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        hypertensionReviewId:
          type: string
          format: uuid
          description: Foreign key to the parent hypertension review (unique, 1:1).
        controlStatus:
          type: string
          enum:
          - controlled
          - uncontrolled
          - severe-uncontrolled
          - ''
          description: 'Blood-pressure control class against the target: controlled, uncontrolled, or
            severe-uncontrolled.'
        hypertensionStage:
          type: string
          enum:
          - none
          - stage-1
          - stage-2
          - stage-3-severe
          - ''
          description: 'Hypertension stage from the raw readings: none, stage-1, stage-2, or stage-3-severe.'
        reviewStatus:
          type: string
          enum:
          - complete
          - partial
          - incomplete
          - ''
          description: 'Review completeness: complete, partial, or incomplete.'
        primarySource:
          type: string
          enum:
          - home
          - clinic
          - none
          - ''
          description: 'Primary reading source used for control classification: home (if present) else
            clinic, or none.'
        targetGroup:
          type: string
          maxLength: 50
          description: Label of the comorbidity/age group that selected the tightest applicable target
            (e.g. default, over-80, ckd-tight).
        clinicTargetSystolic:
          type:
          - integer
          - 'null'
          format: int32
          description: Selected clinic systolic target in mmHg.
        clinicTargetDiastolic:
          type:
          - integer
          - 'null'
          format: int32
          description: Selected clinic diastolic target in mmHg.
        homeTargetSystolic:
          type:
          - integer
          - 'null'
          format: int32
          description: Selected home/ambulatory systolic target in mmHg (5 mmHg below the clinic target).
        homeTargetDiastolic:
          type:
          - integer
          - 'null'
          format: int32
          description: Selected home/ambulatory diastolic target in mmHg (5 mmHg below the clinic target).
        gradedAt:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the grade.
      required:
      - createdAt
      - updatedAt
      - hypertensionReviewId
      - controlStatus
      - hypertensionStage
      - reviewStatus
      - primarySource
      - targetGroup
      - gradedAt
      description: 'Computed control-classification and completeness grading result for a hypertension
        annual review: control status, hypertension stage, review status, the primary reading source,
        the selected blood-pressure target and its driving group. 1:1 with the parent review.'
    HypertensionReviewGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
