components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Clinician full name as recorded in the rota.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as a single text block.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code.
        role:
          type: string
          enum:
          - consultant
          - registrar
          - foundation-trainee
          - staff-nurse
          - charge-nurse
          - nursing-associate
          - healthcare-assistant
          - ward-coordinator
          - medical-student
          - other
          - ''
          description: 'Primary clinical role: consultant, registrar, foundation-trainee, staff-nurse,
            charge-nurse, nursing-associate, healthcare-assistant, ward-coordinator, medical-student,
            or other.'
        registrationBody:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - GPhC
          - other
          - ''
          description: 'Professional registration body: GMC, NMC, HCPC, GPhC, or other.'
        registrationNumber:
          type: string
          description: Professional registration number issued by the registration body.
      required:
      - createdAt
      - updatedAt
      - name
      - role
      - registrationBody
      - registrationNumber
      description: Clinician identifying information for the person who recorded the NEWS2 observation
        set.
    NationalEarlyWarningScore2:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patientId:
          type: string
          format: uuid
          description: 'Foreign key to the patient observed (RESTRICT: patients are not deleted while
            observations exist).'
        clinicianId:
          type:
          - string
          - 'null'
          format: uuid
          description: Foreign key to the clinician who recorded the observation set (RESTRICT); NULL
            until assigned.
        status:
          type: string
          enum:
          - draft
          - submitted
          - amended
          - signed
          description: 'Workflow status: draft, submitted, amended, or signed.'
        observationAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Date and time the observation set was taken; NULL when not yet recorded.
        wardOrLocation:
          type: string
          maxLength: 255
          description: Ward or clinical location where the observations were recorded.
        spo2Scale:
          type: string
          enum:
          - scale-1
          - scale-2
          - ''
          description: 'SpO2 scoring scale: scale-1 (default) or scale-2 (prescribed 88-92% target, e.g.
            hypercapnic respiratory failure).'
        spo2Scale2Endorsed:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether a clinician has endorsed use of Scale 2 for this patient.
        respiratoryRate:
          type:
          - integer
          - 'null'
          format: int32
          description: Respiration rate in breaths per minute; NULL when not recorded.
        spo2:
          type:
          - integer
          - 'null'
          format: int32
          description: Oxygen saturation as a percentage; NULL when not recorded.
        onOxygen:
          type: string
          enum:
          - air
          - oxygen
          - ''
          description: Whether the patient is breathing air or receiving supplemental oxygen.
        oxygenDevice:
          type: string
          enum:
          - nasal-cannula
          - simple-face-mask
          - venturi-mask
          - non-rebreather-mask
          - humidified
          - cpap
          - niv
          - tracheostomy
          - ventilator
          - other
          - ''
          description: Supplemental-oxygen delivery device when on oxygen.
        oxygenFlowRateLMin:
          type:
          - number
          - 'null'
          format: double
          description: Supplemental-oxygen flow rate in litres per minute; NULL when not recorded.
        inspiredOxygenFractionPercent:
          type:
          - integer
          - 'null'
          format: int32
          description: Fraction of inspired oxygen (FiO2) as a percentage; NULL when not recorded.
        systolicBloodPressure:
          type:
          - integer
          - 'null'
          format: int32
          description: Systolic blood pressure in mmHg; NULL when not recorded.
        pulse:
          type:
          - integer
          - 'null'
          format: int32
          description: Pulse rate in beats per minute; NULL when not recorded.
        consciousnessAcvpu:
          type: string
          enum:
          - A
          - C
          - V
          - P
          - U
          - ''
          description: 'Consciousness level on the ACVPU scale: A (alert), C (new confusion), V (voice),
            P (pain), U (unresponsive).'
        temperature:
          type:
          - number
          - 'null'
          format: double
          description: Body temperature in degrees Celsius; NULL when not recorded.
        isUnder16:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the patient is under 16 years old (NEWS2 not validated; raises out-of-scope
            flag).
        isPregnant:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the patient is pregnant (NEWS2 not validated; raises out-of-scope flag).
        hasSpinalCordInjury:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the patient has a spinal-cord injury (NEWS2 not validated; raises out-of-scope
            flag).
        clinicalNotes:
          type: string
          description: Free-text clinical notes accompanying the observation set.
      required:
      - createdAt
      - updatedAt
      - patientId
      - status
      - wardOrLocation
      - spo2Scale
      - spo2Scale2Endorsed
      - onOxygen
      - oxygenDevice
      - consciousnessAcvpu
      - isUnder16
      - isPregnant
      - hasSpinalCordInjury
      - clinicalNotes
      description: 'Main NEWS2 observation record: raw physiological observations for a single vital-sign
        set plus recording context (ward/location, observation timestamp, SpO2 scale, supplemental-oxygen
        details). Subscores, aggregate, risk band, rules, and flags live in child tables.'
    NationalEarlyWarningScore2Grade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        nationalEarlyWarningScore2Id:
          type: string
          format: uuid
          description: Foreign key to the parent observation record (unique, 1:1).
        aggregateScore:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Aggregate NEWS2 total (0-20+): sum of the six parameter subscores plus the supplemental-oxygen
            weighting; NULL until computed.'
        respiratoryRateScore:
          type:
          - integer
          - 'null'
          format: int32
          description: Respiration-rate subscore (0-3); NULL when the observation was not recorded.
        spo2Score:
          type:
          - integer
          - 'null'
          format: int32
          description: Oxygen-saturation subscore (0-3), scored against the selected SpO2 scale; NULL
            when not recorded.
        oxygenScore:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Supplemental-oxygen weighting: 2 when on oxygen, otherwise 0.'
        bloodPressureScore:
          type:
          - integer
          - 'null'
          format: int32
          description: Systolic-blood-pressure subscore (0-3); NULL when not recorded.
        pulseScore:
          type:
          - integer
          - 'null'
          format: int32
          description: Pulse subscore (0-3); NULL when not recorded.
        consciousnessScore:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Consciousness (ACVPU) subscore: 3 for any value other than A (alert), otherwise
            0; NULL when not recorded.'
        temperatureScore:
          type:
          - integer
          - 'null'
          format: int32
          description: Temperature subscore (0-3); NULL when not recorded.
        anySingleParameterThree:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Red score: whether any single parameter scored 3, which escalates the band to
            at least low-medium.'
        riskBand:
          type: string
          enum:
          - low
          - low-medium
          - medium
          - high
          - ''
          description: 'Derived clinical-risk band (worst of aggregate band and red-score band): low,
            low-medium, medium, or high.'
        monitoringFrequency:
          type: string
          description: RCP-recommended monitoring frequency (e.g. 12-hourly, 4-6 hourly, 1-hourly, continuous).
        recommendation:
          type: string
          description: RCP-recommended clinical response and escalation for the risk band.
        gradedAt:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the grade.
      required:
      - createdAt
      - updatedAt
      - nationalEarlyWarningScore2Id
      - anySingleParameterThree
      - riskBand
      - monitoringFrequency
      - recommendation
      - gradedAt
      description: 'Computed NEWS2 grading result: per-parameter subscores, aggregate total (0-20+), red-score
        indicator, derived clinical-risk band, and RCP-recommended monitoring frequency and escalation
        response. One row per observation record (1:1).'
    NationalEarlyWarningScore2GradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        nationalEarlyWarningScore2GradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        flagId:
          type: string
          maxLength: 50
          description: Stable flag identifier (e.g. F-SINGLE-PARAMETER-3-001).
        category:
          type: string
          enum:
          - high-score-escalate
          - single-parameter-3
          - deteriorating-trend
          - out-of-scope-population
          - incomplete-observation
          - other
          - ''
          description: 'Flag category: high-score-escalate, single-parameter-3, deteriorating-trend, out-of-scope-population,
            incomplete-observation, or other.'
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          - ''
          description: 'Priority: low, medium, high.'
        description:
          type: string
          maxLength: 500
          description: Human-readable description of what fired the flag.
        suggestedAction:
          type: string
          maxLength: 500
          description: Suggested clinical action (e.g. "escalate to the acute-illness team", "review SpO2
            target against Scale 2").
      required:
      - createdAt
      - updatedAt
      - nationalEarlyWarningScore2GradeId
      - flagId
      - category
      - priority
      - description
      - suggestedAction
      description: Safety-critical flags that fire independently of the aggregate risk band, with priority
        and a suggested action for the ward and escalation team.
    NationalEarlyWarningScore2GradeRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        nationalEarlyWarningScore2GradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        ruleId:
          type: string
          maxLength: 40
          description: Stable rule identifier (e.g. R-RESP-RATE-3-HIGH-01).
        instrument:
          type: string
          enum:
          - respiratory-rate
          - spo2
          - oxygen
          - blood-pressure
          - pulse
          - consciousness
          - temperature
          - aggregate
          - red-score
          description: 'Scoring instrument the rule belongs to: respiratory-rate, spo2, oxygen, blood-pressure,
            pulse, consciousness, temperature, aggregate, or red-score.'
        band:
          type: string
          enum:
          - low
          - low-medium
          - medium
          - high
          - ''
          description: 'Clinical-risk band contributed by this rule: low, low-medium, medium, or high.'
        points:
          type:
          - integer
          - 'null'
          format: int32
          description: Subscore points contributed by this rule (0-3); NULL for non-scoring rules.
        category:
          type: string
          maxLength: 50
          description: Subject category (e.g. tachypnoea, hypoxia, hypotension, new-confusion).
        description:
          type: string
          maxLength: 500
          description: Human-readable description of why the rule fired.
      required:
      - createdAt
      - updatedAt
      - nationalEarlyWarningScore2GradeId
      - ruleId
      - instrument
      - band
      - category
      - description
      description: 'Audit trail of every grading rule that fired during NEWS2 computation: instrument,
        band, points contributed, category, and description.'
