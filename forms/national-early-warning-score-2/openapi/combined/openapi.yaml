        registration_body:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - GPhC
          - other
          - ''
          description: 'Professional registration body: GMC, NMC, HCPC, GPhC, or other.'
        registration_number:
          type: string
          description: Professional registration number issued by the registration body.
      required:
      - created_at
      - updated_at
      - name
      - role
      - registration_body
      - registration_number
      description: Clinician identifying information for the person who recorded the NEWS2 observation
        set.
    NationalEarlyWarningScore2:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        patient_id:
          type: string
          format: uuid
          description: 'Foreign key to the patient observed (RESTRICT: patients are not deleted while
            observations exist).'
        clinician_id:
          type: string
          format: uuid
          description: Foreign key to the clinician who recorded the observation set (RESTRICT); NULL
            until assigned.
        status:
          type: string
          enum:
          - draft
          - submitted
          - amended
          - signed
          description: 'Workflow status: draft, submitted, amended, or signed.'
        observation_at:
          type: string
          format: date-time
          description: Date and time the observation set was taken; NULL when not yet recorded.
        ward_or_location:
          type: string
          maxLength: 255
          description: Ward or clinical location where the observations were recorded.
        spo2_scale:
          type: string
          enum:
          - scale-1
          - scale-2
          - ''
          description: 'SpO2 scoring scale: scale-1 (default) or scale-2 (prescribed 88-92% target, e.g.
            hypercapnic respiratory failure).'
        spo2_scale2_endorsed:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether a clinician has endorsed use of Scale 2 for this patient.
        respiratory_rate:
          type: integer
          format: int32
          description: Respiration rate in breaths per minute; NULL when not recorded.
        spo2:
          type: integer
          format: int32
          description: Oxygen saturation as a percentage; NULL when not recorded.
        on_oxygen:
          type: string
          enum:
          - air
          - oxygen
          - ''
          description: Whether the patient is breathing air or receiving supplemental oxygen.
        oxygen_device:
          type: string
          enum:
          - nasal-cannula
          - simple-face-mask
          - venturi-mask
          - non-rebreather-mask
          - humidified
          - cpap
          - niv
          - tracheostomy
          - ventilator
          - other
          - ''
          description: Supplemental-oxygen delivery device when on oxygen.
        oxygen_flow_rate_l_min:
          type: number
          format: double
          description: Supplemental-oxygen flow rate in litres per minute; NULL when not recorded.
        inspired_oxygen_fraction_percent:
          type: integer
          format: int32
          description: Fraction of inspired oxygen (FiO2) as a percentage; NULL when not recorded.
        systolic_blood_pressure:
          type: integer
          format: int32
          description: Systolic blood pressure in mmHg; NULL when not recorded.
        pulse:
          type: integer
          format: int32
          description: Pulse rate in beats per minute; NULL when not recorded.
        consciousness_acvpu:
          type: string
          enum:
          - A
          - C
          - V
          - P
          - U
          - ''
          description: 'Consciousness level on the ACVPU scale: A (alert), C (new confusion), V (voice),
            P (pain), U (unresponsive).'
        temperature:
          type: number
          format: double
          description: Body temperature in degrees Celsius; NULL when not recorded.
        is_under_16:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the patient is under 16 years old (NEWS2 not validated; raises out-of-scope
            flag).
        is_pregnant:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the patient is pregnant (NEWS2 not validated; raises out-of-scope flag).
        has_spinal_cord_injury:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the patient has a spinal-cord injury (NEWS2 not validated; raises out-of-scope
            flag).
        clinical_notes:
          type: string
          description: Free-text clinical notes accompanying the observation set.
      required:
      - created_at
      - updated_at
      - patient_id
      - status
      - ward_or_location
      - spo2_scale
      - spo2_scale2_endorsed
      - on_oxygen
      - oxygen_device
      - consciousness_acvpu
      - is_under_16
      - is_pregnant
      - has_spinal_cord_injury
      - clinical_notes
      description: 'Main NEWS2 observation record: raw physiological observations for a single vital-sign
        set plus recording context (ward/location, observation timestamp, SpO2 scale, supplemental-oxygen
        details). Subscores, aggregate, risk band, rules, and flags live in child tables.'
    NationalEarlyWarningScore2Grade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the row was soft-deleted.
        national_early_warning_score_2_id:
          type: string
          format: uuid
          description: Foreign key to the parent observation record (unique, 1:1).
        aggregate_score:
          type: integer
          format: int32
          description: 'Aggregate NEWS2 total (0-20+): sum of the six parameter subscores plus the supplemental-oxygen
            weighting; NULL until computed.'
        respiratory_rate_score:
          type: integer
          format: int32
          description: Respiration-rate subscore (0-3); NULL when the observation was not recorded.
        spo2_score:
          type: integer
          format: int32
          description: Oxygen-saturation subscore (0-3), scored against the selected SpO2 scale; NULL
            when not recorded.
        oxygen_score:
          type: integer
          format: int32
          description: 'Supplemental-oxygen weighting: 2 when on oxygen, otherwise 0.'
        blood_pressure_score:
          type: integer
          format: int32
          description: Systolic-blood-pressure subscore (0-3); NULL when not recorded.
        pulse_score:
          type: integer
          format: int32
          description: Pulse subscore (0-3); NULL when not recorded.
        consciousness_score:
          type: integer
          format: int32
          description: 'Consciousness (ACVPU) subscore: 3 for any value other than A (alert), otherwise
            0; NULL when not recorded.'
        temperature_score:
          type: integer
          format: int32
          description: Temperature subscore (0-3); NULL when not recorded.
        any_single_parameter_three:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Red score: whether any single parameter scored 3, which escalates the band to
            at least low-medium.'
        risk_band:
          type: string
          enum:
          - low
          - low-medium
          - medium
          - high
          - ''
          description: 'Derived clinical-risk band (worst of aggregate band and red-score band): low,
            low-medium, medium, or high.'
        monitoring_frequency:
          type: string
          description: RCP-recommended monitoring frequency (e.g. 12-hourly, 4-6 hourly, 1-hourly, continuous).
        recommendation:
          type: string
          description: RCP-recommended clinical response and escalation for the risk band.
        graded_at:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the grade.
      required:
      - created_at
      - updated_at
      - national_early_warning_score_2_id
      - any_single_parameter_three
      - risk_band
      - monitoring_frequency
      - recommendation
      - graded_at
      description: 'Computed NEWS2 grading result: per-parameter subscores, aggregate total (0-20+), red-score
        indicator, derived clinical-risk band, and RCP-recommended monitoring frequency and escalation
        response. One row per observation record (1:1).'
    NationalEarlyWarningScore2GradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updated_at:
          type: string
          format: date-time
