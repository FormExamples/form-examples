        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the row was soft-deleted.
        national_early_warning_score_2_grade_id:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        flag_id:
          type: string
          maxLength: 50
          description: Stable flag identifier (e.g. F-SINGLE-PARAMETER-3-001).
        category:
          type: string
          enum:
          - high-score-escalate
          - single-parameter-3
          - deteriorating-trend
          - out-of-scope-population
          - incomplete-observation
          - other
          - ''
          description: 'Flag category: high-score-escalate, single-parameter-3, deteriorating-trend, out-of-scope-population,
            incomplete-observation, or other.'
        priority:
          type: string
          enum:
          - low
          - medium
          - high
