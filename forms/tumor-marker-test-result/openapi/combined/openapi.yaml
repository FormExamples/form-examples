      - reporting_category
      - recommended_follow_up
      - critical_result_communicated
      - reported_to
      description: Serum tumour-marker test result (report). Captures the measured result value for each
        serum tumour marker (NUMERIC), the prior value and trend, an overall result status, the interpretive
        narrative and impression, recommended follow-up, and critical-result communication. This is the
        source-of-truth record that the four-axis interpretation grade is computed from.
