components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Name.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as full text.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code, such as for validating the postal address.
        role:
          type: string
          enum:
          - clinical-biochemist
          - oncologist
          - reporting-clinician
          - other
          - ''
          description: 'Reporting clinician role: clinical-biochemist, oncologist, reporting-clinician,
            other.'
        registrationBody:
          type: string
          enum:
          - GMC
          - HCPC
          - other
          - ''
          description: 'Clinician registration body: GMC, HCPC, other.'
        registrationNumber:
          type: string
          description: Clinician registration number.
        unitedKingdomNhsNumber:
          type:
          - string
          - 'null'
          maxLength: 12
          description: United Kingdom NHS number, unique per person.
      required:
      - createdAt
      - updatedAt
      - name
      - role
      - registrationBody
      - registrationNumber
      description: Reporting clinician (clinical biochemist, oncologist, or reporting clinician) who authors
        and signs the tumour-marker result report.
    Patient:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          maxLength: 255
          description: Name.
        birthDate:
          type: string
          format: date
          description: Birth date.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as full text.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code, such as for validating the postal address.
        unitedKingdomNhsNumber:
          type:
          - string
          - 'null'
          maxLength: 20
          description: United Kingdom NHS number, unique per person.
        waistAsCm:
          type:
          - number
          - 'null'
          format: double
          description: Waist circumference measurement in cm, such as for calculating waist-height ratio
            (WHR).
        heightAsCm:
          type:
          - number
          - 'null'
          format: double
          description: Height measurement in cm, such as for calculating waist-height ratio (WHR).
        weightAsKg:
          type:
          - number
          - 'null'
          format: double
          description: Weight as kg.
        bodyMassIndex:
          type:
          - number
          - 'null'
          format: double
          description: Body mass index (BMI) measurement.
        waistHeightRatio:
          type:
          - number
          - 'null'
          format: double
          description: Waist-height ratio (WHR) measurement.
        vo2Max:
          type:
          - number
          - 'null'
          format: double
          description: VO2 max measurement.
      required:
      - createdAt
      - updatedAt
      - name
      - birthDate
      description: Patient
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          description: A URI identifying the problem type
        title:
          type: string
          description: A short summary of the problem type
        status:
          type: integer
          description: The HTTP status code
        detail:
          type: string
          description: An explanation of this occurrence
        instance:
          type: string
          description: A URI identifying this occurrence
        code:
          type: string
          description: A short machine-readable reason
        errors:
          type: object
          description: Per-field detail, when validation failed
      required:
      - type
      - title
      - status
    TumorMarkerTestResult:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the patient.
        clinicianId:
          type: string
          format: uuid
          description: Foreign key to the reporting clinician (clinical biochemist / oncologist / reporting
            clinician).
        originatingRequestReference:
          type: string
          maxLength: 255
          description: Free-text reference linking this report back to the originating tumour-marker test
            request (referral).
        reportStatus:
          type: string
          enum:
          - preliminary
          - final
          - amended
          - cancelled
          - ''
          description: 'Report lifecycle status: preliminary, final, amended, cancelled.'
        performedDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the specimen was collected / the assay was performed.
        reportedDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the report was authored / signed.
        specimenCondition:
          type: string
          enum:
          - satisfactory
          - haemolysed
          - lipaemic
          - insufficient
          - ''
          description: 'Specimen condition affecting assay validity: satisfactory, haemolysed, lipaemic,
            insufficient.'
        clinicalHistory:
          type: string
          maxLength: 1000
          description: Clinical history and the question the test was performed to answer.
        knownCancerSite:
          type: string
          maxLength: 255
          description: Known or suspected primary cancer site, if any (context for interpretation).
        psa:
          type:
          - number
          - 'null'
          format: double
          description: Measured prostate-specific antigen (PSA) value in ng/mL; NULL if not measured.
        ca125:
          type:
          - number
          - 'null'
          format: double
          description: Measured CA125 value in IU/mL (suspected ovarian cancer; NICE CG122 ultrasound
            threshold 35 IU/mL); NULL if not measured.
        ca199:
          type:
          - number
          - 'null'
          format: double
          description: Measured CA19-9 value in U/mL (pancreatic / hepatobiliary cancer; reference < 37
            U/mL); NULL if not measured.
        carcinoembryonicAntigenCea:
          type:
          - number
          - 'null'
          format: double
          description: Measured carcinoembryonic antigen (CEA) value in ng/mL (colorectal cancer monitoring);
            NULL if not measured.
        alphaFetoproteinAfp:
          type:
          - number
          - 'null'
          format: double
          description: Measured alpha-fetoprotein (AFP) value in ng/mL (hepatocellular carcinoma, germ-cell
            tumours); a very high value suggests a germ-cell tumour; NULL if not measured.
        betaHcg:
          type:
          - number
          - 'null'
          format: double
          description: Measured beta human chorionic gonadotrophin (beta-hCG) value in IU/L (germ-cell
            / trophoblastic tumours); a very high value suggests a germ-cell tumour; NULL if not measured.
        ca153:
          type:
          - number
          - 'null'
          format: double
          description: Measured CA15-3 value in U/mL (breast cancer monitoring); NULL if not measured.
        lactateDehydrogenaseLdh:
          type:
          - number
          - 'null'
          format: double
          description: Measured lactate dehydrogenase (LDH) value in U/L (germ-cell tumour staging, lymphoma
            prognosis); NULL if not measured.
        calcitonin:
          type:
          - number
          - 'null'
          format: double
          description: Measured calcitonin value in ng/L (medullary thyroid carcinoma); NULL if not measured.
        chromograninA:
          type:
          - number
          - 'null'
          format: double
          description: Measured chromogranin A value in nmol/L (neuroendocrine tumours); NULL if not measured.
        previousValue:
          type:
          - number
          - 'null'
          format: double
          description: Most recent previous value of the principal marker, for trend / response interpretation;
            NULL if none.
        trend:
          type: string
          enum:
          - rising
          - stable
          - falling
          - not-applicable
          - ''
          description: 'Trend of the principal marker versus the previous value: rising, stable, falling,
            not-applicable.'
        comparisonWithPrevious:
          type: string
          maxLength: 1000
          description: Narrative comparison with previous tumour-marker results.
        overallResultStatus:
          type: string
          enum:
          - normal
          - abnormal
          - critical
          - ''
          description: 'Overall result status: normal, abnormal, critical.'
        markedlyElevated:
          type: boolean
          description: Whether one or more markers are markedly elevated above the reference range.
        findingsNarrative:
          type: string
          maxLength: 2000
          description: Narrative description of the measured values and their interpretation (the body
            of the report).
        impression:
          type: string
          maxLength: 2000
          description: Summary impression / conclusion answering the clinical question.
        reportingCategory:
          type: string
          maxLength: 50
          description: Structured-reporting category label (e.g. a germ-cell-marker pattern or monitoring-trend
            category).
        recommendedFollowUp:
          type: string
          maxLength: 1000
          description: 'Recommended follow-up: repeat interval, referral, or further investigation.'
        criticalResultCommunicated:
          type: boolean
          description: Whether a critical or unexpected significant result was communicated directly to
            the requester.
        reportedTo:
          type: string
          maxLength: 500
          description: Who the critical / urgent result was communicated to, with date and time if applicable.
      required:
      - createdAt
      - updatedAt
      - patientId
      - clinicianId
      - originatingRequestReference
      - reportStatus
      - specimenCondition
      - clinicalHistory
      - knownCancerSite
      - trend
      - comparisonWithPrevious
      - overallResultStatus
      - markedlyElevated
      - findingsNarrative
      - impression
      - reportingCategory
      - recommendedFollowUp
      - criticalResultCommunicated
      - reportedTo
      description: Serum tumour-marker test result (report). Captures the measured result value for each
        serum tumour marker (NUMERIC), the prior value and trend, an overall result status, the interpretive
        narrative and impression, recommended follow-up, and critical-result communication. This is the
        source-of-truth record that the four-axis interpretation grade is computed from.
    TumorMarkerTestResultGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        tumorMarkerTestResultId:
          type: string
          format: uuid
          description: Foreign key to the parent result (unique, 1:1).
        resultClassification:
          type: string
          enum:
          - normal
          - abnormal
          - critical
          - inconclusive
          - ''
