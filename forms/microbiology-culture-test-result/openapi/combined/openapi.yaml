components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Name.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as full text.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code, such as for validating the postal address.
        role:
          type: string
          enum:
          - consultant-microbiologist
          - biomedical-scientist
          - infection-specialist
          - other
          - ''
          description: 'Reporting clinician role: consultant-microbiologist, biomedical-scientist, infection-specialist,
            other.'
        registrationBody:
          type: string
          enum:
          - GMC
          - HCPC
          - other
          - ''
          description: 'Clinician registration body: GMC, HCPC, other.'
        registrationNumber:
          type: string
          description: Clinician registration number.
        unitedKingdomNhsNumber:
          type:
          - string
          - 'null'
          maxLength: 12
          description: United Kingdom NHS number, unique per person.
      required:
      - createdAt
      - updatedAt
      - name
      - role
      - registrationBody
      - registrationNumber
      description: Reporting clinician (consultant microbiologist, biomedical scientist, or infection
        specialist) who authors and signs the microbiology culture result report.
    MicrobiologyCultureTestResult:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the patient.
        clinicianId:
          type: string
          format: uuid
          description: Foreign key to the reporting clinician (consultant microbiologist / biomedical
            scientist).
        originatingRequestReference:
          type: string
          maxLength: 255
          description: Free-text reference linking this report back to the originating microbiology culture
            request (referral).
        reportStatus:
          type: string
          enum:
          - preliminary
          - interim
          - final
          - amended
          - cancelled
          - ''
          description: 'Report lifecycle status: preliminary, interim, final, amended, cancelled.'
        performedDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the specimen was processed / the examination was performed.
        reportedDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the report was authored / signed.
        specimenType:
          type: string
          enum:
          - blood-culture
          - urine
          - wound-swab
          - sputum
          - throat-swab
          - stool
          - csf
          - tissue
          - catheter-tip
          - genital-swab
          - other
          - ''
          description: 'Specimen type cultured: blood-culture, urine, wound-swab, sputum, throat-swab,
            stool, csf, tissue, catheter-tip, genital-swab, other.'
        specimenSiteDetail:
          type: string
          maxLength: 255
          description: Free-text anatomical site / source detail for the specimen.
        specimenCondition:
          type: string
          enum:
          - satisfactory
          - contaminated
          - insufficient
          - delayed
          - ''
          description: 'Pre-analytical specimen condition on receipt: satisfactory, contaminated, insufficient,
            delayed.'
        clinicalHistory:
          type: string
          maxLength: 1000
          description: Clinical history / indication that the specimen was taken to investigate.
        gramStainResult:
          type: string
          maxLength: 1000
          description: Gram-stain microscopy result narrative (e.g. Gram-positive cocci in clusters).
        cultureResult:
          type: string
          enum:
          - no-growth
          - mixed-growth
          - significant-growth
          - positive
          - ''
          description: 'Overall culture outcome: no-growth, mixed-growth, significant-growth, positive.'
        organismIsolated:
          type: string
          maxLength: 500
          description: Primary organism isolated and identified.
        secondOrganismIsolated:
          type: string
          maxLength: 500
          description: Second organism isolated and identified, where applicable.
        colonyCount:
          type: string
          maxLength: 255
          description: Colony count / quantification (e.g. >100,000 CFU/mL for urine).
        antibioticSensitivities:
          type: string
          maxLength: 2000
          description: Antibiotic susceptibility results narrative (sensitive / resistant per agent).
        resistanceMrsa:
          type: boolean
          description: Whether meticillin-resistant Staphylococcus aureus (MRSA) was identified.
        resistanceEsbl:
          type: boolean
          description: Whether an extended-spectrum beta-lactamase (ESBL) producer was identified.
        resistanceCpe:
          type: boolean
          description: Whether a carbapenemase-producing Enterobacterales (CPE) organism was identified.
        cDifficileToxin:
          type: string
          enum:
          - positive
          - negative
          - not-tested
          - ''
          description: 'Clostridioides difficile toxin result: positive, negative, not-tested.'
        acidFastBacilli:
          type: string
          enum:
          - positive
          - negative
          - not-tested
          - ''
          description: 'Acid-fast bacilli (AFB / TB) microscopy result: positive, negative, not-tested.'
        pcrResult:
          type: string
          maxLength: 1000
          description: Molecular / PCR test result narrative.
        criticalOrganism:
          type: boolean
          description: Whether a critical / alert organism (e.g. positive blood culture, CSF isolate,
            CPE) requiring urgent communication is present.
        findingsNarrative:
          type: string
          maxLength: 2000
          description: Narrative description of the microbiology findings (the body of the report).
        impression:
          type: string
          maxLength: 2000
          description: Summary impression / interpretation answering the clinical question.
        reportingCategory:
          type: string
          maxLength: 50
          description: Structured-reporting category / label for the result (free-text, e.g. an infection-significance
            category).
        recommendedFollowUp:
          type: string
          maxLength: 1000
          description: Recommended follow-up testing, antimicrobial advice, or management.
        criticalResultCommunicated:
          type: boolean
          description: Whether a critical or unexpected significant result was communicated directly to
            the requester / clinical team.
        reportedTo:
          type: string
          maxLength: 500
          description: Who the critical / urgent result was communicated to, with date and time if applicable.
      required:
      - createdAt
      - updatedAt
      - patientId
      - clinicianId
      - originatingRequestReference
      - reportStatus
      - specimenType
      - specimenSiteDetail
      - specimenCondition
      - clinicalHistory
      - gramStainResult
      - cultureResult
      - organismIsolated
      - secondOrganismIsolated
      - colonyCount
      - antibioticSensitivities
      - resistanceMrsa
      - resistanceEsbl
      - resistanceCpe
      - cDifficileToxin
      - acidFastBacilli
      - pcrResult
      - criticalOrganism
      - findingsNarrative
      - impression
      - reportingCategory
      - recommendedFollowUp
      - criticalResultCommunicated
      - reportedTo
      description: Microbiology culture test result (report). Captures the specimen and its condition,
        the clinical history, the Gram-stain and culture results, the organism(s) isolated and colony
        count, antibiotic sensitivities and key resistance markers (MRSA / ESBL / CPE), specialised tests
        (C. difficile toxin, acid-fast bacilli, PCR), the narrative findings, impression, recommended
        follow-up, and critical-result communication. This is the source-of-truth record that the four-axis
        interpretation grade is computed from.
    MicrobiologyCultureTestResultGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        microbiologyCultureTestResultId:
          type: string
          format: uuid
          description: Foreign key to the parent result (unique, 1:1).
        resultClassification:
          type: string
          enum:
          - normal
          - abnormal
          - critical
          - inconclusive
          - ''
          description: 'Axis A overall classification: normal, abnormal, critical, inconclusive.'
        abnormalitySeverity:
          type: string
          enum:
          - none
          - minor
          - moderate
          - major
          - ''
          description: 'Axis B abnormality severity: none, minor, moderate, major.'
        reportingCategory:
          type: string
          maxLength: 50
          description: Axis B structured-reporting score / category label (e.g. an infection-significance
            category).
        reportCompletenessPercent:
          type:
          - integer
          - 'null'
          format: int32
          description: Axis C report completeness as a percentage of mandatory report sections (0-100).
        followUpUrgency:
          type: string
          enum:
          - routine
          - recommended
          - urgent
          - critical-alert
          - ''
          description: 'Axis D follow-up urgency: routine, recommended, urgent, critical-alert.'
        targetTimeframe:
          type: string
          maxLength: 50
          description: Target timeframe for the recommended follow-up implied by the urgency.
        recommendedAction:
          type: string
          maxLength: 500
          description: Axis D concise recommended action derived from the urgency.
        recommendation:
          type: string
          enum:
          - no-action
          - routine-follow-up
          - further-testing
          - specialist-referral
          - urgent-review
          - ''
          description: 'Overall recommendation: no-action, routine-follow-up, further-testing, specialist-referral,
            urgent-review.'
        clinicianNotes:
          type: string
          description: Free-text interpretation / sign-off notes.
        signedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Timestamp of the reporting clinician electronic signature.
        gradedAt:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the result.
      required:
      - createdAt
      - updatedAt
      - microbiologyCultureTestResultId
      - resultClassification
      - abnormalitySeverity
      - reportingCategory
      - followUpUrgency
      - targetTimeframe
      - recommendedAction
      - recommendation
      - clinicianNotes
      - gradedAt
      description: 'Computed four-axis interpretation grade: result classification, abnormality severity
        / structured-reporting category, report completeness, and follow-up urgency. A critical result
        (positive blood culture, CSF isolate, CPE, or any flagged critical organism) auto-escalates the
        follow-up urgency to critical-alert regardless of the other axes.'
    MicrobiologyCultureTestResultGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        microbiologyCultureTestResultGradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        flagId:
          type: string
          maxLength: 50
          description: Stable flag identifier (e.g. F-CRITICAL-RESULT-001).
        category:
          type: string
          enum:
          - critical-result-alert
          - incidental-finding
