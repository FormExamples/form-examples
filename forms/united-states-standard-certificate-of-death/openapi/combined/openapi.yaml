        suggested action.
    UnitedStatesStandardCertificateOfDeathGradeRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        unitedStatesStandardCertificateOfDeathGradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        ruleId:
          type: string
          maxLength: 40
          description: Stable rule identifier (e.g. R-MISSING-PART-IA-01).
        dimension:
          type: string
          enum:
          - part-i
          - part-ii
          - manner
          - referral
          - decedent
          - certifier
          - disposition
          - copies
          - classification
          - ''
          description: 'Certificate dimension the rule concerns: part-i, part-ii, manner, referral, decedent,
            certifier, disposition, copies, or classification.'
        category:
          type: string
          maxLength: 50
          description: Subject category (e.g. required-component, mechanism-of-death, referral-criterion).
        description:
          type: string
          maxLength: 500
          description: Human-readable description of why the rule fired.
