components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Certifier full name as licensed by the state.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as a single text block.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code.
        role:
          type: string
          enum:
          - attending-physician
          - pronouncing-physician
          - medical-examiner
          - coroner
          - funeral-director
          - other
          - ''
          description: 'Role of the certifier: attending-physician, pronouncing-physician, medical-examiner,
            coroner, funeral-director, or other.'
        registrationBody:
          type: string
          enum:
          - state-medical-board
          - state-funeral-board
          - other
          - ''
          description: 'Licensing body: state-medical-board, state-funeral-board, or other.'
        registrationNumber:
          type: string
          description: Professional registration number (state license number).
      required:
      - createdAt
      - updatedAt
      - name
      - role
      - registrationBody
      - registrationNumber
      description: Clinician information for the medical certifier (physician, medical examiner, or coroner)
        who completes the cause-of-death section of the US Standard Certificate of Death.
    Patient:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          maxLength: 255
          description: Full name of the deceased.
        birthDate:
          type: string
          format: date
          description: Date of birth of the deceased.
        sex:
          type: string
          enum:
          - female
          - male
          - unknown
          - ''
          description: 'Sex recorded for the deceased: female, male, other, or unknown.'
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as a single text block.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code.
        hospitalMrn:
          type:
          - string
          - 'null'
          maxLength: 50
          description: Local hospital medical record number (MRN).
      required:
      - createdAt
      - updatedAt
      - name
      - birthDate
      - sex
      description: Patient demographic information for the deceased whose cause of death this death certificate
        records.
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          description: A URI identifying the problem type
        title:
          type: string
          description: A short summary of the problem type
        status:
          type: integer
          description: The HTTP status code
        detail:
          type: string
          description: An explanation of this occurrence
        instance:
          type: string
          description: A URI identifying this occurrence
        code:
          type: string
          description: A short machine-readable reason
        errors:
          type: object
          description: Per-field detail, when validation failed
      required:
      - type
      - title
      - status
    UnitedStatesStandardCertificateOfDeath:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the decedent this certificate documents (restrict delete).
        clinicianId:
          type:
          - string
          - 'null'
          format: uuid
          description: Foreign key to the certifier (restrict delete); optional.
        state:
          type: string
          maxLength: 2
          description: Two-letter USPS code of the state (or territory) whose vital-records office registers
            the death; selects the STATE_RULES row.
        decedentName:
          type: string
          description: Legal name of the decedent as recorded on the certificate (item 1).
        sex:
          type: string
          enum:
          - female
          - male
          - unknown
          - ''
          description: 'Sex of the decedent (item 2): female, male, or unknown.'
        dateOfBirth:
          type:
          - string
          - 'null'
          format: date
          description: Date of birth of the decedent (item 5).
        ageYears:
          type:
          - integer
          - 'null'
          format: int32
          description: Age of the decedent at death in whole years (item 4); 0 for an infant under one
            year.
        maritalStatus:
          type: string
          enum:
          - married
          - married-separated
          - widowed
          - divorced
          - never-married
          - unknown
          - ''
          description: Marital status at time of death (item 8).
        veteranStatus:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the decedent ever served in the US Armed Forces (item 10).
        stateOfResidence:
          type: string
          maxLength: 2
          description: Two-letter USPS code of the decedent's state of residence (item 14).
        placeOfDeathType:
          type: string
          enum:
          - hospital-inpatient
          - hospital-emergency-outpatient
          - hospital-dead-on-arrival
          - decedent-home
          - hospice
          - nursing-home
          - other
          - ''
          description: 'Place of death type (item 20): inpatient, ER/outpatient, DOA, home, hospice, nursing
            home, or other.'
        placeOfDeathFacility:
          type: string
          description: Name and address of the facility or location where death occurred or the body was
            found (items 20 to 26).
        dateOfDeath:
          type:
          - string
          - 'null'
          format: date
          description: Date of death, actual or presumed (item 29).
        timeOfDeath:
          type:
          - string
          - 'null'
          format: time
          description: Time of death, actual or presumed (item 30).
        certifierName:
          type: string
          description: Name of the person completing the cause-of-death section (item 32 / certifier block).
        certifierType:
          type: string
          enum:
          - certifying-physician
          - pronouncing-and-certifying-physician
          - medical-examiner
          - coroner
          - other
          - ''
          description: 'Certifier type (item 32): certifying physician, pronouncing and certifying physician,
            medical examiner, coroner, or other.'
        certifierLicenseNumber:
          type: string
          maxLength: 50
          description: State license number of the certifier (item 33 / 34).
        certificationDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the certifier signed the cause-of-death section (item 35).
        attendedDeceased:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the certifier attended the decedent during the last illness (yes/no).
        lastSeenAliveDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the certifier last saw the decedent alive.
        causeIaCondition:
          type: string
          description: 'Part I line (a): the immediate cause, the final disease or condition resulting
            in death (required).'
        causeIaInterval:
          type: string
          maxLength: 100
          description: 'Part I line (a): approximate interval between onset and death (item 32).'
        causeIbCondition:
          type: string
          description: 'Part I line (b): the condition, if any, giving rise to line (a) (due to, or as
            a consequence of).'
        causeIbInterval:
          type: string
          maxLength: 100
          description: 'Part I line (b): approximate interval between onset and death (item 32).'
        causeIcCondition:
          type: string
          description: 'Part I line (c): the condition, if any, giving rise to line (b).'
        causeIcInterval:
          type: string
          maxLength: 100
          description: 'Part I line (c): approximate interval between onset and death (item 32).'
        causeIdCondition:
          type: string
          description: 'Part I line (d): the underlying cause, the condition that initiated the chain,
            when four steps are needed.'
        causeIdInterval:
          type: string
          maxLength: 100
          description: 'Part I line (d): approximate interval between onset and death (item 32).'
        partIiConditions:
          type: string
          description: 'Part II: other significant conditions contributing to death but not resulting
            in the underlying cause given in Part I.'
        autopsyPerformed:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether an autopsy was performed (item 34 / 35).
        autopsyFindingsAvailable:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether autopsy findings were available to complete the cause of death.
        mannerOfDeath:
          type: string
          enum:
          - natural
          - accident
          - suicide
          - homicide
          - pending-investigation
          - could-not-be-determined
          - ''
          description: 'Manner of death (item 41): natural, accident, suicide, homicide, pending investigation,
            or could not be determined.'
        tobaccoUseContributed:
          type: string
          enum:
          - 'yes'
          - probably
          - 'no'
          - unknown
          - ''
          description: 'Did tobacco use contribute to death (item 37): yes, probably, no, or unknown.'
        pregnancyStatus:
          type: string
          enum:
          - not-applicable
          - not-pregnant-within-past-year
          - pregnant-at-time-of-death
          - not-pregnant-but-pregnant-within-42-days
          - not-pregnant-but-pregnant-43-days-to-1-year
          - unknown
          - ''
          description: Pregnancy status (item 36), asked for females; not applicable for males and for
            females outside the age band.
        injuryDate:
          type:
          - string
          - 'null'
          format: date
          description: Date of injury (item 43).
        injuryTime:
          type:
          - string
          - 'null'
          format: time
          description: Time of injury (item 44).
        injuryPlace:
          type: string
          description: Place of injury, for example decedent's home, construction site, or restaurant
            (item 45).
        injuryAtWork:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the injury occurred at work (item 46).
        injuryLocation:
          type: string
          description: 'Location of injury: state, city, street and number, apartment, zip code (item
            47).'
        injuryDescription:
          type: string
          description: 'Description of how the injury occurred (item 48): specific enough to code the
            external cause.'
        transportationInjuryRole:
          type: string
          enum:
          - driver-operator
          - passenger
          - pedestrian
          - other
          - ''
          description: Role of the decedent if a transportation injury (item 49).
        referredToMedicalExaminer:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the death was referred to the medical examiner or coroner.
        referralReason:
          type: string
          enum:
          - none
          - violent-or-unnatural
          - accident
          - suicide
          - homicide
          - suspicious
          - poisoning-or-overdose
          - unattended-by-physician
          - sudden-unexpected-infant-death
          - work-related
          - medical-procedure-related
          - in-custody
          - public-health-hazard
          - unidentified
          - other
          - ''
          description: Medical-examiner or coroner referral criterion, if any; any listed circumstance
            other than none requires referral.
        funeralDirectorName:
          type: string
          description: Name of the funeral director or person acting as such (items 27 and 28).
        funeralDirectorLicenseNumber:
          type: string
          maxLength: 50
          description: State license number of the funeral director.
        dispositionMethod:
          type: string
          enum:
          - burial
          - cremation
          - entombment
          - donation
          - removal-from-state
          - other
          - ''
          description: 'Method of disposition (item 19): burial, cremation, entombment, donation, removal
            from state, or other.'
        dispositionDate:
          type:
          - string
          - 'null'
          format: date
          description: Date of disposition (item 19).
        dispositionPlace:
          type: string
          description: 'Place of disposition: name of cemetery, crematory, or other place (item 20).'
        filedDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the certificate was filed with the local or state registrar.
        certifiedCopiesRequested:
          type:
          - integer
          - 'null'
          format: int32
          description: Number of certified copies ordered.
        requesterRelationship:
          type: string
          enum:
          - spouse
          - child
          - parent
          - sibling
          - legal-representative
          - funeral-director
          - other
          - ''
          description: Relationship of the person ordering certified copies to the decedent; most states
            restrict who may obtain them.
        requesterIdentityVerified:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the requester's identity and eligibility were verified before certified
            copies were issued.
        feePaidInUsd:
          type:
          - number
          - 'null'
          format: double
          description: Total fee paid in US dollars for the certified copies.
        certifierNote:
          type: string
          description: Free-text note from the certifier or funeral director.
      required:
      - createdAt
      - updatedAt
      - patientId
      - state
      - decedentName
      - sex
      - maritalStatus
      - veteranStatus
      - stateOfResidence
      - placeOfDeathType
      - placeOfDeathFacility
      - certifierName
      - certifierType
      - certifierLicenseNumber
      - attendedDeceased
      - causeIaCondition
      - causeIaInterval
      - causeIbCondition
      - causeIbInterval
      - causeIcCondition
      - causeIcInterval
      - causeIdCondition
      - causeIdInterval
      - partIiConditions
      - autopsyPerformed
      - autopsyFindingsAvailable
      - mannerOfDeath
      - tobaccoUseContributed
      - pregnancyStatus
      - injuryPlace
      - injuryAtWork
      - injuryLocation
      - injuryDescription
      - transportationInjuryRole
      - referredToMedicalExaminer
      - referralReason
      - funeralDirectorName
      - funeralDirectorLicenseNumber
      - dispositionMethod
      - dispositionPlace
      - requesterRelationship
      - requesterIdentityVerified
      - certifierNote
      description: 'Main US Standard Certificate of Death record (NCHS 2003 revision): decedent facts,
        the certifier''s Part I and Part II cause-of-death chain, manner of death, tobacco, pregnancy
        and injury items, medical examiner or coroner referral, the funeral director''s disposition, and
        the certified-copy order. Validity classification, fired rules and flags live in child tables.'
    UnitedStatesStandardCertificateOfDeathGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        unitedStatesStandardCertificateOfDeathId:
          type: string
          format: uuid
          description: Foreign key to the parent certificate (unique, 1:1).
        validityClass:
          type: string
          enum:
          - valid
          - incomplete
          - refer-to-medical-examiner-or-coroner
          - ''
          description: 'Validity classification: valid, incomplete, or refer-to-medical-examiner-or-coroner
            (referral takes precedence).'
        underlyingCause:
          type: string
          description: 'Derived underlying cause of death: the lowest completed Part I line (d, else c,
            else b, else a); empty when Part I is empty.'
        referralIndicated:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether a medical-examiner or coroner referral criterion is indicated (yes/no).
        gradedAt:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the classification.
      required:
      - createdAt
      - updatedAt
      - unitedStatesStandardCertificateOfDeathId
      - validityClass
      - underlyingCause
      - referralIndicated
      - gradedAt
      description: 'Computed completeness and validity-classification result for a US Standard Certificate
        of Death: validity class (valid/incomplete/refer-to-medical-examiner-or-coroner), derived underlying
        cause, and whether a referral criterion is indicated.'
    UnitedStatesStandardCertificateOfDeathGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        unitedStatesStandardCertificateOfDeathGradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        flagId:
          type: string
          maxLength: 50
          description: Stable flag identifier (e.g. F-ME-REFERRAL-001).
        category:
          type: string
          enum:
          - medical-examiner-referral-required
          - mechanism-of-death
          - missing-part-i
          - missing-manner
          - illogical-sequence
          - abbreviation-used
          - nonspecific-cause
          - missing-interval
          - pregnancy-item
          - tobacco-item
          - injury-items
          - manner-mismatch
          - pending-determination
          - incomplete-certifier
          - incomplete-decedent
          - incomplete-funeral-director
          - date-inconsistency
          - filing-deadline
          - disposition
          - certified-copies
          - verify-state-rule
          - other
          - ''
          description: Flag category.
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          - ''
          description: 'Flag priority: low, medium, or high.'
        description:
          type: string
          maxLength: 500
          description: Human-readable description of the flagged issue.
        suggestedAction:
          type: string
          maxLength: 500
          description: Suggested corrective action.
      required:
      - createdAt
      - updatedAt
      - unitedStatesStandardCertificateOfDeathGradeId
      - flagId
      - category
      - priority
      - description
      - suggestedAction
