components:
  schemas:
    AgilePrinciplesAssessment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        respondentId:
          type: string
          format: uuid
          description: Foreign key to the respondent who completed this assessment.
        status:
          type: string
          enum:
          - draft
          - submitted
          - reviewed
          description: 'Lifecycle status: draft, submitted, or reviewed.'
        isAnonymous:
          type: boolean
          description: TRUE when the respondent chose to submit anonymously; renderers must mask name,
            email, and role for these rows.
        assessmentDate:
          type:
          - string
          - 'null'
          format: date
          description: Date on which the assessment was completed.
        assessmentPeriod:
          type: string
          enum:
          - sprint
          - quarter
          - half-year
          - annual
          - ad-hoc
          - ''
          description: 'Cadence of the assessment: sprint, quarter, half-year, annual, or ad-hoc.'
        p01CustomerSatisfaction:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Likert 1-5 for principle 1: highest priority is to satisfy the customer through
            early and continuous delivery of valuable software.'
        p01Comment:
          type: string
          description: Free-text comment for principle 1.
        p01Weight:
          type: number
          format: double
          description: Configurable weight for principle 1, range 0.50-2.00, default 1.00. Affects the
            weighted-mean composite maturity.
        p02WelcomeChange:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Likert 1-5 for principle 2: changing requirements are welcomed, even late in development,
            to harness competitive advantage.'
        p02Comment:
          type: string
          description: Free-text comment for principle 2.
        p02Weight:
          type: number
          format: double
          description: Configurable weight for principle 2, range 0.50-2.00, default 1.00.
        p03DeliverFrequently:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Likert 1-5 for principle 3: deliver working software frequently, within a few
            weeks or months.'
        p03Comment:
          type: string
          description: Free-text comment for principle 3.
        p03Weight:
          type: number
          format: double
          description: Configurable weight for principle 3, range 0.50-2.00, default 1.00.
        p04Collaboration:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Likert 1-5 for principle 4: business stakeholders and developers must work together
            daily.'
        p04Comment:
          type: string
          description: Free-text comment for principle 4.
        p04Weight:
          type: number
          format: double
          description: Configurable weight for principle 4, range 0.50-2.00, default 1.00.
        p05MotivatedIndividuals:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Likert 1-5 for principle 5: build projects around motivated individuals, providing
            them with the environment and support needed.'
        p05Comment:
          type: string
          description: Free-text comment for principle 5.
        p05Weight:
          type: number
          format: double
          description: Configurable weight for principle 5, range 0.50-2.00, default 1.00.
        p06FaceToFace:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Likert 1-5 for principle 6: the most efficient method for conveying information
            within a development team is face-to-face communication.'
        p06Comment:
          type: string
          description: Free-text comment for principle 6.
        p06Weight:
          type: number
          format: double
          description: Configurable weight for principle 6, range 0.50-2.00, default 1.00.
        p07WorkingSoftware:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Likert 1-5 for principle 7: working software is the primary measure of progress.'
        p07Comment:
          type: string
          description: Free-text comment for principle 7.
        p07Weight:
          type: number
          format: double
          description: Configurable weight for principle 7, range 0.50-2.00, default 1.00.
        p08SustainableDevelopment:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Likert 1-5 for principle 8: agile processes promote a sustainable, consistent
            pace for developers and users.'
        p08Comment:
          type: string
          description: Free-text comment for principle 8.
        p08Weight:
          type: number
          format: double
          description: Configurable weight for principle 8, range 0.50-2.00, default 1.00.
        p09TechnicalExcellence:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Likert 1-5 for principle 9: continuous attention to technical excellence and good
            design enhances agility.'
        p09Comment:
          type: string
          description: Free-text comment for principle 9.
        p09Weight:
          type: number
          format: double
          description: Configurable weight for principle 9, range 0.50-2.00, default 1.00.
        p10Simplicity:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Likert 1-5 for principle 10: the art of maximising the amount of work not done
            is essential.'
        p10Comment:
          type: string
          description: Free-text comment for principle 10.
        p10Weight:
          type: number
          format: double
          description: Configurable weight for principle 10, range 0.50-2.00, default 1.00.
        p11SelfOrganisingTeams:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Likert 1-5 for principle 11: the best architectures, requirements, and designs
            emerge from self-organising teams.'
        p11Comment:
          type: string
          description: Free-text comment for principle 11.
        p11Weight:
          type: number
          format: double
          description: Configurable weight for principle 11, range 0.50-2.00, default 1.00.
        p12RegularReflection:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Likert 1-5 for principle 12: at regular intervals, the team reflects on how to
            become more effective, then adjusts behaviour accordingly.'
        p12Comment:
          type: string
          description: Free-text comment for principle 12.
        p12Weight:
          type: number
          format: double
          description: Configurable weight for principle 12, range 0.50-2.00, default 1.00.
        overallNotes:
          type: string
          description: Free-text overall notes captured on the summary step.
      required:
      - createdAt
      - updatedAt
      - respondentId
      - status
      - isAnonymous
      - assessmentPeriod
      - p01Comment
      - p01Weight
      - p02Comment
      - p02Weight
      - p03Comment
      - p03Weight
      - p04Comment
      - p04Weight
      - p05Comment
      - p05Weight
      - p06Comment
      - p06Weight
      - p07Comment
      - p07Weight
      - p08Comment
      - p08Weight
      - p09Comment
      - p09Weight
      - p10Comment
      - p10Weight
      - p11Comment
      - p11Weight
      - p12Comment
      - p12Weight
      - overallNotes
      description: One row per submission. Stores the 12 Agile Manifesto principle Likert scores (1-5,
        nullable when unanswered) and free-text comments per principle. Composite maturity is computed
        in agile_principles_assessment_grade.
    AgilePrinciplesAssessmentGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        agilePrinciplesAssessmentId:
          type: string
          format: uuid
          description: Foreign key to the parent assessment (unique, 1:1).
        answeredCount:
          type: integer
          format: int32
          description: Number of principles (0-12) that received a Likert score.
        meanScore:
          type:
          - number
          - 'null'
          format: double
          description: Unweighted mean of answered principle scores; NULL when fewer than 6 principles
            were answered.
        weightedMeanScore:
          type:
          - number
          - 'null'
          format: double
          description: Weighted mean of answered principle scores using the per-principle weights from
            the assessment row; equals mean_score when no weight is customised. NULL when fewer than 6
            principles were answered.
        weightsCustomised:
          type: boolean
          description: TRUE when at least one principle weight on the assessment differs from the default
            1.00.
        maturity:
          type: string
          enum:
          - optimising
          - mature
          - developing
          - initial
          - ad-hoc
          - insufficient-data
          - ''
          description: 'Composite maturity level: optimising, mature, developing, initial, ad-hoc, or
            insufficient-data.'
        topAction1:
          type: string
          maxLength: 500
          description: First prioritised action drawn from the weakest principles.
        topAction2:
          type: string
          maxLength: 500
          description: Second prioritised action drawn from the weakest principles.
        topAction3:
          type: string
          maxLength: 500
          description: Third prioritised action drawn from the weakest principles.
        coachNotes:
          type: string
          description: Free-text agile-coach notes accompanying the action plan.
        signedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Timestamp of electronic sign-off.
        gradedAt:
          type: string
          format: date-time
          description: Timestamp the engine last computed this result.
      required:
      - createdAt
      - updatedAt
      - agilePrinciplesAssessmentId
      - answeredCount
      - weightsCustomised
      - maturity
      - topAction1
      - topAction2
      - topAction3
      - coachNotes
      - gradedAt
      description: Computed grading and signed-off action plan. One-to-one with agile_principles_assessment.
    AgilePrinciplesAssessmentGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        agilePrinciplesAssessmentGradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade row.
        flagId:
          type: string
          maxLength: 40
          description: Stable flag identifier (e.g. F-BURNOUT-RISK).
        category:
          type: string
          enum:
          - customer-disconnect
          - change-resistance
          - slow-delivery
          - silo-collaboration
          - morale-risk
          - communication-gap
          - output-not-outcome
          - burnout-risk
          - technical-debt
          - over-engineering
          - command-and-control
          - no-retrospective
          - critical-principle-gap
          - insufficient-data
          - other
          - ''
          description: 'Flag category: customer-disconnect, change-resistance, burnout-risk, technical-debt,
            etc.'
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          description: 'Operational priority: low, medium, or high.'
        principleNumber:
          type:
          - integer
          - 'null'
          format: int32
          description: Ordinal 1-12 of the principle that triggered this flag, NULL when the flag is cross-cutting.
        description:
          type: string
          maxLength: 500
          description: Human-readable description of the operational concern.
        suggestedAction:
          type: string
          maxLength: 500
          description: Suggested coaching action to address the flag.
      required:
      - createdAt
      - updatedAt
      - agilePrinciplesAssessmentGradeId
      - flagId
      - category
      - priority
      - description
      - suggestedAction
      description: Operational flags raised by the maturity engine independently of the composite maturity
        level.
    AgilePrinciplesAssessmentGradeRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        agilePrinciplesAssessmentGradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade row.
        ruleId:
          type: string
          maxLength: 40
          description: Stable rule identifier (e.g. R-P09-LOW).
        principleNumber:
          type: integer
          format: int32
          description: Principle ordinal 1-12 as defined in the Agile Manifesto.
        band:
          type: string
          enum:
          - high
          - mid
          - low
          - unanswered
          - ''
          description: 'Band the principle was placed into: high, mid, low, or unanswered.'
        principleSlug:
          type: string
          maxLength: 40
          description: Stable kebab-case slug for the principle (e.g. technical-excellence).
        description:
          type: string
          maxLength: 500
          description: Human-readable description of why the rule fired and its coaching implication.
      required:
      - createdAt
      - updatedAt
      - agilePrinciplesAssessmentGradeId
      - ruleId
      - principleNumber
      - band
      - principleSlug
      - description
      description: Audit trail of every coaching rule fired by the maturity engine, one row per principle
        that was placed into a band (high / mid / low / unanswered).
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          description: A URI identifying the problem type
        title:
          type: string
          description: A short summary of the problem type
        status:
          type: integer
          description: The HTTP status code
        detail:
          type: string
          description: An explanation of this occurrence
        instance:
          type: string
          description: A URI identifying this occurrence
        code:
          type: string
          description: A short machine-readable reason
        errors:
          type: object
          description: Per-field detail, when validation failed
      required:
      - type
      - title
      - status
    Respondent:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        fullName:
          type: string
          maxLength: 255
          description: Full name of the respondent.
        email:
          type: string
          maxLength: 255
          description: Contact email address.
        role:
          type: string
          enum:
          - individual-contributor
          - team-lead
          - scrum-master
          - product-owner
          - engineering-manager
          - agile-coach
          - executive-sponsor
          - other
          - ''
          description: 'Job role: individual-contributor, team-lead, scrum-master, product-owner, engineering-manager,
            agile-coach, executive-sponsor, or other.'
        teamName:
          type: string
          maxLength: 255
          description: Name of the team being assessed.
        organisationName:
          type: string
          maxLength: 255
          description: Name of the broader organisation, division, or programme.
        yearsInAgile:
          type:
          - integer
          - 'null'
          format: int32
          description: Number of years the respondent has worked in agile environments.
      required:
      - createdAt
      - updatedAt
      - fullName
      - email
      - role
      - teamName
      - organisationName
      description: A single person completing an agile-principles assessment. One respondent may submit
        multiple assessments over time.
