          description: 'Care setting: primary-care, ward, emergency-department, antenatal, or other.'
        patient_identifier:
          type: string
          maxLength: 100
          description: Local patient identifier as recorded on the assessment.
        age_band:
          type: string
          enum:
          - 16-39
          - 40-59
          - 60-74
          - 75-plus
          - ''
          description: 'Adult age band: 16-39, 40-59, 60-74, or 75-plus.'
        sex:
          type: string
          enum:
          - female
          - male
          - intersex
          - unknown
          - ''
          description: 'Patient sex recorded for the assessment: female, male, intersex, or unknown.'
        cut_down:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Criterion C — has the patient felt they should cut down on their drinking: yes,
            no, or unanswered.'
        annoyed:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Criterion A — have people annoyed the patient by criticising their drinking: yes,
            no, or unanswered.'
        guilty:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Criterion G — has the patient felt bad or guilty about their drinking: yes, no,
            or unanswered.'
        eye_opener:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Criterion E — has the patient had a morning drink to steady nerves or cure a hangover
            (eye-opener): yes, no, or unanswered.'
        clinical_note:
          type: string
          description: Free-text clinical note recorded with the assessment.
      required:
      - created_at
