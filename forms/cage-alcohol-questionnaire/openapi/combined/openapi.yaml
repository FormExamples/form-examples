components:
  schemas:
    CageAlcoholQuestionnaire:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the patient being screened (delete restricted).
        clinicianId:
          type:
          - string
          - 'null'
          format: uuid
          description: Foreign key to the screening clinician (optional; delete restricted).
        clinicianName:
          type: string
          maxLength: 255
          description: Name of the screening clinician as recorded on the assessment.
        clinicianRole:
          type: string
          enum:
          - doctor
          - nurse
          - midwife
          - other
          - ''
          description: 'Role of the screening clinician: doctor, nurse, midwife, or other.'
        assessedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Date and time the assessment was performed.
        careSetting:
          type: string
          enum:
          - primary-care
          - ward
          - emergency-department
          - antenatal
          - other
          - ''
          description: 'Care setting: primary-care, ward, emergency-department, antenatal, or other.'
        patientIdentifier:
          type: string
          maxLength: 100
          description: Local patient identifier as recorded on the assessment.
        ageBand:
          type: string
          enum:
          - 16-39
          - 40-59
          - 60-74
          - 75-plus
          - ''
          description: 'Adult age band: 16-39, 40-59, 60-74, or 75-plus.'
        sex:
          type: string
          enum:
          - female
          - male
          - intersex
          - unknown
          - ''
          description: 'Patient sex recorded for the assessment: female, male, intersex, or unknown.'
        cutDown:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Criterion C — has the patient felt they should cut down on their drinking: yes,
            no, or unanswered.'
        annoyed:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Criterion A — have people annoyed the patient by criticising their drinking: yes,
            no, or unanswered.'
        guilty:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Criterion G — has the patient felt bad or guilty about their drinking: yes, no,
            or unanswered.'
        eyeOpener:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Criterion E — has the patient had a morning drink to steady nerves or cure a hangover
            (eye-opener): yes, no, or unanswered.'
        clinicalNote:
          type: string
          description: Free-text clinical note recorded with the assessment.
      required:
      - createdAt
      - updatedAt
      - patientId
      - clinicianName
      - clinicianRole
      - careSetting
      - patientIdentifier
      - ageBand
      - sex
      - cutDown
      - annoyed
      - guilty
      - eyeOpener
      - clinicalNote
      description: 'Main CAGE alcohol questionnaire record: assessment context, patient identification,
        and the four scored criterion inputs (cut down, annoyed, guilty, eye-opener).'
    CageAlcoholQuestionnaireGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        cageAlcoholQuestionnaireId:
          type: string
          format: uuid
          description: Foreign key to the parent assessment (unique, 1:1).
        cutDownPoint:
          type:
          - integer
          - 'null'
          format: int32
          description: Point (0-1) awarded for criterion C, cut down.
        annoyedPoint:
          type:
          - integer
          - 'null'
          format: int32
          description: Point (0-1) awarded for criterion A, annoyed.
        guiltyPoint:
          type:
          - integer
          - 'null'
          format: int32
          description: Point (0-1) awarded for criterion G, guilty.
        eyeOpenerPoint:
          type:
          - integer
          - 'null'
          format: int32
          description: Point (0-1) awarded for criterion E, eye-opener.
        totalScore:
          type:
          - integer
          - 'null'
          format: int32
          description: Summed CAGE score across the four criteria (0-4).
        interpretation:
          type: string
          enum:
          - negative
          - positive
          - ''
          description: 'Derived binary interpretation: positive (total >= 2) or negative (total < 2).'
        gradedAt:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the grade.
      required:
      - createdAt
      - updatedAt
      - cageAlcoholQuestionnaireId
      - interpretation
      - gradedAt
      description: 'Computed CAGE grading result: per-criterion points, summed total (0-4), and derived
        binary interpretation (negative/positive) against the >= 2 cut-off.'
    CageAlcoholQuestionnaireGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        cageAlcoholQuestionnaireGradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        flagId:
          type: string
          maxLength: 50
          description: Stable flag identifier (e.g. F-POSITIVE-SCREEN-001).
        category:
          type: string
          enum:
          - positive-screen
          - eye-opener-dependence-marker
          - further-assessment
          - incomplete
          - other
          - ''
          description: Flag category (see CHECK constraint for enumeration).
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          - ''
          description: 'Priority: low, medium, high.'
        description:
          type: string
          maxLength: 500
          description: Human-readable description of what fired the flag.
        suggestedAction:
          type: string
          maxLength: 500
          description: Suggested clinical action (e.g. "undertake a fuller assessment of drinking").
      required:
      - createdAt
      - updatedAt
      - cageAlcoholQuestionnaireGradeId
      - flagId
      - category
      - priority
      - description
      - suggestedAction
      description: Red-flag issues that fire independently of the total score, with priority and a suggested
        action for the clinical team.
    CageAlcoholQuestionnaireGradeRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        cageAlcoholQuestionnaireGradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        ruleId:
          type: string
          maxLength: 40
          description: Stable rule identifier (e.g. R-EYE-OPENER-1POINT-01).
        parameter:
          type: string
          enum:
          - cut-down
          - annoyed
          - guilty
          - eye-opener
          - total
          description: 'Scored criterion the rule belongs to: cut-down, annoyed, guilty, eye-opener, or
            total.'
        points:
          type:
          - integer
          - 'null'
          format: int32
          description: Point (0-1) contributed by this rule for its criterion.
        category:
          type: string
          maxLength: 50
          description: Subject category (e.g. criterion-positive, total-band).
        description:
          type: string
          maxLength: 500
          description: Human-readable description of why the rule fired.
      required:
      - createdAt
      - updatedAt
      - cageAlcoholQuestionnaireGradeId
      - ruleId
      - parameter
      - category
      - description
      description: 'Audit trail of every grading rule that fired during CAGE computation: criterion, point
        contributed, category, and description.'
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Clinician full name.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as a single text block.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code.
        role:
          type: string
          enum:
          - doctor
          - nurse
          - midwife
          - other
          - ''
          description: 'Primary clinical role: doctor, nurse, midwife, or other.'
        registrationBody:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - GPhC
          - other
          - ''
          description: 'Professional registration body: GMC, NMC, HCPC, GPhC, or other.'
        registrationNumber:
          type: string
          description: Professional registration number issued by the registration body.
      required:
      - createdAt
      - updatedAt
      - name
      - role
      - registrationBody
      - registrationNumber
      description: Clinician identifying information for the screening clinician.
    Patient:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          maxLength: 255
          description: Full patient name.
        birthDate:
          type: string
          format: date
          description: Date of birth.
        sex:
          type: string
          enum:
          - female
          - male
          - intersex
          - unknown
          - ''
          description: 'Sex recorded for clinical purposes: female, male, intersex, or unknown.'
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as a single text block.
        countryAsIso31661Alpha2:
          type:
          - string
