      - clinician_name
      - clinician_role
      - care_setting
      - patient_identifier
      - age_band
      - sex
      - cut_down
      - annoyed
      - guilty
      - eye_opener
      - clinical_note
      description: 'Main CAGE alcohol questionnaire record: assessment context, patient identification,
