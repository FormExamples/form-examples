components:
  schemas:
    AnaestheticRecord:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the row was soft-deleted.
        patient_id:
          type: string
          format: uuid
          description: Foreign key to the patient who received the anaesthetic.
        clinician_id:
          type: string
          format: uuid
          description: Foreign key to the responsible anaesthetist (primary author of the record).
        theatre:
          type: string
          maxLength: 100
          description: Theatre or location where the anaesthetic was delivered.
        operation_date:
          type: string
          format: date
          description: Date of the anaesthetic.
        anaesthetist_name:
          type: string
          maxLength: 255
          description: Name of the responsible anaesthetist as recorded on the chart.
        assistant_name:
          type: string
          maxLength: 255
          description: Name of the ODP or anaesthetic assistant.
        surgeon_name:
          type: string
          maxLength: 255
          description: Name of the operating surgeon.
        planned_procedure:
          type: string
          description: Planned operation or procedure.
        urgency:
          type: string
          enum:
          - elective
          - urgent
          - emergency
          - immediate
          - ''
          description: 'Case urgency: elective, urgent, emergency, or immediate.'
        machine_checked:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Whether the anaesthetic machine check was performed: yes or no.'
        who_sign_in:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Whether the WHO Sign In was performed: yes or no.'
        who_time_out:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Whether the WHO Time Out was performed: yes or no.'
        consent_confirmed:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Whether consent was confirmed: yes or no.'
        fasting_confirmed:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Whether fasting status was confirmed: yes or no.'
        iv_access:
          type: string
          description: Intravenous access sites established.
        allergy_band_checked:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Whether the allergy band was checked: yes or no.'
        documented_allergies:
          type: string
          description: Documented allergies used for the drug allergy-conflict safety check.
        asa_status:
          type: string
          enum:
          - I
          - II
          - III
          - IV
          - V
          - VI
          - ''
          description: 'ASA Physical Status classification: I, II, III, IV, V, or VI.'
        asa_emergency_modifier:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Whether the ASA E (emergency) modifier applies: yes or no.'
        mallampati_class:
          type: integer
          format: int32
          description: Modified Mallampati class (1-4).
        mouth_opening_cm:
          type: number
          format: double
          description: Inter-incisor gap (mouth opening) in centimetres.
        thyromental_distance_cm:
          type: number
          format: double
