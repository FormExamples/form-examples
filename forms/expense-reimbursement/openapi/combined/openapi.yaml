components:
  schemas:
    ExpenseReimbursement:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        workerId:
          type: string
          format: uuid
          description: Foreign key to the worker table.
        managerId:
          type: string
          format: uuid
          description: Foreign key to the manager table.
        status:
          type: string
          enum:
          - draft
          - submitted
          - under-review
          - approved
          - partially-approved
          - rejected
          - paid
          - withdrawn
          - ''
          description: Lifecycle status of this row.
        claimDate:
          type:
          - string
          - 'null'
          format: date
          description: Claim date.
        claimPeriodStartDate:
          type:
          - string
          - 'null'
          format: date
          description: Claim period start date.
        claimPeriodEndDate:
          type:
          - string
          - 'null'
          format: date
          description: Claim period end date.
        claimTitle:
          type: string
          maxLength: 255
          description: Claim title.
        businessPurpose:
          type: string
          description: Business purpose.
        projectOrCostCode:
          type: string
          maxLength: 64
          description: Project or cost code.
        currencyAsIso4217:
          type: string
          maxLength: 3
          description: Currency as iso 4217.
        totalAmount:
          type:
          - number
          - 'null'
          format: double
          description: Total amount.
        totalVatAmount:
          type:
          - number
          - 'null'
          format: double
          description: Total vat amount.
        advanceAlreadyReceivedAmount:
          type:
          - number
          - 'null'
          format: double
          description: Advance already received amount.
        amountToRepay:
          type:
          - number
          - 'null'
          format: double
          description: Amount to repay.
        repaymentMethod:
          type: string
          enum:
          - payroll
          - bank-transfer
          - cheque
          - cash
          - other
          - ''
          description: 'Repayment method. One of: payroll, bank-transfer, cheque, cash, other.'
        bankAccountName:
          type: string
          maxLength: 255
          description: Bank account name.
        bankAccountLastFour:
          type:
          - string
          - 'null'
          maxLength: 4
          description: Bank account last four.
        declarationExpensesWereIncurredWhollyForWork:
          type: boolean
          description: Declaration expenses were incurred wholly for work.
        declarationNoDuplicateClaim:
          type: boolean
          description: Declaration no duplicate claim.
        declarationReceiptsAttached:
          type: boolean
          description: Declaration receipts attached.
        declarationSignedName:
          type: string
          maxLength: 255
          description: Declaration signed name.
        declarationSignedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Declaration signed at.
      required:
      - createdAt
      - updatedAt
      - workerId
      - managerId
      - status
      - claimTitle
      - businessPurpose
      - projectOrCostCode
      - currencyAsIso4217
      - repaymentMethod
      - bankAccountName
      - declarationExpensesWereIncurredWhollyForWork
      - declarationNoDuplicateClaim
      - declarationReceiptsAttached
      - declarationSignedName
      description: 'Expense reimbursement claim: a worker asks the employer to repay money the worker
        spent personally on work-related expenses.'
    ExpenseReimbursementGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        expenseReimbursementId:
          type: string
          format: uuid
          description: Foreign key to the expense_reimbursement table.
        complianceBand:
          type: string
          enum:
          - compliant
          - needs-review
          - likely-ineligible
          - ''
          description: 'Compliance band. One of: compliant, needs-review, likely-ineligible.'
        completenessPercent:
          type:
          - integer
          - 'null'
          format: int32
          description: Completeness percent.
        approvalTier:
          type: string
          enum:
