components:
  schemas:
    AgileConsultingScorecardForHiringHelp:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        organizationId:
          type: string
          format: uuid
          description: Foreign key to the organization being assessed.
        respondentId:
          type: string
          format: uuid
          description: Foreign key to the respondent who filled out the scorecard.
        status:
          type: string
          enum:
          - draft
          - in-progress
          - submitted
          - finalized
          - cancelled
          description: 'Lifecycle status: draft, in-progress, submitted, finalized, cancelled.'
        assessmentDate:
          type: string
          format: date
          description: Date the scorecard was completed (defaults to today).
        submittedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Timestamp the respondent submitted the scorecard.
        finalizedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Timestamp the scorecard was finalized (signed off).
        m1Done:
          type:
          - boolean
          - 'null'
          description: 'Manifesto 1 (Individuals and interactions): every leader is in conversation with
            customers >=1 hour/week, with weekly results radiated to stakeholders. NULL = unanswered.'
        m1Evidence:
          type: string
          description: 'Manifesto 1: free-text evidence supporting the answer.'
        m2Done:
          type:
          - boolean
          - 'null'
          description: 'Manifesto 2 (Working software): the team has launched a brand-new "hello world"
            program to production and discussed the experience. NULL = unanswered.'
        m2Evidence:
          type: string
          description: 'Manifesto 2: free-text evidence supporting the answer.'
        m3Done:
          type:
          - boolean
          - 'null'
          description: 'Manifesto 3 (Customer collaboration): the organization has bought copies of the
            customer''s favourite book and shared with the team (org spend, not personal). NULL = unanswered.'
        m3Evidence:
          type: string
          description: 'Manifesto 3: free-text evidence supporting the answer.'
        m4Done:
          type:
          - boolean
          - 'null'
          description: 'Manifesto 4 (Responding to change): every senior leader (BoD/CXO/VP/Dir) has read
            one agile change-management book and shared three takeaways. NULL = unanswered.'
        m4Evidence:
          type: string
          description: 'Manifesto 4: free-text evidence supporting the answer.'
        p1Done:
          type:
          - boolean
          - 'null'
          description: 'Principle 1 (Customer satisfaction): every product lead measures customer Net
            Promoter Score (NPS). NULL = unanswered.'
        p1Evidence:
          type: string
          description: 'Principle 1: free-text evidence supporting the answer.'
        p2Done:
          type:
          - boolean
          - 'null'
          description: 'Principle 2 (Welcome change): the "hello world" program has been internationalized
            to >=1 additional language using the user locale. NULL = unanswered.'
        p2Evidence:
          type: string
          description: 'Principle 2: free-text evidence supporting the answer.'
        p3Done:
          type:
          - boolean
          - 'null'
          description: 'Principle 3 (Deliver frequently): the internationalized "hello world" version
            has been launched to production and verified by a native speaker. NULL = unanswered.'
        p3Evidence:
          type: string
          description: 'Principle 3: free-text evidence supporting the answer.'
        p4Done:
          type:
          - boolean
          - 'null'
          description: 'Principle 4 (Business and developers together): commitment is in place from every
            product/project/programme/practice lead. NULL = unanswered.'
        p4Evidence:
          type: string
          description: 'Principle 4: free-text evidence supporting the answer.'
        p5Done:
          type:
          - boolean
          - 'null'
          description: 'Principle 5 (Motivated individuals): a 3-amigos team (business+dev+test) has shipped
            a real new MVP within 30 days and on budget. NULL = unanswered.'
        p5Evidence:
          type: string
          description: 'Principle 5: free-text evidence supporting the answer.'
        p6Done:
          type:
          - boolean
          - 'null'
          description: 'Principle 6 (Face-to-face): every product owner has committed to >=50% face-to-face
            time (or weekly-video equivalent for remote teams). NULL = unanswered.'
        p6Evidence:
          type: string
          description: 'Principle 6: free-text evidence supporting the answer.'
        p7Done:
          type:
          - boolean
          - 'null'
          description: 'Principle 7 (Working software is primary measure): a new "fizz buzz" program has
            been created and shipped to production. NULL = unanswered.'
        p7Evidence:
          type: string
          description: 'Principle 7: free-text evidence supporting the answer.'
        p8Done:
          type:
          - boolean
          - 'null'
          description: 'Principle 8 (Sustainable pace): all staff have a sustaining budget for >=1 year
            secured. NULL = unanswered.'
        p8Evidence:
          type: string
          description: 'Principle 8: free-text evidence supporting the answer.'
        p9Done:
          type:
          - boolean
          - 'null'
          description: 'Principle 9 (Technical excellence): quality-attribute metrics are wired into pre-commit
            hooks and CI. NULL = unanswered.'
        p9Evidence:
          type: string
          description: 'Principle 9: free-text evidence supporting the answer.'
        p10Done:
          type:
          - boolean
          - 'null'
          description: 'Principle 10 (Simplicity): every product team has >=2 people with process-improvement
            skills (Lean/Six Sigma/VSM/TPS/TPC). NULL = unanswered.'
        p10Evidence:
          type: string
          description: 'Principle 10: free-text evidence supporting the answer.'
        p11Done:
          type:
          - boolean
          - 'null'
          description: 'Principle 11 (Self-organizing teams): a 5-point Likert "our team is self-organizing"
            averages "Agree" or better. NULL = unanswered.'
        p11Evidence:
          type: string
          description: 'Principle 11: free-text evidence supporting the answer.'
        p12Done:
          type:
          - boolean
          - 'null'
          description: 'Principle 12 (Reflection): every leader has shared their previous 2 retrospectives
            with all stakeholders. NULL = unanswered.'
        p12Evidence:
          type: string
          description: 'Principle 12: free-text evidence supporting the answer.'
      required:
      - createdAt
      - updatedAt
      - organizationId
      - respondentId
      - status
      - assessmentDate
      - m1Evidence
      - m2Evidence
      - m3Evidence
      - m4Evidence
      - p1Evidence
      - p2Evidence
      - p3Evidence
      - p4Evidence
      - p5Evidence
      - p6Evidence
      - p7Evidence
      - p8Evidence
      - p9Evidence
      - p10Evidence
      - p11Evidence
      - p12Evidence
      description: A single agile-consulting readiness scorecard for an organization, captured via a 6-step
        single-page wizard. Holds organization/respondent FKs, the 16 yes/no items (4 manifesto + 12 principles),
        and per-item evidence text. Computed scores live in the *_grade child table.
    AgileConsultingScorecardForHiringHelpGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        scoreTotal:
          type:
          - integer
          - 'null'
          format: int32
          description: Total points across all 16 items, 0 to 16. One point per "yes" answer.
        manifestoSubtotal:
          type:
          - integer
          - 'null'
          format: int32
          description: Subtotal across the four Manifesto items (m1..m4), 0 to 4.
        principlesSubtotal:
          type:
          - integer
          - 'null'
          format: int32
          description: Subtotal across the twelve Principles items (p1..p12), 0 to 12.
        computedBand:
          type: string
          enum:
          - low
          - borderline
          - medium
          - high
          - ''
          description: 'Readiness band computed by the engine: low (0-4), borderline (5), medium (6-10),
            high (11-16).'
        finalBand:
          type: string
          enum:
          - low
          - borderline
          - medium
          - high
          - ''
          description: Readiness band signed off by the respondent or sponsor (may equal or differ from
            computed).
        overrideReason:
          type: string
          maxLength: 500
          description: Reason the final band differs from the computed band (mandatory when they differ).
        recommendation:
          type: string
          enum:
          - do-not-hire-yet
          - do-homework-first
          - trial-engagement
          - hire-with-focus-areas
          - reassess-in-3-months
          - ''
          description: 'Procurement recommendation: do-not-hire-yet, do-homework-first, trial-engagement,
            hire-with-focus-areas, reassess-in-3-months.'
        recommendedFocusAreas:
          type: string
          description: Free-text list of focus areas the consultant should prioritize, derived from any
            flags that fired.
        reviewNotes:
          type: string
          description: Free-text reviewer summary notes.
        signedBy:
          type: string
