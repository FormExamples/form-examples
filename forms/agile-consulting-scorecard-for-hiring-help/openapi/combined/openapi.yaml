          - in-progress
          - submitted
          - finalized
          - cancelled
          description: 'Lifecycle status: draft, in-progress, submitted, finalized, cancelled.'
        assessment_date:
          type: string
          format: date
          description: Date the scorecard was completed (defaults to today).
