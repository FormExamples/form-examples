      - p11_evidence
      - p12_evidence
      description: A single agile-consulting readiness scorecard for an organization, captured via a 6-step
        single-page wizard. Holds organization/respondent FKs, the 16 yes/no items (4 manifesto + 12 principles),
        and per-item evidence text. Computed scores live in the *_grade child table.
    AgileConsultingScorecardForHiringHelpGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        agile_consulting_scorecard_id:
          type: string
          format: uuid
          description: Foreign key to the parent agile_consulting_scorecard_for_hiring_help row (unique,
            1:1).
        score_total:
          type: integer
          format: int32
          description: Total points across all 16 items, 0 to 16. One point per "yes" answer.
        manifesto_subtotal:
          type: integer
          format: int32
          description: Subtotal across the four Manifesto items (m1..m4), 0 to 4.
        principles_subtotal:
          type: integer
          format: int32
          description: Subtotal across the twelve Principles items (p1..p12), 0 to 12.
        computed_band:
          type: string
          enum:
          - low
          - borderline
          - medium
          - high
          - ''
          description: 'Readiness band computed by the engine: low (0-4), borderline (5), medium (6-10),
            high (11-16).'
        final_band:
          type: string
          enum:
          - low
          - borderline
          - medium
          - high
          - ''
          description: Readiness band signed off by the respondent or sponsor (may equal or differ from
            computed).
        override_reason:
          type: string
          maxLength: 500
          description: Reason the final band differs from the computed band (mandatory when they differ).
        recommendation:
          type: string
          enum:
          - do-not-hire-yet
          - do-homework-first
          - trial-engagement
          - hire-with-focus-areas
          - reassess-in-3-months
          - ''
          description: 'Procurement recommendation: do-not-hire-yet, do-homework-first, trial-engagement,
            hire-with-focus-areas, reassess-in-3-months.'
        recommended_focus_areas:
          type: string
          description: Free-text list of focus areas the consultant should prioritize, derived from any
            flags that fired.
        review_notes:
          type: string
          description: Free-text reviewer summary notes.
        signed_by:
          type: string
          maxLength: 255
          description: Name or identifier of the person who signed off the grade.
        signed_at:
          type: string
          format: date-time
          description: Timestamp of the electronic signature.
        graded_at:
          type: string
          format: date-time
