logger:
  enable: true
  pretty_backtrace: true
  level: debug
  format: compact

server:
  port: 5230
  host: http://localhost
  middlewares:
    static:
      enable: false
      must_exist: false
      precompressed: false
      folder:
        uri: "/static"
        path: "assets/static"
    cors:
      enable: true
      allow_origins:
        - http://localhost:5230

workers:
  mode: BackgroundQueue

queue:
  kind: Postgres
  uri: postgres://postgres:postgres@localhost:5432/advance_statement_about_care_development
  dangerously_flush: false
  num_workers: 2

database:
  uri: postgres://postgres:postgres@localhost:5432/advance_statement_about_care_development
  enable_logging: false
  connect_timeout: 500
  idle_timeout: 500
  min_connections: 1
  max_connections: 1
  auto_migrate: true
