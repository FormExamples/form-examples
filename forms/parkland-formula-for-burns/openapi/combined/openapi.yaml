        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        name:
          type: string
          description: Clinician full name as recorded in the rota.
        email:
          type: string
          description: Email address.
        phone:
          type: string
          description: Phone number.
        postal_address_as_full_text:
          type: string
          description: Postal address as a single text block.
        country_as_iso_3166_1_alpha_2:
          type: string
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2.
        postcode:
          type: string
          description: Postal code.
        role:
          type: string
          enum:
          - emergency-physician
          - burns-surgeon
          - intensivist
          - anaesthetist
          - emergency-nurse
          - burns-nurse
          - paramedic
          - retrieval-clinician
          - other
          - ''
          description: 'Primary clinical role: emergency-physician, burns-surgeon, intensivist, anaesthetist,
            emergency-nurse, burns-nurse, paramedic, retrieval-clinician, or other.'
        registration_body:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - GPhC
          - other
          - ''
          description: 'Professional registration body: GMC, NMC, HCPC, GPhC, or other.'
        registration_number:
          type: string
          description: Professional registration number issued by the registration body.
      required:
      - created_at
      - updated_at
      - name
      - role
      - registration_body
      - registration_number
      description: Clinician identifying information for the staff recording a Parkland-formula burns
        fluid-resuscitation calculation.
    ParklandFormulaForBurns:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the row was soft-deleted.
        patient_id:
          type: string
          format: uuid
          description: Foreign key to the patient this calculation is for (restricted delete).
        clinician_id:
          type: string
          format: uuid
          description: Foreign key to the clinician who recorded the calculation (optional, restricted
            delete).
        clinician_name:
          type: string
          maxLength: 255
          description: Assessing clinician name as recorded on the form.
        clinician_role:
          type: string
          enum:
          - doctor
          - nurse
          - paramedic
          - other
          - ''
          description: 'Assessing clinician role: doctor, nurse, paramedic, or other.'
        care_setting:
          type: string
          enum:
          - emergency-department
          - burns-unit
          - intensive-care
          - retrieval
          - other
          - ''
          description: 'Care setting: emergency-department, burns-unit, intensive-care, retrieval, or
            other.'
        assessed_at:
          type: string
          format: date-time
          description: Date and time the calculation was assessed (used with injury_at to derive hours
            since injury).
        patient_identifier:
          type: string
          maxLength: 100
          description: Local patient identifier as recorded on the form.
        age_band:
          type: string
          enum:
          - adult
          - child
          - ''
          description: 'Age band that selects the major-burn referral threshold: adult (>=15% TBSA) or
            child (>=10% TBSA).'
        sex:
          type: string
          enum:
          - female
          - male
          - intersex
          - unknown
          - ''
          description: 'Patient sex recorded for clinical purposes: female, male, intersex, or unknown.'
        weight_kg:
          type: number
          format: double
          description: Body weight in kilograms used in the Parkland formula (null when unanswered).
        tbsa_percent:
          type: number
          format: double
          description: Percentage total body surface area burned (partial-thickness or deeper; superficial
            excluded), 0-100 (null when unanswered).
        tbsa_method:
          type: string
          enum:
          - rule-of-nines
          - lund-browder
          - other
          - ''
          description: 'Method used to estimate %TBSA: rule-of-nines, lund-browder, or other.'
        injury_at:
          type: string
          format: date-time
          description: Date and time the burn occurred; the 8h/16h phase split is measured from this instant
            (null when unanswered).
        injury_time_known:
          type: string
          enum:
          - known
          - estimated
          - ''
          description: Whether the time of injury is known or estimated.
        inhalation_suspected:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Whether inhalation / airway injury is suspected: yes or no.'
        circumferential_or_deep:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Whether a circumferential or deep burn is present (escharotomy risk): yes or no.'
        mechanism:
          type: string
          enum:
          - thermal
          - electrical
          - chemical
          - other
          - ''
          description: 'Burn mechanism: thermal, electrical, chemical, or other.'
      required:
      - created_at
      - updated_at
      - patient_id
      - clinician_name
      - clinician_role
      - care_setting
      - patient_identifier
      - age_band
      - sex
      - tbsa_method
      - injury_time_known
      - inhalation_suspected
      - circumferential_or_deep
      - mechanism
      description: 'Main Parkland-formula burns record: context and identification, plus the body weight,
        %TBSA, and time-of-injury inputs and the injury-feature flags.'
    ParklandFormulaForBurnsGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the row was soft-deleted.
        parkland_formula_for_burns_id:
          type: string
          format: uuid
          description: Foreign key to the parent calculation record (unique, 1:1).
        total_24h_volume_ml:
          type: number
          format: double
          description: 'Total 24-hour crystalloid volume in mL: 4 x weight_kg x tbsa_percent (null when
            weight or %TBSA is missing).'
        first_8h_volume_ml:
          type: number
          format: double
          description: 'First-8-hour phase volume in mL: half of the total 24-hour volume (null when the
            total is null).'
        next_16h_volume_ml:
          type: number
          format: double
          description: 'Next-16-hour phase volume in mL: half of the total 24-hour volume (null when the
            total is null).'
        hours_since_injury:
          type: number
          format: double
          description: Hours elapsed from time of injury to assessment, clamped at >= 0 (null when injury_at
            or assessed_at is missing).
        remaining_first_8h_hours:
          type: number
          format: double
          description: 'Hours remaining in the first-8-hour window from injury: max(8 - hours_since_injury,
            0); defaults to 8 when hours_since_injury is unknown.'
        first_8h_rate_ml_h:
          type: number
          format: double
          description: 'First-phase infusion rate in mL/hour: first_8h_volume_ml / remaining_first_8h_hours
            (null when overdue, i.e. the first-8-hour window has passed).'
        next_16h_rate_ml_h:
          type: number
          format: double
          description: 'Second-phase infusion rate in mL/hour: next_16h_volume_ml / 16 (null when the
            next-16-hour volume is null).'
        urine_output_target_min_ml_h:
          type: number
          format: double
          description: 'Lower urine-output titration target in mL/hour: 0.5 x weight_kg (null when weight
            is missing).'
        urine_output_target_max_ml_h:
          type: number
          format: double
          description: 'Upper urine-output titration target in mL/hour: 1.0 x weight_kg (null when weight
            is missing).'
        graded_at:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the result.
      required:
      - created_at
      - updated_at
      - parkland_formula_for_burns_id
      - graded_at
      description: 'Computed Parkland-formula result: total 24-hour volume, phase volumes and rates (time-offset),
        and the urine-output titration band (1:1 with the parent calculation record).'
    ParklandFormulaForBurnsGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the row was soft-deleted.
        parkland_formula_for_burns_grade_id:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        flag_id:
          type: string
          maxLength: 50
          description: Stable flag identifier (e.g. F-MAJOR-BURN-REFERRAL-001).
        category:
          type: string
          enum:
          - major-burn-referral
          - inhalation-airway
          - escharotomy
          - resuscitation-overdue
          - titrate-to-urine-output
          - special-mechanism
          - incomplete
          - other
          - ''
          description: 'Flag category: major-burn-referral, inhalation-airway, escharotomy, resuscitation-overdue,
            titrate-to-urine-output, special-mechanism, incomplete, or other.'
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          - ''
          description: 'Priority: low, medium, high.'
        description:
          type: string
          maxLength: 500
          description: Human-readable description of what fired the flag.
        suggested_action:
          type: string
          maxLength: 500
          description: Suggested clinical action (e.g. "refer to a specialist burns service and commence
            formal resuscitation").
      required:
