        '404':
          description: ReturnToWork not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: This client sent too many requests
          headers:
            retry-after:
              description: Seconds to wait before sending again
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Full name of the clinician.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Practice or clinic postal address.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code.
        role:
          type: string
          enum:
          - gp
          - occupational-health-physician
          - hospital-consultant
          - specialty-registrar
          - nurse
          - pharmacist
          - physiotherapist
          - occupational-therapist
          - other
          - ''
          description: 'Clinician role: gp, occupational-health-physician, hospital-consultant, specialty-registrar,
            nurse, pharmacist, physiotherapist, occupational-therapist, or other.'
        registrationBody:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - GPhC
          - GOC
          - other
          - ''
          description: 'Professional registration body: GMC, NMC, HCPC, GPhC, GOC, or other.'
        registrationNumber:
          type: string
          description: Professional registration number from the registration body.
        siteName:
          type: string
          maxLength: 255
          description: Name of the clinic, practice, or hospital where the assessment was performed.
        practiceOdsCode:
          type: string
          maxLength: 10
          description: NHS ODS code for the issuing practice or organisation.
        unitedKingdomNhsNumber:
          type:
          - string
          - 'null'
          maxLength: 12
          description: United Kingdom NHS number of the clinician (where they are also a patient on the
            same system).
      required:
      - createdAt
      - updatedAt
      - name
      - role
      - registrationBody
      - registrationNumber
      - siteName
      - practiceOdsCode
      description: Clinician issuing the Return to Work statement (GP, OH physician, hospital doctor,
        registered nurse, pharmacist, physiotherapist, or occupational therapist authorised under the
        UK fit-note scheme).
    Employer:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          maxLength: 255
          description: Registered employer name.
        industrySector:
          type: string
          enum:
          - agriculture
          - construction
          - education
          - energy-utilities
          - finance-insurance
          - food-hospitality
          - government
          - healthcare
          - information-technology
          - manufacturing
          - mining
          - professional-services
          - public-safety-emergency
          - retail
          - transport-logistics
          - aviation
          - rail
          - maritime
          - media
          - other
          - ''
          description: Industry sector for risk-assessment and RIDDOR context.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Employer postal address as full text.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code.
        occupationalHealthContactName:
          type: string
          description: Name of the employer occupational-health contact.
        occupationalHealthContactEmail:
          type: string
          description: Email of the employer occupational-health contact.
        occupationalHealthContactPhone:
          type: string
          description: Phone of the employer occupational-health contact.
        hrContactName:
          type: string
          description: Name of the employer HR contact.
        hrContactEmail:
          type: string
          description: Email of the employer HR contact.
      required:
      - createdAt
      - updatedAt
      - name
      - industrySector
      - occupationalHealthContactName
      - occupationalHealthContactEmail
      - occupationalHealthContactPhone
      - hrContactName
      - hrContactEmail
      description: Employer of the patient. Recipient of the Statement of Fitness for Work.
    Patient:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          maxLength: 255
          description: Full legal name as it appears on identification.
        birthDate:
          type: string
          format: date
          description: Date of birth.
        sex:
          type: string
          enum:
          - female
          - male
          - intersex
          - unknown
          - prefer-not-to-say
          - ''
          description: Sex recorded at birth for clinical purposes.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as full text.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code.
        unitedKingdomNhsNumber:
          type:
          - string
          - 'null'
          maxLength: 20
          description: United Kingdom NHS number, unique per person.
        jobTitle:
          type: string
          maxLength: 255
          description: Patient job title (e.g. Software Engineer, Healthcare Assistant).
        roleDescription:
          type: string
          description: Free-text description of the patient day-to-day duties.
        contractedHoursPerWeek:
          type:
          - number
          - 'null'
          format: double
          description: Contracted hours per week (full-time UK baseline 37.5).
        shiftPattern:
          type: string
          enum:
          - day
          - night
          - rotating
          - on-call
          - irregular
          - fixed
          - ''
          description: 'Shift pattern: day, night, rotating, on-call, irregular, or fixed.'
        safetyCriticalRole:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the role is safety-critical (aviation, rail, healthcare, emergency response,
            etc.).
        dvlaGroup1LicenceHeld:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the patient holds a DVLA Group 1 (car / motorcycle) licence.
        dvlaGroup2LicenceHeld:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the patient holds a DVLA Group 2 (HGV / PCV) licence.
      required:
      - createdAt
      - updatedAt
      - name
      - birthDate
      - sex
      - jobTitle
      - roleDescription
      - shiftPattern
      - safetyCriticalRole
      - dvlaGroup1LicenceHeld
      - dvlaGroup2LicenceHeld
      description: Patient (the employee) whose return to work is being assessed.
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          description: A URI identifying the problem type
        title:
          type: string
          description: A short summary of the problem type
        status:
          type: integer
          description: The HTTP status code
        detail:
          type: string
          description: An explanation of this occurrence
        instance:
          type: string
          description: A URI identifying this occurrence
        code:
          type: string
          description: A short machine-readable reason
        errors:
          type: object
          description: Per-field detail, when validation failed
      required:
      - type
      - title
      - status
    ReturnToWork:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the patient (employee) being assessed.
        clinicianId:
          type: string
          format: uuid
          description: Foreign key to the clinician issuing the statement.
        employerId:
          type:
          - string
          - 'null'
          format: uuid
          description: Foreign key to the employer receiving the statement.
        status:
          type: string
          enum:
          - draft
          - submitted
          - reviewed
          - cancelled
          - superseded
          description: 'Lifecycle status: draft, submitted, reviewed, cancelled, or superseded.'
        statementKind:
          type: string
          enum:
          - fit-note
          - medical-clearance-letter
          - specialist-report
          - ''
          description: 'Statement output style: fit-note (UK Med 3), medical-clearance-letter, or specialist-report.'
        assessmentDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the assessment was performed.
        assessmentTime:
          type:
          - string
          - 'null'
          format: time
          description: Time the assessment was performed.
        absenceFirstDay:
          type:
          - string
          - 'null'
          format: date
          description: First calendar day of the current absence.
        absenceTotalCalendarDays:
          type:
          - integer
          - 'null'
          format: int32
          description: Total calendar days absent as of the assessment.
        priorMed3Reference:
          type: string
          maxLength: 50
          description: Reference identifier of an earlier Med 3 if this is a continuation.
        priorSelfCertificationReference:
          type: string
          maxLength: 50
          description: Reference identifier of an earlier SC2 self-certification if one was filed.
        primaryDiagnosisText:
          type: string
          maxLength: 500
          description: Free-text primary diagnosis as it will appear on the fit note.
        primaryDiagnosisSnomed:
          type: string
          maxLength: 20
          description: SNOMED CT concept ID for the primary diagnosis.
        primaryDiagnosisIcd10:
          type: string
          maxLength: 10
          description: ICD-10 code for the primary diagnosis.
        comorbidConditions:
          type: string
          description: Free-text list of comorbid conditions relevant to the return-to-work decision.
        mechanism:
          type: string
          enum:
          - illness
          - injury
          - surgery
          - mental-health
          - pregnancy-related
          - cancer-treatment
          - other
          - ''
          description: 'Mechanism of absence: illness, injury, surgery, mental-health, pregnancy-related,
            cancer-treatment, or other.'
        workplaceCause:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the absence has a workplace cause (triggers RIDDOR check).
        riddorReference:
          type: string
          maxLength: 50
          description: RIDDOR report reference if one has been filed by the employer.
        currentMedications:
          type: string
          description: Current medications relevant to the return-to-work assessment.
        ongoingTherapy:
          type: string
          description: Ongoing non-pharmacological therapy (physiotherapy, counselling, specialist follow-up).
        lastConsultationDate:
          type:
          - string
          - 'null'
          format: date
          description: Date of the most recent consultation before this assessment.
        anticipatedRecoveryTrajectory:
          type: string
          enum:
          - full-recovery-imminent
          - full-recovery-expected
          - partial-recovery-expected
          - chronic-managed
          - progressive
          - palliative
          - ''
          description: 'Anticipated trajectory: full-recovery-imminent, full-recovery-expected, partial-recovery-expected,
            chronic-managed, progressive, or palliative.'
        specialistFollowupRequired:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether specialist follow-up is required before the next review.
        mobility:
          type: string
          enum:
          - normal
          - reduced
          - severely-limited
          - wheelchair
          - ''
          description: 'Mobility: normal, reduced, severely-limited, or wheelchair.'
        manualHandlingCapacityKg:
          type:
          - number
          - 'null'
          format: double
          description: Maximum safe manual-handling load in kilograms.
        cognition:
          type: string
          enum:
          - normal
          - mildly-impaired
          - moderately-impaired
          - severely-impaired
          - ''
          description: 'Cognition: normal, mildly-impaired, moderately-impaired, or severely-impaired.'
        mood:
          type: string
          enum:
          - stable
          - low
          - anxious
          - agitated
          - crisis
          - ''
          description: 'Mood: stable, low, anxious, agitated, or crisis.'
        sleep:
          type: string
          enum:
          - normal
          - disturbed
          - severely-disturbed
          - ''
          description: 'Sleep: normal, disturbed, or severely-disturbed.'
        painScore010:
          type:
          - integer
          - 'null'
          format: int32
          description: Patient-reported pain on a 0-10 numeric rating scale.
        drivingCapacity:
          type: string
          enum:
          - fit-to-drive
          - restricted
          - not-fit-to-drive
          - ''
          description: 'Driving capacity: fit-to-drive, restricted, or not-fit-to-drive.'
        standingToleranceMinutes:
          type:
          - integer
          - 'null'
          format: int32
          description: Continuous standing tolerance in minutes.
        sittingToleranceMinutes:
          type:
          - integer
          - 'null'
          format: int32
          description: Continuous sitting tolerance in minutes.
        screenToleranceMinutes:
          type:
          - integer
          - 'null'
          format: int32
          description: Continuous screen-use tolerance in minutes.
        adlIndependence:
          type: string
          enum:
          - independent
          - minor-help
          - major-help
          - dependent
          - ''
          description: 'Independence in activities of daily living: independent, minor-help, major-help,
            or dependent.'
        fitnessStatementComputed:
          type: string
          enum:
          - fit
          - may-be-fit
          - not-fit
          - ''
          description: Engine-computed fitness statement before clinician override.
        fitnessStatementFinal:
          type: string
          enum:
          - fit
          - may-be-fit
          - not-fit
          - ''
          description: Final fitness statement after any clinician override.
        clinicianOverride:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the clinician overrode the computed fitness statement.
        clinicianOverrideReason:
          type: string
          description: Documented reason for any clinician override.
        clinicianConfidence:
          type: string
          enum:
          - high
          - medium
          - low
          - ''
          description: 'Clinician confidence in the statement: high, medium, or low.'
        validFrom:
          type:
          - string
          - 'null'
          format: date
          description: First date the statement is valid.
        validUntil:
          type:
          - string
          - 'null'
          format: date
          description: Last date the statement is valid.
        validityWeeks:
          type:
          - integer
          - 'null'
          format: int32
          description: Number of weeks the statement is valid (alternative expression of valid_until).
        reassessmentRequired:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the patient must be reassessed at expiry.
        phasedReturnApplicable:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether a phased return is recommended.
        phasedReturnTemplate:
          type: string
          enum:
          - 2-week
          - 4-week
          - 8-week
          - 12-week
          - custom
          - ''
          description: 'Selected phased-return template: 2-week, 4-week, 8-week, 12-week, or custom.'
        phasedReturnTargetDate:
          type:
          - string
          - 'null'
          format: date
          description: Target date for full-hours resumption.
        phasedReturnScheduleJson:
          type: array
          description: Ordered list of {week, hoursPerWeek, daysPerWeek, notes} entries.
        phasedReturnSupportContact:
          type: string
          description: Workplace support contact during the phased return.
        workstationReviewRequired:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether a workstation / ergonomic review is required before return.
        additionalAdjustmentsText:
          type: string
          description: Free-text additional workplace adjustments not captured in the enumerated restriction
            list.
        reviewLocation:
          type: string
          enum:
          - gp
          - occupational-health
          - specialist
          - employer-oh
          - none
          - ''
          description: 'Location of the next review: gp, occupational-health, specialist, employer-oh,
            or none.'
        reviewDate:
          type:
          - string
          - 'null'
          format: date
          description: Scheduled date of the next review.
        occupationalHealthReferralMade:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether an occupational-health referral has been made.
        dvlaNotificationRequired:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the patient must notify the DVLA of the condition.
        employerOhNotified:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the employer occupational-health team has been notified.
        returnToWorkMeetingScheduled:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether a return-to-work meeting has been scheduled with the employer.
        maternityCertificateReference:
          type: string
          maxLength: 50
          description: MAT B1 reference if the absence is pregnancy-related.
        finalNotes:
          type: string
          description: Free-text final notes from the clinician.
        signatureSvg:
          type: string
          description: Clinician electronic signature captured as an SVG path.
        signedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Timestamp when the clinician signed off the statement.
      required:
      - createdAt
      - updatedAt
      - patientId
      - clinicianId
      - status
      - statementKind
      - priorMed3Reference
      - priorSelfCertificationReference
      - primaryDiagnosisText
      - primaryDiagnosisSnomed
      - primaryDiagnosisIcd10
      - comorbidConditions
      - mechanism
      - workplaceCause
      - riddorReference
      - currentMedications
      - ongoingTherapy
      - anticipatedRecoveryTrajectory
      - specialistFollowupRequired
      - mobility
      - cognition
      - mood
      - sleep
      - drivingCapacity
      - adlIndependence
      - fitnessStatementComputed
      - fitnessStatementFinal
      - clinicianOverride
      - clinicianOverrideReason
      - clinicianConfidence
      - reassessmentRequired
      - phasedReturnApplicable
      - phasedReturnTemplate
      - phasedReturnScheduleJson
      - phasedReturnSupportContact
      - workstationReviewRequired
      - additionalAdjustmentsText
      - reviewLocation
      - occupationalHealthReferralMade
      - dvlaNotificationRequired
      - employerOhNotified
      - returnToWorkMeetingScheduled
      - maternityCertificateReference
      - finalNotes
      - signatureSvg
      description: Clinician-issued Statement of Fitness for Work (Med 3 / fit note) authorising an employee
        return to work after illness, injury, or extended absence.
    ReturnToWorkGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        returnToWorkId:
          type: string
          format: uuid
          description: Foreign key to the return_to_work record.
        fitnessStatement:
          type: string
          enum:
          - fit
          - may-be-fit
          - not-fit
          description: 'Engine-computed fitness statement: fit, may-be-fit, or not-fit.'
        restrictionPriority:
          type: string
          enum:
          - routine
          - standard
          - restricted
          - high-risk
          description: 'Composite restriction-priority grade: routine, standard, restricted, or high-risk.'
        ruleCount:
          type: integer
          format: int32
          description: Total number of grading rules that fired.
        flagCount:
          type: integer
          format: int32
          description: Total number of additional safety flags raised.
        gradedAt:
          type: string
          format: date-time
          description: Timestamp when the grading was computed.
      required:
      - createdAt
      - updatedAt
      - returnToWorkId
      - fitnessStatement
      - restrictionPriority
      - ruleCount
      - flagCount
      - gradedAt
      description: 'Computed Return to Work grading result: the engine-derived fitness statement plus
        the composite restriction-priority grade. One-to-one child of return_to_work.'
    ReturnToWorkGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        returnToWorkGradeId:
          type: string
          format: uuid
          description: Foreign key to the parent return_to_work_grade record.
        flagCode:
          type: string
          maxLength: 60
          description: Stable flag identifier (e.g. RTW-FLAG-SAFETY-001).
        flagTitle:
          type: string
          maxLength: 255
          description: Human-readable flag title for display.
        flagCategory:
          type: string
          enum:
          - safety-critical-role
          - dvla-notifiable
          - riddor-reportable
          - phased-return-incomplete
          - risk-assessment-required
          - long-term-absence
          - mental-health-no-followup
          - pregnancy-no-mat-b1
          - clinician-low-confidence
          - equality-act-adjustment
          - other
          - ''
          description: 'Flag category: safety-critical-role, dvla-notifiable, riddor-reportable, phased-return-incomplete,
            risk-assessment-required, long-term-absence, mental-health-no-followup, pregnancy-no-mat-b1,
            clinician-low-confidence, equality-act-adjustment, or other.'
        flagPriority:
          type: string
          enum:
          - low
          - medium
          - high
          - ''
          description: 'Flag priority: low, medium, or high.'
        flagEvidence:
          type: string
          description: Free-text evidence describing which input field(s) triggered the flag.
        flagRecommendation:
          type: string
          description: Free-text recommended action for the occupational-health reviewer.
      required:
      - createdAt
      - updatedAt
      - returnToWorkGradeId
      - flagCode
      - flagTitle
      - flagCategory
      - flagPriority
      - flagEvidence
      - flagRecommendation
      description: Additional safety flags raised during Return to Work composite grading. Many-to-one
        child of return_to_work_grade.
    ReturnToWorkGradeRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        returnToWorkGradeId:
          type: string
          format: uuid
          description: Foreign key to the parent return_to_work_grade record.
        ruleCode:
          type: string
          maxLength: 60
          description: Stable rule identifier (e.g. RTW-FIT-001, RTW-RES-005).
        ruleTitle:
          type: string
          maxLength: 255
          description: Human-readable rule title for display in the fired-rules report.
        ruleBand:
          type: string
          enum:
          - routine
          - standard
          - restricted
          - high-risk
          - fit
          - may-be-fit
          - not-fit
          - ''
          description: Band this rule drove (fitness statement value or restriction-priority value).
        rulePriority:
          type: string
          enum:
          - low
          - medium
          - high
          - ''
          description: 'Priority of this rule: low, medium, or high.'
        ruleKind:
          type: string
          enum:
          - fitness
          - restriction
          - composite
          - ''
          description: Whether the rule contributes to fitness statement, restriction grading, or both
            (composite).
        ruleEvidence:
          type: string
          description: Free-text evidence describing which input field(s) triggered the rule.
        ruleNotes:
          type: string
          description: Free-text notes for the clinician reviewing the fired rules.
      required:
      - createdAt
      - updatedAt
      - returnToWorkGradeId
      - ruleCode
      - ruleTitle
      - ruleBand
      - rulePriority
      - ruleKind
      - ruleEvidence
      - ruleNotes
      description: Individual rules that fired during Return to Work composite grading. Many-to-one child
        of return_to_work_grade.
    ReturnToWorkRestriction:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        returnToWorkId:
          type: string
          format: uuid
          description: Foreign key to the parent return_to_work record.
        kind:
          type: string
          enum:
          - altered-hours
          - amended-duties
          - workplace-adaptations
          - phased-return
          - no-heavy-lifting
          - no-driving
          - no-operating-machinery
          - no-working-at-height
          - no-lone-working
          - no-night-shifts
          - no-shift-work
          - no-patient-contact
          - no-public-contact
          - sedentary-only
          - no-exposure-to-allergen
          - no-exposure-to-chemicals
          - no-exposure-to-temperature-extremes
          - no-exposure-to-noise
          - no-firearms-or-weapons
          - no-safety-critical-duties
          - screen-break-frequency
          - workstation-review
          - reduced-screen-time
          - restricted-travel
          - no-overtime
          - other
          - ''
          description: Restriction kind drawn from the enumerated Med 3 adjustments list plus this monorepo
            extensions.
        severity:
          type: string
          enum:
          - low
          - moderate
          - high
          - ''
          description: 'Severity of the restriction: low, moderate, or high. Drives the composite restriction-priority
            grade.'
        quantitativeLimit:
          type: string
          maxLength: 50
          description: Quantitative limit for the restriction (e.g. 5 kg lifting limit, 30 minute screen
            break).
        notes:
          type: string
          maxLength: 500
          description: Free-text clinician notes for this specific restriction.
        startDate:
          type:
          - string
          - 'null'
          format: date
          description: First date this restriction applies (defaults to return_to_work.valid_from).
        endDate:
          type:
          - string
          - 'null'
          format: date
          description: Last date this restriction applies (defaults to return_to_work.valid_until).
        priorityRank:
          type: integer
          format: int32
          description: Display ordering for the restriction within the fit note (lower = higher on the
            printed list).
      required:
      - createdAt
      - updatedAt
      - returnToWorkId
      - kind
      - severity
      - quantitativeLimit
      - notes
      - priorityRank
      description: Individual workplace restriction or reasonable adjustment associated with a Return
        to Work record. Many-to-one relation to return_to_work.
