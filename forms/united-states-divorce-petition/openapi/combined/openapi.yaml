components:
  schemas:
    Attorney:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Full name of the attorney or self-help facilitator preparing the petition.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as a single text block.
        barStateAsUspsCode:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Two-letter USPS code of the state bar that admitted the attorney.
        barNumber:
          type: string
          description: State bar number; empty for a self-represented filer.
      required:
      - createdAt
      - updatedAt
      - name
      - barNumber
      description: Attorney or court self-help facilitator who prepares the petition; optional because
        many petitioners file pro se.
    Petitioner:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          maxLength: 255
          description: Full legal name of the petitioner.
        birthDate:
          type:
          - string
          - 'null'
          format: date
          description: Date of birth of the petitioner.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as a single text block.
        stateAsUspsCode:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Two-letter USPS code of the petitioner's state of residence.
        postcode:
          type:
          - string
          - 'null'
          description: ZIP code.
      required:
      - createdAt
      - updatedAt
      - name
      description: 'Petitioner: the spouse who files the petition for dissolution of marriage.'
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          description: A URI identifying the problem type
        title:
          type: string
          description: A short summary of the problem type
        status:
          type: integer
          description: The HTTP status code
        detail:
          type: string
          description: An explanation of this occurrence
        instance:
          type: string
          description: A URI identifying this occurrence
        code:
          type: string
          description: A short machine-readable reason
        errors:
          type: object
          description: Per-field detail, when validation failed
      required:
      - type
      - title
      - status
    UnitedStatesDivorcePetition:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        petitionerId:
          type: string
          format: uuid
          description: Foreign key to the petitioner (restrict delete).
        attorneyId:
          type:
          - string
          - 'null'
          format: uuid
          description: Foreign key to the preparing attorney (restrict delete); optional.
        state:
          type: string
          maxLength: 2
          description: Two-letter USPS code of the state whose court the petition is filed in.
        county:
          type: string
          description: County (or parish) of the filing court.
        filingDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the petition is, or will be, filed with the clerk.
        caseType:
          type: string
          enum:
          - uncontested
          - contested
          - ''
          description: Whether the divorce is expected to be uncontested (agreed) or contested.
        groundType:
          type: string
          enum:
          - no-fault
          - fault
          - ''
          description: 'Kind of ground pleaded: no-fault or fault.'
        faultGround:
          type: string
          enum:
          - adultery
          - cruelty
          - abandonment
          - felony-conviction
          - impotence
          - other
          - ''
          description: Fault ground pleaded, when ground_type is fault.
        petitionerName:
          type: string
          description: Full legal name of the petitioner (spouse who files).
        respondentName:
          type: string
          description: Full legal name of the respondent (other spouse).
        marriageDate:
          type:
          - string
          - 'null'
          format: date
          description: Date of the marriage.
        marriagePlace:
          type: string
          description: City and state or country where the marriage took place.
        separationDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the spouses began living separate and apart; null if still together.
        petitionerResidencyMonths:
          type:
          - integer
          - 'null'
          format: int32
          description: Whole months the petitioner has lived in the filing state immediately before filing.
        countyResidencyDays:
          type:
          - integer
          - 'null'
          format: int32
          description: Days the petitioner has lived in the filing county immediately before filing.
        marriedOrLivedInState:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the spouses married in, or lived together as spouses in, the filing state
            (shortens the New York residency period).
        respondentMilitary:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the respondent is on active military duty (Servicemembers Civil Relief
            Act affidavit).
        hasMinorChildren:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the spouses have minor children of the marriage.
        childrenCount:
          type:
          - integer
          - 'null'
          format: int32
          description: Number of minor children of the marriage.
        childrenHomeStateMonths:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Months the children have lived in the filing state with a parent (UCCJEA home-state
            test: six months).'
        pregnant:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether either spouse is pregnant with a child of the marriage.
        custodyPlanDocumented:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether a custody and parenting-time plan is documented.
        childSupportWorksheetCompleted:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the state child-support guideline worksheet is completed.
        childSupportMonthlyAmount:
          type:
          - number
          - 'null'
          format: double
          description: Monthly child support from the worksheet, in US dollars; null when unset.
        propertyDivisionApproach:
          type: string
          enum:
          - community
          - equitable
          - ''
          description: 'Property-division approach pleaded: community property or equitable distribution.'
        settlementAgreementSigned:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether both spouses signed a marital settlement agreement.
        financialDisclosureFiled:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the financial disclosure or affidavit is filed or ready.
        spousalSupportRequested:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether spousal support (alimony, maintenance) is requested.
        serviceMethod:
          type: string
          enum:
          - personal
          - acceptance
          - mail
          - publication
          - none
          - ''
          description: 'How the respondent is, or will be, served: personal, acceptance (waiver), certified
            mail, publication, or none yet.'
        serviceDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the respondent was served or signed an acceptance of service.
        respondentResponded:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the respondent has filed a response or appearance.
        decreeEntered:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the court has entered the judgment or decree of dissolution.
        decreeDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the decree was entered.
        nameRestorationRequested:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether restoration of a former name is requested in the decree.
        nameToRestore:
          type: string
          description: Former name to be restored.
        certificateRequested:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether a vital-records divorce certificate or certified decree is requested.
      required:
      - createdAt
      - updatedAt
      - petitionerId
      - state
      - county
      - caseType
      - groundType
      - faultGround
      - petitionerName
      - respondentName
      - marriagePlace
      - marriedOrLivedInState
      - respondentMilitary
      - hasMinorChildren
      - pregnant
      - custodyPlanDocumented
      - childSupportWorksheetCompleted
      - propertyDivisionApproach
      - settlementAgreementSigned
      - financialDisclosureFiled
      - spousalSupportRequested
      - serviceMethod
      - respondentResponded
      - decreeEntered
      - nameRestorationRequested
      - nameToRestore
      - certificateRequested
      description: 'Main United States petition for dissolution of marriage record: filing, spouses and
        residency, children and support, property, service of process, and the decree. Documentation support,
        not legal advice.'
    UnitedStatesDivorcePetitionGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        unitedStatesDivorcePetitionId:
          type: string
          format: uuid
          description: Foreign key to the parent petition (unique, 1:1).
        readinessClass:
          type: string
          enum:
          - ready-to-file
          - incomplete
          - not-yet-eligible
          - ''
          description: 'Readiness class: ready-to-file, incomplete, or not-yet-eligible (not-yet-eligible
            takes precedence).'
        propertyRegime:
          type: string
          enum:
          - community
          - equitable
          - unknown
          - ''
          description: 'Property-division regime of the filing state: community, equitable, or unknown.'
        earliestDecreeDate:
          type:
          - string
          - 'null'
          format: date
          description: Earliest date a decree may be entered under the filing state waiting period; null
            when it cannot be computed.
        stateRuleKnown:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the filing state is in the engine rule table (yes/no); unknown states use
            the default rule.
        gradedAt:
          type: string
          format: date-time
