<section class="border rounded p-4 space-y-2">
  <h2 class="text-xl font-semibold">7. Operative findings &amp; technique</h2>
  <label>Step-by-step operative technique (numbered free text)
    <textarea name="operative_findings_summary" rows="6" class="border rounded px-2 py-1 w-full"></textarea>
  </label>
  <label>Pathology found
    <textarea name="pathology_found" rows="2" class="border rounded px-2 py-1 w-full"></textarea>
  </label>
  <label>Anatomical anomalies
    <textarea name="anatomical_anomalies" rows="2" class="border rounded px-2 py-1 w-full"></textarea>
  </label>
  <div class="grid grid-cols-2 gap-2">
    <label>Intra-op photographs taken?
      <select name="intraop_photographs_taken" class="border rounded px-2 py-1 w-full">
        <option value="no">No</option>
        <option value="yes">Yes</option>
      </select>
    </label>
    <label>Frozen-section requested?
      <select name="frozen_section_requested" class="border rounded px-2 py-1 w-full">
        <option value="no">No</option>
        <option value="yes">Yes</option>
      </select>
    </label>
    <label>Converted to open?
      <select name="converted_to_open" class="border rounded px-2 py-1 w-full">
        <option value="no">No</option>
        <option value="yes">Yes</option>
      </select>
    </label>
  </div>
  <label>Conversion reason
    <textarea name="conversion_reason" rows="2" class="border rounded px-2 py-1 w-full"></textarea>
  </label>
</section>
