<section class="border rounded p-4 space-y-2">
  <h2 class="text-xl font-semibold">11. Post-operative plan</h2>
  <div class="grid grid-cols-2 gap-2">
    <label>Planned recovery destination
      <select name="planned_recovery_destination" class="border rounded px-2 py-1 w-full">
        <option value="day-case-discharge">Day-case discharge</option>
        <option value="ward">Ward</option>
        <option value="pacu">PACU</option>
        <option value="enhanced-care">Enhanced care</option>
        <option value="hdu">HDU</option>
        <option value="icu">ICU</option>
      </select>
    </label>
    <label>Actual recovery destination
      <select name="recovery_destination" class="border rounded px-2 py-1 w-full">
        <option value="day-case-discharge">Day-case discharge</option>
        <option value="ward">Ward</option>
        <option value="pacu">PACU</option>
        <option value="enhanced-care">Enhanced care</option>
        <option value="hdu">HDU</option>
        <option value="icu">ICU</option>
      </select>
    </label>
    <label>Monitoring frequency
      <input type="text" name="monitoring_frequency" class="border rounded px-2 py-1 w-full" />
    </label>
    <label>IV fluids plan
      <input type="text" name="iv_fluids_plan" class="border rounded px-2 py-1 w-full" />
    </label>
    <label>Antibiotic plan
      <input type="text" name="antibiotic_plan" class="border rounded px-2 py-1 w-full" />
    </label>
    <label>VTE prophylaxis
      <input type="text" name="vte_prophylaxis_plan" class="border rounded px-2 py-1 w-full" />
    </label>
    <label>Diet plan
      <input type="text" name="diet_plan" class="border rounded px-2 py-1 w-full" />
    </label>
    <label>Mobilisation
      <input type="text" name="mobilisation_plan" class="border rounded px-2 py-1 w-full" />
    </label>
    <label>Sign-Out completed?
      <select name="sign_out_completed" class="border rounded px-2 py-1 w-full">
        <option value="yes">Yes</option><option value="no">No</option>
      </select>
    </label>
    <label>Debrief completed?
      <select name="debrief_completed" class="border rounded px-2 py-1 w-full">
        <option value="yes">Yes</option><option value="no">No</option>
      </select>
    </label>
  </div>
  <label>Analgesia plan
    <textarea name="analgesia_plan" rows="2" class="border rounded px-2 py-1 w-full"></textarea>
  </label>
  <label>Wound care
    <textarea name="wound_care_plan" rows="2" class="border rounded px-2 py-1 w-full"></textarea>
  </label>
  <label>Follow-up
    <textarea name="follow_up_plan" rows="2" class="border rounded px-2 py-1 w-full"></textarea>
  </label>
  <label>Special instructions
    <textarea name="special_instructions" rows="2" class="border rounded px-2 py-1 w-full"></textarea>
  </label>
</section>
