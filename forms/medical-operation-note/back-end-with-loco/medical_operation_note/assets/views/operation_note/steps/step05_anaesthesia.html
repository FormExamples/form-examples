<section class="border rounded p-4 space-y-2">
  <h2 class="text-xl font-semibold">5. Anaesthesia</h2>
  <div class="grid grid-cols-2 gap-2">
    <label>Anaesthesia type
      <select name="anaesthesia_type" class="border rounded px-2 py-1 w-full">
        <option value="ga">General anaesthesia</option>
        <option value="regional">Regional</option>
        <option value="neuraxial">Neuraxial</option>
        <option value="sedation">Sedation</option>
        <option value="mac">MAC</option>
        <option value="local">Local</option>
      </select>
    </label>
    <label>Airway management
      <select name="airway_management" class="border rounded px-2 py-1 w-full">
        <option value="face-mask">Face mask</option>
        <option value="supraglottic">Supraglottic</option>
        <option value="ett">ETT</option>
        <option value="awake-foi">Awake FOI</option>
        <option value="surgical-airway">Surgical airway</option>
      </select>
    </label>
    <label>Induction agent
      <input type="text" name="induction_agent" class="border rounded px-2 py-1 w-full" />
    </label>
    <label>Maintenance agent
      <input type="text" name="maintenance_agent" class="border rounded px-2 py-1 w-full" />
    </label>
    <label>Neuromuscular blockade
      <input type="text" name="neuromuscular_blockade" class="border rounded px-2 py-1 w-full" />
    </label>
    <label>Regional block detail
      <input type="text" name="regional_block_description" class="border rounded px-2 py-1 w-full" />
    </label>
    <label>Crystalloid (mL)
      <input type="number" name="intraop_crystalloid_ml" class="border rounded px-2 py-1 w-full" />
    </label>
    <label>Colloid (mL)
      <input type="number" name="intraop_colloid_ml" class="border rounded px-2 py-1 w-full" />
    </label>
    <label>Blood (mL)
      <input type="number" name="intraop_blood_ml" class="border rounded px-2 py-1 w-full" />
    </label>
    <label>Urine (mL)
      <input type="number" name="intraop_urine_ml" class="border rounded px-2 py-1 w-full" />
    </label>
    <label>Anaesthetic event
      <select name="anaesthetic_event" class="border rounded px-2 py-1 w-full">
        <option value="none">None</option>
        <option value="hypotension">Hypotension</option>
        <option value="bradycardia">Bradycardia</option>
        <option value="failed-intubation">Failed intubation</option>
        <option value="awareness">Awareness</option>
        <option value="anaphylaxis">Anaphylaxis</option>
        <option value="malignant-hyperthermia">Malignant hyperthermia</option>
        <option value="suxamethonium-apnoea">Suxamethonium apnoea</option>
      </select>
    </label>
  </div>
  <label>Anaesthetic event description
    <textarea name="anaesthetic_event_description" rows="2" class="border rounded px-2 py-1 w-full"></textarea>
  </label>
  <label>Invasive monitoring
    <textarea name="invasive_monitoring" rows="2" class="border rounded px-2 py-1 w-full"></textarea>
  </label>
</section>
