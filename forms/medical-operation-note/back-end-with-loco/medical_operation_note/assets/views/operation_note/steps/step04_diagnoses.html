<section class="border rounded p-4 space-y-2">
  <h2 class="text-xl font-semibold">4. Diagnoses &amp; procedures</h2>
  <label>Pre-operative diagnosis
    <textarea name="pre_operative_diagnosis" rows="2" class="border rounded px-2 py-1 w-full"></textarea>
  </label>
  <label>Post-operative diagnosis
    <textarea name="post_operative_diagnosis" rows="2" class="border rounded px-2 py-1 w-full"></textarea>
  </label>
  <label>Indication
    <textarea name="indication" rows="2" class="border rounded px-2 py-1 w-full"></textarea>
  </label>
  <div class="grid grid-cols-2 gap-2">
    <label>Urgency (NCEPOD)
      <select name="urgency" class="border rounded px-2 py-1 w-full">
        <option value="elective">Elective</option>
        <option value="scheduled">Scheduled</option>
        <option value="urgent">Urgent</option>
        <option value="immediate">Immediate</option>
      </select>
    </label>
    <label>Laterality
      <select name="laterality" class="border rounded px-2 py-1 w-full">
        <option value="not-applicable">Not applicable</option>
        <option value="left">Left</option>
        <option value="right">Right</option>
        <option value="bilateral">Bilateral</option>
        <option value="midline">Midline</option>
      </select>
    </label>
  </div>
  <label>Procedures performed (one per line; include OPCS-4 codes)
    <textarea name="procedures_performed" rows="3" class="border rounded px-2 py-1 w-full"></textarea>
  </label>
</section>
