<section class="border rounded p-4 space-y-2">
  <h2 class="text-xl font-semibold">1. Operation identification</h2>
  <div class="grid grid-cols-2 gap-2">
    <label>Hospital
      <input type="text" name="hospital_name" required class="border rounded px-2 py-1 w-full" />
    </label>
    <label>Theatre / OR number
      <input type="text" name="theatre_number" required class="border rounded px-2 py-1 w-full" />
    </label>
    <label>List type
      <select name="list_type" class="border rounded px-2 py-1 w-full">
        <option value="elective">Elective</option>
        <option value="cepod">CEPOD</option>
        <option value="trauma">Trauma</option>
        <option value="obstetric">Obstetric</option>
      </select>
    </label>
    <label>Case start
      <input type="datetime-local" name="case_start_at" class="border rounded px-2 py-1 w-full" />
    </label>
    <label>Anaesthesia start
      <input type="datetime-local" name="anaesthesia_start_at" class="border rounded px-2 py-1 w-full" />
    </label>
    <label>Knife to skin
      <input type="datetime-local" name="knife_to_skin_at" class="border rounded px-2 py-1 w-full" />
    </label>
    <label>End of surgery
      <input type="datetime-local" name="end_of_surgery_at" class="border rounded px-2 py-1 w-full" />
    </label>
    <label>Case end
      <input type="datetime-local" name="case_end_at" class="border rounded px-2 py-1 w-full" />
    </label>
  </div>
</section>
