components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        name:
          type: string
          description: Clinician full name as recorded in the rota.
        email:
          type: string
          description: Email address.
        phone:
          type: string
          description: Phone number.
        postal_address_as_full_text:
          type: string
          description: Postal address as a single text block.
        country_as_iso_3166_1_alpha_2:
          type: string
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2.
        postcode:
          type: string
          description: Postal code.
        role:
          type: string
          enum:
          - doctor
          - nurse-practitioner
          - physiotherapist
          - paramedic
          - other
          - ''
          description: 'Primary clinical role: doctor, nurse-practitioner, physiotherapist, paramedic,
            or other.'
        registration_body:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - GPhC
          - other
          - ''
          description: 'Professional registration body: GMC, NMC, HCPC, GPhC, or other.'
        registration_number:
          type: string
          description: Professional registration number issued by the registration body.
      required:
      - created_at
      - updated_at
      - name
      - role
      - registration_body
      - registration_number
      description: Clinician identifying information for the assessing clinician.
    OttawaKneeRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        patient_id:
          type: string
          format: uuid
          description: Foreign key to the patient being assessed (restricts delete).
        clinician_id:
          type: string
          format: uuid
          description: Foreign key to the assessing clinician (restricts delete).
        status:
          type: string
          enum:
          - draft
          - submitted
          - amended
          - signed
          - ''
          description: 'Workflow status: draft, submitted, amended, or signed.'
        patient_identifier:
          type: string
          maxLength: 64
          description: Local patient identifier as recorded at the point of assessment.
        assessed_at:
          type: string
          format: date-time
          description: Date and time the assessment was carried out.
        care_setting:
          type: string
          enum:
          - emergency-department
          - minor-injuries-unit
          - urgent-care
          - other
          - ''
          description: 'Care setting: emergency-department, minor-injuries-unit, urgent-care, or other.'
        injury_mechanism:
          type: string
          enum:
          - blunt-trauma
          - twisting
          - fall
          - other
          - ''
          description: 'Mechanism of injury: blunt-trauma, twisting, fall, or other.'
        hours_since_injury:
          type: number
          format: double
          description: Hours elapsed since the injury; supports the applicability check (the rule is validated
            for acute injury).
        sex:
          type: string
          enum:
          - female
          - male
          - intersex
          - unknown
          - ''
          description: 'Patient sex recorded for clinical purposes: female, male, intersex, or unknown.'
        injured_side:
          type: string
          enum:
          - left
          - right
          - ''
          description: 'Injured knee side: left or right.'
        age_years:
          type: integer
          format: int32
          description: 'Criterion 1: patient age in years; the criterion fires when age >= 55. Null when
            unanswered.'
        patellar_tenderness:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Criterion 2 input: tenderness at the patella. Fires the isolated-patellar criterion
            only when other_bony_tenderness is no.'
        other_bony_tenderness:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Criterion 2 modifier: bony tenderness other than the patella; when yes it prevents
            the isolated-patellar criterion from firing and raises a flag.'
        fibular_head_tenderness:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Criterion 3: tenderness at the head of the fibula.'
        unable_to_flex_90:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Criterion 4: inability to flex the knee to 90 degrees.'
        unable_to_bear_weight:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Criterion 5: inability to bear weight (take four steps) both immediately after
            injury and in the emergency department.'
        clinical_notes:
          type: string
          description: Free-text clinical notes captured alongside the assessment.
      required:
      - created_at
      - updated_at
      - patient_id
      - status
      - patient_identifier
      - care_setting
      - injury_mechanism
      - sex
      - injured_side
      - patellar_tenderness
      - other_bony_tenderness
      - fibular_head_tenderness
      - unable_to_flex_90
      - unable_to_bear_weight
      - clinical_notes
      description: 'Main Ottawa Knee Rule assessment record: identification, context, and the five objective
        bedside criterion inputs. A decision rule (ANY-of), not a score.'
    OttawaKneeRuleGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the row was soft-deleted.
        ottawa_knee_rule_id:
          type: string
          format: uuid
          description: Foreign key to the parent assessment (unique, 1:1).
        xray_indicated:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Whether a knee radiograph is indicated: yes when any one criterion fires, no when
            all five are absent.'
        decision:
          type: string
          enum:
          - xray-indicated
          - xray-not-indicated
          - ''
          description: 'Decision label: xray-indicated or xray-not-indicated.'
        recommended_action:
          type: string
          description: 'Recommended action: obtain a knee radiograph per local protocol when indicated,
            otherwise imaging is not required by the rule.'
        graded_at:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the grade.
      required:
      - created_at
      - updated_at
      - ottawa_knee_rule_id
      - xray_indicated
      - decision
      - recommended_action
      - graded_at
      description: 'Computed Ottawa Knee Rule grading result: the binary imaging decision (xray_indicated)
        and decision label. One-to-one with the parent assessment.'
    OttawaKneeRuleGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the row was soft-deleted.
        ottawa_knee_rule_grade_id:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        flag_id:
          type: string
          maxLength: 50
          description: Stable flag identifier (e.g. F-XRAY-INDICATED-001).
        category:
          type: string
          enum:
          - xray-indicated
          - unable-to-bear-weight
          - other-bony-tenderness
          - applicability
          - incomplete
          - other
          - ''
          description: 'Flag category: xray-indicated, unable-to-bear-weight, other-bony-tenderness, applicability,
            incomplete, or other.'
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          - ''
          description: 'Priority: low, medium, high.'
        description:
          type: string
          maxLength: 500
          description: Human-readable description of what fired the flag.
        suggested_action:
          type: string
          maxLength: 500
          description: Suggested clinical action (e.g. "obtain a knee radiograph per local protocol",
            "complete the outstanding criterion inputs").
      required:
      - created_at
      - updated_at
      - ottawa_knee_rule_grade_id
      - flag_id
      - category
      - priority
      - description
      - suggested_action
      description: Clinically significant flags that fire independently of the imaging decision, with
        priority and a suggested action for the assessing team.
    OttawaKneeRuleGradeRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the row was soft-deleted.
        ottawa_knee_rule_grade_id:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        rule_id:
          type: string
          maxLength: 40
          description: Stable rule identifier (e.g. R-AGE-01, R-ISOLATED-PATELLAR-01).
        instrument:
          type: string
          enum:
          - criterion
          - composite
          - ''
          description: 'Decision instrument the rule belongs to: criterion (one of the five) or composite
            (the ANY-of decision).'
        criterion:
          type: string
          enum:
          - age
          - isolated-patellar-tenderness
          - fibular-head-tenderness
          - flexion
          - weight-bearing
          - decision
          - other
          - ''
          description: 'Criterion the rule relates to: age, isolated-patellar-tenderness, fibular-head-tenderness,
            flexion, weight-bearing, or decision.'
        fired:
          type: boolean
          description: Whether this criterion was present (true) and therefore contributed to indicating
            imaging.
        category:
          type: string
          maxLength: 50
          description: Subject category (e.g. age, bony-tenderness, range-of-motion, weight-bearing, decision).
        description:
          type: string
          maxLength: 500
          description: Human-readable description of why the rule fired or did not fire.
      required:
      - created_at
      - updated_at
      - ottawa_knee_rule_grade_id
      - rule_id
      - instrument
      - criterion
      - fired
      - category
      - description
      description: 'Audit trail of every decision rule evaluated during Ottawa Knee Rule computation:
        instrument, criterion, whether it fired, category, and description.'
    Patient:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        name:
          type: string
          maxLength: 255
          description: Full patient name as recorded on the wristband.
        birth_date:
          type: string
          format: date
          description: Date of birth.
        sex:
          type: string
          enum:
          - female
          - male
          - intersex
          - unknown
          - ''
          description: 'Sex recorded for clinical purposes: female, male, intersex, or unknown.'
        email:
          type: string
          description: Email address.
        phone:
          type: string
          description: Phone number.
        postal_address_as_full_text:
          type: string
          description: Postal address as a single text block.
        country_as_iso_3166_1_alpha_2:
          type: string
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2.
        postcode:
          type: string
          description: Postal code.
        united_kingdom_nhs_number:
          type: string
          maxLength: 20
          description: United Kingdom NHS number, unique per person.
        hospital_mrn:
          type: string
          maxLength: 50
