components:
  schemas:
    BronchoscopyTestRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the patient.
        clinicianId:
          type: string
          format: uuid
          description: Foreign key to the requesting clinician (referrer).
        status:
          type: string
          enum:
          - draft
          - submitted
          - vetted
          - scheduled
          - rejected
          - ''
          description: 'Request lifecycle status: draft, submitted, vetted, scheduled, rejected.'
        siteName:
          type: string
          maxLength: 255
          description: Name of the requesting site or clinic.
        setting:
          type: string
          enum:
          - outpatient
          - inpatient
          - community
          - emergency
          - ''
          description: 'Care setting: outpatient, inpatient, community, emergency.'
        referralDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the referral was made.
        requestedByDate:
          type:
          - string
          - 'null'
          format: date
          description: Date by which the procedure is requested to be performed.
        procedure:
          type: string
          enum:
          - flexible-bronchoscopy
          - ebus
          - rigid-bronchoscopy
          - bronchoalveolar-lavage
          - other
          - ''
          description: 'Requested procedure: flexible-bronchoscopy, ebus, rigid-bronchoscopy, bronchoalveolar-lavage,
            other.'
        primaryIndication:
          type: string
          enum:
          - suspected-lung-cancer
          - haemoptysis
          - persistent-cough
          - lung-mass-on-imaging
          - mediastinal-lymphadenopathy
          - infection-sampling
          - foreign-body
          - stridor
          - other
          - ''
          description: Primary clinical indication, used for appropriateness scoring.
        clinicalQuestion:
          type: string
          maxLength: 1000
          description: Specific clinical question the procedure should answer (highest-value field).
        relevantHistory:
          type: string
          maxLength: 1000
          description: Relevant medical, surgical, and respiratory history.
        symptomHaemoptysis:
          type: boolean
          description: Whether the patient reports coughing up blood (haemoptysis).
        symptomCough:
          type: boolean
          description: Whether the patient reports a persistent cough.
        symptomBreathlessness:
          type: boolean
          description: Whether the patient reports breathlessness (dyspnoea).
        symptomWeightLoss:
          type: boolean
          description: Whether the patient reports unexplained weight loss.
        imagingFindings:
          type: string
          maxLength: 1000
          description: Summary of relevant imaging findings (chest x-ray, CT) supporting the request.
        takingAnticoagulant:
          type: boolean
          description: Whether the patient is taking an anticoagulant (bleeding risk).
        anticoagulantAgent:
          type: string
          maxLength: 255
          description: Name of the anticoagulant agent, if any (e.g. warfarin, apixaban).
        takingAntiplatelet:
          type: boolean
          description: Whether the patient is taking an antiplatelet agent (bleeding risk).
        antiplateletAgent:
          type: string
          maxLength: 255
          description: Name of the antiplatelet agent, if any (e.g. clopidogrel, aspirin).
        plateletCount:
          type:
          - number
          - 'null'
          format: double
          description: Platelet count (x10^9/L), affecting bleeding risk for biopsy.
        oxygenDependent:
          type: boolean
          description: Whether the patient is oxygen-dependent (hypoxia / procedural risk).
        asaGrade:
          type: string
          enum:
          - I
          - II
          - III
          - IV
          - V
          - ''
          description: 'American Society of Anesthesiologists physical status grade: I, II, III, IV, V.'
        sedation:
          type: string
          enum:
          - conscious
          - deep
          - general
          - ''
          description: 'Planned sedation level: conscious, deep, general.'
        urgency:
          type: string
          enum:
          - routine
          - urgent
          - two-week-wait
          - emergency
          - ''
          description: 'Requested triage urgency: routine, urgent, two-week-wait, emergency.'
        supervisingConsultant:
          type: string
          maxLength: 255
          description: Name of the supervising / responsible consultant.
        requesterContact:
          type: string
          maxLength: 255
          description: Contact details (bleep / phone) for the requester.
        notes:
          type: string
          maxLength: 1000
          description: Free-text additional notes.
      required:
      - createdAt
      - updatedAt
      - patientId
      - clinicianId
      - status
      - siteName
      - setting
      - procedure
      - primaryIndication
      - clinicalQuestion
      - relevantHistory
      - symptomHaemoptysis
      - symptomCough
      - symptomBreathlessness
      - symptomWeightLoss
      - imagingFindings
      - takingAnticoagulant
      - anticoagulantAgent
      - takingAntiplatelet
      - antiplateletAgent
      - oxygenDependent
      - asaGrade
      - sedation
      - urgency
      - supervisingConsultant
      - requesterContact
      - notes
      description: Bronchoscopy (airway endoscopy) request (referral). Captures the requested procedure,
        the clinical indication and question, symptoms, imaging findings, bleeding / anticoagulation risk,
        procedural risk, and triage urgency.
    BronchoscopyTestRequestGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        bronchoscopyTestRequestId:
          type: string
          format: uuid
          description: Foreign key to the parent request (unique, 1:1).
        appropriatenessScore:
          type:
          - integer
          - 'null'
          format: int32
          description: Appropriateness score (1-9) from BTS bronchoscopy guidance and indication match.
        appropriatenessBand:
          type: string
          enum:
          - usually-appropriate
          - may-be-appropriate
          - usually-not-appropriate
          - ''
          description: 'Appropriateness band: usually-appropriate (7-9), may-be-appropriate (4-6), usually-not-appropriate
            (1-3).'
        triageTier:
          type: string
          enum:
          - routine
          - urgent
          - two-week-wait
          - emergency
          - ''
          description: 'Assigned cancer-pathway triage tier: routine, urgent, two-week-wait, emergency.'
        targetTimeframe:
          type: string
          maxLength: 50
          description: Target timeframe for the procedure implied by the triage tier.
        twoWeekWaitEligible:
          type: boolean
          description: Whether the request meets NICE NG12 two-week-wait suspected-cancer criteria.
        completenessPercent:
          type:
          - integer
          - 'null'
          format: int32
          description: Request completeness as a percentage of mandatory fields (0-100).
        riskBand:
          type: string
          enum:
          - low
          - moderate
          - high
          - ''
          description: 'Pre-procedure risk band: low, moderate, high (anticoagulation, platelets, hypoxia,
            ASA).'
        anticoagulantAction:
          type: string
          maxLength: 500
          description: Recommended anticoagulant / antiplatelet management action before the procedure.
        recommendation:
          type: string
          enum:
          - accept
          - query-referrer
          - redirect
          - reject
          - ''
          description: 'Vetting recommendation: accept, query-referrer, redirect, reject.'
        clinicianNotes:
          type: string
          description: Free-text vetting notes.
        signedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Timestamp of vetting clinician electronic signature.
        gradedAt:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the result.
      required:
      - createdAt
      - updatedAt
      - bronchoscopyTestRequestId
      - appropriatenessBand
      - triageTier
      - targetTimeframe
      - twoWeekWaitEligible
      - riskBand
      - anticoagulantAction
      - recommendation
      - clinicianNotes
      - gradedAt
      description: 'Computed four-axis grading result: appropriateness (BTS 1-9), cancer-pathway urgency
        (NICE NG12 two-week-wait), request completeness, and pre-procedure bleeding / hypoxia risk.'
    BronchoscopyTestRequestGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        bronchoscopyTestRequestGradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        flagId:
          type: string
          maxLength: 50
          description: Stable flag identifier (e.g. F-SUSPECTED-CANCER-2WW-001).
        category:
          type: string
          enum:
          - suspected-cancer-2ww
          - massive-haemoptysis-emergency
          - high-bleeding-risk-anticoag
          - hypoxia
          - asa-iv
          - missing-indication
          - missing-clinical-question
          - other
          - ''
          description: Flag category.
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          - ''
          description: 'Priority: low, medium, high.'
        description:
          type: string
          maxLength: 500
          description: Human-readable description of what fired the flag.
        suggestedAction:
          type: string
          maxLength: 500
          description: Suggested clinical action (e.g. "expedite onto the two-week-wait lung cancer pathway").
      required:
      - createdAt
      - updatedAt
      - bronchoscopyTestRequestGradeId
      - flagId
      - category
      - priority
      - description
      - suggestedAction
      description: Safety-critical flags that fire independently of the four axes, with priority and a
        suggested action for the bronchoscopy team.
    BronchoscopyTestRequestGradeRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        bronchoscopyTestRequestGradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        ruleId:
          type: string
          maxLength: 40
          description: Stable rule identifier (e.g. R-APPROP-CANCER-01).
        axis:
          type: string
          enum:
          - appropriateness
          - urgency
          - completeness
          - risk
          - ''
          description: 'Scoring axis the rule belongs to: appropriateness, urgency, completeness, risk.'
        category:
          type: string
          maxLength: 50
          description: Category or indication the rule relates to.
        description:
          type: string
          maxLength: 500
          description: Human-readable description of why the rule fired.
      required:
      - createdAt
      - updatedAt
      - bronchoscopyTestRequestGradeId
      - ruleId
      - axis
      - category
      - description
      description: Audit trail of every appropriateness / urgency / completeness / risk rule that fired
        for this request.
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
