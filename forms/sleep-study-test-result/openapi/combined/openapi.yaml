          format: date
          description: Birth date.
        email:
          type: string
          description: Email address.
        phone:
          type: string
          description: Phone number.
        postal_address_as_full_text:
          type: string
          description: Postal address as full text.
        country_as_iso_3166_1_alpha_2:
          type: string
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type: string
          description: Postal code, such as for validating the postal address.
        united_kingdom_nhs_number:
          type: string
          maxLength: 20
          description: United Kingdom NHS number, unique per person.
        neck_circumference_as_cm:
          type: number
          format: double
          description: Neck circumference measurement in cm, an OSA anthropometric risk factor.
        height_as_cm:
          type: number
          format: double
          description: Height measurement in cm, such as for calculating body mass index (BMI).
        weight_as_kg:
          type: number
          format: double
          description: Weight measurement in kg, such as for calculating body mass index (BMI).
        body_mass_index:
          type: number
          format: double
          description: Body mass index (BMI) measurement, an OSA risk factor.
      required:
      - created_at
      - updated_at
      - name
      - birth_date
      description: Patient
    SleepStudyTestResult:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        patient_id:
          type: string
          format: uuid
          description: Foreign key to the patient.
        clinician_id:
          type: string
          format: uuid
          description: Foreign key to the reporting clinician (respiratory / sleep physician or clinical
            physiologist).
        originating_request_reference:
          type: string
          maxLength: 255
          description: Free-text reference linking this report back to the originating sleep study request
            (referral).
        report_status:
          type: string
          enum:
          - preliminary
          - final
          - amended
          - cancelled
          - ''
          description: 'Report lifecycle status: preliminary, final, amended, cancelled.'
        performed_date:
          type: string
          format: date
          description: Date the sleep study was performed (night of recording).
        reported_date:
          type: string
          format: date
          description: Date the report was authored / signed.
        study_type:
          type: string
          enum:
          - home-sleep-apnoea-test
          - polysomnography
          - overnight-oximetry
          - multiple-sleep-latency-test
          - actigraphy
          - other
          - ''
          description: 'Performed study type: home-sleep-apnoea-test, polysomnography, overnight-oximetry,
            multiple-sleep-latency-test, actigraphy, other.'
        study_adequacy:
          type: string
          enum:
          - adequate
          - limited
          - failed
          - ''
          description: 'Diagnostic adequacy of the study: adequate, limited, failed (e.g. insufficient
            recording time or signal loss).'
        clinical_history:
          type: string
          maxLength: 1000
          description: Clinical history and the question the study was performed to answer.
        comparison_with_previous:
          type: string
          maxLength: 1000
          description: Comparison with relevant previous sleep studies.
        total_recording_time_hours:
          type: number
          format: double
          description: Total recording time in hours.
        total_sleep_time_hours:
          type: number
          format: double
          description: Total sleep time in hours (for attended polysomnography with sleep staging).
        apnoea_hypopnoea_index:
          type: number
          format: double
          description: 'Apnoea-Hypopnoea Index (AHI): events per hour. AASM bands: normal <5, mild 5 to
            <15, moderate 15 to <30, severe >=30.'
        oxygen_desaturation_index:
          type: number
          format: double
          description: 'Oxygen Desaturation Index (ODI): >=3% (or >=4%) desaturations per hour.'
        minimum_spo2_percent:
          type: number
          format: double
          description: Lowest (nadir) oxygen saturation recorded, as a percentage.
        time_below_90_percent_spo2:
          type: number
          format: double
          description: Percentage of recording / sleep time spent with SpO2 below 90% (T90).
        mean_heart_rate_bpm:
          type: integer
          format: int32
          description: Mean heart rate during the study, in beats per minute.
        osa_severity:
          type: string
          enum:
          - none
          - mild
          - moderate
          - severe
          - ''
          description: 'OSA severity band derived from AHI: none, mild, moderate, severe.'
        obstructive_sleep_apnoea:
          type: boolean
          description: Whether obstructive sleep apnoea is present.
        central_sleep_apnoea:
          type: boolean
          description: Whether central sleep apnoea (e.g. Cheyne-Stokes respiration) is present.
        periodic_limb_movements:
          type: boolean
          description: Whether periodic limb movements of sleep are present.
        nocturnal_hypoventilation:
          type: boolean
          description: Whether nocturnal hypoventilation (e.g. sustained hypercapnia / obesity hypoventilation)
            is present.
        significant_desaturation:
          type: boolean
          description: Whether significant oxygen desaturation is present.
        normal_study:
          type: boolean
          description: Whether the study is normal (no significant sleep-disordered breathing).
        findings_narrative:
          type: string
          maxLength: 2000
          description: Narrative description of the study findings (the body of the report).
        impression:
          type: string
          maxLength: 2000
          description: Summary impression / conclusion answering the clinical question.
        reporting_category:
          type: string
          maxLength: 50
          description: Free-text structured-reporting label for the AHI severity band (e.g. "Severe OSA
            (AHI >=30)").
        recommended_follow_up:
          type: string
          maxLength: 1000
          description: Recommended follow-up management (e.g. CPAP titration, ventilation review, sleep-clinic
            referral).
        critical_result_communicated:
          type: boolean
          description: Whether a critical or unexpected significant result was communicated directly to
            the referrer.
        reported_to:
          type: string
          maxLength: 500
          description: Who the critical / urgent result was communicated to, with date and time if applicable.
      required:
      - created_at
      - updated_at
      - patient_id
      - clinician_id
      - originating_request_reference
      - report_status
      - study_type
      - study_adequacy
      - clinical_history
      - comparison_with_previous
      - osa_severity
      - obstructive_sleep_apnoea
      - central_sleep_apnoea
      - periodic_limb_movements
      - nocturnal_hypoventilation
      - significant_desaturation
      - normal_study
      - findings_narrative
      - impression
      - reporting_category
      - recommended_follow_up
      - critical_result_communicated
      - reported_to
      description: Sleep study / polysomnography result (report). Captures the performed study type and
        adequacy, clinical history, the key quantitative metrics (recording and sleep time, apnoea-hypopnoea
        index, oxygen desaturation index, minimum and time-below-90% SpO2, mean heart rate), the OSA severity
        band, the narrative and structured findings, the impression, recommended follow-up, and critical-result
        communication. This is the source-of-truth record that the four-axis interpretation grade is computed
        from.
    SleepStudyTestResultGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        sleep_study_test_result_id:
          type: string
          format: uuid
          description: Foreign key to the parent result (unique, 1:1).
        result_classification:
          type: string
          enum:
          - normal
          - abnormal
          - critical
          - inconclusive
          - ''
          description: 'Axis A overall classification: normal, abnormal, critical, inconclusive.'
        abnormality_severity:
          type: string
          enum:
          - none
          - minor
          - moderate
          - major
          - ''
          description: 'Axis B abnormality severity: none, minor, moderate, major.'
        reporting_category:
          type: string
          maxLength: 50
          description: Axis B structured-reporting score / category label (the AHI severity band, e.g.
            "Severe OSA (AHI >=30)").
        report_completeness_percent:
          type: integer
          format: int32
          description: Axis C report completeness as a percentage of mandatory report sections (0-100).
        follow_up_urgency:
          type: string
          enum:
          - routine
          - recommended
          - urgent
          - critical-alert
          - ''
          description: 'Axis D follow-up urgency: routine, recommended, urgent, critical-alert.'
        target_timeframe:
