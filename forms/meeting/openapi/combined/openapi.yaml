        signed_by:
          type: string
          maxLength: 255
          description: Name or identifier of the organiser who signed off.
        signed_at:
          type: string
          format: date-time
          description: Timestamp of the organiser electronic signature.
        graded_at:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the result.
