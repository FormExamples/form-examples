            incomplete.'
        overall_health:
          type: string
          enum:
          - green
          - amber
          - red
          - ''
          description: 'Overall health: green (no flags), amber (low/medium flags), red (high-priority
            flag fired).'
        override_reason:
          type: string
          maxLength: 500
