components:
  schemas:
    ActionItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        meetingId:
          type: string
          format: uuid
          description: Foreign key to the parent meeting.
        position:
          type: integer
          format: int32
          description: Zero-based ordinal of the action item in the list.
        title:
          type: string
          maxLength: 255
          description: Short imperative title of the action.
        description:
          type: string
