              $ref: '#/components/schemas/Resource'
      responses:
        '200':
          description: The updated Resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resource'
        '404':
          description: Resource not found
    delete:
      summary: Soft-delete a Resource
      operationId: deleteResource
      responses:
        '204':
          description: Resource deleted
        '404':
          description: Resource not found
components:
