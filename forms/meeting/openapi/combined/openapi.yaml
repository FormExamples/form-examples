    MeetingGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        meeting_id:
          type: string
          format: uuid
          description: Foreign key to the parent meeting row (unique, 1:1).
        duration_minutes:
          type: integer
          format: int32
          description: Derived duration in minutes from actual_start_at to actual_end_at, or scheduled
            fallback.
        agenda_item_count:
          type: integer
          format: int32
          description: Derived count of agenda_item rows.
        participant_count:
          type: integer
          format: int32
          description: Derived count of participant rows.
        accepted_count:
          type: integer
          format: int32
          description: Derived count of participants with response_status = accepted.
        declined_count:
          type: integer
          format: int32
          description: Derived count of participants with response_status = declined.
        attended_count:
          type: integer
          format: int32
          description: Derived count of participants with attendance_status = present or late or remote.
        action_item_count:
          type: integer
          format: int32
          description: Derived count of action_item rows.
        output_count:
          type: integer
          format: int32
          description: Derived count of meeting_output rows.
        outcome_count:
          type: integer
          format: int32
          description: Derived count of meeting_outcome rows.
