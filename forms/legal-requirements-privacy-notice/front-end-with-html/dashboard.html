<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Legal Requirements Privacy Notice — Clinician Dashboard</title>
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
    <header>
      <div class="container page-header-bar">
        <div class="page-header-title">
          <h1>Legal Requirements Privacy Notice</h1>
          <p>Clinician Dashboard — Patient Acknowledgments</p>
        </div>
        <div class="page-header-controls no-print">
          <label class="visually-hidden" for="locale-select">Language</label>
          <select class="theme-select" id="locale-select" aria-label="Language">
          <option class="theme-select-option" value="en-GB" selected lang="en-GB">English (UK)</option>
          <option class="theme-select-option" value="en-US" lang="en-US">English (US)</option>
          <option class="theme-select-option" value="cy-GB" lang="cy-GB">Cymraeg</option>
          <option class="theme-select-option" value="de-DE" lang="de-DE">Deutsch</option>
          </select>
          <label class="visually-hidden" for="text-size-chooser">Text size</label>
          <select class="theme-select" id="text-size-chooser" aria-label="Text size">
          <option class="theme-select-option" value="small">Small</option>
          <option class="theme-select-option" value="medium" selected>Medium</option>
          <option class="theme-select-option" value="large">Large</option>
          <option class="theme-select-option" value="x-large">X Large</option>
          </select>
          <div class="share-chooser">
          <button type="button" class="share-chooser-button" id="share-chooser" aria-label="Share this page" aria-expanded="false" aria-controls="share-chooser-list">
          <span class="share-chooser-icon" aria-hidden="true">↪</span>
          </button>
          <ul class="share-chooser-list" id="share-chooser-list" hidden>
          <li class="share-chooser-list-item">
          <button type="button" class="share-chooser-copy" id="share-chooser-copy">Copy link</button>
          </li>
          </ul>
          <p class="share-chooser-status" id="share-chooser-status" aria-live="polite"></p>
          </div>
        </div>
      </div>
    </header>

    <main class="container">
        <div class="card">
            <div class="filters">
                <input type="text" id="search" placeholder="Search by name or NHS number...">
                <select id="statusFilter">
                    <option value="all">All statuses</option>
                    <option value="complete">Complete</option>
                    <option value="incomplete">Incomplete</option>
                </select>
                <button class="btn-clear" id="clearBtn">Clear filters</button>
            </div>
            <p class="count">Showing <span id="showing">0</span> of <span id="total">0</span> acknowledgments</p>
            <table>
                <thead>
                    <tr>
                        <th data-sort="patientName">Patient Name <span class="sort-arrow">&#9650;&#9660;</span></th>
                        <th data-sort="nhsNumber">NHS Number <span class="sort-arrow">&#9650;&#9660;</span></th>
                        <th data-sort="acknowledgedDate">Acknowledged Date <span class="sort-arrow active">&#9660;</span></th>
                        <th data-sort="status">Status <span class="sort-arrow">&#9650;&#9660;</span></th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
            <div class="empty-state" id="emptyState">No matching acknowledgments found.</div>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>This notice is provided in accordance with UK GDPR Articles 6(1)(c) and 9(2)(h).</p>
        </div>
    </footer>

    <script>
        const sampleData = [
            { id: '1', patientName: 'Sarah Thompson', nhsNumber: '943 476 5919', acknowledgedDate: '2026-04-15', status: 'complete' },
            { id: '2', patientName: 'James Wilson', nhsNumber: '725 183 4062', acknowledgedDate: '2026-04-14', status: 'complete' },
            { id: '3', patientName: 'Emily Roberts', nhsNumber: '481 927 3658', acknowledgedDate: '2026-04-14', status: 'complete' },
            { id: '4', patientName: 'Mohammed Ali Khan', nhsNumber: '612 845 9073', acknowledgedDate: '2026-04-13', status: 'complete' },
            { id: '5', patientName: 'Catherine Davies', nhsNumber: '358 271 6490', acknowledgedDate: '', status: 'incomplete' },
            { id: '6', patientName: 'Robert Patel', nhsNumber: '894 536 1027', acknowledgedDate: '2026-04-12', status: 'complete' },
            { id: '7', patientName: "Margaret O'Brien", nhsNumber: '167 493 8205', acknowledgedDate: '', status: 'incomplete' },
            { id: '8', patientName: 'David Chen', nhsNumber: '539 718 2046', acknowledgedDate: '2026-04-11', status: 'complete' }
        ];

        let data = [...sampleData];
        let sortKey = 'acknowledgedDate';
        let sortDir = 'desc';

        const searchInput = document.getElementById('search');
        const statusSelect = document.getElementById('statusFilter');
        const clearBtn = document.getElementById('clearBtn');
        const tableBody = document.getElementById('tableBody');
        const showingEl = document.getElementById('showing');
        const totalEl = document.getElementById('total');
        const emptyState = document.getElementById('emptyState');

        function getFiltered() {
            let rows = data;
            const q = searchInput.value.toLowerCase().trim();
            const status = statusSelect.value;

            if (q) {
                rows = rows.filter(r =>
                    r.patientName.toLowerCase().includes(q) ||
                    r.nhsNumber.includes(q)
                );
            }
            if (status !== 'all') {
                rows = rows.filter(r => r.status === status);
            }

            rows.sort((a, b) => {
                let va = a[sortKey] || '';
                let vb = b[sortKey] || '';
                if (va < vb) return sortDir === 'asc' ? -1 : 1;
                if (va > vb) return sortDir === 'asc' ? 1 : -1;
                return 0;
            });

            return rows;
        }

        function render() {
            const filtered = getFiltered();
            showingEl.textContent = filtered.length;
            totalEl.textContent = data.length;

            const hasFilters = searchInput.value !== '' || statusSelect.value !== 'all';
            clearBtn.classList.toggle('visible', hasFilters);

            if (filtered.length === 0) {
                tableBody.innerHTML = '';
                emptyState.style.display = 'block';
                return;
            }
            emptyState.style.display = 'none';

            tableBody.innerHTML = filtered.map(row => `
                <tr>
                    <td>${escapeHtml(row.patientName)}</td>
                    <td>${escapeHtml(row.nhsNumber)}</td>
                    <td>${row.acknowledgedDate || '—'}</td>
                    <td><span class="badge badge-${row.status}">${row.status === 'complete' ? 'Complete' : 'Incomplete'}</span></td>
                </tr>
            `).join('');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        searchInput.addEventListener('input', render);
        statusSelect.addEventListener('change', render);
        clearBtn.addEventListener('click', () => {
            searchInput.value = '';
            statusSelect.value = 'all';
            render();
        });

        document.querySelectorAll('th[data-sort]').forEach(th => {
            th.addEventListener('click', () => {
                const key = th.dataset.sort;
                if (sortKey === key) {
                    sortDir = sortDir === 'asc' ? 'desc' : 'asc';
                } else {
                    sortKey = key;
                    sortDir = 'asc';
                }
                document.querySelectorAll('.sort-arrow').forEach(el => {
                    el.classList.remove('active');
                    el.innerHTML = '&#9650;&#9660;';
                });
                const arrow = th.querySelector('.sort-arrow');
                arrow.classList.add('active');
                arrow.innerHTML = sortDir === 'asc' ? '&#9650;' : '&#9660;';
                render();
            });
        });

        render();
    </script>
<script>
// Dashboard table export — generic CSV / TSV download of the rendered table.
//
// Shared, form-agnostic: on load it finds the dashboard's primary data table
// (any `table[id$="-table"]`, else the first table in the main region) and
// injects a small toolbar with "Download CSV" and "Download TSV" buttons above
// it. Clicking serialises the currently rendered header + visible body rows —
// so active filters and sorting are reflected — with correct delimiter
// escaping, and triggers a download. No per-form knowledge required.
(function () {
  'use strict';

  function findTable() {
    return (
      document.querySelector('table[id$="-table"]') ||
      document.querySelector('main table') ||
      document.querySelector('table')
    );
  }

  function cellText(cell) {
    return (cell.textContent || '').replace(/\s+/g, ' ').trim();
  }

  function visibleRows(tbody) {
    return Array.from(tbody.querySelectorAll('tr')).filter((tr) => {
      if (tr.hasAttribute('hidden')) return false;
      if (tr.getAttribute('aria-hidden') === 'true') return false;
      const style = tr.ownerDocument.defaultView.getComputedStyle(tr);
      if (style.display === 'none' || style.visibility === 'hidden') return false;
      // A placeholder "no results" row has a single cell spanning the table.
      const cells = tr.querySelectorAll('td, th');
      if (cells.length === 1 && cells[0].hasAttribute('colspan')) return false;
      return true;
    });
  }

  function escapeField(value, sep) {
    // Quote when the field contains the delimiter, a quote, or a newline.
    if (value.includes('"') || value.includes('\n') || value.includes(sep)) {
      return '"' + value.replace(/"/g, '""') + '"';
    }
    return value;
  }

  function serialise(table, sep) {
    const rows = [];
    const headCells = table.querySelectorAll('thead th, thead td');
    if (headCells.length) {
      rows.push(Array.from(headCells).map((c) => escapeField(cellText(c), sep)).join(sep));
    }
    const tbody = table.querySelector('tbody');
    if (tbody) {
      for (const tr of visibleRows(tbody)) {
        const cells = tr.querySelectorAll('td, th');
        rows.push(Array.from(cells).map((c) => escapeField(cellText(c), sep)).join(sep));
      }
    }
    return rows.join('\r\n') + '\r\n';
  }

  function download(text, mime, filename) {
    const blob = new Blob([text], { type: mime + ';charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function baseName(table) {
    const id = (table.id || 'dashboard').replace(/-table$/, '');
    return id || 'dashboard';
  }

  function makeButton(label, onClick) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'button';
    btn.setAttribute('data-variant', 'secondary');
    btn.textContent = label;
    btn.addEventListener('click', onClick);
    return btn;
  }

  function init() {
    const table = findTable();
    if (!table || table.dataset.exportReady === 'true') return;
    table.dataset.exportReady = 'true';

    const bar = document.createElement('div');
    bar.className = 'table-export-bar no-print';
    bar.setAttribute('role', 'group');
    bar.setAttribute('aria-label', 'Export table');
    bar.style.cssText = 'display:flex;gap:0.5rem;margin:0 0 0.75rem;flex-wrap:wrap;';

    const name = baseName(table);
    bar.appendChild(makeButton('Download CSV', function () {
      download(serialise(table, ','), 'text/csv', name + '-export.csv');
    }));
    bar.appendChild(makeButton('Download TSV', function () {
      download(serialise(table, '\t'), 'text/tab-separated-values', name + '-export.tsv');
    }));

    const anchor = table.closest('figure, section, div') || table;
    anchor.parentNode.insertBefore(bar, anchor);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
  <script type="module" src="js/text-size-chooser.js"></script>
  <script type="module" src="js/share-chooser.js"></script>
  <script type="module" src="js/locale-select.js"></script>
</body>
</html>
