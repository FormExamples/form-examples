    UnitedKingdomMarriageCertificateApplicationGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        unitedKingdomMarriageCertificateApplicationId:
          type: string
          format: uuid
          description: Foreign key to the parent certificate (unique, 1:1).
        validityClass:
          type: string
          enum:
          - ready-to-submit
          - incomplete
          - needs-evidence
          - ineligible
          - ''
          description: 'Application class: ready-to-submit, incomplete, needs-evidence, or ineligible.'
        earliestCeremonyDate:
          type:
          - string
          - 'null'
          format: date
          description: 'Earliest permitted ceremony date: notice date plus 29 days (a later date when
            immigration referral applies is not computed).'
        latestCeremonyDate:
          type:
          - string
          - 'null'
          format: date
          description: 'Latest valid ceremony date: 12 months after the notice date.'
        immigrationReferralIndicated:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether a party's immigration status means notice must be given together and may
            be referred to the Home Office (yes/no).
        gradedAt:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the classification.
      required:
      - createdAt
      - updatedAt
      - unitedKingdomMarriageCertificateApplicationId
      - validityClass
      - immigrationReferralIndicated
      - gradedAt
      description: 'Computed completeness and validity-classification result for a United Kingdom marriage
        certificate application: class (ready-to-submit/incomplete/needs-evidence/ineligible), earliest
        and latest permitted ceremony dates, and whether an immigration referral is indicated.'
