components:
  schemas:
    Applicant:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Full name of the applicant who submits the application.
        birthDate:
          type:
          - string
          - 'null'
          format: date
          description: Date of birth of the applicant.
        email:
          type: string
          description: Email address of the applicant.
        phone:
          type: string
          description: Telephone number of the applicant.
        postalAddressAsFullText:
          type: string
          description: Postal address of the applicant as full text; a UK contact address if the home
            address is overseas.
        postcode:
          type: string
          description: Postcode of the applicant.
      required:
      - createdAt
      - updatedAt
      - name
      - email
      - phone
      - postalAddressAsFullText
      - postcode
      description: Applicant who gives notice of marriage or civil partnership and submits the United
        Kingdom marriage certificate application, with contact details.
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          description: A URI identifying the problem type
        title:
          type: string
          description: A short summary of the problem type
        status:
          type: integer
          description: The HTTP status code
        detail:
          type: string
          description: An explanation of this occurrence
        instance:
          type: string
          description: A URI identifying this occurrence
        code:
          type: string
          description: A short machine-readable reason
        errors:
          type: object
          description: Per-field detail, when validation failed
      required:
      - type
      - title
      - status
    Registrar:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Full name of the registrar handling the notice.
        email:
          type: string
          description: Email address of the register office.
        phone:
          type: string
          description: Telephone number of the register office.
        postalAddressAsFullText:
          type: string
          description: Postal address of the register office as full text.
        postcode:
          type: string
          description: Postcode of the register office.
        role:
          type: string
          enum:
          - registrar
          - superintendent-registrar
          - deputy-registrar
          - other
          - ''
          description: 'Role of the officer: registrar, superintendent-registrar, deputy-registrar, or
            other.'
        registrationBody:
          type: string
          enum:
          - GRO
          - local-authority
          - other
          - ''
          description: 'Body that employs or oversees the registrar: the General Register Office, a local
            authority, or other.'
        registrationNumber:
          type: string
          description: Registrar's authorization or staff reference number.
      required:
      - createdAt
      - updatedAt
      - name
      - email
      - phone
      - postalAddressAsFullText
      - postcode
      - role
      - registrationBody
      - registrationNumber
      description: Registrar or register-office officer who receives the notice and checks the evidence
        for the United Kingdom marriage certificate application.
    UnitedKingdomMarriageCertificateApplication:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        applicantId:
          type: string
          format: uuid
          description: Foreign key to the applicant who submits this application (restrict delete).
        registrarId:
          type:
          - string
          - 'null'
          format: uuid
          description: Foreign key to the registrar handling the notice (restrict delete); optional.
        noticeType:
          type: string
          enum:
          - marriage
          - civil-partnership
          - ''
          description: Whether notice is for a marriage or a civil partnership.
        noticeDate:
          type:
          - string
          - 'null'
          format: date
          description: Date notice is (or will be) given at the register office.
        registrationDistrict:
          type: string
          description: Registration district where notice is given.
        noticeGivenTogether:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether both parties give notice together at one designated register office (yes/no).
        ceremonyType:
          type: string
          enum:
          - civil-register-office
          - civil-approved-premises
          - religious-registered-building
          - anglican
          - ''
          description: Kind of ceremony planned.
        ceremonyDate:
          type:
          - string
          - 'null'
          format: date
          description: Planned ceremony date; at least 29 days after notice and within 12 months of it.
        venueName:
          type: string
          description: Name and address of the final ceremony venue.
        venueConfirmed:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the final venue is confirmed and can be shown at the notice appointment
            (yes/no).
        closelyRelated:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the parties are within the prohibited degrees of relationship (yes/no).
        witnessCount:
          type:
          - integer
          - 'null'
          format: int32
          description: Number of witnesses arranged; at least two are required.
        partyOneName:
          type: string
          description: Full name of the first party as it will appear on the notice and certificate.
        partyOneDateOfBirth:
          type:
          - string
          - 'null'
          format: date
          description: Date of birth of the first party; both parties must be 18 or over on the ceremony
            date.
        partyOneDaysResidentInDistrict:
          type:
          - integer
          - 'null'
          format: int32
          description: Whole days the first party has lived in the registration district where notice
            is given; at least 7 are required.
        partyOneNationalityStatus:
          type: string
          enum:
          - british-or-irish
          - eu-settlement-scheme
          - other
          - ''
          description: 'Immigration route of the first party: british-or-irish, eu-settlement-scheme (settled
            or pre-settled), or other (needs immigration evidence and joint notice).'
        partyOneMaritalStatus:
          type: string
          enum:
          - never-married
          - divorced
          - widowed
          - dissolved-civil-partnership
          - annulled
          - currently-married-or-civil-partnered
          - ''
          description: Marital or civil partnership status of the first party; currently-married-or-civil-partnered
            bars a new marriage.
        partyOneIdentityProvided:
          type: string
          enum:
          - 'yes'
