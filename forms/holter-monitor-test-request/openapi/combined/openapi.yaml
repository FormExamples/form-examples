components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Name.
        email:
          type: string
          description: Email address.
        phone:
          type: string
          description: Phone number.
        postal_address_as_full_text:
          type: string
          description: Postal address as full text.
        country_as_iso_3166_1_alpha_2:
          type: string
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type: string
          description: Postal code, such as for validating the postal address.
        role:
          type: string
          enum:
          - cardiologist
          - gp
          - hospital-doctor
          - physiologist
          - nurse
          - other
          - ''
          description: 'Clinician role: cardiologist, gp, hospital-doctor, physiologist, nurse, other.'
        registration_body:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - other
          - ''
          description: 'Clinician registration body: GMC, NMC, HCPC, other.'
        registration_number:
          type: string
          description: Clinician registration number.
        united_kingdom_nhs_number:
          type: string
          maxLength: 12
          description: United Kingdom NHS number, unique per person.
      required:
      - created_at
      - updated_at
      - name
      - role
      - registration_body
      - registration_number
      description: Requesting clinician (referrer) who completes the Holter monitor request.
    HolterMonitorTestRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patient_id:
          type: string
          format: uuid
          description: Foreign key to the patient.
        clinician_id:
          type: string
          format: uuid
          description: Foreign key to the requesting clinician (referrer).
        status:
          type: string
          enum:
          - draft
          - submitted
          - vetted
          - scheduled
          - rejected
          - ''
          description: 'Request lifecycle status: draft, submitted, vetted, scheduled, rejected.'
        site_name:
          type: string
          maxLength: 255
          description: Name of the requesting site or clinic.
        setting:
          type: string
          enum:
          - outpatient
          - inpatient
          - community
          - emergency
          - ''
          description: 'Care setting: outpatient, inpatient, community, emergency.'
        referral_date:
          type: string
          format: date
          description: Date the referral was made.
        requested_by_date:
          type: string
          format: date
          description: Date by which the monitoring is requested to be performed.
        monitor_type:
          type: string
          enum:
          - 24-hour
          - 48-hour
          - 7-day
          - 14-day
          - event-recorder
          - implantable-loop-recorder
          - other
          - ''
          description: 'Requested monitor type: 24-hour, 48-hour, 7-day, 14-day, event-recorder, implantable-loop-recorder,
            other. Used for symptom-frequency / monitor-duration appropriateness.'
        primary_indication:
          type: string
          enum:
          - palpitations
          - suspected-arrhythmia
          - syncope
          - atrial-fibrillation-detection
          - post-stroke-af-screen
          - rate-control-assessment
          - qt-monitoring
          - pacemaker-check
          - other
          - ''
          description: Primary clinical indication, used for appropriateness scoring.
        clinical_question:
          type: string
          maxLength: 1000
          description: Specific clinical question the monitoring should answer (highest-value field).
        relevant_history:
          type: string
          maxLength: 1000
          description: Relevant cardiac, medical, and surgical history.
        symptom_palpitations:
          type: boolean
          description: Whether the patient reports palpitations.
        symptom_syncope:
          type: boolean
          description: Whether the patient reports syncope (red flag).
        symptom_presyncope:
          type: boolean
          description: Whether the patient reports presyncope / near-syncope.
        symptom_breathlessness:
          type: boolean
          description: Whether the patient reports breathlessness.
        symptom_frequency:
          type: string
          enum:
          - daily
          - weekly
          - monthly
          - rare
          - ''
          description: 'Frequency of symptoms: daily, weekly, monthly, rare. Drives monitor-duration matching.'
        known_arrhythmia:
          type: string
          enum:
          - none
          - atrial-fibrillation
          - svt
          - vt
          - heart-block
          - other
          - ''
          description: 'Known arrhythmia: none, atrial-fibrillation, svt, vt, heart-block, other.'
        recent_stroke_tia:
          type: boolean
          description: Whether the patient has had a recent stroke or TIA (AF-detection driver).
        relevant_medications:
          type: string
          maxLength: 1000
          description: Relevant current medications (e.g. rate-control, antiarrhythmics, QT-prolonging
            drugs).
        urgency:
          type: string
          enum:
          - routine
          - urgent
          - ''
          description: 'Requested triage urgency: routine, urgent.'
        supervising_consultant:
          type: string
          maxLength: 255
          description: Name of the supervising / responsible consultant.
        requester_contact:
          type: string
          maxLength: 255
          description: Contact details (bleep / phone) for the requester.
        notes:
          type: string
          maxLength: 1000
          description: Free-text additional notes.
      required:
      - created_at
      - updated_at
      - patient_id
      - clinician_id
      - status
      - site_name
      - setting
      - monitor_type
      - primary_indication
      - clinical_question
      - relevant_history
      - symptom_palpitations
      - symptom_syncope
      - symptom_presyncope
      - symptom_breathlessness
      - symptom_frequency
      - known_arrhythmia
      - recent_stroke_tia
      - relevant_medications
      - urgency
      - supervising_consultant
      - requester_contact
      - notes
      description: Ambulatory ECG (Holter) monitoring request (referral). Captures the requested monitor
        type, primary indication and clinical question, symptoms and symptom frequency, cardiac context
        and red flags, relevant history and medications, and triage urgency.
    HolterMonitorTestRequestGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        holter_monitor_test_request_id:
          type: string
          format: uuid
          description: Foreign key to the parent request (unique, 1:1).
        appropriateness_score:
          type: integer
          format: int32
          description: AHA/ACC ambulatory ECG appropriateness score (1-9), matching indication and symptom
            frequency to monitor type.
        appropriateness_band:
          type: string
          enum:
          - usually-appropriate
          - may-be-appropriate
          - usually-not-appropriate
          - ''
          description: 'Appropriateness band: usually-appropriate (7-9), may-be-appropriate (4-6), usually-not-appropriate
            (1-3).'
        triage_tier:
          type: string
          enum:
          - routine
          - urgent
          - emergency
          - ''
          description: 'Assigned triage tier: routine, urgent, emergency.'
        target_timeframe:
          type: string
          maxLength: 50
          description: Target timeframe for the monitoring implied by the triage tier.
        completeness_percent:
          type: integer
          format: int32
          description: Request completeness as a percentage of mandatory fields (0-100).
        priority_band:
          type: string
          enum:
          - low
          - moderate
          - high
          - ''
          description: 'Clinical priority band: low, moderate, high.'
        recommendation:
          type: string
          enum:
          - accept
          - query-referrer
          - redirect
          - reject
          - ''
          description: 'Vetting recommendation: accept, query-referrer, redirect, reject.'
        clinician_notes:
          type: string
          description: Free-text vetting notes.
        signed_at:
          type: string
          format: date-time
          description: Timestamp of vetting clinician electronic signature.
        graded_at:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the result.
      required:
      - created_at
      - updated_at
      - holter_monitor_test_request_id
      - appropriateness_band
      - triage_tier
      - target_timeframe
      - priority_band
      - recommendation
      - clinician_notes
      - graded_at
      description: 'Computed four-axis grading result: appropriateness (AHA/ACC ambulatory ECG 1-9), urgency
        / triage, request completeness, and clinical priority.'
    HolterMonitorTestRequestGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        holter_monitor_test_request_grade_id:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        flag_id:
          type: string
          maxLength: 50
          description: Stable flag identifier (e.g. F-SYNCOPE-RED-FLAG-001).
        category:
          type: string
          enum:
          - syncope-red-flag
          - suspected-vt
          - post-stroke-af-detection
          - symptom-frequency-monitor-mismatch
          - missing-indication
          - missing-clinical-question
          - other
          - ''
          description: Flag category.
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          - ''
          description: 'Priority: low, medium, high.'
        description:
          type: string
          maxLength: 500
          description: Human-readable description of what fired the flag.
        suggested_action:
          type: string
          maxLength: 500
          description: Suggested clinical action (e.g. "escalate to same-day cardiology review").
      required:
      - created_at
      - updated_at
      - holter_monitor_test_request_grade_id
      - flag_id
      - category
      - priority
      - description
      - suggested_action
      description: Safety-critical flags that fire independently of the four axes, with priority and a
        suggested action for the cardiac physiology / vetting team.
    HolterMonitorTestRequestGradeRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        holter_monitor_test_request_grade_id:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        rule_id:
          type: string
          maxLength: 40
          description: Stable rule identifier (e.g. R-APPROP-PALPITATIONS-01).
        axis:
          type: string
          enum:
          - appropriateness
          - urgency
          - completeness
          - priority
          - ''
          description: 'Scoring axis the rule belongs to: appropriateness, urgency, completeness, priority.'
        category:
          type: string
          maxLength: 50
          description: Category or indication the rule relates to.
        description:
          type: string
          maxLength: 500
          description: Human-readable description of why the rule fired.
      required:
      - created_at
      - updated_at
      - holter_monitor_test_request_grade_id
      - rule_id
      - axis
      - category
      - description
      description: Audit trail of every appropriateness / urgency / completeness / priority rule that
        fired for this request.
    Patient:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          maxLength: 255
          description: Name.
        birth_date:
          type: string
          format: date
          description: Birth date.
        email:
          type: string
          description: Email address.
        phone:
          type: string
          description: Phone number.
        postal_address_as_full_text:
          type: string
          description: Postal address as full text.
        country_as_iso_3166_1_alpha_2:
          type: string
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type: string
          description: Postal code, such as for validating the postal address.
        united_kingdom_nhs_number:
          type: string
          maxLength: 20
          description: United Kingdom NHS number, unique per person.
        waist_as_cm:
          type: number
          format: double
          description: Waist circumference measurement in cm, such as for calculating waist-height ratio
            (WHR).
        height_as_cm:
          type: number
          format: double
          description: Height measurement in cm, such as for calculating waist-height ratio (WHR).
        weight_as_kg:
          type: number
          format: double
          description: Weight as kg.
        body_mass_index:
          type: number
          format: double
          description: Body mass index (BMI) measurement.
        waist_height_ratio:
          type: number
          format: double
          description: Waist-height ratio (WHR) measurement.
        vo2_max:
          type: number
          format: double
          description: VO2 max measurement.
      required:
      - created_at
      - updated_at
      - name
      - birth_date
      description: Patient
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          description: A URI identifying the problem type
        title:
          type: string
          description: A short summary of the problem type
        status:
          type: integer
          description: The HTTP status code
        detail:
          type: string
          description: An explanation of this occurrence
        instance:
          type: string
          description: A URI identifying this occurrence
        code:
          type: string
          description: A short machine-readable reason
        errors:
          type: object
          description: Per-field detail, when validation failed
      required:
      - type
      - title
      - status
