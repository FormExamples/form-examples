components:
  schemas:
    RadiologyWaitingListCard:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        patient_id:
          type: string
          format: uuid
          description: Foreign key to the patient placed on the list.
        practitioner_id:
          type: string
          format: uuid
          description: Foreign key to the practitioner who placed the patient on the list.
        status:
          type: string
          enum:
          - draft
          - submitted
          - reviewed
          - closed
          description: 'Lifecycle status: draft, submitted, reviewed, or closed.'
        entry_date:
          type: string
          format: date
          description: Date the practitioner entered the card.
        entry_time:
          type: string
          format: time
          description: Time the practitioner entered the card.
        referral_source:
          type: string
          enum:
          - gp
          - consultant
          - a-and-e
          - self
          - community
          - screening
          - other
          - ''
          description: 'Where the referral originated: gp, consultant, a-and-e, self, community, screening,
            other.'
        referral_date:
          type: string
          format: date
          description: Date the referral was made.
        referral_letter_reference:
          type: string
          maxLength: 100
          description: Reference number / identifier for the originating referral letter.
        reason_for_referral:
          type: string
          description: Free-text reason for referral.
        presenting_condition:
          type: string
          description: Free-text presenting condition / clinical summary.
        icd_10_code:
          type: string
          maxLength: 20
          description: ICD-10 diagnostic code for the presenting condition.
        snomed_ct_code:
          type: string
          maxLength: 30
          description: SNOMED CT clinical concept code for the presenting condition.
        suspected_cancer:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether this is a suspected-cancer (two-week wait) referral.
        list_name:
          type: string
          maxLength: 255
          description: Display name for the waiting list (e.g. "Orthopaedic — knee replacement").
        specialty:
          type: string
          maxLength: 100
          description: NHS specialty (e.g. "Trauma & Orthopaedics").
        sub_specialty:
          type: string
          maxLength: 100
          description: NHS sub-specialty (e.g. "Knee surgery").
        procedure_description:
          type: string
          description: Plain-language description of what the patient is waiting to do.
        opcs_4_code:
          type: string
          maxLength: 20
          description: OPCS-4 procedure code if a specific procedure is planned.
        clinical_priority:
          type: string
          enum:
          - P1a
          - P1b
          - P2
          - P3
          - P4
          - P5
          - P6
          - ''
          description: 'NHS England clinical priority: P1a, P1b, P2, P3, P4, P5, P6.'
        rtt_clock_start_date:
          type: string
          format: date
          description: Referral to Treatment (RTT) clock-start date. The date the patient joined the list.
        expected_procedure_type:
          type: string
          enum:
          - first-outpatient-appointment
          - follow-up-appointment
          - day-case-procedure
          - inpatient-procedure
          - diagnostic
          - therapy
          - multi-disciplinary-team-review
          - other
          - ''
          description: Expected next event for the patient.
        expected_wait_weeks:
          type: integer
          format: int32
          description: Expected wait, in weeks, communicated to the patient at entry.
        consent_to_reminders:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the patient has consented to appointment reminders.
        communication_notes:
          type: string
          description: Free-text communication preferences and notes.
        additional_notes:
          type: string
          description: Free-text practitioner sign-off notes.
        signed_at:
          type: string
          format: date-time
          description: Timestamp of practitioner electronic signature.
      required:
      - created_at
      - updated_at
      - patient_id
      - practitioner_id
      - status
      - referral_source
      - referral_letter_reference
      - reason_for_referral
      - presenting_condition
      - icd_10_code
      - snomed_ct_code
      - suspected_cancer
      - list_name
      - specialty
      - sub_specialty
      - procedure_description
      - opcs_4_code
      - clinical_priority
      - expected_procedure_type
      - consent_to_reminders
      - communication_notes
      - additional_notes
      description: Top-level record placing a patient on a radiology waiting list. Parent of appointment(s)
        and grading result.
    RadiologyWaitingListCardAppointment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        radiology_waiting_list_card_id:
          type: string
          format: uuid
          description: Foreign key to the parent waiting list card.
        appointment_date:
          type: string
          format: date
          description: Date of the appointment.
        appointment_time:
          type: string
          format: time
          description: Start time of the appointment.
        duration_minutes:
          type: integer
          format: int32
          description: Planned duration in minutes.
        appointment_type:
          type: string
          enum:
          - first-outpatient
          - follow-up
          - pre-assessment
          - diagnostic
          - treatment
          - procedure
          - admission
          - telephone
          - video
          - other
          - ''
          description: 'Appointment type: first-outpatient, follow-up, pre-assessment, diagnostic, treatment,
            procedure, admission, telephone, video, other.'
        site_name:
          type: string
          maxLength: 255
          description: Name of the site (hospital, clinic, or community location).
        site_address:
          type: string
          description: Postal address of the site, suitable for printing on a patient letter.
        clinic_name:
          type: string
          maxLength: 255
          description: Name of the clinic within the site.
        room:
          type: string
          maxLength: 100
          description: Room or location reference within the clinic.
        clinician_name:
          type: string
          maxLength: 255
          description: Name of the attending clinician, if known.
        clinician_team:
          type: string
          maxLength: 255
          description: Name of the clinical team, if assignment is by team rather than individual.
        status:
          type: string
          enum:
          - scheduled
          - confirmed
          - rebooked
          - cancelled
          - attended
          - did-not-attend
          description: 'Appointment status: scheduled, confirmed, rebooked, cancelled, attended, did-not-attend.'
        travel_notes:
          type: string
          description: Free-text travel information for the patient (transport, parking).
        access_notes:
          type: string
          description: Free-text accessibility notes (step-free access, BSL interpreter booked, etc.).
      required:
      - created_at
      - updated_at
      - radiology_waiting_list_card_id
      - appointment_type
      - site_name
      - site_address
      - clinic_name
      - room
      - clinician_name
      - clinician_team
      - status
      - travel_notes
      - access_notes
      description: Scheduled or upcoming appointment attached to a waiting list card. A card may have
        zero or many appointments over its lifetime.
    RadiologyWaitingListCardGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
