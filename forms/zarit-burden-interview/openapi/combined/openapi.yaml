components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Practitioner full name.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as a single text block.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code.
        role:
          type: string
          enum:
          - clinician
          - nurse
          - social-care
          - carer-support
          - other
          - ''
          description: 'Primary role of the administering practitioner: clinician, nurse, social-care,
            carer-support, or other.'
        registrationBody:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - GPhC
          - other
          - ''
          description: 'Professional registration body: GMC, NMC, HCPC, GPhC, or other.'
        registrationNumber:
          type: string
          description: Professional registration number issued by the registration body.
      required:
      - createdAt
      - updatedAt
      - name
      - role
      - registrationBody
      - registrationNumber
      description: Clinician / practitioner identifying information for the practitioner administering
        the assessment.
    Patient:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          maxLength: 255
          description: Full name of the care recipient.
        birthDate:
          type: string
          format: date
          description: Date of birth.
        sex:
          type: string
          enum:
          - female
          - male
          - intersex
          - unknown
          - ''
          description: 'Sex recorded for clinical purposes: female, male, intersex, or unknown.'
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as a single text block.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code.
        unitedKingdomNhsNumber:
          type:
          - string
          - 'null'
          maxLength: 20
          description: United Kingdom NHS number, unique per person.
        hospitalMrn:
          type:
          - string
          - 'null'
          maxLength: 50
          description: Local hospital medical record number (MRN).
        heightAsCm:
          type:
          - number
          - 'null'
          format: double
          description: Height in centimetres.
        weightAsKg:
          type:
          - number
          - 'null'
          format: double
          description: Weight in kilograms.
        bodyMassIndex:
          type:
          - number
          - 'null'
          format: double
          description: Body mass index (BMI), kg/m^2.
        allergiesSummary:
          type: string
          description: Free-text summary of known allergies.
      required:
      - createdAt
      - updatedAt
      - name
      - birthDate
      - sex
      - allergiesSummary
      description: Patient demographic information for the care recipient assessed by the Zarit Burden
        Interview record.
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          description: A URI identifying the problem type
        title:
          type: string
          description: A short summary of the problem type
        status:
          type: integer
          description: The HTTP status code
        detail:
          type: string
          description: An explanation of this occurrence
        instance:
          type: string
          description: A URI identifying this occurrence
        code:
          type: string
          description: A short machine-readable reason
        errors:
          type: object
          description: Per-field detail, when validation failed
      required:
      - type
      - title
      - status
    ZaritBurdenInterview:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the care recipient being cared for (delete restricted).
        clinicianId:
          type:
          - string
          - 'null'
          format: uuid
          description: Foreign key to the administering practitioner (optional; delete restricted).
        practitionerName:
          type: string
          maxLength: 255
          description: Name of the administering practitioner as recorded on the assessment.
        practitionerRole:
          type: string
          enum:
          - clinician
          - nurse
          - social-care
          - carer-support
          - other
          - ''
          description: 'Role of the administering practitioner: clinician, nurse, social-care, carer-support,
            or other.'
        assessedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Date and time the assessment was performed.
        careSetting:
          type: string
          enum:
          - memory-service
          - community
          - general-practice
          - social-care
          - other
          - ''
          description: 'Care setting: memory-service, community, general-practice, social-care, or other.'
        instrumentForm:
          type: string
          enum:
          - zbi22
          - zbi12
          description: 'Which item set is scored: zbi22 (full 22-item, default) or zbi12 (12-item short
            form).'
        carerIdentifier:
          type: string
          maxLength: 100
          description: Local identifier for the carer completing the questionnaire.
        carerRelationship:
          type: string
          enum:
          - spouse-partner
          - adult-child
          - other-relative
          - friend
          - other
          - ''
          description: 'Carer relationship to the care recipient: spouse-partner, adult-child, other-relative,
            friend, or other.'
        carerCoResident:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Whether the carer lives with the care recipient: yes or no.'
        careHoursPerWeek:
          type:
          - number
          - 'null'
          format: double
          description: Approximate hours of care provided per week.
        recipientIdentifier:
          type: string
          maxLength: 100
          description: Local identifier for the care recipient.
        recipientCondition:
          type: string
          enum:
          - dementia
          - chronic-illness
          - disability
          - other
          - ''
          description: 'Primary condition of the care recipient: dementia, chronic-illness, disability,
            or other.'
        item1:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Item 1 rating (0-4): feel asked to do more than you should for the relative.'
        item2:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Item 2 rating (0-4): not enough time for yourself.'
        item3:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Item 3 rating (0-4): stressed between caring and other responsibilities.'
        item4:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Item 4 rating (0-4): embarrassed by the relative''s behaviour.'
        item5:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Item 5 rating (0-4): angry when around the relative.'
        item6:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Item 6 rating (0-4): relative affects your relationships with others negatively.'
        item7:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Item 7 rating (0-4): afraid about what the future holds for the relative.'
        item8:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Item 8 rating (0-4): the relative is dependent on you.'
        item9:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Item 9 rating (0-4): strained when around the relative.'
        item10:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Item 10 rating (0-4): your health has suffered because of caring.'
        item11:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Item 11 rating (0-4): not as much privacy as you would like.'
        item12:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Item 12 rating (0-4): social life has suffered.'
        item13:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Item 13 rating (0-4): uncomfortable having friends over because of the relative.'
        item14:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Item 14 rating (0-4): relative expects you to care as the only one they can depend
            on.'
        item15:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Item 15 rating (0-4): not enough money to care in addition to other expenses.'
        item16:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Item 16 rating (0-4): unable to care for the relative much longer.'
        item17:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Item 17 rating (0-4): lost control of your life since the relative''s illness.'
        item18:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Item 18 rating (0-4): wish you could leave the care to someone else.'
        item19:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Item 19 rating (0-4): uncertain about what to do for the relative.'
        item20:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Item 20 rating (0-4): feel you should be doing more for the relative.'
        item21:
          type:
          - integer
          - 'null'
          format: int32
