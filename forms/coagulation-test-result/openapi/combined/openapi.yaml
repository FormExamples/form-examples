components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Name.
        email:
          type: string
          description: Email address.
        phone:
          type: string
          description: Phone number.
        postal_address_as_full_text:
          type: string
          description: Postal address as full text.
        country_as_iso_3166_1_alpha_2:
          type: string
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type: string
          description: Postal code, such as for validating the postal address.
        role:
          type: string
          enum:
          - consultant-haematologist
          - biomedical-scientist
          - reporting-clinician
          - other
          - ''
          description: 'Reporting clinician role: consultant-haematologist, biomedical-scientist, reporting-clinician,
            other.'
        registration_body:
          type: string
          enum:
          - GMC
          - HCPC
          - other
          - ''
          description: 'Clinician registration body: GMC, HCPC, other.'
        registration_number:
          type: string
          description: Clinician registration number.
        united_kingdom_nhs_number:
          type: string
          maxLength: 12
          description: United Kingdom NHS number, unique per person.
      required:
      - created_at
      - updated_at
      - name
      - role
      - registration_body
      - registration_number
      description: Reporting clinician (consultant haematologist, biomedical scientist, or other reporting
        clinician) who authors and signs the coagulation test result report.
    CoagulationTestResult:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patient_id:
          type: string
          format: uuid
          description: Foreign key to the patient.
        clinician_id:
          type: string
          format: uuid
          description: Foreign key to the reporting clinician (consultant haematologist / biomedical scientist).
        originating_request_reference:
          type: string
          maxLength: 255
          description: Free-text reference linking this report back to the originating coagulation test
            request (referral).
        report_status:
          type: string
          enum:
          - preliminary
          - final
          - amended
          - cancelled
          - ''
          description: 'Report lifecycle status: preliminary, final, amended, cancelled.'
        performed_date:
          type: string
          format: date
          description: Date the coagulation analysis was performed.
        reported_date:
          type: string
          format: date
          description: Date the report was authored / signed.
        specimen_condition:
          type: string
          enum:
          - satisfactory
          - clotted
          - underfilled
          - haemolysed
          - insufficient
          - ''
          description: 'Pre-analytical specimen condition: satisfactory, clotted, underfilled, haemolysed,
            insufficient.'
        clinical_history:
          type: string
          maxLength: 1000
          description: Clinical history and the question the test was performed to answer.
        on_anticoagulant:
          type: boolean
          description: Whether the patient is on anticoagulant therapy at the time of sampling (affects
            interpretation of PT/INR/APTT).
        anticoagulant_agent:
          type: string
          maxLength: 255
          description: Anticoagulant agent, if any (e.g. warfarin, LMWH, apixaban, rivaroxaban, dabigatran).
        prothrombin_time_seconds:
          type: number
          format: double
          description: Prothrombin time (PT) in seconds.
        inr:
          type: number
          format: double
          description: International normalised ratio (INR) derived from the prothrombin time.
        activated_partial_thromboplastin_time_seconds:
          type: number
          format: double
          description: Activated partial thromboplastin time (APTT) in seconds.
        aptt_ratio:
          type: number
          format: double
          description: APTT ratio (patient APTT divided by the control / mean normal APTT).
        fibrinogen_g_l:
          type: number
          format: double
          description: Fibrinogen (Clauss) concentration in grams per litre (g/L).
        d_dimer:
          type: number
          format: double
          description: D-dimer concentration (units as reported by the assay, e.g. ng/mL FEU or mg/L).
        thrombin_time_seconds:
          type: number
          format: double
          description: Thrombin time (TT) in seconds.
        factor_assays:
          type: string
          maxLength: 2000
          description: Free-text factor-assay and special-test results (e.g. factor VIII/IX levels, von
            Willebrand panel, lupus anticoagulant, anti-Xa).
        overall_result_status:
          type: string
          enum:
          - normal
          - abnormal
          - critical
          - ''
          description: 'Overall result status: normal, abnormal, critical.'
        critical_value_present:
          type: boolean
          description: Whether a critical (panic) value is present (e.g. INR > 8, fibrinogen < 1.0 g/L,
            or a DIC picture) requiring immediate communication.
        critical_value_detail:
          type: string
          maxLength: 1000
          description: Description of the critical value(s) present and the threshold(s) breached.
        findings_narrative:
          type: string
          maxLength: 2000
          description: Narrative description of the coagulation findings (the body of the report).
        comparison_with_previous:
          type: string
          maxLength: 1000
          description: Comparison with relevant previous coagulation results (trend / delta check).
        impression:
          type: string
          maxLength: 2000
          description: Summary impression / conclusion answering the clinical question.
        reporting_category:
          type: string
          maxLength: 50
          description: Structured-reporting category label (e.g. anticoagulant-effect, DIC-picture, isolated-APTT-prolongation,
            normal-haemostasis).
        recommended_follow_up:
          type: string
          maxLength: 1000
          description: Recommended follow-up testing, referral, or management.
        critical_result_communicated:
          type: boolean
          description: Whether a critical or unexpected significant result was communicated directly to
            the referrer.
        reported_to:
          type: string
          maxLength: 500
          description: Who the critical / urgent result was communicated to, with date and time if applicable.
      required:
      - created_at
      - updated_at
      - patient_id
      - clinician_id
      - originating_request_reference
      - report_status
      - specimen_condition
      - clinical_history
      - on_anticoagulant
      - anticoagulant_agent
      - factor_assays
      - overall_result_status
      - critical_value_present
      - critical_value_detail
      - findings_narrative
      - comparison_with_previous
      - impression
      - reporting_category
      - recommended_follow_up
      - critical_result_communicated
      - reported_to
      description: Coagulation / haemostasis test result (report). Captures the reported result values
        (PT/INR, APTT/ratio, fibrinogen, D-dimer, thrombin time, factor assays), the specimen condition,
        clinical history and anticoagulant status, the narrative and impression, and critical-result communication.
        This is the source-of-truth record that the four-axis interpretation grade is computed from.
    CoagulationTestResultGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        coagulation_test_result_id:
          type: string
          format: uuid
          description: Foreign key to the parent result (unique, 1:1).
        result_classification:
          type: string
          enum:
          - normal
          - abnormal
          - critical
          - inconclusive
          - ''
          description: 'Axis A overall classification: normal, abnormal, critical, inconclusive.'
        abnormality_severity:
          type: string
          enum:
          - none
          - minor
          - moderate
          - major
          - ''
          description: 'Axis B abnormality severity: none, minor, moderate, major.'
        reporting_category:
          type: string
          maxLength: 50
          description: Axis B structured-reporting category label (e.g. anticoagulant-effect, DIC-picture,
            isolated-APTT-prolongation).
        report_completeness_percent:
          type: integer
          format: int32
          description: Axis C report completeness as a percentage of mandatory report sections (0-100).
        follow_up_urgency:
          type: string
          enum:
          - routine
          - recommended
          - urgent
          - critical-alert
          - ''
          description: 'Axis D follow-up urgency: routine, recommended, urgent, critical-alert.'
        target_timeframe:
          type: string
          maxLength: 50
          description: Target timeframe for the recommended follow-up implied by the urgency.
        recommended_action:
          type: string
          maxLength: 500
          description: Axis D concise recommended action derived from the urgency.
        recommendation:
          type: string
          enum:
          - no-action
          - routine-follow-up
          - further-testing
          - specialist-referral
          - urgent-review
          - ''
          description: 'Overall recommendation: no-action, routine-follow-up, further-testing, specialist-referral,
            urgent-review.'
        clinician_notes:
          type: string
          description: Free-text interpretation / sign-off notes.
        signed_at:
          type: string
          format: date-time
          description: Timestamp of the reporting clinician electronic signature.
        graded_at:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the result.
      required:
      - created_at
      - updated_at
      - coagulation_test_result_id
      - result_classification
      - abnormality_severity
      - reporting_category
      - follow_up_urgency
      - target_timeframe
      - recommended_action
      - recommendation
      - clinician_notes
      - graded_at
      description: 'Computed four-axis interpretation grade: result classification, abnormality severity
        / structured-reporting category, report completeness, and follow-up urgency. A critical value
        auto-escalates the follow-up urgency to critical-alert regardless of the other axes.'
    CoagulationTestResultGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        coagulation_test_result_grade_id:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        flag_id:
          type: string
          maxLength: 50
          description: Stable flag identifier (e.g. F-CRITICAL-RESULT-001).
        category:
          type: string
          enum:
          - critical-result-alert
          - incidental-finding
          - discrepancy-with-request
          - abnormal-requiring-action
          - urgent-referral
          - specimen-quality-issue
          - unexpected-finding
          - missing-impression
          - missing-result-value
          - other
          - ''
          description: Flag category.
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          - ''
          description: 'Priority: low, medium, high.'
        description:
          type: string
          maxLength: 500
          description: Human-readable description of what fired the flag.
        suggested_action:
          type: string
          maxLength: 500
          description: Suggested clinical action (e.g. "communicate critical result to referrer and document").
      required:
      - created_at
      - updated_at
      - coagulation_test_result_grade_id
      - flag_id
      - category
      - priority
      - description
      - suggested_action
      description: Safety-critical flags that fire independently of the four axes, with priority and a
        suggested action for the reporting / referring team.
    CoagulationTestResultGradeRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        coagulation_test_result_grade_id:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        rule_id:
          type: string
          maxLength: 40
          description: Stable rule identifier (e.g. R-CLASS-CRITICAL-01).
        axis:
          type: string
          enum:
          - classification
          - severity
          - completeness
          - follow-up
          - ''
          description: 'Scoring axis the rule belongs to: classification, severity, completeness, follow-up.'
        category:
          type: string
          maxLength: 50
          description: Category or finding the rule relates to.
        description:
          type: string
          maxLength: 500
          description: Human-readable description of why the rule fired.
      required:
      - created_at
      - updated_at
      - coagulation_test_result_grade_id
      - rule_id
      - axis
      - category
      - description
      description: Audit trail of every classification / severity / completeness / follow-up rule that
        fired for this result.
    Patient:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          maxLength: 255
          description: Name.
        birth_date:
          type: string
          format: date
          description: Birth date.
        email:
          type: string
          description: Email address.
        phone:
          type: string
          description: Phone number.
        postal_address_as_full_text:
          type: string
          description: Postal address as full text.
        country_as_iso_3166_1_alpha_2:
          type: string
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type: string
          description: Postal code, such as for validating the postal address.
        united_kingdom_nhs_number:
          type: string
          maxLength: 20
          description: United Kingdom NHS number, unique per person.
        waist_as_cm:
          type: number
          format: double
          description: Waist circumference measurement in cm, such as for calculating waist-height ratio
            (WHR).
        height_as_cm:
          type: number
          format: double
          description: Height measurement in cm, such as for calculating waist-height ratio (WHR).
        weight_as_kg:
          type: number
          format: double
          description: Weight as kg.
        body_mass_index:
          type: number
          format: double
          description: Body mass index (BMI) measurement.
        waist_height_ratio:
          type: number
          format: double
          description: Waist-height ratio (WHR) measurement.
        vo2_max:
          type: number
          format: double
          description: VO2 max measurement.
      required:
      - created_at
      - updated_at
      - name
      - birth_date
      description: Patient
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          description: A URI identifying the problem type
        title:
          type: string
          description: A short summary of the problem type
        status:
          type: integer
          description: The HTTP status code
        detail:
          type: string
          description: An explanation of this occurrence
        instance:
          type: string
          description: A URI identifying this occurrence
        code:
          type: string
          description: A short machine-readable reason
        errors:
          type: object
          description: Per-field detail, when validation failed
      required:
      - type
      - title
      - status
