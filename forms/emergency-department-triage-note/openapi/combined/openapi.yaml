components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Clinician full name as recorded in the rota.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as a single text block.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code.
        role:
          type: string
          enum:
          - triage-nurse
          - emergency-nurse-practitioner
          - emergency-physician
          - emergency-registrar
          - foundation-trainee
          - healthcare-assistant
          - paramedic
          - other
          - ''
          description: 'Primary clinical role: triage-nurse, emergency-nurse-practitioner, emergency-physician,
            emergency-registrar, foundation-trainee, healthcare-assistant, paramedic, or other.'
        registrationBody:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - GPhC
          - other
          - ''
          description: 'Professional registration body: GMC, NMC, HCPC, GPhC, or other.'
        registrationNumber:
          type: string
          description: Professional registration number issued by the registration body.
      required:
      - createdAt
      - updatedAt
      - name
      - role
      - registrationBody
      - registrationNumber
      description: Clinician identifying information for the triaging clinician.
    EmergencyDepartmentTriageNote:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patientId:
          type: string
          format: uuid
          description: 'Foreign key to the patient being triaged (RESTRICT: patients are not deleted while
            triage notes exist).'
        clinicianId:
          type:
          - string
          - 'null'
          format: uuid
          description: Foreign key to the triaging clinician (RESTRICT); NULL until assigned.
        status:
          type: string
          enum:
          - draft
          - submitted
          - amended
          - signed
          description: 'Workflow status: draft, submitted, amended, or signed.'
        nurseName:
          type: string
          description: Name of the triage nurse or clinician who performed the assessment.
        triagedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Date and time the triage assessment was performed; NULL when not yet recorded.
        careSetting:
          type: string
          enum:
          - emergency-department
          - urgent-treatment-centre
          - minor-injuries-unit
          - ''
          description: 'Care setting: emergency-department, urgent-treatment-centre, or minor-injuries-unit.'
        arrivalMode:
          type: string
          enum:
          - walk-in
          - ambulance
          - other
          - ''
          description: 'Mode of arrival: walk-in, ambulance, or other.'
        arrivedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Date and time the patient arrived; NULL when not recorded.
        referralSource:
          type: string
          description: Referral source (e.g. self, GP, ambulance service, other).
        patientIdentifier:
          type: string
          description: Local patient identifier as recorded at triage.
        ageBand:
          type: string
          enum:
          - paediatric
          - adult
          - older-adult
          - ''
          description: 'Age band: paediatric, adult, or older-adult.'
        presentingComplaint:
          type: string
          description: Chief presenting complaint in the patient's or clinician's words.
        briefHistory:
          type: string
          description: Relevant brief history accompanying the presenting complaint.
        symptomOnset:
          type: string
          description: Timing of symptom onset (free text).
        respiratoryRate:
          type:
          - integer
          - 'null'
          format: int32
          description: Respiration rate in breaths per minute; NULL when not recorded.
        spo2:
          type:
          - integer
          - 'null'
          format: int32
          description: Oxygen saturation as a percentage (SpO2); NULL when not recorded.
        onOxygen:
          type: string
          enum:
          - air
          - oxygen
          - ''
          description: Whether the patient is breathing air or receiving supplemental oxygen (NEWS2 +2
            when oxygen).
        systolicBp:
          type:
          - integer
          - 'null'
          format: int32
          description: Systolic blood pressure in mmHg; NULL when not recorded.
        pulse:
          type:
          - integer
          - 'null'
          format: int32
          description: Pulse rate in beats per minute; NULL when not recorded.
        consciousnessAcvpu:
          type: string
          enum:
          - A
          - C
          - V
          - P
          - U
          - ''
          description: 'Consciousness level on the ACVPU scale: A (alert), C (new confusion), V (voice),
            P (pain), U (unresponsive).'
        temperature:
          type:
          - number
          - 'null'
          format: double
          description: Body temperature in degrees Celsius; NULL when not recorded.
        glasgowComaScale:
          type:
          - integer
          - 'null'
          format: int32
          description: Optional Glasgow Coma Scale total (3-15) as a supporting disability finding; NULL
            when not recorded.
        painScore:
          type:
          - integer
          - 'null'
          format: int32
          description: Pain score (0-10) used as a pain discriminator; NULL when not recorded.
        airwayThreat:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Discriminator: threat to the airway (Level-1 immediate).'
        breathingInadequate:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Discriminator: severely inadequate breathing (Level-1 immediate).'
        circulationShock:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Discriminator: shock or circulatory compromise (Level-1 immediate).'
        haemorrhageMajor:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Discriminator: major or catastrophic haemorrhage (Level-1 immediate).'
        consciousnessReduced:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Discriminator: reduced consciousness responding to voice or pain (Level-2 very
            urgent).'
        seizureActive:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Discriminator: active seizure (Level-1 immediate).'
        focalNeurology:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Discriminator: acute focal neurological deficit (Level-2 very urgent).'
        sepsisFeatures:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Discriminator: features suggestive of sepsis (Level-2 very urgent; sepsis screen).'
        chestPainCardiac:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Discriminator: chest pain of possible cardiac origin (Level-2 very urgent; time-critical).'
        strokeFeatures:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Discriminator: features suggestive of acute stroke (Level-2 very urgent; time-critical).'
        paediatricRedFlag:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Discriminator: paediatric red flag (Level-2 very urgent; time-critical).'
        clinicalNotes:
          type: string
          description: Free-text clinical notes accompanying the triage assessment.
      required:
      - createdAt
      - updatedAt
      - patientId
      - status
      - nurseName
      - careSetting
      - arrivalMode
      - referralSource
      - patientIdentifier
      - ageBand
      - presentingComplaint
      - briefHistory
      - symptomOnset
      - onOxygen
      - consciousnessAcvpu
      - airwayThreat
      - breathingInadequate
      - circulationShock
      - haemorrhageMajor
      - consciousnessReduced
      - seizureActive
      - focalNeurology
      - sepsisFeatures
      - chestPainCardiac
      - strokeFeatures
      - paediatricRedFlag
      - clinicalNotes
      description: 'Main emergency-department triage-note record: arrival and context, presenting complaint
        and brief history, triage vital signs (NEWS2 inputs), pain score, and Manchester Triage System
        discriminator flags. The classification result, fired rules, and red-flag issues live in child
        tables.'
    EmergencyDepartmentTriageNoteGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        emergencyDepartmentTriageNoteId:
          type: string
          format: uuid
          description: Foreign key to the parent triage note (unique, 1:1).
        news2Total:
          type:
          - integer
          - 'null'
          format: int32
          description: Supporting NEWS2 aggregate computed from the recorded vital signs; NULL when not
            computed.
        news2AnyParameterThree:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether any single NEWS2 parameter scored 3 (drives escalation to at least Level
            2).
        priorityLevel:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Selected MTS priority level: 1 (most urgent) to 5 (least urgent); NULL when not
            classified.'
        priorityColour:
          type: string
          enum:
          - red
          - orange
          - yellow
          - green
          - blue
          - ''
          description: 'Colour derived from the level: red (1), orange (2), yellow (3), green (4), blue
            (5).'
        priorityName:
          type: string
          enum:
          - Immediate
          - Very urgent
          - Urgent
          - Standard
          - Non-urgent
          - ''
          description: 'Name derived from the level: Immediate, Very urgent, Urgent, Standard, or Non-urgent.'
        targetMinutes:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Target minutes to first clinical assessment derived from the level: 0, 10, 60,
            120, or 240.'
        gradedAt:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the classification.
      required:
      - createdAt
      - updatedAt
      - emergencyDepartmentTriageNoteId
      - news2AnyParameterThree
      - priorityColour
      - priorityName
      - gradedAt
      description: 'Computed triage classification result (1:1 with the triage note): supporting NEWS2
