        '200':
          description: Patient deleted
        '404':
          description: Patient not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: This client sent too many requests
          headers:
            retry-after:
              description: Seconds to wait before sending again
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  schemas:
    Assessment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the patient who owns this assessment.
        status:
          type: string
          enum:
          - draft
          - submitted
          - reviewed
          - urgent
          description: 'Lifecycle status: draft, submitted, reviewed, or urgent.'
      required:
      - createdAt
      - updatedAt
      - patientId
      - status
      description: Gerontology assessment using the Clinical Frailty Scale. Parent entity for all assessment
        sections.
    AssessmentPolypharmacyReview:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        assessmentId:
          type: string
          format: uuid
          description: Foreign key to the parent assessment (unique, enforcing 1:1).
        totalRegularMedications:
          type:
          - integer
          - 'null'
          format: int32
          description: Total number of regular medications, NULL if unanswered.
        totalPrnMedications:
          type:
          - integer
          - 'null'
          format: int32
          description: Total number of as-needed (PRN) medications, NULL if unanswered.
        polypharmacyFlag:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Whether polypharmacy is flagged (5+ medications): yes, no, or empty string.'
        medicationReviewDate:
          type:
          - string
          - 'null'
          format: date
          description: Date of last medication review, NULL if unanswered.
        fallsRiskMedications:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Whether the patient is taking falls-risk medications (e.g. sedatives, antihypertensives):
            yes, no, or empty string.'
        fallsRiskMedicationDetails:
          type: string
          description: Details of falls-risk medications.
        anticholinergicBurden:
          type: string
          enum:
          - low
          - moderate
          - high
          - ''
          description: 'Anticholinergic burden level: low, moderate, high, or empty string.'
        drugInteractionsIdentified:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Whether significant drug interactions have been identified: yes, no, or empty
            string.'
        drugInteractionDetails:
          type: string
          description: Details of significant drug interactions.
        adherenceConcerns:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Whether there are medication adherence concerns: yes, no, or empty string.'
        adherenceDetails:
          type: string
          description: Details of adherence concerns.
        stoppStartReviewDone:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Whether a STOPP/START criteria review has been done: yes, no, or empty string.'
        deprescribingOpportunities:
          type: string
          description: Free-text description of deprescribing opportunities identified.
        polypharmacyNotes:
          type: string
          description: Free-text notes on polypharmacy review.
      required:
      - createdAt
      - updatedAt
      - assessmentId
      - polypharmacyFlag
      - fallsRiskMedications
      - fallsRiskMedicationDetails
      - anticholinergicBurden
      - drugInteractionsIdentified
      - drugInteractionDetails
      - adherenceConcerns
      - adherenceDetails
      - stoppStartReviewDone
      - deprescribingOpportunities
      - polypharmacyNotes
      description: 'Polypharmacy review section: medication counts, falls-risk drugs, anticholinergic
        burden, and STOPP/START review. One-to-one child of assessment.'
    AssessmentPolypharmacyReviewMedication:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        medicationName:
          type: string
          maxLength: 255
          description: Name of the medication.
        dose:
          type: string
          maxLength: 100
          description: Dose and strength (e.g. 5mg, 10mg/5ml).
        frequency:
          type: string
          maxLength: 100
          description: Dosing frequency (e.g. once daily, twice daily, PRN).
        route:
          type: string
          enum:
          - oral
          - topical
          - inhaled
          - injectable
          - patch
          - other
          - ''
          description: 'Route of administration: oral, topical, inhaled, injectable, patch, other, or
            empty string.'
        indication:
          type: string
          maxLength: 255
          description: Clinical indication for the medication.
        isPrn:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Whether this is a PRN (as-needed) medication: yes, no, or empty string.'
        sortOrder:
          type: integer
          format: int32
          description: Display order within the medication list.
      required:
      - createdAt
      - updatedAt
      - medicationName
      - dose
      - frequency
      - route
      - indication
      - isPrn
      - sortOrder
      description: Individual medication entry within the polypharmacy review.
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Name.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as full text.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code, such as for validating the postal address.
        role:
          type: string
          enum:
          - anaesthetist
          - surgeon
          - preop-nurse
          - perioperative-physician
          - geriatrician
          - pharmacist
          - other
          - ''
          description: Clinician role.
        registrationBody:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - GPhC
          - other
          - ''
          description: Clinician registration body.
        registrationNumber:
          type: string
          description: Clinician registration number.
        unitedKingdomNhsNumber:
          type:
          - string
          - 'null'
          maxLength: 12
          description: United Kingdom NHS number, unique per person.
      required:
      - createdAt
      - updatedAt
      - name
      - role
      - registrationBody
      - registrationNumber
      description: Clinician
    Grade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        assessmentId:
          type: string
          format: uuid
          description: Foreign key to the assessment table.
        cfsScore:
          type: integer
          format: int32
          description: Clinical Frailty Scale score (1-9).
        cfsCategory:
          type: string
          enum:
          - very-fit
          - well
          - managing-well
          - vulnerable
          - mildly-frail
          - moderately-frail
          - severely-frail
          - very-severely-frail
          - terminally-ill
          - ''
          description: 'CFS category: very-fit, well, managing-well, vulnerable, mildly-frail, moderately-frail,
            severely-frail, very-severely-frail, terminally-ill, or empty string.'
        functionalDomainScore:
          type:
          - integer
          - 'null'
          format: int32
          description: Sub-score for the functional assessment domain, NULL if not yet scored.
        cognitiveDomainScore:
          type:
          - integer
          - 'null'
          format: int32
          description: Sub-score for the cognitive screening domain, NULL if not yet scored.
        mobilityDomainScore:
          type:
          - integer
          - 'null'
          format: int32
          description: Sub-score for the mobility and falls domain, NULL if not yet scored.
        nutritionDomainScore:
          type:
          - integer
          - 'null'
          format: int32
          description: Sub-score for the nutrition domain, NULL if not yet scored.
        polypharmacyDomainScore:
          type:
          - integer
          - 'null'
          format: int32
          description: Sub-score for the polypharmacy review domain, NULL if not yet scored.
        gradedAt:
          type: string
          format: date-time
          description: Timestamp when the grading was computed.
      required:
      - createdAt
      - updatedAt
      - assessmentId
      - cfsScore
      - cfsCategory
      - gradedAt
      description: Computed Clinical Frailty Scale result. CFS 1 = Very fit, 4 = Vulnerable, 7 = Severely
        frail, 9 = Terminally ill. One-to-one child of assessment.
    GradingAdditionalFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        gradeId:
          type: string
          format: uuid
          description: Foreign key to the grade table.
        flagId:
          type: string
          maxLength: 30
          description: Identifier of the flag (e.g. FLAG-FALL-001, FLAG-DELIR-001, FLAG-SAFEG-001).
        category:
          type: string
          maxLength: 100
          description: Category of the flag (e.g. Falls Risk, Delirium, Malnutrition, Safeguarding).
        message:
          type: string
          description: Human-readable message describing the flagged concern.
        priority:
          type: string
          enum:
          - high
          - medium
          - low
          description: 'Priority level: high, medium, or low.'
      required:
      - createdAt
      - updatedAt
      - gradeId
      - flagId
      - category
      - message
      - priority
      description: Additional safety-critical flags detected during gerontology assessment grading (e.g.
        falls risk, delirium, safeguarding concern).
    GradingFiredRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        gradeId:
          type: string
          format: uuid
          description: Foreign key to the grade table.
        ruleId:
          type: string
          maxLength: 20
          description: Identifier of the rule that fired (e.g. FA-001, CS-002, MF-003).
        category:
          type: string
          maxLength: 100
          description: Category of the rule (e.g. Functional, Cognitive, Mobility, Nutrition, Polypharmacy).
        description:
          type: string
          description: Human-readable description of the rule.
        cfsContribution:
          type: integer
          format: int32
          description: Contribution of this rule to the CFS score.
      required:
      - createdAt
      - updatedAt
      - gradeId
      - ruleId
      - category
      - description
      - cfsContribution
      description: Individual frailty rules that evaluated to true during CFS grading.
    Patient:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-deleted.
        name:
          type: string
          maxLength: 255
          description: Name.
        birthDate:
          type: string
          format: date
          description: Birth date.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as full text.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code, such as for validating the postal address.
        unitedKingdomNhsNumber:
          type:
          - string
          - 'null'
          maxLength: 20
          description: United Kingdom NHS number, unique per person.
        waistAsCm:
          type:
          - number
          - 'null'
          format: double
          description: Waist circumference measurement in cm, such as for calculating waist-height ratio
            (WHR).
        heightAsCm:
          type:
          - number
          - 'null'
          format: double
          description: Height measurement in cm, such as for calculating waist-height ratio (WHR).
        weightAsKg:
          type:
          - number
          - 'null'
          format: double
          description: Weight as kg.
        bodyMassIndex:
          type:
          - number
          - 'null'
          format: double
          description: Body mass index (BMI) measurement.
        waistHeightRatio:
          type:
          - number
          - 'null'
          format: double
          description: Waist-height ratio (WHR) measurement.
        vo2Max:
          type:
          - number
          - 'null'
          format: double
          description: VO2 max measurement.
      required:
      - createdAt
      - updatedAt
      - name
      - birthDate
      description: Patient
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          description: A URI identifying the problem type
        title:
          type: string
          description: A short summary of the problem type
        status:
          type: integer
          description: The HTTP status code
        detail:
          type: string
          description: An explanation of this occurrence
        instance:
          type: string
          description: A URI identifying this occurrence
        code:
          type: string
          description: A short machine-readable reason
        errors:
          type: object
          description: Per-field detail, when validation failed
      required:
      - type
      - title
      - status
