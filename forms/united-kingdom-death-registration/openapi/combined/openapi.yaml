components:
  schemas:
    Informant:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Full name of the informant.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as a single text block.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code.
        relationship:
          type: string
          enum:
          - relative-present-at-death
          - relative-in-attendance
          - relative-in-district
          - person-present-at-death
          - occupier-of-premises
          - person-arranging-funeral
          - not-qualified
          - ''
          description: 'Basis on which the person is an informant: a qualified category under section
            16 of the 1953 Act, or not-qualified.'
      required:
      - createdAt
      - updatedAt
      - name
      - relationship
      description: The informant who gives the particulars of the death to the registrar.
    Patient:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          maxLength: 255
          description: Full name of the deceased as it will appear on the register entry.
        birthDate:
          type:
          - string
          - 'null'
          format: date
          description: Date of birth of the deceased; null when not known.
        sex:
          type: string
          enum:
          - female
          - male
          - other
          - unknown
          - ''
          description: 'Sex recorded for the deceased: female, male, other, or unknown.'
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Usual address of the deceased as a single text block.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code of the usual address.
        unitedKingdomNhsNumber:
          type:
          - string
          - 'null'
          maxLength: 20
          description: United Kingdom NHS number, unique per person.
      required:
      - createdAt
      - updatedAt
      - name
      - sex
      description: The deceased person whose death is being registered in England and Wales.
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          description: A URI identifying the problem type
        title:
          type: string
          description: A short summary of the problem type
        status:
          type: integer
          description: The HTTP status code
        detail:
          type: string
          description: An explanation of this occurrence
        instance:
          type: string
          description: A URI identifying this occurrence
        code:
          type: string
          description: A short machine-readable reason
        errors:
          type: object
          description: Per-field detail, when validation failed
      required:
      - type
      - title
      - status
    UnitedKingdomDeathRegistration:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the deceased whose death is being registered (restrict delete).
        informantId:
          type:
          - string
          - 'null'
          format: uuid
          description: Foreign key to the informant (restrict delete); optional.
        deceasedName:
          type: string
          description: Name of the deceased as given for the register entry.
        sex:
          type: string
          enum:
          - female
          - male
          - other
          - unknown
          - ''
          description: 'Sex of the deceased: female, male, other, or unknown.'
        dateOfBirth:
          type:
          - string
          - 'null'
          format: date
          description: Date of birth of the deceased; null when unknown.
        dateOfDeath:
          type:
          - string
          - 'null'
          format: date
          description: Date of death; null when not yet stated.
        placeOfDeath:
          type: string
          description: Place where the death occurred.
        deathJurisdiction:
          type: string
          enum:
          - england-wales
          - scotland
          - northern-ireland
          - abroad
          - ''
          description: Where the death occurred; this form covers england-wales only.
        deceasedParticularsKnown:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the informant can give the deceased's full particulars (names, birth date
            and place, address, occupation, marital status).
        mccdReceived:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the register office has received the medical certificate of cause of death
            (MCCD).
        medicalExaminerStatus:
          type: string
          enum:
          - confirmed
          - pending
          - ''
          description: Whether the medical examiner's office has confirmed that the death can be registered.
        medicalExaminerConfirmationDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the medical examiner's office confirmed; starts the 5-day clock. Null when
            unconfirmed.
        referredToCoroner:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the death has been reported to a coroner.
        coronerStage:
          type: string
          enum:
          - investigating
          - post-mortem
          - inquest-opened
          - released-no-inquest
          - inquest-concluded
          - ''
          description: Stage of the coroner's involvement.
        coronerCertificateReceived:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the registrar has the coroner's certificate (form CN2, or the certificate
            after inquest) needed to register.
        informantName:
          type: string
          description: Name of the person who will register the death.
        informantRelationship:
          type: string
          enum:
          - relative-present-at-death
          - relative-in-attendance
          - relative-in-district
          - person-present-at-death
          - occupier-of-premises
          - person-arranging-funeral
          - not-qualified
          - ''
          description: Basis on which the informant qualifies under section 16 of the 1953 Act, or not-qualified.
        informantAddress:
          type: string
          description: Address of the informant.
        registerOffice:
          type: string
          description: Register office where the death is or will be registered.
        appointmentBooked:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether an appointment with the registrar has been booked.
        supportingDocumentsAvailable:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether supporting documents (birth or marriage certificate, passport, proof of
            address) are to hand; helpful but not mandatory.
        registrationDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the death was registered; null while unregistered.
        asOfDate:
          type:
          - string
          - 'null'
          format: date
          description: Assessment date used to count days since confirmation; supplied explicitly so grading
            is deterministic.
        disposalMethod:
          type: string
          enum:
          - burial
          - cremation
          - other
          - undecided
          - ''
          description: Intended method of disposal of the body.
        disposalCertificateIssued:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the certificate for burial or cremation (the green form) has been issued.
        tellUsOnceStatus:
          type: string
          enum:
          - reference-received
          - not-offered
          - declined
          - ''
          description: Whether the Tell Us Once reference number was issued, not offered, or declined.
        tellUsOnceReference:
          type: string
          description: Tell Us Once reference number given at registration; used to report the death to
            government departments.
        copiesRequested:
          type:
          - integer
          - 'null'
          format: int32
          description: Number of certified copies of the death certificate requested; null when undecided.
        copyOrderChannel:
          type: string
          enum:
          - at-registration
          - gro-online
          - phone
          - post
          - local-register-office
          - ''
          description: How copies are ordered.
        groIndexReference:
          type: string
          description: General Register Office index reference; avoids the GBP 3.50 search fee when ordering
            online.
        priorityService:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the GRO priority service (next-working-day dispatch) is requested; online
            orders only.
      required:
      - createdAt
      - updatedAt
      - patientId
      - deceasedName
      - sex
      - placeOfDeath
      - deathJurisdiction
      - deceasedParticularsKnown
      - mccdReceived
      - medicalExaminerStatus
      - referredToCoroner
      - coronerStage
      - coronerCertificateReceived
      - informantName
      - informantRelationship
      - informantAddress
      - registerOffice
      - appointmentBooked
      - supportingDocumentsAvailable
      - disposalMethod
      - disposalCertificateIssued
      - tellUsOnceStatus
      - tellUsOnceReference
      - copyOrderChannel
      - groIndexReference
      - priorityService
      description: 'Main death-registration record: the registrar-side and family-side process in England
        and Wales after an MCCD. Classification, fired rules, and flags live in child tables.'
    UnitedKingdomDeathRegistrationGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        unitedKingdomDeathRegistrationId:
          type: string
          format: uuid
          description: Foreign key to the parent registration (unique, 1:1).
        registrationClass:
          type: string
          enum:
          - ready-to-register
          - incomplete
          - referred-to-coroner-pending
          - registered
          - ''
          description: Registration class; referred-to-coroner-pending takes precedence, then incomplete,
            then registered, else ready-to-register.
        deadlineStatus:
          type: string
          enum:
          - not-started
          - paused-coroner
          - on-track
          - due-soon
          - overdue
          - registered
          - registered-late
          - ''
          description: Status of the 5-day registration deadline counted from medical examiner confirmation.
        daysSinceConfirmation:
          type:
          - integer
          - 'null'
