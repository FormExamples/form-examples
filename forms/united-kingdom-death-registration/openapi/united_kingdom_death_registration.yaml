            - ""
          description: "Sex of the deceased: female, male, other, or unknown."
        date_of_birth:
          type: [string, 'null']
          format: date
          description: Date of birth of the deceased; null when unknown.
        date_of_death:
          type: [string, 'null']
          format: date
          description: Date of death; null when not yet stated.
        place_of_death:
          type: string
          description: Place where the death occurred.
        death_jurisdiction:
          type: string
          enum:
            - england-wales
            - scotland
            - northern-ireland
            - abroad
            - ""
          description: Where the death occurred; this form covers england-wales only.
        deceased_particulars_known:
          type: string
          enum:
            - "yes"
            - "no"
            - ""
          description: Whether the informant can give the deceased's full particulars (names, birth date and place, address, occupation, marital status).
        mccd_received:
          type: string
          enum:
            - "yes"
            - "no"
            - ""
          description: Whether the register office has received the medical certificate of cause of death (MCCD).
        medical_examiner_status:
          type: string
          enum:
            - confirmed
            - pending
            - ""
          description: Whether the medical examiner's office has confirmed that the death can be registered.
        medical_examiner_confirmation_date:
          type: [string, 'null']
          format: date
          description: Date the medical examiner's office confirmed; starts the 5-day clock. Null when unconfirmed.
        referred_to_coroner:
          type: string
          enum:
            - "yes"
            - "no"
            - ""
          description: Whether the death has been reported to a coroner.
        coroner_stage:
          type: string
          enum:
            - investigating
            - post-mortem
            - inquest-opened
            - released-no-inquest
            - inquest-concluded
            - ""
          description: Stage of the coroner's involvement.
        coroner_certificate_received:
          type: string
          enum:
            - "yes"
            - "no"
            - ""
          description: Whether the registrar has the coroner's certificate (form CN2, or the certificate after inquest) needed to register.
        informant_name:
          type: string
          description: Name of the person who will register the death.
        informant_relationship:
          type: string
          enum:
            - relative-present-at-death
            - relative-in-attendance
            - relative-in-district
            - person-present-at-death
            - occupier-of-premises
            - person-arranging-funeral
            - not-qualified
            - ""
          description: Basis on which the informant qualifies under section 16 of the 1953 Act, or not-qualified.
        informant_address:
          type: string
          description: Address of the informant.
        register_office:
          type: string
          description: Register office where the death is or will be registered.
        appointment_booked:
          type: string
          enum:
            - "yes"
            - "no"
            - ""
          description: Whether an appointment with the registrar has been booked.
        supporting_documents_available:
          type: string
          enum:
            - "yes"
            - "no"
            - ""
          description: Whether supporting documents (birth or marriage certificate, passport, proof of address) are to hand; helpful but not mandatory.
        registration_date:
          type: [string, 'null']
          format: date
          description: Date the death was registered; null while unregistered.
        as_of_date:
          type: [string, 'null']
          format: date
          description: Assessment date used to count days since confirmation; supplied explicitly so grading is deterministic.
        disposal_method:
          type: string
          enum:
            - burial
            - cremation
            - other
            - undecided
            - ""
          description: Intended method of disposal of the body.
        disposal_certificate_issued:
          type: string
          enum:
            - "yes"
            - "no"
            - ""
          description: Whether the certificate for burial or cremation (the green form) has been issued.
        tell_us_once_status:
          type: string
          enum:
            - reference-received
            - not-offered
            - declined
            - ""
          description: Whether the Tell Us Once reference number was issued, not offered, or declined.
        tell_us_once_reference:
          type: string
          description: Tell Us Once reference number given at registration; used to report the death to government departments.
        copies_requested:
          type: [integer, 'null']
          format: int32
          description: Number of certified copies of the death certificate requested; null when undecided.
        copy_order_channel:
          type: string
          enum:
            - at-registration
            - gro-online
            - phone
            - post
            - local-register-office
            - ""
          description: How copies are ordered.
        gro_index_reference:
          type: string
          description: General Register Office index reference; avoids the GBP 3.50 search fee when ordering online.
        priority_service:
          type: string
          enum:
            - "yes"
            - "no"
            - ""
