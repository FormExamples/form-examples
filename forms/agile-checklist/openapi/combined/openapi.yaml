components:
  schemas:
    AgileChecklist:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        respondentId:
          type: string
          format: uuid
          description: Foreign key to the respondent who completed this checklist.
        status:
          type: string
          enum:
          - draft
          - submitted
          - reviewed
          description: 'Lifecycle status: draft, submitted, or reviewed.'
        assessmentDate:
          type:
          - string
          - 'null'
          format: date
          description: Date on which the assessment was completed.
        assessmentPeriod:
          type: string
          enum:
          - sprint
          - quarter
          - half-year
          - annual
          - ad-hoc
          - ''
          description: 'Cadence of the assessment: sprint, quarter, half-year, annual, or ad-hoc.'
        t01ProblemsToSolve:
          type: string
          description: 'Teams item 1: teams have problems to solve rather than lists of tasks to perform.'
        t02DecisionsWithoutManager:
          type: string
          description: 'Teams item 2: teams generally make decisions without a manager''s approval.'
        t03AdoptAndImprovePractices:
          type: string
          description: 'Teams item 3: teams adopt appropriate practices and improve them over time.'
        t04ActivelyCoordinate:
          type: string
          description: 'Teams item 4: teams working on a common product actively coordinate.'
        t05OpenlyShareIdeas:
          type: string
          description: 'Teams item 5: teams openly share new ideas and experiences with others.'
        t06DecideHowToExecute:
          type: string
          description: 'Teams item 6: teams decide how to execute work.'
        t07ActOnFeedback:
          type: string
          description: 'Teams item 7: teams quickly act on stakeholder feedback to improve the product.'
        t08RarelyWait:
          type: string
          description: 'Teams item 8: teams rarely wait for work to be completed by others.'
        t09FullyCompleteWork:
          type: string
          description: 'Teams item 9: teams make every effort to fully complete all planned work.'
        t10ManageOwnPerformance:
          type: string
          description: 'Teams item 10: teams monitor and manage their own performance.'
        t11UnderstandAgile:
          type: string
          description: 'Teams item 11: teams understand the benefits and challenges of agile.'
        t12HighQuality:
          type: string
          description: 'Teams item 12: teams responsibly deliver high quality work.'
        t13WelcomeChange:
          type: string
          description: 'Teams item 13: teams welcome rather than resist changing requirements.'
        t14CollaborateToFinish:
          type: string
          description: 'Teams item 14: teams collaborate to finish items.'
        t15AdmitMistakes:
          type: string
          description: 'Teams item 15: teams admit challenges and mistakes.'
        t16WorkOutsideSpecialty:
          type: string
          description: 'Teams item 16: teams can work outside their specialties to achieve goals.'
        t17SeekNewSkills:
          type: string
          description: 'Teams item 17: teams seek to learn relevant, new skills.'
        t18ImproveSkills:
          type: string
          description: 'Teams item 18: teams continue to learn and improve skills.'
        t19ImproveWaysOfWorking:
          type: string
          description: 'Teams item 19: teams actively seek ways to improve ways of working.'
        t20VariousWaysCommunicating:
          type: string
          description: 'Teams item 20: teams choose and use various ways of communicating.'
        t21ReceivedBasicTraining:
          type: string
          description: 'Teams item 21: teams have all received basic training on agile concepts.'
        t22SafeToDissent:
          type: string
          description: 'Teams item 22: teams feel safe to express dissenting views.'
        t23StartWithOpenIssues:
          type: string
          description: 'Teams item 23: teams start work even when some open issues remain.'
        t24Motivated:
          type: string
          description: 'Teams item 24: teams are motivated by performing their work.'
        t25PrideInCraft:
          type: string
          description: 'Teams item 25: teams take pride in their craft.'
        s01KnowPriorityFactors:
          type: string
          description: 'Stakeholders item 1: stakeholders know which factors determine priorities and
            deadlines.'
        s02AcceptPlanRanges:
          type: string
          description: 'Stakeholders item 2: stakeholders accept plans that are expressed with ranges.'
        s03AcceptPlanChanges:
          type: string
          description: 'Stakeholders item 3: stakeholders and the team accept that plans may need to change.'
        s04EvaluateProduct:
          type: string
          description: 'Stakeholders item 4: stakeholders have frequent opportunities to evaluate the
            product.'
        s05ChampionAgile:
          type: string
          description: 'Stakeholders item 5: stakeholders champion agile values and agile principles.'
        s06RespectQuality:
          type: string
          description: 'Stakeholders item 6: stakeholders see quality as a right that the team has and
            they respect it.'
        s07DelegateAuthority:
          type: string
          description: 'Stakeholders item 7: stakeholders delegate authority to teams.'
        s08KeepAuthorityDelegated:
          type: string
          description: 'Stakeholders item 8: stakeholders don''t take authority back at the first sign
            of trouble.'
        s09SupportExperiments:
          type: string
          description: 'Stakeholders item 9: stakeholders support teams in experimenting.'
        s10NoPunishExperiments:
          type: string
          description: 'Stakeholders item 10: stakeholders don''t punish an unsuccessful experiment.'
        s11CommunicateAgileGoals:
          type: string
          description: 'Stakeholders item 11: stakeholders communicate what they hope to achieve by becoming
            more agile.'
        s12EncourageNewSkills:
          type: string
          description: 'Stakeholders item 12: stakeholders actively encourage teams to learn new skills.'
        s13EncourageNewWays:
          type: string
          description: 'Stakeholders item 13: stakeholders actively encourage teams to learn new ways
            of working.'
        s14DevelopPeople:
          type: string
          description: 'Stakeholders item 14: stakeholders develop people rather than manage their performance.'
        p01EarlyGoodRelease:
          type: string
          description: 'Practices item 1: the early release of a good product is generally favoured over
            the later release of a perfect product.'
        p02EducatedSponsor:
          type: string
          description: 'Practices item 2: an educated executive sponsor ensures the change agent is empowered
            to make decisions.'
        p03QuickDecisions:
          type: string
          description: 'Practices item 3: decisions are made quickly, sometimes with incomplete knowledge.'
        p04PlansDataBased:
          type: string
          description: 'Practices item 4: plans are based on data and experience.'
        p05ProactiveDependencies:
          type: string
          description: 'Practices item 5: dependencies between teams are proactively identified and addressed.'
        p06GoodIntentions:
          type: string
          description: 'Practices item 6: people are assumed to have acted with good intentions even when
            something goes wrong.'
        p07ReciprocalTrust:
          type: string
          description: 'Practices item 7: trust is reciprocal within the team and with stakeholders.'
        p08DocsPlusConversations:
          type: string
          description: 'Practices item 8: although formal documentation may exist, it is supplemented
            by conversations to the extent possible.'
        p09UpdatePlans:
          type: string
          description: 'Practices item 9: as more is learned, plans are updated rather than remaining
            based on outdated information.'
        p10NonPunitive:
          type: string
          description: 'Practices item 10: a non-punitive attitude leads to the team''s willingness to
            experiment with new tools, technologies, and ways of working.'
        p11OutsideGroupsAware:
          type: string
          description: 'Practices item 11: outside groups that partner with the team are aware of how
            this new way of working may affect their interactions.'
        p12FinishedOverWip:
          type: string
          description: 'Practices item 12: the organisation places a higher value on finished work than
            it does on the number of work items in process.'
        p13QualityOverDeadline:
          type: string
          description: 'Practices item 13: quality is rarely, if ever, sacrificed to meet a deadline.'
        p14SolutionOverBlame:
          type: string
          description: 'Practices item 14: when problems arise between teams, everyone focuses on a solution
            rather than blame.'
        p15ChangeAgentsInPlace:
          type: string
          description: 'Practices item 15: change agents are in place to help support and guide the transition.'
        p16AgileBeyondOrigin:
          type: string
          description: 'Practices item 16: agile practices are being implemented beyond the group in which
            agile began.'
        p17OneTeam:
          type: string
          description: 'Practices item 17: most people are assigned to only one team.'
        p18HonorCommitments:
          type: string
          description: 'Practices item 18: people honour commitments and keep promises.'
        overallNotes:
          type: string
          description: Free-text overall notes captured on the summary step.
      required:
      - createdAt
      - updatedAt
      - respondentId
      - status
      - assessmentPeriod
      - t01ProblemsToSolve
      - t02DecisionsWithoutManager
      - t03AdoptAndImprovePractices
      - t04ActivelyCoordinate
      - t05OpenlyShareIdeas
      - t06DecideHowToExecute
      - t07ActOnFeedback
      - t08RarelyWait
      - t09FullyCompleteWork
      - t10ManageOwnPerformance
      - t11UnderstandAgile
      - t12HighQuality
      - t13WelcomeChange
      - t14CollaborateToFinish
      - t15AdmitMistakes
      - t16WorkOutsideSpecialty
      - t17SeekNewSkills
      - t18ImproveSkills
      - t19ImproveWaysOfWorking
      - t20VariousWaysCommunicating
      - t21ReceivedBasicTraining
      - t22SafeToDissent
      - t23StartWithOpenIssues
      - t24Motivated
      - t25PrideInCraft
      - s01KnowPriorityFactors
      - s02AcceptPlanRanges
      - s03AcceptPlanChanges
      - s04EvaluateProduct
      - s05ChampionAgile
      - s06RespectQuality
      - s07DelegateAuthority
      - s08KeepAuthorityDelegated
      - s09SupportExperiments
      - s10NoPunishExperiments
      - s11CommunicateAgileGoals
      - s12EncourageNewSkills
      - s13EncourageNewWays
      - s14DevelopPeople
      - p01EarlyGoodRelease
      - p02EducatedSponsor
      - p03QuickDecisions
      - p04PlansDataBased
      - p05ProactiveDependencies
      - p06GoodIntentions
      - p07ReciprocalTrust
      - p08DocsPlusConversations
      - p09UpdatePlans
      - p10NonPunitive
      - p11OutsideGroupsAware
      - p12FinishedOverWip
      - p13QualityOverDeadline
      - p14SolutionOverBlame
      - p15ChangeAgentsInPlace
      - p16AgileBeyondOrigin
      - p17OneTeam
      - p18HonorCommitments
      - overallNotes
      description: One row per submission. Stores answers to the 57 agile-checklist behaviour items grouped
        by section (Teams t01-t25, Stakeholders s01-s14, Practices p01-p18). Each column accepts yes /
        no / not-applicable / empty-string. Composite maturity is computed in agile_checklist_grade.
    AgileChecklistGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        agileChecklistId:
          type: string
          format: uuid
          description: Foreign key to the parent checklist (unique, 1:1).
        answeredCount:
          type: integer
          format: int32
          description: Total number of items (0-57) that received an answer of yes / no / not-applicable.
        teamsYesCount:
          type: integer
          format: int32
          description: Number of Teams items (0-25) answered yes.
        teamsApplicableCount:
          type: integer
          format: int32
          description: Number of Teams items (0-25) answered yes or no (excludes not-applicable and unanswered).
        teamsPercent:
          type:
          - number
          - 'null'
          format: double
          description: Teams section percentage of yes answers over applicable answers; NULL if no items
            applicable.
        stakeholdersYesCount:
          type: integer
          format: int32
          description: Number of Stakeholders items (0-14) answered yes.
        stakeholdersApplicableCount:
          type: integer
          format: int32
          description: Number of Stakeholders items (0-14) answered yes or no.
        stakeholdersPercent:
          type:
          - number
          - 'null'
          format: double
          description: Stakeholders section percentage of yes answers over applicable answers; NULL if
            no items applicable.
        practicesYesCount:
          type: integer
          format: int32
          description: Number of Practices items (0-18) answered yes.
        practicesApplicableCount:
          type: integer
          format: int32
          description: Number of Practices items (0-18) answered yes or no.
        practicesPercent:
          type:
          - number
          - 'null'
          format: double
          description: Practices section percentage of yes answers over applicable answers; NULL if no
            items applicable.
        overallPercent:
          type:
          - number
          - 'null'
          format: double
          description: Unweighted mean of the three section percentages; NULL when fewer than 30 items
            have been answered.
        teamsBand:
          type: string
          enum:
          - high
          - mid
          - low
          - unanswered
          - ''
          description: 'Teams band derived from teams_percent: high (>=75), mid (50-74), low (<50), unanswered.'
        stakeholdersBand:
          type: string
          enum:
          - high
          - mid
          - low
          - unanswered
          - ''
          description: Stakeholders band derived from stakeholders_percent.
        practicesBand:
          type: string
          enum:
          - high
          - mid
          - low
          - unanswered
          - ''
          description: Practices band derived from practices_percent.
        maturity:
          type: string
          enum:
          - optimising
          - mature
          - developing
          - initial
          - ad-hoc
          - insufficient-data
          - ''
          description: 'Composite maturity level: optimising, mature, developing, initial, ad-hoc, or
            insufficient-data.'
        topAction1:
          type: string
          maxLength: 500
          description: First prioritised action drawn from the weakest section.
        topAction2:
          type: string
          maxLength: 500
          description: Second prioritised action drawn from the weakest section.
        topAction3:
          type: string
          maxLength: 500
          description: Third prioritised action drawn from the weakest section.
        coachNotes:
          type: string
          description: Free-text agile-coach notes accompanying the action plan.
        signedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Timestamp of electronic sign-off.
        gradedAt:
          type: string
          format: date-time
          description: Timestamp the engine last computed this result.
      required:
      - createdAt
      - updatedAt
      - agileChecklistId
      - answeredCount
      - teamsYesCount
      - teamsApplicableCount
      - stakeholdersYesCount
      - stakeholdersApplicableCount
      - practicesYesCount
      - practicesApplicableCount
      - teamsBand
      - stakeholdersBand
      - practicesBand
      - maturity
      - topAction1
      - topAction2
      - topAction3
      - coachNotes
      - gradedAt
      description: Computed grading and signed-off action plan. One-to-one with agile_checklist.
    AgileChecklistGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        agileChecklistGradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade row.
        flagId:
          type: string
          maxLength: 40
          description: Stable flag identifier (e.g. F-PSYCH-SAFETY).
        category:
          type: string
          enum:
          - teams-autonomy-risk
          - stakeholders-trust-risk
          - practices-discipline-risk
          - section-imbalance
          - finished-work-risk
          - experimentation-blocked
          - learning-stalled
          - psychological-safety-risk
          - insufficient-data
          - other
          - ''
          description: 'Flag category: teams-autonomy-risk, stakeholders-trust-risk, practices-discipline-risk,
            section-imbalance, finished-work-risk, experimentation-blocked, learning-stalled, psychological-safety-risk,
            insufficient-data, or other.'
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          description: 'Operational priority: low, medium, or high.'
        section:
          type: string
          enum:
          - teams
          - stakeholders
          - practices
          - ''
          description: 'Section the flag is anchored to: teams, stakeholders, or practices. Empty for
            cross-cutting flags.'
        triggeringItems:
          type: string
          maxLength: 200
          description: Comma-separated list of stable item slugs (e.g. "t08,p12") that triggered this
            flag.
        description:
          type: string
          maxLength: 500
          description: Human-readable description of the operational concern.
        suggestedAction:
          type: string
          maxLength: 500
          description: Suggested coaching action to address the flag.
      required:
      - createdAt
      - updatedAt
      - agileChecklistGradeId
      - flagId
      - category
      - priority
      - section
      - triggeringItems
      - description
      - suggestedAction
      description: Operational flags raised by the maturity engine independently of the composite maturity
        level.
    AgileChecklistGradeRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        agileChecklistGradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade row.
        ruleId:
          type: string
          maxLength: 40
          description: Stable rule identifier (e.g. R-TEAMS-LOW).
        section:
          type: string
          enum:
          - teams
          - stakeholders
          - practices
          - ''
          description: 'Section the rule applies to: teams, stakeholders, or practices.'
        band:
          type: string
          enum:
          - high
          - mid
          - low
          - unanswered
          - ''
          description: 'Band the section was placed into: high, mid, low, or unanswered.'
        description:
          type: string
          maxLength: 500
          description: Human-readable description of why the rule fired and its coaching implication.
      required:
      - createdAt
      - updatedAt
      - agileChecklistGradeId
      - ruleId
      - section
      - band
      - description
      description: Audit trail of every coaching rule fired by the maturity engine, one row per section
        that was placed into a band (high / mid / low / unanswered).
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          description: A URI identifying the problem type
        title:
          type: string
          description: A short summary of the problem type
        status:
          type: integer
          description: The HTTP status code
        detail:
          type: string
          description: An explanation of this occurrence
        instance:
          type: string
          description: A URI identifying this occurrence
        code:
          type: string
          description: A short machine-readable reason
        errors:
          type: object
          description: Per-field detail, when validation failed
      required:
      - type
      - title
      - status
    Respondent:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        fullName:
          type: string
          maxLength: 255
          description: Full name of the respondent.
        email:
          type: string
          maxLength: 255
          description: Contact email address.
        role:
          type: string
          enum:
          - team-member
          - team-lead
          - scrum-master
          - product-owner
          - engineering-manager
          - agile-coach
          - executive-sponsor
          - other
          - ''
          description: 'Job role: team-member, team-lead, scrum-master, product-owner, engineering-manager,
            agile-coach, executive-sponsor, or other.'
        teamName:
          type: string
          maxLength: 255
          description: Name of the team being assessed.
        organisationName:
          type: string
          maxLength: 255
          description: Name of the broader organisation, division, or programme.
        yearsInAgile:
          type:
          - integer
          - 'null'
          format: int32
          description: Number of years the respondent has worked in agile environments.
      required:
      - createdAt
      - updatedAt
      - fullName
      - email
      - role
      - teamName
      - organisationName
      description: A single person completing an agile-checklist assessment. One respondent may submit
        multiple assessments over time.
