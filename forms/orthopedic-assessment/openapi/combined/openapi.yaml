components:
  schemas:
    Assessment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the patient who owns this assessment.
        status:
          type: string
          enum:
          - draft
          - submitted
          - reviewed
          - urgent
          description: 'Lifecycle status: draft, submitted, reviewed, or urgent.'
      required:
      - createdAt
      - updatedAt
      - patientId
      - status
      description: Orthopaedic assessment form using DASH score. Parent entity for all assessment sections.
    AssessmentImagingHistory:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        assessmentId:
          type: string
          format: uuid
          description: Foreign key to the parent assessment (unique, enforcing 1:1).
        hasPreviousImaging:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Whether the patient has had previous imaging: yes, no, or empty.'
        imagingRequested:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Whether new imaging has been requested: yes, no, or empty.'
        imagingRequestedDetails:
          type: string
          description: Details of newly requested imaging.
        imagingNotes:
          type: string
          description: Additional notes on imaging history.
      required:
      - createdAt
      - updatedAt
      - assessmentId
      - hasPreviousImaging
      - imagingRequested
      - imagingRequestedDetails
      - imagingNotes
      description: 'Imaging history section header: prior imaging and new requests. One-to-one child of
        assessment.'
    AssessmentImagingItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        imagingHistoryId:
          type: string
          format: uuid
          description: Foreign key to the assessment_imaging_history table.
        modality:
          type: string
          enum:
          - x-ray
          - mri
          - ct
          - ultrasound
          - bone-scan
          - dexa
          - other
          - ''
          description: 'Imaging modality: x-ray, mri, ct, ultrasound, bone-scan, dexa, other, or empty.'
        bodyRegion:
          type: string
          maxLength: 100
          description: Body region imaged.
        datePerformed:
          type:
          - string
          - 'null'
          format: date
          description: Date the imaging was performed.
        findings:
          type: string
          description: Summary of imaging findings.
        sortOrder:
          type: integer
          format: int32
          description: Display order of the item within the list.
      required:
      - createdAt
      - updatedAt
      - imagingHistoryId
      - modality
      - bodyRegion
      - findings
      - sortOrder
      description: Individual imaging study with modality, region, date, and findings.
    AssessmentRangeOfMotion:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        assessmentId:
          type: string
          format: uuid
          description: Foreign key to the parent assessment (unique, enforcing 1:1).
        jointAssessed:
          type: string
          enum:
          - shoulder
          - elbow
          - wrist
          - hand
          - hip
          - knee
          - ankle
          - spine-cervical
          - spine-lumbar
          - other
          - ''
          description: Primary joint being assessed for range of motion.
        sideAssessed:
          type: string
          enum:
          - left
          - right
          - bilateral
          - ''
          description: 'Side assessed: left, right, bilateral, or empty.'
        overallRomStatus:
          type: string
          enum:
          - full
          - mildly-restricted
          - moderately-restricted
          - severely-restricted
          - ''
          description: 'Overall range of motion status: full, mildly-restricted, moderately-restricted,
            severely-restricted, or empty.'
        rangeOfMotionNotes:
          type: string
          description: Additional notes on range of motion assessment.
      required:
      - createdAt
      - updatedAt
      - assessmentId
      - jointAssessed
      - sideAssessed
      - overallRomStatus
      - rangeOfMotionNotes
      description: 'Range of motion section header: joint, side, and overall status. One-to-one child
        of assessment.'
    AssessmentRomMeasurement:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        movement:
          type: string
          maxLength: 50
          description: Name of the movement being measured (e.g. flexion, extension, abduction, internal
            rotation).
        activeDegrees:
          type:
          - integer
          - 'null'
          format: int32
          description: Active range of motion in degrees.
        passiveDegrees:
          type:
          - integer
          - 'null'
          format: int32
          description: Passive range of motion in degrees.
        normalDegrees:
          type:
          - integer
          - 'null'
          format: int32
          description: Expected normal range of motion in degrees for comparison.
        endFeel:
          type: string
          enum:
          - firm
          - hard
          - soft
          - empty
          - springy
          - ''
          description: 'End feel on passive movement: firm, hard, soft, empty, springy, or empty string.'
        painOnMovement:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Whether pain is present during this movement: yes, no, or empty.'
        sortOrder:
          type: integer
          format: int32
          description: Display order of the measurement within the list.
      required:
      - createdAt
      - updatedAt
      - movement
      - endFeel
      - painOnMovement
      - sortOrder
      description: Individual range of motion measurement for a specific movement (e.g. flexion, extension,
        abduction).
    AssessmentStrengthTestItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        strengthTestingId:
          type: string
          format: uuid
          description: Foreign key to the assessment_strength_testing table.
        muscleGroup:
          type: string
          maxLength: 100
          description: Muscle group tested (e.g. deltoid, biceps, quadriceps).
        movement:
          type: string
          maxLength: 100
          description: Movement tested (e.g. shoulder abduction, elbow flexion).
        mrcGrade:
          type:
          - integer
          - 'null'
          format: int32
          description: 'MRC muscle strength grade: 0 = no contraction, 1 = flicker, 2 = movement with
            gravity eliminated, 3 = movement against gravity, 4 = movement against resistance, 5 = normal.'
        painOnTesting:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Whether pain occurred during strength testing: yes, no, or empty.'
        sortOrder:
          type: integer
          format: int32
          description: Display order of the item within the list.
      required:
      - createdAt
      - updatedAt
      - strengthTestingId
      - muscleGroup
      - movement
      - painOnTesting
      - sortOrder
      description: Individual manual muscle testing result using MRC scale (0-5).
    AssessmentStrengthTesting:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        assessmentId:
          type: string
          format: uuid
          description: Foreign key to the parent assessment (unique, enforcing 1:1).
        gripStrengthAffectedKg:
          type:
          - number
          - 'null'
          format: double
          description: Grip strength of the affected side in kilograms.
        gripStrengthUnaffectedKg:
          type:
          - number
          - 'null'
          format: double
          description: Grip strength of the unaffected side in kilograms.
        overallStrengthStatus:
          type: string
          enum:
          - normal
          - mildly-reduced
          - moderately-reduced
          - severely-reduced
          - ''
          description: 'Overall strength assessment: normal, mildly-reduced, moderately-reduced, severely-reduced,
            or empty.'
        strengthTestingNotes:
          type: string
          description: Additional notes on strength testing.
      required:
      - createdAt
      - updatedAt
      - assessmentId
      - overallStrengthStatus
      - strengthTestingNotes
      description: 'Strength testing section header: grip strength and overall status. One-to-one child
        of assessment.'
    AssessmentSurgeryItem:
