components:
  schemas:
    Assessment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when this row was deleted.
        patient_id:
          type: string
          format: uuid
          description: Foreign key to the patient who owns this assessment.
        status:
          type: string
          enum:
          - draft
          - submitted
          - reviewed
          - urgent
          description: 'Lifecycle status: draft, submitted, reviewed, or urgent.'
        range_of_motion_deleted_at:
          type: string
          format: date-time
          description: Timestamp when this row was deleted.
        joint_assessed:
          type: string
          enum:
          - shoulder
          - elbow
          - wrist
          - hand
          - hip
          - knee
          - ankle
          - spine-cervical
          - spine-lumbar
          - other
          - ''
          description: Primary joint being assessed for range of motion.
        side_assessed:
          type: string
          enum:
          - left
          - right
          - bilateral
          - ''
          description: 'Side assessed: left, right, bilateral, or empty.'
        overall_rom_status:
          type: string
          enum:
          - full
          - mildly-restricted
          - moderately-restricted
          - severely-restricted
          - ''
          description: 'Overall range of motion status: full, mildly-restricted, moderately-restricted,
            severely-restricted, or empty.'
        range_of_motion_notes:
          type: string
          description: Additional notes on range of motion assessment.
        rom_measurement_deleted_at:
          type: string
          format: date-time
          description: Timestamp when this row was deleted.
        range_of_motion_id:
          type: string
          format: uuid
          description: Foreign key to the assessment_range_of_motion table.
        movement:
          type: string
          maxLength: 50
          description: Name of the movement being measured (e.g. flexion, extension, abduction, internal
            rotation).
        active_degrees:
          type: integer
          format: int32
          description: Active range of motion in degrees.
        passive_degrees:
          type: integer
          format: int32
          description: Passive range of motion in degrees.
        normal_degrees:
          type: integer
          format: int32
          description: Expected normal range of motion in degrees for comparison.
        end_feel:
          type: string
          enum:
          - firm
          - hard
          - soft
          - empty
          - springy
          - ''
          description: 'End feel on passive movement: firm, hard, soft, empty, springy, or empty string.'
        pain_on_movement:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Whether pain is present during this movement: yes, no, or empty.'
        sort_order:
          type: integer
          format: int32
          description: Display order of the measurement within the list.
        strength_testing_deleted_at:
          type: string
          format: date-time
          description: Timestamp when this row was deleted.
        grip_strength_affected_kg:
          type: number
          format: double
          description: Grip strength of the affected side in kilograms.
        grip_strength_unaffected_kg:
          type: number
          format: double
          description: Grip strength of the unaffected side in kilograms.
        overall_strength_status:
          type: string
          enum:
          - normal
          - mildly-reduced
          - moderately-reduced
          - severely-reduced
          - ''
          description: 'Overall strength assessment: normal, mildly-reduced, moderately-reduced, severely-reduced,
            or empty.'
        strength_testing_notes:
          type: string
          description: Additional notes on strength testing.
        strength_test_item_deleted_at:
          type: string
          format: date-time
          description: Timestamp when this row was deleted.
        strength_testing_id:
          type: string
          format: uuid
          description: Foreign key to the assessment_strength_testing table.
        muscle_group:
          type: string
          maxLength: 100
          description: Muscle group tested (e.g. deltoid, biceps, quadriceps).
        strength_test_item_movement:
          type: string
          maxLength: 100
          description: Movement tested (e.g. shoulder abduction, elbow flexion).
        mrc_grade:
          type: integer
          format: int32
          description: 'MRC muscle strength grade: 0 = no contraction, 1 = flicker, 2 = movement with
            gravity eliminated, 3 = movement against gravity, 4 = movement against resistance, 5 = normal.'
        pain_on_testing:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Whether pain occurred during strength testing: yes, no, or empty.'
        strength_test_item_sort_order:
          type: integer
          format: int32
          description: Display order of the item within the list.
        imaging_history_deleted_at:
          type: string
          format: date-time
          description: Timestamp when this row was deleted.
        has_previous_imaging:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Whether the patient has had previous imaging: yes, no, or empty.'
        imaging_requested:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Whether new imaging has been requested: yes, no, or empty.'
        imaging_requested_details:
          type: string
          description: Details of newly requested imaging.
        imaging_notes:
          type: string
          description: Additional notes on imaging history.
        imaging_item_deleted_at:
          type: string
          format: date-time
          description: Timestamp when this row was deleted.
        imaging_history_id:
          type: string
          format: uuid
          description: Foreign key to the assessment_imaging_history table.
        modality:
          type: string
          enum:
          - x-ray
          - mri
          - ct
          - ultrasound
          - bone-scan
          - dexa
          - other
          - ''
          description: 'Imaging modality: x-ray, mri, ct, ultrasound, bone-scan, dexa, other, or empty.'
        body_region:
          type: string
          maxLength: 100
          description: Body region imaged.
        date_performed:
          type: string
          format: date
          description: Date the imaging was performed.
        findings:
          type: string
          description: Summary of imaging findings.
        imaging_item_sort_order:
          type: integer
          format: int32
          description: Display order of the item within the list.
        surgical_history_deleted_at:
          type: string
          format: date-time
          description: Timestamp when this row was deleted.
        has_previous_surgery:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Whether the patient has had previous orthopedic surgery: yes, no, or empty.'
        surgery_considered:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Whether surgery is being considered for the current condition: yes, no, or empty.'
        surgery_considered_details:
          type: string
          description: Details of surgery being considered.
        patient_preference:
          type: string
          enum:
          - conservative
          - open-to-surgery
          - prefers-surgery
          - undecided
          - ''
          description: 'Patient preference regarding surgical intervention: conservative, open-to-surgery,
            prefers-surgery, undecided, or empty.'
        comorbidities_affecting_surgery:
          type: string
          description: Comorbidities that may affect surgical candidacy.
        anaesthetic_risk:
          type: string
          enum:
          - low
          - moderate
          - high
          - ''
          description: 'Estimated anaesthetic risk: low, moderate, high, or empty.'
        anticoagulant_use:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Whether the patient takes anticoagulants: yes, no, or empty.'
        anticoagulant_details:
          type: string
          description: Details of anticoagulant use.
        surgical_history_notes:
          type: string
          description: Additional clinician notes on surgical history and candidacy.
        surgery_item_deleted_at:
          type: string
          format: date-time
          description: Timestamp when this row was deleted.
        surgical_history_id:
          type: string
          format: uuid
          description: Foreign key to the assessment_surgical_history table.
        procedure_name:
          type: string
          maxLength: 255
          description: Name of the surgical procedure.
        surgery_item_date_performed:
          type: string
          format: date
          description: Date the surgery was performed.
        surgeon:
          type: string
          maxLength: 255
          description: Name of the operating surgeon.
        hospital:
          type: string
          maxLength: 255
          description: Hospital where the surgery was performed.
        outcome:
          type: string
          enum:
          - good
          - fair
          - poor
          - complication
          - ''
          description: 'Outcome of the surgery: good, fair, poor, complication, or empty.'
        outcome_details:
          type: string
          description: Details of the surgical outcome.
        surgery_item_sort_order:
          type: integer
          format: int32
          description: Display order of the item within the list.
