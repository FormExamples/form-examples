                $ref: '#/components/schemas/Patient'
        '404':
          description: Patient not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    patch:
      summary: Update an existing Patient
      operationId: updatePatient
      requestBody:
        required: true
        content:
          application/json:
            schema:
