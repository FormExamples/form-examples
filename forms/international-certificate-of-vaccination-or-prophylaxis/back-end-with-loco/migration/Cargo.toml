[package]
name = "migration"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "migration"
path = "src/lib.rs"

[dependencies]
async-trait = "0.1"
sea-orm-migration = { version = "1.1", features = [
  "sqlx-postgres",
  "runtime-tokio-rustls",
] }
loco-rs = { version = "0.16", features = ["with-db"] }
