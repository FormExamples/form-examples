[workspace]
members = [".", "migration"]
resolver = "2"

[package]
name = "international_certificate_of_vaccination_or_prophylaxis"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "international_certificate_of_vaccination_or_prophylaxis-cli"

[dependencies]
loco-rs = { version = "0.16", default-features = false, features = [
  "auth_jwt",
  "bg_pg",
  "cache_inmem",
  "cli",
  "with-db",
] }
sea-orm = { version = "1.1", features = [
  "sqlx-postgres",
  "runtime-tokio-rustls",
  "macros",
] }
migration = { path = "migration" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.45", features = ["rt-multi-thread"] }
async-trait = "0.1"
axum = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
thiserror = "1"
include_dir = "0.7"
opentelemetry = "0.27"
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio", "metrics"] }
opentelemetry-otlp = { version = "0.27", features = ["grpc-tonic", "metrics", "trace"] }
tracing-opentelemetry = "0.28"
axum-prometheus = "0.7"

[dev-dependencies]
loco-rs = { version = "0.16", default-features = false, features = [
  "auth_jwt",
  "bg_pg",
  "cache_inmem",
  "cli",
  "with-db",
] }
serial_test = "3.1"
assertables = "9.8"
insta = { version = "1.40", features = ["redactions", "yaml"] }

[[bin]]
name = "international_certificate_of_vaccination_or_prophylaxis-cli"
path = "src/bin/cli.rs"
required-features = []
