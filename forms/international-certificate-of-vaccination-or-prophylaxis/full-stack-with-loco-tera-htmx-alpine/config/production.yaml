logger:
  enable: true
  level: info
  format: json

server:
  port: '{{ get_env(name="PORT", default=5150) }}'
  host: '{{ get_env(name="HOST", default="http://localhost") }}'

workers:
  mode: BackgroundQueue

queue:
  kind: Postgres
  uri: '{{ get_env(name="DATABASE_URL") }}'
  dangerously_flush: false
  num_workers: 4

database:
  uri: '{{ get_env(name="DATABASE_URL") }}'
  enable_logging: false
  connect_timeout: 500
  idle_timeout: 500
  min_connections: 1
  max_connections: 30
  auto_migrate: true
  dangerously_truncate: false
  dangerously_recreate: false

