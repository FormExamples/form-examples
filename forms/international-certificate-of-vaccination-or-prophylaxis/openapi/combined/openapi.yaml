components:
  schemas:
    Center:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Official name of the vaccination centre.
        whoDesignationReference:
          type: string
          maxLength: 50
          description: WHO designation reference number, if listed in the WHO directory of yellow fever
            vaccinating centres.
        nationalAuthorityReference:
          type: string
          maxLength: 50
          description: Reference issued by the national health authority designating this centre.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as full free-text.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country of the centre as ISO 3166-1 alpha-2.
        countryAsIso31661Alpha3:
          type:
          - string
          - 'null'
          maxLength: 3
          description: Country of the centre as ISO 3166-1 alpha-3 (WHO model uses three-letter form).
        postcode:
          type:
          - string
          - 'null'
          description: Postal code for the centre address.
        uniformStampImageDataUrl:
          type: string
          description: Reference image of the uniform stamp captured as a data URL.
        authorisedDiseases:
          type: string
          description: Space-separated list of disease codes the centre is authorised to vaccinate against
            (default yellow-fever).
        designationValidFrom:
          type:
          - string
          - 'null'
          format: date
          description: Start date of the current WHO designation.
        designationValidUntil:
          type:
          - string
          - 'null'
          format: date
          description: End date of the current WHO designation.
      required:
      - createdAt
      - updatedAt
      - name
      - whoDesignationReference
      - nationalAuthorityReference
      - uniformStampImageDataUrl
      - authorisedDiseases
      description: WHO-designated vaccination centre that administers vaccinations and validates each
        certificate entry with its uniform stamp.
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Full name of the supervising clinician as it appears on the registration certificate.
        professionalStatus:
          type: string
          enum:
          - MD
          - DO
          - RN
          - NP
          - PA
          - Pharmacist
          - Paramedic
          - other
          - ''
          description: 'Professional status: MD, DO, RN, NP, PA, Pharmacist, Paramedic, other.'
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as full free-text.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country code for the postal address, ISO 3166-1 alpha-2.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code for the postal address.
        registrationBody:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - GPhC
          - state-medical-board
          - national-medical-council
          - other
          - ''
          description: Statutory registration body for the clinician.
        registrationNumber:
          type: string
          description: Clinician registration number issued by the registration body.
        signatureImageDataUrl:
          type: string
          description: Reference handwritten signature captured as a data URL for inclusion on the certificate.
        unitedKingdomNhsNumber:
          type:
          - string
          - 'null'
          maxLength: 12
          description: United Kingdom NHS number for the clinician where applicable.
      required:
      - createdAt
      - updatedAt
      - name
      - professionalStatus
      - registrationBody
      - registrationNumber
      - signatureImageDataUrl
      description: Supervising clinician authorised to issue an International Certificate of Vaccination
        or Prophylaxis on behalf of a WHO-designated centre.
    InternationalCertificateOfVaccinationOrProphylaxis:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the vaccinee.
        clinicianId:
          type: string
          format: uuid
          description: Foreign key to the supervising clinician for the certificate as a whole.
        centerId:
          type: string
          format: uuid
          description: Foreign key to the WHO-designated administering centre.
        status:
          type: string
          enum:
          - draft
          - issued
          - reissued
          - revoked
          description: 'Lifecycle status: draft, issued, reissued, or revoked.'
        issuedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Timestamp when the certificate was issued to the vaccinee.
        revokedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Timestamp when the certificate was revoked, if applicable.
        revocationReason:
          type: string
          description: Reason the certificate was revoked.
        certificateSerialNumber:
          type: string
          maxLength: 50
          description: Issuing centre's serial number for this certificate.
        issuingCountryAsIso31661Alpha3:
          type: string
          maxLength: 3
          description: Issuing country as ISO 3166-1 alpha-3.
        primaryLanguageAsBcp47:
          type: string
          maxLength: 10
          description: Primary language of the printed certificate (BCP 47).
        secondaryLanguageAsBcp47:
          type: string
          maxLength: 10
          description: Secondary language of the printed certificate; IHR Annex 6 requires English or
            French as one of the two.
        tertiaryLanguageAsBcp47:
          type: string
          maxLength: 10
          description: Optional third language for the printed certificate (issuing country's official
            language).
        destinationCountriesAsIso31661Alpha3:
          type: string
          description: Space-separated list of destination countries for the trip.
        plannedArrivalDate:
          type:
          - string
          - 'null'
          format: date
          description: Planned date of arrival at the primary destination.
        purposeOfTravel:
          type: string
          enum:
          - tourism
          - business
          - study
          - employment
          - humanitarian
          - military
          - family
          - medical
          - other
          - ''
          description: 'Purpose of travel: tourism, business, study, employment, humanitarian, military,
            family, medical, other.'
        medicalWaiver:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether a clinician-signed medical waiver has been issued in lieu of vaccination.
        medicalWaiverReason:
          type: string
          description: Free-text clinical reason for the medical waiver.
        medicalWaiverSignedByClinicianId:
          type:
          - string
          - 'null'
          format: uuid
          description: Foreign key to the clinician who signed the medical waiver, if any.
        medicalWaiverSignedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Timestamp when the medical waiver was signed.
        declaredPregnancy:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the vaccinee declared pregnancy at the encounter.
        declaredBreastfeeding:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the vaccinee declared breastfeeding at the encounter.
        declaredImmunosuppression:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the vaccinee declared immunosuppression at the encounter.
        electronicSignatureDataUrl:
          type: string
          description: Final electronic signature of the issuing clinician captured as a data URL.
        electronicSignatureSignedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Timestamp when the electronic signature was applied.
        overallValid:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Computed overall validity flag: yes if all entries pass the validation rules.'
        validityComputedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Timestamp at which overall validity was last computed.
        notes:
          type: string
          description: Free-text notes by the issuing clinician.
      required:
      - createdAt
      - updatedAt
      - patientId
      - clinicianId
      - centerId
      - status
      - revocationReason
      - certificateSerialNumber
      - issuingCountryAsIso31661Alpha3
      - primaryLanguageAsBcp47
      - secondaryLanguageAsBcp47
      - tertiaryLanguageAsBcp47
      - destinationCountriesAsIso31661Alpha3
      - purposeOfTravel
      - medicalWaiver
      - medicalWaiverReason
      - declaredPregnancy
      - declaredBreastfeeding
      - declaredImmunosuppression
      - electronicSignatureDataUrl
      - overallValid
      - notes
      description: WHO International Certificate of Vaccination or Prophylaxis (IHR 2005 Annex 6). One
        row per vaccinee per issued certificate; vaccination entries are recorded in the companion *_entry
        table.
    InternationalCertificateOfVaccinationOrProphylaxisEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        internationalCertificateOfVaccinationOrProphylaxisId:
          type: string
          format: uuid
          description: Foreign key to the parent certificate.
        entryIndex:
          type: integer
          format: int32
          description: 1-indexed position of this entry on the certificate (1 to 8 entries per certificate).
        disease:
          type: string
          enum:
          - yellow-fever
          - polio
          - smallpox
          - cholera
          - meningococcal
          - covid-19
          - other
          - ''
          description: 'Disease code: yellow-fever, polio, smallpox, cholera, meningococcal, covid-19,
            or other.'
        diseaseOtherLabel:
          type: string
          maxLength: 100
          description: Free-text disease name when disease is "other".
        diseaseAsSnomedCt:
          type: string
          maxLength: 20
          description: Disease as SNOMED CT concept ID.
        diseaseAsIcd11:
          type: string
          maxLength: 20
          description: Disease as ICD-11 code.
        vaccineOrProphylaxisName:
          type: string
          maxLength: 255
          description: Trade or generic name of the vaccine or prophylaxis administered.
        vaccineAsSnomedCt:
          type: string
          maxLength: 20
          description: Vaccine as SNOMED CT concept ID.
        vaccineAsAtc:
          type: string
          maxLength: 20
          description: Vaccine as WHO ATC classification code.
        manufacturer:
          type: string
          maxLength: 255
          description: Manufacturer name as printed on the vial label.
        manufacturerCountryAsIso31661Alpha3:
          type: string
          maxLength: 3
          description: Country of manufacture as ISO 3166-1 alpha-3.
        batchNumber:
          type: string
          maxLength: 50
          description: Batch or lot number as printed on the vial label.
        lotExpiryDate:
          type:
          - string
          - 'null'
          format: date
          description: Lot expiry date as printed on the vial label.
        route:
          type: string
          enum:
          - intramuscular
          - subcutaneous
          - intradermal
          - oral
          - intranasal
          - other
          - ''
          description: 'Route of administration: intramuscular, subcutaneous, intradermal, oral, intranasal,
            or other.'
        anatomicalSite:
          type: string
          enum:
          - left-deltoid
          - right-deltoid
          - left-thigh
          - right-thigh
          - left-gluteus
          - right-gluteus
          - oral
          - nasal
          - other
          - ''
          description: Anatomical site of administration.
        doseAmountValue:
          type:
          - number
          - 'null'
          format: double
          description: Numeric dose amount administered.
        doseAmountUnit:
          type: string
          enum:
          - mL
          - mg
          - IU
          - drops
          - ''
          description: 'Unit for the dose amount: mL, mg, IU, drops.'
        doseSequence:
          type:
          - integer
          - 'null'
          format: int32
          description: Dose number in the current vaccination course (1-indexed).
        doseSequenceTotal:
          type:
          - integer
          - 'null'
          format: int32
          description: Total doses planned for the current vaccination course.
        vaccinationDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the vaccination was administered.
        vaccinationTime:
          type:
          - string
          - 'null'
          format: time
          description: Time of day the vaccination was administered.
        administeredByClinicianId:
          type:
          - string
          - 'null'
          format: uuid
          description: Foreign key to the clinician who administered this dose.
        administeringClinicianSignatureDataUrl:
          type: string
          description: Handwritten signature of the administering clinician captured as a data URL (PNG).
            Stamps are not acceptable per IHR Annex 6.
        administeringClinicianProfessionalStatus:
          type: string
          maxLength: 50
          description: Professional status of the administering clinician as printed on the certificate.
        validityStartsOn:
          type:
          - string
          - 'null'
          format: date
          description: 'Date from which the entry is valid (for yellow fever: vaccination_date + 10 days).'
        validityEndsOn:
          type:
          - string
          - 'null'
          format: date
          description: Date on which the entry expires. May be left NULL when validity_is_lifetime is
            "yes".
        validityIsLifetime:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the entry is valid for the lifetime of the vaccinee. Set to "yes" for yellow
            fever per the 2016 IHR amendment.
        centreId:
          type:
          - string
          - 'null'
          format: uuid
          description: Foreign key to the administering centre for this entry (may differ from the parent
            certificate centre for travellers vaccinated at multiple centres).
        centreStampImageDataUrl:
          type: string
          description: Image of the centre's uniform stamp captured on this entry.
        centreStampApplied:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the centre's uniform stamp has been applied to this entry.
        adverseEvent:
          type: string
          enum:
          - none
          - local
          - systemic
          - anaphylaxis
          - other
          - ''
          description: 'Recorded adverse event following immunisation: none, local, systemic, anaphylaxis,
            or other.'
        adverseEventNotes:
          type: string
          description: Free-text notes describing the adverse event.
        entryValid:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Computed validity flag for this individual entry.
        entryNotes:
          type: string
          description: Free-text notes for this entry.
      required:
      - createdAt
      - updatedAt
      - internationalCertificateOfVaccinationOrProphylaxisId
      - entryIndex
      - disease
      - diseaseOtherLabel
      - diseaseAsSnomedCt
      - diseaseAsIcd11
      - vaccineOrProphylaxisName
      - vaccineAsSnomedCt
      - vaccineAsAtc
      - manufacturer
      - manufacturerCountryAsIso31661Alpha3
      - batchNumber
      - route
      - anatomicalSite
      - doseAmountUnit
      - administeringClinicianSignatureDataUrl
      - administeringClinicianProfessionalStatus
      - validityIsLifetime
      - centreStampImageDataUrl
      - centreStampApplied
      - adverseEvent
      - adverseEventNotes
      - entryValid
      - entryNotes
      description: One vaccination or prophylaxis entry on an International Certificate of Vaccination
        or Prophylaxis. Multiple entries may appear on a single certificate for different diseases or
        booster doses.
    Patient:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        surname:
          type: string
          maxLength: 255
          description: Surname (family name) exactly as it appears on the travel document.
        givenNames:
          type: string
          maxLength: 255
          description: Given names (one or more) exactly as they appear on the travel document.
        birthDate:
          type:
          - string
          - 'null'
          format: date
          description: Date of birth, in the format day in figures, month in letters, year in figures.
        sex:
          type: string
          enum:
          - male
          - female
          - other
          - unspecified
          - ''
          description: 'Sex as recorded on the travel document: male, female, other, unspecified.'
        nationalityAsIso31661Alpha3:
          type: string
          maxLength: 3
          description: Nationality as ISO 3166-1 alpha-3 three-letter country code (WHO model uses three-letter
            form).
        travelDocumentKind:
          type: string
          enum:
          - passport
          - national-id
          - travel-document
          - other
          - ''
          description: 'Kind of travel document presented: passport, national-id, travel-document, other.'
        travelDocumentNumber:
          type: string
          maxLength: 50
          description: Number of the travel document presented at the vaccination encounter.
        travelDocumentIssuerAsIso31661Alpha3:
          type: string
          maxLength: 3
          description: Country that issued the travel document, ISO 3166-1 alpha-3.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as full free-text.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country of residence for postal validation, ISO 3166-1 alpha-2.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code for the postal address.
        consentedToDataSharing:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the vaccinee has consented to onward sharing of the certificate data.
        signatureImageDataUrl:
          type: string
          description: Vaccinee signature captured as a data URL (PNG) if signed digitally; empty if signed
            on paper.
      required:
      - createdAt
      - updatedAt
      - surname
      - givenNames
      - sex
      - nationalityAsIso31661Alpha3
      - travelDocumentKind
      - travelDocumentNumber
      - travelDocumentIssuerAsIso31661Alpha3
      - consentedToDataSharing
      - signatureImageDataUrl
      description: Vaccinee identified on an International Certificate of Vaccination or Prophylaxis.
        The vaccinee may be a traveller of any age.
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          description: A URI identifying the problem type
        title:
          type: string
          description: A short summary of the problem type
        status:
          type: integer
          description: The HTTP status code
        detail:
          type: string
          description: An explanation of this occurrence
        instance:
          type: string
          description: A URI identifying this occurrence
        code:
          type: string
          description: A short machine-readable reason
        errors:
          type: object
          description: Per-field detail, when validation failed
      required:
      - type
      - title
      - status
