components:
  schemas:
    Patient:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          maxLength: 255
          description: Name.
        birthDate:
          type: string
          format: date
          description: Birth date.
        sex:
          type: string
          enum:
          - female
          - male
          - intersex
          - unknown
          - ''
          description: Sex recorded for clinical purposes.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as full text.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code, such as for validating the postal address.
        unitedKingdomNhsNumber:
          type:
          - string
          - 'null'
          maxLength: 20
          description: United Kingdom NHS number, unique per person.
        preferredLanguageAsIso6391:
          type: string
          maxLength: 2
          description: Preferred written / spoken language as ISO 639-1 two-letter code.
        interpreterRequired:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether an interpreter is required for clinical communication.
        accessibilityNeeds:
          type: string
          description: Recorded accessibility needs (e.g. BSL, large print, easy read, step-free access).
        preferredContactChannel:
          type: string
          enum:
          - sms
          - email
          - phone
          - letter
          - nhs-app
          - ''
          description: Preferred channel for waiting-list and appointment communications.
      required:
      - createdAt
      - updatedAt
      - name
      - birthDate
      - sex
      - preferredLanguageAsIso6391
      - interpreterRequired
      - accessibilityNeeds
      - preferredContactChannel
      description: Patient placed on a plastic surgery waiting list.
    PlasticSurgWaitingListCard:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the patient placed on the list.
        practitionerId:
          type: string
          format: uuid
