logger:
  enable: true
  level: warn
  format: compact

server:
  port: 5210
  host: http://localhost
  middlewares:
    cors:
      enable: true
      allow_origins:
        - http://localhost:5210

workers:
  mode: BackgroundQueue

queue:
  kind: Postgres
  uri: postgres://postgres:postgres@localhost:5432/predicting_risk_of_cardiovascular_disease_events_test
  dangerously_flush: true
  num_workers: 1

database:
  uri: postgres://postgres:postgres@localhost:5432/predicting_risk_of_cardiovascular_disease_events_test
  enable_logging: false
  connect_timeout: 500
  idle_timeout: 500
  min_connections: 1
  max_connections: 1
  auto_migrate: true
  dangerously_truncate: true
