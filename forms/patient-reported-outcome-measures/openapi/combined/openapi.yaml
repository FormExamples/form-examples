          type:
          - integer
          - 'null'
          format: int32
          description: EQ-5D-3L Self-Care dimension, 1 (no problems) - 3 (unable to wash/dress).
        eq5dUsualActivities:
          type:
          - integer
          - 'null'
          format: int32
          description: EQ-5D-3L Usual Activities dimension, 1 (no problems) - 3 (unable to perform).
        eq5dPainDiscomfort:
          type:
          - integer
          - 'null'
          format: int32
          description: EQ-5D-3L Pain/Discomfort dimension, 1 (none) - 3 (extreme).
        eq5dAnxietyDepression:
          type:
          - integer
          - 'null'
          format: int32
          description: EQ-5D-3L Anxiety/Depression dimension, 1 (not anxious/depressed) - 3 (extremely
            anxious/depressed).
        eq5dVasScore:
          type:
          - number
          - 'null'
          format: double
          description: 'EQ VAS: patient-rated current health state, 0 (worst imaginable) - 100 (best imaginable).'
      required:
      - createdAt
      - updatedAt
      - subjectId
      - visit
      description: One completed PRO-measure battery (SF-36v2, NDI, mJOA, EQ-5D-3L) at one patient visit;
        raw responses only, computed scores are in the sibling _score table.
    PatientReportedOutcomeMeasuresScore:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        patientReportedOutcomeMeasuresId:
          type: string
          format: uuid
          description: Foreign key to the parent raw-response row (1:1).
        sf36Pf:
          type:
          - number
          - 'null'
          format: double
          description: SF-36 Physical Functioning domain score, 0-100 (RAND-36 method), higher = better.
        sf36Rp:
          type:
          - number
          - 'null'
          format: double
          description: SF-36 Role-Physical domain score, 0-100, higher = better.
        sf36Bp:
          type:
          - number
          - 'null'
          format: double
          description: SF-36 Bodily Pain domain score, 0-100, higher = better (less pain).
        sf36Gh:
          type:
          - number
          - 'null'
          format: double
          description: SF-36 General Health domain score, 0-100, higher = better.
        sf36Vt:
          type:
          - number
          - 'null'
          format: double
          description: SF-36 Vitality domain score, 0-100, higher = better.
        sf36Sf:
          type:
          - number
          - 'null'
          format: double
          description: SF-36 Social Functioning domain score, 0-100, higher = better.
        sf36Re:
          type:
          - number
          - 'null'
          format: double
          description: SF-36 Role-Emotional domain score, 0-100, higher = better.
        sf36Mh:
          type:
          - number
          - 'null'
          format: double
          description: SF-36 Mental Health domain score, 0-100, higher = better.
        sf36PcsApprox:
          type:
          - number
          - 'null'
          format: double
          description: 'Simplified (non-licensed) physical-component summary approximation: unweighted
            mean of PF/RP/BP/GH. NOT the trademarked QualityMetric SF-36v2 PCS.'
        sf36McsApprox:
          type:
          - number
          - 'null'
          format: double
          description: 'Simplified (non-licensed) mental-component summary approximation: unweighted mean
            of VT/SF/RE/MH. NOT the trademarked QualityMetric SF-36v2 MCS.'
        ndiRawScore:
          type:
          - integer
          - 'null'
          format: int32
          description: 'NDI raw score: sum of answered sections, 0-50 max.'
        ndiAnsweredSections:
          type:
          - integer
          - 'null'
          format: int32
          description: Count of NDI sections answered (out of 10); used to adjust the percentage for missing
            sections.
        ndiPercentageScore:
          type:
          - number
          - 'null'
          format: double
          description: 'NDI percentage score: rawScore / (5 x answeredSections) x 100. Lower = better
            (less disability).'
        ndiBand:
          type: string
          enum:
          - no-disability
          - mild
          - moderate
          - severe
          - complete
          - ''
          description: 'NDI interpretation band: no-disability (0-4%), mild (5-14%), moderate (15-24%),
            severe (25-34%), complete (>=35%).'
        mjoaTotalScore:
          type:
          - integer
          - 'null'
          format: int32
          description: mJOA total score, 0-17. Higher = less dysfunction from myelopathy.
        mjoaBand:
          type: string
          enum:
          - mild
          - moderate
          - severe
          - ''
          description: 'mJOA severity band: mild (15-17), moderate (12-14), severe (0-11).'
        eq5dHealthStateDescriptor:
          type: string
          maxLength: 5
          description: EQ-5D-3L 5-digit health-state descriptor (mobility, self-care, usual activities,
            pain/discomfort, anxiety/depression), e.g. "11123".
        eq5dUkIndexValue:
          type:
          - number
          - 'null'
          format: double
          description: EQ-5D-3L index value via the Dolan (1997) UK time-trade-off tariff. Approx -0.594
            (worst) to 1.0 (full health), higher = better.
        eq5dVasScore:
          type:
          - number
          - 'null'
          format: double
          description: EQ VAS score mirrored from the raw response, 0-100, higher = better.
      required:
      - createdAt
      - updatedAt
      - patientReportedOutcomeMeasuresId
      - ndiBand
      - mjoaBand
      - eq5dHealthStateDescriptor
      description: Computed scores (1:1) for a patient_reported_outcome_measures row; always re-derivable
        from raw responses via the exact algorithms in spec/index.md.
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          description: A URI identifying the problem type
        title:
          type: string
          description: A short summary of the problem type
        status:
          type: integer
          description: The HTTP status code
        detail:
          type: string
          description: An explanation of this occurrence
        instance:
          type: string
          description: A URI identifying this occurrence
        code:
          type: string
          description: A short machine-readable reason
        errors:
          type: object
          description: Per-field detail, when validation failed
      required:
      - type
      - title
      - status
