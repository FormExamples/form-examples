components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Referring clinician full name.
        email:
          type: string
          description: Email address.
        phone:
          type: string
          description: Phone number.
        postal_address_as_full_text:
          type: string
          description: Postal address as a single text block.
        country_as_iso_3166_1_alpha_2:
          type: string
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2.
        postcode:
          type: string
          description: Postal code.
        role:
          type: string
          enum:
          - gp
          - gp-registrar
          - nurse-practitioner
          - pharmacist
          - paramedic
          - other
          - ''
          description: 'Referrer role: gp, gp-registrar, nurse-practitioner, pharmacist, paramedic, or
            other.'
        registration_body:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - GPhC
          - other
          - ''
          description: 'Professional registration body: GMC, NMC, HCPC, GPhC, or other.'
        registration_number:
          type: string
          description: Professional registration number (GMC / NMC / GPhC) issued by the registration
            body.
      required:
      - created_at
      - updated_at
      - name
      - role
      - registration_body
      - registration_number
      description: Clinician identifying information for the referring clinician who authored the referral
        letter.
    GeneralPractitionerReferralLetter:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patient_id:
          type: string
          format: uuid
          description: Foreign key to the patient being referred (restrict delete).
        clinician_id:
          type: string
          format: uuid
          description: Foreign key to the referring clinician (restrict delete); optional.
        patient_identifier:
          type: string
          maxLength: 100
          description: NHS number or local patient identifier as recorded on the letter.
        referrer_role:
          type: string
          enum:
          - gp
          - gp-registrar
          - nurse-practitioner
          - pharmacist
          - paramedic
          - other
          - ''
          description: 'Referrer role: gp, gp-registrar, nurse-practitioner, pharmacist, paramedic, or
            other.'
        referring_practice:
          type: string
          description: Referring practice name.
        referral_date:
          type: string
          format: date
          description: Date of referral.
        access_needs:
          type: string
          description: Interpreter or accessibility needs recorded for the patient.
        referral_specialty:
          type: string
          description: Specialty or service being referred to (always mandatory).
        named_clinician:
          type: string
          description: Named consultant or team being referred to (optional).
        receiving_organisation:
          type: string
          description: Receiving hospital, trust, or community provider.
        urgency:
          type: string
          enum:
          - routine
          - urgent
          - two-week-wait
          - emergency
          - ''
          description: 'Urgency classification: routine, urgent, two-week-wait, or emergency (always mandatory).'
        urgency_reason:
          type: string
          description: Why the referral is urgent; mandatory for urgent and two-week-wait.
        suspected_cancer_criterion:
          type: string
          description: Named NICE NG12 criterion; mandatory for two-week-wait.
        suspected_cancer_pathway:
          type: string
          description: Tumour-site suspected-cancer pathway; mandatory for two-week-wait.
        reason_for_referral:
          type: string
          description: Primary reason for the referral (always mandatory).
        relevant_history:
          type: string
          description: Relevant clinical history (always mandatory).
        presenting_problem:
          type: string
          description: Presenting problem.
        symptom_duration:
          type: string
          description: Duration of symptoms.
        red_flag_symptoms:
          type: string
          description: Documented red-flag symptoms; presence drives the emergency-features flag.
        examination_findings:
          type: string
          description: Examination findings.
        investigation_results:
          type: string
          description: Bloods, imaging, or other investigations already done.
        current_medications:
          type: string
          description: Current medications.
        allergies:
          type: string
          description: Allergies and reactions.
        patient_expectations:
          type: string
          description: Patient's expectations or question to the specialist.
        consent_to_share:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether consent to share information is documented (yes/no); anything other than
            yes raises the consent-not-documented flag.
        safety_netting:
          type: string
          description: Safety-netting advice given to the patient while waiting; absence raises the no-safety-netting
            flag.
        clinical_note:
          type: string
          description: Optional free-text note shown in the summary.
      required:
      - created_at
      - updated_at
      - patient_id
      - patient_identifier
      - referrer_role
      - referring_practice
      - access_needs
      - referral_specialty
      - named_clinician
      - receiving_organisation
      - urgency
      - urgency_reason
      - suspected_cancer_criterion
      - suspected_cancer_pathway
      - reason_for_referral
      - relevant_history
      - presenting_problem
      - symptom_duration
      - red_flag_symptoms
      - examination_findings
      - investigation_results
      - current_medications
      - allergies
      - patient_expectations
      - consent_to_share
      - safety_netting
      - clinical_note
      description: 'Main general-practitioner referral letter record: referral destination, urgency, reason
        and history, examination and investigation findings, medications and allergies, and the patient''s
        expectations, consent, and safety-netting, plus patient and referrer identification. Completeness
        grade, fired rules, and flags live in child tables.'
    GeneralPractitionerReferralLetterGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        general_practitioner_referral_letter_id:
          type: string
          format: uuid
          description: Foreign key to the parent referral letter (unique, 1:1).
        status:
          type: string
          enum:
          - Complete
          - Incomplete
          - ''
          description: 'Completeness status: Complete when every mandatory field is present, otherwise
            Incomplete.'
        urgency:
          type: string
          enum:
          - routine
          - urgent
          - two-week-wait
          - emergency
          - ''
          description: 'Echoed urgency classification: routine, urgent, two-week-wait, or emergency.'
        completeness_percent:
          type: integer
          format: int32
          description: 'Completeness percentage (0..100): present mandatory fields / total mandatory fields
            x 100.'
        graded_at:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the grade.
      required:
      - created_at
      - updated_at
      - general_practitioner_referral_letter_id
      - status
      - urgency
      - graded_at
      description: 'Computed documentation-completeness grading result for a referral letter: status (Complete/Incomplete),
        echoed urgency classification, and completeness percentage.'
    GeneralPractitionerReferralLetterGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        general_practitioner_referral_letter_grade_id:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        flag_id:
          type: string
          maxLength: 50
          description: Stable flag identifier (e.g. F-SUSPECTED-CANCER-PATHWAY-001).
        category:
          type: string
          enum:
          - suspected-cancer-pathway
          - emergency-features
          - mandatory-information-missing
          - urgency-information-missing
          - consent-not-documented
          - no-safety-netting
          - other
          - ''
          description: 'Flag category: suspected-cancer-pathway, emergency-features, mandatory-information-missing,
            urgency-information-missing, consent-not-documented, no-safety-netting, or other.'
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          - ''
          description: 'Priority: low, medium, high.'
        description:
          type: string
          maxLength: 500
          description: Human-readable description of what fired the flag.
        suggested_action:
          type: string
          maxLength: 500
          description: Suggested action (e.g. "name the NICE NG12 criterion and pathway", "arrange same-day
            assessment").
      required:
      - created_at
      - updated_at
      - general_practitioner_referral_letter_grade_id
      - flag_id
      - category
      - priority
      - description
      - suggested_action
      description: Flags that fire independently of the completeness status, with priority and a suggested
        action for the referring clinician.
    GeneralPractitionerReferralLetterGradeRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        general_practitioner_referral_letter_grade_id:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        rule_id:
          type: string
          maxLength: 40
          description: Stable rule identifier (e.g. R-MANDATORY-URGENCY-01).
        category:
          type: string
          maxLength: 50
          description: Subject category (e.g. mandatory-field, conditional-requirement, urgency-classification).
        description:
          type: string
          maxLength: 500
          description: Human-readable description of why the rule fired.
      required:
      - created_at
      - updated_at
      - general_practitioner_referral_letter_grade_id
      - rule_id
      - category
      - description
      description: 'Audit trail of every completeness rule that fired during grading: category and description.'
    Patient:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          maxLength: 255
          description: Full patient name.
        birth_date:
          type: string
          format: date
          description: Date of birth.
        sex:
          type: string
          enum:
          - female
          - male
          - intersex
          - unknown
          - ''
          description: 'Sex recorded for clinical purposes: female, male, intersex, or unknown.'
        email:
          type: string
          description: Email address.
        phone:
          type: string
          description: Phone number.
        postal_address_as_full_text:
          type: string
          description: Postal address as a single text block.
        country_as_iso_3166_1_alpha_2:
          type: string
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2.
        postcode:
          type: string
          description: Postal code.
        united_kingdom_nhs_number:
          type: string
          maxLength: 20
          description: United Kingdom NHS number, unique per person.
        hospital_mrn:
          type: string
          maxLength: 50
          description: Local hospital medical record number (MRN).
        height_as_cm:
          type: number
          format: double
          description: Height in centimetres.
        weight_as_kg:
          type: number
          format: double
          description: Weight in kilograms.
        body_mass_index:
          type: number
          format: double
          description: Body mass index (BMI), kg/m^2.
        allergies_summary:
          type: string
          description: Free-text summary of known allergies.
      required:
      - created_at
      - updated_at
      - name
      - birth_date
      - sex
      - allergies_summary
      description: Patient demographic information used by the general-practitioner referral letter.
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          description: A URI identifying the problem type
        title:
          type: string
          description: A short summary of the problem type
        status:
          type: integer
          description: The HTTP status code
        detail:
          type: string
          description: An explanation of this occurrence
        instance:
          type: string
          description: A URI identifying this occurrence
        code:
          type: string
          description: A short machine-readable reason
        errors:
          type: object
          description: Per-field detail, when validation failed
      required:
      - type
      - title
      - status
