components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Referring clinician full name.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as a single text block.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code.
        role:
          type: string
          enum:
          - gp
          - gp-registrar
          - nurse-practitioner
          - pharmacist
          - paramedic
          - other
          - ''
          description: 'Referrer role: gp, gp-registrar, nurse-practitioner, pharmacist, paramedic, or
            other.'
        registrationBody:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - GPhC
          - other
          - ''
          description: 'Professional registration body: GMC, NMC, HCPC, GPhC, or other.'
        registrationNumber:
          type: string
          description: Professional registration number (GMC / NMC / GPhC) issued by the registration
            body.
      required:
      - createdAt
      - updatedAt
      - name
      - role
      - registrationBody
      - registrationNumber
      description: Clinician identifying information for the referring clinician who authored the referral
        letter.
    GeneralPractitionerReferralLetter:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the patient being referred (restrict delete).
        clinicianId:
          type:
          - string
          - 'null'
          format: uuid
          description: Foreign key to the referring clinician (restrict delete); optional.
        patientIdentifier:
          type: string
          maxLength: 100
          description: NHS number or local patient identifier as recorded on the letter.
        referrerRole:
          type: string
          enum:
          - gp
          - gp-registrar
          - nurse-practitioner
          - pharmacist
          - paramedic
          - other
          - ''
          description: 'Referrer role: gp, gp-registrar, nurse-practitioner, pharmacist, paramedic, or
            other.'
        referringPractice:
          type: string
          description: Referring practice name.
        referralDate:
          type:
          - string
          - 'null'
          format: date
          description: Date of referral.
        accessNeeds:
          type: string
          description: Interpreter or accessibility needs recorded for the patient.
        referralSpecialty:
          type: string
          description: Specialty or service being referred to (always mandatory).
        namedClinician:
          type: string
          description: Named consultant or team being referred to (optional).
        receivingOrganisation:
          type: string
          description: Receiving hospital, trust, or community provider.
        urgency:
          type: string
          enum:
          - routine
          - urgent
          - two-week-wait
          - emergency
          - ''
          description: 'Urgency classification: routine, urgent, two-week-wait, or emergency (always mandatory).'
        urgencyReason:
          type: string
          description: Why the referral is urgent; mandatory for urgent and two-week-wait.
        suspectedCancerCriterion:
          type: string
          description: Named NICE NG12 criterion; mandatory for two-week-wait.
        suspectedCancerPathway:
          type: string
          description: Tumour-site suspected-cancer pathway; mandatory for two-week-wait.
        reasonForReferral:
          type: string
          description: Primary reason for the referral (always mandatory).
        relevantHistory:
          type: string
          description: Relevant clinical history (always mandatory).
        presentingProblem:
          type: string
          description: Presenting problem.
        symptomDuration:
          type: string
          description: Duration of symptoms.
        redFlagSymptoms:
          type: string
          description: Documented red-flag symptoms; presence drives the emergency-features flag.
        examinationFindings:
          type: string
          description: Examination findings.
        investigationResults:
          type: string
          description: Bloods, imaging, or other investigations already done.
        currentMedications:
          type: string
          description: Current medications.
        allergies:
          type: string
          description: Allergies and reactions.
        patientExpectations:
          type: string
          description: Patient's expectations or question to the specialist.
        consentToShare:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether consent to share information is documented (yes/no); anything other than
            yes raises the consent-not-documented flag.
        safetyNetting:
          type: string
          description: Safety-netting advice given to the patient while waiting; absence raises the no-safety-netting
            flag.
        clinicalNote:
          type: string
          description: Optional free-text note shown in the summary.
      required:
      - createdAt
      - updatedAt
      - patientId
      - patientIdentifier
      - referrerRole
      - referringPractice
      - accessNeeds
      - referralSpecialty
      - namedClinician
      - receivingOrganisation
      - urgency
      - urgencyReason
      - suspectedCancerCriterion
      - suspectedCancerPathway
      - reasonForReferral
      - relevantHistory
      - presentingProblem
      - symptomDuration
      - redFlagSymptoms
      - examinationFindings
      - investigationResults
      - currentMedications
      - allergies
      - patientExpectations
      - consentToShare
      - safetyNetting
      - clinicalNote
      description: 'Main general-practitioner referral letter record: referral destination, urgency, reason
        and history, examination and investigation findings, medications and allergies, and the patient''s
        expectations, consent, and safety-netting, plus patient and referrer identification. Completeness
        grade, fired rules, and flags live in child tables.'
    GeneralPractitionerReferralLetterGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        generalPractitionerReferralLetterId:
          type: string
          format: uuid
          description: Foreign key to the parent referral letter (unique, 1:1).
        status:
          type: string
          enum:
          - Complete
          - Incomplete
          - ''
          description: 'Completeness status: Complete when every mandatory field is present, otherwise
            Incomplete.'
        urgency:
          type: string
          enum:
          - routine
          - urgent
          - two-week-wait
          - emergency
          - ''
          description: 'Echoed urgency classification: routine, urgent, two-week-wait, or emergency.'
        completenessPercent:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Completeness percentage (0..100): present mandatory fields / total mandatory fields
            x 100.'
        gradedAt:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the grade.
      required:
      - createdAt
      - updatedAt
      - generalPractitionerReferralLetterId
      - status
      - urgency
      - gradedAt
      description: 'Computed documentation-completeness grading result for a referral letter: status (Complete/Incomplete),
        echoed urgency classification, and completeness percentage.'
    GeneralPractitionerReferralLetterGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        generalPractitionerReferralLetterGradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        flagId:
          type: string
          maxLength: 50
          description: Stable flag identifier (e.g. F-SUSPECTED-CANCER-PATHWAY-001).
        category:
          type: string
          enum:
          - suspected-cancer-pathway
          - emergency-features
          - mandatory-information-missing
          - urgency-information-missing
          - consent-not-documented
          - no-safety-netting
          - other
          - ''
          description: 'Flag category: suspected-cancer-pathway, emergency-features, mandatory-information-missing,
            urgency-information-missing, consent-not-documented, no-safety-netting, or other.'
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          - ''
          description: 'Priority: low, medium, high.'
        description:
          type: string
          maxLength: 500
          description: Human-readable description of what fired the flag.
        suggestedAction:
          type: string
          maxLength: 500
          description: Suggested action (e.g. "name the NICE NG12 criterion and pathway", "arrange same-day
            assessment").
      required:
      - createdAt
      - updatedAt
      - generalPractitionerReferralLetterGradeId
      - flagId
      - category
      - priority
      - description
      - suggestedAction
      description: Flags that fire independently of the completeness status, with priority and a suggested
        action for the referring clinician.
    GeneralPractitionerReferralLetterGradeRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        generalPractitionerReferralLetterGradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        ruleId:
          type: string
          maxLength: 40
          description: Stable rule identifier (e.g. R-MANDATORY-URGENCY-01).
        category:
          type: string
