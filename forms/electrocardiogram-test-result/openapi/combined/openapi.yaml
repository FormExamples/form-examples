        registration_body:
          type: string
          enum:
          - GMC
          - HCPC
          - other
          - ''
          description: 'Clinician registration body: GMC, HCPC, other.'
        registration_number:
          type: string
          description: Clinician registration number.
        united_kingdom_nhs_number:
          type: string
          maxLength: 12
          description: United Kingdom NHS number, unique per person.
      required:
      - created_at
      - updated_at
      - name
      - role
      - registration_body
      - registration_number
      description: Reporting clinician (cardiologist, cardiac physiologist, or reporting clinician) who
        authors and signs the ECG result report.
    ElectrocardiogramTestResult:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        patient_id:
          type: string
          format: uuid
          description: Foreign key to the patient.
        clinician_id:
          type: string
          format: uuid
          description: Foreign key to the reporting clinician (cardiologist / cardiac physiologist / reporting
            clinician).
        originating_request_reference:
          type: string
          maxLength: 255
          description: Free-text reference linking this report back to the originating ECG request (referral).
        report_status:
          type: string
          enum:
          - preliminary
          - final
          - amended
          - cancelled
          - ''
          description: 'Report lifecycle status: preliminary, final, amended, cancelled.'
        ecg_type:
          type: string
          enum:
          - resting-12-lead
          - exercise-stress
          - ambulatory-holter-24h
          - ambulatory-48h
          - event-recorder
          - other
          - ''
          description: 'Recorded ECG type: resting-12-lead, exercise-stress, ambulatory-holter-24h, ambulatory-48h,
            event-recorder, other.'
        performed_date:
          type: string
          format: date
          description: Date the ECG examination was recorded.
        reported_date:
          type: string
          format: date
          description: Date the report was authored / signed.
        recording_quality:
          type: string
          enum:
          - good
          - adequate
          - poor
          - ''
          description: 'Technical recording quality of the trace: good, adequate, poor.'
        clinical_history:
          type: string
          maxLength: 1000
          description: Clinical history and the question the examination was performed to answer.
        ventricular_rate_bpm:
          type: integer
          format: int32
          description: Ventricular rate in beats per minute (bpm).
        rhythm:
          type: string
          enum:
          - sinus
          - atrial-fibrillation
          - atrial-flutter
          - svt
          - ventricular-tachycardia
          - heart-block
          - paced
          - other
          - ''
          description: 'Dominant rhythm: sinus, atrial-fibrillation, atrial-flutter, svt, ventricular-tachycardia,
            heart-block, paced, other.'
        pr_interval_ms:
          type: integer
          format: int32
          description: PR interval in milliseconds (normal ~120-200 ms); prolongation suggests atrioventricular
            conduction delay / heart block.
        qrs_duration_ms:
          type: integer
          format: int32
          description: QRS duration in milliseconds (normal < 120 ms); widening suggests bundle branch
            block or ventricular origin.
        qt_interval_ms:
          type: integer
          format: int32
          description: Uncorrected QT interval in milliseconds.
        qtc_ms:
          type: integer
          format: int32
          description: Rate-corrected QT interval (QTc, e.g. Bazett) in milliseconds; >= 500 ms is markedly
            prolonged and confers torsades-de-pointes risk.
        cardiac_axis:
          type: string
          enum:
          - normal
          - left-deviation
          - right-deviation
          - ''
          description: 'Frontal-plane cardiac axis: normal, left-deviation, right-deviation.'
        st_elevation:
          type: boolean
          description: Whether ST-segment elevation (a potential STEMI / acute injury pattern) is present.
        st_depression:
          type: boolean
          description: Whether ST-segment depression (an ischaemia pattern) is present.
        t_wave_inversion:
          type: boolean
          description: Whether pathological T-wave inversion is present.
        pathological_q_waves:
          type: boolean
          description: Whether pathological Q waves (prior infarction) are present.
        left_ventricular_hypertrophy:
          type: boolean
          description: Whether voltage criteria for left ventricular hypertrophy (LVH) are met.
        bundle_branch_block:
          type: boolean
          description: Whether bundle branch block (left or right) is present.
        ischaemia:
          type: boolean
          description: Whether an ischaemic pattern is present.
        normal_ecg:
          type: boolean
          description: Whether the ECG is reported as normal.
        interpretation:
          type: string
          maxLength: 2000
          description: Narrative interpretation of the ECG findings (the body of the report).
        comparison_with_previous:
          type: string
          maxLength: 1000
          description: Comparison with relevant previous ECGs.
        impression:
          type: string
          maxLength: 2000
          description: Summary impression / conclusion answering the clinical question.
        reporting_category:
          type: string
          maxLength: 50
          description: Free-text structured-reporting category or coded label for the dominant interpretation.
        recommended_follow_up:
          type: string
          maxLength: 1000
          description: Recommended follow-up investigation, referral, or management.
        critical_result_communicated:
          type: boolean
          description: Whether a critical or unexpected significant result was communicated directly to
            the referrer / responsible team.
        reported_to:
          type: string
          maxLength: 500
          description: Who the critical / urgent result was communicated to, with date and time if applicable.
      required:
      - created_at
      - updated_at
      - patient_id
      - clinician_id
      - originating_request_reference
      - report_status
      - ecg_type
      - recording_quality
      - clinical_history
      - rhythm
      - cardiac_axis
      - st_elevation
      - st_depression
      - t_wave_inversion
      - pathological_q_waves
      - left_ventricular_hypertrophy
      - bundle_branch_block
      - ischaemia
      - normal_ecg
      - interpretation
      - comparison_with_previous
      - impression
      - reporting_category
      - recommended_follow_up
      - critical_result_communicated
      - reported_to
      description: ECG (electrocardiogram) test result (report). Captures the recorded ECG type and quality,
        the clinical history, the ventricular rate, rhythm and the PR / QRS / QT / QTc intervals and cardiac
        axis, the structured electrophysiological findings, the narrative interpretation and impression,
        recommended follow-up, and critical-result communication. This is the source-of-truth record that
        the four-axis interpretation grade is computed from.
    ElectrocardiogramTestResultGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        electrocardiogram_test_result_id:
          type: string
          format: uuid
          description: Foreign key to the parent result (unique, 1:1).
        result_classification:
          type: string
          enum:
          - normal
          - abnormal
          - critical
          - inconclusive
          - ''
          description: 'Axis A overall classification: normal, abnormal, critical, inconclusive.'
        abnormality_severity:
          type: string
          enum:
          - none
          - minor
          - moderate
          - major
          - ''
          description: 'Axis B abnormality severity: none, minor, moderate, major.'
        reporting_category:
          type: string
          maxLength: 50
          description: Axis B structured-reporting score / category label (e.g. a Minnesota-code or acute-ischaemia
            category).
        report_completeness_percent:
          type: integer
          format: int32
          description: Axis C report completeness as a percentage of mandatory report sections (0-100).
        follow_up_urgency:
          type: string
          enum:
          - routine
          - recommended
          - urgent
          - critical-alert
          - ''
          description: 'Axis D follow-up urgency: routine, recommended, urgent, critical-alert.'
        target_timeframe:
          type: string
          maxLength: 50
          description: Target timeframe for the recommended follow-up implied by the urgency.
        recommended_action:
          type: string
          maxLength: 500
          description: Axis D concise recommended action derived from the urgency.
        recommendation:
          type: string
          enum:
          - no-action
          - routine-follow-up
          - further-imaging
          - specialist-referral
          - urgent-review
          - ''
          description: 'Overall recommendation: no-action, routine-follow-up, further-imaging, specialist-referral,
            urgent-review.'
        clinician_notes:
          type: string
          description: Free-text interpretation / sign-off notes.
        signed_at:
          type: string
          format: date-time
          description: Timestamp of the reporting clinician electronic signature.
        graded_at:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the result.
      required:
      - created_at
      - updated_at
      - electrocardiogram_test_result_id
      - result_classification
      - abnormality_severity
      - reporting_category
      - follow_up_urgency
      - target_timeframe
      - recommended_action
      - recommendation
      - clinician_notes
      - graded_at
      description: 'Computed four-axis interpretation grade: result classification, abnormality severity
        / structured-reporting category, report completeness, and follow-up urgency. A critical result
        (e.g. STEMI ST-elevation, ventricular tachycardia, complete heart block, or markedly prolonged
        QTc) auto-escalates the follow-up urgency to critical-alert regardless of the other axes.'
    ElectrocardiogramTestResultGradeFlag:
      type: object
      properties:
        id:
