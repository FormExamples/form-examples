                $ref: '#/components/schemas/Problem'
        '422':
          description: The body does not match the schema
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    delete:
      summary: Delete a Patient
      operationId: deletePatient
      responses:
        '200':
          description: Patient deleted
        '404':
          description: Patient not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  schemas:
    Assessment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        patient_id:
          type: string
          format: uuid
          description: FK to patient. One patient may have many assessments over time.
        status:
          type: string
          enum:
          - in_progress
          - completed
          - reviewed
          description: 'Workflow status: in_progress (patient filling in), completed (submitted), reviewed
            (clinician signed off).'
      required:
      - created_at
      - updated_at
      - patient_id
      - status
      description: A single hematology assessment. Child tables hold section-specific clinical data.
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Name.
        email:
          type: string
          description: Email address.
        phone:
          type: string
          description: Phone number.
        postal_address_as_full_text:
          type: string
          description: Postal address as full text.
        country_as_iso_3166_1_alpha_2:
          type: string
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type: string
          description: Postal code, such as for validating the postal address.
        role:
          type: string
          enum:
          - anaesthetist
          - surgeon
          - preop-nurse
          - perioperative-physician
          - geriatrician
          - pharmacist
          - other
          - ''
          description: Clinician role.
        registration_body:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - GPhC
          - other
          - ''
          description: Clinician registration body.
        registration_number:
          type: string
          description: Clinician registration number.
        united_kingdom_nhs_number:
          type: string
          maxLength: 12
          description: United Kingdom NHS number, unique per person.
      required:
      - created_at
      - updated_at
      - name
      - role
      - registration_body
      - registration_number
      description: Clinician
    Grade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        assessment_id:
          type: string
          format: uuid
          description: FK to assessment (UNIQUE = 1:1 relationship).
        abnormality_level:
          type: string
          enum:
          - draft
          - normal
          - mildAbnormality
          - moderateAbnormality
          - severeAbnormality
          - critical
          description: 'Computed abnormality level: draft (insufficient data), normal (0%), mildAbnormality
            (1-20%), moderateAbnormality (21-50%), severeAbnormality (51-75%), critical (76-100%).'
        abnormality_score:
          type: number
          format: double
          description: Composite abnormality score as percentage (0.0-100.0).
        abnormality_level_override:
          type: string
          enum:
          - normal
          - mildAbnormality
          - moderateAbnormality
          - severeAbnormality
          - critical
          description: Clinician-assigned abnormality level override. NULL means no override.
        override_reason:
          type: string
          description: Free-text justification for overriding the computed level. Required when override
            is set.
        graded_at:
          type: string
          format: date-time
          description: Timestamp when the grading engine produced this result.
      required:
      - created_at
      - updated_at
      - assessment_id
      - abnormality_level
      - abnormality_score
      - override_reason
      - graded_at
      description: 1:1 with assessment. Stores computed hematology abnormality level, score, and optional
        clinician override.
    GradingAdditionalFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        grade_id:
          type: string
          format: uuid
          description: FK to grade. One result may have many flags.
        flag_id:
          type: string
          description: Application-side flag identifier (e.g. FLAG-CBC-001, FLAG-COAG-001).
        category:
          type: string
          description: Flag category (e.g. Blood Count, Coagulation, Iron Studies, Blood Film, Hemoglobinopathy,
            Transfusion, Clinical).
        message:
          type: string
          description: Human-readable alert message for the clinician.
        priority:
          type: string
          enum:
          - high
          - medium
          - low
          description: 'Alert priority: high, medium, or low.'
      required:
      - created_at
      - updated_at
      - grade_id
      - flag_id
      - category
      - message
      - priority
      description: Many-to-one with grade. Safety-critical alerts detected by the flagged issues engine.
    GradingFiredRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        grade_id:
          type: string
          format: uuid
          description: FK to grade. One result may have many fired rules.
        rule_code:
          type: string
          description: FK to hem_rule catalogue. SET NULL on delete so audit rows survive rule removal.
        rule_category:
          type: string
          description: Clinical category at grading time (denormalized from hem_rule).
        rule_description:
          type: string
          description: Rule description at grading time (denormalized from hem_rule).
        rule_concern_level:
          type: string
          enum:
          - high
          - medium
          - low
          description: 'Concern level at grading time: high, medium, or low (denormalized from hem_rule).'
      required:
      - created_at
      - updated_at
      - grade_id
      - rule_category
      - rule_description
      - rule_concern_level
      description: Many-to-one with grade. Each row is one hematology rule that fired. Denormalized for
        audit.
    HemRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        code:
          type: string
          description: Human-readable rule code (e.g. DM-001). UNIQUE stable identifier used by application
            code and audit records.
        category:
          type: string
          description: Clinical category (e.g. Blood Count, Coagulation, Iron Studies).
        description:
          type: string
          description: Human-readable description of the rule condition.
        concern_level:
          type: string
          enum:
          - high
          - medium
          - low
          description: 'Concern level: high, medium, or low.'
      required:
      - created_at
      - updated_at
      - code
      - category
      - description
      - concern_level
      description: Catalogue of 20 hematology rules evaluated during grading.
    Patient:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-deleted.
        name:
          type: string
          maxLength: 255
          description: Name.
        birth_date:
          type: string
          format: date
          description: Birth date.
        email:
          type: string
          description: Email address.
        phone:
          type: string
          description: Phone number.
        postal_address_as_full_text:
          type: string
          description: Postal address as full text.
        country_as_iso_3166_1_alpha_2:
          type: string
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type: string
          description: Postal code, such as for validating the postal address.
        united_kingdom_nhs_number:
          type: string
          maxLength: 20
          description: United Kingdom NHS number, unique per person.
        waist_as_cm:
          type: number
          format: double
          description: Waist circumference measurement in cm, such as for calculating waist-height ratio
            (WHR).
        height_as_cm:
          type: number
          format: double
          description: Height measurement in cm, such as for calculating waist-height ratio (WHR).
        weight_as_kg:
          type: number
          format: double
          description: Weight as kg.
        body_mass_index:
          type: number
          format: double
          description: Body mass index (BMI) measurement.
        waist_height_ratio:
          type: number
          format: double
          description: Waist-height ratio (WHR) measurement.
        vo2_max:
          type: number
          format: double
          description: VO2 max measurement.
      required:
      - created_at
      - updated_at
      - name
      - birth_date
      description: Patient
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          description: A URI identifying the problem type
        title:
          type: string
          description: A short summary of the problem type
        status:
          type: integer
          description: The HTTP status code
        detail:
          type: string
          description: An explanation of this occurrence
        instance:
          type: string
          description: A URI identifying this occurrence
        code:
          type: string
          description: A short machine-readable reason
        errors:
          type: object
          description: Per-field detail, when validation failed
      required:
      - type
      - title
      - status
