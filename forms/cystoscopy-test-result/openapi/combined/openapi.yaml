components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Name.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as full text.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code, such as for validating the postal address.
        role:
          type: string
          enum:
          - urologist
          - nurse-cystoscopist
          - other
          - ''
          description: 'Operating clinician role: urologist, nurse-cystoscopist, other.'
        registrationBody:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - other
          - ''
          description: 'Clinician registration body: GMC, NMC, HCPC, other.'
        registrationNumber:
          type: string
          description: Clinician registration number.
        unitedKingdomNhsNumber:
          type:
          - string
          - 'null'
          maxLength: 12
          description: United Kingdom NHS number, unique per person.
      required:
      - createdAt
      - updatedAt
      - name
      - role
      - registrationBody
      - registrationNumber
      description: Operating / reporting clinician (cystoscopy operator) who performs the examination
        and authors and signs the cystoscopy result report.
    CystoscopyTestResult:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the patient.
        clinicianId:
          type: string
          format: uuid
          description: Foreign key to the operating / reporting clinician (cystoscopy operator).
        originatingRequestReference:
          type: string
          maxLength: 255
          description: Free-text reference linking this report back to the originating cystoscopy request
            (referral).
        reportStatus:
          type: string
          enum:
          - preliminary
          - final
          - amended
          - cancelled
          - ''
          description: 'Report lifecycle status: preliminary, final, amended, cancelled.'
        performedDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the cystoscopy was performed.
        reportedDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the report was authored / signed.
        procedure:
          type: string
          enum:
          - flexible-cystoscopy
          - rigid-cystoscopy
          - other
          - ''
          description: 'Performed procedure: flexible-cystoscopy, rigid-cystoscopy, other.'
        anaesthesia:
          type: string
          enum:
          - local
          - sedation
          - general
          - ''
          description: 'Anaesthesia used: local, sedation, general.'
        clinicalHistory:
          type: string
          maxLength: 1000
          description: Clinical history and the question the examination was performed to answer.
        bladderTumour:
          type: boolean
          description: Whether a bladder tumour or suspicious lesion was seen.
        inflammationCystitis:
          type: boolean
          description: Whether inflammation / cystitis was seen.
        bladderStones:
          type: boolean
          description: Whether bladder stones (calculi) were seen.
        urethralStricture:
          type: boolean
          description: Whether a urethral stricture was seen.
        trabeculation:
          type: boolean
          description: Whether bladder-wall trabeculation was seen.
        prostaticEnlargement:
          type: boolean
          description: Whether prostatic enlargement / obstruction was seen.
        normalExamination:
          type: boolean
          description: Whether the examination was entirely normal with no abnormality seen.
        tumourSizeMm:
          type:
          - number
          - 'null'
          format: double
          description: Largest tumour / lesion size in millimetres, for categorisation and surveillance.
        tumourAppearance:
          type: string
          enum:
          - papillary
          - solid
          - flat
          - not-applicable
          - ''
          description: 'Tumour appearance: papillary, solid, flat, not-applicable.'
        biopsyTaken:
          type: boolean
          description: Whether a biopsy / sample was taken at the time of the procedure.
        complication:
          type: string
          enum:
          - none
          - bleeding
          - perforation
          - uti
          - other
          - ''
          description: 'Procedure complication: none, bleeding, perforation, uti, other.'
        findingsNarrative:
          type: string
          maxLength: 2000
          description: Narrative description of the endoscopic findings (the body of the report).
        impression:
          type: string
          maxLength: 2000
          description: Summary impression / conclusion answering the clinical question.
        reportingCategory:
          type: string
          maxLength: 50
          description: Free-text structured-reporting category label (e.g. an EAU NMIBC risk group or
            a suspected-tumour category).
        recommendedFollowUp:
          type: string
          maxLength: 1000
          description: 'Recommended follow-up: surveillance cystoscopy interval, referral, or further
            management.'
        criticalResultCommunicated:
          type: boolean
          description: Whether a critical or unexpected significant result (e.g. suspected bladder tumour)
            was communicated directly to the referrer / patient.
        reportedTo:
          type: string
          maxLength: 500
          description: Who the critical / urgent result was communicated to, with date and time if applicable.
      required:
      - createdAt
      - updatedAt
      - patientId
      - clinicianId
      - originatingRequestReference
      - reportStatus
      - procedure
      - anaesthesia
      - clinicalHistory
      - bladderTumour
      - inflammationCystitis
      - bladderStones
      - urethralStricture
      - trabeculation
      - prostaticEnlargement
      - normalExamination
      - tumourAppearance
      - biopsyTaken
      - complication
      - findingsNarrative
      - impression
      - reportingCategory
      - recommendedFollowUp
      - criticalResultCommunicated
      - reportedTo
      description: Cystoscopy (bladder endoscopy) result (report). Captures the performed procedure and
        anaesthesia, the clinical history, the narrative and structured endoscopic findings, tumour /
        lesion detail, any complication, the impression, recommended follow-up, and critical-result communication.
        This is the source-of-truth record that the four-axis interpretation grade is computed from.
    CystoscopyTestResultGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        cystoscopyTestResultId:
          type: string
          format: uuid
          description: Foreign key to the parent result (unique, 1:1).
        resultClassification:
          type: string
          enum:
          - normal
          - abnormal
          - critical
          - inconclusive
          - ''
          description: 'Axis A overall classification: normal, abnormal, critical, inconclusive.'
        abnormalitySeverity:
          type: string
          enum:
          - none
          - minor
          - moderate
          - major
          - ''
          description: 'Axis B abnormality severity: none, minor, moderate, major.'
        reportingCategory:
          type: string
          maxLength: 50
          description: Axis B structured-reporting score / category label (e.g. an EAU NMIBC risk group
            or a suspected-tumour category).
        reportCompletenessPercent:
          type:
          - integer
          - 'null'
          format: int32
          description: Axis C report completeness as a percentage of mandatory report sections (0-100).
        followUpUrgency:
          type: string
          enum:
          - routine
          - recommended
          - urgent
          - critical-alert
          - ''
          description: 'Axis D follow-up urgency: routine, recommended, urgent, critical-alert.'
        targetTimeframe:
          type: string
          maxLength: 50
          description: Target timeframe for the recommended follow-up implied by the urgency.
        recommendedAction:
          type: string
          maxLength: 500
          description: Axis D concise recommended action derived from the urgency.
        recommendation:
          type: string
          enum:
          - no-action
          - routine-follow-up
          - further-imaging
          - specialist-referral
          - urgent-review
          - ''
          description: 'Overall recommendation: no-action, routine-follow-up, further-imaging, specialist-referral,
            urgent-review.'
        clinicianNotes:
          type: string
          description: Free-text interpretation / sign-off notes.
        signedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Timestamp of the reporting clinician electronic signature.
        gradedAt:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the result.
      required:
      - createdAt
      - updatedAt
      - cystoscopyTestResultId
      - resultClassification
      - abnormalitySeverity
      - reportingCategory
      - followUpUrgency
      - targetTimeframe
      - recommendedAction
      - recommendation
      - clinicianNotes
      - gradedAt
      description: 'Computed four-axis interpretation grade: result classification, abnormality severity
        / structured-reporting category, report completeness, and follow-up urgency. A bladder tumour
        or suspicious lesion auto-escalates the follow-up urgency to critical-alert regardless of the
        other axes.'
    CystoscopyTestResultGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        cystoscopyTestResultGradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        flagId:
          type: string
          maxLength: 50
          description: Stable flag identifier (e.g. F-CRITICAL-RESULT-001).
        category:
          type: string
          enum:
          - critical-result-alert
          - incidental-finding
          - discrepancy-with-request
          - abnormal-requiring-action
          - urgent-referral
          - inadequate-technique
          - unexpected-finding
          - missing-impression
          - missing-measurement
          - other
          - ''
          description: Flag category.
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          - ''
          description: 'Priority: low, medium, high.'
        description:
          type: string
          maxLength: 500
          description: Human-readable description of what fired the flag.
        suggestedAction:
          type: string
          maxLength: 500
          description: Suggested clinical action (e.g. "communicate critical result to referrer and book
            urgent TURBT / MDT").
      required:
      - createdAt
      - updatedAt
      - cystoscopyTestResultGradeId
      - flagId
      - category
      - priority
      - description
      - suggestedAction
      description: Safety-critical flags that fire independently of the four axes, with priority and a
        suggested action for the reporting / referring team.
    CystoscopyTestResultGradeRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
