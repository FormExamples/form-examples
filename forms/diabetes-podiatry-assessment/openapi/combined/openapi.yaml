components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Assessor full name.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as a single text block.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code.
        role:
          type: string
          enum:
          - podiatrist
          - diabetes-specialist-nurse
          - physician
          - orthotist
          - vascular-specialist
          - other
          - ''
          description: 'Assessor role: podiatrist, diabetes-specialist-nurse, physician, orthotist, vascular-specialist,
            or other.'
        registrationBody:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - GPhC
          - other
          - ''
          description: 'Professional registration body: GMC, NMC, HCPC, GPhC, or other.'
        registrationNumber:
          type: string
          description: Professional registration number issued by the registration body.
      required:
      - createdAt
      - updatedAt
      - name
      - role
      - registrationBody
      - registrationNumber
      description: Clinician identifying information for the professional who performed the diabetic foot
        risk assessment.
    DiabetesPodiatryAssessment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the patient this assessment documents (restrict delete).
        clinicianId:
          type:
          - string
          - 'null'
          format: uuid
          description: Foreign key to the assessing clinician (restrict delete); optional.
        assessedAt:
          type:
          - string
          - 'null'
          format: date
          description: Date the assessment was performed; drives the review-overdue comparison.
        assessmentSetting:
          type: string
          enum:
          - annual-review
          - foot-protection-clinic
          - hospital-admission
          - pre-discharge
          - other
          - ''
          description: 'Setting: annual-review, foot-protection-clinic, hospital-admission, pre-discharge,
            or other.'
        diabetesType:
          type: string
          enum:
          - type-1
          - type-2
          - other
          - unknown
          - ''
          description: 'Diabetes type: type-1, type-2, other, or unknown.'
        yearsSinceDiagnosis:
          type:
          - number
          - 'null'
          format: double
          description: Years since diabetes diagnosis.
        onRenalReplacementTherapy:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Whether the patient is on renal replacement therapy (dialysis): yes or no; yes
            is an automatic high-risk factor per NICE NG19.'
        visualAcuityImpairment:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Whether the patient has a visual acuity impairment that limits foot self-inspection:
            yes or no.'
        selfCareAbility:
          type: string
          enum:
          - independent
          - partial
          - unable
          - ''
          description: 'Patient''s ability to self-inspect and self-care for their feet: independent,
            partial, or unable.'
        footwearAppropriate:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Whether current footwear is appropriate for the patient''s risk level: yes or
            no.'
        rightNeuropathyStatus:
          type: string
          enum:
          - sensate
          - insensate
          - not-tested
          - ''
          description: 'Right-foot sensory neuropathy test result (e.g. 10g monofilament): sensate, insensate,
            or not-tested.'
        rightPulsesStatus:
          type: string
          enum:
          - normal
          - diminished
          - absent
          - not-tested
          - ''
          description: 'Right-foot pedal pulses (dorsalis pedis / posterior tibial): normal, diminished,
            absent, or not-tested.'
        rightDeformity:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Right-foot structural deformity present (e.g. claw toes, bunion, prominent metatarsal
            heads): yes or no.'
        rightCallus:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Right-foot callus present: yes or no.'
        rightSkinBreakdown:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Right-foot skin breakdown / fissure present (short of an active ulcer): yes or
            no.'
        rightActiveUlcer:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Right-foot active ulceration present: yes or no.'
        rightUlcerSeverity:
          type: string
          enum:
          - superficial
          - deep
          - infected
          - critical-ischaemia
          - ''
          description: 'Right-foot active ulcer severity when present: superficial, deep, infected, or
            critical-ischaemia.'
        rightPreviousUlcer:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'History of previous right-foot ulceration: yes or no; yes is an automatic high-risk
            factor.'
        rightPreviousAmputation:
          type: string
          enum:
          - none
          - minor
          - major
          - ''
          description: 'History of previous right-foot amputation: none, minor (toe / partial foot), or
            major (below / above knee).'
        rightSuspectedCharcot:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Suspected acute Charcot foot on the right (unexplained hot, red, swollen foot,
            with or without deformity or pain): yes or no; yes requires urgent same-day / next-working-day
            referral.'
        leftNeuropathyStatus:
          type: string
          enum:
          - sensate
          - insensate
          - not-tested
          - ''
          description: 'Left-foot sensory neuropathy test result (e.g. 10g monofilament): sensate, insensate,
            or not-tested.'
        leftPulsesStatus:
          type: string
          enum:
          - normal
          - diminished
          - absent
          - not-tested
          - ''
          description: 'Left-foot pedal pulses (dorsalis pedis / posterior tibial): normal, diminished,
            absent, or not-tested.'
        leftDeformity:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Left-foot structural deformity present (e.g. claw toes, bunion, prominent metatarsal
            heads): yes or no.'
        leftCallus:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Left-foot callus present: yes or no.'
        leftSkinBreakdown:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Left-foot skin breakdown / fissure present (short of an active ulcer): yes or
            no.'
        leftActiveUlcer:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Left-foot active ulceration present: yes or no.'
        leftUlcerSeverity:
          type: string
          enum:
          - superficial
          - deep
          - infected
          - critical-ischaemia
          - ''
          description: 'Left-foot active ulcer severity when present: superficial, deep, infected, or
            critical-ischaemia.'
        leftPreviousUlcer:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'History of previous left-foot ulceration: yes or no; yes is an automatic high-risk
            factor.'
        leftPreviousAmputation:
          type: string
          enum:
          - none
          - minor
          - major
          - ''
          description: 'History of previous left-foot amputation: none, minor (toe / partial foot), or
            major (below / above knee).'
        leftSuspectedCharcot:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Suspected acute Charcot foot on the left (unexplained hot, red, swollen foot,
            with or without deformity or pain): yes or no; yes requires urgent same-day / next-working-day
            referral.'
        clinicalContext:
          type: string
          description: Optional free-text clinical context shown in the summary.
      required:
      - createdAt
      - updatedAt
      - patientId
      - assessmentSetting
      - diabetesType
      - onRenalReplacementTherapy
      - visualAcuityImpairment
      - selfCareAbility
      - footwearAppropriate
      - rightNeuropathyStatus
      - rightPulsesStatus
      - rightDeformity
      - rightCallus
      - rightSkinBreakdown
      - rightActiveUlcer
      - rightUlcerSeverity
      - rightPreviousUlcer
      - rightPreviousAmputation
      - rightSuspectedCharcot
      - leftNeuropathyStatus
      - leftPulsesStatus
      - leftDeformity
      - leftCallus
      - leftSkinBreakdown
      - leftActiveUlcer
      - leftUlcerSeverity
      - leftPreviousUlcer
      - leftPreviousAmputation
      - leftSuspectedCharcot
      - clinicalContext
      description: 'Main diabetes-podiatry-assessment record for one diabetic foot risk-screening episode:
        assessment context, patient-wide risk factors, and the right-foot and left-foot examination blocks.
        The per-foot and overall risk classification, fired rules, and flags live in child tables.'
    DiabetesPodiatryAssessmentGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        diabetesPodiatryAssessmentId:
          type: string
          format: uuid
          description: Foreign key to the parent diabetes-podiatry-assessment record (unique, 1:1).
        rightFootRisk:
          type: string
          enum:
          - low
          - moderate
          - high
          - active-urgent
          - ''
          description: 'Right-foot risk category from its own examination findings: low, moderate, high,
            or active-urgent.'
        leftFootRisk:
          type: string
          enum:
          - low
          - moderate
          - high
          - active-urgent
          - ''
          description: 'Left-foot risk category from its own examination findings: low, moderate, high,
            or active-urgent.'
        overallRisk:
          type: string
          enum:
          - low
          - moderate
          - high
          - active-urgent
          - ''
          description: 'Overall risk category: the worse of the two feet, raised to high by patient-wide
            factors (previous ulcer/amputation, dialysis) or to active-urgent by an active ulcer or suspected
            Charcot foot on either foot.'
        reviewPathway:
          type: string
          enum:
          - urgent-mdt-referral
          - high-risk-review
          - moderate-risk-review
          - annual-review
          - ''
          description: 'Review / referral pathway (most urgent wins): urgent-mdt-referral, high-risk-review,
            moderate-risk-review, or annual-review.'
        referral:
          type: string
          enum:
          - none
          - foot-protection-service
          - multidisciplinary-foot-team
          - urgent-mdt
          - ''
          description: 'Referral destination derived from the pathway: none, foot-protection-service,
            multidisciplinary-foot-team, or urgent-mdt.'
        reviewIntervalMonths:
          type:
          - integer
          - 'null'
          format: int32
          description: Recommended review interval in months (1, 3, 6, or 12); null for the urgent-mdt-referral
            pathway, which has no routine interval.
        status:
          type: string
          enum:
          - complete
          - incomplete
          - ''
          description: 'Completeness status: complete when both feet have a neuropathy and pulses status
            recorded; otherwise incomplete.'
        gradedAt:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the classification.
      required:
      - createdAt
      - updatedAt
      - diabetesPodiatryAssessmentId
      - rightFootRisk
      - leftFootRisk
      - overallRisk
      - reviewPathway
      - referral
      - status
      - gradedAt
      description: 'Computed per-foot and overall diabetic foot risk classification for a diabetes-podiatry-assessment
        record: per-foot risk, overall risk, review pathway, referral, review interval, and completeness
        status.'
