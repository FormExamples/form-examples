          type: string
          description: Postal address as a single text block.
        country_as_iso_3166_1_alpha_2:
          type: string
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2.
        postcode:
          type: string
          description: Postal code.
        role:
          type: string
          enum:
          - podiatrist
          - diabetes-specialist-nurse
          - physician
          - orthotist
          - vascular-specialist
          - other
          - ''
          description: 'Assessor role: podiatrist, diabetes-specialist-nurse, physician, orthotist, vascular-specialist,
            or other.'
        registration_body:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - GPhC
          - other
          - ''
          description: 'Professional registration body: GMC, NMC, HCPC, GPhC, or other.'
        registration_number:
          type: string
          description: Professional registration number issued by the registration body.
      required:
      - created_at
      - updated_at
      - name
      - role
      - registration_body
      - registration_number
      description: Clinician identifying information for the professional who performed the diabetic foot
        risk assessment.
    DiabetesPodiatryAssessment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        patient_id:
          type: string
          format: uuid
          description: Foreign key to the patient this assessment documents (restrict delete).
        clinician_id:
          type: string
          format: uuid
          description: Foreign key to the assessing clinician (restrict delete); optional.
        assessed_at:
          type: string
          format: date
          description: Date the assessment was performed; drives the review-overdue comparison.
        assessment_setting:
          type: string
          enum:
          - annual-review
          - foot-protection-clinic
          - hospital-admission
          - pre-discharge
          - other
          - ''
          description: 'Setting: annual-review, foot-protection-clinic, hospital-admission, pre-discharge,
            or other.'
        diabetes_type:
          type: string
          enum:
          - type-1
          - type-2
          - other
          - unknown
          - ''
          description: 'Diabetes type: type-1, type-2, other, or unknown.'
        years_since_diagnosis:
          type: number
          format: double
          description: Years since diabetes diagnosis.
        on_renal_replacement_therapy:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Whether the patient is on renal replacement therapy (dialysis): yes or no; yes
            is an automatic high-risk factor per NICE NG19.'
        visual_acuity_impairment:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Whether the patient has a visual acuity impairment that limits foot self-inspection:
            yes or no.'
        self_care_ability:
          type: string
          enum:
          - independent
          - partial
          - unable
          - ''
          description: 'Patient''s ability to self-inspect and self-care for their feet: independent,
            partial, or unable.'
        footwear_appropriate:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Whether current footwear is appropriate for the patient''s risk level: yes or
            no.'
        right_neuropathy_status:
          type: string
          enum:
          - sensate
          - insensate
          - not-tested
          - ''
          description: 'Right-foot sensory neuropathy test result (e.g. 10g monofilament): sensate, insensate,
            or not-tested.'
        right_pulses_status:
          type: string
          enum:
          - normal
          - diminished
          - absent
          - not-tested
          - ''
          description: 'Right-foot pedal pulses (dorsalis pedis / posterior tibial): normal, diminished,
            absent, or not-tested.'
        right_deformity:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Right-foot structural deformity present (e.g. claw toes, bunion, prominent metatarsal
            heads): yes or no.'
        right_callus:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Right-foot callus present: yes or no.'
        right_skin_breakdown:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Right-foot skin breakdown / fissure present (short of an active ulcer): yes or
            no.'
        right_active_ulcer:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Right-foot active ulceration present: yes or no.'
        right_ulcer_severity:
          type: string
          enum:
          - superficial
          - deep
          - infected
          - critical-ischaemia
          - ''
          description: 'Right-foot active ulcer severity when present: superficial, deep, infected, or
            critical-ischaemia.'
        right_previous_ulcer:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'History of previous right-foot ulceration: yes or no; yes is an automatic high-risk
            factor.'
        right_previous_amputation:
          type: string
          enum:
          - none
          - minor
          - major
          - ''
          description: 'History of previous right-foot amputation: none, minor (toe / partial foot), or
            major (below / above knee).'
        right_suspected_charcot:
          type: string
