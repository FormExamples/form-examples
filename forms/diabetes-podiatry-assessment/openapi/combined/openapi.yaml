          type: string
          enum:
          - low
          - moderate
          - high
          - active-urgent
          - ''
          description: 'Overall risk category: the worse of the two feet, raised to high by patient-wide
            factors (previous ulcer/amputation, dialysis) or to active-urgent by an active ulcer or suspected
            Charcot foot on either foot.'
