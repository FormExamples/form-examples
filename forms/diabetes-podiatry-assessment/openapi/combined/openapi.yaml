          format: date-time
          description: Timestamp when the row was soft-deleted.
        diabetes_podiatry_assessment_id:
          type: string
          format: uuid
          description: Foreign key to the parent diabetes-podiatry-assessment record (unique, 1:1).
        right_foot_risk:
          type: string
          enum:
          - low
          - moderate
          - high
          - active-urgent
          - ''
          description: 'Right-foot risk category from its own examination findings: low, moderate, high,
