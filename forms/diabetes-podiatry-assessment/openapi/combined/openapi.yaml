          - foot-protection-service
          - multidisciplinary-foot-team
          - urgent-mdt
          - ''
          description: 'Referral destination derived from the pathway: none, foot-protection-service,
            multidisciplinary-foot-team, or urgent-mdt.'
        review_interval_months:
          type: integer
          format: int32
