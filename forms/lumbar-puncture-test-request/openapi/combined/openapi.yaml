components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Name.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as full text.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code, such as for validating the postal address.
        role:
          type: string
          enum:
          - neurologist
          - hospital-doctor
          - gp
          - anaesthetist
          - emergency-physician
          - other
          - ''
          description: 'Clinician role: neurologist, hospital-doctor, gp, anaesthetist, emergency-physician,
            other.'
        registrationBody:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - other
          - ''
          description: 'Clinician registration body: GMC, NMC, HCPC, other.'
        registrationNumber:
          type: string
          description: Clinician registration number.
        unitedKingdomNhsNumber:
          type:
          - string
          - 'null'
          maxLength: 12
          description: United Kingdom NHS number, unique per person.
      required:
      - createdAt
      - updatedAt
      - name
      - role
      - registrationBody
      - registrationNumber
      description: Requesting clinician (referrer) who completes the lumbar puncture request.
    LumbarPunctureTestRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the patient.
        clinicianId:
          type: string
          format: uuid
          description: Foreign key to the requesting clinician (referrer).
        status:
          type: string
          enum:
          - draft
          - submitted
          - vetted
          - scheduled
          - rejected
          - ''
          description: 'Request lifecycle status: draft, submitted, vetted, scheduled, rejected.'
        siteName:
          type: string
          maxLength: 255
          description: Name of the requesting site or clinic.
        setting:
          type: string
          enum:
          - outpatient
          - inpatient
          - community
          - emergency
          - ''
          description: 'Care setting: outpatient, inpatient, community, emergency.'
        referralDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the referral was made.
        requestedByDate:
          type:
          - string
          - 'null'
          format: date
          description: Date by which the procedure is requested to be performed.
        procedureIntent:
          type: string
          enum:
          - diagnostic
          - therapeutic
          - other
          - ''
          description: 'Procedure intent: diagnostic (CSF sampling / manometry), therapeutic (e.g. CSF
            drainage), other.'
        primaryIndication:
          type: string
          enum:
          - suspected-meningitis
          - suspected-subarachnoid-haemorrhage
          - suspected-multiple-sclerosis
          - suspected-guillain-barre
          - idiopathic-intracranial-hypertension
          - suspected-cns-malignancy
          - cns-infection
          - other
          - ''
          description: 'Primary clinical indication, used for appropriateness scoring: suspected-meningitis,
            suspected-subarachnoid-haemorrhage, suspected-multiple-sclerosis, suspected-guillain-barre,
            idiopathic-intracranial-hypertension, suspected-cns-malignancy, cns-infection, other.'
        clinicalQuestion:
          type: string
          maxLength: 1000
          description: Specific clinical question the CSF analysis should answer (highest-value field).
        relevantHistory:
          type: string
          maxLength: 1000
          description: Relevant medical, neurological, and medication history.
        suspectedRaisedIntracranialPressure:
          type: boolean
          description: Whether raised intracranial pressure is clinically suspected (LP may risk cerebral
            herniation; imaging first).
        focalNeurologicalSigns:
          type: boolean
          description: Whether new focal neurological signs are present (risk factor for space-occupying
            lesion; image before LP).
        reducedConsciousness:
          type: boolean
          description: Whether the patient has reduced consciousness (e.g. GCS 9 or less; image and stabilise
            before LP).
        ctHeadStatus:
          type: string
          enum:
          - done-normal
          - done-abnormal
          - not-required
          - awaited
          - ''
          description: 'CT head imaging status prior to LP: done-normal, done-abnormal, not-required,
            awaited.'
        takingAnticoagulant:
          type: boolean
          description: Whether the patient is taking an anticoagulant (bleeding / spinal haematoma risk).
        anticoagulantAgent:
          type: string
          maxLength: 255
          description: Name of the anticoagulant agent (e.g. warfarin, apixaban, rivaroxaban, dabigatran,
            heparin).
        takingAntiplatelet:
          type: boolean
          description: Whether the patient is taking an antiplatelet agent (bleeding risk).
        antiplateletAgent:
          type: string
          maxLength: 255
          description: Name of the antiplatelet agent (e.g. aspirin, clopidogrel, ticagrelor, prasugrel).
        inr:
          type:
          - number
          - 'null'
          format: double
          description: International normalised ratio (INR); LP generally avoided or delayed if INR >
            1.5.
        plateletCount:
          type:
          - number
          - 'null'
          format: double
          description: Platelet count (x10^9/L); LP generally avoided if platelets < 40-50.
        bleedingDisorder:
          type: boolean
          description: Whether the patient has a known bleeding disorder or coagulopathy.
        localSkinInfection:
          type: boolean
          description: Whether there is local skin or soft-tissue infection at the puncture site (contraindication).
        openingPressureRequired:
          type: boolean
          description: Whether manometry (CSF opening pressure measurement) is required, e.g. for idiopathic
            intracranial hypertension.
        urgency:
          type: string
          enum:
          - routine
          - urgent
          - emergency
          - ''
          description: 'Requested triage urgency: routine, urgent, emergency.'
        supervisingConsultant:
          type: string
          maxLength: 255
          description: Name of the supervising / responsible consultant.
        requesterContact:
          type: string
          maxLength: 255
          description: Contact details (bleep / phone) for the requester.
        notes:
          type: string
          maxLength: 1000
          description: Free-text additional notes.
      required:
      - createdAt
      - updatedAt
      - patientId
      - clinicianId
      - status
      - siteName
      - setting
      - procedureIntent
      - primaryIndication
      - clinicalQuestion
      - relevantHistory
      - suspectedRaisedIntracranialPressure
      - focalNeurologicalSigns
      - reducedConsciousness
      - ctHeadStatus
      - takingAnticoagulant
      - anticoagulantAgent
      - takingAntiplatelet
      - antiplateletAgent
      - bleedingDisorder
      - localSkinInfection
      - openingPressureRequired
      - urgency
      - supervisingConsultant
      - requesterContact
      - notes
      description: Lumbar puncture request (referral) for CSF sampling and/or manometry. Captures the
        procedure intent, the clinical indication and question, raised-intracranial-pressure and bleeding
        safety screening, opening-pressure requirement, and triage urgency.
    LumbarPunctureTestRequestGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        lumbarPunctureTestRequestId:
          type: string
          format: uuid
          description: Foreign key to the parent request (unique, 1:1).
        appropriatenessScore:
          type:
          - integer
          - 'null'
          format: int32
          description: Appropriateness score (1-9 ordinal) for the indication match.
        appropriatenessBand:
          type: string
          enum:
          - usually-appropriate
          - may-be-appropriate
          - usually-not-appropriate
          - ''
          description: 'Appropriateness band: usually-appropriate (7-9), may-be-appropriate (4-6), usually-not-appropriate
            (1-3).'
        contraindicationBand:
          type: string
          enum:
          - ok
          - caution
          - contraindicated
          - ''
          description: 'Safety / contraindication band: ok, caution, contraindicated — driven by raised
            ICP needing imaging first, coagulopathy / anticoagulation, thrombocytopenia, and local infection.'
        completenessPercent:
          type:
          - integer
          - 'null'
          format: int32
          description: Request completeness as a percentage of mandatory fields (0-100).
        triageTier:
          type: string
          enum:
          - routine
          - urgent
          - emergency
          - ''
          description: 'Assigned triage tier: routine, urgent, emergency.'
        targetTimeframe:
          type: string
          maxLength: 50
          description: Target timeframe for the procedure implied by the triage tier.
        recommendation:
          type: string
          enum:
          - accept
          - query-referrer
          - redirect
          - reject
          - ''
          description: 'Vetting recommendation: accept, query-referrer, redirect, reject.'
        clinicianNotes:
          type: string
          description: Free-text vetting notes.
        signedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Timestamp of vetting clinician electronic signature.
        gradedAt:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the result.
      required:
      - createdAt
      - updatedAt
      - lumbarPunctureTestRequestId
      - appropriatenessBand
      - contraindicationBand
      - triageTier
      - targetTimeframe
      - recommendation
      - clinicianNotes
      - gradedAt
      description: 'Computed four-axis grading result: appropriateness (1-9 indication match), safety
        / contraindication band, request completeness, and triage priority.'
    LumbarPunctureTestRequestGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        lumbarPunctureTestRequestGradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        flagId:
          type: string
