components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Name.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as full text.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code, such as for validating the postal address.
        role:
          type: string
          enum:
          - biomedical-scientist
          - microbiologist
          - reporting-clinician
          - gp
          - other
          - ''
          description: 'Reporting clinician role: biomedical-scientist, microbiologist, reporting-clinician,
            gp, other.'
        registrationBody:
          type: string
          enum:
          - GMC
          - HCPC
          - other
          - ''
          description: 'Clinician registration body: GMC, HCPC, other.'
        registrationNumber:
          type: string
          description: Clinician registration number.
        unitedKingdomNhsNumber:
          type:
          - string
          - 'null'
          maxLength: 12
          description: United Kingdom NHS number, unique per person.
      required:
      - createdAt
      - updatedAt
      - name
      - role
      - registrationBody
      - registrationNumber
      description: Reporting clinician (biomedical scientist, microbiologist, reporting clinician, or
        GP) who authors and signs the urinalysis result report.
    Patient:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          maxLength: 255
          description: Name.
        birthDate:
          type: string
          format: date
          description: Birth date.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as full text.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code, such as for validating the postal address.
        unitedKingdomNhsNumber:
          type:
          - string
          - 'null'
          maxLength: 20
          description: United Kingdom NHS number, unique per person.
        waistAsCm:
          type:
          - number
          - 'null'
          format: double
          description: Waist circumference measurement in cm, such as for calculating waist-height ratio
            (WHR).
        heightAsCm:
          type:
          - number
          - 'null'
          format: double
          description: Height measurement in cm, such as for calculating waist-height ratio (WHR).
        weightAsKg:
          type:
          - number
          - 'null'
          format: double
          description: Weight as kg.
        bodyMassIndex:
          type:
          - number
          - 'null'
          format: double
          description: Body mass index (BMI) measurement.
        waistHeightRatio:
          type:
          - number
          - 'null'
          format: double
          description: Waist-height ratio (WHR) measurement.
        vo2Max:
          type:
          - number
          - 'null'
          format: double
          description: VO2 max measurement.
      required:
      - createdAt
      - updatedAt
      - name
      - birthDate
      description: Patient
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          description: A URI identifying the problem type
        title:
          type: string
          description: A short summary of the problem type
        status:
          type: integer
          description: The HTTP status code
        detail:
          type: string
          description: An explanation of this occurrence
        instance:
          type: string
          description: A URI identifying this occurrence
        code:
          type: string
          description: A short machine-readable reason
        errors:
          type: object
          description: Per-field detail, when validation failed
      required:
      - type
      - title
      - status
    UrinalysisTestResult:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the patient.
        clinicianId:
          type: string
          format: uuid
          description: Foreign key to the reporting clinician (biomedical scientist / microbiologist /
            reporting clinician).
        originatingRequestReference:
          type: string
          maxLength: 255
          description: Free-text reference linking this report back to the originating urinalysis request
            (order).
        reportStatus:
          type: string
          enum:
          - preliminary
          - final
          - amended
          - cancelled
          - ''
          description: 'Report lifecycle status: preliminary, final, amended, cancelled.'
        performedDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the urinalysis was performed in the laboratory.
        reportedDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the report was authored / signed.
        specimenType:
          type: string
          enum:
          - midstream
          - catheter
          - clean-catch
          - 24h
          - random
          - ''
          description: 'Specimen type: midstream, catheter, clean-catch, 24h (24-hour collection), random.'
        specimenCondition:
          type: string
          enum:
          - satisfactory
          - contaminated
          - insufficient
          - delayed
          - ''
          description: 'Specimen condition on receipt / analysis: satisfactory, contaminated, insufficient,
            delayed.'
        clinicalHistory:
          type: string
          maxLength: 1000
          description: Clinical history and the question the investigation was performed to answer.
        leucocytes:
          type: string
          enum:
          - negative
          - trace
          - plus-one
          - plus-two
          - plus-three
          - ''
          description: 'Dipstick leucocyte esterase: negative, trace, plus-one (1+), plus-two (2+), plus-three
            (3+).'
        nitrites:
          type: string
          enum:
          - negative
          - positive
          - ''
          description: 'Dipstick nitrite: negative or positive (suggests Gram-negative bacteriuria).'
        protein:
          type: string
          enum:
          - negative
          - trace
          - plus-one
          - plus-two
          - plus-three
          - ''
          description: 'Dipstick protein: negative, trace, plus-one (1+), plus-two (2+), plus-three (3+).'
        blood:
          type: string
          enum:
          - negative
          - trace
          - plus-one
          - plus-two
          - plus-three
          - ''
          description: 'Dipstick blood (haemoglobin): negative, trace, plus-one (1+), plus-two (2+), plus-three
            (3+).'
        glucose:
          type: string
          enum:
          - negative
          - trace
          - plus-one
          - plus-two
          - plus-three
          - ''
          description: 'Dipstick glucose: negative, trace, plus-one (1+), plus-two (2+), plus-three (3+).'
        ketones:
          type: string
          enum:
          - negative
          - trace
          - plus-one
          - plus-two
          - plus-three
          - ''
          description: 'Dipstick ketones: negative, trace, plus-one (1+), plus-two (2+), plus-three (3+).'
        bilirubin:
          type: string
          enum:
          - negative
          - trace
          - plus-one
          - plus-two
          - plus-three
          - ''
          description: 'Dipstick bilirubin: negative, trace, plus-one (1+), plus-two (2+), plus-three
            (3+).'
        ph:
          type:
          - number
          - 'null'
          format: double
          description: Dipstick / measured urine pH (approximately 4.0-9.0).
        specificGravity:
          type:
          - number
          - 'null'
          format: double
          description: Urine specific gravity (approximately 1.000-1.060).
        redCellCount:
          type: string
          maxLength: 50
          description: Microscopy red blood cell count / range as reported text (e.g. "<10 x10^6/L", ">50/hpf").
        whiteCellCount:
          type: string
          maxLength: 50
          description: Microscopy white blood cell count / range as reported text (pyuria when raised).
        epithelialCells:
          type: string
          maxLength: 50
          description: Microscopy epithelial cell count / grade as reported text (raised suggests contamination).
        casts:
          type: string
          maxLength: 255
          description: Microscopy casts described as reported text (e.g. hyaline, granular, red-cell casts).
        organismsSeen:
          type: boolean
          description: Whether organisms (bacteria) were seen on microscopy.
        crystals:
          type: string
          maxLength: 255
          description: Microscopy crystals described as reported text (e.g. calcium oxalate, urate).
        cultureResult:
          type: string
          enum:
          - no-growth
          - mixed-growth-likely-contaminant
          - significant-growth
          - ''
          description: 'Culture outcome: no-growth, mixed-growth-likely-contaminant, significant-growth.'
        organismIsolated:
          type: string
          maxLength: 255
          description: Organism(s) isolated on significant growth, as reported text (e.g. "Escherichia
            coli").
        colonyCountCfuMl:
          type: string
          maxLength: 50
          description: Colony count as reported text (e.g. ">10^5 cfu/mL"), supporting the significance
            interpretation.
        antibioticSensitivities:
          type: string
          maxLength: 1000
          description: Antibiotic susceptibility results as reported text (e.g. "Trimethoprim R, Nitrofurantoin
            S").
        overallResultStatus:
          type: string
          enum:
          - normal
          - abnormal
          - critical
          - ''
          description: 'Overall result status: normal, abnormal, critical.'
        findingsNarrative:
          type: string
          maxLength: 2000
          description: Narrative description of the urinalysis findings (the body of the report).
        impression:
          type: string
          maxLength: 2000
          description: Summary impression / conclusion answering the clinical question.
        reportingCategory:
          type: string
          maxLength: 50
          description: Free-text structured-reporting category label (e.g. "significant E. coli bacteriuria",
            "asymptomatic bacteriuria in pregnancy").
        recommendedFollowUp:
          type: string
          maxLength: 1000
          description: Recommended follow-up testing, referral, or management.
        criticalResultCommunicated:
          type: boolean
          description: Whether a critical or unexpected significant result was communicated directly to
            the requester.
        reportedTo:
          type: string
          maxLength: 500
          description: Who the critical / urgent result was communicated to, with date and time if applicable.
      required:
