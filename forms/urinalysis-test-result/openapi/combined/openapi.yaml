          type: string
          enum:
          - none
          - minor
          - moderate
          - major
          - ''
          description: 'Axis B abnormality severity: none, minor, moderate, major.'
        reportingCategory:
          type: string
          maxLength: 50
          description: Axis B structured-reporting category label (e.g. "significant E. coli bacteriuria",
            "asymptomatic bacteriuria in pregnancy").
        reportCompletenessPercent:
          type:
          - integer
          - 'null'
          format: int32
          description: Axis C report completeness as a percentage of mandatory report sections (0-100).
        followUpUrgency:
          type: string
          enum:
