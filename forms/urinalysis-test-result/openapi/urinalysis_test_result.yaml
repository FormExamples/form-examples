          description: Free-text reference linking this report back to the originating urinalysis request (order).
        report_status:
          type: string
          enum:
            - preliminary
            - final
            - amended
            - cancelled
            - ""
          description: "Report lifecycle status: preliminary, final, amended, cancelled."
        performed_date:
          type: string
          format: date
          description: Date the urinalysis was performed in the laboratory.
        reported_date:
          type: string
          format: date
          description: Date the report was authored / signed.
        specimen_type:
          type: string
          enum:
            - midstream
            - catheter
            - clean-catch
            - 24h
            - random
            - ""
          description: "Specimen type: midstream, catheter, clean-catch, 24h (24-hour collection), random."
        specimen_condition:
          type: string
          enum:
            - satisfactory
            - contaminated
            - insufficient
            - delayed
            - ""
          description: "Specimen condition on receipt / analysis: satisfactory, contaminated, insufficient, delayed."
        clinical_history:
          type: string
          maxLength: 1000
          description: Clinical history and the question the investigation was performed to answer.
        leucocytes:
          type: string
          enum:
            - negative
            - trace
            - plus-one
            - plus-two
            - plus-three
            - ""
          description: "Dipstick leucocyte esterase: negative, trace, plus-one (1+), plus-two (2+), plus-three (3+)."
        nitrites:
          type: string
          enum:
            - negative
            - positive
            - ""
          description: "Dipstick nitrite: negative or positive (suggests Gram-negative bacteriuria)."
        protein:
          type: string
          enum:
            - negative
            - trace
            - plus-one
            - plus-two
            - plus-three
            - ""
          description: "Dipstick protein: negative, trace, plus-one (1+), plus-two (2+), plus-three (3+)."
        blood:
          type: string
          enum:
            - negative
            - trace
            - plus-one
            - plus-two
            - plus-three
            - ""
          description: "Dipstick blood (haemoglobin): negative, trace, plus-one (1+), plus-two (2+), plus-three (3+)."
        glucose:
          type: string
          enum:
            - negative
            - trace
            - plus-one
            - plus-two
            - plus-three
            - ""
          description: "Dipstick glucose: negative, trace, plus-one (1+), plus-two (2+), plus-three (3+)."
        ketones:
          type: string
          enum:
            - negative
            - trace
            - plus-one
            - plus-two
            - plus-three
            - ""
          description: "Dipstick ketones: negative, trace, plus-one (1+), plus-two (2+), plus-three (3+)."
        bilirubin:
          type: string
          enum:
            - negative
            - trace
            - plus-one
            - plus-two
            - plus-three
            - ""
          description: "Dipstick bilirubin: negative, trace, plus-one (1+), plus-two (2+), plus-three (3+)."
        ph:
          type: number
          format: double
          description: Dipstick / measured urine pH (approximately 4.0-9.0).
        specific_gravity:
          type: number
          format: double
          description: Urine specific gravity (approximately 1.000-1.060).
        red_cell_count:
          type: string
          maxLength: 50
          description: "Microscopy red blood cell count / range as reported text (e.g. \"<10 x10^6/L\", \">50/hpf\")."
        white_cell_count:
          type: string
          maxLength: 50
          description: Microscopy white blood cell count / range as reported text (pyuria when raised).
        epithelial_cells:
          type: string
          maxLength: 50
          description: Microscopy epithelial cell count / grade as reported text (raised suggests contamination).
        casts:
          type: string
          maxLength: 255
          description: Microscopy casts described as reported text (e.g. hyaline, granular, red-cell casts).
        organisms_seen:
          type: boolean
          description: Whether organisms (bacteria) were seen on microscopy.
        crystals:
          type: string
          maxLength: 255
          description: Microscopy crystals described as reported text (e.g. calcium oxalate, urate).
        culture_result:
          type: string
          enum:
            - no-growth
            - mixed-growth-likely-contaminant
            - significant-growth
            - ""
          description: "Culture outcome: no-growth, mixed-growth-likely-contaminant, significant-growth."
        organism_isolated:
          type: string
          maxLength: 255
          description: "Organism(s) isolated on significant growth, as reported text (e.g. \"Escherichia coli\")."
        colony_count_cfu_ml:
          type: string
          maxLength: 50
          description: "Colony count as reported text (e.g. \">10^5 cfu/mL\"), supporting the significance interpretation."
        antibiotic_sensitivities:
          type: string
          maxLength: 1000
          description: "Antibiotic susceptibility results as reported text (e.g. \"Trimethoprim R, Nitrofurantoin S\")."
        overall_result_status:
          type: string
          enum:
            - normal
            - abnormal
            - critical
            - ""
          description: "Overall result status: normal, abnormal, critical."
        findings_narrative:
          type: string
          maxLength: 2000
          description: Narrative description of the urinalysis findings (the body of the report).
        impression:
          type: string
          maxLength: 2000
          description: Summary impression / conclusion answering the clinical question.
        reporting_category:
          type: string
          maxLength: 50
          description: "Free-text structured-reporting category label (e.g. \"significant E. coli bacteriuria\", \"asymptomatic bacteriuria in pregnancy\")."
        recommended_follow_up:
          type: string
          maxLength: 1000
          description: Recommended follow-up testing, referral, or management.
        critical_result_communicated:
          type: boolean
          description: Whether a critical or unexpected significant result was communicated directly to the requester.
        reported_to:
          type: string
          maxLength: 500
          description: Who the critical / urgent result was communicated to, with date and time if applicable.
