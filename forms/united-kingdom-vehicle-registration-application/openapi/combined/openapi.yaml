components:
  schemas:
    Applicant:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          maxLength: 255
          description: Full name of the applicant as it appears on their identity document.
        birthDate:
          type: string
          format: date
          description: Date of birth of the applicant.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as a single text block.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code.
        drivingLicenceNumber:
          type: string
          maxLength: 20
          description: Great Britain driving licence number (16 characters) when the applicant holds a
            photocard licence, else empty.
        identityDocumentType:
          type: string
          enum:
          - photocard-driving-licence
          - passport
          - other-name-document
          - none
          - ''
          description: 'Identity document supplied: photocard-driving-licence, passport, other-name-document,
            or none.'
        addressDocumentType:
          type: string
          enum:
          - photocard-driving-licence
          - utility-bill
          - bank-statement
          - council-tax-bill
          - none
          - ''
          description: 'Proof-of-address document supplied: photocard-driving-licence, utility-bill, bank-statement,
            council-tax-bill, or none.'
      required:
      - createdAt
      - updatedAt
      - name
      - birthDate
      - drivingLicenceNumber
      - identityDocumentType
      - addressDocumentType
      description: 'Applicant (person making the application to the DVLA) for a vehicle registration application:
        name, date of birth, address, and identity documents supplied.'
    Keeper:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Registered keeper full name, or the organization name for a company keeper.
        keeperType:
          type: string
          enum:
          - individual
          - company
          - organization
          - trade
          - other
          - ''
          description: 'Kind of keeper: individual, company, organization, trade, or other.'
        companyRegistrationNumber:
          type: string
          maxLength: 20
          description: Companies House registration number for a company keeper, else empty.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as a single text block.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code.
      required:
      - createdAt
      - updatedAt
      - name
      - keeperType
      - companyRegistrationNumber
      description: 'Registered keeper of the vehicle: the person or organization responsible for registering
        and taxing it, who may differ from the applicant and the owner.'
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          description: A URI identifying the problem type
        title:
          type: string
          description: A short summary of the problem type
        status:
          type: integer
          description: The HTTP status code
        detail:
          type: string
          description: An explanation of this occurrence
        instance:
          type: string
          description: A URI identifying this occurrence
        code:
          type: string
          description: A short machine-readable reason
        errors:
          type: object
          description: Per-field detail, when validation failed
      required:
      - type
      - title
      - status
    UnitedKingdomVehicleRegistrationApplication:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        applicantId:
          type: string
          format: uuid
          description: Foreign key to the applicant.
        keeperId:
          type:
          - string
          - 'null'
          format: uuid
          description: Foreign key to the registered keeper when different from the applicant.
        applicationType:
          type: string
          enum:
          - v62-replacement-v5c
          - v62-acquired-without-v5c
          - v55-4-new-vehicle
          - v55-5-used-vehicle
          - imported-vehicle
          - v627-1-rebuilt-or-kit
          - ''
          description: 'Application variant: v62-replacement-v5c, v62-acquired-without-v5c, v55-4-new-vehicle,
            v55-5-used-vehicle, imported-vehicle, or v627-1-rebuilt-or-kit.'
        applicationDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the application was completed.
        v5cStatus:
          type: string
          enum:
          - lost
          - stolen
          - destroyed
          - not-received
          - damaged
          - never-had
          - has-v5c
          - ''
          description: 'Why a V5C is needed: lost, stolen, destroyed, not-received, damaged, never-had
            (acquired without one), or has-v5c.'
        weeksSinceChangeOfKeeper:
          type:
          - integer
          - 'null'
          format: int32
          description: Whole weeks since the keeper change, used for the 6-week not-received replacement
            window.
        newKeeperSlipProvided:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the green new-keeper slip from the most recent V5C is enclosed (yes/no);
            it waives the V62 fee.
        ownerDiffersFromKeeper:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the legal owner differs from the registered keeper (yes/no).
        ownerName:
          type: string
          description: Name of the owner when the owner differs from the keeper.
        keeperAddressInNorthernIreland:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the keeper address is in Northern Ireland (yes/no); insurance and a 4-year
            MOT threshold apply.
        registrationNumber:
          type: string
          maxLength: 12
          description: Vehicle registration mark (number plate), blank for a first registration where
            the DVLA assigns one.
        vehicleIdentificationNumber:
          type: string
          maxLength: 30
          description: Vehicle identification number (VIN, chassis number).
        engineNumber:
          type: string
          maxLength: 30
          description: Engine number as stamped on the engine.
        make:
          type: string
          description: Vehicle make (manufacturer).
        model:
          type: string
          description: Vehicle model.
        colour:
          type: string
          description: Vehicle colour.
        vehicleCategory:
          type: string
          enum:
          - car
          - motorcycle
          - light-goods
          - heavy-goods
          - bus
          - other
          - ''
          description: 'Vehicle category: car, motorcycle, light-goods, heavy-goods, bus, or other.'
        fuelType:
          type: string
          enum:
          - petrol
          - diesel
          - electric
          - hybrid
          - lpg
          - other
          - ''
          description: 'Fuel type: petrol, diesel, electric, hybrid, lpg, or other.'
        engineCapacityAsCc:
          type:
          - integer
          - 'null'
          format: int32
          description: Engine capacity in cubic centimetres, null for electric vehicles.
        dateOfManufacture:
          type:
          - string
          - 'null'
          format: date
          description: Date the vehicle was manufactured.
        dateFirstUsed:
          type:
          - string
          - 'null'
          format: date
          description: Date the vehicle was first used, anywhere.
        seriouslyDamaged:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the vehicle is seriously damaged and cannot be repaired (yes/no); such
            a vehicle cannot be registered.
        certificateOfNewnessProvided:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether a certificate of newness (or declaration for imports) is enclosed (yes/no).
        typeApproval:
          type: string
          enum:
          - ecwvta
          - gb-type-approval
          - ni-type-approval
          - iva
          - msva
          - exempt-over-10-years
          - none
          - ''
          description: 'Type approval evidence: ecwvta, gb-type-approval, ni-type-approval, iva, msva,
            exempt-over-10-years, or none.'
        motStatus:
          type: string
          enum:
          - valid
          - not-required
          - missing
          - ''
          description: 'MOT evidence: valid, not-required, or missing.'
        insuranceStatus:
          type: string
          enum:
          - in-force
          - none
          - ''
          description: 'Insurance evidence: in-force or none.'
        countryOfExport:
          type: string
          description: Country the vehicle was imported from.
        importDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the vehicle arrived in Great Britain.
        novaStatus:
          type: string
          enum:
          - notified
          - not-notified
          - not-applicable
          - ''
          description: 'HMRC Notification of Vehicle Arrivals (NOVA) status: notified, not-notified, or
            not-applicable.'
        novaReference:
          type: string
          maxLength: 40
          description: NOVA reference given by HMRC.
        buildEvidenceProvided:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether receipts and build evidence for a rebuilt or kit vehicle are enclosed (yes/no).
        donorVehicleCount:
          type:
          - integer
          - 'null'
          format: int32
          description: Number of donor vehicles whose parts were used, for a rebuilt vehicle.
        feePaymentMethod:
          type: string
          enum:
          - cheque
          - postal-order
          - post-office-card
          - online-card
          - none
          - ''
          description: 'Payment method for the fee: cheque, postal-order, post-office-card, online-card,
            or none.'
        feePaidAsPence:
          type:
          - integer
          - 'null'
          format: int32
          description: Fee enclosed or paid, in pence.
        declarationSigned:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the applicant signed the declaration (yes/no).
        declarationDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the declaration was signed.
        applicantNote:
          type: string
          description: Free-text note from the applicant.
      required:
      - createdAt
      - updatedAt
      - applicantId
      - applicationType
      - v5cStatus
      - newKeeperSlipProvided
      - ownerDiffersFromKeeper
      - ownerName
      - keeperAddressInNorthernIreland
      - registrationNumber
      - vehicleIdentificationNumber
      - engineNumber
      - make
      - model
      - colour
      - vehicleCategory
      - fuelType
      - seriouslyDamaged
      - certificateOfNewnessProvided
      - typeApproval
      - motStatus
      - insuranceStatus
      - countryOfExport
      - novaStatus
      - novaReference
      - buildEvidenceProvided
      - feePaymentMethod
      - declarationSigned
      - applicantNote
      description: 'Main vehicle registration application record: V62 replacement V5C, V55/4 or V55/5
        first registration, imported vehicle, or V627/1 rebuilt or kit vehicle, with keeper, vehicle identity,
        supporting evidence, fee, and declaration.'
    UnitedKingdomVehicleRegistrationApplicationGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        unitedKingdomVehicleRegistrationApplicationId:
          type: string
          format: uuid
          description: Foreign key to the parent application (unique, 1:1).
        validityClass:
          type: string
          enum:
          - ready-to-submit
          - incomplete
          - needs-supporting-documents
          - ''
          description: 'Validity classification: ready-to-submit, incomplete, or needs-supporting-documents
            (incomplete takes precedence).'
        feeDueAsPence:
          type:
          - integer
          - 'null'
          format: int32
          description: Fee the DVLA requires for this application, in pence.
        missingItemCount:
          type: integer
          format: int32
          description: Number of missing data items and documents found.
        gradedAt:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the classification.
      required:
      - createdAt
      - updatedAt
      - unitedKingdomVehicleRegistrationApplicationId
      - validityClass
      - missingItemCount
      - gradedAt
      description: Computed completeness and validity classification for a vehicle registration application
        (ready-to-submit, incomplete, needs-supporting-documents), the fee due, and the count of missing
        items.
    UnitedKingdomVehicleRegistrationApplicationGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        unitedKingdomVehicleRegistrationApplicationGradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        flagId:
          type: string
          maxLength: 50
          description: Stable flag identifier (e.g. F-NOVA-MISSING-001).
        category:
          type: string
          enum:
          - identity-evidence-missing
          - entitlement-missing
          - mot-missing
          - type-approval-missing
          - insurance-missing
          - fee-incorrect
          - keeper-owner-mismatch
          - v5c-lost-stolen-destroyed
          - nova-missing
          - vin-invalid
          - registration-number-invalid
          - seriously-damaged
          - declaration-unsigned
          - other
          - ''
          description: 'Flag category: identity-evidence-missing, entitlement-missing, mot-missing, type-approval-missing,
            insurance-missing, fee-incorrect, keeper-owner-mismatch, v5c-lost-stolen-destroyed, nova-missing,
            vin-invalid, registration-number-invalid, seriously-damaged, declaration-unsigned, or other.'
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          - ''
          description: 'Priority: low, medium, high.'
        description:
          type: string
          maxLength: 500
          description: Human-readable description of what fired the flag.
        suggestedAction:
          type: string
          maxLength: 500
          description: Suggested action for the applicant before posting the application to the DVLA.
