components:
  schemas:
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Name.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as full text.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code, such as for validating the postal address.
        role:
          type: string
          enum:
          - gastroenterologist
          - colorectal-surgeon
          - gp
          - nurse-endoscopist
          - other
          - ''
          description: 'Clinician role: gastroenterologist, colorectal-surgeon, gp, nurse-endoscopist,
            other.'
        registrationBody:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - other
          - ''
          description: 'Clinician registration body: GMC, NMC, HCPC, other.'
        registrationNumber:
          type: string
          description: Clinician registration number.
        unitedKingdomNhsNumber:
          type:
          - string
          - 'null'
          maxLength: 12
          description: United Kingdom NHS number, unique per person.
      required:
      - createdAt
      - updatedAt
      - name
      - role
      - registrationBody
      - registrationNumber
      description: Requesting clinician (referrer) who completes the colonoscopy request.
    ColonoscopyTestRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the patient.
        clinicianId:
          type: string
          format: uuid
          description: Foreign key to the requesting clinician (referrer).
        status:
          type: string
          enum:
          - draft
          - submitted
          - vetted
          - scheduled
          - rejected
          - ''
          description: 'Request lifecycle status: draft, submitted, vetted, scheduled, rejected.'
        siteName:
          type: string
          maxLength: 255
          description: Name of the requesting site or clinic.
        setting:
          type: string
          enum:
          - outpatient
          - inpatient
          - community
          - emergency
          - ''
          description: 'Care setting: outpatient, inpatient, community, emergency.'
        referralDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the referral was made.
        requestedByDate:
          type:
          - string
          - 'null'
          format: date
          description: Date by which the procedure is requested to be performed.
        procedure:
          type: string
          enum:
          - colonoscopy
          - flexible-sigmoidoscopy
          - ct-colonography
          - other
          - ''
          description: 'Requested procedure: colonoscopy, flexible-sigmoidoscopy, ct-colonography, other.'
        primaryIndication:
          type: string
          enum:
          - rectal-bleeding
          - change-in-bowel-habit
          - iron-deficiency-anaemia
          - positive-fit
          - abdominal-mass
          - ibd-diagnosis
          - ibd-surveillance
          - polyp-surveillance
          - crc-screening
          - abnormal-imaging
          - chronic-diarrhoea
          - other
          - ''
          description: Primary clinical indication, used for appropriateness scoring and cancer-pathway
            triage.
        clinicalQuestion:
          type: string
          maxLength: 1000
          description: Specific clinical question the procedure should answer (highest-value field).
        relevantHistory:
          type: string
          maxLength: 1000
          description: Relevant medical, surgical, and GI history.
        redFlagWeightLoss:
          type: boolean
          description: Whether the patient reports unexplained weight loss (lower-GI red flag).
        redFlagAnaemia:
          type: boolean
          description: Whether the patient has iron-deficiency anaemia (lower-GI red flag).
        redFlagAbdominalMass:
          type: boolean
          description: Whether the patient has a palpable abdominal or rectal mass (lower-GI red flag).
        redFlagRectalBleeding:
          type: boolean
          description: Whether the patient reports unexplained rectal bleeding (lower-GI red flag).
        fitResultUgG:
          type:
          - number
          - 'null'
          format: double
          description: Quantitative faecal immunochemical test (FIT) result in micrograms of haemoglobin
            per gram of faeces; >= 10 triggers the suspected-cancer pathway (NICE DG56).
        haemoglobinGL:
          type:
          - number
          - 'null'
          format: double
          description: Haemoglobin concentration in g/L, used for anaemia assessment.
        takingAnticoagulant:
          type: boolean
          description: Whether the patient is taking an anticoagulant (e.g. warfarin, DOAC).
        anticoagulantAgent:
          type: string
          maxLength: 100
          description: Name of the anticoagulant agent, if any.
        takingAntiplatelet:
          type: boolean
          description: Whether the patient is taking an antiplatelet agent (e.g. clopidogrel, aspirin).
        antiplateletAgent:
          type: string
          maxLength: 100
          description: Name of the antiplatelet agent, if any.
        diabetesMedication:
          type: string
          enum:
          - none
          - oral
          - insulin
          - ''
          description: 'Diabetes medication category affecting bowel-prep planning: none, oral, insulin.'
        fitForBowelPrep:
          type: boolean
          description: Whether the patient is assessed as fit to take bowel preparation.
        bowelPrepAgent:
          type: string
          maxLength: 100
          description: Planned bowel-preparation agent, if any.
        chronicKidneyDisease:
          type: boolean
          description: Whether the patient has chronic kidney disease, affecting bowel-prep choice.
        egfrMlMin:
          type:
          - number
          - 'null'
          format: double
          description: Estimated glomerular filtration rate (eGFR) in mL/min/1.73m2, affecting bowel-prep
            choice.
        asaGrade:
          type: string
          enum:
          - I
          - II
          - III
          - IV
          - V
          - ''
          description: ASA physical-status classification (I-V).
        urgency:
          type: string
          enum:
          - routine
          - urgent
          - two-week-wait
          - emergency
          - ''
          description: 'Requested triage urgency: routine, urgent, two-week-wait, emergency.'
        supervisingConsultant:
          type: string
          maxLength: 255
          description: Name of the supervising / responsible consultant.
        requesterContact:
          type: string
          maxLength: 255
          description: Contact details (bleep / phone) for the requester.
        notes:
          type: string
          maxLength: 1000
          description: Free-text additional notes.
      required:
      - createdAt
      - updatedAt
      - patientId
      - clinicianId
      - status
      - siteName
      - setting
      - procedure
      - primaryIndication
      - clinicalQuestion
      - relevantHistory
      - redFlagWeightLoss
      - redFlagAnaemia
      - redFlagAbdominalMass
      - redFlagRectalBleeding
      - takingAnticoagulant
      - anticoagulantAgent
      - takingAntiplatelet
      - antiplateletAgent
      - diabetesMedication
      - fitForBowelPrep
      - bowelPrepAgent
      - chronicKidneyDisease
      - asaGrade
      - urgency
      - supervisingConsultant
      - requesterContact
      - notes
      description: Lower-GI endoscopy (colonoscopy) request (referral). Captures the requested procedure,
        the clinical indication and question, lower-GI red flags, FIT and haemoglobin results, anticoagulant
        / antiplatelet medication, bowel-preparation fitness, renal function, ASA grade, and triage urgency.
    ColonoscopyTestRequestGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        colonoscopyTestRequestId:
          type: string
          format: uuid
          description: Foreign key to the parent request (unique, 1:1).
        appropriatenessScore:
          type:
          - integer
          - 'null'
          format: int32
          description: Appropriateness score (1-9), ASGE / EPAGE / NICE style.
        appropriatenessBand:
          type: string
          enum:
          - usually-appropriate
          - may-be-appropriate
          - usually-not-appropriate
          - ''
          description: 'Appropriateness band: usually-appropriate (7-9), may-be-appropriate (4-6), usually-not-appropriate
            (1-3).'
        triageTier:
          type: string
          enum:
          - routine
          - urgent
          - two-week-wait
          - emergency
          - ''
          description: 'Assigned triage tier: routine, urgent, two-week-wait, emergency.'
        targetTimeframe:
          type: string
          maxLength: 50
          description: Target timeframe for the procedure implied by the triage tier (e.g. "<= 14 days
            (2WW)").
        twoWeekWaitEligible:
          type: boolean
          description: Whether the request meets NICE NG12 / DG56 suspected-cancer two-week-wait criteria.
        twoWeekWaitRationale:
          type: string
          maxLength: 500
          description: Rationale explaining the two-week-wait eligibility decision.
        completenessPercent:
          type:
          - integer
          - 'null'
          format: int32
          description: Request completeness as a percentage of mandatory fields (0-100).
        riskBand:
          type: string
          enum:
          - low
          - moderate
          - high
          - ''
          description: 'Pre-procedure risk band: low, moderate, high.'
        anticoagulantAction:
          type: string
          maxLength: 500
          description: Recommended anticoagulant / antiplatelet management action per BSG / ESGE periprocedural
            bleeding-risk stratification.
        recommendation:
          type: string
          enum:
          - accept
          - query-referrer
          - redirect
          - reject
          - ''
          description: 'Vetting recommendation: accept, query-referrer, redirect, reject.'
        clinicianNotes:
          type: string
          description: Free-text vetting notes.
        signedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Timestamp of vetting clinician electronic signature.
        gradedAt:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the result.
      required:
      - createdAt
      - updatedAt
      - colonoscopyTestRequestId
      - appropriatenessBand
      - triageTier
      - targetTimeframe
      - twoWeekWaitEligible
      - twoWeekWaitRationale
      - riskBand
      - anticoagulantAction
      - recommendation
      - clinicianNotes
      - gradedAt
      description: 'Computed four-axis grading result: appropriateness (ASGE / EPAGE / NICE 1-9), cancer-pathway
        urgency / triage tier, request completeness, and pre-procedure risk.'
    ColonoscopyTestRequestGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        colonoscopyTestRequestGradeId:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        flagId:
          type: string
          maxLength: 50
