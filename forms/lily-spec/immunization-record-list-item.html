<!-- immunization-record-list-item.html -->
<!-- ImmunizationRecordListItem component -->
<!--
  Description: one immunization in an immunization record list, with vaccine, date, dose and status
  HTML tag: <li>
  Subject: when the record is not the patient's own (a relative's history, a fetus), put the consumer's words first,
    <span class="immunization-record-list-item-subject">Mother</span>, so it is never read as the patient's.
  CSS class: immunization-record-list-item (parts: -subject, -vaccine, -occurrence, -dose-number, -status, -lot-number)
  Spec: spec/healthcare-ui (tasks.md P28-T3)
  Attributes: data-status (completed, entered-in-error, not-done). Each status is also text, in the consumer's words; a part with no text is left out.
    Dates are <time datetime>.
-->

<ul
  class="immunization-record-list"
  data-status="known"
  aria-label="Immunizations"
>
  <li
    class="immunization-record-list-item"
    data-status="completed"
  >
    <span class="immunization-record-list-item-vaccine">MMR vaccine</span>
    <time
      class="immunization-record-list-item-occurrence"
      datetime="2025-09-12"
      >12 Sep 2025</time
    >
    <span class="immunization-record-list-item-dose-number">Dose 2 of 2</span>
    <span class="immunization-record-list-item-status">Given</span>
    <span class="immunization-record-list-item-lot-number">AB1234</span>
  </li>
</ul>
