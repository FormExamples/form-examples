<!-- problem-record-list.html -->
<!-- ProblemRecordList component -->
<!--
  Description: a list of a patient's problems and conditions, whose status is never blank
  HTML tag: <ul>
  CSS class: problem-record-list (part: problem-record-list-status)
  Spec: spec/healthcare-ui (tasks.md P28-T3)
  Attributes: data-status (known, none-known, not-recorded, unavailable, omitted, not-applicable) and aria-label (the status in words).
    For any status but "known", the status words are the list's one item, li.problem-record-list-status, so the list is never
    blank: "none known", "not recorded", "unavailable", "omitted" and "not applicable" are different facts.
  Usage (status other than known):
    <ul class="problem-record-list" data-status="none-known" aria-label="No known problems"><li class="problem-record-list-status">No known problems</li></ul>
-->

<ul
  class="problem-record-list"
  data-status="known"
  aria-label="Problems"
>
  <li
    class="problem-record-list-item"
    data-clinical-status="active"
    data-verification-status="confirmed"
  >
    <span class="problem-record-list-item-condition">Type 2 diabetes</span>
    <span class="problem-record-list-item-clinical-status">Active</span>
    <span class="problem-record-list-item-verification-status">Confirmed</span>
    <span class="problem-record-list-item-severity">Moderate</span>
    <time
      class="problem-record-list-item-onset"
      datetime="2019-06-01"
      >Since June 2019</time
    >
    <time
      class="problem-record-list-item-abatement"
      datetime="2024-01-15"
      >Resolved 15 Jan 2024</time
    >
  </li>
</ul>
