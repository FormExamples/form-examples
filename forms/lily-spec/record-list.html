<!-- record-list.html -->
<!-- RecordList component -->
<!--
  Description: a list of records from one section of a patient's record, whose status is never blank
  HTML tag: <ul>
  CSS class: record-list (part: record-list-status)
  Spec: spec/healthcare-ui (tasks.md P28-T3)
  Attributes: data-status (known, none-known, not-recorded, unavailable, omitted) and aria-label (the status in words).
    For any status but "known", the status words are the list's one item, li.record-list-status, so the list is never
    blank: "none known", "not recorded", "unavailable" and "omitted" are different facts.
  Usage (status other than known):
    <ul class="record-list" data-status="none-known" aria-label="No vital signs recorded"><li class="record-list-status">No vital signs recorded</li></ul>
-->

<ul
  class="record-list"
  data-status="known"
  aria-label="Vital signs"
>
  <li
    class="record-list-item"
    data-status="final"
  >
    Blood pressure 128/82 mmHg <span class="record-list-item-status">Final</span>
    <time
      class="record-list-item-updated"
      datetime="2026-11-03"
      >Updated 3 Nov 2026</time
    >
  </li>
</ul>
