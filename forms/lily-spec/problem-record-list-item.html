<!-- problem-record-list-item.html -->
<!-- ProblemRecordListItem component -->
<!--
  Description: one problem or condition in a problem record list, with its clinical and verification status, severity, onset and resolution
  HTML tag: <li>
  Subject: when the record is not the patient's own (a relative's history, a fetus), put the consumer's words first,
    <span class="problem-record-list-item-subject">Mother</span>, so it is never read as the patient's.
  CSS class: problem-record-list-item (parts: -subject, -condition, -clinical-status, -verification-status, -severity, -onset, -abatement)
  Spec: spec/healthcare-ui (tasks.md P28-T3)
  Attributes: data-clinical-status (active, recurrence, relapse, inactive, remission, resolved), data-verification-status (unconfirmed, provisional, differential, confirmed, refuted, entered-in-error). Each status is also text, in the consumer's words; a part with no text is left out.
    Dates are <time datetime>.
-->

<ul
  class="problem-record-list"
  data-status="known"
  aria-label="Problems"
>
  <li
    class="problem-record-list-item"
    data-clinical-status="active"
    data-verification-status="confirmed"
  >
    <span class="problem-record-list-item-condition">Type 2 diabetes</span>
    <span class="problem-record-list-item-clinical-status">Active</span>
    <span class="problem-record-list-item-verification-status">Confirmed</span>
    <span class="problem-record-list-item-severity">Moderate</span>
    <time
      class="problem-record-list-item-onset"
      datetime="2019-06-01"
      >Since June 2019</time
    >
    <time
      class="problem-record-list-item-abatement"
      datetime="2024-01-15"
      >Resolved 15 Jan 2024</time
    >
  </li>
</ul>
