<!-- signature-pad.html -->

<div
  class="signature-pad"
  role="group"
  aria-label="Consent signature"
  aria-describedby="signature-pad-1-attestation"
>
  <p
    class="signature-pad-attestation"
    id="signature-pad-1-attestation"
  >
    I confirm I have read and understood the information.
  </p>
  <!-- Consumer provides the drawing surface, for example <canvas class="signature-pad-canvas"> -->
  <p class="signature-pad-typed">
    <label for="signature-pad-1-typed">Or type your full name</label>
    <input
      id="signature-pad-1-typed"
      type="text"
      autocomplete="name"
      name="signature"
    />
  </p>
</div>

<div
  class="signature-pad"
  role="group"
  aria-label="Consent signature"
  data-outcome="declined"
>
  <p class="signature-pad-outcome">Declined to sign</p>
</div>

<script>
  // SignaturePad behavior
  (function () {
    "use strict";
    // SignaturePad: consumer implements interactive behavior
    document.querySelectorAll(".signature-pad").forEach(function (el) {
      // Interactive behavior initialization
    });
  })();
</script>
