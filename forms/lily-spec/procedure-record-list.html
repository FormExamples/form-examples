<!-- procedure-record-list.html -->
<!-- ProcedureRecordList component -->
<!--
  Description: a list of a patient's procedures, whose status is never blank
  HTML tag: <ul>
  CSS class: procedure-record-list (part: procedure-record-list-status)
  Spec: spec/healthcare-ui (tasks.md P28-T3)
  Attributes: data-status (known, none-known, not-recorded, unavailable, omitted) and aria-label (the status in words).
    For any status but "known", the status words are the list's one item, li.procedure-record-list-status, so the list is never
    blank: "none known", "not recorded", "unavailable" and "omitted" are different facts.
  Usage (status other than known):
    <ul class="procedure-record-list" data-status="none-known" aria-label="No known procedures"><li class="procedure-record-list-status">No known procedures</li></ul>
-->

<ul
  class="procedure-record-list"
  data-status="known"
  aria-label="Procedures"
>
  <li
    class="procedure-record-list-item"
    data-status="completed"
  >
    <span class="procedure-record-list-item-procedure">Appendectomy</span>
    <span class="procedure-record-list-item-status">Completed</span>
    <time
      class="procedure-record-list-item-performed"
      datetime="2018-04-22"
      >22 Apr 2018</time
    >
  </li>
</ul>
