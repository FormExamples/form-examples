<!-- allergy-record-list.html -->
<!-- AllergyRecordList component -->
<!--
  Description: a list of a patient's allergies and intolerances, whose status is never blank
  HTML tag: <ul>
  CSS class: allergy-record-list (part: allergy-record-list-status)
  Spec: spec/healthcare-ui (tasks.md P28-T3)
  Attributes: data-status (known, none-known, not-recorded, unavailable, omitted) and aria-label (the status in words).
    For any status but "known", the status words are the list's one item, li.allergy-record-list-status, so the list is never
    blank: "none known", "not recorded", "unavailable" and "omitted" are different facts.
  Usage (status other than known):
    <ul class="allergy-record-list" data-status="none-known" aria-label="No known allergies"><li class="allergy-record-list-status">No known allergies</li></ul>
-->

<ul
  class="allergy-record-list"
  data-status="known"
  aria-label="Known allergies"
>
  <li
    class="allergy-record-list-item"
    data-severity="severe"
    data-criticality="high"
    data-clinical-status="active"
    data-verification-status="confirmed"
  >
    <span class="allergy-record-list-item-substance">Penicillin</span>
    <span class="allergy-record-list-item-reaction">Anaphylaxis</span>
    <span class="allergy-record-list-item-severity">Severe</span>
    <span class="allergy-record-list-item-criticality">High risk</span>
    <span class="allergy-record-list-item-clinical-status">Active</span>
    <span class="allergy-record-list-item-verification-status">Confirmed</span>
    <span class="allergy-record-list-item-type">Allergy</span>
    <span class="allergy-record-list-item-category">Medication</span>
    <time
      class="allergy-record-list-item-updated"
      datetime="2026-11-03"
      >Updated 3 Nov 2026</time
    >
  </li>
</ul>
