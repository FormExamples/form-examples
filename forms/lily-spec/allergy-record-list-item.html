<!-- allergy-record-list-item.html -->
<!-- AllergyRecordListItem component -->
<!--
  Description: one allergy or intolerance in an allergy record list, with substance, reaction, severity, criticality and status
  HTML tag: <li>
  Subject: when the record is not the patient's own (a relative's history, a fetus), put the consumer's words first,
    <span class="allergy-record-list-item-subject">Mother</span>, so it is never read as the patient's.
  CSS class: allergy-record-list-item (parts: -subject, -substance, -reaction, -severity, -criticality, -clinical-status, -verification-status, -type, -category, -updated)
  Spec: spec/healthcare-ui (tasks.md P28-T3)
  Attributes: data-severity (mild, moderate, severe), data-criticality (low, high, unable-to-assess), data-clinical-status (active, inactive, resolved), data-verification-status (unconfirmed, presumed, confirmed, refuted, entered-in-error). Each status is also text, in the consumer's words; a part with no text is left out.
    Dates are <time datetime>.
-->

<ul
  class="allergy-record-list"
  data-status="known"
  aria-label="Known allergies"
>
  <li
    class="allergy-record-list-item"
    data-severity="severe"
    data-criticality="high"
    data-clinical-status="active"
    data-verification-status="confirmed"
  >
    <span class="allergy-record-list-item-substance">Penicillin</span>
    <span class="allergy-record-list-item-reaction">Anaphylaxis</span>
    <span class="allergy-record-list-item-severity">Severe</span>
    <span class="allergy-record-list-item-criticality">High risk</span>
    <span class="allergy-record-list-item-clinical-status">Active</span>
    <span class="allergy-record-list-item-verification-status">Confirmed</span>
    <span class="allergy-record-list-item-type">Allergy</span>
    <span class="allergy-record-list-item-category">Medication</span>
    <time
      class="allergy-record-list-item-updated"
      datetime="2026-11-03"
      >Updated 3 Nov 2026</time
    >
  </li>
</ul>
