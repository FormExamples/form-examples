                $ref: '#/components/schemas/Problem'
components:
  schemas:
    Assessment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        patientId:
          type: string
          format: uuid
          description: Foreign key to the patient who owns this assessment.
        status:
          type: string
          enum:
          - draft
          - submitted
          - reviewed
          - urgent
          description: 'Lifecycle status: draft, submitted, reviewed, or urgent.'
      required:
      - createdAt
      - updatedAt
      - patientId
      - status
      description: Oncology assessment form using ECOG Performance Status. Parent entity for all assessment
        sections.
    AssessmentCurrentMedications:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        assessmentId:
          type: string
          format: uuid
          description: Foreign key to the parent assessment (unique, enforcing 1:1).
        polypharmacyConcern:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Whether polypharmacy is a concern: yes, no, or empty.'
        drugInteractionsIdentified:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Whether drug interactions have been identified: yes, no, or empty.'
        drugInteractionDetails:
          type: string
          description: Details of identified drug interactions.
        complementaryMedicines:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 'Whether the patient uses complementary or alternative medicines: yes, no, or empty.'
        complementaryMedicineDetails:
          type: string
          description: Details of complementary or alternative medicines being used.
        medicationAdherence:
          type: string
          enum:
          - good
          - partial
          - poor
          - ''
          description: 'Overall medication adherence: good, partial, poor, or empty.'
        medicationsNotes:
          type: string
          description: Additional clinician notes on medications.
      required:
      - createdAt
      - updatedAt
      - assessmentId
      - polypharmacyConcern
      - drugInteractionsIdentified
      - drugInteractionDetails
      - complementaryMedicines
      - complementaryMedicineDetails
      - medicationAdherence
      - medicationsNotes
      description: 'Current medications section header: polypharmacy concerns, interactions, and adherence.
        One-to-one child of assessment.'
    AssessmentMedicationItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        currentMedicationsId:
          type: string
          format: uuid
          description: Foreign key to the assessment_current_medications table.
        medicationName:
          type: string
          maxLength: 255
          description: Name of the medication.
        dose:
          type: string
          maxLength: 100
          description: Dose of the medication (e.g. 500mg, 10mg/kg).
        frequency:
          type: string
          maxLength: 100
          description: Frequency of administration (e.g. once daily, twice daily, PRN).
        route:
          type: string
          enum:
          - oral
          - iv
          - sc
          - im
          - topical
          - inhaled
          - rectal
          - other
          - ''
          description: 'Route of administration: oral, iv, sc, im, topical, inhaled, rectal, other, or
            empty.'
        indication:
          type: string
          maxLength: 255
          description: Indication for the medication.
        startDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the medication was started.
        sortOrder:
          type: integer
          format: int32
          description: Display order of the item within the list.
      required:
      - createdAt
      - updatedAt
      - currentMedicationsId
      - medicationName
      - dose
      - frequency
      - route
      - indication
      - sortOrder
      description: Individual medication entry with name, dose, frequency, route, and indication.
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        name:
          type: string
          description: Name.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as full text.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code, such as for validating the postal address.
        role:
          type: string
          enum:
          - anaesthetist
          - surgeon
          - preop-nurse
          - perioperative-physician
          - geriatrician
          - pharmacist
          - other
          - ''
          description: Clinician role.
        registrationBody:
          type: string
          enum:
          - GMC
          - NMC
          - HCPC
          - GPhC
          - other
          - ''
          description: Clinician registration body.
        registrationNumber:
          type: string
          description: Clinician registration number.
        unitedKingdomNhsNumber:
          type:
          - string
          - 'null'
          maxLength: 12
          description: United Kingdom NHS number, unique per person.
      required:
      - createdAt
      - updatedAt
      - name
      - role
      - registrationBody
      - registrationNumber
      description: Clinician
    Grade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        assessmentId:
          type: string
          format: uuid
          description: Foreign key to the assessment table.
        ecogScore:
          type: integer
          format: int32
          description: 'ECOG Performance Status score: 0 = Fully active, 1 = Restricted, 2 = Ambulatory,
            3 = Limited self-care, 4 = Completely disabled, 5 = Dead.'
        ecogCategory:
          type: string
          enum:
          - fully-active
          - restricted
          - ambulatory
          - limited-self-care
          - completely-disabled
          - dead
          - ''
          description: 'ECOG category label: fully-active, restricted, ambulatory, limited-self-care,
            completely-disabled, dead, or empty.'
        gradedAt:
          type: string
          format: date-time
          description: Timestamp when the ECOG grading was computed.
      required:
      - createdAt
      - updatedAt
      - assessmentId
      - ecogScore
      - ecogCategory
      - gradedAt
      description: Computed ECOG Performance Status grading result for the oncology assessment. One-to-one
        child of assessment.
    GradingAdditionalFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        gradeId:
          type: string
          format: uuid
          description: Foreign key to the grade table.
        flagId:
          type: string
          maxLength: 30
          description: Identifier of the flag (e.g. FLAG-NEUTROPENIA-001, FLAG-WEIGHT-LOSS-001).
        category:
          type: string
          maxLength: 100
          description: Category of the flag (e.g. Haematological, Nutritional, Psychosocial).
        message:
          type: string
          description: Human-readable description of the flagged issue.
        priority:
          type: string
          enum:
          - high
          - medium
          - low
          description: 'Priority level: high, medium, or low.'
      required:
      - createdAt
      - updatedAt
      - gradeId
      - flagId
      - category
      - message
      - priority
      description: Additional flags detected during oncology assessment grading, such as critical lab
        values or urgent symptom concerns.
    GradingFiredRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when this row was updated.
        gradeId:
          type: string
          format: uuid
          description: Foreign key to the grade table.
        ruleId:
          type: string
          maxLength: 20
          description: Identifier of the rule that fired (e.g. ECOG-FUNC-001, ECOG-SYMP-001).
        category:
          type: string
          maxLength: 100
          description: Category of the rule (e.g. Functional Status, Symptom Burden, Treatment Toxicity).
        description:
          type: string
          description: Human-readable description of the rule and why it fired.
        severityLevel:
          type: string
          enum:
          - fully-active
          - restricted
          - ambulatory
          - limited-self-care
          - completely-disabled
          - dead
          - ''
          description: ECOG category contributed by this rule.
      required:
      - createdAt
      - updatedAt
      - gradeId
      - ruleId
      - category
      - description
      - severityLevel
      description: Individual ECOG classification rules that evaluated to true during grading of the oncology
        assessment.
    Patient:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-deleted.
        name:
          type: string
          maxLength: 255
          description: Name.
        birthDate:
          type: string
          format: date
          description: Birth date.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Postal address as full text.
        countryAsIso31661Alpha2:
          type:
          - string
          - 'null'
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type:
          - string
          - 'null'
          description: Postal code, such as for validating the postal address.
        unitedKingdomNhsNumber:
          type:
          - string
          - 'null'
          maxLength: 20
          description: United Kingdom NHS number, unique per person.
        waistAsCm:
          type:
          - number
          - 'null'
          format: double
          description: Waist circumference measurement in cm, such as for calculating waist-height ratio
            (WHR).
        heightAsCm:
          type:
          - number
          - 'null'
          format: double
          description: Height measurement in cm, such as for calculating waist-height ratio (WHR).
        weightAsKg:
          type:
          - number
          - 'null'
          format: double
          description: Weight as kg.
        bodyMassIndex:
          type:
          - number
          - 'null'
          format: double
          description: Body mass index (BMI) measurement.
        waistHeightRatio:
          type:
          - number
          - 'null'
          format: double
          description: Waist-height ratio (WHR) measurement.
        vo2Max:
          type:
          - number
          - 'null'
          format: double
          description: VO2 max measurement.
      required:
      - createdAt
      - updatedAt
      - name
      - birthDate
      description: Patient
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          description: A URI identifying the problem type
        title:
          type: string
          description: A short summary of the problem type
        status:
          type: integer
          description: The HTTP status code
        detail:
          type: string
          description: An explanation of this occurrence
        instance:
          type: string
          description: A URI identifying this occurrence
        code:
          type: string
          description: A short machine-readable reason
        errors:
          type: object
          description: Per-field detail, when validation failed
      required:
      - type
      - title
      - status
