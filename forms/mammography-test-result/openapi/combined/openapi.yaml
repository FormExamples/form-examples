        postal_address_as_full_text:
          type: string
          description: Postal address as full text.
        country_as_iso_3166_1_alpha_2:
          type: string
          maxLength: 2
          description: Country as ISO 3166-1 alpha-2 format, such as for validating the postal address.
        postcode:
          type: string
          description: Postal code, such as for validating the postal address.
        role:
          type: string
          enum:
          - radiologist
          - consultant
          - reporting-radiographer
          - other
          - ''
          description: 'Reporting clinician role: radiologist, consultant, reporting-radiographer, other.'
        registration_body:
          type: string
          enum:
          - GMC
          - HCPC
          - other
          - ''
          description: 'Clinician registration body: GMC, HCPC, other.'
        registration_number:
          type: string
          description: Clinician registration number.
        united_kingdom_nhs_number:
          type: string
          maxLength: 12
          description: United Kingdom NHS number, unique per person.
      required:
      - created_at
      - updated_at
      - name
      - role
      - registration_body
      - registration_number
      description: Reporting clinician (radiologist, consultant, or reporting radiographer) who authors
        and signs the mammography result report.
    MammographyTestResult:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        patient_id:
          type: string
          format: uuid
          description: Foreign key to the patient.
        clinician_id:
          type: string
          format: uuid
          description: Foreign key to the reporting clinician (radiologist / consultant / reporting radiographer).
        originating_request_reference:
          type: string
          maxLength: 255
          description: Free-text reference linking this report back to the originating mammography request
            (referral).
        report_status:
          type: string
          enum:
          - preliminary
          - final
          - amended
          - cancelled
          - ''
          description: 'Report lifecycle status: preliminary, final, amended, cancelled.'
        performed_date:
          type: string
          format: date
          description: Date the mammography examination was performed.
        reported_date:
          type: string
          format: date
          description: Date the report was authored / signed.
        exam_type:
          type: string
          enum:
          - screening
          - diagnostic
          - symptomatic
          - surveillance
          - other
          - ''
          description: 'Type of mammography performed: screening, diagnostic, symptomatic, surveillance,
            other. Only BI-RADS 0/1/2 may be assigned to a screening study; 3/4/5/6 require a complete
            diagnostic work-up.'
        laterality:
          type: string
          enum:
          - left
          - right
          - bilateral
          - ''
          description: 'Examined side: left, right, bilateral.'
        examination_adequacy:
          type: string
          enum:
          - adequate
          - limited
          - non-diagnostic
          - ''
          description: 'Diagnostic adequacy of the examination: adequate, limited, non-diagnostic.'
        breast_density:
          type: string
          enum:
          - a
          - b
          - c
          - d
          - ''
          description: 'ACR BI-RADS breast composition / density: a = almost entirely fatty, b = scattered
            fibroglandular, c = heterogeneously dense, d = extremely dense.'
        clinical_history:
          type: string
          maxLength: 1000
          description: Clinical history and the question the examination was performed to answer.
        comparison_with_previous:
          type: string
          maxLength: 1000
          description: Comparison with relevant previous mammograms or breast imaging.
        findings_narrative:
          type: string
          maxLength: 2000
          description: Narrative description of the imaging findings (the body of the report).
        mass:
          type: boolean
          description: Whether a mass is present.
        calcifications:
          type: boolean
          description: Whether calcifications (e.g. clustered, pleomorphic) are present.
        architectural_distortion:
          type: boolean
          description: Whether architectural distortion is present.
        asymmetry:
          type: boolean
          description: Whether an asymmetry (developing, focal, or global) is present.
        skin_or_nipple_change:
          type: boolean
          description: Whether a skin thickening / retraction or nipple change is present.
        lymphadenopathy:
          type: boolean
          description: Whether axillary or intramammary lymphadenopathy is present.
        incidental_finding:
          type: boolean
          description: Whether one or more incidental findings warranting documentation are present.
        largest_lesion_size_mm:
          type: number
          format: double
          description: Largest lesion long-axis size in millimetres, for surveillance and categorisation.
        impression:
          type: string
          maxLength: 2000
          description: Summary impression / conclusion answering the clinical question.
        bi_rads_category:
          type: string
          enum:
          - '0'
          - '1'
          - '2'
          - '3'
          - 4a
          - 4b
          - 4c
          - '5'
          - '6'
          - ''
          description: 'ACR BI-RADS final assessment category (the key structured score): 0 = incomplete,
            need additional imaging; 1 = negative; 2 = benign; 3 = probably benign; 4a/4b/4c = suspicious
            (low / intermediate / moderate); 5 = highly suggestive of malignancy; 6 = known biopsy-proven
            malignancy.'
        recommended_follow_up:
          type: string
          maxLength: 1000
          description: 'Recommended follow-up: routine screening interval, short-interval follow-up, additional
            imaging, biopsy, or specialist referral.'
        critical_result_communicated:
          type: boolean
          description: Whether a critical or unexpected significant result was communicated directly to
            the referrer.
        reported_to:
          type: string
          maxLength: 500
          description: Who the critical / urgent result was communicated to, with date and time if applicable.
      required:
      - created_at
      - updated_at
      - patient_id
      - clinician_id
      - originating_request_reference
      - report_status
      - exam_type
      - laterality
      - examination_adequacy
      - breast_density
      - clinical_history
      - comparison_with_previous
      - findings_narrative
      - mass
      - calcifications
      - architectural_distortion
      - asymmetry
      - skin_or_nipple_change
      - lymphadenopathy
      - incidental_finding
      - impression
      - bi_rads_category
      - recommended_follow_up
      - critical_result_communicated
      - reported_to
      description: Breast mammography result (report). Captures the performed examination and laterality,
        the clinical history, the narrative and structured findings, breast density (ACR A-D), the largest
        lesion measurement, the impression, the BI-RADS final assessment category (the key structured
        score), recommended follow-up, and critical-result communication. This is the source-of-truth
        record that the four-axis interpretation grade is computed from.
    MammographyTestResultGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when this row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        deleted_at:
          type: string
          format: date-time
          description: Timestamp when the record was deleted a.k.a. soft-removed.
        mammography_test_result_id:
          type: string
          format: uuid
          description: Foreign key to the parent result (unique, 1:1).
        result_classification:
          type: string
          enum:
          - normal
          - abnormal
          - critical
          - inconclusive
          - ''
          description: 'Axis A overall classification: normal, abnormal, critical, inconclusive. Mapped
            from the BI-RADS category (1-2 normal; 3/4a/4b abnormal; 4c/5 critical; 0 inconclusive; 6
            abnormal known malignancy).'
        abnormality_severity:
          type: string
          enum:
          - none
          - minor
          - moderate
          - major
          - ''
          description: 'Axis B abnormality severity: none, minor, moderate, major.'
        reporting_category:
          type: string
          maxLength: 50
          description: Axis B structured-reporting score / category label carrying the BI-RADS final assessment
            category (e.g. "BI-RADS 4b").
        report_completeness_percent:
          type: integer
          format: int32
          description: Axis C report completeness as a percentage of mandatory report sections (0-100).
        follow_up_urgency:
          type: string
          enum:
          - routine
          - recommended
          - urgent
          - critical-alert
          - ''
          description: 'Axis D follow-up urgency: routine, recommended, urgent, critical-alert.'
        target_timeframe:
          type: string
          maxLength: 50
          description: Target timeframe for the recommended follow-up implied by the urgency (e.g. "routine
            screening interval", "6-month short-interval", "two-week-wait biopsy").
        recommended_action:
          type: string
          maxLength: 500
          description: Axis D concise recommended action derived from the urgency and BI-RADS category.
        recommendation:
          type: string
          enum:
          - no-action
          - routine-follow-up
          - further-imaging
          - specialist-referral
          - urgent-review
          - ''
          description: 'Overall recommendation: no-action, routine-follow-up, further-imaging, specialist-referral,
            urgent-review.'
        clinician_notes:
          type: string
          description: Free-text interpretation / sign-off notes.
        signed_at:
          type: string
          format: date-time
          description: Timestamp of the reporting clinician electronic signature.
        graded_at:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the result.
      required:
      - created_at
      - updated_at
      - mammography_test_result_id
      - result_classification
      - abnormality_severity
      - reporting_category
      - follow_up_urgency
      - target_timeframe
      - recommended_action
      - recommendation
      - clinician_notes
      - graded_at
      description: 'Computed four-axis interpretation grade: result classification, abnormality severity
        / structured-reporting category, report completeness, and follow-up urgency. The BI-RADS final
        assessment category is the structured-reporting score carried in reporting_category and drives
        Axis A and Axis D: BI-RADS 1-2 = normal / routine; 3 = abnormal / recommended short-interval follow-up;
        4-5 = abnormal or critical / urgent biopsy referral; 0 = inconclusive / further imaging; 6 = known
        malignancy. BI-RADS 4/5 auto-escalates the follow-up urgency and raises abnormal-requiring-action
        / urgent-referral flags regardless of the other axes.'
    MammographyTestResultGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
