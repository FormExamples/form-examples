  description: "Computed four-axis interpretation grade: result classification, abnormality severity / structured-reporting category, report completeness, and follow-up urgency. The BI-RADS final assessment category is the structured-reporting score carried in reporting_category and drives Axis A and Axis D: BI-RADS 1-2 = normal / routine; 3 = abnormal / recommended short-interval follow-up; 4-5 = abnormal or critical / urgent biopsy referral; 0 = inconclusive / further imaging; 6 = known malignancy. BI-RADS 4/5 auto-escalates the follow-up urgency and raises abnormal-requiring-action / urgent-referral flags regardless of the other axes."
