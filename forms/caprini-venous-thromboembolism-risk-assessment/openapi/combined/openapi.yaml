components:
  schemas:
    CapriniVenousThromboembolismRiskAssessment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the record was updated most-recently.
        patient_id:
          type: string
          format: uuid
          description: Foreign key to the patient being assessed (delete restricted).
        clinician_id:
          type: string
          format: uuid
          description: Foreign key to the assessing clinician (optional; delete restricted).
        clinician_name:
          type: string
          maxLength: 255
          description: Name of the assessing clinician as recorded on the assessment.
        clinician_role:
          type: string
          enum:
          - doctor
          - surgeon
          - nurse
          - pharmacist
          - other
          - ''
          description: 'Role of the assessing clinician: doctor, surgeon, nurse, pharmacist, or other.'
        assessed_at:
          type: string
          format: date-time
          description: Date and time the assessment was performed.
        care_setting:
          type: string
          enum:
          - surgical-ward
          - medical-ward
          - pre-operative-clinic
          - other
          - ''
          description: 'Care setting: surgical-ward, medical-ward, pre-operative-clinic, or other.'
        admission_type:
          type: string
          enum:
          - surgical
          - medical
          - ''
          description: 'Admission type: surgical or medical.'
        patient_identifier:
          type: string
          maxLength: 100
          description: Local patient identifier as recorded on the assessment.
        age_band:
          type: string
          enum:
          - under-41
          - 41-60
          - 61-74
          - 75-plus
          - ''
          description: 'Age band contributing weight: under-41 (0), 41-60 (1), 61-74 (2), or 75-plus (3).'
        sex:
          type: string
          enum:
          - female
          - male
          - intersex
          - unknown
          - ''
          description: 'Patient sex recorded for the assessment: female, male, intersex, or unknown.'
        minor_surgery:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 1-point factor — minor surgery planned or performed.
        recent_major_surgery:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 1-point factor — major surgery within the past month.
        varicose_veins:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 1-point factor — varicose veins.
        inflammatory_bowel_disease:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 1-point factor — inflammatory bowel disease.
        swollen_legs:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 1-point factor — swollen legs (current).
        obesity:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 1-point factor — obesity (BMI >= 30).
        acute_myocardial_infarction:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 1-point factor — acute myocardial infarction.
        congestive_heart_failure:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 1-point factor — congestive heart failure (within the past month).
        sepsis:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 1-point factor — sepsis (within the past month).
        serious_lung_disease:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 1-point factor — serious lung disease including pneumonia (within the past month).
        abnormal_pulmonary_function:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 1-point factor — abnormal pulmonary function (e.g. COPD).
        medical_patient_bed_rest:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 1-point factor — medical patient currently on bed rest.
        oral_contraceptive_or_hrt:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 1-point factor — oral contraceptive or hormone replacement therapy.
        pregnancy_or_postpartum:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 1-point factor — pregnancy or postpartum (within the past month).
        adverse_pregnancy_history:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 1-point factor — history of unexplained or recurrent spontaneous abortion.
        arthroscopic_surgery:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 2-point factor — arthroscopic surgery.
        major_open_surgery:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 2-point factor — major open surgery (> 45 minutes).
        laparoscopic_surgery:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 2-point factor — laparoscopic surgery (> 45 minutes).
        malignancy:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 2-point factor — malignancy (present or previous).
        confined_to_bed:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 2-point factor — confined to bed (> 72 hours).
        immobilising_cast:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 2-point factor — immobilising plaster cast.
        central_venous_access:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 2-point factor — central venous access.
        history_of_vte:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 3-point factor — personal history of venous thromboembolism.
        family_history_of_thrombosis:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 3-point factor — family history of thrombosis.
        factor_v_leiden:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 3-point factor — Factor V Leiden mutation.
        prothrombin_20210a:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 3-point factor — prothrombin 20210A mutation.
        lupus_anticoagulant:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 3-point factor — lupus anticoagulant positive.
        anticardiolipin_antibodies:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 3-point factor — elevated anticardiolipin antibodies.
        elevated_homocysteine:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 3-point factor — elevated serum homocysteine.
        heparin_induced_thrombocytopenia:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 3-point factor — heparin-induced thrombocytopenia (HIT).
        other_thrombophilia:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 3-point factor — other congenital or acquired thrombophilia.
        stroke:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 5-point factor — stroke (within the past month).
        elective_arthroplasty:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 5-point factor — elective major lower-extremity arthroplasty.
        hip_pelvis_leg_fracture:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 5-point factor — hip, pelvis, or leg fracture.
        acute_spinal_cord_injury:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 5-point factor — acute spinal cord injury with paralysis (within the past month).
        multiple_trauma:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: 5-point factor — multiple trauma (within the past month).
        high_bleeding_risk:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Bleeding-risk input — an active or high risk of bleeding that contraindicates pharmacological
            prophylaxis.
        clinical_note:
          type: string
          description: Free-text clinical note recorded with the assessment.
      required:
      - created_at
      - updated_at
      - patient_id
      - clinician_name
      - clinician_role
      - care_setting
      - admission_type
      - patient_identifier
      - age_band
      - sex
      - minor_surgery
      - recent_major_surgery
      - varicose_veins
      - inflammatory_bowel_disease
      - swollen_legs
      - obesity
      - acute_myocardial_infarction
      - congestive_heart_failure
      - sepsis
      - serious_lung_disease
      - abnormal_pulmonary_function
      - medical_patient_bed_rest
      - oral_contraceptive_or_hrt
      - pregnancy_or_postpartum
      - adverse_pregnancy_history
      - arthroscopic_surgery
      - major_open_surgery
      - laparoscopic_surgery
      - malignancy
      - confined_to_bed
      - immobilising_cast
      - central_venous_access
      - history_of_vte
      - family_history_of_thrombosis
      - factor_v_leiden
      - prothrombin_20210a
      - lupus_anticoagulant
      - anticardiolipin_antibodies
      - elevated_homocysteine
      - heparin_induced_thrombocytopenia
      - other_thrombophilia
      - stroke
      - elective_arthroplasty
      - hip_pelvis_leg_fracture
      - acute_spinal_cord_injury
      - multiple_trauma
      - high_bleeding_risk
      - clinical_note
      description: 'Main Caprini VTE risk-assessment record: assessment context, patient identification,
        age band, weighted yes/no risk-factor inputs (1-, 2-, 3-, and 5-point groups), and the bleeding-risk
        input.'
    CapriniVenousThromboembolismRiskAssessmentGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        caprini_venous_thromboembolism_risk_assessment_id:
          type: string
          format: uuid
          description: Foreign key to the parent assessment (unique, 1:1).
        total_score:
          type: integer
          format: int32
          description: 'Summed Caprini score: age-band weight plus the fixed weight of every fired factor
            (0..40+).'
        risk_band:
          type: string
          enum:
          - very-low
          - low
          - moderate
          - high
          - ''
          description: 'Derived risk band: very-low (0-1), low (2), moderate (3-4), or high (>= 5).'
        prophylaxis_recommendation:
          type: string
          description: 'Recommended prophylaxis strategy: early-ambulation, mechanical, pharmacological-or-mechanical,
            or pharmacological-plus-mechanical (downgraded to mechanical when the bleeding risk is high).'
        graded_at:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the grade.
      required:
      - created_at
      - updated_at
      - caprini_venous_thromboembolism_risk_assessment_id
      - risk_band
      - prophylaxis_recommendation
      - graded_at
      description: 'Computed Caprini grading result: summed total score, derived risk band (very-low /
        low / moderate / high), and the recommended prophylaxis strategy.'
    CapriniVenousThromboembolismRiskAssessmentGradeFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        caprini_venous_thromboembolism_risk_assessment_grade_id:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        flag_id:
          type: string
          maxLength: 50
          description: Stable flag identifier (e.g. F-HIGH-VTE-RISK-001).
        category:
          type: string
          enum:
          - high-vte-risk
          - bleeding-contraindication
          - prior-vte
          - known-thrombophilia
          - incomplete-assessment
          - other
          - ''
          description: 'Flag category: high-vte-risk, bleeding-contraindication, prior-vte, known-thrombophilia,
            incomplete-assessment, or other.'
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          - ''
          description: 'Priority: low, medium, high.'
        description:
          type: string
          maxLength: 500
          description: Human-readable description of what fired the flag.
        suggested_action:
          type: string
          maxLength: 500
          description: Suggested clinical action (e.g. "commence pharmacological prophylaxis after bleeding-risk
            review").
      required:
      - created_at
      - updated_at
      - caprini_venous_thromboembolism_risk_assessment_grade_id
      - flag_id
      - category
      - priority
      - description
      - suggested_action
      description: Red-flag issues that fire independently of the total score, with priority and a suggested
        action for the clinical team.
    CapriniVenousThromboembolismRiskAssessmentGradeRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        caprini_venous_thromboembolism_risk_assessment_grade_id:
          type: string
          format: uuid
          description: Foreign key to the parent grade.
        rule_id:
          type: string
          maxLength: 40
          description: Stable rule identifier (e.g. R-HISTORY-OF-VTE-3POINT-01).
        factor:
          type: string
          maxLength: 60
          description: Fired factor key (e.g. history_of_vte) or age_band that contributed the points.
        weight_group:
          type: string
          enum:
          - age
          - 1-point
          - 2-point
          - 3-point
          - 5-point
          - ''
          description: 'Weight group the rule belongs to: age, 1-point, 2-point, 3-point, or 5-point.'
        points:
          type: integer
          format: int32
          description: Points contributed by this rule (1, 2, 3, 5, or the 0-3 age-band weight).
        category:
          type: string
          maxLength: 50
          description: Subject category (e.g. surgical, thrombophilia, mobility, age-band).
        description:
          type: string
          maxLength: 500
          description: Human-readable description of why the rule fired.
      required:
      - created_at
      - updated_at
      - caprini_venous_thromboembolism_risk_assessment_grade_id
      - rule_id
      - factor
      - weight_group
      - category
      - description
      description: 'Audit trail of every grading rule that fired during Caprini computation: fired factor
        (or age band), weight group, points contributed, category, and description.'
    Clinician:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updated_at:
