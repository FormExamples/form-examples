components:
  schemas:
    Applicant:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        name:
          type: string
          description: Full legal name of the owner (an individual or a business).
        ownerType:
          type: string
          enum:
          - individual
          - business
          - ''
          description: 'Owner type: individual or business.'
        birthDate:
          type:
          - string
          - 'null'
          format: date
          description: Date of birth of an individual owner; empty for a business.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Mailing address as a single text block.
        stateCode:
          type: string
          maxLength: 2
          description: Two-letter code of the state of residence.
        postcode:
          type:
          - string
          - 'null'
          description: ZIP code.
        identificationType:
          type: string
          enum:
          - drivers-license
          - state-id
          - passport
          - fein
          - other
          - ''
          description: 'Identification presented: driver license, state ID, passport, federal employer
            identification number, or other.'
        identificationNumber:
          type: string
          description: Identification number as shown on the document presented.
      required:
      - createdAt
      - updatedAt
      - name
      - ownerType
      - stateCode
      - identificationType
      - identificationNumber
      description: 'The owner of the vehicle named on a vehicle title and registration application: an
        individual or a business.'
    Lienholder:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        name:
          type: string
          description: Exact name of the lienholder as it should print on the title.
        email:
          type:
          - string
          - 'null'
          description: Email address.
        phone:
          type:
          - string
          - 'null'
          description: Phone number.
        postalAddressAsFullText:
          type:
          - string
          - 'null'
          description: Lienholder mailing address as a single text block.
        stateCode:
          type: string
          maxLength: 2
          description: Two-letter code of the lienholder's state.
        postcode:
          type:
          - string
          - 'null'
          description: ZIP code.
        electronicLienIdentifier:
          type: string
          description: Identifier the state assigns for electronic lien and title participation; empty
            when none.
      required:
      - createdAt
      - updatedAt
      - name
      - stateCode
      - electronicLienIdentifier
      description: 'The lienholder: the bank, credit union, or finance company holding a security interest
        in the vehicle.'
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
          description: A URI identifying the problem type
        title:
          type: string
          description: A short summary of the problem type
        status:
          type: integer
          description: The HTTP status code
        detail:
          type: string
          description: An explanation of this occurrence
        instance:
          type: string
          description: A URI identifying this occurrence
        code:
          type: string
          description: A short machine-readable reason
        errors:
          type: object
          description: Per-field detail, when validation failed
      required:
      - type
      - title
      - status
    VehicleTitleApplication:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        applicantId:
          type: string
          format: uuid
          description: Foreign key to the owner (applicant).
        lienholderId:
          type:
          - string
          - 'null'
          format: uuid
          description: Foreign key to the lienholder; null when there is no lien.
        state:
          type: string
          maxLength: 2
          description: Two-letter code of the state that will issue the title.
        transactionType:
          type: string
          enum:
          - title-and-registration
          - title-only
          - registration-only
          - ''
          description: 'Transaction type: title and registration, title only, or registration only.'
        vehicleCondition:
          type: string
          enum:
          - new
          - used
          - ''
          description: Whether the vehicle is new (never titled) or used.
        acquisitionMethod:
          type: string
          enum:
          - dealer-purchase
          - private-purchase
          - gift
          - inheritance
          - other
          - ''
          description: How the vehicle was acquired.
        outOfStateTransfer:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the vehicle was last titled in another state (yes/no).
        previousState:
          type: string
          maxLength: 2
          description: Two-letter code of the state that last titled the vehicle.
        acquisitionDate:
          type:
          - string
          - 'null'
          format: date
          description: Date of sale, gift, or inheritance; most states set a deadline from this date.
        applicationDate:
          type:
          - string
          - 'null'
          format: date
          description: Date of the application.
        ownerName:
          type: string
          description: Owner full legal name as entered on the application.
        coOwnerName:
          type: string
          description: Co-owner full legal name, if any.
        coOwnerConjunction:
          type: string
          enum:
          - and
          - or
          - ''
          description: AND (both owners must sign to sell) or OR (either may sign) between the owners.
        ownerType:
          type: string
          enum:
          - individual
          - business
          - ''
          description: 'Owner type: individual or business.'
        identificationType:
          type: string
          enum:
          - drivers-license
          - state-id
          - passport
          - fein
          - other
          - ''
          description: Identification type presented by the owner.
        identificationNumber:
          type: string
          description: Identification number presented by the owner.
        mailingAddress:
          type: string
          description: Owner mailing address as a single text block.
        ownerSigned:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the owner has signed the application (yes/no).
        coOwnerSigned:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the co-owner has signed the application (yes/no).
        vin:
          type: string
          maxLength: 40
          description: Vehicle identification number as entered; validated against 49 CFR 565.15.
        modelYear:
          type:
          - integer
          - 'null'
          format: int32
          description: Model year of the vehicle.
        make:
          type: string
          description: Vehicle make.
        model:
          type: string
          description: Vehicle model.
        bodyType:
          type: string
          description: Vehicle body type, e.g. 4-door sedan.
        vehicleClass:
          type: string
          enum:
          - passenger
          - light-truck
          - heavy-truck
          - motorcycle
          - trailer
          - motorhome
          - ''
          description: 'Vehicle class: passenger car, light truck or SUV, heavy truck, motorcycle, trailer,
            or motorhome.'
        fuelType:
          type: string
          enum:
          - gasoline
          - diesel
          - electric
          - hybrid
          - other
          - ''
          description: Fuel type; electric and hybrid vehicles are treated differently for emissions and
            some fees.
        gvwrLbs:
          type:
          - integer
          - 'null'
          format: int32
          description: Gross vehicle weight rating in pounds; over 16,000 exempts the odometer disclosure.
        color:
          type: string
          description: Vehicle color.
        odometerReading:
          type:
          - integer
          - 'null'
          format: int32
          description: Odometer reading in whole miles.
        odometerStatus:
          type: string
          enum:
          - actual
          - exceeds-mechanical-limits
          - not-actual
          - ''
          description: 'Odometer status: actual mileage, exceeds mechanical limits, or not the actual
            mileage.'
        sellerOdometerStatement:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the seller signed the odometer disclosure statement (yes/no).
        buyerOdometerAcknowledged:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the buyer acknowledged the odometer disclosure (yes/no).
        titleDocument:
          type: string
          enum:
          - state-title
          - manufacturer-statement-of-origin
          - out-of-state-title
          - none
          - ''
          description: 'Title document held: state title, manufacturer''s statement of origin, out-of-state
            title, or none.'
        priorTitleSurrendered:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the prior title is surrendered with the application (yes/no).
        titleBrand:
          type: string
          enum:
          - none
          - salvage
          - junk
          - rebuilt
          - flood
          - odometer-not-actual
          - lemon-law-buyback
          - hail
          - other
          - ''
          description: 'Title brand: none, salvage, junk, rebuilt, flood, odometer not actual, lemon-law
            buyback, hail, or other.'
        brandDisclosed:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the brand is disclosed on the application and to the buyer (yes/no).
        nmvtisCheck:
          type: string
          enum:
          - clear
          - brand-or-theft-found
          - not-checked
          - ''
          description: Result of the National Motor Vehicle Title Information System check.
        brandInspection:
          type: string
          enum:
          - passed
          - not-done
          - not-applicable
          - ''
          description: Rebuilt-vehicle inspection status.
        lienStatus:
          type: string
          enum:
          - none
          - new-lien
          - existing-lien-released
          - existing-lien-unreleased
          - ''
          description: 'Lien status: none, new lien, existing lien released, or existing lien not released.'
        lienholderName:
          type: string
          description: Lienholder name as entered on the application.
        lienElectronic:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the lien is held electronically (yes/no).
        insuranceProof:
          type: string
          enum:
          - provided
          - not-provided
          - ''
          description: Whether proof of insurance is provided.
        insuranceExpiryDate:
          type:
          - string
          - 'null'
          format: date
          description: Insurance policy expiry date.
        emissionsInspection:
          type: string
