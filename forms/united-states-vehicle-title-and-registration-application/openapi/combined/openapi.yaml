    VehicleTitleApplicationGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key UUID, auto-generated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the row was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the row was most recently updated.
        vehicleTitleApplicationId:
          type: string
          format: uuid
          description: Foreign key to the parent application (unique, 1:1).
        applicationClass:
          type: string
          enum:
          - ready-to-submit
          - incomplete
          - title-brand-or-lien-issue
          - ''
          description: 'Application class: ready-to-submit, incomplete, or title-brand-or-lien-issue (the
            issue class takes precedence).'
        vinStatus:
          type: string
          enum:
          - valid
          - not-standardized
          - invalid-length
          - invalid-characters
          - check-digit-mismatch
          - ''
          description: 'VIN validity per 49 CFR 565.15: valid, not-standardized (pre-1981), invalid-length,
            invalid-characters, or check-digit-mismatch; empty when no VIN.'
        odometerDisclosureRequired:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether a federal odometer disclosure is required (no when exempt under 49 CFR
            580.17).
        brandOrLienIssue:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether a title brand, NMVTIS alert, unreleased lien, or not-actual odometer disclosure
            is present.
        outstandingItemCount:
          type: integer
          format: int32
          description: Number of items still missing before the application can be submitted.
        stateRuleKnown:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
          description: Whether the state is in the encoded rule table (no means the uniform default applied).
        gradedAt:
          type: string
          format: date-time
          description: Timestamp when the engine last computed the classification.
      required:
      - createdAt
      - updatedAt
      - vehicleTitleApplicationId
      - applicationClass
      - vinStatus
      - odometerDisclosureRequired
      - brandOrLienIssue
      - outstandingItemCount
      - stateRuleKnown
      - gradedAt
      description: 'Computed completeness and eligibility result for a vehicle title and registration
        application: application class, VIN status, odometer-disclosure requirement, brand-or-lien issue,
        and outstanding-item count.'
