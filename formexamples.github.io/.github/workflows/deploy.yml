name: Deploy formexamples.com

# This file is inert inside the form-examples monorepo (GitHub only reads
# .github/workflows/ at a repo's root). It exists here so that once
# bin/publish-github-pages-subtree exports this subproject's tree to the
# sibling FormExamples/formexamples.github.io repo (see
# spec/monorepo-github-pages/), this becomes THAT repo's real, root-level
# deploy workflow.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - run: npm ci

      - run: npm run check

      - run: npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
