name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual full-fleet run (the changes job treats it like the nightly).
  workflow_dispatch:
  schedule:
    # Nightly full sweep (E2E + heavy matrices). 03:17 UTC.
    - cron: '17 3 * * *'
    # Weekly supply-chain advisories sweep (Mondays 05:17 UTC): cargo deny
    # re-runs against a fresh advisory DB even when nothing was pushed.
    - cron: '17 5 * * 1'

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decide how much of the fleet the heavy Rust/Svelte matrices must cover.
  # A push or PR that touches only forms/<slug>/… paths tests just those
  # forms; anything cross-cutting (bin/, AGENTS/, e2e/, workflows, root
  # files) — or the nightly schedule — tests all 355. The full fleet always
  # runs nightly, so per-push filtering can narrow coverage by at most one
  # day.
  changes:
    name: Changed-forms detection
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule' || github.event.schedule != '17 5 * * 1'
    outputs:
      all: ${{ steps.detect.outputs.all }}
      forms: ${{ steps.detect.outputs.forms }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "all=true" >> "$GITHUB_OUTPUT"; echo "forms=" >> "$GITHUB_OUTPUT"
            echo "full fleet: ${{ github.event_name }}"; exit 0
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          # Unknown/garbage base (force push, new branch) => full fleet.
          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then
            echo "all=true" >> "$GITHUB_OUTPUT"; echo "forms=" >> "$GITHUB_OUTPUT"
            echo "full fleet: no usable base commit"; exit 0
          fi
          files=$(git diff --name-only "$base"...HEAD)
          if echo "$files" | grep -qv '^forms/[^/]*/'; then
            echo "all=true" >> "$GITHUB_OUTPUT"; echo "forms=" >> "$GITHUB_OUTPUT"
            echo "full fleet: cross-cutting paths changed"; exit 0
          fi
          forms=$(echo "$files" | sed -n 's|^forms/\([^/]*\)/.*|\1|p' | sort -u | tr '\n' ' ')
          echo "all=false" >> "$GITHUB_OUTPUT"
          echo "forms=$forms" >> "$GITHUB_OUTPUT"
          echo "changed forms: $forms"

  structure:
    name: Structure validation
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule' || github.event.schedule != '17 5 * * 1'
    steps:
      - uses: actions/checkout@v4
      - name: Run bin/test
        run: bin/test

  drift:
    name: Drift detectors (generators + Lily contracts)
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule' || github.event.schedule != '17 5 * * 1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install xmllint
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils

      # Regenerate every derived artefact, then fail if anything changed.
      - name: Regenerate generated artefacts
        run: |
          python3 bin/generate-forms-tsv.py
          python3 bin/generate-tools-doc.py
          python3 bin/sql/generate-sql-combined.py
          python3 bin/xml-representations/generate-xml-representations.py
          python3 bin/fhir-r5/generate-fhir-r5-representations.py
          python3 bin/protobuf/generate-protobuf-representations.py
          python3 bin/openapi/generate-openapi-representations.py
          python3 bin/openapi/generate-openapi-combined.py
          python3 bin/back-end-with-loco/generate-back-end-with-loco-setup.py

      - name: Combined OpenAPI spec is current
        run: python3 bin/openapi/generate-openapi-combined.py --check

      - name: Loco setup scripts are current
        run: python3 bin/back-end-with-loco/generate-back-end-with-loco-setup.py --check

      - name: forms.tsv is current
        run: python3 bin/generate-forms-tsv.py --check

      - name: docs/tools.md is current
        run: python3 bin/generate-tools-doc.py --check

      - name: Per-form llms.txt is current
        run: python3 bin/generate-llms-txt.py --check

      - name: Per-form spec/ present
        run: python3 bin/generate-spec.py --check

      - name: CHANGELOG + examples are current
        run: python3 bin/generate-changelog-and-examples.py --check

      - name: Examples conform to SQL schema
        run: bin/test-examples-conformance

      - name: Tutorials reference only existing tools/paths
        run: bin/test-tutorials

      - name: HTML scoring engines load and run headless
        run: bin/test-engines

      - name: Every Loco crate exposes its domain API
        run: bin/test-loco-routes

      - name: Back-end AGENTS.md are not stale
        run: test -z "$(bin/back-end-with-loco/generate-loco-agents.py --list-stale)"

      - name: Authored personas match engine output
        run: bin/test-personas

      - name: Lily HTML contract has no drift
        run: bin/lily-html-refactor --check --all

      - name: Lily Svelte contract has no drift
        run: bin/lily-svelte-refactor --check --all

      # bin/lily-sync --check and bin/lily-svelte-sync --check compare the
      # vendored forms/lily-spec snapshots against a LOCAL checkout of the Lily
      # upstream repo (~/git/lilydesignsystem/…), which is not available in CI.
      # They are a maintainer-run "has upstream changed?" check, not a
      # repo-internal invariant, so they are intentionally not run here.

      - name: Loco background-queue + observability has no drift
        run: bin/loco-config-refactor --check --all

      - name: Every Loco crate root forbids unsafe code
        run: bin/loco-forbid-unsafe --check --all

      - name: Loco migrations mirror sql/ column defaults
        run: bin/loco-migration-defaults --check --all

      - name: Loco migration/entity/controller nullability matches sql/
        run: bin/loco-migration-nullability --check --all

      - name: No Loco crate is still on loco-rs 0.16
        run: bin/loco-rs-1-migration --check --all

      - name: Loco deny.toml files are current
        run: python3 bin/generate-loco-deny-config.py --check

      - name: HTML front-ends are ES modules
        run: bin/es-modules-refactor --check --all

      - name: HTML page headers use the title-left/controls-right layout
        run: bin/page-header-layout-refactor --check

      - name: HTML helper controls carry the *-picker names
        run: bin/html-helpers-picker-rename --check

      - name: HTML date-time-picker is vendored everywhere
        run: bin/html-date-time-picker-vendor --check

      - name: Svelte themesUrl sv-migrate fix holds
        run: python3 bin/svelte-kit-3-theme-url-fix.py --check

      # bin/svelte-helpers-picker-rename --check, bin/svelte-theme-css-sync
      # --check, bin/svelte-date-time-picker-vendor --check, and
      # bin/html-theme-locale-select-refactor --check read component/theme
      # source fresh from the LOCAL Lily checkout (like the lily-sync pair
      # above) and so cannot run here. Their CI-checkable half — every form
      # carries byte-identical copies of the vendored assets — is proven by
      # the step below; upstream currency stays a maintainer-run check,
      # guarded locally by bin/lib/lily_pin.py.
      - name: Vendored theme catalogues + Svelte helpers are fleet-uniform
        run: bin/test-vendored-uniformity

      - name: Validate XML against DTDs
        run: |
          failed=0
          for xml in forms/*/xml/*.xml; do
            xmllint --valid --noout "$xml" 2>&1 || failed=$((failed + 1))
          done
          if [ "$failed" -gt 0 ]; then
            echo "::error::$failed XML files failed DTD validation"
            exit 1
          fi

      - name: Validate generated Protocol Buffers
        run: |
          sudo apt-get install -y protobuf-compiler
          bad=0
          for p in forms/*/protobuf/*.proto; do
            protoc --proto_path="$(dirname "$p")" --descriptor_set_out=/dev/null \
              "$(basename "$p")" || bad=$((bad + 1))
          done
          if [ "$bad" -gt 0 ]; then
            echo "::error::$bad .proto files failed to compile"
            exit 1
          fi

      - name: Validate generated OpenAPI 3.1 specs
        run: |
          pip install --quiet openapi-spec-validator
          python3 - <<'PY'
          import glob, sys
          from openapi_spec_validator import validate
          from openapi_spec_validator.readers import read_from_filename
          bad = []
          for f in sorted(glob.glob("forms/*/openapi/**/*.yaml", recursive=True)):
              try:
                  spec, _ = read_from_filename(f)
                  validate(spec)
              except Exception as e:
                  bad.append(f"{f}: {str(e).splitlines()[0]}")
          if bad:
              print("::error::%d invalid OpenAPI specs" % len(bad))
              for b in bad:
                  print("  " + b)
              sys.exit(1)
          print("all OpenAPI specs valid")
          PY

      - name: Fail if any generator produced an uncommitted diff
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Generated output differs from committed files. Run the generators locally and commit."
            git status --short
            git --no-pager diff
            exit 1
          fi

  sql-apply:
    name: SQL apply gate
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule' || github.event.schedule != '17 5 * * 1'
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: loco
          POSTGRES_PASSWORD: loco
          POSTGRES_DB: loco
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U loco"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: loco
      PGPASSWORD: loco
    steps:
      - uses: actions/checkout@v4
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply every form's migrations to a fresh scratch DB
        run: bin/test-sql-apply

  fhir:
    name: FHIR R5 validation
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule' || github.event.schedule != '17 5 * * 1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Cache FHIR validator
        id: cache-validator
        uses: actions/cache@v6
        with:
          path: ~/validator_cli.jar
          key: fhir-validator-6.3.11
      - name: Download official HL7 FHIR validator
        if: steps.cache-validator.outputs.cache-hit != 'true'
        run: |
          curl -sSL -o ~/validator_cli.jar \
            https://github.com/hapifhir/org.hl7.fhir.core/releases/download/6.3.11/validator_cli.jar
      - name: Validate generated FHIR R5 resources and example Bundles
        run: |
          # Validate against FHIR R5 (4.0 → 5.0). Collect every generated
          # resource and every example Bundle; the validator batches them.
          files=$(find forms/*/fhir/r5 -name '*.json' 2>/dev/null; \
                  find forms/*/examples -name '*bundle*.json' 2>/dev/null)
          if [ -z "$files" ]; then
            echo "::error::no FHIR JSON found to validate"
            exit 1
          fi
          # shellcheck disable=SC2086
          java -jar ~/validator_cli.jar $files -version 5.0 -level errors

  rust:
    name: Rust (shard ${{ matrix.shard }}/8)
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule' || github.event.schedule != '17 5 * * 1'
    needs: [changes]
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: loco
          POSTGRES_PASSWORD: loco
          POSTGRES_DB: loco
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U loco"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Loco test config reads DATABASE_URL; each crate boots its own DB
      # (created per crate below) and auto-migrates on boot_test.
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: loco
      PGPASSWORD: loco
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: loco-shard-${{ matrix.shard }}
          workspaces: forms/*/back-end-with-loco
      # Plain cargo (no --locked): lock hygiene is not maintained across all
      # 347 crates, matching the repo's own bin/test-loco-project.
      - name: check / clippy / deny / test each crate in this shard
        run: |
          fail=0
          CHANGED="${{ needs.changes.outputs.forms }}"
          ALL="${{ needs.changes.outputs.all }}"
          for slug in $(bin/forms-shard ${{ matrix.shard }} 8); do
            if [ "$ALL" != "true" ]; then
              case " $CHANGED " in *" $slug "*) ;; *) continue ;; esac
            fi
            crate="forms/$slug/back-end-with-loco"
            [ -f "$crate/Cargo.toml" ] || continue
            snake=$(printf '%s' "$slug" | tr '-' '_')
            db="${snake}_test"
            echo "::group::$slug"
            createdb "$db" 2>/dev/null || true
            ( cd "$crate" \
              && DATABASE_URL="postgres://loco:loco@localhost:5432/$db" \
                 cargo check --all-targets \
              && DATABASE_URL="postgres://loco:loco@localhost:5432/$db" \
                 cargo clippy --all-targets -- -D warnings \
              && cargo deny --all-features check \
              && DATABASE_URL="postgres://loco:loco@localhost:5432/$db" \
                 cargo test ) || { echo "::error::$slug failed"; fail=1; }
            dropdb --if-exists "$db" 2>/dev/null || true
            echo "::endgroup::"
          done
          exit $fail

  svelte:
    name: Svelte (shard ${{ matrix.shard }}/8)
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule' || github.event.schedule != '17 5 * * 1'
    needs: [changes]
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: forms/*/front-end-with-svelte/package-lock.json
      - name: check / build / vitest each front-end in this shard
        run: |
          fail=0
          CHANGED="${{ needs.changes.outputs.forms }}"
          ALL="${{ needs.changes.outputs.all }}"
          for slug in $(bin/forms-shard ${{ matrix.shard }} 8); do
            if [ "$ALL" != "true" ]; then
              case " $CHANGED " in *" $slug "*) ;; *) continue ;; esac
            fi
            app="forms/$slug/front-end-with-svelte"
            [ -f "$app/package.json" ] || continue
            echo "::group::$slug"
            ( cd "$app" \
              && npm ci --no-audit --no-fund \
              && npm run check \
              && npm run build \
              && npx vitest run ) || { echo "::error::$slug failed"; fail=1; }
            echo "::endgroup::"
          done
          exit $fail

  # New RUSTSEC advisories land without any push to this repo; the per-push
  # cargo deny run only re-checks when code moves. This weekly pass re-runs
  # the advisories check over every crate's committed lockfile (no
  # compilation) so a quiet repo still hears about a newly-published CVE.
  advisories:
    name: Supply-chain advisories (weekly)
    if: github.event_name == 'schedule' && github.event.schedule == '17 5 * * 1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: cargo deny advisories over every crate's lockfile
        run: |
          fail=0
          for slug in $(bin/forms-as-kebab-case); do
            crate="forms/$slug/back-end-with-loco"
            [ -f "$crate/Cargo.lock" ] || continue
            ( cd "$crate" && cargo deny --all-features check advisories -s ) \
              || { echo "::error::$slug has advisory findings"; fail=1; }
          done
          exit $fail

  e2e:
    name: End-to-end sweep (nightly)
    if: github.event_name == 'schedule' && github.event.schedule != '17 5 * * 1'
    runs-on: ubuntu-latest
    needs: [structure]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install E2E harness deps
        working-directory: e2e
        run: npm ci --no-audit --no-fund
      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: Run the full E2E + accessibility sweep
        run: bin/test-e2e --all
